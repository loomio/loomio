---
navigation_title: Presentare Loomio al tuo consiglio direttivo
blocks:
  2d7d9e9285159d4f:
    english: "# Introducing Loomio to your board"
    translation: "# Presentare Loomio al tuo consiglio direttivo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6a42b6e2aba774c1:
    english: Loomio can become the online place where your board or committee meet, discuss, decide and build an auditable record for your organization.
    translation: Loomio può diventare lo spazio online in cui il tuo consiglio direttivo o comitato si riunisce, discute, prende decisioni e conserva una documentazione verificabile delle attività dell'organizzazione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1e26a40fe8b74f47:
    english: Start with the general sequence in [Introducing Loomio to your group](/en/user_manual/overview/introducing_loomio). This page adds considerations specific to boards and committees.
    translation: Inizia dal percorso generale descritto in [Presentare Loomio al tuo gruppo](/en/user_manual/overview/introducing_loomio). Questa pagina aggiunge indicazioni specifiche per consigli direttivi e comitati.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2999c11b8e274b1b:
    english: However Loomio will be of little value if only some of your board participate.  Information and communication will likely remain scattered over multiple tools, lost in email inboxes and the confusion will waste everyone's time.
    translation: Loomio sarà poco utile se partecipa solo una parte del consiglio direttivo. Informazioni e comunicazioni resteranno probabilmente sparse tra vari strumenti e caselle email, causando confusione e facendo perdere tempo a tutti.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  28097dbe6dfd2fd7:
    english: 'Consider the problem you are trying to solve by using Loomio, say to improve and track communication or build institutional memory.  Then commit as a board to move your work into Loomio, and encourage everyone to make a genuine effort.  '
    translation: Pensa al problema che vuoi risolvere con Loomio, per esempio migliorare e seguire le comunicazioni o conservare la memoria dell'organizzazione. Poi concordate come consiglio direttivo di trasferire il vostro lavoro su Loomio e incoraggia tutti a partecipare con impegno.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  449e6d5c90588dd2:
    english: As administrator your primary objective is to set up Loomio effectively for your board.
    translation: Come amministratore, il tuo obiettivo principale è configurare Loomio in modo che il consiglio direttivo possa usarlo efficacemente.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '08969c9eca0d9855':
    english: 'Aim to encourage directors to join and participate. They should be able to:'
    translation: 'Incoraggia i membri del consiglio direttivo a iscriversi e partecipare. Dovrebbero essere in grado di:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  70bf0ec81830055e:
    english: |-
      - Sign in to Loomio
      - Read and comment on threads
      - Vote in polls
      - See how your governance practices work in Loomio
    translation: |-
      - Accedere a Loomio
      - Leggere e commentare le discussioni
      - Votare nei sondaggi
      - Capire come svolgere le attività di governo dell'organizzazione su Loomio
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d41ec118bb86c93f:
    english: "## Check technical proficiency "
    translation: "## Verifica le competenze digitali"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  728e1c8d201cacca:
    english: Board members will need a computer or smartphone connected to the internet. They must be capable of sending and receiving email, browsing the web, reading digital documents, viewing and hearing videos.
    translation: I membri del consiglio direttivo avranno bisogno di un computer o di uno smartphone connesso a Internet. Devono saper inviare e ricevere email, navigare sul web, leggere documenti digitali e guardare video con audio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  de1b1186edaff7c6:
    english: 'Check that members have all of the following:'
    translation: 'Verifica che tutti i membri abbiano:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9932640dbf8944e3:
    english: |-
      - an up-to-date device—a computer, tablet or smart phone with email and a modern internet browser
      - internet service via WIFI, ethernet cable or mobile data plan (3G or above)
      - capability to send and receive email, browse the internet, download documents and play videos.
    translation: |-
      - un dispositivo aggiornato: computer, tablet o smartphone con email e un browser moderno
      - una connessione a Internet tramite Wi-Fi, cavo Ethernet o rete mobile (3G o superiore)
      - la capacità di inviare e ricevere email, navigare su Internet, scaricare documenti e riprodurre video.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4496ce2ee6172b32:
    english: Loomio works with all standard internet browsers such as Google Chrome, Microsoft Edge, Firefox and Apple Safari. Old out-of-date browsers such as Microsoft Internet Explorer may not work.
    translation: Loomio funziona con i browser più comuni, come Google Chrome, Microsoft Edge, Firefox e Apple Safari. I browser obsoleti, come Microsoft Internet Explorer, potrebbero non funzionare.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bd5dc5f2d0f56a28:
    english: If you have a problem using Loomio on your device, [Contact Loomio support](/contact).
    translation: Se hai problemi a usare Loomio sul tuo dispositivo, [contatta l'assistenza di Loomio](/contact).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ca7b25bb2d86ba90:
    english: "## Configure your group"
    translation: "## Configura il tuo gruppo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  92712f3a984128af:
    english: |-
      ### Group Description
      The group description is the first place people see when they arrive into your Loomio group. Write it to help new members  understand the purpose of the group and the work you will do together. Provide any other information that orients people and encourages them to participate.
    translation: |-
      ### Descrizione del gruppo
      La descrizione del gruppo è la prima cosa che le persone vedono quando arrivano nel tuo gruppo Loomio. Scrivila in modo che i nuovi membri capiscano lo scopo del gruppo e il lavoro che farete insieme. Aggiungi altre informazioni utili per orientarsi e partecipare.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7e018e436df9afa1:
    english: 'For example, welcome people and let them know that this is there online space for communication and governance of your organization:'
    translation: 'Per esempio, dai il benvenuto alle persone e spiega che questo è il loro spazio online per comunicare e governare l''organizzazione:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  826a76aa71e6d689:
    english: |-
      - Remind members of the purpose of the board or committee.
      - Outline how you intend to use Loomio; prepare for meetings, progress discussions, make decisions and stay in context between meetings.
      - Be clear who has access to the group, can read and participate.
      - Attach or link any background or governance documents.
    translation: |-
      - Ricorda ai membri lo scopo del consiglio direttivo o del comitato.
      - Spiega come intendete usare Loomio: preparare le riunioni, portare avanti le discussioni, prendere decisioni e mantenere il filo del lavoro tra una riunione e l'altra.
      - Indica chiaramente chi può accedere al gruppo, leggere i contenuti e partecipare.
      - Allega o inserisci i link ai documenti di riferimento e di governo dell'organizzazione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  00c14924ec3f24cb:
    english: |-
      ### Check privacy and permission settings
      Loomio groups are **Secret** by default, which means only the people you specifically invite to the group know of its existence.
    translation: |-
      ### Controlla le impostazioni di privacy e autorizzazione
      Per impostazione predefinita, i gruppi Loomio sono **Segreto**: solo le persone che inviti al gruppo sanno che esiste.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9158ac7ea9b0db99:
    english: See [member permissions](/en/user_manual/groups/settings#permissions), and set to suit the proficiency of members in your group.  It may help to remove some permissions to avoid confusion as you are starting out. You can always restore permissions and everyone becomes more familiar with Loomio.
    translation: Consulta le [autorizzazioni dei membri](/en/user_manual/groups/settings#permissions) e impostale in base alle competenze dei membri del gruppo. All'inizio può essere utile limitare alcune autorizzazioni per evitare confusione. Potrai ripristinarle quando tutti avranno più familiarità con Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6a139f43ad2871f8:
    english: |-
      ### Category tags
      Add [category tags](/en/user_manual/discussions/tags/) to suit your organization.  Setting these in advance will help everyone use tags and find the threads and info they are looking for.
    translation: |-
      ### Etichette di categoria
      Aggiungi [etichette di categoria](/en/user_manual/discussions/tags/) adatte alla tua organizzazione. Impostarle in anticipo aiuterà tutti a usarle e a trovare le discussioni e le informazioni che cercano.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7435f3589b1f26e3:
    english: |-
      ### Set up your personal profile
      Your [personal profile](/en/user_manual/users/user_profile) will help members of your group easily identify you, and have confidence that the messages they receive from you actually come from you.
    translation: |-
      ### Configura il tuo profilo personale
      Il tuo [profilo personale](/en/user_manual/users/user_profile) aiuterà i membri del gruppo a riconoscerti e a sapere che i messaggi ricevuti provengono da te.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cf3684fe138b05fe:
    english: |-
      ### Manage group membership
      Make sure all the members of your board or committee have been [invited](/en/user_manual/groups/inviting_people/) to the group, and accepted their invitation.
    translation: |-
      ### Gestisci i membri del gruppo
      Assicurati che tutti i membri del consiglio direttivo o del comitato siano stati [invitati](/en/user_manual/groups/inviting_people/) nel gruppo e abbiano accettato l'invito.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '029e18cb13c89e7b':
    english: "### Start with a board process"
    translation: "### Inizia con un'attività del consiglio direttivo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ba8a6193de9c928f:
    english: The general introduction guide explains how to help everyone comment and vote once. For a board, follow that practice with one recurring governance process, such as preparing an agenda, approving minutes, reviewing a report, or making a small out-of-session decision.
    translation: La guida introduttiva generale spiega come aiutare tutti a commentare e votare almeno una volta. Per un consiglio direttivo, prosegui con un'attività ricorrente, come preparare l'ordine del giorno, approvare un verbale, esaminare una relazione o prendere una piccola decisione tra una riunione e l'altra.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f7c156fde7984f49:
    english: Agree whether decisions made in Loomio take effect when their outcome is published or must be ratified at the next meeting. Record the agreed quorum, vote threshold, eligible voters, and ratification process in the group description or governance documents.
    translation: Concordate se le decisioni prese su Loomio entrano in vigore quando viene pubblicata la loro conclusione oppure se devono essere ratificate nella riunione successiva. Riporta il quorum concordato, la soglia di voti necessaria, chi ha diritto di voto e la procedura di ratifica nella descrizione del gruppo o nei documenti di governo dell'organizzazione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
