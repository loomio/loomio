  a858ffdb8df01bed:
    english: |-
      ## Content translation
      When someone in your group writes their message in a language that is different to your preferred language, a "translate" button will appear below the message. You can click this button to automatically translate the message into your preferred language.
    translation: |-
      ## Переклад контенту
      Якщо хтось у вашій групі пише повідомлення іншою мовою, під ним з’являється кнопка «Перекласти». Натисніть її, щоб автоматично перекласти повідомлення вашою бажаною мовою.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
