  cc37217cd681fabe:
    english: The green highlight shows when a candidate was elected, red shows when they were eliminated, and orange shows when they tied.
    translation: Il verde indica quando un candidato è stato eletto, il rosso quando è stato eliminato e l'arancione quando si è verificato un pareggio.
