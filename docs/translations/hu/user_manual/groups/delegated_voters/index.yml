  9cfb3b7835dc5cb0:
    english: If some members of your group should have voting rights while others should not, you can use the "Make delegate" feature to identify those people with voting rights. There is a corresponding "Revoke delegate" action too.
    translation: Ha a csoportod egyes tagjai szavazhatnak, mások pedig nem, a „Legyen küldött” művelettel jelölheted ki a szavazati joggal rendelkező tagokat. A kijelölést a „Meghatalmazott visszavonása” művelettel vonhatod vissza.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e017eafb51368777:
    english: Use delegates when people should share the same discussion space but only a defined set, such as directors or elected representatives, may vote. This is usually simpler than maintaining a second subgroup whose only purpose is to separate voters from non-voters.
    translation: Akkor használj küldötteket, ha mindenki ugyanabban a térben beszélgethet, de csak egy meghatározott kör, például az igazgatók vagy a választott képviselők szavazhatnak. Ez általában egyszerűbb, mint külön alcsoportot fenntartani csak azért, hogy elkülönítsd a szavazókat a többi tagtól.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1942a47ae47ca813:
    english: Use a private subgroup instead when its members also need discussions, files, or membership information that other members must not see.
    translation: Ha a tagoknak olyan beszélgetésekhez, fájlokhoz vagy tagsági adatokhoz is hozzá kell férniük, amelyeket mások nem láthatnak, használj inkább privát alcsoportot.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
