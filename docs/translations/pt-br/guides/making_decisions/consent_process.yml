  3cc3304a15bc3d2f:
    english: In the Consent process, an objection is defined as something that **might cause harm to the team or organization**.
    translation: No processo de consentimento, uma objeção aponta algo que **pode causar danos à equipe ou à organização**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ab509ea088e16a0d:
    english: |-
      Objections should meet this criteria to be valid:
      - Explicit: *I can make a reasoned case*
      - Impersonal: *It's not just a personal preference*
      - Evidenced: *Not predictive, based on experience*
      - Not 'safe to fail': *It's not that I have a 'better idea'*
    translation: |-
      Para serem válidas, as objeções devem atender a estes critérios:
      - Explícitas: *Consigo apresentar uma justificativa fundamentada*
      - Impessoais: *Não se trata apenas de uma preferência pessoal*
      - Baseadas em evidências: *Baseiam-se na experiência, não em previsões*
      - Apontam um risco real: *Não se trata apenas de eu ter uma ‘ideia melhor’*
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
