  3be363e1618c6924:
    english: Use the Loomio API to connect Loomio with other software and automated workflows.
    translation: Використовуйте API Loomio, щоб підключати Loomio до іншого програмного забезпечення та автоматизованих робочих процесів.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3a0a3a45b68cea23:
    english: The [OpenAPI 3.1 contract](openapi.yaml) describes every public User API and Server API operation in a machine-readable format. Import it into an API client or use it to generate typed client code. The guides below explain workflows, permissions, and behavior that are not fully expressed by the contract.
    translation: "[Специфікація OpenAPI 3.1](openapi.yaml) описує всі публічні операції API користувача й API сервера у форматі, придатному для машинного читання. Імпортуйте її в клієнт API або використовуйте для створення клієнтського коду з типами. Наведені нижче посібники пояснюють робочі процеси, дозволи та поведінку, які специфікація описує не повністю."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  19fe420b8b57b3a3:
    english: "## User API"
    translation: "## API користувача"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e08b0799f5a9b271:
    english: The [User API](/en/user_manual/integrations/api/user-api) performs actions as a Loomio user. It can list groups and create or manage threads, comments, polls, and group memberships according to that user's permissions.
    translation: "[API користувача](/en/user_manual/integrations/api/user-api) виконує дії від імені користувача Loomio. Через нього можна переглядати групи, створювати теми, коментарі й опитування та керувати ними й участю в групах відповідно до дозволів користувача."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d212aebc3b500643:
    english: For push-based integrations, [group webhooks](/en/user_manual/integrations/api/user-api#webhooks) send selected Loomio events to a web endpoint as JSON. Use the REST endpoints to read or change Loomio data and a webhook when an integration should receive events without polling.
    translation: Для інтеграцій, які отримують події автоматично, [вебхуки групи](/en/user_manual/integrations/api/user-api#webhooks) надсилають вибрані події Loomio на вебадресу у форматі JSON. Використовуйте кінцеві точки REST, щоб читати або змінювати дані Loomio, а вебхук — щоб інтеграція отримувала події без періодичних запитів.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d6536c749fb8a984:
    english: "## Server API"
    translation: "## API сервера"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  76fbf0c8fa91eeb8:
    english: The [Server API](/en/user_manual/integrations/api/server-api) lets operators of self-hosted Loomio installations manage user accounts. It is authenticated with a server-wide secret.
    translation: "[API сервера](/en/user_manual/integrations/api/server-api) дає операторам самостійно розгорнутих інсталяцій Loomio змогу керувати обліковими записами користувачів. Для автентифікації використовується спільний для сервера секретний ключ."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
