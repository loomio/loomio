navigation_title: Порада
blocks:
  2072a463e55dfba1:
    english: "# Advice"
    translation: "# Порада"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  aadbf3844be4a95f:
    english: An Advice proposal gathers input for a decision that a person or team is responsible for making. Participants can offer advice or indicate that they have no advice to add.
    translation: Пропозиція «Порада» збирає думки щодо рішення, за яке відповідає окрема людина або команда. Учасники можуть дати пораду або зазначити, що їм нічого додати.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  769a2446fc3ec4a9:
    english: This page explains the Advice proposal form, voting, and results. See the [Advice process](/en/guides/making_decisions/advice_process) for the complete workflow from framing the decision to publishing an outcome.
    translation: На цій сторінці описано форму пропозиції «Порада», голосування та результати. Повний порядок роботи — від формулювання рішення до публікації висновку — описано на сторінці [Процес отримання порад](/en/guides/making_decisions/advice_process).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f19e32088d70eec4:
    english: "## When to use Advice"
    translation: "## Коли використовувати «Пораду»"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d4c7e7da6f2d5860:
    english: Use Advice when the decision maker wants input from people with relevant expertise or people affected by the decision. It works well for supplier choices, operational decisions, policy drafts, and decisions within a delegated role.
    translation: Використовуйте «Пораду», коли людина, яка ухвалює рішення, хоче почути думки тих, хто має відповідний досвід або кого це рішення стосується. Вона підходить для вибору постачальника, операційних рішень, проєктів правил і рішень у межах делегованих повноважень.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a81e33e00080fbe4:
    english: Advice is not an approval vote. Say who will make the decision, what constraints apply, and how they will consider the responses.
    translation: "«Порада» не є голосуванням за схвалення. Вкажіть, хто ухвалить рішення, які є обмеження та як ця людина врахує відповіді."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4be7ef0783f6e444:
    english: "## Example: choose a washing supplier"
    translation: "## Приклад: вибір постачальника послуг миття"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d8157e98107798c6:
    english: Oatmilk Cooperative's operations coordinator must select a washing supplier. They invite advice about capacity, food-safety records, water use, service response times, and support.
    translation: Координатор операцій кооперативу Oatmilk має вибрати постачальника послуг миття. Він запрошує учасників поділитися думками про потужність постачальника, дотримання вимог харчової безпеки, використання води, швидкість реагування та підтримку.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9703f1f9474243af:
    english: "## Set up the proposal"
    translation: "## Створіть пропозицію"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6b9c305f0f4000d9:
    english: Describe the decision, name the decision maker, and include the information participants need. Invite people who are affected or have relevant knowledge. The default options let someone offer advice or abstain.
    translation: Опишіть рішення, вкажіть, хто його ухвалить, і додайте інформацію, потрібну учасникам. Запросіть людей, яких стосується рішення або які мають відповідні знання. Стандартні варіанти відповіді дають змогу запропонувати пораду або утриматися.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Голосуйте"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0a259af7a59899b7:
    english: Participants select **Advice** and give a concrete recommendation, risk, question, or relevant experience. They can abstain when they have no useful input.
    translation: Учасники вибирають **Порада** й надають конкретну рекомендацію, описують ризик, ставлять запитання або діляться відповідним досвідом. Якщо їм нічого корисного додати, вони можуть утриматися.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Перегляньте результати"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1d4bf7b5d0079f87:
    english: The chart confirms who has responded, but the reasons contain the substance of an Advice proposal. Look for constraints, agreements, and conflicting recommendations rather than treating the most common response as the decision.
    translation: Діаграма показує, хто відповів, але суть пропозиції «Порада» міститься в поясненнях. Звертайте увагу на обмеження, спільні позиції та суперечливі рекомендації. Найпоширеніша відповідь сама по собі не визначає рішення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e9fc01ce6c059f29:
    english: The decision maker publishes an outcome explaining what they decided and how the advice informed it.
    translation: Людина, яка ухвалює рішення, публікує висновок і пояснює, що вирішила та як врахувала поради.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
