[book]
authors = ["Robert Guthrie"]
language = "en"
src = "."
title = "Loomio Help"

[build]
build-dir = "book"

[preprocessor.changelog]
command = "node preprocessors/changelog.js"
renderers = ["html"]

[output.html]
mathjax-support = true
additional-css = ["theme/css/custom.css"]
no-section-label = true
sidebar-header-nav = false
edit-url-template = "https://github.com/loomio/loomio/edit/master/docs/{path}"
site-url = "/en/user_manual/"

[output.html.redirect]
"/user_manual/users/sign_in/index.html" = "/en/user_manual/overview/orientation.html"
"/user_manual/threads/index.html" = "/en/user_manual/discussions/index.html"
