  7069de909d719ef2:
    english: Build consensus for a decision you need to make together, to reach an agreement that satisfies the needs and concerns of all participants.
    translation: Costruisci il consenso su una decisione da prendere insieme, fino a trovare un accordo che tenga conto delle esigenze e delle preoccupazioni di tutte le persone partecipanti.
