    translated_on: '2026-09-29'
  74caca2261c15283:
    english: 'Loomio has three main parts: groups, discussions, and polls.'
    translation: 'Loomiossa on kolme pääosaa: ryhmät, keskustelut ja kyselyt.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5f0a46926a0f7350:
    english: "### Groups"
    translation: "### Ryhmät"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2060a64d0fabc6d7:
    english: A group is a place for an organization, team, or community to work together. Its home page explains the group's purpose and provides access to its discussions, polls, members, and files.
    translation: Ryhmä on paikka, jossa organisaatio, tiimi tai yhteisö voi tehdä yhteistyötä. Ryhmän etusivu kertoo sen tarkoituksesta ja tarjoaa pääsyn keskusteluihin, kyselyihin, jäseniin ja tiedostoihin.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  311793a17709182c:
    english: "### Discussions"
    translation: "### Keskustelut"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  05ecdffe6c18a1df:
    english: Discussions keep the information and conversation about a topic together. People can share context, comment, reply, react, and use polls to move the discussion towards an outcome.
    translation: Keskustelu kokoaa yhteen aiheeseen liittyvät tiedot ja viestit. Osallistujat voivat jakaa taustatietoa, kommentoida, vastata ja reagoida. Kyselyiden avulla keskustelu voi edetä kohti lopputulosta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dc9a50d7f1f20c80:
    english: Over time, discussions create a searchable record of the information considered and the decisions made by your group.
    translation: Ajan mittaan keskusteluista muodostuu haettava arkisto tiedoista, joita ryhmäsi on käsitellyt, ja päätöksistä, joita se on tehnyt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3448194e8a2ce09d:
    english: "### Polls and proposals"
    translation: "### Kyselyt ja ehdotukset"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4ef7092f5f56e773:
    english: Polls help a group understand preferences, gather advice, and make decisions. Different poll templates support different processes. A proposal asks people to respond to a suggested course of action and explain the reason for their response.
    translation: Kyselyt auttavat ryhmää selvittämään mielipiteitä, pyytämään neuvoja ja tekemään päätöksiä. Eri kyselymallit tukevat erilaisia päätöksentekotapoja. Ehdotuksessa osallistujia pyydetään ottamaan kantaa esitettyyn toimintatapaan ja perustelemaan vastauksensa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  51ab039bc7c374bd:
    english: Polls can be part of a discussion or run independently from the **Polls** tab on a group page.
    translation: Kysely voi olla osa keskustelua. Voit myös aloittaa erillisen kyselyn ryhmän sivun **Äänestykset**-välilehdeltä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  47500e7125fdedbc:
    english: To learn where these parts appear in the interface, see the [Quick tour](/en/user_manual/overview/orientation). To start contributing, see [How to participate](/en/user_manual/overview/how-to-participate).
    translation: Katso [Pikakierroksesta](/en/user_manual/overview/orientation), missä nämä osat näkyvät käyttöliittymässä. Jos haluat osallistua, lue [Osallistumisohjeet](/en/user_manual/overview/how-to-participate).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
