    english: Group settings control how your group is presented, who can find and join it, and what members are allowed to do. Only group administrators can edit these settings.
    translation: Met de groepsinstellingen bepaal je hoe jouw groep wordt weergegeven, wie de groep kan vinden en lid kan worden, en wat leden mogen doen. Alleen groepsbeheerders kunnen deze instellingen bewerken.
