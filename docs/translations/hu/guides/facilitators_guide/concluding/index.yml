---
navigation_title: Lezárás
blocks:
  b2d8fb17fce5a4a3:
    english: "# Concluding"
    translation: "# Lezárás"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4e03229937f959ed:
    english: "## Outcomes & Next Steps"
    translation: "## Következtetések és következő lépések"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  eaf0fe98db301c7f:
    english: 'Confirming the outcome can be critical to feel like the goals of a collaborative discussion have been achieved. A facilitator can pull together what’s been decided and reflect it back, to help the group walk away with the answers to some key questions:'
    translation: 'A következtetés megerősítése segíthet abban, hogy a csoport tagjai lássák: a közös beszélgetés elérte a célját. A facilitátor összefoglalhatja a döntéseket, és visszajelezheti őket a csoportnak. Így mindenki választ kaphat néhány fontos kérdésre:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  00ed94f662c9643a:
    english: |-
      * What did we do?
      * What does it mean?
      * What will happen now?
      * What is my responsibility?
      * What will be different because we went through this experience?
    translation: |-
      * Mit tettünk?
      * Mit jelent ez?
      * Mi történik most?
      * Mi az én feladatom?
      * Mi változik azért, mert részt vettünk ebben a folyamatban?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0f9ecf512b4990b7:
    english: Sometimes the answers to these questions are very concrete, such as action points, while other times they are more abstract, such as deepening shared understanding.
    translation: Ezekre a kérdésekre néha konkrét válaszok születnek, például elvégzendő feladatok. Máskor a válasz elvontabb, például a közös megértés elmélyülése.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aabfa9d842af2688:
    english: On Loomio
    translation: A Loomióban
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a63bbb12b1a1e04c:
    english: |-
      * [Outcomes](/en/user_manual/polls/outcomes/) are a very important tool. A proposal ending is not quite the end: there’s a need to sum up conclusively. That's what the outcome feature is for.
      * Many Loomio discussions come to a natural end without even using proposals or publishing outcomes. These discussions still provide a lot of value, and it can be helpful to update the context box with an outcome summary for later reference.
      * If specific people have action points, you can @mention their names and they will be notified.
    translation: |-
      * A [következtetések](/en/user_manual/polls/outcomes/) fontos eszközök. Egy javaslat lezárása még nem zárja le a folyamatot: a döntést is össze kell foglalni. Erre szolgál a következtetés funkció.
      * Sok Loomio-beszélgetés javaslat vagy közzétett következtetés nélkül ér természetes véget. Ezek a beszélgetések is értékesek. A későbbi tájékozódáshoz hasznos lehet a leírásban összefoglalni, mire jutott a csoport.
      * Ha egyes embereknek feladatuk van, @megemlítheted őket név szerint. Erről értesítést kapnak.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  55a9b345194f80d6:
    english: "## Reporting & Harvesting"
    translation: "## Beszámolás és a tanulságok összegyűjtése"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fc6ee28887dd5ab1:
    english: To understand the meaning of an experience, you have to inquire into how it fits into the bigger context. What was this moment, in the bigger rhythm of our progress? What form will our understanding from this experience take — a story, a report, a change, a call to action?
    translation: 'Egy tapasztalat jelentését akkor értheted meg, ha a tágabb összefüggéseket is megvizsgálod. Hol volt ennek a pillanatnak a helye a közös munkában? Milyen formában adjátok tovább a tanulságokat: történetként, beszámolóként, változtatásként vagy cselekvésre szóló felhívásként?'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  eb2cdc1c6526e053:
    english: The experience happens in the moment, but its impact often comes from putting handles on it, giving it a name, and being able to use it and refer to it. Otherwise you risk forgetting, leaving people out who weren't there, or having to repeat it later. Productive collaboration is often helped by tangible documentation or reporting.
    translation: A tapasztalat egy adott pillanatban születik, de a hatása gyakran attól függ, hogy nevet adtok neki, rögzítitek, és később is hivatkozni tudtok rá. Enélkül feledésbe merülhet, kimaradhatnak belőle azok, akik nem voltak jelen, vagy újra végig kell mennetek ugyanazon. A kézzelfogható dokumentáció és a beszámolók segítik a közös munkát.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4104d8b917a87b0e:
    english: |-
      * Loomio is self-documenting — notes write themselves as an integrated part of the process. This creates a gold-mine of archival content for groups, without any extra effort.
      * We have some features to support harvesting and archiving: the search function, the “previous decisions” list, and the print discussion option.
      * Premium plans offer the option to export all your group's Loomio data.
      * Many groups use Loomio to integrate content from various channels. For example, posting a meeting announcement and building the agenda on Loomio, having the meeting in person, posting the notes back on Loomio, and making related decisions in the same thread. This expands the “self-harvesting” ability of Loomio beyond the online space.
    translation: |-
      * A Loomio a folyamat részeként dokumentálja a munkát: a bejegyzésekből külön ráfordítás nélkül alakul ki a csoport számára később is használható archívum.
      * A tanulságok összegyűjtését és megőrzését több funkció segíti: a keresés, a korábbi döntések listája és a beszélgetés nyomtatása.
      * A prémium csomagokban a csoport összes Loomio-adatát exportálhatod.
      * Sok csoport a Loomióban gyűjti össze a különböző csatornákon keletkező tartalmakat. Például közzéteszik egy találkozó meghívóját, összeállítják a napirendet, személyesen megtartják a találkozót, majd a jegyzeteket és a kapcsolódó döntéseket ugyanabban a témában rögzítik. Így a Loomio a személyes találkozók tanulságainak megőrzésében is segít.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dae98cfd5f14b034:
    english: "## Turning Discussion into Action"
    translation: "## A beszélgetéstől a cselekvésig"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a39a66938d6cadb0:
    english: There comes a moment when you have to re-engage with the reality outside the room. Occasionally, the need is simply to work with ideas and feelings, without worrying about implementation. But usually a group will not reach its goals without applying its conclusions to real-world action. This transition is part of the total facilitated experience.
    translation: Eljön a pillanat, amikor a megbeszélteknek a csoporton kívüli valóságban is működniük kell. Néha elég az ötletekkel és érzésekkel foglalkozni, megvalósítás nélkül. A csoport azonban többnyire csak akkor éri el a célját, ha a következtetéseit tettekre váltja. Ez az átmenet is a facilitált folyamat része.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3e26f1939ffe69fe:
    english: 'It’s at this point that a collaborative process intersects with other organizational systems, and the facilitator has to help figure out how it will work. These other systems might include:'
    translation: 'Ezen a ponton a közös folyamat más szervezeti rendszerekkel találkozik. A facilitátornak segítenie kell tisztázni, hogyan kapcsolódnak egymáshoz. Ilyen rendszerek lehetnek:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cb030c5876714643:
    english: |-
      * **Power** — Who actually makes decisions? What has to happen for ideas to turn into reality here?
      * **Management** — How does this fit into other priorities? What dependencies might exist?
      * **Delegation** — Who will take responsibility for next steps? Will they be held accountable?
      * **Communication** — How will this process or discussion be relayed to others? What do they need to know?
      * **Administration** — How will information from one system be input into another, such as a task tracking or communications tool? Where will information be stored?
    translation: |-
      * **Döntési jogkör** — Ki hozza meg ténylegesen a döntéseket? Mi kell ahhoz, hogy az ötletekből valóság legyen?
      * **Vezetés** — Hogyan illeszkedik ez a többi feladathoz? Milyen más feladatoktól függhet?
      * **Feladatok átadása** — Ki vállalja a felelősséget a következő lépésekért? Hogyan számol be a munkájáról?
      * **Kommunikáció** — Hogyan értesülnek mások a folyamatról vagy a beszélgetésről? Mit kell tudniuk?
      * **Adminisztráció** — Hogyan kerülnek át az információk egyik rendszerből a másikba, például egy feladatkezelő vagy kommunikációs eszközbe? Hol tároljátok őket?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5fd6382726e6e5c0:
    english: If there are any blocks around these issues, it can be damaging to leave this realisation until the moment of conclusion. For example, if the participants don’t actually have the power to make a change they have decided, they will feel defeated.Think ahead toward confronting reality when setting up the process, and scope the collaboration accordingly.
    translation: Ha ezek között akadályok vannak, gondot okozhat, ha csak a lezáráskor derülnek ki. Például a résztvevők csalódhatnak, ha nincs jogkörük végrehajtani az általuk eldöntött változtatást. A folyamat megtervezésekor gondold végig a megvalósítás feltételeit, és ehhez igazítsd a közös munka kereteit.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c3f96d2ea17ab236:
    english: |-
      * You can @mention the names of people who will take actions out of a decision.
      * Many users accomplish integrating Loomio content into other organizational systems through other channels like reviewing Loomio decisions in regular offline meetings, or transferring outcomes to their task tracking process.
      * Making an explicit decision naturally leads people to ask, “OK, but how are we going to take this forward?”
      * Forming a Loomio group often surfaces important questions like, “Who needs to participate here to turn these decisions into action?” If you're missing key stakeholders, leaders, or administrators, you'll get stuck.
    translation: |-
      * @Megemlítheted név szerint azokat, akik a döntés nyomán feladatot vállalnak.
      * Sokan más módon kapcsolják össze a Loomióban rögzített tartalmakat a szervezet többi rendszerével. Például rendszeres személyes találkozókon áttekintik a döntéseket, vagy a következtetésekből feladatokat hoznak létre a feladatkezelőjükben.
      * Egy egyértelmű döntés után természetes kérdés: „Rendben, de hogyan lépünk tovább?”
      * Egy Loomio-csoport létrehozásakor gyakran fontos kérdések merülnek fel, például: „Kinek kell részt vennie ahhoz, hogy ezekből a döntésekből tettek legyenek?” Ha hiányoznak a fontos érintettek, vezetők vagy adminisztrátorok, a megvalósítás elakadhat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  60bb517775f11e5d:
    english: "## It Ain’t Over Til It’s Over"
    translation: "## Akkor van vége, amikor lezárjátok"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '079da8800a401a45':
    english: Ending well is important. There’s a ritual to closing a process, and if it’s missed people will feel unsettled. Sometimes the end is determined by running out of time, and sometimes it’s when certain goals are achieved. Recognize implicit and explicit cues indicating if the individuals, and the group as a whole, can feel completion of a process or phase.
    translation: Fontos, hogy a folyamatnak egyértelmű vége legyen. A lezárásnak megvan a maga rendje; ha elmarad, a résztvevőkben maradhat hiányérzet. Néha az idő lejárta, máskor bizonyos célok elérése jelenti a végét. Figyelj a kimondott és kimondatlan jelekre, amelyekből látszik, hogy az egyes résztvevők és a csoport egésze lezártnak érzi-e a folyamatot vagy annak egy szakaszát.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  280969e6212842cc:
    english: Participants often look to the leader or facilitator for confirmation of when it’s actually over, and it usually pays to be explicit. Sometimes the signal is a clear statement that the session is wrapping up, a recap of decisions or next steps, and bidding everyone goodbye. Other times groups have established practices like a check-out. Letting a session vaguely trail off will leave a bad taste.
    translation: A résztvevők gyakran a vezetőtől vagy a facilitátortól várják a megerősítést, hogy valóban véget ért-e a folyamat. Érdemes ezt egyértelműen kimondani. Ez jelentheti a találkozó lezárásának bejelentését, a döntések és a következő lépések összefoglalását, majd az elköszönést. Más csoportoknak bevett lezárási szokásaik vannak, például egy zárókör. Ha a találkozó határozott lezárás nélkül ér véget, az kellemetlen érzést hagyhat a résztvevőkben.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e15896aadc163225:
    english: |-
      * The clearest indication of conclusion on Loomio is publishing a decision outcome.
      * Some groups use the [lock thread](/en/user_manual/discussions/using_discussions/#lock-or-unlock-a-thread) feature to prevent further changes and reduce clutter.
      * Deactivating a group is the strongest possible “closure” move. No one can say anything else after that.
      * Since Loomio groups can remain while group activity goes up and down, it can be useful to recognize milestones like the conclusion of a particular phase, even if the group will reactivate in the future.
    translation: |-
      * A Loomióban a döntés következtetésének közzététele jelzi legegyértelműbben a lezárást.
      * Egyes csoportok a [téma zárolása](/en/user_manual/discussions/using_discussions/#lock-or-unlock-a-thread) funkcióval akadályozzák meg a további változtatásokat, és csökkentik a felesleges bejegyzések számát.
      * A csoport deaktiválása a legerősebb lezárási lépés. Ezután senki sem írhat bele újabb bejegyzést.
      * A Loomio-csoportok akkor is megmaradhatnak, ha időnként csökken az aktivitásuk. Ezért érdemes jelezni a mérföldköveket, például egy szakasz lezárását, akkor is, ha a csoport később újra aktív lesz.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
