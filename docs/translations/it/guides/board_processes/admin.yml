  a27011d28c4f11a6:
    english: "## Administering discussions"
    translation: "## Gestire le discussioni"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8e67ece08e454475:
    english: There is a range of features in Loomio to help you administer discussions accessible from the drop down menu to the right of the discussion.
    translation: Loomio offre diverse funzioni per gestire le discussioni. Le trovi nel menu a discesa a destra della discussione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2d5be8c39f22ec28:
    english: 'Keep the discussion list current by using:'
    translation: 'Per tenere aggiornato l''elenco delle discussioni, usa queste opzioni:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  75739da1bd5910a6:
    english: |-
      - **Pin discussion** to keep important discussions at the top of the list
      - **Edit discussion** to change discussion title or update discussion context
      - **Move to group** when you want to move a discussion to another group or subgroup, or to an archive group.
      - **Lock thread** to prevent further comments or changes and remove the thread from the list of open threads. Locked threads are available under the discussion filter and from the search bar, and can be unlocked at any time.
      - **Delete discussion** when you do not want to keep a record of the discussion.  Note that deleted discussions can not be un-deleted.
    translation: |-
      - **Aggiungi discussione ai preferiti** per mantenere le discussioni importanti in cima all'elenco
      - **Modifica il nome della discussione** per cambiare il titolo o aggiornare il contesto della discussione
      - **Passare al gruppo** per spostare una discussione in un altro gruppo, in un sottogruppo o in un gruppo usato come archivio.
      - **Blocca discussione** per impedire nuovi commenti o modifiche e rimuovere la discussione dall'elenco di quelle aperte. Puoi trovare le discussioni bloccate tramite il filtro delle discussioni o la barra di ricerca e sbloccarle in qualsiasi momento.
      - **Elimina discussione** se non vuoi conservarne una copia. Le discussioni eliminate non possono essere ripristinate.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e3d2099d0e6fe6fa:
    english: "## Category tags"
    translation: "## Etichette di categoria"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  24b03357f6f6c3b9:
    english: Category tags are a great way to label discussions so they can be easily found. Set tags and apply to each discussion  - try to be consistent.
    translation: Le etichette di categoria aiutano a trovare le discussioni. Definisci le etichette e applicale alle discussioni in modo coerente.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f0f5f5abd586fb61:
    english: 'Common board tags include: Administration, AGM, Board meeting, Report, Finance, Legal, Members, Minutes, Planning, Policy, Resolution, Constitution, General meeting, Strategy.'
    translation: 'Tra le etichette più comuni per un consiglio ci sono: Amministrazione, Assemblea generale annuale, Riunione del consiglio, Relazione, Finanze, Questioni legali, Membri, Verbali, Pianificazione, Regolamenti, Delibere, Statuto, Assemblea generale, Strategia.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  89d8ec222f5019df:
    english: Group members can search for discussions by tag under the **tags** drop down menu.
    translation: I membri del gruppo possono cercare le discussioni per etichetta dal menu a discesa **Etichette**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  54ee008489cceaca:
    english: "## Maintaining the discussion topic"
    translation: "## Mantenere la discussione sul tema"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e9007433ca60ae39:
    english: Discussions work best for everyone when you can keep the discussion on a single topic.
    translation: Le discussioni sono più utili a tutti quando restano su un solo tema.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f742ae07824b35c6:
    english: If a new topic is introduced in the middle of a discussion, you can select and move specific comments to another discussion, or start a new discussion.
    translation: Se durante una discussione emerge un nuovo tema, puoi selezionare e spostare alcuni commenti in un'altra discussione oppure avviarne una nuova.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c8b5176f58dceb8b:
