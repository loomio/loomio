  7bda51ac3285357f:
    english: When starting or editing a discussion or poll, or writing a comment, you will see a formatting bar below the text field. Select the arrow at the end of the bar to show or hide the full set of tools.
    translation: Als je een discussie of peiling begint of bewerkt, of een reactie schrijft, zie je onder het tekstveld een opmaakbalk. Selecteer de pijl aan het einde van de balk om alle hulpmiddelen te tonen of te verbergen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2f2944ad10684b7f:
    english: Hover the mouse or cursor over each item for the name of each tool.
    translation: Beweeg de muisaanwijzer over een onderdeel om de naam van het hulpmiddel te zien.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5f45a085deb9eff1:
    english: Use formatting to add structure and emphasis so information is easier to scan.
    translation: Gebruik opmaak om structuur en nadruk aan te brengen, zodat informatie makkelijker te scannen is.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
