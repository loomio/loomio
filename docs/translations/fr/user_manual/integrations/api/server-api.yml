    translated_on: '2026-09-30'
  a37f91309a44b472:
    english: Delete removes the user and records the user created. Comments are removed from threads, votes are removed from polls, and groups, discussions, polls, and other records created by the user may also be deleted through database associations.
    translation: La suppression efface le compte utilisateur et les données créées par cette personne. Ses commentaires sont retirés des fils de discussion et ses votes des sondages. Les groupes, discussions, sondages et autres données qu’elle a créés peuvent aussi être supprimés par les associations de la base de données.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  537bd891e445eb93:
    english: This is very destructive. Redaction is highly recommended instead.
    translation: Cette opération entraîne de nombreuses suppressions. Il est fortement recommandé d’anonymiser le compte à la place.
    status: machine
    provider: codex/gpt-6-sol
