---
navigation_title: Hoe je kunt deelnemen
blocks:
  b07064bf98055393:
    english: "# How to participate"
    translation: "# Hoe je kunt deelnemen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c121de54fbe72331:
    english: 'Once signed in to a Loomio group you have been invited to, you can participate in a Loomio discussion or decision.  '
    translation: Zodra je bent ingelogd bij een Loomio-groep waarvoor je bent uitgenodigd, kun je deelnemen aan een discussie of besluitvorming.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9bb48e2f2f1858af:
    english: Read on to see  how to write a comment in a thread and how to vote in a poll.
    translation: Lees hoe je een reactie schrijft in een thread en stemt in een peiling.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '095ec081a6f1d74e':
    english: "## Comment"
    translation: "## Reageren"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d5dadbc416d8603a:
    english: You can write a comment in a thread, and people can reply, react or post their own comment to continue the discussion.
    translation: Je kunt een reactie schrijven in een thread. Anderen kunnen antwoorden, een emoji toevoegen of zelf reageren om de discussie voort te zetten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  250f7bc0e6e6c93c:
    english: 'When you have written your text, use **Post Comment** to instantly publish the comment. Your comment will be visible to anyone who has permission to see the thread. '
    translation: Gebruik **Plaats reactie** om je tekst direct te publiceren. Je reactie is zichtbaar voor iedereen die de thread mag zien.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  76a3378441f45ebf:
    english: "### Reply to a comment"
    translation: "### Antwoorden op een reactie"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c3495aed9ac78348:
    english: You can reply to someone's comment by clicking on the reply icon beneath the comment.
    translation: Klik op het antwoordpictogram onder een reactie om erop te antwoorden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b2698ab73e65442c:
    english: Your reply is published in the thread and an email notification is sent to the author of the comment.
    translation: Je antwoord wordt in de thread gepubliceerd. De schrijver van de reactie krijgt een e-mailmelding.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  04743dedbee0de5c:
    english: "### Get someone's attention"
    translation: "### Iemands aandacht trekken"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  455fea8aa593dad4:
    english: You can notify people when you write a comment.
    translation: Je kunt mensen een melding sturen wanneer je een reactie schrijft.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  316ef3257eaebd54:
    english: "### Reactions"
    translation: "### Emoji-reacties"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4b68204cf35c85f1:
    english: Reacting to a comment is a great way to encourage and acknowledge a comment by letting the comment author know how you feel.  It is a quick and light-weight way to participate that does not require any text, nor send an email. Click the smile emoji icon beneath a comment to leave an emoji reaction.
    translation: Met een emoji-reactie laat je de schrijver weten wat je van een reactie vindt. Zo kun je snel deelnemen zonder tekst te schrijven of een e-mail te versturen. Klik op het smileypictogram onder een reactie om een emoji-reactie achter te laten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Stemmen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4432b9c5b263014a:
    english: You may receive an invitation to vote in a poll via email or by notification in Loomio. Click on the link in the email to vote.
    translation: Je kunt per e-mail of via een melding in Loomio een uitnodiging krijgen om te stemmen in een peiling. Klik op de link in de e-mail om te stemmen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2a8641a22cf13597:
    english: Voting is easy, just click or tap on the icon of your choice.
    translation: Klik of tik op het pictogram van de optie die je kiest.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  00d6e2698ade53cc:
    english: There are many types of polls. The example below shows a typical proposal with voting options of **Agree**, **Abstain** or **Disagree**. Other options may be available.
    translation: Er zijn verschillende soorten peilingen. Het voorbeeld hieronder toont een voorstel met de stemopties **Eens**, **Onthouden** en **Oneens**. Er kunnen ook andere opties beschikbaar zijn.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4f327c4a766af0ab:
    english: Read the poll, and any attached files, then cast your vote by selecting one of the options.
    translation: Lees de peiling en eventuele bijlagen. Kies daarna een optie om je stem uit te brengen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2cf633f37997e8b8:
    english: "### State a reason"
    translation: "### Een reden geven"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c976385dcb75f67b:
    english: When voting, you can also leave a **Reason** to say why you have voted this way. This is optional.
    translation: Als je stemt, kun je bij **Reden** uitleggen waarom je deze optie kiest. Dit is niet verplicht.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6d0d884b0832dda9:
    english: "### Change your vote"
    translation: "### Je stem wijzigen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  84629138984e43d0:
    english: You can **change your vote**, up until the proposal closes.
    translation: Je kunt **je stem wijzigen** totdat het voorstel sluit.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8fcddbe7856e926b:
    english: There are many reasons why you might want to change your vote. For example if new information emerges it may cause you to rethink your decision, and change your vote.
    translation: Er kunnen verschillende redenen zijn om je stem te wijzigen. Nieuwe informatie kan je bijvoorbeeld anders over het voorstel laten denken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f7078b517c8bfed8:
    english: Once again, you can leave a reason to say why you have changed your vote.
    translation: Je kunt opnieuw een reden geven om uit te leggen waarom je je stem hebt gewijzigd.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8e1b2953471f22ba:
    english: "### Results"
    translation: "### Resultaten"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2153df12cd2b4fe2:
    english: Results of the proposal are updated as people vote, so you can see how a proposal is trending.
    translation: De resultaten worden bijgewerkt wanneer mensen stemmen. Zo kun je zien hoe de stemming over het voorstel verloopt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  229571fe36c571b0:
    english: 'In a controversial proposal it is common to see mixed results, however this does not mean the proposal has failed.  '
    translation: Bij een omstreden voorstel zijn de resultaten vaak verdeeld. Dat betekent niet dat het voorstel is mislukt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c3d5e53684bf3e88:
    english: Often the new information revealed during the proposal helps form a better proposal that is more likely to pass.
    translation: Nieuwe informatie die tijdens de stemming naar voren komt, helpt vaak om een beter voorstel te maken dat meer kans maakt op instemming.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b4783489f09ccf19:
    english: "### Outcome"
    translation: "### Conclusie"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  592f419764241ef6:
    english: When the proposal closes, the author is prompted to state the **Outcome**.
    translation: Wanneer het voorstel sluit, wordt de schrijver gevraagd de **Conclusie** te formuleren.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0fae106181bbc6ac:
    english: This is an important final step to record the result of the decision and let everyone know what will happen next.
    translation: Dit is de laatste stap om de uitkomst van de besluitvorming vast te leggen en iedereen te laten weten wat er daarna gebeurt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
