    english: "[STV Elections](/en/user_manual/polls/stv/) let participants rank candidates in a proportional, multi-winner election. Use STV to elect a committee, board, or group of delegates."
    translation: "[Elecciones STV](/en/user_manual/polls/stv/) permite ordenar candidaturas por preferencia en una elección proporcional con varios puestos. Usa STV para elegir un comité, una junta o un grupo de representantes."
