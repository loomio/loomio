name: github pages

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.5.2'

      - run: mdbook build docs
      - name: Remove source-only files from the generated book
        run: bash docs/clean-book.sh
      - name: Check redirects
        run: bash docs/check-redirects.sh
      - name: Check internal links and images
        run: bash docs/check-links.sh
      - run: mkdir ./docs/public
      - run: cp -R docs/static/* ./docs/public/
      - run: mv ./docs/book/* ./docs/public/en/
      - name: Fix canonical URLs (.md -> .html)
        run: find ./docs/public/en -name '*.html' -exec perl -pi -e 's|(canonical" href=".*)\.md"|$1.html"|g' {} +
      - name: Make redirect canonicals absolute
        run: find ./docs/public/en -name '*.html' -exec perl -pi -e 's|rel="canonical" href="/en/|rel="canonical" href="https://help.loomio.com/en/|g' {} +
      - name: Consolidate duplicated mdBook landing page
        run: perl -pi -e 's|https://help.loomio.com/en/index.html|https://help.loomio.com/en/user_manual/overview/index.html|g' ./docs/public/en/index.html
      - name: Generate page descriptions
        run: node docs/generate-meta-descriptions.js ./docs/public/en
      - run: bash docs/generate-sitemap.sh ./docs/public
      - name: Check search metadata and sitemap
        run: bash docs/check-seo.sh ./docs/public

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ github.ref == 'refs/heads/master' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/public
