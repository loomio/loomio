    english: "`GET /api/b2/groups`"
    translation: "`GET /api/b2/groups`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4f588e981afc3069:
    english: The response contains all matching records in a non-paginated `groups` array. It includes parent groups and subgroups, including groups whose subscription is not currently active. Check the `enabled` field when an integration should operate only on enabled groups.
    translation: Die Antwort enthält alle passenden Datensätze in einem `groups`-Array ohne Paginierung. Dazu gehören übergeordnete Gruppen und Untergruppen, auch wenn deren Abonnement derzeit nicht aktiv ist. Prüfe das Feld `enabled`, wenn eine Integration nur für aktivierte Gruppen arbeiten soll.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  213de8ce539a42c3:
    english: 'Important group fields include:'
    translation: 'Wichtige Gruppenfelder sind:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d377f7c9b224a6d7:
    english: |-
      | Field | Description |
      | --- | --- |
      | `id` | Numeric group ID used by other User API endpoints |
      | `key` | Stable short key used in Loomio URLs |
      | `handle` | Human-readable group handle |
      | `name` | Group name |
      | `full_name` | Group name including its parent-group context |
      | `parent_id` | Numeric parent-group ID for a subgroup, otherwise `null` |
      | `enabled` | Whether the group and its subscription are active |
      | `memberships_count` | Number of active and pending memberships |
      | `accepted_memberships_count` | Number of accepted memberships |
      | `pending_memberships_count` | Number of pending invitations |
      | `admin_memberships_count` | Number of group administrators |
      | `delegates_count` | Number of delegates |
      | `discussions_count` | Number of discussions directly in the group |
      | `polls_count` | Number of polls directly in the group |
      | `subgroups_count` | Number of subgroups |
    translation: |-
      | Feld | Beschreibung |
      | --- | --- |
      | `id` | Numerische Gruppen-ID, die andere Endpunkte der Benutzer-API verwenden |
      | `key` | Beständiger Kurzschlüssel für Loomio-URLs |
      | `handle` | Lesbare Kennung der Gruppe |
      | `name` | Gruppenname |
      | `full_name` | Gruppenname mit dem Kontext der übergeordneten Gruppe |
      | `parent_id` | Numerische ID der übergeordneten Gruppe bei einer Untergruppe, sonst `null` |
      | `enabled` | Gibt an, ob die Gruppe und ihr Abonnement aktiv sind |
      | `memberships_count` | Anzahl aktiver und ausstehender Mitgliedschaften |
      | `accepted_memberships_count` | Anzahl angenommener Mitgliedschaften |
      | `pending_memberships_count` | Anzahl ausstehender Einladungen |
      | `admin_memberships_count` | Anzahl der Gruppenadministratoren |
      | `delegates_count` | Anzahl der Delegierten |
      | `discussions_count` | Anzahl der Diskussionen direkt in der Gruppe |
      | `polls_count` | Anzahl der Abstimmungen direkt in der Gruppe |
      | `subgroups_count` | Anzahl der Untergruppen |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  34f1693ba28fcb80:
    english: The response may include additional group settings, related parent-group records and the API user's memberships. Clients should ignore fields they do not use.
    translation: Die Antwort kann weitere Gruppeneinstellungen, verknüpfte Datensätze übergeordneter Gruppen und die Mitgliedschaften des API-Benutzers enthalten. Clients sollten Felder ignorieren, die sie nicht verwenden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d7c327b8ed7f7bf2:
    english: "### Get a group"
    translation: "### Eine Gruppe abrufen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  15ab63bc2d396657:
    english: Return one group visible to the API-key user.
    translation: Ruft eine Gruppe ab, die für den API-Schlüssel-Benutzer sichtbar ist.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8ba2cc9e3c67b1dd:
    english: "`GET /api/b2/groups/:id_or_key_or_handle`"
    translation: "`GET /api/b2/groups/:id_or_key_or_handle`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  71e5812ff9890c9b:
    english: The identifier can be the group's numeric ID, key or handle.
    translation: Als Kennung kannst du die numerische ID, den Schlüssel oder die lesbare Kennung der Gruppe verwenden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8ba79a283b7b77d5:
    english: The response contains the group in the `groups` array and uses the same fields as the list endpoint. A request for a group the API-key user cannot access returns a permission error.
    translation: Die Antwort enthält die Gruppe im `groups`-Array und verwendet dieselben Felder wie der Endpunkt zum Auflisten. Wenn der API-Schlüssel-Benutzer keinen Zugriff auf die Gruppe hat, wird ein Berechtigungsfehler zurückgegeben.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  18d823df4d7f8fac:
    english: "## Webhooks"
    translation: "## Webhooks"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f33d58fc1f2fd84c:
    english: 'The User API is request-based: an integration calls Loomio when it wants to read or change data. A group webhook provides the push direction. Loomio sends selected group events to your endpoint as they happen, so an integration does not need to poll the REST API for changes.'
    translation: 'Die Benutzer-API arbeitet mit Anfragen: Eine Integration ruft Loomio auf, wenn sie Daten lesen oder ändern möchte. Ein Gruppen-Webhook übermittelt Ereignisse in die andere Richtung. Loomio sendet ausgewählte Gruppenereignisse an deinen Endpunkt, sobald sie eintreten. Die Integration muss die REST-API daher nicht regelmäßig auf Änderungen abfragen.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3b5b4b0ac52b9010:
    english: 'Webhooks are configured per group and require group-administrator permission. They can be managed through the Loomio interface:'
    translation: 'Webhooks werden für jede Gruppe einzeln eingerichtet. Dafür sind Administratorrechte in der Gruppe erforderlich. Du kannst sie über die Loomio-Oberfläche verwalten:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  318710be7b3aae7d:
    english: |-
      1. Open the group.
      2. Open the group menu and select **Chat integrations**.
      3. Add the integration matching the payload format your endpoint accepts. For a general-purpose endpoint, use the Mattermost/Markdown format.
      4. Enter a name and the destination URL.
      5. Select the events that Loomio should send automatically.
      6. Save the integration and use **Test connection** to send a test message.
    translation: |-
      1. Öffne die Gruppe.
      2. Öffne das Gruppenmenü und wähle **Chat-Integrationen**.
      3. Füge die Integration hinzu, deren Nutzdatenformat dein Endpunkt unterstützt. Verwende für einen allgemeinen Endpunkt das Format Mattermost/Markdown.
      4. Gib einen Namen und die Ziel-URL ein.
      5. Wähle die Ereignisse aus, die Loomio automatisch senden soll.
      6. Speichere die Integration und sende mit **Testverbindung** eine Testnachricht.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  43fb95cf304fced6:
    english: Use an HTTPS destination with an unguessable URL. Loomio requires the destination to resolve to a public address and blocks requests to local or private network addresses.
    translation: Verwende ein HTTPS-Ziel mit einer nicht erratbaren URL. Loomio verlangt, dass das Ziel zu einer öffentlichen Adresse aufgelöst wird, und blockiert Anfragen an lokale oder private Netzwerkadressen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d8d5abffe6425bea:
    english: Agents and other integrations can instead manage webhooks through the Bearer-authenticated chatbot endpoints described below. The resource is named `chatbots` for compatibility with Loomio's chat integrations, but it also represents general outgoing webhooks.
    translation: Agenten und andere Integrationen können Webhooks auch über die unten beschriebenen Chatbot-Endpunkte mit Bearer-Authentifizierung verwalten. Die Ressource heißt aus Kompatibilitätsgründen mit Loomios Chat-Integrationen `chatbots`, steht aber auch für allgemeine ausgehende Webhooks.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  28fb6371af33b66f:
    english: "### List webhooks"
    translation: "### Webhooks auflisten"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7187e5a26c3ec864:
    english: Return the chat integrations configured for a group. The API-key user must be an administrator of that group. The response includes destination URLs, so it must not be exposed to ordinary group members.
    translation: Ruft die für eine Gruppe eingerichteten Chat-Integrationen ab. Der API-Schlüssel-Benutzer muss Administrator dieser Gruppe sein. Die Antwort enthält Ziel-URLs und darf daher gewöhnlichen Gruppenmitgliedern nicht zugänglich gemacht werden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  788d370538bdda46:
    english: "`GET /api/b2/chatbots?group_id=123`"
    translation: "`GET /api/b2/chatbots?group_id=123`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d676ca45c3e1074a:
    english: 'The response contains a `chatbots` array with these fields:'
    translation: 'Die Antwort enthält ein `chatbots`-Array mit diesen Feldern:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ca00f7d0a52ce803:
    english: |-
      | Field | Description |
      | --- | --- |
      | `id` | Integration ID used for updates and deletion |
