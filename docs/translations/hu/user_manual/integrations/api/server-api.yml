    translated_on: '2026-09-30'
  7fe42bee753b558d:
    english: "`/api/b3` is for server-level operations. Use `/api/b2` for user-oriented actions performed as a Loomio user account."
    translation: A `/api/b3` szerver szintű műveletekre szolgál. A Loomio-felhasználói fiókkal végzett műveletekhez a `/api/b2` végpontot használd.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
