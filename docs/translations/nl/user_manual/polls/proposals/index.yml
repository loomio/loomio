  ca5b9583bfe78b65:
    english: A proposal asks people to respond to a statement or course of action. Participants choose a defined response and can explain their vote. Use a proposal to gather feedback, seek advice, identify objections, or test for agreement.
    translation: Met een voorstel vraag je mensen te reageren op een stelling of een mogelijke aanpak. Deelnemers kiezen een van de vaste antwoordopties en kunnen hun stem toelichten. Gebruik een voorstel om feedback of advies te verzamelen, bezwaren te ontdekken of te peilen of er overeenstemming is.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  143dc77c58a4c881:
    english: This section helps you choose and run Loomio's default proposal templates. For a complete sequence of discussion, proposals, amendments, and outcome, use the [decision-making guides](/en/guides/making_decisions/). To change the templates available to your group, see [Poll templates](../poll_templates/).
    translation: In dit onderdeel lees je hoe je de standaardsjablonen voor voorstellen in Loomio kiest en gebruikt. Wil je het hele proces doorlopen, van discussie en voorstellen tot wijzigingen en een conclusie? Lees dan de [handleidingen voor besluitvorming](/en/guides/making_decisions/). Welke sjablonen jouw groep kan gebruiken, stel je in via [Enquête-sjablonen](../poll_templates/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e0f8614f95c9c5ff:
    english: "## Choose a proposal template"
    translation: "## Kies een sjabloon voor een voorstel"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  525699503edbe342:
    english: |-
      | Template | What it asks | Use it when… |
      |---|---|---|
      | [Sense check](sense_check/) | Is this on the right track? | An idea is still being developed |
      | [Advice](advice/) | What advice should the decision maker consider? | A person or team owns the decision |
      | [Consent](consent/) | Is this safe to try, or is there a meaningful objection? | The group uses consent decision-making |
      | [Consensus](consensus/) | What is your position on this proposal? | The group is seeking collective agreement |
    translation: |-
      | Sjabloon | Vraag | Gebruik dit wanneer… |
      |---|---|---|
      | [Gevoelscontrole](sense_check/) | Gaat dit de goede kant op? | Een idee nog wordt uitgewerkt |
      | [Advies](advice/) | Welk advies moet de beslisser meenemen? | Een persoon of team verantwoordelijk is voor de beslissing |
      | [Toestemming](consent/) | Is dit veilig om te proberen, of is er een wezenlijk bezwaar? | De groep besluiten neemt op basis van toestemming |
      | [Overeenstemming](consensus/) | Wat vind je van dit voorstel? | De groep samen tot overeenstemming wil komen |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0cb03ac4a22f02b4:
    english: Choose the template whose response options match the question you need answered. Each template page explains its use cases, setup, voting form, and results.
    translation: Kies het sjabloon met antwoordopties die passen bij de vraag die je wilt stellen. Op de pagina van elk sjabloon lees je wanneer je het gebruikt, hoe je het instelt, hoe deelnemers stemmen en hoe je de resultaten bekijkt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d379b02c308b3b55:
    english: "## Other proposal templates"
    translation: "## Andere sjablonen voor voorstellen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  44cdb16aebf757ca:
    english: Loomio also provides templates such as Proposal, Gradients of agreement, Question round, and Majority. Some are hidden initially. Group administrators can make them available or create a template for the group's own terminology and rules from [Poll templates](../poll_templates/).
    translation: Loomio biedt ook sjablonen zoals Voorstel, Gradiënten van overeenkomst, Vragen ronde en Meerderheid. Sommige zijn aanvankelijk verborgen. Groepsbeheerders kunnen ze beschikbaar maken of via [Enquête-sjablonen](../poll_templates/) een sjabloon maken met de eigen termen en regels van de groep.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ca179ba4cb53c5e3:
    english: "## Proposal records"
    translation: "## Vastlegging van voorstellen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  460a90e796fc4dc0:
    english: Votes and reasons update while the proposal is open, and participants can change their response. After it closes, publish an [outcome](../outcomes/) that states the decision or next step. The discussion, proposal, votes, reasons, and outcome form a record of how the group reached its decision.
    translation: Zolang het voorstel open is, worden stemmen en toelichtingen bijgewerkt en kunnen deelnemers hun antwoord wijzigen. Publiceer na sluiting een [conclusie](../outcomes/) waarin de beslissing of volgende stap staat. De discussie, het voorstel, de stemmen, de toelichtingen en de conclusie leggen samen vast hoe de groep tot haar beslissing kwam.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
