navigation_title: Discussies
blocks:
  f087c06a5f4ab2e6:
    english: "# Intro to Discussions"
    translation: "# Inleiding tot discussies"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f515c87a8d1d20c7:
    english: Loomio discussions are where you can share information, discuss topics, and make decisions with your group.  People participate by posting comments and replies.
    translation: In Loomio-discussies kun je informatie delen, onderwerpen bespreken en samen met je groep besluiten nemen. Mensen doen mee door opmerkingen en reacties te plaatsen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eede89b6ce4f357d:
    english: |-
      - All info about a topic is in one easily accessible place.
      - People can reply via email and their comments appear in the discussion.
      - You can see who has read the discussion and who needs a nudge.
      - There is a record of discussion you can easily find again.
    translation: |-
      - Alle informatie over een onderwerp staat op één makkelijk toegankelijke plek.
      - Mensen kunnen per e-mail reageren. Hun opmerkingen verschijnen in de discussie.
      - Je kunt zien wie de discussie heeft gelezen en wie een herinnering nodig heeft.
      - Je kunt de discussie later makkelijk terugvinden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9cb2eb404b59208b:
    english: Discussions have a wide range of uses - from a general discussion forum to running specific work-flow and decision-making processes.
    translation: 'Je kunt discussies voor veel doeleinden gebruiken: als algemeen discussieforum, maar ook voor specifieke werkprocessen en besluitvorming.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  87a95605052570ca:
    english: For example, you may frame a discussion on a particular topic, invite people to contribute their thoughts and share information, and facilitate progress towards an agreed outcome.
    translation: Je kunt bijvoorbeeld een discussie over een bepaald onderwerp starten, mensen uitnodigen om hun gedachten en informatie te delen, en samen toewerken naar een conclusie.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ce6e6734c595d968:
    english: Or you may invite people to participate in a particular decision, using a consent or advice decision-making process.
    translation: Je kunt mensen ook uitnodigen om mee te doen aan een besluit volgens een proces op basis van consent of advies.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7fa58cb3ba95be0b:
    english: Discussions can also contain polls and proposals to help progress a discussion to an outcome. As people comment in the discussion and vote in polls, a discussion timeline builds so you can easily find key milestones.
    translation: Discussies kunnen ook peilingen en voorstellen bevatten om tot een conclusie te komen. Terwijl mensen opmerkingen plaatsen en stemmen in peilingen, ontstaat een tijdlijn waarin je belangrijke momenten makkelijk terugvindt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  388e829e86a99bd8:
    english: "![The Returnable bottles for cafe customers discussion, with a comment and a proposal](discussion-example.png)"
    translation: "![De discussie over herbruikbare flessen voor cafébezoekers, met een opmerking en een voorstel](discussion-example.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6b0556376d31b63e:
    english: "## Common uses"
    translation: "## Veelvoorkomende toepassingen"
    status: machine
