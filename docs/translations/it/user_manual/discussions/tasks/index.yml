  970146a02b39726b:
    english: "# Tasks"
    translation: "# Compiti"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bea1dad1b0b47107:
    english: Use tasks in threads and comments to name an action, assign it to someone, set a due date, and track whether it is complete.
    translation: Usa i compiti nelle discussioni e nei commenti per indicare un'attività, assegnarla a qualcuno, impostare una scadenza e seguirne lo stato.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2398b3493bad759e:
    english: "## Add a task"
    translation: "## Aggiungi un compito"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c240866e019fab51:
    english: While writing a thread or comment, expand the formatting toolbar and click **Task list**. Type the action beside the checkbox.
    translation: Mentre scrivi una discussione o un commento, espandi la barra degli strumenti di formattazione e fai clic su **Lista di compiti**. Scrivi l'attività accanto alla casella di controllo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f7d4f63b321e9af1:
    english: "## Name and assign the task to a person"
    translation: "## Dai un nome al compito e assegnalo a una persona"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5ea902e45aaf1f7a:
    english: Use an @mention in the task to assign it to a group member. An **Add due date** button appears once the task has an assignee.
    translation: Usa una @menzione nel compito per assegnarlo a un membro del gruppo. Quando il compito ha una persona assegnata, compare il pulsante **Aggiungi scadenza**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1134aedee6cafd8c:
    english: Tasks assigned to you appear on your **Tasks** page. Open **Tasks** from the sidebar to see them grouped by thread or poll.
    translation: I compiti assegnati a te compaiono nella pagina **Compiti**. Apri **Compiti** dalla barra laterale per vederli raggruppati per discussione o sondaggio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5eae519b81c94f7a:
    english: "## Set a reminder"
    translation: "## Imposta un promemoria"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  561597d43d716888:
    english: Click **Add due date** to choose a due date and when Loomio should email the assignee a reminder. You can also remove an existing due date from this dialog.
    translation: Fai clic su **Aggiungi scadenza** per scegliere la data di scadenza e quando Loomio deve inviare un promemoria via email alla persona assegnata. Da questa finestra puoi anche rimuovere una scadenza esistente.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bd36c23f297b0429:
    english: "## Mark it as done"
    translation: "## Segna il compito come completato"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  59b6138f35694902:
    english: Click the checkbox beside a task to mark it as done. You can do this while editing the text, while reading it if you are the assignee, or from the **Tasks** page. Click it again to reopen the task.
    translation: Fai clic sulla casella di controllo accanto a un compito per segnarlo come completato. Puoi farlo mentre modifichi il testo, mentre lo leggi se è assegnato a te, oppure dalla pagina **Compiti**. Fai di nuovo clic sulla casella per riaprire il compito.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
