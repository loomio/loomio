    translated_on: '2026-09-29'
  1a96cd0121fe58ec:
    english: The history shows who has been invited to vote, when each invitation was sent, and whether it has been read when that information is available.
    translation: De geschiedenis laat zien wie is uitgenodigd om te stemmen, wanneer elke uitnodiging is verstuurd en, als die informatie beschikbaar is, of de uitnodiging is gelezen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3bd9a11263e1c8f4:
