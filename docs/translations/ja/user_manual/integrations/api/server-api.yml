    translated_on: '2026-09-30'
  7fe42bee753b558d:
    english: "`/api/b3` is for server-level operations. Use `/api/b2` for user-oriented actions performed as a Loomio user account."
    translation: "`/api/b3` はサーバー単位の操作に使用します。Loomio のユーザーアカウントとして行う操作には `/api/b2` を使用します。"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
