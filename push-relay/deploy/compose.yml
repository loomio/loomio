name: loomio-push-relay
services:
  relay:
    build: ..
    restart: unless-stopped
    env_file: .env
    environment:
      LOOMIO_DATABASE_PATH: /app/storage/relay.sqlite3
      APNS_PRIVATE_KEY_FILE: /run/secrets/apns-production.p8
      APNS_SANDBOX_PRIVATE_KEY_FILE: /run/secrets/apns-sandbox.p8
      PROXY_TRUSTED_CIDR: ${PROXY_TRUSTED_CIDR:?Set the TLS proxy network subnet}
    volumes:
      - ./secrets:/run/secrets:ro
      - ./storage:/app/storage
    networks:
      proxy:
        aliases: [loomio-push-relay]
    healthcheck:
      test: [CMD, ruby, -rnet/http, -e, "exit(Net::HTTP.get_response(URI('http://127.0.0.1:8080/health')).code == '200' ? 0 : 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 256m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-kamal}
