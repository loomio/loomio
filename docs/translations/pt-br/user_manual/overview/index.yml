  74caca2261c15283:
    english: 'Loomio has three main parts: groups, discussions, and polls.'
    translation: 'O Loomio tem três partes principais: grupos, discussões e enquetes.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5f0a46926a0f7350:
    english: "### Groups"
    translation: "### Grupos"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2060a64d0fabc6d7:
    english: A group is a place for an organization, team, or community to work together. Its home page explains the group's purpose and provides access to its discussions, polls, members, and files.
    translation: Um grupo é um espaço onde uma organização, equipe ou comunidade trabalha em conjunto. A página inicial explica o propósito do grupo e dá acesso às discussões, enquetes, aos membros e arquivos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  311793a17709182c:
    english: "### Discussions"
    translation: "### Discussões"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  05ecdffe6c18a1df:
    english: Discussions keep the information and conversation about a topic together. People can share context, comment, reply, react, and use polls to move the discussion towards an outcome.
    translation: As discussões reúnem as informações e conversas sobre um assunto. As pessoas podem compartilhar o contexto, comentar, responder, reagir e usar enquetes para chegar a uma conclusão.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dc9a50d7f1f20c80:
    english: Over time, discussions create a searchable record of the information considered and the decisions made by your group.
    translation: Com o tempo, as discussões formam um registro pesquisável das informações consideradas e das decisões tomadas pelo seu grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3448194e8a2ce09d:
    english: "### Polls and proposals"
    translation: "### Enquetes e propostas"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4ef7092f5f56e773:
    english: Polls help a group understand preferences, gather advice, and make decisions. Different poll templates support different processes. A proposal asks people to respond to a suggested course of action and explain the reason for their response.
    translation: As enquetes ajudam o grupo a entender preferências, reunir opiniões e tomar decisões. Diferentes modelos de enquete atendem a diferentes processos. Uma proposta pede que as pessoas respondam a uma sugestão de ação e expliquem o motivo da resposta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  51ab039bc7c374bd:
    english: Polls can be part of a discussion or run independently from the **Polls** tab on a group page.
    translation: As enquetes podem fazer parte de uma discussão ou ser realizadas separadamente na aba **Consultas** da página de um grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
