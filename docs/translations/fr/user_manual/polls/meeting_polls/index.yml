    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2f5455ba3b487407:
    english: Save time arranging a date for your meeting or event.
    translation: Gagnez du temps pour fixer la date de votre réunion ou de votre événement.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  859c3efc07ce0b04:
    english: Time poll makes it easy to see everyone's availability and find the best time.
    translation: Le sondage horaire de réunion permet de voir les disponibilités de chacun et de trouver le meilleur créneau.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  12ae9e9d3bdb0a4e:
    english: Give your Time poll a title and details. Enter a list of date and time options in your time zone.
    translation: Donnez un titre à votre sondage horaire de réunion et ajoutez des précisions. Saisissez une liste de dates et d'heures dans votre fuseau horaire.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  548fb6cd6fcd9376:
    english: When setting timeslots, consider people in different time zones. Participants will see times localized in their time zone.
    translation: Lorsque vous définissez les créneaux, tenez compte des personnes situées dans d'autres fuseaux horaires. Chaque personne verra les heures dans son propre fuseau horaire.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3105405631b53c31:
    english: Set a meeting duration.
    translation: Définissez la durée de la réunion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8d56a5d9986286e9:
    english: "### Voting"
    translation: "### Vote"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  41d1e6a3a6739d95:
    english: People mark each time with the green thumbs-up icon when they are available, the yellow sideways thumb when they can attend if needed, or the red thumbs-down icon when they are unavailable.
    translation: Pour chaque créneau, les personnes indiquent leur disponibilité avec l'icône verte représentant un pouce levé, leur disponibilité sous réserve avec l'icône jaune représentant un pouce sur le côté, ou leur indisponibilité avec l'icône rouge représentant un pouce baissé.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b4784042c82735af:
    english: Participants can leave a reason comment to help the organizer find a suitable time.
    translation: Les personnes participantes peuvent expliquer leur réponse dans un commentaire pour aider la personne qui organise la réunion à trouver un créneau adapté.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0165a90bc22b6f7f:
    english: If the times don't work, participants can suggest alternatives using the message field. You can then update the poll with new times.
    translation: Si aucun créneau ne convient, les personnes participantes peuvent proposer d'autres horaires dans le champ de message. Vous pouvez ensuite ajouter ces horaires au sondage.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6c7c09879e7d9bf8:
    english: The results update as voting proceeds in a table showing who is available when, so everyone can see which timeslots are popular.
    translation: Les résultats se mettent à jour au fil des votes. Un tableau indique les disponibilités de chaque personne afin que tout le monde puisse voir les créneaux qui conviennent au plus grand nombre.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
