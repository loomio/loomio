---
navigation_title: Сбор конфиденциальных заявок
blocks:
  c4a53a596a037fc0:
    english: "# Collect private submissions"
    translation: "# Сбор конфиденциальных заявок"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b24abc6bf93b1c0f:
    english: Use a Closed group to collect private submissions from people who are not members of the group. Each submission becomes a separate discussion that the submitter and the group's review team can use to exchange information, ask questions, and record a decision. Submitters cannot see other private discussions or submissions in the group.
    translation: Используйте закрытую группу, чтобы собирать конфиденциальные заявки от людей, которые не состоят в группе. Каждая заявка становится отдельным обсуждением. В нём заявитель и группа, рассматривающая заявки, могут обмениваться информацией, задавать вопросы и фиксировать решение. Заявители не видят другие закрытые обсуждения и заявки в группе.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  feb5105698bca188:
    english: Nominations are a clear use case when candidate details or the list of nominees must remain private during selection. A person can nominate themselves or someone else for an election, appointment, committee, board, or representative role, while a selection panel reviews each nomination in its own discussion.
    translation: Так можно собирать выдвижения кандидатов, если сведения о кандидатах или список выдвинутых должны оставаться конфиденциальными во время отбора. Человек может выдвинуть себя или другого человека на выборную должность, назначение, место в комитете или совете либо на роль представителя. Отборочная комиссия рассматривает каждое выдвижение в отдельном обсуждении.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a64597508a4f7f3d:
    english: 'Other suitable purposes where submissions should not be public include:'
    translation: 'Этот способ также подходит для заявок, которые не должны быть публичными:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e4bd382899a8e7d9:
    english: |-
      - Complaints, safeguarding reports, safety concerns, and incident reports
      - Appeals and requests to reconsider a decision about an individual case
      - Requests for mediation, conflict resolution, or personal support
      - Applications containing personal, financial, or eligibility information, such as hardship grants or scholarships
      - Sealed bids or tender responses that must remain private during assessment
    translation: |-
      - Жалобы, сообщения о нарушениях безопасности и отчёты о происшествиях
      - Апелляции и просьбы пересмотреть решение по отдельному случаю
      - Запросы на посредничество, разрешение конфликта или личную поддержку
      - Заявки, содержащие личные сведения, финансовую информацию или данные о соответствии условиям, например заявки на материальную помощь или стипендию
      - Закрытые предложения на торгах и ответы на тендеры, которые должны оставаться конфиденциальными во время оценки
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bab86da011a22a2a:
    english: This workflow is private between submitters, but it is not anonymous. Submitters need a user account, and every member of the Closed group can see the submissions. Consider who belongs to the review group before using it for sensitive information.
    translation: Заявители не видят заявки друг друга, но этот процесс не анонимный. Для подачи заявки нужна учётная запись. Каждый участник закрытой группы может видеть все заявки. Прежде чем использовать группу для сбора конфиденциальной информации, проверьте, кто в неё входит.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b82ae8f3f04d257f:
    english: "## Enable private submissions"
    translation: "## Включите сбор конфиденциальных заявок"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0cebe3c5801844ce:
    english: You must be an admin of the group or subgroup where you want to collect submissions.
    translation: Вы должны быть администратором группы или подгруппы, в которой хотите собирать заявки.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  831d833d53a12ece:
    english: |-
      1. Open the group.
      2. Select **Settings** (or **More** and then **Edit group settings**).
      3. Open **Permissions**.
      4. Enable **Non-members can start discussions**.
      5. Save the group settings.
    translation: |-
      1. Откройте группу.
      2. Выберите **Настройки** (или **Более**, затем **Редактировать настройки группы**).
      3. Откройте **Разрешения**.
      4. Включите **Участники, не являющиеся членами организации, могут начать обсуждения.**
      5. Сохраните настройки группы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f3962a27b1c4ffa8:
    english: "![The Permissions tab in group settings, with Non-members can start discussions highlighted](non_members_can_start_discussions.png)"
    translation: "![Вкладка «Разрешения» в настройках группы; выделен параметр «Участники, не являющиеся членами организации, могут начать обсуждения»](non_members_can_start_discussions.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  99ace15d10e78f33:
    english: This option is available only for **Open** and **Closed** groups. It is hidden for **Secret** groups. If you cannot see it, open **Privacy** in the group settings and change **Group privacy** to **Closed** (recommended for private submissions) or **Open**, then return to **Permissions**.
    translation: Этот параметр доступен только для групп с настройками **Открыто** и **Закрыто**. Для групп с настройкой **Выделить** он скрыт. Если вы его не видите, откройте **Конфиденциальность** в настройках группы и установите для параметра **Конфиденциальность группы** значение **Закрыто** (рекомендуется для конфиденциальных заявок) или **Открыто**. Затем вернитесь в раздел **Разрешения**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  449517e6293a3acc:
    english: Enabling this permission does not make the group's discussions public. A non-member can start a new discussion and access that discussion as a guest, but cannot see the group's other private discussions.
    translation: Включение этого разрешения не делает обсуждения группы публичными. Человек, который не состоит в группе, может начать новое обсуждение и получить к нему доступ как гость, но не увидит другие закрытые обсуждения группы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  151f68a3f638fb67:
    english: "## Set up a private submission process"
    translation: "## Настройте сбор конфиденциальных заявок"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ae924433d81f5eac:
    english: |-
      1. Create a dedicated subgroup for the submission process and set its privacy to **Closed**. A subgroup keeps the submissions separate from the parent group's other work.
      2. Add the selection panel or other people responsible for reviewing submissions as members of the subgroup. Every subgroup member can see every submission, so add only people who should have that access.
      3. Create a [discussion template](/en/user_manual/discussions/templates) in the subgroup. Include the questions and information submitters should provide. You can create different discussion templates for different kinds of submissions.
      4. If submitters should not request subgroup membership, set membership to **Invitation only**.
      5. [Enable private submissions](#enable-private-submissions) in the subgroup's permissions.
      6. Test the process with an account that is not a member of the subgroup.
      7. Share the subgroup page with prospective submitters. They must sign in to their user account before making a submission.
    translation: |-
      1. Создайте отдельную подгруппу для приёма заявок и установите для неё настройку конфиденциальности **Закрыто**. Так заявки будут отделены от остальной работы основной группы.
      2. Добавьте в подгруппу участников отборочной комиссии или других людей, которые будут рассматривать заявки. Каждый участник подгруппы видит все заявки, поэтому добавляйте только тех, кому нужен такой доступ.
      3. Создайте в подгруппе [шаблон обсуждения](/en/user_manual/discussions/templates). Укажите в нём вопросы и сведения, которые должны предоставить заявители. Для разных видов заявок можно создать разные шаблоны обсуждений.
      4. Если заявители не должны запрашивать вступление в подгруппу, установите для вступления настройку **Только по приглашению**.
      5. [Включите сбор конфиденциальных заявок](#enable-private-submissions) в разрешениях подгруппы.
      6. Проверьте процесс с помощью учётной записи человека, который не состоит в подгруппе.
      7. Поделитесь страницей подгруппы с потенциальными заявителями. Перед подачей заявки им нужно войти в свою учётную запись.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3acec1b4a6724a65:
    english: "## Make a submission"
    translation: "## Подайте заявку"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  58f96f48b6aacf65:
    english: The submitter opens the subgroup and selects **Start discussion**. Loomio shows the subgroup's available discussion templates. The submitter selects the relevant discussion template, completes its questions, and starts the discussion.
    translation: Заявитель открывает подгруппу и выбирает **Начать обсуждение**. Loomio показывает доступные шаблоны обсуждений подгруппы. Заявитель выбирает подходящий шаблон, отвечает на вопросы и начинает обсуждение.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5a65043771edeb44:
    english: The discussion belongs to the subgroup, but the submitter does not become a subgroup member. Loomio adds them as a guest of their discussion thread, enabling them to see and participate in the discussion with the panel or review team. They cannot see other private discussions or submissions in the subgroup.
    translation: Обсуждение относится к подгруппе, но заявитель не становится её участником. Loomio добавляет заявителя как гостя этого обсуждения. Он может видеть его и участвовать в нём вместе с отборочной комиссией или группой, рассматривающей заявки. Другие закрытые обсуждения и заявки в подгруппе ему недоступны.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9338fd073b26dafc:
    english: "## Review submissions"
    translation: "## Рассмотрите заявки"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  50e33fa0f0868cf5:
    english: Subgroup members can see every submission discussion in the subgroup. They can ask follow-up questions and use comments, polls, or other discussion tools to complete their review.
    translation: Участники подгруппы видят все обсуждения с заявками. Они могут задавать уточняющие вопросы и использовать комментарии, голосования и другие инструменты обсуждения для рассмотрения заявок.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  537b76c6f85cc575:
    english: If another person needs to provide information, a subgroup member with permission can invite them to the submission discussion. For example, when a nominator submits a nomination, the subgroup can invite the nominee to the thread if their participation is required. The invited person joins as a guest without gaining access to the subgroup's other private discussions.
    translation: Если информацию должен предоставить ещё один человек, участник подгруппы с соответствующим разрешением может пригласить его в обсуждение заявки. Например, если заявитель выдвинул другого человека, подгруппа может пригласить кандидата в обсуждение, когда требуется его участие. Приглашённый человек становится гостем и не получает доступа к другим закрытым обсуждениям подгруппы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1fb7da309186b19e:
    english: Each submitter can see their own submission but cannot see the subgroup's other private discussions or submissions. Disable **Non-members can start discussions** when submissions close. Existing discussions and guest access are unchanged.
    translation: Каждый заявитель видит свою заявку, но не видит другие закрытые обсуждения и заявки в подгруппе. Когда приём заявок закончится, отключите **Участники, не являющиеся членами организации, могут начать обсуждения.** Существующие обсуждения и доступ гостей сохранятся.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
