  e8632dbb628c7c7d:
    english: "# Starting a new group"
    translation: "# Uuden ryhmän perustaminen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2a4a6907d4e2049d:
    english: If you are new to Loomio, you can start a group on a free trial at any time from the [Loomio website](https://www.loomio.com/). If you already use Loomio and would like to start a new group for another organization or purpose, you can do this from the sidebar menu - click on **New group**.
    translation: Jos olet uusi Loomion käyttäjä, voit perustaa ryhmän milloin tahansa maksuttoman kokeilujakson aikana [Loomion verkkosivustolla](https://www.loomio.com/). Jos käytät jo Loomiota ja haluat perustaa uuden ryhmän toista organisaatiota tai tarkoitusta varten, napsauta sivuvalikossa **Uusi ryhmä**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  10e8756c96038e58:
    english: For many organizations, a single Loomio group is sufficient. You can start as many subgroups as you need within the group. See [Subgroups](/en/user_manual/groups/subgroups/) for more info.
    translation: Monille organisaatioille riittää yksi Loomio-ryhmä. Voit perustaa sen sisälle niin monta alaryhmää kuin tarvitset. Lue lisää [alaryhmistä](/en/user_manual/groups/subgroups/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ed00dbe94cd53435:
    english: "## Group details"
    translation: "## Ryhmän tiedot"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0bb201e3a09fe99d:
    english: "### Group name"
    translation: "### Ryhmän nimi"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '019cdfc169ea858a':
    english: Type your group name. It's best to keep your group name short and concise.
    translation: Kirjoita ryhmäsi nimi. Pidä nimi lyhyenä ja selkeänä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6ae6b08ae7fbe257:
    english: "### Group handle"
    translation: "### Ryhmän tunnus"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b054d0f760888add:
    english: Your group is automatically assigned a handle. The handle is used in the group's URL and email address, such as **loomio.com/your-group-handle** and **your-group-handle@loomio.com**.
    translation: Ryhmällesi määritetään tunnus automaattisesti. Tunnusta käytetään ryhmän URL-osoitteessa ja sähköpostiosoitteessa, esimerkiksi **loomio.com/your-group-handle** ja **your-group-handle@loomio.com**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1dee654ba628ba95:
    english: You can edit the handle when you create the group and change it later in group settings. When you change it, links and email addresses that use the old handle continue to work. Loomio keeps up to three old handles; after that, the oldest handle expires.
    translation: Voit muokata tunnusta ryhmää perustaessasi ja vaihtaa sen myöhemmin ryhmän asetuksissa. Kun vaihdat tunnuksen, vanhaa tunnusta käyttävät linkit ja sähköpostiosoitteet toimivat edelleen. Loomio säilyttää enintään kolme vanhaa tunnusta. Sen jälkeen vanhin tunnus lakkaa toimimasta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '08496ed70144fc4d':
    english: "### Group description"
    translation: "### Ryhmän kuvaus"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1a464543c51ded45:
    english: This short description will show at the top of the dashboard, to offer any necessary context for new members.
    translation: Tämä lyhyt kuvaus näkyy yleiskatsauksen yläosassa ja antaa uusille jäsenille tarvittavat taustatiedot.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
