---
navigation_title: Kohteiden siirtäminen keskusteluketjujen välillä
blocks:
  875a42e08000fffe:
    english: "# Moving items between threads"
    translation: "# Kohteiden siirtäminen keskusteluketjujen välillä"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5c0fcd38f9276e8f:
    english: Move selected items when a conversation belongs in another thread, when one thread has split into separate topics, or when you want to combine related discussions. There is no separate **Merge discussions** command.
    translation: Siirrä valitut kohteet, kun keskustelu kuuluu toiseen ketjuun, ketju on jakautunut eri aiheisiin tai haluat yhdistää toisiinsa liittyviä keskusteluja. Erillistä **Yhdistä keskustelut** -toimintoa ei ole.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f43c7835d05a135e:
    english: The option is available to group admins and to members when **Members can manage discussions and comments** is enabled in [Group permissions](/en/user_manual/groups/settings/permissions).
    translation: Toiminto on ryhmän ylläpitäjien käytettävissä. Myös jäsenet voivat käyttää sitä, jos **Jäsenet voivat hallita keskusteluja ja kommentteja** on käytössä [ryhmän käyttöoikeuksissa](/en/user_manual/groups/settings/permissions).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  30a4e31dab983f89:
    english: Open the three-dot menu (**⋯**) on an item and select **Move item**.
    translation: Avaa kohteen kolmen pisteen valikko (**⋯**) ja valitse **Siirrä kohde**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  24fd0043effa14fb:
    english: Select the items you want to move.
    translation: Valitse kohteet, jotka haluat siirtää.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  81551cd5134f24c5:
    english: Select any additional items with the checkboxes, then click **Move** in the banner at the top of the discussion.
    translation: Valitse mahdolliset muut kohteet valintaruuduilla ja napsauta sitten keskustelun yläreunan palkista **Liikkua**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f53055845c214b05:
    english: Choose the group or subgroup, then search for the destination discussion.
    translation: Valitse ryhmä tai alaryhmä ja etsi sitten keskustelu, johon haluat siirtää kohteet.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  19bc2092ac28011b:
    english: To move the items into a new discussion, select **New discussion** and add its title and context.
    translation: Jos haluat siirtää kohteet uuteen keskusteluun, valitse **Uusi keskustelu** ja lisää sille otsikko ja taustatiedot.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '092b56e69505636f':
    english: The items are moved from the original thread into the selected or newly created thread.
    translation: Kohteet siirtyvät alkuperäisestä ketjusta valittuun tai juuri luotuun ketjuun.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  162c0d0c47ca798f:
    english: If the original thread is no longer needed, you can [lock it](/en/user_manual/discussions/using_discussions/#lock-or-unlock-a-thread). Delete it only if you are certain it will not be needed again.
    translation: Jos alkuperäistä ketjua ei enää tarvita, voit [lukita sen](/en/user_manual/discussions/using_discussions/#lock-or-unlock-a-thread). Poista se vain, jos olet varma, ettei sitä tarvita enää.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
