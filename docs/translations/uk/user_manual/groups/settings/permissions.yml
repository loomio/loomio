navigation_title: Дозволи
blocks:
  d661e5fc8cc1b460:
    english: "# Group permissions"
    translation: "# Дозволи групи"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  712830f14602c6c7:
    english: The permissions tab controls which group operations are available to ordinary members and, for non-secret groups, to non-members. Open **Edit group settings** from the group page, then select **Permissions**.
    translation: Вкладка дозволів визначає, які дії в групі доступні звичайним учасникам, а в групах, що не є секретними, — людям, які не є учасниками. На сторінці групи відкрийте **Редагувати налаштування групи**, а потім виберіть **Дозволи**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b71bf8cce1cb369c:
    english: "![Group permission settings](group_group_settings_permissions.png)"
    translation: "![Налаштування дозволів групи](group_group_settings_permissions.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  88e5fcd302a53620:
    english: Administrators retain the ability to manage the group. Enabling a member permission extends that particular action to ordinary members; it does not make them administrators.
    translation: Адміністратори зберігають можливість керувати групою. Якщо надати учасникам певний дозвіл, вони зможуть виконувати відповідну дію, але не стануть адміністраторами.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5b2b9af0f68b7a57:
    english: 'Permissions include whether members can:'
    translation: 'Дозволи визначають, чи можуть учасники:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8377b499d13690c0:
    english: |-
      - add members or invite guests;
      - send announcements;
      - create subgroups;
      - start and manage discussions;
      - create and manage tags;
      - edit or delete comments where the setting permits;
      - start proposals and polls; and
      - create discussion and poll templates.
    translation: |-
      - додавати учасників або запрошувати гостей;
      - надсилати оголошення;
      - створювати підгрупи;
      - починати обговорення та керувати ними;
      - створювати теги та керувати ними;
      - редагувати або видаляти коментарі, якщо це дозволено налаштуваннями;
      - починати обговорення пропозицій та опитування; і
      - створювати шаблони обговорень та опитувань.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  87166abe7eea1ab3:
    english: For groups that are not secret, administrators can separately allow non-members to start discussions. A non-member who starts a discussion becomes a guest of that discussion but does not gain access to other private discussions or become a group member.
    translation: У групах, що не є секретними, адміністратори можуть окремо дозволити людям, які не є учасниками, починати обговорення. Така людина стає гостем обговорення, яке розпочала, але не отримує доступу до інших приватних обговорень і не стає учасником групи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3d01d10a97636b1e:
    english: The **Admins can edit members' comments** setting gives administrators an exceptional moderation capability. Enable it only when the group has agreed that administrators should be able to alter member-authored content.
    translation: Налаштування **Адміністратори можуть редагувати коментарі учасників** надає адміністраторам особливе право модерування. Увімкніть його лише тоді, коли група погодилася, що адміністратори можуть змінювати вміст, створений учасниками.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b0af0135752a461f:
    english: Review permissions when the group's purpose, membership, or moderation responsibilities change. Give each role only the capabilities it needs.
    translation: Переглядайте дозволи, коли змінюються мета групи, склад учасників або обов’язки з модерування. Надавайте кожній ролі лише потрібні їй можливості.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
