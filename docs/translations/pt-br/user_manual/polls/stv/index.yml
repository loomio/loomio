  366f56443108e10f:
    english: "**Single Transferable Vote (STV)** is a proportional representation voting method for electing multiple winners from a field of candidates. It ensures that elected candidates proportionally represent the diversity of views among voters."
    translation: O **Voto Único Transferível (STV)** é um método de representação proporcional para eleger várias pessoas entre os candidatos. Ele permite que os eleitos representem proporcionalmente a diversidade de opiniões dos eleitores.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  61dee55b45038f56:
    english: "## When to use STV"
    translation: "## Quando usar STV"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8311dca26cec6519:
    english: 'Use an STV Election when you need to:'
    translation: 'Use uma Eleição STV quando você precisar:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1d4338734ec6e113:
    english: |-
      - Elect a **committee, board, or slate of delegates** from a pool of nominees
      - Ensure **proportional representation**, where minority factions can win seats proportional to their support
      - Run elections where voters rank candidates by preference
    translation: |-
      - Eleger um **comitê, conselho ou grupo de delegados** entre os candidatos
      - Garantir **representação proporcional**, para que grupos minoritários possam conquistar vagas conforme seu apoio
      - Realizar eleições em que os eleitores classifiquem os candidatos por ordem de preferência
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e6e1ae026f65a715:
    english: |-
      >[!NOTE]
      >STV is **not** the same as Loomio's [Rank poll](/en/user_manual/polls/rank/), which is a simpler score-based ranking for choosing a single best option. STV handles multi-winner elections with vote transfers and elimination rounds.
    translation: |-
      >[!NOTE]
      >STV **não** é a mesma coisa que a [enquete de classificação](/en/user_manual/polls/rank/) do Loomio, que usa uma pontuação mais simples para escolher uma única opção. STV permite eleger várias pessoas por meio da transferência de votos e de rodadas de eliminação.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  62af8f95f18dbafe:
    english: "## Creating an STV Election"
    translation: "## Como criar uma Eleição STV"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  edf2f36e75c81665:
    english: When starting a poll, select **STV Election** as the poll type, then add the candidates as the poll options. You can customize the poll by setting the **number of seats**, the **counting method**, and the **quota type**.
    translation: Ao iniciar uma enquete, selecione **Eleição STV** como tipo de enquete e adicione os candidatos como opções. Você pode definir o **número de lugares a preencher**, o **método de contagem** e o **tipo de cota**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b40ddcfb8cdc44fd:
    english: In this example, Oatmilk Cooperative is electing three people to oversee its returnable packaging trial. The form explains the role, lists five candidates, and uses Scottish STV with the Droop quota.
    translation: Neste exemplo, a Cooperativa Oatmilk está elegendo três pessoas para supervisionar um teste de embalagens retornáveis. O formulário explica a função, apresenta cinco candidatos e usa o método Scottish STV com a cota Droop.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a34592929349d06:
    english: "### Number of seats"
    translation: "### Número de lugares a preencher"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c09f5f51333612dc:
    english: How many winners should be elected. Must be less than the number of candidates.
    translation: Quantas pessoas serão eleitas. Esse número deve ser menor que o número de candidatos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ddceec01d910b152:
    english: "### Counting method"
    translation: "### Método de contagem"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  39e9e81a89272771:
    english: 'There are two available methods for counting the votes:'
    translation: 'Há dois métodos disponíveis para contar os votos:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a7031d1180e95273:
    english: |-
      Scottish STV
        : Recommended. The Weighted Inclusive Gregory Method (WIGM) used in Scottish local elections since 2007. Well-defined, straightforward rules. Best for most organizations.
    translation: |-
      Scottish STV
        : Recomendado. Usa o Método de Gregory Inclusivo Ponderado (WIGM), adotado nas eleições locais da Escócia desde 2007. Tem regras claras e simples. É adequado para a maioria das organizações.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1507e4fde88848dd:
    english: |-
      Meek STV
        : A more mathematically precise iterative method. When a candidate is eliminated, votes are recounted as if that candidate was never in the race.
    translation: |-
      Meek STV
        : Método iterativo com maior precisão matemática. Quando um candidato é eliminado, os votos são recontados como se ele nunca tivesse participado da eleição.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b9abcd12eef5f629:
    english: "### Quota type"
    translation: "### Tipo de cota"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6dc3aea49266d40d:
    english: 'The quota is the minimum number of votes a candidate needs to win a seat. It can be either:'
    translation: 'A cota é o número mínimo de votos de que um candidato precisa para conquistar uma vaga. Há duas opções:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  88f62f286d8c550f:
    english: |-
      Droop
        : Recommended. The standard quota type for most STV elections, and used by Ireland, Australia, and Scotland. Droop guarantees a majority coalition wins a majority of seats. It is calculated as:
      \\[ floor(\frac{votes}{(seats + 1)}) + 1 \\]
    translation: |-
      Droop
        : Recomendada. É a cota padrão na maioria das eleições STV e é usada na Irlanda, na Austrália e na Escócia. A cota Droop garante que uma coalizão com a maioria dos votos conquiste a maioria das vagas. Seu cálculo é:
      \\[ floor(\frac{votes}{(seats + 1)}) + 1 \\]
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  817b3994e92898e8:
    english: |-
      Hare
        : A higher minimum threshold, and more proportional for smaller factions.
          Hare is preferred by DSA chapters to protect minority representation.
         It is calculated as:
          \\[ \frac{votes}{seats}\\]
    translation: |-
      Hare
        : Exige um número mínimo de votos maior e oferece mais proporcionalidade a grupos menores.
          É a opção preferida por capítulos da DSA para proteger a representação de minorias.
         Seu cálculo é:
          \\[ \frac{votes}{seats}\\]
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f12065bdf5d3678e:
    english: |2-
        >[!TIP]
        > Droop will always compute to a smaller number of votes than Hare. For example, in an election with 100 votes and four seats, the Droop quota would be 21 and the Hare quota 25.
    translation: |-
      >[!TIP]
        > A cota Droop sempre resulta em um número de votos menor que a cota Hare. Por exemplo, em uma eleição com 100 votos e quatro vagas, a cota Droop seria 21 e a cota Hare seria 25.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  984516abc3cfd89b:
    english: "## How voting works"
    translation: "## Como funciona a votação"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  40e98247d87cdf27:
    english: 'In this example, Oatmilk Cooperative is electing three people to oversee the reusable packaging trial. Voters drag candidates above the line and rank them in order of preference:'
    translation: 'Neste exemplo, a Cooperativa Oatmilk está elegendo três pessoas para supervisionar um teste de embalagens reutilizáveis. Os eleitores arrastam os candidatos para cima da linha e os classificam por ordem de preferência:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f8aaa5391f05117f:
    english: |-
      - **Rank 1** = most preferred candidate
      - **Rank 2** = second choice
      - Continue ranking as many candidates as desired
    translation: |-
      - **Classificação 1** = candidato de maior preferência
      - **Classificação 2** = segunda escolha
      - Continue classificando quantos candidatos quiser
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  70bd790faf93c916:
    english: Voters are not required to rank every candidate. Unranked candidates will not receive any of that voter's support.
    translation: Os eleitores não precisam classificar todos os candidatos. Os candidatos não classificados não recebem parte alguma do apoio daquele eleitor.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d82e369c7c293a0c:
    english: |-
      ## How counting works
      The count is performed as follows:
    translation: |-
      ## Como funciona a contagem
      A contagem segue estas etapas:
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0ea01b5d531abc06:
    english: |-
      1. A **quota** is calculated (minimum votes needed to win a seat).
      2. **First preferences** are counted for each candidate.
      3. If a candidate meets the quota, they are **elected**. Their surplus votes (above the quota) are **transferred** to voters' next preferences at a fractional value.
      4. If no candidate meets the quota, the candidate with the **fewest votes is eliminated**. Their votes transfer to voters' next preferences at full value.
      5. This process repeats until all seats are filled.
    translation: |-
      1. Calcula-se uma **cota** (o número mínimo de votos necessário para conquistar uma vaga).
      2. Contam-se as **Primeiras preferências** de cada candidato.
      3. Se um candidato atingir a cota, ele é **eleito**. Seus votos excedentes (acima da cota) são **transferidos** para as próximas preferências dos eleitores com valor fracionário.
      4. Se nenhum candidato atingir a cota, o candidato com **menos votos é eliminado**. Seus votos são transferidos para as próximas preferências dos eleitores com valor integral.
      5. O processo se repete até que todas as vagas sejam preenchidas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c6f397233ad479e5:
    english: |-
      >[!TIP]
      >If a voter has ranked no remaining candidates, their ballot is "exhausted" and that vote is lost. This is why ranking more candidates is generally better.
    translation: |-
      >[!TIP]
      >Se um eleitor não classificou nenhum dos candidatos que continuam na disputa, sua cédula fica "esgotada" e esse voto deixa de ser contado. Por isso, em geral, é melhor classificar mais candidatos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
