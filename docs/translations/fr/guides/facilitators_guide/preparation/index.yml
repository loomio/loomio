---
navigation_title: Préparation
blocks:
  4fdd26e2ff6dd9e5:
    english: "# Preparation"
    translation: "# Préparation"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4fc02624e97369e9:
    english: |-
      > <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../silvia_200.png"> For every minute of time with the group, consider spending 3 minutes planning. That means spending three hours preparing for a one hour session. Only as you improve should you spend less time planning.
      >
      > — Silvia Zuur
    translation: |-
      > <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../silvia_200.png"> Pour chaque minute passée avec le groupe, envisagez de consacrer trois minutes à la préparation. Une séance d’une heure demande donc trois heures de préparation. Réduisez ce temps seulement lorsque vous aurez acquis de l’expérience.
      >
      > — Silvia Zuur
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d18832ab8f94fa1b:
    english: "## Understand Purpose"
    translation: "## Comprendre l’objectif"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  26d88950f0aac205:
    english: Clarification of purpose is one of the highest value offerings of a skilled facilitator — if they can help the group nail that, everything else is possible. Purpose operates at the level of a group as a whole, and at the level of individual discussions/decisions. Purpose is what enables judgment calls about what tools to deploy, what interventions to enact, and what outcomes to aim for. Lack of shared understanding about purpose can be fatal to a discussion, or to the group itself.
    translation: Clarifier l’objectif est l’une des contributions les plus précieuses d’une personne qui anime un groupe. Une fois l’objectif défini, le reste devient possible. Il concerne aussi bien le groupe dans son ensemble que chaque discussion ou décision. Il aide à choisir les outils, les interventions et les conclusions à viser. Sans compréhension commune de l’objectif, une discussion, voire le groupe lui-même, peut échouer.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4276182ea8afaf36:
    english: "> Always refer back to your purpose-finding questions to check that you’re covering off what the participants want to learn or achieve. — Silvia Zuur"
    translation: "> Revenez toujours aux questions qui vous ont aidé à définir l’objectif. Vérifiez que vous répondez bien à ce que les personnes participantes souhaitent apprendre ou accomplir. — Silvia Zuur"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aabfa9d842af2688:
    english: On Loomio
    translation: Sur Loomio
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ea5f19b8970e4db6:
    english: |-
      * The app offers space for explication of purpose, such as the [group description](/en/user_manual/groups/starting_a_group/#group-description) and [discussion context](/en/user_manual/discussions/using_discussions/#discussion-context) fields.
      * A Loomio discussion *about* purpose is a great place to start with your group, if it's not already clear.
      * Our analytics (stats about how people use the software) show that groups with a clear shared purpose are more successful.
      * [Customer stories and case studies](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help) we've collected emphasise the importance of setting a collective purpose.
    translation: |-
      * L’application permet de préciser l’objectif dans des champs comme la [description du groupe](/en/user_manual/groups/starting_a_group/#group-description) et le [contexte de la discussion](/en/user_manual/discussions/using_discussions/#discussion-context).
      * Si l’objectif du groupe n’est pas encore clair, commencez par une discussion *sur* cet objectif dans Loomio.
      * Nos statistiques d’utilisation montrent que les groupes qui partagent un objectif clair réussissent mieux.
      * Les [témoignages et études de cas](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help) que nous avons recueillis soulignent l’importance de définir un objectif collectif.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e7d962ee3ac4e476:
    english: "## Rearrange the Furniture"
    translation: "## Réaménager l’espace"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bee66f99abaa8e2a:
    english: Desiging the space you invite people into greatly influences their experience. Every gathering is unique, and deserves a setup to suit. Familiarity signals safety, while changing the environment cues openness to new ideas.
    translation: La façon dont vous aménagez l’espace influe beaucoup sur l’expérience des personnes que vous y invitez. Chaque rencontre est différente et mérite un cadre adapté. Un environnement familier peut rassurer, tandis qu’un changement de cadre peut favoriser de nouvelles idées.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b98fa9d3e5726891:
    english: In offline spaces, literally rearranging the furniture is a habit that helps facilitators get into the right zone to hold space, and prompts them to think about what’s unique in that session. Imagine the difference between everyone seated in rows versus everyone in a circle.
    translation: Dans un espace physique, déplacer les meubles aide les personnes qui animent à se préparer et à réfléchir aux particularités de la séance. Imaginez la différence entre des personnes assises en rangées et des personnes assises en cercle.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  546ba20d5778bb25:
    english: |-
      * Inviting people into a new digital space specifically for decision making is powerful — there’s a “threshold crossing” experience making it as distinct from other online spaces (which might be for socialising or other functions).
      * [Customising your group photo](/en/user_manual/groups/starting_a_group/#upload-a-group-photo) is a prime opportunity to craft the feeling of the space.
      * The group description is a main piece of “furniture” on the group page, and [you can customise it](/en/user_manual/groups/starting_a_group/#group-description) to suit.
    translation: |-
      * Inviter des personnes dans un nouvel espace numérique consacré à la prise de décision marque une étape. Cet espace se distingue ainsi des autres lieux en ligne, qui servent peut-être à échanger de manière informelle ou à d’autres activités.
      * [Personnaliser la photo de votre groupe](/en/user_manual/groups/starting_a_group/#upload-a-group-photo) vous permet de donner à cet espace une identité qui lui convient.
      * La description du groupe occupe une place importante sur sa page. [Vous pouvez la personnaliser](/en/user_manual/groups/starting_a_group/#group-description) selon vos besoins.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bb1d23808a93d41b:
    english: "## Supplies, Tools, Materials"
    translation: "## Fournitures, outils et documents"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b5e22b09672c3587:
    english: When facilitation is running smoothly, all the supplies a group needs are right at hand. In offline spaces, this stuff includes post-its, pens, paper, name tags, printouts, and background material. Every step a facilitator takes to be well-prepared in this way allows more time and energy for the work.
    translation: Quand l’animation se déroule bien, le groupe dispose de tout ce dont il a besoin. Dans un espace physique, cela peut comprendre des notes autocollantes, des stylos, du papier, des badges, des documents imprimés et des informations de référence. Chaque élément préparé à l’avance libère du temps et de l’énergie pour le travail du groupe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7da21174f12dfb9e:
    english: |-
      * Many groups use the group description to link to a shared drive of collaborative documents, background information, the group's project management or task tracking system, a list of contacts, etc.
      * Each thread deserves consideration of what people might need to engage with it — putting all the information right at hand is essential (for example, if you reference something, linking directly to it is much more effective than expecting people to search for it).
    translation: |-
      * Beaucoup de groupes utilisent leur description pour donner accès à un espace partagé contenant des documents collaboratifs, des informations de référence, leur outil de gestion de projet ou de suivi des tâches, une liste de contacts, etc.
      * Pour chaque fil de discussion, réfléchissez à ce dont les personnes auront besoin pour participer. Mettez les informations à leur portée : si vous mentionnez une ressource, un lien direct leur sera plus utile que de devoir la chercher.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  35dd82fcf7e543d8:
    english: "## Design the Experience"
    translation: "## Concevoir l’expérience"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fbc88dd9b9738343:
    english: 'Once they have the basic pieces in place (purpose, tools, background info), good facilitators take time to think through the design of the experience they are inviting: the situation, what success could look like, all the possible pathways and choices. They don’t jump in without a considered design.'
    translation: Une fois l’objectif, les outils et les informations de référence en place, les personnes qui animent prennent le temps de concevoir l’expérience proposée. Elles réfléchissent à la situation, à ce qui constituerait une réussite, ainsi qu’aux différents parcours et choix possibles. Elles ne se lancent pas sans préparation.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a4dce16ca48a4324:
    english: Time and time again we have seen people drastically underestimate the need for prep and design. Stop and think about the experience you want to host, before jumping straight in. Investment in design is paid back many times over by success later.
    translation: Nous constatons souvent que le temps nécessaire à la préparation et à la conception est largement sous-estimé. Avant de vous lancer, prenez le temps de réfléchir à l’expérience que vous souhaitez proposer. Ce travail porte ses fruits par la suite.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e91f002ee6e53550:
    english: "* Loomio’s most basic functionality follows the structure of good facilitation by design: invite people, discuss a topic, gather divergent input, converge into a specific proposal, test for agreement, confirm outcome."
    translation: "* Le fonctionnement de base de Loomio suit les étapes d’une bonne animation : inviter les personnes, discuter d’un sujet, recueillir des points de vue différents, formuler une proposition précise, vérifier l’accord et confirmer la conclusion."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  211e08fc109e6449:
    english: |-
      * Skilled users are already adapting Loomio for various experience designs — such as a multi-step consultation processes, signing off documents, etc. Each job, when facilitated effectively, takes a certain repeatable shape.
      * Online collaboration design doesn't have to reinvent the wheel. Trust what you know works, and translate it. Many tried and tested offline processes can be adapted to the online space (ex: the [Advice Process](/en/guides/making_decisions/advice_process.html)).
      * [Case studies](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help) of thoughtfully designed processes could be used as “recipes” — if you're not sure what design to use, start by seeing what others have tried.
    translation: |-
      * Des personnes expérimentées adaptent déjà Loomio à différents types de démarches, comme les consultations en plusieurs étapes ou la validation de documents. Chaque démarche bien animée suit une structure qui peut être réutilisée.
      * Pour concevoir une collaboration en ligne, appuyez-vous sur les méthodes qui fonctionnent déjà. De nombreuses démarches éprouvées en présentiel peuvent être adaptées en ligne, comme le [processus de consultation](/en/guides/making_decisions/advice_process.html).
      * Les [études de cas](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help) de démarches soigneusement conçues peuvent servir de modèles. Si vous ne savez pas quelle approche choisir, regardez ce que d’autres ont essayé.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7e99e2ddc63d7a98:
    english: "## Contextualise the Moment"
    translation: "## Tenir compte du contexte"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  427b66f23f4b3c09:
    english: Discussions do not occur in a vacuum, but in the larger context of the group’s history and practice. To be effective, facilitated experiences have to occur with the right timing, and fit in with the rest of the group’s process.
    translation: Une discussion s’inscrit dans l’histoire et les pratiques du groupe. Pour être efficace, une démarche animée doit intervenir au bon moment et s’intégrer au reste du travail du groupe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  48a889b09297e38b:
    english: 'Key Context Questions:'
    translation: 'Questions essentielles sur le contexte :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7eccc4a4e4a3b175:
    english: |-
      * Is this a moment of transition?
      * Is this an enhancement of existing practice?
      * Is this one of many concurrent processes, or a singular focus?
      * Are we here to solve a problem, or go deeper, wider, narrower?
    translation: |-
      * Le groupe traverse-t-il une période de transition ?
      * S’agit-il d’améliorer une pratique existante ?
      * Cette démarche fait-elle partie de plusieurs processus en cours, ou constitue-t-elle l’unique priorité ?
      * Cherchons-nous à résoudre un problème, à approfondir un sujet, à élargir la réflexion ou à la préciser ?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c7c8ce0838a076cd:
    english: |-
      * Loomio groups nearly always have a “champion”, who understands the group’s context and makes the call about whether introducing Loomio is right for them.
      * It's not wise to try to change everything at once. Any time Loomio fits nicely into existing workflows, groups will adopt it better.
      * Good timing is when the group is ready to incorporate online collaborative practice effectively. They have to feel the pain of not having the online decision-making space, and be motivated to solve that problem.
      * Consider the group’s attention economy to determine when the right time to raise a given topic might be. Collective attention is a limited resource.
      * Many groups are not even cognisant of their existing collaborative practice and habits, much less clear about how Loomio might fit in. Start with a discussion about the current way of doing things, and what's working or not working.
    translation: |-
      * Dans les groupes qui utilisent Loomio, une personne connaît presque toujours bien le contexte et peut déterminer si le moment convient pour présenter l’outil au groupe.
      * Évitez de tout changer en même temps. Les groupes adoptent plus facilement Loomio lorsqu’il s’intègre à leurs méthodes de travail existantes.
      * Le bon moment arrive lorsque le groupe est prêt à collaborer efficacement en ligne. Il doit percevoir le besoin d’un espace de décision en ligne et vouloir répondre à ce besoin.
      * Tenez compte de l’attention disponible dans le groupe pour choisir quand aborder un sujet. L’attention collective est limitée.
      * Beaucoup de groupes ne connaissent pas bien leurs propres habitudes de collaboration et ne savent pas encore quelle place Loomio pourrait y prendre. Commencez par discuter des pratiques actuelles, de ce qui fonctionne et de ce qui ne fonctionne pas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7bc2616a0ec0b1dc:
    english: "## The Role of the Facilitator"
    translation: "## Le rôle de la personne qui anime"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c6d08854a875262a:
    english: Good facilitation requires self-awareness on an individual and collective level. Lack of understanding of the role can lead to misunderstandings, conflict, or unsafe situations.
    translation: Une bonne animation demande de comprendre son propre rôle et le fonctionnement du groupe. Si ce rôle est mal compris, des malentendus, des conflits ou des situations difficiles peuvent apparaître.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aa59e3e4d08a95b7:
    english: "> Have the power handed over to you. When you’re invited into a new group or organization, everybody will be thinking: Who’s this joker? Why should we listen to them? Get somebody who the participants know and trust to introduce you. This builds you up in the participants' minds and helps to hand over the power over to you. — Silvia Zuur"
    translation: "> Faites-vous transmettre le mandat d’animer. Quand vous arrivez dans un nouveau groupe ou une nouvelle organisation, les personnes se demanderont qui vous êtes et pourquoi elles devraient vous écouter. Demandez à une personne qu’elles connaissent et en qui elles ont confiance de vous présenter. Cela vous donnera leur confiance et rendra votre rôle légitime. — Silvia Zuur"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  02d38d1def45d150:
    english: |-
      ### Consent
      It’s critical that the group consents to be facilitated. Attempting to facilitate otherwise can be at worst coercive (unfair to the group) and dangerous (unfair to the facilitator) — and will face resistance and confusion. Facilitators put themselves in a vulnerable position; they must have mandate or they should not agree to engage. Consent is critical for both the facilitator and participants.
    translation: |-
      ### Consentement
      Il est essentiel que le groupe accepte d’être accompagné par une personne qui anime. Sans cet accord, l’animation peut devenir contraignante pour le groupe et risquée pour cette personne. Elle risque aussi de susciter de la résistance et de la confusion. La personne qui anime se place dans une position vulnérable : elle doit avoir un mandat, ou refuser ce rôle. Le consentement protège à la fois le groupe et la personne qui anime.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a1a8c6ca89dad49a:
    english: |-
      ### Responsibility
      Once a facilitator takes up a mandate, they carry enhanced responsibilities. Facilitators have more claim to floor time, and directing the group’s attention. This has to be used in service to the whole, not for a personal agenda. The words and demeanor of the facilitator will also have a disproportionate effect, meaning they have to act with heightened consideration.
    translation: |-
      ### Responsabilité
      Lorsqu’une personne accepte un mandat d’animation, elle assume des responsabilités supplémentaires. Elle peut prendre davantage la parole et orienter l’attention du groupe. Elle doit exercer ce rôle au service de l’ensemble du groupe, sans poursuivre un objectif personnel. Ses paroles et son attitude ont aussi une influence particulière. Elle doit donc agir avec une attention accrue.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b5f6b4ebd477c97c:
    english: |-
      ### Power
      Facilitation by nature introduces power differentials. If the facilitator cannot exercise power in certain ways, they cannot do their job. For example, to keep a discussion on topic the facilitator might interrupt someone, or say that a certain way of interacting is not OK. It’s not appropriate to expect a facilitator to shoulder responsibility for the experience without giving them the powers they need to deliver successfully. There is no one right answer about how much power, but it has to be balanced with the level of responsibility.
    translation: |-
      ### Pouvoir
      L’animation crée nécessairement des différences de pouvoir. Pour remplir son rôle, la personne qui anime doit pouvoir exercer une certaine autorité. Par exemple, elle peut interrompre quelqu’un pour recentrer la discussion ou signaler qu’une manière d’interagir ne convient pas. On ne peut pas lui confier la responsabilité de la démarche sans lui donner les moyens de la mener à bien. Il n’existe pas de degré de pouvoir idéal, mais celui-ci doit correspondre au niveau de responsabilité confié.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c82df3fe42db014a:
    english: |-
      ### Responsiveness
      Facilitators do their best work when they can adapt effectively to the emergent reality. Human beings are endlessly complex, and groups of them exponentially more so. Rigid adherence to a plan or protocol without flexibility can set the group up to fail. If a facilitator is not allowed or not willing to adapt to changing circumstance, they cannot effectively hold the space for dynamic humans.
    translation: |-
      ### Capacité d’adaptation
      Les personnes qui animent travaillent mieux lorsqu’elles peuvent s’adapter à ce qui se passe. Les êtres humains sont complexes, et les groupes le sont encore davantage. Suivre un plan ou un protocole de façon rigide peut empêcher le groupe d’avancer. Si la personne qui anime ne peut pas ou ne veut pas s’adapter aux changements de situation, elle ne peut pas accompagner efficacement le groupe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aad36b296834ab22:
    english: "> Wear and un-wear the facilitation-hat. A challenge many people face is trying to facilitate meetings and workshops with their own team. As a facilitator, they need to be neutral. But as a team member, they have valuable insights to share. Make it really clear when you’re a facilitator and when you’re being a participant. — Silvia Zuur"
    translation: "> Sachez quand prendre et quitter votre rôle d’animation. Beaucoup de personnes animent des réunions ou des ateliers avec leur propre équipe. Dans le rôle d’animation, elles doivent rester neutres. Comme membres de l’équipe, elles ont aussi des idées utiles à partager. Indiquez clairement quand vous animez et quand vous participez. — Silvia Zuur"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  85c4fcf7a6e72361:
    english: |-
      * Many groups using Loomio are experienced with facilitation and already have a shared understanding of the role. They already adapt the tool to meet these needs with some success.
      * Often the person who starts a discussion is assumed to be facilitating it, barring another agreed understanding in the group. Clarity about who is facilitating can greatly enhance mutual safety and success.
      * Loomio naturally creates a dynamic and open to distributed acts of facilitation, such as users tagging in others, requests to stay on topic, suggestions of the right timing for a proposal, etc — but this is often left implicit. Explicitly naming what acts of facilitation are and discussing whether this role is centralised or distributed can clarify the role.
      * Implicit distributed facilitation can be the default starting place for an online group (ie, no discussion of facilitation as a named role), but that setup is actually best for advanced groups prgressing past working with explicit facilitation.
    translation: |-
      * Beaucoup de groupes qui utilisent Loomio ont déjà l’habitude de l’animation et partagent une compréhension de ce rôle. Ils adaptent déjà l’outil à leurs besoins.
      * Souvent, le groupe suppose que la personne qui lance une discussion l’anime, sauf s’il en a convenu autrement. Définir clairement qui anime renforce la confiance mutuelle et aide la discussion à avancer.
      * Loomio permet naturellement à plusieurs personnes de contribuer à l’animation : elles peuvent inviter d’autres personnes dans la discussion, demander de rester sur le sujet ou suggérer le bon moment pour faire une proposition. Ce rôle reste toutefois souvent implicite. Nommer ces actions et discuter de la répartition de ce rôle aide à le clarifier.
      * Un groupe en ligne peut commencer avec une animation répartie de façon implicite, sans discussion sur ce rôle. Cette formule convient surtout aux groupes expérimentés qui ont déjà pratiqué une animation aux responsabilités clairement définies.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
