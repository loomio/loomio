navigation_title: Data exporteren
blocks:
  '053719812e2be1ea':
    english: "# Group data backup or export"
    translation: "# Groepsgegevens bewaren of exporteren"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  42721518a91907da:
    english: 'With the group data export feature you can:'
    translation: 'Met de functie voor het exporteren van groepsgegevens kun je:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f978c97e52e0b00a:
    english: |-
      - Download a file containing member data to audit group membership.
      - Download content of your group including text of threads and polls for archive or analysis.
      - Open poll results in a spreadsheet or scripting language.
      - [Print or save PDF's of a thread or poll for archival purposes.](#print-thread-to-pdf)
      - Move your group, including all users, threads, polls, and files to another Loomio server.
    translation: |-
      - Een bestand met ledengegevens downloaden om het groepslidmaatschap te controleren.
      - De inhoud van je groep downloaden, waaronder de tekst van discussies en peilingen, voor archivering of analyse.
      - Peilingresultaten openen in een spreadsheet of programmeertaal.
      - [Een discussie of peiling afdrukken of als pdf opslaan voor archivering.](#print-thread-to-pdf)
      - Je groep, inclusief alle gebruikers, discussies, peilingen en bestanden, verplaatsen naar een andere Loomio-server.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  94b3081b62cd0a45:
    english: If you ever want to move from Loomio managed servers [to your own](https://github.com/loomio/loomio), you can use this feature.
    translation: Als je van een door Loomio beheerde server [naar je eigen server](https://github.com/loomio/loomio) wilt verhuizen, kun je deze functie gebruiken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  223d5690921676c4:
    english: If you're running your own Loomio server, and would rather not anymore, Loomio offer managed hosting in USA, EU and Australia. If you'd like to migrate your group to one of these servers, please [contact us](/contact).
    translation: Als je je eigen Loomio-server niet meer wilt beheren, kun je gebruikmaken van Loomio-hosting in de VS, de EU of Australië. Wil je je groep naar een van deze servers verplaatsen? [Neem contact met ons op](/contact).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cabd4ab01146ea7c:
    english: "[Contact us](/contact) if you would like to transfer your Loomio group from Loomio's global hosted service at loomio.com to one of our regional services; loomio.eu for Europe or loomio.nz for Australia and New Zealand."
    translation: "[Neem contact met ons op](/contact) als je je Loomio-groep wilt verplaatsen van Loomio's wereldwijde hostingdienst op loomio.com naar een van onze regionale diensten: loomio.eu voor Europa of loomio.nz voor Australië en Nieuw-Zeeland."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
