  7cf7aa3423ff6b9d:
    english: Rank finds the group's overall order of preference. Participants arrange options from most to least preferred, and Loomio assigns more points to higher-ranked options.
    translation: A classificação mostra a ordem geral de preferência do grupo. Os participantes organizam as opções da mais para a menos preferida, e o Loomio atribui mais pontos às opções colocadas nas primeiras posições.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72790fdf21d1f129:
    english: "## When to use Rank"
    translation: "## Quando usar a classificação"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f9ce50752bf1c1e7:
    english: 'Use Rank when preference order matters and you want one overall ordering. It works well for:'
    translation: 'Use a classificação quando a ordem de preferência for importante e você quiser uma lista ordenada. Ela funciona bem para:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a5c8ee257df4dc2:
    english: |-
      - selecting one candidate for a position;
      - ordering projects for a work plan;
      - prioritizing conference topics;
      - choosing backup options as well as a first choice; or
      - reducing a long list to an ordered shortlist.
    translation: |-
      - selecionar uma pessoa para um cargo;
      - ordenar projetos para um plano de trabalho;
      - priorizar temas de uma conferência;
      - escolher alternativas além da primeira opção; ou
      - reduzir uma lista longa a uma seleção ordenada.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2549ddaa8a4a4fa8:
    english: Rank uses a points-based ordering. It is not a proportional election method. To elect several people while representing different groups of voters, use an [STV Election](/en/user_manual/polls/stv/).
    translation: A classificação ordena as opções por pontos. Ela não é um método de eleição proporcional. Para eleger várias pessoas com representação de diferentes grupos de eleitores, use uma [Eleição STV](/en/user_manual/polls/stv/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2a859bf73143ce12:
    english: "## Example: rank bottle designs"
    translation: "## Exemplo: classificar modelos de garrafa"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  46a7d343d3b48bea:
    english: Oatmilk Cooperative asks members to rank four bottle designs for its returnable-bottle trial. Participants consider handling, durability, customer needs, storage, and compatibility with the washing equipment.
    translation: A Cooperativa Oatmilk pede aos membros que classifiquem quatro modelos de garrafa para testar o uso de garrafas retornáveis. Os participantes consideram o manuseio, a durabilidade, as necessidades dos clientes, o armazenamento e a compatibilidade com o equipamento de lavagem.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c74ebb16f872b3c6:
    english: "## Set up the poll"
    translation: "## Configure a enquete"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5975d0fd35ec0a7c:
    english: State what the ranking will determine and add the options. Set **Number of choices** to control how many options each person may rank. A first choice receives the most points, the next choice receives one fewer, and unranked options receive no points.
    translation: Explique o que a classificação determinará e adicione as opções. Defina **Número de escolhas** para controlar quantas opções cada pessoa pode classificar. A primeira escolha recebe mais pontos, a seguinte recebe um ponto a menos, e as opções não classificadas não recebem pontos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  47f32c81e29fa3c6:
    english: Require all options to be ranked when you need a complete ordering. Allow fewer choices when participants may not know enough to rank everything. Showing options in random order can reduce the influence of their initial presentation.
    translation: Exija que todas as opções sejam classificadas quando precisar de uma ordem completa. Permita menos escolhas quando os participantes talvez não tenham informações suficientes para classificar todas as opções. Exibir as opções em ordem aleatória pode reduzir a influência da ordem em que aparecem inicialmente.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Vote"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  53946361c36775f0:
    english: Participants drag the options into their preferred order, with number 1 as the first choice. They can add a reason explaining the criteria behind their ranking.
    translation: Os participantes arrastam as opções para colocá-las em sua ordem de preferência, com o número 1 para a primeira escolha. Eles podem acrescentar uma justificativa para os critérios usados na classificação.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eae63303cb9dced6:
    english: In this example, the voter puts the **500 ml amber bottle** first and the **500 ml clear bottle** second because both fit the existing cafe storage and washing equipment.
    translation: Neste exemplo, a pessoa coloca a **garrafa âmbar de 500 ml** em primeiro lugar e a **garrafa transparente de 500 ml** em segundo, porque ambas cabem no espaço de armazenamento do café e são compatíveis com o equipamento de lavagem existente.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Leia os resultados"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6be27268f870dc3e:
    english: 'The results combine all ballots into an overall points-based ranking. For each option they show:'
    translation: 'Os resultados combinam todos os votos em uma classificação geral por pontos. Para cada opção, eles mostram:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  88b912ae1b9787bc:
    english: |-
      - **Rank**: its position in the combined result;
      - **% of points**: its share of all ranking points;
      - **Points**: the total points from all ballots;
      - **Mean**: its average points per voter; and
      - **Voters**: how many people ranked it.
    translation: |-
      - **Classificação**: sua posição no resultado combinado;
      - **% de pontos**: sua parcela de todos os pontos atribuídos;
      - **Pontos**: o total de pontos recebidos em todos os votos;
      - **Significar**: sua média de pontos por eleitor; e
      - **Eleitores**: quantas pessoas a classificaram.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2e0cda6f79f31a51:
    english: In this example, the **500 ml amber bottle** ranks first, followed by the **500 ml clear bottle** and the **750 ml amber bottle**. The group can investigate the preferred design first while retaining the remaining order as a sequence of alternatives.
    translation: Neste exemplo, a **garrafa âmbar de 500 ml** fica em primeiro lugar, seguida pela **garrafa transparente de 500 ml** e pela **garrafa âmbar de 750 ml**. O grupo pode avaliar primeiro o modelo preferido e usar a ordem restante como sequência de alternativas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  22df687a6fa02ddb:
    english: A points-based result can conceal different preference patterns that produce the same total. Review individual ballots and vote reasons when options are close or the decision is consequential.
    translation: Um resultado baseado em pontos pode ocultar padrões de preferência diferentes que levam ao mesmo total. Examine os votos individuais e suas justificativas quando as opções tiverem resultados próximos ou a decisão tiver consequências importantes.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
