  d370759001be4e21:
    english: Polls collect selections, scores, allocations, rankings, availability, or election ballots. Choose the voting method based on what participants need to express and how you intend to use the result. Use a [Proposal](/en/user_manual/polls/proposals/) when people need to respond to a statement or course of action.
    translation: Kyselyissä osallistujat voivat valita vaihtoehtoja, antaa pisteitä, jakaa pisteitä vaihtoehtojen kesken, asettaa vaihtoehtoja järjestykseen, ilmoittaa saatavuutensa tai äänestää vaaleissa. Valitse äänestystapa sen mukaan, mitä osallistujien pitää ilmaista ja miten aiot käyttää tulosta. Käytä [ehdotusta](/en/user_manual/polls/proposals/), kun haluat osallistujien ottavan kantaa väitteeseen tai toimintatapaan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1132ff680c7b2562:
    english: "## Simple poll"
    translation: "## Yksinkertainen kysely"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6b957bf5630c1470:
    english: "[Choose](/en/user_manual/polls/choose/) lets participants select one or more options. Use it to find the most popular option or make a shortlist."
    translation: "[Valitse](/en/user_manual/polls/choose/) antaa osallistujien valita yhden tai useamman vaihtoehdon. Käytä sitä suosituimman vaihtoehdon löytämiseen tai vaihtoehtojen karsimiseen."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c982974685e1b5d6:
    english: "## Score poll"
    translation: "## Pistekysely"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fbbfe14196388606:
    english: "[Score](/en/user_manual/polls/score/) lets participants rate every option on the same scale. Use it to compare the strength of support, readiness, suitability, or importance across options."
    translation: "[Pisteet](/en/user_manual/polls/score/) antaa osallistujien arvioida jokaisen vaihtoehdon samalla asteikolla. Käytä sitä vaihtoehtojen kannatuksen, valmiuden, sopivuuden tai tärkeyden vertailuun."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0465fcb48a56ca78:
    english: "## Dot vote"
    translation: "## Pisteäänestys"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ffb7d1711a5fca3b:
    english: "[Allocate](/en/user_manual/polls/allocate/) gives each participant a fixed budget of points to distribute. Use it to identify priorities when choosing one thing means giving less attention or resources to another."
    translation: "[Kohdista](/en/user_manual/polls/allocate/) antaa jokaiselle osallistujalle tietyn määrän pisteitä jaettavaksi vaihtoehtojen kesken. Käytä sitä tärkeimpien vaihtoehtojen tunnistamiseen, kun yhden vaihtoehdon valinta jättää vähemmän huomiota tai resursseja muille."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a1b15c28fbe526f6:
    english: "## Ranked choice"
    translation: "## Vaihtoehtojen järjestäminen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8811f455b7ab3821:
    english: "[Rank](/en/user_manual/polls/rank/) lets participants arrange options in order of preference. Use it to find the group's overall preferred order or select one leading option."
    translation: "[Sijoitus](/en/user_manual/polls/rank/) antaa osallistujien asettaa vaihtoehdot mieluisuusjärjestykseen. Käytä sitä ryhmän suosiman järjestyksen tai yhden suosituimman vaihtoehdon löytämiseen."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2e21bb1b54b6fcf9:
    english: "## Time poll"
    translation: "## Aikakysely"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb768f07eb0d1971:
    english: "[Time poll](/en/user_manual/polls/meeting_polls/) lets participants indicate when they are available. Use it to schedule a meeting or event across time zones."
    translation: "[Aikakysely](/en/user_manual/polls/meeting_polls/) antaa osallistujien ilmoittaa, milloin heille sopii. Käytä sitä kokouksen tai tapahtuman aikatauluttamiseen myös eri aikavyöhykkeillä oleville osallistujille."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6333ad0ee6d54609:
    english: "## STV Election"
    translation: "## STV-vaalit"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6f93c6ad598d809c:
    english: "[STV Elections](/en/user_manual/polls/stv/) let participants rank candidates in a proportional, multi-winner election. Use STV to elect a committee, board, or group of delegates."
    translation: "[STV-vaaleissa](/en/user_manual/polls/stv/) osallistujat asettavat ehdokkaat järjestykseen suhteellisessa vaalissa, jossa valitaan useita voittajia. Käytä STV-vaalia toimikunnan, hallituksen tai edustajaryhmän valitsemiseen."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6752a750a7703b58:
    english: "## Other specialized method"
    translation: "## Muu erityinen menetelmä"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '099449b0e1fe4f85':
    english: Loomio also includes a Question round for collecting questions without voting. Group administrators can make it available from [Poll templates](/en/user_manual/polls/poll_templates/).
    translation: Loomiossa on myös kysymyskierros, jolla voi kerätä kysymyksiä ilman äänestystä. Ryhmän ylläpitäjät voivat ottaa sen käyttöön [kyselypohjista](/en/user_manual/polls/poll_templates/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
