navigation_title: Rangsorolás
blocks:
  92702560a3786c85:
    english: "# Rank"
    translation: "# Rangsorolás"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7cf7aa3423ff6b9d:
    english: Rank finds the group's overall order of preference. Participants arrange options from most to least preferred, and Loomio assigns more points to higher-ranked options.
    translation: A rangsorolás megmutatja a csoport közös preferencia-sorrendjét. A résztvevők a lehetőségeket a leginkább kedvelttől a legkevésbé kedveltig rendezik. A Loomio több pontot ad az előrébb sorolt lehetőségeknek.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72790fdf21d1f129:
    english: "## When to use Rank"
    translation: "## Mikor használd a rangsorolást"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f9ce50752bf1c1e7:
    english: 'Use Rank when preference order matters and you want one overall ordering. It works well for:'
    translation: 'Akkor használd a rangsorolást, ha számít a preferenciák sorrendje, és egy közös sorrendet szeretnél kapni. Például ezekre alkalmas:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a5c8ee257df4dc2:
    english: |-
      - selecting one candidate for a position;
      - ordering projects for a work plan;
      - prioritizing conference topics;
      - choosing backup options as well as a first choice; or
      - reducing a long list to an ordered shortlist.
    translation: |-
      - egy jelölt kiválasztása egy tisztségre;
      - projektek sorrendjének meghatározása egy munkatervhez;
      - konferenciatémák fontossági sorrendjének meghatározása;
      - tartalék lehetőségek kiválasztása az első választás mellett; vagy
      - egy hosszú lista leszűkítése sorrendbe állított lehetőségekre.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2549ddaa8a4a4fa8:
    english: Rank uses a points-based ordering. It is not a proportional election method. To elect several people while representing different groups of voters, use an [STV Election](/en/user_manual/polls/stv/).
    translation: A rangsorolás pontok alapján állítja sorba a lehetőségeket. Nem arányos választási módszer. Ha több embert szeretnél megválasztani úgy, hogy a szavazók különböző csoportjai is képviseletet kapjanak, használd az [STV-választást](/en/user_manual/polls/stv/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2a859bf73143ce12:
    english: "## Example: rank bottle designs"
    translation: "## Példa: palacktervek rangsorolása"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  46a7d343d3b48bea:
    english: Oatmilk Cooperative asks members to rank four bottle designs for its returnable-bottle trial. Participants consider handling, durability, customer needs, storage, and compatibility with the washing equipment.
    translation: Az Oatmilk Cooperative arra kéri a tagjait, hogy rangsoroljanak négy palacktervet a visszaváltható palackok kipróbálásához. A résztvevők mérlegelik a palackok kezelhetőségét, tartósságát, a vásárlói igényeket, a tárolást és a mosóberendezéssel való kompatibilitást.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c74ebb16f872b3c6:
    english: "## Set up the poll"
    translation: "## A szavazás beállítása"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5975d0fd35ec0a7c:
    english: State what the ranking will determine and add the options. Set **Number of choices** to control how many options each person may rank. A first choice receives the most points, the next choice receives one fewer, and unranked options receive no points.
    translation: Írd le, miről dönt a rangsorolás, és add meg a lehetőségeket. A **Választási lehetőségek száma** beállítással határozd meg, hány lehetőséget rangsorolhat egy résztvevő. Az első helyre tett lehetőség kapja a legtöbb pontot, a következő eggyel kevesebbet, a rangsorolatlan lehetőségek pedig nem kapnak pontot.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  47f32c81e29fa3c6:
    english: Require all options to be ranked when you need a complete ordering. Allow fewer choices when participants may not know enough to rank everything. Showing options in random order can reduce the influence of their initial presentation.
    translation: Ha teljes sorrendre van szükséged, kérd az összes lehetőség rangsorolását. Engedj meg kevesebb választást, ha a résztvevők esetleg nem tudnak minden lehetőséget megítélni. A lehetőségek véletlenszerű sorrendben való megjelenítése csökkentheti a kezdeti sorrendjük hatását.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Szavazás"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  53946361c36775f0:
    english: Participants drag the options into their preferred order, with number 1 as the first choice. They can add a reason explaining the criteria behind their ranking.
    translation: A résztvevők húzással állítják a lehetőségeket a kívánt sorrendbe. Az 1-es jelöli az első választást. Indoklást is hozzáadhatnak, amelyben leírják, milyen szempontok alapján rangsoroltak.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eae63303cb9dced6:
    english: In this example, the voter puts the **500 ml amber bottle** first and the **500 ml clear bottle** second because both fit the existing cafe storage and washing equipment.
    translation: Ebben a példában a szavazó az **500 ml-es borostyánszínű palackot** teszi az első, az **500 ml-es átlátszó palackot** pedig a második helyre, mert mindkettő elfér a kávézó meglévő tárolóhelyén, és kompatibilis a mosóberendezéssel.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Az eredmények értelmezése"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6be27268f870dc3e:
    english: 'The results combine all ballots into an overall points-based ranking. For each option they show:'
    translation: 'Az eredmények az összes szavazatot egy közös, pontokon alapuló sorrenddé összesítik. Minden lehetőségnél megjelenik:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  88b912ae1b9787bc:
    english: |-
      - **Rank**: its position in the combined result;
      - **% of points**: its share of all ranking points;
      - **Points**: the total points from all ballots;
      - **Mean**: its average points per voter; and
      - **Voters**: how many people ranked it.
    translation: |-
      - **Rang**: a lehetőség helye az összesített eredményben;
      - **Pontok %-a**: az összes rangsorolási pontból való részesedése;
      - **Pont**: az összes szavazatból kapott pontok száma;
      - **Átlagos**: a szavazónként kapott pontok átlaga; és
      - **Szavazók**: hányan rangsorolták a lehetőséget.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2e0cda6f79f31a51:
    english: In this example, the **500 ml amber bottle** ranks first, followed by the **500 ml clear bottle** and the **750 ml amber bottle**. The group can investigate the preferred design first while retaining the remaining order as a sequence of alternatives.
    translation: Ebben a példában az **500 ml-es borostyánszínű palack** kerül az első helyre, ezt az **500 ml-es átlátszó palack** és a **750 ml-es borostyánszínű palack** követi. A csoport először a legkedveltebb tervet vizsgálhatja meg, a többi lehetőség sorrendjét pedig megtarthatja tartalékként.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  22df687a6fa02ddb:
    english: A points-based result can conceal different preference patterns that produce the same total. Review individual ballots and vote reasons when options are close or the decision is consequential.
    translation: A pontokon alapuló eredmény elfedhet eltérő preferenciákat, amelyek ugyanannyi pontot eredményeznek. Ha a lehetőségek eredménye közel van egymáshoz, vagy a döntésnek jelentős következményei vannak, nézd át az egyes szavazatokat és az indoklásokat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
