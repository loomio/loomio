  519237662235d020:
    english: |-
      ### Actions per user
      Understand who are the most and least active contributors in your group.
    translation: |-
      ### Aktionen pro Person
      Sieh dir an, wer sich in deiner Gruppe am meisten und am wenigsten beteiligt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b538bd1f65e69d28:
    english: This table shows how many threads, comments, polls, votes and reactions each user in the specified groups was responsible for during the time frame. Click specific headings in the table to sort the table by that column.
    translation: Die Tabelle zeigt, wie viele Diskussionen, Kommentare, Umfragen, Stimmen und Reaktionen jede Person in den ausgewählten Gruppen im festgelegten Zeitraum beigetragen hat. Klicke auf eine Spaltenüberschrift, um die Tabelle nach dieser Spalte zu sortieren.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7d416ad780b3ca85:
    english: Turn on **Delegates only** to show people who are currently delegates in any of the selected groups. Their activity and voting record are aggregated across all selected groups, and delegates with no activity during the selected period remain in the table. The CSV download uses the same filter.
    translation: Aktiviere **Nur Delegierte**, um Personen anzuzeigen, die derzeit in mindestens einer der ausgewählten Gruppen delegiert sind. Ihre Aktivitäten und abgegebenen Stimmen werden über alle ausgewählten Gruppen zusammengefasst. Delegierte ohne Aktivität im ausgewählten Zeitraum bleiben in der Tabelle. Für den CSV-Download gilt derselbe Filter.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
