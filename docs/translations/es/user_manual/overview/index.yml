  7c8501ecb12311af:
    english: "## How Loomio works"
    translation: "## Cómo funciona Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  74caca2261c15283:
    english: 'Loomio has three main parts: groups, discussions, and polls.'
    translation: 'Loomio tiene tres partes principales: grupos, discusiones y sondeos.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5f0a46926a0f7350:
    english: "### Groups"
    translation: "### Grupos"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2060a64d0fabc6d7:
    english: A group is a place for an organization, team, or community to work together. Its home page explains the group's purpose and provides access to its discussions, polls, members, and files.
    translation: Un grupo es un espacio donde una organización, un equipo o una comunidad puede trabajar en conjunto. Su página de inicio explica el propósito del grupo y da acceso a sus discusiones, sondeos, integrantes y archivos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  311793a17709182c:
    english: "### Discussions"
    translation: "### Discusiones"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  05ecdffe6c18a1df:
    english: Discussions keep the information and conversation about a topic together. People can share context, comment, reply, react, and use polls to move the discussion towards an outcome.
    translation: Las discusiones reúnen la información y las conversaciones sobre un tema. Las personas pueden compartir contexto, comentar, responder, reaccionar y usar sondeos para avanzar hacia una conclusión.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dc9a50d7f1f20c80:
    english: Over time, discussions create a searchable record of the information considered and the decisions made by your group.
    translation: Con el tiempo, las discusiones crean un registro consultable de la información considerada y las decisiones tomadas por tu grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3448194e8a2ce09d:
    english: "### Polls and proposals"
    translation: "### Sondeos y propuestas"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4ef7092f5f56e773:
    english: Polls help a group understand preferences, gather advice, and make decisions. Different poll templates support different processes. A proposal asks people to respond to a suggested course of action and explain the reason for their response.
    translation: Los sondeos ayudan a un grupo a conocer preferencias, recoger consejos y tomar decisiones. Las distintas plantillas de sondeo permiten seguir distintos procesos. Una propuesta invita a las personas a responder a una acción sugerida y explicar los motivos de su respuesta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  51ab039bc7c374bd:
    english: Polls can be part of a discussion or run independently from the **Polls** tab on a group page.
    translation: Los sondeos pueden formar parte de una discusión o realizarse por separado desde la pestaña **Sondeos** de la página de un grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
