---
navigation_title: Шаблоны абмеркаванняў
blocks:
  80c5dfc46bb963d2:
    english: "# Discussion templates"
    translation: "# Шаблоны абмеркаванняў"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  488fbd5167707cba:
    english: Discussion templates help your group start discussions the same way each time. A template can supply a title, context, tags, and instructions for the person starting the discussion. It also sets defaults, such as whether to notify the whole group and which polls to suggest.
    translation: 'Шаблоны дапамагаюць вашай групе кожны раз пачынаць абмеркаванні аднолькава. Шаблон можа задаваць назву, кантэкст, тэгі і інструкцыі для тых, хто пачынае абмеркаванне. Ён таксама задае налады па змаўчанні: напрыклад, ці апавяшчаць усю групу і якія апытанні прапаноўваць.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2571bc9cc405d927:
    english: Every new discussion in a group starts from a template. When someone selects **Start discussion**, Loomio shows the group's templates. Even **Blank template** is a template, so your group can change its defaults too.
    translation: Кожнае новае абмеркаванне ў групе пачынаецца з шаблону. Калі выбраць **Пачаць абмеркаванне**, Loomio пакажа шаблоны групы. Нават **Пусты шаблон** — гэта шаблон, таму ваша група можа змяніць і яго налады па змаўчанні.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  834ac31697ef254b:
    english: Templates work well for processes your group repeats, such as project reviews, advice processes, meeting preparation, funding decisions, or document approvals. The person starting the discussion can still edit everything before they start it.
    translation: 'Шаблоны падыходзяць для працэсаў, якія ваша група паўтарае: разгляду праектаў, збору парад, падрыхтоўкі да сустрэч, прыняцця рашэнняў аб фінансаванні або зацвярджэння дакументаў. Перад пачаткам абмеркавання можна змяніць усё, што запоўніў шаблон.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  74d1c850f63c0518:
    english: "## How templates are used"
    translation: "## Як выкарыстоўваюцца шаблоны"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6e5927441d982c01:
    english: |-
      1. A member selects **Start discussion** on the group page.
      2. Loomio lists the group's visible templates. Each one shows its title and subtitle.
      3. The member selects a template. Loomio opens the new discussion form, filled in from the template.
      4. The template's help appears at the top of the form as guidance.
      5. The member edits the title, context, tags, and invite list, then selects **Start discussion**.
    translation: |-
      1. На старонцы групы ўдзельнікі выбіраюць **Пачаць абмеркаванне**.
      2. Loomio паказвае бачныя шаблоны групы. Для кожнага паказваюцца назва і падзагаловак.
      3. Пасля выбару шаблону Loomio адкрывае форму новага абмеркавання, запоўненую паводле шаблону.
      4. Уверсе формы з'яўляюцца інструкцыі з шаблону.
      5. Можна змяніць назву, кантэкст, тэгі і спіс запрошаных, а затым выбраць **Пачаць абмеркаванне**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  464984a60c23366b:
    english: Changing a template affects only discussions started after the change. Discussions already started from it keep their content and settings.
    translation: Змена шаблону ўплывае толькі на абмеркаванні, пачатыя пасля гэтай змены. Абмеркаванні, пачатыя раней, захоўваюць свой змест і налады.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  70c22d24ec0d248b:
    english: "## Choose who is notified by default"
    translation: "## Выберыце, каго апавяшчаць па змаўчанні"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  77feebf56c2ee9a7:
    english: 'The **Invite** setting controls who the new discussion form invites by default. It has two options:'
    translation: 'Налада **Запрасіць** вызначае, каго форма новага абмеркавання запрашае па змаўчанні. Ёсць два варыянты:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6c93f4222436028f:
    english: |-
      - **Everyone in the group**: the group appears in the discussion form's **Invite** field, and every member is notified when the discussion starts.
      - **None**: the **Invite** field starts empty. Nobody is notified unless the author adds people.
    translation: |-
      - **Усе ў групе**: група з'яўляецца ў полі **Запрасіць**, і пры пачатку абмеркавання ўсе ўдзельнікі групы атрымліваюць апавяшчэнне.
      - **Няма**: поле **Запрасіць** спачатку пустое. Ніхто не атрымае апавяшчэнне, пакуль у спіс не дададуць людзей.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  17cca49613fff23d:
    english: Loomio's built-in templates, including **Blank template**, use **Everyone in the group**. If your group does not want every new discussion to notify all members, edit the templates your group uses and set **Invite** to **None**.
    translation: Убудаваныя шаблоны Loomio, у тым ліку **Пусты шаблон**, выкарыстоўваюць варыянт **Усе ў групе**. Калі ваша група не хоча апавяшчаць усіх удзельнікаў пра кожнае новае абмеркаванне, адрэдагуйце шаблоны, якімі яна карыстаецца, і выберыце **Няма** ў наладзе **Запрасіць**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5fd184e64e0605bc:
    english: The author can always change the invite list before starting the discussion. They can remove the group to notify nobody, or add specific people instead. This setting only affects notifications. Group members can still find and read the discussion in the group, whichever option you choose.
    translation: 'Перад пачаткам абмеркавання спіс запрошаных заўсёды можна змяніць: прыбраць групу, каб нікога не апавяшчаць, або дадаць асобных людзей. Гэта налада ўплывае толькі на апавяшчэнні. Удзельнікі групы ўсё роўна могуць знайсці і прачытаць абмеркаванне ў групе незалежна ад выбранага варыянту.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  58f24313ca36c890:
    english: The group is added to the invite list only when the author is allowed to notify the whole group. Admins can always do this. Members can do it when **Members can notify everyone in the group** is enabled in the group's permissions.
    translation: Група дадаецца ў спіс запрошаных, толькі калі тым, хто пачынае абмеркаванне, дазволена апавяшчаць усю групу. Адміністратары могуць рабіць гэта заўсёды. Удзельнікі могуць рабіць гэта, калі ў дазволах групы ўключана налада **Удзельнікі могуць апавясціць усіх у групе**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  33afd174376e933b:
    english: "## Template settings"
    translation: "## Налады шаблону"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b02be20543f228a7:
    english: 'Group admins can edit a template from the action menu beside it in the template list. The form has these settings:'
    translation: 'Адміністратары групы могуць адрэдагаваць шаблон праз меню дзеянняў побач з ім у спісе шаблонаў. У форме ёсць такія налады:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f2fc57fe20100911:
    english: |-
      - **Template title**: the short name shown in the template list.
      - **Template subtitle**: one line explaining when to use the template.
      - **Template help**: instructions shown at the top of the new discussion form. Use it to explain the process and link to resources. It is not part of the discussion.
      - **Group**: whether the template starts a discussion in the group or a direct discussion. A direct discussion is visible only to the people invited to it.
      - **Default title**: a title filled in for each new discussion. The author can edit it.
      - **Example title**: an example shown in an empty title field. Use it when a default title would not fit every discussion.
      - **Tags**: tags applied to each new discussion. The author can remove them.
      - **Context**: the starting text of the discussion. Use headings, questions, or links to guide what people write.
      - **Invite**: whether to invite everyone in the group by default. See [Choose who is notified by default](#choose-who-is-notified-by-default).
      - **Poll templates**: polls suggested for this process. They are listed on the new discussion form. They also appear first when someone starts a poll in the discussion. They do not start automatically.
      - **Allow concurrent polls**: whether more than one poll can be open in the discussion at the same time.
      - **Comment length limit**: an optional maximum length for comments.
    translation: |-
      - **Назва шаблону**: кароткая назва, якая паказваецца ў спісе шаблонаў.
      - **Шаблон падзагалоўка**: адзін радок з тлумачэннем, калі выкарыстоўваць шаблон.
      - **Даведка па шаблонах**: інструкцыі ўверсе формы новага абмеркавання. Тут можна растлумачыць працэс і даць спасылкі на матэрыялы. Гэтыя інструкцыі не становяцца часткай абмеркавання.
      - **Група**: ці пачынае шаблон абмеркаванне ў групе або прамое абмеркаванне. Прамое абмеркаванне бачаць толькі запрошаныя ў яго людзі.
      - **Назва па змаўчанні**: назва, якая аўтаматычна ўстаўляецца ў кожнае новае абмеркаванне. Яе можна змяніць.
      - **Прыклад загалоўка**: прыклад, які паказваецца ў пустым полі назвы. Выкарыстоўвайце яго, калі адна назва па змаўчанні не падыходзіць для ўсіх абмеркаванняў.
      - **Тэгі**: тэгі, якія дадаюцца да кожнага новага абмеркавання. Іх можна прыбраць.
      - **Кантэкст**: пачатковы тэкст абмеркавання. Выкарыстоўвайце загалоўкі, пытанні або спасылкі, каб падказаць людзям, пра што пісаць.
      - **Запрасіць**: ці запрашаць усіх у групе па змаўчанні. Глядзіце [Выберыце, каго апавяшчаць па змаўчанні](#choose-who-is-notified-by-default).
      - **Шаблоны апытанняў**: апытанні, прапанаваныя для гэтага працэсу. Яны паказваюцца ў форме новага абмеркавання, а таксама першымі ў спісе пры пачатку апытання ў гэтым абмеркаванні. Аўтаматычна яны не пачынаюцца.
      - **Дазволіць адначасовыя апытанні**: ці могуць некалькі апытанняў быць адкрытымі ў абмеркаванні адначасова.
      - **Абмежаванне даўжыні каментара**: неабавязковая максімальная даўжыня каментароў.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4a9e44919507a613:
    english: Use a default title only when it will stay accurate. Otherwise, write an example title that prompts the author to name the specific review, period, document, or decision.
    translation: Задавайце назву па змаўчанні, толькі калі яна будзе дакладнай для кожнага абмеркавання. Інакш дадайце прыклад загалоўка, які падкажа, як назваць канкрэтны разгляд, перыяд, дакумент або рашэнне.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c5db289e27f54169:
    english: "## Example: bottle trial review"
    translation: "## Прыклад: разгляд выпрабавання шматразовых бутэлек"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  89e7b8f9b36a8ae7:
    english: Oatmilk Cooperative reviews its returnable-bottle trial after each cycle. Its template is titled "Bottle trial review" and has a default title. It adds the "Bottle trial" tag. Its context asks members to read the weekly report and consider return rates, washing records, cafe feedback, and transport costs. It recommends a Sense check followed by Consent.
    translation: Кааператыў Oatmilk разглядае вынікі выпрабавання шматразовых бутэлек пасля кожнага цыклу. Яго шаблон называецца «Разгляд выпрабавання бутэлек» і мае назву па змаўчанні. Ён дадае тэг «Выпрабаванне бутэлек». У кантэксце ўдзельнікам прапануецца прачытаць штотыднёвую справаздачу і разгледзець долю вернутых бутэлек, запісы пра мыццё, водгукі кавярняў і транспартныя выдаткі. Шаблон прапануе спачатку праверку разумення, а потым галасаванне па згодзе.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f896031f8dcc2f84:
    english: This works as a template because the purpose and evidence stay the same each cycle. Only the observations and decisions change.
    translation: Гэты працэс падыходзіць для шаблону, бо мэта і звесткі для разгляду застаюцца аднолькавымі ў кожным цыкле. Змяняюцца толькі назіранні і рашэнні.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7e5955c442f6c8ae:
    english: "## Create a template"
    translation: "## Стварыце шаблон"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1c2b2bc41cbe6f6a:
    english: Group admins can select **New template** from the template list. Choose an example from Loomio's gallery or start with a blank template, then adapt it and save it.
    translation: Адміністратары групы могуць выбраць **Новы шаблон** у спісе шаблонаў. Выберыце прыклад з галерэі Loomio або пачніце з пустога шаблону, затым дапасуйце яго да сваіх патрэб і захавайце.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a9cb80d574e2d865:
    english: You can search or filter the gallery. An example is not added to your group until you save it.
    translation: У галерэі можна шукаць прыклады і адфільтроўваць іх. Прыклад не будзе дададзены ў вашу групу, пакуль вы яго не захаваеце.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1f0dab3f50320e75:
    english: "## Manage the template list"
    translation: "## Кіруйце спісам шаблонаў"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7462593f2f6d1614:
    english: When a group is created, Loomio adds a set of templates suited to the kind of group. Only **Blank template** and **Practice discussion** are visible at first. The others are hidden, and admins can unhide them.
    translation: Пры стварэнні групы Loomio дадае набор шаблонаў, прыдатных для яе тыпу. Спачатку бачныя толькі **Пусты шаблон** і **Практычнае абмеркаванне**. Астатнія схаваныя, але адміністратары могуць зрабіць іх бачнымі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e6f7eaa63e353ef7:
    english: 'Group admins can use the action menu beside a template to:'
    translation: 'Праз меню дзеянняў побач з шаблонам адміністратары групы могуць:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e8767178e42cd4e0:
    english: |-
      - edit its content and settings;
      - hide it from the template list;
      - unhide it from **Hidden templates**;
      - rearrange the order of visible templates;
      - export it as a JSON file; or
      - delete it.
    translation: |-
      - змяніць яго змест і налады;
      - схаваць яго са спісу шаблонаў;
      - зрабіць яго бачным праз **Схаваныя шаблоны**;
      - змяніць парадак бачных шаблонаў;
      - экспартаваць яго ў файл JSON; або
      - выдаліць яго.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5d4cbc918551c211:
    english: Hiding a template keeps it for later use. Deleting a template does not delete discussions started from it.
    translation: Схаваны шаблон можна выкарыстоўваць пазней. Выдаленне шаблону не выдаляе абмеркаванні, пачатыя з яго.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1c0ae844752e20ef:
    english: "## Share templates between groups"
    translation: "## Абменьвайцеся шаблонамі паміж групамі"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  acf646688b9b79f4:
    english: Select **Export json** in a template's action menu to download it as a file. To use it in another group, select **New template**, then **Import json**. The form opens with the imported content so you can review it before saving.
    translation: Каб спампаваць шаблон як файл, выберыце **Экспартаваць у JSON** у яго меню дзеянняў. Каб выкарыстаць яго ў іншай групе, выберыце **Новы шаблон**, а затым **Імпартаваць JSON**. Адкрыецца форма з імпартаваным зместам, які можна праверыць перад захаваннем.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a168253bda3147e8:
    english: Links to custom poll templates are not included in the file. Export and import those poll templates separately.
    translation: Спасылкі на ўласныя шаблоны апытанняў не ўключаюцца ў файл. Экспартуйце і імпартуйце гэтыя шаблоны асобна.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4833d57d46ccb98e:
    english: "## Let members create templates"
    translation: "## Дазвольце ўдзельнікам ствараць шаблоны"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1ac138e713feea59:
    english: By default, only group admins can create and edit templates. An admin can enable **Members can create templates** under **Group settings** → **Permissions**.
    translation: Па змаўчанні ствараць і рэдагаваць шаблоны могуць толькі адміністратары групы. Адміністратары могуць уключыць **Удзельнікі могуць ствараць шаблоны** ў раздзеле **Налады групы** → **Дазволы**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  889e8792d7937424:
    english: When this is enabled, members can create discussion and poll templates and edit the templates they created. Admins can edit every template in the group. A member's template appears in the group's template list once it is saved, so agree on naming and review practices before enabling this permission.
    translation: Калі гэты дазвол уключаны, удзельнікі могуць ствараць шаблоны абмеркаванняў і апытанняў і рэдагаваць створаныя імі шаблоны. Адміністратары могуць рэдагаваць усе шаблоны групы. Пасля захавання шаблон удзельнікаў з'яўляецца ў спісе шаблонаў групы, таму перад уключэннем дазволу дамоўцеся пра назвы шаблонаў і парадак іх праверкі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1284dfc3e68170d8:
    english: "## Templates for non-members"
    translation: "## Шаблоны для людзей па-за групай"
    status: machine
