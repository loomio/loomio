    translation: "## Сповіщення"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  59121c87e06e34d0:
    english: The bell button at the top right opens your in-app notifications. A badge appears when you have notifications you have not viewed.
    translation: Кнопка з дзвіночком угорі праворуч відкриває сповіщення в застосунку. Якщо у вас є непереглянуті сповіщення, на кнопці з’являється позначка.
    status: machine
