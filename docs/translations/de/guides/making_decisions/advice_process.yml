  aa1feddec315ed04:
    english: Seek advice on a decision you need to make.
    translation: Hol dir Rat für eine Entscheidung, die du treffen musst.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  abd59b5e28c00123:
    english: Make a decision with the advice of people impacted or who have expertise, so you can make a better decision for your organization.
    translation: Beziehe den Rat von betroffenen Personen und Fachleuten in deine Entscheidung ein. So kannst du eine bessere Entscheidung für deine Organisation treffen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fce0c96bcc92d0aa:
    english: "> *“With the advice process, any person can make any decision but must seek advice from affected parties and people with expertise.” - Frederick Laloux, Reinventing Organizations.*"
    translation: "> *„Im Beratungsprozess kann jede Person jede Entscheidung treffen, muss aber die Betroffenen und Menschen mit Fachwissen um Rat fragen.“ – Frederick Laloux, Reinventing Organizations.*"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  66f32f2b3cf56e0d:
    english: |-
      ## Key points
      - Freedom to make a decision.
      - Invite people to offer their advice.
      - Take into account other people’s voices.
    translation: |-
      ## Das Wichtigste
      - Du kannst selbst entscheiden.
      - Lade andere ein, dir Rat zu geben.
      - Berücksichtige ihre Sichtweisen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  54d4f1ac3c2bd91f:
    english: |-
      ## Steps in the Advice process
      You notice a problem or opportunity and take the initiative.
      1. Frame the decision, identify who owns it, and invite the affected people and relevant experts.
      2. Start a Loomio **discussion** and, when a structured response or deadline is useful, run an **Advice proposal**.
      3. Clarify and build on the advice through vote reasons and discussion comments.
      4. Make the decision, then publish an **outcome** explaining what was decided and how the advice informed it.
    translation: |-
      ## Schritte im Beratungsprozess
      Du erkennst ein Problem oder eine Chance und ergreifst die Initiative.
      1. Beschreibe die anstehende Entscheidung, kläre, wer sie trifft, und lade betroffene Personen und Fachleute ein.
      2. Starte eine **Diskussion** auf Loomio. Wenn du strukturierte Antworten oder eine Frist brauchst, starte einen **Beratungsvorschlag**.
      3. Kläre offene Fragen und vertiefe den Rat anhand der Begründungen zu den Stimmen und der Kommentare in der Diskussion.
      4. Triff die Entscheidung und veröffentliche ein **Fazit**. Erkläre darin, was entschieden wurde und wie der Rat dazu beigetragen hat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6088bbd1e12e8920:
    english: "## Benefits\n- Advice helps you make a better decision for your organization. \n- Foster relationships, learning opportunities and diverse input.\n- Stimulate initiative and creativity, and more enjoyable work."
    translation: "## Vorteile\n- Der Rat anderer hilft dir, eine bessere Entscheidung für deine Organisation zu treffen. \n- Er stärkt Beziehungen, schafft Gelegenheiten zum Lernen und bringt unterschiedliche Sichtweisen ein.\n- Er fördert Eigeninitiative, Kreativität und Freude an der Arbeit."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0b6fc6b802feebda:
    english: "## Applying the Advice process on Loomio"
    translation: "## Den Beratungsprozess auf Loomio anwenden"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a0a3c706db8ca405:
    english: "| **Advice process** | **On Loomio** |\n|---|---|\n| You notice a problem or opportunity and take the initiative. |  |\n| Seek input to sound out perspectives before proposing action. | Start a Loomio **discussion** to provide context and open conversation. Run an **[Advice proposal](/en/user_manual/polls/proposals/advice/)** when you want a defined response period, vote reasons, and a clear record of who participated. |\n| Taking advice received into account, you make a decision and inform the people who have given advice. | Add an an **outcome** to the discussion thread.   <br /><br />State the decision made and thank people for their advice and feedback.  <br /><br />   Say what will happen next and notify people about the outcome.  <br /><br />The outcome statement is an important record of the decision for future reference. <br /> <br /> Either update the context to include this outcome, or state it in a comment you pin to the timeline to quickly find it in the future.<br /><br/> |        "
    translation: |-
      | **Beratungsprozess** | **Auf Loomio** |
      |---|---|
      | Du erkennst ein Problem oder eine Chance und ergreifst die Initiative. |  |
      | Hol dir verschiedene Sichtweisen ein, bevor du eine Maßnahme vorschlägst. | Starte eine **Diskussion** auf Loomio, um den Hintergrund zu erklären und ein Gespräch zu eröffnen. Starte einen **[Beratungsvorschlag](/en/user_manual/polls/proposals/advice/)**, wenn du einen festgelegten Antwortzeitraum, Begründungen zu den Stimmen und eine klare Übersicht über die Beteiligten möchtest. |
      | Du berücksichtigst den erhaltenen Rat, triffst eine Entscheidung und informierst die Menschen, die dich beraten haben. | Füge der Diskussion ein **Fazit** hinzu.   <br /><br />Beschreibe deine Entscheidung und bedanke dich für den Rat und die Rückmeldungen.  <br /><br />   Erkläre, was als Nächstes geschieht, und benachrichtige die Beteiligten über das Fazit.  <br /><br />Das Fazit hält die Entscheidung fest, damit sie später nachvollziehbar bleibt. <br /> <br /> Ergänze das Fazit entweder im Kontext der Diskussion oder schreibe es in einen Kommentar, den du an der Zeitleiste anheftest. So findest du es später schnell wieder.<br /><br/> |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
