    translation: Os dados enviados pelos webhooks são mensagens para exibição em serviços de bate-papo. Eles não contêm registros completos do Loomio. Os links na mensagem identificam o conteúdo afetado. Se uma integração precisar dos dados atuais em formato estruturado, ela pode consultá-los pela API do usuário.
