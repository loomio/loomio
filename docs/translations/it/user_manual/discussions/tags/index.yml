  1d390c0c4f4cea4a:
    english: Category tags make it easy to find threads and polls about a particular type of work or topic.
    translation: Le etichette di categoria ti aiutano a trovare discussioni e sondaggi su un determinato tipo di attività o argomento.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  572adf8961fc1178:
    english: |-
      Tags belong to the whole organization. A tag used in a parent group is the
      same tag in its subgroups, making it possible to organize related work across
      the organization. Loomio displays tag names alphabetically and shows their
      colors as dots beside the names.
    translation: |-
      Le etichette appartengono all'intera organizzazione. Un'etichetta usata in un gruppo principale è la
      stessa anche nei suoi sottogruppi. Puoi così organizzare le attività correlate in tutta
      l'organizzazione. Loomio mostra i nomi delle etichette in ordine alfabetico e i loro
      colori come punti accanto ai nomi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b5340bcbf37095dc:
    english: |-
      On your group page, click **Tags** above the thread list to see the tags used in
      the current group. Select a tag to show only threads with that tag. Use the
      filter textbox to search a long list, or select **Show more** to include all
      tags in the organization. Select **Show fewer** to return to the current
      group's tags.
    translation: |-
      Nella pagina del tuo gruppo, fai clic su **Etichette** sopra l'elenco delle discussioni per vedere le etichette usate
      nel gruppo. Seleziona un'etichetta per mostrare solo le discussioni che la usano. Usa la
      casella di filtro per cercare in un elenco lungo oppure seleziona **Mostra di più** per includere tutte le
      etichette dell'organizzazione. Seleziona **Mostra meno** per tornare alle etichette
      del gruppo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9de81b9a795d066d:
    english: "## Apply tags"
    translation: "## Applica etichette"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bf284f7568360b53:
    english: Members who can edit a thread or poll can apply tags to it.
    translation: I membri che possono modificare una discussione o un sondaggio possono applicarvi delle etichette.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  58488fe368513138:
    english: When you start a thread or poll, click the **Tags** field and select one or more tags.
    translation: Quando avvii una discussione o un sondaggio, fai clic sul campo **Etichette** e seleziona una o più etichette.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e060934a2853a35a:
    english: Start typing to filter the list. Select a tag again, or click the × on its chip, to remove it.
    translation: Inizia a digitare per filtrare l'elenco. Per rimuovere un'etichetta, selezionala di nuovo oppure fai clic sulla × nel suo riquadro.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9f5e48b7e520d1a0:
    english: "## Create tags"
    translation: "## Crea etichette"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  efa789e9365b2ab2:
    english: |-
      Parent-group admins can always create tags for the parent group and its
      subgroups. Subgroup admins can create tags while tagging content in their
      subgroup. The **Members can create tags** group permission, enabled by default,
      allows other members who can tag a thread or poll to create new tag names. If
      the permission is disabled, members can still apply existing tags.
    translation: |-
      Gli amministratori del gruppo principale possono sempre creare etichette per il gruppo e i suoi
      sottogruppi. Gli amministratori dei sottogruppi possono creare etichette mentre etichettano i contenuti del proprio
      sottogruppo. L'autorizzazione del gruppo **I membri possono creare tag**, attiva per impostazione predefinita,
      consente anche agli altri membri che possono etichettare una discussione o un sondaggio di creare nuove etichette. Se
      l'autorizzazione è disattivata, i membri possono comunque applicare le etichette esistenti.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7e06376f3431ad2f:
    english: To create a tag while starting a thread or poll, type its name in the **Tags** field and press Enter.
    translation: Per creare un'etichetta mentre avvii una discussione o un sondaggio, digita il suo nome nel campo **Etichette** e premi Invio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
