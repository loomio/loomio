  b3ed13f5612f4ff9:
    english: A direct discussion is a private discussion for a specific set of people.
    translation: Прамая дыскусія — гэта прыватная дыскусія для пэўнага кола людзей.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  479f7faed056ab51:
    english: A direct discussion does not belong to a group. Invited people do not need to be a member of your Loomio group.
    translation: Прамая дыскусія не належыць да групы. Запрошаным людзям неабавязкова быць удзельнікамі вашай групы ў Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2f5362faecc07fa0:
    english: You control who can see and participate by adding people or email addresses to the **Invite** field.
    translation: Каб вызначыць, хто можа бачыць дыскусію і ўдзельнічаць у ёй, дадайце людзей або іх адрасы электроннай пошты ў поле **Запрасіць**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f31343ea54b4f899:
    english: Direct discussions support the same comments, polls and other tools as group discussions. They can be useful when creating a subgroup is unnecessary.
    translation: У прамых дыскусіях даступныя тыя ж каментары, апытанні і іншыя інструменты, што і ў групавых дыскусіях. Яны карысныя, калі няма патрэбы ствараць падгрупу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
