---
navigation_title: Facilitare le discussioni
blocks:
  c377321bc013336b:
    english: "# Facilitating discussions"
    translation: "# Facilitare le discussioni"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b771c6c746b8dc40:
    english: 'At times topics arise that require the attention of board or committee members mid-cycle, between meetings. '
    translation: A volte, tra una riunione e l'altra, emergono temi che richiedono l'attenzione dei membri del consiglio o di un comitato.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b5fc5f12c8e44c40:
    english: And sometimes there is just not space during a meeting for discussion or to sufficiently deliberate on a decision.
    translation: Altre volte, durante una riunione non c'è abbastanza tempo per discutere o valutare una decisione con la dovuta attenzione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  79f2f83380e195c4:
    english: "## On Loomio"
    translation: "## Su Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  14d5e62d33996982:
    english: Use a Loomio **thread** to facilitate a discussion.  Give the thread a descriptive title that members will recognize and provide details in the thread context.  Add a relevant category tag to help members find the thread in future.
    translation: Usa una **discussione** su Loomio per facilitare il confronto. Dai alla discussione un titolo descrittivo che i membri possano riconoscere e aggiungi i dettagli nel contesto. Aggiungi un'etichetta di categoria pertinente per aiutare i membri a ritrovare la discussione in futuro.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d35b4315f4e42cb:
    english: Notify members of the thread by inviting them, so they will receive a copy of the thread by email.  Members can participate in the discussion by clicking on the link to go to Loomio, or reply to the notification email and their comment will appear as a comment in the thread.
    translation: 'Invita i membri alla discussione per informarli: riceveranno una copia via email. Possono partecipare seguendo il link a Loomio oppure rispondendo all''email di notifica. La loro risposta comparirà come commento nella discussione.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f7d839f27c1a6f72:
    english: A Loomio thread enables you to attach files or link to online resources to support the discussion.
    translation: In una discussione su Loomio puoi allegare file o inserire link a risorse online utili al confronto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e45d25d90798cf1e:
    english: "Common examples include:\n- review and develop a policy\n- seek advice from the board about a topic or issue\n- discuss strategy \n- explore an idea or opportunity\n- assess risk"
    translation: |-
      Ecco alcuni usi comuni:
      - esaminare e sviluppare una politica
      - chiedere consiglio al consiglio su un tema o un problema
      - discutere una strategia
      - esplorare un'idea o un'opportunità
      - valutare un rischio
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  86ace2adbcf3df6f:
    english: "## Issues that arise between board meetings"
    translation: "## Questioni che emergono tra le riunioni del consiglio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  48f6023950ee0729:
    english: 'A lot can happen in an organization between meetings, and most people rely on email to alert board members.  Trying to keep track of a discussion on email is tricky, with replies often lost in in-boxes and people left out.  '
    translation: 'Tra una riunione e l''altra possono succedere molte cose in un''organizzazione. Spesso si usa l''email per avvisare i membri del consiglio, ma seguire una discussione via email è difficile: le risposte possono perdersi nelle caselle di posta e alcune persone possono restare escluse.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1cb0e78c848b9621:
    english: "*“You can’t do governance by email!”, Richard Westlake (Westlake Governance).*"
    translation: "*«Non si può gestire un'organizzazione via email», Richard Westlake (Westlake Governance).*"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  eddf348746c93b4c:
    english: 'When an issue arises requiring board attention, use a Loomio thread rather than email.  Members can reply via email and their comment will appear in the Loomio thread, keeping the discussion in one place. '
    translation: Quando emerge una questione che richiede l'attenzione del consiglio, usa una discussione su Loomio. I membri possono rispondere via email e i loro commenti compariranno nella discussione, così tutto resta in un unico posto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2f7ad89003f79fb8:
    english: |-
      Here's how:
      - Make the email subject line the title of your thread,
      - write your email content in the thread context,
      - invite your team to the thread with their email address or Loomio user name.
    translation: |-
      Ecco come fare:
      - Usa l'oggetto dell'email come titolo della discussione,
      - inserisci il contenuto dell'email nel contesto della discussione,
      - invita le persone alla discussione usando il loro indirizzo email o nome utente Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9825cbb88dcedc3d:
    english: |-
      A Loomio thread means that:
      - All info about a topic is organized in one easily accessible place,
      - people can respond without generating reply/reply-all email chains that risk leaving people out,
      - you can see who has read the message and who needs a nudge,
      - you can progress actual work to an outcome, and cut down on the amount of email.
    translation: |-
      Con una discussione su Loomio:
      - tutte le informazioni su un tema sono raccolte in un unico posto, facile da consultare,
      - le persone possono rispondere senza creare catene di email che rischiano di escludere qualcuno,
      - puoi vedere chi ha letto il messaggio e chi potrebbe aver bisogno di un promemoria,
      - puoi portare avanti il lavoro fino a una conclusione e ridurre il numero di email.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fb9adc7cb7922016:
    english: "## When there isn't space during meetings"
    translation: "## Quando il tempo in riunione non basta"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6b1c61424aa7e74b:
    english: When an agenda item cannot be resolved within the time available in your board meeting, you can move this for further discussion to Loomio. Direct people to the relevant thread, or start a new one and notify your board members.
    translation: Se il tempo della riunione del consiglio non basta per risolvere un punto all'ordine del giorno, puoi continuare la discussione su Loomio. Indica alle persone la discussione pertinente oppure avviane una nuova e informa i membri del consiglio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ced9caddb281230f:
    english: This relieves pressure on your board, allows more time for information gathering, discussion and deeper reflection which often results in a better quality decision.
    translation: Questo riduce la pressione sul consiglio e lascia più tempo per raccogliere informazioni, discuterle e riflettere. Spesso aiuta a prendere una decisione migliore.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
