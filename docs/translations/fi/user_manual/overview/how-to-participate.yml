---
navigation_title: Näin osallistut
blocks:
  b07064bf98055393:
    english: "# How to participate"
    translation: "# Näin osallistut"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c121de54fbe72331:
    english: 'Once signed in to a Loomio group you have been invited to, you can participate in a Loomio discussion or decision.  '
    translation: Kun olet kirjautunut Loomio-ryhmään, johon sinut on kutsuttu, voit osallistua keskusteluun tai päätöksentekoon.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9bb48e2f2f1858af:
    english: Read on to see  how to write a comment in a thread and how to vote in a poll.
    translation: Lue, miten kirjoitat kommentin keskusteluketjuun ja äänestät kyselyssä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '095ec081a6f1d74e':
    english: "## Comment"
    translation: "## Kommentoi"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d5dadbc416d8603a:
    english: You can write a comment in a thread, and people can reply, react or post their own comment to continue the discussion.
    translation: Voit kirjoittaa kommentin keskusteluketjuun. Muut voivat vastata siihen, reagoida siihen tai jatkaa keskustelua omalla kommentillaan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  250f7bc0e6e6c93c:
    english: 'When you have written your text, use **Post Comment** to instantly publish the comment. Your comment will be visible to anyone who has permission to see the thread. '
    translation: Kun olet kirjoittanut kommenttisi, julkaise se heti valitsemalla **Lähetä Kommentti**. Kommenttisi näkyy kaikille, joilla on oikeus nähdä keskusteluketju.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  76a3378441f45ebf:
    english: "### Reply to a comment"
    translation: "### Vastaa kommenttiin"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c3495aed9ac78348:
    english: You can reply to someone's comment by clicking on the reply icon beneath the comment.
    translation: Voit vastata kommenttiin napsauttamalla sen alla olevaa vastauskuvaketta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b2698ab73e65442c:
    english: Your reply is published in the thread and an email notification is sent to the author of the comment.
    translation: Vastauksesi julkaistaan keskusteluketjussa, ja kommentin kirjoittajalle lähetetään sähköposti-ilmoitus.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  04743dedbee0de5c:
    english: "### Get someone's attention"
    translation: "### Kiinnitä jonkun huomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  455fea8aa593dad4:
    english: You can notify people when you write a comment.
    translation: Voit lähettää ihmisille ilmoituksen, kun kirjoitat kommentin.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  316ef3257eaebd54:
    english: "### Reactions"
    translation: "### Reaktiot"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4b68204cf35c85f1:
    english: Reacting to a comment is a great way to encourage and acknowledge a comment by letting the comment author know how you feel.  It is a quick and light-weight way to participate that does not require any text, nor send an email. Click the smile emoji icon beneath a comment to leave an emoji reaction.
    translation: Voit osoittaa kommentin kirjoittajalle, mitä ajattelet hänen kommentistaan, reagoimalla siihen. Se on nopea tapa osallistua ilman tekstiä tai sähköposti-ilmoitusta. Lisää emojireaktio napsauttamalla kommentin alla olevaa hymiökuvaketta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Äänestä"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4432b9c5b263014a:
    english: You may receive an invitation to vote in a poll via email or by notification in Loomio. Click on the link in the email to vote.
    translation: Voit saada kutsun äänestää kyselyssä sähköpostitse tai Loomion ilmoituksena. Äänestä napsauttamalla sähköpostissa olevaa linkkiä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2a8641a22cf13597:
    english: Voting is easy, just click or tap on the icon of your choice.
    translation: Äänestä napsauttamalla tai napauttamalla haluamasi vaihtoehdon kuvaketta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  00d6e2698ade53cc:
    english: There are many types of polls. The example below shows a typical proposal with voting options of **Agree**, **Abstain** or **Disagree**. Other options may be available.
    translation: Kyselyitä on monenlaisia. Alla olevassa ehdotuksessa äänestysvaihtoehdot ovat **Samaa mieltä**, **Pidättäydy äänestämästä** ja **Eri mieltä**. Muitakin vaihtoehtoja voi olla.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4f327c4a766af0ab:
    english: Read the poll, and any attached files, then cast your vote by selecting one of the options.
    translation: Lue kysely ja mahdolliset liitetiedostot. Äänestä sitten valitsemalla yksi vaihtoehdoista.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2cf633f37997e8b8:
    english: "### State a reason"
    translation: "### Kerro perustelusi"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c976385dcb75f67b:
    english: When voting, you can also leave a **Reason** to say why you have voted this way. This is optional.
    translation: Voit äänestäessäsi kertoa, miksi valitsit tämän vaihtoehdon, kirjoittamalla **Syy**-kenttään. Tämä on vapaaehtoista.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6d0d884b0832dda9:
    english: "### Change your vote"
    translation: "### Muuta ääntäsi"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  84629138984e43d0:
    english: You can **change your vote**, up until the proposal closes.
    translation: Voit **muuttaa ääntäsi**, kunnes ehdotus sulkeutuu.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8fcddbe7856e926b:
    english: There are many reasons why you might want to change your vote. For example if new information emerges it may cause you to rethink your decision, and change your vote.
    translation: Voit haluta muuttaa ääntäsi monesta syystä. Esimerkiksi uusi tieto voi saada sinut harkitsemaan päätöstäsi uudelleen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f7078b517c8bfed8:
    english: Once again, you can leave a reason to say why you have changed your vote.
    translation: Voit myös kertoa, miksi muutit ääntäsi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8e1b2953471f22ba:
    english: "### Results"
    translation: "### Tulokset"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2153df12cd2b4fe2:
    english: Results of the proposal are updated as people vote, so you can see how a proposal is trending.
    translation: Ehdotuksen tulokset päivittyvät sitä mukaa, kun ihmiset äänestävät. Näet, millaista kannatusta ehdotus saa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  229571fe36c571b0:
    english: 'In a controversial proposal it is common to see mixed results, however this does not mean the proposal has failed.  '
    translation: Kiistanalaisen ehdotuksen tulokset voivat olla jakautuneet. Se ei kuitenkaan tarkoita, että ehdotus olisi epäonnistunut.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c3d5e53684bf3e88:
    english: Often the new information revealed during the proposal helps form a better proposal that is more likely to pass.
    translation: Ehdotuksen aikana esiin tullut uusi tieto auttaa usein laatimaan paremman ehdotuksen, jolla on enemmän mahdollisuuksia saada kannatusta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b4783489f09ccf19:
    english: "### Outcome"
    translation: "### Johtopäätös"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  592f419764241ef6:
    english: When the proposal closes, the author is prompted to state the **Outcome**.
    translation: Kun ehdotus sulkeutuu, sen tekijää pyydetään kirjoittamaan **Johtopäätös**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0fae106181bbc6ac:
    english: This is an important final step to record the result of the decision and let everyone know what will happen next.
    translation: Tässä viimeisessä vaiheessa kirjataan päätöksen tulos ja kerrotaan kaikille, mitä seuraavaksi tapahtuu.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
