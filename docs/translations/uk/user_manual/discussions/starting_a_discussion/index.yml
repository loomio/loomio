---
navigation_title: Розпочати обговорення
blocks:
  8fae4100a4f3548b:
    english: "# Start a discussion"
    translation: "# Розпочати обговорення"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4ba984e9573c27ff:
    english: Starting a Loomio discussion is like writing an email. The subject line of an email is like the discussion title, and the text you write in an email is like the context of a discussion.
    translation: Почати обговорення в Loomio схоже на написання електронного листа. Тема листа відповідає назві обговорення, а текст листа — контексту обговорення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4f81447c072f5dfe:
    english: As you add people in the send list of your email, in Loomio you can invite people individually or as a group to the discussion - they will receive an email notification with the content of your discussion.
    translation: Як ви додаєте адресатів до електронного листа, так і в Loomio можете запросити до обговорення окремих людей або цілу групу. Вони отримають електронне сповіщення зі змістом обговорення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2408b54e3b78a282:
    english: People can reply to your discussion via email and their comments will appear in the discussion.
    translation: Люди можуть відповісти на ваше обговорення електронною поштою. Їхні коментарі з’являться в обговоренні.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  24ced64c5c4cf853:
    english: As with an email, a discussion may be a simple question, or a more detailed introduction to a topic with links or files attached for background information.
    translation: Як і електронний лист, обговорення може містити просте запитання або докладний вступ до теми з посиланнями чи прикріпленими файлами.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ec39413fa07094c8:
    english: "## New discussion"
    translation: "## Нове обговорення"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  92b37b2e208bfd57:
    english: Find the **New discussion** button on your Loomio group page to start a new discussion.
    translation: Щоб розпочати обговорення, знайдіть кнопку **Нове обговорення** на сторінці вашої групи в Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  515ac46bdfccb401:
    english: You can start a discussion within your Loomio group or any subgroup.
    translation: Ви можете розпочати обговорення у своїй групі Loomio або в будь-якій її підгрупі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ef9721ba6b69b86b:
    english: "![New discussion button on the Oatmilk Cooperative page](new-discussion-button.png)"
    translation: "![Кнопка «Нове обговорення» на сторінці кооперативу Oatmilk](new-discussion-button.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1cf9e569475cd2cc:
    english: "![New discussion form for planning the returnable bottle trial](new-discussion-example.png)"
    translation: "![Форма нового обговорення для планування випробування поворотних пляшок](new-discussion-example.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f973f5b9f1c4b1dd:
    english: |-
      ### Group
      Check the name of the group or subgroup is correct for your discussion.  Anyone in this group will be able to see the discussion. You can also start the discussion in another group or as a 'direct' discussion (no group).
    translation: |-
      ### Група
      Перевірте, чи правильно вказано групу або підгрупу для вашого обговорення. Усі учасники цієї групи зможуть бачити обговорення. Ви також можете розпочати його в іншій групі або як «пряме» обговорення (без групи).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f0b0bda9877ce0ed:
    english: |-
      >[!Tip]
      >If you are not ready to make the discussion visible in your group, start the discussion as 'direct'.  You can move the discussion to your Loomio group when ready.
    translation: |-
      >[!Tip]
      >Якщо ви ще не готові зробити обговорення видимим у своїй групі, розпочніть його як «пряме». Згодом ви зможете перенести обговорення до своєї групи Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cd1b45c3cb71503b:
    english: "### Invite and notify"
    translation: "### Запрошення та сповіщення"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f3f388d23b06b25c:
    english: The **Invite** field controls who receives the new discussion immediately.
    translation: Поле **Запросити** визначає, хто одразу отримає сповіщення про нове обговорення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c1b5c23770d3692:
    english: Group members can see a discussion in their group even if you do not notify them. Adding a group member to **Invite** sends them an email notification and a notification in Loomio.
    translation: Учасники групи можуть бачити обговорення у своїй групі, навіть якщо ви не надішлете їм сповіщення. Якщо додати учасника групи до поля **Запросити**, він отримає сповіщення електронною поштою та в Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e2e5906a39131506:
    english: Select a group to notify everyone in it, or expand the group to choose individual members. Select the × beside a name to remove that person from the notification.
    translation: Виберіть групу, щоб сповістити всіх її учасників, або розгорніть список групи й виберіть окремих учасників. Щоб прибрати людину зі списку одержувачів сповіщення, виберіть × поруч із її іменем.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  81b57efbb3c428b7:
    english: "![Invite field expanded to show individual recipients](../notifying_people/thread_notification.png)"
    translation: "![Розгорнуте поле «Запросити» зі списком окремих одержувачів](../notifying_people/thread_notification.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5cbd2b7b0bcc486f:
    english: Start typing a member's name and select it from the list.
    translation: Почніть вводити ім’я учасника й виберіть його зі списку.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dc128abbc65cb0c8:
    english: "![Searching for Samira Patel in the Invite field](../notifying_people/thread_notify_user.png)"
    translation: "![Пошук Саміри Пател у полі «Запросити»](../notifying_people/thread_notify_user.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3274fe93fcf29b29:
    english: Enter an email address to invite a guest. A guest can see and participate in this thread but cannot see other discussions in the group unless separately invited.
    translation: Введіть адресу електронної пошти, щоб запросити гостя. Гість зможе бачити це обговорення й брати в ньому участь, але не бачитиме інших обговорень у групі, якщо його не запросять до них окремо.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ab3214ccf77143e3:
    english: "![Adding a guest email address to the Invite field](../notifying_people/thread_notify_email.png)"
    translation: "![Додавання електронної адреси гостя до поля «Запросити»](../notifying_people/thread_notify_email.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cba9346e727b829a:
    english: You can also start the discussion without notifying anyone. Group members can still find it in Loomio and may see it in their catch-up email, depending on their notification settings.
    translation: Ви також можете розпочати обговорення, нікого не сповіщаючи. Учасники групи все одно зможуть знайти його в Loomio. Вони також можуть побачити його в листі з підсумком оновлень, залежно від своїх налаштувань сповіщень.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6518afe373ff1959:
    english: "### Tags"
    translation: "### Мітки"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ff67c09f89479873:
    english: Add tag(s) to help people find your discussion when searching by tag. Admins can create new tags.
    translation: Додайте мітки, щоб людям було легше знайти ваше обговорення за міткою. Адміністратори можуть створювати нові мітки.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ba80a903c4ecc7d1:
    english: |-
      ### Title
      Give your discussion a relevant title.  A discussion title is similar to an email subject line.
    translation: |-
      ### Назва
      Дайте обговоренню назву, яка відповідає темі. Назва обговорення схожа на тему електронного листа.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a91cf4b0b1b2ad5e:
    english: |-
      ### Context
      Use discussion context to introduce the topic and frame the conversation or decision to make. Use the formatting tools to emphasize key points. Include background information, attach files, link to online documents and embed a video.
    translation: |-
      ### Контекст
      Використовуйте контекст обговорення, щоб представити тему й окреслити розмову або рішення, яке потрібно ухвалити. Виділіть ключові моменти за допомогою інструментів форматування. Додайте довідкову інформацію, прикріпіть файли, вставте посилання на документи в інтернеті та відео.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1bf690aa841299cd:
    english: The context will always stay at the top of the discussion and you can update it at any time as the discussion progresses.  When the discussion ends, update the context with the outcome.
    translation: Контекст завжди залишається вгорі обговорення. Ви можете оновлювати його в будь-який час упродовж розмови. Коли обговорення завершиться, додайте до контексту його результат.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
