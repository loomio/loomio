    translated_on: '2026-09-30'
  435f52763f0d9a5b:
    english: To keep a record of a thread discussion and decisions in polls, use **[Print thread](/en/user_manual/groups/data_export#print-thread-to-pdf)** and print the file to pdf.  You can then store a published copy of the thread in your chosen document storage archive.
    translation: כדי לשמור רשומה של הדיון בשרשור ושל ההחלטות במשאלים, יש להשתמש ב־**[הדפסת שרשור](/en/user_manual/groups/data_export#print-thread-to-pdf)** ולהדפיס את הקובץ כ־PDF. לאחר מכן ניתן לשמור עותק של השרשור בארכיון המסמכים הרצוי.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a6b96750c9e1e590:
    english: To keep a complete record of the data in your Loomio group, use **[Export group data](/en/user_manual/groups/data_export#group-data-backup-or-export)**.
    translation: כדי לשמור רשומה מלאה של הנתונים בקבוצת Loomio, יש להשתמש ב־**[ייצוא נתוני הקבוצה](/en/user_manual/groups/data_export#group-data-backup-or-export)**.
