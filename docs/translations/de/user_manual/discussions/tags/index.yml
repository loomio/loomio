  1d390c0c4f4cea4a:
    english: Category tags make it easy to find threads and polls about a particular type of work or topic.
    translation: Mit Kategorie-Schlagwörtern findest du leichter Diskussionen und Umfragen zu einem bestimmten Arbeitsbereich oder Thema.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  572adf8961fc1178:
    english: |-
      Tags belong to the whole organization. A tag used in a parent group is the
      same tag in its subgroups, making it possible to organize related work across
      the organization. Loomio displays tag names alphabetically and shows their
      colors as dots beside the names.
    translation: |-
      Schlagwörter gelten für die gesamte Organisation. Ein Schlagwort in einer Hauptgruppe ist
      dasselbe Schlagwort in ihren Untergruppen. So kannst du zusammengehörige Arbeit in der
      ganzen Organisation ordnen. Loomio zeigt Schlagwörter alphabetisch an. Ihre
      Farben erscheinen als Punkte neben den Namen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b5340bcbf37095dc:
    english: |-
      On your group page, click **Tags** above the thread list to see the tags used in
      the current group. Select a tag to show only threads with that tag. Use the
      filter textbox to search a long list, or select **Show more** to include all
      tags in the organization. Select **Show fewer** to return to the current
      group's tags.
    translation: |-
      Klicke auf deiner Gruppenseite über der Diskussionsliste auf **Schlagwörter**, um die
      Schlagwörter der aktuellen Gruppe zu sehen. Wähle ein Schlagwort, um nur Diskussionen mit diesem
      Schlagwort anzuzeigen. Durchsuche eine lange Liste mit dem Filterfeld oder wähle **Mehr anzeigen**,
      um alle Schlagwörter der Organisation einzubeziehen. Wähle **Weniger anzeigen**, um wieder nur die
      Schlagwörter der aktuellen Gruppe zu sehen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9de81b9a795d066d:
    english: "## Apply tags"
    translation: "## Schlagwörter zuweisen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bf284f7568360b53:
    english: Members who can edit a thread or poll can apply tags to it.
    translation: Mitglieder, die eine Diskussion oder Umfrage bearbeiten können, können ihr Schlagwörter zuweisen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  58488fe368513138:
    english: When you start a thread or poll, click the **Tags** field and select one or more tags.
    translation: Wenn du eine Diskussion oder Umfrage startest, klicke auf das Feld **Schlagwörter** und wähle ein oder mehrere Schlagwörter.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e060934a2853a35a:
    english: Start typing to filter the list. Select a tag again, or click the × on its chip, to remove it.
    translation: Beginne zu tippen, um die Liste zu filtern. Wähle ein Schlagwort erneut aus oder klicke auf das × in seiner Markierung, um es zu entfernen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9f5e48b7e520d1a0:
    english: "## Create tags"
    translation: "## Schlagwörter erstellen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  efa789e9365b2ab2:
    english: |-
      Parent-group admins can always create tags for the parent group and its
      subgroups. Subgroup admins can create tags while tagging content in their
      subgroup. The **Members can create tags** group permission, enabled by default,
      allows other members who can tag a thread or poll to create new tag names. If
      the permission is disabled, members can still apply existing tags.
    translation: |-
      Admins einer Hauptgruppe können jederzeit Schlagwörter für die Hauptgruppe und ihre
      Untergruppen erstellen. Admins einer Untergruppe können Schlagwörter erstellen, wenn sie Inhalte in ihrer
      Untergruppe kennzeichnen. Die Gruppenberechtigung **Mitglieder können Tags erstellen** ist standardmäßig aktiviert.
      Damit können auch andere Mitglieder neue Schlagwörter erstellen, wenn sie eine Diskussion oder Umfrage
      kennzeichnen dürfen. Ist die Berechtigung deaktiviert, können Mitglieder vorhandene Schlagwörter weiterhin zuweisen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7e06376f3431ad2f:
    english: To create a tag while starting a thread or poll, type its name in the **Tags** field and press Enter.
    translation: Um beim Starten einer Diskussion oder Umfrage ein Schlagwort zu erstellen, gib seinen Namen in das Feld **Schlagwörter** ein und drücke die Eingabetaste.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
