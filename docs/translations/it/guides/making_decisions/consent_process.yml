  3cc3304a15bc3d2f:
    english: In the Consent process, an objection is defined as something that **might cause harm to the team or organization**.
    translation: Nel processo di consenso, un'obiezione riguarda qualcosa che **potrebbe causare un danno al gruppo o all'organizzazione**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ab509ea088e16a0d:
    english: |-
      Objections should meet this criteria to be valid:
      - Explicit: *I can make a reasoned case*
      - Impersonal: *It's not just a personal preference*
      - Evidenced: *Not predictive, based on experience*
      - Not 'safe to fail': *It's not that I have a 'better idea'*
    translation: |-
      Per essere valide, le obiezioni devono soddisfare questi criteri:
      - Esplicite: *posso spiegare le mie ragioni*
      - Impersonali: *non sono solo una preferenza personale*
      - Basate su prove: *si fondano sull'esperienza, non su previsioni*
      - Riguardano un rischio reale: *non si tratta solo di avere un'idea «migliore»*
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
