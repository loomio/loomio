---
navigation_title: Cómo participar
blocks:
  b07064bf98055393:
    english: "# How to participate"
    translation: "# Cómo participar"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c121de54fbe72331:
    english: 'Once signed in to a Loomio group you have been invited to, you can participate in a Loomio discussion or decision.  '
    translation: Una vez que hayas iniciado sesión en un grupo de Loomio al que te hayan invitado, puedes participar en una discusión o una decisión.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9bb48e2f2f1858af:
    english: Read on to see  how to write a comment in a thread and how to vote in a poll.
    translation: A continuación, verás cómo escribir un comentario en un hilo y cómo votar en un sondeo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '095ec081a6f1d74e':
    english: "## Comment"
    translation: "## Comentar"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d5dadbc416d8603a:
    english: You can write a comment in a thread, and people can reply, react or post their own comment to continue the discussion.
    translation: Puedes escribir un comentario en un hilo. Otras personas pueden responder, reaccionar o publicar sus propios comentarios para continuar la discusión.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  250f7bc0e6e6c93c:
    english: 'When you have written your text, use **Post Comment** to instantly publish the comment. Your comment will be visible to anyone who has permission to see the thread. '
    translation: Cuando hayas escrito el texto, selecciona **Publicar comentario** para publicarlo al instante. Cualquier persona con permiso para ver el hilo podrá ver tu comentario.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  76a3378441f45ebf:
    english: "### Reply to a comment"
    translation: "### Responder a un comentario"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c3495aed9ac78348:
    english: You can reply to someone's comment by clicking on the reply icon beneath the comment.
    translation: Para responder a un comentario, selecciona el icono de respuesta que aparece debajo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b2698ab73e65442c:
    english: Your reply is published in the thread and an email notification is sent to the author of the comment.
    translation: Tu respuesta se publica en el hilo y se envía una notificación por correo electrónico a quien escribió el comentario.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  04743dedbee0de5c:
    english: "### Get someone's attention"
    translation: "### Llamar la atención de alguien"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  455fea8aa593dad4:
    english: You can notify people when you write a comment.
    translation: Puedes notificar a otras personas cuando escribes un comentario.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  316ef3257eaebd54:
    english: "### Reactions"
    translation: "### Reacciones"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4b68204cf35c85f1:
    english: Reacting to a comment is a great way to encourage and acknowledge a comment by letting the comment author know how you feel.  It is a quick and light-weight way to participate that does not require any text, nor send an email. Click the smile emoji icon beneath a comment to leave an emoji reaction.
    translation: Puedes reaccionar a un comentario para mostrar a quien lo escribió lo que piensas. Es una forma rápida de participar que no requiere escribir texto ni envía un correo electrónico. Selecciona el icono de la cara sonriente debajo de un comentario para dejar una reacción con un emoji.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Votar"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4432b9c5b263014a:
    english: You may receive an invitation to vote in a poll via email or by notification in Loomio. Click on the link in the email to vote.
    translation: Puedes recibir una invitación para votar en un sondeo por correo electrónico o mediante una notificación en Loomio. Selecciona el enlace del correo para votar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2a8641a22cf13597:
    english: Voting is easy, just click or tap on the icon of your choice.
    translation: Para votar, selecciona el icono de la opción que prefieras.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  00d6e2698ade53cc:
    english: There are many types of polls. The example below shows a typical proposal with voting options of **Agree**, **Abstain** or **Disagree**. Other options may be available.
    translation: Hay varios tipos de sondeos. El ejemplo siguiente muestra una propuesta con las opciones de voto **De acuerdo**, **Abstenerse** y **Desacuerdo**. Puede haber otras opciones.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4f327c4a766af0ab:
    english: Read the poll, and any attached files, then cast your vote by selecting one of the options.
    translation: Lee el sondeo y los archivos adjuntos. Después, selecciona una opción para emitir tu voto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2cf633f37997e8b8:
    english: "### State a reason"
    translation: "### Indicar una razón"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c976385dcb75f67b:
    english: When voting, you can also leave a **Reason** to say why you have voted this way. This is optional.
    translation: Al votar, también puedes dejar una **Razón** para explicar tu elección. Es opcional.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6d0d884b0832dda9:
    english: "### Change your vote"
    translation: "### Cambiar tu voto"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  84629138984e43d0:
    english: You can **change your vote**, up until the proposal closes.
    translation: Puedes **cambiar tu voto** hasta que se cierre la propuesta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8fcddbe7856e926b:
    english: There are many reasons why you might want to change your vote. For example if new information emerges it may cause you to rethink your decision, and change your vote.
    translation: Puede haber varios motivos para cambiar tu voto. Por ejemplo, si aparece nueva información, quizá reconsideres tu decisión y cambies tu voto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f7078b517c8bfed8:
    english: Once again, you can leave a reason to say why you have changed your vote.
    translation: También puedes dejar una razón para explicar por qué has cambiado tu voto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8e1b2953471f22ba:
    english: "### Results"
    translation: "### Resultados"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2153df12cd2b4fe2:
    english: Results of the proposal are updated as people vote, so you can see how a proposal is trending.
    translation: Los resultados de la propuesta se actualizan a medida que las personas votan, así que puedes ver cómo evoluciona.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  229571fe36c571b0:
    english: 'In a controversial proposal it is common to see mixed results, however this does not mean the proposal has failed.  '
    translation: En una propuesta controvertida es habitual que haya votos a favor y en contra. Esto no significa que la propuesta haya fracasado.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c3d5e53684bf3e88:
    english: Often the new information revealed during the proposal helps form a better proposal that is more likely to pass.
    translation: A menudo, la información que surge durante la propuesta ayuda a formular otra mejor, con más posibilidades de aprobarse.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b4783489f09ccf19:
    english: "### Outcome"
    translation: "### Conclusión"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  592f419764241ef6:
    english: When the proposal closes, the author is prompted to state the **Outcome**.
    translation: Cuando se cierra la propuesta, se pide a quien la creó que indique la **Conclusión**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0fae106181bbc6ac:
    english: This is an important final step to record the result of the decision and let everyone know what will happen next.
    translation: Este último paso permite registrar el resultado de la decisión e informar a todas las personas de lo que ocurrirá después.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
