  86490ad15147169e:
    english: Use a **Time poll** to find a time for a meeting or event. It serves the same purpose as scheduling tools such as Doodle, while keeping the scheduling process with the group's other Loomio work. Participants see the options in their own time zone.
    translation: Gebruik **Moment bevragen** om een tijdstip voor een vergadering of evenement te vinden. Het werkt zoals een planningstool als Doodle, maar houdt de planning bij het andere werk van de groep in Loomio. Deelnemers zien de opties in hun eigen tijdzone.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2e21bb1b54b6fcf9:
    english: "## Time poll"
    translation: "## Moment bevragen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  27ba736f4b564fe3:
    english: _Find when people are available to meet_
    translation: _Ontdek wanneer mensen kunnen afspreken_
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2f5455ba3b487407:
    english: Save time arranging a date for your meeting or event.
    translation: Bespaar tijd bij het plannen van je vergadering of evenement.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  859c3efc07ce0b04:
    english: Time poll makes it easy to see everyone's availability and find the best time.
    translation: Met Moment bevragen zie je eenvoudig wanneer iedereen beschikbaar is en vind je het beste tijdstip.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  12ae9e9d3bdb0a4e:
    english: Give your Time poll a title and details. Enter a list of date and time options in your time zone.
    translation: Geef je peiling een titel en voeg details toe. Voer een lijst met mogelijke datums en tijdstippen in jouw tijdzone in.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  548fb6cd6fcd9376:
    english: When setting timeslots, consider people in different time zones. Participants will see times localized in their time zone.
    translation: Houd bij het kiezen van tijdstippen rekening met mensen in andere tijdzones. Deelnemers zien de tijdstippen in hun eigen tijdzone.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3105405631b53c31:
    english: Set a meeting duration.
    translation: Stel de duur van de vergadering in.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8d56a5d9986286e9:
    english: "### Voting"
    translation: "### Stemmen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  41d1e6a3a6739d95:
    english: People mark each time with the green thumbs-up icon when they are available, the yellow sideways thumb when they can attend if needed, or the red thumbs-down icon when they are unavailable.
    translation: Mensen markeren elk tijdstip met het groene duimpje omhoog als ze kunnen, met het gele duimpje opzij als ze zo nodig kunnen, of met het rode duimpje omlaag als ze niet kunnen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b4784042c82735af:
    english: Participants can leave a reason comment to help the organizer find a suitable time.
    translation: Deelnemers kunnen een toelichting toevoegen om de organisator te helpen een geschikt tijdstip te vinden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0165a90bc22b6f7f:
    english: If the times don't work, participants can suggest alternatives using the message field. You can then update the poll with new times.
    translation: Als de tijdstippen niet passen, kunnen deelnemers via het berichtveld alternatieven voorstellen. Je kunt de peiling daarna bijwerken met nieuwe tijdstippen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6c7c09879e7d9bf8:
    english: The results update as voting proceeds in a table showing who is available when, so everyone can see which timeslots are popular.
    translation: Tijdens het stemmen worden de resultaten bijgewerkt in een tabel die laat zien wie wanneer beschikbaar is. Zo ziet iedereen welke tijdstippen het populairst zijn.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b4783489f09ccf19:
    english: "### Outcome"
    translation: "### Conclusie"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3c0061b9af0a6bca:
    english: When the Time poll closes, pick the best time and post an outcome.
    translation: Kies na het sluiten van de peiling het beste tijdstip en publiceer een conclusie.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  62ef08e40ed2f44b:
    english: "**Notify**: Add the people you are inviting to the meeting or event"
    translation: "**Meld**: Voeg de mensen toe die je uitnodigt voor de vergadering of het evenement"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  945f9e19218fb1bf:
    english: "**Meeting time**: Select the time that works best"
    translation: "**Tijd van de vergadering**: Selecteer het tijdstip dat het beste past"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c5909628c21cd884:
    english: "**Meeting name**: Give your meeting a name. The Time poll title is used by default"
    translation: "**Naam vergadering**: Geef je vergadering een naam. Standaard wordt de titel van de peiling gebruikt"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  81195d01767895e4:
    english: "**Location**: Add a physical location or a meeting link"
    translation: "**Locatie**: Voeg een fysieke locatie of een link naar de vergadering toe"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  af5765f5bdf83132:
    english: "**Statement**: Summarize the result and add any instructions for the meeting"
    translation: "**Verklaring**: Vat de conclusie samen en voeg eventuele instructies voor de vergadering toe"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6c0cb92cca53d36a:
    english: Loomio includes the selected time, meeting name, duration, location, and statement in the outcome notification and calendar invitation.
    translation: Loomio vermeldt het gekozen tijdstip, de naam, de duur, de locatie en de verklaring in de melding over de conclusie en de agenda-uitnodiging.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
