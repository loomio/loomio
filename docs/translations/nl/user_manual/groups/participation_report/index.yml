    translation: "### Gebruik van labels"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  05aecaed54955302:
    english: This shows how frequently various tags have been applied during the specified time frame.  For example, you can see the number of decisions using a particular decision process or template.
    translation: Hier zie je hoe vaak verschillende labels in de gekozen periode zijn gebruikt. Je kunt bijvoorbeeld zien hoeveel besluiten een bepaald besluitvormingsproces of sjabloon gebruiken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9c6a609ca4029056:
