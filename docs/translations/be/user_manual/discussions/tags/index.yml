  5a1856fe42a6cf57:
    english: Edit the tag name or choose a color, then click **Save**.
    translation: Змяніце назву тэга або выберыце колер, затым націсніце **Захаваць**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  372d48b364fa7993:
    english: "![edit tag color](tags_edit_name.png)"
    translation: "![рэдагаванне колеру тэга](tags_edit_name.png)"
