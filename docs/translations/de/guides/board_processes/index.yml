  a29c1c76443ad97f:
    english: Good governance is more than a board meeting, it requires good communication before and after meetings.
    translation: Gute Gremienarbeit umfasst mehr als Sitzungen. Sie braucht auch davor und danach gute Kommunikation.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9f05171a74ac30d0:
    english: |-
      This guide is intended to help you use Loomio in your board or committee, so you can stay connected between meetings, deal with urgent matters and reduce board admin.
      - Continue governance between meetings
      - Keep track of communications
      - Use board meetings for issues that matter
      - Preserve institutional memory with a detailed record
    translation: |-
      Dieser Leitfaden zeigt dir, wie du Loomio in deinem Vorstand oder Ausschuss nutzen kannst. So bleibt ihr zwischen Sitzungen in Kontakt, könnt dringende Fragen klären und den Verwaltungsaufwand verringern.
      - Die Gremienarbeit zwischen Sitzungen fortsetzen
      - Die Kommunikation nachvollziehen
      - Sitzungen für wichtige Fragen nutzen
      - Wissen und Entscheidungen mit einer ausführlichen Dokumentation bewahren
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
