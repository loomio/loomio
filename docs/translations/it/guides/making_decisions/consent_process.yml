  55ccc01c9b274a87:
    english: |-
      ## Key points
      - Aim for a ‘good enough’ decision.
      - Involve many voices to develop a workable proposal.
      - Ask if anyone has a valid objection.
      - Amend the proposal to resolve objections.
    translation: |-
      ## Punti chiave
      - Punta a una decisione «sufficientemente buona».
      - Coinvolgi più persone per elaborare una proposta praticabile.
      - Chiedi se qualcuno ha un'obiezione valida.
      - Modifica la proposta per risolvere le obiezioni.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7c2ef9fc3419f4b7:
    english: |-
      **Typical roles:**
      - Proposer: The person who raises a topic that requires a decision.
      - Facilitator: Someone who can help the proposer do their job efficiently.
    translation: |-
      **Ruoli tipici:**
      - Proponente: la persona che solleva una questione su cui occorre decidere.
      - Facilitatore: la persona che aiuta chi propone a svolgere il proprio compito in modo efficace.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c56d1ea7a5582723:
    english: |-
      ## Consent process steps
      You notice a problem or opportunity and take the initiative.
      1. Present a proposal - start a Loomio **discussion**.
      2. Facilitate a round of questions, reactions and any comments to improve the proposal - run a **Sense check proposal**.
      3. Amend the proposal with suggestions and comments.
      4. Ask if anyone has a meaningful objection to the amended proposal - run a **Consent proposal**.
      5. Integrate valid objections to create an amended version of the proposal that everyone consents is ‘safe to try’ - state the decision **outcome**.
    translation: |-
      ## Fasi del processo di consenso
      Noti un problema o un'opportunità e prendi l'iniziativa.
      1. Presenta una proposta: avvia una **discussione** su Loomio.
      2. Facilita un giro di domande, reazioni e commenti per migliorare la proposta: avvia una **proposta di verifica delle impressioni**.
      3. Modifica la proposta in base ai suggerimenti e ai commenti.
      4. Chiedi se qualcuno ha un'obiezione sostanziale alla proposta modificata: avvia una **proposta di consenso**.
      5. Integra le obiezioni valide per creare una versione della proposta che tutti ritengano possibile provare: comunica la **conclusione** della decisione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  735e10dde58793f0:
    english: |-
      >[!Tip]
      >In more complex decisions you may also include a clarifying **Questions round** at step 2, to help people understand the proposal before inviting them to react and comment on the proposal.
    translation: |-
      >[!Tip]
      >Per le decisioni più complesse puoi includere anche un **Giro di domande** di chiarimento nella fase 2. Aiuta le persone a capire la proposta prima di invitarle a reagire e commentare.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9cf871a054d8e628:
    english: |-
      ## Benefits
      - Faster, efficient, clear and more adaptable decisions.
      - Diverse perspectives and empowered engagement builds trust.
      - A more agile, transparent and inclusive culture.
    translation: |-
      ## Vantaggi
      - Decisioni più rapide, chiare, efficaci e adattabili.
      - Prospettive diverse e partecipazione attiva rafforzano la fiducia.
      - Una cultura più agile, trasparente e inclusiva.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '09907f3ec328e9d2':
    english: "## Applying the Consent process on Loomio"
    translation: "## Come applicare il processo di consenso su Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d7c91a6160b45cf:
    english: |-
      | **Consent process** | **On Loomio** |
      |---|---|
      | You notice a problem or opportunity and take the initiative. |  |
      | **Present a proposal** <br /><br />Write a clear and concise proposal and share it with people impacted. Describe it in a way so that others will understand what you are proposing. | Start a Loomio **discussion**. <br /><br />Name the proposal in the discussion title, and describe it in the context. |
      | **Questions** (Optional) <br /><br />Invite clarifying questions to help people understand the proposal. <br /><br />*“A clarifying question round helps make sure everyone understands the proposal before they say what they think about it.”* | Run a **Question round**. If it is hidden, a group administrator can make it available from [Poll templates](/en/user_manual/polls/poll_templates/). <br /><br />Ask “what do you need to know so you understand the proposal?” |
      | **Reactions** <br /><br />Invite people to offer reactions and comments to improve the proposal. <br /><br />This is a sensing and responding round - *to actively sense and interpret information from the group and then respond or adapt accordingly.* | Run a **[Sense check](/en/user_manual/polls/proposals/sense_check/)** proposal. <br /><br />*In the title:* Name the proposal and say this is an opportunity to react and comment. <br /><br />*In the proposal details:* Clearly frame the proposal and say why it is important.  Include any background information necessary and a link to the current proposal version.  <br /><br />Invite everyone to respond, and to do so before the proposal closes.  |
      | **Amendment** <br /><br />Consider comments and suggestions from people and amend the proposal as appropriate for the good of your organization. <br /><br />Consider any amendments you want to make for the new proposal version. | Reply to comments and suggestions raised in the Sense check proposal. <br /><br />State an **outcome** to summarize the results of the proposal.  <br /><br />Note any concerns or new information discovered, and outline how the proposal will be amended. <br /><br />Say what will happen next and notify people about the outcome. |
      | **Objections** <br /><br />Present the amended proposal version and invite people to state valid objections - objections that might cause harm. <br /><br />Respond to and integrate each objection by amending the proposal. | Run a **[Consent proposal](/en/user_manual/polls/proposals/consent/)** with the amended proposal. <br /><br />*In the title:* Name the decision to be made. <br /><br />*In the proposal details:* Present the proposal and invite people to vote consent or to state a valid objection - an objection that might cause harm.  Remember we are seeking consent that the proposal is 'safe to try'. <br /><br />Respond to and integrate each objection, creating an amended version of the proposal. <br /><br />Notify everyone that there has been a further amendment, and invite them to reconsider their Consent and “change your vote”. <br /><br />Or run successive Consent proposals as necessary until objections are resolved. |
      | **Outcome** <br /><br />When there are no remaining objections and everyone has consented, the result of the decision is announced. | State an **outcome**. <br /><br />Close the proposal. State an outcome and notify everyone involved. <br /><br />State the decision made and thank people for participation in the process. <br /><br />Summarize results of the process and say what will happen next. <br /><br />If no valid objections remain, state that there is consent the proposal is 'safe to try'. <br /><br />The outcome statement is an important record of the decision for future reference. |
    translation: |-
      | **Processo di consenso** | **Su Loomio** |
      |---|---|
      | Noti un problema o un'opportunità e prendi l'iniziativa. |  |
      | **Presenta una proposta** <br /><br />Scrivi una proposta chiara e concisa e condividila con le persone interessate. Descrivila in modo che capiscano che cosa proponi. | Avvia una **discussione** su Loomio. <br /><br />Indica la proposta nel titolo della discussione e descrivila nel contesto. |
      | **Domande** (facoltativo) <br /><br />Invita le persone a porre domande di chiarimento per aiutarle a capire la proposta. <br /><br />*«Un giro di domande di chiarimento aiuta tutti a capire la proposta prima di esprimere un'opinione.»* | Avvia un **Giro di domande**. Se è nascosto, un amministratore del gruppo può renderlo disponibile da [Modelli di sondaggio](/en/user_manual/polls/poll_templates/). <br /><br />Chiedi: «Che cosa devi sapere per capire la proposta?» |
      | **Reazioni** <br /><br />Invita le persone a condividere reazioni e commenti per migliorare la proposta. <br /><br />In questo giro si raccolgono e si valutano le informazioni del gruppo, *per poi rispondere o adattare la proposta di conseguenza.* | Avvia una proposta di **[Verifica delle impressioni](/en/user_manual/polls/proposals/sense_check/)**. <br /><br />*Nel titolo:* indica la proposta e spiega che è un'occasione per reagire e commentare. <br /><br />*Nei dettagli della proposta:* presenta chiaramente la proposta e spiega perché è importante. Includi le informazioni di contesto necessarie e un link alla versione attuale della proposta. <br /><br />Invita tutti a rispondere prima della chiusura della proposta. |
      | **Modifica** <br /><br />Valuta commenti e suggerimenti e modifica la proposta secondo le esigenze della tua organizzazione. <br /><br />Decidi quali modifiche apportare alla nuova versione della proposta. | Rispondi ai commenti e ai suggerimenti ricevuti nella proposta di verifica delle impressioni. <br /><br />Comunica una **conclusione** che riassuma quanto emerso dalla proposta. <br /><br />Annota eventuali preoccupazioni o nuove informazioni e spiega come modificherai la proposta. <br /><br />Indica i prossimi passi e informa le persone della conclusione. |
      | **Obiezioni** <br /><br />Presenta la versione modificata della proposta e invita le persone a esprimere obiezioni valide, cioè obiezioni che indicano un possibile danno. <br /><br />Rispondi a ogni obiezione e integrala modificando la proposta. | Avvia una **[proposta di consenso](/en/user_manual/polls/proposals/consent/)** con la versione modificata. <br /><br />*Nel titolo:* indica la decisione da prendere. <br /><br />*Nei dettagli della proposta:* presenta la proposta e invita le persone a votare per il consenso o a esprimere un'obiezione valida, cioè un'obiezione che indica un possibile danno. Ricorda che si cerca il consenso per provare la proposta senza rischi. <br /><br />Rispondi a ogni obiezione e integrala in una nuova versione della proposta. <br /><br />Informa tutti della nuova modifica e invitali a riconsiderare il proprio consenso e a «cambiare il voto». <br /><br />Se necessario, avvia altre proposte di consenso finché le obiezioni non sono risolte. |
      | **Conclusione** <br /><br />Quando non restano obiezioni e tutti hanno dato il consenso, viene comunicata la decisione. | Comunica una **conclusione**. <br /><br />Chiudi la proposta, comunica la conclusione e informa tutte le persone coinvolte. <br /><br />Indica la decisione presa e ringrazia le persone per aver partecipato al processo. <br /><br />Riassumi quanto emerso e indica i prossimi passi. <br /><br />Se non restano obiezioni valide, dichiara che c'è consenso per provare la proposta senza rischi. <br /><br />La conclusione documenta la decisione e potrà essere consultata in futuro. |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  525fe55f979f05e3:
