  91a303d3d1fb3894:
    english: 'A Loomio group is a safe place for people to meet, have discussions and make decisions. '
    translation: Un grupo de Loomio es un espacio seguro donde las personas pueden reunirse, debatir y tomar decisiones.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ea5096230dfe16d4:
    english: 'It’s a container where group members can find and share information, participate in important discussions and decisions that affect their work.  '
    translation: Es un lugar donde los miembros del grupo pueden encontrar y compartir información, y participar en discusiones y decisiones importantes para su trabajo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  47903117cdc64e73:
    english: A Loomio group looks like this.  At the top of the page you will see an image and logo that you can tailor to represent your organization.  This allows people arriving into your group to see they have joined a place they recognize and feel welcome - a safe space where people feel at home, amongst friends and can participate effectively.
    translation: Así es un grupo de Loomio. En la parte superior de la página verás una imagen y un logotipo que puedes adaptar para representar a tu organización. Así, quienes lleguen a tu grupo podrán reconocer el espacio, sentirse bienvenidos y participar con confianza.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3d39462ab98c79e6:
    english: "![The Oatmilk Cooperative group page, with its description and discussion list](group_page.png)"
    translation: "![Página del grupo Cooperativa Oatmilk, con su descripción y lista de discusiones](group_page.png)"
    status: machine
    provider: codex/gpt-6-sol
