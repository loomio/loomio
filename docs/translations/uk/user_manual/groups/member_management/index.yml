---
navigation_title: Керування учасниками
blocks:
  3d2d8d3f7d252651:
    english: "# Member management"
    translation: "# Керування учасниками"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f9901909d4cd86e0:
    english: If you are an admin, you can manage members from the **Members** tab on your group page.
    translation: Якщо ви координатор групи, керувати її учасниками можна на вкладці **Учасники** сторінки групи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d25e71106f726cac:
    english: Click on the three dots (**⋮**) to the right of the group member to set their title, make them an admin, make them a delegate, or remove them from the group.
    translation: Натисніть три крапки (**⋮**) праворуч від імені учасника, щоб вказати його назву, зробити його координатором або делегатом чи видалити з групи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  db5a08225152e80a:
    english: "![Member actions menu on the Oatmilk Cooperative members page](member_management.png)"
    translation: "![Меню дій учасника на сторінці учасників Oatmilk Cooperative](member_management.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0f29eb85fabc200d:
    english: |-
      ## Administering your group
      There are only two user types in a Loomio group: **member** and **admin**.
    translation: |-
      ## Адміністрування групи
      У групі Loomio є лише два типи користувачів: **учасник** і **координатор**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4317e6fcbbedcdaa:
    english: 'Admins perform administrative tasks for your group, including: adding and removing members, managing member permissions, setting the group privacy levels, and managing the subscription plans.  In addition, admins are able to see the email addresses of members and export the group''s data.'
    translation: 'Координатори адмініструють групу: додають і видаляють учасників, керують їхніми правами доступу, налаштовують приватність групи та керують планом підписки. Вони також можуть бачити електронні адреси учасників і експортувати дані групи.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7de2ea0e85a19d0a:
    english: The person creating a new Loomio group is made admin by default. We recommend to make at least one other trusted person in your group an admin, to insure someone can always administer your group. You can have as many admins in your group as you wish.
    translation: Людина, яка створює групу Loomio, автоматично стає її координатором. Рекомендуємо зробити координатором ще принаймні одну людину, якій ви довіряєте. Тоді хтось завжди зможе адмініструвати групу. Кількість координаторів у групі не обмежена.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ac9e3bb2da56869e:
    english: To make a member **admin**, go to the Members tab, find the member and click on the three dots (**⋮**) next to their name. Choose **Make admin**. An `Admin` tag will appear beside their name.
    translation: Щоб зробити учасника **координатором**, відкрийте вкладку **Учасники**, знайдіть потрібну людину й натисніть три крапки (**⋮**) біля її імені. Виберіть **Зробити координатором**. Поруч з іменем з’явиться позначка `Admin`.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b93c8eaf5367f572:
    english: "![Make admin action in a member's menu](member_make_admin.png)"
    translation: "![Дія «Зробити координатором» у меню учасника](member_make_admin.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f6d7a993e2d32771:
    english: |-
      ## Managing subgroups
      If you are the admin of a parent group, or organization, you have additional permissions with regards to any __closed__ subgroups.
    translation: |-
      ## Керування підгрупами
      Якщо ви координатор батьківської групи або організації, ви маєте додаткові права щодо всіх __закритих__ підгруп.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cd781594b26ae052:
    english: You will be able to join any closed subgroup by clicking the "Join Group" button on the left of the Subgroup page in question (just under the tabs).
    translation: Ви можете приєднатися до будь-якої закритої підгрупи. Для цього натисніть кнопку «Приєднатися до групи» ліворуч на сторінці підгрупи, під вкладками.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ba630e95409473a5:
    english: "![Join group button on a closed Oatmilk Cooperative subgroup](member_join_subgroup.png)"
    translation: "![Кнопка приєднання до закритої підгрупи Oatmilk Cooperative](member_join_subgroup.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  87c2d0e0fa784cff:
    english: Once you have joined the subgroup, you will also be able to make yourself the admin of that subgroup, just as you would promote anyone to admin.
    translation: Після приєднання ви також зможете зробити себе координатором підгрупи так само, як і будь-якого іншого учасника.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e439992d86591319:
    english: |-
      >[!Note]
      >These permissions do not extend to [**secret** subgroups](/en/user_manual/groups/subgroups/?highlight=secret#permissions).
    translation: |-
      >[!Note]
      >Ці права не поширюються на [**таємні** підгрупи](/en/user_manual/groups/subgroups/?highlight=secret#permissions).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  31a8fbe10f50c1a0:
    english: |-
      ## Removing members
      When you click **Remove from group** you'll be asked to confirm the removal. Upon removal, this user will no longer have access to the group's pages, threads, polls, or proposals. They will receive no further emails or notifications of group activity. However, any comments and votes written by the user will remain untouched.
    translation: |-
      ## Видалення учасників
      Після натискання **Видалити з групи** вам потрібно буде підтвердити видалення. Видалена людина втратить доступ до сторінок групи, тем, опитувань і пропозицій. Вона більше не отримуватиме листів і сповіщень про діяльність групи. Її коментарі та голоси залишаться без змін.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8bf29fce0f0d8e9b:
    english: "![Remove from group action in a member's menu](member_remove.png)"
    translation: "![Дія «Видалити з групи» у меню учасника](member_remove.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  aa3b173ffd048b99:
    english: You can add removed members back to the group later if you wish.
    translation: Згодом ви можете знову додати видаленого учасника до групи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6ef7d0422c66d652:
    english: |-
      ## Leaving group
      To leave a group: go to the group page, open the 3 dot menu, and click **Leave group**.
    translation: |-
      ## Вихід із групи
      Щоб вийти з групи, відкрийте її сторінку, натисніть меню з трьома крапками й виберіть **Вийти з групи**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5395b374b5814162:
    english: "![Leave group action in the Oatmilk Cooperative settings menu](member_leave_group.png)"
    translation: "![Дія виходу з групи в меню налаштувань Oatmilk Cooperative](member_leave_group.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d926fc8d1e3cbac2:
    english: |-
      ## Set title
      Within the Members tab, you can also name your role within the group, or identify an organization you represent using **title**. You or a group admin can change your title with **Set title** from the 3 dot menu near your name.
    translation: |-
      ## Назва
      На вкладці **Учасники** ви можете вказати свою роль у групі або організацію, яку представляєте, у полі **назва**. Ви або координатор групи можете змінити цю назву: натисніть меню з трьома крапками біля свого імені й виберіть **Вкажіть назву**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2425e4d5b1e8047d:
    english: "![Set title action in a member's menu](member_set_title.png)"
    translation: "![Дія «Вкажіть назву» у меню учасника](member_set_title.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6af456317883a890:
    english: You can have different titles in different subgroups.
    translation: У різних підгрупах ви можете мати різні назви.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2d59cb70493e06b1:
    english: "## Member email addresses"
    translation: "## Електронні адреси учасників"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cee3a1e0e1031377:
    english: Only admins can see group member email addresses.  This is sometimes necessary to audit the members in a group.
    translation: Електронні адреси учасників групи можуть бачити лише координатори. Іноді це потрібно для перевірки складу групи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4ff1112b058a3205:
    english: 'To see member email addresses: Use [data export](/en/user_manual/groups/data_export/) to download a CSV file, and open the file in Excel or Google sheets.'
    translation: 'Щоб переглянути електронні адреси учасників, скористайтеся [експортом даних](/en/user_manual/groups/data_export/): завантажте CSV-файл і відкрийте його в Excel або Google Таблицях.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  105be57911f832fc:
    english: The export group data file shows every person and their email address in every subgroup.
    translation: Експортований файл даних групи містить імена та електронні адреси всіх учасників кожної підгрупи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  20f87bcff4ec41e6:
    english: You can also search for members by email address in the members tab. So if you see someone you want to remove, you can search by email to remove them.
    translation: На вкладці **Учасники** можна шукати людей за електронною адресою. Так ви можете знайти учасника, якого хочете видалити, і видалити його.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
