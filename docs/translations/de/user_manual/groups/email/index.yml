  14280ff177b248ab:
    english: "# Send an email to start a thread in your group"
    translation: "# Starte eine Diskussion per E-Mail in deiner Gruppe"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e3de5524e10b9928:
    english: Your Loomio group has an email address! You can send or forward email to this address to start a thread in the group.
    translation: Deine Loomio-Gruppe hat eine E-Mail-Adresse. Du kannst eine E-Mail an diese Adresse senden oder weiterleiten, um eine Diskussion in der Gruppe zu starten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  85a7436d4a1b4396:
    english: |-
      You can see your group's email address on the group page:
      ![location of the email address on the group page](email_email_button.png)
    translation: |-
      Die E-Mail-Adresse deiner Gruppe findest du auf der Gruppenseite:
      ![Position der E-Mail-Adresse auf der Gruppenseite](email_email_button.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e34019bbcf3b319f:
    english: When you send an email to this address, a new thread will be started. The email subject becomes the thread title, the body of the email becomes the description, and any attached files will be attached to the thread.
    translation: Wenn du eine E-Mail an diese Adresse sendest, wird eine neue Diskussion gestartet. Der Betreff wird zum Titel der Diskussion, der E-Mail-Text zur Beschreibung. Angehängte Dateien werden der Diskussion hinzugefügt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  46a53b8267a61c2f:
    english: The email "From" address is used to find the group member who will be the author of the thread.
    translation: Anhand der Absenderadresse wird ermittelt, welches Gruppenmitglied als Autor der Diskussion angezeigt wird.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bd7df6f632af8db1:
    english: "## Preventing unauthorized emails"
    translation: "## Unbefugte E-Mails verhindern"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a5118468df167ba0:
    english: To ensure that this feature cannot be used by people who are not members of your group, Loomio will require that the "From" address of an incoming email matches the address of someone in the group.
    translation: Damit nur Mitglieder deiner Gruppe diese Funktion nutzen können, muss die Absenderadresse einer eingehenden E-Mail mit der E-Mail-Adresse eines Gruppenmitglieds übereinstimmen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f11910ae643c5b47:
    english: If you use multiple email addresses, you can add an alias so Loomio knows about your other email addresses.
    translation: Wenn du mehrere E-Mail-Adressen verwendest, kannst du einen Alias hinzufügen. So erkennt Loomio auch deine anderen Adressen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e3d88a25128322b5:
    english: When the "from" address does not match a member of the group, you will receive a notification asking you to add an alias or reject all further emails from that address.
    translation: Wenn die Absenderadresse keinem Gruppenmitglied zugeordnet werden kann, erhältst du eine Benachrichtigung. Darin wirst du aufgefordert, einen Alias hinzuzufügen oder alle weiteren E-Mails von dieser Adresse abzulehnen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  890546269cfa56b6:
    english: This means that the first time you send email from an unrecognised address, you will need to add an alias. After that, emails will be accepted immediately.
    translation: Wenn du zum ersten Mal eine E-Mail von einer unbekannten Adresse sendest, musst du einen Alias hinzufügen. Danach werden E-Mails von dieser Adresse sofort angenommen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
