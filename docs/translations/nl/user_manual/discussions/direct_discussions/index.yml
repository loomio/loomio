  b3ed13f5612f4ff9:
    english: A direct discussion is a private discussion for a specific set of people.
    translation: Een directe discussie is een privédiscussie voor een bepaalde groep mensen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  479f7faed056ab51:
    english: A direct discussion does not belong to a group. Invited people do not need to be a member of your Loomio group.
    translation: Een directe discussie hoort niet bij een groep. Mensen die je uitnodigt, hoeven geen lid te zijn van jouw Loomio-groep.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2f5362faecc07fa0:
    english: You control who can see and participate by adding people or email addresses to the **Invite** field.
    translation: Je bepaalt wie de discussie kan zien en eraan kan deelnemen door mensen of e-mailadressen toe te voegen aan het veld **Uitnodigen**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f31343ea54b4f899:
    english: Direct discussions support the same comments, polls and other tools as group discussions. They can be useful when creating a subgroup is unnecessary.
    translation: In directe discussies kun je dezelfde reacties, peilingen en andere functies gebruiken als in groepsdiscussies. Ze zijn handig als je geen subgroep hoeft te maken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
