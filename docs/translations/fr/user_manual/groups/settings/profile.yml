  0b903e1c3c7e1862:
    english: The profile tab controls how your group is identified and introduced. Open **Edit group settings** from the group page, then select **Profile**.
    translation: L’onglet Profil définit la façon dont votre groupe est présenté et identifié. Sur la page du groupe, ouvrez **Modifier les paramètres du groupe**, puis sélectionnez **Profil**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
