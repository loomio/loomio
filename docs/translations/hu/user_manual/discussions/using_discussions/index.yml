  a929b22d02292573:
    english: "**Seen by** shows who has opened the thread and when. It can help you identify people who may not have seen important information yet."
    translation: A **Látta** megmutatja, ki és mikor nyitotta meg a szálat. Így láthatod, ki az, aki esetleg még nem olvasott fontos információt.
