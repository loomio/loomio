  980342866ab7bee6:
    english: An in-depth guide to applying key facilitation concepts in the online space.
    translation: Падрабязны дапаможнік па ўжыванні асноўных прынцыпаў вядзення групавых абмеркаванняў у інтэрнэце.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ac8728f5ce2ea8ce:
    english: Loomio is made by facilitators, and that plays a huge role in how it has been designed. This guide is about revealing more of that context, and translating facilitation concepts from the offline space to the online space.
    translation: Loomio стварылі людзі з досведам вядзення групавых абмеркаванняў. Гэты досвед істотна паўплываў на тое, як уладкаваны сэрвіс. Дапаможнік раскрывае гэты кантэкст і паказвае, як ужываць прынцыпы вочнага абмеркавання ў інтэрнэце.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e802660a44da1775:
    english: "## More about this guide"
    translation: "## Падрабязней пра дапаможнік"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5cbd64dba51ca485:
    english: Whether employed by a professional facilitator, people peer-facilitating each other, or a group that has no awareness of facilitation at all, Loomio’s essential function is to mediate and support group communication toward a desired outcome. In other words, facilitation.
    translation: Loomio дапамагае групе весці размову і рухацца да патрэбнага выніку. Гэта працуе і калі абмеркаванне вядзе дасведчаная асоба, і калі ўдзельнікі дапамагаюць адно аднаму, і калі група не карыстаецца адмысловымі метадамі вядзення абмеркаванняў.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  25a956280b647fa6:
    english: 'Loomio is *groupware*:'
    translation: 'Loomio — гэта *праграмнае забеспячэнне для групавой працы*:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  33e304be58a0a55b:
    english: "> Collaborative software, or groupware, is designed to help people involved in a common task achieve their goals. One of the earliest definitions of collaborative software is “intentional group processes plus software to support them.” -- Wikipedia"
    translation: "> Праграмнае забеспячэнне для сумеснай, або групавой, працы дапамагае людзям, якія выконваюць агульную задачу, дасягаць сваіх мэт. Адно з першых азначэнняў такога праграмнага забеспячэння — «мэтанакіраваныя групавыя працэсы і праграмы для іх падтрымкі». -- Вікіпедыя"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  170a0b463e1ad8ca:
    english: There is a huge body of knowledge, best practice, and tradition in both in-person facilitation and online moderation, but the art and science of their intersection is only just emerging. This is the specific space where Loomio strives to excel.
    translation: Пра вядзенне вочных абмеркаванняў і мадэрацыю ў інтэрнэце назапашана шмат ведаў, практычных падыходаў і традыцый. А вось падыходы, якія аб’ядноўваюць гэтыя сферы, толькі пачынаюць складвацца. Менавіта тут Loomio імкнецца быць асабліва карысным.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
