---
navigation_title: Diskussion starten
blocks:
  8fae4100a4f3548b:
    english: "# Start a discussion"
    translation: "# Diskussion starten"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4ba984e9573c27ff:
    english: Starting a Loomio discussion is like writing an email. The subject line of an email is like the discussion title, and the text you write in an email is like the context of a discussion.
    translation: Eine Diskussion in Loomio zu starten ist ähnlich wie eine E-Mail zu schreiben. Der Betreff entspricht dem Titel der Diskussion, der E-Mail-Text dem Kontext.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4f81447c072f5dfe:
    english: As you add people in the send list of your email, in Loomio you can invite people individually or as a group to the discussion - they will receive an email notification with the content of your discussion.
    translation: Wie bei den Empfängern einer E-Mail kannst du in Loomio einzelne Personen oder eine ganze Gruppe zur Diskussion einladen. Sie erhalten eine E-Mail-Benachrichtigung mit dem Inhalt deiner Diskussion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2408b54e3b78a282:
    english: People can reply to your discussion via email and their comments will appear in the discussion.
    translation: Andere können per E-Mail auf deine Diskussion antworten. Ihre Kommentare erscheinen dann in der Diskussion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  24ced64c5c4cf853:
    english: As with an email, a discussion may be a simple question, or a more detailed introduction to a topic with links or files attached for background information.
    translation: Wie eine E-Mail kann eine Diskussion eine einfache Frage sein oder ein Thema ausführlicher vorstellen. Für Hintergrundinformationen kannst du Links oder Dateien hinzufügen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ec39413fa07094c8:
    english: "## New discussion"
    translation: "## Neue Diskussion"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  92b37b2e208bfd57:
    english: Find the **New discussion** button on your Loomio group page to start a new discussion.
    translation: Klicke auf deiner Loomio-Gruppenseite auf **Neue Diskussion**, um eine Diskussion zu starten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  515ac46bdfccb401:
    english: You can start a discussion within your Loomio group or any subgroup.
    translation: Du kannst eine Diskussion in deiner Loomio-Gruppe oder einer ihrer Untergruppen starten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ef9721ba6b69b86b:
    english: "![New discussion button on the Oatmilk Cooperative page](new-discussion-button.png)"
    translation: "![Schaltfläche „Neue Diskussion“ auf der Seite der Hafermilch-Genossenschaft](new-discussion-button.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1cf9e569475cd2cc:
    english: "![New discussion form for planning the returnable bottle trial](new-discussion-example.png)"
    translation: "![Formular für eine neue Diskussion zur Planung eines Versuchs mit Mehrwegflaschen](new-discussion-example.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f973f5b9f1c4b1dd:
    english: |-
      ### Group
      Check the name of the group or subgroup is correct for your discussion.  Anyone in this group will be able to see the discussion. You can also start the discussion in another group or as a 'direct' discussion (no group).
    translation: |-
      ### Gruppe
      Prüfe, ob die richtige Gruppe oder Untergruppe für deine Diskussion ausgewählt ist. Alle Mitglieder dieser Gruppe können die Diskussion sehen. Du kannst die Diskussion auch in einer anderen Gruppe oder als „direkte“ Diskussion ohne Gruppe starten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f0b0bda9877ce0ed:
    english: |-
      >[!Tip]
      >If you are not ready to make the discussion visible in your group, start the discussion as 'direct'.  You can move the discussion to your Loomio group when ready.
    translation: |-
      >[!Tip]
      >Wenn die Diskussion noch nicht für deine Gruppe sichtbar sein soll, starte sie als „direkte“ Diskussion. Du kannst sie später in deine Loomio-Gruppe verschieben.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cd1b45c3cb71503b:
    english: "### Invite and notify"
    translation: "### Einladen und benachrichtigen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f3f388d23b06b25c:
    english: The **Invite** field controls who receives the new discussion immediately.
    translation: Über das Feld **Einladen** legst du fest, wer die neue Diskussion sofort erhält.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c1b5c23770d3692:
    english: Group members can see a discussion in their group even if you do not notify them. Adding a group member to **Invite** sends them an email notification and a notification in Loomio.
    translation: Gruppenmitglieder können eine Diskussion in ihrer Gruppe auch dann sehen, wenn du sie nicht benachrichtigst. Wenn du ein Gruppenmitglied zu **Einladen** hinzufügst, erhält es eine E-Mail-Benachrichtigung und eine Benachrichtigung in Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e2e5906a39131506:
    english: Select a group to notify everyone in it, or expand the group to choose individual members. Select the × beside a name to remove that person from the notification.
    translation: Wähle eine Gruppe aus, um alle ihre Mitglieder zu benachrichtigen. Oder klappe die Gruppe auf und wähle einzelne Mitglieder aus. Wähle das × neben einem Namen, um die Person aus der Benachrichtigung zu entfernen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  81b57efbb3c428b7:
    english: "![Invite field expanded to show individual recipients](../notifying_people/thread_notification.png)"
    translation: "![Aufgeklapptes Feld „Einladen“ mit einzelnen Empfängern](../notifying_people/thread_notification.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5cbd2b7b0bcc486f:
    english: Start typing a member's name and select it from the list.
    translation: Beginne, den Namen eines Mitglieds einzugeben, und wähle ihn aus der Liste aus.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dc128abbc65cb0c8:
    english: "![Searching for Samira Patel in the Invite field](../notifying_people/thread_notify_user.png)"
    translation: "![Suche nach Samira Patel im Feld „Einladen“](../notifying_people/thread_notify_user.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3274fe93fcf29b29:
    english: Enter an email address to invite a guest. A guest can see and participate in this thread but cannot see other discussions in the group unless separately invited.
    translation: Gib eine E-Mail-Adresse ein, um einen Gast einzuladen. Ein Gast kann diese Diskussion sehen und sich daran beteiligen. Andere Diskussionen der Gruppe kann er nur sehen, wenn er auch dazu eingeladen wird.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ab3214ccf77143e3:
    english: "![Adding a guest email address to the Invite field](../notifying_people/thread_notify_email.png)"
    translation: "![Hinzufügen der E-Mail-Adresse eines Gasts zum Feld „Einladen“](../notifying_people/thread_notify_email.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cba9346e727b829a:
    english: You can also start the discussion without notifying anyone. Group members can still find it in Loomio and may see it in their catch-up email, depending on their notification settings.
    translation: Du kannst die Diskussion auch starten, ohne jemanden zu benachrichtigen. Gruppenmitglieder können sie weiterhin in Loomio finden. Je nach ihren Benachrichtigungseinstellungen sehen sie die Diskussion möglicherweise auch in ihrer Zusammenfassungs-E-Mail.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6518afe373ff1959:
    english: "### Tags"
    translation: "### Schlagwörter"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ff67c09f89479873:
    english: Add tag(s) to help people find your discussion when searching by tag. Admins can create new tags.
    translation: Füge Schlagwörter hinzu, damit andere deine Diskussion bei der Suche nach Schlagwörtern finden können. Administratoren können neue Schlagwörter erstellen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ba80a903c4ecc7d1:
    english: |-
      ### Title
      Give your discussion a relevant title.  A discussion title is similar to an email subject line.
    translation: |-
      ### Titel
      Gib deiner Diskussion einen passenden Titel. Der Titel einer Diskussion entspricht etwa dem Betreff einer E-Mail.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a91cf4b0b1b2ad5e:
    english: |-
      ### Context
      Use discussion context to introduce the topic and frame the conversation or decision to make. Use the formatting tools to emphasize key points. Include background information, attach files, link to online documents and embed a video.
    translation: |-
      ### Kontext
      Nutze den Kontext der Diskussion, um das Thema vorzustellen und zu erklären, worüber gesprochen oder entschieden werden soll. Mit den Formatierungswerkzeugen kannst du wichtige Punkte hervorheben. Füge Hintergrundinformationen und Dateien hinzu, verlinke Online-Dokumente oder bette ein Video ein.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1bf690aa841299cd:
    english: The context will always stay at the top of the discussion and you can update it at any time as the discussion progresses.  When the discussion ends, update the context with the outcome.
    translation: Der Kontext bleibt immer oben in der Diskussion. Du kannst ihn jederzeit aktualisieren, während die Diskussion voranschreitet. Wenn die Diskussion endet, ergänze den Kontext um das Fazit.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
