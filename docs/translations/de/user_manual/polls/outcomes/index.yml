  7478a826673bce70:
    english: When your proposal or poll closes, you’ll be prompted to enter an **outcome**.
    translation: Wenn dein Vorschlag oder deine Abstimmung endet, wirst du aufgefordert, ein **Fazit** einzugeben.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ccaf1bc50a4f4734:
    english: State the results of the proposal or poll and say what will happen next.
    translation: Halte das Ergebnis des Vorschlags oder der Abstimmung fest und beschreibe, wie es weitergeht.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fde482f3a84e26e6:
    english: The outcome statement is an important record of the poll or decision - a succinct statement for future reference.
    translation: Das Fazit hält die Abstimmung oder Entscheidung für später fest.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9f4a341103cf4286:
    english: "## Outcome statements for common decision processes"
    translation: "## Fazite für gängige Entscheidungsprozesse"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  457a047ee6ae5975:
    english: |-
      | **Decision process** | **When the decision is made** | **Outcome** |
      |---|---|---|
      | Advice process | When advice has been received and taken into account. | State the decision made and thank people for their advice and feedback. |
      | Consent process | When there are no remaining objections. | State that no valid objections remain and there is consent that the proposal is 'safe to try'.  |
      | Consensus process | When most* people agree. | State proposal results and the decision made. |
    translation: |-
      | **Entscheidungsprozess** | **Wann die Entscheidung getroffen wird** | **Fazit** |
      |---|---|---|
      | Beratungsprozess | Wenn die Ratschläge eingegangen sind und berücksichtigt wurden. | Halte die Entscheidung fest und danke den Beteiligten für ihre Ratschläge und Rückmeldungen. |
      | Konsentverfahren | Wenn keine Einwände mehr bestehen. | Halte fest, dass keine begründeten Einwände mehr bestehen und der Vorschlag als „sicher genug zum Ausprobieren“ gilt.  |
      | Konsensverfahren | Wenn die meisten* Beteiligten zustimmen. | Halte das Abstimmungsergebnis und die Entscheidung fest. |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f8adf692b7b22c59:
    english: "**The majority or supermajority as governed by constitution or by prior agreement within your organization.*  "
    translation: "**Je nach Satzung oder vorheriger Vereinbarung in deiner Organisation ist damit eine einfache oder qualifizierte Mehrheit gemeint.*"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  278c243b460bef68:
    english: 'Whatever the results, there is always something to learn from the proposal and poll. '
    translation: Unabhängig vom Ergebnis lässt sich aus jedem Vorschlag und jeder Abstimmung etwas lernen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e694b60515143fcb:
    english: If your proposal fails, consider what new understanding has been gained, and if this can be accommodated to reach a better decision.
    translation: Wenn dein Vorschlag keine Zustimmung findet, überlege, welche neuen Erkenntnisse gewonnen wurden und ob sie zu einer besseren Entscheidung beitragen können.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  780a97e6dd058d5d:
    english: 'The outcome statement is an opportunity to state the results and what has been learnt.  '
    translation: Im Fazit kannst du das Ergebnis und die gewonnenen Erkenntnisse festhalten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ca65851b5da70691:
    english: You can notify people - they will receive an email from Loomio containing the poll results and your outcome statement.
    translation: Du kannst die Beteiligten benachrichtigen. Sie erhalten dann eine E-Mail von Loomio mit dem Abstimmungsergebnis und deinem Fazit.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  64d6b82a9343b3a6:
    english: 'You can also set a **Review date**: a future date when you would like to review this poll or decision. For example, you might review a strategy at the same time next year.'
    translation: 'Du kannst auch ein **Prüfungsdatum** festlegen: ein Datum, an dem du die Abstimmung oder Entscheidung erneut betrachten möchtest. Zum Beispiel könntest du eine Strategie zur gleichen Zeit im nächsten Jahr überprüfen.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  60605804c2662fc8:
