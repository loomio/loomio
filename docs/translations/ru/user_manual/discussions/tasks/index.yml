navigation_title: Задания
blocks:
  970146a02b39726b:
    english: "# Tasks"
    translation: "# Задания"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bea1dad1b0b47107:
    english: Use tasks in threads and comments to name an action, assign it to someone, set a due date, and track whether it is complete.
    translation: Используйте задания в темах и комментариях, чтобы указать, что нужно сделать, назначить исполнителя, установить срок и следить за выполнением.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2398b3493bad759e:
    english: "## Add a task"
    translation: "## Добавить задание"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c240866e019fab51:
    english: While writing a thread or comment, expand the formatting toolbar and click **Task list**. Type the action beside the checkbox.
    translation: Когда пишете сообщение в теме или комментарий, разверните панель форматирования и нажмите **Список заданий**. Рядом с флажком напишите, что нужно сделать.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f7d4f63b321e9af1:
    english: "## Name and assign the task to a person"
    translation: "## Назвать задание и назначить исполнителя"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5ea902e45aaf1f7a:
    english: Use an @mention in the task to assign it to a group member. An **Add due date** button appears once the task has an assignee.
    translation: Чтобы назначить задание участнику группы, упомяните его в тексте задания через @. После назначения появится кнопка **Добавить дату сдачи**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1134aedee6cafd8c:
    english: Tasks assigned to you appear on your **Tasks** page. Open **Tasks** from the sidebar to see them grouped by thread or poll.
    translation: Назначенные вам задания находятся на странице **Задания**. Откройте **Задания** на боковой панели, чтобы увидеть их по темам и голосованиям.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5eae519b81c94f7a:
    english: "## Set a reminder"
    translation: "## Настроить напоминание"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  561597d43d716888:
    english: Click **Add due date** to choose a due date and when Loomio should email the assignee a reminder. You can also remove an existing due date from this dialog.
    translation: Нажмите **Добавить дату сдачи**, чтобы выбрать срок выполнения и время, когда Loomio отправит исполнителю напоминание по электронной почте. В этом же окне можно удалить установленный срок.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bd36c23f297b0429:
    english: "## Mark it as done"
    translation: "## Отметить задание как выполненное"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  59b6138f35694902:
    english: Click the checkbox beside a task to mark it as done. You can do this while editing the text, while reading it if you are the assignee, or from the **Tasks** page. Click it again to reopen the task.
    translation: Нажмите флажок рядом с заданием, чтобы отметить его как выполненное. Это можно сделать при редактировании текста, при чтении, если задание назначено вам, или на странице **Задания**. Нажмите флажок ещё раз, чтобы снова открыть задание.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
