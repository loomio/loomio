    translated_on: '2026-09-30'
  0ce0604bb021d98f:
    english: "## Invitation"
    translation: "## Invitation"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d5fabca3934dafd:
    english: How participants are invited into a facilitated space is incredibly important. People understand huge amounts of information from the invitation, and use it to judge how a space will be held and if they belong there. The moment of invitation is in many ways the defining opportunity to set the tone and establish trust.
    translation: La façon d’inviter les personnes à participer à un espace animé est essentielle. Une invitation leur donne beaucoup d’informations. Elle les aide à comprendre comment l’espace sera animé et si elles y ont leur place. C’est un moment décisif pour donner le ton et établir la confiance.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a8d7e10a50432195:
    english: |-
      > <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../rich_200.png"> Decision making is all about communication: your group can only make good decisions together if there’s a foundation of good communication in place first. This means being clear about what the purpose of a discussion or meeting is, who needs to be involved, what the time-frame is, and what people can expect.
      >
      > — Richard Bartlett
    translation: |-
      > <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../rich_200.png"> Prendre des décisions ensemble repose sur la communication. Votre groupe ne peut prendre de bonnes décisions que s’il dispose d’abord d’une base solide pour communiquer. Le but de la discussion ou de la réunion, les personnes à associer, le calendrier et ce que chacun peut attendre doivent être clairs.
      >
      > — Richard Bartlett
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ab260e60bf87a11d:
    english: 'Key aspects to an invitation:'
    translation: 'Les points essentiels d’une invitation :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ff258493e21d7f3a:
    english: |-
      * **Background.** What is this thing? What am I being asked to do? Who is behind this? Who else will be involved? What is the time commitment, topic focus, and protocol?
      * **Context.** What is the character of this specific engagement? Of all the possible formats and ways it could go, which one will it be? Why now, why this way?
      * **Belonging.** Am I welcome? Is this for me? Am I needed in this process? What is my unique value and contribution? Why should I specifically be compelled?
      * **Safety.** Does this invitation indicate thoughtfulness, trust, and understanding? Is the structure of the engagement up to handling the inherent power dynamics at play? What level of honesty or vulnerability will this require of me? Do I think the person inviting is going to hold me well?
      * **Accessibility.** Will my basic requirements for participation be accommodated? Language, assistive technology, unfamiliar jargon, etc. Will it be possible for me to engage?
    translation: |-
      * **Présentation.** De quoi s’agit-il ? Que me demande-t-on de faire ? Qui est à l’origine de cette démarche ? Qui d’autre y participera ? Combien de temps faudra-t-il y consacrer ? Quel est le sujet et quelles sont les règles de participation ?
      * **Contexte.** Quelle forme prendra cette démarche ? Parmi les différentes possibilités, laquelle a été choisie ? Pourquoi maintenant et pourquoi de cette manière ?
      * **Place de chacun.** Suis-je bienvenu ? Cette démarche me concerne-t-elle ? Ma participation est-elle nécessaire ? Quelle contribution particulière puis-je apporter ? Pourquoi devrais-je m’y engager ?
      * **Sécurité.** Cette invitation témoigne-t-elle d’attention, de confiance et de compréhension ? La démarche tient-elle compte des rapports de pouvoir en jeu ? Quel degré de franchise ou de vulnérabilité exigera-t-elle de moi ? La personne qui m’invite saura-t-elle m’accompagner ?
      * **Accessibilité.** Mes besoins essentiels pour participer seront-ils pris en compte ? La langue, les technologies d’assistance ou un vocabulaire qui ne m’est pas familier feront-ils obstacle ? Pourrai-je participer ?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aabfa9d842af2688:
    english: On Loomio
    translation: Sur Loomio
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8a87ed2ddb6c659f:
    english: |-
      * The tool has a built-in function to [invite users](/en/user_manual/groups/inviting_people/) by email or by sending them a special link. Users can also request to join your group if your settings allow.
      * The invitation tools built into the software are very basic, and getting an unexpected login request for new software without context isn't very inviting, so group creators often introduce people to the idea of Loomio through a separate process.
      * Many aspects of Loomio are already designed to create a safe and respectful space users would want to enter — such as thoughtful [privacy options](/en/user_manual/groups/starting_a_group/#privacy).
      * The design of the software itself is meant to be friendly, simple, and professional, hopefully putting out a trustworthy vibe.
      * Loomio has accessibility features, for people who use assistive technology like screen readers, and translation features for people who speak different languages. Emphasising these aspects in an invitation can make some people feel more welcome.
    translation: |-
      * Loomio permet d’[inviter des personnes](/en/user_manual/groups/inviting_people/) par courriel ou au moyen d’un lien. Si vos paramètres le permettent, elles peuvent aussi demander à rejoindre votre groupe.
      * Les outils d’invitation intégrés sont simples. Recevoir sans explication une demande de connexion à un nouveau logiciel peut dérouter. Les personnes qui créent un groupe présentent donc souvent Loomio par un autre moyen avant d’envoyer l’invitation.
      * Plusieurs aspects de Loomio sont conçus pour offrir un espace sûr et respectueux, notamment ses [options de confidentialité](/en/user_manual/groups/starting_a_group/#privacy).
      * L’interface de Loomio se veut accueillante, simple et professionnelle, afin d’inspirer confiance.
      * Loomio propose des fonctions d’accessibilité pour les personnes qui utilisent des technologies d’assistance, comme les lecteurs d’écran, ainsi que des traductions pour les personnes qui parlent différentes langues. Les mentionner dans l’invitation peut aider certaines personnes à se sentir bienvenues.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cb459c1230aaf54c:
    english: "## Arrival"
    translation: "## Arrivée"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ef55fa893f9e1034:
    english: The moment of arrival is the “first impression” of an engagement, and sets the trajectory from there on in. The person has accepted an invitation and decided to step in. They are open and expectant, and the impression they get will make a big impact on their experience.
    translation: L’arrivée donne la première impression et influence la suite de l’expérience. La personne a accepté l’invitation et décidé de participer. Elle découvre l’espace avec des attentes, et cette première impression comptera beaucoup pour elle.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  66e7e79597f6a3d0:
    english: |-
      ### Welcoming
      To enable openness to engagement, participation, and receptivity, a person has to feel welcome. They need their existence acknowledged, and to feel a sense of hospitality.
    translation: |-
      ### Accueil
      Pour participer librement et être réceptive aux échanges, une personne doit se sentir bienvenue. Elle a besoin que sa présence soit reconnue et de recevoir un accueil chaleureux.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b3ce2bd5e2ea9acd:
    english: |-
      ### Settling
      When someone enters a physical room, they want to know where to sit, where the exit is, where to go to the bathroom, and if there is coffee available. They need a basic introduction to the space and their place in it.
    translation: |-
      ### Prendre ses repères
      Quand une personne entre dans une salle, elle veut savoir où s’asseoir, où se trouve la sortie, où sont les toilettes et si elle peut prendre un café. Elle a besoin de découvrir les lieux et de comprendre quelle y sera sa place.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d6fd9d29415a172:
    english: |-
      * The group description fields and discussion context box are the main space to put a “welcome message” for people arriving into the space.
      * Take a tour of the Loomio space, tweak things to make yourself comfortable (like [notification settings](/en/user_manual/users/email_settings/) and your [profile photo](/en/user_manual/users/user_profile/).
      * See information how you like using different thread views and options like Recent, Unread, Mute, and Star. Make yourself at home.
    translation: |-
      * La description du groupe et le champ de contexte d’une discussion sont les principaux endroits où placer un message de bienvenue pour les personnes qui arrivent.
      * Explorez votre espace Loomio et adaptez-le à vos préférences, par exemple en réglant les [paramètres de notification](/en/user_manual/users/email_settings/) et en ajoutant votre [photo de profil](/en/user_manual/users/user_profile/).
      * Affichez les informations comme vous le souhaitez grâce aux différentes vues des fils de discussion et aux options comme Récent, Non lu, Ignorer et Favoris. Prenez vos repères.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8acf15fe96515738:
    english: "## Who’s in the Room"
    translation: "## Qui est présent"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  48c4449cd1d9b135:
    english: Introducing yourself and being introduced to others is one of the most basic and most important human social functions. From Māori *mihimihi* to British “how do you do” to Japanese business card exchanges, every culture places a lot of importance on this. It goes beyond practicalities and politeness and touches on a deep human need, which is a prerequisite for comfort, openness, and focus.
    translation: Se présenter et faire connaissance avec les autres fait partie des pratiques sociales les plus fondamentales. Du *mihimihi* māori au « how do you do » britannique, en passant par l’échange de cartes de visite au Japon, toutes les cultures y accordent de l’importance. Au-delà des usages et de la politesse, cela répond à un besoin humain profond. C’est une condition pour se sentir à l’aise, s’ouvrir aux autres et se concentrer.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a8eec818aeb74e64:
    english: As a facilitator, if you don’t give people a chance to introduce themselves and find out who is around them, they will generally subvert whatever else you’re trying to point their attention at until you allow this process to occur. Consciously design introductions as a feature, and use them as an opportunity to further the overall goals of the interaction.
    translation: Si vous animez un groupe sans donner aux personnes la possibilité de se présenter et de découvrir qui les entoure, leur attention reviendra généralement sur cette question, quels que soient les autres sujets que vous proposez. Prévoyez les présentations dans votre démarche et profitez-en pour faire avancer les objectifs de l’échange.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ad3d2a31a23af036:
    english: "### Check in"
    translation: "### Tour de parole initial"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  71d51a259d8b2c35:
    english: Even among groups who already know each other well, this introduction process continues with “checking in” – where everyone has a chance to speak at the beginning of a meeting (often to a question of "what is on top for you", "how are you", or "is there anything preventing you from being present") and other good practices for team cohesion. People have a multitude of identities, which change based on the context. People answer and re-answer “who am I for this moment” all the time, and that is what allows them to orient around one another.
    translation: Même dans les groupes où tout le monde se connaît bien, les présentations se prolongent par un tour de parole initial. Au début d’une réunion, chacun peut dire ce qui l’occupe, comment il va ou si quelque chose l’empêche d’être pleinement présent. Cette pratique contribue aussi à la cohésion du groupe. Chaque personne a plusieurs facettes, qui prennent une place différente selon le contexte. En se demandant régulièrement « qui suis-je à ce moment précis ? », les personnes trouvent leurs repères les unes par rapport aux autres.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0573ae3aef6f1c6c:
    english: People's expression does not occur in a vaccuum, but in the context of who they are. A multi-faceted view of someone’s identity is an essential aspect of interpreting their contributions.
    translation: Les propos d’une personne prennent sens dans le contexte de ce qu’elle vit et de qui elle est. Pour comprendre ses contributions, il est essentiel de tenir compte des différentes facettes de son identité.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  86eb005fd168a424:
    english: "> We start many of our meetings with everyone “checking in” before we get to the agenda. These check-ins are focused not on your work tasks, but on how you’re doing as a human being. If you’re going through a rough patch at home, or you’re sick, or you have exciting positive news, understanding your state of mind will help the entire group have the right context to interpret how you’re communicating. — Richard Bartlett"
    translation: "> Nous commençons beaucoup de nos réunions par un tour de parole, avant de passer à l’ordre du jour. Il ne porte pas sur les tâches de chacun, mais sur la façon dont les personnes vont. Si vous traversez une période difficile chez vous, si vous êtes malade ou si vous avez une bonne nouvelle à partager, connaître votre état d’esprit aide tout le groupe à comprendre votre façon de communiquer. — Richard Bartlett"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d5aea1c0564ccff8:
    english: |-
      * Create a thread called "Introduce yourself" or "Check in". It provides a useful first _call to action_ everyone coming in will understand.
      * For “request to join” groups, we have a function that allows the requestor to introduce themselves to the coordinator, to get access to the group. Some groups have a process of re-posting this content in the intro thread to welcome people in.
      * Upload profile photos! Photos of faces are one of the most powerful ways of feeling like you know who is in the room with you online.
    translation: |-
      * Créez une discussion intitulée « Présentez-vous » ou « Comment allez-vous ? ». Elle donne aux personnes qui arrivent une première _action à entreprendre_ facile à comprendre.
      * Dans les groupes où il faut demander à adhérer, une fonction permet à la personne qui fait la demande de se présenter à la personne coordinatrice pour obtenir l’accès au groupe. Certains groupes republient ensuite cette présentation dans la discussion d’accueil.
      * Ajoutez des photos de profil. Voir les visages aide beaucoup à savoir qui participe avec vous en ligne.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d3b245589018cebf:
    english: "## Who’s NOT in the Room"
    translation: "## Qui est absent"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5daf97a7cbbdd355:
    english: Diversity is critical for quality group decision making. The “wisdom of the crowd effect” (collective intelligence) only works by combining a variety of viewpoints. Outcomes of collaboration processes depend heavily on which voices are, and are not, represented. It’s impossible to have perfect representative inclusion, but you need to take into account who might be missing.
    translation: La diversité est essentielle à la qualité des décisions prises en groupe. La « sagesse des foules », ou intelligence collective, repose sur la combinaison de points de vue variés. Le résultat d’une démarche collective dépend fortement des voix qui y sont représentées et de celles qui en sont absentes. Une représentation parfaite est impossible, mais il faut réfléchir aux personnes qui pourraient manquer.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b16b07380f6bc37c:
    english: It’s extremely common for people to have blind spots around privilege. Humans are not great at intuiting bias, and are a lot better at noticing the presence of something, rather than the absence. Our minds trick us. For example, when women and men are deliberately given an equal amount of talking time there is often a perception that women are getting more than their fair share, due to different ideas about how much they “should” talk ([more details](https://www.quora.com/Do-women-tend-to-talk-more-than-men)). It can be necessary to actually measure or count to get an accurate picture, instead of relying on intuition.
    translation: Il est courant de ne pas voir les effets de ses propres privilèges. Nous repérons plus facilement ce qui est présent que ce qui manque, et notre intuition détecte mal les biais. Par exemple, lorsque les femmes et les hommes disposent délibérément du même temps de parole, certaines personnes ont l’impression que les femmes parlent trop. Cette impression tient à des attentes différentes sur le temps de parole qui devrait leur revenir ([plus de détails](https://www.quora.com/Do-women-tend-to-talk-more-than-men)). Pour obtenir une image juste de la situation, il peut être nécessaire de mesurer ou de compter plutôt que de se fier à son intuition.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2b720395fe4e451f:
    english: Someone who does not have particular accessibility needs may not even notice that a venue isn’t wheelchair accessible, a document isn’t formatted for screen readers, or a situation is excluding someone with hearing loss. But the people with those challenges will notice. Someone without kids might not consider that a 7PM meeting time won't work for parents. These, and a thousand other practical, social, and cultural elements, could block someone from *being in the room*.
    translation: Une personne sans besoin particulier d’accessibilité peut ne pas remarquer qu’un lieu est inaccessible en fauteuil roulant, qu’un document ne peut pas être lu par un lecteur d’écran ou qu’une situation exclut les personnes malentendantes. Les personnes concernées, elles, le remarqueront. Une personne sans enfant peut ne pas penser qu’une réunion à 19 h ne convient pas aux parents. Ces obstacles et bien d’autres facteurs pratiques, sociaux ou culturels peuvent empêcher quelqu’un *d’être présent*.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  25ac4ed8610c591c:
    english: 'It’s especially important to think about who is not in room when trying to solve problems for others: build with, not for; talk with people, not about them. If the people you are trying to serve are not in the room, it’s very unlikely you’ll have all the input you need to be effective. This is just as much about effectiveness for business outcomes as about social justice; it’s almost always better to design collaboration *with* the users or stakeholders.'
    translation: 'Il est particulièrement important de penser aux personnes absentes quand vous cherchez à résoudre des problèmes qui les concernent : construisez avec elles et parlez avec elles. Si les personnes que vous souhaitez aider ne participent pas, il est peu probable que vous disposiez de toutes les informations nécessaires pour agir efficacement. C’est une question d’efficacité autant que de justice sociale : il vaut presque toujours mieux concevoir une démarche collective *avec* les personnes qui l’utiliseront ou qu’elle concerne.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6b44ef1725c36586:
    english: |-
      * Collaborating online can allow for whole other levels of inclusion. Instead of thinking about a “digital divide”, think about the “digital bridge” — how technology can include people who cannot attend in-person meetings or participate at a specific time, and enable whole new possibilities like multi-lingual discussions.
      * Loomio makes it very clear who is invited to a group and who has participated in a discussion, giving important information for thinking about inclusion. If people are missing, you can see that.
      * If inclusive decision making and diversity of thinking are important to you, periodically ask yourself, “Who’s not in the room? Why?”
    translation: |-
      * La collaboration en ligne peut ouvrir de nouvelles possibilités d’inclusion. Au-delà de la « fracture numérique », pensez au « pont numérique » : la technologie peut inclure des personnes qui ne peuvent pas assister à une réunion en personne ou participer à une heure précise. Elle rend aussi possibles des discussions multilingues.
      * Loomio montre clairement qui a été invité dans un groupe et qui a participé à une discussion. Ces informations aident à réfléchir à l’inclusion et à repérer les personnes absentes.
      * Si les décisions inclusives et la diversité des points de vue comptent pour vous, demandez-vous régulièrement : « Qui est absent ? Pourquoi ? »
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0a5324e7de64cdba:
    english: "## Culture, Protocol, Expectations"
    translation: "## Culture, règles et attentes"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  851a2601b835fbb1:
    english: Culture can be quite a nebulous concept, and operates at multiple levels. The culture of the wider society has a big influence, but you can think of every group, and every session or discussion, as having a culture of its own.
    translation: La culture est une notion parfois difficile à définir, qui agit à plusieurs niveaux. La société dans son ensemble exerce une forte influence, mais chaque groupe, chaque séance et chaque discussion a aussi sa propre culture.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  27d3b10b80ade309:
    english: How do we roll? How do we talk to one another? What is and is not ok here? What are the rules of the game, of how we interact?
    translation: Comment fonctionnons-nous ? Comment nous parlons-nous ? Qu’est-ce qui est acceptable ici et qu’est-ce qui ne l’est pas ? Quelles règles guident nos échanges ?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  54d83e0b3e487190:
    english: The process of confronting cultural questions can be a powerful moment of self-awareness for a group. Not confronting them can harm ability to meet goals, or sometimes tear a group apart completely.
    translation: Examiner ces questions peut aider un groupe à mieux se comprendre. Les ignorer peut l’empêcher d’atteindre ses objectifs et, parfois, le diviser complètement.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f9918d7d61cef0c9:
    english: Culture, protocol, and expectations can be implicit or explicit, and by nature intersect in complex ways with power dynamics and social capital. It’s a challenging balance to keep things loose enough to allow emergence, evolution, creativity, and freedom, while being explicit enough about bottom lines and boundaries to ensure safety.
    translation: La culture, les règles et les attentes peuvent être implicites ou explicites. Elles sont étroitement liées aux rapports de pouvoir et à la place de chacun dans le groupe. Il faut laisser assez de souplesse pour permettre l’évolution, la créativité et la liberté, tout en définissant assez clairement les limites pour assurer la sécurité des personnes.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3d484eafb8524354:
    english: Facilitators often guide the group to live up to the culture it has set, follow the protocols it has agreed, and hold expectations to account. If a facilitator is tasked with this role, they need to be backed by a certain level of explicitness about those agreements, and a certain mandate. Otherwise, it can get messy.
    translation: Les personnes qui animent un groupe l’aident souvent à respecter la culture qu’il a choisie, les règles qu’il a adoptées et les attentes qu’il a formulées. Pour remplir ce rôle, elles ont besoin d’accords assez explicites et d’un mandat clair. Sinon, les situations peuvent devenir difficiles à gérer.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ba3ef231a647d607:
    english: People often want to leave things to “common sense” and avoid agreeing a code of conduct or explicit protocols. However, this can disproportionately affect the most vulnerable members of the group, since they will feel the negative impacts of bad behavior or culture first and strongest, and are least empowered to counteract it themselves. It's the responsibility of the more privileged or influential members of the group to think through these questions carefully.
    translation: On préfère souvent s’en remettre au « bon sens » plutôt que de convenir d’un code de conduite ou de règles explicites. Ce choix peut toucher de façon disproportionnée les membres les plus vulnérables du groupe. Ils subissent les premiers et le plus fortement les effets d’un mauvais comportement ou d’une culture néfaste, et disposent de moins de moyens pour y répondre. Il revient aux membres les plus privilégiés ou les plus influents de réfléchir attentivement à ces questions.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d14bcec24555318c:
    english: Like a legal contract, you hope you never have to enforce a code of conduct, but if you need it you’re very glad it’s there. You want to agree *before* it becomes necessary. In order for a facilitator or any member of the group to effectively stand up and say, “that’s not OK here”, you need to have already invested in culture-building and expectation-setting.
    translation: Comme pour un contrat, vous espérez ne jamais avoir à appliquer un code de conduite, mais vous serez soulagé de l’avoir si cela devient nécessaire. Il faut s’accorder sur ce code *avant* d’en avoir besoin. Pour qu’une personne qui anime le groupe ou l’un de ses membres puisse dire « ce comportement n’est pas acceptable ici », le groupe doit avoir défini sa culture et ses attentes au préalable.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dda14b86acbd8199:
    english: |-
      * Because Loomio is usually used as a space for constructive deliberation among groups with a specific purpose and set of members, for the most part people engage in good faith and behave respectfully.
      * Loomio is designed specifically to give voice to the individual, and let them communicate their needs and concerns. Even if a majority doesn’t see a problem, a single person can raise it and be heard.
