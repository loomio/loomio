  1ed397ff049f2888:
    english: "> Singling people out for a contribution will just make them feel like the stupid kid in class who doesn’t know the answer. Instead, a general invite to people who haven’t spoken yet to contribute tells the regular contributors to stay quiet, and gives quieter people the opportunity to step forward. — Silvia Zuur"
    translation: "> Demander à une personne en particulier de contribuer peut lui donner l’impression d’être l’élève qui ne connaît pas la réponse. Inviter plutôt toutes les personnes qui ne se sont pas encore exprimées à contribuer indique aux personnes qui parlent souvent de laisser de la place, et donne aux plus discrètes la possibilité de prendre la parole. — Silvia Zuur"
