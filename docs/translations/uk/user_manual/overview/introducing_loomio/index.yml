  8bc60d4319adf204:
    english: |-
      1. Introduce the topic and provide context.
      2. Invite discussion or questions when they are needed.
      3. Start the appropriate proposal or poll.
      4. Remind people who have not participated when necessary.
      5. Publish an [outcome](/en/user_manual/polls/outcomes) stating what was decided and what happens next.
    translation: |-
      1. Представте тему й надайте потрібний контекст.
      2. Запросіть учасників до обговорення або запропонуйте поставити запитання, коли це потрібно.
      3. Розпочніть відповідну пропозицію або опитування.
      4. За потреби нагадайте тим, хто ще не взяв участі.
      5. Опублікуйте [висновок](/en/user_manual/polls/outcomes): що вирішили й що буде далі.
    status: machine
