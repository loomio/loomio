  35715a66bb0686a9:
    english: To change the tags on an existing thread or poll, open it and click the tag button beside its current tags near the title.
    translation: Каб змяніць тэгі ў існай тэме або апытанні, адкрыйце яе і націсніце кнопку тэгаў побач з бягучымі тэгамі каля загалоўка.
    status: machine
