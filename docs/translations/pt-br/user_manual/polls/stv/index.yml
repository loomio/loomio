  c96d54ebfbedae32:
    english: After the election closes, people who can view the results can export the ballots in BLT format for an independent recount or audit. The export contains candidate rankings and combines identical rankings into a single row with a ballot count. For anonymous elections it does not contain voter identities, ballot identifiers, submission times, or submission order.
    translation: Após o encerramento da eleição, as pessoas que podem ver os resultados podem exportar as cédulas no formato BLT para uma recontagem independente ou auditoria. A exportação contém a classificação dos candidatos e reúne classificações idênticas em uma única linha com a quantidade de cédulas. Em eleições anônimas, ela não contém a identidade dos eleitores, identificadores das cédulas, horários de envio nem a ordem de envio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
