navigation_title: Kiosztás
blocks:
  343675f0497d460a:
    english: "# Allocate"
    translation: "# Kiosztás"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  46dd27ee2e2fb992:
    english: Allocate, sometimes known as a dot vote, reveals priorities when there are trade-offs. Each participant receives a fixed budget of points and distributes it across the options. Giving more to one option leaves fewer points for the others.
    translation: A Kiosztás, más néven pontszavazás, segít megmutatni a prioritásokat, amikor választani kell a lehetőségek között. Minden résztvevő meghatározott számú pontot kap, amelyet szétoszthat a lehetőségek között. Ha az egyik lehetőségnek több pontot ad, a többire kevesebb jut.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c6d05c5ec2a695d2:
    english: "## When to use Allocate"
    translation: "## Mikor használd a Kiosztást"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f5b2c4377aea5079:
    english: 'Use Allocate when time, money, attention, or another resource is limited. It works well for:'
    translation: 'Akkor használd a Kiosztást, ha az idő, a pénz, a figyelem vagy más erőforrás korlátozott. Például ezekre alkalmas:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8e6525da99616946:
    english: |-
      - prioritizing work for the next planning period;
      - dividing a participatory budget between projects;
      - choosing how much agenda time to give several topics;
      - distributing a fixed number of volunteer hours; or
      - identifying which improvements matter most to members.
    translation: |-
      - a következő tervezési időszak feladatainak rangsorolása;
      - részvételi költségvetés felosztása projektek között;
      - több téma napirendi idejének meghatározása;
      - meghatározott számú önkéntes munkaóra elosztása; vagy
      - a tagok számára legfontosabb fejlesztések azonosítása.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  66b0f13c4811ef63:
    english: The points express relative priority, not an amount that Loomio will automatically assign. Use [Score](/en/user_manual/polls/score/) when every option can receive a high rating without reducing support for another.
    translation: A pontok a relatív fontosságot fejezik ki, nem olyan mennyiséget, amelyet a Loomio automatikusan kioszt. Használd a [Pontszám felmérést](/en/user_manual/polls/score/), ha minden lehetőség magas értékelést kaphat anélkül, hogy ez csökkentené a többi támogatását.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '0409e08bd5e80f61':
    english: "## Example: set priorities for an annual strategy review"
    translation: "## Példa: az éves stratégiai felülvizsgálat prioritásainak meghatározása"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e274f6e40509e611:
    english: Oatmilk Cooperative is planning its annual strategy review. It asks members which areas should receive the most time and attention during the review. Each member receives ten points to allocate across five areas. This shows the group's relative priorities while requiring participants to make trade-offs.
    translation: A Zabtej Szövetkezet az éves stratégiai felülvizsgálatát tervezi. Megkérdezi a tagokat, hogy mely területekre fordítsák a legtöbb időt és figyelmet. Minden tag tíz pontot kap, amelyet öt terület között oszthat szét. Így láthatóvá válnak a csoport prioritásai, miközben a résztvevőknek dönteniük kell a lehetőségek között.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c74ebb16f872b3c6:
    english: "## Set up the poll"
    translation: "## A szavazás beállítása"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  906790609aa7eb30:
    english: Describe the decision and what the points represent. Add options at a similar level of scope, then set **Points per person**. In this example, each voter receives ten points to indicate how much review time each strategic area should receive.
    translation: Írd le a döntést és azt, hogy mit jelentenek a pontok. Adj meg hasonló léptékű lehetőségeket, majd állítsd be a **Pontok személyenként** értéket. Ebben a példában minden szavazó tíz pontot kap, hogy jelezze, mennyi felülvizsgálati időt szánna az egyes stratégiai területekre.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  67ae025b83fb4781:
    english: A very large budget can create false precision. A useful budget is usually large enough to show differences but small enough to require choices. Make clear whether concentrating all points on one option is acceptable.
    translation: A túl sok kiosztható pont hamis pontosság látszatát keltheti. Olyan pontszámot érdemes választani, amely megmutatja a különbségeket, de választásra is késztet. Tisztázd, hogy elfogadható-e az összes pontot egyetlen lehetőségnek adni.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Szavazás"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d9a73b9d4e2f8927:
    english: Participants move the sliders to distribute their budget. Loomio shows how many points remain and prevents submission until the allocation is valid.
    translation: A résztvevők a csúszkákkal osztják szét a pontjaikat. A Loomio megmutatja, hány pont maradt, és csak akkor engedi beküldeni a szavazatot, ha a pontok elosztása érvényes.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7b3d616673a01fbb:
    english: In this example, the voter assigns three points each to **Member participation** and **Financial sustainability**, two each to **Environmental impact** and **Staff development**, and none to **Products and services**. A zero does not necessarily mean an area has no value; it means the voter used their limited points elsewhere.
    translation: Ebben a példában a szavazó három-három pontot ad a **Tagok részvétele** és a **Pénzügyi fenntarthatóság** lehetőségnek, kettőt-kettőt a **Környezeti hatás** és a **Munkatársak fejlődése** lehetőségnek, a **Termékek és szolgáltatások** pedig nem kap pontot. A nulla pont nem feltétlenül jelenti azt, hogy az adott terület értéktelen. A szavazó a korlátozott számú pontját máshol használta fel.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Az eredmények értelmezése"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  97147f83eaf22313:
    english: 'The results order options by the total points received. They also show:'
    translation: 'Az eredmények a kapott pontok összesített száma szerint rendezik a lehetőségeket. Emellett megjelenítik a következőket:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1d224c0c34145a7f:
    english: |-
      - **% of points**: the option's share of all allocated points;
      - **Points**: the total points allocated;
      - **Mean**: the average among voters who gave the option points; and
      - **Voters**: how many people gave the option at least one point.
    translation: |-
      - **Pontok %-a**: a lehetőség részesedése az összes kiosztott pontból;
      - **Pont**: a kiosztott pontok összesített száma;
      - **Átlagos**: azoknak a szavazóknak az átlagos pontszáma, akik pontot adtak a lehetőségnek; és
      - **Szavazók**: hányan adtak legalább egy pontot a lehetőségnek.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2901008fa326e4f5:
    english: In this example, **Financial sustainability** receives the most points, followed by **Staff development**. Financial sustainability receives points from every voter, suggesting broad agreement that it needs substantial review time. Read the totals alongside the number of voters to distinguish broad priorities from areas strongly supported by fewer people.
    translation: Ebben a példában a **Pénzügyi fenntarthatóság** kapja a legtöbb pontot, ezt követi a **Munkatársak fejlődése**. A pénzügyi fenntarthatóság minden szavazótól kap pontot, ami arra utal, hogy széles körben fontosnak tartják a terület alapos felülvizsgálatát. A pontszámokat a szavazók számával együtt értelmezd, hogy megkülönböztesd a széles körben támogatott prioritásokat a kevesebb ember által erősen támogatott területektől.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f2c04fbdc54d23e8:
    english: Read the totals together with the number of voters and their reasons. Publish an outcome explaining how the strategy review will be structured; the poll does not assign time automatically.
    translation: A pontszámokat a szavazók számával és az indokaikkal együtt értelmezd. Tedd közzé az eredményt, és írd le benne, hogyan épül fel a stratégiai felülvizsgálat. A szavazás nem osztja ki automatikusan az időt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
