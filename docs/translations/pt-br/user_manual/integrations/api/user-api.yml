---
navigation_title: API do usuário
blocks:
  0217b93dddc627ac:
    english: "# Loomio User API documentation"
    translation: "# Documentação da API do usuário do Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bc6fcbf5f783fd29:
    english: "<!-- seo-description: Use the Loomio User API to create and manage discussions, comments, polls, threads, and group memberships from other software. -->"
    translation: "<!-- seo-description: Use a API do usuário do Loomio para criar e gerenciar discussões, comentários, enquetes, tópicos e participações em grupos a partir de outros softwares. -->"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cc2da08540808ada:
    english: "`/api/b2` is the user-oriented API for integrations with Loomio. It uses the API key of a user account, and every action is performed as that user."
    translation: "`/api/b2` é a API voltada a usuários para integrações com o Loomio. Ela usa a chave de API de uma conta de usuário, e todas as ações são realizadas em nome desse usuário."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7036a6661aac00f2:
    english: Group operations use the memberships and group permissions of the API-key user. Instance-administrator status does not expand an API key's access to groups or content; use the Server API for instance-level administration.
    translation: As operações em grupos seguem as participações e permissões de grupo do usuário da chave de API. Ser administrador da instância não amplia o acesso da chave de API a grupos ou conteúdos. Para administrar a instância, use a API do servidor.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c4436493b062b9f1:
    english: Use the API key from the Loomio user account that will perform the actions. A dedicated bot account is useful when an integration should not be invited to polls or receive notifications.
    translation: Use a chave de API da conta do Loomio que realizará as ações. Uma conta exclusiva para o bot é útil quando a integração não deve ser convidada para enquetes nem receber notificações.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ade21c593f08100c:
    english: Signed-in users can find their API key and group IDs on the [API access page](/profile/api_access).
    translation: Após entrar no Loomio, você encontra sua chave de API e os IDs dos grupos na [página de acesso à API](/profile/api_access).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  15160edafaf441c1:
    english: 'Send the API key in an `Authorization: Bearer` header. API keys in query strings are rejected because URLs can be recorded by proxies and access logs.'
    translation: 'Envie a chave de API no cabeçalho `Authorization: Bearer`. Chaves de API em parâmetros de consulta são rejeitadas porque proxies e registros de acesso podem armazenar URLs.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2215e57186277325:
    english: "### Authentication change"
    translation: "### Alteração na autenticação"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ff5f4c1055e80fb6:
    english: 'The API key was previously accepted as an `api_key` URL parameter. Requests using `?api_key=YOUR_API_KEY` no longer work. Use the HTTP `Authorization` header instead:'
    translation: 'Antes, a chave de API era aceita no parâmetro de URL `api_key`. As solicitações com `?api_key=YOUR_API_KEY` não funcionam mais. Use o cabeçalho HTTP `Authorization`:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  65574ba500243c80:
    english: The examples use `YOUR_API_KEY`, group ID `123`, and `https://www.loomio.com/`. Replace these with your API key, group ID, and Loomio installation URL.
    translation: Os exemplos usam `YOUR_API_KEY`, o ID de grupo `123` e `https://www.loomio.com/`. Substitua esses valores pela sua chave de API, pelo ID do grupo e pela URL da sua instalação do Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bec1e4f30aeef4ce:
    english: "## Response size and related records"
    translation: "## Tamanho das respostas e registros relacionados"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  da004eb4e005fae1:
    english: 'User API responses use a compound format: the primary records are accompanied by related records such as topics, groups, users, polls, and reactions. This lets a client populate a local record store from one request, but can include more data than a simple integration needs.'
    translation: 'As respostas da API do usuário têm um formato composto: os registros principais vêm acompanhados de registros relacionados, como tópicos, grupos, usuários, enquetes e reações. Assim, um cliente pode preencher seu armazenamento local de registros com uma única solicitação, embora a resposta possa conter mais dados do que uma integração simples precisa.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  64d9a631b54cbaba:
    english: Pass `compact=1` to omit bulky related topics, groups, parent groups, memberships, reactions, tags, and translations. Primary records and the related records needed to interpret their content remain present.
    translation: Passe `compact=1` para omitir registros relacionados volumosos de tópicos, grupos, grupos superiores, participações, reações, etiquetas e traduções. Os registros principais e os registros relacionados necessários para interpretar seu conteúdo continuam presentes.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e4e671db39dbe6f1:
    english: For direct control, pass `exclude_types` with space-separated singular record types. For example, `exclude_types=group reaction` omits related groups and reactions. Common values are `topic`, `group`, `parent`, `membership`, `reaction`, `tag`, `translation`, `user`, `discussion`, `poll`, `poll_option`, `stance`, `stance_choice`, `outcome`, and `topic_item`. Exclusions apply to related records, not the primary resource requested by the endpoint.
    translation: Para controlar as exclusões diretamente, passe `exclude_types` com tipos de registro no singular separados por espaços. Por exemplo, `exclude_types=group reaction` omite grupos e reações relacionados. Valores comuns são `topic`, `group`, `parent`, `membership`, `reaction`, `tag`, `translation`, `user`, `discussion`, `poll`, `poll_option`, `stance`, `stance_choice`, `outcome` e `topic_item`. As exclusões afetam os registros relacionados, não o recurso principal solicitado ao endpoint.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ded075da3c2aa815:
    english: Collection responses include `meta.total` when an exact collection size is defined. The total is calculated before `limit` and `offset` are applied. Endpoints such as search that intentionally return a bounded result set omit `meta.total` rather than returning `null`.
    translation: As respostas de coleções incluem `meta.total` quando é possível determinar o tamanho exato da coleção. O total é calculado antes da aplicação de `limit` e `offset`. Endpoints como o de busca, que retornam intencionalmente um conjunto limitado de resultados, omitem `meta.total` em vez de retornar `null`.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  17cb8ef90a2acdb3:
    english: "## Endpoint summary"
    translation: "## Resumo dos endpoints"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  608edb13080e57c2:
    english: |-
      | Method | Endpoint | Purpose |
      | --- | --- | --- |
      | `GET` | `/api/b2/groups` | List the API-key user's groups |
      | `GET` | `/api/b2/groups/:id_or_key_or_handle` | Get a visible group |
      | `GET` | `/api/b2/reports` | Generate a participation report |
      | `GET` | `/api/b2/search` | Search visible discussions, comments, polls, votes, and outcomes |
      | `POST` | `/api/b2/discussions` | Create a discussion |
      | `GET` | `/api/b2/discussions/:id` | Get a discussion |
      | `GET` | `/api/b2/discussions` | List discussions in a group |
      | `PATCH` | `/api/b2/discussions/:id` | Edit a discussion |
      | `DELETE` | `/api/b2/discussions/:id` | Soft-delete a discussion |
      | `GET` | `/api/b2/threads` | List visible discussion and standalone-poll threads |
      | `GET` | `/api/b2/threads/:topic_id` | Get a thread |
      | `GET` | `/api/b2/threads/:topic_id/items` | Get the ordered items in a thread |
      | `GET` | `/api/b2/threads/:topic_id/markdown` | Get a complete thread as Markdown |
      | `POST` | `/api/b2/comments` | Create a comment or reply |
      | `PATCH` | `/api/b2/comments/:id` | Edit a comment |
      | `DELETE` | `/api/b2/comments/:id` | Soft-delete a comment |
      | `POST` | `/api/b2/polls` | Create a poll |
      | `GET` | `/api/b2/polls/:id` | Get a poll |
      | `GET` | `/api/b2/polls` | List polls in a group |
      | `PATCH` | `/api/b2/polls/:id` | Edit a poll |
      | `DELETE` | `/api/b2/polls/:id` | Soft-delete a poll |
      | `GET` | `/api/b2/memberships` | List a group's memberships |
      | `POST` | `/api/b2/memberships` | Add members and optionally remove absent members |
      | `GET` | `/api/b2/chatbots` | List a group's chat integrations and webhooks |
      | `POST` | `/api/b2/chatbots` | Create a chat integration or webhook |
      | `PATCH` | `/api/b2/chatbots/:id` | Update a chat integration or webhook |
      | `DELETE` | `/api/b2/chatbots/:id` | Delete a chat integration or webhook |
      | `POST` | `/api/b2/chatbots/check` | Send a webhook connection test |
    translation: |-
      | Método | Endpoint | Finalidade |
      | --- | --- | --- |
      | `GET` | `/api/b2/groups` | Listar os grupos do usuário da chave de API |
      | `GET` | `/api/b2/groups/:id_or_key_or_handle` | Obter um grupo visível |
      | `GET` | `/api/b2/reports` | Gerar um relatório de participação |
      | `GET` | `/api/b2/search` | Buscar discussões, comentários, enquetes, votos e conclusões visíveis |
      | `POST` | `/api/b2/discussions` | Criar uma discussão |
      | `GET` | `/api/b2/discussions/:id` | Obter uma discussão |
      | `GET` | `/api/b2/discussions` | Listar discussões de um grupo |
      | `PATCH` | `/api/b2/discussions/:id` | Editar uma discussão |
      | `DELETE` | `/api/b2/discussions/:id` | Excluir uma discussão sem remover seu registro |
      | `GET` | `/api/b2/threads` | Listar tópicos visíveis de discussões e enquetes independentes |
      | `GET` | `/api/b2/threads/:topic_id` | Obter um tópico |
      | `GET` | `/api/b2/threads/:topic_id/items` | Obter os itens de um tópico em ordem |
      | `GET` | `/api/b2/threads/:topic_id/markdown` | Obter um tópico completo em Markdown |
      | `POST` | `/api/b2/comments` | Criar um comentário ou uma resposta |
      | `PATCH` | `/api/b2/comments/:id` | Editar um comentário |
      | `DELETE` | `/api/b2/comments/:id` | Excluir um comentário sem remover seu registro |
      | `POST` | `/api/b2/polls` | Criar uma enquete |
      | `GET` | `/api/b2/polls/:id` | Obter uma enquete |
      | `GET` | `/api/b2/polls` | Listar enquetes de um grupo |
      | `PATCH` | `/api/b2/polls/:id` | Editar uma enquete |
      | `DELETE` | `/api/b2/polls/:id` | Excluir uma enquete sem remover seu registro |
      | `GET` | `/api/b2/memberships` | Listar as participações em um grupo |
      | `POST` | `/api/b2/memberships` | Adicionar membros e, opcionalmente, remover os ausentes da lista |
      | `GET` | `/api/b2/chatbots` | Listar as integrações de bate-papo e os webhooks de um grupo |
      | `POST` | `/api/b2/chatbots` | Criar uma integração de bate-papo ou um webhook |
      | `PATCH` | `/api/b2/chatbots/:id` | Atualizar uma integração de bate-papo ou um webhook |
      | `DELETE` | `/api/b2/chatbots/:id` | Excluir uma integração de bate-papo ou um webhook |
      | `POST` | `/api/b2/chatbots/check` | Enviar um teste de conexão do webhook |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0473f1f7fb78f074:
    english: "## Groups"
    translation: "## Grupos"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dc819221f371c435:
    english: "### List groups"
    translation: "### Listar grupos"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  964f575e90aa9cde:
    english: Return the groups in which the API-key user has an active membership.
    translation: Retorna os grupos dos quais o usuário da chave de API é membro ativo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3835e6e77bc0ad10:
    english: "`GET /api/b2/groups`"
    translation: "`GET /api/b2/groups`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4f588e981afc3069:
    english: The response contains all matching records in a non-paginated `groups` array. It includes parent groups and subgroups, including groups whose subscription is not currently active. Check the `enabled` field when an integration should operate only on enabled groups.
    translation: A resposta contém todos os registros correspondentes em um array `groups` sem paginação. Ela inclui grupos superiores e subgrupos, mesmo quando a assinatura de um grupo não está ativa. Consulte o campo `enabled` se a integração deve operar apenas em grupos ativos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  213de8ce539a42c3:
    english: 'Important group fields include:'
    translation: 'Os principais campos de grupo são:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d377f7c9b224a6d7:
    english: |-
      | Field | Description |
      | --- | --- |
      | `id` | Numeric group ID used by other User API endpoints |
      | `key` | Stable short key used in Loomio URLs |
      | `handle` | Human-readable group handle |
      | `name` | Group name |
      | `full_name` | Group name including its parent-group context |
      | `parent_id` | Numeric parent-group ID for a subgroup, otherwise `null` |
      | `enabled` | Whether the group and its subscription are active |
      | `memberships_count` | Number of active and pending memberships |
      | `accepted_memberships_count` | Number of accepted memberships |
      | `pending_memberships_count` | Number of pending invitations |
      | `admin_memberships_count` | Number of group administrators |
      | `delegates_count` | Number of delegates |
      | `discussions_count` | Number of discussions directly in the group |
      | `polls_count` | Number of polls directly in the group |
      | `subgroups_count` | Number of subgroups |
    translation: |-
      | Campo | Descrição |
      | --- | --- |
      | `id` | ID numérico do grupo usado por outros endpoints da API do usuário |
      | `key` | Chave curta e estável usada nas URLs do Loomio |
      | `handle` | Identificador legível do grupo |
      | `name` | Nome do grupo |
      | `full_name` | Nome do grupo com o contexto do grupo superior |
      | `parent_id` | ID numérico do grupo superior de um subgrupo; caso contrário, `null` |
      | `enabled` | Indica se o grupo e sua assinatura estão ativos |
      | `memberships_count` | Número de participações ativas e pendentes |
      | `accepted_memberships_count` | Número de participações aceitas |
      | `pending_memberships_count` | Número de convites pendentes |
      | `admin_memberships_count` | Número de administradores do grupo |
      | `delegates_count` | Número de delegados |
      | `discussions_count` | Número de discussões diretamente no grupo |
      | `polls_count` | Número de enquetes diretamente no grupo |
      | `subgroups_count` | Número de subgrupos |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  34f1693ba28fcb80:
    english: The response may include additional group settings, related parent-group records and the API user's memberships. Clients should ignore fields they do not use.
    translation: A resposta pode incluir outras configurações do grupo, registros relacionados do grupo superior e as participações do usuário da API. Os clientes devem ignorar os campos que não usam.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d7c327b8ed7f7bf2:
    english: "### Get a group"
    translation: "### Obter um grupo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  15ab63bc2d396657:
    english: Return one group visible to the API-key user.
    translation: Retorna um grupo visível para o usuário da chave de API.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8ba2cc9e3c67b1dd:
    english: "`GET /api/b2/groups/:id_or_key_or_handle`"
    translation: "`GET /api/b2/groups/:id_or_key_or_handle`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  71e5812ff9890c9b:
    english: The identifier can be the group's numeric ID, key or handle.
    translation: O identificador pode ser o ID numérico, a chave ou o identificador legível do grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8ba79a283b7b77d5:
    english: The response contains the group in the `groups` array and uses the same fields as the list endpoint. A request for a group the API-key user cannot access returns a permission error.
    translation: A resposta contém o grupo no array `groups` e usa os mesmos campos do endpoint de listagem. Uma solicitação para um grupo ao qual o usuário da chave de API não tem acesso retorna um erro de permissão.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  18d823df4d7f8fac:
    english: "## Webhooks"
    translation: "## Webhooks"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f33d58fc1f2fd84c:
    english: 'The User API is request-based: an integration calls Loomio when it wants to read or change data. A group webhook provides the push direction. Loomio sends selected group events to your endpoint as they happen, so an integration does not need to poll the REST API for changes.'
    translation: 'A API do usuário funciona por solicitação: uma integração chama o Loomio quando precisa ler ou alterar dados. Um webhook de grupo permite o envio no sentido inverso. O Loomio envia os eventos selecionados do grupo ao seu endpoint conforme acontecem, dispensando consultas periódicas à API REST para detectar mudanças.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3b5b4b0ac52b9010:
    english: 'Webhooks are configured per group and require group-administrator permission. They can be managed through the Loomio interface:'
    translation: 'Os webhooks são configurados por grupo e exigem permissão de administrador do grupo. Você pode gerenciá-los pela interface do Loomio:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  318710be7b3aae7d:
    english: |-
      1. Open the group.
      2. Open the group menu and select **Chat integrations**.
      3. Add the integration matching the payload format your endpoint accepts. For a general-purpose endpoint, use the Mattermost/Markdown format.
      4. Enter a name and the destination URL.
      5. Select the events that Loomio should send automatically.
      6. Save the integration and use **Test connection** to send a test message.
    translation: |-
      1. Abra o grupo.
      2. Abra o menu do grupo e selecione **Integrações de bate-papo**.
      3. Adicione a integração correspondente ao formato de dados aceito pelo seu endpoint. Para um endpoint de uso geral, use o formato Mattermost/Markdown.
      4. Insira um nome e a URL de destino.
      5. Selecione os eventos que o Loomio deve enviar automaticamente.
      6. Salve a integração e use **Conexão de teste** para enviar uma mensagem de teste.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  43fb95cf304fced6:
    english: Use an HTTPS destination with an unguessable URL. Loomio requires the destination to resolve to a public address and blocks requests to local or private network addresses.
    translation: Use um destino HTTPS com uma URL difícil de adivinhar. O Loomio exige que o destino corresponda a um endereço público e bloqueia solicitações a endereços de redes locais ou privadas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d8d5abffe6425bea:
    english: Agents and other integrations can instead manage webhooks through the Bearer-authenticated chatbot endpoints described below. The resource is named `chatbots` for compatibility with Loomio's chat integrations, but it also represents general outgoing webhooks.
    translation: Agentes e outras integrações também podem gerenciar webhooks pelos endpoints de chatbot autenticados com Bearer descritos abaixo. O recurso se chama `chatbots` por compatibilidade com as integrações de bate-papo do Loomio, mas também representa webhooks de saída em geral.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  28fb6371af33b66f:
    english: "### List webhooks"
    translation: "### Listar webhooks"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7187e5a26c3ec864:
    english: Return the chat integrations configured for a group. The API-key user must be an administrator of that group. The response includes destination URLs, so it must not be exposed to ordinary group members.
    translation: Retorna as integrações de bate-papo configuradas para um grupo. O usuário da chave de API precisa ser administrador desse grupo. A resposta inclui URLs de destino e, portanto, não deve ser exposta a membros comuns do grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  788d370538bdda46:
    english: "`GET /api/b2/chatbots?group_id=123`"
    translation: "`GET /api/b2/chatbots?group_id=123`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d676ca45c3e1074a:
    english: 'The response contains a `chatbots` array with these fields:'
    translation: 'A resposta contém um array `chatbots` com estes campos:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ca00f7d0a52ce803:
    english: |-
      | Field | Description |
      | --- | --- |
      | `id` | Integration ID used for updates and deletion |
      | `group_id` | Group receiving the events |
      | `name` | Administrative name for the integration |
      | `kind` | `webhook` for an outgoing webhook or `matrix` for a Matrix integration |
      | `webhook_kind` | Payload format: `markdown`, `slack`, `discord`, `microsoft`, or `webex` |
      | `server` | Destination URL |
      | `event_kinds` | Events sent automatically |
      | `notification_only` | Whether messages contain only the notification headline |
    translation: |-
      | Campo | Descrição |
      | --- | --- |
      | `id` | ID da integração usado para atualizações e exclusão |
      | `group_id` | Grupo que recebe os eventos |
      | `name` | Nome administrativo da integração |
      | `kind` | `webhook` para um webhook de saída ou `matrix` para uma integração com o Matrix |
