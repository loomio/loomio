name: manual screenshots

on:
  push:
    branches:
      - master
    paths:
      - docs/en/**/*.png
      - docs/locales.yml
      - docs/screenshots.rb
      - docs/screenshot_catalog.js
      - config/locales/**
      - app/controllers/dev/**
      - vue/tests/e2e/**
      - vue/nightwatch.conf.js
      - bin/docs-screenshots
      - bin/e2e
      - bin/e2e-screenshots
      - bin/*screenshot
      - script/ci_manual_screenshots
      - .github/workflows/manual_screenshots.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  languages:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      locales: ${{ steps.locales.outputs.locales }}
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.5'
      - id: locales
        run: |
          ruby -rjson -ryaml -e 'puts "locales=#{YAML.safe_load_file("docs/locales.yml").select { |_, locale| locale.fetch("published") }.keys.to_json}"' >> "$GITHUB_OUTPUT"

  screenshots:
    needs: languages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        locale: ${{ fromJSON(needs.languages.outputs.locales) }}
    concurrency:
      group: manual-screenshots-${{ matrix.locale }}
      cancel-in-progress: false
    env:
      PGDATABASE: loomio_test
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      RAILS_ENV: test
      E2E_PORT: 3001
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: nanasess/setup-chromedriver@v2
      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick libvips
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.5'
          bundler-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Install npm
        run: npm install --global "npm@$(cat .npm-version)" --no-audit --no-fund
      - name: Install client dependencies
        working-directory: vue
        run: npm ci --no-audit --no-fund
      - name: Install realtime server dependencies
        working-directory: hocuspocus
        run: npm ci --no-audit --no-fund
      - name: Configure the isolated test database
        run: cp config/database.yml.postgresql config/database.yml
      - name: Generate changed screenshots and publish to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MANUAL_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MANUAL_R2_SECRET_ACCESS_KEY }}
        run: bash script/ci_manual_screenshots '${{ matrix.locale }}'
      - name: Save failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: manual-screenshot-failure-${{ matrix.locale }}
          path: |
            vue/tests/reports/
            vue/tests/screenshots/
            log/test.log
