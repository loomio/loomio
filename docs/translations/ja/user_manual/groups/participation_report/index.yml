    translation: "**代表者限定**をオンにすると、選択したいずれかのグループで現在代表者になっている人だけが表示されます。活動と投票記録は選択したすべてのグループを通じて集計され、指定期間に活動がなかった代表者も表に残ります。CSVのダウンロードにも同じ絞り込みが適用されます。"
