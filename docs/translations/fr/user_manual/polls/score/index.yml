---
navigation_title: Sondage pondéré
blocks:
  c719d051fa2f700e:
    english: "# Score"
    translation: "# Sondage pondéré"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  517adc384b38d256:
    english: Score measures how participants evaluate each option on a shared numeric scale. Unlike Choose, it asks people to respond to every option, so the results show both what people prefer and how strongly they prefer it.
    translation: Le sondage pondéré permet aux participants d'évaluer chaque option sur une même échelle numérique. Contrairement au sondage Choisir, il demande une réponse pour chaque option. Les résultats montrent ainsi les préférences des participants et leur degré de préférence.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a678333f6d814e87:
    english: "## When to use Score"
    translation: "## Quand utiliser le sondage pondéré"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c4ca19abb53e3ddc:
    english: 'Use Score when every option can be evaluated independently against the same question. It works well for:'
    translation: 'Utilisez le sondage pondéré lorsque chaque option peut être évaluée séparément selon la même question. Il convient notamment pour :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c77c1ad6b2a9d697:
    english: |-
      - assessing how ready each part of a project is;
      - rating the importance of several principles;
      - measuring interest in possible meeting topics;
      - evaluating grant applications against a common criterion; or
      - comparing the suitability of several proposals.
    translation: |-
      - évaluer l'état d'avancement de chaque partie d'un projet ;
      - noter l'importance de plusieurs principes ;
      - mesurer l'intérêt pour différents sujets de réunion ;
      - évaluer des demandes de subvention selon un critère commun ; ou
      - comparer la pertinence de plusieurs propositions.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d91459d96a31a671:
    english: Define what the bottom and top of the scale mean. A number without a shared definition can mean different things to different voters. Use [Choose](/en/user_manual/polls/choose/) when you only need selections, or [Allocate](/en/user_manual/polls/allocate/) when participants must make trade-offs within a limited budget.
    translation: Définissez ce que représentent les extrémités de l'échelle. Sans définition commune, un même nombre peut avoir des sens différents selon les votants. Utilisez [Choisir](/en/user_manual/polls/choose/) si vous souhaitez seulement sélectionner des options, ou [Répartir](/en/user_manual/polls/allocate/) si les participants doivent répartir un budget limité entre elles.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6160518dc06b70a7:
    english: "## Example: score possible trial locations"
    translation: "## Exemple : noter des lieux possibles pour un essai"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a75c387743cad529:
    english: Oatmilk Cooperative is choosing locations for a returnable-bottle trial. It asks members to score four locations from 0 (**unsuitable**) to 10 (**ideal**), considering customer access, staff capacity, storage, and collection transport.
    translation: La coopérative Oatmilk choisit des lieux pour tester des bouteilles consignées. Elle demande à ses membres de noter quatre lieux de 0 (**inadapté**) à 10 (**idéal**), en tenant compte de l'accès pour les clients, des capacités du personnel, du stockage et du transport des bouteilles collectées.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c74ebb16f872b3c6:
    english: "## Set up the poll"
    translation: "## Configurer le sondage"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b03122ee279f9c91:
    english: State one question that applies equally to every option. Add the items to be assessed, set the **Minimum score** and **Maximum score**, and explain the endpoints in the details. Option meanings can clarify the scope of each item.
    translation: Formulez une question qui s'applique de la même manière à chaque option. Ajoutez les éléments à évaluer, définissez le **Score minimum** et le **Score maximum**, puis expliquez les extrémités de l'échelle dans les détails. La description des options peut préciser ce que couvre chaque élément.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  85e66520acf78264:
    english: Choose a scale participants can apply consistently. A 0–5 scale is quick to use; a 0–10 scale allows finer distinctions. More precision does not necessarily produce better information, so use the shortest scale that fits the question.
    translation: Choisissez une échelle que les participants pourront utiliser de manière cohérente. Une échelle de 0 à 5 est rapide à utiliser ; une échelle de 0 à 10 permet des distinctions plus fines. Une plus grande précision ne donne pas nécessairement de meilleures informations. Utilisez donc l'échelle la plus courte adaptée à la question.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bb3998655598796f:
    english: Anonymous voting and showing options in random order can be useful when you want to reduce social or ordering effects.
    translation: Le vote anonyme et l'affichage des options dans un ordre aléatoire peuvent aider à réduire l'influence des autres personnes ou de l'ordre des options.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Voter"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  33199814c9ad8a64:
    english: Participants move a slider to score every option. In this example, the voter scores Central Station cafe at 8, Riverside market at 6, the University food court at 7, and Harbour offices at 5.
    translation: Les participants déplacent un curseur pour noter chaque option. Dans cet exemple, la personne qui vote donne 8 au café de la gare centrale, 6 au marché Riverside, 7 à l'aire de restauration de l'université et 5 aux bureaux du port.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fba3d21a09846414:
    english: The reason explains how the voter applied the scale. This helps the group distinguish a low score caused by missing information from one caused by substantive concern.
    translation: Le motif du vote explique comment la personne a utilisé l'échelle. Il aide le groupe à distinguer une note basse due à un manque d'informations d'une note basse liée à une préoccupation de fond.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Lire les résultats"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  846b7759f9d54232:
    english: 'For each option, the results show:'
    translation: 'Pour chaque option, les résultats indiquent :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cac30fa54f0aeaf7:
    english: |-
      - **Points**: the sum of all scores;
      - **Mean**: the average score; and
      - **Voters**: how many people scored the option.
    translation: |-
      - **Points** : la somme de toutes les notes ;
      - **Moyenne** : la note moyenne ; et
      - **Votants** : le nombre de personnes qui ont noté l'option.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7e063d4b1babcb9e:
    english: In this example, **Central Station cafe** has the highest mean at 7.5. **Harbour offices** has the lowest mean at 5.25, while Riverside market and the University food court are tied at 7. Four of five invited people have voted, so the group can also see that one response is outstanding.
    translation: Dans cet exemple, **le café de la gare centrale** a la moyenne la plus élevée, à 7,5. **Les bureaux du port** ont la moyenne la plus basse, à 5,25. Le marché Riverside et l'aire de restauration de l'université sont à égalité, avec une moyenne de 7. Quatre des cinq personnes invitées ont voté. Le groupe peut donc voir qu'il manque encore une réponse.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  147800d3643d9942:
    english: Compare means only when the options have a similar number of voters. Read the vote reasons before treating a small difference as meaningful, and publish an outcome explaining what action follows from the scores.
    translation: Comparez les moyennes seulement si les options ont reçu un nombre de votes similaire. Lisez les motifs des votes avant de donner de l'importance à un faible écart, puis publiez une conclusion expliquant les mesures qui découleront des notes.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
