  f087c06a5f4ab2e6:
    english: "# Intro to Discussions"
    translation: "# Introduction aux discussions"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f515c87a8d1d20c7:
    english: Loomio discussions are where you can share information, discuss topics, and make decisions with your group.  People participate by posting comments and replies.
    translation: Les discussions Loomio vous permettent de partager des informations, d’échanger sur des sujets et de prendre des décisions avec votre groupe. Les personnes participent en publiant des commentaires et des réponses.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eede89b6ce4f357d:
    english: |-
      - All info about a topic is in one easily accessible place.
      - People can reply via email and their comments appear in the discussion.
      - You can see who has read the discussion and who needs a nudge.
      - There is a record of discussion you can easily find again.
    translation: |-
      - Toutes les informations sur un sujet se trouvent au même endroit, facilement accessible.
      - Les personnes peuvent répondre par courriel, et leurs commentaires apparaissent dans la discussion.
      - Vous pouvez voir qui a lu la discussion et qui a besoin d’un rappel.
      - Vous pouvez retrouver facilement les échanges.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9cb2eb404b59208b:
    english: Discussions have a wide range of uses - from a general discussion forum to running specific work-flow and decision-making processes.
    translation: Les discussions servent aussi bien de forum général que d’espace pour suivre un travail ou prendre des décisions.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  87a95605052570ca:
    english: For example, you may frame a discussion on a particular topic, invite people to contribute their thoughts and share information, and facilitate progress towards an agreed outcome.
    translation: Par exemple, vous pouvez ouvrir une discussion sur un sujet précis, inviter les personnes à partager leurs idées et leurs informations, puis faire avancer le groupe vers une conclusion commune.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ce6e6734c595d968:
    english: Or you may invite people to participate in a particular decision, using a consent or advice decision-making process.
    translation: Vous pouvez aussi inviter les personnes à prendre part à une décision selon un processus fondé sur le consentement ou la consultation.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7fa58cb3ba95be0b:
    english: Discussions can also contain polls and proposals to help progress a discussion to an outcome. As people comment in the discussion and vote in polls, a discussion timeline builds so you can easily find key milestones.
    translation: Les discussions peuvent contenir des sondages et des propositions pour aider le groupe à parvenir à une conclusion. À mesure que les personnes commentent et votent, une chronologie se construit. Elle vous permet de retrouver facilement les étapes importantes.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
