  8988135e14e40636:
    english: "## Invite to a subgroup"
    translation: "## Inviter des personnes dans un sous-groupe"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  217a985e9afb5421:
    english: Invite people to a subgroup as you invite them into a group. If they already belong to a parent group or another subgroup in the same organization that you also belong to, you can type their name or select that group as an audience. Select the audience chip to expand it into individual people, then remove anyone you do not want to invite.
    translation: Invitez des personnes dans un sous-groupe comme vous le feriez pour un groupe. Si elles appartiennent déjà à un groupe parent ou à un autre sous-groupe de la même organisation dont vous êtes également membre, vous pouvez saisir leur nom ou sélectionner ce groupe comme destinataire de l’invitation. Cliquez sur la pastille des destinataires pour afficher chaque personne, puis retirez celles que vous ne souhaitez pas inviter.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2d4a28c2306fc3c6:
    english: "### Simultaneously invite people to subgroups and parent group"
    translation: "### Inviter des personnes dans plusieurs sous-groupes et dans le groupe parent"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cf301ba403b3a28e:
    english: If you use the **Invite people** button from your parent group's **Members** tab, you can invite people to multiple subgroups at the same time by ticking the boxes of those you would like them to join immediately.
    translation: Si vous utilisez le bouton **Inviter des personnes** dans l’onglet **Membres** de votre groupe parent, vous pouvez inviter des personnes dans plusieurs sous-groupes à la fois. Cochez les cases des sous-groupes qu’elles doivent rejoindre immédiatement.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  28a271be7caa0590:
    english: "![Selecting the parent group and subgroup in the invitation form](group_invite_email_subgroups.png)"
    translation: "![Sélection du groupe parent et d’un sous-groupe dans le formulaire d’invitation](group_invite_email_subgroups.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5323cb0e01e3e171:
    english: "## Administer a subgroup"
    translation: "## Administrer un sous-groupe"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e7c6ae867d7d3813:
    english: Subgroups can have their own admins, and admins of a subgroup may not be the same as the admins of the parent group.
    translation: Un sous-groupe peut avoir ses propres administrateurs, qui peuvent être différents de ceux du groupe parent.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  937ae9d3e8948a26:
    english: However an admin of the 'parent' group can make themselves admin of any subgroup.  This helps administrators of the parent group to administer subgroups as necessary.
    translation: Un administrateur du groupe parent peut toutefois devenir administrateur de n’importe lequel de ses sous-groupes. Cela lui permet de les administrer au besoin.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  282547a6c728d20c:
    english: Go to the Subgroup tab, find the subgroup and click **Join group**.
    translation: Ouvrez l’onglet Sous-groupes, trouvez le sous-groupe et cliquez sur **Rejoindre le groupe**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  64102057b4f533dd:
    english: "![Join group button on a closed subgroup](member_join_subgroup.png)"
    translation: "![Bouton Rejoindre le groupe sur un sous-groupe fermé](member_join_subgroup.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0f91a4020a9484ef:
    english: Now a member of the subgroup, an admin of the parent group can make themselves an admin of the subgroup.
    translation: Une fois membre du sous-groupe, l’administrateur du groupe parent peut se donner le rôle d’administrateur du sous-groupe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b10fec2c4c3ebb6c:
    english: "![Make admin action for a parent group admin](member_make_admin.png)"
    translation: "![Action permettant à un administrateur du groupe parent de devenir administrateur du sous-groupe](member_make_admin.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dcb00619954e30a2:
