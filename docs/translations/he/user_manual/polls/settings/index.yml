  145c23b2412eff98:
    english: "# Proposal and poll settings"
    translation: "# הגדרות הצעות ומשאלים"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e0347d976f79179:
    english: "## Setting up a proposal or poll"
    translation: "## הגדרת הצעה או משאל"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e5d6f17041c19d41:
    english: "### Proposal and poll templates"
    translation: "### תבניות להצעות ולמשאלים"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8913cabb2f1f8227:
    english: 'Choose the proposal template you want to use. '
    translation: יש לבחור את תבנית ההצעה הרצויה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3620f6321777ca50:
    english: "### Add content"
    translation: "### הוספת תוכן"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bc7ebb222e9ff4d1:
    english: "**Group:** Check that the correct group is selected for your proposal or poll."
    translation: "**קבוצה:** יש לוודא שנבחרה הקבוצה המתאימה להצעה או למשאל."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3a1d375da02f3a49:
    english: "**Title:** Give your proposal or poll a short, relevant title."
    translation: "**כותרת:** יש לתת להצעה או למשאל כותרת קצרה ורלוונטית."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a62a7e63f9db295c:
    english: "**Details:** Explain what you are asking of people and include enough details so everyone knows what it means to vote.  "
    translation: "**פרטים:** יש להסביר מה מבקשים מהמשתתפים ולכלול מספיק פרטים כדי שמשמעות ההצבעה תהיה ברורה לכולם."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e17c2ab4878716f2:
    english: The predefined templates include some prompts to help you write a good proposal - use these or add your own details.
    translation: התבניות המוגדרות מראש כוללות שאלות מנחות לכתיבת הצעה. אפשר להיעזר בהן או להוסיף פרטים נוספים.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  74daa7f0cc476971:
    english: Avoid combining a range of ideas in one proposal, because people might agree to some aspects but not others and be unsure how to respond. You can break complex decisions down into multiple proposals.
    translation: כדאי להימנע משילוב רעיונות שונים בהצעה אחת. ייתכן שמשתתפים יסכימו לחלקם ולא לאחרים, ולא ידעו כיצד להשיב. אפשר לחלק החלטות מורכבות לכמה הצעות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0da6e449688940bb:
    english: When making a proposal, state your expectations and describe the impact the proposal will have if adopted. If it's a formal or binding proposal it's often worth describing what it means if the proposal is not adopted.
    translation: בעת כתיבת הצעה, יש לציין מה מצופה מהמשתתפים ולתאר את השפעתה אם תתקבל. אם ההצעה רשמית או מחייבת, כדאי לעיתים להסביר גם מה תהיה המשמעות אם לא תתקבל.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a6db66b75f495e21:
    english: Use the formatting tools to support your poll.  For example, attach a document file with the paperclip icon, insert an image, link to a website or online document, or even embed a video.
    translation: אפשר להיעזר בכלי העיצוב להוספת מידע למשאל. לדוגמה, ניתן לצרף מסמך באמצעות סמל המהדק, להוסיף תמונה, לקשר לאתר או למסמך מקוון, ואף להטמיע סרטון.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f4f85f131878c36d:
    english: "### Voting options"
    translation: "### אפשרויות הצבעה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  616aab74af2072ba:
    english: Each proposal and poll template provides options for voting.
    translation: כל תבנית להצעה או למשאל כוללת אפשרויות הצבעה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7a85de7eefe74178:
    english: Depending on the template, you can edit, remove, reorder, or add voting options to suit the decision process you are running.
    translation: בהתאם לתבנית, ניתן לערוך, להסיר, לשנות את הסדר או להוסיף אפשרויות הצבעה שיתאימו לתהליך קבלת ההחלטה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9bc44bf4b28ac5d8:
    english: "- Use the pencil icon to edit voting option \n- Use the trash can icon to remove unwanted voting options\n- Use the handle to move the order of voting options\n- Add voting options with **Add option** when the template allows custom options"
    translation: |-
      - לעריכת אפשרות הצבעה, יש להשתמש בסמל העיפרון
      - להסרת אפשרויות הצבעה לא רצויות, יש להשתמש בסמל פח האשפה
      - לשינוי סדר אפשרויות ההצבעה, יש לגרור אותן באמצעות הידית
      - אם התבנית מאפשרת אפשרויות מותאמות אישית, ניתן להוסיף אותן באמצעות **הוסף אפשרות**
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2062f39334fbd629:
    english: |-
      ### Edit voting options
      There is a lot of flexibility to configure voting options to suit the way your organization makes decisions.
    translation: |-
      ### עריכת אפשרויות הצבעה
      ניתן להתאים את אפשרויות ההצבעה לדרך שבה הארגון מקבל החלטות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5ac5b47c81fe187b:
    english: 'Use the pencil icon alongside the voting option to open the edit modal:'
    translation: 'כדי לפתוח את חלון העריכה, יש להשתמש בסמל העיפרון שלצד אפשרות ההצבעה:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3c791f8140ad3b39:
    english: "**Option name:** A short name for the option."
    translation: "**שם האפשרות:** שם קצר לאפשרות."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  77a0fb7409cf1711:
    english: "**Icon:** Select an icon for the option, such as thumbs up, thumbs down, abstain, or block."
    translation: "**סמל:** יש לבחור סמל לאפשרות, כגון אגודל למעלה, אגודל למטה, הימנעות או חסימה."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9126ee91e5d1cb95:
    english: "**Meaning:** A sentence that explains what choosing this options means."
    translation: "**משמעות:** משפט המסביר מה משמעות הבחירה באפשרות זו."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e88d83b93ba47666:
    english: "**Reason prompt:** A question to prompt voters to provide their reasoning or reconsider their position. "
    translation: "**שאלה מנחה לנימוק:** שאלה המעודדת את המשתתפים לנמק את הצבעתם או לשקול מחדש את עמדתם."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d05197892ea46087:
    english: "### Opening time"
    translation: "### מועד פתיחת ההצבעה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1b56f0ad52a3aed8:
    english: By default, voting opens immediately when you create the poll. If you want to schedule voting to open at a later time, uncheck **Voting opens immediately** and select an opening date and time.
    translation: כברירת מחדל, ההצבעה נפתחת מיד עם יצירת המשאל. כדי לקבוע מועד פתיחה מאוחר יותר, יש לבטל את הסימון של **ההצבעה נפתחת מיד** ולבחור תאריך ושעה לפתיחה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  48ccc43734b062eb:
    english: This is useful to give time for discussion before voting opens, or to ensure a poll or proposal is correctly set up and scheduled to happen at the right time.
    translation: כך אפשר להקדיש זמן לדיון לפני פתיחת ההצבעה, או לוודא שהמשאל או ההצעה הוגדרו כראוי וייפתחו במועד המתאים.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b68fccc3132988ff:
    english: When a poll has a scheduled opening time, you can add voters before voting opens. Voters will be notified when voting opens, rather than when they are added.
    translation: כאשר נקבע למשאל מועד פתיחה, ניתן להוסיף משתתפים לפני שההצבעה נפתחת. הם יקבלו התראה עם פתיחת ההצבעה, ולא בעת הוספתם.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  82d4cacfa780dd98:
    english: "**Notify voters when poll opens:** When checked (default), all voters will receive a notification when voting opens. Uncheck this if you want to open voting without sending notifications."
    translation: "**שליחת התראה למשתתפים כשהמשאל נפתח:** כאשר האפשרות מסומנת, כברירת מחדל, כל המשתתפים יקבלו התראה עם פתיחת ההצבעה. כדי לפתוח את ההצבעה ללא התראות, יש לבטל את הסימון."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d084620657803f93:
    english: "**Closing date and time:** Select the closing date and time for your poll."
    translation: "**תאריך ושעת סגירה:** יש לבחור את התאריך והשעה שבהם המשאל ייסגר."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c0472419a2671222:
    english: Give sufficient time for people to vote. You could time the proposal so it closes before a meeting, or avoid closing over a weekend, so that people will receive a timely reminder. If necessary, you can close the poll early or extend the closing time.
    translation: יש להקצות די זמן להצבעה. אפשר לקבוע שההצעה תיסגר לפני פגישה, או להימנע מסגירה בסוף השבוע, כדי שהמשתתפים יקבלו תזכורת בזמן המתאים. במקרה הצורך, ניתן לסגור את המשאל מוקדם או לדחות את מועד הסגירה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c87f87e6cbc1a4d7:
    english: "**Who can vote?** Invite everyone in the group or only specific people that you invite."
    translation: "**מי יכול להצביע?** אפשר להזמין את כל חברי הקבוצה או רק אנשים מסוימים."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e02a9cefc3082334:
    english: |-
      You can later add people to an 'Invite people only' poll. For identified polls,
      you can also remove people who should no longer be eligible to vote. People
      cannot be removed from an anonymous poll.
    translation: |-
      למשאל המיועד למוזמנים בלבד ניתן להוסיף אנשים גם בהמשך. במשאל שאינו אנונימי,
      ניתן גם להסיר אנשים שאינם אמורים עוד להיות זכאים להצביע. אי אפשר
      להסיר אנשים ממשאל אנונימי.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2e959157d75ed7bd:
    english: "## More settings"
    translation: "## הגדרות נוספות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3d4443d3e6d3b13d:
    english: |-
      ### Reminder
      Send a 'Closing soon' notification 24 hours before the poll closes. This can be an opportunity for people to see how others have voted and reconsider their own vote, or just a way to increase participation in the poll.
    translation: |-
      ### תזכורת
      אפשר לשלוח התראת 'הסגירה מתקרבת' 24 שעות לפני סגירת המשאל. כך ניתן לאפשר למשתתפים לראות כיצד אחרים הצביעו ולשקול מחדש את הצבעתם, או לעודד השתתפות במשאל.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  62067c0573d7a64e:
    english: |-
      Setting options:
      - Nobody
      - Author
      - Undecided voters (default)
      - All voters
    translation: |-
      אפשרויות ההגדרה:
      - אף אחד
      - יוצרי המשאל
      - משתתפים שטרם החליטו (ברירת מחדל)
      - כל המשתתפים
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6cd67c3f92302551:
    english: |-
      For an anonymous poll lasting at least 24 hours, Loomio automatically reminds
      eligible people who have not voted during the final 24 hours. This reminder
      cannot be changed in the poll settings.
    translation: |-
      במשאל אנונימי שנמשך לפחות 24 שעות, Loomio שולחת תזכורת אוטומטית
      למי שזכאים להצביע וטרם הצביעו במהלך 24 השעות האחרונות. לא ניתן
      לשנות תזכורת זו בהגדרות המשאל.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72f172271e2a636a:
    english: |-
      ### Anonymous voting
      If enabled, votes are stored separately from voter identities. Results appear after voting closes, and voters cannot add reasons, review their submitted vote, or change it.
    translation: |-
      ### הצבעה אנונימית
      כשהאפשרות מופעלת, ההצבעות נשמרות בנפרד מזהות המשתתפים. התוצאות מוצגות לאחר סגירת ההצבעה, ולא ניתן להוסיף נימוקים, לעיין בהצבעה שהוגשה או לשנות אותה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3393027493510f2f:
    english: See [Anonymous voting](/en/user_manual/polls/anonymous_voting) for details about how voter identities are separated from submitted votes, what information is retained, and the limits of the protection.
    translation: למידע על ההפרדה בין זהות המשתתפים להצבעות שהוגשו, על המידע שנשמר ועל מגבלות ההגנה, ראו [הצבעה אנונימית](/en/user_manual/polls/anonymous_voting).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b731b9118e48dee5:
    english: |-
      > [!WARNING]
      > Once a poll has started you cannot edit the poll to make it anonymous or to undo the anonymous setting.
    translation: |-
      > [!WARNING]
      > לאחר שהמשאל התחיל, אי אפשר לערוך אותו כדי להפוך אותו לאנונימי או לבטל את ההגדרה האנונימית.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e8660d089a3c07bb:
    english: |-
      > [!WARNING]
      > You cannot re-open an anonymous poll after it has closed. Submitted votes are not linked to the participation records that show who has voted.
    translation: |-
      > [!WARNING]
      > אי אפשר לפתוח מחדש משאל אנונימי לאחר שנסגר. ההצבעות שהוגשו אינן מקושרות לרישומי ההשתתפות שמראים מי הצביעו.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  aaaaa28a4b435835:
    english: |-
      ### Vote reason
      It can be helpful to understand why people voted the way they did. With this setting, you can prompt people to share their thoughts when they vote.
    translation: |-
      ### נימוק ההצבעה
      הבנת הסיבות להצבעה יכולה לסייע בקבלת החלטה. הגדרה זו מאפשרת לעודד את המשתתפים לשתף את מחשבותיהם בעת ההצבעה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  309645182b157738:
    english: 'Available settings depend on the template:'
    translation: 'ההגדרות הזמינות תלויות בתבנית:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d67e2c2914e91a6f:
    english: |-
      - **Optional** lets voters choose whether to give a reason
      - **Required for disagree or block** requires a reason when the selected option
        uses the Disagree or Block voting icon
      - **Required for block** requires a reason when the selected option uses the
        Block voting icon
      - **Required** requires every voter to give a reason
      - **Disabled** removes the vote-reason field
    translation: |-
      - **אופציונלי** מאפשר לבחור אם לציין נימוק
      - **נדרש עבור אי הסכמה או חסימה** מחייב נימוק כאשר האפשרות שנבחרה
        משתמשת בסמל ההצבעה אי הסכמה או חסימה
      - **נדרש עבור חסימה** מחייב נימוק כאשר האפשרות שנבחרה משתמשת
        בסמל ההצבעה חסימה
      - **נדרש** מחייב את כל המצביעים לציין נימוק
      - **נָכֶה** מסיר את שדה הנימוק להצבעה
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  af5e7c0557aec611:
    english: |-
      The conditional settings follow the voting icon rather than the option name.
      They still apply if you rename Disagree to a term such as Objection. The
      Consent template defaults to **Required for disagree or block**, while the
      Consensus template defaults to **Required for block**. Other templates default
      to **Optional**, except Question rounds where the response itself is required.
      The poll author can change the setting for an individual poll.
    translation: |-
      ההגדרות המותנות נקבעות לפי סמל ההצבעה ולא לפי שם האפשרות.
      הן חלות גם אם משנים את השם אי הסכמה לשם אחר, למשל התנגדות. בתבנית
      הסכמה, ברירת המחדל היא **נדרש עבור אי הסכמה או חסימה**, ובתבנית
      קונצנזוס ברירת המחדל היא **נדרש עבור חסימה**. בתבניות אחרות ברירת
      המחדל היא **אופציונלי**, למעט סבבי שאלות שבהם התשובה עצמה נדרשת.
      ניתן לשנות את ההגדרה בסקר מסוים.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ecb0d89c623db459:
    english: "**Limit reason to maximum 500 characters:** Keeping vote reasons short makes them easier to understand. A collection of concise reasons is a great resource for making a decision.  This setting is ticked by default. Untick to allow for longer reasons."
    translation: "**הגבלת הנימוק ל־500 תווים לכל היותר:** נימוקים קצרים להצבעה קלים יותר להבנה. אוסף נימוקים תמציתיים יכול לסייע בקבלת החלטה. ההגדרה מסומנת כברירת מחדל. כדי לאפשר נימוקים ארוכים יותר, יש לבטל את הסימון."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  35bd4f116b9ff26a:
    english: |-
      ### Hide results
      If you want people to vote without knowing how others have voted, you can hide the results of the poll.  Useful if you do not want people to be affected by how other people have voted.
    translation: |-
      ### הסתרת תוצאות
      כדי לאפשר הצבעה בלי לדעת כיצד אחרים הצביעו, ניתן להסתיר את תוצאות הסקר. כך ההצבעות של אחרים לא ישפיעו על הבחירה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8cc5b82f4cc5e94e:
    english: |-
      Setting options:
      - Do not hide results
      - Hide results until a vote is cast
      - Hide results until voting closes
    translation: |-
      אפשרויות ההגדרה:
      - לא להסתיר תוצאות
      - להסתיר תוצאות עד להצבעה
      - להסתיר תוצאות עד לסיום ההצבעה
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4be103ffd97e7e8f:
    english: While results are hidden, nobody can reply to votes. Replies to votes open when voting closes.
    translation: כל עוד התוצאות מוסתרות, לא ניתן להשיב להצבעות. האפשרות להשיב להצבעות נפתחת עם סיום ההצבעה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a488ebe6712a5e1d:
    english: If results are hidden until a vote is cast, vote before you print or export the thread as Markdown.
    translation: אם התוצאות מוסתרות עד להצבעה, יש להצביע לפני הדפסה או יצוא של השרשור בפורמט Markdown.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1e5a1eb47ee3d99d:
    english: |-
      Anonymous polls always hide results until voting closes. The STV Election
      template enables anonymous voting by default.
    translation: |-
      בסקרים אנונימיים התוצאות מוסתרות תמיד עד לסיום ההצבעה. בתבנית הבחירות בשיטת STV
      הצבעה אנונימית מופעלת כברירת מחדל.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
