navigation_title: Згода
blocks:
  9153f30a2c3db9f2:
    english: "# Consent"
    translation: "# Згода"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e16bed826124695f:
    english: A Consent proposal asks whether a course of action is safe to try. Participants either consent or raise an objection. An objection identifies a concrete risk or harm that the proposal should address.
    translation: Пропозиція «Згода» ставить запитання, чи безпечно спробувати запропонований спосіб дій. Учасники висловлюють згоду або заперечення. Заперечення вказує на конкретний ризик або шкоду, які потрібно врахувати в пропозиції.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d675dd47ae42c929:
    english: This page explains how to run one Consent proposal. See the [Consent process](/en/guides/making_decisions/consent_process) for the complete workflow, including questions, Sense check, amendments, objections, and outcome.
    translation: На цій сторінці описано, як провести голосування за однією пропозицією «Згода». Повний порядок дій, зокрема запитання, перевірку розуміння, поправки, заперечення та результат, описано в розділі [Процес ухвалення рішення за згодою](/en/guides/making_decisions/consent_process).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7c4c79526b1d437b:
    english: "## When to use Consent"
    translation: "## Коли використовувати «Згоду»"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1b99c0443bd1e4c8:
    english: Use Consent when the group needs a workable decision that can proceed unless there is a valid objection. It suits experiments, operational policies, role agreements, and other decisions the group can review after gaining experience.
    translation: Використовуйте «Згоду», коли групі потрібне здійсненне рішення, яке можна виконувати за відсутності обґрунтованих заперечень. Цей спосіб підходить для експериментів, робочих правил, домовленостей про ролі та інших рішень, які група зможе переглянути після набуття досвіду.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  966f3146dc9f61f1:
    english: Consent does not require everyone to prefer the proposal. Define what counts as an objection before voting, and explain how objections will be tested and resolved.
    translation: Для згоди не потрібно, щоб усі віддавали перевагу пропозиції. До голосування визначте, що вважатиметься запереченням, і поясніть, як група перевірятиме та розв’язуватиме заперечення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e6cf2f0ebd4a7f58:
    english: "## Example: start a bottle trial"
    translation: "## Приклад: випробування поворотних пляшок"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ad7be5e188748cb3:
    english: Oatmilk Cooperative proposes starting a six-week returnable-bottle trial next month. The trial is limited in scope and includes a review, so the group asks whether it is safe to try.
    translation: Кооператив Oatmilk Cooperative пропонує наступного місяця розпочати шеститижневе випробування поворотних пляшок. Масштаб випробування обмежений, а після нього передбачено перегляд результатів. Тому група вирішує, чи безпечно його спробувати.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9703f1f9474243af:
    english: "## Set up the proposal"
    translation: "## Підготуйте пропозицію"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6458750b94201df6:
    english: Describe the proposed action, its limits, safeguards, and review point. Keep **Consent** and **Objection** meanings precise, and require a reason for objections so the concern can be understood and addressed.
    translation: Опишіть запропоновані дії, їхні межі, запобіжні заходи та час перегляду рішення. Чітко визначте значення **Згода** і **Заперечення**. Вимагайте пояснення до заперечень, щоб група могла зрозуміти й розглянути порушені питання.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Голосуйте"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d98c0e71880c8828:
    english: Participants select **Consent** when the proposal is safe enough to try, even if it is not their preferred plan. They select **Objection** when they can describe a material risk or harm.
    translation: Учасники вибирають **Згода**, якщо пропозицію достатньо безпечно спробувати, навіть коли вони віддають перевагу іншому плану. Вони вибирають **Заперечення**, якщо можуть описати суттєвий ризик або шкоду.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Перегляньте результати"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b0265040032f48e5:
    english: The chart makes objections visible, but the group must examine the reasons. Resolve a valid objection by amending the proposal, adding a safeguard, changing its scope, or deciding not to proceed.
    translation: На діаграмі видно заперечення, але групі потрібно розглянути їхні причини. Щоб усунути обґрунтоване заперечення, внесіть зміни до пропозиції, додайте запобіжний захід, змініть її масштаб або вирішіть не продовжувати.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a87df65569cb3a09:
    english: Publish an outcome that records the agreed action, any safeguards, who is responsible, and when the group will review it.
    translation: Опублікуйте результат, у якому зазначено погоджені дії, запобіжні заходи, відповідальних осіб і час, коли група перегляне рішення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
