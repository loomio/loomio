  0b8776f3657a1add:
    english: Group settings control how your group is presented, who can find and join it, and what members are allowed to do. Only group administrators can edit these settings.
    translation: Настройки группы определяют, как она представлена, кто может её найти и присоединиться к ней, а также какие действия доступны участникам. Изменять эти настройки могут только администраторы группы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  306f2b79029e2196:
