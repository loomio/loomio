---
navigation_title: Indirizzo email
blocks:
  14280ff177b248ab:
    english: "# Send an email to start a thread in your group"
    translation: "# Invia un'email per avviare una discussione nel tuo gruppo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e3de5524e10b9928:
    english: Your Loomio group has an email address! You can send or forward email to this address to start a thread in the group.
    translation: Il tuo gruppo Loomio ha un indirizzo email. Puoi inviare o inoltrare un'email a questo indirizzo per avviare una discussione nel gruppo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  85a7436d4a1b4396:
    english: |-
      You can see your group's email address on the group page:
      ![location of the email address on the group page](email_email_button.png)
    translation: |-
      Puoi trovare l'indirizzo email del tuo gruppo nella pagina del gruppo:
      ![Posizione dell'indirizzo email nella pagina del gruppo](email_email_button.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e34019bbcf3b319f:
    english: When you send an email to this address, a new thread will be started. The email subject becomes the thread title, the body of the email becomes the description, and any attached files will be attached to the thread.
    translation: Quando invii un'email a questo indirizzo, si avvia una nuova discussione. L'oggetto dell'email diventa il titolo della discussione, il testo diventa la descrizione e gli eventuali file allegati vengono aggiunti alla discussione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  46a53b8267a61c2f:
    english: The email "From" address is used to find the group member who will be the author of the thread.
    translation: L'indirizzo nel campo "Da" dell'email serve a identificare il membro del gruppo che sarà l'autore della discussione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bd7df6f632af8db1:
    english: "## Preventing unauthorized emails"
    translation: "## Impedire l'invio di email non autorizzate"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a5118468df167ba0:
    english: To ensure that this feature cannot be used by people who are not members of your group, Loomio will require that the "From" address of an incoming email matches the address of someone in the group.
    translation: Per impedire a chi non è membro del tuo gruppo di usare questa funzione, Loomio richiede che l'indirizzo nel campo "Da" di un'email in arrivo corrisponda a quello di un membro del gruppo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f11910ae643c5b47:
    english: If you use multiple email addresses, you can add an alias so Loomio knows about your other email addresses.
    translation: Se usi più indirizzi email, puoi aggiungere un alias per far riconoscere a Loomio anche gli altri tuoi indirizzi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e3d88a25128322b5:
    english: When the "from" address does not match a member of the group, you will receive a notification asking you to add an alias or reject all further emails from that address.
    translation: Se l'indirizzo nel campo "Da" non corrisponde a quello di un membro del gruppo, riceverai una notifica che ti chiederà di aggiungere un alias o di rifiutare tutte le email future provenienti da quell'indirizzo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  890546269cfa56b6:
    english: This means that the first time you send email from an unrecognised address, you will need to add an alias. After that, emails will be accepted immediately.
    translation: La prima volta che invii un'email da un indirizzo non riconosciuto, dovrai aggiungere un alias. In seguito, le email da quell'indirizzo saranno accettate subito.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e778a27d6b286135:
    english: "![Location of the approve and reject buttons for an unrecognised email](email_unreleased_emails.png)"
    translation: "![Posizione dei pulsanti per approvare e rifiutare un'email da un indirizzo non riconosciuto](email_unreleased_emails.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
