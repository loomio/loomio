---
navigation_title: Preparare una riunione
blocks:
  165e9dec4d4660aa:
    english: "# Prepare for a meeting"
    translation: "# Preparare una riunione"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5d14c790e0c05446:
    english: Effective meetings are productive, inclusive, and collaborative - they improve engagement, help build strong relationships, establish alignment, make better and faster decisions, promote inclusion, facilitate creative thinking and innovation, are a great channel for feedback and continuous improvement.
    translation: Le riunioni efficaci sono produttive, inclusive e collaborative. Favoriscono la partecipazione, rafforzano le relazioni, aiutano a trovare una direzione comune e a prendere decisioni migliori e più rapide. Inoltre, stimolano la creatività e offrono occasioni per raccogliere riscontri e migliorare.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c69f325003094ac5:
    english: Use Loomio to plan an effective meeting; involve people from the outset, align towards the most important topics, and make better use of your precious time together.
    translation: 'Usa Loomio per organizzare una riunione efficace: coinvolgi le persone fin dall''inizio, individua gli argomenti più importanti e sfrutta al meglio il tempo trascorso insieme.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a30a32e8b06a9432:
    english: If the group is new to Loomio, begin with [Introducing Loomio to your group](/en/user_manual/overview/introducing_loomio), then use this meeting process as a practical first recurring workflow.
    translation: Se il gruppo non conosce ancora Loomio, inizia da [Presentare Loomio al tuo gruppo](/en/user_manual/overview/introducing_loomio), poi usa questo processo come prima attività ricorrente.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9a0eb26797e28e0f:
    english: There are several things you can do to make your next board or committee meeting effective...
    translation: Ecco cosa puoi fare per rendere efficace la prossima riunione del consiglio o del comitato...
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c04e8fcfc9edb01c:
