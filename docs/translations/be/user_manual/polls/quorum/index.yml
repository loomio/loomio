  a79abb23e8e1c82f:
    english: A quorum is the minimum percentage of eligible voters who must participate for a poll to be valid. Use it when your governance process requires a particular level of participation.
    translation: Кворум — гэта мінімальная доля людзей з правам голасу, якія павінны прагаласаваць, каб апытанне было сапраўдным. Выкарыстоўвайце яго, калі для прыняцця рашэння патрэбны пэўны ўзровень удзелу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d83e75068f697f6f:
    english: When creating a poll, open **More settings** and enter the required percentage in **Participation quorum**. Leave the field blank when no quorum is required.
    translation: Пры стварэнні апытання адкрыйце **Больш налад** і ўвядзіце патрэбны працэнт у поле **Кворум удзелу**. Калі кворум не патрэбны, пакіньце поле пустым.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a04b99724fe62a56:
    english: "![The Quorum setting with a 60 percent participation quorum](./quorum-section.png)"
    translation: "![Налада кворуму ўдзелу на ўзроўні 60 працэнтаў](./quorum-section.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  432f570094ad5b24:
    english: You can also set a quorum in a [poll template](/en/user_manual/polls/poll_templates/) so that polls created from that template use it by default.
    translation: Вы таксама можаце задаць кворум у [шаблоне апытання](/en/user_manual/polls/poll_templates/). Тады ён будзе аўтаматычна ўжывацца да апытанняў, створаных з гэтага шаблону.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  52841ec4c6253973:
    english: "## Example scenario"
    translation: "## Прыклад"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  96ded9027f394b57:
    english: Oatmilk Cooperative is discussing a six-week returnable bottle trial. The discussion has reached the point where the cooperative needs to approve the trial budget.
    translation: Кааператыў «Аўсянае малако» абмяркоўвае шасцітыднёвае выпрабаванне зваротных бутэлек. Цяпер кааператыву трэба зацвердзіць бюджэт выпрабавання.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7acd5f99c209cec0:
    english: Jamie selects **Start a vote**, chooses the **Consent** proposal template, and completes the title, details, options, duration, and voter settings.
    translation: Джэймі выбірае **Пачаць галасаванне**, затым шаблон прапановы **Згода** і запаўняе назву, апісанне, варыянты, працягласць і налады ўдзельнікаў галасавання.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c5bd111a40bc588f:
    english: "![The proposal title, details, options, duration, and voter settings](proposal-options.png)"
    translation: "![Назва, апісанне, варыянты, працягласць і налады ўдзельнікаў галасавання ў прапанове](proposal-options.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7ba26dd025983d8d:
    english: Jamie limits the vote to the five people responsible for the trial budget.
    translation: Джэймі абмяжоўвае галасаванне пяццю людзьмі, якія адказваюць за бюджэт выпрабавання.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ef25fbaed498cfbe:
    english: The cooperative requires 60 percent participation for significant decisions, so Jamie enters **60** in the participation quorum field and starts the proposal.
    translation: Для важных рашэнняў кааператыў патрабуе ўдзелу 60 працэнтаў людзей з правам голасу. Таму Джэймі ўводзіць **60** у поле кворуму ўдзелу і пачынае прапанову.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b1cd37eb5ed44589:
    english: Before anyone votes, the results panel shows that the quorum has not been reached.
    translation: Пакуль ніхто не прагаласаваў, панэль вынікаў паказвае, што кворум не дасягнуты.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1b8a41f8c5939665:
    english: "![No votes cast and the 60 percent quorum not yet reached](pie-chart-0.png)"
    translation: "![Галасоў няма, кворум удзелу ў 60 працэнтаў яшчэ не дасягнуты](pie-chart-0.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ff36e799ac095caf:
    english: Jamie agrees and Samira disagrees. The chart updates, but two of five eligible voters is only 40 percent participation, so the quorum is still not reached.
    translation: Джэймі выказвае згоду, а Саміра — нязгоду. Дыяграма абнаўляецца, але два галасы з пяці складаюць толькі 40 працэнтаў удзелу. Кворум усё яшчэ не дасягнуты.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7ad216922d5d4dcb:
    english: "![Two of five votes cast and the quorum not yet reached](pie-chart-40.png)"
    translation: "![Прагаласавалі двое з пяці, кворум яшчэ не дасягнуты](pie-chart-40.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  554dc5536fdb1a60:
    english: Alex then agrees. Three of five eligible voters have participated, reaching the 60 percent quorum. The requirement now shows a green check mark. Jamie can close the poll early or wait for the remaining voters.
    translation: Затым Алекс выказвае згоду. Прагаласавалі трое з пяці людзей з правам голасу, таму кворум у 60 працэнтаў дасягнуты. Побач з патрабаваннем з'яўляецца зялёная птушка. Джэймі можа закрыць апытанне датэрмінова або пачакаць галасоў астатніх.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
