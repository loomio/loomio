  91a303d3d1fb3894:
    english: 'A Loomio group is a safe place for people to meet, have discussions and make decisions. '
    translation: Un groupe Loomio est un espace sûr où les personnes peuvent se retrouver, discuter et prendre des décisions.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ea5096230dfe16d4:
    english: 'It’s a container where group members can find and share information, participate in important discussions and decisions that affect their work.  '
    translation: Les membres du groupe peuvent y trouver et partager des informations, et participer aux discussions et aux décisions importantes pour leur travail.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  47903117cdc64e73:
    english: A Loomio group looks like this.  At the top of the page you will see an image and logo that you can tailor to represent your organization.  This allows people arriving into your group to see they have joined a place they recognize and feel welcome - a safe space where people feel at home, amongst friends and can participate effectively.
    translation: Voici à quoi ressemble un groupe Loomio. En haut de la page, vous pouvez personnaliser une image et un logo pour représenter votre organisation. Les personnes qui rejoignent votre groupe reconnaissent ainsi l’espace dans lequel elles arrivent et peuvent s’y sentir accueillies, à l’aise et libres de participer.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3d39462ab98c79e6:
    english: "![The Oatmilk Cooperative group page, with its description and discussion list](group_page.png)"
    translation: "![Page du groupe The Oatmilk Cooperative, avec sa description et sa liste de discussions](group_page.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  59f3bebbce1676a6:
    english: |-
      Choose a representative name for your group and use the group description to outline;
      - **what** this group is used for,
      - **why** this is important,
      - **who** is involved, and
      - **how** members can participate.
    translation: |-
      Choisissez un nom représentatif pour votre groupe et utilisez sa description pour préciser :
      - **à quoi** sert ce groupe,
      - **pourquoi** il est important,
      - **qui** y participe, et
      - **comment** les membres peuvent participer.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  79ae54bca7eb1797:
    english: You may also include information like a code of conduct, terms of reference or other governing documents for the group.
    translation: Vous pouvez aussi ajouter un code de conduite, un mandat ou d’autres documents qui définissent le fonctionnement du groupe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '018c400616dad5f4':
    english: If you are preparing a new group, see [Introducing Loomio to your group](/en/user_manual/overview/introducing_loomio) for a practical sequence from choosing the first piece of work through to recording an outcome.
    translation: Si vous préparez un nouveau groupe, consultez [Présenter Loomio à votre groupe](/en/user_manual/overview/introducing_loomio) pour suivre les étapes, du choix d’un premier sujet de travail à la consignation d’une conclusion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1bda53ca8e31780c:
    english: "## Administration, Facilitation and Moderation - Code of Conduct"
    translation: "## Administration, facilitation et modération - Code de conduite"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1091f77d5ab879ed:
    english: 'Loomio is built to foster inclusive participation, diversity and trust - helping groups make better decisions together. '
    translation: Loomio favorise la participation de toutes et tous, la diversité et la confiance pour aider les groupes à prendre de meilleures décisions ensemble.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1ac058350eea2c6d:
    english: 'Some topics bring tension in a group.  So it''s important to allow a robust discussion to take place, while ensuring it is also a safe place, particularly for vulnerable people in your group. '
    translation: Certains sujets peuvent créer des tensions dans un groupe. Il est important de permettre une discussion approfondie tout en préservant un espace sûr, en particulier pour les personnes vulnérables de votre groupe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  999bb2251bf623cd:
    english: 'We recommend establishing a code of conduct for your group, to help everyone be aware of their responsibility for appropriate behaviour and encourage self-regulation. '
    translation: Nous vous recommandons d’établir un code de conduite pour votre groupe. Il aide chacun à comprendre sa responsabilité d’adopter un comportement approprié et encourage l’autorégulation.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9a77fa2d5f4fdb01:
    english: See the [Facilitator's Guide](/en/guides/facilitators_guide/commencing#culture-protocol-expectations) to further explore the value of a code of conduct.
    translation: Consultez le [Guide de facilitation](/en/guides/facilitators_guide/commencing#culture-protocol-expectations) pour en savoir plus sur l’intérêt d’un code de conduite.
    status: machine
