  ff07fce3bab705aa:
    english: Proposals and polls collect structured responses from a group. They can help test an idea, make a decision, identify priorities, schedule a meeting, or elect representatives.
    translation: Propostas e enquetes coletam respostas estruturadas de um grupo. Elas ajudam a testar uma ideia, tomar uma decisão, identificar prioridades, agendar uma reunião ou eleger representantes.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f031d2644fee2a91:
    english: "## Find the right help"
    translation: "## Encontre a orientação certa"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  34039c79ea769793:
    english: 'These parts of the manual answer different questions:'
    translation: 'Estas partes do manual respondem a perguntas diferentes:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  34ea9d58ccbf80fb:
    english: |-
      | If you want to… | Read… |
      |---|---|
      | Choose what participants should express | [Proposals](../proposals/) or [Polls](../proposal_types/) |
      | Run a specific proposal template | [Sense check](../proposals/sense_check/), [Advice](../proposals/advice/), [Consent](../proposals/consent/), or [Consensus](../proposals/consensus/) |
      | Configure the templates available to a group | [Poll templates](../poll_templates/) |
      | Facilitate a decision from discussion to outcome | [Making decisions](/en/guides/making_decisions/) |
    translation: |-
      | Se você quer… | Leia… |
      |---|---|
      | Escolher o que os participantes devem expressar | [Propostas](../proposals/) ou [Enquetes](../proposal_types/) |
      | Usar um modelo de proposta específico | [Verificação de opinião](../proposals/sense_check/), [Aconselhamento](../proposals/advice/), [Consentimento](../proposals/consent/) ou [Consenso](../proposals/consensus/) |
      | Configurar os modelos disponíveis para um grupo | [Modelos de enquetes](../poll_templates/) |
      | Conduzir uma decisão da discussão até a conclusão | [Tomada de decisões](/en/guides/making_decisions/) |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7eddb057cca077f4:
    english: A **voting method** defines how people respond and how results are calculated. A **poll template** is a reusable configuration built on a voting method, with preset instructions, options, and settings. A **decision process** may use a discussion and several templates before the group reaches an outcome.
    translation: Um **método de votação** define como as pessoas respondem e como os resultados são calculados. Um **modelo de enquete** é uma configuração reutilizável baseada em um método de votação, com instruções, opções e configurações predefinidas. Um **processo de decisão** pode incluir uma discussão e vários modelos antes que o grupo chegue a uma conclusão.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3cd46aa2f1240e88:
    english: "## Proposals"
    translation: "## Propostas"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  85a55fccaf4e4032:
    english: 'A proposal asks people to respond to a statement or course of action. Loomio includes templates for common purposes:'
    translation: 'Uma proposta pede que as pessoas respondam a uma afirmação ou a um plano de ação. O Loomio inclui modelos para finalidades comuns:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  51bf1ffa7d057d9e:
    english: |-
      - [Sense check](../proposals/sense_check/) gathers early reactions;
      - [Advice](../proposals/advice/) gathers input for a decision maker;
      - [Consent](../proposals/consent/) tests for meaningful objections; and
      - [Consensus](../proposals/consensus/) seeks collective agreement.
    translation: |-
      - [Verificação de opinião](../proposals/sense_check/) reúne as primeiras reações;
      - [Aconselhamento](../proposals/advice/) reúne contribuições para quem toma a decisão;
      - [Consentimento](../proposals/consent/) verifica se há objeções relevantes; e
      - [Consenso](../proposals/consensus/) busca um acordo coletivo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d01e9f85fcd2d9c2:
    english: See [Proposals](../proposals/) to compare them.
    translation: Consulte [Propostas](../proposals/) para comparar os modelos.
    status: machine
