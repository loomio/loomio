  9f617c478e625137:
    english: "# Consensus"
    translation: "# Konsens"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7fdabc28ebd47ad3:
    english: A Consensus proposal seeks collective agreement from everyone involved. The default responses let participants agree, abstain, disagree, or block.
    translation: Ein Konsensvorschlag soll eine gemeinsame Einigung aller Beteiligten erreichen. Die Standardantworten sind Zustimmung, Enthaltung, Ablehnung und Veto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  82dbfd2dd1160c29:
    english: This page explains how to run one Consensus proposal. See the [Consensus process](/en/guides/making_decisions/consensus_process) for the complete workflow from discussion and Sense check through amendment and outcome.
    translation: Diese Seite erklärt, wie du einen Konsensvorschlag durchführst. Der [Konsensprozess](/en/guides/making_decisions/consensus_process) beschreibt den gesamten Ablauf von der Diskussion und der Prüfung des Meinungsbilds über Änderungen bis zum Fazit.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  12074389ed4de458:
    english: "## When to use Consensus"
    translation: "## Wann du Konsens verwenden solltest"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e1e89b6df3a1dbe1:
    english: Use Consensus for decisions where broad ownership matters and the group is prepared to work through concerns together. It suits shared standards, governance agreements, strategic commitments, and decisions that affect the whole group.
    translation: Verwende Konsens für Entscheidungen, die von der Gruppe gemeinsam getragen werden sollen und bei denen ihr Bedenken zusammen klären möchtet. Dazu gehören gemeinsame Standards, Vereinbarungen zur Leitung der Gruppe, strategische Verpflichtungen und Entscheidungen, die die ganze Gruppe betreffen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a28ea900326c3254:
    english: Consensus usually requires discussion and proposal development before voting. Define the meaning and consequences of **Block** for your group. If your process does not use blocks, edit the template to remove that option.
    translation: Konsens erfordert meist eine Diskussion und die Ausarbeitung des Vorschlags vor der Abstimmung. Legt fest, was ein **Veto** für eure Gruppe bedeutet und welche Folgen es hat. Wenn euer Verfahren keine Vetos vorsieht, entferne diese Antwort aus der Vorlage.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f795d33e2be59883:
    english: "## Example: adopt a bottle return standard"
    translation: "## Beispiel: Einen Standard für die Rückgabe von Flaschen einführen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dda29f07ddb547f7:
    english: Oatmilk Cooperative has developed a standard covering deposits, collection, washing, food-safety records, and reporting. Because every team will use it, the cooperative seeks consensus before adopting it.
    translation: Die Hafermilch-Genossenschaft hat einen Standard für Pfand, Sammlung, Reinigung, Dokumentation der Lebensmittelsicherheit und Berichterstattung ausgearbeitet. Da alle Teams ihn anwenden werden, strebt die Genossenschaft vor der Einführung einen Konsens an.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9703f1f9474243af:
    english: "## Set up the proposal"
    translation: "## Den Vorschlag vorbereiten"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e63b2959e1f6553:
    english: State the complete agreement being considered and link to supporting information. Explain each response, particularly the distinction between disagreeing and blocking. Allow enough time for questions and amendments.
    translation: Beschreibe die gesamte Vereinbarung, über die entschieden werden soll, und verlinke ergänzende Informationen. Erkläre jede Antwortmöglichkeit, besonders den Unterschied zwischen Ablehnung und Veto. Plane genug Zeit für Fragen und Änderungen ein.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Abstimmen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  955925e0c6998049:
    english: Participants choose the response that matches their position and explain the interests or concerns behind it. A block reason should identify why adopting the proposal would violate a fundamental need or agreed principle.
    translation: Die Teilnehmenden wählen die Antwort, die ihrer Haltung entspricht, und erläutern ihre Interessen oder Bedenken. Wer ein Veto einlegt, sollte begründen, warum die Annahme des Vorschlags ein grundlegendes Bedürfnis oder einen vereinbarten Grundsatz verletzen würde.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Ergebnisse auswerten"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d5d9f0dbb463bed7:
    english: The chart shows the balance of responses. Review every disagreement and block reason; consensus is a process of resolving concerns, not only counting agreement votes.
    translation: Das Diagramm zeigt die Verteilung der Antworten. Prüfe jede Ablehnung und jede Begründung für ein Veto. Bei einem Konsens geht es darum, Bedenken zu klären und nicht nur Zustimmungen zu zählen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f7318776f4a978fc:
    english: If the group reaches agreement, publish an outcome recording the final standard and responsibilities. Otherwise, record what will be revised and when the group will return to the proposal.
    translation: Wenn die Gruppe eine Einigung erzielt, veröffentliche ein Fazit, das den endgültigen Standard und die Zuständigkeiten festhält. Andernfalls halte fest, was überarbeitet wird und wann die Gruppe den Vorschlag erneut bespricht.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
