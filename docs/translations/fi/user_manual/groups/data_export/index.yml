navigation_title: Tietojen vienti
blocks:
  '053719812e2be1ea':
    english: "# Group data backup or export"
    translation: "# Ryhmän tietojen varmuuskopiointi tai vienti"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  42721518a91907da:
    english: 'With the group data export feature you can:'
    translation: 'Ryhmän tietojen vientitoiminnolla voit:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f978c97e52e0b00a:
    english: |-
      - Download a file containing member data to audit group membership.
      - Download content of your group including text of threads and polls for archive or analysis.
      - Open poll results in a spreadsheet or scripting language.
      - [Print or save PDF's of a thread or poll for archival purposes.](#print-thread-to-pdf)
      - Move your group, including all users, threads, polls, and files to another Loomio server.
    translation: |-
      - Ladata jäsentiedot sisältävän tiedoston ryhmän jäsenyyksien tarkistamista varten.
      - Ladata ryhmäsi sisällön, mukaan lukien keskustelujen ja kyselyjen tekstit, arkistointia tai analysointia varten.
      - Avata kyselyjen tulokset taulukkolaskentaohjelmassa tai käsitellä niitä ohjelmointikielellä.
      - [Tulostaa keskustelun tai kyselyn tai tallentaa sen PDF-tiedostona arkistointia varten.](#print-thread-to-pdf)
      - Siirtää ryhmäsi, mukaan lukien kaikki käyttäjät, keskustelut, kyselyt ja tiedostot, toiselle Loomio-palvelimelle.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  94b3081b62cd0a45:
    english: If you ever want to move from Loomio managed servers [to your own](https://github.com/loomio/loomio), you can use this feature.
    translation: Jos haluat joskus siirtyä Loomion ylläpitämiltä palvelimilta [omalle palvelimellesi](https://github.com/loomio/loomio), voit käyttää tätä toimintoa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  223d5690921676c4:
    english: If you're running your own Loomio server, and would rather not anymore, Loomio offer managed hosting in USA, EU and Australia. If you'd like to migrate your group to one of these servers, please [contact us](/contact).
    translation: Jos ylläpidät omaa Loomio-palvelinta mutta haluat siirtyä ylläpidettyyn palveluun, Loomio tarjoaa palvelimia Yhdysvalloissa, EU:ssa ja Australiassa. Jos haluat siirtää ryhmäsi jollekin näistä palvelimista, [ota meihin yhteyttä](/contact).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cabd4ab01146ea7c:
    english: "[Contact us](/contact) if you would like to transfer your Loomio group from Loomio's global hosted service at loomio.com to one of our regional services; loomio.eu for Europe or loomio.nz for Australia and New Zealand."
    translation: "[Ota meihin yhteyttä](/contact), jos haluat siirtää Loomio-ryhmäsi loomio.comin maailmanlaajuisesta palvelusta johonkin alueellisista palveluistamme: Euroopassa loomio.eu tai Australiassa ja Uudessa-Seelannissa loomio.nz."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
