  2f06a9491227b073:
    english: Loomio provides several ways to find discussions and decisions across your groups.
    translation: Loomio offre diversi modi per trovare discussioni e decisioni nei tuoi gruppi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  62c53ea4911e0c79:
    english: "## Search"
    translation: "## Ricerca"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  29cbb6f48ca978fa:
    english: The Search button in the top navigation bar opens global search from any page in Loomio.
    translation: Il pulsante Ricerca nella barra di navigazione in alto apre la ricerca globale da qualsiasi pagina di Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6286c9b6f2b16fc4:
    english: Search includes content you can access across all your groups and direct discussions. It can find discussion titles and context, comments, polls, votes, and outcomes.
    translation: La ricerca comprende i contenuti a cui puoi accedere in tutti i tuoi gruppi e nelle discussioni dirette. Può trovare titoli e descrizioni delle discussioni, commenti, sondaggi, voti e conclusioni.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c5a77d75258a11e6:
    english: Enter a word or phrase, then press Enter or select the search icon. For example, searching for **bottle** finds Oatmilk Cooperative content containing that word.
    translation: Inserisci una parola o una frase, poi premi Invio o seleziona l'icona di ricerca. Per esempio, cercando **bottle** trovi i contenuti di Oatmilk Cooperative che contengono questa parola.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1b93fd8aaf142d37:
    english: "### Search tips"
    translation: "### Suggerimenti per la ricerca"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  99f906ecbde3a538:
    english: "- Start with one or two distinctive words from the title or content you remember.\n- Search matches the beginning of a word, so a partial word such as **bott** can match **bottle**. \n- It will compensate for misspellings when results for the given query are very few.\n- Use the filters to limit results to an organization, subgroup, tag, or content type such as comments or polls.\n- Sort by **Best match** when relevance matters, or by newest or oldest when you know roughly when the content was posted."
    translation: "- Inizia con una o due parole distintive del titolo o del contenuto che ricordi.\n- La ricerca trova anche l'inizio di una parola: per esempio, **bott** può trovare **bottle**. \n- Se la ricerca produce pochissimi risultati, compensa gli errori di ortografia.\n- Usa i filtri per limitare i risultati a un'organizzazione, un sottogruppo, un'etichetta o un tipo di contenuto, come commenti o sondaggi.\n- Ordina per **Migliore abbinamento** se cerchi i risultati più pertinenti, oppure dal più recente o dal meno recente se sai più o meno quando è stato pubblicato il contenuto."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e7c532f120c4807d:
    english: "## Filter discussions"
    translation: "## Filtrare le discussioni"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  91bf7098343a1efa:
    english: Use the controls beside Search to filter discussions by open or closed status or by category tag. Combining a search term with a filter can narrow a long discussion list quickly.
    translation: Usa i controlli accanto a Ricerca per filtrare le discussioni in base allo stato, aperte o chiuse, o all'etichetta di categoria. Puoi combinare un termine di ricerca e un filtro per restringere rapidamente un lungo elenco di discussioni.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e3d2099d0e6fe6fa:
    english: "## Category tags"
    translation: "## Etichette di categoria"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  932506e53b51fac1:
    english: Tags group related discussions and polls under names chosen by your group, such as a project, team, or area of work.
    translation: Le etichette raggruppano discussioni e sondaggi correlati sotto nomi scelti dal tuo gruppo, come un progetto, un team o un'area di lavoro.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d761f1c7397d8e51:
    english: Select a tag on the **Discussions** tab to show matching discussions. People with permission to start or edit discussions can apply tags. See [Category tags](/en/user_manual/discussions/tags) for setup and permission details.
    translation: Seleziona un'etichetta nella scheda **Discussioni** per mostrare le discussioni corrispondenti. Chi ha il permesso di avviare o modificare discussioni può applicare le etichette. Per informazioni sulla configurazione e sui permessi, consulta [Etichette di categoria](/en/user_manual/discussions/tags).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b620c9f42e31a54f:
    english: "## Unread discussions"
    translation: "## Discussioni non lette"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b2f3737cd46d903a:
    english: Select **Unread discussions** in the sidebar to see discussions with activity you have not read. Within a discussion, the timeline helps you move to unread items and important events.
    translation: Seleziona **Discussioni non lette** nella barra laterale per vedere le discussioni con attività che non hai ancora letto. All'interno di una discussione, la cronologia ti aiuta a raggiungere gli elementi non letti e gli eventi importanti.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e016a4cafcaee460:
    english: "## Polls awaiting your vote"
    translation: "## Sondaggi in attesa del tuo voto"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  873929c0f1d06567:
    english: Select **Polls to vote on** in the sidebar to see active polls where you have been invited but have not yet voted. You can also open a group's **Polls** tab to see its active and closed polls.
    translation: Seleziona **Sondaggi da votare** nella barra laterale per vedere i sondaggi attivi a cui sei stato invitato ma in cui non hai ancora votato. Puoi anche aprire la scheda **Sondaggi** di un gruppo per vedere i suoi sondaggi attivi e chiusi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3bb08c3343e3efd7:
    english: "## Bookmarks"
    translation: "## Segnalibri"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1bec2703cc5fe70a:
    english: Bookmark a discussion, comment, poll, vote, or outcome when you want to return to it. Open **Bookmarks** from your user menu to see everything you have saved. See [Bookmarks](/en/user_manual/users/bookmarks) for details.
    translation: Aggiungi ai segnalibri una discussione, un commento, un sondaggio, un voto o una conclusione a cui vuoi tornare. Apri **Segnalibri** dal menu utente per vedere tutto ciò che hai salvato. Per maggiori informazioni, consulta [Segnalibri](/en/user_manual/users/bookmarks).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
