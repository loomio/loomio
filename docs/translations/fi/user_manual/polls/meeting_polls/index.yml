  86490ad15147169e:
    english: Use a **Time poll** to find a time for a meeting or event. It serves the same purpose as scheduling tools such as Doodle, while keeping the scheduling process with the group's other Loomio work. Participants see the options in their own time zone.
    translation: Käytä **Aikakyselyä**, kun haluat löytää sopivan ajan kokoukselle tai tapahtumalle. Se toimii kuten Doodlen kaltaiset ajanvarausvälineet, mutta voit sopia ajankohdasta ryhmän muun Loomio-työskentelyn yhteydessä. Osallistujat näkevät vaihtoehdot omalla aikavyöhykkeellään.
    status: needs_review
    note: use the interface label "**Aikakysely**" for "**Time poll**"
    provider: codex/gpt-6-sol
