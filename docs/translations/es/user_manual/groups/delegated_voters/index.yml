  0b8bb762e37fb8c3:
    english: |-
      To create a poll or proposal and only invite the delegates, use the "Selected people only" poll setting.
      ![Selected people only setting when starting a proposal](poll_invited_people_only.png)
      Then when inviting people to vote you will see the "Delegates of group-name" option.
      ![Delegates of Oatmilk Cooperative option in the invite-to-vote form](poll_invite_delegates_group.png)
    translation: |-
      Para crear una encuesta o propuesta e invitar solo a los delegados, usa la opción **Solo para personas seleccionadas**.
      ![Opción Solo para personas seleccionadas al iniciar una propuesta](poll_invited_people_only.png)
      Después, al invitar a votar, verás la opción **Delegados de nombre-del-grupo**.
      ![Opción Delegados de Cooperativa Oatmilk en el formulario para invitar a votar](poll_invite_delegates_group.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e895a07efeaf4dcf:
    english: |-
      You can see a list of who the delegates are from the members tab of your group page. Use the filter menu and select "Delegates".
      ![Delegates option in the members filter](members_list_delegates.png)
    translation: |-
      Puedes ver quiénes son los delegados en la pestaña de miembros de la página de tu grupo. Abre el menú de filtros y selecciona **Delegados**.
      ![Opción Delegados en el filtro de miembros](members_list_delegates.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
