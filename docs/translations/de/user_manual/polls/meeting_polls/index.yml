  86490ad15147169e:
    english: Use a **Time poll** to find a time for a meeting or event. It serves the same purpose as scheduling tools such as Doodle, while keeping the scheduling process with the group's other Loomio work. Participants see the options in their own time zone.
    translation: Mit einer **Zeitumfrage** findest du einen Termin für ein Treffen oder eine Veranstaltung. Sie erfüllt denselben Zweck wie Planungstools wie Doodle und bleibt dabei Teil der anderen Arbeit deiner Gruppe in Loomio. Teilnehmende sehen die Optionen in ihrer eigenen Zeitzone.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2e21bb1b54b6fcf9:
    english: "## Time poll"
    translation: "## Zeitumfrage"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  27ba736f4b564fe3:
    english: _Find when people are available to meet_
    translation: _Finde heraus, wann die Teilnehmenden Zeit für ein Treffen haben_
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2f5455ba3b487407:
    english: Save time arranging a date for your meeting or event.
    translation: Spare Zeit bei der Terminplanung für dein Treffen oder deine Veranstaltung.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  859c3efc07ce0b04:
    english: Time poll makes it easy to see everyone's availability and find the best time.
    translation: Mit einer Zeitumfrage siehst du leicht, wann alle Zeit haben, und findest den besten Termin.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  12ae9e9d3bdb0a4e:
    english: Give your Time poll a title and details. Enter a list of date and time options in your time zone.
    translation: Gib deiner Zeitumfrage einen Titel und ergänze die Details. Trage mehrere Termine in deiner Zeitzone ein.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  548fb6cd6fcd9376:
    english: When setting timeslots, consider people in different time zones. Participants will see times localized in their time zone.
    translation: Berücksichtige beim Festlegen der Termine Teilnehmende in anderen Zeitzonen. Sie sehen die Zeiten in ihrer eigenen Zeitzone.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3105405631b53c31:
    english: Set a meeting duration.
    translation: Lege die Dauer des Treffens fest.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8d56a5d9986286e9:
    english: "### Voting"
    translation: "### Abstimmung"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  41d1e6a3a6739d95:
    english: People mark each time with the green thumbs-up icon when they are available, the yellow sideways thumb when they can attend if needed, or the red thumbs-down icon when they are unavailable.
    translation: Teilnehmende markieren jeden Termin mit dem grünen Daumen nach oben, wenn sie Zeit haben, mit dem gelben Daumen zur Seite, wenn sie bei Bedarf teilnehmen können, oder mit dem roten Daumen nach unten, wenn sie keine Zeit haben.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b4784042c82735af:
    english: Participants can leave a reason comment to help the organizer find a suitable time.
    translation: Teilnehmende können einen Kommentar mit einer Begründung hinterlassen. Das hilft der organisierenden Person, einen passenden Termin zu finden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0165a90bc22b6f7f:
    english: If the times don't work, participants can suggest alternatives using the message field. You can then update the poll with new times.
    translation: Wenn keiner der Termine passt, können Teilnehmende im Nachrichtenfeld Alternativen vorschlagen. Du kannst die Umfrage dann um neue Termine ergänzen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6c7c09879e7d9bf8:
    english: The results update as voting proceeds in a table showing who is available when, so everyone can see which timeslots are popular.
    translation: Die Ergebnisse werden während der Abstimmung in einer Tabelle aktualisiert. Sie zeigt, wer wann Zeit hat. So können alle sehen, welche Termine beliebt sind.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b4783489f09ccf19:
    english: "### Outcome"
    translation: "### Fazit"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3c0061b9af0a6bca:
    english: When the Time poll closes, pick the best time and post an outcome.
    translation: Wenn die Zeitumfrage geschlossen ist, wähle den besten Termin und veröffentliche ein Fazit.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  62ef08e40ed2f44b:
    english: "**Notify**: Add the people you are inviting to the meeting or event"
    translation: "**Benachrichtigen**: Füge die Personen hinzu, die du zum Treffen oder zur Veranstaltung einladen möchtest"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  945f9e19218fb1bf:
    english: "**Meeting time**: Select the time that works best"
    translation: "**Meeting-Zeit**: Wähle den Termin, der am besten passt"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c5909628c21cd884:
    english: "**Meeting name**: Give your meeting a name. The Time poll title is used by default"
    translation: "**Name des Treffens**: Gib deinem Treffen einen Namen. Standardmäßig wird der Titel der Zeitumfrage verwendet"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  81195d01767895e4:
    english: "**Location**: Add a physical location or a meeting link"
    translation: "**Ort**: Gib einen Veranstaltungsort oder einen Link zum Treffen an"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  af5765f5bdf83132:
    english: "**Statement**: Summarize the result and add any instructions for the meeting"
    translation: "**Einschätzung**: Fasse das Ergebnis zusammen und ergänze bei Bedarf Hinweise zum Treffen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6c0cb92cca53d36a:
    english: Loomio includes the selected time, meeting name, duration, location, and statement in the outcome notification and calendar invitation.
    translation: Loomio übernimmt den gewählten Termin, den Namen und die Dauer des Treffens, den Ort und die Einschätzung in die Benachrichtigung zum Fazit und die Kalendereinladung.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
