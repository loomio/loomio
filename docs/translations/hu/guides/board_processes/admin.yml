  435f52763f0d9a5b:
    english: To keep a record of a thread discussion and decisions in polls, use **[Print thread](/en/user_manual/groups/data_export#print-thread-to-pdf)** and print the file to pdf.  You can then store a published copy of the thread in your chosen document storage archive.
    translation: Ha meg szeretnéd őrizni egy téma beszélgetését és a szavazások döntéseit, használd a **[Téma nyomtatása](/en/user_manual/groups/data_export#print-thread-to-pdf)** funkciót, és nyomtasd a fájlt PDF-be. Ezután a téma közzétett példányát eltárolhatod a választott dokumentumarchívumban.
