---
navigation_title: Zur Abstimmung einladen
blocks:
  0635cf23fcaaa95b:
    english: "# Invite to vote"
    translation: "# Zur Abstimmung einladen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2ae3991d9865a2bb:
    english: "## Invite people to vote in a poll"
    translation: "## Personen zur Abstimmung einladen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  56d96764605291b4:
    english: Invite people to your poll by sending them a notification.
    translation: Lade Personen zu deiner Abstimmung ein, indem du ihnen eine Benachrichtigung sendest.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3632ef534c8c03f7:
    english: After you start a poll, the **Invite to vote** box appears. Select an audience such as **Everyone in the thread** or your group, or enter individual names and email addresses.
    translation: Nachdem du eine Abstimmung gestartet hast, erscheint das Feld **zur Abstimmung einladen**. Wähle einen Personenkreis wie **Jeder in der Diskussion** oder deine Gruppe aus, oder gib einzelne Namen und E-Mail-Adressen ein.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  835f178f0b52f3b6:
    english: You can include an optional message with the invitation.
    translation: Du kannst der Einladung eine Nachricht hinzufügen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  78da00061d5815a4:
    english: Select a group chip to expand it into the people you are inviting. Select the x beside a name to remove that person from the invitation.
    translation: Wähle das Feld einer Gruppe aus, um die Personen anzuzeigen, die du einlädst. Wähle das x neben einem Namen aus, um die Person aus der Einladung zu entfernen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e6969f4c4b62b6ff:
    english: "### Invite guests or experts"
    translation: "### Gäste oder Fachleute einladen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9bb72d11863e1f46:
    english: You can also invite a guest to the poll by entering their email address. They will be given permission to participate in only this poll.
    translation: Du kannst auch einen Gast zur Abstimmung einladen, indem du seine E-Mail-Adresse eingibst. Der Gast darf nur an dieser Abstimmung teilnehmen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dd20b166a40eb798:
    english: If the poll is within a thread, they will also be able to see that thread and its comments. They will not be able to comment, participate in other polls in the thread, or see other threads in the group.
    translation: Wenn die Abstimmung zu einer Diskussion gehört, kann der Gast auch diese Diskussion und ihre Kommentare sehen. Der Gast kann weder kommentieren noch an anderen Abstimmungen in der Diskussion teilnehmen oder andere Diskussionen in der Gruppe sehen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  84cc8773a5337094:
    english: "### Invite a subgroup to vote"
    translation: "### Eine Untergruppe zur Abstimmung einladen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  80ca3c8c753b0ebb:
    english: To limit voting to invited people, select **Selected people only** when you create the poll. You can then invite a subgroup from the parent group. See also [Delegated voters](/en/user_manual/groups/delegated_voters/).
    translation: Um die Teilnahme auf eingeladene Personen zu beschränken, wähle beim Erstellen der Abstimmung **Nur für ausgewählte Personen** aus. Danach kannst du eine Untergruppe der übergeordneten Gruppe einladen. Siehe auch [Delegierte Wähler*innen](/en/user_manual/groups/delegated_voters/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2074aff770fa7610:
    english: |-
      ![Selecting invited people only](invited-people-only.png)
      ![Inviting a subgroup to vote](invite-voters-subgroup.png)
    translation: |-
      ![Nur für ausgewählte Personen auswählen](invited-people-only.png)
      ![Eine Untergruppe zur Abstimmung einladen](invite-voters-subgroup.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  29103b18580994a1:
    english: "## Engage people while a poll is running"
    translation: "## Personen während einer laufenden Abstimmung einbeziehen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1ce57a2542eebaab:
    english: At the bottom of the poll are several features to help you engage with people once the poll is running.
    translation: Am unteren Ende einer laufenden Abstimmung findest du mehrere Funktionen, mit denen du Personen einbeziehen kannst.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  45090f8260d19a47:
    english: "### Add voters to the poll"
    translation: "### Wähler*innen zur Abstimmung hinzufügen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3116212829910b50:
    english: You can add new people to the poll at any time, including before voting opens on a scheduled poll.
    translation: Du kannst jederzeit weitere Personen zur Abstimmung hinzufügen, auch bevor eine geplante Abstimmung beginnt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5e851e072e9dc1de:
    english: Select **Add voters**, then enter the names or email addresses of the people you want to add.
    translation: Wähle **Wähler hinzufügen** aus und gib dann die Namen oder E-Mail-Adressen der Personen ein, die du hinzufügen möchtest.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  be5aceb4caf93c11:
    english: If the poll has a scheduled opening time and voting has not yet opened, voters will not receive an immediate notification. Instead, they will be notified when voting opens.
    translation: Wenn für die Abstimmung ein Beginn festgelegt wurde und die Stimmabgabe noch nicht möglich ist, erhalten die Wähler*innen nicht sofort eine Benachrichtigung. Sie werden benachrichtigt, sobald die Stimmabgabe beginnt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b9a08269e3e252ce:
    english: "### Remove people from the poll"
    translation: "### Personen aus der Abstimmung entfernen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ce37b0af98854c79:
    english: Select **Add voters**, find the person's name, open the three-dot menu beside it, and select **Remove from proposal**.
    translation: Wähle **Wähler hinzufügen** aus, suche den Namen der Person, öffne das Drei-Punkte-Menü daneben und wähle **Aus dem Vorschlag entfernen** aus.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '08df94a4269ad100':
    english: People cannot be removed from an anonymous poll.
    translation: Aus einer anonymen Abstimmung können keine Personen entfernt werden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3d13453394c79f30:
    english: For example, an administrator who creates a poll on behalf of board members can remove themself if they are not authorised to vote.
    translation: Wenn beispielsweise ein Gruppenadministrator eine Abstimmung für Vorstandsmitglieder erstellt, kann er sich selbst entfernen, falls er nicht stimmberechtigt ist.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2a354792a1f1f517:
    english: "### Remind people to vote"
    translation: "### Personen an die Stimmabgabe erinnern"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  501e7846380326fd:
    english: Select **Remind** to send a notification to people who have not voted. **Everyone invited to vote** is selected by default. Select the chip to see or change the recipients.
    translation: Wähle **Erinnern** aus, um Personen zu benachrichtigen, die noch nicht abgestimmt haben. Standardmäßig ist **Alle zur Abstimmung Eingeladenen** ausgewählt. Wähle das Feld aus, um die Empfänger*innen anzusehen oder zu ändern.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  04e4537024da788c:
    english: "### View notification history"
    translation: "### Benachrichtigungsverlauf ansehen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  46145a9dd950c8eb:
    english: Open the three-dot menu (**⋯**) at the bottom of the poll and select **Notification history**.
    translation: Öffne das Drei-Punkte-Menü (**⋯**) am unteren Ende der Abstimmung und wähle **Benachrichtigungsverlauf** aus.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e74eafb1566d5dea:
    english: "![Notification history in a poll's actions menu](../../discussions/notifying_people/poll_notification_history.png)"
    translation: "![Benachrichtigungsverlauf im Aktionsmenü einer Abstimmung](../../discussions/notifying_people/poll_notification_history.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1a96cd0121fe58ec:
    english: The history shows who has been invited to vote, when each invitation was sent, and whether it has been read when that information is available.
    translation: Der Verlauf zeigt, wer zur Abstimmung eingeladen wurde, wann die jeweilige Einladung gesendet wurde und, sofern diese Information verfügbar ist, ob sie gelesen wurde.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3bd9a11263e1c8f4:
    english: "![Notification history for a poll](../../discussions/notifying_people/poll_notification_example.png)"
    translation: "![Benachrichtigungsverlauf einer Abstimmung](../../discussions/notifying_people/poll_notification_example.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f3bbc883f6429276:
    english: "### Close early"
    translation: "### Früh schließen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  af6a9acaafaaa96a:
    english: Select **Close early** to close a poll before its scheduled closing time.
    translation: Wähle **Früh schließen** aus, um eine Abstimmung vor dem geplanten Ende zu schließen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3cdbb11687fa03c0:
    english: You might do this when everyone has voted or the poll no longer needs to remain open.
    translation: Das kann sinnvoll sein, wenn alle abgestimmt haben oder die Abstimmung nicht länger offen bleiben muss.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  46f3a0ec8da6dba1:
    english: "### Reopen"
    translation: "### Erneut öffnen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '0821c04199937236':
    english: Select **Reopen** on a closed poll, then set a new closing date and time.
    translation: Wähle bei einer geschlossenen Abstimmung **Erneut öffnen** aus und lege dann ein neues Enddatum und eine neue Uhrzeit fest.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  53079cadd493f27c:
    english: Anonymous polls cannot be reopened.
    translation: Anonyme Abstimmungen können nicht erneut geöffnet werden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
