---
navigation_title: Користувацький API
blocks:
  0217b93dddc627ac:
    english: "# Loomio User API documentation"
    translation: "# Документація користувацького API Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bc6fcbf5f783fd29:
    english: "<!-- seo-description: Use the Loomio User API to create and manage discussions, comments, polls, threads, and group memberships from other software. -->"
    translation: "<!-- seo-description: Використовуйте користувацький API Loomio, щоб створювати обговорення, коментарі, опитування й теми та керувати ними й членством у групах з іншого програмного забезпечення. -->"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cc2da08540808ada:
    english: "`/api/b2` is the user-oriented API for integrations with Loomio. It uses the API key of a user account, and every action is performed as that user."
    translation: "`/api/b2` — користувацький API для інтеграцій із Loomio. Він використовує ключ API облікового запису користувача. Усі дії виконуються від імені цього користувача."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7036a6661aac00f2:
    english: Group operations use the memberships and group permissions of the API-key user. Instance-administrator status does not expand an API key's access to groups or content; use the Server API for instance-level administration.
    translation: Дії з групами залежать від членства та прав доступу користувача, якому належить ключ API. Статус адміністратора інстанції не розширює доступ ключа API до груп або їхнього вмісту. Для адміністрування інстанції використовуйте Server API.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c4436493b062b9f1:
    english: Use the API key from the Loomio user account that will perform the actions. A dedicated bot account is useful when an integration should not be invited to polls or receive notifications.
    translation: Використовуйте ключ API облікового запису Loomio, від імені якого виконуватимуться дії. Окремий обліковий запис бота стане в пригоді, якщо інтеграція не повинна отримувати запрошення до опитувань або сповіщення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ade21c593f08100c:
    english: Signed-in users can find their API key and group IDs on the [API access page](/profile/api_access).
    translation: Якщо ви ввійшли в систему, свій ключ API та ідентифікатори груп ви знайдете на [сторінці доступу до API](/profile/api_access).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  15160edafaf441c1:
    english: 'Send the API key in an `Authorization: Bearer` header. API keys in query strings are rejected because URLs can be recorded by proxies and access logs.'
    translation: 'Передавайте ключ API в заголовку `Authorization: Bearer`. Ключі API в параметрах запиту відхиляються, оскільки URL-адреси можуть зберігатися в журналах проксі-серверів і доступу.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2215e57186277325:
    english: "### Authentication change"
    translation: "### Зміна способу автентифікації"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ff5f4c1055e80fb6:
    english: 'The API key was previously accepted as an `api_key` URL parameter. Requests using `?api_key=YOUR_API_KEY` no longer work. Use the HTTP `Authorization` header instead:'
    translation: 'Раніше ключ API можна було передавати в параметрі URL `api_key`. Запити з `?api_key=YOUR_API_KEY` більше не працюють. Натомість використовуйте HTTP-заголовок `Authorization`:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  65574ba500243c80:
    english: The examples use `YOUR_API_KEY`, group ID `123`, and `https://www.loomio.com/`. Replace these with your API key, group ID, and Loomio installation URL.
    translation: У прикладах використано `YOUR_API_KEY`, ідентифікатор групи `123` та `https://www.loomio.com/`. Замініть їх на свій ключ API, ідентифікатор групи та URL-адресу свого сервера Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bec1e4f30aeef4ce:
    english: "## Response size and related records"
    translation: "## Розмір відповіді та пов’язані записи"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  da004eb4e005fae1:
    english: 'User API responses use a compound format: the primary records are accompanied by related records such as topics, groups, users, polls, and reactions. This lets a client populate a local record store from one request, but can include more data than a simple integration needs.'
    translation: 'Відповіді користувацького API мають складений формат: разом з основними записами надходять пов’язані записи, зокрема теми, групи, користувачі, опитування та реакції. Завдяки цьому клієнт може заповнити локальне сховище записів одним запитом. Відповідь може містити більше даних, ніж потрібно простій інтеграції.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  64d9a631b54cbaba:
    english: Pass `compact=1` to omit bulky related topics, groups, parent groups, memberships, reactions, tags, and translations. Primary records and the related records needed to interpret their content remain present.
    translation: Передайте `compact=1`, щоб виключити об’ємні пов’язані записи тем, груп, батьківських груп, членства, реакцій, тегів і перекладів. Основні записи та пов’язані записи, потрібні для розуміння їхнього вмісту, залишаться у відповіді.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e4e671db39dbe6f1:
    english: For direct control, pass `exclude_types` with space-separated singular record types. For example, `exclude_types=group reaction` omits related groups and reactions. Common values are `topic`, `group`, `parent`, `membership`, `reaction`, `tag`, `translation`, `user`, `discussion`, `poll`, `poll_option`, `stance`, `stance_choice`, `outcome`, and `topic_item`. Exclusions apply to related records, not the primary resource requested by the endpoint.
    translation: 'Для точнішого керування передайте `exclude_types` із типами записів в однині, розділеними пробілами. Наприклад, `exclude_types=group reaction` виключає пов’язані групи та реакції. Поширені значення: `topic`, `group`, `parent`, `membership`, `reaction`, `tag`, `translation`, `user`, `discussion`, `poll`, `poll_option`, `stance`, `stance_choice`, `outcome` і `topic_item`. Виключення стосуються пов’язаних записів, а не основного ресурсу, який запитує кінцева точка.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ded075da3c2aa815:
    english: Collection responses include `meta.total` when an exact collection size is defined. The total is calculated before `limit` and `offset` are applied. Endpoints such as search that intentionally return a bounded result set omit `meta.total` rather than returning `null`.
    translation: Відповіді з колекціями містять `meta.total`, якщо можна визначити точний розмір колекції. Загальну кількість обчислюють до застосування `limit` та `offset`. Кінцеві точки, як-от пошук, які навмисно повертають обмежений набір результатів, не включають `meta.total` замість повернення `null`.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  17cb8ef90a2acdb3:
    english: "## Endpoint summary"
    translation: "## Огляд кінцевих точок"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  608edb13080e57c2:
    english: |-
      | Method | Endpoint | Purpose |
      | --- | --- | --- |
      | `GET` | `/api/b2/groups` | List the API-key user's groups |
      | `GET` | `/api/b2/groups/:id_or_key_or_handle` | Get a visible group |
      | `GET` | `/api/b2/reports` | Generate a participation report |
      | `GET` | `/api/b2/search` | Search visible discussions, comments, polls, votes, and outcomes |
      | `POST` | `/api/b2/discussions` | Create a discussion |
      | `GET` | `/api/b2/discussions/:id` | Get a discussion |
      | `GET` | `/api/b2/discussions` | List discussions in a group |
      | `PATCH` | `/api/b2/discussions/:id` | Edit a discussion |
      | `DELETE` | `/api/b2/discussions/:id` | Soft-delete a discussion |
      | `GET` | `/api/b2/threads` | List visible discussion and standalone-poll threads |
      | `GET` | `/api/b2/threads/:topic_id` | Get a thread |
      | `GET` | `/api/b2/threads/:topic_id/items` | Get the ordered items in a thread |
      | `GET` | `/api/b2/threads/:topic_id/markdown` | Get a complete thread as Markdown |
      | `POST` | `/api/b2/comments` | Create a comment or reply |
      | `PATCH` | `/api/b2/comments/:id` | Edit a comment |
      | `DELETE` | `/api/b2/comments/:id` | Soft-delete a comment |
      | `POST` | `/api/b2/polls` | Create a poll |
      | `GET` | `/api/b2/polls/:id` | Get a poll |
      | `GET` | `/api/b2/polls` | List polls in a group |
      | `PATCH` | `/api/b2/polls/:id` | Edit a poll |
      | `DELETE` | `/api/b2/polls/:id` | Soft-delete a poll |
      | `GET` | `/api/b2/memberships` | List a group's memberships |
      | `POST` | `/api/b2/memberships` | Add members and optionally remove absent members |
      | `GET` | `/api/b2/chatbots` | List a group's chat integrations and webhooks |
      | `POST` | `/api/b2/chatbots` | Create a chat integration or webhook |
      | `PATCH` | `/api/b2/chatbots/:id` | Update a chat integration or webhook |
      | `DELETE` | `/api/b2/chatbots/:id` | Delete a chat integration or webhook |
      | `POST` | `/api/b2/chatbots/check` | Send a webhook connection test |
    translation: |-
      | Метод | Кінцева точка | Призначення |
      | --- | --- | --- |
      | `GET` | `/api/b2/groups` | Перелічити групи користувача, якому належить ключ API |
      | `GET` | `/api/b2/groups/:id_or_key_or_handle` | Отримати доступну групу |
      | `GET` | `/api/b2/reports` | Сформувати звіт про участь |
      | `GET` | `/api/b2/search` | Знайти доступні обговорення, коментарі, опитування, голоси та висновки |
      | `POST` | `/api/b2/discussions` | Створити обговорення |
      | `GET` | `/api/b2/discussions/:id` | Отримати обговорення |
      | `GET` | `/api/b2/discussions` | Перелічити обговорення в групі |
      | `PATCH` | `/api/b2/discussions/:id` | Редагувати обговорення |
      | `DELETE` | `/api/b2/discussions/:id` | М’яко видалити обговорення |
      | `GET` | `/api/b2/threads` | Перелічити доступні теми обговорень і окремих опитувань |
      | `GET` | `/api/b2/threads/:topic_id` | Отримати тему |
      | `GET` | `/api/b2/threads/:topic_id/items` | Отримати впорядковані елементи теми |
      | `GET` | `/api/b2/threads/:topic_id/markdown` | Отримати повну тему у форматі Markdown |
      | `POST` | `/api/b2/comments` | Створити коментар або відповідь |
      | `PATCH` | `/api/b2/comments/:id` | Редагувати коментар |
      | `DELETE` | `/api/b2/comments/:id` | М’яко видалити коментар |
      | `POST` | `/api/b2/polls` | Створити опитування |
      | `GET` | `/api/b2/polls/:id` | Отримати опитування |
      | `GET` | `/api/b2/polls` | Перелічити опитування в групі |
      | `PATCH` | `/api/b2/polls/:id` | Редагувати опитування |
      | `DELETE` | `/api/b2/polls/:id` | М’яко видалити опитування |
      | `GET` | `/api/b2/memberships` | Перелічити членства в групі |
      | `POST` | `/api/b2/memberships` | Додати учасників і, за потреби, вилучити тих, кого немає в списку |
      | `GET` | `/api/b2/chatbots` | Перелічити інтеграції чату та вебхуки групи |
      | `POST` | `/api/b2/chatbots` | Створити інтеграцію чату або вебхук |
      | `PATCH` | `/api/b2/chatbots/:id` | Оновити інтеграцію чату або вебхук |
      | `DELETE` | `/api/b2/chatbots/:id` | Видалити інтеграцію чату або вебхук |
      | `POST` | `/api/b2/chatbots/check` | Надіслати тестовий запит для перевірки з’єднання з вебхуком |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0473f1f7fb78f074:
    english: "## Groups"
    translation: "## Групи"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dc819221f371c435:
    english: "### List groups"
    translation: "### Перелічити групи"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  964f575e90aa9cde:
    english: Return the groups in which the API-key user has an active membership.
    translation: Повертає групи, у яких користувач, якому належить ключ API, має активне членство.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3835e6e77bc0ad10:
    english: "`GET /api/b2/groups`"
    translation: "`GET /api/b2/groups`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4f588e981afc3069:
    english: The response contains all matching records in a non-paginated `groups` array. It includes parent groups and subgroups, including groups whose subscription is not currently active. Check the `enabled` field when an integration should operate only on enabled groups.
    translation: Відповідь містить усі відповідні записи в масиві `groups` без поділу на сторінки. До нього входять батьківські групи й підгрупи, зокрема групи, підписка яких зараз неактивна. Якщо інтеграція має працювати лише з активними групами, перевіряйте поле `enabled`.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  213de8ce539a42c3:
    english: 'Important group fields include:'
    translation: 'Важливі поля групи:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d377f7c9b224a6d7:
    english: |-
      | Field | Description |
      | --- | --- |
      | `id` | Numeric group ID used by other User API endpoints |
      | `key` | Stable short key used in Loomio URLs |
      | `handle` | Human-readable group handle |
      | `name` | Group name |
      | `full_name` | Group name including its parent-group context |
      | `parent_id` | Numeric parent-group ID for a subgroup, otherwise `null` |
      | `enabled` | Whether the group and its subscription are active |
      | `memberships_count` | Number of active and pending memberships |
      | `accepted_memberships_count` | Number of accepted memberships |
      | `pending_memberships_count` | Number of pending invitations |
      | `admin_memberships_count` | Number of group administrators |
      | `delegates_count` | Number of delegates |
      | `discussions_count` | Number of discussions directly in the group |
      | `polls_count` | Number of polls directly in the group |
      | `subgroups_count` | Number of subgroups |
    translation: |-
      | Поле | Опис |
      | --- | --- |
      | `id` | Числовий ідентифікатор групи, який використовують інші кінцеві точки користувацького API |
      | `key` | Стабільний короткий ключ, який використовують в URL-адресах Loomio |
      | `handle` | Зрозумілий людині ідентифікатор групи |
      | `name` | Назва групи |
      | `full_name` | Назва групи з урахуванням батьківської групи |
      | `parent_id` | Числовий ідентифікатор батьківської групи для підгрупи, інакше `null` |
      | `enabled` | Чи активні група та її підписка |
      | `memberships_count` | Кількість активних членств і членств, що очікують підтвердження |
      | `accepted_memberships_count` | Кількість підтверджених членств |
      | `pending_memberships_count` | Кількість запрошень, що очікують відповіді |
      | `admin_memberships_count` | Кількість адміністраторів групи |
      | `delegates_count` | Кількість делегатів |
      | `discussions_count` | Кількість обговорень безпосередньо в групі |
      | `polls_count` | Кількість опитувань безпосередньо в групі |
      | `subgroups_count` | Кількість підгруп |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  34f1693ba28fcb80:
    english: The response may include additional group settings, related parent-group records and the API user's memberships. Clients should ignore fields they do not use.
    translation: Відповідь може містити додаткові налаштування групи, пов’язані записи батьківської групи та членства користувача API. Клієнти мають ігнорувати поля, які не використовують.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d7c327b8ed7f7bf2:
    english: "### Get a group"
    translation: "### Отримати групу"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  15ab63bc2d396657:
    english: Return one group visible to the API-key user.
    translation: Повертає одну групу, доступну користувачеві, якому належить ключ API.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8ba2cc9e3c67b1dd:
    english: "`GET /api/b2/groups/:id_or_key_or_handle`"
    translation: "`GET /api/b2/groups/:id_or_key_or_handle`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  71e5812ff9890c9b:
    english: The identifier can be the group's numeric ID, key or handle.
    translation: Ідентифікатором може бути числовий ID групи, її ключ або коротка назва.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8ba79a283b7b77d5:
    english: The response contains the group in the `groups` array and uses the same fields as the list endpoint. A request for a group the API-key user cannot access returns a permission error.
    translation: Відповідь містить групу в масиві `groups` із тими самими полями, що й кінцева точка для переліку груп. Запит групи, до якої користувач із ключем API не має доступу, повертає помилку доступу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  18d823df4d7f8fac:
    english: "## Webhooks"
    translation: "## Вебхуки"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f33d58fc1f2fd84c:
    english: 'The User API is request-based: an integration calls Loomio when it wants to read or change data. A group webhook provides the push direction. Loomio sends selected group events to your endpoint as they happen, so an integration does not need to poll the REST API for changes.'
    translation: 'Користувацький API працює через запити: інтеграція звертається до Loomio, коли їй потрібно прочитати або змінити дані. Вебхук групи дає змогу отримувати зміни від Loomio. Loomio надсилає вибрані події групи на вашу кінцеву точку, щойно вони відбуваються. Тому інтеграції не потрібно регулярно опитувати REST API.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3b5b4b0ac52b9010:
    english: 'Webhooks are configured per group and require group-administrator permission. They can be managed through the Loomio interface:'
    translation: 'Вебхуки налаштовують окремо для кожної групи. Для цього потрібні права адміністратора групи. Керувати ними можна через інтерфейс Loomio:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  318710be7b3aae7d:
    english: |-
      1. Open the group.
      2. Open the group menu and select **Chat integrations**.
      3. Add the integration matching the payload format your endpoint accepts. For a general-purpose endpoint, use the Mattermost/Markdown format.
      4. Enter a name and the destination URL.
      5. Select the events that Loomio should send automatically.
      6. Save the integration and use **Test connection** to send a test message.
    translation: |-
      1. Відкрийте групу.
      2. Відкрийте меню групи та виберіть **Інтеграції чату**.
      3. Додайте інтеграцію, формат даних якої підтримує ваша кінцева точка. Для кінцевої точки загального призначення використовуйте формат Mattermost/Markdown.
      4. Введіть назву та URL-адресу призначення.
      5. Виберіть події, які Loomio має надсилати автоматично.
      6. Збережіть інтеграцію та натисніть **Тестове підключення**, щоб надіслати тестове повідомлення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  43fb95cf304fced6:
    english: Use an HTTPS destination with an unguessable URL. Loomio requires the destination to resolve to a public address and blocks requests to local or private network addresses.
    translation: Використовуйте HTTPS-адресу призначення з URL-адресою, яку неможливо вгадати. Loomio вимагає, щоб адреса призначення вказувала на публічну IP-адресу, і блокує запити до локальних або приватних мережевих адрес.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d8d5abffe6425bea:
    english: Agents and other integrations can instead manage webhooks through the Bearer-authenticated chatbot endpoints described below. The resource is named `chatbots` for compatibility with Loomio's chat integrations, but it also represents general outgoing webhooks.
    translation: Агенти та інші інтеграції також можуть керувати веб-хуками через описані нижче кінцеві точки чат-ботів з автентифікацією Bearer. Ресурс має назву `chatbots` для сумісності з інтеграціями чату Loomio, але також охоплює звичайні вихідні веб-хуки.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  28fb6371af33b66f:
    english: "### List webhooks"
    translation: "### Перелічити вебхуки"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7187e5a26c3ec864:
    english: Return the chat integrations configured for a group. The API-key user must be an administrator of that group. The response includes destination URLs, so it must not be exposed to ordinary group members.
    translation: Повертає інтеграції чату, налаштовані для групи. Користувач, якому належить ключ API, має бути адміністратором цієї групи. Відповідь містить URL-адреси призначення, тому її не можна відкривати звичайним учасникам групи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  788d370538bdda46:
    english: "`GET /api/b2/chatbots?group_id=123`"
    translation: "`GET /api/b2/chatbots?group_id=123`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d676ca45c3e1074a:
    english: 'The response contains a `chatbots` array with these fields:'
    translation: 'Відповідь містить масив `chatbots` із такими полями:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ca00f7d0a52ce803:
    english: |-
      | Field | Description |
      | --- | --- |
      | `id` | Integration ID used for updates and deletion |
      | `group_id` | Group receiving the events |
      | `name` | Administrative name for the integration |
      | `kind` | `webhook` for an outgoing webhook or `matrix` for a Matrix integration |
      | `webhook_kind` | Payload format: `markdown`, `slack`, `discord`, `microsoft`, or `webex` |
      | `server` | Destination URL |
      | `event_kinds` | Events sent automatically |
      | `notification_only` | Whether messages contain only the notification headline |
    translation: |-
      | Поле | Опис |
      | --- | --- |
      | `id` | Ідентифікатор інтеграції для оновлення та видалення |
      | `group_id` | Група, події якої надсилаються |
      | `name` | Назва інтеграції для адміністраторів |
      | `kind` | `webhook` для вихідного вебхука або `matrix` для інтеграції з Matrix |
      | `webhook_kind` | Формат даних: `markdown`, `slack`, `discord`, `microsoft` або `webex` |
      | `server` | URL призначення |
      | `event_kinds` | Події, що надсилаються автоматично |
      | `notification_only` | Чи містять повідомлення лише заголовок сповіщення |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d72d8237eded6fdd:
    english: "### Create a webhook"
    translation: "### Створити вебхук"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e33c05cb2770fe21:
    english: "`POST /api/b2/chatbots`"
    translation: "`POST /api/b2/chatbots`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  acee55f2470a1eef:
    english: The API-key user must be an administrator of `group_id`. The destination is validated as a public URL before it is saved.
    translation: Користувач, якому належить ключ API, має бути адміністратором групи `group_id`. Перед збереженням перевіряється, чи URL призначення є загальнодоступним.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  05d9e1cdc6185f85:
    english: "### Update a webhook"
    translation: "### Оновити вебхук"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  eb7a96b45abe57c2:
    english: "`PATCH /api/b2/chatbots/:id`"
    translation: "`PATCH /api/b2/chatbots/:id`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2696d4fd91cd5f6f:
    english: Send any fields that should change. The webhook cannot be transferred to another group by changing `group_id`.
    translation: Надішліть поля, які потрібно змінити. Зміна `group_id` не дає змоги перенести вебхук до іншої групи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e56bb884ce5ef3c5:
    english: "### Test a webhook destination"
    translation: "### Перевірити адресу призначення вебхука"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  10c1e636b20121c2:
    english: Send a Markdown-compatible test message to a destination before or after saving its configuration.
    translation: Надішліть на адресу призначення тестове повідомлення, сумісне з Markdown, до або після збереження налаштувань.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cf0e0fae3c68178d:
    english: "`POST /api/b2/chatbots/check`"
    translation: "`POST /api/b2/chatbots/check`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fcb55f73325b9f2a:
    english: "### Delete a webhook"
    translation: "### Видалити вебхук"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f7e12256467f6c49:
    english: "`DELETE /api/b2/chatbots/:id`"
    translation: "`DELETE /api/b2/chatbots/:id`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f158f3939e36074c:
    english: Deleting the configuration stops future deliveries. It does not delete any Loomio group content.
    translation: Після видалення налаштувань нові події більше не надсилатимуться. Вміст групи Loomio не видаляється.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f0fe37689a7c3646:
    english: "### Event types"
    translation: "### Типи подій"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  066ca1423e999efa:
    english: 'A webhook can subscribe to these event types:'
    translation: 'Вебхук може отримувати події таких типів:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  82962625b0583140:
    english: |-
      | Event | When it is sent |
      | --- | --- |
      | `new_discussion` | A discussion is started |
      | `discussion_edited` | A discussion is edited |
      | `new_comment` | A comment is created |
      | `poll_created` | A poll is started |
      | `poll_edited` | A poll is edited |
      | `poll_closing_soon` | A poll is approaching its closing time |
      | `poll_expired` | A poll reaches its closing time |
      | `poll_closed_by_user` | A person closes a poll manually |
      | `poll_reopened` | A poll is reopened |
      | `outcome_created` | An outcome is published |
      | `outcome_updated` | An outcome is updated |
      | `outcome_review_due` | An outcome review becomes due |
      | `stance_created` | A vote is cast |
      | `stance_updated` | A vote is changed |
    translation: |-
      | Подія | Коли надсилається |
      | --- | --- |
      | `new_discussion` | Розпочато обговорення |
      | `discussion_edited` | Обговорення змінено |
      | `new_comment` | Створено коментар |
      | `poll_created` | Розпочато опитування |
      | `poll_edited` | Опитування змінено |
      | `poll_closing_soon` | Наближається час закриття опитування |
      | `poll_expired` | Настав час закриття опитування |
      | `poll_closed_by_user` | Людина закрила опитування вручну |
      | `poll_reopened` | Опитування відкрито повторно |
      | `outcome_created` | Опубліковано висновок |
      | `outcome_updated` | Висновок оновлено |
      | `outcome_review_due` | Настав час переглянути висновок |
      | `stance_created` | Подано голос |
      | `stance_updated` | Голос змінено |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ed1d3fc4a6fb67b9:
    english: The webhook belongs to one group and receives subscribed events from that group. People can also explicitly select the integration when sharing or sending some notifications, even when the corresponding automatic event is not selected.
    translation: Вебхук належить одній групі й отримує події цієї групи, на які його підписано. Люди також можуть явно вибрати інтеграцію під час поширення вмісту або надсилання деяких сповіщень, навіть якщо відповідну автоматичну подію не вибрано.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  512f0701765b66ec:
    english: "### HTTP delivery"
    translation: "### Доставка через HTTP"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dca082a687dc5505:
    english: 'Loomio sends an asynchronous HTTP `POST` to the configured URL with this header:'
    translation: 'Loomio асинхронно надсилає HTTP-запит `POST` на налаштований URL із таким заголовком:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a4f66c4c94afa135:
    english: The request timeout is five seconds. A `2xx` response, including `204 No Content`, is treated as successful. Webhook consumers should respond promptly, process longer work asynchronously, and tolerate duplicate or out-of-order deliveries.
    translation: Час очікування відповіді — п’ять секунд. Відповідь `2xx`, зокрема `204 No Content`, вважається успішною. Сервіс, що приймає вебхук, має швидко відповідати, виконувати тривалі завдання асинхронно та обробляти повторні події або події, отримані не за порядком.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  84faa7dad6f34739:
    english: Loomio does not currently add a webhook signature, shared-secret header, event ID, or delivery ID. Treat the full destination URL as a credential, do not expose it publicly, and include an unguessable token in the URL when the receiving service supports one. If a stable machine-readable event schema or signed delivery is required, use the webhook as a change notification and retrieve the current records through the authenticated User API.
    translation: Наразі Loomio не додає підпис вебхука, заголовок зі спільним секретом, ідентифікатор події або ідентифікатор доставки. Вважайте повний URL призначення секретом і не публікуйте його. Якщо сервіс-одержувач підтримує це, додайте до URL токен, який неможливо вгадати. Якщо потрібна стабільна машиночитна схема подій або підписана доставка, використовуйте вебхук як сповіщення про зміну, а поточні записи отримуйте через API користувача з автентифікацією.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f3d956b4694f793c:
    english: "### Payload formats"
    translation: "### Формати даних"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  deed1ccba8a70ac2:
    english: Webhook payloads are presentation-oriented messages intended for chat services. They are not complete serialized Loomio records. Links in the message identify the affected Loomio content; an integration can follow up through the User API when it needs structured current state.
    translation: Вебхуки передають повідомлення для відображення в чат-сервісах. Вони не містять повних серіалізованих записів Loomio. Посилання в повідомленні вказують на відповідний вміст Loomio. Якщо інтеграції потрібні структуровані актуальні дані, вона може отримати їх через API користувача.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c2e9782a81b59ab2:
    english: |-
      | Integration format | Principal JSON fields |
      | --- | --- |
      | Mattermost/Markdown | `text`, `icon_url`, `username` |
      | Slack | `text` |
      | Discord | `content`, limited to approximately 1,900 characters |
      | Microsoft Teams | `@type`, `@context`, `themeColor`, `text`, `sections` |
      | Webex | `markdown` |
    translation: |-
      | Формат інтеграції | Основні поля JSON |
      | --- | --- |
      | Mattermost/Markdown | `text`, `icon_url`, `username` |
      | Slack | `text` |
      | Discord | `content`, не більше приблизно 1 900 символів |
      | Microsoft Teams | `@type`, `@context`, `themeColor`, `text`, `sections` |
      | Webex | `markdown` |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  132dd698f11d1d08:
    english: 'For example, the general Markdown format sends a body shaped like:'
    translation: 'Наприклад, загальний формат Markdown надсилає дані такого вигляду:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d224ca01f360918e:
    english: The exact message text depends on the event, group locale, notification-only setting, and Loomio version. Consumers should rely on the selected format's documented top-level fields rather than parsing sentence wording.
    translation: Точний текст повідомлення залежить від події, мови групи, налаштування надсилання лише сповіщень і версії Loomio. Сервісам-одержувачам слід використовувати задокументовані поля верхнього рівня вибраного формату, а не розбирати текст речень.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  62c53ea4911e0c79:
    english: "## Search"
    translation: "## Пошук"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f7346561ccdfcfce:
    english: Search discussions, comments, polls, votes, and outcomes visible to the API-key user. Results include public content even when the user is not a member of its group; private content remains subject to normal topic visibility.
    translation: Шукайте обговорення, коментарі, опитування, голоси та висновки, доступні користувачу, якому належить ключ API. Результати містять загальнодоступний вміст, навіть якщо користувач не є учасником відповідної групи. Доступ до приватного вмісту визначається звичайними правилами видимості тем.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e9101cf4a72bde36:
    english: "`GET /api/b2/search`"
    translation: "`GET /api/b2/search`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9bc24da4bd85dac2:
    english: "### Params"
    translation: "### Параметри"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ac9bc86d81bfd39f:
    english: |-
      | Name | Description |
      | --- | --- |
      | `query` | Search text. Exact and fuzzy matches are supported |
      | `group_id` | Restrict results to one visible group |
      | `org_id` | Restrict results to a visible parent group and its visible subgroups. Use `0` for direct discussions |
      | `type` | Restrict results to one type: `Discussion`, `Comment`, `Poll`, `Stance`, or `Outcome` |
      | `types` | Comma-separated list of result types |
      | `tag` | Restrict results to topics with this tag |
      | `author_id` | Restrict results to content by one author. Without `query`, returns that author's recent visible activity |
      | `order` | Set to `authored_at_desc` to order matching content by authoring time |
    translation: |-
      | Назва | Опис |
      | --- | --- |
      | `query` | Текст пошуку. Підтримуються точні та приблизні збіги |
      | `group_id` | Обмежити результати однією доступною групою |
      | `org_id` | Обмежити результати доступною батьківською групою та її доступними підгрупами. Для прямих обговорень використовуйте `0` |
      | `type` | Обмежити результати одним типом: `Discussion`, `Comment`, `Poll`, `Stance` або `Outcome` |
      | `types` | Список типів результатів, розділених комами |
      | `tag` | Обмежити результати темами із цією міткою |
      | `author_id` | Обмежити результати вмістом одного автора. Без `query` повертає нещодавню видиму активність цього автора |
      | `order` | Установіть `authored_at_desc`, щоб упорядкувати знайдений вміст за часом створення |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  00e046b622446633:
    english: The response contains a `search_results` array. Each result identifies the matched record and its visible context with fields including `searchable_type`, `searchable_id`, `highlight`, `group_id`, `group_name`, `discussion_key`, `poll_key`, `author_id`, `author_name`, `authored_at`, and `tags`. Fields that do not apply to a result are `null`.
    translation: Відповідь містить масив `search_results`. Кожен результат указує на знайдений запис і його видимий контекст. Поля включають `searchable_type`, `searchable_id`, `highlight`, `group_id`, `group_name`, `discussion_key`, `poll_key`, `author_id`, `author_name`, `authored_at` і `tags`. Поля, які не стосуються результату, мають значення `null`.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f90d2c11582b8bfa:
    english: "## Participation report"
    translation: "## Звіт про участь"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0fbe24cde7a5e1aa:
    english: Return the same aggregated participation data used by Loomio's Participation report.
    translation: Повертає ті самі зведені дані про участь, які використовуються у звіті Loomio про участь.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0f176aa4823b4ece:
    english: "`GET /api/b2/reports`"
    translation: "`GET /api/b2/reports`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fc4488304bf3735e:
    english: |-
      | Name | Description |
      | --- | --- |
      | `section` | Report section: `base`, `users`, or `countries`. Use `users` for per-person activity |
      | `group_scope` | `custom` or `my`. The legacy `all` value is treated as `my` because User API keys never receive instance-wide access |
      | `group_ids` | Comma-separated group IDs when `group_scope=custom`. IDs outside the API user's memberships are ignored |
      | `start_month` | First month to include in `YYYY-MM` format; defaults to 12 months ago |
      | `end_month` | Last month to include in `YYYY-MM` format; defaults to the current month |
      | `interval` | Interval for the `base` section: `day`, `week`, `month`, or `year` |
      | `member_type` | Set to `delegate` with `section=users` to return only current delegates |
    translation: |-
      | Назва | Опис |
      | --- | --- |
      | `section` | Розділ звіту: `base`, `users` або `countries`. Використовуйте `users` для даних про активність окремих людей |
      | `group_scope` | `custom` або `my`. Застаріле значення `all` обробляється як `my`, оскільки ключі API користувача не надають доступу до всього екземпляра |
      | `group_ids` | Ідентифікатори груп, розділені комами, коли задано `group_scope=custom`. Ідентифікатори груп, учасником яких не є користувач API, ігноруються |
      | `start_month` | Перший місяць звіту у форматі `YYYY-MM`; за замовчуванням — 12 місяців тому |
      | `end_month` | Останній місяць звіту у форматі `YYYY-MM`; за замовчуванням — поточний місяць |
      | `interval` | Інтервал для розділу `base`: `day`, `week`, `month` або `year` |
      | `member_type` | Установіть `delegate` разом із `section=users`, щоб отримати дані лише про чинних делегатів |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '09b3d2247802eae7':
    english: A person is a delegate when they have an active delegate membership in any selected group. Their counts are aggregated across all selected groups. Delegate rows are returned even when every activity count is zero. Counts cover threads, comments, polls, votes, outcomes, and reactions; they are not voting participation rates. User rows also include identified ballots issued, cast, and missed. Anonymous polls are excluded from all per-person voting counts. `all_votes_cast` is true only when at least one ballot was issued and every issued ballot was cast.
    translation: 'Людина є делегатом, якщо має чинне членство з роллю делегата в будь-якій із вибраних груп. Показники підсумовуються за всіма вибраними групами. Рядки делегатів повертаються, навіть якщо всі показники активності дорівнюють нулю. Показники охоплюють теми, коментарі, опитування, голоси, висновки та реакції; вони не є часткою участі в голосуванні. Рядки користувачів також містять кількість іменних бюлетенів: виданих, поданих і пропущених. Анонімні опитування не враховуються в жодному персональному показнику голосування. `all_votes_cast` має значення true, лише якщо було видано принаймні один бюлетень і всі видані бюлетені подано.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
