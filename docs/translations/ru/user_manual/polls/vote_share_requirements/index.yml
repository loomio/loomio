---
navigation_title: Требования к доле голосов
blocks:
  54368e42ed93ae0c:
    english: "# Vote share requirements"
    translation: "# Требования к доле голосов"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2051086558658db2:
    english: Set a vote share requirement on an option when a proposal must receive a particular percentage of support, or remain below a particular percentage of opposition, to pass.
    translation: Установите требование к доле голосов для варианта, если для принятия предложения ему нужна определённая доля поддержки или доля голосов против не должна превышать заданный предел.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f00d3806d6b890ae:
    english: Vote share requirements can be combined with a [quorum](/en/user_manual/polls/quorum/) to require both sufficient participation and a particular distribution of votes.
    translation: Требование к доле голосов можно сочетать с [кворумом](/en/user_manual/polls/quorum/), чтобы задать и минимальное участие, и необходимое распределение голосов.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0fc0acd12134f67e:
    english: When creating a proposal, select the edit icon beside an option.
    translation: При создании предложения выберите значок редактирования рядом с вариантом.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  27979c31066e397f:
    english: "![The edit icon beside the Consent option](edit-highlight-on-option.png)"
    translation: "![Значок редактирования рядом с вариантом «Согласие»](edit-highlight-on-option.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b3a4dee73762bea4:
    english: "## Eligible voters and votes cast"
    translation: "## Имеющие право голоса и поданные голоса"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1d04d75fa16a2a18:
    english: The percentage can be based on either **Votes cast** or **Eligible voters**.
    translation: Процент можно рассчитывать по **Поданным голосам** или по числу **Имеющих право голоса избирателей**.
    status: needs_review
    note: use the interface label "**Имеющие право голоса избиратели**" for "**Eligible voters**"
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  590e1a316f9ad174:
    english: "![Choosing whether a vote share requirement uses votes cast or eligible voters](./eligible-vs-cast.png)"
    translation: "![Выбор основы для расчёта доли голосов: поданные голоса или имеющие право голоса избиратели](./eligible-vs-cast.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d4c72d50982e071d:
    english: "**Eligible voters** means everyone who is able to vote in the proposal. **Votes cast** means only the votes that have been submitted."
    translation: "**Имеющие право голоса избиратели** — все, кто может голосовать по предложению. **Поданные голоса** — только голоса, которые уже отправлены."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  24945a1a4f0d08e3:
    english: A requirement of 75 percent agreement from eligible voters can pass only when at least 75 percent of all eligible voters vote for that option.
    translation: Если требуется поддержка 75% имеющих право голоса избирателей, вариант пройдёт только тогда, когда за него проголосуют не менее 75% всех, кто имеет право голоса.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  14e4ff7cd000c7af:
    english: A requirement of 60 percent agreement from votes cast can pass when 60 percent of submitted votes support the option, regardless of overall turnout. Add a quorum when your process also requires a minimum level of participation.
    translation: Если требуется поддержка 60% от поданных голосов, варианту достаточно получить 60% отправленных голосов независимо от общей явки. Добавьте кворум, если ваш процесс также требует минимального участия.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a8f235434b40ecd9:
    english: "## Different vote share requirements"
    translation: "## Разные требования к доле голосов"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6682c9656815bdbc:
    english: 'A proposal can have requirements on more than one option. For example:'
    translation: 'В предложении можно задать требования для нескольких вариантов. Например:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dac1980305bef52d:
    english: |-
      - Agreement must be at least 75 percent of eligible voters
      - Abstention must be no more than 30 percent of votes cast
      - Block must be no more than 0 percent of votes cast
    translation: |-
      - «Согласен» — не менее 75% имеющих право голоса избирателей
      - «Воздержался» — не более 30% поданных голосов
      - «Блокирую» — не более 0% поданных голосов
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  11325e607f603eb7:
    english: You can also add requirements to a [poll template](/en/user_manual/polls/poll_templates/) so that new proposals created from the template use them by default.
    translation: Требования можно также добавить в [шаблон голосования](/en/user_manual/polls/poll_templates/). Тогда они будут применяться по умолчанию к новым предложениям, созданным по этому шаблону.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d6bffbdadc45e7f5:
    english: "## Detailed example"
    translation: "## Подробный пример"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4318dab03fe217ad:
    english: Oatmilk Cooperative is deciding whether to approve the budget for its six-week returnable bottle trial. Five people are eligible to vote.
    translation: Кооператив Oatmilk решает, утвердить ли бюджет шестинедельного испытания возвратных бутылок. Право голоса есть у пяти человек.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8f5779f2f1bb9ec3:
    english: Jamie uses the **Consent** proposal template, edits the Consent option, and enables its vote share requirement.
    translation: Джейми выбирает шаблон предложения **Согласие**, редактирует вариант «Согласие» и включает для него требование к доле голосов.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  842038ffbd273e57:
    english: The cooperative's process requires at least 75 percent of eligible voters to support the proposal. Jamie sets the requirement to **At least 75% of Eligible voters**.
    translation: По правилам кооператива предложение должны поддержать не менее 75% имеющих право голоса избирателей. Джейми устанавливает требование **Не менее 75% Имеющих право голоса избирателей**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5b852b2e7a9b3034:
    english: "![The Consent option requiring at least 75 percent of eligible voters](./consent-vote-option.png)"
    translation: "![Для варианта «Согласие» требуется поддержка не менее 75% имеющих право голоса избирателей](./consent-vote-option.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8a42a135c0c11c98:
    english: Jamie also sets a 60 percent quorum. Jamie and Samira vote in agreement. All submitted votes support the proposal, but they represent only 40 percent of eligible voters, so neither requirement has been reached.
    translation: Джейми также устанавливает кворум 60%. Джейми и Самира голосуют за. Все поданные голоса поддерживают предложение, но их подали лишь 40% имеющих право голоса избирателей. Поэтому ни одно из требований пока не выполнено.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2284440b974635e3:
    english: "![Two of five people have voted in agreement and neither requirement is reached](./first-vote-breakdown.png)"
    translation: "![Двое из пяти человек проголосовали за, но ни одно требование не выполнено](./first-vote-breakdown.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2cb3890f4ef20320:
    english: Alex and Morgan then agree, while Taylor disagrees. All five people have voted, reaching the quorum, and four of five eligible voters agree. The 80 percent agreement exceeds the 75 percent vote share requirement, so both requirements show green check marks.
    translation: Затем Алекс и Морган голосуют за, а Тейлор — против. Проголосовали все пять человек, поэтому кворум достигнут. Предложение поддержали четверо из пяти имеющих право голоса избирателей. Доля поддержки составляет 80% и превышает требуемые 75%, поэтому рядом с обоими требованиями появляются зелёные галочки.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6b09cbe2063c0a6a:
    english: "![All five people have voted and both requirements are reached](./final-vote-breakdown.png)"
    translation: "![Все пять человек проголосовали, и оба требования выполнены](./final-vote-breakdown.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
