---
navigation_title: תת־קבוצות
blocks:
  782c5b3df26b17ae:
    english: "# Subgroups"
    translation: "# תת־קבוצות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0025fb895cd6cae8:
    english: Subgroups help you organize your communications and members so that the right people are engaged in their work together.
    translation: תת־קבוצות עוזרות לארגן את התקשורת ואת החברים, כך שהאנשים המתאימים יוכלו לעבוד יחד.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cc3abd19bc310546:
    english: |-
      For example, an organization may have the following subgroups:
      - governance board
      - working team or a project working group
      - a topic (such as 'strategy' or 'learning')
    translation: |-
      לדוגמה, בארגון עשויות להיות תת־הקבוצות הבאות:
      - ועד מנהל
      - צוות עבודה או קבוצת עבודה של פרויקט
      - נושא, כגון 'אסטרטגיה' או 'למידה'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eab908c78ccd923d:
    english: Subgroups work just like groups do, but are located within your "parent" group. Most of the features and settings available are the same as in the parent group. This also means that someone can be a member of your subgroup, such as your board, but not of your parent group.
    translation: תת־קבוצות פועלות כמו קבוצות, אך נמצאות בתוך קבוצת האם. רוב התכונות וההגדרות שלהן זהות לאלו של קבוצת האם. אפשר להיות חברים בתת־קבוצה, למשל בוועד המנהל, בלי להיות חברים בקבוצת האם.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  aaa62c1b02d15779:
    english: "## Add a subgroup"
    translation: "## הוספת תת־קבוצה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8ed2fcd2a209a53d:
    english: |-
      >[!Note]
      >The ability to add new subgroups is part of the group's [permission settings](/en/user_manual/groups/settings/permissions). By default, only admins can start new subgroups.
    translation: |-
      >[!Note]
      >האפשרות להוסיף תת־קבוצות נקבעת ב[הגדרות ההרשאות](/en/user_manual/groups/settings/permissions) של הקבוצה. כברירת מחדל, רק מנהלי קבוצה יכולים לפתוח תת־קבוצות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  483b820f123b5ae0:
    english: 'To add a subgroup, visit your main group page, then click **New Subgroup** from the sidebar.  '
    translation: כדי להוסיף תת־קבוצה, יש לפתוח את דף הקבוצה הראשית וללחוץ על **תת קבוצה חדשה** בסרגל הצד.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  abceea91b4638844:
    english: "![New subgroup button in the Oatmilk Cooperative sidebar](subgroups-sidebar.png)"
    translation: "![כפתור תת קבוצה חדשה בסרגל הצד של קואופרטיב Oatmilk](subgroups-sidebar.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b8e3d3477eb6765d:
    english: Click the **New subgroup** button, give it a name and select the privacy setting, then click **Start subgroup**.
    translation: יש ללחוץ על **תת קבוצה חדשה**, לתת לתת־הקבוצה שם ולבחור הגדרת פרטיות. לאחר מכן יש ללחוץ על **פתח תת קבוצה**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1d49b46575af3f21:
    english: "![New subgroup form for the Packaging Working Group](subgroups_new.png)"
    translation: "![טופס תת־קבוצה חדשה עבור קבוצת העבודה לאריזה](subgroups_new.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  348e88e5c0ca37d0:
    english: When you are ready, [invite people](/en/user_manual/groups/inviting_people/) to the subgroup.
    translation: כשהכול מוכן, ניתן [להזמין אנשים](/en/user_manual/groups/inviting_people/) לתת־הקבוצה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4ac901bff75cf342:
    english: You can edit the subgroups [group settings](/en/user_manual/groups/settings/) by clicking the cog icon on the subgroup page.
    translation: כדי לערוך את [הגדרות הקבוצה](/en/user_manual/groups/settings/) של תת־הקבוצה, יש ללחוץ על סמל גלגל השיניים בדף שלה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  926676e3163dbc8e:
    english: "![Edit group settings action on the Packaging Working Group](subgroups_edit_group_settings.png)"
    translation: "![הפעולה לעריכת הגדרות הקבוצה של קבוצת העבודה לאריזה](subgroups_edit_group_settings.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  737225cc4bebe7e8:
    english: "## Subgroup settings"
    translation: "## הגדרות תת־קבוצה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c93e5ec8b6f3ceb7:
    english: "### Privacy"
    translation: "### פרטיות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  92a47fe13740347a:
    english: The privacy settings for subgroups are similar to the parent group.
    translation: הגדרות הפרטיות של תת־קבוצות דומות לאלו של קבוצת האם.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cee5963ea2acac16:
    english: "**Secret** subgroups are not visible to people not invited to the subgroup."
    translation: תת־קבוצות **סודי** אינן גלויות למי שלא הוזמנו אליהן.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c8fb4caaa5a2cb9:
    english: "**Closed** subgroups are listed in the Subgroups tab of the parent group and user's sidebar menu. Members of the parent group can request to join the subgroup. Membership is approved by a subgroup admin."
    translation: תת־קבוצות **סגור** מופיעות בלשונית תת־קבוצות של קבוצת האם ובתפריט סרגל הצד של המשתמשים. חברי קבוצת האם יכולים לבקש להצטרף לתת־קבוצה. מנהל תת־הקבוצה מאשר את ההצטרפות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b35b1b3450b2d1e1:
    english: Closed subgroups have an additional setting that allow members of its parent group to see private threads.
    translation: לתת־קבוצות סגורות יש הגדרה נוספת שמאפשרת לחברי קבוצת האם לראות שיחות פרטיות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  933fe2f0cbdec143:
    english: "[Read about group privacy here](/en/user_manual/groups/settings/privacy)."
    translation: "[מידע נוסף על פרטיות קבוצות](/en/user_manual/groups/settings/privacy)."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d16c8b1258b67c9e:
    english: "### Permissions"
    translation: "### הרשאות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eb5de97caadd5166:
    english: Subgroups operate independently of the main group. For example, if the subgroup privacy setting is set to **Secret**, then only invited members can find this subgroup, see who is in it, and see threads.
    translation: תת־קבוצות פועלות באופן עצמאי מהקבוצה הראשית. לדוגמה, אם הגדרת הפרטיות של תת־קבוצה היא **סודי**, רק חברים שהוזמנו יכולים למצוא אותה, לראות מי חבר בה ולראות את השיחות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e7897aa59ffe96a1:
    english: "**Closed** subgroups have an additional setting that allow members of its parent group to see private threads, enabling the subgroup to be transparent to members of the parent group."
    translation: לתת־קבוצות **סגור** יש הגדרה נוספת שמאפשרת לחברי קבוצת האם לראות שיחות פרטיות. כך חברי קבוצת האם יכולים לראות את פעילות תת־הקבוצה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8dd3770fefa7d7e6:
    english: "![Setting that lets parent group members see private subgroup threads](subgroups_private_threads_settings.png)"
    translation: "![הגדרה שמאפשרת לחברי קבוצת האם לראות שיחות פרטיות בתת־קבוצה](subgroups_private_threads_settings.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c78effb175b8924b:
    english: "## Find subgroups"
    translation: "## מציאת תת־קבוצות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5692ebbfe3fe83e9:
    english: Open the sidebar menu, and click your group name to see it's subgroups.
    translation: יש לפתוח את תפריט סרגל הצד וללחוץ על שם הקבוצה כדי לראות את תת־הקבוצות שלה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0abefe88cc8bea7f:
    english: "![Oatmilk Cooperative subgroups listed in the sidebar](subgroups_find_subgroups.png)"
    translation: "![תת־הקבוצות של קואופרטיב Oatmilk בסרגל הצד](subgroups_find_subgroups.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8988135e14e40636:
    english: "## Invite to a subgroup"
    translation: "## הזמנה לתת־קבוצה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  217a985e9afb5421:
    english: Invite people to a subgroup as you invite them into a group. If they already belong to a parent group or another subgroup in the same organization that you also belong to, you can type their name or select that group as an audience. Select the audience chip to expand it into individual people, then remove anyone you do not want to invite.
    translation: ניתן להזמין אנשים לתת־קבוצה באותו אופן שבו מזמינים אותם לקבוצה. אם הם כבר חברים בקבוצת האם או בתת־קבוצה אחרת באותו ארגון שגם אתם חברים בה, ניתן להקליד את שמם או לבחור בקבוצה הזו כקהל היעד. יש לבחור בתגית קהל היעד כדי להציג את האנשים בנפרד, ואז להסיר את מי שאין רצון להזמין.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2d4a28c2306fc3c6:
    english: "### Simultaneously invite people to subgroups and parent group"
    translation: "### הזמנה לקבוצת האם ולתת־קבוצות בו־זמנית"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cf301ba403b3a28e:
    english: If you use the **Invite people** button from your parent group's **Members** tab, you can invite people to multiple subgroups at the same time by ticking the boxes of those you would like them to join immediately.
    translation: באמצעות הכפתור **הזמינו אנשים** בלשונית **חברים** של קבוצת האם, ניתן להזמין אנשים לכמה תת־קבוצות בו־זמנית. לשם כך יש לסמן את התיבות של תת־הקבוצות שאליהן רוצים שיצטרפו מיד.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  28a271be7caa0590:
    english: "![Selecting the parent group and subgroup in the invitation form](group_invite_email_subgroups.png)"
    translation: "![בחירת קבוצת האם ותת־קבוצה בטופס ההזמנה](group_invite_email_subgroups.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5323cb0e01e3e171:
    english: "## Administer a subgroup"
    translation: "## ניהול תת־קבוצה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e7c6ae867d7d3813:
    english: Subgroups can have their own admins, and admins of a subgroup may not be the same as the admins of the parent group.
    translation: לתת־קבוצות יכולים להיות מנהלים משלהן, שאינם בהכרח המנהלים של קבוצת האם.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  937ae9d3e8948a26:
    english: However an admin of the 'parent' group can make themselves admin of any subgroup.  This helps administrators of the parent group to administer subgroups as necessary.
    translation: עם זאת, מנהלי קבוצת האם יכולים למנות את עצמם למנהלים של כל תת־קבוצה. כך הם יכולים לנהל תת־קבוצות לפי הצורך.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  282547a6c728d20c:
    english: Go to the Subgroup tab, find the subgroup and click **Join group**.
    translation: יש לעבור ללשונית תת־קבוצות, למצוא את תת־הקבוצה וללחוץ על **הצטרפו לקבוצה**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  64102057b4f533dd:
    english: "![Join group button on a closed subgroup](member_join_subgroup.png)"
    translation: "![כפתור הצטרפו לקבוצה בתת־קבוצה סגורה](member_join_subgroup.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0f91a4020a9484ef:
    english: Now a member of the subgroup, an admin of the parent group can make themselves an admin of the subgroup.
    translation: לאחר ההצטרפות לתת־הקבוצה, מנהלי קבוצת האם יכולים למנות את עצמם למנהלים גם בה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b10fec2c4c3ebb6c:
    english: "![Make admin action for a parent group admin](member_make_admin.png)"
    translation: "![הפעולה למינוי מנהל קבוצת האם למנהל תת־הקבוצה](member_make_admin.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dcb00619954e30a2:
    english: "## Delete a subgroup"
    translation: "## מחיקת תת־קבוצה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  92e05281b2891dd5:
    english: Admins can delete a subgroup in the same way you delete a group. When deleting a subgroup, be careful to not delete the 'parent' group.
    translation: מנהלי קבוצה יכולים למחוק תת־קבוצה באותו אופן שבו מוחקים קבוצה. בעת מחיקת תת־קבוצה, יש לוודא שלא מוחקים את קבוצת האם.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a29b8361fb910cde:
    english: Learn [how to delete groups](/en/user_manual/groups/deleting_your_group/).
    translation: למידע נוסף, ראו [כיצד למחוק קבוצות](/en/user_manual/groups/deleting_your_group/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
