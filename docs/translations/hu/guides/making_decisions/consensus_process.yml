    translation: Vivien Érzékellenőrzés típusú javaslatot indít, hogy felmérje az arculati koncepció fő elemeiről alkotott véleményeket és a lehetséges egyetértést. Ez jelzi a résztvevőknek, hogy javaslat készül, és részvételre ösztönzi őket. Segít felszínre hozni az aggályokat.
    status: machine
