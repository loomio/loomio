      | `group_ids` | Comma-separated group IDs when `group_scope=custom`. IDs outside the API user's memberships are ignored |
      | `start_month` | First month to include in `YYYY-MM` format; defaults to 12 months ago |
      | `end_month` | Last month to include in `YYYY-MM` format; defaults to the current month |
      | `interval` | Interval for the `base` section: `day`, `week`, `month`, or `year` |
      | `member_type` | Set to `delegate` with `section=users` to return only current delegates |
    translation: |-
      | Name | Beschreibung |
      | --- | --- |
      | `section` | Berichtsabschnitt: `base`, `users` oder `countries`. Verwende `users` für die Aktivität einzelner Personen |
      | `group_scope` | `custom` oder `my`. Der bisherige Wert `all` wird wie `my` behandelt, da Schlüssel der Benutzer-API keinen instanzweiten Zugriff gewähren |
      | `group_ids` | Durch Kommas getrennte Gruppen-IDs bei `group_scope=custom`. IDs von Gruppen, in denen der API-Benutzer kein Mitglied ist, werden ignoriert |
      | `start_month` | Erster berücksichtigter Monat im Format `YYYY-MM`; standardmäßig vor 12 Monaten |
      | `end_month` | Letzter berücksichtigter Monat im Format `YYYY-MM`; standardmäßig der aktuelle Monat |
      | `interval` | Intervall für den Abschnitt `base`: `day`, `week`, `month` oder `year` |
      | `member_type` | Mit `section=users` auf `delegate` setzen, um nur aktuelle Delegierte zurückzugeben |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '09b3d2247802eae7':
    english: A person is a delegate when they have an active delegate membership in any selected group. Their counts are aggregated across all selected groups. Delegate rows are returned even when every activity count is zero. Counts cover threads, comments, polls, votes, outcomes, and reactions; they are not voting participation rates. User rows also include identified ballots issued, cast, and missed. Anonymous polls are excluded from all per-person voting counts. `all_votes_cast` is true only when at least one ballot was issued and every issued ballot was cast.
    translation: Eine Person gilt als delegiert, wenn sie in mindestens einer ausgewählten Gruppe eine aktive Mitgliedschaft als Delegierte hat. Ihre Zahlen werden über alle ausgewählten Gruppen zusammengefasst. Zeilen für Delegierte werden auch dann zurückgegeben, wenn alle Aktivitätszahlen null sind. Die Zahlen umfassen Threads, Kommentare, Abstimmungen, Stimmen, Fazits und Reaktionen. Sie sind keine Quoten für die Teilnahme an Abstimmungen. Benutzerzeilen enthalten außerdem die Zahlen der für identifizierte Personen ausgegebenen, abgegebenen und nicht abgegebenen Stimmzettel. Anonyme Abstimmungen sind von allen personenbezogenen Stimmzahlen ausgenommen. `all_votes_cast` ist nur dann wahr, wenn mindestens ein Stimmzettel ausgegeben und jeder ausgegebene Stimmzettel abgegeben wurde.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  be9b5cd02a9b5930:
    english: The API applies the same group visibility rules as the in-product report. A user API key cannot expose report data from groups that user cannot access.
    translation: Die API wendet dieselben Regeln für die Sichtbarkeit von Gruppen an wie der Bericht in Loomio. Ein Schlüssel der Benutzer-API kann keine Berichtsdaten aus Gruppen offenlegen, auf die sein Benutzer keinen Zugriff hat.
