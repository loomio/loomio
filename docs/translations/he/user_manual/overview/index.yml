  73449e09f559b4bd:
    english: Loomio is a discussion and decision making tool for collaborative organizations.
    translation: Loomio הוא כלי לדיון ולקבלת החלטות בארגונים שפועלים יחד.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c6d663f00c64f35d:
    english: It enables you to bring people together to discuss topics, explore proposals and make decisions.
    translation: הכלי מאפשר לאנשים להתכנס כדי לדון בנושאים, לבחון הצעות ולקבל החלטות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
