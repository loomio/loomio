  1bda53ca8e31780c:
    english: "## Administration, Facilitation and Moderation - Code of Conduct"
    translation: "## Administración, facilitación y moderación: código de conducta"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1091f77d5ab879ed:
    english: 'Loomio is built to foster inclusive participation, diversity and trust - helping groups make better decisions together. '
    translation: Loomio ayuda a los grupos a tomar mejores decisiones juntos mediante la participación inclusiva, la diversidad y la confianza.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1ac058350eea2c6d:
    english: 'Some topics bring tension in a group.  So it''s important to allow a robust discussion to take place, while ensuring it is also a safe place, particularly for vulnerable people in your group. '
    translation: Algunos temas pueden generar tensión en un grupo. Por eso, es importante permitir una discusión abierta y rigurosa, y mantener un espacio seguro, especialmente para las personas vulnerables del grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  999bb2251bf623cd:
    english: 'We recommend establishing a code of conduct for your group, to help everyone be aware of their responsibility for appropriate behaviour and encourage self-regulation. '
    translation: Recomendamos establecer un código de conducta para el grupo. Así, todas las personas conocerán su responsabilidad de comportarse adecuadamente y podrán regular su propia conducta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9a77fa2d5f4fdb01:
    english: See the [Facilitator's Guide](/en/guides/facilitators_guide/commencing#culture-protocol-expectations) to further explore the value of a code of conduct.
    translation: Consulta la [Guía para facilitadores](/en/guides/facilitators_guide/commencing#culture-protocol-expectations) para conocer mejor la utilidad de un código de conducta.
    status: machine
