  0b8bb762e37fb8c3:
    english: |-
      To create a poll or proposal and only invite the delegates, use the "Selected people only" poll setting.
      ![Selected people only setting when starting a proposal](poll_invited_people_only.png)
      Then when inviting people to vote you will see the "Delegates of group-name" option.
      ![Delegates of Oatmilk Cooperative option in the invite-to-vote form](poll_invite_delegates_group.png)
    translation: |-
      Каб стварыць апытанне або прапанову і запрасіць толькі дэлегатаў, выберыце ў наладах апытання «Толькі выбраныя людзі».
      ![Налада «Толькі выбраныя людзі» пры стварэнні прапановы](poll_invited_people_only.png)
      Пры запрашэнні да галасавання вы ўбачыце варыянт «Дэлегаты назвы групы».
      ![Варыянт «Дэлегаты кааператыва Oatmilk» у форме запрашэння да галасавання](poll_invite_delegates_group.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e895a07efeaf4dcf:
    english: |-
      You can see a list of who the delegates are from the members tab of your group page. Use the filter menu and select "Delegates".
      ![Delegates option in the members filter](members_list_delegates.png)
    translation: |-
      Спіс дэлегатаў можна паглядзець на ўкладцы ўдзельнікаў старонкі вашай групы. Адкрыйце меню фільтра і выберыце «Дэлегаты».
      ![Варыянт «Дэлегаты» ў фільтры спіса ўдзельнікаў](members_list_delegates.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
