    merge_verification:
      subject: Праверце свой адрас электроннай пошты %{site_name} для аб'яднання
      body_html: "<p>Прывітанне, %{name},</p><p> Быў зроблены запыт на аб'яднанне вашага ўліковага запісу карыстальніка з адрасам <strong>%{source_email}</strong> з уліковым запісам, які належыць гэтаму адрасу, <strong>%{target_email}</strong> .</p><p> Пасля завяршэння гэтага працэсу вы больш не зможаце ўвайсці ў сістэму з дапамогай <strong>%{source_email}</strong> , а зможаце ўвайсці толькі з дапамогай <strong>%{target_email}</strong> .</p><p> Калі ласка, пацвердзіце, што вы хочаце зрабіць менавіта гэта.</p>"
