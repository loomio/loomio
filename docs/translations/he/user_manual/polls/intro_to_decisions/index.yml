  68e2a02de493acf3:
    english: "# Proposals and polls"
    translation: "# הצעות וסקרים"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ff07fce3bab705aa:
    english: Proposals and polls collect structured responses from a group. They can help test an idea, make a decision, identify priorities, schedule a meeting, or elect representatives.
    translation: הצעות וסקרים אוספים תגובות מובנות מחברי קבוצה. הם יכולים לעזור לבחון רעיון, לקבל החלטה, לזהות סדרי עדיפויות, לקבוע מועד לפגישה או לבחור נציגים.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f031d2644fee2a91:
    english: "## Find the right help"
    translation: "## איפה למצוא מידע נוסף"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  34039c79ea769793:
    english: 'These parts of the manual answer different questions:'
    translation: 'חלקים שונים במדריך עונים על שאלות שונות:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  34ea9d58ccbf80fb:
    english: |-
      | If you want to… | Read… |
      |---|---|
      | Choose what participants should express | [Proposals](../proposals/) or [Polls](../proposal_types/) |
      | Run a specific proposal template | [Sense check](../proposals/sense_check/), [Advice](../proposals/advice/), [Consent](../proposals/consent/), or [Consensus](../proposals/consensus/) |
      | Configure the templates available to a group | [Poll templates](../poll_templates/) |
      | Facilitate a decision from discussion to outcome | [Making decisions](/en/guides/making_decisions/) |
    translation: |-
      | מה רוצים לעשות | איפה לקרוא |
      |---|---|
      | לבחור איזה סוג תגובה לבקש מהמשתתפים | [הצעות](../proposals/) או [סקרים](../proposal_types/) |
      | להשתמש בתבנית מסוימת של הצעה | [בדיקת עמדות](../proposals/sense_check/), [התייעצות](../proposals/advice/), [הסכמה](../proposals/consent/) או [קונצנזוס](../proposals/consensus/) |
      | להגדיר אילו תבניות זמינות לקבוצה | [תבניות סקר](../poll_templates/) |
      | להוביל קבלת החלטה מדיון עד למסקנה | [קבלת החלטות](/en/guides/making_decisions/) |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7eddb057cca077f4:
    english: A **voting method** defines how people respond and how results are calculated. A **poll template** is a reusable configuration built on a voting method, with preset instructions, options, and settings. A **decision process** may use a discussion and several templates before the group reaches an outcome.
    translation: "**שיטת הצבעה** קובעת איך אנשים מגיבים ואיך מחושבות התוצאות. **תבנית סקר** היא הגדרה שאפשר להשתמש בה שוב, המבוססת על שיטת הצבעה וכוללת הוראות, אפשרויות והגדרות שנקבעו מראש. **תהליך קבלת החלטה** יכול לכלול דיון וכמה תבניות לפני שהקבוצה מגיעה למסקנה."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3cd46aa2f1240e88:
    english: "## Proposals"
    translation: "## הצעות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  85a55fccaf4e4032:
    english: 'A proposal asks people to respond to a statement or course of action. Loomio includes templates for common purposes:'
    translation: 'הצעה מבקשת מאנשים להגיב להצהרה או לדרך פעולה. Loomio כוללת תבניות למטרות נפוצות:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  51bf1ffa7d057d9e:
    english: |-
      - [Sense check](../proposals/sense_check/) gathers early reactions;
      - [Advice](../proposals/advice/) gathers input for a decision maker;
      - [Consent](../proposals/consent/) tests for meaningful objections; and
      - [Consensus](../proposals/consensus/) seeks collective agreement.
    translation: |-
      - [בדיקת עמדות](../proposals/sense_check/) אוספת תגובות ראשוניות;
      - [התייעצות](../proposals/advice/) אוספת מידע עבור מי שמקבלים את ההחלטה;
      - [הסכמה](../proposals/consent/) בודקת אם יש התנגדויות מהותיות; וגם
      - [קונצנזוס](../proposals/consensus/) מסייע להגיע להסכמה משותפת.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d01e9f85fcd2d9c2:
    english: See [Proposals](../proposals/) to compare them.
    translation: להשוואה ביניהן, ראו [הצעות](../proposals/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  821dcd89b5460804:
    english: "## Polls"
    translation: "## סקרים"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ec746235c7fe89c4:
    english: 'Use a poll when participants need to select, score, allocate, rank, state their availability, or cast an election ballot:'
    translation: 'אפשר להשתמש בסקר כשהמשתתפים צריכים לבחור אפשרויות, לתת ציונים, לחלק נקודות, לדרג העדפות, לציין מתי הם זמינים או להצביע בבחירות:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b93f9fe9611d9205:
    english: |-
      - [Choose](../choose/) finds popular options;
      - [Score](../score/) evaluates every option on a scale;
      - [Allocate](../allocate/) distributes a limited budget of points;
      - [Rank](../rank/) finds an overall order of preference;
      - [Time poll](../meeting_polls/) finds when people are available; and
      - [STV Election](../stv/) elects multiple winners proportionally.
    translation: |-
      - [בחירה](../choose/) מזהה אפשרויות פופולריות;
      - [מתן ציון](../score/) מעריך כל אפשרות בסולם ציונים;
      - [הקצאה](../allocate/) מחלקת תקציב מוגבל של נקודות;
      - [דירוג](../rank/) קובע סדר העדפות כולל;
      - [סקר זמן](../meeting_polls/) מזהה מתי אנשים זמינים; וגם
      - [בחירות STV](../stv/) בוחרות כמה נציגים באופן יחסי.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9972b34ccc3ea79b:
    english: See [Polls](../proposal_types/) to compare them.
    translation: להשוואה ביניהם, ראו [סקרים](../proposal_types/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5890626db6dcbb68:
    english: "## Start a proposal or poll"
    translation: "## פתיחת הצעה או סקר"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4b5338cae269fd32:
    english: "### Choose whether to use a discussion"
    translation: "### בחירה אם להשתמש בדיון"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c45fe8ff31f71486:
    english: Start the proposal or poll inside a discussion when people need context, questions, or conversation before responding. A discussion can contain several proposals over time, keeping amendments and the eventual outcome together as one record of the topic.
    translation: כדאי לפתוח את ההצעה או הסקר בתוך דיון כשנדרשים רקע, שאלות או שיחה לפני מתן התגובות. דיון יכול להכיל כמה הצעות לאורך זמן, כך שהתיקונים והמסקנה הסופית נשמרים יחד כתיעוד אחד של הנושא.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0bb2a90f8f9dad0c:
    english: Run a standalone poll when the discussion has already happened elsewhere, such as at a meeting, or when the question is simple and you only need to collect responses. Include enough detail or a link to the relevant record so voters understand what they are responding to.
    translation: כדאי לפתוח סקר עצמאי אם הדיון כבר התקיים במקום אחר, למשל בפגישה, או אם השאלה פשוטה וכל שנדרש הוא לאסוף תגובות. יש לכלול מספיק פרטים או קישור לתיעוד הרלוונטי, כדי שמי שמצביעים יבינו על מה הם מגיבים.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7d50445f0c54190d:
    english: "### In a discussion"
    translation: "### בתוך דיון"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  05e03f7ee0e1b4dc:
    english: Open the discussion, scroll to the reply area, select **Start a vote**, and choose a template.
    translation: יש לפתוח את הדיון, לגלול לאזור התגובות, לבחור **התחל הצבעה** ואז לבחור תבנית.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  55dc0481a5c4ecb6:
    english: "### Without a discussion"
    translation: "### ללא דיון"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  af5fd115de5f7aec:
    english: Open the **Polls** tab on the group page, select **New poll**, and choose a template.
    translation: יש לפתוח את הלשונית **סקרים** בדף הקבוצה, לבחור **סקר חדש** ואז לבחור תבנית.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  23479ea263004d4a:
    english: If you create a discussion and poll at the same time only to run a vote, avoid notifying people twice. Start the discussion without notifying them and use the poll invitation, or run the poll without a discussion.
    translation: אם פותחים דיון וסקר יחד רק לצורך הצבעה, כדאי להימנע משליחת שתי התראות לאותם אנשים. אפשר לפתוח את הדיון בלי לשלוח התראה ולהשתמש בהזמנה לסקר, או לפתוח את הסקר ללא דיון.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  31f857d230319a3c:
    english: "## What happens next"
    translation: "## מה קורה בהמשך"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb709a76dfeabd4f:
    english: When starting a proposal or poll, you provide a title and details, review its response options and settings, set a closing time, and invite participants. While it is open, participants can vote, explain their response, and change their vote. Results update as votes are submitted, subject to the poll's result-visibility setting.
    translation: כשפותחים הצעה או סקר, יש להזין כותרת ופרטים, לבדוק את אפשרויות התגובה וההגדרות, לקבוע מועד סגירה ולהזמין משתתפים. כל עוד ההצעה או הסקר פתוחים, המשתתפים יכולים להצביע, להסביר את תגובתם ולשנות את הצבעתם. התוצאות מתעדכנות עם קבלת ההצבעות, בהתאם להגדרת הנראות של תוצאות הסקר.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  acd2e813b56034a0:
    english: When it closes, publish an [outcome](../outcomes/) that records what the result means and what will happen next.
    translation: לאחר הסגירה, יש לפרסם [מסקנה](../outcomes/) שמתעדת את משמעות התוצאה ואת הצעדים הבאים.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
