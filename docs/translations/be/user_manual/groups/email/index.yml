---
navigation_title: Адрас электроннай пошты
blocks:
  14280ff177b248ab:
    english: "# Send an email to start a thread in your group"
    translation: "# Дашліце ліст, каб пачаць тэму ў сваёй групе"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e3de5524e10b9928:
    english: Your Loomio group has an email address! You can send or forward email to this address to start a thread in the group.
    translation: У вашай групы Loomio ёсць адрас электроннай пошты. Дашліце або перашліце ліст на гэты адрас, каб пачаць тэму ў групе.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  85a7436d4a1b4396:
    english: |-
      You can see your group's email address on the group page:
      ![location of the email address on the group page](email_email_button.png)
    translation: |-
      Адрас электроннай пошты вашай групы паказаны на старонцы групы:
      ![Размяшчэнне адраса электроннай пошты на старонцы групы](email_email_button.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e34019bbcf3b319f:
    english: When you send an email to this address, a new thread will be started. The email subject becomes the thread title, the body of the email becomes the description, and any attached files will be attached to the thread.
    translation: Калі вы дашлеце ліст на гэты адрас, у групе з’явіцца новая тэма. Тэма ліста стане назвай тэмы, тэкст ліста — яе апісаннем, а далучаныя файлы будуць прымацаваны да тэмы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  46a53b8267a61c2f:
    english: The email "From" address is used to find the group member who will be the author of the thread.
    translation: Па адрасе ў полі «Ад» вызначаецца, хто з удзельнікаў групы будзе аўтарам тэмы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bd7df6f632af8db1:
    english: "## Preventing unauthorized emails"
    translation: "## Абарона ад лістоў старонніх людзей"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a5118468df167ba0:
    english: To ensure that this feature cannot be used by people who are not members of your group, Loomio will require that the "From" address of an incoming email matches the address of someone in the group.
    translation: Каб людзі па-за вашай групай не маглі карыстацца гэтай магчымасцю, адрас у полі «Ад» уваходнага ліста павінен супадаць з адрасам аднаго з удзельнікаў групы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f11910ae643c5b47:
    english: If you use multiple email addresses, you can add an alias so Loomio knows about your other email addresses.
    translation: Калі вы карыстаецеся некалькімі адрасамі электроннай пошты, дадайце псеўданім, каб Loomio распазнавала вашы іншыя адрасы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e3d88a25128322b5:
    english: When the "from" address does not match a member of the group, you will receive a notification asking you to add an alias or reject all further emails from that address.
    translation: Калі адрас у полі «Ад» не належыць нікому з удзельнікаў групы, вы атрымаеце апавяшчэнне з прапановай дадаць псеўданім або адхіляць усе наступныя лісты з гэтага адраса.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  890546269cfa56b6:
    english: This means that the first time you send email from an unrecognised address, you will need to add an alias. After that, emails will be accepted immediately.
    translation: Таму, калі вы ўпершыню дашлеце ліст з нераспазнанага адраса, вам трэба будзе дадаць псеўданім. Пасля гэтага лісты з гэтага адраса будуць прымацца адразу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e778a27d6b286135:
    english: "![Location of the approve and reject buttons for an unrecognised email](email_unreleased_emails.png)"
    translation: "![Размяшчэнне кнопак пацвярджэння і адхілення ліста з нераспазнанага адраса](email_unreleased_emails.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
