  195fe68dbcc6418f:
    english: Loomio can send notifications to your chatroom.
    translation: Loomio voi lähettää ilmoituksia chat-huoneeseesi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bf886ec0d398e8d7:
    english: Chat tools and Loomio work well together. Use chat for quick conversation and timely updates. Move important topics to Loomio when people need time to participate, when a decision must be made, or when the group will need a lasting record.
    translation: Chat ja Loomio toimivat hyvin yhdessä. Käytä chatia nopeaan keskusteluun ja ajankohtaisiin päivityksiin. Siirrä tärkeät aiheet Loomioon, kun osallistuminen vaatii aikaa, päätös on tehtävä tai ryhmä tarvitsee pysyvän tallenteen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  db7d26a18ddc651d:
    english: Loomio supports Slack, Discord, Microsoft Teams, Matrix and Mattermost.
    translation: Loomio tukee Slackia, Discordia, Microsoft Teamsia, Matrixia ja Mattermostia.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  765fc0d609a0db99:
    english: You can send notifications to your chatroom any time you like, just the same way you would invite individual people to vote, or to join a thread.
    translation: Voit lähettää ilmoituksia chat-huoneeseesi milloin tahansa, aivan kuten voit kutsua yksittäisiä ihmisiä äänestämään tai osallistumaan keskusteluun.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a89717f4f41f3212:
    english: You can also configure notifications to always happen when a specific event happens, like someone starting a thread.
    translation: Voit myös määrittää ilmoituksen lähtemään automaattisesti tietyn tapahtuman yhteydessä, esimerkiksi kun joku aloittaa keskustelun.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
