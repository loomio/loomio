    translated_on: '2026-09-29'
  cb0d8b2f2c8b9630:
    english: You will be invited to type the name of your group (*case sensitive*) to confirm you wish to delete your group.
    translation: Pour confirmer la suppression, vous devrez saisir le nom de votre groupe (*en respectant les majuscules et les minuscules*).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
