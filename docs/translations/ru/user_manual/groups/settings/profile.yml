  0b903e1c3c7e1862:
    english: The profile tab controls how your group is identified and introduced. Open **Edit group settings** from the group page, then select **Profile**.
    translation: На вкладке профиля вы можете указать, как представить вашу группу. На странице группы откройте **Редактировать настройки группы**, затем выберите **Профиль**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1baaad2a0c6c8909:
    english: "![Group profile settings](group_profile.png)"
    translation: "![Настройки профиля группы](group_profile.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a1c12efad8cb82f5:
    english: "## Name and handle"
    translation: "## Название и короткий адрес"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3643c2e2ffd5db73:
    english: Choose a concise group name, particularly if the group will contain subgroups. Loomio uses the handle in the group's web address and group email address, such as `loomio.com/your-group-handle` and `your-group-handle@loomio.com`.
    translation: Выберите краткое название группы, особенно если в ней будут подгруппы. Короткий адрес используется в веб-адресе группы и её адресе электронной почты, например `loomio.com/your-group-handle` и `your-group-handle@loomio.com`.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5a6e298a019f6a15:
    english: When you change the handle, links using the previous handle redirect to the new address, and email sent to the previous group address continues to reach the group. Loomio retains up to three previous handles; changing the handle again after that causes the oldest one to expire.
    translation: Если вы измените короткий адрес, ссылки со старым адресом будут перенаправлять на новый. Письма, отправленные на прежний адрес группы, по-прежнему будут доходить до неё. Loomio сохраняет до трёх прежних коротких адресов. При следующем изменении самый старый из них перестанет работать.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2b45dd41be9c3d1d:
    english: "## Description"
    translation: "## Описание"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7b707620077d9d19:
    english: Use the description to explain what the group is for, who participates, and how people are expected to use it. You can format the description and include links, documents, and videos.
    translation: Расскажите в описании, для чего создана группа, кто в ней участвует и как её следует использовать. Вы можете оформить текст и добавить ссылки, документы и видео.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  93a11a5e2927833e:
    english: The name and description may be visible to non-members depending on the group's [privacy settings](/en/user_manual/groups/settings/privacy).
    translation: Название и описание могут быть видны людям вне группы. Это зависит от [настроек конфиденциальности](/en/user_manual/groups/settings/privacy) группы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0dff03268238aa26:
    english: "## Cover image and logo"
    translation: "## Обложка и логотип"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9d08dda635bd5ce6:
    english: The cover image appears across the top of the group page. A wide image works best; the recommended size is 2048 × 512 pixels.
    translation: Обложка отображается в верхней части страницы группы. Лучше всего подходит широкое изображение. Рекомендуемый размер — 2048 × 512 пикселей.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cc04654d8d08da59:
    english: The group logo identifies the group in navigation and other compact contexts. Upload the cover image and logo separately so each can be cropped for its intended shape.
    translation: Логотип помогает узнавать группу в навигации и других местах, где изображение показывается в небольшом размере. Загрузите обложку и логотип отдельно, чтобы каждый из них можно было обрезать под нужную форму.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
