---
navigation_title: Einträge zwischen Diskussionen verschieben
blocks:
  875a42e08000fffe:
    english: "# Moving items between threads"
    translation: "# Einträge zwischen Diskussionen verschieben"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5c0fcd38f9276e8f:
    english: Move selected items when a conversation belongs in another thread, when one thread has split into separate topics, or when you want to combine related discussions. There is no separate **Merge discussions** command.
    translation: Verschiebe ausgewählte Einträge, wenn ein Gespräch besser in eine andere Diskussion passt, sich eine Diskussion in mehrere Themen aufgeteilt hat oder du zusammengehörige Diskussionen verbinden möchtest. Es gibt keinen eigenen Befehl **Diskussionen zusammenführen**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f43c7835d05a135e:
    english: The option is available to group admins and to members when **Members can manage discussions and comments** is enabled in [Group permissions](/en/user_manual/groups/settings/permissions).
    translation: Diese Option steht Gruppenadmins zur Verfügung. Mitglieder können sie nutzen, wenn **Mitglieder können Diskussionen und Kommentare verwalten.** in den [Gruppenberechtigungen](/en/user_manual/groups/settings/permissions) aktiviert ist.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  30a4e31dab983f89:
    english: Open the three-dot menu (**⋯**) on an item and select **Move item**.
    translation: Öffne das Dreipunktmenü (**⋯**) eines Eintrags und wähle **Eintrag bewegen**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  24fd0043effa14fb:
    english: Select the items you want to move.
    translation: Wähle die Einträge aus, die du verschieben möchtest.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  81551cd5134f24c5:
    english: Select any additional items with the checkboxes, then click **Move** in the banner at the top of the discussion.
    translation: Wähle weitere Einträge über die Kontrollkästchen aus. Klicke dann oben in der Diskussion auf **Verschieben**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f53055845c214b05:
    english: Choose the group or subgroup, then search for the destination discussion.
    translation: Wähle die Gruppe oder Untergruppe aus und suche dann nach der Zieldiskussion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  19bc2092ac28011b:
    english: To move the items into a new discussion, select **New discussion** and add its title and context.
    translation: Wenn du die Einträge in eine neue Diskussion verschieben möchtest, wähle **Neue Diskussion** und gib einen Titel und Kontext ein.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '092b56e69505636f':
    english: The items are moved from the original thread into the selected or newly created thread.
    translation: Die Einträge werden aus der ursprünglichen Diskussion in die ausgewählte oder neu erstellte Diskussion verschoben.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  162c0d0c47ca798f:
    english: If the original thread is no longer needed, you can [lock it](/en/user_manual/discussions/using_discussions/#lock-or-unlock-a-thread). Delete it only if you are certain it will not be needed again.
    translation: Wenn du die ursprüngliche Diskussion nicht mehr brauchst, kannst du [sie sperren](/en/user_manual/discussions/using_discussions/#lock-or-unlock-a-thread). Lösche sie nur, wenn du sicher bist, dass sie nicht mehr gebraucht wird.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
