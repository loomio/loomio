    translated_on: '2026-09-30'
  a858ffdb8df01bed:
    english: |-
      ## Content translation
      When someone in your group writes their message in a language that is different to your preferred language, a "translate" button will appear below the message. You can click this button to automatically translate the message into your preferred language.
    translation: |-
      ## Пераклад кантэнту
      Калі ў вашай групе з’явіцца паведамленне на іншай мове, пад ім будзе кнопка «Перакласці». Націсніце яе, каб аўтаматычна перакласці паведамленне на мову, якой вы аддаеце перавагу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
