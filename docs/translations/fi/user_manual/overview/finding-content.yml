    english: Tags group related discussions and polls under names chosen by your group, such as a project, team, or area of work.
    translation: Tunnisteet kokoavat yhteen samaan aiheeseen liittyviä keskusteluja ja kyselyitä. Ryhmäsi voi nimetä tunnisteet esimerkiksi projektin, tiimin tai työalueen mukaan.
    status: machine
