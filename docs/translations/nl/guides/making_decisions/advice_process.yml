    translated_on: '2026-09-30'
  b27279b9ea3b1f0a:
    english: As people offer advice and comments, Takashi grows resolved in his decision.
    translation: Terwijl mensen advies en reacties geven, krijgt Takashi meer duidelijkheid over zijn beslissing.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f3a820171554b2c9:
    english: "### Step 3. Make a decision with advice and inform people"
    translation: "### Stap 3. Neem een beslissing met het advies en informeer de betrokkenen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8a0d4bfcbc87c5bb:
    english: When everyone has offered advice, or the proposal closes, Takashi makes a decision and states the **[outcome](/en/user_manual/polls/outcomes/)**.
    translation: Wanneer iedereen advies heeft gegeven of het voorstel sluit, neemt Takashi een beslissing en deelt hij de **[conclusie](/en/user_manual/polls/outcomes/)**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
