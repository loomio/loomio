  7c8501ecb12311af:
    english: "## How Loomio works"
    translation: "## Як працює Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  74caca2261c15283:
    english: 'Loomio has three main parts: groups, discussions, and polls.'
    translation: 'Loomio має три основні складові: групи, обговорення та опитування.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5f0a46926a0f7350:
    english: "### Groups"
    translation: "### Групи"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2060a64d0fabc6d7:
    english: A group is a place for an organization, team, or community to work together. Its home page explains the group's purpose and provides access to its discussions, polls, members, and files.
    translation: Група — це простір для спільної роботи організації, команди чи спільноти. На головній сторінці пояснено мету групи й надано доступ до її обговорень, опитувань, учасників і файлів.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  311793a17709182c:
    english: "### Discussions"
    translation: "### Обговорення"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  05ecdffe6c18a1df:
    english: Discussions keep the information and conversation about a topic together. People can share context, comment, reply, react, and use polls to move the discussion towards an outcome.
    translation: В обговоренні зібрано інформацію та розмову на певну тему. Люди можуть ділитися контекстом, залишати коментарі, відповідати, реагувати й проводити опитування, щоб дійти висновку.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dc9a50d7f1f20c80:
    english: Over time, discussions create a searchable record of the information considered and the decisions made by your group.
    translation: З часом обговорення формують доступний для пошуку запис інформації, яку розглянула ваша група, та ухвалених нею рішень.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3448194e8a2ce09d:
    english: "### Polls and proposals"
    translation: "### Опитування та пропозиції"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4ef7092f5f56e773:
    english: Polls help a group understand preferences, gather advice, and make decisions. Different poll templates support different processes. A proposal asks people to respond to a suggested course of action and explain the reason for their response.
    translation: Опитування допомагають групі з’ясувати вподобання, зібрати поради й ухвалити рішення. Різні шаблони опитувань підходять для різних процесів. Пропозиція дає людям змогу відгукнутися на запропоновані дії та пояснити свою відповідь.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  51ab039bc7c374bd:
    english: Polls can be part of a discussion or run independently from the **Polls** tab on a group page.
    translation: Опитування можна проводити в межах обговорення або окремо, через вкладку **Опитування** на сторінці групи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  47500e7125fdedbc:
    english: To learn where these parts appear in the interface, see the [Quick tour](/en/user_manual/overview/orientation). To start contributing, see [How to participate](/en/user_manual/overview/how-to-participate).
    translation: Щоб дізнатися, де знайти ці складові в інтерфейсі, перегляньте [Короткий огляд](/en/user_manual/overview/orientation). Щоб почати брати участь, прочитайте [Як брати участь](/en/user_manual/overview/how-to-participate).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  57ed823687deabb5:
    english: "## Try it out"
    translation: "## Спробуйте Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b08a2d6a44f0d7ac:
    english: The best way to learn about Loomio is to [start a free trial](/try)
    translation: Найкращий спосіб познайомитися з Loomio — [почати безкоштовний пробний період](/try)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ced10eda436a40ca:
    english: "## How people use Loomio"
    translation: "## Як люди використовують Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4198817a2724ad0a:
    english: "**Member organizations** to involve members in decisions at scale. Political parties, consumer and worker co-operatives, and membership associations use Loomio to facilitate a safe, inclusive space for members to share information and raise topics, participate in important decisions and vote in General Assembly. Streamline decision processes, improve transparency and accountability, document discussions and record decisions, and include members' voices to organize for action."
    translation: "**Організації з членством** залучають своїх членів до ухвалення рішень у великому масштабі. Політичні партії, споживчі й робітничі кооперативи та членські об’єднання використовують Loomio, щоб створити безпечний і відкритий для всіх простір. У ньому учасники можуть ділитися інформацією, порушувати питання, брати участь у важливих рішеннях і голосувати на загальних зборах. Loomio допомагає впорядкувати ухвалення рішень, підвищити прозорість і підзвітність, зберігати обговорення та рішення й враховувати голоси учасників під час планування спільних дій."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7b2fd1306e05f4e3:
    english: "**Self-managing organizations** to involve staff in decisions. Self-managing teams, worker co-operatives, and sociocratic organisations use Loomio to run consent, consensus, and advice-based decision processes across distributed teams and time zones. Tap into collective intelligence, distribute decision making, build governance and policy together, and document decisions and discussion."
    translation: "**Самоврядні організації** залучають працівників до ухвалення рішень. Самоврядні команди, робітничі кооперативи та соціократичні організації використовують Loomio для ухвалення рішень на основі згоди, консенсусу й порад у командах, що працюють у різних місцях і часових поясах. Це допомагає об’єднати знання учасників, розподілити ухвалення рішень, спільно виробляти правила й політики та зберігати записи рішень і обговорень."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  75d7266c562f65c2:
    english: "**Boards, councils, and distributed networks** to involve stakeholders in decisions. Create a safe space for discussion, keep track of communications, and coordinate across geographies and time zones. Structure decision making processes, improve agility and response times, and preserve organizational memory."
    translation: "**Правління, ради та розподілені мережі** залучають зацікавлені сторони до ухвалення рішень. Loomio дає їм безпечний простір для обговорення, допомагає відстежувати спілкування й координувати роботу в різних місцях і часових поясах. Вони можуть впорядковувати процеси ухвалення рішень, швидше реагувати на зміни та зберігати знання організації."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cbe5ae77738f2704:
    english: "**Residential communities and co-ops** to make decisions together as neighbours. Cohousing communities, ecovillages, coliving cooperatives, housing co-ops, and land trusts use Loomio to replace or augment traditional strata and property management with democratic governance. Residents shape decisions about shared land, common spaces, and community agreements, and asynchronous discussion means members can fully participate whether they're on-site or away travelling, keeping a clear record of how the community has chosen to live together."
    translation: "**Житлові спільноти й кооперативи** допомагають сусідам ухвалювати рішення разом. Спільноти спільного проживання, екопоселення, житлові кооперативи та земельні трасти використовують Loomio, щоб доповнити або замінити традиційне управління житлом і майном демократичним самоврядуванням. Мешканці разом вирішують питання спільної землі, приміщень і правил життя спільноти. Завдяки обговоренням, у яких не потрібно брати участь одночасно, учасники можуть долучатися і вдома, і під час подорожей. При цьому зберігається зрозумілий запис того, як спільнота обрала жити разом."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb1039083c952286:
    english: Loomio builds a living record of your organization; the decisions made, who was involved and the discussion leading up to the decision.
    translation: 'Loomio зберігає історію вашої організації: ухвалені рішення, участь людей і обговорення, що передували цим рішенням.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
