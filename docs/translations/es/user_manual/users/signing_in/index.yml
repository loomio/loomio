  7d0aa091e06fa112:
    english: "# Signing in"
    translation: "# Iniciar sesión"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3bede807c136909b:
    english: On Loomio.com, you can sign in with a passkey, your email and password, an emailed sign-in code, or Google. You can choose whichever available method is most convenient for you.
    translation: En Loomio.com, puedes iniciar sesión con una clave de acceso, con tu correo electrónico y contraseña, con un código enviado por correo electrónico o con Google. Elige el método disponible que te resulte más cómodo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2bc2277a8ee0508d:
    english: "![The Loomio sign-in form with passkey, email, password, and emailed-code options](sign_in_email.png)"
    translation: "![Formulario de inicio de sesión de Loomio con opciones de clave de acceso, correo electrónico, contraseña y código enviado por correo electrónico](sign_in_email.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e3daf63d410d5513:
    english: "## Sign in with a passkey"
    translation: "## Iniciar sesión con una clave de acceso"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5c82bc1e8baa9f0b:
    english: Select **Use a passkey**. Your browser or device shows the Loomio passkeys available to you and asks you to unlock the selected passkey with its normal screen lock, fingerprint, face recognition, PIN, or security key. You do not enter an email address first.
    translation: Selecciona **Usa una clave de acceso**. Tu navegador o dispositivo muestra las claves de acceso de Loomio disponibles y te pide que desbloquees la que elijas con el bloqueo de pantalla habitual, la huella digital, el reconocimiento facial, un PIN o una llave de seguridad. No tienes que introducir primero tu dirección de correo electrónico.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9386303ee98cb592:
    english: You can add, name, and remove passkeys from your profile. For security, Loomio may ask you to sign in again before changing them. Give each passkey a recognizable name such as “Work laptop” or “Phone”. Passkeys are tied to the Loomio site where they were created and may be synchronized by your device or password manager.
    translation: Puedes añadir, nombrar y eliminar claves de acceso desde tu perfil. Por seguridad, Loomio puede pedirte que vuelvas a iniciar sesión antes de cambiarlas. Da a cada clave un nombre que reconozcas, como «Portátil del trabajo» o «Teléfono». Las claves de acceso están vinculadas al sitio de Loomio donde se crearon y pueden sincronizarse mediante tu dispositivo o gestor de contraseñas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5f10999e671f9b56:
    english: "## Sign in with email and password"
    translation: "## Iniciar sesión con correo electrónico y contraseña"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5c8a380df0b08c86:
    english: Enter your email address and password, then select **Sign in**. For account privacy, Loomio uses the same error when the email or password cannot be used to sign in.
    translation: Introduce tu dirección de correo electrónico y contraseña y selecciona **Entrar**. Para proteger la privacidad de las cuentas, Loomio muestra el mismo error si no se puede iniciar sesión con el correo electrónico o la contraseña.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  63c19e6f58a1de53:
    english: If you have not added a passkey, Loomio offers to add one after you sign in with a password. You can dismiss the offer, and Loomio will remember your choice.
    translation: Si aún no has añadido una clave de acceso, Loomio te ofrece añadir una después de iniciar sesión con una contraseña. Puedes descartar la propuesta y Loomio recordará tu elección.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dde79982546607b4:
    english: If you do not have a password or cannot remember it, select **Send me a code** instead.
    translation: Si no tienes contraseña o no la recuerdas, selecciona **Envíame un código**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5f3c6f8eca20d49c:
    english: "## Get a sign-in code"
    translation: "## Obtener un código para iniciar sesión"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9713c017e247d8e2:
    english: Select **Send me a code**, enter your email address, and submit the form. Loomio displays the same confirmation whether or not the address belongs to an account, so another person cannot use the form to discover who uses Loomio.
    translation: Selecciona **Envíame un código**, introduce tu dirección de correo electrónico y envía el formulario. Loomio muestra la misma confirmación tanto si la dirección pertenece a una cuenta como si no. Así, nadie puede usar el formulario para averiguar quién utiliza Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  546aaa95b133da11:
    english: If the address belongs to your account, Loomio sends a six-digit code. Return to the sign-in form, enter the code, and select **Sign in**. Sign-in codes normally expire after 24 hours and cannot be reused. Check your spam folder if the message does not arrive, and make sure you entered the address associated with your account.
    translation: Si la dirección pertenece a tu cuenta, Loomio te envía un código de seis dígitos. Vuelve al formulario de inicio de sesión, introduce el código y selecciona **Entrar**. Los códigos suelen caducar a las 24 horas y no se pueden reutilizar. Si no recibes el mensaje, revisa la carpeta de correo no deseado y comprueba que has introducido la dirección asociada a tu cuenta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  26171d5996050130:
    english: "![The Loomio form for entering a six-digit sign-in code](sign_in_code.png)"
    translation: "![Formulario de Loomio para introducir un código de inicio de sesión de seis dígitos](sign_in_code.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '087809317d00494a':
    english: After each sign-in with a code, Loomio offers to set or replace your password. If your browser supports passkeys, you can also add one, even if you have already added a passkey on another device. A passkey lets you sign in quickly with your device’s fingerprint, face, or screen lock. You can skip the offer and continue using emailed codes.
    translation: Cada vez que inicias sesión con un código, Loomio te ofrece establecer o cambiar tu contraseña. Si tu navegador admite claves de acceso, también puedes añadir una, aunque ya tengas otra en un dispositivo distinto. Una clave de acceso te permite iniciar sesión rápidamente con la huella digital, el reconocimiento facial o el bloqueo de pantalla de tu dispositivo. Puedes omitir la propuesta y seguir usando códigos enviados por correo electrónico.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fa960675e8369daf:
    english: "## Create an account"
    translation: "## Crear una cuenta"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  75fc0885f772c8cf:
    english: Select **Create account** and follow the email-verification steps.
    translation: Selecciona **Crear una cuenta** y sigue los pasos para verificar tu correo electrónico.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  aa461253943b989a:
    english: For privacy, use the same email address that received your group invitation. If you have accounts under more than one address, you can [merge your accounts](/en/user_manual/users/merge_accounts).
    translation: Para proteger tu privacidad, usa la misma dirección de correo electrónico en la que recibiste la invitación al grupo. Si tienes cuentas con distintas direcciones, puedes [fusionar tus cuentas](/en/user_manual/users/merge_accounts).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d9844ac27d806c35:
    english: "## Sign in with Google"
    translation: "## Iniciar sesión con Google"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8445cfcb9e9ecef5:
    english: Select **Sign in with Google** and authenticate with your Google account. If an existing Loomio account has the same email address, Loomio links the Google identity to that account.
    translation: Selecciona **Iniciar sesión con Google** e identifícate con tu cuenta de Google. Si ya existe una cuenta de Loomio con la misma dirección de correo electrónico, Loomio vincula la identidad de Google a esa cuenta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  46281cafc4a889bf:
    english: "## Other Loomio sites"
    translation: "## Otros sitios de Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  23c2dffa5d5056e2:
    english: Organizations that host their own Loomio site can configure different sign-in methods. A site may offer passwords, emailed codes, passkeys, Google, SAML, or another OAuth provider alongside each other.
    translation: Las organizaciones que alojan su propio sitio de Loomio pueden configurar distintos métodos para iniciar sesión. Un sitio puede ofrecer a la vez contraseñas, códigos enviados por correo electrónico, claves de acceso, Google, SAML u otro proveedor de OAuth.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3de129c7bac50409:
    english: Some sites require an invitation before you can create an account. On these sites, **Create account** appears only when you follow an invitation link.
    translation: Algunos sitios requieren una invitación para crear una cuenta. En esos sitios, **Crear una cuenta** solo aparece cuando sigues un enlace de invitación.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  16004d08bcad640b:
    english: An SSO-only private site shows only its organization sign-in option. It does not offer Loomio-managed passwords, emailed sign-in codes, native account creation, or Loomio-managed passkeys. If the organization uses passkeys, its identity provider asks for them during SSO.
    translation: Un sitio privado que solo usa SSO muestra únicamente la opción de iniciar sesión de la organización. No ofrece contraseñas ni códigos enviados por correo electrónico gestionados por Loomio, creación de cuentas directamente en Loomio ni claves de acceso gestionadas por Loomio. Si la organización usa claves de acceso, su proveedor de identidad te las solicitará durante el inicio de sesión único.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  148bcb52b49eb179:
    english: "## Sign out"
    translation: "## Salir"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dc9ad2d75eb9da48:
    english: Open the sidebar, select your name, then select **Sign out**. On a shared computer, sign out when you finish rather than closing only the browser tab.
    translation: Abre la barra lateral, selecciona tu nombre y después **Salir**. Si usas un ordenador compartido, cierra la sesión cuando termines en lugar de cerrar solo la pestaña del navegador.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
