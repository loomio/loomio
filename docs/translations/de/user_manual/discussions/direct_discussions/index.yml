  b3ed13f5612f4ff9:
    english: A direct discussion is a private discussion for a specific set of people.
    translation: Eine direkte Diskussion ist eine private Diskussion für einen bestimmten Personenkreis.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  479f7faed056ab51:
    english: A direct discussion does not belong to a group. Invited people do not need to be a member of your Loomio group.
    translation: Eine direkte Diskussion gehört zu keiner Gruppe. Eingeladene Personen müssen nicht Mitglied deiner Loomio-Gruppe sein.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2f5362faecc07fa0:
    english: You control who can see and participate by adding people or email addresses to the **Invite** field.
    translation: Du bestimmst, wer die Diskussion sehen und daran teilnehmen kann, indem du Personen oder E-Mail-Adressen in das Feld **Einladen** einträgst.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f31343ea54b4f899:
    english: Direct discussions support the same comments, polls and other tools as group discussions. They can be useful when creating a subgroup is unnecessary.
    translation: In direkten Diskussionen kannst du dieselben Kommentare, Abstimmungen und anderen Funktionen wie in Gruppendiskussionen nutzen. Sie sind nützlich, wenn du keine Untergruppe brauchst.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
