  7bda51ac3285357f:
    english: When starting or editing a discussion or poll, or writing a comment, you will see a formatting bar below the text field. Select the arrow at the end of the bar to show or hide the full set of tools.
    translation: Ao iniciar ou editar uma discussão ou enquete, ou escrever um comentário, você verá uma barra de formatação abaixo do campo de texto. Selecione a seta no fim da barra para mostrar ou ocultar todas as ferramentas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2f2944ad10684b7f:
    english: Hover the mouse or cursor over each item for the name of each tool.
    translation: Passe o cursor sobre cada item para ver o nome da ferramenta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5f45a085deb9eff1:
    english: Use formatting to add structure and emphasis so information is easier to scan.
    translation: Use a formatação para organizar e destacar as informações, facilitando a leitura.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
