  77f49576383e36ca:
    english: Is the problem or opportunity is worth pursuing?  Takashi is experiencing problems with his old computer, and it crashed during a recent presentation.
    translation: Is het probleem of de kans de moeite waard om aan te pakken?  Takashi heeft problemen met zijn oude computer. Tijdens een recente presentatie liep die vast.
    status: machine
