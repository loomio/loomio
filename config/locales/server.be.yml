    consensus:
      process_subtitle: Дасягнуць калектыўнага пагаднення з усімі зацікаўленымі бакамі
      process_introduction_v2: "<p><strong>Кансенсус</strong> прызначаны для прыняцця рашэнняў, дзе важна, каб усе актыўна пагаджаліся. Удзельнікі працуюць разам, каб зразумець патрэбы адзін аднаго і фарміраваць прапанову, пакуль уся група не зможа яе падтрымаць. Паколькі людзі могуць змяняць свой голас па меры развіцця размовы, гэты працэс спрыяе сапраўднаму дыялогу, а не аднаразоваму рашэнню. Ён патрабуе больш цярпення, чым іншыя метады, але спрыяе наймацнейшай прыхільнасці.</p><p> Гэты шаблон па змаўчанні ўключае опцыю <strong>блакавання</strong> . Блакіроўка падыходзіць не для кожнай групы — яна можа быць спрэчнай або выкарыстоўвацца няправільна. Калі вы не выкарыстоўваеце блакіроўку ў працэсе прыняцця рашэнняў, рэкамендуем адрэдагаваць шаблон, каб выдаліць яе.</p>"
      process_introduction: <p>Дасягненне кансенсусу для прыняцця рашэння, каб дасягнуць пагаднення, якое задавальняе патрэбы і праблемы ўсіх удзельнікаў.</p><ul><li><p> Абмяркуйце і распрацуйце прапанову разам</p></li><li><p> Уключайце і паважайце ўсіх удзельнікаў</p></li><li><p> Дамагайцеся згоды большасці людзей</p></li></ul><p> <a target="_blank" href="https://help.loomio.com/en/guides/consensus_process/index.html">Даведайцеся больш пра працэс дасягнення кансенсусу</a> .</p>
