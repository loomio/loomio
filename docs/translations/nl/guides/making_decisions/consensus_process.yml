  223c90e3fe5b24d7:
    english: "> *“Consensus is the process – a participatory process by which a group thinks and feels together, en route to their decision.” - Sam Kaner, Community at Work*"
    translation: "> *“Consensus is het proces: een participatief proces waarin een groep samen denkt en voelt op weg naar een beslissing.” - Sam Kaner, Community at Work*"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9872b82ded022524:
    english: |-
      ## Key points
      - Discuss and develop a proposal together
      - Include and respect everyone involved
      - Seek agreement from most people
    translation: |-
      ## Kernpunten
      - Bespreek en ontwikkel samen een voorstel
      - Betrek en respecteer iedereen die betrokken is
      - Zoek overeenstemming bij de meeste mensen
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a1cd3fa440013e0c:
    english: "**Consensus is typically used in:**\n- Working teams building shared understanding of an issue or opportunity, collaborating on a proposal and deciding course of action. \n- Governance board decisions where the board shows it is acting jointly, such as decisions on vision, policy, strategic planning and budget.\n- AGMs and General Assemblies where members and stakeholders seek general agreement for major decisions, such as revisions to statutes, major transactions and the elections of directors or council members."
    translation: |-
      **Consensus wordt vaak gebruikt door:**
      - Teams die samen inzicht opbouwen in een probleem of kans, aan een voorstel werken en een aanpak kiezen.
      - Besturen die gezamenlijk beslissingen nemen, bijvoorbeeld over visie, beleid, strategische plannen en begrotingen.
      - Algemene ledenvergaderingen en andere algemene vergaderingen waar leden en belanghebbenden brede overeenstemming zoeken over belangrijke beslissingen, zoals statutenwijzigingen, grote transacties en de verkiezing van bestuurders of raadsleden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7c5d3122a1333ba5:
    english: |-
      **Typical roles:**
      - Appoint a facilitator.  In board meetings this is usually the Chairperson.
      - A quorum or supermajority of members to participate, as specified in the organization's statutes.
    translation: |-
      **Gebruikelijke rollen:**
      - Wijs een gespreksleider aan.  Bij bestuursvergaderingen is dit meestal de voorzitter.
      - Zorg dat het vereiste quorum of de vereiste gekwalificeerde meerderheid van de leden deelneemt, zoals vastgelegd in de statuten van de organisatie.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1d8ee54aa5e87423:
    english: |-
      ## Consensus process steps
      1. State the issue to be decided - start a Loomio **discussion**.
      2. Present a proposal to test for consensus - start a **Sense check proposal**.
      3. Clarify any points, invite constructive modifications and amend the proposal.
      4. Test for agreement - start a **Consensus proposal**.
      5. Outcome - state the decision **outcome**.
    translation: |-
      ## Stappen van het consensusproces
      1. Beschrijf de kwestie waarover een beslissing nodig is: start een **discussie** op Loomio.
      2. Presenteer een voorstel om de mate van overeenstemming te peilen: start een **voorstel voor een eerste peiling**.
      3. Verduidelijk onduidelijke punten, nodig mensen uit om verbeteringen voor te stellen en pas het voorstel aan.
      4. Toets of er overeenstemming is: start een **consensusvoorstel**.
      5. Conclusie: beschrijf de **conclusie** van de beslissing.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0b5249cfd4c92c35:
    english: |-
      ## Benefits
      - Grow shared understanding.
      - Decisions for the collective will of the group.
      - Encourage people to value the group over their personal preferences.
    translation: |-
      ## Voordelen
      - Bouw samen inzicht op.
      - Neem beslissingen die de gezamenlijke wil van de groep weerspiegelen.
      - Moedig mensen aan om het belang van de groep mee te wegen naast hun persoonlijke voorkeuren.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  55d7d6c48f056550:
    english: "## Applying the Consensus process on Loomio"
    translation: "## Het consensusproces toepassen op Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e50b473237140170:
    english: |-
      | **Consensus process** | **On Loomio** |
      |---|---|
      | You notice a problem or opportunity and take the initiative. |  |
      | **State the issue to be decided**  <br /><br />Provide background information and open a broad ranging discussion to build shared understanding. Look for emerging proposals. | Start a Loomio discussion <br /><br />Name the topic of discussion in the discussion title, and what you hope to achieve. <br /><br />Attach or link to background information. Invite people to ask questions, contribute information and write comments. |
      | **Present a proposal** <br /><br />Test for consensus. | Run a [Sense check proposal](/en/user_manual/polls/proposals/sense_check/). <br /><br />*In the title:* Name the proposal. <br /><br />*In the proposal details:* Clearly frame the proposal and say why it is important.  Include any background information necessary and a link to the proposal.  <br /><br />Invite everyone to respond, and to do so before the proposal closes.  |
      | **Amendment** <br /><br />Discuss, clarify and amend the proposal. <br /><br />Seek to understand and resolve any objections. <br /><br />Invite people objecting to to propose a constructive and practical modification to the proposed decision or course of action. | Facilitate discussion in the thread to address concerns and modify the proposal. |
      | **Agreement** <br /><br />Do you have an agreement?  Check for: <br /><br />Agreement: I support the proposal. <br /><br />Abstain: This decision does not affect me and I am happy with whatever the group decides. <br /><br />Disagreement: Something in the proposal needs to be changed before I can support it. <br /><br />Block: I have a fundamental disagreement with the proposal that cannot be resolved. | Run a [Consensus proposal](/en/user_manual/polls/proposals/consensus/) with the current proposal version. <br /><br />*In the title:* Name the decision to be made. <br /><br />*In the proposal details:* Present the proposal and invite people to vote. <br /><br />Include a clear statement of what agreement means, say 'for this proposal to pass, we need everyone to vote agree' or 'for this proposal to pass, we need 75% of members to agree'.  <br /><br />Ask participants to leave a vote 'Reason' - and if they do not agree to say why, and what needs to change for them to agree. <br /><br />Some organizations also use the Block (or veto) voting option. <br /><br />As voting progresses, respond to comments, post updates, close early, or let the proposal run to conclusion. <br /><br />Participants can *“change vote”* up to proposal close time, say in response to new information that arrives during voting. |
      | **Outcome** <br /><br />State if agreement was reached and the decision that has been made. <br /><br />Implement the decision and plan actions to be taken. | Consider voting results and state the decision made. <br /><br />Summarize results of the process and say what will happen next. <br /><br />If results are inconclusive, you may choose to re-open the discussion and run a new proposal. <br /><br />The outcome statement is an important record of the decision for future reference. |
    translation: |-
      | **Consensusproces** | **Op Loomio** |
      |---|---|
      | Je ziet een probleem of kans en neemt het initiatief. |  |
      | **Beschrijf de kwestie waarover een beslissing nodig is**  <br /><br />Geef achtergrondinformatie en start een brede discussie om samen inzicht op te bouwen. Let op voorstellen die daaruit ontstaan. | Start een discussie op Loomio. <br /><br />Noem het onderwerp van de discussie in de titel en geef aan wat je wilt bereiken. <br /><br />Voeg achtergrondinformatie toe of link ernaar. Nodig mensen uit om vragen te stellen, informatie te delen en reacties te schrijven. |
      | **Presenteer een voorstel** <br /><br />Peil de mate van overeenstemming. | Start een [voorstel voor een eerste peiling](/en/user_manual/polls/proposals/sense_check/). <br /><br />*In de titel:* Geef het voorstel een naam. <br /><br />*In de details van het voorstel:* Beschrijf het voorstel duidelijk en leg uit waarom het belangrijk is. Voeg de nodige achtergrondinformatie en een link naar het voorstel toe. <br /><br />Nodig iedereen uit om te reageren voordat het voorstel sluit. |
      | **Aanpassing** <br /><br />Bespreek, verduidelijk en wijzig het voorstel. <br /><br />Probeer bezwaren te begrijpen en op te lossen. <br /><br />Nodig mensen met bezwaren uit om een constructieve en uitvoerbare wijziging van de voorgestelde beslissing of aanpak aan te dragen. | Begeleid de discussie in de thread om zorgen te bespreken en het voorstel aan te passen. |
      | **Overeenstemming** <br /><br />Is er overeenstemming? Kijk naar: <br /><br />Eens: Ik steun het voorstel. <br /><br />Onthouden: Deze beslissing raakt mij niet en ik kan me vinden in wat de groep beslist. <br /><br />Oneens: Er moet iets in het voorstel veranderen voordat ik het kan steunen. <br /><br />Blokkeer: Ik heb een fundamenteel bezwaar tegen het voorstel dat niet kan worden opgelost. | Start een [consensusvoorstel](/en/user_manual/polls/proposals/consensus/) met de huidige versie van het voorstel. <br /><br />*In de titel:* Noem de beslissing die genomen moet worden. <br /><br />*In de details van het voorstel:* Presenteer het voorstel en nodig mensen uit om te stemmen. <br /><br />Leg duidelijk uit wat overeenstemming betekent. Schrijf bijvoorbeeld: ‘Dit voorstel wordt aangenomen als iedereen Eens stemt’ of ‘Dit voorstel wordt aangenomen als 75% van de leden Eens stemt’. <br /><br />Vraag deelnemers om een ‘Reden’ bij hun stem te schrijven. Als ze niet instemmen, vraag dan waarom en wat er moet veranderen voordat ze kunnen instemmen. <br /><br />Sommige organisaties gebruiken ook de stemoptie Blokkeer (een veto). <br /><br />Reageer tijdens de stemming op opmerkingen, plaats updates, sluit het voorstel eerder of laat het doorlopen tot de sluitingstijd. <br /><br />Deelnemers kunnen hun *“stem wijzigen”* totdat het voorstel sluit, bijvoorbeeld als tijdens de stemming nieuwe informatie beschikbaar komt. |
      | **Conclusie** <br /><br />Beschrijf of er overeenstemming is bereikt en welke beslissing is genomen. <br /><br />Voer de beslissing uit en plan de vervolgstappen. | Bekijk de stemresultaten en beschrijf de genomen beslissing. <br /><br />Vat de resultaten van het proces samen en vertel wat er hierna gebeurt. <br /><br />Als de resultaten geen duidelijk antwoord geven, kun je de discussie heropenen en een nieuw voorstel starten. <br /><br />De conclusie legt de beslissing vast voor later gebruik. |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
