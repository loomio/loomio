  185f80d66c2091d8:
    english: "### Notified"
    translation: "### Notificado"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  885a21cbc1a44f7d:
    english: "**Notified** opens the discussion notification history. It includes invitations, mentions, and replies, showing who was notified and whether each notification has been read when that information is available."
    translation: "**Notificado** abre o histórico de notificações da discussão. Ele inclui convites, menções e respostas. Mostra quem recebeu cada notificação e, quando essa informação está disponível, se ela foi lida."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
