  e6670b54039f316a:
    english: Compare the number of votes issued to each person with the number they cast, see missed votes, and identify people who cast every vote issued to them. A person with no issued votes is not shown as having cast all votes. Anonymous polls are excluded because an anonymous ballot must not be associated with the person who cast it.
    translation: Hasonlítsd össze, hogy egy személy hány szavazási felhívást kapott és hány szavazatot adott le. Láthatod az elmulasztott szavazatokat, és azt is, ki szavazott minden alkalommal, amikor erre felkérték. Ha valaki nem kapott szavazási felhívást, a jelentés nem jelöli úgy, hogy minden alkalommal szavazott. A névtelen szavazások nem szerepelnek itt, mert a névtelen szavazatot nem szabad a leadójához kapcsolni.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  252da2b72775c4f8:
    english: Use **Delegates only** to review the voting record of current delegates. The CSV download uses the same name and delegate filters.
    translation: Használd a **Csak küldöttek** szűrőt a jelenlegi küldöttek szavazási adatainak megtekintéséhez. A CSV-letöltésre ugyanazok a név- és küldöttszűrők vonatkoznak.
    status: machine
