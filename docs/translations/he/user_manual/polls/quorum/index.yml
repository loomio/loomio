  a79abb23e8e1c82f:
    english: A quorum is the minimum percentage of eligible voters who must participate for a poll to be valid. Use it when your governance process requires a particular level of participation.
    translation: מניין השתתפות הוא שיעור ההשתתפות המזערי של בעלי זכות ההצבעה הדרוש כדי שמשאל יהיה תקף. ניתן להשתמש בו כאשר תהליך קבלת ההחלטות מחייב שיעור השתתפות מסוים.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d83e75068f697f6f:
    english: When creating a poll, open **More settings** and enter the required percentage in **Participation quorum**. Leave the field blank when no quorum is required.
    translation: בעת יצירת משאל, יש לפתוח את **הגדרות נוספות** ולהזין את האחוז הנדרש בשדה **מניין ההשתתפות**. אם אין דרישה למניין השתתפות, יש להשאיר את השדה ריק.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a04b99724fe62a56:
    english: "![The Quorum setting with a 60 percent participation quorum](./quorum-section.png)"
    translation: "![הגדרת מניין השתתפות בשיעור של 60 אחוז](./quorum-section.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  432f570094ad5b24:
    english: You can also set a quorum in a [poll template](/en/user_manual/polls/poll_templates/) so that polls created from that template use it by default.
    translation: ניתן גם להגדיר מניין השתתפות ב[תבנית משאל](/en/user_manual/polls/poll_templates/), כך שהוא יחול כברירת מחדל על משאלים שנוצרים מהתבנית.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  52841ec4c6253973:
