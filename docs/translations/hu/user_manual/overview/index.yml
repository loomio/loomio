    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b08a2d6a44f0d7ac:
    english: The best way to learn about Loomio is to [start a free trial](/try)
    translation: A Loomiót úgy ismerheted meg a legjobban, ha [elindítasz egy ingyenes próbaidőszakot](/try)
    status: machine
    provider: codex/gpt-6-sol
