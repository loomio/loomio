    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f64bc40a8142367d:
    english: Send credentials only in the `Authorization` header. API keys in query strings or request bodies are rejected.
    translation: 認証情報は `Authorization` ヘッダーでのみ送信します。クエリ文字列やリクエスト本文に含めた API キーは拒否されます。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
