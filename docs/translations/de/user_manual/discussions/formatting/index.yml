    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c9b191938d57a135:
    english: Select the text to format and click on the required format tool.
    translation: Wähle den Text aus, den du formatieren möchtest, und klicke auf das passende Werkzeug.
    status: machine
    provider: codex/gpt-6-sol
