  a79abb23e8e1c82f:
    english: A quorum is the minimum percentage of eligible voters who must participate for a poll to be valid. Use it when your governance process requires a particular level of participation.
    translation: Le quorum est le pourcentage minimum de personnes habilitées à voter qui doivent participer pour qu’un sondage soit valide. Utilisez-le lorsque votre processus de décision exige un certain niveau de participation.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d83e75068f697f6f:
    english: When creating a poll, open **More settings** and enter the required percentage in **Participation quorum**. Leave the field blank when no quorum is required.
    translation: Lors de la création d’un sondage, ouvrez **Plus de paramètres** et saisissez le pourcentage requis dans **Quorum de participation**. Laissez le champ vide si aucun quorum n’est requis.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a04b99724fe62a56:
    english: "![The Quorum setting with a 60 percent participation quorum](./quorum-section.png)"
    translation: "![Le paramètre de quorum avec un quorum de participation de 60 %](./quorum-section.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  432f570094ad5b24:
    english: You can also set a quorum in a [poll template](/en/user_manual/polls/poll_templates/) so that polls created from that template use it by default.
    translation: Vous pouvez aussi définir un quorum dans un [modèle de sondage](/en/user_manual/polls/poll_templates/). Les sondages créés à partir de ce modèle l’utiliseront par défaut.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
