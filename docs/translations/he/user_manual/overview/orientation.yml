  b7b09881cc3060b1:
    english: |-
      - Read [How to participate](/en/user_manual/overview/how-to-participate) to learn how to comment, reply, react, and vote.
      - Read [Finding content](/en/user_manual/overview/finding-content) to learn how to locate discussions and decisions.
      - Visit [Discussions](/en/user_manual/discussions) or [Proposals and polls](/en/user_manual/polls/intro_to_decisions) for detailed guidance.
    translation: |-
      - כדאי לקרוא את [איך משתתפים](/en/user_manual/overview/how-to-participate) כדי ללמוד איך להגיב, להשיב, להוסיף תגובה מהירה ולהצביע.
      - כדאי לקרוא את [איתור תוכן](/en/user_manual/overview/finding-content) כדי ללמוד איך למצוא דיונים והחלטות.
      - להנחיות מפורטות, אפשר לעבור אל [דיונים](/en/user_manual/discussions) או אל [הצעות וסקרים](/en/user_manual/polls/intro_to_decisions).
