---
navigation_title: Mensen uitnodigen
blocks:
  47820acef0cf3fe9:
    english: "# Inviting people"
    translation: "# Mensen uitnodigen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6a2bc749ec2883c0:
    english: Go to your group page and click the **Members** tab to access member management.
    translation: Ga naar je groepspagina en klik op het tabblad **Leden** om de leden te beheren.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7fc9a792512e50bb:
    english: You can **Invite** particular people to your group with their email address or **Share** a link to your group via email, newsletter, chat or from your website.
    translation: Je kunt mensen via hun e-mailadres **Uitnodigen** voor je groep of een link naar je groep **Delen** via e-mail, een nieuwsbrief, chat of je website.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3fc7875402babd63:
    english: "## Send invitations via email"
    translation: "## Uitnodigingen per e-mail versturen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4e91c3f036e94808:
    english: Click **Invite** on the **Members** tab to send an email containing a single-use invitation link. The recipient can create a Loomio user account and join your group.
    translation: Klik op **Uitnodigen** op het tabblad **Leden** om een e-mail met een eenmalige uitnodigingslink te versturen. De ontvanger kan een Loomio-account aanmaken en lid worden van je groep.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  37a98960a11df300:
    english: If the recipient already has a Loomio user account they can still accept the invitation to join your group with their existing account.
    translation: Als de ontvanger al een Loomio-account heeft, kan die de uitnodiging accepteren met het bestaande account.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c40b8865bc90ab0b:
    english: "### Invite many at once"
    translation: "### Meerdere mensen tegelijk uitnodigen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f92bf789ad23e4c3:
    english: You can send invitations by email to up to 100 people at a time by entering (or copy/pasting) multiple email addresses into the "Who would you like to invite" box. Separate email addresses by comma or space.
    translation: Je kunt maximaal 100 mensen tegelijk per e-mail uitnodigen. Typ of plak meerdere e-mailadressen in het veld "Wie wil je uitnodigen?". Scheid de adressen met komma's of spaties.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1e8ea8567d051081:
    english: When inviting people to a group within an organization, the parent group and related subgroups you belong to appear as audience suggestions. Select a group, then select its chip to expand the audience into individual people. You can remove anyone you do not want to invite before sending the invitations. People who already belong to the destination group are excluded.
    translation: Als je mensen uitnodigt voor een groep binnen een organisatie, verschijnen de hoofdgroep en de bijbehorende subgroepen waarvan je lid bent als suggesties. Selecteer een groep en klik daarna op het label van die groep om de afzonderlijke personen te tonen. Je kunt mensen uit de lijst verwijderen voordat je de uitnodigingen verstuurt. Mensen die al lid zijn van de groep waarvoor je uitnodigt, worden uitgesloten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  23c96c665ed9ad1c:
    english: |-
      >[!Tip]
      >Copy email addresses from a column in a Google or Excel spreadsheet, and paste into the invitation box.
    translation: |-
      >[!Tip]
      >Kopieer e-mailadressen uit een kolom in een Google- of Excel-spreadsheet en plak ze in het uitnodigingsveld.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  697177b4211a5479:
    english: When you click **Invite** an email will be sent to each of the email addresses you supplied, containing a unique invitation link that can only be used once. This email will be sent in your current language.
    translation: Als je op **Uitnodigen** klikt, ontvangt elk opgegeven e-mailadres een e-mail met een unieke uitnodigingslink die maar één keer kan worden gebruikt. De e-mail wordt verstuurd in de taal die je op dat moment gebruikt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bcce66d3fb6f6b8e:
    english: "### Invite people to Subgroups"
    translation: "### Mensen uitnodigen voor subgroepen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e422dfc71ef2fe0:
    english: Following the same process as above, you can invite people to a 'parent' group, and one or more subgroups simultaneously when you invite them with the **Invite people** button. Tick the boxes next to the subgroups you want them to immediately be a part of when they join the group.
    translation: Op dezelfde manier kun je mensen tegelijk uitnodigen voor een hoofdgroep en een of meer subgroepen via de knop **Mensen uitnodigen**. Vink de subgroepen aan waarvan ze meteen lid moeten worden wanneer ze zich bij de groep aansluiten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  87f0b0c3281b6228:
    english: "## Share a link to your group"
    translation: "## Een link naar je groep delen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2f014bdf9b719ec0:
    english: You can share a link to your group with the **Share** button. This is useful if you want to send a link via email, newsletter, chat or post on your website.
    translation: Met de knop **Delen** kun je een link naar je groep delen via e-mail, een nieuwsbrief, chat of je website.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  18ff20426c02846e:
    english: Click on the "copy" icon to copy the link to your clipboard, then paste in your email, newsletter or chat channel.
    translation: Klik op het pictogram "kopiëren" om de link naar je klembord te kopiëren. Plak de link daarna in je e-mail, nieuwsbrief of chatkanaal.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c6506b3c529f683c:
    english: If you want to stop people from joining via this link, click "Reset this link". The existing link will no longer work and a new link will be created.
    translation: Wil je voorkomen dat mensen via deze link lid worden? Klik dan op "Deze link opnieuw instellen". De bestaande link werkt daarna niet meer en er wordt een nieuwe link aangemaakt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6d57daddf1df6a2d:
    english: "## Request to join group"
    translation: "## Verzoeken om lid te worden van een groep"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  70b9af34b3bc2a9e:
    english: People can request to join an Open or Closed group. Share the group URL, such as `https://www.loomio.com/group-name`. When people arrive at the group page, they can see the public group information and select **Join group** to answer the joining prompt and send their request.
    translation: Mensen kunnen verzoeken om lid te worden van een open of besloten groep. Deel de groeps-URL, bijvoorbeeld `https://www.loomio.com/group-name`. Op de groepspagina kunnen ze de openbare groepsinformatie bekijken en **Word lid van de groep** selecteren om de aanmeldvraag te beantwoorden en hun verzoek te versturen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a5534ae2aba161ba:
    english: The joining prompt gives people a chance to introduce themselves and explain why they want to join.
    translation: De aanmeldvraag geeft mensen de gelegenheid zich voor te stellen en uit te leggen waarom ze lid willen worden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bb13bbdbfd6da80b:
    english: Under [Group privacy](/en/user_manual/groups/settings/privacy#how-people-join), choose **Request approval** to require requests to be reviewed. You can also customize the joining prompt in the group settings.
    translation: Kies onder [Groepsprivacy](/en/user_manual/groups/settings/privacy#how-people-join) de optie **Goedkeuring aanvragen** als verzoeken eerst beoordeeld moeten worden. Je kunt de aanmeldvraag ook aanpassen in de groepsinstellingen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5b0e7c47a0518a3e:
    english: "### Review membership requests"
    translation: "### Lidmaatschapsverzoeken beoordelen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d4a03352457d41cb:
    english: 'Group administrators and members with permission to add members review requests from the **Membership requests** section of the **Members** tab. A reviewer can:'
    translation: 'Groepsbeheerders en leden die leden mogen toevoegen, beoordelen verzoeken in het gedeelte **Lidmaatschapsverzoeken** van het tabblad **Leden**. Zij kunnen:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  84c6d641f9dba801:
    english: |-
      - **Approve** the request to add the applicant as a member and notify them.
      - **Ignore** the request to close it without notifying the applicant or allowing another request.
      - **Decline** the request with a message explaining the decision. Loomio sends the message to the applicant by email and notification, and they can submit a new request.
    translation: |-
      - Het verzoek **Goedkeuren** om de aanvrager lid te maken en daarvan op de hoogte te stellen.
      - Het verzoek **Negeer** om het te sluiten zonder de aanvrager op de hoogte te stellen of een nieuw verzoek toe te staan.
      - Het verzoek **Afwijzen** met een bericht waarin de beslissing wordt uitgelegd. Loomio stuurt het bericht per e-mail en melding naar de aanvrager. Die kan daarna een nieuw verzoek indienen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b1de5132fa942ba8:
    english: Select the decline button to write a message or ignore the request.
    translation: Selecteer de knop om het verzoek af te wijzen als je een bericht wilt schrijven, of negeer het verzoek.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a87e3fdd4ce43ee9:
    english: "## Managing invitations"
    translation: "## Uitnodigingen beheren"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  84dc2f66c60f3237:
    english: To manage invitations, open the filter/ drop down from the Members tab of your Group page and select **Invitations**. You can manage individual invitations by clicking the three dot menu (**⋮**) to the right of the member.
    translation: Open de keuzelijst met filters op het tabblad Leden van je groepspagina en selecteer **Uitnodigingen**. Je kunt een uitnodiging beheren via het menu met drie puntjes (**⋮**) rechts van de persoon.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c8d12991b8edb22f:
    english: You can also make people administrators or set their title (e.g. "IT Support") within the group before they accept their invitation.
    translation: Je kunt mensen ook beheerder maken of hun een titel geven binnen de groep, bijvoorbeeld "IT-ondersteuning", voordat ze hun uitnodiging accepteren.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e8aec784f84451cc:
    english: "### Re-send invitations"
    translation: "### Uitnodigingen opnieuw versturen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c201c2b360b1877:
    english: Follow up on people who don't make it into the group and give them a nudge. If someone has lost or forgotten about their invitation email, you can re-send it from the dropdown menu beside their name on the Members page.
    translation: Je kunt mensen die nog geen lid zijn geworden een herinnering sturen. Als iemand de uitnodigingsmail kwijt is of is vergeten, kun je de uitnodiging opnieuw versturen via de keuzelijst naast de naam op de pagina Leden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8b4674400f9a3f09:
    english: Click on the three dots (**⋮**) next to the person you want to resend the invitation to, and then choose **Resend invitation**.
    translation: Klik op de drie puntjes (**⋮**) naast de persoon en kies **Uitnodiging opnieuw sturen**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  abc5a934440fb8e1:
    english: |-
      ### Cancelling invitations
      If you entered the wrong email address, or have changed your mind about inviting someone, you can cancel an invitation from the Members tab on your Group page. Select **Cancel Invitation** from the drop down menu to the right of the member invitation (**⋮**).
    translation: |-
      ### Uitnodigingen annuleren
      Als je een verkeerd e-mailadres hebt ingevoerd of iemand toch niet wilt uitnodigen, kun je de uitnodiging annuleren via het tabblad Leden op je groepspagina. Selecteer **Annuleer uitnodiging** in de keuzelijst rechts van de uitnodiging (**⋮**).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
