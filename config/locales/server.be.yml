        confirm: Пацвердзіць аб'яднанне
        body_html: "<p>Калі ласка, пацвердзіце, што вы жадаеце аб'яднаць уліковы запіс пад <strong>%{source_email}</strong> з уліковым запісам пад <strong>%{target_email}</strong> .</p><p> Ваш уліковы запіс пад адрасам <strong>%{source_email}</strong> будзе выдалены, і пасля гэтага вы зможаце ўвайсці ў сістэму толькі праз <strong>%{target_email}</strong> .</p><p> Гэта змяненне незваротнае.</p>"
