---
navigation_title: Прапановы і апытанні
blocks:
  68e2a02de493acf3:
    english: "# Proposals and polls"
    translation: "# Прапановы і апытанні"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ff07fce3bab705aa:
    english: Proposals and polls collect structured responses from a group. They can help test an idea, make a decision, identify priorities, schedule a meeting, or elect representatives.
    translation: Прапановы і апытанні дапамагаюць групе сабраць адказы ў пэўным фармаце. З іх дапамогай можна праверыць ідэю, прыняць рашэнне, вызначыць прыярытэты, прызначыць сустрэчу або абраць прадстаўнікоў.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f031d2644fee2a91:
    english: "## Find the right help"
    translation: "## Знайдзіце патрэбны раздзел"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  34039c79ea769793:
    english: 'These parts of the manual answer different questions:'
    translation: 'Гэтыя раздзелы даведніка адказваюць на розныя пытанні:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  34ea9d58ccbf80fb:
    english: |-
      | If you want to… | Read… |
      |---|---|
      | Choose what participants should express | [Proposals](../proposals/) or [Polls](../proposal_types/) |
      | Run a specific proposal template | [Sense check](../proposals/sense_check/), [Advice](../proposals/advice/), [Consent](../proposals/consent/), or [Consensus](../proposals/consensus/) |
      | Configure the templates available to a group | [Poll templates](../poll_templates/) |
      | Facilitate a decision from discussion to outcome | [Making decisions](/en/guides/making_decisions/) |
    translation: |-
      | Калі вы хочаце… | Чытайце… |
      |---|---|
      | Вызначыць, што ўдзельнікі павінны выказаць | [Прапановы](../proposals/) або [Апытанні](../proposal_types/) |
      | Правесці галасаванне паводле пэўнага шаблону прапановы | [Праверка меркаванняў](../proposals/sense_check/), [Парада](../proposals/advice/), [Згода](../proposals/consent/) або [Кансенсус](../proposals/consensus/) |
      | Наладзіць шаблоны, даступныя групе | [Шаблоны апытанняў](../poll_templates/) |
      | Дапамагчы групе прайсці шлях ад абмеркавання да высновы | [Прыняцце рашэнняў](/en/guides/making_decisions/) |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7eddb057cca077f4:
    english: A **voting method** defines how people respond and how results are calculated. A **poll template** is a reusable configuration built on a voting method, with preset instructions, options, and settings. A **decision process** may use a discussion and several templates before the group reaches an outcome.
    translation: "**Спосаб галасавання** вызначае, як людзі адказваюць і як падлічваюцца вынікі. **Шаблон апытання** — гэта канфігурацыя на аснове спосабу галасавання, якую можна выкарыстоўваць паўторна. Яна ўтрымлівае загадзя зададзеныя інструкцыі, варыянты адказу і налады. **Працэс прыняцця рашэння** можа ўключаць абмеркаванне і некалькі шаблонаў, перш чым група прыйдзе да высновы."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3cd46aa2f1240e88:
    english: "## Proposals"
    translation: "## Прапановы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  85a55fccaf4e4032:
    english: 'A proposal asks people to respond to a statement or course of action. Loomio includes templates for common purposes:'
    translation: 'Прапанова просіць людзей выказацца наконт сцвярджэння або плана дзеянняў. У Loomio ёсць шаблоны для распаўсюджаных задач:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  51bf1ffa7d057d9e:
    english: |-
      - [Sense check](../proposals/sense_check/) gathers early reactions;
      - [Advice](../proposals/advice/) gathers input for a decision maker;
      - [Consent](../proposals/consent/) tests for meaningful objections; and
      - [Consensus](../proposals/consensus/) seeks collective agreement.
    translation: |-
      - [Праверка меркаванняў](../proposals/sense_check/) збірае першыя водгукі;
      - [Парада](../proposals/advice/) збірае меркаванні для тых, хто прымае рашэнне;
      - [Згода](../proposals/consent/) дапамагае выявіць істотныя пярэчанні; і
      - [Кансенсус](../proposals/consensus/) дапамагае дасягнуць агульнай згоды.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d01e9f85fcd2d9c2:
    english: See [Proposals](../proposals/) to compare them.
    translation: Параўнайце іх у раздзеле [Прапановы](../proposals/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  821dcd89b5460804:
    english: "## Polls"
    translation: "## Апытанні"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ec746235c7fe89c4:
    english: 'Use a poll when participants need to select, score, allocate, rank, state their availability, or cast an election ballot:'
    translation: 'Выкарыстоўвайце апытанне, калі ўдзельнікам трэба выбраць, ацаніць або ранжыраваць варыянты, размеркаваць балы, пазначыць даступны час ці прагаласаваць на выбарах:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b93f9fe9611d9205:
    english: |-
      - [Choose](../choose/) finds popular options;
      - [Score](../score/) evaluates every option on a scale;
      - [Allocate](../allocate/) distributes a limited budget of points;
      - [Rank](../rank/) finds an overall order of preference;
      - [Time poll](../meeting_polls/) finds when people are available; and
      - [STV Election](../stv/) elects multiple winners proportionally.
    translation: |-
      - [Выбар](../choose/) дапамагае знайсці папулярныя варыянты;
      - [Ацэнка](../score/) дазваляе ацаніць кожны варыянт па шкале;
      - [Размеркаванне балаў](../allocate/) дазваляе размеркаваць абмежаваную колькасць балаў;
      - [Ранжыраванне](../rank/) дапамагае вызначыць агульны парадак пераваг;
      - [Апытанне пра час](../meeting_polls/) дапамагае высветліць, калі людзі могуць сустрэцца; і
      - [Выбары STV](../stv/) дазваляюць прапарцыйна абраць некалькіх прадстаўнікоў.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9972b34ccc3ea79b:
    english: See [Polls](../proposal_types/) to compare them.
    translation: Параўнайце іх у раздзеле [Апытанні](../proposal_types/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5890626db6dcbb68:
    english: "## Start a proposal or poll"
    translation: "## Пачніце прапанову або апытанне"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4b5338cae269fd32:
    english: "### Choose whether to use a discussion"
    translation: "### Вырашыце, ці патрэбна абмеркаванне"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c45fe8ff31f71486:
    english: Start the proposal or poll inside a discussion when people need context, questions, or conversation before responding. A discussion can contain several proposals over time, keeping amendments and the eventual outcome together as one record of the topic.
    translation: Пачніце прапанову або апытанне ў абмеркаванні, калі перад адказам людзям патрэбны кантэкст, магчымасць задаць пытанні або пагаварыць. З часам у адным абмеркаванні можа быць некалькі прапаноў. Так папраўкі і канчатковая выснова застануцца разам у адным запісе па тэме.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0bb2a90f8f9dad0c:
    english: Run a standalone poll when the discussion has already happened elsewhere, such as at a meeting, or when the question is simple and you only need to collect responses. Include enough detail or a link to the relevant record so voters understand what they are responding to.
    translation: Правядзіце асобнае апытанне, калі абмеркаванне ўжо адбылося ў іншым месцы, напрыклад на сустрэчы, або калі пытанне простае і вам трэба толькі сабраць адказы. Дадайце дастаткова падрабязнасцей або спасылку на адпаведны запіс, каб людзі разумелі, на што адказваюць.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7d50445f0c54190d:
    english: "### In a discussion"
    translation: "### У абмеркаванні"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  05e03f7ee0e1b4dc:
    english: Open the discussion, scroll to the reply area, select **Start a vote**, and choose a template.
    translation: Адкрыйце абмеркаванне, пракруціце да поля адказу, націсніце **Пачаць галасаванне** і выберыце шаблон.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  55dc0481a5c4ecb6:
    english: "### Without a discussion"
    translation: "### Без абмеркавання"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  af5fd115de5f7aec:
    english: Open the **Polls** tab on the group page, select **New poll**, and choose a template.
    translation: На старонцы групы адкрыйце ўкладку **Апытанні**, націсніце **Новае апытанне** і выберыце шаблон.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  23479ea263004d4a:
    english: If you create a discussion and poll at the same time only to run a vote, avoid notifying people twice. Start the discussion without notifying them and use the poll invitation, or run the poll without a discussion.
    translation: Калі вы адначасова ствараеце абмеркаванне і апытанне толькі дзеля галасавання, не дасылайце людзям два апавяшчэнні. Стварыце абмеркаванне без апавяшчэння і запросіце людзей праз апытанне або правядзіце апытанне без абмеркавання.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  31f857d230319a3c:
    english: "## What happens next"
    translation: "## Што будзе далей"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fb709a76dfeabd4f:
    english: When starting a proposal or poll, you provide a title and details, review its response options and settings, set a closing time, and invite participants. While it is open, participants can vote, explain their response, and change their vote. Results update as votes are submitted, subject to the poll's result-visibility setting.
    translation: Калі вы пачынаеце прапанову або апытанне, укажыце назву і падрабязнасці, праверце варыянты адказу і налады, задайце час закрыцця і запросіце ўдзельнікаў. Пакуль галасаванне адкрытае, удзельнікі могуць галасаваць, тлумачыць свой выбар і змяняць голас. Вынікі абнаўляюцца пасля падачы галасоў з улікам налады бачнасці вынікаў.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  acd2e813b56034a0:
    english: When it closes, publish an [outcome](../outcomes/) that records what the result means and what will happen next.
    translation: Калі галасаванне закрыецца, апублікуйце [выснову](../outcomes/), у якой патлумачце значэнне выніку і далейшыя дзеянні.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
