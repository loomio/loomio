  be27d7d85647e400:
    english: "# Governance practices and approaches"
    translation: "# Практики и подходы к управлению"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3242767a5e393028:
    english: Good governance includes establishing, reviewing and challenging governance practices, policies and procedures to continously improve board effectiveness.
    translation: Эффективное управление требует разрабатывать, пересматривать и критически оценивать практики, правила и процедуры. Это помогает постоянно повышать эффективность работы совета.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c4d8cb7f7eb901a6:
    english: However many boards are short on time and often weighed down by board papers, compliance and risk, without sufficient time to discuss and debate critical strategy and performance issues.
    translation: Однако многим советам не хватает времени. Работа с документами, соблюдение требований и управление рисками часто не оставляют достаточно времени для обсуждения важных вопросов стратегии и результатов работы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  eb59655c49bf902d:
    english: "## On Loomio\nLoomio offers the opportunity to work online on a document, policy or procedure.  Discussion and decisions are contained in a thread that members can access when and wherever works for them.  "
    translation: |-
      ## В Loomio
      В Loomio можно совместно работать над документом, правилами или процедурой онлайн. Обсуждение и решения остаются в теме, к которой участники могут обращаться в удобное для них время из любого места.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a0d6426929e39b38:
    english: 'Use a **thread** for each document, policy or procedure. The thread is the container for discussion, and holds document drafts and subsequent versions of the document.  '
    translation: Используйте отдельную **тему** для каждого документа, набора правил или процедуры. В теме ведётся обсуждение, хранятся черновики и последующие версии документа.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  551c5aac67b42167:
    english: With a Loomio thread, you can organize so that the 2-3 people working on the document text are discussing particulars in the thread.  The thread could be private amongst just those 2-3 people, or run openly in the group so that the work is transparent to all members.
    translation: Если над текстом документа работают 2–3 человека, они могут обсуждать детали в теме Loomio. Доступ к теме можно ограничить этими людьми или открыть её для всей группы, чтобы все участники видели ход работы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1400a6d44d7d4e35:
    english: When the document reaches a draft version, use a **Sense check poll** to notify members that the draft document is ready for review, and invite members to read the document and respond with any comments or questions.  As well as letting everyone know that the work is progressing, the poll closing date encourages people to participate.
    translation: Когда черновик будет готов, создайте **опрос для проверки мнений**. Сообщите участникам, что документ готов к рассмотрению, и предложите им прочитать его и оставить комментарии или вопросы. Так все узнают о ходе работы, а дата закрытия опроса поможет собрать ответы вовремя.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  44bcb71608c8f14a:
    english: The document may require several draft iterations.
    translation: Документ может пройти несколько этапов доработки.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a5371854b689874a:
    english: When a 'final' draft is ready, raise a **Proposal** to approve the document.
    translation: Когда окончательный черновик будет готов, создайте **Предложение** об утверждении документа.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5998c94bd5b640ab:
    english: Loomio enables a board to progress work on governance improvement between meetings without eating into precious time in meetings.
    translation: Loomio помогает совету работать над улучшением управления между заседаниями и сохранять время заседаний для других вопросов.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
