    translated_on: '2026-09-29'
  59121c87e06e34d0:
    english: The bell button at the top right opens your in-app notifications. A badge appears when you have notifications you have not viewed.
    translation: כפתור הפעמון בפינה השמאלית העליונה פותח את ההתראות בתוך האפליקציה. כשיש התראות שטרם נצפו, מופיע סימון על הכפתור.
    status: machine
