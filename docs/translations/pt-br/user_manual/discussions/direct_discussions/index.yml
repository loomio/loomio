  5a0b9426a2d88e62:
    english: |-
      ## Contacting someone via a direct discussion
      A direct discussion can be used to contact one or more people privately without creating a subgroup.
    translation: |-
      ## Entrar em contato por meio de uma discussão direta
      Você pode usar uma discussão direta para entrar em contato com uma ou mais pessoas em particular, sem criar um subgrupo.
