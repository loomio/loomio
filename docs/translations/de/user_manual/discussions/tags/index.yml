      Nur Admins einer Hauptgruppe können Schlagwörter umbenennen, ihre Farbe ändern, sie zusammenführen oder löschen. Diese
      Änderungen gelten für die gesamte Organisation einschließlich ihrer Untergruppen.
    status: machine
