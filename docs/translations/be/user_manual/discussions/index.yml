---
navigation_title: Абмеркаванні
blocks:
  f087c06a5f4ab2e6:
    english: "# Intro to Discussions"
    translation: "# Уводзіны ў абмеркаванні"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f515c87a8d1d20c7:
    english: Loomio discussions are where you can share information, discuss topics, and make decisions with your group.  People participate by posting comments and replies.
    translation: У абмеркаваннях Loomio вы можаце дзяліцца інфармацыяй, абмяркоўваць тэмы і прымаць рашэнні разам са сваёй групай. Людзі ўдзельнічаюць, пакідаючы каментарыі і адказы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  eede89b6ce4f357d:
    english: |-
      - All info about a topic is in one easily accessible place.
      - People can reply via email and their comments appear in the discussion.
      - You can see who has read the discussion and who needs a nudge.
      - There is a record of discussion you can easily find again.
    translation: |-
      - Уся інфармацыя па тэме знаходзіцца ў адным лёгкадаступным месцы.
      - Людзі могуць адказваць па электроннай пошце, і іх каментарыі з’явяцца ў абмеркаванні.
      - Вы можаце бачыць, хто прачытаў абмеркаванне, а каму варта нагадаць пра яго.
      - Запіс абмеркавання можна лёгка знайсці пазней.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9cb2eb404b59208b:
    english: Discussions have a wide range of uses - from a general discussion forum to running specific work-flow and decision-making processes.
    translation: 'Абмеркаванні падыходзяць для розных задач: ад агульнага абмену думкамі да арганізацыі працоўных працэсаў і прыняцця рашэнняў.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  87a95605052570ca:
    english: For example, you may frame a discussion on a particular topic, invite people to contribute their thoughts and share information, and facilitate progress towards an agreed outcome.
    translation: Напрыклад, вы можаце пачаць абмеркаванне пэўнай тэмы, запрасіць людзей падзяліцца думкамі і інфармацыяй і дапамагчы групе прыйсці да ўзгодненай высновы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ce6e6734c595d968:
    english: Or you may invite people to participate in a particular decision, using a consent or advice decision-making process.
    translation: Вы таксама можаце запрасіць людзей да прыняцця пэўнага рашэння праз працэс, заснаваны на згодзе або парадах.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7fa58cb3ba95be0b:
    english: Discussions can also contain polls and proposals to help progress a discussion to an outcome. As people comment in the discussion and vote in polls, a discussion timeline builds so you can easily find key milestones.
    translation: Абмеркаванне можа змяшчаць апытанні і прапановы, якія дапамагаюць прыйсці да высновы. Калі людзі пакідаюць каментарыі і галасуюць у апытаннях, фарміруецца храналогія абмеркавання, у якой лёгка знайсці важныя этапы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  388e829e86a99bd8:
    english: "![The Returnable bottles for cafe customers discussion, with a comment and a proposal](discussion-example.png)"
    translation: "![Абмеркаванне зваротных бутэлек для наведвальнікаў кавярні з каментарыем і прапановай](discussion-example.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6b0556376d31b63e:
    english: "## Common uses"
    translation: "## Як выкарыстоўваць абмеркаванні"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cf4344b3f2a3b7e9:
    english: 'Here are some common uses of discussions:'
    translation: 'Вось некалькі распаўсюджаных спосабаў выкарыстоўваць абмеркаванні:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '0479bd2337b02443':
    english: "### Boards and Governance"
    translation: "### Кіраўнічыя рады і кіраванне"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5b0a3e2c653d47f8:
    english: "**Prepare for a meeting** - Build an agenda, post board papers and organize administrative matters so everyone is up to date, in context and prepared. "
    translation: "**Падрыхтуйцеся да сустрэчы** - Складзіце парадак дня, размясціце матэрыялы для рады і вырашыце арганізацыйныя пытанні, каб усе ведалі кантэкст і маглі падрыхтавацца."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5c1c6aa79c3556dc:
    english: "**Pass a resolution** - Post context and background information, respond to questions and raise a proposal to pass a resolution. "
    translation: "**Прыняць рэзалюцыю** - Размясціце кантэкст і даведачную інфармацыю, адкажыце на пытанні і стварыце прапанову аб прыняцці рэзалюцыі."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  07ae9c6a1f0a32d0:
    english: "**Discuss an agenda item on Loomio** - Start discussion about an agenda item prior to your meeting. Or, if you run out of time in the meeting, move the discussion on to Loomio."
    translation: "**Абмеркаваць пункт парадку дня ў Loomio** - Пачніце абмеркаванне пункта парадку дня да сустрэчы. Калі на сустрэчы не хопіць часу, працягніце абмеркаванне ў Loomio."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f0b0de7094b1cfc9:
    english: "**Approve minutes and track actions** - Post minutes and assign actions. Use a poll to approve minutes. "
    translation: "**Зацвердзіць пратакол і сачыць за выкананнем задач** - Размясціце пратакол і прызначце адказных за задачы. Выкарыстоўвайце апытанне, каб зацвердзіць пратакол."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ba7cf177191baadb:
    english: "### Member participation"
    translation: "### Удзел членаў групы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3cf51f837c0a3e9f:
    english: "**Share news (replace mailing list)** - Post information for members, invite comments."
    translation: "**Дзяліцца навінамі (замест спіса рассылкі)** - Размяшчайце інфармацыю для членаў групы і запрашайце іх каментаваць."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d2cd391b61042129:
    english: "**Organize an event** - Work with your organizing team on details. Keep all discussion and info within the thread. Then announce the event to wider membership."
    translation: "**Арганізаваць мерапрыемства** - Абмяркоўвайце дэталі з камандай арганізатараў. Захоўвайце ўсе абмеркаванні і інфармацыю ў адной тэме. Затым паведаміце пра мерапрыемства ўсім членам групы."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cf59a44a8643cc96:
    english: "**Develop a policy** - Post a policy draft, seek member feedback and input, finalize and ratify the policy."
    translation: "**Распрацаваць палітыку** - Размясціце праект палітыкі, збярыце водгукі і прапановы членаў групы, дапрацуйце і зацвердзіце палітыку."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6ddec467576426ca:
    english: "**General Assembly** - Organize, prepare and run a formal meeting including all members, to deliberate and make decisions on strategic matters."
    translation: "**Агульны сход** - Арганізуйце і правядзіце афіцыйную сустрэчу ўсіх членаў групы, каб абмеркаваць стратэгічныя пытанні і прыняць рашэнні."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d32bb446c4ca025:
    english: "### Self-organizing working teams"
    translation: "### Рабочыя каманды з самастойнай арганізацыяй"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  87ab6b2d51a7c1b6:
    english: "**Share information** - Post information and reports of interest to your team, invite comment and discussion."
    translation: "**Дзяліцца інфармацыяй** - Размяшчайце інфармацыю і справаздачы, якія цікавяць вашу каманду, і запрашайце да каментарыяў і абмеркавання."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e93205aa183cd1e0:
    english: "**Progress work** - Outline a work task and seek advice, input and feedback from team members through to completion."
    translation: "**Прасоўваць працу** - Апішыце задачу і атрымлівайце парады, прапановы і водгукі ад каманды на ўсіх этапах яе выканання."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1ddaef5d44653691:
    english: "**Meeting notes and actions** - Post meeting notes as a record of discussion, and follow up on tasks. "
    translation: "**Нататкі сустрэчы і задачы** - Размяшчайце нататкі сустрэчы, каб захаваць ход абмеркавання, і сачыце за выкананнем задач."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8ce9169d72c90788:
    english: "**Explore ideas** - Share thoughts and invite discussion about a concern you notice, or an improvement that can be made."
    translation: "**Даследаваць ідэі** - Дзяліцеся думкамі і запрашайце да абмеркавання заўважанай праблемы або магчымага паляпшэння."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a06e734e86f07828:
    english: "**Advice, Consent and Generative decision making** - Prepare, propose, clarify, respond to reactions and objections, agree and implement - all within a Loomio discussion."
    translation: "**Прыняцце рашэнняў на аснове парад, згоды і сумеснай выпрацоўкі ідэй** - Падрыхтуйцеся, унясіце прапанову, удакладніце яе, адкажыце на водгукі і пярэчанні, дасягніце згоды і ўвасобце рашэнне ў жыццё — усё ў межах абмеркавання Loomio."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
