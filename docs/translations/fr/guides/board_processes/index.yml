  a29c1c76443ad97f:
    english: Good governance is more than a board meeting, it requires good communication before and after meetings.
    translation: La bonne gouvernance ne se limite pas aux réunions du conseil d’administration. Elle repose aussi sur une bonne communication avant et après chaque réunion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9f05171a74ac30d0:
    english: |-
      This guide is intended to help you use Loomio in your board or committee, so you can stay connected between meetings, deal with urgent matters and reduce board admin.
      - Continue governance between meetings
      - Keep track of communications
      - Use board meetings for issues that matter
      - Preserve institutional memory with a detailed record
    translation: |-
      Ce guide vous aide à utiliser Loomio au sein de votre conseil d’administration ou de votre comité. Vous pourrez ainsi rester en contact entre les réunions, traiter les questions urgentes et réduire le travail administratif.
      - Poursuivre le travail de gouvernance entre les réunions
      - Garder une trace des échanges
      - Consacrer les réunions du conseil aux questions importantes
      - Préserver la mémoire de l’organisation grâce à un historique détaillé
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
