    translated_on: '2026-09-30'
  f61284373b7afc42:
    english: To change notification settings for an individual thread, open the notification control in the thread sidebar.
    translation: Muuta yksittäisen keskusteluketjun ilmoitusasetuksia avaamalla ilmoitusvalikko keskusteluketjun sivupalkista.
    status: machine
