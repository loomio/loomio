  444860e8996924f4:
    english: If you pass `remove_absent=1`, any members of the group who were not included in the list will be removed from the group. Be careful, you could remove everyone in your group.
    translation: 'Si vous fournissez `remove_absent=1`, les membres du groupe absents de la liste seront retirés du groupe. Vérifiez la liste : vous pourriez retirer tous les membres de votre groupe.'
