      details_v2: "<h3><strong>Якое рашэнне вам трэба прыняць?</strong></h3><p></p><h3> <strong>Чаму гэта важна?</strong></h3><p></p><h3> <strong>Чаго вы патрабуеце ад людзей у гэтай прапанове?</strong></h3><p></p><p> Мы не імкнемся да дасканаласці — дайце сваю згоду, калі прапанова дастаткова добрая і бяспечная для выкарыстання. Калі ў вас ёсць пярэчанні, паведаміце, што трэба змяніць, каб зрабіць яе працаздольнай.</p>"
