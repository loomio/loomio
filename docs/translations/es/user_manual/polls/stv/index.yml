  85590745d00e23c1:
    english: "# STV Elections"
    translation: "# Elecciones STV"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  366f56443108e10f:
    english: "**Single Transferable Vote (STV)** is a proportional representation voting method for electing multiple winners from a field of candidates. It ensures that elected candidates proportionally represent the diversity of views among voters."
    translation: El **voto único transferible (STV)** es un método de representación proporcional para elegir a varias personas entre un grupo de candidatos. Permite que las personas elegidas representen proporcionalmente la diversidad de opiniones de quienes votan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  61dee55b45038f56:
    english: "## When to use STV"
    translation: "## Cuándo usar STV"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8311dca26cec6519:
    english: 'Use an STV Election when you need to:'
    translation: 'Usa una elección STV cuando necesites:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1d4338734ec6e113:
    english: |-
      - Elect a **committee, board, or slate of delegates** from a pool of nominees
      - Ensure **proportional representation**, where minority factions can win seats proportional to their support
      - Run elections where voters rank candidates by preference
    translation: |-
      - Elegir un **comité, una junta o un grupo de delegados** entre varias candidaturas
      - Garantizar la **representación proporcional**, de modo que los grupos minoritarios puedan obtener escaños según el apoyo que reciban
      - Celebrar elecciones en las que quienes votan ordenen a los candidatos por preferencia
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e6e1ae026f65a715:
    english: |-
      >[!NOTE]
      >STV is **not** the same as Loomio's [Rank poll](/en/user_manual/polls/rank/), which is a simpler score-based ranking for choosing a single best option. STV handles multi-winner elections with vote transfers and elimination rounds.
    translation: |-
      >[!NOTE]
      >STV **no** es lo mismo que el [sondeo de clasificación](/en/user_manual/polls/rank/) de Loomio, que usa puntuaciones para elegir una única opción. STV permite elegir a varias personas mediante transferencias de votos y rondas de eliminación.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  62af8f95f18dbafe:
    english: "## Creating an STV Election"
    translation: "## Crear una elección STV"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  edf2f36e75c81665:
    english: When starting a poll, select **STV Election** as the poll type, then add the candidates as the poll options. You can customize the poll by setting the **number of seats**, the **counting method**, and the **quota type**.
    translation: Al iniciar un sondeo, selecciona **Elecciones STV** como tipo de sondeo y añade a los candidatos como opciones. Puedes configurar el **número de escaños**, el **método de recuento** y el **tipo de cuota**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b40ddcfb8cdc44fd:
    english: In this example, Oatmilk Cooperative is electing three people to oversee its returnable packaging trial. The form explains the role, lists five candidates, and uses Scottish STV with the Droop quota.
    translation: En este ejemplo, la Cooperativa Oatmilk elige a tres personas para supervisar una prueba de envases retornables. El formulario explica la función, enumera a cinco candidatos y utiliza el método STV escocés con la cuota Droop.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a34592929349d06:
    english: "### Number of seats"
    translation: "### Número de escaños"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c09f5f51333612dc:
    english: How many winners should be elected. Must be less than the number of candidates.
    translation: Es el número de personas que se elegirán. Debe ser menor que el número de candidatos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ddceec01d910b152:
    english: "### Counting method"
    translation: "### Método de recuento"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  39e9e81a89272771:
    english: 'There are two available methods for counting the votes:'
    translation: 'Hay dos métodos disponibles para contar los votos:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a7031d1180e95273:
    english: |-
      Scottish STV
        : Recommended. The Weighted Inclusive Gregory Method (WIGM) used in Scottish local elections since 2007. Well-defined, straightforward rules. Best for most organizations.
    translation: |-
      STV escocés
        : Recomendado. Utiliza el método Gregory inclusivo ponderado (WIGM), empleado en las elecciones locales de Escocia desde 2007. Tiene reglas claras y sencillas. Es la mejor opción para la mayoría de las organizaciones.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1507e4fde88848dd:
    english: |-
      Meek STV
        : A more mathematically precise iterative method. When a candidate is eliminated, votes are recounted as if that candidate was never in the race.
    translation: |-
      STV de Meek
        : Es un método iterativo más preciso desde el punto de vista matemático. Cuando se elimina a un candidato, los votos se vuelven a contar como si nunca hubiera participado.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b9abcd12eef5f629:
    english: "### Quota type"
    translation: "### Tipo de cuota"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6dc3aea49266d40d:
    english: 'The quota is the minimum number of votes a candidate needs to win a seat. It can be either:'
    translation: 'La cuota es el número mínimo de votos que necesita un candidato para obtener un escaño. Hay dos opciones:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  88f62f286d8c550f:
    english: |-
      Droop
        : Recommended. The standard quota type for most STV elections, and used by Ireland, Australia, and Scotland. Droop guarantees a majority coalition wins a majority of seats. It is calculated as:
      \\[ floor(\frac{votes}{(seats + 1)}) + 1 \\]
    translation: |-
      Droop
        : Recomendada. Es la cuota habitual en la mayoría de las elecciones STV y se utiliza en Irlanda, Australia y Escocia. Droop garantiza que una coalición con la mayoría de los votos obtenga la mayoría de los escaños. Se calcula así:
      \\[ floor(\frac{votes}{(seats + 1)}) + 1 \\]
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  817b3994e92898e8:
    english: |-
      Hare
        : A higher minimum threshold, and more proportional for smaller factions.
          Hare is preferred by DSA chapters to protect minority representation.
         It is calculated as:
          \\[ \frac{votes}{seats}\\]
    translation: |-
      Hare
        : Establece un umbral mínimo más alto y ofrece mayor proporcionalidad a los grupos pequeños.
          Las agrupaciones de DSA prefieren Hare para proteger la representación de las minorías.
         Se calcula así:
          \\[ \frac{votes}{seats}\\]
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f12065bdf5d3678e:
    english: |2-
        >[!TIP]
        > Droop will always compute to a smaller number of votes than Hare. For example, in an election with 100 votes and four seats, the Droop quota would be 21 and the Hare quota 25.
    translation: |-
      >[!TIP]
        > La cuota Droop siempre requiere menos votos que la cuota Hare. Por ejemplo, en una elección con 100 votos y cuatro escaños, la cuota Droop sería 21 y la cuota Hare, 25.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  984516abc3cfd89b:
    english: "## How voting works"
    translation: "## Cómo se vota"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  40e98247d87cdf27:
    english: 'In this example, Oatmilk Cooperative is electing three people to oversee the reusable packaging trial. Voters drag candidates above the line and rank them in order of preference:'
    translation: 'En este ejemplo, la Cooperativa Oatmilk elige a tres personas para supervisar la prueba de envases reutilizables. Quienes votan arrastran a los candidatos por encima de la línea y los ordenan según sus preferencias:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f8aaa5391f05117f:
    english: |-
      - **Rank 1** = most preferred candidate
      - **Rank 2** = second choice
      - Continue ranking as many candidates as desired
    translation: |-
      - **Puesto 1** = candidato preferido
      - **Puesto 2** = segunda opción
      - Sigue ordenando tantos candidatos como quieras
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  70bd790faf93c916:
    english: Voters are not required to rank every candidate. Unranked candidates will not receive any of that voter's support.
    translation: No es obligatorio ordenar a todos los candidatos. Los candidatos que no se incluyan no recibirán ningún apoyo de ese voto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d82e369c7c293a0c:
    english: |-
      ## How counting works
      The count is performed as follows:
    translation: |-
      ## Cómo funciona el recuento
      El recuento sigue estos pasos:
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0ea01b5d531abc06:
    english: |-
      1. A **quota** is calculated (minimum votes needed to win a seat).
      2. **First preferences** are counted for each candidate.
      3. If a candidate meets the quota, they are **elected**. Their surplus votes (above the quota) are **transferred** to voters' next preferences at a fractional value.
      4. If no candidate meets the quota, the candidate with the **fewest votes is eliminated**. Their votes transfer to voters' next preferences at full value.
      5. This process repeats until all seats are filled.
    translation: |-
      1. Se calcula una **cuota** (el número mínimo de votos necesario para obtener un escaño).
      2. Se cuentan las **Primeras preferencias** de cada candidato.
      3. Si un candidato alcanza la cuota, resulta **elegido**. Sus votos excedentes (por encima de la cuota) se **transfieren** a las siguientes preferencias de quienes votaron por él, con un valor fraccionario.
      4. Si ningún candidato alcanza la cuota, se **elimina al candidato con menos votos**. Sus votos se transfieren a las siguientes preferencias con su valor completo.
      5. El proceso se repite hasta cubrir todos los escaños.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c6f397233ad479e5:
    english: |-
      >[!TIP]
      >If a voter has ranked no remaining candidates, their ballot is "exhausted" and that vote is lost. This is why ranking more candidates is generally better.
    translation: |-
      >[!TIP]
      >Si un voto no incluye a ninguno de los candidatos que quedan, se considera «agotado» y deja de contar. Por eso, suele ser mejor ordenar a más candidatos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  acba228efb586cca:
    english: "## Understanding results"
    translation: "## Entender los resultados"
    status: machine
    provider: codex/gpt-6-sol
