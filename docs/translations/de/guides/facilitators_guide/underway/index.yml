navigation_title: Im Prozess
blocks:
  30163152525e029c:
    english: "# Underway"
    translation: "# Im Prozess"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  02feef9bf78ef420:
    english: "## Where are we on the Map?"
    translation: "## Wo stehen wir im Prozess?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '083f066ff9a3cfde':
    english: People feel more confident and better held if they can orient themselves on a timeline or agenda. They want to know what they’re doing now, what’s coming up, and to be reminded of what they’ve already done. Understanding the overall shape of the process helps people understand how to contribute effectively.
    translation: Menschen können sich leichter einbringen, wenn sie sich an einem Zeitplan oder einer Tagesordnung orientieren können. Sie möchten wissen, was gerade passiert, was als Nächstes kommt und was bereits erledigt ist. Wer den gesamten Ablauf kennt, versteht besser, wann und wie ein Beitrag hilfreich ist.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ea2ef3e629108828:
    english: For example if they can see there’s a Q&A section later, they'll be more willing to hold their questions during a presentation. If it’s clear that there’s a divergent phase and then a convergent phase, people will hold back from jumping to solutions too soon. People need to know what kind of input they are being asked for, and when.
    translation: Wenn später eine Fragerunde vorgesehen ist, können die Teilnehmenden ihre Fragen während eines Vortrags zurückhalten. Wenn klar ist, dass erst Ideen gesammelt und danach Lösungen ausgewählt werden, springen sie weniger schnell zu einer Lösung. Menschen müssen wissen, welche Beiträge zu welchem Zeitpunkt gefragt sind.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7a5d009dfc4e0f6b:
    english: Mapping the process well enough to communicate it also challenges facilitators to fully think through the journey, and helps them make sure each part of the process has a purpose that builds a cohesive whole. A well-facilitated experience follows a logical progression.
    translation: Um den Ablauf verständlich darzustellen, müssen Moderierende ihn vollständig durchdenken. So können sie prüfen, ob jeder Schritt einen Zweck hat und die Schritte zusammenpassen. Eine gut moderierte Zusammenarbeit folgt einem nachvollziehbaren Ablauf.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aabfa9d842af2688:
    english: On Loomio
    translation: Auf Loomio
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  af3599a59685a726:
    english: |-
      * A Loomio decision already follows a basic logical progression (which is why it works): Gather (open/invite), Discuss (divergent), Propose (convergent), Decide and Act (conclude).
      * Many Loomio users are employing the tool as part of explicitly mapped experiences, such as a multi-stage consultation process.
      * We offer some tools of facilitators to help “reveal the map” to users, such as the group description field, and proposal deadlines. These can be proactively leveraged to increase context for participants.
    translation: |-
      * Eine Entscheidung auf Loomio folgt bereits einem einfachen Ablauf: Menschen zusammenbringen (eröffnen und einladen), diskutieren (Ideen öffnen), einen Vorschlag machen (Ideen bündeln), entscheiden und handeln (ein Fazit ziehen).
      * Viele Menschen nutzen Loomio im Rahmen eines klar geplanten Ablaufs, etwa für einen mehrstufigen Beratungsprozess.
      * Gruppenbeschreibung und Fristen für Vorschläge helfen Moderierenden, den Ablauf sichtbar zu machen. Damit können sie den Teilnehmenden frühzeitig mehr Kontext geben.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  228ae545a39cd553:
    english: "## The Art of Noticing"
    translation: "## Die Kunst des Wahrnehmens"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  04155220f602a7e8:
    english: Noticing is probably the most critical facilitation skill of all. The facilitator uses noticing to figure out what interventions or responses are needed, how to invite the right contributions, and to help the group notice itself. The value of facilitation is having someone paying attention and acting on what they notice, while others may be focused on specific content or their own agendas.
    translation: Wahrnehmen ist eine der wichtigsten Fähigkeiten bei der Moderation. Wer moderiert, beobachtet, welche Unterstützung oder Reaktion nötig ist, welche Beiträge gefragt sind und was die Gruppe über sich selbst erkennen kann. Während andere sich auf Inhalte oder eigene Anliegen konzentrieren, achtet eine moderierende Person auf das Geschehen und handelt entsprechend.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  90a03fdb345369b7:
    english: 'Effective noticing is a combination of good informational inputs, and sensitivity and skill to interpret them. Many facilitators talk about “reading” a room: emotional reactions, tensions,  power dynamics. Facilitators need effective information signalling systems.'
    translation: 'Gutes Wahrnehmen braucht verlässliche Informationen und die Fähigkeit, sie einzuordnen. Viele Moderierende sprechen davon, einen Raum zu „lesen“: emotionale Reaktionen, Spannungen und Machtverhältnisse. Dafür brauchen sie klare Hinweise auf das Geschehen.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  49b0f2cc823e0384:
    english: |-
      * Many current features assist with noticing — the biggest one is probably watching how the pie is shaping up in a proposal.
      * The software notices some things: who has and has not yet participated, what topics are being raised, who has and has not accepted their group invitation, etc.
      * On Loomio, a single facilitator can read across dozens of discussions at the same time, see clearly what’s being shared, and act accordingly.
      * Talking online can make the implicit explicit, and therefore easier to notice.
      * Communicating in writing can be very good for naming what’s being noticed and why a certain action is being taken in response. For example, you can quote someone’s exact words and reflect back what’s revealed by them. Or you can do the same thing at the level of a whole discussion, picking out a range of quotes and noticing themes or emerging conflicts.
      * Noticing is much easier when you slow things down, which is one of Loomio’s great advantages — asynchronous communication you can read at any pace. It also makes it possible to notice across time, referring directly to past discussions.
      * Because you can have simultaneous discussions, it's possible to have a layer of “meta” discussion (aka “blue hat”, aka discussion about the discussion) at the same time as progressing the main discussions. So you can collectively have a space to practice noticing without slowing down the process.
    translation: |-
      * Viele Funktionen helfen dabei, Entwicklungen wahrzunehmen. Besonders deutlich zeigt das Kreisdiagramm eines Vorschlags, wie sich die Stimmen verteilen.
      * Die Software zeigt unter anderem, wer sich bereits beteiligt hat, welche Themen aufkommen und wer eine Einladung zur Gruppe angenommen hat.
      * Auf Loomio kann eine moderierende Person Dutzende Diskussionen zugleich verfolgen, erkennen, was geteilt wird, und darauf reagieren.
      * Online werden Dinge, die sonst unausgesprochen bleiben, oft ausdrücklich benannt. Dadurch sind sie leichter wahrzunehmen.
      * Schriftliche Kommunikation hilft dabei, Beobachtungen und die Gründe für eine Reaktion zu erklären. Du kannst zum Beispiel die genauen Worte einer Person zitieren und beschreiben, was sie erkennen lassen. Du kannst auch Zitate aus einer ganzen Diskussion zusammenstellen und auf gemeinsame Themen oder entstehende Konflikte hinweisen.
      * Wahrnehmen fällt leichter, wenn der Austausch langsamer wird. Das ist ein Vorteil von Loomio: Du kannst asynchrone Beiträge in deinem eigenen Tempo lesen. Du kannst auch Entwicklungen über längere Zeit verfolgen und direkt auf frühere Diskussionen Bezug nehmen.
      * Weil mehrere Diskussionen gleichzeitig stattfinden können, ist neben den eigentlichen Diskussionen auch eine Diskussion über den Gesprächsverlauf möglich. In diesem Raum kann die Gruppe gemeinsam üben, Entwicklungen wahrzunehmen, während die übrigen Diskussionen weitergehen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cdb52080510ddb69:
    english: "## Hearing Diverse Voices"
    translation: "## Unterschiedliche Stimmen hören"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  150ff74c2805696b:
    english: In our society, multiple layers of history, power dynamics, culture, and psychology conspire to amplify certain voices and suppress others. This plays out at every level of experience, from our innermost subconscious beliefs to our political system and laws.
    translation: 'Geschichte, Machtverhältnisse, Kultur und Psychologie wirken zusammen: Manche Stimmen bekommen mehr Gewicht, andere werden überhört. Das zeigt sich auf allen Ebenen, von unbewussten Überzeugungen bis zu politischen Institutionen und Gesetzen.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a3dccb91d161d18a:
    english: But the best ideas do not always come from the loudest voices, and the role of facilitation is to counteract these biases. It’s important to be aware of the dynamics we are collectively grappling with if our goals are social justice, group effectiveness, and high quality decision making.
    translation: Die besten Ideen kommen jedoch nicht immer von den lautesten Stimmen. Moderation kann solchen Verzerrungen entgegenwirken. Wer soziale Gerechtigkeit, wirksame Gruppenarbeit und gute Entscheidungen anstrebt, muss diese Dynamiken erkennen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5e8160d5b0da948a:
    english: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../rich_200.png"> If you want to innovate, you have to make space for different points of view — luckily, this is also what you need to do if you want a team where everyone is empowered. All kinds of cultural and technical factors conspire to privilege some voices at the expense of others. There are many practices you can implement to systematically challenge that bias, but just being aware of it is a good starting point. — Richard Bartlett'
    translation: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../rich_200.png"> Wenn du Neues entwickeln willst, musst du Raum für unterschiedliche Sichtweisen schaffen. Das brauchst du auch für ein Team, in dem sich alle einbringen können. Kulturelle und technische Faktoren geben manchen Stimmen mehr Gewicht als anderen. Mit verschiedenen Methoden kannst du dieser Verzerrung gezielt entgegenwirken. Schon das Bewusstsein dafür ist ein guter Anfang. — Richard Bartlett'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  63e0bdf44ad2df5f:
    english: Our lived human experience is to inhabit a singular consciousness, so humans tend to forget that others experience the world differently. Even within a seemingly homogenous group, there is incredible diversity — perspectives, pace, preferences. Internalising this truth — that others are different from myself — is a central personal growth challenge.
    translation: Jeder Mensch erlebt die Welt aus der eigenen Perspektive. Deshalb vergessen wir leicht, dass andere sie anders erleben. Selbst in einer Gruppe, die einheitlich erscheint, gibt es große Unterschiede bei Sichtweisen, Tempo und Vorlieben. Anzuerkennen, dass andere anders sind als man selbst, ist eine wichtige persönliche Aufgabe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  62f6a86aa220b787:
    english: There is no such thing as one size fits all. Any mode of interacting enhances some voices and quiets others, or emphasises different tendencies within an individual. So, it’s necessary to employ a range of approaches to invite the best from multiple diverse voices.
    translation: Eine einzige Form der Zusammenarbeit passt nicht für alle. Jede Art des Austauschs gibt manchen Stimmen mehr Raum und anderen weniger. Sie kann auch unterschiedliche Seiten einer Person hervorbringen. Verschiedene Ansätze sind nötig, damit viele Menschen ihre besten Beiträge einbringen können.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8f9c1b2c0e40b1fc:
    english: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../silvia_200.png"> Check you’re catering to different learning styles. One simple way to check is with the Head, Heart, Hands metaphor. People who learn with their Head need facts and detailed information. A Heart learner thrives off stories. They need an emotional connection to the work. Learning with the Hands is all about doing stuff and getting active. — Silvia Zuur'
    translation: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../silvia_200.png"> Prüfe, ob du unterschiedliche Lernweisen berücksichtigst. Dabei hilft das Bild von Kopf, Herz und Händen. Menschen, die mit dem Kopf lernen, brauchen Fakten und genaue Informationen. Wer mit dem Herzen lernt, spricht auf Geschichten an und braucht eine emotionale Verbindung zur Arbeit. Mit den Händen zu lernen bedeutet, selbst etwas zu tun und aktiv zu werden. — Silvia Zuur'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  04a3a7bc850913ab:
    english: One of the best approaches to bringing out and weaving together diverse voices is to invite diverse modes of interaction, which will serve different needs and preferences, and level the communication playing field.
    translation: Unterschiedliche Stimmen kommen besser zur Geltung, wenn du verschiedene Formen des Austauschs anbietest. So berücksichtigst du unterschiedliche Bedürfnisse und Vorlieben und erleichterst allen die Beteiligung.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ba31b7da59193745:
    english: 'Some classic design building blocks to address communication diversity in collaborative communication:'
    translation: 'Diese bewährten Gestaltungselemente helfen, unterschiedlichen Kommunikationsweisen in der Zusammenarbeit Raum zu geben:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fbcafe73c1d8720b:
    english: |-
      * **Group size** — individual reflection, pairs, small group, large group, one-to-one, one-to-many, many-to-many.
      * **Medium of expression** — writing, drawing, video, singing, dance, flowcharts, equations, symbols, stories, tears, laughter, debate, etc.
      * **Discussion protocols** — rounds (hear from each person once before moving on), rate limiting (you can only speak again after two others have spoken), talking stick (only speak when you have the stick — no interrupting), time-limited contributions (you can talk for 1 minute only), time-unlimited contributions (you can hold the floor indefinitely and everyone will deeply listen), tracking contributions (how much have women vs men spoken, etc), holding periods of silence between speakers (for processing and reflection).
      * **Embrace silence** *Silence is only awkward if you let it be awkward. Silence is a chance for people to think. — Silvia Zuur*
    translation: |-
      * **Gruppengröße** — Nachdenken für sich allein, Zweiergespräche, kleine Gruppen, große Gruppen, Gespräche zwischen zwei Personen, von einer Person zu vielen oder zwischen vielen Personen.
      * **Ausdrucksform** — Schreiben, Zeichnen, Video, Singen, Tanzen, Flussdiagramme, Gleichungen, Symbole, Geschichten, Tränen, Lachen, Debatten und mehr.
      * **Gesprächsregeln** — Runden (jede Person kommt einmal zu Wort, bevor es weitergeht), begrenzte Redehäufigkeit (du sprichst erst wieder, nachdem zwei andere gesprochen haben), Redestab (nur wer den Stab hat, spricht; niemand unterbricht), zeitlich begrenzte Beiträge (du hast eine Minute), Beiträge ohne Zeitlimit (du kannst sprechen, solange du möchtest, und alle hören aufmerksam zu), Erfassen der Redeanteile (etwa wie viel Frauen und Männer gesprochen haben), stille Pausen zwischen Beiträgen (zum Verarbeiten und Nachdenken).
      * **Stille zulassen** *Stille ist nur unangenehm, wenn du sie dazu machst. Sie gibt Menschen Zeit zum Nachdenken. — Silvia Zuur*
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ff925b4be393907c:
    english: |-
      * The design of Loomio has always been about “hearing all voices”, including people who aren’t able to be there in person, are quieter, are busy, etc.
      * In text, every voice is more or less the same “volume” and “speed”. Written asynchronous communication offers a kind of leveling of the field.
      * The proposal feature is essentially a “round”, assisting groups to facilitate each individual person having their say (if they want to) on an equal basis.
      * Loomio enables multi-media (links, videos, images, diagrams, supporting evidence), which serve various communication styles.
      * Loomio itself is pretty basic, but with active facilitation and group maturity, it is possible to employ discussion protocols “manually” using cultural norms or agreed rules (eg, a discussion where everyone only posts once until everyone else has participated).
      * Loomio provides flexible tools for small and large group interaction, using parent groups and subgroups. Some large consultation processes have involved multiple smaller groups which are then synthesised into a larger outcome.
      * People who want time for individual reflection can take time out and process their thoughts, and then come back and share a longer comment or link to a document. This is a “self-selecting” example of creating interplay between individual and group communication.
      * Loomio accessibility features and multi-lingual translations make it possible for people with very different needs to participate as equals in one discussion. This is a key example of how technology can enable equitable participation in a way that’s nearly impossible in person.
      * If someone is contributing more than their share (talking too much), it’s technically possible to just scroll on by (whereas in person this behaviour can totally dominate the interaction). However, people posting “walls of text” can still be detrimental to a balanced Loomio discussion.
    translation: |-
      * Loomio wurde mit dem Ziel gestaltet, alle Stimmen hörbar zu machen. Dazu gehören auch Menschen, die nicht vor Ort sein können, leiser sind oder wenig Zeit haben.
      * Im Text haben alle Stimmen ungefähr die gleiche „Lautstärke“ und „Geschwindigkeit“. Schriftlicher, asynchroner Austausch kann Unterschiede beim Zugang zum Gespräch verringern.
      * Die Vorschlagsfunktion ähnelt einer Gesprächsrunde. Sie hilft Gruppen dabei, jeder Person die gleiche Gelegenheit zu geben, sich zu äußern, wenn sie das möchte.
      * Loomio unterstützt verschiedene Medien wie Links, Videos, Bilder, Diagramme und ergänzende Belege. Das kommt unterschiedlichen Kommunikationsweisen entgegen.
      * Loomio selbst bietet einfache Funktionen. Mit aktiver Moderation und gemeinsam vereinbarten Regeln lassen sich Gesprächsregeln auch von Hand umsetzen. Beispielsweise könnte jede Person erst einen Beitrag schreiben, nachdem alle anderen Gelegenheit dazu hatten.
      * Mit Gruppen und Untergruppen bietet Loomio flexible Möglichkeiten für kleine und große Gruppen. Bei manchen umfangreichen Beratungsprozessen arbeiten mehrere kleinere Gruppen zunächst getrennt. Ihre Beiträge fließen später in ein gemeinsames Fazit ein.
      * Wer Zeit zum Nachdenken braucht, kann eine Pause machen, die eigenen Gedanken ordnen und später einen längeren Kommentar oder einen Link zu einem Dokument teilen. So können sich persönliches Nachdenken und Austausch in der Gruppe ergänzen.
      * Funktionen zur Barrierefreiheit und Übersetzungen in viele Sprachen ermöglichen Menschen mit unterschiedlichen Bedürfnissen, sich gleichberechtigt an einer Diskussion zu beteiligen. Das ist bei einem Treffen vor Ort kaum in gleichem Maß möglich.
      * Wenn eine Person sehr viel schreibt, können andere an ihren Beiträgen vorbeiscrollen. Bei einem Treffen vor Ort kann sie das Gespräch stärker beherrschen. Sehr lange Beiträge können aber auch auf Loomio eine ausgewogene Diskussion erschweren.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bb74ebca94285a48:
    english: "## Counter Cognitive Bias"
    translation: "## Kognitiven Verzerrungen entgegenwirken"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c8d4a9a10da47a62:
    english: Human brains have evolved over millions of years to balance quick, efficient “good enough” thinking with slow, expensive, deep analysis. This allows us to use instincts, heuristics, and generalisations as cheap and fast solutions most of the time, and to engage deep analysis when needed.
    translation: Das menschliche Gehirn hat sich über Millionen von Jahren entwickelt. Es verbindet schnelles, zweckmäßiges Denken mit langsamer, aufwendiger Analyse. So können wir uns meistens auf Erfahrung, Faustregeln und Verallgemeinerungen stützen und bei Bedarf gründlicher nachdenken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3a35775e59cdea17:
    english: But sometimes we get it wrong. In fact, there are well-known “bugs” in the human cognition program, which can keep people from making the best decisions. This is further complicated in group situations. We need to be aware of these dynamics.
    translation: Manchmal führt uns das in die Irre. Es gibt bekannte Denkfehler, die gute Entscheidungen erschweren. In Gruppen wird das noch komplexer. Diese Dynamiken müssen wir im Blick behalten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e3d808eb17e1aa5a:
    english: There is a huge [range of cognitive biases](https://en.wikipedia.org/wiki/List_of_cognitive_biases) (this list is really worth a read), all of which have potential impacts on decision making and collaboration. Facilitation can be an important tool to deal with them, to raise awareness of their existence, encourage proactive choices about them. For example, asking when is it more important to move quickly and when is it more important to be accurate.
    translation: 'Es gibt viele [kognitive Verzerrungen](https://en.wikipedia.org/wiki/List_of_cognitive_biases) (diese Liste ist lesenswert). Sie alle können Entscheidungen und Zusammenarbeit beeinflussen. Moderation kann helfen, sie sichtbar zu machen und bewusster mit ihnen umzugehen. Eine hilfreiche Frage lautet zum Beispiel: Wann ist eine schnelle Entscheidung wichtiger und wann eine genaue?'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c4755a454121a7b6:
    english: One powerful tool to counter cognitive bias and increase quality of decisions is structured processes and communication. The challenge of following a process instead of the “path of least resistance” can help highlight thinking errors and bias. Facilitators sometimes push for things that feel challenging or trigger resistance, precisely because brains are being asked to step out of familiar patterns. Discipline in this area can help groups achieve their deeper goals, which can be worth some temporary discomfort.
    translation: Strukturierte Abläufe und klare Kommunikation können kognitiven Verzerrungen entgegenwirken und Entscheidungen verbessern. Ein festgelegter Ablauf fordert uns heraus, statt des einfachsten Wegs andere Möglichkeiten zu prüfen. Dadurch werden Denkfehler und Vorannahmen sichtbar. Moderierende regen manchmal bewusst Schritte an, die Widerstand auslösen, weil die Gruppe dafür vertraute Denkmuster verlassen muss. Diese Anstrengung kann einer Gruppe helfen, ihre Ziele zu erreichen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  99caa45d2ab4ae8b:
    english: 'Some examples of processes that can help mitigate cognitive bias:'
    translation: 'Beispiele für Abläufe, die kognitive Verzerrungen verringern können:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ebd2c767ea8fae2e:
    english: |-
      * [De Bono’s Hats](http://www.debonoforschools.com/asp/six_hats.asp): different colored hats participants can wear (metaphorically) to step outside their own opinions and try on different modes of thinking.
      * Checklists: thinking “ruts” can cause us to miss even obvious things (especially in areas we're very familiar with), so a checklist can weed out errors.
      * The Five Why’s: only asking why once or twice can mislead you into thinking you’ve reached the conclusion before you get to the root level of the issue. Asking five times tends to get to the bottom of it.
      * Mental models: exercises like [SWOT analysis](https://en.wikipedia.org/wiki/SWOT_analysis), the [business model canvas](https://en.wikipedia.org/wiki/Business_Model_Canvas), or any number of countless other structured information gathering exercises can guide you to cleaner analysis and reveal assumptions.
    translation: |-
      * [De Bonos Hüte](http://www.debonoforschools.com/asp/six_hats.asp): Verschiedenfarbige Hüte stehen sinnbildlich für unterschiedliche Denkweisen. Die Teilnehmenden können damit Abstand von ihrer eigenen Meinung nehmen und andere Sichtweisen ausprobieren.
      * Checklisten: Vertraute Denkmuster lassen uns selbst offensichtliche Dinge übersehen, besonders in Bereichen, die wir gut kennen. Eine Checkliste hilft, Fehler zu vermeiden.
      * Die fünf Warum-Fragen: Wer nur ein- oder zweimal nach dem Warum fragt, hält eine Antwort vielleicht schon für die Ursache des Problems. Fünfmal nachzufragen hilft, ihr auf den Grund zu gehen.
      * Denkmodelle: Übungen wie die [SWOT-Analyse](https://en.wikipedia.org/wiki/SWOT_analysis), das [Business Model Canvas](https://en.wikipedia.org/wiki/Business_Model_Canvas) und andere strukturierte Verfahren zur Informationssammlung helfen dir, Annahmen offenzulegen und genauer zu analysieren.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  073fb22a0e7cd744:
    english: |-
      * Diverse information and inputs can disrupt assumptions or bias. This is built into Loomio’s basic design: by enabling more voices to contribute to a discussion on a more equitable basis, you have a chance to escape “groupthink”.
      * Loomio gives participants the ability to dissent constructively. Safe and valued dissent is essential for a culture of critical thinking.
      * Communicating asynchronously in writing slows conversation down and lets it be more carefully considered, giving people a chance to think more carefully and avoid cognitive errors.
      * Loomio invites people into a semi-structured process that leads to more considered decision making. Loomio can be used for a huge range of different processes, but simply having *some* structure in a discussion enables other possibilities.
    translation: |-
      * Unterschiedliche Informationen und Beiträge können Annahmen und Verzerrungen infrage stellen. Das gehört zum Grundgedanken von Loomio: Wenn sich mehr Menschen gleichberechtigt an einer Diskussion beteiligen können, sinkt die Gefahr des Gruppendenkens.
      * Auf Loomio können Teilnehmende konstruktiv widersprechen. Ein sicherer Raum für Widerspruch und dessen Wertschätzung fördern kritisches Denken.
      * Asynchrone schriftliche Kommunikation verlangsamt das Gespräch. Menschen haben mehr Zeit, Beiträge zu überdenken und Denkfehler zu vermeiden.
      * Loomio bietet einen teilweise strukturierten Ablauf, der überlegte Entscheidungen unterstützt. Es eignet sich für viele verschiedene Prozesse. Schon *etwas* Struktur in einer Diskussion eröffnet weitere Möglichkeiten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4ae16a63e2dd047a:
    english: "## Balancing Divergent & Convergent"
    translation: "## Offene und bündelnde Phasen ausbalancieren"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2983c2d32846ebd5:
    english: The “diamond” of divergence and convergence is a conversational shape. It expands outward at first — opening up space for ideas, information, and different perspectives — then begins to come to a point. The right timing for this shift is key for effective facilitation of action-oriented, productive, collaborative discussions.
    translation: Der „Diamant“ beschreibt, wie sich ein Gespräch erst öffnet und dann wieder bündelt. Zunächst entsteht Raum für Ideen, Informationen und unterschiedliche Sichtweisen. Danach führt das Gespräch auf einen Punkt zu. Der richtige Zeitpunkt für diesen Übergang ist entscheidend, wenn eine gemeinsame Diskussion zu konkretem Handeln führen soll.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bce4c52d377dbdbd:
    english: If divergence is missed out or cut off too early, there will be a lack of information to work with, people may not feel heard, and great ideas will be left unsaid. If convergence is missed out or left too late, discussion can continue indefinitely without reaching an actionable conclusion, burning participants energy and failing to achieve results.
    translation: Wenn die offene Phase fehlt oder zu früh endet, fehlen wichtige Informationen. Menschen fühlen sich möglicherweise nicht gehört, und gute Ideen bleiben unausgesprochen. Wenn die bündelnde Phase fehlt oder zu spät beginnt, kann die Diskussion endlos weitergehen, ohne zu einem umsetzbaren Fazit zu führen. Das kostet die Teilnehmenden Energie, ohne ein Ergebnis zu bringen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9f787be37e0492cc:
    english: Each sub-phase of the larger process also requires awareness of the right timing and intervention. Divergence consists of introduction, clarification, ideation. Convergence consists of analysis, conclusion, commitment. Some discussions succeed with only a vague nod toward the diamond, while others are served by a meticulous breakdown of each phase and sub-phase.
    translation: Auch innerhalb der einzelnen Phasen kommt es auf den richtigen Zeitpunkt für einen Eingriff an. Zur offenen Phase gehören Einführung, Klärung und das Entwickeln von Ideen. Zur bündelnden Phase gehören Analyse, Fazit und Verbindlichkeit. Für manche Diskussionen reicht der Diamant als grobe Orientierung. Andere profitieren davon, jede Phase genau zu planen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d8c7970db55ea11:
    english: Within a group, different individuals will usually tend to prefer one mode or the other, and the group as a whole will have collective tendencies. Imbalance looks like too much blue sky thinking, or jumping to solutions. Facilitation can help each person and the group as a whole spend the right amount of energy on the different modes.
    translation: In einer Gruppe bevorzugen einzelne Menschen meist eher die offene oder die bündelnde Phase. Auch die Gruppe als Ganzes kann zu einer Seite neigen. Ein Ungleichgewicht zeigt sich etwa darin, dass die Gruppe zu lange frei über Möglichkeiten nachdenkt oder zu schnell Lösungen festlegt. Moderation hilft, beiden Phasen genügend Raum zu geben.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  36405c3bfcb951b6:
    english: |-
      * The core Loomio process does an excellent job of guiding groups to touch on each phase of the process, with the discussion being divergent and proposals being convergent. Awareness of the diamond was a big inspiration for the original design of the Loomio process.
      * Loomio helps groups to use the diamond in dynamic ways, such as when an attempt to converge (a proposal) ends up becoming a deeper level of divergence (disagreement), revealing or clarifying information to support an even better convergence (iterated proposal).
      * Some of Loomio’s basic features go a long way toward supporting each mode, such as notifications to group members when a new discussion is starting (prompting divergent contribution), and deadlines on proposals (prompting participation in convergence).
      * Loomio users are already able to use the existing feature set to facilitate convergence — namely starting a proposal. Good use of proposals is one of the most obvious symptoms of an effective Loomio group, and simply advising users to start more proposals unblocks many groups who are having issues.
    translation: |-
      * Der grundlegende Ablauf auf Loomio führt Gruppen durch beide Phasen: Diskussionen öffnen den Raum, Vorschläge bündeln ihn. Der Diamant war eine wichtige Anregung für die ursprüngliche Gestaltung dieses Ablaufs.
      * Loomio erlaubt Gruppen, flexibel zwischen den Phasen zu wechseln. Ein Vorschlag kann zum Beispiel neue Meinungsverschiedenheiten sichtbar machen. Die dadurch geklärten Informationen helfen, einen besseren Vorschlag zu entwickeln.
      * Grundlegende Funktionen unterstützen beide Phasen. Benachrichtigungen über neue Diskussionen laden Gruppenmitglieder ein, Ideen einzubringen. Fristen für Vorschläge regen dazu an, sich an der Entscheidung zu beteiligen.
      * Mit den vorhandenen Funktionen können Gruppen die bündelnde Phase einleiten, indem sie einen Vorschlag starten. Gruppen, die Vorschläge sinnvoll nutzen, kommen oft gut voran. Manchmal hilft schon der Hinweis, häufiger Vorschläge zu machen, wenn eine Gruppe feststeckt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  af83d6e3b408e008:
    english: "## Working with Scope"
    translation: "## Den Umfang festlegen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  209f071ae0c7ae0f:
    english: Successful collaboration often depends on biting off the right size pieces in the right order.
    translation: Gute Zusammenarbeit hängt oft davon ab, Aufgaben in passende Teile zu zerlegen und sie in der richtigen Reihenfolge anzugehen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  24658aca54702290:
    english: 'You can apply a “project management” mindset to facilitation, designing for questions like:'
    translation: 'Du kannst die Moderation wie ein Projekt planen und dabei Fragen wie diese stellen:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '09c7ee57551e1980':
    english: |-
      * What are the dependencies (what’s the critical path, which things need to be done first to enable other things)?
      * What are the most important bits to focus on? What can be left out?
      * What is an achievable scope to tackle at a given time to get to a useful place with the time, energy, and information available?
    translation: |-
      * Welche Schritte hängen voneinander ab? Was muss zuerst geschehen, damit anderes möglich wird?
      * Was ist am wichtigsten? Was kann weggelassen werden?
      * Welchen Umfang können wir mit der verfügbaren Zeit, Energie und Information bewältigen, um zu einem brauchbaren Ergebnis zu kommen?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bca4d47c3dc6f3cf:
    english: It’s important not to try to “boil the ocean”, and instead break things down into manageable chunks. You can build toward a bigger outcome in a series of smaller pieces. It’s often better to achieve something small but useful, than to fail to reach any conclusions. It’s also possible to get too bogged down in details and fail to hit the bigger issues.
    translation: Versuche nicht, alles auf einmal zu lösen. Teile die Arbeit in überschaubare Schritte auf. Mehrere kleine Schritte können zu einem größeren Ergebnis führen. Oft ist es besser, etwas Kleines und Nützliches zu erreichen, als zu keinem Fazit zu kommen. Wer sich zu sehr in Details verliert, übersieht womöglich die größeren Fragen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ce5ed5c5115c7b90:
    english: In a collaboration, no one knows exactly what will emerge, so scope must evolve with the discussion. Whether branching out at a given moment is a distraction or an evolution is a judgement call. Too much rigidity and too much flexibility can both be damaging. Often times it’s not about whether something is relevant or not, but a question of sequence and timing in terms of what will be most constructive.
    translation: Bei einer Zusammenarbeit weiß niemand genau, was entstehen wird. Deshalb muss sich der Umfang mit der Diskussion entwickeln. Ob ein neuer Zweig gerade ablenkt oder die Arbeit voranbringt, musst du abwägen. Zu starre wie auch zu flexible Grenzen können schaden. Häufig geht es weniger darum, ob etwas relevant ist, sondern darum, wann und in welcher Reihenfolge es am meisten beiträgt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3510d751f00b1ae6:
    english: "> If you plan a session with multiple, interlinked parts – each one building on the other, and all leading to a life-changing, mind-exploding conclusion – and you can pull it off, then that’s amazing. But more often than not, a complicated session will go over-time and may not hit the participant’s wants and needs. - Silvia Zuur"
    translation: "> Wenn du eine Sitzung mit mehreren verknüpften Teilen planst, die aufeinander aufbauen und zu einer lebensverändernden Erkenntnis führen sollen, ist es großartig, wenn das gelingt. Häufiger dauert eine komplexe Sitzung jedoch länger als geplant und geht an den Wünschen und Bedürfnissen der Teilnehmenden vorbei. - Silvia Zuur"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9204dd47d88ac308:
    english: |-
      ## A series of small yes's
      Lumping too many conversations together simply creates confusion. Frustrated groups are often helped by breaking things down. If an issue seems hopeless, complex or conflicted, it can be possible to separate out individual questions and reach consensus on them, starting with the easiest things to agree. Then when it comes to points of disagreement, you can pare it down to only the crux of the issues and work on them in a focused way.
    translation: |-
      ## Eine Reihe kleiner Zustimmungen
      Zu viele Gespräche zusammenzufassen schafft Verwirrung. Gruppen, die nicht weiterkommen, hilft es oft, die Fragen aufzuteilen. Wenn ein Thema aussichtslos, komplex oder umstritten erscheint, kannst du einzelne Fragen herauslösen und dazu Einigkeit finden. Beginne mit dem, worüber sich alle leicht einigen können. Anschließend kannst du die strittigen Punkte auf ihren Kern reduzieren und gezielt bearbeiten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2d86c0488159e380:
    english: |-
      * Topic-based discussion threads are a powerful tool for effective scope — even more than face-to-face conversation, Loomio discussions can be usefully delineated to encourage focus on a specific question, while other aspects can be addressed simultaneously in other threads.
      * We often see users making facilitation interventions like “That’s out of the scope of this topic, but why don’t you start a new discussion about it?”
      * The act of creating a Loomio group helps define who are we and what are we here to discuss. This helps participants manage scope.
      * The sequential proposals design of Loomio is very good for a “series of small yess's” approach — you can build small agreements while maintaining context in a single discussion thread, and build on the history of previous proposals.
      * Asynchronous online communication can allow some people to go way out of scope without holding up others. They can simply start a new discussion or subgroup and go as deep and long as they want, while the main scope of the group is maintained.
      * The discussion context box and group description are spaces to define the scope of a conversation or group, respectively.
    translation: |-
      * Thematisch getrennte Diskussionen helfen, den Umfang klar zu halten. In Loomio lässt sich der Fokus auf eine bestimmte Frage oft besser wahren als in einem Gespräch vor Ort. Andere Aspekte können gleichzeitig in anderen Diskussionen behandelt werden.
      * Häufig greifen Nutzerinnen und Nutzer moderierend ein, etwa mit: „Das gehört nicht zu diesem Thema. Möchtest du dazu eine neue Diskussion starten?“
      * Eine Loomio-Gruppe zu erstellen hilft zu klären, wer dazugehört und worüber die Gruppe sprechen möchte. So können die Teilnehmenden den Umfang ihrer Gespräche besser einschätzen.
      * Loomios aufeinanderfolgende Vorschläge eignen sich gut für eine Reihe kleiner Zustimmungen. In einer Diskussion könnt ihr einzelne Vereinbarungen treffen, den Zusammenhang bewahren und auf früheren Vorschlägen aufbauen.
      * Bei zeitversetzter Online-Kommunikation können manche Menschen ein Thema weit vertiefen, ohne andere aufzuhalten. Sie können eine neue Diskussion oder Untergruppe starten, während die Hauptgruppe bei ihrem Thema bleibt.
      * Die Beschreibung einer Diskussion und die Gruppenbeschreibung bieten Platz, um den Umfang des jeweiligen Gesprächs oder der Gruppe festzulegen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0b70d200637c265f:
    english: "## Pacing & Timing"
    translation: "## Tempo und Zeitpunkt"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d2b056c4b3edb54a:
    english: A productive conversation has a rhythm. The right beat comes from a complex combination of factors and often feels intuitive, like a musician improvising. When is the moment to go deeper, or pull back? When is it right to bring in new information, or further delve into what’s already on the table? This is pacing.
    translation: Ein produktives Gespräch hat einen Rhythmus. Das passende Tempo hängt von vielen Faktoren ab und ergibt sich oft aus dem Gefühl heraus, ähnlich wie beim Improvisieren in der Musik. Wann ist es Zeit, tiefer einzusteigen oder einen Schritt zurückzutreten? Wann helfen neue Informationen, und wann solltet ihr das Vorhandene genauer betrachten? Darum geht es bei der Steuerung des Tempos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d421940782402742:
    english: Different participants will have different needs and preferences — some will need reigning in, while others need pulling along. The right pace emerges when a creative tension between digging deeper and moving forward is found. When it’s off, people will feel frustrated — either impatient or left behind.
    translation: Teilnehmende haben unterschiedliche Bedürfnisse und Vorlieben. Manche müssen gebremst, andere ermutigt werden, weiterzugehen. Ein gutes Tempo entsteht aus dem Zusammenspiel von Vertiefung und Fortschritt. Stimmt es nicht, werden manche ungeduldig, während andere nicht mehr mitkommen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7165c12910a2b3bb:
    english: |-
      * Because it’s asynchronous, people can read and respond at their own pace on Loomio, allowing a natural pace to emerge.
      * It’s possible to scroll right past people moving slowly and push for forward momentum, and simultaneously possible to continue digging into something slowly while others press forward. This is not possible in synchronous communication.
      * Proposal deadlines are a pace-setting tool. Topics that need to move quickly use shorter timeframes, and longer ones can have more time. Different decisions can go at different speeds.
      * It’s easy to modulate your own pace of engagement. If a conversation is moving too fast or slowly for you, you can drop your input and step back, and then return later when a proposal is raised.
      * It’s interesting to note how a “fast” decision on Loomio is 1 or 2 days, while a “fast” decision in person is more like 5 minutes. And yet, Loomio does not seem “slow”, the way taking 2 days to reach a decision in person would. Loomio runs decisions in parallel to other ongoing work, and it's much more efficient gathering everyone’s input on Loomio over 2 days versus having to schedule an in-person meeting.
      * Facilitation on Loomio could be likened to “bullet time” (when Neo can stop time and just walk around a bullet in the Matrix) — you can walk through a living conversation frame by frame. It’s like a superpower.
    translation: |-
      * Weil die Kommunikation zeitversetzt stattfindet, können Menschen auf Loomio in ihrem eigenen Tempo lesen und antworten. So kann sich ein natürlicher Rhythmus entwickeln.
      * Du kannst an langsameren Beiträgen vorbeiscrollen und die Diskussion voranbringen. Zugleich kannst du ein Thema weiter vertiefen, während andere schon vorangehen. In einem Gespräch zur selben Zeit ist das nicht möglich.
      * Fristen für Vorschläge helfen, das Tempo zu bestimmen. Dringende Themen bekommen kürzere Fristen, andere mehr Zeit. Verschiedene Entscheidungen können unterschiedlich schnell getroffen werden.
      * Du kannst dein eigenes Beteiligungstempo leicht anpassen. Wenn dir eine Diskussion zu schnell oder zu langsam verläuft, kannst du deinen Beitrag schreiben, dich zurückziehen und später zu einem Vorschlag zurückkehren.
      * Eine „schnelle“ Entscheidung auf Loomio dauert vielleicht ein oder zwei Tage, bei einem Treffen vor Ort eher fünf Minuten. Trotzdem wirkt Loomio nicht so langsam, wie es ein zweitägiges Treffen wäre. Entscheidungen laufen parallel zur übrigen Arbeit. Beiträge von allen über zwei Tage auf Loomio zu sammeln, ist oft einfacher, als ein Treffen vor Ort zu organisieren.
      * Moderation auf Loomio lässt sich mit „Bullet Time“ vergleichen: In Matrix kann Neo die Zeit anhalten und an einer Kugel vorbeigehen. Ähnlich kannst du ein laufendes Gespräch Schritt für Schritt betrachten. Das eröffnet besondere Möglichkeiten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  79fbcf8bb8520bf1:
    english: "## Managing the Attention Economy"
    translation: "## Mit Aufmerksamkeit umgehen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c71302b08c3b6394:
    english: A facilitator is a curator of attention. The information available can be literally infinite. It becomes critical to filter it in order to avoid becoming overwhelmed. Managing the attention economy means balancing importance against time and capacity.
    translation: Wer moderiert, lenkt die Aufmerksamkeit. Die verfügbare Informationsmenge kann praktisch unbegrenzt sein. Deshalb ist es wichtig, Informationen zu filtern, damit die Gruppe den Überblick behält. Mit Aufmerksamkeit umzugehen heißt, Wichtigkeit, Zeit und Kapazität gegeneinander abzuwägen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  865afb1b25257bbd:
    english: Facilitation can help the group agree what the purpose and scope of a given discussion or process is, so they can have a rubric for prioritising attention. Limiting distractions and steering the conversation back on track are common interventions.
    translation: Moderation kann der Gruppe helfen, sich über Ziel und Umfang einer Diskussion oder eines Prozesses zu verständigen. Damit hat sie einen Maßstab dafür, worauf sie ihre Aufmerksamkeit richtet. Ablenkungen zu begrenzen und das Gespräch zum Thema zurückzuführen, sind häufige Eingriffe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3dd99b496718a570:
    english: Another important way facilitators work with attention is to insist on the group holding it long enough. When things get challenging, unclear, or uncomfortable, people to want to give up too soon, jump to another topic, or look away. A facilitator can help the group see things through, in service of their collective goals.
    translation: Zur Moderation gehört auch, die Aufmerksamkeit der Gruppe lange genug bei einem Thema zu halten. Wenn es schwierig, unklar oder unangenehm wird, möchten Menschen manchmal zu früh aufgeben, das Thema wechseln oder wegsehen. Die Moderation kann der Gruppe helfen, dranzubleiben und ihre gemeinsamen Ziele zu verfolgen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  811f79cee2eed8c1:
    english: 'Structured processes and information sorting exercises are important facilitation tools in this area. Some examples:'
    translation: 'Strukturierte Abläufe und Übungen zum Ordnen von Informationen sind dafür wichtige Werkzeuge. Einige Beispiele:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1254ab2b182bbd46:
    english: |-
      * **Time-boxing** — specifying a period of brainstorming, or conversation on a given topic.
      * **Agenda prioritisation** — listing everything people want to talk about and then picking to top items to focus on, before jumping into content.
      * **Post-it cloud** — generating a bunch of ideas or questions and grouping them thematically and then condensing them into topics.
      * **Parking lot** — a space to stick ideas or questions that come up that are not immediately relevant, to be addressed later.
      * **What does success look like??** Defining success criteria and keeping the group focused on it until those criteria are achieved.
    translation: |-
      * **Zeitbegrenzung** — einen festen Zeitraum für ein Brainstorming oder ein Gespräch über ein bestimmtes Thema festlegen.
      * **Themen der Tagesordnung priorisieren** — alles sammeln, worüber die Teilnehmenden sprechen möchten, und vor der inhaltlichen Diskussion die wichtigsten Punkte auswählen.
      * **Haftnotizen ordnen** — viele Ideen oder Fragen sammeln, thematisch gruppieren und zu Themen verdichten.
      * **Themenspeicher** — einen Platz für Ideen oder Fragen schaffen, die gerade nicht relevant sind und später aufgegriffen werden sollen.
      * **Woran erkennen wir Erfolg?** Erfolgskriterien festlegen und die Aufmerksamkeit der Gruppe darauf richten, bis sie erfüllt sind.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  11cc1fd7daee10e8:
    english: |-
      * One of the most important attention management features in Loomio is topic-based discussion threading. There’s a reason why this format was one of the first to emerge in online communication decades ago, and continues to be used widely today: it’s a highly effective way to sort attention. Most Loomio users intuitively understand how to stay on topic when it’s listed in big letters at the top of the page.
      * Activity in Loomio is the currency of its attention economy, and everything that generates a notification spends that currency. The software has opinions about what should be considered “salient” activity that generates notifications (for example, comments, votes, and outcomes are, while a “like” on a comment is not), developed based on user feedback.
      * Users can exercise a lot of customised control over their Loomio attention economy through notification settings. Helping users set these preferences is an important tool to wisely using the attention economy of the group.
      * Subgroups can be a powerful tool to help people moderate their attention economy. If only some people need to pay attention, you can split it out.
      * The intentional but somewhat unpopular design decision to disallow concurrent proposals in Loomio is about the flow of attention — holding a group’s “feet to the fire” to fully process a proposal before moving on.
    translation: |-
      * Eine der wichtigsten Möglichkeiten, Aufmerksamkeit auf Loomio zu steuern, sind thematisch getrennte Diskussionen. Dieses Format entstand schon früh in der Online-Kommunikation und wird bis heute häufig genutzt, weil es Aufmerksamkeit wirksam ordnet. Wenn das Thema oben auf der Seite steht, fällt es den meisten leicht, dabei zu bleiben.
      * Aktivität ist die Währung der Aufmerksamkeit auf Loomio. Jede Benachrichtigung beansprucht einen Teil davon. Auf Grundlage von Rückmeldungen der Nutzerinnen und Nutzer entscheidet die Software, welche Aktivitäten eine Benachrichtigung auslösen: etwa Kommentare, Stimmen und Fazits, aber keine „Gefällt mir“-Angabe zu einem Kommentar.
      * Über die Benachrichtigungseinstellungen können Nutzerinnen und Nutzer weitgehend selbst steuern, welche Aktivitäten auf Loomio ihre Aufmerksamkeit beanspruchen. Ihnen beim Einstellen dieser Vorlieben zu helfen, unterstützt einen bewussten Umgang mit der Aufmerksamkeit der Gruppe.
      * Untergruppen können helfen, Aufmerksamkeit gezielt einzusetzen. Wenn ein Thema nur einige Menschen betrifft, könnt ihr es in eine Untergruppe verlagern.
      * Dass auf Loomio nicht mehrere Vorschläge gleichzeitig laufen können, ist eine bewusste, wenn auch nicht bei allen beliebte Entscheidung. Sie hilft der Gruppe, einen Vorschlag vollständig zu bearbeiten, bevor sie zum nächsten übergeht.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e522b56bbe8b16c9:
    english: "> Many designers of information systems incorrectly represented their design problem as information scarcity rather than attention scarcity, and as a result they built systems that excelled at providing more and more information to people, when what was really needed were systems that excelled at filtering out unimportant or irrelevant information. — **[Wikipedia](https://en.wikipedia.org/wiki/Attention_economy)**"
    translation: "> Viele Menschen, die Informationssysteme gestalten, haben das Problem fälschlich als Mangel an Informationen statt als Mangel an Aufmerksamkeit verstanden. Deshalb entwickelten sie Systeme, die immer mehr Informationen bereitstellen. Gebraucht wurden jedoch Systeme, die unwichtige oder irrelevante Informationen gut herausfiltern. — **[Wikipedia](https://en.wikipedia.org/wiki/Attention_economy)**"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  12f78aa04c29d66d:
    english: "## Facilitation Interventions"
    translation: "## Moderierende Eingriffe"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  51065e352a92bf84:
    english: There are as many facilitation techniques as there are facilitators in the world, and entire libraries of books have been written on the topic. It’s not possible to provide a comprehensive list of interventions.
    translation: Es gibt so viele Moderationstechniken wie Menschen, die moderieren. Ganze Bibliotheken wurden darüber geschrieben. Eine vollständige Liste möglicher Eingriffe ist daher nicht möglich.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1e23df53c3b816be:
    english: 'However, it might be useful to consider two categories of interventions:'
    translation: 'Es kann jedoch helfen, zwei Arten von Eingriffen zu unterscheiden:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d5738a06518b45da:
    english: |-
      1. **Supportive interventions**: inviting contribution, going deeper, drawing out, coaxing, nurturing, protecting, creating space.
      2. **Assertive interventions**: pulling back, shutting down, drawing lines, interrupting, challenging, steering on course, excluding bad behaviour.
    translation: |-
      1. **Unterstützende Eingriffe**: zur Beteiligung einladen, vertiefen, nachfragen, ermutigen, fördern, schützen und Raum schaffen.
      2. **Bestimmende Eingriffe**: bremsen, beenden, Grenzen setzen, unterbrechen, herausfordern, zum Thema zurückführen und unangemessenes Verhalten ausschließen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9f30fd7cd75da986:
    english: Almost all interventions in face-to-face facilitation can be reimagined and employed in the online space.
    translation: Fast alle Eingriffe aus der Moderation vor Ort lassen sich auch online einsetzen, wenn sie an das Format angepasst werden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1ed397ff049f2888:
    english: "> Singling people out for a contribution will just make them feel like the stupid kid in class who doesn’t know the answer. Instead, a general invite to people who haven’t spoken yet to contribute tells the regular contributors to stay quiet, and gives quieter people the opportunity to step forward. — Silvia Zuur"
    translation: "> Einzelne Personen direkt um einen Beitrag zu bitten, kann ihnen das Gefühl geben, wie ein Kind im Unterricht dazustehen, das die Antwort nicht weiß. Eine allgemeine Einladung an alle, die noch nichts gesagt haben, signalisiert den regelmäßig Beitragenden, sich zurückzuhalten. Zugleich gibt sie stilleren Menschen Gelegenheit, sich zu äußern. — Silvia Zuur"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2d6c0a7189745fe1:
    english: |-
      * Intervention tools in Loomio include comments, @mentions, adding/removing users, and starting/deleting discussions. These can be employed for various forms of supportive and assertive interventions.
      * The most commonly used intervention is the comment — simply talking to the group and inviting or trying to reduce certain behaviour.
      * [Participation permissions](/en/user_manual/groups/settings/#permissions) offer relatively blunt but effective tools to moderate users, such as allowing or disallowing posting discussions or proposals.
      * Loomio offers some trust-based features that other tools lack, such as the default ability for all participants to edit discussion contexts (even if it was posted originally by another user). These are inspired by things like Wikipedia and open source software development.
    translation: |-
      * Zu den Werkzeugen für moderierende Eingriffe auf Loomio gehören Kommentare, @Erwähnungen, das Hinzufügen und Entfernen von Nutzerinnen und Nutzern sowie das Starten und Löschen von Diskussionen. Damit lassen sich unterstützende und bestimmende Eingriffe umsetzen.
      * Am häufigsten wird ein Kommentar genutzt: Du sprichst zur Gruppe, ermutigst zu einem Verhalten oder versuchst, es zu begrenzen.
      * [Berechtigungen zur Teilnahme](/en/user_manual/groups/settings/#permissions) bieten einfache, aber wirksame Möglichkeiten zur Moderation. Du kannst zum Beispiel festlegen, ob Nutzerinnen und Nutzer Diskussionen oder Vorschläge veröffentlichen dürfen.
      * Loomio bietet einige Funktionen, die auf Vertrauen beruhen und bei anderen Werkzeugen fehlen. Standardmäßig können alle Teilnehmenden die Beschreibung einer Diskussion bearbeiten, auch wenn jemand anderes sie ursprünglich geschrieben hat. Vorbilder dafür sind unter anderem Wikipedia und die Entwicklung quelloffener Software.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
