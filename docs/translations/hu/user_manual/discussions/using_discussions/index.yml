  885a21cbc1a44f7d:
    english: "**Notified** opens the discussion notification history. It includes invitations, mentions, and replies, showing who was notified and whether each notification has been read when that information is available."
    translation: Az **Értesített** megnyitja a beszélgetés értesítési előzményeit. Itt láthatod a meghívásokat, az említéseket és a válaszokat, valamint azt, hogy ki kapott értesítést, és ahol ez az adat elérhető, elolvasta-e.
