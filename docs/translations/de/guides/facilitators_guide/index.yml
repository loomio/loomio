  980342866ab7bee6:
    english: An in-depth guide to applying key facilitation concepts in the online space.
    translation: Ein ausführlicher Leitfaden dazu, wie du wichtige Konzepte der Moderation online anwendest.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ac8728f5ce2ea8ce:
    english: Loomio is made by facilitators, and that plays a huge role in how it has been designed. This guide is about revealing more of that context, and translating facilitation concepts from the offline space to the online space.
    translation: Loomio wurde von Menschen entwickelt, die Gruppen moderieren. Ihre Erfahrungen haben die Gestaltung von Loomio stark geprägt. Dieser Leitfaden erklärt diesen Hintergrund und zeigt, wie sich Konzepte der Moderation vom persönlichen Austausch auf die Online-Zusammenarbeit übertragen lassen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e802660a44da1775:
    english: "## More about this guide"
    translation: "## Mehr über diesen Leitfaden"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5cbd64dba51ca485:
    english: Whether employed by a professional facilitator, people peer-facilitating each other, or a group that has no awareness of facilitation at all, Loomio’s essential function is to mediate and support group communication toward a desired outcome. In other words, facilitation.
    translation: 'Ob eine Fachperson die Moderation übernimmt, Menschen sich gegenseitig moderieren oder eine Gruppe sich gar nicht mit Moderation beschäftigt: Loomio hilft Gruppen, sich auszutauschen und auf ein gewünschtes Ziel hinzuarbeiten. Das ist Moderation.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  25a956280b647fa6:
    english: 'Loomio is *groupware*:'
    translation: 'Loomio ist *Groupware*:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  33e304be58a0a55b:
    english: "> Collaborative software, or groupware, is designed to help people involved in a common task achieve their goals. One of the earliest definitions of collaborative software is “intentional group processes plus software to support them.” -- Wikipedia"
    translation: "> Kollaborative Software, auch Groupware genannt, soll Menschen helfen, bei einer gemeinsamen Aufgabe ihre Ziele zu erreichen. Eine der frühesten Definitionen lautet: „bewusst gestaltete Gruppenprozesse und Software, die sie unterstützt“. -- Wikipedia"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  170a0b463e1ad8ca:
    english: There is a huge body of knowledge, best practice, and tradition in both in-person facilitation and online moderation, but the art and science of their intersection is only just emerging. This is the specific space where Loomio strives to excel.
    translation: Über die Moderation persönlicher Treffen und von Online-Räumen gibt es viel Wissen, bewährte Methoden und lange Traditionen. Wie beides zusammenwirkt, wird dagegen erst seit Kurzem erforscht und erprobt. In diesem Bereich möchte Loomio besonders hilfreich sein.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
