  226c5e321d735005:
    english: "![Thread notification settings](thread_notifications.png)"
    translation: "![Keskusteluilmoitusten asetukset](thread_notifications.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3178b3b456acd783:
    english: Thread notification settings use the same **Catch-up only**, **When notified**, and **All activity** choices. A thread setting overrides the group setting for that thread.
    translation: 'Keskusteluketjun ilmoitusasetuksissa on samat vaihtoehdot: **Vain kertaus**, **Kun ilmoitetaan** ja **Kaikki toiminta**. Keskusteluketjun oma asetus ohittaa sen ryhmän asetuksen.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f53fa37c98c9b747:
    english: |-
      >[!Note]
      >The changes in **Thread notification settings** apply only to the thread you have open. Select **Change notifications for group** to change the setting inherited by the group's other threads.
    translation: |-
      >[!Note]
      >**Keskusteluilmoitusten asetukset** koskevat vain avoinna olevaa keskusteluketjua. Valitse **Muuta ryhmän ilmoituksia**, jos haluat muuttaa asetusta, jonka ryhmän muut keskusteluketjut perivät.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  99a0923cdcdc1cdf:
    english: "## Email delivery"
    translation: "## Sähköpostit"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6cf70b2dc7cdbf83:
    english: By default, Loomio sends an email when you are notified. Depending on your group and thread notification settings, this can include mentions, replies, discussions shared with you, invitations and reminders to vote, outcomes, and polls closing soon. Choose **All activity** to also receive emails about every new comment, vote, thread, poll, and outcome.
    translation: Loomio lähettää oletusarvoisesti sähköpostin, kun saat ilmoituksen. Ryhmän ja keskusteluketjun ilmoitusasetuksista riippuen voit saada sähköpostia esimerkiksi maininnoista, vastauksista, kanssasi jaetuista keskusteluista, äänestyskutsuista ja -muistutuksista, kyselyiden päätöksistä sekä pian sulkeutuvista kyselyistä. Valitse **Kaikki toiminta**, jos haluat sähköpostin myös jokaisesta uudesta kommentista, äänestä, keskusteluketjusta, kyselystä ja kyselyn päätöksestä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ce2919b895be45b3:
    english: The **Unsubscribe** link in a notification email opens settings for that thread or group, including emails sent because someone mentioned you or replied to you. That form shows your current catch-up schedule for all groups and links to the catch-up email settings. These email links authorize only their own settings forms; they do not sign you in to Loomio.
    translation: Ilmoitussähköpostin **Lopeta tilaus** -linkki avaa kyseisen keskusteluketjun tai ryhmän asetukset. Tämä koskee myös viestejä, jotka sait, koska joku mainitsi sinut tai vastasi sinulle. Lomakkeessa näkyy kaikkia ryhmiä koskeva kertauksen aikataulusi sekä linkki kertauksen sähköpostiasetuksiin. Sähköpostilinkit antavat pääsyn vain omiin asetuslomakkeisiinsa. Ne eivät kirjaa sinua sisään Loomioon.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d615e84f882a2728:
    english: When a discussion email says that replies are accepted, you can reply directly from your email and your message will be posted into the Loomio discussion.
    translation: Jos keskustelua koskevassa sähköpostissa kerrotaan, että siihen voi vastata, voit vastata suoraan sähköpostilla. Viestisi julkaistaan Loomion keskustelussa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5b4ce168b24bc44a:
    english: Poll invitation emails show the poll and its response options, but selecting an option opens Loomio in your browser to complete the vote. You may need to sign in or confirm your account. The catch-up cannot accept replies; open the linked discussion or poll first.
    translation: Kyselyn kutsusähköpostissa näkyvät kysely ja sen vastausvaihtoehdot. Kun valitset vaihtoehdon, Loomio avautuu selaimessasi, jossa voit viimeistellä äänesi. Sinun täytyy ehkä kirjautua sisään tai vahvistaa tilisi. Kertaukseen ei voi vastata. Avaa ensin siinä oleva keskustelu- tai kyselylinkki.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0c2b2867a1ace598:
    english: "![A proposal invitation email with response options and the related thread](proposal_invitation_email.png)"
    translation: "![Ehdotuksen kutsusähköposti, jossa näkyvät vastausvaihtoehdot ja siihen liittyvä keskusteluketju](proposal_invitation_email.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a73508aa897d96cf:
    english: "## Enable mobile notifications with web push"
    translation: "## Ota mobiili-ilmoitukset käyttöön push-ilmoituksilla"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f4b14a4ba068b670:
    english: Web push is how Loomio delivers mobile notifications today. It can notify you about Loomio activity on your phone when Loomio is not open.
    translation: Loomio toimittaa mobiili-ilmoitukset push-ilmoituksina. Voit saada puhelimeesi ilmoituksia Loomion toiminnasta, vaikka Loomio ei olisi avoinna.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  811ee794dea12cd3:
    english: On Android, open **Notification settings** in a supported browser and enable push. On an iPhone or iPad, first open Loomio in Safari, use **Share** then **Add to Home Screen**, open Loomio from the new Home Screen icon, and enable push from there. Select **Test connection** to verify delivery to every browser listed under **Enabled browsers**.
    translation: Avaa Android-laitteella **Ilmoitusasetukset** tuetussa selaimessa ja ota push-ilmoitukset käyttöön. Avaa iPhonella tai iPadilla ensin Loomio Safarissa, valitse **Jaa** ja sitten **Lisää Koti-valikkoon**. Avaa Loomio uudesta Koti-valikon kuvakkeesta ja ota push-ilmoitukset käyttöön siellä. Valitse **Testaa yhteys**, jotta voit tarkistaa ilmoitusten toimituksen kaikkiin **Käytössä olevat selaimet** -kohdassa lueteltuihin selaimiin.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  72f0707b2d67bf0e:
    english: Web push also works in supported desktop browsers. Enable it there if you want Loomio notifications on your computer.
    translation: Push-ilmoitukset toimivat myös tuetuissa tietokoneen selaimissa. Ota ne käyttöön siellä, jos haluat Loomion ilmoituksia tietokoneellesi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fea7dbef040ae7f5:
    english: Once push is enabled in at least one browser, group and thread notification forms let you choose **Email**, **Push**, or **Email and push**. Email and push can use different notification settings. Push delivery can be delayed by the browser, operating system, or network connection.
    translation: Kun olet ottanut push-ilmoitukset käyttöön vähintään yhdessä selaimessa, voit valita ryhmän ja keskusteluketjun ilmoituslomakkeissa **Sähköposti**, **Push** tai **Sähköposti ja push-viestit**. Sähköpostille ja push-ilmoituksille voi valita eri ilmoitusasetukset. Selain, käyttöjärjestelmä tai verkkoyhteys voi viivästyttää push-ilmoituksia.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  210e15dcdff781ce:
    english: "![Push notification settings and enabled browsers](push_notification_settings.png)"
    translation: "![Push-ilmoitusten asetukset ja käytössä olevat selaimet](push_notification_settings.png)"
    status: machine
    provider: codex/gpt-6-sol
