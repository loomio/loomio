  b69fb514fd196dd7:
    english: "# Deleting your Loomio account"
    translation: "# Eliminar tu cuenta de Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  941f0addde6f7326:
    english: "## What does delete account mean?"
    translation: "## ¿Qué significa eliminar tu cuenta?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dab05d98ad64604f:
    english: |-
      When you delete your account:
      - Your user account including your name, email address and other personally identifying data will be deleted from our systems. You will not be able to sign in to Loomio with this account.
      - Comments, proposal and discussions you have made will remain but your name will be removed from them. We do this because we have an obligation to groups to keep threads and proposals coherent.
      - You will no longer be listed as a member of any groups.
      - You will no longer receive notification emails.
    translation: |-
      Cuando eliminas tu cuenta:
      - Eliminamos de nuestros sistemas tu cuenta de usuario, incluidos tu nombre, dirección de correo electrónico y otros datos que te identifican. Ya no podrás iniciar sesión en Loomio con esta cuenta.
      - Los comentarios, las propuestas y las discusiones que hayas creado permanecerán, pero se eliminará tu nombre de ellos. Así los grupos pueden conservar la coherencia de sus hilos y propuestas.
      - Ya no aparecerás como miembro de ningún grupo.
      - Ya no recibirás correos electrónicos de notificación.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dbeaf194bb8bd9e8:
    english: It is important to understand that copies of the data you have generated on Loomio have likely been emailed to everyone in the group - Loomio has no ability to delete those.
    translation: Es probable que se hayan enviado por correo electrónico a todas las personas del grupo copias de los datos que has generado en Loomio. Loomio no puede eliminar esas copias.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fa98dfeef486cf05:
    english: Deleting your account will _not_ cancel your subscription; to stop your payments see [Subscriptions](/en/policy/subscriptions/management#cancel-your-plan).
    translation: Eliminar tu cuenta _no_ cancelará tu suscripción. Para dejar de pagar, consulta [Suscripciones](/en/policy/subscriptions/management#cancel-your-plan).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c1ceda8f829133c7:
    english: Loomio has made fundamental decisions about its ownership, business model and software to protect users' rights. Loomio is an independent, worker-owned cooperative, the software is open source, you can [export your data](/en/user_manual/groups/data_export), and Loomio never sells your data or uses it for advertising. These commitments are set out in our [privacy policy](/en/policy/privacy) and grounded in the purpose and values in our [constitution](https://www.loomio.coop/constitution.html) and [cooperative handbook](https://www.loomio.coop/purpose_and_vision.html). If you have any questions, [contact us](/contact).
    translation: Loomio ha tomado decisiones fundamentales sobre su propiedad, modelo de negocio y software para proteger los derechos de sus usuarios. Loomio es una cooperativa independiente propiedad de sus trabajadores, su software es de código abierto, puedes [exportar tus datos](/en/user_manual/groups/data_export) y Loomio nunca vende tus datos ni los usa para publicidad. Estos compromisos figuran en nuestra [política de privacidad](/en/policy/privacy) y se basan en los objetivos y valores de nuestra [constitución](https://www.loomio.coop/constitution.html) y nuestro [manual de la cooperativa](https://www.loomio.coop/purpose_and_vision.html). Si tienes alguna pregunta, [ponte en contacto con nosotros](/contact).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d8cc22d615b8f5d9:
    english: "## To delete your account entirely"
    translation: "## Cómo eliminar tu cuenta por completo"
    status: machine
