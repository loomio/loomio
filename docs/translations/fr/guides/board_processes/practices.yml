  3242767a5e393028:
    english: Good governance includes establishing, reviewing and challenging governance practices, policies and procedures to continously improve board effectiveness.
    translation: Une bonne gouvernance passe par la mise en place, l’examen et la remise en question des pratiques, politiques et procédures, afin d’améliorer continuellement l’efficacité du conseil d’administration.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c4d8cb7f7eb901a6:
    english: However many boards are short on time and often weighed down by board papers, compliance and risk, without sufficient time to discuss and debate critical strategy and performance issues.
    translation: Pourtant, de nombreux conseils d’administration manquent de temps. Les dossiers à examiner, les obligations de conformité et la gestion des risques leur laissent souvent trop peu de temps pour débattre des questions essentielles de stratégie et de performance.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  eb59655c49bf902d:
    english: "## On Loomio\nLoomio offers the opportunity to work online on a document, policy or procedure.  Discussion and decisions are contained in a thread that members can access when and wherever works for them.  "
    translation: |-
      ## Sur Loomio
      Loomio permet de travailler en ligne sur un document, une politique ou une procédure. Les échanges et les décisions sont réunis dans une discussion que les membres peuvent consulter au moment et à l’endroit qui leur conviennent.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a0d6426929e39b38:
    english: 'Use a **thread** for each document, policy or procedure. The thread is the container for discussion, and holds document drafts and subsequent versions of the document.  '
    translation: Créez une **discussion** pour chaque document, politique ou procédure. Vous pourrez y échanger et conserver les brouillons ainsi que les versions successives du document.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  551c5aac67b42167:
    english: With a Loomio thread, you can organize so that the 2-3 people working on the document text are discussing particulars in the thread.  The thread could be private amongst just those 2-3 people, or run openly in the group so that the work is transparent to all members.
    translation: Dans une discussion Loomio, les deux ou trois personnes qui rédigent le document peuvent échanger sur les détails. La discussion peut rester privée entre elles ou être ouverte au groupe pour que tous les membres puissent suivre le travail.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1400a6d44d7d4e35:
    english: When the document reaches a draft version, use a **Sense check poll** to notify members that the draft document is ready for review, and invite members to read the document and respond with any comments or questions.  As well as letting everyone know that the work is progressing, the poll closing date encourages people to participate.
    translation: Lorsqu’un premier brouillon est prêt, lancez un **sondage de consultation** pour en informer les membres. Invitez-les à lire le document et à poser leurs questions ou à faire leurs commentaires. Le sondage permet à chacun de suivre l’avancement du travail, et sa date de clôture encourage la participation.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  44bcb71608c8f14a:
    english: The document may require several draft iterations.
    translation: Le document peut passer par plusieurs versions provisoires.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a5371854b689874a:
    english: When a 'final' draft is ready, raise a **Proposal** to approve the document.
    translation: Quand la version « définitive » est prête, lancez une **Proposition** pour faire approuver le document.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5998c94bd5b640ab:
    english: Loomio enables a board to progress work on governance improvement between meetings without eating into precious time in meetings.
    translation: Loomio permet au conseil d’administration de faire avancer ses travaux d’amélioration de la gouvernance entre les réunions, sans empiéter sur le temps de réunion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
