navigation_title: Создание группы
blocks:
  e8632dbb628c7c7d:
    english: "# Starting a new group"
    translation: "# Создание новой группы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2a4a6907d4e2049d:
    english: If you are new to Loomio, you can start a group on a free trial at any time from the [Loomio website](https://www.loomio.com/). If you already use Loomio and would like to start a new group for another organization or purpose, you can do this from the sidebar menu - click on **New group**.
    translation: Если вы ещё не пользуетесь Loomio, вы можете в любой момент создать группу с бесплатным пробным периодом на [сайте Loomio](https://www.loomio.com/). Если вы уже пользуетесь Loomio и хотите создать группу для другой организации или задачи, откройте боковое меню и нажмите **Новая группа**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  10e8756c96038e58:
    english: For many organizations, a single Loomio group is sufficient. You can start as many subgroups as you need within the group. See [Subgroups](/en/user_manual/groups/subgroups/) for more info.
    translation: Многим организациям достаточно одной группы в Loomio. Внутри неё можно создать столько подгрупп, сколько нужно. Подробнее см. в разделе [Подгруппы](/en/user_manual/groups/subgroups/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ed00dbe94cd53435:
    english: "## Group details"
    translation: "## Сведения о группе"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0bb201e3a09fe99d:
    english: "### Group name"
    translation: "### Название группы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '019cdfc169ea858a':
    english: Type your group name. It's best to keep your group name short and concise.
    translation: Введите название группы. Лучше выбрать короткое и понятное название.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6ae6b08ae7fbe257:
    english: "### Group handle"
    translation: "### Идентификатор группы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b054d0f760888add:
    english: Your group is automatically assigned a handle. The handle is used in the group's URL and email address, such as **loomio.com/your-group-handle** and **your-group-handle@loomio.com**.
    translation: Группе автоматически назначается идентификатор. Он используется в URL-адресе и адресе электронной почты группы, например **loomio.com/your-group-handle** и **your-group-handle@loomio.com**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1dee654ba628ba95:
    english: You can edit the handle when you create the group and change it later in group settings. When you change it, links and email addresses that use the old handle continue to work. Loomio keeps up to three old handles; after that, the oldest handle expires.
    translation: Идентификатор можно изменить при создании группы или позже в настройках группы. После изменения ссылки и адреса электронной почты со старым идентификатором продолжат работать. Loomio сохраняет до трёх прежних идентификаторов. Если их становится больше, самый старый перестаёт работать.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '08496ed70144fc4d':
