---
navigation_title: Invitar a votar
blocks:
  0635cf23fcaaa95b:
    english: "# Invite to vote"
    translation: "# Invitar a votar"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2ae3991d9865a2bb:
    english: "## Invite people to vote in a poll"
    translation: "## Invitar a personas a votar en un sondeo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  56d96764605291b4:
    english: Invite people to your poll by sending them a notification.
    translation: Envía una notificación para invitar a personas a votar en tu sondeo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3632ef534c8c03f7:
    english: After you start a poll, the **Invite to vote** box appears. Select an audience such as **Everyone in the thread** or your group, or enter individual names and email addresses.
    translation: Después de iniciar un sondeo, aparece el cuadro **Invitar a votar**. Selecciona un grupo de destinatarios, como **Todos en el hilo** o tu grupo, o introduce nombres y direcciones de correo electrónico individuales.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  835f178f0b52f3b6:
    english: You can include an optional message with the invitation.
    translation: Puedes incluir un mensaje en la invitación.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  78da00061d5815a4:
    english: Select a group chip to expand it into the people you are inviting. Select the x beside a name to remove that person from the invitation.
    translation: Selecciona la etiqueta de un grupo para ver a las personas que vas a invitar. Selecciona la x junto a un nombre para quitar a esa persona de la invitación.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e6969f4c4b62b6ff:
    english: "### Invite guests or experts"
    translation: "### Invitar a personas externas o expertas"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9bb72d11863e1f46:
    english: You can also invite a guest to the poll by entering their email address. They will be given permission to participate in only this poll.
    translation: También puedes invitar a una persona externa al sondeo introduciendo su dirección de correo electrónico. Solo tendrá permiso para participar en ese sondeo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dd20b166a40eb798:
    english: If the poll is within a thread, they will also be able to see that thread and its comments. They will not be able to comment, participate in other polls in the thread, or see other threads in the group.
    translation: Si el sondeo está dentro de un hilo, también podrá ver el hilo y sus comentarios. No podrá comentar, participar en otros sondeos del hilo ni ver otros hilos del grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  84cc8773a5337094:
    english: "### Invite a subgroup to vote"
    translation: "### Invitar a un subgrupo a votar"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  80ca3c8c753b0ebb:
    english: To limit voting to invited people, select **Selected people only** when you create the poll. You can then invite a subgroup from the parent group. See also [Delegated voters](/en/user_manual/groups/delegated_voters/).
    translation: Para limitar la votación a las personas invitadas, selecciona **Solo para personas seleccionadas** al crear el sondeo. Después puedes invitar a un subgrupo del grupo principal. Consulta también [Votantes delegados](/en/user_manual/groups/delegated_voters/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2074aff770fa7610:
    english: |-
      ![Selecting invited people only](invited-people-only.png)
      ![Inviting a subgroup to vote](invite-voters-subgroup.png)
    translation: |-
      ![Selección de solo personas invitadas](invited-people-only.png)
      ![Invitación a un subgrupo a votar](invite-voters-subgroup.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  29103b18580994a1:
    english: "## Engage people while a poll is running"
    translation: "## Mantener la participación mientras el sondeo está abierto"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1ce57a2542eebaab:
    english: At the bottom of the poll are several features to help you engage with people once the poll is running.
    translation: En la parte inferior del sondeo encontrarás varias funciones para mantener la participación mientras esté abierto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  45090f8260d19a47:
    english: "### Add voters to the poll"
    translation: "### Agregar votantes al sondeo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3116212829910b50:
    english: You can add new people to the poll at any time, including before voting opens on a scheduled poll.
    translation: Puedes agregar personas al sondeo en cualquier momento, incluso antes de que se abra la votación de un sondeo programado.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5e851e072e9dc1de:
    english: Select **Add voters**, then enter the names or email addresses of the people you want to add.
    translation: Selecciona **Agregar votantes** e introduce los nombres o las direcciones de correo electrónico de las personas que quieres agregar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  be5aceb4caf93c11:
    english: If the poll has a scheduled opening time and voting has not yet opened, voters will not receive an immediate notification. Instead, they will be notified when voting opens.
    translation: Si el sondeo tiene una hora de apertura programada y la votación aún no se ha abierto, las personas invitadas no recibirán una notificación inmediata. Recibirán una notificación cuando se abra la votación.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b9a08269e3e252ce:
    english: "### Remove people from the poll"
    translation: "### Quitar personas del sondeo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ce37b0af98854c79:
    english: Select **Add voters**, find the person's name, open the three-dot menu beside it, and select **Remove from proposal**.
    translation: Selecciona **Agregar votantes**, busca el nombre de la persona, abre el menú de tres puntos junto a él y selecciona **Eliminar de la propuesta**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '08df94a4269ad100':
    english: People cannot be removed from an anonymous poll.
    translation: No se puede quitar a personas de un sondeo anónimo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3d13453394c79f30:
    english: For example, an administrator who creates a poll on behalf of board members can remove themself if they are not authorised to vote.
    translation: Por ejemplo, si una persona administradora crea un sondeo en nombre de los miembros de una junta, puede quitarse si no tiene autorización para votar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2a354792a1f1f517:
    english: "### Remind people to vote"
    translation: "### Recordar a las personas que voten"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  501e7846380326fd:
    english: Select **Remind** to send a notification to people who have not voted. **Everyone invited to vote** is selected by default. Select the chip to see or change the recipients.
    translation: Selecciona **Recordar ** para enviar una notificación a las personas que aún no han votado. **Todos invitados a votar** está seleccionado de forma predeterminada. Selecciona la etiqueta para ver o cambiar los destinatarios.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  04e4537024da788c:
    english: "### View notification history"
    translation: "### Ver el historial de notificaciones"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  46145a9dd950c8eb:
    english: Open the three-dot menu (**⋯**) at the bottom of the poll and select **Notification history**.
    translation: Abre el menú de tres puntos (**⋯**) en la parte inferior del sondeo y selecciona **Historial de notificaciones**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e74eafb1566d5dea:
    english: "![Notification history in a poll's actions menu](../../discussions/notifying_people/poll_notification_history.png)"
    translation: "![Historial de notificaciones en el menú de acciones de un sondeo](../../discussions/notifying_people/poll_notification_history.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1a96cd0121fe58ec:
    english: The history shows who has been invited to vote, when each invitation was sent, and whether it has been read when that information is available.
    translation: El historial muestra quién recibió una invitación a votar, cuándo se envió cada invitación y, si esa información está disponible, si se ha leído.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3bd9a11263e1c8f4:
    english: "![Notification history for a poll](../../discussions/notifying_people/poll_notification_example.png)"
    translation: "![Historial de notificaciones de un sondeo](../../discussions/notifying_people/poll_notification_example.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f3bbc883f6429276:
    english: "### Close early"
    translation: "### Cerrar antes de tiempo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  af6a9acaafaaa96a:
    english: Select **Close early** to close a poll before its scheduled closing time.
    translation: Selecciona **Cierre temprano** para cerrar un sondeo antes de la hora de cierre programada.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3cdbb11687fa03c0:
    english: You might do this when everyone has voted or the poll no longer needs to remain open.
    translation: Puedes hacerlo cuando todas las personas hayan votado o ya no sea necesario mantener abierto el sondeo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  46f3a0ec8da6dba1:
    english: "### Reopen"
    translation: "### Reabrir"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '0821c04199937236':
    english: Select **Reopen** on a closed poll, then set a new closing date and time.
    translation: Selecciona **Reabierto** en un sondeo cerrado y establece una nueva fecha y hora de cierre.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  53079cadd493f27c:
    english: Anonymous polls cannot be reopened.
    translation: Los sondeos anónimos no se pueden reabrir.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
