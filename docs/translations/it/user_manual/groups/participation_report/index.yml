  b538bd1f65e69d28:
    english: This table shows how many threads, comments, polls, votes and reactions each user in the specified groups was responsible for during the time frame. Click specific headings in the table to sort the table by that column.
    translation: Questa tabella mostra il numero di discussioni, commenti, sondaggi, voti e reazioni a cui ha contribuito ciascun utente dei gruppi selezionati nel periodo indicato. Clicca sulle intestazioni per ordinare la tabella in base alla colonna corrispondente.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7d416ad780b3ca85:
    english: Turn on **Delegates only** to show people who are currently delegates in any of the selected groups. Their activity and voting record are aggregated across all selected groups, and delegates with no activity during the selected period remain in the table. The CSV download uses the same filter.
    translation: Attiva **Solo delegati** per mostrare le persone che sono attualmente delegate in almeno uno dei gruppi selezionati. Le loro attività e i loro voti sono aggregati per tutti i gruppi selezionati. I delegati senza attività nel periodo selezionato rimangono nella tabella. Anche il file CSV scaricato usa lo stesso filtro.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
