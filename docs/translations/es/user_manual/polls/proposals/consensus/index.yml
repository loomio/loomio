  7fdabc28ebd47ad3:
    english: A Consensus proposal seeks collective agreement from everyone involved. The default responses let participants agree, abstain, disagree, or block.
    translation: Una propuesta de consenso busca un acuerdo colectivo entre todas las personas implicadas. Las respuestas predeterminadas permiten estar de acuerdo, abstenerse, discrepar o bloquear.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  82dbfd2dd1160c29:
    english: This page explains how to run one Consensus proposal. See the [Consensus process](/en/guides/making_decisions/consensus_process) for the complete workflow from discussion and Sense check through amendment and outcome.
    translation: Esta página explica cómo llevar a cabo una propuesta de consenso. Consulta el [proceso de consenso](/en/guides/making_decisions/consensus_process) para conocer todas las etapas, desde la discusión y la comprobación inicial de posturas hasta las enmiendas y la conclusión.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  12074389ed4de458:
    english: "## When to use Consensus"
    translation: "## Cuándo usar el consenso"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e1e89b6df3a1dbe1:
    english: Use Consensus for decisions where broad ownership matters and the group is prepared to work through concerns together. It suits shared standards, governance agreements, strategic commitments, and decisions that affect the whole group.
    translation: Usa el consenso para decisiones que requieren un amplio compromiso del grupo y cuando este está dispuesto a abordar las preocupaciones en conjunto. Es adecuado para normas compartidas, acuerdos de gobernanza, compromisos estratégicos y decisiones que afectan a todo el grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a28ea900326c3254:
    english: Consensus usually requires discussion and proposal development before voting. Define the meaning and consequences of **Block** for your group. If your process does not use blocks, edit the template to remove that option.
    translation: El consenso suele requerir una discusión y la elaboración de la propuesta antes de votar. Define qué significa **Bloquear** en tu grupo y qué consecuencias tiene. Si vuestro proceso no contempla el bloqueo, edita la plantilla para eliminar esa opción.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f795d33e2be59883:
    english: "## Example: adopt a bottle return standard"
    translation: "## Ejemplo: adoptar una norma de devolución de botellas"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dda29f07ddb547f7:
    english: Oatmilk Cooperative has developed a standard covering deposits, collection, washing, food-safety records, and reporting. Because every team will use it, the cooperative seeks consensus before adopting it.
    translation: La Cooperativa de Leche de Avena ha elaborado una norma sobre depósitos, recogida, lavado, registros de seguridad alimentaria e informes. Como todos los equipos la aplicarán, la cooperativa busca el consenso antes de adoptarla.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9703f1f9474243af:
    english: "## Set up the proposal"
    translation: "## Prepara la propuesta"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e63b2959e1f6553:
    english: State the complete agreement being considered and link to supporting information. Explain each response, particularly the distinction between disagreeing and blocking. Allow enough time for questions and amendments.
    translation: Expón el acuerdo completo que se está considerando y añade enlaces a la información de apoyo. Explica cada respuesta, en particular la diferencia entre discrepar y bloquear. Deja tiempo suficiente para preguntas y enmiendas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Vota"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  955925e0c6998049:
    english: Participants choose the response that matches their position and explain the interests or concerns behind it. A block reason should identify why adopting the proposal would violate a fundamental need or agreed principle.
    translation: Cada participante elige la respuesta que refleja su postura y explica los intereses o preocupaciones que la motivan. Quien bloquee debe explicar por qué adoptar la propuesta vulneraría una necesidad fundamental o un principio acordado.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Consulta los resultados"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d5d9f0dbb463bed7:
    english: The chart shows the balance of responses. Review every disagreement and block reason; consensus is a process of resolving concerns, not only counting agreement votes.
    translation: El gráfico muestra la distribución de las respuestas. Revisa cada desacuerdo y cada motivo de bloqueo. El consenso requiere resolver las preocupaciones, además de contar los votos a favor.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f7318776f4a978fc:
    english: If the group reaches agreement, publish an outcome recording the final standard and responsibilities. Otherwise, record what will be revised and when the group will return to the proposal.
    translation: Si el grupo llega a un acuerdo, publica una conclusión que recoja la norma definitiva y las responsabilidades. Si no llega a un acuerdo, deja constancia de qué se revisará y cuándo volverá el grupo a tratar la propuesta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
