  a1b7f7b282933a3c:
    english: 'You must be an admin of the group to export it. The JSON export includes:'
    translation: 'Você precisa ser administrador do grupo para exportá-lo. A exportação em JSON inclui:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6a0b307d50fa35cf:
    english: |-
      - The group, its members and membership requests
      - Threads, comments, reactions, tags, templates, notifications and related records from the included groups
      - Polls, options, votes and outcomes; an anonymous poll is included only after it has closed
      - Subgroups you belong to
      - Open and closed subgroups when you export their parent group as a parent group admin, even if you do not belong to those subgroups
      - References to files and images attached to the included content
    translation: |-
      - O grupo, seus membros e as solicitações de entrada
      - Discussões, comentários, reações, etiquetas, modelos, notificações e registros relacionados dos grupos incluídos
      - Enquetes, opções, votos e conclusões; uma enquete anônima só é incluída depois de encerrada
      - Subgrupos dos quais você faz parte
      - Subgrupos abertos e fechados quando você exporta o grupo principal como administrador dele, mesmo que não faça parte desses subgrupos
      - Referências a arquivos e imagens anexados ao conteúdo incluído
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4dee92f966ec24c9:
    english: 'The JSON export does not include:'
    translation: 'A exportação em JSON não inclui:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a40deeed41d9937e:
    english: |-
      - Secret subgroups you do not belong to, including their membership and content
      - Subgroups awaiting deletion
      - Anonymous polls that have not closed
      - Direct threads and polls that do not belong to the group
    translation: |-
      - Subgrupos secretos dos quais você não faz parte, incluindo seus membros e conteúdo
      - Subgrupos aguardando exclusão
      - Enquetes anônimas que ainda não foram encerradas
      - Discussões diretas e enquetes que não pertencem ao grupo
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d789fbf93f8cebeb:
