    translated_on: '2026-09-29'
  96ded9027f394b57:
    english: Oatmilk Cooperative is discussing a six-week returnable bottle trial. The discussion has reached the point where the cooperative needs to approve the trial budget.
    translation: בקואופרטיב Oatmilk מתקיים דיון על ניסוי בן שישה שבועות בבקבוקים להחזרה. הדיון הגיע לשלב שבו יש לאשר את תקציב הניסוי.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7acd5f99c209cec0:
    english: Jamie selects **Start a vote**, chooses the **Consent** proposal template, and completes the title, details, options, duration, and voter settings.
    translation: ג׳יימי בוחר באפשרות **התחל הצבעה**, בוחר בתבנית ההצעה **הַסכָּמָה** וממלא את הכותרת, הפרטים, האפשרויות, משך ההצבעה והגדרות המצביעים.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c5bd111a40bc588f:
    english: "![The proposal title, details, options, duration, and voter settings](proposal-options.png)"
    translation: "![הכותרת, הפרטים, האפשרויות, משך ההצבעה והגדרות המצביעים של ההצעה](proposal-options.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7ba26dd025983d8d:
    english: Jamie limits the vote to the five people responsible for the trial budget.
    translation: ג׳יימי מגביל את ההצבעה לחמשת האנשים האחראים לתקציב הניסוי.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ef25fbaed498cfbe:
    english: The cooperative requires 60 percent participation for significant decisions, so Jamie enters **60** in the participation quorum field and starts the proposal.
    translation: הקואופרטיב דורש השתתפות של 60 אחוז בהחלטות משמעותיות, ולכן ג׳יימי מזין **60** בשדה מניין ההשתתפות ופותח את ההצעה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b1cd37eb5ed44589:
    english: Before anyone votes, the results panel shows that the quorum has not been reached.
    translation: לפני ההצבעה הראשונה, לוח התוצאות מציג שמניין ההשתתפות טרם הושג.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1b8a41f8c5939665:
    english: "![No votes cast and the 60 percent quorum not yet reached](pie-chart-0.png)"
    translation: "![טרם הוטלו קולות ומניין ההשתתפות של 60 אחוז טרם הושג](pie-chart-0.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ff36e799ac095caf:
    english: Jamie agrees and Samira disagrees. The chart updates, but two of five eligible voters is only 40 percent participation, so the quorum is still not reached.
    translation: ג׳יימי מסכים וסמירה מתנגדת. התרשים מתעדכן, אך השתתפות של שניים מתוך חמישה בעלי זכות הצבעה היא 40 אחוז בלבד, ולכן מניין ההשתתפות עדיין לא הושג.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7ad216922d5d4dcb:
    english: "![Two of five votes cast and the quorum not yet reached](pie-chart-40.png)"
    translation: "![שניים מתוך חמישה הצביעו ומניין ההשתתפות טרם הושג](pie-chart-40.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  554dc5536fdb1a60:
    english: Alex then agrees. Three of five eligible voters have participated, reaching the 60 percent quorum. The requirement now shows a green check mark. Jamie can close the poll early or wait for the remaining voters.
    translation: לאחר מכן אלכס מסכים. שלושה מתוך חמישה בעלי זכות הצבעה השתתפו, ומניין ההשתתפות של 60 אחוז הושג. כעת מופיע סימן אישור ירוק ליד הדרישה. ג׳יימי יכול לסגור את המשאל מוקדם או להמתין לשאר המצביעים.
    status: machine
    provider: codex/gpt-6-sol
