    translation: Адпраўце спіс адрасоў электроннай пошты. На ўсе новыя адрасы будуць адпраўлены запрашэнні ў групу. У адрозненне ад прагляду спіса ўдзельнікаў, для гэтай аперацыі патрэбныя правы адміністратара групы.
