  cce1047bc62d8a5e:
    english: "# Intro to Groups"
    translation: "# Bevezetés a csoportokba"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  91a303d3d1fb3894:
    english: 'A Loomio group is a safe place for people to meet, have discussions and make decisions. '
    translation: A Loomio-csoport biztonságos hely, ahol az emberek találkozhatnak, beszélgethetnek és döntéseket hozhatnak.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ea5096230dfe16d4:
    english: 'It’s a container where group members can find and share information, participate in important discussions and decisions that affect their work.  '
    translation: A csoport tagjai itt információkat találhatnak és oszthatnak meg, valamint részt vehetnek a munkájukat érintő fontos beszélgetésekben és döntésekben.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  47903117cdc64e73:
    english: A Loomio group looks like this.  At the top of the page you will see an image and logo that you can tailor to represent your organization.  This allows people arriving into your group to see they have joined a place they recognize and feel welcome - a safe space where people feel at home, amongst friends and can participate effectively.
    translation: Így néz ki egy Loomio-csoport. Az oldal tetején egy képet és egy logót látsz, amelyeket a szervezetedhez igazíthatsz. Így a csoportba érkezők felismerhetik, hová csatlakoztak, és könnyebben bekapcsolódhatnak a beszélgetésekbe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3d39462ab98c79e6:
    english: "![The Oatmilk Cooperative group page, with its description and discussion list](group_page.png)"
    translation: "![Az Oatmilk Cooperative csoport oldala a leírással és a beszélgetések listájával](group_page.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  59f3bebbce1676a6:
    english: |-
      Choose a representative name for your group and use the group description to outline;
      - **what** this group is used for,
      - **why** this is important,
      - **who** is involved, and
      - **how** members can participate.
    translation: |-
      Válassz a csoportodhoz illő nevet, és a leírásában térj ki arra;
      - **mire** használjátok a csoportot,
      - **miért** fontos,
      - **kik** vesznek részt benne, és
      - **hogyan** kapcsolódhatnak be a tagok.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  79ae54bca7eb1797:
    english: You may also include information like a code of conduct, terms of reference or other governing documents for the group.
    translation: A csoport magatartási kódexét, működési szabályzatát vagy más irányadó dokumentumait is feltüntetheted.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '018c400616dad5f4':
    english: If you are preparing a new group, see [Introducing Loomio to your group](/en/user_manual/overview/introducing_loomio) for a practical sequence from choosing the first piece of work through to recording an outcome.
    translation: Ha új csoportot hozol létre, olvasd el a [Loomio bemutatása a csoportodnak](/en/user_manual/overview/introducing_loomio) című útmutatót. A kezdeti feladat kiválasztásától a következtetés rögzítéséig végigvezet a lépéseken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1bda53ca8e31780c:
    english: "## Administration, Facilitation and Moderation - Code of Conduct"
    translation: "## Adminisztráció, facilitálás és moderálás – magatartási kódex"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1091f77d5ab879ed:
    english: 'Loomio is built to foster inclusive participation, diversity and trust - helping groups make better decisions together. '
    translation: A Loomio segíti a széles körű részvételt, a sokféle nézőpont megjelenését és a bizalom kialakulását, hogy a csoportok együtt jobb döntéseket hozhassanak.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1ac058350eea2c6d:
    english: 'Some topics bring tension in a group.  So it''s important to allow a robust discussion to take place, while ensuring it is also a safe place, particularly for vulnerable people in your group. '
    translation: Egyes témák feszültséget kelthetnek a csoportban. Fontos, hogy az alapos vita mellett mindenki biztonságban érezhesse magát, különösen a csoport sérülékenyebb tagjai.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  999bb2251bf623cd:
    english: 'We recommend establishing a code of conduct for your group, to help everyone be aware of their responsibility for appropriate behaviour and encourage self-regulation. '
    translation: Javasoljuk, hogy alkossatok magatartási kódexet a csoport számára. Ez segít tisztázni, milyen viselkedés várható el mindenkitől, és támogatja az önszabályozást.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9a77fa2d5f4fdb01:
    english: See the [Facilitator's Guide](/en/guides/facilitators_guide/commencing#culture-protocol-expectations) to further explore the value of a code of conduct.
    translation: A magatartási kódex szerepéről bővebben a [Facilitátori útmutatóban](/en/guides/facilitators_guide/commencing#culture-protocol-expectations) olvashatsz.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
