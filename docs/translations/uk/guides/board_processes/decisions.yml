---
navigation_title: Ухвалення рішень
blocks:
  0a72d2c89c87c2a7:
    english: "# Making resolutions and online decisions"
    translation: "# Ухвалення рішень і прийняття рішень онлайн"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  50902da4933b32b7:
    english: Board and committee members frequently need to make 'out-of-session' decisions. These are governance decisions and discussion where either;
    translation: 'Членам правління та комітетів часто потрібно ухвалювати рішення між засіданнями. Такі питання управління потребують обговорення, коли:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4355b569fb0f9ee4:
    english: |-
      - There was insufficient time to make a decision in the board meeting,
      - the decision does not require a lot of discussion (including administrative decisions),
      - something has happened (internally or externally) that requires the board to act before the next meeting,
      - a director has a particular interest to explore with the board.
    translation: |-
      - на засіданні правління не вистачило часу для ухвалення рішення,
      - рішення не потребує тривалого обговорення, зокрема якщо це адміністративне питання,
      - внутрішня або зовнішня подія вимагає дій правління до наступного засідання,
      - хтось із членів правління хоче обговорити з правлінням певне питання.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c46be74fd433f516:
    english: |-
      ## On Loomio
      Start a **thread** and open a discussion:
      - Introduce the topic or decision that you would like to make,
      - invite directors to comment with their thoughts, opinions and any information they have to help everyone understand their perspective about the 'out-of-session' topic or decision,
      - encourage members to participate by posting or reply to comments.
    translation: |-
      ## У Loomio
      Створіть **тему** й розпочніть обговорення:
      - Опишіть питання або рішення, яке ви хочете ухвалити,
      - запросіть членів правління поділитися думками та відомою їм інформацією, щоб усі могли зрозуміти їхню позицію щодо питання чи рішення між засіданнями,
      - заохочуйте учасників долучатися до обговорення та відповідати на коментарі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  337cfc1a7b434acd:
    english: "When ready, raise a **poll** and invite members to vote. \nIf the issue is straightforward use a **Proposal** or if the issue is more complex use a **Sense check** poll to clearly ask fellow members how they feel about the proposal.\n- State the decision and invite people to vote,\n- ask people to leave a reason for their vote, particularly if they want to qualify any points,\n- choose the decision options that work for your board's decision-making processes.\n- You can ratify and minute the 'out-of-session' decision at your next board meeting."
    translation: "Коли будете готові, створіть **опитування** та запросіть учасників проголосувати. \nЯкщо питання просте, використайте **Пропозиція**. Якщо воно складніше, використайте опитування **Перевірка сенсу**, щоб дізнатися, як учасники ставляться до пропозиції.\n- Сформулюйте рішення та запросіть учасників проголосувати,\n- попросіть учасників пояснити свій голос, особливо якщо вони хочуть уточнити свою позицію,\n- виберіть варіанти голосування, які відповідають порядку ухвалення рішень вашою радою.\n- Ви можете затвердити рішення, ухвалене поза засіданням, і внести його до протоколу на наступному засіданні ради."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  19a80c3ce7d106e0:
    english: It's not a failure if a decision does not get agreement. You can ask members what changes they would make to enable them to agree to a decision. This helps you build to a better decision. A new Proposal with amendments is then more likely to achieve agreement.
    translation: Якщо рішення не здобуло підтримки, це не означає невдачу. Запитайте учасників, які зміни допомогли б їм його підтримати. Так ви зможете поліпшити рішення. Нова Пропозиція з урахуванням цих змін матиме більше шансів здобути підтримку.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b06f2d2a0e68f99d:
    english: State an **outcome** when the proposal closes. Let everyone know the result of the decision and what will happen next.
    translation: Коли голосування за пропозицію завершиться, опублікуйте **висновок**. Повідомте всім, яке рішення ухвалено і що буде далі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6a4d6a8c978bcb11:
    english: "## Examples of out-of-session decisions"
    translation: "## Приклади рішень між засіданнями"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fff64b1ac620cc4a:
    english: |-
      ### Decision about property purchase
      At the last board meeting, a property purchase was discussed. A director required an independent engineering report before making the decision. At the board meeting, the board agreed to purchase the property subject to a satisfactory engineering report. However as the purchase must be made before the next board meeting, the board agreed to upload the engineering report to Loomio when ready, for discussion and to make the final decision for the property purchase on Loomio.
    translation: |-
      ### Рішення про придбання нерухомості
      На попередньому засіданні правління обговорювало придбання нерухомості. Один із членів правління попросив незалежний інженерний висновок, перш ніж ухвалювати рішення. Правління погодилося придбати нерухомість за умови, що висновок буде задовільним. Оскільки придбання потрібно завершити до наступного засідання, правління вирішило завантажити готовий висновок у Loomio, обговорити його там і ухвалити остаточне рішення щодо придбання.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b279ed6b1c5aadfa:
    english: |-
      ### Decision to accept Directors and Officers Liability insurance
      During the board meeting it was noted that the annual insurance renewal was coming up. As this was considered to be an administrative matter, the board agreed to use Loomio to discuss the renewal application, seek the required information from each director, submit the application and to accept the insurance renewal quote.
    translation: |-
      ### Рішення про страхування відповідальності членів правління та посадових осіб
      На засіданні правління зазначили, що наближається час щорічного поновлення страхування. Оскільки це адміністративне питання, правління вирішило використати Loomio, щоб обговорити заяву на поновлення, зібрати потрібну інформацію від кожного члена правління, подати заяву та прийняти пропозицію щодо поновлення страхування.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ca3a40286ca25a9a:
    english: |-
      ### A security breach has occurred at one of our facilities
      A break-in and theft of property has occurred that has put the corporation and staff at risk. Directors must be made aware of the event and risks, and evaluate an appropriate response.
    translation: |-
      ### Порушення безпеки на одному з наших об’єктів
      На об’єкті стався злам і викрадення майна, що створило ризики для організації та працівників. Членів правління потрібно повідомити про подію та ризики, щоб вони могли визначити належні дії.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c406842807e1091b:
    english: |-
      ### A director has challenged the board about gender and diversity of board membership
      The director has provided good reasons and evidence that the board should diversify membership to be more representative of the corporation. Directors need to digest the information, ask questions, discuss the issue and decide a response.
    translation: |-
      ### Член правління порушив питання гендерного та іншого різноманіття складу правління
      Член правління навів вагомі аргументи й докази на користь того, що склад правління має бути різноманітнішим і краще представляти організацію. Членам правління потрібно ознайомитися з інформацією, поставити запитання, обговорити питання й вирішити, як діяти.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bf35cdb4a62a85f4:
    english: "## Keeping a record of decisions made and supporting discussion"
    translation: "## Зберігання рішень і пов’язаних обговорень"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6231d476f6bddb27:
    english: Record keeping is a legal requirement for governance boards and good practice for committees.
    translation: Для правлінь ведення документації є вимогою закону, а для комітетів — належною практикою.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  511470c795509c7e:
    english: Today, many organizations record and store formal minutes, resolutions, policies and key decisions electronically. Document records are created and approved, distributed and used, retained and stored, and ultimately disposed of.
    translation: Сьогодні багато організацій ведуть і зберігають протоколи, рішення, політики та інші важливі документи в електронному вигляді. Документи створюють і затверджують, поширюють і використовують, зберігають, а згодом утилізують.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  324fc531e7a78088:
    english: |-
      ### On Loomio
      Minutes, reports, resolutions and other documents can be attached to a meeting **thread**, in the thread context, within a poll or any to thread comment.  This means the documents are always associated with the relevant discussion.
    translation: |-
      ### У Loomio
      Протоколи, звіти, рішення та інші документи можна додати до **теми** засідання: у контекст теми, в опитування або до будь-якого коментаря в темі. Так документи залишаються пов’язаними з відповідним обговоренням.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9be58ccab5189118:
    english: A list of files can also be found under the **Files** tab.
    translation: Список файлів також доступний на вкладці **Файли**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  24bc6a0bf5139b23:
    english: You can also add a link within any thread or poll to a document stored in your preferred document management system.  Find the online shareable link to the document, copy and paste into your thread, poll or comment.
    translation: У будь-якій темі чи опитуванні ви також можете додати посилання на документ у вашій системі керування документами. Знайдіть посилання для спільного доступу до документа, скопіюйте його та вставте в тему, опитування або коментар.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4fee216f27a3fdff:
    english: Anyone with permission can then click the link to open and read the document.
    translation: Кожен, хто має дозвіл на доступ, зможе перейти за посиланням і прочитати документ.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9f0e1cd18ae1a402:
    english: Because Loomio discussions and decisions are always already documented, it provides a robust way to verify all your board's decision-making. You can easily demonstrate what was decided, and when. If directors have discussed and commented, as well as voted on a resolution—you will also know how and why each decision was reached.
    translation: Обговорення та рішення в Loomio документуються, тому ви можете перевірити, як правління ухвалювало рішення. Легко побачити, що й коли було вирішено. Якщо члени правління обговорювали рішення, коментували його та голосували, ви також знатимете, як і чому його ухвалили.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  71071cda2f1c034e:
    english: Over time, you are creating a history for your organization where you can easily search and find past decisions and related discussion.
    translation: З часом у вас накопичиться історія роботи організації, у якій можна легко знайти попередні рішення та пов’язані з ними обговорення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  629c2034788a9fd5:
    english: In Loomio all data is written and stored on multiple disks and multiple locations, *in the cloud*, backed up daily.  Files uploaded are stored on servers that use modern techniques to remove bottlenecks and points of failure.
    translation: У Loomio всі дані зберігаються на кількох дисках у різних місцях, *у хмарі*, і щодня копіюються для резервного зберігання. Завантажені файли зберігаються на серверах, де сучасні технології допомагають уникати перевантажень і збоїв.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
