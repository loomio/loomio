  ef744e4acfdb7653:
    english: "## Redact User"
    translation: "## Удаление личных данных пользователя"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4a423dbb4fd59b45:
    english: Redaction keeps the user's comments and other user-generated content within their groups, but removes known personally identifying information such as name, bio, profile photo, email address, login credentials, identities, and active sessions.
    translation: 'При удалении личных данных комментарии пользователя и другие созданные им материалы остаются в его группах. При этом удаляются известные персональные данные: имя, биография, фотография профиля, адрес электронной почты, учётные данные для входа, внешние идентификаторы и активные сеансы.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9b472af7dbef98ac:
    english: This is the recommended way to remove a user from Loomio.
    translation: Это рекомендуемый способ удалить пользователя из Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9839b052c7f487d6:
    english: "`POST /api/b3/users/:id/redact`"
    translation: "`POST /api/b3/users/:id/redact`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  de96fb46de14e0d4:
    english: "`POST /api/b3/users/identity/:identity_type/:uid/redact`"
    translation: "`POST /api/b3/users/identity/:identity_type/:uid/redact`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ce9efb629e50628c:
    english: "## Delete User"
    translation: "## Удаление пользователя"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a37f91309a44b472:
    english: Delete removes the user and records the user created. Comments are removed from threads, votes are removed from polls, and groups, discussions, polls, and other records created by the user may also be deleted through database associations.
    translation: При удалении исчезают учётная запись пользователя и созданные им записи. Комментарии удаляются из обсуждений, голоса — из голосований. Связи в базе данных могут также привести к удалению групп, обсуждений, голосований и других записей, созданных пользователем.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  537bd891e445eb93:
    english: This is very destructive. Redaction is highly recommended instead.
    translation: Удаление может привести к значительной потере данных. Вместо него настоятельно рекомендуется обезличивание.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5a8f0f08bf2e3748:
    english: "`DELETE /api/b3/users/:id`"
    translation: "`DELETE /api/b3/users/:id`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aa43693fccf0741e:
    english: "`DELETE /api/b3/users/identity/:identity_type/:uid`"
    translation: "`DELETE /api/b3/users/identity/:identity_type/:uid`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5363d74e43453a93:
    english: "## SSO Profile Sync Settings"
    translation: "## Настройки синхронизации профиля через SSO"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5d1d8b72689c1c84:
    english: Use these settings when another system manages Loomio profile fields.
    translation: Используйте эти настройки, если полями профиля Loomio управляет другая система.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  83b6503850a3581c:
    english: "`LOOMIO_DISABLE_EDIT_USER_PROFILE=1` prevents users from editing these fields themselves:"
    translation: "`LOOMIO_DISABLE_EDIT_USER_PROFILE=1` запрещает пользователям самостоятельно изменять следующие поля:"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b40beb01122e6c22:
    english: |-
      | Field | Notes |
      | --- | --- |
      | `name` | Managed by external sync |
      | `username` | Managed by external sync |
      | `email` | Managed by external sync |
      | `avatar_kind` / `uploaded_avatar` | Managed by external sync |
    translation: |-
      | Поле | Примечания |
      | --- | --- |
      | `name` | Управляется внешней синхронизацией |
      | `username` | Управляется внешней синхронизацией |
      | `email` | Управляется внешней синхронизацией |
      | `avatar_kind` / `uploaded_avatar` | Управляется внешней синхронизацией |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d914243a6d80944b:
    english: Users can still edit Loomio-local fields such as `short_bio` and `location`.
    translation: Пользователи по-прежнему могут изменять локальные поля Loomio, например `short_bio` и `location`.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d2d40191ec060f7e:
    english: "`LOOMIO_SSO_UPDATE_USER_PROFILE_ON_LOGIN=1` updates `name` and `email` from SSO login data. Leave it commented out or unset when an external sync script should be the only source of those updates."
    translation: "`LOOMIO_SSO_UPDATE_USER_PROFILE_ON_LOGIN=1` обновляет `name` и `email` на основе данных входа через SSO. Если единственным источником этих обновлений должен быть внешний скрипт синхронизации, оставьте эту строку закомментированной или не задавайте переменную."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f19f0588ef52b814:
    english: "`LOOMIO_SSO_FORCE_USER_ATTRS` still works for existing installs. It both disables user edits and updates `name` and `email` on SSO login."
    translation: "`LOOMIO_SSO_FORCE_USER_ATTRS` по-прежнему работает в существующих установках. Эта настройка запрещает пользователям изменять профиль и обновляет `name` и `email` при входе через SSO."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
