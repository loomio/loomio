  435f52763f0d9a5b:
    english: To keep a record of a thread discussion and decisions in polls, use **[Print thread](/en/user_manual/groups/data_export#print-thread-to-pdf)** and print the file to pdf.  You can then store a published copy of the thread in your chosen document storage archive.
    translation: Um eine Diskussion und die Entscheidungen aus Abstimmungen aufzubewahren, nutze **[Thread drucken](/en/user_manual/groups/data_export#print-thread-to-pdf)** und drucke die Datei als PDF. Eine veröffentlichte Kopie des Threads kannst du anschließend in deinem Dokumentenarchiv speichern.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a6b96750c9e1e590:
    english: To keep a complete record of the data in your Loomio group, use **[Export group data](/en/user_manual/groups/data_export#group-data-backup-or-export)**.
    translation: Um alle Daten deiner Loomio-Gruppe aufzubewahren, nutze **[Gruppendaten exportieren](/en/user_manual/groups/data_export#group-data-backup-or-export)**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
