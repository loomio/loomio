  c719d051fa2f700e:
    english: "# Score"
    translation: "# Pisteytys"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  517adc384b38d256:
    english: Score measures how participants evaluate each option on a shared numeric scale. Unlike Choose, it asks people to respond to every option, so the results show both what people prefer and how strongly they prefer it.
    translation: Pisteytyksessä osallistujat arvioivat jokaisen vaihtoehdon samalla numeroasteikolla. Jokainen vastaa kaikkiin vaihtoehtoihin. Tuloksista näet, mitä osallistujat pitävät parempana ja kuinka vahvasti.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a678333f6d814e87:
    english: "## When to use Score"
    translation: "## Milloin käyttää pisteytystä"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c4ca19abb53e3ddc:
    english: 'Use Score when every option can be evaluated independently against the same question. It works well for:'
    translation: 'Käytä pisteytystä, kun jokaisen vaihtoehdon voi arvioida erikseen saman kysymyksen perusteella. Se sopii esimerkiksi:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c77c1ad6b2a9d697:
    english: |-
      - assessing how ready each part of a project is;
      - rating the importance of several principles;
      - measuring interest in possible meeting topics;
      - evaluating grant applications against a common criterion; or
      - comparing the suitability of several proposals.
    translation: |-
      - projektin eri osien valmiuden arviointiin;
      - useiden periaatteiden tärkeyden arviointiin;
      - mahdollisten kokousaiheiden kiinnostavuuden mittaamiseen;
      - apurahahakemusten arviointiin samalla perusteella; tai
      - useiden ehdotusten soveltuvuuden vertailuun.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d91459d96a31a671:
    english: Define what the bottom and top of the scale mean. A number without a shared definition can mean different things to different voters. Use [Choose](/en/user_manual/polls/choose/) when you only need selections, or [Allocate](/en/user_manual/polls/allocate/) when participants must make trade-offs within a limited budget.
    translation: Määrittele, mitä asteikon pienin ja suurin arvo tarkoittavat. Ilman yhteistä määritelmää sama luku voi tarkoittaa eri äänestäjille eri asioita. Käytä [Valintaa](/en/user_manual/polls/choose/), jos tarvitset vain valinnat, tai [Pisteiden jakoa](/en/user_manual/polls/allocate/), jos osallistujien on jaettava rajallinen pistemäärä vaihtoehtojen kesken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6160518dc06b70a7:
    english: "## Example: score possible trial locations"
    translation: "## Esimerkki: kokeilupaikkojen pisteyttäminen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a75c387743cad529:
    english: Oatmilk Cooperative is choosing locations for a returnable-bottle trial. It asks members to score four locations from 0 (**unsuitable**) to 10 (**ideal**), considering customer access, staff capacity, storage, and collection transport.
    translation: Oatmilk Cooperative valitsee paikkoja palautettavien pullojen kokeiluun. Se pyytää jäseniä pisteyttämään neljä paikkaa asteikolla 0 (**sopimaton**) – 10 (**ihanteellinen**). Arvioinnissa huomioidaan asiakkaiden pääsy paikalle, henkilöstön kapasiteetti, varastointi ja pullojen keräyskuljetukset.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c74ebb16f872b3c6:
    english: "## Set up the poll"
    translation: "## Luo kysely"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b03122ee279f9c91:
    english: State one question that applies equally to every option. Add the items to be assessed, set the **Minimum score** and **Maximum score**, and explain the endpoints in the details. Option meanings can clarify the scope of each item.
    translation: Esitä yksi kysymys, joka koskee kaikkia vaihtoehtoja samalla tavalla. Lisää arvioitavat kohteet, aseta **Minimipistemäärä** ja **Maksimipistemäärä** ja selitä asteikon ääripäät lisätiedoissa. Voit täsmentää kunkin kohteen arvioinnin laajuutta vaihtoehtojen kuvauksissa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  85e66520acf78264:
    english: Choose a scale participants can apply consistently. A 0–5 scale is quick to use; a 0–10 scale allows finer distinctions. More precision does not necessarily produce better information, so use the shortest scale that fits the question.
    translation: Valitse asteikko, jota osallistujat voivat käyttää johdonmukaisesti. Asteikko 0–5 on nopea käyttää, kun taas asteikko 0–10 mahdollistaa tarkemmat erot. Tarkempi asteikko ei välttämättä tuota parempaa tietoa, joten valitse kysymykseen sopiva mahdollisimman lyhyt asteikko.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bb3998655598796f:
    english: Anonymous voting and showing options in random order can be useful when you want to reduce social or ordering effects.
    translation: Anonyymi äänestys ja vaihtoehtojen näyttäminen satunnaisessa järjestyksessä voivat vähentää muiden ihmisten ja vaihtoehtojen järjestyksen vaikutusta vastauksiin.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Äänestä"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  33199814c9ad8a64:
    english: Participants move a slider to score every option. In this example, the voter scores Central Station cafe at 8, Riverside market at 6, the University food court at 7, and Harbour offices at 5.
    translation: Osallistujat pisteyttävät jokaisen vaihtoehdon liukusäätimellä. Tässä esimerkissä äänestäjä antaa Central Station cafelle 8 pistettä, Riverside marketille 6, University food courtille 7 ja Harbour officesille 5.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fba3d21a09846414:
    english: The reason explains how the voter applied the scale. This helps the group distinguish a low score caused by missing information from one caused by substantive concern.
    translation: Äänestyksen perustelu kertoo, miten äänestäjä käytti asteikkoa. Se auttaa ryhmää erottamaan, johtuuko pieni pistemäärä tiedon puutteesta vai varsinaisesta huolesta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Lue tuloksia"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  846b7759f9d54232:
    english: 'For each option, the results show:'
    translation: 'Tuloksissa näkyy jokaiselle vaihtoehdolle:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cac30fa54f0aeaf7:
    english: |-
      - **Points**: the sum of all scores;
      - **Mean**: the average score; and
      - **Voters**: how many people scored the option.
    translation: |-
      - **Pisteet**: kaikkien annettujen pisteiden summa;
      - **Tarkoittaa**: pisteiden keskiarvo; ja
      - **Äänestäjät**: kuinka moni pisteytti vaihtoehdon.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7e063d4b1babcb9e:
    english: In this example, **Central Station cafe** has the highest mean at 7.5. **Harbour offices** has the lowest mean at 5.25, while Riverside market and the University food court are tied at 7. Four of five invited people have voted, so the group can also see that one response is outstanding.
    translation: Tässä esimerkissä **Central Station cafen** keskiarvo on korkein, 7,5. **Harbour officesin** keskiarvo on matalin, 5,25. Riverside marketin ja University food courtin keskiarvo on kummankin 7. Kutsutuista viidestä henkilöstä neljä on äänestänyt, joten ryhmä näkee myös, että yksi vastaus puuttuu.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  147800d3643d9942:
    english: Compare means only when the options have a similar number of voters. Read the vote reasons before treating a small difference as meaningful, and publish an outcome explaining what action follows from the scores.
    translation: Vertaa keskiarvoja vain silloin, kun vaihtoehdoilla on suunnilleen yhtä monta äänestäjää. Lue äänestysten perustelut ennen kuin pidät pientä eroa merkityksellisenä. Julkaise lopuksi päätelmä, jossa kerrot, mihin toimiin pisteiden perusteella ryhdytään.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
