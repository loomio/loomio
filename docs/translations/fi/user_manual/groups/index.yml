  59f3bebbce1676a6:
    english: |-
      Choose a representative name for your group and use the group description to outline;
      - **what** this group is used for,
      - **why** this is important,
      - **who** is involved, and
      - **how** members can participate.
    translation: |-
      Valitse ryhmällesi kuvaava nimi ja kerro ryhmän kuvauksessa;
      - **mihin** ryhmää käytetään,
      - **miksi** ryhmä on tärkeä,
      - **ketkä** osallistuvat ja
      - **miten** jäsenet voivat osallistua.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  79ae54bca7eb1797:
    english: You may also include information like a code of conduct, terms of reference or other governing documents for the group.
    translation: Voit lisätä kuvaukseen myös ryhmän käytännesäännöt, tehtävänkuvauksen tai muita ryhmän toimintaa ohjaavia asiakirjoja.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '018c400616dad5f4':
    english: If you are preparing a new group, see [Introducing Loomio to your group](/en/user_manual/overview/introducing_loomio) for a practical sequence from choosing the first piece of work through to recording an outcome.
    translation: Jos olet perustamassa uutta ryhmää, tutustu sivuun [Loomion esittely ryhmällesi](/en/user_manual/overview/introducing_loomio). Siinä käydään läpi käytännön vaiheet ensimmäisen tehtävän valinnasta lopputuloksen kirjaamiseen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1bda53ca8e31780c:
    english: "## Administration, Facilitation and Moderation - Code of Conduct"
    translation: "## Ryhmän hallinnointi, keskustelun ohjaaminen ja moderointi – käytännesäännöt"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1091f77d5ab879ed:
    english: 'Loomio is built to foster inclusive participation, diversity and trust - helping groups make better decisions together. '
    translation: Loomio tukee kaikkien osallistumista, erilaisia näkökulmia ja luottamusta. Näin ryhmät voivat tehdä parempia päätöksiä yhdessä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1ac058350eea2c6d:
    english: 'Some topics bring tension in a group.  So it''s important to allow a robust discussion to take place, while ensuring it is also a safe place, particularly for vulnerable people in your group. '
    translation: Jotkin aiheet voivat aiheuttaa ryhmässä jännitteitä. Keskustelulle on tärkeää antaa tilaa ja huolehtia samalla sen turvallisuudesta, erityisesti ryhmän haavoittuvassa asemassa oleville jäsenille.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  999bb2251bf623cd:
    english: 'We recommend establishing a code of conduct for your group, to help everyone be aware of their responsibility for appropriate behaviour and encourage self-regulation. '
    translation: Suosittelemme laatimaan ryhmälle käytännesäännöt. Ne auttavat kaikkia ymmärtämään vastuunsa asiallisesta käytöksestä ja säätelemään omaa toimintaansa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9a77fa2d5f4fdb01:
    english: See the [Facilitator's Guide](/en/guides/facilitators_guide/commencing#culture-protocol-expectations) to further explore the value of a code of conduct.
    translation: Lue [keskustelun ohjaajan opas](/en/guides/facilitators_guide/commencing#culture-protocol-expectations), jos haluat tutustua tarkemmin käytännesääntöjen hyötyihin.
    status: machine
