  77f49576383e36ca:
    english: Is the problem or opportunity is worth pursuing?  Takashi is experiencing problems with his old computer, and it crashed during a recent presentation.
    translation: Lohnt es sich, dem Problem oder der Chance nachzugehen?  Takashi hat Probleme mit seinem alten Computer. Bei einer kürzlichen Präsentation ist er abgestürzt.
