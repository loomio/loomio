blocks:
  92702560a3786c85:
    english: "# Rank"
    translation: "# דַרגָה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7cf7aa3423ff6b9d:
    english: Rank finds the group's overall order of preference. Participants arrange options from most to least preferred, and Loomio assigns more points to higher-ranked options.
    translation: דירוג מציג את סדר ההעדפות הכולל של הקבוצה. המשתתפים מסדרים את האפשרויות מהמועדפת ביותר לפחות מועדפת, ולומיו מעניקה יותר נקודות לאפשרויות שדורגו גבוה יותר.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72790fdf21d1f129:
    english: "## When to use Rank"
    translation: "## מתי להשתמש בדירוג"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f9ce50752bf1c1e7:
    english: 'Use Rank when preference order matters and you want one overall ordering. It works well for:'
    translation: 'כדאי להשתמש בדירוג כשסדר ההעדפות חשוב ונדרש סדר כולל אחד. הוא מתאים ל:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a5c8ee257df4dc2:
    english: |-
      - selecting one candidate for a position;
      - ordering projects for a work plan;
      - prioritizing conference topics;
      - choosing backup options as well as a first choice; or
      - reducing a long list to an ordered shortlist.
    translation: |-
      - בחירת מועמדות או מועמדות לתפקיד;
      - סידור פרויקטים לתוכנית עבודה;
      - קביעת סדר עדיפות לנושאי כנס;
      - בחירת אפשרויות חלופיות לצד האפשרות המועדפת; או
      - צמצום רשימה ארוכה לרשימה קצרה ומדורגת.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2549ddaa8a4a4fa8:
    english: Rank uses a points-based ordering. It is not a proportional election method. To elect several people while representing different groups of voters, use an [STV Election](/en/user_manual/polls/stv/).
    translation: הדירוג מבוסס על נקודות. זו אינה שיטת בחירות יחסית. לבחירת כמה אנשים תוך ייצוג של קבוצות מצביעים שונות, יש להשתמש ב[בחירות STV](/en/user_manual/polls/stv/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2a859bf73143ce12:
    english: "## Example: rank bottle designs"
    translation: "## דוגמה: דירוג עיצובי בקבוקים"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  46a7d343d3b48bea:
    english: Oatmilk Cooperative asks members to rank four bottle designs for its returnable-bottle trial. Participants consider handling, durability, customer needs, storage, and compatibility with the washing equipment.
    translation: קואופרטיב חלב שיבולת השועל מבקש מחברי הקבוצה לדרג ארבעה עיצובים של בקבוקים לניסוי בבקבוקים רב־פעמיים. המשתתפים שוקלים את נוחות השימוש, העמידות, צורכי הלקוחות, האחסון וההתאמה לציוד השטיפה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c74ebb16f872b3c6:
    english: "## Set up the poll"
    translation: "## הגדרת המשאל"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5975d0fd35ec0a7c:
    english: State what the ranking will determine and add the options. Set **Number of choices** to control how many options each person may rank. A first choice receives the most points, the next choice receives one fewer, and unranked options receive no points.
    translation: יש לציין מה יקבע הדירוג ולהוסיף את האפשרויות. ההגדרה **מספר אפשרויות** קובעת כמה אפשרויות כל אדם יכול לדרג. האפשרות שבמקום הראשון מקבלת את מספר הנקודות הגבוה ביותר, האפשרות הבאה מקבלת נקודה אחת פחות, ואפשרויות שלא דורגו אינן מקבלות נקודות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  47f32c81e29fa3c6:
    english: Require all options to be ranked when you need a complete ordering. Allow fewer choices when participants may not know enough to rank everything. Showing options in random order can reduce the influence of their initial presentation.
    translation: כשנדרש סדר מלא, יש לחייב דירוג של כל האפשרויות. כשהמשתתפים עשויים שלא להכיר את כולן מספיק, ניתן לאפשר דירוג של פחות אפשרויות. הצגת האפשרויות בסדר אקראי עשויה לצמצם את השפעת סדר ההצגה הראשוני.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## הצבעה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  53946361c36775f0:
    english: Participants drag the options into their preferred order, with number 1 as the first choice. They can add a reason explaining the criteria behind their ranking.
    translation: המשתתפים גוררים את האפשרויות לסדר הרצוי, כשמספר 1 מציין את הבחירה הראשונה. ניתן להוסיף נימוק שמסביר את השיקולים לדירוג.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eae63303cb9dced6:
    english: In this example, the voter puts the **500 ml amber bottle** first and the **500 ml clear bottle** second because both fit the existing cafe storage and washing equipment.
    translation: בדוגמה זו, **בקבוק ענברי בנפח 500 מ״ל** מדורג ראשון ו**בקבוק שקוף בנפח 500 מ״ל** מדורג שני, משום ששניהם מתאימים לאחסון ולציוד השטיפה הקיימים בבית הקפה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## קריאת התוצאות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6be27268f870dc3e:
    english: 'The results combine all ballots into an overall points-based ranking. For each option they show:'
    translation: 'התוצאות משלבות את כל ההצבעות לדירוג כולל המבוסס על נקודות. לכל אפשרות מוצגים:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  88b912ae1b9787bc:
    english: |-
      - **Rank**: its position in the combined result;
      - **% of points**: its share of all ranking points;
      - **Points**: the total points from all ballots;
      - **Mean**: its average points per voter; and
      - **Voters**: how many people ranked it.
    translation: |-
      - **דַרגָה**: המיקום שלה בתוצאה המשולבת;
      - **אחוז הנקודות**: חלקה מתוך כלל נקודות הדירוג;
      - **נקודות**: סך הנקודות שקיבלה בכל ההצבעות;
      - **מתכוון**: ממוצע הנקודות שקיבלה מכל מצביע; וכן
      - **מצביעים**: מספר האנשים שדירגו אותה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2e0cda6f79f31a51:
    english: In this example, the **500 ml amber bottle** ranks first, followed by the **500 ml clear bottle** and the **750 ml amber bottle**. The group can investigate the preferred design first while retaining the remaining order as a sequence of alternatives.
    translation: בדוגמה זו, **בקבוק ענברי בנפח 500 מ״ל** מדורג ראשון, ואחריו **בקבוק שקוף בנפח 500 מ״ל** ו**בקבוק ענברי בנפח 750 מ״ל**. הקבוצה יכולה לבדוק תחילה את העיצוב המועדף ולשמור את סדר האפשרויות הנותרות כחלופות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  22df687a6fa02ddb:
    english: A points-based result can conceal different preference patterns that produce the same total. Review individual ballots and vote reasons when options are close or the decision is consequential.
    translation: תוצאה המבוססת על נקודות עשויה להסתיר דפוסי העדפה שונים שמובילים לאותו סכום. כשהתוצאות קרובות או כשההחלטה משמעותית, כדאי לעיין בהצבעות האישיות ובנימוקי ההצבעה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
