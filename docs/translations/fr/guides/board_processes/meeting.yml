---
navigation_title: Préparer une réunion
blocks:
  165e9dec4d4660aa:
    english: "# Prepare for a meeting"
    translation: "# Préparer une réunion"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5d14c790e0c05446:
    english: Effective meetings are productive, inclusive, and collaborative - they improve engagement, help build strong relationships, establish alignment, make better and faster decisions, promote inclusion, facilitate creative thinking and innovation, are a great channel for feedback and continuous improvement.
    translation: Une réunion efficace permet de travailler ensemble, de faire participer chacun et de prendre des décisions plus éclairées et plus rapides. Elle renforce les relations, aide à trouver un accord, favorise la créativité et offre un espace pour les retours et l’amélioration continue.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c69f325003094ac5:
    english: Use Loomio to plan an effective meeting; involve people from the outset, align towards the most important topics, and make better use of your precious time together.
    translation: Utilisez Loomio pour préparer une réunion efficace. Faites participer les personnes concernées dès le départ, concentrez-vous sur les sujets les plus importants et profitez au mieux du temps passé ensemble.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a30a32e8b06a9432:
    english: If the group is new to Loomio, begin with [Introducing Loomio to your group](/en/user_manual/overview/introducing_loomio), then use this meeting process as a practical first recurring workflow.
    translation: Si votre groupe découvre Loomio, commencez par [Présenter Loomio à votre groupe](/en/user_manual/overview/introducing_loomio), puis utilisez cette méthode de préparation des réunions comme premier processus régulier.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9a0eb26797e28e0f:
    english: There are several things you can do to make your next board or committee meeting effective...
    translation: Voici plusieurs façons de rendre votre prochaine réunion du conseil ou du comité plus efficace…
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c04e8fcfc9edb01c:
    english: |-
      - [Meeting focus and review actions](#meeting-focus-and-review-actions)
      - [Announce agenda and notify](#agenda-and-notify)
      - [Find a time for meeting](#find-a-time-for-meeting)
      - [Sign off minutes](#sign-off-minutes)
      - [Approve reports](#approve-reports)
    translation: |-
      - [Définir les priorités de la réunion et faire le point sur les actions](#meeting-focus-and-review-actions)
      - [Communiquer l’ordre du jour et envoyer une notification](#agenda-and-notify)
      - [Trouver une date pour la réunion](#find-a-time-for-meeting)
      - [Approuver le compte-rendu](#sign-off-minutes)
      - [Approuver les rapports](#approve-reports)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6e6785b547007644:
    english: "## Meeting focus and review actions"
    translation: "## Définir les priorités de la réunion et faire le point sur les actions"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  26bf98782eb61549:
    english: 'Establish a focus for the meeting, so you spend your precious time together talking about the most important topics.  '
    translation: Définissez les priorités de la réunion pour consacrer le temps passé ensemble aux sujets les plus importants.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c23fdd52f0a29b2c:
    english: Inviting members to contribute to the agenda helps everyone align, think about topics and energize for the meeting.
    translation: Inviter les membres à contribuer à l’ordre du jour aide chacun à réfléchir aux sujets, à se mettre d’accord sur les priorités et à se préparer à la réunion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  52409f3ffabfb7d1:
    english: |-
      Actions:
      - focus the meeting on the most important things,
      - follow up and talk to members about actions from previous meetings.
    translation: |-
      Actions :
      - concentrer la réunion sur les sujets les plus importants,
      - faire le point avec les membres sur les actions décidées lors des réunions précédentes.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a52dd7ebb4619e46:
    english: |-
      ### On Loomio
      Use a Loomio **Discussion** to prepare for your meeting:
      * remind members about the meeting coming up,
      * invite comment about the most important things to focus on,
      * summarize actions from the previous meeting and ask for an update.
    translation: |-
      ### Sur Loomio
      Utilisez une **Discussion** Loomio pour préparer votre réunion :
      * rappelez aux membres la date de la réunion,
      * invitez-les à commenter les sujets à traiter en priorité,
      * récapitulez les actions décidées lors de la réunion précédente et demandez où elles en sont.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5bcd10bb61edcc35:
    english: "## Agenda and notify"
    translation: "## Communiquer l’ordre du jour et envoyer une notification"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d9431846021bb8f3:
    english: Announce the meeting with a clear agenda. Attach papers, link to key documents and notify members.
    translation: Annoncez la réunion avec un ordre du jour clair. Joignez les documents utiles, ajoutez des liens vers les documents essentiels et informez les membres.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  41e84b882fa9bab1:
    english: This helps everyone prepare for the meeting, by reading the materials and thinking about topics of discussion and the decisions to be made.  Members are then more likely to arrive in context and ready for the meeting.
    translation: Chacun peut ainsi lire les documents, réfléchir aux sujets à discuter et aux décisions à prendre. Les membres arrivent à la réunion avec les informations nécessaires pour y participer.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b6b0e7ed67711d5b:
    english: |-
      Actions:
      - prepare agenda, documents, materials and board papers,
      - notify members of meeting and send materials.
    translation: |-
      Actions :
      - préparer l’ordre du jour, les documents et les dossiers destinés au conseil,
      - informer les membres de la réunion et leur transmettre les documents.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5b6d4a5158e41747:
    english: |-
      ### On Loomio
      Use a Loomio **Discussion** to prepare for your board meeting:
      * state details of meeting,
      * attach or link agenda, documents and other meeting materials,
      * invite members with a notification,
      * monitor 'Seen by' to see who has read the thread.
    translation: |-
      ### Sur Loomio
      Utilisez une **Discussion** Loomio pour préparer votre réunion du conseil :
      * indiquez les détails de la réunion,
      * joignez l’ordre du jour et les autres documents, ou ajoutez des liens vers ceux-ci,
      * invitez les membres au moyen d’une notification,
      * consultez « Vu par » pour savoir qui a lu le fil de discussion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f2c8f10394bf10c8:
    english: |-
      While similar to sending an email, a Loomio thread has advantages:
      - you can see who has read the thread, and remind those who haven't,
      - member replies or comments are visible to everyone who has permission to view the thread,
      - any discussion or questions about the agenda or meeting materials is held in a single place.
    translation: |-
      Un fil de discussion Loomio offre plusieurs avantages par rapport à un courriel :
      - vous pouvez voir qui l’a lu et envoyer un rappel aux autres membres,
      - les réponses et commentaires des membres sont visibles par toutes les personnes autorisées à consulter le fil de discussion,
      - les échanges et les questions sur l’ordre du jour ou les documents restent au même endroit.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dd6d8cabe5f1810d:
    english: Members can find all the information about the meeting readily available in one place, thereby avoiding confusing email chains and losing important info in their email inbox.
    translation: Les membres trouvent toutes les informations sur la réunion au même endroit. Ils évitent ainsi les longues chaînes de courriels et retrouvent plus facilement les informations importantes.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6a57d003a0bd5f07:
    english: |-
      ### Confirm
      Ask members to leave a comment confirming they have read the agenda and meeting papers and are prepared for the meeting. Use **Seen by** to identify anyone who may need a reminder.
    translation: |-
      ### Confirmer
      Demandez aux membres de confirmer dans un commentaire qu’ils ont lu l’ordre du jour et les documents, et qu’ils sont prêts pour la réunion. Utilisez **Vu par** pour savoir à qui envoyer un rappel.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d08b0ae5712ef2d:
    english: "## Find a time for meeting\nFinding a time to meet can be a frequent headache for many administrators. "
    translation: |-
      ## Trouver une date pour la réunion
      Trouver un créneau qui convient à tout le monde demande souvent du temps aux personnes qui organisent la réunion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1da8fdf943571a19:
    english: |-
      ### On Loomio
      If you have not yet set a date and time for the meeting or you need to find a time for a future meeting, you can use **Time poll**.
    translation: |-
      ### Sur Loomio
      Si la date et l’heure de la réunion ne sont pas encore fixées, ou si vous cherchez un créneau pour une prochaine réunion, utilisez un **Sondage horaire de réunion**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f1c92e27dfd63153:
    english: Time poll makes it easy to see everyone's availability and find the best time, reducing time and energy needed for this common admin task.
    translation: Le sondage horaire permet de voir les disponibilités de chacun et de trouver le meilleur créneau. Il réduit le temps nécessaire à cette tâche d’organisation.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  45b90fd46cce4976:
    english: Members in different time zones will see dates and times localized in their time zone.
    translation: Les membres situés dans différents fuseaux horaires voient les dates et les heures dans leur propre fuseau horaire.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dc159c751f73d5d1:
    english: 'When the Time poll closes, choose the best time and send an outcome notification with a calendar invitation, so members can add the meeting to their calendar. '
    translation: À la clôture du sondage horaire, choisissez le meilleur créneau et envoyez une notification de conclusion accompagnée d’une invitation de calendrier. Les membres pourront ainsi ajouter la réunion à leur calendrier.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4bafee41dd5f774c:
    english: "## Sign off minutes\nApproving or ratifying minutes is standard practice for formal meetings and good practice for all meetings.  "
    translation: |-
      ## Approuver le compte-rendu
      L’approbation du compte-rendu est une pratique habituelle pour les réunions formelles et utile pour toutes les réunions.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d9795ed92dabff7:
    english: 'Minutes provide a record of the meeting, key points raised during discussion, results of decisions and how people voted. They include the actions agreed and the person(s) responsible, and are often the starting point for the next meeting.  '
    translation: Le compte-rendu conserve une trace de la réunion, des principaux points discutés, des décisions prises et des votes. Il précise les actions convenues et les personnes responsables. Il sert souvent de point de départ à la réunion suivante.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1fd0d860cba070db:
    english: Minutes are valuable as a reminder for people present, helpful for those absent and a record to consult in case of conflict.
    translation: Le compte-rendu rappelle aux personnes présentes ce qui a été décidé, informe les personnes absentes et peut être consulté en cas de désaccord.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  166796d872f35962:
    english: "### On Loomio"
    translation: "### Sur Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ef51b49480cb721a:
    english: Post the minutes in the Loomio meeting thread within a few days of the meeting and invite participants to approve.  This keeps the minutes relevant and fresh in member's minds and is a great way to remind members of their actions.  It also saves some time during your meeting.
    translation: Publiez le compte-rendu dans le fil de discussion de la réunion quelques jours après celle-ci et invitez les personnes présentes à l’approuver. Les échanges sont encore récents, et le compte-rendu rappelle aux membres les actions dont ils sont responsables. Cela permet aussi de gagner du temps lors de la réunion suivante.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ea02d6cf3ede73dc:
    english: The example above uses a **Choose** poll with two options 'Accept' or 'Review'.
    translation: 'L’exemple ci-dessus utilise un sondage **Choisir** avec deux options : « Accepter » et « Réviser ».'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  56c55da82e5ddeb7:
    english: 'When everyone has voted and the poll closes, state an outcome so everyone knows what has happened.  '
    translation: Une fois que tout le monde a voté et que le sondage est clos, publiez une conclusion pour informer chacun de la décision.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e8b710a05eb113dc:
    english: 'If your meeting practice requires formal acceptance at the next meeting, schedule an agenda item to acknowledge and confirm polls and decisions made on Loomio, and record this in the meeting minutes.  '
    translation: Si vos réunions exigent une approbation formelle lors de la réunion suivante, inscrivez à l’ordre du jour la confirmation des sondages et des décisions pris sur Loomio. Consignez ensuite cette confirmation dans le compte-rendu.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '06339a98b65ccc2c':
    english: For example; *"Does anyone wish to change their votes in Loomio?  If no, then let's resolve to formally approve polls made in Loomio during the last period."*
    translation: 'Par exemple : *« Quelqu’un souhaite-t-il modifier son vote sur Loomio ? Si ce n’est pas le cas, approuvons formellement les sondages réalisés sur Loomio depuis la dernière réunion. »*'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f460b4ae218b375a:
    english: |-
      ## Approve reports
      Most meeting agendas include time for reports to be presented, discussed and approved; for example reports from the CEO, Financial, Operations, Health & Safety, and project reports.
    translation: |-
      ## Approuver les rapports
      La plupart des ordres du jour prévoient la présentation, la discussion et l’approbation de rapports : rapports de la direction générale, des finances, des opérations, de la santé et de la sécurité, ou rapports de projet.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  00abfe283956509a:
    english: Reports are very important to help everyone get on the same page, however they can absorb valuable time in a meeting that may be used more effectively.
    translation: Les rapports aident tout le monde à disposer des mêmes informations, mais leur présentation peut prendre du temps qui serait mieux utilisé pour d’autres échanges pendant la réunion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  861200207a1e1dfb:
    english: Attach or link reports to your meeting **thread** and invite questions about the reports in advance of the meeting.
    translation: Joignez les rapports au **fil de discussion** de votre réunion, ou ajoutez des liens vers ceux-ci, puis invitez les membres à poser leurs questions avant la réunion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  11f124875e8a5945:
    english: Members receive and read the reports at a time and place that works for them.  As members read and think about the reports, they can comment, ask questions and see responses in Loomio.
    translation: Les membres reçoivent les rapports et les lisent au moment et à l’endroit qui leur conviennent. Pendant leur lecture, ils peuvent laisser des commentaires, poser des questions et consulter les réponses sur Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2871f1673d36999a:
    english: A question asked by one member is likely of interest to other members, so when someone replies to the question, their response  is visible to everyone in the Loomio group.
    translation: La question d’un membre peut intéresser les autres. Lorsqu’une personne y répond, tous les membres du groupe Loomio peuvent voir sa réponse.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  851a2a86a1047697:
    english: As members become familiar with discussing reports in Loomio, save a little more time by taking it a step further - seek approval of reports ahead of the meeting.
    translation: Quand les membres ont pris l’habitude de discuter des rapports sur Loomio, vous pouvez gagner encore du temps en demandant leur approbation avant la réunion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
