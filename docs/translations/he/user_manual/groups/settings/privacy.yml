navigation_title: פרטיות
blocks:
  946f29d3bdb2e2af:
    english: "# Group privacy"
    translation: "# פרטיות הקבוצה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6a2fbb3e7cecad6e:
    english: Privacy controls who can find a group and who can read its content. Open **Edit group settings** from the group page, then select **Privacy**.
    translation: הגדרות הפרטיות קובעות מי יכול למצוא קבוצה ולקרוא את התוכן שלה. בדף הקבוצה יש לפתוח את **ערוך הגדרות קבוצה** ולבחור **פרטיות**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bf79bc420fc36377:
    english: "![Group privacy settings](group_privacy_settings.png#width-90)"
    translation: "![הגדרות הפרטיות של הקבוצה](group_privacy_settings.png#width-90)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4d275c75fe1a2c77:
    english: Changing privacy can expose or hide existing group content, not only content created afterward. Choose the most restrictive setting that still supports the group's purpose.
    translation: שינוי הגדרות הפרטיות עשוי לחשוף או להסתיר גם תוכן שכבר קיים בקבוצה. מומלץ לבחור בהגדרה המגבילה ביותר שעדיין מתאימה למטרת הקבוצה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7510b0e8a0fcf7b3:
    english: "## Open"
    translation: "## פתוח"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f202c6fba754adaa:
    english: Open groups are public spaces. Anyone can find the group and read its discussions, polls, and files. The member list remains visible only to members.
    translation: קבוצות פתוחות הן מרחבים ציבוריים. כל אחד יכול למצוא את הקבוצה ולקרוא את הדיונים, המשאלים והקבצים שלה. רשימת החברים גלויה לחברי הקבוצה בלבד.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c8d2b41a601ed65e:
    english: Open groups can allow people to join immediately, require approval, or remain invitation only.
    translation: בקבוצות פתוחות ניתן לאפשר הצטרפות מיידית, לדרוש אישור להצטרפות או להגביל את ההצטרפות להזמנה בלבד.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f07a1c59f30e5fea:
    english: "### Follow an Open group"
    translation: "### מעקב אחר קבוצה פתוחה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d6f9ee2eb742720e:
    english: People can stay up to date with an Open group without joining. Following adds unread group activity to their catch-up email so they can review it in their own time. Followers do not become members, receive member voting rights, or receive immediate notifications just because they follow the group.
    translation: ניתן להתעדכן בפעילות של קבוצה פתוחה בלי להצטרף אליה. מעקב אחר הקבוצה מוסיף פעילות שלא נקראה לאימייל הסיכום, כדי שניתן יהיה לעיין בה בזמן המתאים. מעקב אינו מקנה חברות בקבוצה או זכות הצבעה לחברים, ואינו גורם לקבלת התראות מיידיות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  17cb84d9141c9728:
    english: Turn on **Follow updates** on the group page to include its unread discussions, comments, polls, and other thread activity in your catch-up. Turn the setting off to stop including the group.
    translation: כדי לכלול באימייל הסיכום דיונים, תגובות, משאלים ופעילות אחרת בשרשורים שטרם נקראו, יש להפעיל את **עקוב אחר עדכונים** בדף הקבוצה. כדי להפסיק לכלול את הקבוצה, יש לכבות את ההגדרה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b0c06651e8c0df2b:
    english: "![Follow updates on an Open group](group_follow_updates.png)"
    translation: "![מעקב אחר עדכונים בקבוצה פתוחה](group_follow_updates.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c5becc4d01b10f3:
    english: "## Closed"
    translation: "## סגור"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eaf6878c89438b53:
    english: Anyone can find a Closed group and read its name and description. Discussions, polls, files, and the member list are private to members and invited guests.
    translation: כל אחד יכול למצוא קבוצה סגורה ולקרוא את שמה ואת התיאור שלה. הדיונים, המשאלים, הקבצים ורשימת החברים גלויים רק לחברי הקבוצה ולאורחים שהוזמנו.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ab7851d3b88d4e27:
    english: Closed groups can let people request membership or remain invitation only. They cannot let people join immediately without approval.
    translation: בקבוצות סגורות ניתן לאפשר בקשות הצטרפות או להגביל את ההצטרפות להזמנה בלבד. לא ניתן לאפשר הצטרפות מיידית ללא אישור.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e2f094fc6e490216:
    english: A Closed subgroup of a parent group can optionally allow members of the parent group to read its discussions without joining the subgroup.
    translation: בתת־קבוצה סגורה ניתן לאפשר לחברי קבוצת האם לקרוא את הדיונים שלה בלי להצטרף לתת־הקבוצה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9c21e144af9492a6:
    english: "## Secret"
    translation: "## סודי"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6a9871bdd7fde747:
    english: Secret groups and their content are visible only to people who have been invited or added. Membership is invitation only. Secret groups do not appear in the public group directory.
    translation: קבוצות סודיות והתוכן שלהן גלויים רק למי שהוזמנו או נוספו אליהן. ההצטרפות היא בהזמנה בלבד. קבוצות סודיות אינן מופיעות במדריך הקבוצות הציבורי.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  405ac2846a65b06c:
    english: "## How people join"
    translation: "## דרכי הצטרפות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c7aebb687bbffbf:
    english: 'Privacy determines which joining options are available:'
    translation: 'הגדרות הפרטיות קובעות אילו דרכי הצטרפות זמינות:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a6a7608fe4510b67:
    english: |-
      | Group privacy | Available joining options |
      | --- | --- |
      | **Open** | Anyone can join, request approval, or invitation only |
      | **Closed** | Request approval or invitation only |
      | **Secret** | Invitation only |
    translation: |-
      | פרטיות הקבוצה | דרכי הצטרפות זמינות |
      | --- | --- |
      | **פתוח** | הצטרפות חופשית, בקשת אישור או הזמנה בלבד |
      | **סגור** | בקשת אישור או הזמנה בלבד |
      | **סודי** | הזמנה בלבד |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  473a620db15dff75:
    english: When approval is required, people select **Join group**, answer the group's joining prompt, and send a request to join. See [Inviting people](/en/user_manual/groups/inviting_people#request-to-join-group) for instructions on configuring the prompt, reviewing requests, and inviting people directly.
    translation: כאשר נדרש אישור, יש לבחור **הצטרפו לקבוצה**, לענות על שאלת ההצטרפות של הקבוצה ולשלוח בקשת הצטרפות. הוראות להגדרת השאלה, לבדיקת בקשות ולהזמנה ישירה מופיעות בדף [הזמנת אנשים](/en/user_manual/groups/inviting_people#request-to-join-group).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4c02de0d4580f7e6:
    english: "## Group directory"
    translation: "## מדריך הקבוצות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2dc848ec1af0064e:
    english: Open and Closed parent groups can be listed in the public group directory so people can discover them. Directory listing does not change who can read group content or become a member. Subgroups and Secret groups cannot be listed.
    translation: ניתן להציג קבוצות אם פתוחות וסגורות במדריך הקבוצות הציבורי, כדי שאנשים יוכלו למצוא אותן. הופעה במדריך אינה משנה מי יכול לקרוא את תוכן הקבוצה או להצטרף אליה. לא ניתן להציג בו תת־קבוצות וקבוצות סודיות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
