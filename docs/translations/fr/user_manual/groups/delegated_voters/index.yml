  9cfb3b7835dc5cb0:
    english: If some members of your group should have voting rights while others should not, you can use the "Make delegate" feature to identify those people with voting rights. There is a corresponding "Revoke delegate" action too.
    translation: Si certains membres de votre groupe doivent pouvoir voter et d’autres non, utilisez l’action « Faire déléguer » pour désigner les personnes qui ont le droit de vote. L’action « Révoquer le délégué » permet de retirer ce droit.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e017eafb51368777:
    english: Use delegates when people should share the same discussion space but only a defined set, such as directors or elected representatives, may vote. This is usually simpler than maintaining a second subgroup whose only purpose is to separate voters from non-voters.
    translation: Utilisez les délégués lorsque tout le monde doit partager le même espace de discussion, mais que seules certaines personnes, comme les membres d’un conseil d’administration ou les personnes élues, peuvent voter. C’est généralement plus simple que de créer un second sous-groupe uniquement pour distinguer les personnes qui peuvent voter des autres.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1942a47ae47ca813:
    english: Use a private subgroup instead when its members also need discussions, files, or membership information that other members must not see.
    translation: Utilisez plutôt un sous-groupe privé si ses membres doivent aussi accéder à des discussions, des fichiers ou des informations sur les membres que les autres ne doivent pas voir.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
