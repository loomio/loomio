---
navigation_title: Як удзельнічаць
blocks:
  b07064bf98055393:
    english: "# How to participate"
    translation: "# Як удзельнічаць"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c121de54fbe72331:
    english: 'Once signed in to a Loomio group you have been invited to, you can participate in a Loomio discussion or decision.  '
    translation: Пасля ўваходу ў групу Loomio, у якую вас запрасілі, вы можаце ўдзельнічаць у абмеркаваннях і прыняцці рашэнняў.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9bb48e2f2f1858af:
    english: Read on to see  how to write a comment in a thread and how to vote in a poll.
    translation: Ніжэй апісана, як напісаць каментар у тэме і прагаласаваць у апытанні.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '095ec081a6f1d74e':
    english: "## Comment"
    translation: "## Каментары"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d5dadbc416d8603a:
    english: You can write a comment in a thread, and people can reply, react or post their own comment to continue the discussion.
    translation: Вы можаце напісаць каментар у тэме. Іншыя людзі могуць адказаць на яго, пакінуць рэакцыю або напісаць свой каментар, каб працягнуць абмеркаванне.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  250f7bc0e6e6c93c:
    english: 'When you have written your text, use **Post Comment** to instantly publish the comment. Your comment will be visible to anyone who has permission to see the thread. '
    translation: Напісаўшы тэкст, націсніце **Дадаць каментар**, каб адразу апублікаваць яго. Каментар змогуць бачыць усе, хто мае доступ да тэмы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  76a3378441f45ebf:
    english: "### Reply to a comment"
    translation: "### Адказ на каментар"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c3495aed9ac78348:
    english: You can reply to someone's comment by clicking on the reply icon beneath the comment.
    translation: Каб адказаць на каментар, націсніце значок адказу пад ім.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b2698ab73e65442c:
    english: Your reply is published in the thread and an email notification is sent to the author of the comment.
    translation: Ваш адказ з'явіцца ў тэме, а аўтару каментара будзе адпраўлена апавяшчэнне па электроннай пошце.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  04743dedbee0de5c:
    english: "### Get someone's attention"
    translation: "### Як звярнуць увагу іншых"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  455fea8aa593dad4:
    english: You can notify people when you write a comment.
    translation: Калі пішаце каментар, вы можаце адправіць іншым людзям апавяшчэнне.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  316ef3257eaebd54:
    english: "### Reactions"
    translation: "### Рэакцыі"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4b68204cf35c85f1:
    english: Reacting to a comment is a great way to encourage and acknowledge a comment by letting the comment author know how you feel.  It is a quick and light-weight way to participate that does not require any text, nor send an email. Click the smile emoji icon beneath a comment to leave an emoji reaction.
    translation: Рэакцыя паказвае аўтару каментара, як вы да яго ставіцеся, і дапамагае падтрымаць удзел у абмеркаванні.  Гэта хуткі спосаб удзельнічаць без тэксту і без адпраўкі электроннага ліста. Каб пакінуць рэакцыю, націсніце значок усмешкі пад каментаром.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Галасаванне"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4432b9c5b263014a:
    english: You may receive an invitation to vote in a poll via email or by notification in Loomio. Click on the link in the email to vote.
    translation: Вы можаце атрымаць запрашэнне прагаласаваць у апытанні па электроннай пошце або праз апавяшчэнне ў Loomio. Каб прагаласаваць, перайдзіце па спасылцы ў электронным лісце.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2a8641a22cf13597:
    english: Voting is easy, just click or tap on the icon of your choice.
    translation: Каб прагаласаваць, націсніце або дакраніцеся да значка патрэбнага варыянта.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  00d6e2698ade53cc:
    english: There are many types of polls. The example below shows a typical proposal with voting options of **Agree**, **Abstain** or **Disagree**. Other options may be available.
    translation: Ёсць розныя тыпы апытанняў. Ніжэй паказана тыповая прапанова з варыянтамі галасавання **Згодзен**, **Устрымацца** і **Не згодны**. Могуць быць даступныя і іншыя варыянты.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4f327c4a766af0ab:
    english: Read the poll, and any attached files, then cast your vote by selecting one of the options.
    translation: Прачытайце апытанне і прыкладзеныя файлы, калі яны ёсць. Затым выберыце адзін з варыянтаў, каб прагаласаваць.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2cf633f37997e8b8:
    english: "### State a reason"
    translation: "### Укажыце прычыну"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c976385dcb75f67b:
    english: When voting, you can also leave a **Reason** to say why you have voted this way. This is optional.
    translation: Падчас галасавання вы можаце пакінуць **Прычына**, каб растлумачыць свой выбар. Гэта неабавязкова.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6d0d884b0832dda9:
    english: "### Change your vote"
    translation: "### Змяніце свой голас"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  84629138984e43d0:
    english: You can **change your vote**, up until the proposal closes.
    translation: Вы можаце **змяніць свой голас**, пакуль прапанова не закрыецца.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8fcddbe7856e926b:
    english: There are many reasons why you might want to change your vote. For example if new information emerges it may cause you to rethink your decision, and change your vote.
    translation: Прычыны змяніць голас могуць быць рознымі. Напрыклад, новая інфармацыя можа дапамагчы вам перагледзець рашэнне.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f7078b517c8bfed8:
    english: Once again, you can leave a reason to say why you have changed your vote.
    translation: Вы таксама можаце ўказаць прычыну змены голасу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8e1b2953471f22ba:
    english: "### Results"
    translation: "### Вынікі"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2153df12cd2b4fe2:
    english: Results of the proposal are updated as people vote, so you can see how a proposal is trending.
    translation: Вынікі прапановы абнаўляюцца па меры галасавання. Так вы можаце бачыць, як змяняецца падтрымка прапановы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  229571fe36c571b0:
    english: 'In a controversial proposal it is common to see mixed results, however this does not mean the proposal has failed.  '
    translation: Калі прапанова выклікае спрэчкі, вынікі могуць быць неадназначнымі. Гэта не азначае, што прапанова не атрымала падтрымкі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c3d5e53684bf3e88:
    english: Often the new information revealed during the proposal helps form a better proposal that is more likely to pass.
    translation: Часта новая інфармацыя, якая з'яўляецца падчас абмеркавання прапановы, дапамагае падрыхтаваць лепшую прапанову з большымі шанцамі на падтрымку.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b4783489f09ccf19:
    english: "### Outcome"
    translation: "### Выснова"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  592f419764241ef6:
    english: When the proposal closes, the author is prompted to state the **Outcome**.
    translation: Калі галасаванне па прапанове закрываецца, аўтару прапануецца ўказаць **Выснова**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0fae106181bbc6ac:
    english: This is an important final step to record the result of the decision and let everyone know what will happen next.
    translation: 'Гэта апошні важны крок: ён дапамагае зафіксаваць прынятае рашэнне і паведаміць усім, што будзе далей.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
