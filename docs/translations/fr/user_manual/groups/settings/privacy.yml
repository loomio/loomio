navigation_title: Confidentialité
blocks:
  946f29d3bdb2e2af:
    english: "# Group privacy"
    translation: "# Confidentialité du groupe"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6a2fbb3e7cecad6e:
    english: Privacy controls who can find a group and who can read its content. Open **Edit group settings** from the group page, then select **Privacy**.
    translation: La confidentialité détermine qui peut trouver un groupe et consulter son contenu. Depuis la page du groupe, ouvrez **Modifier les paramètres du groupe**, puis sélectionnez **Confidentialité**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bf79bc420fc36377:
    english: "![Group privacy settings](group_privacy_settings.png#width-90)"
    translation: "![Paramètres de confidentialité du groupe](group_privacy_settings.png#width-90)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4d275c75fe1a2c77:
    english: Changing privacy can expose or hide existing group content, not only content created afterward. Choose the most restrictive setting that still supports the group's purpose.
    translation: Modifier la confidentialité peut rendre visible ou masquer le contenu déjà présent dans le groupe, ainsi que le contenu ajouté par la suite. Choisissez le niveau de confidentialité le plus strict qui permette au groupe de remplir son objectif.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7510b0e8a0fcf7b3:
    english: "## Open"
    translation: "## Ouvert"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f202c6fba754adaa:
    english: Open groups are public spaces. Anyone can find the group and read its discussions, polls, and files. The member list remains visible only to members.
    translation: Les groupes ouverts sont des espaces publics. Tout le monde peut les trouver et consulter leurs discussions, sondages et fichiers. Seuls les membres peuvent voir la liste des membres.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c8d2b41a601ed65e:
    english: Open groups can allow people to join immediately, require approval, or remain invitation only.
    translation: Un groupe ouvert peut permettre de le rejoindre immédiatement, exiger une approbation ou fonctionner uniquement sur invitation.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f07a1c59f30e5fea:
    english: "### Follow an Open group"
    translation: "### Suivre un groupe ouvert"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d6f9ee2eb742720e:
    english: People can stay up to date with an Open group without joining. Following adds unread group activity to their catch-up email so they can review it in their own time. Followers do not become members, receive member voting rights, or receive immediate notifications just because they follow the group.
    translation: Il est possible de suivre l’activité d’un groupe ouvert sans le rejoindre. Les activités non lues du groupe sont alors ajoutées à l’e-mail récapitulatif, pour pouvoir les consulter au moment voulu. Suivre un groupe ne donne pas le statut de membre ni le droit de voter en tant que membre. Cela ne déclenche pas non plus de notifications immédiates.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  17cb84d9141c9728:
    english: Turn on **Follow updates** on the group page to include its unread discussions, comments, polls, and other thread activity in your catch-up. Turn the setting off to stop including the group.
    translation: Sur la page du groupe, activez **Suis les mises à jour** pour ajouter à votre récapitulatif ses discussions, commentaires, sondages et autres activités des fils de discussion que vous n’avez pas lus. Désactivez ce paramètre pour ne plus y inclure le groupe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b0c06651e8c0df2b:
    english: "![Follow updates on an Open group](group_follow_updates.png)"
    translation: "![Suivi des mises à jour d’un groupe ouvert](group_follow_updates.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c5becc4d01b10f3:
    english: "## Closed"
    translation: "## Fermé"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eaf6878c89438b53:
    english: Anyone can find a Closed group and read its name and description. Discussions, polls, files, and the member list are private to members and invited guests.
    translation: Tout le monde peut trouver un groupe fermé et consulter son nom et sa description. Seuls les membres et les personnes invitées peuvent consulter ses discussions, sondages, fichiers et sa liste de membres.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ab7851d3b88d4e27:
    english: Closed groups can let people request membership or remain invitation only. They cannot let people join immediately without approval.
    translation: Un groupe fermé peut permettre de demander à devenir membre ou fonctionner uniquement sur invitation. Il ne peut pas permettre de le rejoindre immédiatement sans approbation.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e2f094fc6e490216:
    english: A Closed subgroup of a parent group can optionally allow members of the parent group to read its discussions without joining the subgroup.
    translation: Un sous-groupe fermé peut, si cette option est activée, permettre aux membres de son groupe parent de consulter ses discussions sans rejoindre le sous-groupe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9c21e144af9492a6:
    english: "## Secret"
    translation: "## Secret"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6a9871bdd7fde747:
    english: Secret groups and their content are visible only to people who have been invited or added. Membership is invitation only. Secret groups do not appear in the public group directory.
    translation: Les groupes secrets et leur contenu ne sont visibles que par les personnes invitées ou ajoutées. On ne peut les rejoindre que sur invitation. Ils ne figurent pas dans l’annuaire public des groupes.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  405ac2846a65b06c:
    english: "## How people join"
    translation: "## Comment rejoindre un groupe"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c7aebb687bbffbf:
    english: 'Privacy determines which joining options are available:'
    translation: 'La confidentialité détermine les options disponibles pour rejoindre un groupe :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a6a7608fe4510b67:
    english: |-
      | Group privacy | Available joining options |
      | --- | --- |
      | **Open** | Anyone can join, request approval, or invitation only |
      | **Closed** | Request approval or invitation only |
      | **Secret** | Invitation only |
    translation: |-
      | Confidentialité du groupe | Options pour rejoindre le groupe |
      | --- | --- |
      | **Ouvert** | Adhésion immédiate, demande d’approbation ou invitation uniquement |
      | **Fermé** | Demande d’approbation ou invitation uniquement |
      | **Secret** | Invitation uniquement |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  473a620db15dff75:
    english: When approval is required, people select **Join group**, answer the group's joining prompt, and send a request to join. See [Inviting people](/en/user_manual/groups/inviting_people#request-to-join-group) for instructions on configuring the prompt, reviewing requests, and inviting people directly.
    translation: Quand une approbation est nécessaire, les personnes sélectionnent **Rejoindre le groupe**, répondent à la question posée lors de la demande d’adhésion, puis envoient leur demande. Consultez [Inviter des personnes](/en/user_manual/groups/inviting_people#request-to-join-group) pour savoir comment configurer cette question, examiner les demandes et inviter directement des personnes.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4c02de0d4580f7e6:
    english: "## Group directory"
    translation: "## Annuaire des groupes"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2dc848ec1af0064e:
    english: Open and Closed parent groups can be listed in the public group directory so people can discover them. Directory listing does not change who can read group content or become a member. Subgroups and Secret groups cannot be listed.
    translation: Les groupes parents ouverts et fermés peuvent figurer dans l’annuaire public des groupes pour que les personnes puissent les découvrir. Cette inscription ne change pas qui peut consulter le contenu du groupe ou en devenir membre. Les sous-groupes et les groupes secrets ne peuvent pas y figurer.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
