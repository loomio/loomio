  909769fda18f0ec6:
    english: 'You can add a link to any shareable document or page on the internet.  '
    translation: Ви можете додати посилання на будь-який документ або сторінку в інтернеті, доступні для спільного перегляду.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e034be8c0fbe76db:
    english: 'To add a link:'
    translation: 'Щоб додати посилання:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dcf90e79aba1a2f9:
    english: |-
      1. Select the text you want to link to - say the name of a document.
      2. Click the link icon.
      3. Paste the address into the **Insert link** field and select **Apply**.
    translation: |-
      1. Виберіть текст, який має стати посиланням, наприклад назву документа.
      2. Натисніть значок посилання.
      3. Вставте адресу в поле **Додайте посилання** та натисніть **Застосувати**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  40ecf7d0c79432b2:
    english: For a document hosted elsewhere, check its sharing permissions so discussion participants can open it.
    translation: Якщо документ розміщено на іншому сервісі, перевірте його налаштування доступу, щоб учасники обговорення могли його відкрити.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3f1824fc07dded13:
    english: A preview of the doc will appear under the text space. You can remove this if you want.
    translation: Під текстовим полем з’явиться попередній перегляд документа. За потреби його можна видалити.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c6061aa7deff27ac:
    english: Now, anyone with access to your Loomio discussion and permission to view the doc can open and read it.
    translation: Тепер кожен, хто має доступ до вашого обговорення в Loomio та дозвіл на перегляд документа, може відкрити й прочитати його.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
