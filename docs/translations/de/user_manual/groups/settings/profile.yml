  0b903e1c3c7e1862:
    english: The profile tab controls how your group is identified and introduced. Open **Edit group settings** from the group page, then select **Profile**.
    translation: Im Tab „Profil“ legst du fest, wie deine Gruppe dargestellt wird. Öffne auf der Gruppenseite **Gruppeneinstellungen bearbeiten** und wähle dann **Profil**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
