  0b8bb762e37fb8c3:
    english: |-
      To create a poll or proposal and only invite the delegates, use the "Selected people only" poll setting.
      ![Selected people only setting when starting a proposal](poll_invited_people_only.png)
      Then when inviting people to vote you will see the "Delegates of group-name" option.
      ![Delegates of Oatmilk Cooperative option in the invite-to-vote form](poll_invite_delegates_group.png)
    translation: |-
      Pour créer un sondage ou une proposition et n’inviter que les délégués, choisissez le paramètre « Personnes sélectionnées uniquement ».
      ![Paramètre Personnes sélectionnées uniquement lors de la création d’une proposition](poll_invited_people_only.png)
      Lorsque vous inviterez des personnes à voter, l’option « Délégués de nom-du-groupe » apparaîtra.
      ![Option Délégués de Oatmilk Cooperative dans le formulaire d’invitation au vote](poll_invite_delegates_group.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e895a07efeaf4dcf:
    english: |-
      You can see a list of who the delegates are from the members tab of your group page. Use the filter menu and select "Delegates".
      ![Delegates option in the members filter](members_list_delegates.png)
    translation: |-
      Pour voir la liste des délégués, ouvrez l’onglet des membres sur la page de votre groupe. Dans le menu des filtres, choisissez « Délégués ».
      ![Option Délégués dans le filtre des membres](members_list_delegates.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
