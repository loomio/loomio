    english: 'Loomio is a versatile discussion and decision-making tool for collaborative boards and committees. '
    translation: Loomio ist ein vielseitiges Werkzeug für Diskussionen und Entscheidungen in Vorständen und Ausschüssen, die gemeinsam arbeiten.
