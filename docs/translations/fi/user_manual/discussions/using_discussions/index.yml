    english: Select the current notification setting to choose whether Loomio emails you about all activity, only activity that specifically notifies you, or no activity. Receiving email for all activity can produce many messages in an active thread.
    translation: Valitse nykyinen ilmoitusasetus ja määritä, lähettääkö Loomio sinulle sähköpostia kaikesta toiminnasta, vain sinulle erikseen ilmoitetusta toiminnasta vai ei mistään toiminnasta. Kaikesta toiminnasta ilmoittaminen voi tuottaa paljon viestejä aktiivisessa keskusteluketjussa.
