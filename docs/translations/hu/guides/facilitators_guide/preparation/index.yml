  4fc02624e97369e9:
    english: |-
      > <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../silvia_200.png"> For every minute of time with the group, consider spending 3 minutes planning. That means spending three hours preparing for a one hour session. Only as you improve should you spend less time planning.
      >
      > — Silvia Zuur
    translation: |-
      > <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../silvia_200.png"> Minden, a csoporttal töltött percre számolj három perc tervezést. Ez egy egyórás alkalomhoz három óra felkészülést jelent. Ahogy fejlődsz, fokozatosan kevesebb időt kell tervezésre fordítanod.
      >
      > — Silvia Zuur
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d18832ab8f94fa1b:
    english: "## Understand Purpose"
    translation: "## Tisztázd a célt"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  26d88950f0aac205:
    english: Clarification of purpose is one of the highest value offerings of a skilled facilitator — if they can help the group nail that, everything else is possible. Purpose operates at the level of a group as a whole, and at the level of individual discussions/decisions. Purpose is what enables judgment calls about what tools to deploy, what interventions to enact, and what outcomes to aim for. Lack of shared understanding about purpose can be fatal to a discussion, or to the group itself.
    translation: Egy tapasztalt facilitátor egyik legértékesebb hozzájárulása a cél tisztázása. Ha ebben segít a csoportnak, a többi kérdéssel is könnyebb foglalkozni. A célnak a csoport egésze és az egyes beszélgetések vagy döntések szintjén is jelentősége van. Ez alapján lehet eldönteni, milyen eszközöket használjatok, mikor avatkozzatok be, és milyen eredményre törekedjetek. Ha nincs közös értelmezés a célról, az a beszélgetést vagy akár a csoport működését is meghiúsíthatja.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4276182ea8afaf36:
    english: "> Always refer back to your purpose-finding questions to check that you’re covering off what the participants want to learn or achieve. — Silvia Zuur"
    translation: "> Térj vissza rendszeresen a cél tisztázását segítő kérdésekhez. Így ellenőrizheted, hogy foglalkoztok-e azzal, amit a résztvevők meg szeretnének tanulni vagy el szeretnének érni. — Silvia Zuur"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aabfa9d842af2688:
    english: On Loomio
    translation: A Loomióban
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ea5f19b8970e4db6:
    english: |-
      * The app offers space for explication of purpose, such as the [group description](/en/user_manual/groups/starting_a_group/#group-description) and [discussion context](/en/user_manual/discussions/using_discussions/#discussion-context) fields.
      * A Loomio discussion *about* purpose is a great place to start with your group, if it's not already clear.
      * Our analytics (stats about how people use the software) show that groups with a clear shared purpose are more successful.
      * [Customer stories and case studies](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help) we've collected emphasise the importance of setting a collective purpose.
    translation: |-
      * Az alkalmazásban több helyen is megfogalmazhatjátok a célt, például a [csoport leírásában](/en/user_manual/groups/starting_a_group/#group-description) és a [beszélgetés kontextusában](/en/user_manual/discussions/using_discussions/#discussion-context).
      * Ha a cél még nem világos, érdemes egy Loomio-beszélgetést indítani *magáról* a célról.
      * A használati statisztikáink szerint az egyértelmű, közös céllal rendelkező csoportok sikeresebbek.
      * Az összegyűjtött [ügyféltörténetek és esettanulmányok](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help) is hangsúlyozzák a közös cél meghatározásának fontosságát.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e7d962ee3ac4e476:
    english: "## Rearrange the Furniture"
    translation: "## Rendezd át a teret"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bee66f99abaa8e2a:
    english: Desiging the space you invite people into greatly influences their experience. Every gathering is unique, and deserves a setup to suit. Familiarity signals safety, while changing the environment cues openness to new ideas.
    translation: A tér kialakítása nagyban befolyásolja a meghívottak élményét. Minden találkozó más, ezért a teret is az alkalomhoz érdemes igazítani. Az ismerős környezet biztonságérzetet adhat, a változás pedig nyitottságra ösztönözhet az új ötletek iránt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b98fa9d3e5726891:
    english: In offline spaces, literally rearranging the furniture is a habit that helps facilitators get into the right zone to hold space, and prompts them to think about what’s unique in that session. Imagine the difference between everyone seated in rows versus everyone in a circle.
    translation: Személyes találkozókon a bútorok átrendezése segít a facilitátornak ráhangolódni az alkalomra, és átgondolni, mitől egyedi. Másként alakulhat a beszélgetés, ha mindenki sorokban ül, mint ha körben helyezkedik el.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  546ba20d5778bb25:
    english: |-
      * Inviting people into a new digital space specifically for decision making is powerful — there’s a “threshold crossing” experience making it as distinct from other online spaces (which might be for socialising or other functions).
      * [Customising your group photo](/en/user_manual/groups/starting_a_group/#upload-a-group-photo) is a prime opportunity to craft the feeling of the space.
      * The group description is a main piece of “furniture” on the group page, and [you can customise it](/en/user_manual/groups/starting_a_group/#group-description) to suit.
    translation: |-
      * Ha kifejezetten a döntéshozatalhoz hívsz meg embereket egy új digitális térbe, az belépési pontot teremt. Ez segít elkülöníteni a teret más online helyektől, amelyek például társas kapcsolattartásra szolgálnak.
      * [A csoportkép személyre szabásával](/en/user_manual/groups/starting_a_group/#upload-a-group-photo) alakíthatod a tér hangulatát.
      * A csoport leírása a csoportoldal egyik meghatározó eleme, és [az alkalomhoz igazíthatod](/en/user_manual/groups/starting_a_group/#group-description).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bb1d23808a93d41b:
    english: "## Supplies, Tools, Materials"
    translation: "## Kellékek, eszközök és anyagok"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b5e22b09672c3587:
    english: When facilitation is running smoothly, all the supplies a group needs are right at hand. In offline spaces, this stuff includes post-its, pens, paper, name tags, printouts, and background material. Every step a facilitator takes to be well-prepared in this way allows more time and energy for the work.
    translation: A jól vezetett folyamatban minden szükséges kellék kéznél van. Személyes találkozókon ilyenek lehetnek az öntapadós jegyzetlapok, tollak, papírok, névkitűzők, nyomtatott anyagok és háttérinformációk. Minél jobban felkészül a facilitátor, annál több idő és energia marad a közös munkára.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7da21174f12dfb9e:
    english: |-
      * Many groups use the group description to link to a shared drive of collaborative documents, background information, the group's project management or task tracking system, a list of contacts, etc.
      * Each thread deserves consideration of what people might need to engage with it — putting all the information right at hand is essential (for example, if you reference something, linking directly to it is much more effective than expecting people to search for it).
    translation: |-
      * Sok csoport a csoport leírásában helyez el hivatkozásokat a közösen szerkesztett dokumentumok tárhelyére, háttéranyagokra, a projekt- vagy feladatkezelő rendszerére és a kapcsolattartók listájára.
      * Minden témánál gondold át, mire lehet szükségük a résztvevőknek. Legyenek kéznél a fontos információk: ha például hivatkozol valamire, adj hozzá közvetlen linket, hogy ne kelljen külön megkeresniük.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  35dd82fcf7e543d8:
    english: "## Design the Experience"
    translation: "## Tervezd meg a részvétel élményét"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fbc88dd9b9738343:
    english: 'Once they have the basic pieces in place (purpose, tools, background info), good facilitators take time to think through the design of the experience they are inviting: the situation, what success could look like, all the possible pathways and choices. They don’t jump in without a considered design.'
    translation: Ha az alapok már megvannak – a cél, az eszközök és a háttérinformációk –, a jó facilitátorok átgondolják, milyen folyamatba hívják a résztvevőket. Mérlegelik a helyzetet, a siker lehetséges formáit, valamint a választható utakat és döntéseket. Átgondolt tervvel kezdenek hozzá.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a4dce16ca48a4324:
    english: Time and time again we have seen people drastically underestimate the need for prep and design. Stop and think about the experience you want to host, before jumping straight in. Investment in design is paid back many times over by success later.
    translation: Újra és újra azt látjuk, hogy az emberek jelentősen alábecsülik a felkészülés és a tervezés szükségességét. Mielőtt belevágsz, gondold át, milyen élményt szeretnél teremteni. A tervezésre fordított idő később sokszorosan megtérülhet.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e91f002ee6e53550:
    english: "* Loomio’s most basic functionality follows the structure of good facilitation by design: invite people, discuss a topic, gather divergent input, converge into a specific proposal, test for agreement, confirm outcome."
    translation: "* A Loomio alapvető működése a jó facilitálás lépéseit követi: hívd meg az embereket, beszéljetek meg egy témát, gyűjtsétek össze a különböző nézőpontokat, fogalmazzatok meg egy konkrét javaslatot, mérjétek fel az egyetértést, majd erősítsétek meg a következtetést."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  211e08fc109e6449:
    english: |-
      * Skilled users are already adapting Loomio for various experience designs — such as a multi-step consultation processes, signing off documents, etc. Each job, when facilitated effectively, takes a certain repeatable shape.
      * Online collaboration design doesn't have to reinvent the wheel. Trust what you know works, and translate it. Many tried and tested offline processes can be adapted to the online space (ex: the [Advice Process](/en/guides/making_decisions/advice_process.html)).
      * [Case studies](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help) of thoughtfully designed processes could be used as “recipes” — if you're not sure what design to use, start by seeing what others have tried.
    translation: |-
      * A tapasztalt felhasználók már most is különféle folyamatokhoz igazítják a Loomiót, például több lépésből álló egyeztetéshez vagy dokumentumok jóváhagyásához. A hatékonyan vezetett feladatoknak gyakran felismerhető, megismételhető menete van.
      * Az online együttműködés folyamatát nem kell a semmiből megtervezni. Építs arra, ami már bevált, és ültesd át az online térbe. Sok kipróbált személyes folyamat adaptálható, például a [tanácskérési folyamat](/en/guides/making_decisions/advice_process.html).
      * Az átgondolt folyamatokról szóló [esettanulmányok](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help) mintaként szolgálhatnak. Ha nem tudod, milyen folyamatot válassz, nézd meg, mások mit próbáltak ki.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7e99e2ddc63d7a98:
    english: "## Contextualise the Moment"
    translation: "## Vedd figyelembe a helyzetet"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  427b66f23f4b3c09:
    english: Discussions do not occur in a vacuum, but in the larger context of the group’s history and practice. To be effective, facilitated experiences have to occur with the right timing, and fit in with the rest of the group’s process.
    translation: A beszélgetések a csoport történetének és szokásainak részei. A vezetett folyamat akkor lehet hatékony, ha jókor történik, és illeszkedik a csoport többi tevékenységéhez.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  48a889b09297e38b:
    english: 'Key Context Questions:'
    translation: 'Fontos kérdések a helyzetről:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7eccc4a4e4a3b175:
    english: |-
      * Is this a moment of transition?
      * Is this an enhancement of existing practice?
      * Is this one of many concurrent processes, or a singular focus?
      * Are we here to solve a problem, or go deeper, wider, narrower?
    translation: |-
      * Átmeneti időszakban van a csoport?
      * Egy meglévő gyakorlatot szeretnétek továbbfejleszteni?
      * Ez egy a párhuzamosan zajló folyamatok közül, vagy most erre összpontosít a csoport?
      * Egy problémát szeretnétek megoldani, vagy inkább mélyebben, tágabb vagy szűkebb körben foglalkoznátok egy témával?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c7c8ce0838a076cd:
    english: |-
      * Loomio groups nearly always have a “champion”, who understands the group’s context and makes the call about whether introducing Loomio is right for them.
      * It's not wise to try to change everything at once. Any time Loomio fits nicely into existing workflows, groups will adopt it better.
      * Good timing is when the group is ready to incorporate online collaborative practice effectively. They have to feel the pain of not having the online decision-making space, and be motivated to solve that problem.
      * Consider the group’s attention economy to determine when the right time to raise a given topic might be. Collective attention is a limited resource.
      * Many groups are not even cognisant of their existing collaborative practice and habits, much less clear about how Loomio might fit in. Start with a discussion about the current way of doing things, and what's working or not working.
    translation: |-
      * A Loomio-csoportokban szinte mindig van valaki, aki ismeri a csoport helyzetét, és eldönti, hogy érdemes-e bevezetni a Loomiót.
      * Nem érdemes mindent egyszerre megváltoztatni. A csoportok könnyebben veszik használatba a Loomiót, ha jól illeszkedik a meglévő munkafolyamataikhoz.
      * Akkor érdemes bevezetni, amikor a csoport készen áll a hatékony online együttműködésre. A tagoknak látniuk kell, milyen nehézséget okoz az online döntéshozatali tér hiánya, és szeretnék megoldani ezt a problémát.
      * Amikor eldöntöd, mikor hozz fel egy témát, vedd figyelembe, mire irányul a csoport figyelme. A közös figyelem korlátozott erőforrás.
      * Sok csoport nem is tudatosítja, hogyan működik együtt jelenleg, és azt sem látja világosan, hogyan illeszkedhetne ebbe a Loomio. Kezdjetek egy beszélgetéssel arról, hogyan dolgoztok most, és mi működik vagy nem működik.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7bc2616a0ec0b1dc:
    english: "## The Role of the Facilitator"
    translation: "## A facilitátor szerepe"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c6d08854a875262a:
    english: Good facilitation requires self-awareness on an individual and collective level. Lack of understanding of the role can lead to misunderstandings, conflict, or unsafe situations.
    translation: A jó facilitáláshoz egyéni és közös önismeret kell. Ha a szerep nem világos, az félreértésekhez, konfliktusokhoz vagy bizonytalan helyzetekhez vezethet.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aa59e3e4d08a95b7:
    english: "> Have the power handed over to you. When you’re invited into a new group or organization, everybody will be thinking: Who’s this joker? Why should we listen to them? Get somebody who the participants know and trust to introduce you. This builds you up in the participants' minds and helps to hand over the power over to you. — Silvia Zuur"
    translation: "> Gondoskodj róla, hogy átadják neked a vezetéshez szükséges felhatalmazást. Amikor meghívnak egy új csoportba vagy szervezetbe, sokan azt kérdezik magukban: Ki ez az ember? Miért hallgassunk rá? Kérj meg valakit, akit a résztvevők ismernek és akiben megbíznak, hogy mutasson be téged. Ez segít elnyerni a bizalmukat, és egyértelművé teszi a felhatalmazásodat. — Silvia Zuur"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  02d38d1def45d150:
    english: |-
      ### Consent
      It’s critical that the group consents to be facilitated. Attempting to facilitate otherwise can be at worst coercive (unfair to the group) and dangerous (unfair to the facilitator) — and will face resistance and confusion. Facilitators put themselves in a vulnerable position; they must have mandate or they should not agree to engage. Consent is critical for both the facilitator and participants.
    translation: |-
      ### Beleegyezés
      Fontos, hogy a csoport beleegyezzen a facilitálásba. Enélkül a folyamat a csoport számára kényszerítő, a facilitátor számára veszélyes lehet, és ellenállást vagy zavart válthat ki. A facilitátor kiszolgáltatott helyzetbe kerül, ezért felhatalmazásra van szüksége. Ha ezt nem kapja meg, ne vállalja a feladatot. A beleegyezés a facilitátor és a résztvevők számára egyaránt fontos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a1a8c6ca89dad49a:
    english: |-
      ### Responsibility
      Once a facilitator takes up a mandate, they carry enhanced responsibilities. Facilitators have more claim to floor time, and directing the group’s attention. This has to be used in service to the whole, not for a personal agenda. The words and demeanor of the facilitator will also have a disproportionate effect, meaning they have to act with heightened consideration.
    translation: |-
      ### Felelősség
      A felhatalmazással a facilitátor nagyobb felelősséget is vállal. Több lehetősége van megszólalni és irányítani a csoport figyelmét. Ezt az egész csoport érdekében kell használnia, nem személyes célokra. Szavai és viselkedése különösen erősen hatnak a résztvevőkre, ezért fokozott figyelemmel kell eljárnia.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b5f6b4ebd477c97c:
    english: |-
      ### Power
      Facilitation by nature introduces power differentials. If the facilitator cannot exercise power in certain ways, they cannot do their job. For example, to keep a discussion on topic the facilitator might interrupt someone, or say that a certain way of interacting is not OK. It’s not appropriate to expect a facilitator to shoulder responsibility for the experience without giving them the powers they need to deliver successfully. There is no one right answer about how much power, but it has to be balanced with the level of responsibility.
    translation: |-
      ### Hatalom
      A facilitálás természetéből adódóan különbséget teremt a résztvevők és a facilitátor befolyása között. A facilitátornak bizonyos helyzetekben élnie kell a felhatalmazásával, különben nem tudja ellátni a feladatát. Például félbeszakíthat valakit, hogy a beszélgetés a témánál maradjon, vagy jelezheti, hogy egy adott viselkedés nem elfogadható. Nem méltányos felelőssé tenni a folyamatért, ha nem kapja meg a sikeres vezetéshez szükséges jogköröket. Nincs minden helyzetre érvényes válasz arra, mekkora felhatalmazás kell, de annak arányban kell állnia a felelősséggel.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c82df3fe42db014a:
    english: |-
      ### Responsiveness
      Facilitators do their best work when they can adapt effectively to the emergent reality. Human beings are endlessly complex, and groups of them exponentially more so. Rigid adherence to a plan or protocol without flexibility can set the group up to fail. If a facilitator is not allowed or not willing to adapt to changing circumstance, they cannot effectively hold the space for dynamic humans.
    translation: |-
      ### Alkalmazkodás
      A facilitátorok akkor tudnak a legjobban dolgozni, ha alkalmazkodnak a kialakuló helyzethez. Az emberek összetettek, a csoportok pedig még inkább azok. Ha valaki rugalmatlanul ragaszkodik egy tervhez vagy szabályrendszerhez, az akadályozhatja a csoportot. Ha a facilitátor nem tud vagy nem akar alkalmazkodni a változó körülményekhez, nem tudja hatékonyan vezetni a közös munkát.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aad36b296834ab22:
    english: "> Wear and un-wear the facilitation-hat. A challenge many people face is trying to facilitate meetings and workshops with their own team. As a facilitator, they need to be neutral. But as a team member, they have valuable insights to share. Make it really clear when you’re a facilitator and when you’re being a participant. — Silvia Zuur"
    translation: "> Tedd fel és vedd le a facilitátori kalapot. Sokaknak nehéz a saját csapatuk megbeszéléseit és műhelymunkáit vezetni. Facilitátorként pártatlannak kell lenniük, csapattagként viszont értékes meglátásaik vannak. Tedd egyértelművé, mikor vezeted a folyamatot, és mikor veszel részt benne csapattagként. — Silvia Zuur"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  85c4fcf7a6e72361:
    english: |-
      * Many groups using Loomio are experienced with facilitation and already have a shared understanding of the role. They already adapt the tool to meet these needs with some success.
      * Often the person who starts a discussion is assumed to be facilitating it, barring another agreed understanding in the group. Clarity about who is facilitating can greatly enhance mutual safety and success.
      * Loomio naturally creates a dynamic and open to distributed acts of facilitation, such as users tagging in others, requests to stay on topic, suggestions of the right timing for a proposal, etc — but this is often left implicit. Explicitly naming what acts of facilitation are and discussing whether this role is centralised or distributed can clarify the role.
      * Implicit distributed facilitation can be the default starting place for an online group (ie, no discussion of facilitation as a named role), but that setup is actually best for advanced groups prgressing past working with explicit facilitation.
    translation: |-
      * Sok Loomiót használó csoportnak van tapasztalata a facilitálásban, és közösen értik ezt a szerepet. Már most is sikerrel igazítják az eszközt a saját igényeikhez.
      * Ha a csoport nem állapodott meg másként, gyakran feltételezik, hogy a beszélgetést indító személy vezeti is azt. A résztvevők nagyobb biztonságban dolgozhatnak együtt, ha világos, ki a facilitátor.
      * A Loomio teret ad annak, hogy többen is részt vegyenek a facilitálásban: például másokat bevonjanak a beszélgetésbe, kérjék a témánál maradást, vagy javasolják, mikor érdemes javaslatot tenni. Ez a szerep azonban gyakran kimondatlan marad. Segít tisztázni, ha megnevezitek ezeket a feladatokat, és megbeszélitek, hogy egy emberhez tartoznak-e, vagy megosztjátok őket.
      * Egy online csoport kiindulhat abból, hogy a facilitálás feladatai kimondatlanul megoszlanak, és nem beszél külön a facilitátori szerepről. Ez a működés azonban inkább azoknak a tapasztalt csoportoknak megfelelő, amelyek már túlléptek a kijelölt facilitátorral végzett munkán.
