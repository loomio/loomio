  5a0b9426a2d88e62:
    english: |-
      ## Contacting someone via a direct discussion
      A direct discussion can be used to contact one or more people privately without creating a subgroup.
    translation: |-
      ## Iemand benaderen via een directe discussie
      Je kunt een directe discussie gebruiken om privé contact op te nemen met een of meer mensen zonder een subgroep te maken.
