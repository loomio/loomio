  6e1409b4f3f725d9:
    english: Select **Direct threads** in the sidebar to see your direct discussions. Select **New discussion** on that page to start another one.
    translation: Выберите **Прямые темы** в боковой панели, чтобы увидеть свои прямые обсуждения. Чтобы начать ещё одно, выберите **Новое обсуждение** на открывшейся странице.
