  67bc6cfdb2afad04:
    english: |-
      Only parent-group admins can rename, recolor, merge, or delete tags. These
      changes apply throughout the organization, including its subgroups.
    translation: |-
      Alleen beheerders van de hoofdgroep kunnen labels hernoemen, een andere kleur
      geven, samenvoegen of verwijderen. Deze wijzigingen gelden in de hele organisatie,
      ook in de subgroepen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
