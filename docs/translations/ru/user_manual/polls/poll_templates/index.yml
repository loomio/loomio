---
navigation_title: Шаблоны голосований
blocks:
  6428da81fbbe11c6:
    english: "# Poll templates"
    translation: "# Шаблоны голосований"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  208bc68b458895f1:
    english: Poll templates are reusable starting points shown when someone selects **Start a vote** or **New poll**. A template combines a voting method with preset guidance, response options, and settings.
    translation: Шаблоны голосований — это готовые заготовки, которые появляются при выборе **Начать голосование** или **Новый опрос**. Шаблон объединяет способ голосования, подсказки, варианты ответа и настройки.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f290b92adeb2a791:
    english: Use this page to configure which templates are available to a group or to create one for your own process. To choose a template for a particular vote, see [Proposals](../proposals/) or [Polls](../proposal_types/). To facilitate a complete decision process, see [Making decisions](/en/guides/making_decisions/).
    translation: Здесь вы можете настроить доступные группе шаблоны или создать шаблон для своего процесса. О том, как выбрать шаблон для конкретного голосования, читайте в разделах [Предложения](../proposals/) и [Голосования](../proposal_types/). О том, как организовать процесс принятия решения, читайте в разделе [Принятие решений](/en/guides/making_decisions/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  658d10486cbee7dc:
    english: "## Voting methods and templates"
    translation: "## Способы голосования и шаблоны"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d903d1a58aebf643:
    english: A voting method controls how participants respond and how Loomio calculates the result. Examples include Proposal, Choose, Score, Allocate, Rank, Time poll, and STV.
    translation: 'Способ голосования определяет, как участники отвечают и как Loomio подсчитывает результат. Примеры: «Предложение», «Выбирать», «Счет», «Выделить», «Классифицировать», «Опрос времени» и STV.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  21efff1a5c91ad29:
    english: A poll template uses one of those methods and adds reusable defaults. For example, Sense check, Advice, Consent, and Consensus are different templates built on the Proposal voting method. Their instructions and response options differ even though Loomio handles their ballots in the same way.
    translation: Шаблон голосования использует один из этих способов и добавляет настройки по умолчанию. Например, «Проверка мнений», «Совет», «Согласие» и «Консенсус» — разные шаблоны на основе способа «Предложение». Их инструкции и варианты ответа различаются, хотя Loomio обрабатывает голоса одинаково.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f622951ffc7e1064:
    english: "## Use a template"
    translation: "## Как использовать шаблон"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  865e825cc7d00cf2:
    english: When starting a vote, select the **Proposal** or **Poll** tab and choose one of the templates available to the group.
    translation: Чтобы начать голосование, откройте вкладку **Предложение** или **Голосование** и выберите один из шаблонов, доступных группе.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1598f1a55a6944e6:
    english: The template supplies an introduction, example content, options, and settings. Review and edit these for the particular decision before starting the vote. Editing the new vote does not change the reusable template.
    translation: Шаблон добавит вводный текст, пример содержимого, варианты ответа и настройки. Перед началом голосования проверьте и измените их с учётом конкретного решения. Изменения нового голосования не затронут шаблон.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8212a94908338b22:
    english: "## Who can manage templates"
    translation: "## Кто может управлять шаблонами"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  378caa9ba83ee0dc:
    english: Group administrators can create and manage every poll template in their group. They can enable **Members can create templates** under **Group settings** → **Permissions**. When enabled, members can create templates and manage templates they authored.
    translation: Администраторы группы могут создавать все шаблоны голосований в своей группе и управлять ими. В разделе **Настройки группы** → **Разрешения** они могут включить параметр **Участники могут создавать шаблоны.** Тогда участники смогут создавать шаблоны и управлять созданными ими шаблонами.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0fafc6275b6c9153:
    english: "## Create a poll template"
    translation: "## Как создать шаблон голосования"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5fc696a1e924179c:
    english: Open the template list and select **New template**. Start with an example or a blank template, then choose the group that will use it.
    translation: Откройте список шаблонов и выберите **Новый шаблон**. Начните с примера или пустого шаблона, затем выберите группу, которая будет его использовать.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  37b3658ec66eb8b7:
    english: The template form defines the guidance and defaults people receive when they start a vote.
    translation: В форме шаблона задаются подсказки и настройки по умолчанию, которые люди увидят при создании голосования.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fa0dab51a009bf90:
    english: "### Template title, subtitle, and help"
    translation: "### Название, подзаголовок и справка шаблона"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  965cde5e13952ade:
    english: |-
      - **Template title** is the short name shown in the template list.
      - **Template subtitle** explains when to use it in one sentence.
      - **Template help** appears in the information panel when someone uses the template. Explain its purpose, any rules participants should know, and links to relevant policies or guides.
    translation: |-
      - **Название шаблона** — краткое название в списке шаблонов.
      - **Шаблон подзаголовка** — одно предложение о том, когда использовать шаблон.
      - **Помощь с шаблонами** отображается в информационной панели при использовании шаблона. Опишите назначение шаблона, правила для участников и добавьте ссылки на нужные документы или руководства.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f3e51b30163d5b85:
    english: Use plain, specific names that distinguish the template from others in the group.
    translation: Используйте простые и конкретные названия, чтобы шаблоны в группе было легко различать.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e6b8a09191bb8c3f:
    english: "### Voting method"
    translation: "### Способ голосования"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ea4fef806c1cf060:
    english: Choose what participants need to express and how the result should be calculated.
    translation: Выберите, что должны выразить участники и как следует подсчитывать результат.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f8c87a496921c710:
    english: |-
      - **Proposal**: respond to a statement using defined positions;
      - **Choose**: select one or more options;
      - **Score**: evaluate every option on a scale;
      - **Allocate**: distribute a limited budget of points;
      - **Rank**: arrange options in preference order;
      - **Time poll**: indicate availability; and
      - **STV**: rank candidates in a proportional, multi-winner election.
    translation: |-
      - **Предложение**: выразить позицию по утверждению с помощью заданных вариантов ответа;
      - **Выбирать**: выбрать один или несколько вариантов;
      - **Счет**: оценить каждый вариант по шкале;
      - **Выделить**: распределить ограниченное число баллов;
      - **Классифицировать**: расположить варианты в порядке предпочтения;
      - **Опрос времени**: указать, когда участники свободны; и
      - **STV**: упорядочить кандидатов по предпочтению на пропорциональных выборах с несколькими победителями.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9d589e44fa94c5e2:
    english: Changing the voting method changes the fields and result calculation available to the template.
    translation: При изменении способа голосования меняются доступные шаблону поля и способ подсчёта результата.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  230689f781e4cbc7:
    english: "### Example title, details, and tags"
    translation: "### Пример названия, описания и тегов"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6fa4b3625c6ec7ce:
    english: Provide example content that helps an author frame the vote. These values are copied into a new proposal or poll and can be edited before it starts.
    translation: Добавьте пример, который поможет автору сформулировать вопрос для голосования. Эти данные копируются в новое предложение или голосование. Их можно изменить до начала голосования.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a093368b30ac3c9b:
    english: Use prompts rather than fixed content when each use needs a different title or details. Add default category tags only when they apply every time the template is used.
    translation: Если для каждого голосования нужны свои название или описание, используйте подсказки вместо готового текста. Добавляйте теги категорий по умолчанию, только если они подходят для каждого голосования по этому шаблону.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  24c3fa4b7ef676fd:
    english: "### Response options"
    translation: "### Варианты ответа"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e7421caab9c47f5b:
    english: 'Methods such as Proposal and Choose let you configure response options. Select the pencil icon beside an option to edit:'
    translation: 'Способы «Предложение» и «Выбирать» позволяют настроить варианты ответа. Чтобы изменить вариант, нажмите значок карандаша рядом с ним:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  73a065ad5b861579:
    english: |-
      - **Option name**: the short response label;
      - **Icon**: its visual marker;
      - **Meaning**: what selecting the option communicates; and
      - **Reason prompt**: the question shown when someone explains their response.
    translation: |-
      - **Название опции**: краткое название варианта ответа;
      - **Икона**: его визуальное обозначение;
      - **Значение**: что означает выбор этого варианта; и
      - **Причина подсказки**: вопрос, который появляется, когда участник поясняет свой ответ.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  38bc8cfc36aaea2e:
    english: Define options so participants can tell the difference between them without guessing. The meanings should match the decision rules your group actually uses.
    translation: Настройте варианты так, чтобы участники понимали разницу между ними. Значения вариантов должны соответствовать правилам принятия решений в вашей группе.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cc4adba73670a75b:
    english: "### Duration and settings"
    translation: "### Продолжительность и настройки"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6c63a57ab4cec442:
    english: Set a default duration that is suitable for most uses of the template. The author can change the closing time for an individual vote.
    translation: Установите продолжительность по умолчанию, подходящую для большинства голосований по этому шаблону. Автор сможет изменить время закрытия отдельного голосования.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  df14be8dbf80fa3c:
    english: Other defaults can control result visibility, anonymous voting, vote-reason requirements, reminders, quorum, and method-specific behaviour. See [Proposal and poll settings](../settings/) for their effects.
    translation: Другие настройки по умолчанию управляют видимостью результатов, анонимным голосованием, обязательным объяснением ответа, напоминаниями, кворумом и особенностями выбранного способа голосования. Подробнее читайте в разделе [Настройки предложений и голосований](../settings/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  774ed7b91d33ab10:
    english: "### Save and test the template"
    translation: "### Как сохранить и проверить шаблон"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1b26a723ab8a9811:
    english: After saving, start a draft vote from the template. Check that its introduction, prompts, options, and defaults make sense to someone who did not create it. Starting a draft is also a useful way to confirm that the chosen voting method produces the result the group expects.
    translation: Сохраните шаблон и создайте на его основе черновик голосования. Проверьте, понятны ли вводный текст, подсказки, варианты ответа и настройки человеку, который не создавал шаблон. Черновик также поможет убедиться, что выбранный способ голосования даёт ожидаемый группой результат.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1f0dab3f50320e75:
    english: "## Manage the template list"
    translation: "## Управление списком шаблонов"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e9748843a900273f:
    english: 'Use the action menu beside a template to:'
    translation: 'В меню действий рядом с шаблоном вы можете:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  646235094d051c83:
    english: |-
      - **Edit** its reusable content and defaults;
      - **Move** it to a different position in the list;
      - **Hide** it from people starting votes; or
      - **Delete** a custom template that is no longer needed.
    translation: |-
      - **Редактировать** содержимое шаблона и его настройки по умолчанию;
      - **Переместить** шаблон на другое место в списке;
      - **Скрывать** шаблон от людей, начинающих голосование; или
      - **Удалить** пользовательский шаблон, который больше не нужен.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3f6dc06b1fd2bce8:
    english: Select **Show hidden templates** to review or restore hidden templates. Default templates can be hidden or adapted for the group, but cannot be deleted.
    translation: Выберите **Показать скрытые шаблоны**, чтобы просмотреть или восстановить их. Шаблоны по умолчанию можно скрыть или настроить для группы, но нельзя удалить.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  be3ee2d2721d3e2a:
    english: Changing a template does not alter proposals or polls that have already been started from it.
    translation: Изменение шаблона не влияет на предложения и голосования, уже созданные на его основе.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
