navigation_title: Véleményfelmérés
blocks:
  5c5bf2d96ddf4ca2:
    english: "# Sense check"
    translation: "# Véleményfelmérés"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4ec1b55b6ebaf563:
    english: Sense check gathers reactions while an idea is still being developed. Its options—**Looks good**, **Could be better**, and **Needs a rethink**—show whether the group is ready to proceed or should revise the idea first.
    translation: A véleményfelmérés visszajelzéseket gyűjt egy még formálódó ötletről. A **Jól néz ki**, **Lehetne jobb is** és **Újragondolásra van szükség** válaszok megmutatják, hogy a csoport készen áll-e a továbblépésre, vagy előbb módosítani kell az ötletet.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  43573d5547783c67:
    english: This page explains how to run one Sense check. See the [Simple decision process](/en/guides/making_decisions/simple_decision_process), [Consent process](/en/guides/making_decisions/consent_process), or [Consensus process](/en/guides/making_decisions/consensus_process) for examples of using Sense check as one stage of a larger process.
    translation: Ez az oldal egy véleményfelmérés lebonyolítását mutatja be. Az [Egyszerű döntési folyamat](/en/guides/making_decisions/simple_decision_process), az [Egyetértésen alapuló döntési folyamat](/en/guides/making_decisions/consent_process) és a [Konszenzusos döntési folyamat](/en/guides/making_decisions/consensus_process) példákat ad arra, hogyan lehet a véleményfelmérés egy hosszabb folyamat része.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5ad4c12fda490468:
    english: "## When to use Sense check"
    translation: "## Mikor érdemes véleményfelmérést használni?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dc841c725ef4e519:
    english: 'Use Sense check to:'
    translation: 'Használj véleményfelmérést, ha:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8472db2ec587add8:
    english: |-
      - test an early draft before investing in a detailed proposal;
      - uncover questions and concerns before a formal decision;
      - check whether another round of discussion is needed; or
      - compare support before and after revising an idea.
    translation: |-
      - egy korai tervezetet szeretnél kipróbálni, mielőtt részletes javaslatot készítesz;
      - kérdéseket és aggályokat szeretnél feltárni a hivatalos döntés előtt;
      - meg szeretnéd tudni, szükség van-e további megbeszélésre; vagy
      - össze szeretnéd hasonlítani, mennyien támogatják az ötletet a módosítás előtt és után.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f411d599f7810e88:
    english: Do not treat **Looks good** as formal approval unless the group has explicitly agreed to do so. Use [Consent](../consent/) or [Consensus](../consensus/) when the response must authorize a decision.
    translation: A **Jól néz ki** választ ne tekintsd hivatalos jóváhagyásnak, hacsak a csoport kifejezetten meg nem állapodott ebben. Ha a válasznak döntést kell jóváhagynia, használj [egyetértésen alapuló döntést](../consent/) vagy [konszenzust](../consensus/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e504f1a6f38ec6ad:
    english: "## Example: check a trial plan"
    translation: "## Példa: egy próbaterv felmérése"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dd13b88fd1a52d50:
    english: Oatmilk Cooperative has drafted a returnable-bottle trial. It runs a Sense check to learn whether the collection schedule, washing checks, and reporting plan are ready for final review.
    translation: Az Oatmilk Szövetkezet kidolgozta a visszaváltható palackok próbaidőszakának tervét. Véleményfelméréssel szeretné megtudni, hogy a begyűjtés ütemezése, a mosás ellenőrzése és a beszámolási terv készen áll-e a végső áttekintésre.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9703f1f9474243af:
    english: "## Set up the proposal"
    translation: "## Állítsd be a javaslatot"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  48d89110b4c23c6f:
    english: State what stage the idea has reached and what will happen with the feedback. Keep the default response meanings or edit them to match the group's language. Set a closing time that leaves enough time to revise the plan.
    translation: Írd le, hol tart az ötlet, és mi történik majd a visszajelzésekkel. Megtarthatod a válaszok alapértelmezett jelentését, vagy a csoport szóhasználatához igazíthatod őket. Úgy állítsd be a lezárás időpontját, hogy maradjon elég idő a terv módosítására.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Szavazz"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a0f4779c6103c9c:
    english: Participants choose the response that best represents their current view and explain what is ready or what should change. A useful reason gives the proposal author something specific to act on.
    translation: A résztvevők kiválasztják a jelenlegi véleményüket legjobban kifejező választ, és leírják, mi áll készen, vagy min kellene változtatni. A hasznos indoklás konkrét támpontot ad a javaslat készítőjének.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Nézd meg az eredményeket"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ddcd496a30ab97da:
    english: 'The chart shows the number and proportion of votes for each response. Read the reasons as well as the distribution: one well-founded concern may require attention even when most participants select **Looks good**.'
    translation: 'A diagram megmutatja az egyes válaszokra leadott szavazatok számát és arányát. Az indoklásokat is olvasd el: egy megalapozott aggállyal akkor is foglalkozni kellhet, ha a legtöbben a **Jól néz ki** választ választják.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d9ac55d3e75e5484:
    english: Publish an outcome that summarizes the changes the group will make, or records that the idea is ready for the next decision stage.
    translation: Tegyél közzé egy következtetést, amely összefoglalja, milyen változtatásokat végez a csoport, vagy rögzíti, hogy az ötlet készen áll a döntési folyamat következő szakaszára.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
