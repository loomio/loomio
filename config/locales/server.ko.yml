      process_subtitle_v2: 방향이 맞는지 확인하기
      process_introduction_v2: "<p><strong>의견 확인</strong>은 결정을 확정하기 전에 초기 의견을 받는 데 도움이 됩니다. 참여자는 방향이 좋아 보이는지 말하거나 우려를 알려 주므로, 정식 제안으로 넘어가기 전에 방향을 조정할 수 있습니다. 결정을 내리는 단계가 아니라 분위기를 살피는 단계입니다.</p>"
      process_introduction: <p>의견 확인 제안은 의견과 질문을 받고 우려 사항을 파악하기 좋은 방법입니다. 결정을 내리기 전에 제안을 명확히 하고 개선하는 데 도움이 됩니다.</p><p>의견 확인은 제안을 준비 중임을 알리고 참여를 독려합니다. 사람들의 이야기를 듣고 생각을 살펴 적절히 대응할 기회이며, 그 의견을 반영해 더 나은 결정을 내릴 수 있습니다.</p> <p>이의 없는 의사결정 과정에서는 의견 확인 제안으로 반응과 댓글을 받아 제안을 개선하고, 합의 과정에서는 합의 여부를 확인하세요.</p><p><a target="_blank" rel="noopener noreferrer nofollow" href="/docs/en/guides/making_decisions/simple_decision_process"><u>간단한 의사결정 과정에서 의견 확인을 사용하는 방법 알아보기</u></a><span>.</span></p>
      title: 새 브랜드 구상에 대해 어떻게 생각하나요?
      details: <h3 id="what-are-you-proposing"><strong>무엇을 제안하나요?</strong></h3><p></p><h3 id="why-is-this-important"><strong>이것이 왜 중요한가요?</strong></h3><p></p><h3 id="what-are-you-asking-people-to-do"><strong>참여자에게 무엇을 요청하나요?</strong></h3><p></p><p>제안에 대해 어떻게 생각하나요?  댓글을 남기거나 개선할 점을 제안하세요.</p><p>이번 의견 확인은 더 나은 결정을 내릴 수 있도록 의견을 보태고 기여하는 기회입니다.</p>
      outcome_statement: "<p>의견 확인에 참여해 주셔서 감사합니다.</p>"
      not_sure: 잘 모르겠음
      not_sure_meaning: 질문이 있거나 시간이 더 필요합니다
      not_sure_prompt: 어떤 부분이 불분명한가요? 어떻게 해결하면 좋을까요?
