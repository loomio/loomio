    translation: "### Вкладки"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cdd3c098983b6066:
    english: 'The tabs under the group description provide access to:'
    translation: 'Вкладки під описом групи дають доступ до:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  02760342b07f5ff4:
    english: "**Discussions** - The group's discussion threads and recent activity."
    translation: "**Обговорення** - Теми обговорень групи та нещодавня активність."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e2c7a0c137330c27:
    english: "**Polls** - A list of polls active in your group."
    translation: "**Опитування** - Список активних опитувань у вашій групі."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '085bd9dfce8144dc':
    english: "**Members** - The people who belong to the group."
    translation: "**Учасники** - Люди, які входять до групи."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cfdb369a7fd6e14f:
    english: "**Files** - Documents and other files attached throughout the group. The tab collects files from discussion contexts, comments, proposals, and polls, so you can find a document without remembering where it was attached."
    translation: "**Файли** - Документи та інші файли, прикріплені в групі. На цій вкладці зібрано файли з обговорень, коментарів, пропозицій і опитувань, щоб ви могли знайти документ, не згадуючи, де його прикріпили."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6483153cbc12b458:
    english: See [Finding content](/en/user_manual/overview/finding-content) for help with search, filters, tags, bookmarks, and unread discussions.
    translation: Про пошук, фільтри, теги, закладки та непрочитані обговорення читайте в розділі [Пошук вмісту](/en/user_manual/overview/finding-content).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
