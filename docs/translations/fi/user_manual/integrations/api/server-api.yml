  7fe42bee753b558d:
    english: "`/api/b3` is for server-level operations. Use `/api/b2` for user-oriented actions performed as a Loomio user account."
    translation: "`/api/b3` on tarkoitettu palvelintason toimintoihin. Käytä `/api/b2`-rajapintaa toimintoihin, jotka suoritetaan Loomio-käyttäjätilillä."
