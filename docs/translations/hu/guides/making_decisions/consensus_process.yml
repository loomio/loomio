    translated_on: '2026-09-30'
  47143ba16ce4a9ff:
    english: 'When the Consensus proposal closes, Vivien states an outcome and notifies everyone that agreement has been reached, and that work to implement the new brand will commence. '
    translation: Amikor a Konszenzus típusú javaslat lezárul, Vivien közzéteszi a következtetést, és értesít mindenkit arról, hogy megszületett a megállapodás, és megkezdődik az új arculat bevezetése.
    status: machine
