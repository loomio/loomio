  ba3ef231a647d607:
    english: People often want to leave things to “common sense” and avoid agreeing a code of conduct or explicit protocols. However, this can disproportionately affect the most vulnerable members of the group, since they will feel the negative impacts of bad behavior or culture first and strongest, and are least empowered to counteract it themselves. It's the responsibility of the more privileged or influential members of the group to think through these questions carefully.
    translation: Ihmiset haluavat usein luottaa "maalaisjärkeen" eivätkä sopia kirjallisista käyttäytymissäännöistä tai toimintatavoista. Tämä voi kuitenkin haitata erityisesti ryhmän haavoittuvimmassa asemassa olevia jäseniä. He kokevat huonon käytöksen ja vahingollisen kulttuurin vaikutukset ensimmäisinä ja voimakkaimmin, mutta heidän voi olla vaikeinta puuttua niihin itse. Ryhmän etuoikeutetumpien tai vaikutusvaltaisempien jäsenten vastuulla on pohtia näitä kysymyksiä huolellisesti.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d14bcec24555318c:
    english: Like a legal contract, you hope you never have to enforce a code of conduct, but if you need it you’re very glad it’s there. You want to agree *before* it becomes necessary. In order for a facilitator or any member of the group to effectively stand up and say, “that’s not OK here”, you need to have already invested in culture-building and expectation-setting.
    translation: 'Käyttäytymissäännöt ovat kuin sopimus: toivot, ettei niihin tarvitse vedota, mutta tarvittaessa olet tyytyväinen, että ne ovat olemassa. Niistä kannattaa sopia *ennen* kuin ongelmia ilmenee. Jotta ohjaaja tai kuka tahansa ryhmän jäsen voi sanoa tehokkaasti "tämä ei käy täällä", ryhmän on jo täytynyt rakentaa yhteistä kulttuuria ja sopia odotuksista.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dda14b86acbd8199:
    english: |-
      * Because Loomio is usually used as a space for constructive deliberation among groups with a specific purpose and set of members, for the most part people engage in good faith and behave respectfully.
      * Loomio is designed specifically to give voice to the individual, and let them communicate their needs and concerns. Even if a majority doesn’t see a problem, a single person can raise it and be heard.
      * Communicating online enables a certain level of physical safety, because people are not face to face.
      * Some groups already use the group description field to note a code of conduct or expectations for behavior. Others have collectively agreed a set of expectations that govern participation.
      * Many groups use Loomio itself to decide their group protocols, such as how to engage, what is allowed, what a decision means and what makes it valid, etc.
      * Some core protocol issues are answered simply by using Loomio: Who is allowed here? How do we communicate?
      * One of the most basic decisions Loomio users all encounter is about decision-making protocol — Consensus? Majority? Quorum? Unanimity? Bringing the question of decision-making protocol to the fore can be a very productive step in cultural development.
    translation: |-
      * Loomiota käytetään yleensä rakentavaan keskusteluun ryhmissä, joilla on yhteinen tarkoitus ja tietty jäsenistö. Siksi ihmiset toimivat siellä useimmiten vilpittömästi ja toisiaan kunnioittaen.
      * Loomio on suunniteltu antamaan jokaiselle tilaa kertoa tarpeistaan ja huolistaan. Vaikka enemmistö ei näkisi ongelmaa, yksi ihminen voi ottaa sen esiin ja tulla kuulluksi.
      * Verkossa viestiminen voi lisätä fyysistä turvallisuutta, koska ihmiset eivät ole kasvokkain.
      * Jotkin ryhmät kirjoittavat käyttäytymissäännöt tai toimintaa koskevat odotukset ryhmän kuvaukseen. Toiset sopivat yhdessä osallistumista ohjaavista odotuksista.
      * Monet ryhmät päättävät toimintatavoistaan Loomiossa. Ne voivat sopia esimerkiksi osallistumisesta, sallituista toimintatavoista sekä siitä, mitä päätös tarkoittaa ja milloin se on pätevä.
      * Loomion käyttö vastaa joihinkin toimintatapoja koskeviin peruskysymyksiin: Ketkä saavat osallistua? Miten viestimme?
      * Kaikki Loomion käyttäjät kohtaavat päätöksentekotapaa koskevan kysymyksen: vaaditaanko yksimielisyyttä, riittääkö enemmistö tai onko päätösvaltaisuudelle asetettu vähimmäisosallistujamäärä? Näiden kysymysten käsittely voi auttaa kehittämään ryhmän kulttuuria.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
