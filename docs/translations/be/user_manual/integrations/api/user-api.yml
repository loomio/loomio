    translation: 'Калі перадаць `remove_absent=1`, з групы будуць выдалены ўсе ўдзельнікі, не ўключаныя ў спіс. Будзьце ўважлівыя: так можна выдаліць з вашай групы ўсіх удзельнікаў.'
