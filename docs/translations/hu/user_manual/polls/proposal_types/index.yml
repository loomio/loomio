  d370759001be4e21:
    english: Polls collect selections, scores, allocations, rankings, availability, or election ballots. Choose the voting method based on what participants need to express and how you intend to use the result. Use a [Proposal](/en/user_manual/polls/proposals/) when people need to respond to a statement or course of action.
    translation: A szavazásokkal választásokat, pontszámokat, pontelosztást, rangsorokat, időpontokat és választási szavazatokat gyűjthetsz. Aszerint válassz szavazási módot, hogy mit szeretnének kifejezni a résztvevők, és mire használod majd az eredményt. Használj [javaslatot](/en/user_manual/polls/proposals/), ha egy állításra vagy tervezett lépésre vársz választ.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1132ff680c7b2562:
    english: "## Simple poll"
    translation: "## Egyszerű szavazás"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6b957bf5630c1470:
    english: "[Choose](/en/user_manual/polls/choose/) lets participants select one or more options. Use it to find the most popular option or make a shortlist."
    translation: A [szavazásban](/en/user_manual/polls/choose/) a résztvevők egy vagy több lehetőséget választhatnak. Így megtalálhatod a legnépszerűbb lehetőséget, vagy összeállíthatsz egy szűkített listát.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c982974685e1b5d6:
    english: "## Score poll"
    translation: "## Pontszám felmérés"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fbbfe14196388606:
    english: "[Score](/en/user_manual/polls/score/) lets participants rate every option on the same scale. Use it to compare the strength of support, readiness, suitability, or importance across options."
    translation: A [pontszám felmérésben](/en/user_manual/polls/score/) a résztvevők minden lehetőséget ugyanazon a skálán értékelhetnek. Így összehasonlíthatod a lehetőségek támogatottságát, megvalósíthatóságát, alkalmasságát vagy fontosságát.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0465fcb48a56ca78:
    english: "## Dot vote"
    translation: "## Pont-szavazás"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ffb7d1711a5fca3b:
    english: "[Allocate](/en/user_manual/polls/allocate/) gives each participant a fixed budget of points to distribute. Use it to identify priorities when choosing one thing means giving less attention or resources to another."
    translation: A [pont-szavazásban](/en/user_manual/polls/allocate/) minden résztvevő meghatározott számú pontot oszthat szét. Így meghatározhatod a prioritásokat, amikor az egyik lehetőség választása kevesebb figyelmet vagy erőforrást hagy a többire.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a1b15c28fbe526f6:
    english: "## Ranked choice"
    translation: "## Sorrend szavazás"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8811f455b7ab3821:
    english: "[Rank](/en/user_manual/polls/rank/) lets participants arrange options in order of preference. Use it to find the group's overall preferred order or select one leading option."
    translation: A [sorrend szavazásban](/en/user_manual/polls/rank/) a résztvevők előnyben részesítésük szerint rendezhetik a lehetőségeket. Így megtalálhatod a csoport általános sorrendjét vagy az első helyen álló lehetőséget.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2e21bb1b54b6fcf9:
    english: "## Time poll"
    translation: "## Idő-szavazás"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb768f07eb0d1971:
    english: "[Time poll](/en/user_manual/polls/meeting_polls/) lets participants indicate when they are available. Use it to schedule a meeting or event across time zones."
    translation: Az [idő-szavazásban](/en/user_manual/polls/meeting_polls/) a résztvevők jelezhetik, mikor érnek rá. Így különböző időzónákban élő résztvevőkkel is egyeztethetsz találkozót vagy eseményt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
