navigation_title: Verificação de opinião
blocks:
  5c5bf2d96ddf4ca2:
    english: "# Sense check"
    translation: "# Verificação de opinião"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4ec1b55b6ebaf563:
    english: Sense check gathers reactions while an idea is still being developed. Its options—**Looks good**, **Could be better**, and **Needs a rethink**—show whether the group is ready to proceed or should revise the idea first.
    translation: A verificação de opinião reúne reações enquanto uma ideia ainda está em desenvolvimento. As opções **Parece bom**, **Poderia ser melhor** e **Precisa ser repensado.** mostram se o grupo está pronto para avançar ou se deve revisar a ideia primeiro.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  43573d5547783c67:
    english: This page explains how to run one Sense check. See the [Simple decision process](/en/guides/making_decisions/simple_decision_process), [Consent process](/en/guides/making_decisions/consent_process), or [Consensus process](/en/guides/making_decisions/consensus_process) for examples of using Sense check as one stage of a larger process.
    translation: Esta página explica como realizar uma verificação de opinião. Veja o [Processo simples de decisão](/en/guides/making_decisions/simple_decision_process), o [Processo de consentimento](/en/guides/making_decisions/consent_process) ou o [Processo de consenso](/en/guides/making_decisions/consensus_process) para ver exemplos de como usá-la como etapa de um processo maior.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5ad4c12fda490468:
    english: "## When to use Sense check"
    translation: "## Quando usar a verificação de opinião"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dc841c725ef4e519:
    english: 'Use Sense check to:'
    translation: 'Use a verificação de opinião para:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8472db2ec587add8:
    english: |-
      - test an early draft before investing in a detailed proposal;
      - uncover questions and concerns before a formal decision;
      - check whether another round of discussion is needed; or
      - compare support before and after revising an idea.
    translation: |-
      - avaliar um rascunho inicial antes de investir em uma proposta detalhada;
      - identificar dúvidas e preocupações antes de uma decisão formal;
      - verificar se é necessária outra rodada de discussão; ou
      - comparar o apoio antes e depois de revisar uma ideia.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f411d599f7810e88:
    english: Do not treat **Looks good** as formal approval unless the group has explicitly agreed to do so. Use [Consent](../consent/) or [Consensus](../consensus/) when the response must authorize a decision.
    translation: Não considere **Parece bom** uma aprovação formal, a menos que o grupo tenha concordado explicitamente com isso. Use [Consentimento](../consent/) ou [Consenso](../consensus/) quando a resposta precisar autorizar uma decisão.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e504f1a6f38ec6ad:
    english: "## Example: check a trial plan"
    translation: "## Exemplo: avaliar um plano piloto"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dd13b88fd1a52d50:
    english: Oatmilk Cooperative has drafted a returnable-bottle trial. It runs a Sense check to learn whether the collection schedule, washing checks, and reporting plan are ready for final review.
    translation: A Cooperativa Oatmilk elaborou um plano piloto de garrafas retornáveis. Ela realiza uma verificação de opinião para saber se o cronograma de coleta, as verificações de lavagem e o plano de prestação de contas estão prontos para a revisão final.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9703f1f9474243af:
    english: "## Set up the proposal"
    translation: "## Configure a proposta"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  48d89110b4c23c6f:
    english: State what stage the idea has reached and what will happen with the feedback. Keep the default response meanings or edit them to match the group's language. Set a closing time that leaves enough time to revise the plan.
    translation: Informe em que estágio está a ideia e o que será feito com os comentários recebidos. Mantenha o significado padrão das respostas ou adapte-o à linguagem do grupo. Defina um prazo de encerramento que dê tempo suficiente para revisar o plano.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Vote"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a0f4779c6103c9c:
    english: Participants choose the response that best represents their current view and explain what is ready or what should change. A useful reason gives the proposal author something specific to act on.
    translation: Os participantes escolhem a resposta que melhor representa sua opinião no momento e explicam o que está pronto ou o que precisa mudar. Uma justificativa útil dá a quem criou a proposta algo específico para fazer.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Leia os resultados"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ddcd496a30ab97da:
    english: 'The chart shows the number and proportion of votes for each response. Read the reasons as well as the distribution: one well-founded concern may require attention even when most participants select **Looks good**.'
    translation: 'O gráfico mostra o número e a proporção de votos para cada resposta. Leia as justificativas além da distribuição dos votos: uma preocupação bem fundamentada pode exigir atenção mesmo quando a maioria dos participantes seleciona **Parece bom**.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d9ac55d3e75e5484:
    english: Publish an outcome that summarizes the changes the group will make, or records that the idea is ready for the next decision stage.
    translation: Publique uma conclusão que resuma as mudanças que o grupo fará ou registre que a ideia está pronta para a próxima etapa da decisão.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
