  68e2a02de493acf3:
    english: "# Proposals and polls"
    translation: "# Предложения и опросы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ff07fce3bab705aa:
    english: Proposals and polls collect structured responses from a group. They can help test an idea, make a decision, identify priorities, schedule a meeting, or elect representatives.
    translation: Предложения и опросы помогают собрать ответы участников группы в заданном формате. С их помощью можно проверить идею, принять решение, определить приоритеты, назначить встречу или избрать представителей.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f031d2644fee2a91:
    english: "## Find the right help"
    translation: "## Где найти нужную информацию"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  34039c79ea769793:
    english: 'These parts of the manual answer different questions:'
    translation: 'Эти разделы руководства отвечают на разные вопросы:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  34ea9d58ccbf80fb:
    english: |-
      | If you want to… | Read… |
      |---|---|
      | Choose what participants should express | [Proposals](../proposals/) or [Polls](../proposal_types/) |
      | Run a specific proposal template | [Sense check](../proposals/sense_check/), [Advice](../proposals/advice/), [Consent](../proposals/consent/), or [Consensus](../proposals/consensus/) |
      | Configure the templates available to a group | [Poll templates](../poll_templates/) |
      | Facilitate a decision from discussion to outcome | [Making decisions](/en/guides/making_decisions/) |
    translation: |-
      | Если вы хотите… | Читайте… |
      |---|---|
      | Выбрать, какие ответы должны дать участники | [Предложения](../proposals/) или [Опросы](../proposal_types/) |
      | Провести голосование по конкретному шаблону предложения | [Проверка мнения](../proposals/sense_check/), [Совет](../proposals/advice/), [Согласие](../proposals/consent/) или [Консенсус](../proposals/consensus/) |
      | Настроить шаблоны, доступные группе | [Шаблоны опросов](../poll_templates/) |
      | Провести группу от обсуждения до итогового решения | [Принятие решений](/en/guides/making_decisions/) |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7eddb057cca077f4:
    english: A **voting method** defines how people respond and how results are calculated. A **poll template** is a reusable configuration built on a voting method, with preset instructions, options, and settings. A **decision process** may use a discussion and several templates before the group reaches an outcome.
    translation: "**Метод голосования** определяет, как участники отвечают и как подсчитываются результаты. **Шаблон опроса** — это готовые инструкции, варианты ответов и настройки для определённого метода голосования. **Процесс принятия решения** может включать обсуждение и несколько шаблонов, прежде чем группа придёт к итоговому решению."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3cd46aa2f1240e88:
    english: "## Proposals"
    translation: "## Предложения"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  85a55fccaf4e4032:
    english: 'A proposal asks people to respond to a statement or course of action. Loomio includes templates for common purposes:'
    translation: 'Предложение просит участников выразить отношение к утверждению или плану действий. В Loomio есть шаблоны для распространённых задач:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  51bf1ffa7d057d9e:
    english: |-
      - [Sense check](../proposals/sense_check/) gathers early reactions;
      - [Advice](../proposals/advice/) gathers input for a decision maker;
      - [Consent](../proposals/consent/) tests for meaningful objections; and
      - [Consensus](../proposals/consensus/) seeks collective agreement.
    translation: |-
      - [Проверка мнения](../proposals/sense_check/) собирает первые отклики;
      - [Совет](../proposals/advice/) собирает мнения для человека, принимающего решение;
      - [Согласие](../proposals/consent/) помогает выявить существенные возражения; и
      - [Консенсус](../proposals/consensus/) помогает достичь общего согласия.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d01e9f85fcd2d9c2:
    english: See [Proposals](../proposals/) to compare them.
    translation: Сравните их в разделе [Предложения](../proposals/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  821dcd89b5460804:
    english: "## Polls"
    translation: "## Опросы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ec746235c7fe89c4:
    english: 'Use a poll when participants need to select, score, allocate, rank, state their availability, or cast an election ballot:'
    translation: 'Используйте опрос, когда участникам нужно выбрать варианты, оценить их, распределить баллы, расставить варианты по предпочтению, указать доступное время или проголосовать на выборах:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b93f9fe9611d9205:
    english: |-
      - [Choose](../choose/) finds popular options;
      - [Score](../score/) evaluates every option on a scale;
      - [Allocate](../allocate/) distributes a limited budget of points;
      - [Rank](../rank/) finds an overall order of preference;
      - [Time poll](../meeting_polls/) finds when people are available; and
      - [STV Election](../stv/) elects multiple winners proportionally.
    translation: |-
      - [Выбор](../choose/) показывает популярные варианты;
      - [Оценка](../score/) позволяет оценить каждый вариант по шкале;
      - [Распределение](../allocate/) позволяет распределить ограниченное число баллов;
      - [Ранжирование](../rank/) определяет общий порядок предпочтений;
      - [Опрос времени](../meeting_polls/) помогает найти время, когда участники свободны; и
      - [Выборы STV](../stv/) позволяют пропорционально избрать нескольких победителей.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9972b34ccc3ea79b:
    english: See [Polls](../proposal_types/) to compare them.
    translation: Сравните их в разделе [Опросы](../proposal_types/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5890626db6dcbb68:
    english: "## Start a proposal or poll"
    translation: "## Как начать предложение или опрос"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4b5338cae269fd32:
    english: "### Choose whether to use a discussion"
    translation: "### Решите, нужно ли обсуждение"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c45fe8ff31f71486:
    english: Start the proposal or poll inside a discussion when people need context, questions, or conversation before responding. A discussion can contain several proposals over time, keeping amendments and the eventual outcome together as one record of the topic.
    translation: Начните предложение или опрос внутри обсуждения, если перед ответом участникам нужны контекст, возможность задать вопросы или обсудить тему. Со временем в одном обсуждении можно провести несколько предложений. Так поправки и итоговое решение останутся вместе в истории темы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0bb2a90f8f9dad0c:
    english: Run a standalone poll when the discussion has already happened elsewhere, such as at a meeting, or when the question is simple and you only need to collect responses. Include enough detail or a link to the relevant record so voters understand what they are responding to.
    translation: Проведите отдельный опрос, если обсуждение уже состоялось в другом месте, например на встрече, или если вопрос прост и нужно только собрать ответы. Добавьте достаточно подробностей или ссылку на соответствующую запись, чтобы участники понимали, на что отвечают.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7d50445f0c54190d:
    english: "### In a discussion"
    translation: "### В обсуждении"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  05e03f7ee0e1b4dc:
    english: Open the discussion, scroll to the reply area, select **Start a vote**, and choose a template.
    translation: Откройте обсуждение, прокрутите страницу до поля ответа, нажмите **Начать голосование** и выберите шаблон.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  55dc0481a5c4ecb6:
    english: "### Without a discussion"
    translation: "### Без обсуждения"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  af5fd115de5f7aec:
    english: Open the **Polls** tab on the group page, select **New poll**, and choose a template.
    translation: На странице группы откройте вкладку **Опросы**, нажмите **Новый опрос** и выберите шаблон.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  23479ea263004d4a:
    english: If you create a discussion and poll at the same time only to run a vote, avoid notifying people twice. Start the discussion without notifying them and use the poll invitation, or run the poll without a discussion.
    translation: Если вы создаёте обсуждение и опрос одновременно только ради голосования, не отправляйте участникам два уведомления. Начните обсуждение без уведомления и пригласите их через опрос либо проведите опрос без обсуждения.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  31f857d230319a3c:
    english: "## What happens next"
    translation: "## Что происходит дальше"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb709a76dfeabd4f:
    english: When starting a proposal or poll, you provide a title and details, review its response options and settings, set a closing time, and invite participants. While it is open, participants can vote, explain their response, and change their vote. Results update as votes are submitted, subject to the poll's result-visibility setting.
    translation: При создании предложения или опроса укажите название и подробности, проверьте варианты ответов и настройки, задайте время закрытия и пригласите участников. Пока голосование открыто, участники могут проголосовать, пояснить свой ответ и изменить голос. Результаты обновляются по мере поступления голосов с учётом настройки их видимости.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  acd2e813b56034a0:
    english: When it closes, publish an [outcome](../outcomes/) that records what the result means and what will happen next.
    translation: 'После закрытия опубликуйте [итоговое решение](../outcomes/): поясните, что означают результаты и что произойдёт дальше.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
