  3a65b66c581936a1:
    english: "# Notifications"
    translation: "# Ilmoitukset"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c343eb5a1db968d8:
    english: Notifications help groups maintain momentum by drawing your attention to discussions and decisions that need a response.
    translation: Ilmoitukset auttavat ryhmää viemään työtä eteenpäin kiinnittämällä huomiosi keskusteluihin ja päätöksiin, jotka odottavat vastaustasi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3d7b27f3b9880973:
    english: 'Notifications are often the starting point when you return to Loomio. They let you know when:'
    translation: 'Kun palaat Loomioon, aloitat usein ilmoituksista. Ne kertovat, kun:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c4aec8fcb9fbc0de:
    english: |-
      - someone mentions you or replies to something you wrote
      - a new discussion is shared with you
      - you are invited or reminded to vote
      - a poll is closing soon
      - an outcome is announced
    translation: |-
      - joku mainitsee sinut tai vastaa kirjoitukseesi
      - uusi keskustelu jaetaan kanssasi
      - sinut kutsutaan äänestämään tai sinua muistutetaan äänestämisestä
      - kysely sulkeutuu pian
      - tulos julkaistaan
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  792dcad0f81e8cc5:
    english: Loomio's notification settings let you choose how closely you want to follow each group or thread. Notifications remain available in Loomio, so you can review what needs your attention when you are ready.
    translation: Loomion ilmoitusasetuksissa voit valita, kuinka tarkasti seuraat kutakin ryhmää tai keskusteluketjua. Ilmoitukset pysyvät Loomiossa, joten voit käydä ne läpi silloin, kun sinulle sopii.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '082fae961275aaaf':
    english: "## Two ways to begin"
    translation: "## Kaksi tapaa aloittaa"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cbea008bb7c0ee02:
    english: 'Most people can start with one of two approaches:'
    translation: 'Voit aloittaa jommallakummalla näistä tavoista:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3349bdb53fc33195:
    english: |-
      - **When notified** — receive an email when someone asks for your attention, and include everything else in your daily catch-up. Start here if you are still learning how your group uses Loomio.
      - **Once per day** — set Email to **Catch-up only** and keep your catch-up set to **Every day**. Your notifications and other unread activity will be delivered together in one email.
    translation: |-
      - **Kun ilmoitetaan** — saat sähköpostia, kun joku pyytää huomiotasi. Muu toiminta sisältyy päivittäiseen kertaukseen. Tämä on hyvä lähtökohta, jos vasta opettelet, miten ryhmäsi käyttää Loomiota.
      - **Kerran päivässä** — valitse sähköpostille **Vain kertaus** ja pidä kertauksen aikatauluna **Joka päivä**. Saat ilmoitukset ja muun lukemattoman toiminnan yhdessä sähköpostissa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  74e84c4946aa3713:
    english: New accounts start with **When notified** and a daily catch-up. This brings mentions, replies, discussions shared with you, invitations and reminders to vote, polls closing soon, and outcomes to your attention as they happen without sending an immediate update about every comment or vote.
    translation: Uusilla tileillä on aluksi käytössä **Kun ilmoitetaan** ja päivittäinen kertaus. Saat ilmoituksen heti, kun sinut mainitaan, kirjoitukseesi vastataan, keskustelu jaetaan kanssasi, sinut kutsutaan äänestämään tai sinua muistutetaan siitä, kysely sulkeutuu pian tai tulos julkaistaan. Jokaisesta kommentista tai äänestä ei lähetetä heti sähköpostia.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  896722cbb87e98be:
    english: If you would rather receive your Loomio notifications all at once, move to the once-per-day approach. You can change this later as your pattern of work changes.
    translation: Jos haluat saada Loomion ilmoitukset yhdellä kertaa, siirry kerran päivässä lähetettävään kertaukseen. Voit muuttaa asetusta myöhemmin, jos työtapasi muuttuvat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e2c60724226ad68a:
    english: For a group or thread that you want to follow more closely, choose **All activity** to receive every update as it happens.
    translation: Jos haluat seurata jotakin ryhmää tai keskusteluketjua tarkemmin, valitse **Kaikki toiminta**. Saat jokaisen päivityksen heti.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  91fd24c60a6a84ee:
    english: These defaults apply when you join a group. Threads initially inherit the settings of their group, but you can follow an important thread more closely or reduce its notifications without changing the rest of the group.
    translation: Nämä oletusasetukset tulevat voimaan, kun liityt ryhmään. Keskusteluketjut perivät aluksi ryhmänsä asetukset. Voit kuitenkin seurata tärkeää keskusteluketjua tarkemmin tai vähentää sen ilmoituksia muuttamatta muun ryhmän asetuksia.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a75df26cfc4e6614:
    english: "## Notifications in Loomio"
    translation: "## Ilmoitukset Loomiossa"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9286edc0ac459625:
    english: The bell icon in the top-right is where notifications are accessed within the app; a number shows how many notifications you have yet to read.
    translation: Sovelluksen oikeassa yläkulmassa olevasta kellokuvakkeesta pääset ilmoituksiisi. Numero näyttää, kuinka monta lukematonta ilmoitusta sinulla on.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bfacf52b815e1252:
    english: Select a notification to open the related discussion or poll.
    translation: Avaa ilmoitukseen liittyvä keskustelu tai kysely valitsemalla ilmoitus.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b7ed6a5c5c661d60:
    english: "## Catch-up"
    translation: "## Kertaus"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fc61461d684c5b47:
    english: The catch-up provides a regular overview of activity without requiring you to follow each group throughout the day.
    translation: Kertaus antaa säännöllisen yleiskuvan toiminnasta, joten sinun ei tarvitse seurata jokaista ryhmää päivän mittaan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9e519b17a3847cee:
    english: It shows your unseen notifications first, followed by unread discussions and standalone polls grouped by group. Notifications provide linked summaries of activity that needs your attention, while the unread section includes the discussion, poll, comment, vote, and edit details. Direct discussions and threads you have joined as a guest are included when they contain unread activity.
    translation: Kertauksessa näkyvät ensin ilmoitukset, joita et ole vielä nähnyt. Niiden jälkeen tulevat lukemattomat keskustelut ja erilliset kyselyt ryhmittäin. Ilmoitukset sisältävät linkitettyjä yhteenvetoja huomiotasi vaativasta toiminnasta. Lukemattomien osiossa näkyvät keskustelujen, kyselyjen, kommenttien, äänten ja muokkausten tiedot. Mukana ovat myös suorat keskustelut ja keskusteluketjut, joihin olet liittynyt vieraana, jos niissä on lukematonta toimintaa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  00703333f277e3c0:
    english: You can turn on **Follow updates** on an open Group that you have not joined. Unread discussions and polls from that Group are then included in your catch-up at your existing schedule. Reading the threads or marking the catch-up as read updates their read status in the same way as threads from Groups you belong to. Turn off **Follow updates** on the Group page to stop including them.
    translation: Voit ottaa **Seuraa päivityksiä** -asetuksen käyttöön avoimessa ryhmässä, johon et ole liittynyt. Ryhmän lukemattomat keskustelut ja kyselyt sisältyvät silloin kertaukseesi nykyisen aikataulusi mukaan. Keskusteluketjujen lukeminen tai kertauksen merkitseminen luetuksi päivittää niiden lukutilan samalla tavalla kuin niiden ryhmien keskusteluketjuissa, joihin kuulut. Poista **Seuraa päivityksiä** käytöstä ryhmän sivulla, jos et enää halua niitä kertaukseesi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fcac102a70f7ee7f:
    english: Loomio does not send a catch-up when there are no unseen notifications or unread threads from the relevant period.
    translation: Loomio ei lähetä kertausta, jos kyseiseltä ajalta ei ole ilmoituksia, joita et ole nähnyt, eikä lukemattomia keskusteluketjuja.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  888011209ac583be:
    english: "![A catch-up with unseen notifications and unread thread activity from one group](digest_email_example.png)"
    translation: "![Kertaus, jossa näkyy ilmoituksia ja yhden ryhmän keskusteluketjujen lukematonta toimintaa](digest_email_example.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7d80cf08a383f6bd:
    english: "### Choose your catch-up schedule"
    translation: "### Valitse kertauksen aikataulu"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  677863d68136156b:
    english: Open **Notification settings** from your user menu to choose how often you receive a catch-up.
    translation: Avaa käyttäjävalikosta **Ilmoitusasetukset** ja valitse, kuinka usein saat kertauksen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7c0dece94210f807:
    english: The **Unsubscribe** link in a catch-up email opens a catch-up schedule form. The email link authorizes that form, so you can change or stop catch-up emails without signing in. The full **Notification settings** page in Loomio remains available when you sign in.
    translation: Kertaussähköpostin **Lopeta tilaus** -linkki avaa kertauksen aikataululomakkeen. Sähköpostin linkki antaa oikeuden käyttää lomaketta, joten voit muuttaa kertaussähköpostien aikataulua tai lopettaa niiden lähettämisen kirjautumatta sisään. Kun kirjaudut Loomioon, käytettävissäsi on koko **Ilmoitusasetukset**-sivu.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  da5740fd6dbd5737:
    english: "![Notification settings in the user menu](sidebar_notification_settings.png)"
    translation: "![Ilmoitusasetukset käyttäjävalikossa](sidebar_notification_settings.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  58af77d870a877e2:
    english: 'New accounts start with a daily catch-up. The available schedules are:'
    translation: 'Uudet tilit saavat aluksi päivittäisen kertauksen. Voit valita seuraavista aikatauluista:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b0fe04b2b5284253:
    english: |-
      - **Never** to turn off the catch-up
      - **Every day** for activity from approximately the previous 24 hours
      - **Every second day** for activity from approximately the previous two days
      - a weekday to receive a weekly catch-up on that day
    translation: |-
      - **Ei koskaan**, jos haluat lopettaa kertauksen lähettämisen
      - **Joka päivä**, jos haluat yhteenvedon suunnilleen edellisen 24 tunnin toiminnasta
      - **Joka toinen päivä**, jos haluat yhteenvedon suunnilleen kahden edellisen päivän toiminnasta
      - viikonpäivä, jos haluat viikoittaisen kertauksen kyseisenä päivänä
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a23935f518dd15cb:
    english: The catch-up is sent in the morning according to the time zone in your Loomio profile.
    translation: Kertaus lähetetään aamulla Loomio-profiilisi aikavyöhykkeen mukaan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b214c0634763fb51:
    english: "![Catch-up schedule setting](digest_email_setting.png)"
    translation: "![Kertauksen aikatauluasetus](digest_email_setting.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  efbcecfe827438a5:
    english: "### Mark a catch-up as read"
    translation: "### Merkitse kertaus luetuksi"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2b764b73f48d3185:
    english: Select **Mark catch-up as read** to mark its notifications and topic activity as read in Loomio. Opening or previewing the catch-up does not mark anything as read.
    translation: Valitse **Merkitse kertaus luetuksi**, jos haluat merkitä sen ilmoitukset ja aiheiden toiminnan luetuiksi Loomiossa. Kertauksen avaaminen tai esikatselu ei merkitse mitään luetuksi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  81ffa4a869f82451:
    english: A catch-up is not specific to one discussion, so do not reply to it. Open a discussion or poll from the catch-up before commenting or replying.
    translation: Kertaus ei koske vain yhtä keskustelua, joten älä vastaa siihen. Avaa keskustelu tai kysely kertauksesta ennen kuin kommentoit tai vastaat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f7dfee93901e5eea:
    english: "## Group and thread notification settings"
    translation: "## Ryhmien ja keskusteluketjujen ilmoitusasetukset"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  31be594005b6bcfc:
    english: You can choose how closely to follow each group and thread. These settings belong to you; group administrators cannot change them.
    translation: Voit valita, kuinka tarkasti seuraat kutakin ryhmää ja keskusteluketjua. Nämä ovat omia asetuksiasi, eivätkä ryhmän ylläpitäjät voi muuttaa niitä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6c9a762b18c9f92d:
    english: Change your defaults for groups you join from **Notification settings** in your user menu. You can then override the default for a particular group or thread. A thread override changes only that thread and does not affect the rest of its group.
    translation: Muuta niiden ryhmien oletusasetuksia, joihin liityt, avaamalla käyttäjävalikosta **Ilmoitusasetukset**. Voit sen jälkeen valita yksittäiselle ryhmälle tai keskusteluketjulle eri asetuksen. Keskusteluketjun oma asetus koskee vain sitä eikä vaikuta ryhmän muihin keskusteluketjuihin.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f4b6aa6eab1beb2b:
    english: "### Group notification settings"
    translation: "### Ryhmän ilmoitusasetukset"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  977289761daba9db:
    english: 'To change the notification setting for a group:'
    translation: 'Muuta ryhmän ilmoitusasetusta näin:'
    status: machine
