    english: Make a decision with the advice of people impacted or who have expertise, so you can make a better decision for your organization.
    translation: Pyydä neuvoja ihmisiltä, joihin päätös vaikuttaa, sekä asiaa tuntevilta ihmisiltä. Näin voit tehdä paremman päätöksen organisaatiosi kannalta.
