  0431c9fc46658338:
    english: 'The group participation report gives insights into the usage of your Loomio group. '
    translation: Der Teilnahmebericht zeigt dir, wie deine Loomio-Gruppe genutzt wird.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0d23c0831f1ea6ca:
    english: 'You''re able to choose which groups to include in the report, the start and end date for the report, and the interval (year, month, week or day) for grouping results. '
    translation: Du kannst auswählen, welche Gruppen im Bericht enthalten sind, den Beginn und das Ende des Berichtszeitraums festlegen und die Ergebnisse nach Jahr, Monat, Woche oder Tag gruppieren.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  73c9822c08a37866:
    english: The report is available to everyone in your group, however users can only see results for groups that they belong to, this means that different users may see slightly different reports.
    translation: Alle in deiner Gruppe können den Bericht aufrufen. Sie sehen jedoch nur Ergebnisse für Gruppen, denen sie angehören. Deshalb kann der Bericht für verschiedene Personen etwas anders aussehen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c9402b4720639f86:
    english: 'You can find the report by clicking the group settings menu cog, as shown below. '
    translation: Du findest den Bericht über das Zahnrad für die Gruppeneinstellungen, wie unten gezeigt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
