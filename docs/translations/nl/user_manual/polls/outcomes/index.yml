  7478a826673bce70:
    english: When your proposal or poll closes, you’ll be prompted to enter an **outcome**.
    translation: Wanneer je voorstel of peiling sluit, wordt je gevraagd een **conclusie** in te voeren.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ccaf1bc50a4f4734:
    english: State the results of the proposal or poll and say what will happen next.
    translation: Beschrijf de resultaten van het voorstel of de peiling en geef aan wat er daarna gebeurt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fde482f3a84e26e6:
    english: The outcome statement is an important record of the poll or decision - a succinct statement for future reference.
    translation: De conclusie legt de peiling of beslissing vast in een korte tekst die je later kunt raadplegen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9f4a341103cf4286:
    english: "## Outcome statements for common decision processes"
    translation: "## Conclusies bij veelgebruikte besluitvormingsprocessen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  457a047ee6ae5975:
    english: |-
      | **Decision process** | **When the decision is made** | **Outcome** |
      |---|---|---|
      | Advice process | When advice has been received and taken into account. | State the decision made and thank people for their advice and feedback. |
      | Consent process | When there are no remaining objections. | State that no valid objections remain and there is consent that the proposal is 'safe to try'.  |
      | Consensus process | When most* people agree. | State proposal results and the decision made. |
    translation: |-
      | **Besluitvormingsproces** | **Wanneer de beslissing wordt genomen** | **Conclusie** |
      |---|---|---|
      | Adviesproces | Wanneer het advies is ontvangen en meegewogen. | Beschrijf de beslissing en bedank mensen voor hun advies en feedback. |
      | Consentproces | Wanneer er geen bezwaren meer zijn. | Geef aan dat er geen geldige bezwaren meer zijn en dat er consent is om het voorstel te proberen. |
      | Consensusproces | Wanneer de meeste* mensen het eens zijn. | Beschrijf de resultaten van het voorstel en de genomen beslissing. |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f8adf692b7b22c59:
    english: "**The majority or supermajority as governed by constitution or by prior agreement within your organization.*  "
    translation: "**De meerderheid of gekwalificeerde meerderheid zoals vastgelegd in de statuten of vooraf afgesproken binnen jouw organisatie.*"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  278c243b460bef68:
    english: 'Whatever the results, there is always something to learn from the proposal and poll. '
    translation: Wat de resultaten ook zijn, van een voorstel of peiling valt altijd iets te leren.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e694b60515143fcb:
    english: If your proposal fails, consider what new understanding has been gained, and if this can be accommodated to reach a better decision.
    translation: Als je voorstel niet wordt aangenomen, kijk dan wat je hebt geleerd en of je daarmee tot een betere beslissing kunt komen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  780a97e6dd058d5d:
    english: 'The outcome statement is an opportunity to state the results and what has been learnt.  '
    translation: In de conclusie kun je de resultaten en de geleerde lessen vastleggen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ca65851b5da70691:
    english: You can notify people - they will receive an email from Loomio containing the poll results and your outcome statement.
    translation: Je kunt mensen op de hoogte stellen. Ze ontvangen dan een e-mail van Loomio met de resultaten van de peiling en jouw conclusie.
    status: machine
