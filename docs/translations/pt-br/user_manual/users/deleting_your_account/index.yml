  941f0addde6f7326:
    english: "## What does delete account mean?"
    translation: "## O que acontece quando você apaga sua conta?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dab05d98ad64604f:
    english: |-
      When you delete your account:
      - Your user account including your name, email address and other personally identifying data will be deleted from our systems. You will not be able to sign in to Loomio with this account.
      - Comments, proposal and discussions you have made will remain but your name will be removed from them. We do this because we have an obligation to groups to keep threads and proposals coherent.
      - You will no longer be listed as a member of any groups.
      - You will no longer receive notification emails.
    translation: |-
      Quando você apaga sua conta:
      - Sua conta de usuário, incluindo seu nome, endereço de e-mail e outros dados que identificam você, é apagada dos nossos sistemas. Você não poderá mais entrar no Loomio com essa conta.
      - Os comentários, as propostas e as discussões que você criou permanecem, mas seu nome é removido deles. Isso preserva a continuidade das conversas e propostas dos grupos.
      - Você deixa de constar como membro de qualquer grupo.
      - Você deixa de receber e-mails de notificação.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dbeaf194bb8bd9e8:
    english: It is important to understand that copies of the data you have generated on Loomio have likely been emailed to everyone in the group - Loomio has no ability to delete those.
    translation: É provável que cópias dos dados que você gerou no Loomio tenham sido enviadas por e-mail a todos os membros do grupo. O Loomio não pode apagar essas cópias.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fa98dfeef486cf05:
    english: Deleting your account will _not_ cancel your subscription; to stop your payments see [Subscriptions](/en/policy/subscriptions/management#cancel-your-plan).
    translation: Apagar sua conta _não_ cancela sua assinatura. Para interromper os pagamentos, consulte [Assinaturas](/en/policy/subscriptions/management#cancel-your-plan).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c1ceda8f829133c7:
    english: Loomio has made fundamental decisions about its ownership, business model and software to protect users' rights. Loomio is an independent, worker-owned cooperative, the software is open source, you can [export your data](/en/user_manual/groups/data_export), and Loomio never sells your data or uses it for advertising. These commitments are set out in our [privacy policy](/en/policy/privacy) and grounded in the purpose and values in our [constitution](https://www.loomio.coop/constitution.html) and [cooperative handbook](https://www.loomio.coop/purpose_and_vision.html). If you have any questions, [contact us](/contact).
    translation: O Loomio tomou decisões sobre sua propriedade, seu modelo de negócios e seu software para proteger os direitos dos usuários. O Loomio é uma cooperativa independente de propriedade de seus trabalhadores. O software é de código aberto, você pode [exportar seus dados](/en/user_manual/groups/data_export), e o Loomio nunca vende seus dados nem os usa para publicidade. Esses compromissos constam da nossa [política de privacidade](/en/policy/privacy) e se baseiam no propósito e nos valores descritos no nosso [estatuto](https://www.loomio.coop/constitution.html) e [manual da cooperativa](https://www.loomio.coop/purpose_and_vision.html). Se tiver alguma dúvida, [entre em contato](/contact).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d8cc22d615b8f5d9:
