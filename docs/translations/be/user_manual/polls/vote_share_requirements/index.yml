  54368e42ed93ae0c:
    english: "# Vote share requirements"
    translation: "# Патрабаванні да долі галасоў"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2051086558658db2:
    english: Set a vote share requirement on an option when a proposal must receive a particular percentage of support, or remain below a particular percentage of opposition, to pass.
    translation: Задайце патрабаванне да долі галасоў для варыянта, калі для прыняцця прапановы патрэбны пэўны працэнт падтрымкі або працэнт нязгоды не павінен перавышаць пэўную мяжу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f00d3806d6b890ae:
    english: Vote share requirements can be combined with a [quorum](/en/user_manual/polls/quorum/) to require both sufficient participation and a particular distribution of votes.
    translation: Патрабаванні да долі галасоў можна спалучаць з [кворумам](/en/user_manual/polls/quorum/), каб вызначыць і мінімальную колькасць удзельнікаў галасавання, і патрэбнае размеркаванне галасоў.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0fc0acd12134f67e:
    english: When creating a proposal, select the edit icon beside an option.
    translation: Падчас стварэння прапановы націсніце значок рэдагавання побач з варыянтам.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  27979c31066e397f:
    english: "![The edit icon beside the Consent option](edit-highlight-on-option.png)"
    translation: "![Значок рэдагавання побач з варыянтам «Згода»](edit-highlight-on-option.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b3a4dee73762bea4:
    english: "## Eligible voters and votes cast"
    translation: "## Выбаршчыкі, якія маюць права голасу, і аддадзеныя галасы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1d04d75fa16a2a18:
    english: The percentage can be based on either **Votes cast** or **Eligible voters**.
    translation: Працэнт можна разлічваць на аснове **Аддадзеныя галасы** або **Выбаршчыкі, якія маюць права голасу**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  590e1a316f9ad174:
    english: "![Choosing whether a vote share requirement uses votes cast or eligible voters](./eligible-vs-cast.png)"
    translation: "![Выбар асновы для разліку долі галасоў: аддадзеныя галасы або выбаршчыкі, якія маюць права голасу](./eligible-vs-cast.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d4c72d50982e071d:
    english: "**Eligible voters** means everyone who is able to vote in the proposal. **Votes cast** means only the votes that have been submitted."
    translation: "**Выбаршчыкі, якія маюць права голасу** — усе, хто можа галасаваць па прапанове. **Аддадзеныя галасы** — толькі галасы, якія ўжо былі пададзены."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  24945a1a4f0d08e3:
    english: A requirement of 75 percent agreement from eligible voters can pass only when at least 75 percent of all eligible voters vote for that option.
    translation: Каб выканаць патрабаванне падтрымкі ў 75 працэнтаў ад выбаршчыкаў, якія маюць права голасу, за гэты варыянт павінны прагаласаваць не менш за 75 працэнтаў усіх такіх выбаршчыкаў.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  14e4ff7cd000c7af:
    english: A requirement of 60 percent agreement from votes cast can pass when 60 percent of submitted votes support the option, regardless of overall turnout. Add a quorum when your process also requires a minimum level of participation.
    translation: Каб выканаць патрабаванне падтрымкі ў 60 працэнтаў ад аддадзеных галасоў, дастаткова, каб гэты варыянт падтрымалі 60 працэнтаў тых, хто прагаласаваў. Агульная яўка пры гэтым не ўлічваецца. Калі патрэбны таксама мінімальны ўзровень удзелу, дадайце кворум.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a8f235434b40ecd9:
    english: "## Different vote share requirements"
    translation: "## Розныя патрабаванні да долі галасоў"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6682c9656815bdbc:
    english: 'A proposal can have requirements on more than one option. For example:'
    translation: 'У прапанове можна задаць патрабаванні для некалькіх варыянтаў. Напрыклад:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dac1980305bef52d:
    english: |-
      - Agreement must be at least 75 percent of eligible voters
      - Abstention must be no more than 30 percent of votes cast
      - Block must be no more than 0 percent of votes cast
    translation: |-
      - Згоду павінны выказаць не менш за 75 працэнтаў выбаршчыкаў, якія маюць права голасу
      - Доля галасоў за ўстрыманне не павінна перавышаць 30 працэнтаў ад аддадзеных галасоў
      - Доля галасоў за блакіроўку не павінна перавышаць 0 працэнтаў ад аддадзеных галасоў
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  11325e607f603eb7:
    english: You can also add requirements to a [poll template](/en/user_manual/polls/poll_templates/) so that new proposals created from the template use them by default.
    translation: Патрабаванні можна таксама дадаць у [шаблон апытання](/en/user_manual/polls/poll_templates/). Тады яны будуць аўтаматычна прымяняцца да новых прапаноў, створаных з гэтага шаблону.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d6bffbdadc45e7f5:
    english: "## Detailed example"
    translation: "## Падрабязны прыклад"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4318dab03fe217ad:
    english: Oatmilk Cooperative is deciding whether to approve the budget for its six-week returnable bottle trial. Five people are eligible to vote.
    translation: Кааператыў Oatmilk вырашае, ці зацвердзіць бюджэт шасцітыднёвага выпрабавання зваротных бутэлек. Права голасу маюць пяць чалавек.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8f5779f2f1bb9ec3:
    english: Jamie uses the **Consent** proposal template, edits the Consent option, and enables its vote share requirement.
    translation: Джэймі выкарыстоўвае шаблон прапановы **Згода**, рэдагуе варыянт «Згода» і ўключае патрабаванне да долі галасоў для гэтага варыянта.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  842038ffbd273e57:
    english: The cooperative's process requires at least 75 percent of eligible voters to support the proposal. Jamie sets the requirement to **At least 75% of Eligible voters**.
    translation: Паводле правіл кааператыва, прапанову павінны падтрымаць не менш за 75 працэнтаў выбаршчыкаў, якія маюць права голасу. Джэймі задае патрабаванне **Не менш за 75% ад выбаршчыкаў, якія маюць права голасу**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5b852b2e7a9b3034:
    english: "![The Consent option requiring at least 75 percent of eligible voters](./consent-vote-option.png)"
    translation: "![Для варыянта «Згода» патрэбна падтрымка не менш як 75 працэнтаў выбаршчыкаў, якія маюць права голасу](./consent-vote-option.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8a42a135c0c11c98:
    english: Jamie also sets a 60 percent quorum. Jamie and Samira vote in agreement. All submitted votes support the proposal, but they represent only 40 percent of eligible voters, so neither requirement has been reached.
    translation: Джэймі таксама задае кворум у 60 працэнтаў. Джэймі і Саміра галасуюць за згоду. Усе аддадзеныя галасы падтрымліваюць прапанову, але іх падалі толькі 40 працэнтаў выбаршчыкаў, якія маюць права голасу. Таму ніводнае з патрабаванняў пакуль не выканана.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2284440b974635e3:
    english: "![Two of five people have voted in agreement and neither requirement is reached](./first-vote-breakdown.png)"
    translation: "![Двое з пяці чалавек прагаласавалі за згоду, але ніводнае патрабаванне не выканана](./first-vote-breakdown.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2cb3890f4ef20320:
    english: Alex and Morgan then agree, while Taylor disagrees. All five people have voted, reaching the quorum, and four of five eligible voters agree. The 80 percent agreement exceeds the 75 percent vote share requirement, so both requirements show green check marks.
    translation: Потым Алекс і Морган галасуюць за згоду, а Тэйлар — супраць. Прагаласавалі ўсе пяць чалавек, таму кворум дасягнуты. Прапанову падтрымліваюць чацвёра з пяці выбаршчыкаў, якія маюць права голасу. Доля падтрымкі ў 80 працэнтаў перавышае патрабаваныя 75 працэнтаў, таму каля абодвух патрабаванняў з'яўляюцца зялёныя птушкі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6b09cbe2063c0a6a:
    english: "![All five people have voted and both requirements are reached](./final-vote-breakdown.png)"
    translation: "![Усе пяць чалавек прагаласавалі, і абодва патрабаванні выкананы](./final-vote-breakdown.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
