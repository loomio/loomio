navigation_title: Rang
blocks:
  92702560a3786c85:
    english: "# Rank"
    translation: "# Rang"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7cf7aa3423ff6b9d:
    english: Rank finds the group's overall order of preference. Participants arrange options from most to least preferred, and Loomio assigns more points to higher-ranked options.
    translation: Mit Rang ermittelt die Gruppe eine gemeinsame Reihenfolge ihrer Präferenzen. Die Teilnehmenden ordnen die Optionen von der bevorzugten bis zur am wenigsten bevorzugten. Loomio vergibt für höher platzierte Optionen mehr Punkte.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72790fdf21d1f129:
    english: "## When to use Rank"
    translation: "## Wann du Rang verwenden kannst"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f9ce50752bf1c1e7:
    english: 'Use Rank when preference order matters and you want one overall ordering. It works well for:'
    translation: 'Verwende Rang, wenn die Reihenfolge der Präferenzen wichtig ist und du eine gemeinsame Rangfolge ermitteln möchtest. Das eignet sich zum Beispiel, um:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a5c8ee257df4dc2:
    english: |-
      - selecting one candidate for a position;
      - ordering projects for a work plan;
      - prioritizing conference topics;
      - choosing backup options as well as a first choice; or
      - reducing a long list to an ordered shortlist.
    translation: |-
      - eine Person für eine Position auszuwählen;
      - Projekte für einen Arbeitsplan zu ordnen;
      - Konferenzthemen zu priorisieren;
      - neben der ersten Wahl auch Alternativen festzulegen; oder
      - aus einer langen Liste eine geordnete Auswahlliste zu erstellen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2549ddaa8a4a4fa8:
    english: Rank uses a points-based ordering. It is not a proportional election method. To elect several people while representing different groups of voters, use an [STV Election](/en/user_manual/polls/stv/).
    translation: Rang ordnet die Optionen nach Punkten. Es ist kein proportionales Wahlverfahren. Wenn du mehrere Personen wählen und dabei verschiedene Gruppen von Wähler*innen vertreten möchtest, verwende eine [STV-Wahl](/en/user_manual/polls/stv/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2a859bf73143ce12:
    english: "## Example: rank bottle designs"
    translation: "## Beispiel: Flaschendesigns ordnen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  46a7d343d3b48bea:
    english: Oatmilk Cooperative asks members to rank four bottle designs for its returnable-bottle trial. Participants consider handling, durability, customer needs, storage, and compatibility with the washing equipment.
    translation: Die Hafermilch-Genossenschaft bittet ihre Mitglieder, vier Flaschendesigns für einen Test mit Mehrwegflaschen zu ordnen. Die Teilnehmenden berücksichtigen Handhabung, Haltbarkeit, Kundenbedürfnisse, Lagerung und die Eignung für die Waschanlage.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c74ebb16f872b3c6:
    english: "## Set up the poll"
    translation: "## Abstimmung einrichten"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5975d0fd35ec0a7c:
    english: State what the ranking will determine and add the options. Set **Number of choices** to control how many options each person may rank. A first choice receives the most points, the next choice receives one fewer, and unranked options receive no points.
    translation: Erkläre, was die Rangfolge bestimmen soll, und füge die Optionen hinzu. Mit **Anzahl der Auswahlmöglichkeiten** legst du fest, wie viele Optionen jede Person einordnen kann. Die erste Wahl erhält die meisten Punkte, die nächste einen Punkt weniger. Nicht eingeordnete Optionen erhalten keine Punkte.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  47f32c81e29fa3c6:
    english: Require all options to be ranked when you need a complete ordering. Allow fewer choices when participants may not know enough to rank everything. Showing options in random order can reduce the influence of their initial presentation.
    translation: Wenn du eine vollständige Reihenfolge brauchst, müssen alle Optionen eingeordnet werden. Erlaube weniger Auswahlmöglichkeiten, wenn Teilnehmende möglicherweise nicht genug wissen, um alle Optionen einzuordnen. Eine zufällige Reihenfolge der Optionen kann den Einfluss ihrer anfänglichen Darstellung verringern.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Abstimmen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  53946361c36775f0:
    english: Participants drag the options into their preferred order, with number 1 as the first choice. They can add a reason explaining the criteria behind their ranking.
    translation: Die Teilnehmenden ziehen die Optionen in ihre bevorzugte Reihenfolge. Nummer 1 ist ihre erste Wahl. Sie können eine Begründung hinzufügen und erklären, nach welchen Kriterien sie die Optionen geordnet haben.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eae63303cb9dced6:
    english: In this example, the voter puts the **500 ml amber bottle** first and the **500 ml clear bottle** second because both fit the existing cafe storage and washing equipment.
    translation: In diesem Beispiel setzt die abstimmende Person die **500-ml-Braunglasflasche** auf Platz eins und die **500-ml-Klarglasflasche** auf Platz zwei, weil beide in die vorhandenen Lagerflächen des Cafés und in die Waschanlage passen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Ergebnisse lesen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6be27268f870dc3e:
    english: 'The results combine all ballots into an overall points-based ranking. For each option they show:'
    translation: 'Die Ergebnisse fassen alle Stimmzettel zu einer Rangfolge nach Punkten zusammen. Für jede Option zeigen sie:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  88b912ae1b9787bc:
    english: |-
      - **Rank**: its position in the combined result;
      - **% of points**: its share of all ranking points;
      - **Points**: the total points from all ballots;
      - **Mean**: its average points per voter; and
      - **Voters**: how many people ranked it.
    translation: |-
      - **Rang**: ihre Position im Gesamtergebnis;
      - **% der Punkte**: ihren Anteil an allen vergebenen Punkten;
      - **Punkte**: die Gesamtzahl ihrer Punkte aus allen Stimmzetteln;
      - **Bedeuten**: ihre durchschnittliche Punktzahl pro abstimmender Person; und
      - **Wähler*innen**: wie viele Personen sie eingeordnet haben.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2e0cda6f79f31a51:
    english: In this example, the **500 ml amber bottle** ranks first, followed by the **500 ml clear bottle** and the **750 ml amber bottle**. The group can investigate the preferred design first while retaining the remaining order as a sequence of alternatives.
    translation: In diesem Beispiel liegt die **500-ml-Braunglasflasche** auf Platz eins, gefolgt von der **500-ml-Klarglasflasche** und der **750-ml-Braunglasflasche**. Die Gruppe kann zuerst das bevorzugte Design genauer prüfen und die übrige Reihenfolge als Liste von Alternativen nutzen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  22df687a6fa02ddb:
    english: A points-based result can conceal different preference patterns that produce the same total. Review individual ballots and vote reasons when options are close or the decision is consequential.
    translation: Dieselbe Gesamtpunktzahl kann aus unterschiedlichen Präferenzen entstehen. Sieh dir die einzelnen Stimmzettel und Begründungen an, wenn Optionen nah beieinanderliegen oder die Entscheidung weitreichende Folgen hat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
