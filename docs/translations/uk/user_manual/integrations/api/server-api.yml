    translated_on: '2026-09-30'
  ce9efb629e50628c:
    english: "## Delete User"
    translation: "## Видалення користувача"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a37f91309a44b472:
    english: Delete removes the user and records the user created. Comments are removed from threads, votes are removed from polls, and groups, discussions, polls, and other records created by the user may also be deleted through database associations.
    translation: Видалення прибирає користувача та створені ним записи. Коментарі видаляються з тем, голоси — з опитувань. Групи, обговорення, опитування та інші створені користувачем записи також можуть бути видалені через зв’язки в базі даних.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  537bd891e445eb93:
    english: This is very destructive. Redaction is highly recommended instead.
    translation: Це призводить до значної втрати даних. Натомість наполегливо рекомендуємо знеособити користувача.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5a8f0f08bf2e3748:
    english: "`DELETE /api/b3/users/:id`"
    translation: "`DELETE /api/b3/users/:id`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
