  9cfb3b7835dc5cb0:
    english: If some members of your group should have voting rights while others should not, you can use the "Make delegate" feature to identify those people with voting rights. There is a corresponding "Revoke delegate" action too.
    translation: Wenn einige Mitglieder deiner Gruppe Stimmrecht haben sollen und andere nicht, kannst du sie mit „Delegieren“ als Delegierte mit Stimmrecht festlegen. Mit „Delegierten widerrufen“ kannst du das Stimmrecht wieder entziehen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e017eafb51368777:
    english: Use delegates when people should share the same discussion space but only a defined set, such as directors or elected representatives, may vote. This is usually simpler than maintaining a second subgroup whose only purpose is to separate voters from non-voters.
    translation: Nutze Delegierte, wenn alle denselben Raum für Diskussionen haben sollen, aber nur eine bestimmte Gruppe abstimmen darf, etwa Vorstandsmitglieder oder gewählte Vertretungen. Das ist meist einfacher, als eine zweite Untergruppe nur zur Trennung von Stimmberechtigten und anderen Mitgliedern zu verwalten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1942a47ae47ca813:
    english: Use a private subgroup instead when its members also need discussions, files, or membership information that other members must not see.
    translation: Nutze stattdessen eine private Untergruppe, wenn ihre Mitglieder auch Diskussionen, Dateien oder Informationen zur Mitgliedschaft benötigen, die andere Mitglieder nicht sehen dürfen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
