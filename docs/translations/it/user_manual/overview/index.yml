  73449e09f559b4bd:
    english: Loomio is a discussion and decision making tool for collaborative organizations.
    translation: Loomio è uno strumento di discussione e di decisione per le organizzazioni che collaborano.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c6d663f00c64f35d:
    english: It enables you to bring people together to discuss topics, explore proposals and make decisions.
    translation: Ti permette di riunire le persone per discutere, esaminare proposte e prendere decisioni.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
