    translated_on: '2026-09-29'
  74caca2261c15283:
    english: 'Loomio has three main parts: groups, discussions, and polls.'
    translation: 'Loomio besteht aus drei Hauptbereichen: Gruppen, Diskussionen und Abstimmungen.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5f0a46926a0f7350:
    english: "### Groups"
    translation: "### Gruppen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2060a64d0fabc6d7:
    english: A group is a place for an organization, team, or community to work together. Its home page explains the group's purpose and provides access to its discussions, polls, members, and files.
    translation: In einer Gruppe können Organisationen, Teams oder Gemeinschaften zusammenarbeiten. Die Startseite beschreibt den Zweck der Gruppe und bietet Zugang zu ihren Diskussionen, Abstimmungen, Mitgliedern und Dateien.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  311793a17709182c:
    english: "### Discussions"
    translation: "### Diskussionen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  05ecdffe6c18a1df:
    english: Discussions keep the information and conversation about a topic together. People can share context, comment, reply, react, and use polls to move the discussion towards an outcome.
    translation: Diskussionen bündeln Informationen und Gespräche zu einem Thema. Beteiligte können Hintergrundinformationen teilen, kommentieren, antworten, reagieren und mit Abstimmungen auf ein Fazit hinarbeiten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dc9a50d7f1f20c80:
    english: Over time, discussions create a searchable record of the information considered and the decisions made by your group.
    translation: Mit der Zeit entsteht in den Diskussionen eine durchsuchbare Dokumentation der Informationen, die deine Gruppe berücksichtigt hat, und ihrer Entscheidungen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3448194e8a2ce09d:
    english: "### Polls and proposals"
    translation: "### Abstimmungen und Vorschläge"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4ef7092f5f56e773:
    english: Polls help a group understand preferences, gather advice, and make decisions. Different poll templates support different processes. A proposal asks people to respond to a suggested course of action and explain the reason for their response.
    translation: Abstimmungen helfen einer Gruppe, Präferenzen zu erkennen, Rat einzuholen und Entscheidungen zu treffen. Verschiedene Abstimmungsvorlagen unterstützen unterschiedliche Abläufe. Bei einem Vorschlag können die Beteiligten auf eine vorgeschlagene Vorgehensweise antworten und ihre Antwort begründen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  51ab039bc7c374bd:
    english: Polls can be part of a discussion or run independently from the **Polls** tab on a group page.
    translation: Abstimmungen können Teil einer Diskussion sein oder unabhängig davon über den Tab **Abstimmungen** auf einer Gruppenseite gestartet werden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  47500e7125fdedbc:
    english: To learn where these parts appear in the interface, see the [Quick tour](/en/user_manual/overview/orientation). To start contributing, see [How to participate](/en/user_manual/overview/how-to-participate).
