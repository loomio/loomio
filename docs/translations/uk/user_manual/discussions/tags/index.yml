  7d3b350731e07a2c:
    english: Use short, familiar names that group members will recognize, such as Finance, Governance, Packaging, or Cafe partnerships.
    translation: Використовуйте короткі й знайомі учасникам групи назви, наприклад «Фінанси», «Управління», «Пакування» або «Партнерства з кафе».
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d7df1acb0ce347f5:
    english: "## Edit tags"
    translation: "## Редагування міток"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  67bc6cfdb2afad04:
    english: |-
      Only parent-group admins can rename, recolor, merge, or delete tags. These
      changes apply throughout the organization, including its subgroups.
    translation: |-
      Лише адміністратори батьківської групи можуть перейменовувати мітки, змінювати
      їхні кольори, об’єднувати або видаляти їх. Ці зміни діють в усій організації,
      зокрема в її підгрупах.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b4ca99a5204d8526:
    english: On the group page, open **Tags** and select **Edit tags**.
    translation: На сторінці групи відкрийте **Мітки** й виберіть **Редагувати мітки**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
