  435f52763f0d9a5b:
    english: To keep a record of a thread discussion and decisions in polls, use **[Print thread](/en/user_manual/groups/data_export#print-thread-to-pdf)** and print the file to pdf.  You can then store a published copy of the thread in your chosen document storage archive.
    translation: Para guardar um registro da discussão em um tópico e das decisões tomadas em enquetes, use **[Imprimir tópico](/en/user_manual/groups/data_export#print-thread-to-pdf)** e imprima o arquivo em PDF. Depois, você pode guardar uma cópia publicada do tópico no arquivo de documentos que escolher.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a6b96750c9e1e590:
    english: To keep a complete record of the data in your Loomio group, use **[Export group data](/en/user_manual/groups/data_export#group-data-backup-or-export)**.
    translation: Para guardar um registro completo dos dados do seu grupo no Loomio, use **[Exportar dados do grupo](/en/user_manual/groups/data_export#group-data-backup-or-export)**.
