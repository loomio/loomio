    translated_on: '2026-09-30'
  79ad157a95adc8ef:
    english: Subgroups help you organize your communications and members so that the right people are engaged in their work together.  For example, you can use a subgroup for a subcommittee or working group.
    translation: I sottogruppi ti aiutano a organizzare le comunicazioni e i membri, coinvolgendo le persone giuste nel lavoro comune. Per esempio, puoi creare un sottogruppo per un sottocomitato o un gruppo di lavoro.
