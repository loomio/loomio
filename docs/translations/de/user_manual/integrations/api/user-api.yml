      | `group_id` | Restrict results to one visible group |
      | `org_id` | Restrict results to a visible parent group and its visible subgroups. Use `0` for direct discussions |
      | `type` | Restrict results to one type: `Discussion`, `Comment`, `Poll`, `Stance`, or `Outcome` |
      | `types` | Comma-separated list of result types |
      | `tag` | Restrict results to topics with this tag |
      | `author_id` | Restrict results to content by one author. Without `query`, returns that author's recent visible activity |
      | `order` | Set to `authored_at_desc` to order matching content by authoring time |
    translation: |-
      | Name | Beschreibung |
      | --- | --- |
      | `query` | Suchtext. Exakte und ungefähre Treffer werden unterstützt |
      | `group_id` | Ergebnisse auf eine sichtbare Gruppe beschränken |
      | `org_id` | Ergebnisse auf eine sichtbare übergeordnete Gruppe und deren sichtbare Untergruppen beschränken. Verwende `0` für direkte Diskussionen |
      | `type` | Ergebnisse auf einen Typ beschränken: `Discussion`, `Comment`, `Poll`, `Stance` oder `Outcome` |
      | `types` | Durch Kommas getrennte Liste von Ergebnistypen |
      | `tag` | Ergebnisse auf Themen mit diesem Schlagwort beschränken |
      | `author_id` | Ergebnisse auf Inhalte einer Person beschränken. Ohne `query` wird die jüngste sichtbare Aktivität dieser Person zurückgegeben |
      | `order` | Auf `authored_at_desc` setzen, um passende Inhalte nach Erstellungszeitpunkt zu sortieren |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  00e046b622446633:
    english: The response contains a `search_results` array. Each result identifies the matched record and its visible context with fields including `searchable_type`, `searchable_id`, `highlight`, `group_id`, `group_name`, `discussion_key`, `poll_key`, `author_id`, `author_name`, `authored_at`, and `tags`. Fields that do not apply to a result are `null`.
    translation: Die Antwort enthält ein `search_results`-Array. Jedes Ergebnis kennzeichnet den gefundenen Datensatz und seinen sichtbaren Kontext. Dazu gehören die Felder `searchable_type`, `searchable_id`, `highlight`, `group_id`, `group_name`, `discussion_key`, `poll_key`, `author_id`, `author_name`, `authored_at` und `tags`. Felder, die für ein Ergebnis nicht gelten, haben den Wert `null`.
