  6772e16cee705fc1:
    english: 'Understand how much participation happens in your group over a given period of time. '
    translation: Nézd meg, mennyien vesznek részt a csoportod munkájában egy adott időszakban.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fe690a715f8a00b5:
    english: The report shows how many threads, comments, polls, votes and reactions have happened per month. This is graphed so you can see ebbs and flows of usage.
    translation: A jelentés megmutatja, hány szál, hozzászólás, szavazás, leadott szavazat és reakció volt havonta. A grafikonon láthatod, hogyan változott az aktivitás.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  21bf7cb257f4bb03:
    english: Click specific labels on the graph to remove them from view.
    translation: Kattints a grafikon jelmagyarázatának egyes címkéire, ha el szeretnéd rejteni őket.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  35ced3d9d51038aa:
