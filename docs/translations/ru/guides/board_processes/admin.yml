      - Остен Кордаско, Co-operative Assistance Network Limited (CAN), услуги поддержки бизнеса, Великобритания
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b8eb8dcae7d7a78b:
    english: Let's look at how to organize work, administer discussions, keep data safe and store records in Loomio.
    translation: Рассмотрим, как организовать работу, управлять обсуждениями, защищать данные и хранить документы в Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a27011d28c4f11a6:
    english: "## Administering discussions"
    translation: "## Управление обсуждениями"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8e67ece08e454475:
    english: There is a range of features in Loomio to help you administer discussions accessible from the drop down menu to the right of the discussion.
    translation: В Loomio есть несколько функций для управления обсуждениями. Они доступны в раскрывающемся меню справа от обсуждения.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2d5be8c39f22ec28:
    english: 'Keep the discussion list current by using:'
    translation: 'Поддерживайте список обсуждений в порядке с помощью этих действий:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  75739da1bd5910a6:
    english: |-
      - **Pin discussion** to keep important discussions at the top of the list
      - **Edit discussion** to change discussion title or update discussion context
      - **Move to group** when you want to move a discussion to another group or subgroup, or to an archive group.
      - **Lock thread** to prevent further comments or changes and remove the thread from the list of open threads. Locked threads are available under the discussion filter and from the search bar, and can be unlocked at any time.
      - **Delete discussion** when you do not want to keep a record of the discussion.  Note that deleted discussions can not be un-deleted.
    translation: |-
      - **Закрепить обсуждение** — чтобы важные обсуждения оставались в начале списка
      - **Редактировать тему** — чтобы изменить название или описание обсуждения
      - **Перейти в группу** — чтобы переместить обсуждение в другую группу, подгруппу или архивную группу
      - **Заблокировать тему** — чтобы запретить новые комментарии и изменения и убрать тему из списка открытых тем. Заблокированные темы можно найти с помощью фильтра обсуждений или строки поиска. Тему можно разблокировать в любое время.
      - **Удалить обсуждение** — если вам не нужно сохранять его историю. Восстановить удалённое обсуждение нельзя.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e3d2099d0e6fe6fa:
    english: "## Category tags"
    translation: "## Теги категорий"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  24b03357f6f6c3b9:
    english: Category tags are a great way to label discussions so they can be easily found. Set tags and apply to each discussion  - try to be consistent.
    translation: Теги категорий помогают находить обсуждения. Создавайте теги и добавляйте их к обсуждениям. Старайтесь использовать их последовательно.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f0f5f5abd586fb61:
    english: 'Common board tags include: Administration, AGM, Board meeting, Report, Finance, Legal, Members, Minutes, Planning, Policy, Resolution, Constitution, General meeting, Strategy.'
    translation: 'Примеры тегов для совета: Администрирование, Годовое общее собрание, Заседание совета, Отчёт, Финансы, Правовые вопросы, Участники, Протоколы, Планирование, Политика, Решения, Устав, Общее собрание, Стратегия.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  89d8ec222f5019df:
    english: Group members can search for discussions by tag under the **tags** drop down menu.
    translation: Участники группы могут искать обсуждения по тегам в раскрывающемся меню **Метки**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  54ee008489cceaca:
    english: "## Maintaining the discussion topic"
    translation: "## Как придерживаться темы обсуждения"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e9007433ca60ae39:
    english: Discussions work best for everyone when you can keep the discussion on a single topic.
    translation: Обсуждение удобнее для всех, когда оно посвящено одной теме.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f742ae07824b35c6:
    english: If a new topic is introduced in the middle of a discussion, you can select and move specific comments to another discussion, or start a new discussion.
    translation: Если в ходе обсуждения возникает другой вопрос, вы можете выбрать отдельные комментарии и перенести их в другое обсуждение или начать новое.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c8b5176f58dceb8b:
    english: "## Subgroups"
    translation: "## Подгруппы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  79ad157a95adc8ef:
    english: Subgroups help you organize your communications and members so that the right people are engaged in their work together.  For example, you can use a subgroup for a subcommittee or working group.
    translation: Подгруппы помогают организовать общение и совместную работу участников. Например, можно создать подгруппу для подкомитета или рабочей группы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0f4ebdab4c62be34:
    english: "[Setting up subgroups.](/en/user_manual/groups/subgroups)"
    translation: "[Как создать подгруппы.](/en/user_manual/groups/subgroups)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d3c65fde78b2b08f:
    english: "## Archiving records"
    translation: "## Архивирование записей"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  435f52763f0d9a5b:
    english: To keep a record of a thread discussion and decisions in polls, use **[Print thread](/en/user_manual/groups/data_export#print-thread-to-pdf)** and print the file to pdf.  You can then store a published copy of the thread in your chosen document storage archive.
    translation: Чтобы сохранить обсуждение и решения, принятые в опросах, используйте **[Распечатать тему](/en/user_manual/groups/data_export#print-thread-to-pdf)** и сохраните файл в формате PDF. Затем вы можете поместить опубликованную копию темы в выбранный архив документов.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a6b96750c9e1e590:
    english: To keep a complete record of the data in your Loomio group, use **[Export group data](/en/user_manual/groups/data_export#group-data-backup-or-export)**.
    translation: Чтобы сохранить все данные вашей группы Loomio, используйте **[Экспортировать данные группы](/en/user_manual/groups/data_export#group-data-backup-or-export)**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '082f19717e933762':
    english: "## Data storage"
    translation: "## Хранение данных"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e6c76e3a9b68b65f:
    english: Loomio's cloud services protect your data by writing to multiple disks instantly, backed up daily, and stored in multiple locations.
    translation: 'Облачные сервисы Loomio защищают ваши данные: сразу записывают их на несколько дисков, ежедневно создают резервные копии и хранят их в нескольких местах.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  84ee638382ead0fe:
    english: All data in threads, comments, polls and file attachments are stored in this way.
    translation: Так хранятся все данные тем, комментариев, опросов и прикреплённых файлов.
    status: machine
