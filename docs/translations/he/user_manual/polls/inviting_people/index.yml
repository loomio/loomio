---
navigation_title: הזמנה להצביע
blocks:
  0635cf23fcaaa95b:
    english: "# Invite to vote"
    translation: "# הזמנה להצביע"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2ae3991d9865a2bb:
    english: "## Invite people to vote in a poll"
    translation: "## הזמנת אנשים להצביע בסקר"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  56d96764605291b4:
    english: Invite people to your poll by sending them a notification.
    translation: כדי להזמין אנשים להצביע בסקר, יש לשלוח להם התראה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3632ef534c8c03f7:
    english: After you start a poll, the **Invite to vote** box appears. Select an audience such as **Everyone in the thread** or your group, or enter individual names and email addresses.
    translation: לאחר פתיחת הסקר מופיעה התיבה **הזמנה להצביע**. יש לבחור קהל יעד, למשל **כולם בשרשור** או הקבוצה, או להזין שמות וכתובות אימייל של אנשים מסוימים.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  835f178f0b52f3b6:
    english: You can include an optional message with the invitation.
    translation: ניתן לצרף להודעת ההזמנה מסר אישי.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  78da00061d5815a4:
    english: Select a group chip to expand it into the people you are inviting. Select the x beside a name to remove that person from the invitation.
    translation: יש לבחור בתגית של קבוצה כדי להציג את האנשים שיוזמנו. להסרת אדם מההזמנה, יש לבחור ב־x לצד שמו.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e6969f4c4b62b6ff:
    english: "### Invite guests or experts"
    translation: "### הזמנת אורחים או מומחים"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9bb72d11863e1f46:
    english: You can also invite a guest to the poll by entering their email address. They will be given permission to participate in only this poll.
    translation: ניתן להזמין גם אורחים לסקר באמצעות הזנת כתובת האימייל שלהם. תינתן להם הרשאה להשתתף בסקר הזה בלבד.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dd20b166a40eb798:
    english: If the poll is within a thread, they will also be able to see that thread and its comments. They will not be able to comment, participate in other polls in the thread, or see other threads in the group.
    translation: אם הסקר נמצא בשרשור, תהיה להם גישה גם לשרשור ולתגובות שבו. לא תהיה להם אפשרות להגיב, להשתתף בסקרים אחרים בשרשור או לצפות בשרשורים אחרים בקבוצה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  84cc8773a5337094:
    english: "### Invite a subgroup to vote"
    translation: "### הזמנת תת־קבוצה להצביע"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  80ca3c8c753b0ebb:
    english: To limit voting to invited people, select **Selected people only** when you create the poll. You can then invite a subgroup from the parent group. See also [Delegated voters](/en/user_manual/groups/delegated_voters/).
    translation: כדי להגביל את ההצבעה לאנשים שהוזמנו, יש לבחור **אנשים נבחרים בלבד** בעת יצירת הסקר. לאחר מכן ניתן להזמין תת־קבוצה מתוך קבוצת האם. ראו גם [מצביעים שהוסמכו להצביע](/en/user_manual/groups/delegated_voters/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2074aff770fa7610:
    english: |-
      ![Selecting invited people only](invited-people-only.png)
      ![Inviting a subgroup to vote](invite-voters-subgroup.png)
    translation: |-
      ![בחירת אנשים שהוזמנו בלבד](invited-people-only.png)
      ![הזמנת תת־קבוצה להצביע](invite-voters-subgroup.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  29103b18580994a1:
    english: "## Engage people while a poll is running"
    translation: "## שיתוף אנשים בזמן שהסקר פתוח"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1ce57a2542eebaab:
    english: At the bottom of the poll are several features to help you engage with people once the poll is running.
    translation: בתחתית הסקר יש כמה אפשרויות שמסייעות לשתף אנשים לאחר פתיחתו.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  45090f8260d19a47:
    english: "### Add voters to the poll"
    translation: "### הוספת מצביעים לסקר"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3116212829910b50:
    english: You can add new people to the poll at any time, including before voting opens on a scheduled poll.
    translation: ניתן להוסיף אנשים לסקר בכל עת, גם לפני תחילת ההצבעה בסקר שנקבע לו מועד פתיחה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5e851e072e9dc1de:
    english: Select **Add voters**, then enter the names or email addresses of the people you want to add.
    translation: יש לבחור **הוסף מצביעים**, ולאחר מכן להזין את השמות או כתובות האימייל של האנשים שרוצים להוסיף.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  be5aceb4caf93c11:
    english: If the poll has a scheduled opening time and voting has not yet opened, voters will not receive an immediate notification. Instead, they will be notified when voting opens.
    translation: אם נקבע לסקר מועד פתיחה וההצבעה טרם החלה, המצביעים לא יקבלו התראה מיד. ההתראה תישלח כשההצבעה תיפתח.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b9a08269e3e252ce:
    english: "### Remove people from the poll"
    translation: "### הסרת אנשים מהסקר"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ce37b0af98854c79:
    english: Select **Add voters**, find the person's name, open the three-dot menu beside it, and select **Remove from proposal**.
    translation: יש לבחור **הוסף מצביעים**, למצוא את שם האדם, לפתוח את תפריט שלוש הנקודות שלצדו ולבחור **הסר מההצעה**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '08df94a4269ad100':
    english: People cannot be removed from an anonymous poll.
    translation: לא ניתן להסיר אנשים מסקר אנונימי.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3d13453394c79f30:
    english: For example, an administrator who creates a poll on behalf of board members can remove themself if they are not authorised to vote.
    translation: לדוגמה, מנהל מערכת שיצר סקר בשם חברי ועד יכול להסיר את עצמו אם אין לו הרשאה להצביע.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2a354792a1f1f517:
    english: "### Remind people to vote"
    translation: "### שליחת תזכורת להצביע"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  501e7846380326fd:
    english: Select **Remind** to send a notification to people who have not voted. **Everyone invited to vote** is selected by default. Select the chip to see or change the recipients.
    translation: יש לבחור **תזכורת** כדי לשלוח התראה לאנשים שטרם הצביעו. האפשרות **כולם מוזמנים להצביע** נבחרת כברירת מחדל. ניתן לבחור בתגית כדי לראות את הנמענים או לשנות אותם.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  04e4537024da788c:
    english: "### View notification history"
    translation: "### צפייה בהיסטוריית ההתראות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  46145a9dd950c8eb:
    english: Open the three-dot menu (**⋯**) at the bottom of the poll and select **Notification history**.
    translation: יש לפתוח את תפריט שלוש הנקודות (**⋯**) בתחתית הסקר ולבחור **היסטוריית התראות**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e74eafb1566d5dea:
    english: "![Notification history in a poll's actions menu](../../discussions/notifying_people/poll_notification_history.png)"
    translation: "![היסטוריית התראות בתפריט הפעולות של הסקר](../../discussions/notifying_people/poll_notification_history.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1a96cd0121fe58ec:
    english: The history shows who has been invited to vote, when each invitation was sent, and whether it has been read when that information is available.
    translation: בהיסטוריה מוצגים האנשים שהוזמנו להצביע, מועד השליחה של כל הזמנה, ואם המידע זמין — האם היא נקראה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3bd9a11263e1c8f4:
    english: "![Notification history for a poll](../../discussions/notifying_people/poll_notification_example.png)"
    translation: "![היסטוריית התראות של סקר](../../discussions/notifying_people/poll_notification_example.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f3bbc883f6429276:
    english: "### Close early"
    translation: "### סגירה מוקדמת"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  af6a9acaafaaa96a:
    english: Select **Close early** to close a poll before its scheduled closing time.
    translation: יש לבחור **סגור מוקדם** כדי לסגור את הסקר לפני מועד הסגירה שנקבע לו.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3cdbb11687fa03c0:
    english: You might do this when everyone has voted or the poll no longer needs to remain open.
    translation: אפשר לעשות זאת לאחר שכולם הצביעו, או כשהסקר כבר אינו צריך להישאר פתוח.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  46f3a0ec8da6dba1:
    english: "### Reopen"
    translation: "### פתיחה מחדש"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '0821c04199937236':
    english: Select **Reopen** on a closed poll, then set a new closing date and time.
    translation: יש לבחור **פתח מחדש** בסקר סגור, ולאחר מכן לקבוע תאריך ושעה חדשים לסגירתו.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  53079cadd493f27c:
    english: Anonymous polls cannot be reopened.
    translation: לא ניתן לפתוח מחדש סקרים אנונימיים.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
