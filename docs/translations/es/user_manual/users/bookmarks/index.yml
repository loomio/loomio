  4f81ad2ed2c971a4:
    english: "# Bookmarks"
    translation: "# Marcadores"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5d590d1d8ab9b956:
    english: |-
      Bookmarks are a personal list of Loomio items you want to return to. Your
      bookmarks are visible only to you and saving an item does not notify anyone
      else.
    translation: |-
      Los marcadores son una lista personal de elementos de Loomio a los que quieres volver.
      Solo tú puedes ver tus marcadores. Al guardar un elemento, nadie más recibe una
      notificación.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  aac40737df991d52:
    english: 'You can bookmark:'
    translation: 'Puedes guardar como marcadores:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0f6c7e4161c72c18:
    english: |-
      - discussions
      - comments
      - proposals and polls
      - votes
      - outcomes
    translation: |-
      - discusiones
      - comentarios
      - propuestas y sondeos
      - votos
      - conclusiones
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fc91d7d6d32e590b:
    english: "## Save a bookmark"
    translation: "## Guardar un marcador"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  daec09886eecd058:
    english: |-
      Open the action menu for the item and select **Save bookmark**. The action menu
      is usually shown as three dots. For a discussion, use the action menu near the
      discussion title; for a comment, vote, proposal, poll, or outcome, use the menu
      on that item.
    translation: |-
      Abre el menú de acciones del elemento y selecciona **Guardar marcador**. El menú
      suele aparecer como tres puntos. Para una discusión, usa el menú junto al
      título. Para un comentario, voto, propuesta, sondeo o conclusión, usa el menú
      del elemento correspondiente.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  395a4c119e77f34b:
    english: "## View your bookmarks"
    translation: "## Ver tus marcadores"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a5e09c422c753df7:
    english: |-
      Open the sidebar and select **Bookmarks**. The number beside the link shows how
      many bookmarks you have saved.
    translation: |-
      Abre la barra lateral y selecciona **Marcadores**. El número junto al enlace indica
      cuántos marcadores has guardado.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7c21b03875c08b8e:
    english: |-
      The Bookmarks page lists your most recently saved items first. Each row shows
      the kind of item and its author. Select a row to return to the bookmarked item.
    translation: |-
      La página Marcadores muestra primero los elementos que guardaste más recientemente.
      Cada fila indica el tipo de elemento y quién lo creó. Selecciona una fila para volver al elemento guardado.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  644d774a0d045214:
    english: "## Remove a bookmark"
    translation: "## Eliminar un marcador"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c2480aa6235675ba:
    english: |-
      On the Bookmarks page, select the remove-bookmark button at the end of a row.
      You can also open the bookmarked item's action menu and select **Remove
      bookmark**.
    translation: |-
      En la página Marcadores, selecciona el botón para eliminar el marcador al final de una fila.
      También puedes abrir el menú de acciones del elemento y seleccionar **Eliminar
      marcador**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6c20d47950313409:
    english: |-
      Removing a bookmark affects only your personal list. You can save the item
      again later.
    translation: |-
      Eliminar un marcador solo afecta a tu lista personal. Puedes volver a guardar el
      elemento más adelante.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
