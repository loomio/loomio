---
navigation_title: Падгрупы
blocks:
  782c5b3df26b17ae:
    english: "# Subgroups"
    translation: "# Падгрупы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0025fb895cd6cae8:
    english: Subgroups help you organize your communications and members so that the right people are engaged in their work together.
    translation: Падгрупы дапамагаюць арганізаваць зносіны і ўдзельнікаў, каб да сумеснай працы далучаліся патрэбныя людзі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cc3abd19bc310546:
    english: |-
      For example, an organization may have the following subgroups:
      - governance board
      - working team or a project working group
      - a topic (such as 'strategy' or 'learning')
    translation: |-
      Напрыклад, у арганізацыі могуць быць такія падгрупы:
      - кіруючая рада
      - рабочая каманда або праектная група
      - група па пэўнай тэме, напрыклад «стратэгія» або «навучанне»
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  eab908c78ccd923d:
    english: Subgroups work just like groups do, but are located within your "parent" group. Most of the features and settings available are the same as in the parent group. This also means that someone can be a member of your subgroup, such as your board, but not of your parent group.
    translation: Падгрупы працуюць гэтак жа, як групы, але знаходзяцца ўнутры вашай асноўнай групы. Большасць функцый і налад у іх аднолькавыя. Людзі могуць быць удзельнікамі падгрупы, напрыклад кіруючай рады, і пры гэтым не ўваходзіць у асноўную групу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aaa62c1b02d15779:
    english: "## Add a subgroup"
    translation: "## Дадаць падгрупу"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8ed2fcd2a209a53d:
    english: |-
      >[!Note]
      >The ability to add new subgroups is part of the group's [permission settings](/en/user_manual/groups/settings/permissions). By default, only admins can start new subgroups.
    translation: |-
      >[!Note]
      >Магчымасць дадаваць падгрупы вызначаецца ў [наладах дазволаў](/en/user_manual/groups/settings/permissions) групы. Прадвызначана ствараць падгрупы могуць толькі адміністратары.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  483b820f123b5ae0:
    english: 'To add a subgroup, visit your main group page, then click **New Subgroup** from the sidebar.  '
    translation: Каб дадаць падгрупу, адкрыйце старонку асноўнай групы і націсніце **Новая падгрупа** ў бакавым меню.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  abceea91b4638844:
    english: "![New subgroup button in the Oatmilk Cooperative sidebar](subgroups-sidebar.png)"
    translation: "![Кнопка «Новая падгрупа» ў бакавым меню Oatmilk Cooperative](subgroups-sidebar.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b8e3d3477eb6765d:
    english: Click the **New subgroup** button, give it a name and select the privacy setting, then click **Start subgroup**.
    translation: Націсніце **Новая падгрупа**, увядзіце назву, выберыце наладу прыватнасці і націсніце **Пачаць падгрупу**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1d49b46575af3f21:
    english: "![New subgroup form for the Packaging Working Group](subgroups_new.png)"
    translation: "![Форма стварэння падгрупы Packaging Working Group](subgroups_new.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  348e88e5c0ca37d0:
    english: When you are ready, [invite people](/en/user_manual/groups/inviting_people/) to the subgroup.
    translation: Калі будзеце гатовыя, [запрасіце людзей](/en/user_manual/groups/inviting_people/) у падгрупу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4ac901bff75cf342:
    english: You can edit the subgroups [group settings](/en/user_manual/groups/settings/) by clicking the cog icon on the subgroup page.
    translation: Каб змяніць [налады групы](/en/user_manual/groups/settings/) для падгрупы, націсніце значок шасцярэнькі на яе старонцы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  926676e3163dbc8e:
    english: "![Edit group settings action on the Packaging Working Group](subgroups_edit_group_settings.png)"
    translation: "![Дзеянне для змены налад групы Packaging Working Group](subgroups_edit_group_settings.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  737225cc4bebe7e8:
    english: "## Subgroup settings"
    translation: "## Налады падгрупы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c93e5ec8b6f3ceb7:
    english: "### Privacy"
    translation: "### Прыватнасць"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  92a47fe13740347a:
    english: The privacy settings for subgroups are similar to the parent group.
    translation: Налады прыватнасці падгруп падобныя да налад асноўнай групы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cee5963ea2acac16:
    english: "**Secret** subgroups are not visible to people not invited to the subgroup."
    translation: Падгрупы з наладай **Сакрэт** не бачныя людзям, якіх у іх не запрасілі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1c8fb4caaa5a2cb9:
    english: "**Closed** subgroups are listed in the Subgroups tab of the parent group and user's sidebar menu. Members of the parent group can request to join the subgroup. Membership is approved by a subgroup admin."
    translation: Падгрупы з наладай **Закрыта** паказваюцца ва ўкладцы «Падгрупы» асноўнай групы і ў бакавым меню карыстальнікаў. Удзельнікі асноўнай групы могуць запытаць далучэнне да падгрупы. Запыт ухваляе адміністрацыя падгрупы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b35b1b3450b2d1e1:
    english: Closed subgroups have an additional setting that allow members of its parent group to see private threads.
    translation: У закрытых падгрупах ёсць дадатковая налада, якая дазваляе ўдзельнікам асноўнай групы бачыць прыватныя тэмы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  933fe2f0cbdec143:
    english: "[Read about group privacy here](/en/user_manual/groups/settings/privacy)."
    translation: "[Больш пра прыватнасць груп](/en/user_manual/groups/settings/privacy)."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d16c8b1258b67c9e:
    english: "### Permissions"
    translation: "### Дазволы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  eb5de97caadd5166:
    english: Subgroups operate independently of the main group. For example, if the subgroup privacy setting is set to **Secret**, then only invited members can find this subgroup, see who is in it, and see threads.
    translation: Падгрупы працуюць незалежна ад асноўнай групы. Напрыклад, калі для падгрупы выбрана налада **Сакрэт**, толькі запрошаныя ўдзельнікі могуць знайсці яе, убачыць спіс удзельнікаў і праглядаць тэмы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e7897aa59ffe96a1:
    english: "**Closed** subgroups have an additional setting that allow members of its parent group to see private threads, enabling the subgroup to be transparent to members of the parent group."
    translation: У падгрупах з наладай **Закрыта** ёсць дадатковая налада, якая дазваляе ўдзельнікам асноўнай групы бачыць прыватныя тэмы падгрупы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8dd3770fefa7d7e6:
    english: "![Setting that lets parent group members see private subgroup threads](subgroups_private_threads_settings.png)"
    translation: "![Налада, якая дазваляе ўдзельнікам асноўнай групы бачыць прыватныя тэмы падгрупы](subgroups_private_threads_settings.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c78effb175b8924b:
    english: "## Find subgroups"
    translation: "## Знайсці падгрупы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5692ebbfe3fe83e9:
    english: Open the sidebar menu, and click your group name to see it's subgroups.
    translation: Адкрыйце бакавое меню і націсніце назву сваёй групы, каб убачыць яе падгрупы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0abefe88cc8bea7f:
    english: "![Oatmilk Cooperative subgroups listed in the sidebar](subgroups_find_subgroups.png)"
    translation: "![Падгрупы Oatmilk Cooperative у бакавым меню](subgroups_find_subgroups.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8988135e14e40636:
    english: "## Invite to a subgroup"
    translation: "## Запрасіць людзей у падгрупу"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  217a985e9afb5421:
    english: Invite people to a subgroup as you invite them into a group. If they already belong to a parent group or another subgroup in the same organization that you also belong to, you can type their name or select that group as an audience. Select the audience chip to expand it into individual people, then remove anyone you do not want to invite.
    translation: Запрашайце людзей у падгрупу гэтак жа, як у групу. Калі яны ўжо ўваходзяць у асноўную групу або іншую падгрупу той жа арганізацыі, у якую ўваходзіце і вы, увядзіце іх імёны або выберыце гэтую групу як аўдыторыю. Націсніце пазнаку аўдыторыі, каб убачыць асобных людзей, і выдаліце са спіса тых, каго не хочаце запрашаць.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2d4a28c2306fc3c6:
    english: "### Simultaneously invite people to subgroups and parent group"
    translation: "### Запрасіць людзей у асноўную групу і падгрупы адначасова"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cf301ba403b3a28e:
    english: If you use the **Invite people** button from your parent group's **Members** tab, you can invite people to multiple subgroups at the same time by ticking the boxes of those you would like them to join immediately.
    translation: Калі вы націснеце **Запрасіць людзей** ва ўкладцы **Удзельнікі** асноўнай групы, зможаце адначасова запрасіць людзей у некалькі падгруп. Для гэтага адзначце падгрупы, да якіх яны павінны адразу далучыцца.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  28a271be7caa0590:
    english: "![Selecting the parent group and subgroup in the invitation form](group_invite_email_subgroups.png)"
    translation: "![Выбар асноўнай групы і падгрупы ў форме запрашэння](group_invite_email_subgroups.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5323cb0e01e3e171:
    english: "## Administer a subgroup"
    translation: "## Кіраваць падгрупай"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e7c6ae867d7d3813:
    english: Subgroups can have their own admins, and admins of a subgroup may not be the same as the admins of the parent group.
    translation: У падгруп могуць быць свае адміністратары. Яны не абавязкова кіруюць асноўнай групай.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  937ae9d3e8948a26:
    english: However an admin of the 'parent' group can make themselves admin of any subgroup.  This helps administrators of the parent group to administer subgroups as necessary.
    translation: Адміністрацыя асноўнай групы можа атрымаць правы адміністратара любой падгрупы. Гэта дазваляе кіраваць падгрупамі, калі ўзнікае патрэба.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  282547a6c728d20c:
    english: Go to the Subgroup tab, find the subgroup and click **Join group**.
    translation: Адкрыйце ўкладку «Падгрупы», знайдзіце патрэбную падгрупу і націсніце **Далучыцца да групы**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  64102057b4f533dd:
    english: "![Join group button on a closed subgroup](member_join_subgroup.png)"
    translation: "![Кнопка «Далучыцца да групы» для закрытай падгрупы](member_join_subgroup.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0f91a4020a9484ef:
    english: Now a member of the subgroup, an admin of the parent group can make themselves an admin of the subgroup.
    translation: Пасля далучэння да падгрупы адміністрацыя асноўнай групы можа атрымаць у ёй правы адміністратара.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b10fec2c4c3ebb6c:
    english: "![Make admin action for a parent group admin](member_make_admin.png)"
    translation: "![Дзеянне для надання правоў адміністратара падгрупы адміністрацыі асноўнай групы](member_make_admin.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dcb00619954e30a2:
    english: "## Delete a subgroup"
    translation: "## Выдаліць падгрупу"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  92e05281b2891dd5:
    english: Admins can delete a subgroup in the same way you delete a group. When deleting a subgroup, be careful to not delete the 'parent' group.
    translation: Адміністратары могуць выдаліць падгрупу гэтак жа, як і групу. Пры выдаленні падгрупы праверце, каб не выдаліць бацькоўскую групу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a29b8361fb910cde:
    english: Learn [how to delete groups](/en/user_manual/groups/deleting_your_group/).
    translation: Даведайцеся, [як выдаляць групы](/en/user_manual/groups/deleting_your_group/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
