  62c53ea4911e0c79:
    english: "## Search"
    translation: "## Keresés"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  29cbb6f48ca978fa:
    english: The Search button in the top navigation bar opens global search from any page in Loomio.
    translation: A felső navigációs sáv Keresés gombjával a Loomio bármely oldaláról kereshetsz.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6286c9b6f2b16fc4:
    english: Search includes content you can access across all your groups and direct discussions. It can find discussion titles and context, comments, polls, votes, and outcomes.
    translation: A keresés minden olyan tartalomra kiterjed, amelyhez hozzáférsz a csoportjaidban és a közvetlen beszélgetésekben. Megtalálja a beszélgetések címét és leírását, valamint a hozzászólásokat, szavazásokat, szavazatokat és következtetéseket.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c5a77d75258a11e6:
    english: Enter a word or phrase, then press Enter or select the search icon. For example, searching for **bottle** finds Oatmilk Cooperative content containing that word.
    translation: Írj be egy szót vagy kifejezést, majd nyomd meg az Enter billentyűt, vagy kattints a keresés ikonra. Ha például a **bottle** szóra keresel, megtalálod az Oatmilk Cooperative azon tartalmait, amelyekben szerepel ez a szó.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1b93fd8aaf142d37:
    english: "### Search tips"
    translation: "### Keresési tippek"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  99f906ecbde3a538:
    english: "- Start with one or two distinctive words from the title or content you remember.\n- Search matches the beginning of a word, so a partial word such as **bott** can match **bottle**. \n- It will compensate for misspellings when results for the given query are very few.\n- Use the filters to limit results to an organization, subgroup, tag, or content type such as comments or polls.\n- Sort by **Best match** when relevance matters, or by newest or oldest when you know roughly when the content was posted."
    translation: "- Kezdd egy vagy két jellegzetes szóval, amelyre emlékszel a címből vagy a tartalomból.\n- A keresés a szavak elejére is illeszkedik, így a **bott** szórészlet a **bottle** szót is megtalálhatja. \n- Ha nagyon kevés találat van, a keresés a gépelési hibákat is figyelembe veszi.\n- A szűrőkkel korlátozhatod a találatokat szervezetre, alcsoportra, címkére vagy tartalomtípusra, például hozzászólásokra vagy szavazásokra.\n- Rendezd a találatokat **Legjobb találat** szerint, ha a relevancia számít. Ha nagyjából tudod, mikor tették közzé a tartalmat, rendezd a legújabb vagy a legrégebbi szerint."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e7c532f120c4807d:
    english: "## Filter discussions"
    translation: "## Beszélgetések szűrése"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  91bf7098343a1efa:
    english: Use the controls beside Search to filter discussions by open or closed status or by category tag. Combining a search term with a filter can narrow a long discussion list quickly.
    translation: A Keresés melletti vezérlőkkel a beszélgetéseket nyitott vagy lezárt állapotuk, illetve kategóriacímkéjük szerint szűrheted. A keresőkifejezés és a szűrő együttes használatával gyorsan leszűkítheted a hosszú listát.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e3d2099d0e6fe6fa:
    english: "## Category tags"
    translation: "## Kategóriacímkék"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  932506e53b51fac1:
    english: Tags group related discussions and polls under names chosen by your group, such as a project, team, or area of work.
    translation: A címkék a kapcsolódó beszélgetéseket és szavazásokat fogják össze a csoportod által választott nevek alatt, például projekt, csapat vagy munkaterület szerint.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d761f1c7397d8e51:
    english: Select a tag on the **Discussions** tab to show matching discussions. People with permission to start or edit discussions can apply tags. See [Category tags](/en/user_manual/discussions/tags) for setup and permission details.
    translation: A **Beszélgetések** lapon válassz ki egy címkét a hozzá tartozó beszélgetések megjelenítéséhez. Címkét azok használhatnak, akik jogosultak beszélgetést indítani vagy szerkeszteni. A beállításokról és a jogosultságokról a [Kategóriacímkék](/en/user_manual/discussions/tags) oldalon olvashatsz.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b620c9f42e31a54f:
    english: "## Unread discussions"
    translation: "## Olvasatlan beszélgetések"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b2f3737cd46d903a:
    english: Select **Unread discussions** in the sidebar to see discussions with activity you have not read. Within a discussion, the timeline helps you move to unread items and important events.
    translation: Az oldalsávban válaszd az **Olvasatlan beszélgetések** lehetőséget azoknak a beszélgetéseknek a megtekintéséhez, amelyekben még nem olvasott tevékenység van. A beszélgetésen belül az idővonal segít eljutni az olvasatlan elemekhez és a fontos eseményekhez.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e016a4cafcaee460:
    english: "## Polls awaiting your vote"
    translation: "## Szavazások, amelyekben még nem szavaztál"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  873929c0f1d06567:
    english: Select **Polls to vote on** in the sidebar to see active polls where you have been invited but have not yet voted. You can also open a group's **Polls** tab to see its active and closed polls.
    translation: Az oldalsávban válaszd a **Szavazások, amelyekre szavazni kell** lehetőséget, hogy lásd azokat az aktív szavazásokat, amelyekre meghívtak, de még nem szavaztál. Egy csoport **Szavazások** lapján az aktív és a lezárt szavazásokat is megnézheted.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3bb08c3343e3efd7:
    english: "## Bookmarks"
    translation: "## Könyvjelzők"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1bec2703cc5fe70a:
    english: Bookmark a discussion, comment, poll, vote, or outcome when you want to return to it. Open **Bookmarks** from your user menu to see everything you have saved. See [Bookmarks](/en/user_manual/users/bookmarks) for details.
    translation: Tegyél könyvjelzőt egy beszélgetéshez, hozzászóláshoz, szavazáshoz, szavazathoz vagy következtetéshez, ha később vissza szeretnél térni hozzá. A felhasználói menüben nyisd meg a **Könyvjelzők** lehetőséget az összes mentett elem megtekintéséhez. További részleteket a [Könyvjelzők](/en/user_manual/users/bookmarks) oldalon találsz.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
