  e21550bf41c185b9:
    english: |-
      ## Generate a Webhook URL
      We've prepared step by step walk-throughs for each service we support. Follow the right one for your service to obtain the webhook URL you'll need to add the chat integration in Loomio.
    translation: |-
      ## Een webhook-URL aanmaken
      Voor elke ondersteunde dienst is er een stapsgewijze handleiding. Volg de handleiding voor jouw dienst om de webhook-URL te krijgen die je nodig hebt om de chatintegratie in Loomio toe te voegen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  84f03860780d02b8:
    english: |-
      - [Slack](../slack/)
      - [Microsoft Teams](../microsoft_teams/)
      - [Discord](../discord/)
      - [Matrix](../matrix/)
      - [Mattermost](../mattermost/)
    translation: |-
      - [Slack](../slack/)
      - [Microsoft Teams](../microsoft_teams/)
      - [Discord](../discord/)
      - [Matrix](../matrix/)
      - [Mattermost](../mattermost/)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  290b36f9178272e2:
    english: |-
      Our webhook based system can also be used to support other systems that support incoming webhooks with either HTML or Markdown formatting. This could be something like Zapier or Rocketchat.
      Just select the mattermost bot, but use a custom webhook URL.
    translation: |-
      Je kunt ons webhooksysteem ook gebruiken met andere diensten die inkomende webhooks met HTML- of Markdown-opmaak ondersteunen, zoals Zapier of Rocketchat.
      Selecteer hiervoor de Mattermost-bot en gebruik een aangepaste webhook-URL.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f76c44196c94dcef:
    english: "## Set up a chat integration"
    translation: "## Een chatintegratie instellen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3c63f567f90fd1eb:
    english: |-
      After configuring your chosen service (see above), you'll have a webhook URL.
      Open **Chat integrations** from the group menu and add a new chat integration for your group.
    translation: |-
      Nadat je de gekozen dienst hebt ingesteld (zie hierboven), heb je een webhook-URL.
      Open **Chatintegraties** via het groepsmenu en voeg een nieuwe chatintegratie toe voor je groep.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a2e8e555406040a6:
    english: |-
      ![](loomio-group-settings.png)
      ![](loomio-settings-chatbots.png)
    translation: |-
      ![](loomio-group-settings.png)
      ![](loomio-settings-chatbots.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ca092d1c3fdb9f59:
    english: 'You probably don''t want to click any of the checkboxes for now. Just enter the name (such as "Discord #general") and the URL and click the save button at the bottom of the form.'
    translation: 'Laat de selectievakjes voorlopig leeg. Vul de naam in (bijvoorbeeld "Discord #general") en de URL, en klik onderaan het formulier op de knop om op te slaan.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a63a4be4a45bcfdb:
    english: If you decide later that you want the integration to receive automatic notifications, return to its settings and select the relevant events.
    translation: Wil je later automatische meldingen ontvangen via de integratie? Ga dan terug naar de instellingen en selecteer de relevante gebeurtenissen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f1d9c09f9d3c2a82:
    english: "### Invite to poll"
    translation: "### Uitnodigen om te stemmen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cbc7b5fd5afcc24c:
    english: |-
      This is how to send a notification to your chatroom inviting people to vote in a proposal.
      It's the same process for Share outcome, Invite to thread, Remind to vote, Poll edited etc.
    translation: |-
      Zo stuur je een melding naar je chatruimte om mensen uit te nodigen om over een voorstel te stemmen.
      De stappen zijn hetzelfde voor een conclusie delen, uitnodigen voor een discussie, herinneren aan een stemming, een gewijzigde poll en andere gebeurtenissen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  290001bb97dee010:
    english: |-
      ### Automatic notifications
      To send a notification whenever a specific event happens, edit the chat integration and select that event.
    translation: |-
      ### Automatische meldingen
      Wil je bij een bepaalde gebeurtenis automatisch een melding sturen? Bewerk dan de chatintegratie en selecteer die gebeurtenis.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
