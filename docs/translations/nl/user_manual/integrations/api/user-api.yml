    translation: Verwijder een peiling namens de gebruiker van de API-sleutel zonder het record te wissen. De peiling wordt verwijderd, maar het peilingrecord blijft bestaan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
