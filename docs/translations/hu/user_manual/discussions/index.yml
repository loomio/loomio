navigation_title: Beszélgetések
blocks:
  f087c06a5f4ab2e6:
    english: "# Intro to Discussions"
    translation: "# Bevezetés a beszélgetésekbe"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f515c87a8d1d20c7:
    english: Loomio discussions are where you can share information, discuss topics, and make decisions with your group.  People participate by posting comments and replies.
    translation: A Loomio-beszélgetésekben információkat oszthatsz meg, témákat vitathatsz meg, és döntéseket hozhatsz a csoportoddal. A résztvevők hozzászólásokkal és válaszokkal kapcsolódnak be.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eede89b6ce4f357d:
    english: |-
      - All info about a topic is in one easily accessible place.
      - People can reply via email and their comments appear in the discussion.
      - You can see who has read the discussion and who needs a nudge.
      - There is a record of discussion you can easily find again.
    translation: |-
      - Egy témáról minden információ egy könnyen elérhető helyen található.
      - A résztvevők e-mailben is válaszolhatnak, és hozzászólásaik megjelennek a beszélgetésben.
      - Láthatod, ki olvasta el a beszélgetést, és kit érdemes emlékeztetni.
      - A beszélgetés visszakereshető nyoma megmarad.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9cb2eb404b59208b:
    english: Discussions have a wide range of uses - from a general discussion forum to running specific work-flow and decision-making processes.
    translation: 'A beszélgetéseket sokféleképpen használhatod: általános fórumként vagy konkrét munkafolyamatok és döntési folyamatok lebonyolítására.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  87a95605052570ca:
    english: For example, you may frame a discussion on a particular topic, invite people to contribute their thoughts and share information, and facilitate progress towards an agreed outcome.
    translation: Például elindíthatsz egy beszélgetést egy adott témáról, megkérheted a többieket, hogy osszák meg gondolataikat és információikat, majd segítheted a közös következtetés kialakítását.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ce6e6734c595d968:
    english: Or you may invite people to participate in a particular decision, using a consent or advice decision-making process.
    translation: Arra is meghívhatod a többieket, hogy egy adott döntésben vegyenek részt, például beleegyezésen vagy tanácskérésen alapuló döntési folyamattal.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7fa58cb3ba95be0b:
    english: Discussions can also contain polls and proposals to help progress a discussion to an outcome. As people comment in the discussion and vote in polls, a discussion timeline builds so you can easily find key milestones.
    translation: A beszélgetések szavazásokat és javaslatokat is tartalmazhatnak, amelyek segítenek eljutni egy következtetésig. A hozzászólásokból és a szavazásokból idővonal áll össze, így könnyen megtalálhatod a fontos mérföldköveket.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  388e829e86a99bd8:
    english: "![The Returnable bottles for cafe customers discussion, with a comment and a proposal](discussion-example.png)"
    translation: "![A kávézó vendégeinek visszaváltható palackjairól szóló beszélgetés egy hozzászólással és egy javaslattal](discussion-example.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
