    translation: Les données envoyées par les webhooks sont des messages destinés aux services de chat. Elles ne contiennent pas des enregistrements Loomio complets. Les liens du message indiquent le contenu Loomio concerné. Une intégration peut ensuite utiliser l’API utilisateur si elle a besoin de données structurées à jour.
