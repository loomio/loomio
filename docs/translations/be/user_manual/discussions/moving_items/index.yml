---
navigation_title: Перамяшчэнне элементаў паміж тэмамі
blocks:
  875a42e08000fffe:
    english: "# Moving items between threads"
    translation: "# Перамяшчэнне элементаў паміж тэмамі"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5c0fcd38f9276e8f:
    english: Move selected items when a conversation belongs in another thread, when one thread has split into separate topics, or when you want to combine related discussions. There is no separate **Merge discussions** command.
    translation: Перамясціце выбраныя элементы, калі размову лепш весці ў іншай тэме, калі абмеркаванне падзялілася на асобныя тэмы або калі вы хочаце аб’яднаць звязаныя дыскусіі. Асобнай каманды **Аб’яднаць дыскусіі** няма.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f43c7835d05a135e:
    english: The option is available to group admins and to members when **Members can manage discussions and comments** is enabled in [Group permissions](/en/user_manual/groups/settings/permissions).
    translation: Гэтая магчымасць даступная адміністратарам групы, а таксама ўдзельнікам, калі ў [дазволах групы](/en/user_manual/groups/settings/permissions) уключана налада **Удзельнікі могуць кіраваць абмеркаваннямі і каментарамі**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  30a4e31dab983f89:
    english: Open the three-dot menu (**⋯**) on an item and select **Move item**.
    translation: Адкрыйце меню з трыма кропкамі (**⋯**) каля элемента і выберыце **Перамясціць элемент**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  24fd0043effa14fb:
    english: Select the items you want to move.
    translation: Выберыце элементы, якія хочаце перамясціць.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  81551cd5134f24c5:
    english: Select any additional items with the checkboxes, then click **Move** in the banner at the top of the discussion.
    translation: Адзначце дадатковыя элементы сцяжкамі, затым націсніце **Перамясціць** на панэлі ўверсе дыскусіі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f53055845c214b05:
    english: Choose the group or subgroup, then search for the destination discussion.
    translation: Выберыце групу або падгрупу, затым знайдзіце дыскусію, у якую трэба перамясціць элементы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  19bc2092ac28011b:
    english: To move the items into a new discussion, select **New discussion** and add its title and context.
    translation: Каб перамясціць элементы ў новую дыскусію, выберыце **Новая дыскусія** і дадайце назву і кантэкст.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '092b56e69505636f':
    english: The items are moved from the original thread into the selected or newly created thread.
    translation: Элементы будуць перамешчаны з першапачатковай тэмы ў выбраную або толькі што створаную тэму.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  162c0d0c47ca798f:
    english: If the original thread is no longer needed, you can [lock it](/en/user_manual/discussions/using_discussions/#lock-or-unlock-a-thread). Delete it only if you are certain it will not be needed again.
    translation: Калі першапачатковая тэма больш не патрэбная, вы можаце [заблакіраваць яе](/en/user_manual/discussions/using_discussions/#lock-or-unlock-a-thread). Выдаляйце яе толькі тады, калі ўпэўненыя, што яна больш не спатрэбіцца.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
