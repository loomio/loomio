  e6670b54039f316a:
    english: Compare the number of votes issued to each person with the number they cast, see missed votes, and identify people who cast every vote issued to them. A person with no issued votes is not shown as having cast all votes. Anonymous polls are excluded because an anonymous ballot must not be associated with the person who cast it.
    translation: Compare o número de votos atribuídos a cada pessoa com o número de votos que ela registrou. Veja os votos perdidos e identifique quem votou em todas as enquetes para as quais recebeu um voto. Uma pessoa sem votos atribuídos não aparece como alguém que votou em todas. Enquetes anônimas são excluídas porque um voto anônimo não pode ser associado à pessoa que o registrou.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  252da2b72775c4f8:
