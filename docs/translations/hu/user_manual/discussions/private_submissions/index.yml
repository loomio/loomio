---
navigation_title: Bizalmas beadványok gyűjtése
blocks:
  c4a53a596a037fc0:
    english: "# Collect private submissions"
    translation: "# Bizalmas beadványok gyűjtése"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b24abc6bf93b1c0f:
    english: Use a Closed group to collect private submissions from people who are not members of the group. Each submission becomes a separate discussion that the submitter and the group's review team can use to exchange information, ask questions, and record a decision. Submitters cannot see other private discussions or submissions in the group.
    translation: Zárt csoportban olyan emberektől is gyűjthetsz bizalmas beadványokat, akik nem tagjai a csoportnak. Minden beadványból külön beszélgetés lesz. Ebben a beküldő és a csoport bírálói információt cserélhetnek, kérdéseket tehetnek fel, és rögzíthetik a döntést. A beküldők nem láthatják a csoport többi bizalmas beszélgetését vagy beadványát.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  feb5105698bca188:
    english: Nominations are a clear use case when candidate details or the list of nominees must remain private during selection. A person can nominate themselves or someone else for an election, appointment, committee, board, or representative role, while a selection panel reviews each nomination in its own discussion.
    translation: Jelöléseket például akkor érdemes így gyűjteni, ha a kiválasztás során a jelöltek adatait vagy a jelöltek névsorát bizalmasan kell kezelni. Bárki jelölheti saját magát vagy másokat választott tisztségre, kinevezésre, bizottsági, vezetőségi vagy képviselői szerepre. A kiválasztást végző testület minden jelölést külön beszélgetésben bírálhat el.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a64597508a4f7f3d:
    english: 'Other suitable purposes where submissions should not be public include:'
    translation: 'Más esetekben is szükség lehet arra, hogy a beadványok ne legyenek nyilvánosak:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e4bd382899a8e7d9:
    english: |-
      - Complaints, safeguarding reports, safety concerns, and incident reports
      - Appeals and requests to reconsider a decision about an individual case
      - Requests for mediation, conflict resolution, or personal support
      - Applications containing personal, financial, or eligibility information, such as hardship grants or scholarships
      - Sealed bids or tender responses that must remain private during assessment
    translation: |-
      - Panaszok, veszélyeztetettséggel kapcsolatos bejelentések, biztonsági aggályok és eseményjelentések
      - Fellebbezések és egyedi ügyben hozott döntés felülvizsgálatára irányuló kérelmek
      - Közvetítésre, konfliktuskezelésre vagy személyes támogatásra irányuló kérelmek
      - Személyes, pénzügyi vagy jogosultsági adatokat tartalmazó pályázatok, például segélyekre vagy ösztöndíjakra
      - Zárt ajánlatok és pályázati válaszok, amelyeket az elbírálás során bizalmasan kell kezelni
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bab86da011a22a2a:
    english: This workflow is private between submitters, but it is not anonymous. Submitters need a user account, and every member of the Closed group can see the submissions. Consider who belongs to the review group before using it for sensitive information.
    translation: A beküldők beadványai egymás előtt bizalmasak, de a folyamat nem névtelen. A beküldőknek felhasználói fiókra van szükségük, és a Zárt csoport minden tagja láthatja a beadványokat. Érzékeny adatok gyűjtése előtt gondold át, kik tartozzanak a bírálócsoportba.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b82ae8f3f04d257f:
    english: "## Enable private submissions"
    translation: "## Bizalmas beadványok engedélyezése"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0cebe3c5801844ce:
    english: You must be an admin of the group or subgroup where you want to collect submissions.
    translation: Annak a csoportnak vagy alcsoportnak az adminisztrátorának kell lenned, amelyben a beadványokat gyűjteni szeretnéd.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  831d833d53a12ece:
    english: |-
      1. Open the group.
      2. Select **Settings** (or **More** and then **Edit group settings**).
      3. Open **Permissions**.
      4. Enable **Non-members can start discussions**.
      5. Save the group settings.
    translation: |-
      1. Nyisd meg a csoportot.
      2. Válaszd a **Beállítások** lehetőséget (vagy a **Több**, majd **A csoportbeállítások szerkesztése** lehetőséget).
      3. Nyisd meg az **Engedélyek** lapot.
      4. Kapcsold be a **Nem tagok is indíthatnak beszélgetéseket** beállítást.
      5. Mentsd el a csoportbeállításokat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f3962a27b1c4ffa8:
    english: "![The Permissions tab in group settings, with Non-members can start discussions highlighted](non_members_can_start_discussions.png)"
    translation: "![Az Engedélyek lap a csoportbeállításokban, kiemelve a Nem tagok is indíthatnak beszélgetéseket beállítással](non_members_can_start_discussions.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  99ace15d10e78f33:
    english: This option is available only for **Open** and **Closed** groups. It is hidden for **Secret** groups. If you cannot see it, open **Privacy** in the group settings and change **Group privacy** to **Closed** (recommended for private submissions) or **Open**, then return to **Permissions**.
    translation: Ez a beállítás csak **Nyitott** és **Zárt** csoportokban érhető el. **Titkos** csoportokban nem jelenik meg. Ha nem látod, nyisd meg az **Adatvédelem** lapot a csoportbeállításokban, és a **Csoport adatvédelme** értékét állítsd **Zárt** értékre (bizalmas beadványokhoz ez ajánlott) vagy **Nyitott** értékre. Ezután térj vissza az **Engedélyek** lapra.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  449517e6293a3acc:
    english: Enabling this permission does not make the group's discussions public. A non-member can start a new discussion and access that discussion as a guest, but cannot see the group's other private discussions.
    translation: Az engedély bekapcsolása nem teszi nyilvánossá a csoport beszélgetéseit. A nem tagok új beszélgetést indíthatnak, és vendégként hozzáférhetnek ahhoz a beszélgetéshez, de a csoport többi bizalmas beszélgetését nem láthatják.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  151f68a3f638fb67:
    english: "## Set up a private submission process"
    translation: "## Bizalmas beadványok gyűjtésének beállítása"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ae924433d81f5eac:
    english: |-
      1. Create a dedicated subgroup for the submission process and set its privacy to **Closed**. A subgroup keeps the submissions separate from the parent group's other work.
      2. Add the selection panel or other people responsible for reviewing submissions as members of the subgroup. Every subgroup member can see every submission, so add only people who should have that access.
      3. Create a [discussion template](/en/user_manual/discussions/templates) in the subgroup. Include the questions and information submitters should provide. You can create different discussion templates for different kinds of submissions.
      4. If submitters should not request subgroup membership, set membership to **Invitation only**.
      5. [Enable private submissions](#enable-private-submissions) in the subgroup's permissions.
      6. Test the process with an account that is not a member of the subgroup.
      7. Share the subgroup page with prospective submitters. They must sign in to their user account before making a submission.
    translation: |-
      1. Hozz létre külön alcsoportot a beadványok gyűjtéséhez, és állítsd az adatvédelmét **Zárt** értékre. Így a beadványok elkülönülnek a szülőcsoport többi munkájától.
      2. Add hozzá az alcsoport tagjaihoz a kiválasztást végző testületet vagy a beadványok elbírálásáért felelős többi embert. Az alcsoport minden tagja láthat minden beadványt, ezért csak azokat add hozzá, akiknek erre szükségük van.
      3. Hozz létre egy [beszélgetéssablont](/en/user_manual/discussions/templates) az alcsoportban. Tedd bele azokat a kérdéseket és adatkéréseket, amelyekre a beküldőknek válaszolniuk kell. Különböző típusú beadványokhoz külön sablonokat is készíthetsz.
      4. Ha nem szeretnéd, hogy a beküldők alcsoporttagságot kérhessenek, állítsd a tagságot **Csak meghívással** értékre.
      5. [Engedélyezd a bizalmas beadványokat](#enable-private-submissions) az alcsoport engedélyeinél.
      6. Próbáld ki a folyamatot egy olyan fiókkal, amely nem tagja az alcsoportnak.
      7. Oszd meg az alcsoport oldalát a lehetséges beküldőkkel. A beadvány beküldése előtt be kell jelentkezniük a felhasználói fiókjukba.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3acec1b4a6724a65:
    english: "## Make a submission"
    translation: "## Beadvány beküldése"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  58f96f48b6aacf65:
    english: The submitter opens the subgroup and selects **Start discussion**. Loomio shows the subgroup's available discussion templates. The submitter selects the relevant discussion template, completes its questions, and starts the discussion.
    translation: A beküldő megnyitja az alcsoportot, és kiválasztja a **Beszélgetés indítása** lehetőséget. A Loomio megjeleníti az alcsoportban elérhető beszélgetéssablonokat. A beküldő kiválasztja a megfelelő sablont, megválaszolja a kérdéseit, és elindítja a beszélgetést.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5a65043771edeb44:
    english: The discussion belongs to the subgroup, but the submitter does not become a subgroup member. Loomio adds them as a guest of their discussion thread, enabling them to see and participate in the discussion with the panel or review team. They cannot see other private discussions or submissions in the subgroup.
    translation: A beszélgetés az alcsoporthoz tartozik, de a beküldő nem válik az alcsoport tagjává. A Loomio vendégként adja hozzá a beszélgetéshez, így láthatja azt, és részt vehet benne a testülettel vagy a bírálókkal együtt. Az alcsoport többi bizalmas beszélgetését vagy beadványát nem láthatja.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9338fd073b26dafc:
    english: "## Review submissions"
    translation: "## Beadványok elbírálása"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  50e33fa0f0868cf5:
    english: Subgroup members can see every submission discussion in the subgroup. They can ask follow-up questions and use comments, polls, or other discussion tools to complete their review.
    translation: Az alcsoport tagjai minden beadványhoz tartozó beszélgetést láthatnak. További kérdéseket tehetnek fel, és hozzászólásokkal, szavazásokkal vagy más beszélgetési eszközökkel végezhetik el az elbírálást.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  537b76c6f85cc575:
    english: If another person needs to provide information, a subgroup member with permission can invite them to the submission discussion. For example, when a nominator submits a nomination, the subgroup can invite the nominee to the thread if their participation is required. The invited person joins as a guest without gaining access to the subgroup's other private discussions.
    translation: Ha valaki mástól is információra van szükség, egy megfelelő jogosultságú alcsoporttag meghívhatja őt a beadványhoz tartozó beszélgetésbe. Ha például valaki más személyt jelöl, az alcsoport meghívhatja a jelöltet a beszélgetésbe, ha szükség van a részvételére. A meghívott vendégként csatlakozik, és nem fér hozzá az alcsoport többi bizalmas beszélgetéséhez.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1fb7da309186b19e:
    english: Each submitter can see their own submission but cannot see the subgroup's other private discussions or submissions. Disable **Non-members can start discussions** when submissions close. Existing discussions and guest access are unchanged.
    translation: Minden beküldő láthatja a saját beadványát, de az alcsoport többi bizalmas beszélgetését vagy beadványát nem. A beküldési időszak végén kapcsold ki a **Nem tagok is indíthatnak beszélgetéseket** beállítást. A meglévő beszélgetések és a vendégek hozzáférése változatlan marad.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
