  ca092d1c3fdb9f59:
    english: 'You probably don''t want to click any of the checkboxes for now. Just enter the name (such as "Discord #general") and the URL and click the save button at the bottom of the form.'
    translation: 'Per ora lascia deselezionate le caselle. Inserisci il nome (per esempio "Discord #general") e l''URL, poi seleziona il pulsante per salvare in fondo al modulo.'
    status: machine
