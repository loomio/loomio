  519237662235d020:
    english: |-
      ### Actions per user
      Understand who are the most and least active contributors in your group.
    translation: |-
      ### Actions par utilisateur
      Repérez les personnes qui participent le plus et le moins dans votre groupe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b538bd1f65e69d28:
    english: This table shows how many threads, comments, polls, votes and reactions each user in the specified groups was responsible for during the time frame. Click specific headings in the table to sort the table by that column.
    translation: Ce tableau indique le nombre de discussions, de commentaires, de sondages, de votes et de réactions de chaque personne dans les groupes sélectionnés pendant la période choisie. Cliquez sur un en-tête pour trier le tableau selon cette colonne.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7d416ad780b3ca85:
    english: Turn on **Delegates only** to show people who are currently delegates in any of the selected groups. Their activity and voting record are aggregated across all selected groups, and delegates with no activity during the selected period remain in the table. The CSV download uses the same filter.
    translation: Activez **Délégués seulement** pour afficher les personnes qui sont actuellement déléguées dans au moins un des groupes sélectionnés. Leur activité et leurs votes sont regroupés pour l’ensemble des groupes sélectionnés. Les personnes déléguées sans activité pendant la période choisie restent dans le tableau. Le téléchargement CSV applique le même filtre.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  12baf5af62638134:
    english: "![Actions per delegate showing three levels of participation](group_participation_report_actions_per_user.png)"
    translation: "![Actions par personne déléguée montrant trois niveaux de participation](group_participation_report_actions_per_user.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1650f708482b4789:
