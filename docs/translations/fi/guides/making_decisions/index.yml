  d2843889568043c0:
    english: Use the process required by your group's governing rules or decision policy. Different kinds of decisions may use different processes.
    translation: Käytä ryhmäsi sääntöjen tai päätöksentekokäytäntöjen edellyttämää prosessia. Erilaisiin päätöksiin voidaan käyttää eri prosesseja.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bb120914edd79d13:
    english: If you only need help choosing a response format, compare [Proposals](/en/user_manual/polls/proposals/) and [Polls](/en/user_manual/polls/proposal_types/). If you administer the reusable choices shown when someone selects **Start a vote**, see [Poll templates](/en/user_manual/polls/poll_templates/).
    translation: Jos tarvitset apua vain vastausmuodon valintaan, vertaile [ehdotuksia](/en/user_manual/polls/proposals/) ja [kyselyitä](/en/user_manual/polls/proposal_types/). Jos hallinnoit uudelleenkäytettäviä vaihtoehtoja, jotka näkyvät, kun joku valitsee **Aloita äänestys**, tutustu [kyselypohjiin](/en/user_manual/polls/poll_templates/).
