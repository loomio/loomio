  980342866ab7bee6:
    english: An in-depth guide to applying key facilitation concepts in the online space.
    translation: Una guía detallada para aplicar conceptos clave de facilitación en espacios en línea.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ac8728f5ce2ea8ce:
    english: Loomio is made by facilitators, and that plays a huge role in how it has been designed. This guide is about revealing more of that context, and translating facilitation concepts from the offline space to the online space.
    translation: Loomio fue creado por personas que facilitan grupos, y esa experiencia influyó mucho en su diseño. Esta guía explica ese contexto y cómo llevar conceptos de facilitación de los encuentros presenciales a los espacios en línea.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e802660a44da1775:
    english: "## More about this guide"
    translation: "## Más sobre esta guía"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5cbd64dba51ca485:
    english: Whether employed by a professional facilitator, people peer-facilitating each other, or a group that has no awareness of facilitation at all, Loomio’s essential function is to mediate and support group communication toward a desired outcome. In other words, facilitation.
    translation: Ya sea que lo use una persona facilitadora profesional, personas que se facilitan mutuamente el trabajo o un grupo que no conoce la facilitación, la función esencial de Loomio es mediar y apoyar la comunicación del grupo para alcanzar un objetivo. En otras palabras, facilitar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  25a956280b647fa6:
    english: 'Loomio is *groupware*:'
    translation: 'Loomio es un *software colaborativo*:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  33e304be58a0a55b:
    english: "> Collaborative software, or groupware, is designed to help people involved in a common task achieve their goals. One of the earliest definitions of collaborative software is “intentional group processes plus software to support them.” -- Wikipedia"
    translation: "> El software colaborativo, o groupware, está diseñado para ayudar a las personas que trabajan en una tarea común a alcanzar sus objetivos. Una de sus primeras definiciones fue «procesos grupales intencionales más software para apoyarlos». -- Wikipedia"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  170a0b463e1ad8ca:
    english: There is a huge body of knowledge, best practice, and tradition in both in-person facilitation and online moderation, but the art and science of their intersection is only just emerging. This is the specific space where Loomio strives to excel.
    translation: Existe una amplia tradición de conocimientos y buenas prácticas tanto en la facilitación presencial como en la moderación en línea. La combinación de ambas disciplinas aún está tomando forma. Ese es el ámbito en el que Loomio busca destacar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
