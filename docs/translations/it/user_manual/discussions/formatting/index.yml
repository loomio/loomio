    translation: "### Rimuovi allegati"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ebc91823518309fd:
    english: While editing the context, click the **X** to the right of the file name to remove it.
    translation: Mentre modifichi il contesto, seleziona la **X** a destra del nome del file per rimuoverlo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b51c6da343bd6389:
