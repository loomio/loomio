  73449e09f559b4bd:
    english: Loomio is a discussion and decision making tool for collaborative organizations.
    translation: Loomio est un outil de discussion et de prise de décision pour les organisations qui travaillent ensemble.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c6d663f00c64f35d:
    english: It enables you to bring people together to discuss topics, explore proposals and make decisions.
    translation: Il vous permet de réunir des personnes pour discuter de sujets, examiner des propositions et prendre des décisions.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
