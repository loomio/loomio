  0b903e1c3c7e1862:
    english: The profile tab controls how your group is identified and introduced. Open **Edit group settings** from the group page, then select **Profile**.
    translation: На ўкладцы профілю вы можаце вызначыць, як будзе прадстаўлена ваша група. На старонцы групы адкрыйце **Рэдагаваць налады групы**, затым выберыце **Профіль**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1baaad2a0c6c8909:
    english: "![Group profile settings](group_profile.png)"
    translation: "![Налады профілю групы](group_profile.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a1c12efad8cb82f5:
    english: "## Name and handle"
    translation: "## Назва і адрасны ідэнтыфікатар"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3643c2e2ffd5db73:
    english: Choose a concise group name, particularly if the group will contain subgroups. Loomio uses the handle in the group's web address and group email address, such as `loomio.com/your-group-handle` and `your-group-handle@loomio.com`.
    translation: Выберыце кароткую назву групы, асабліва калі ў ёй будуць падгрупы. Loomio выкарыстоўвае адрасны ідэнтыфікатар у вэб-адрасе і адрасе электроннай пошты групы, напрыклад `loomio.com/your-group-handle` і `your-group-handle@loomio.com`.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5a6e298a019f6a15:
    english: When you change the handle, links using the previous handle redirect to the new address, and email sent to the previous group address continues to reach the group. Loomio retains up to three previous handles; changing the handle again after that causes the oldest one to expire.
    translation: Калі вы змяняеце адрасны ідэнтыфікатар, спасылкі са старым ідэнтыфікатарам перанакіроўваюць на новы адрас, а лісты на ранейшы адрас электроннай пошты па-ранейшаму даходзяць да групы. Loomio захоўвае да трох папярэдніх ідэнтыфікатараў. Калі пасля гэтага змяніць яго зноў, найстарэйшы перастане дзейнічаць.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2b45dd41be9c3d1d:
    english: "## Description"
    translation: "## Апісанне"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7b707620077d9d19:
    english: Use the description to explain what the group is for, who participates, and how people are expected to use it. You can format the description and include links, documents, and videos.
    translation: У апісанні раскажыце, для чаго створана група, хто ў ёй удзельнічае і як ёю карыстацца. Вы можаце фарматаваць апісанне і дадаваць спасылкі, дакументы і відэа.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  93a11a5e2927833e:
    english: The name and description may be visible to non-members depending on the group's [privacy settings](/en/user_manual/groups/settings/privacy).
    translation: Назва і апісанне могуць быць бачныя людзям, якія не ўваходзяць у групу. Гэта залежыць ад [налад прыватнасці](/en/user_manual/groups/settings/privacy) групы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0dff03268238aa26:
    english: "## Cover image and logo"
    translation: "## Вокладка і лагатып"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9d08dda635bd5ce6:
    english: The cover image appears across the top of the group page. A wide image works best; the recommended size is 2048 × 512 pixels.
    translation: Вокладка паказваецца ўверсе старонкі групы. Лепш за ўсё падыходзіць шырокая выява; рэкамендаваны памер — 2048 × 512 пікселяў.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cc04654d8d08da59:
    english: The group logo identifies the group in navigation and other compact contexts. Upload the cover image and logo separately so each can be cropped for its intended shape.
    translation: Лагатып дапамагае пазнаваць групу ў навігацыі і іншых месцах, дзе мала прасторы. Загрузіце вокладку і лагатып асобна, каб кожную выяву можна было абрэзаць пад патрэбную форму.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
