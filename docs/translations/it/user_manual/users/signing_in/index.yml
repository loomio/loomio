  3bede807c136909b:
    english: On Loomio.com, you can sign in with a passkey, your email and password, an emailed sign-in code, or Google. You can choose whichever available method is most convenient for you.
    translation: Su Loomio.com puoi accedere con una passkey, con il tuo indirizzo email e la password, con un codice di accesso ricevuto via email oppure con Google. Scegli il metodo disponibile che preferisci.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2bc2277a8ee0508d:
    english: "![The Loomio sign-in form with passkey, email, password, and emailed-code options](sign_in_email.png)"
    translation: "![Il modulo di accesso a Loomio con le opzioni passkey, email, password e codice inviato via email](sign_in_email.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e3daf63d410d5513:
    english: "## Sign in with a passkey"
    translation: "## Accedere con una passkey"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5c82bc1e8baa9f0b:
    english: Select **Use a passkey**. Your browser or device shows the Loomio passkeys available to you and asks you to unlock the selected passkey with its normal screen lock, fingerprint, face recognition, PIN, or security key. You do not enter an email address first.
    translation: Seleziona **Usa una passkey**. Il browser o il dispositivo mostra le passkey di Loomio a tua disposizione e ti chiede di sbloccare quella scelta con il normale blocco schermo, l'impronta digitale, il riconoscimento facciale, un PIN o una chiave di sicurezza. Non devi inserire prima un indirizzo email.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9386303ee98cb592:
    english: You can add, name, and remove passkeys from your profile. For security, Loomio may ask you to sign in again before changing them. Give each passkey a recognizable name such as “Work laptop” or “Phone”. Passkeys are tied to the Loomio site where they were created and may be synchronized by your device or password manager.
    translation: Puoi aggiungere, rinominare e rimuovere le passkey dal tuo profilo. Per sicurezza, Loomio potrebbe chiederti di accedere di nuovo prima di modificarle. Dai a ogni passkey un nome riconoscibile, come «Portatile di lavoro» o «Telefono». Le passkey sono legate al sito Loomio in cui sono state create e possono essere sincronizzate dal tuo dispositivo o gestore di password.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5f10999e671f9b56:
    english: "## Sign in with email and password"
    translation: "## Accedere con email e password"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5c8a380df0b08c86:
    english: Enter your email address and password, then select **Sign in**. For account privacy, Loomio uses the same error when the email or password cannot be used to sign in.
    translation: Inserisci il tuo indirizzo email e la password, poi seleziona **Iscriviti**. Per proteggere la riservatezza degli account, Loomio mostra lo stesso errore quando non è possibile accedere con l'indirizzo email o con la password.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  63c19e6f58a1de53:
    english: If you have not added a passkey, Loomio offers to add one after you sign in with a password. You can dismiss the offer, and Loomio will remember your choice.
    translation: Se non hai aggiunto una passkey, Loomio ti propone di aggiungerne una dopo che hai effettuato l'accesso con la password. Puoi ignorare la proposta e Loomio ricorderà la tua scelta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dde79982546607b4:
    english: If you do not have a password or cannot remember it, select **Send me a code** instead.
    translation: Se non hai una password o non la ricordi, seleziona **Inviami un codice**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5f3c6f8eca20d49c:
    english: "## Get a sign-in code"
    translation: "## Ottenere un codice di accesso"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9713c017e247d8e2:
    english: Select **Send me a code**, enter your email address, and submit the form. Loomio displays the same confirmation whether or not the address belongs to an account, so another person cannot use the form to discover who uses Loomio.
    translation: Seleziona **Inviami un codice**, inserisci il tuo indirizzo email e invia il modulo. Loomio mostra la stessa conferma sia che l'indirizzo appartenga a un account sia che non vi appartenga. In questo modo, nessuno può usare il modulo per scoprire chi usa Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  546aaa95b133da11:
    english: If the address belongs to your account, Loomio sends a six-digit code. Return to the sign-in form, enter the code, and select **Sign in**. Sign-in codes normally expire after 24 hours and cannot be reused. Check your spam folder if the message does not arrive, and make sure you entered the address associated with your account.
    translation: Se l'indirizzo appartiene al tuo account, Loomio invia un codice di sei cifre. Torna al modulo di accesso, inserisci il codice e seleziona **Iscriviti**. Di norma, i codici di accesso scadono dopo 24 ore e non possono essere riutilizzati. Se il messaggio non arriva, controlla la cartella dello spam e verifica di aver inserito l'indirizzo associato al tuo account.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  26171d5996050130:
    english: "![The Loomio form for entering a six-digit sign-in code](sign_in_code.png)"
    translation: "![Il modulo di Loomio per inserire un codice di accesso di sei cifre](sign_in_code.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '087809317d00494a':
    english: After each sign-in with a code, Loomio offers to set or replace your password. If your browser supports passkeys, you can also add one, even if you have already added a passkey on another device. A passkey lets you sign in quickly with your device’s fingerprint, face, or screen lock. You can skip the offer and continue using emailed codes.
    translation: Dopo ogni accesso con un codice, Loomio ti propone di impostare o sostituire la password. Se il tuo browser supporta le passkey, puoi anche aggiungerne una, anche se ne hai già aggiunta una su un altro dispositivo. Una passkey ti permette di accedere rapidamente con l'impronta digitale, il riconoscimento facciale o il blocco schermo del tuo dispositivo. Puoi ignorare la proposta e continuare a usare i codici ricevuti via email.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fa960675e8369daf:
    english: "## Create an account"
    translation: "## Creare un account"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  75fc0885f772c8cf:
    english: Select **Create account** and follow the email-verification steps.
    translation: Seleziona **Crea un account** e segui i passaggi per verificare il tuo indirizzo email.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aa461253943b989a:
    english: For privacy, use the same email address that received your group invitation. If you have accounts under more than one address, you can [merge your accounts](/en/user_manual/users/merge_accounts).
    translation: Per proteggere la tua riservatezza, usa lo stesso indirizzo email a cui hai ricevuto l'invito al gruppo. Se hai account associati a più indirizzi, puoi [unire i tuoi account](/en/user_manual/users/merge_accounts).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d9844ac27d806c35:
    english: "## Sign in with Google"
    translation: "## Accedere con Google"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8445cfcb9e9ecef5:
    english: Select **Sign in with Google** and authenticate with your Google account. If an existing Loomio account has the same email address, Loomio links the Google identity to that account.
    translation: Seleziona **Accedi con Google** e autenticati con il tuo account Google. Se esiste già un account Loomio con lo stesso indirizzo email, Loomio collega l'identità Google a quell'account.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  46281cafc4a889bf:
    english: "## Other Loomio sites"
    translation: "## Altri siti Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  23c2dffa5d5056e2:
    english: Organizations that host their own Loomio site can configure different sign-in methods. A site may offer passwords, emailed codes, passkeys, Google, SAML, or another OAuth provider alongside each other.
    translation: Le organizzazioni che ospitano un proprio sito Loomio possono configurare metodi di accesso diversi. Un sito può offrire contemporaneamente password, codici inviati via email, passkey, Google, SAML o un altro provider OAuth.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3de129c7bac50409:
    english: Some sites require an invitation before you can create an account. On these sites, **Create account** appears only when you follow an invitation link.
    translation: Alcuni siti richiedono un invito prima che tu possa creare un account. Su questi siti, **Crea un account** compare solo quando segui il link di un invito.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  16004d08bcad640b:
    english: An SSO-only private site shows only its organization sign-in option. It does not offer Loomio-managed passwords, emailed sign-in codes, native account creation, or Loomio-managed passkeys. If the organization uses passkeys, its identity provider asks for them during SSO.
    translation: Un sito privato che usa solo SSO mostra soltanto l'opzione di accesso dell'organizzazione. Non offre password o codici di accesso gestiti da Loomio e non permette di creare direttamente un account o di usare passkey gestite da Loomio. Se l'organizzazione usa le passkey, il suo provider di identità le richiede durante l'accesso SSO.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  148bcb52b49eb179:
    english: "## Sign out"
    translation: "## Uscire"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dc9ad2d75eb9da48:
    english: Open the sidebar, select your name, then select **Sign out**. On a shared computer, sign out when you finish rather than closing only the browser tab.
    translation: Apri la barra laterale, seleziona il tuo nome, poi seleziona **Esci**. Se usi un computer condiviso, esci quando hai finito invece di chiudere soltanto la scheda del browser.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
