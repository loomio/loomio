---
navigation_title: Ранг
blocks:
  92702560a3786c85:
    english: "# Rank"
    translation: "# Ранг"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7cf7aa3423ff6b9d:
    english: Rank finds the group's overall order of preference. Participants arrange options from most to least preferred, and Loomio assigns more points to higher-ranked options.
    translation: Ранг показує загальний порядок уподобань групи. Учасники розташовують варіанти від найбільш до найменш бажаного, а Loomio нараховує більше балів варіантам, які посіли вищі місця.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72790fdf21d1f129:
    english: "## When to use Rank"
    translation: "## Коли використовувати ранг"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f9ce50752bf1c1e7:
    english: 'Use Rank when preference order matters and you want one overall ordering. It works well for:'
    translation: 'Використовуйте ранг, коли важливий порядок уподобань і вам потрібен один загальний список. Він підходить для:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a5c8ee257df4dc2:
    english: |-
      - selecting one candidate for a position;
      - ordering projects for a work plan;
      - prioritizing conference topics;
      - choosing backup options as well as a first choice; or
      - reducing a long list to an ordered shortlist.
    translation: |-
      - вибору одного кандидата на посаду;
      - упорядкування проєктів для робочого плану;
      - визначення пріоритетності тем конференції;
      - вибору запасних варіантів поряд із першим вибором; або
      - скорочення довгого списку до впорядкованого короткого списку.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2549ddaa8a4a4fa8:
    english: Rank uses a points-based ordering. It is not a proportional election method. To elect several people while representing different groups of voters, use an [STV Election](/en/user_manual/polls/stv/).
    translation: Ранг упорядковує варіанти за балами. Це не метод пропорційних виборів. Щоб обрати кількох людей із представництвом різних груп виборців, використовуйте [вибори STV](/en/user_manual/polls/stv/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2a859bf73143ce12:
    english: "## Example: rank bottle designs"
    translation: "## Приклад: ранжування дизайнів пляшок"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  46a7d343d3b48bea:
    english: Oatmilk Cooperative asks members to rank four bottle designs for its returnable-bottle trial. Participants consider handling, durability, customer needs, storage, and compatibility with the washing equipment.
    translation: Кооператив Oatmilk просить учасників ранжувати чотири дизайни пляшок для пробного використання зворотної тари. Учасники враховують зручність користування, міцність, потреби клієнтів, зберігання та сумісність з обладнанням для миття.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c74ebb16f872b3c6:
    english: "## Set up the poll"
    translation: "## Налаштування опитування"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5975d0fd35ec0a7c:
    english: State what the ranking will determine and add the options. Set **Number of choices** to control how many options each person may rank. A first choice receives the most points, the next choice receives one fewer, and unranked options receive no points.
    translation: Поясніть, що визначить ранжування, і додайте варіанти. Налаштуйте **Кількість варіантів**, щоб обмежити кількість варіантів, які кожна людина може ранжувати. Перший вибір отримує найбільше балів, наступний — на один бал менше, а неранжовані варіанти не отримують балів.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  47f32c81e29fa3c6:
    english: Require all options to be ranked when you need a complete ordering. Allow fewer choices when participants may not know enough to rank everything. Showing options in random order can reduce the influence of their initial presentation.
    translation: Вимагайте ранжувати всі варіанти, якщо вам потрібен повний порядок. Дозвольте вибрати менше варіантів, якщо учасники можуть знати недостатньо, щоб ранжувати всі. Випадковий порядок показу варіантів може зменшити вплив їхнього початкового розташування.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Голосування"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  53946361c36775f0:
    english: Participants drag the options into their preferred order, with number 1 as the first choice. They can add a reason explaining the criteria behind their ranking.
    translation: Учасники перетягують варіанти в бажаному порядку. Варіант під номером 1 — їхній перший вибір. Вони можуть додати пояснення критеріїв свого ранжування.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eae63303cb9dced6:
    english: In this example, the voter puts the **500 ml amber bottle** first and the **500 ml clear bottle** second because both fit the existing cafe storage and washing equipment.
    translation: У цьому прикладі виборець ставить **бурштинову пляшку 500 мл** на перше місце, а **прозору пляшку 500 мл** — на друге, оскільки обидві підходять для наявного обладнання кафе для зберігання та миття.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Перегляд результатів"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6be27268f870dc3e:
    english: 'The results combine all ballots into an overall points-based ranking. For each option they show:'
    translation: 'Результати об’єднують усі бюлетені в загальний рейтинг за балами. Для кожного варіанта показано:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  88b912ae1b9787bc:
    english: |-
      - **Rank**: its position in the combined result;
      - **% of points**: its share of all ranking points;
      - **Points**: the total points from all ballots;
      - **Mean**: its average points per voter; and
      - **Voters**: how many people ranked it.
    translation: |-
      - **Ранг**: його місце в загальному результаті;
      - **% балів**: його частку від усіх балів ранжування;
      - **Бали**: загальну кількість балів з усіх бюлетенів;
      - **Середній**: середню кількість балів від одного виборця; та
      - **Виборці**: кількість людей, які його ранжували.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2e0cda6f79f31a51:
    english: In this example, the **500 ml amber bottle** ranks first, followed by the **500 ml clear bottle** and the **750 ml amber bottle**. The group can investigate the preferred design first while retaining the remaining order as a sequence of alternatives.
    translation: У цьому прикладі **бурштинова пляшка 500 мл** посіла перше місце, за нею — **прозора пляшка 500 мл** і **бурштинова пляшка 750 мл**. Група може спочатку розглянути дизайн, який посів перше місце, а решту варіантів залишити як впорядкований список альтернатив.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  22df687a6fa02ddb:
    english: A points-based result can conceal different preference patterns that produce the same total. Review individual ballots and vote reasons when options are close or the decision is consequential.
    translation: Однакову загальну кількість балів можуть давати різні поєднання уподобань. Якщо результати варіантів близькі або рішення має значні наслідки, перегляньте окремі бюлетені та пояснення голосів.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
