---
navigation_title: Modelos de discussão
blocks:
  80c5dfc46bb963d2:
    english: "# Discussion templates"
    translation: "# Modelos de discussão"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  488fbd5167707cba:
    english: Discussion templates help your group start discussions the same way each time. A template can supply a title, context, tags, and instructions for the person starting the discussion. It also sets defaults, such as whether to notify the whole group and which polls to suggest.
    translation: Os modelos de discussão ajudam seu grupo a iniciar discussões da mesma forma sempre. Um modelo pode fornecer título, contexto, tags e instruções para quem inicia a discussão. Ele também define opções padrão, como a notificação de todo o grupo e as enquetes sugeridas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2571bc9cc405d927:
    english: Every new discussion in a group starts from a template. When someone selects **Start discussion**, Loomio shows the group's templates. Even **Blank template** is a template, so your group can change its defaults too.
    translation: Toda nova discussão em um grupo começa com um modelo. Quando alguém seleciona **Iniciar discussão**, o Loomio mostra os modelos do grupo. Até mesmo **Modelo em branco** é um modelo, então seu grupo também pode alterar suas opções padrão.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  834ac31697ef254b:
    english: Templates work well for processes your group repeats, such as project reviews, advice processes, meeting preparation, funding decisions, or document approvals. The person starting the discussion can still edit everything before they start it.
    translation: Os modelos são úteis para processos que seu grupo repete, como avaliações de projetos, processos de consulta, preparação de reuniões, decisões de financiamento ou aprovação de documentos. Quem inicia a discussão pode editar tudo antes de criá-la.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  74d1c850f63c0518:
    english: "## How templates are used"
    translation: "## Como os modelos são usados"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6e5927441d982c01:
    english: |-
      1. A member selects **Start discussion** on the group page.
      2. Loomio lists the group's visible templates. Each one shows its title and subtitle.
      3. The member selects a template. Loomio opens the new discussion form, filled in from the template.
      4. The template's help appears at the top of the form as guidance.
      5. The member edits the title, context, tags, and invite list, then selects **Start discussion**.
    translation: |-
      1. Um membro seleciona **Iniciar discussão** na página do grupo.
      2. O Loomio lista os modelos visíveis do grupo. Cada um mostra seu título e sua legenda.
      3. O membro seleciona um modelo. O Loomio abre o formulário de nova discussão preenchido com o conteúdo do modelo.
      4. A ajuda do modelo aparece no início do formulário como orientação.
      5. O membro edita o título, o contexto, as tags e a lista de convidados. Depois, seleciona **Iniciar discussão**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  464984a60c23366b:
    english: Changing a template affects only discussions started after the change. Discussions already started from it keep their content and settings.
    translation: A alteração de um modelo afeta apenas as discussões iniciadas depois dela. As discussões já iniciadas com o modelo mantêm seu conteúdo e suas configurações.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  70c22d24ec0d248b:
    english: "## Choose who is notified by default"
    translation: "## Escolha quem recebe notificações por padrão"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  77feebf56c2ee9a7:
    english: 'The **Invite** setting controls who the new discussion form invites by default. It has two options:'
    translation: 'A configuração **Convidar** controla quem o formulário de nova discussão convida por padrão. Há duas opções:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6c93f4222436028f:
    english: |-
      - **Everyone in the group**: the group appears in the discussion form's **Invite** field, and every member is notified when the discussion starts.
      - **None**: the **Invite** field starts empty. Nobody is notified unless the author adds people.
    translation: |-
      - **Todos no grupo**: o grupo aparece no campo **Convidar** do formulário de discussão, e todos os membros recebem uma notificação quando a discussão começa.
      - **Nenhum**: o campo **Convidar** começa vazio. Ninguém recebe uma notificação, a menos que o autor adicione pessoas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  17cca49613fff23d:
    english: Loomio's built-in templates, including **Blank template**, use **Everyone in the group**. If your group does not want every new discussion to notify all members, edit the templates your group uses and set **Invite** to **None**.
    translation: Os modelos incluídos no Loomio, entre eles **Modelo em branco**, usam **Todos no grupo**. Se seu grupo não quiser notificar todos os membros a cada nova discussão, edite os modelos que usa e defina **Convidar** como **Nenhum**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5fd184e64e0605bc:
    english: The author can always change the invite list before starting the discussion. They can remove the group to notify nobody, or add specific people instead. This setting only affects notifications. Group members can still find and read the discussion in the group, whichever option you choose.
    translation: O autor sempre pode alterar a lista de convidados antes de iniciar a discussão. Pode remover o grupo para não notificar ninguém ou adicionar pessoas específicas. Essa configuração afeta apenas as notificações. Os membros ainda podem encontrar e ler a discussão no grupo, seja qual for a opção escolhida.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  58f24313ca36c890:
    english: The group is added to the invite list only when the author is allowed to notify the whole group. Admins can always do this. Members can do it when **Members can notify everyone in the group** is enabled in the group's permissions.
    translation: O grupo só é adicionado à lista de convidados quando o autor tem permissão para notificar todo o grupo. Os administradores sempre podem fazer isso. Os membros podem fazer isso quando **Os membros podem notificar todos no grupo** está habilitado nas permissões do grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  33afd174376e933b:
    english: "## Template settings"
    translation: "## Configurações do modelo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b02be20543f228a7:
    english: 'Group admins can edit a template from the action menu beside it in the template list. The form has these settings:'
    translation: 'Os administradores do grupo podem editar um modelo pelo menu de ações ao lado dele na lista de modelos. O formulário tem estas configurações:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f2fc57fe20100911:
    english: |-
      - **Template title**: the short name shown in the template list.
      - **Template subtitle**: one line explaining when to use the template.
      - **Template help**: instructions shown at the top of the new discussion form. Use it to explain the process and link to resources. It is not part of the discussion.
      - **Group**: whether the template starts a discussion in the group or a direct discussion. A direct discussion is visible only to the people invited to it.
      - **Default title**: a title filled in for each new discussion. The author can edit it.
      - **Example title**: an example shown in an empty title field. Use it when a default title would not fit every discussion.
      - **Tags**: tags applied to each new discussion. The author can remove them.
      - **Context**: the starting text of the discussion. Use headings, questions, or links to guide what people write.
      - **Invite**: whether to invite everyone in the group by default. See [Choose who is notified by default](#choose-who-is-notified-by-default).
      - **Poll templates**: polls suggested for this process. They are listed on the new discussion form. They also appear first when someone starts a poll in the discussion. They do not start automatically.
      - **Allow concurrent polls**: whether more than one poll can be open in the discussion at the same time.
      - **Comment length limit**: an optional maximum length for comments.
    translation: |-
      - **Título do modelo**: o nome curto exibido na lista de modelos.
      - **Modelo de legenda**: uma linha que explica quando usar o modelo.
      - **Ajuda de modelo**: instruções exibidas no início do formulário de nova discussão. Use esse campo para explicar o processo e incluir links para recursos. Esse conteúdo não faz parte da discussão.
      - **Grupo**: define se o modelo inicia uma discussão no grupo ou uma discussão direta. Uma discussão direta só é visível para as pessoas convidadas.
      - **Título padrão**: um título preenchido em cada nova discussão. O autor pode editá-lo.
      - **Título de exemplo**: um exemplo exibido quando o campo de título está vazio. Use essa opção quando um título padrão não servir para todas as discussões.
      - **Tags**: tags aplicadas a cada nova discussão. O autor pode removê-las.
      - **Contexto**: o texto inicial da discussão. Use títulos, perguntas ou links para orientar as contribuições das pessoas.
      - **Convidar**: define se todos no grupo são convidados por padrão. Consulte [Escolha quem recebe notificações por padrão](#choose-who-is-notified-by-default).
      - **Modelos de enquetes**: enquetes sugeridas para esse processo. Elas aparecem no formulário de nova discussão e no início da lista quando alguém cria uma enquete na discussão. Elas não começam automaticamente.
      - **Permitir votações simultâneas**: define se mais de uma enquete pode ficar aberta na discussão ao mesmo tempo.
      - **Limite de comprimento do comentário**: um limite máximo opcional para comentários.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a9e44919507a613:
    english: Use a default title only when it will stay accurate. Otherwise, write an example title that prompts the author to name the specific review, period, document, or decision.
    translation: Use um título padrão apenas quando ele continuar correto em todas as discussões. Caso contrário, escreva um título de exemplo que incentive o autor a identificar a avaliação, o período, o documento ou a decisão específica.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c5db289e27f54169:
    english: "## Example: bottle trial review"
    translation: "## Exemplo: avaliação do teste de garrafas"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  89e7b8f9b36a8ae7:
    english: Oatmilk Cooperative reviews its returnable-bottle trial after each cycle. Its template is titled "Bottle trial review" and has a default title. It adds the "Bottle trial" tag. Its context asks members to read the weekly report and consider return rates, washing records, cafe feedback, and transport costs. It recommends a Sense check followed by Consent.
    translation: A Cooperativa Leite de Aveia avalia seu teste de garrafas retornáveis após cada ciclo. Seu modelo se chama "Avaliação do teste de garrafas" e tem um título padrão. Ele adiciona a tag "Teste de garrafas". O contexto pede aos membros que leiam o relatório semanal e considerem as taxas de retorno, os registros de lavagem, os comentários das cafeterias e os custos de transporte. O modelo recomenda uma verificação de entendimento seguida de uma decisão por consentimento.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f896031f8dcc2f84:
    english: This works as a template because the purpose and evidence stay the same each cycle. Only the observations and decisions change.
    translation: Esse processo funciona como modelo porque o objetivo e as informações analisadas são os mesmos em cada ciclo. Apenas as observações e as decisões mudam.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7e5955c442f6c8ae:
    english: "## Create a template"
    translation: "## Crie um modelo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c2b2bc41cbe6f6a:
    english: Group admins can select **New template** from the template list. Choose an example from Loomio's gallery or start with a blank template, then adapt it and save it.
    translation: Os administradores do grupo podem selecionar **Novo modelo** na lista de modelos. Escolha um exemplo da galeria do Loomio ou comece com um modelo em branco. Depois, adapte e salve o modelo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a9cb80d574e2d865:
    english: You can search or filter the gallery. An example is not added to your group until you save it.
    translation: Você pode pesquisar ou filtrar a galeria. Um exemplo só é adicionado ao seu grupo quando você o salva.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1f0dab3f50320e75:
    english: "## Manage the template list"
    translation: "## Gerencie a lista de modelos"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7462593f2f6d1614:
    english: When a group is created, Loomio adds a set of templates suited to the kind of group. Only **Blank template** and **Practice discussion** are visible at first. The others are hidden, and admins can unhide them.
    translation: Quando um grupo é criado, o Loomio adiciona modelos adequados ao tipo de grupo. No início, apenas **Modelo em branco** e **Discussão prática** ficam visíveis. Os outros ficam ocultos, e os administradores podem torná-los visíveis.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e6f7eaa63e353ef7:
    english: 'Group admins can use the action menu beside a template to:'
    translation: 'Os administradores do grupo podem usar o menu de ações ao lado de um modelo para:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e8767178e42cd4e0:
    english: |-
      - edit its content and settings;
      - hide it from the template list;
      - unhide it from **Hidden templates**;
      - rearrange the order of visible templates;
      - export it as a JSON file; or
      - delete it.
    translation: |-
      - editar seu conteúdo e suas configurações;
      - ocultá-lo da lista de modelos;
      - torná-lo visível em **Modelos ocultos**;
      - reorganizar a ordem dos modelos visíveis;
      - exportá-lo como arquivo JSON; ou
      - excluí-lo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5d4cbc918551c211:
    english: Hiding a template keeps it for later use. Deleting a template does not delete discussions started from it.
    translation: Um modelo oculto continua disponível para uso futuro. Excluir um modelo não exclui as discussões iniciadas com ele.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c0ae844752e20ef:
    english: "## Share templates between groups"
    translation: "## Compartilhe modelos entre grupos"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  acf646688b9b79f4:
    english: Select **Export json** in a template's action menu to download it as a file. To use it in another group, select **New template**, then **Import json**. The form opens with the imported content so you can review it before saving.
    translation: Selecione **Exportar JSON** no menu de ações de um modelo para baixá-lo como arquivo. Para usá-lo em outro grupo, selecione **Novo modelo** e depois **Importar JSON**. O formulário abre com o conteúdo importado para que você possa revisá-lo antes de salvar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a168253bda3147e8:
    english: Links to custom poll templates are not included in the file. Export and import those poll templates separately.
    translation: Os links para modelos personalizados de enquetes não são incluídos no arquivo. Exporte e importe esses modelos de enquetes separadamente.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4833d57d46ccb98e:
    english: "## Let members create templates"
    translation: "## Permita que membros criem modelos"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1ac138e713feea59:
    english: By default, only group admins can create and edit templates. An admin can enable **Members can create templates** under **Group settings** → **Permissions**.
    translation: Por padrão, apenas os administradores do grupo podem criar e editar modelos. Um administrador pode habilitar **Os membros podem criar modelos.** em **Configurações do grupo** → **Permissões**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  889e8792d7937424:
    english: When this is enabled, members can create discussion and poll templates and edit the templates they created. Admins can edit every template in the group. A member's template appears in the group's template list once it is saved, so agree on naming and review practices before enabling this permission.
    translation: Quando essa permissão está habilitada, os membros podem criar modelos de discussão e de enquetes e editar os modelos que criaram. Os administradores podem editar todos os modelos do grupo. O modelo de um membro aparece na lista do grupo assim que é salvo. Por isso, combine como os modelos serão nomeados e revisados antes de habilitar essa permissão.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1284dfc3e68170d8:
    english: "## Templates for non-members"
    translation: "## Modelos para quem não é membro"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5c701c3795724027:
    english: If **Non-members can start discussions** is enabled, people outside the group choose from the same template list. Their discussion form never invites the group by default. See [Collect private submissions](/en/user_manual/discussions/private_submissions).
    translation: Se **Quem não é membro pode iniciar discussões.** está habilitado, pessoas de fora do grupo escolhem entre os mesmos modelos. O formulário de discussão delas nunca convida o grupo por padrão. Consulte [Receba contribuições privadas](/en/user_manual/discussions/private_submissions).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  630a5d69a7093105:
    english: "## Related"
    translation: "## Páginas relacionadas"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
