---
navigation_title: Névtelen szavazás
blocks:
  b4e842083054a400:
    english: "# Anonymous voting"
    translation: "# Névtelen szavazás"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9b5c46644a952388:
    english: Anonymous voting, also known as blind voting, separates the record of who has voted from the votes themselves. Poll coordinators can see who was eligible and, once at least three people have voted, verify participation. Application users cannot connect a submitted vote with the person who submitted it.
    translation: A névtelen szavazás, más néven titkos szavazás, elkülöníti a részvételi adatokat a leadott szavazatoktól. A szavazás koordinátorai láthatják, kik szavazhattak, és ha már legalább hárman szavaztak, ellenőrizhetik a részvételt. Az alkalmazás felhasználói nem tudják összekapcsolni a leadott szavazatot azzal, aki leadta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  105abff68025f002:
    english: This page explains the protections provided by anonymous voting, the information that is retained, and the limits of the guarantee.
    translation: Ez az oldal bemutatja, hogyan védi a szavazókat a névtelen szavazás, milyen adatok maradnak meg, és hol vannak a védelem korlátai.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6d97c8b835a3f1f2:
    english: "## How anonymous voting protects voters"
    translation: "## Hogyan védi a névtelen szavazás a szavazókat"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e01d5c77096b953e:
    english: 'An anonymous poll keeps two separate sets of records:'
    translation: 'A névtelen szavazás két külön adathalmazt tart fenn:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  757ab56b1165a71d:
    english: |-
      | Participation records | Submitted votes |
      | --- | --- |
      | Who is eligible to vote | The selected options or scores |
      | Who was invited, and by whom | The poll the vote belongs to |
      | Whether each eligible person has voted | No name or user account |
      | No selected options or scores | No link to a participation record |
    translation: |-
      | Részvételi adatok | Leadott szavazatok |
      | --- | --- |
      | Ki szavazhat | A kiválasztott lehetőségek vagy pontszámok |
      | Kit hívtak meg, és ki hívta meg | Melyik szavazáshoz tartozik a szavazat |
      | Szavazott-e az adott személy | Nincs név vagy felhasználói fiók |
      | Nincsenek kiválasztott lehetőségek vagy pontszámok | Nincs kapcsolat a részvételi adatokkal |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b908c49acc827932:
    english: There is no shared identifier that connects these records. Submitted votes also omit the actual submission time, invitation information, written reasons, attachments, and other metadata that could help identify a voter.
    translation: Nincs olyan közös azonosító, amely összekötné ezeket az adatokat. A leadott szavazatok nem tartalmazzák a leadás pontos idejét, a meghívási adatokat, az írásos indoklásokat, a mellékleteket és más olyan metaadatokat sem, amelyek segíthetnének azonosítani a szavazót.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6430a3d863d135b6:
    english: This separation is enforced when the vote is stored. It does not depend only on hiding names in the interface.
    translation: Az elkülönítés már a szavazat tárolásakor megtörténik. A védelem nem pusztán azon múlik, hogy a felület elrejti a neveket.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b8e31aef3d559f28:
    english: "## While voting is open"
    translation: "## Amíg tart a szavazás"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f905c85734898a41:
    english: Results remain hidden from everyone until the poll closes. This includes poll coordinators, group administrators, and instance administrators using the application.
    translation: Az eredmények a szavazás lezárásáig mindenki elől rejtve maradnak. Ez a szavazás koordinátoraira, a csoportadminisztrátorokra és az alkalmazást használó példányadminisztrátorokra is vonatkozik.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  828df5247b61c9e6:
    english: 'When someone votes:'
    translation: 'Amikor valaki szavaz:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  69b471d43b2148a1:
    english: |-
      - their submitted vote is stored without their name or participation record;
      - their participation record is marked to show that they have voted;
      - no vote event, notification, email, comment, or activity entry is created;
      - no copy of their selections is returned after submission; and
      - the interface confirms only that their vote was recorded.
    translation: |-
      - a szavazatát a neve és a részvételi adatai nélkül tárolja a rendszer;
      - a részvételi adatai jelzik, hogy szavazott;
      - nem jön létre szavazási esemény, értesítés, e-mail, hozzászólás vagy aktivitási bejegyzés;
      - a leadás után nem kap másolatot a választásairól; és
      - a felület csak azt erősíti meg, hogy a szavazatát rögzítette a rendszer.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4ffe4b38db135dab:
    english: The participation record does not store a precise time for when the person voted. Submitted votes are not ordered by submission time.
    translation: A részvételi adatok nem tárolják pontosan, mikor szavazott az adott személy. A leadott szavazatok nem a leadás ideje szerint vannak rendezve.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7acaf6b48fc42105:
    english: "## Votes cannot be changed"
    translation: "## A szavazatok nem módosíthatók"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  996ef90a3eee857b:
    english: Each eligible person can vote once. A submitted anonymous vote cannot be reviewed, changed, withdrawn, or replaced, including by a coordinator or administrator.
    translation: Minden szavazásra jogosult személy egyszer szavazhat. A leadott névtelen szavazatot senki sem tekintheti meg, módosíthatja, vonhatja vissza vagy cserélheti le, a koordinátorok és az adminisztrátorok sem.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  58f0aaa6a45c1d37:
    english: Allowing a person to retrieve or replace their vote would require a persistent link between that person and the vote. Anonymous voting deliberately does not create that link.
    translation: Ahhoz, hogy valaki később előhívhassa vagy lecserélhesse a szavazatát, tartós kapcsolatot kellene fenntartani közte és a szavazata között. A névtelen szavazás szándékosan nem hoz létre ilyen kapcsolatot.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2fd2c9d6ab0d6f68:
    english: Review your selections carefully before submitting.
    translation: Leadás előtt gondosan nézd át a választásaidat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  59f83c0e359484c4:
    english: "## Why anonymous votes do not have reasons"
    translation: "## Miért nincs indoklás a névtelen szavazatokhoz"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  89f9d9a1d4bcb395:
    english: New anonymous votes cannot include a written reason or an attachment. Reasons can contain names, personal details, writing patterns, mentions, or other information that identifies the voter. They would also make individual votes easier to distinguish from the aggregate result.
    translation: Az új névtelen szavazatokhoz nem lehet írásos indoklást vagy mellékletet csatolni. Az indoklás tartalmazhat neveket, személyes adatokat, felismerhető írásmódot, említéseket vagy más, a szavazót azonosító információt. Az egyes szavazatokat is könnyebben megkülönböztethetővé tenné az összesített eredménytől.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  932f88aa929fb4eb:
    english: Participants can still discuss the poll in its thread where discussion is available. Those comments are ordinary named discussion contributions and are not attached to an anonymous vote.
    translation: A résztvevők továbbra is megvitathatják a szavazást a hozzá tartozó témában, ha ott lehetőség van hozzászólni. Ezek a hozzászólások névvel megjelenő, szokásos beszélgetési bejegyzések, és nem kapcsolódnak a névtelen szavazathoz.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1b21c2826270bd52:
    english: "## Results and exports"
    translation: "## Eredmények és exportálás"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  afc45e50b74e075b:
    english: After the poll closes, the results are calculated from the detached votes and displayed as totals and other aggregate results supported by the poll type.
    translation: A szavazás lezárása után a rendszer az elkülönített szavazatokból számítja ki az eredményeket. Ezeket összesítve, valamint a szavazás típusának megfelelő más összesített eredményekkel együtt jeleníti meg.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b28c82ffcb4ffeb5:
    english: The application does not publish vote identifiers, submission order, or submission times. Poll exports contain aggregate results rather than a row for each anonymous vote, except that a closed STV election can be exported in BLT format. A BLT export contains the candidate rankings needed to recount the election, grouped when multiple ballots have the same ranking, without voter identities or ballot metadata.
    translation: Az alkalmazás nem teszi közzé a szavazatok azonosítóit, leadási sorrendjét vagy leadási idejét. A szavazások exportja összesített eredményeket tartalmaz, nem külön sort minden névtelen szavazathoz. Kivétel a lezárt STV-választás, amely BLT-formátumban exportálható. A BLT-export tartalmazza a választás újraszámlálásához szükséges jelöltsorrendeket. Az azonos sorrendű szavazólapokat csoportosítja, és nem tartalmazza a szavazók személyazonosságát vagy a szavazólapok metaadatait.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8088fc78d955e9bb:
    english: An anonymous poll cannot be reopened after it closes.
    translation: A lezárt névtelen szavazást nem lehet újranyitni.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c368b542923cd542:
    english: "## Participation verification"
    translation: "## A részvétel ellenőrzése"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ab086d63c01514bf:
    english: Poll coordinators can view the named participation records. These always show who was eligible. Once at least three people have voted, they also show whether each person voted, but never show how anyone voted. If a poll closes with fewer than three votes, the participation status remains hidden.
    translation: A szavazás koordinátorai megtekinthetik a névvel ellátott részvételi adatokat. Ezek mindig megmutatják, kik szavazhattak. Ha már legalább hárman szavaztak, azt is megmutatják, hogy az egyes személyek szavaztak-e, de azt soha, hogy hogyan szavaztak. Ha a szavazás háromnál kevesebb szavazattal zárul, a részvételi állapot rejtve marad.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dcad5d728e5e7cfd:
    english: Other participants cannot view this named participation information. Access to poll results does not grant access to the participation records.
    translation: A többi résztvevő nem láthatja ezeket a névvel ellátott részvételi adatokat. A szavazás eredményeihez való hozzáférés nem ad hozzáférést a részvételi adatokhoz.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  37cf06402ac47fa2:
    english: |-
      Coordinators can add eligible people while voting remains open, including after
      other people have voted. Existing voters cannot be removed from an anonymous
      poll.
    translation: |-
      A koordinátorok a szavazás ideje alatt további szavazásra jogosult személyeket adhatnak hozzá, akkor is, ha
      mások már szavaztak. A már szavazó személyeket nem lehet eltávolítani a névtelen
      szavazásból.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  705e9b807681f6c1:
    english: "## Reminders"
    translation: "## Emlékeztetők"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8ef8b501a1b27f63:
    english: For an anonymous poll lasting at least 24 hours, eligible people who have not voted receive one automatic reminder during the final 24 hours.
    translation: A legalább 24 órán át tartó névtelen szavazásnál a még nem szavazó jogosultak egy automatikus emlékeztetőt kapnak az utolsó 24 órában.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b23e579a8ef628de:
    english: The reminder is selected from participation records only. It does not inspect submitted votes or create a connection to them. If the deadline changes, the hourly reminder check uses the current deadline without maintaining a separate scheduled reminder for the poll.
    translation: Az emlékeztető címzettjeit a rendszer kizárólag a részvételi adatok alapján választja ki. Nem vizsgálja a leadott szavazatokat, és nem hoz létre kapcsolatot velük. Ha módosul a határidő, az óránkénti ellenőrzés az aktuális határidőt használja; a szavazáshoz nem tart fenn külön időzített emlékeztetőt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  053ce04ce5f98ed8:
    english: Polls with a total voting period of less than 24 hours do not send this automatic reminder.
    translation: A 24 óránál rövidebb szavazási időszakú szavazásokhoz nem küld automatikus emlékeztetőt a rendszer.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fb1f13e60fe178fe:
    english: "## What coordinators and administrators can see"
    translation: "## Mit láthatnak a koordinátorok és az adminisztrátorok"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e59c22e94231a746:
    english: 'Through the application, a poll coordinator, group administrator, or instance administrator may be able to see:'
    translation: 'Az alkalmazásban a szavazás koordinátora, egy csoportadminisztrátor vagy egy példányadminisztrátor a jogosultságaitól függően láthatja:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2da6b1feaa8b36f1:
    english: |-
      - the poll and its eligible voters;
      - whether each eligible person has voted, where their role permits access and at least three people have voted; and
      - aggregate results after the poll closes.
    translation: |-
      - a szavazást és a szavazásra jogosult személyeket;
      - hogy az egyes jogosultak szavaztak-e, ha a szerepkörük ezt lehetővé teszi, és már legalább hárman szavaztak; és
      - a szavazás lezárása után az összesített eredményeket.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6a96a87699625dc6:
    english: 'They cannot use application features to see:'
    translation: 'Az alkalmazás funkcióival nem láthatják:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dd4756253d1ee6dc:
    english: |-
      - which selections belong to a person;
      - individual votes or voting patterns;
      - when a particular vote was submitted; or
      - a reason, attachment, event, or notification associated with a submitted vote.
    translation: |-
      - hogy mely választások tartoznak egy adott személyhez;
      - az egyes szavazatokat vagy szavazási mintázatokat;
      - hogy egy adott szavazatot mikor adtak le; vagy
      - a leadott szavazathoz kapcsolódó indoklást, mellékletet, eseményt vagy értesítést.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c350875c33492237:
    english: "## Limits of anonymous voting"
    translation: "## A névtelen szavazás korlátai"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  48d04d7b4817e710:
    english: These protections prevent application users from linking a submitted vote to its voter. They are not a cryptographic protection against an operator who can inspect the database, backups, server logs, process memory, network traffic, or a modified version of the application.
    translation: Ezek a védelmek megakadályozzák, hogy az alkalmazás felhasználói összekapcsolják a leadott szavazatot a szavazóval. Nem nyújtanak kriptográfiai védelmet olyan üzemeltetővel szemben, aki hozzáfér az adatbázishoz, a biztonsági mentésekhez, a szervernaplókhoz, a folyamatmemóriához, a hálózati forgalomhoz vagy az alkalmazás módosított változatához.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f901f505362e46b4:
    english: The result itself may also reveal information. A small electorate, a unanimous result, a distinctive combination of selections, or information shared outside the poll can make a person's choices easier to infer. Voters may also choose to identify themselves in discussion outside their submitted vote.
    translation: Maga az eredmény is árulkodhat. Kevés szavazó, egyhangú eredmény, a választások jellegzetes kombinációja vagy a szavazáson kívül megosztott információk alapján könnyebb lehet kikövetkeztetni valakinek a döntését. A szavazók a leadott szavazatuktól független beszélgetésben maguk is felfedhetik kilétüket.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dfe97db86db52d15:
    english: Consider the size of the electorate and the sensitivity of the decision when deciding whether application-level anonymous voting is suitable.
    translation: Amikor eldöntöd, hogy megfelelő-e az alkalmazáson belüli névtelen szavazás, vedd figyelembe a szavazók számát és a döntés érzékenységét.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  60cc6f1a0163ec5d:
    english: "## Questions"
    translation: "## Kérdések"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  57615f2c4c040dce:
    english: "### Can a coordinator see how I voted?"
    translation: "### Láthatja a szavazás koordinátora, hogyan szavaztam?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9dc1d151cc90e94e:
    english: No. Once at least three people have voted, a coordinator can verify whether you voted but cannot connect you with a submitted vote through the application. Below that threshold, your participation status remains hidden.
    translation: Nem. Ha legalább hárman szavaztak, a koordinátor ellenőrizheti, hogy szavaztál-e, de az alkalmazásban nem kapcsolhatja össze a személyedet a leadott szavazatoddal. Három szavazat alatt az sem látható, hogy szavaztál-e.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b3b382d2575b715d:
    english: "### Can I see my vote after submitting it?"
    translation: "### Megnézhetem a szavazatomat a leadása után?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  52aaaa1c764d5745:
    english: No. The application confirms that your vote was recorded, then discards the selections from the voting interface. It cannot retrieve your vote without creating the link that anonymous voting is designed to avoid.
    translation: Nem. Az alkalmazás visszajelzi, hogy rögzítette a szavazatodat, majd eltávolítja a választásaidat a szavazási felületről. A szavazatodat csak akkor tudná visszakeresni, ha létrehozná azt a kapcsolatot, amelyet a névtelen szavazás kizár.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  071dd89d6eb38ebf:
    english: "### Can I change or withdraw my vote?"
    translation: "### Megváltoztathatom vagy visszavonhatom a szavazatomat?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '059b75c51b4225ab':
    english: No. There is no link that would let the application identify which submitted vote to change or remove.
    translation: Nem. Nincs olyan kapcsolat a személyed és a szavazatod között, amely alapján az alkalmazás azonosíthatná, melyik leadott szavazatot kell módosítani vagy eltávolítani.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c94077837455425f:
    english: "### Will I receive an email confirming my vote?"
    translation: "### Kapok e-mailes visszaigazolást a szavazatomról?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f36a8b43a3fdee36:
    english: No. Voting creates only the on-screen acknowledgement and updates your participation record. It does not send a confirmation email or create a notification or activity event.
    translation: Nem. Szavazáskor csak a képernyőn jelenik meg visszajelzés, és frissül a részvételi nyilvántartásod. Az alkalmazás nem küld visszaigazoló e-mailt, és nem hoz létre értesítést vagy tevékenységi eseményt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f320754cf7ee77bc:
    english: "### Does a public poll reveal more information?"
    translation: "### Több információt fed fel egy nyilvános szavazás?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f84121f0c18e03ab:
    english: Public access may allow people to see the poll and its aggregate results after it closes. It does not expose the named participation records or individual anonymous votes.
    translation: A nyilvános hozzáférés lehetővé teheti, hogy mások megtekintsék a szavazást és a lezárás után az összesített eredményeket. A névvel ellátott részvételi nyilvántartást és az egyes névtelen szavazatokat nem teszi hozzáférhetővé.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
