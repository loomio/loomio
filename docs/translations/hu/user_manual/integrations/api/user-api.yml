---
navigation_title: Felhasználói API
blocks:
  0217b93dddc627ac:
    english: "# Loomio User API documentation"
    translation: "# A Loomio felhasználói API dokumentációja"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bc6fcbf5f783fd29:
    english: "<!-- seo-description: Use the Loomio User API to create and manage discussions, comments, polls, threads, and group memberships from other software. -->"
    translation: "<!-- seo-description: A Loomio felhasználói API-jával más szoftverekből hozhatsz létre és kezelhetsz beszélgetéseket, hozzászólásokat, szavazásokat, szálakat és csoporttagságokat. -->"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cc2da08540808ada:
    english: "`/api/b2` is the user-oriented API for integrations with Loomio. It uses the API key of a user account, and every action is performed as that user."
    translation: A `/api/b2` a Loomióval való integrációkhoz készült felhasználói API. Egy felhasználói fiók API-kulcsát használja, és minden műveletet az adott felhasználó nevében hajt végre.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7036a6661aac00f2:
    english: Group operations use the memberships and group permissions of the API-key user. Instance-administrator status does not expand an API key's access to groups or content; use the Server API for instance-level administration.
    translation: A csoportműveleteknél az API-kulcs tulajdonosának tagságai és csoportjogosultságai érvényesek. A példányadminisztrátori szerepkör nem ad az API-kulcsnak további hozzáférést csoportokhoz vagy tartalmakhoz. A példány szintű adminisztrációhoz használd a Server API-t.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c4436493b062b9f1:
    english: Use the API key from the Loomio user account that will perform the actions. A dedicated bot account is useful when an integration should not be invited to polls or receive notifications.
    translation: Annak a Loomio-fióknak az API-kulcsát használd, amelynek nevében a műveleteket végre szeretnéd hajtani. Külön botfiók hasznos, ha az integrációt nem szeretnéd szavazásokra meghívni, vagy nem szeretnéd, hogy értesítéseket kapjon.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ade21c593f08100c:
    english: Signed-in users can find their API key and group IDs on the [API access page](/profile/api_access).
    translation: Bejelentkezés után az API-kulcsodat és a csoportazonosítókat az [API-hozzáférési oldalon](/profile/api_access) találod.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  15160edafaf441c1:
    english: 'Send the API key in an `Authorization: Bearer` header. API keys in query strings are rejected because URLs can be recorded by proxies and access logs.'
    translation: 'Az API-kulcsot az `Authorization: Bearer` fejlécben küldd el. A lekérdezési karakterláncban megadott API-kulcsokat a rendszer elutasítja, mert az URL-eket a proxyk és a hozzáférési naplók rögzíthetik.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2215e57186277325:
    english: "### Authentication change"
    translation: "### A hitelesítés változása"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ff5f4c1055e80fb6:
    english: 'The API key was previously accepted as an `api_key` URL parameter. Requests using `?api_key=YOUR_API_KEY` no longer work. Use the HTTP `Authorization` header instead:'
    translation: 'Korábban az API-kulcsot `api_key` URL-paraméterként is meg lehetett adni. A `?api_key=YOUR_API_KEY` paramétert használó kérések már nem működnek. Helyette a HTTP `Authorization` fejlécet használd:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  65574ba500243c80:
    english: The examples use `YOUR_API_KEY`, group ID `123`, and `https://www.loomio.com/`. Replace these with your API key, group ID, and Loomio installation URL.
    translation: A példákban a `YOUR_API_KEY` API-kulcs, a `123` csoportazonosító és a `https://www.loomio.com/` URL szerepel. Cseréld ki ezeket a saját API-kulcsodra, csoportazonosítódra és a Loomio-telepítésed URL-jére.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bec1e4f30aeef4ce:
    english: "## Response size and related records"
    translation: "## Válaszméret és kapcsolódó rekordok"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  da004eb4e005fae1:
    english: 'User API responses use a compound format: the primary records are accompanied by related records such as topics, groups, users, polls, and reactions. This lets a client populate a local record store from one request, but can include more data than a simple integration needs.'
    translation: 'A felhasználói API válaszai összetett formátumúak: az elsődleges rekordok mellett kapcsolódó rekordokat is tartalmaznak, például témákat, csoportokat, felhasználókat, szavazásokat és reakciókat. Így a kliens egyetlen kérésből feltöltheti a helyi rekordtárát, de a válasz több adatot tartalmazhat, mint amennyire egy egyszerű integrációnak szüksége van.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  64d9a631b54cbaba:
    english: Pass `compact=1` to omit bulky related topics, groups, parent groups, memberships, reactions, tags, and translations. Primary records and the related records needed to interpret their content remain present.
    translation: A `compact=1` paraméterrel kihagyhatod a nagy méretű kapcsolódó témákat, csoportokat, szülőcsoportokat, tagságokat, reakciókat, címkéket és fordításokat. Az elsődleges rekordok és a tartalmuk értelmezéséhez szükséges kapcsolódó rekordok megmaradnak.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e4e671db39dbe6f1:
    english: For direct control, pass `exclude_types` with space-separated singular record types. For example, `exclude_types=group reaction` omits related groups and reactions. Common values are `topic`, `group`, `parent`, `membership`, `reaction`, `tag`, `translation`, `user`, `discussion`, `poll`, `poll_option`, `stance`, `stance_choice`, `outcome`, and `topic_item`. Exclusions apply to related records, not the primary resource requested by the endpoint.
    translation: 'Ha pontosan szeretnéd szabályozni a választ, add meg az `exclude_types` paraméterben az egyes számú rekordtípusokat szóközzel elválasztva. Például az `exclude_types=group reaction` kihagyja a kapcsolódó csoportokat és reakciókat. Gyakori értékek: `topic`, `group`, `parent`, `membership`, `reaction`, `tag`, `translation`, `user`, `discussion`, `poll`, `poll_option`, `stance`, `stance_choice`, `outcome` és `topic_item`. A kizárás a kapcsolódó rekordokra vonatkozik, nem a végponttól kért elsődleges erőforrásra.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ded075da3c2aa815:
    english: Collection responses include `meta.total` when an exact collection size is defined. The total is calculated before `limit` and `offset` are applied. Endpoints such as search that intentionally return a bounded result set omit `meta.total` rather than returning `null`.
    translation: A gyűjteményt visszaadó válaszok tartalmazzák a `meta.total` értéket, ha a gyűjtemény pontos mérete meghatározható. Az összesítést a `limit` és az `offset` alkalmazása előtt számítja ki a rendszer. Azok a végpontok, például a keresés, amelyek szándékosan korlátozott eredményhalmazt adnak vissza, kihagyják a `meta.total` mezőt ahelyett, hogy `null` értéket adnának vissza.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  17cb8ef90a2acdb3:
    english: "## Endpoint summary"
    translation: "## Végpontok áttekintése"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  608edb13080e57c2:
    english: |-
      | Method | Endpoint | Purpose |
      | --- | --- | --- |
      | `GET` | `/api/b2/groups` | List the API-key user's groups |
      | `GET` | `/api/b2/groups/:id_or_key_or_handle` | Get a visible group |
      | `GET` | `/api/b2/reports` | Generate a participation report |
      | `GET` | `/api/b2/search` | Search visible discussions, comments, polls, votes, and outcomes |
      | `POST` | `/api/b2/discussions` | Create a discussion |
      | `GET` | `/api/b2/discussions/:id` | Get a discussion |
      | `GET` | `/api/b2/discussions` | List discussions in a group |
      | `PATCH` | `/api/b2/discussions/:id` | Edit a discussion |
      | `DELETE` | `/api/b2/discussions/:id` | Soft-delete a discussion |
      | `GET` | `/api/b2/threads` | List visible discussion and standalone-poll threads |
      | `GET` | `/api/b2/threads/:topic_id` | Get a thread |
      | `GET` | `/api/b2/threads/:topic_id/items` | Get the ordered items in a thread |
      | `GET` | `/api/b2/threads/:topic_id/markdown` | Get a complete thread as Markdown |
      | `POST` | `/api/b2/comments` | Create a comment or reply |
      | `PATCH` | `/api/b2/comments/:id` | Edit a comment |
      | `DELETE` | `/api/b2/comments/:id` | Soft-delete a comment |
      | `POST` | `/api/b2/polls` | Create a poll |
      | `GET` | `/api/b2/polls/:id` | Get a poll |
      | `GET` | `/api/b2/polls` | List polls in a group |
      | `PATCH` | `/api/b2/polls/:id` | Edit a poll |
      | `DELETE` | `/api/b2/polls/:id` | Soft-delete a poll |
      | `GET` | `/api/b2/memberships` | List a group's memberships |
      | `POST` | `/api/b2/memberships` | Add members and optionally remove absent members |
      | `GET` | `/api/b2/chatbots` | List a group's chat integrations and webhooks |
      | `POST` | `/api/b2/chatbots` | Create a chat integration or webhook |
      | `PATCH` | `/api/b2/chatbots/:id` | Update a chat integration or webhook |
      | `DELETE` | `/api/b2/chatbots/:id` | Delete a chat integration or webhook |
      | `POST` | `/api/b2/chatbots/check` | Send a webhook connection test |
    translation: |-
      | Metódus | Végpont | Cél |
      | --- | --- | --- |
      | `GET` | `/api/b2/groups` | Az API-kulcs tulajdonosához tartozó csoportok listázása |
      | `GET` | `/api/b2/groups/:id_or_key_or_handle` | Egy látható csoport lekérése |
      | `GET` | `/api/b2/reports` | Részvételi jelentés készítése |
      | `GET` | `/api/b2/search` | Keresés a látható beszélgetések, hozzászólások, szavazások, leadott szavazatok és következtetések között |
      | `POST` | `/api/b2/discussions` | Beszélgetés létrehozása |
      | `GET` | `/api/b2/discussions/:id` | Beszélgetés lekérése |
      | `GET` | `/api/b2/discussions` | Egy csoport beszélgetéseinek listázása |
      | `PATCH` | `/api/b2/discussions/:id` | Beszélgetés szerkesztése |
      | `DELETE` | `/api/b2/discussions/:id` | Beszélgetés logikai törlése |
      | `GET` | `/api/b2/threads` | Látható beszélgetésszálak és önálló szavazási szálak listázása |
      | `GET` | `/api/b2/threads/:topic_id` | Szál lekérése |
      | `GET` | `/api/b2/threads/:topic_id/items` | Egy szál elemeinek lekérése sorrendben |
      | `GET` | `/api/b2/threads/:topic_id/markdown` | Teljes szál lekérése Markdown-formátumban |
      | `POST` | `/api/b2/comments` | Hozzászólás vagy válasz létrehozása |
      | `PATCH` | `/api/b2/comments/:id` | Hozzászólás szerkesztése |
      | `DELETE` | `/api/b2/comments/:id` | Hozzászólás logikai törlése |
      | `POST` | `/api/b2/polls` | Szavazás létrehozása |
      | `GET` | `/api/b2/polls/:id` | Szavazás lekérése |
      | `GET` | `/api/b2/polls` | Egy csoport szavazásainak listázása |
      | `PATCH` | `/api/b2/polls/:id` | Szavazás szerkesztése |
      | `DELETE` | `/api/b2/polls/:id` | Szavazás logikai törlése |
      | `GET` | `/api/b2/memberships` | Egy csoport tagságainak listázása |
      | `POST` | `/api/b2/memberships` | Tagok hozzáadása és szükség esetén a listából hiányzó tagok eltávolítása |
      | `GET` | `/api/b2/chatbots` | Egy csoport csevegési integrációinak és webhookjainak listázása |
      | `POST` | `/api/b2/chatbots` | Csevegési integráció vagy webhook létrehozása |
      | `PATCH` | `/api/b2/chatbots/:id` | Csevegési integráció vagy webhook frissítése |
      | `DELETE` | `/api/b2/chatbots/:id` | Csevegési integráció vagy webhook törlése |
      | `POST` | `/api/b2/chatbots/check` | Webhook-kapcsolat tesztelése |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0473f1f7fb78f074:
    english: "## Groups"
    translation: "## Csoportok"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dc819221f371c435:
    english: "### List groups"
    translation: "### Csoportok listázása"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  964f575e90aa9cde:
    english: Return the groups in which the API-key user has an active membership.
    translation: Azoknak a csoportoknak a lekérése, amelyekben az API-kulcs tulajdonosának aktív tagsága van.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3835e6e77bc0ad10:
    english: "`GET /api/b2/groups`"
    translation: "`GET /api/b2/groups`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4f588e981afc3069:
    english: The response contains all matching records in a non-paginated `groups` array. It includes parent groups and subgroups, including groups whose subscription is not currently active. Check the `enabled` field when an integration should operate only on enabled groups.
    translation: A válasz az összes megfelelő rekordot tartalmazza egy lapozás nélküli `groups` tömbben. Szülőcsoportok és alcsoportok is szerepelnek benne, köztük olyan csoportok is, amelyek előfizetése jelenleg nem aktív. Ellenőrizd az `enabled` mezőt, ha az integrációnak csak aktív csoportokkal szabad működnie.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  213de8ce539a42c3:
    english: 'Important group fields include:'
    translation: 'A fontosabb csoportmezők:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d377f7c9b224a6d7:
    english: |-
      | Field | Description |
      | --- | --- |
      | `id` | Numeric group ID used by other User API endpoints |
      | `key` | Stable short key used in Loomio URLs |
      | `handle` | Human-readable group handle |
      | `name` | Group name |
      | `full_name` | Group name including its parent-group context |
      | `parent_id` | Numeric parent-group ID for a subgroup, otherwise `null` |
      | `enabled` | Whether the group and its subscription are active |
      | `memberships_count` | Number of active and pending memberships |
      | `accepted_memberships_count` | Number of accepted memberships |
      | `pending_memberships_count` | Number of pending invitations |
      | `admin_memberships_count` | Number of group administrators |
      | `delegates_count` | Number of delegates |
      | `discussions_count` | Number of discussions directly in the group |
      | `polls_count` | Number of polls directly in the group |
      | `subgroups_count` | Number of subgroups |
    translation: |-
      | Mező | Leírás |
      | --- | --- |
      | `id` | Más felhasználói API-végpontok által használt numerikus csoportazonosító |
      | `key` | A Loomio URL-jeiben használt állandó rövid kulcs |
      | `handle` | A csoport ember által olvasható azonosítója |
      | `name` | A csoport neve |
      | `full_name` | A csoport neve a szülőcsoport megjelölésével |
      | `parent_id` | Alcsoport esetén a szülőcsoport numerikus azonosítója, egyébként `null` |
      | `enabled` | Aktív-e a csoport és az előfizetése |
      | `memberships_count` | Az aktív és függőben lévő tagságok száma |
      | `accepted_memberships_count` | Az elfogadott tagságok száma |
      | `pending_memberships_count` | A függőben lévő meghívások száma |
      | `admin_memberships_count` | A csoportadminisztrátorok száma |
      | `delegates_count` | A küldöttek száma |
      | `discussions_count` | A közvetlenül a csoporthoz tartozó beszélgetések száma |
      | `polls_count` | A közvetlenül a csoporthoz tartozó szavazások száma |
      | `subgroups_count` | Az alcsoportok száma |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  34f1693ba28fcb80:
    english: The response may include additional group settings, related parent-group records and the API user's memberships. Clients should ignore fields they do not use.
    translation: A válasz további csoportbeállításokat, kapcsolódó szülőcsoport-rekordokat és az API-felhasználó tagságait is tartalmazhatja. A kliensek hagyják figyelmen kívül a nem használt mezőket.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d7c327b8ed7f7bf2:
    english: "### Get a group"
    translation: "### Csoport lekérése"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  15ab63bc2d396657:
    english: Return one group visible to the API-key user.
    translation: Az API-kulcs tulajdonosa számára látható csoport lekérése.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8ba2cc9e3c67b1dd:
    english: "`GET /api/b2/groups/:id_or_key_or_handle`"
    translation: "`GET /api/b2/groups/:id_or_key_or_handle`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  71e5812ff9890c9b:
    english: The identifier can be the group's numeric ID, key or handle.
    translation: Az azonosító lehet a csoport numerikus azonosítója, kulcsa vagy olvasható azonosítója.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8ba79a283b7b77d5:
    english: The response contains the group in the `groups` array and uses the same fields as the list endpoint. A request for a group the API-key user cannot access returns a permission error.
    translation: A válasz a `groups` tömbben tartalmazza a csoportot, ugyanazokkal a mezőkkel, mint a listázó végpont. Ha az API-kulcs tulajdonosa nem fér hozzá a kért csoporthoz, a kérés jogosultsági hibát ad vissza.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  18d823df4d7f8fac:
    english: "## Webhooks"
    translation: "## Webhookok"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f33d58fc1f2fd84c:
    english: 'The User API is request-based: an integration calls Loomio when it wants to read or change data. A group webhook provides the push direction. Loomio sends selected group events to your endpoint as they happen, so an integration does not need to poll the REST API for changes.'
    translation: 'A felhasználói API kérésekre válaszol: az integráció akkor hívja meg a Loomiót, amikor adatot szeretne olvasni vagy módosítani. A csoport webhookja az ellenkező irányban továbbít adatot. A Loomio a kiválasztott csoporteseményeket az előfordulásukkor elküldi a végpontodra, így az integrációnak nem kell rendszeresen lekérdeznie a REST API-t a változásokért.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3b5b4b0ac52b9010:
    english: 'Webhooks are configured per group and require group-administrator permission. They can be managed through the Loomio interface:'
    translation: 'A webhookokat csoportonként kell beállítani, és kezelésükhöz csoportadminisztrátori jogosultság szükséges. A Loomio felületén így kezelheted őket:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  318710be7b3aae7d:
    english: |-
      1. Open the group.
      2. Open the group menu and select **Chat integrations**.
      3. Add the integration matching the payload format your endpoint accepts. For a general-purpose endpoint, use the Mattermost/Markdown format.
      4. Enter a name and the destination URL.
      5. Select the events that Loomio should send automatically.
      6. Save the integration and use **Test connection** to send a test message.
    translation: |-
      1. Nyisd meg a csoportot.
      2. Nyisd meg a csoport menüjét, és válaszd a **Csevegési integrációk** lehetőséget.
      3. Add hozzá azt az integrációt, amelynek adatformátumát a végpontod fogadni tudja. Általános célú végponthoz használd a Mattermost/Markdown formátumot.
      4. Adj meg egy nevet és a cél URL-t.
      5. Válaszd ki azokat az eseményeket, amelyeket a Loomio automatikusan elküldjön.
      6. Mentsd az integrációt, majd a **Kapcsolat tesztelése** lehetőséggel küldj tesztüzenetet.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  43fb95cf304fced6:
    english: Use an HTTPS destination with an unguessable URL. Loomio requires the destination to resolve to a public address and blocks requests to local or private network addresses.
    translation: Olyan HTTPS-címet használj célként, amelynek URL-je nem található ki könnyen. A Loomio megköveteli, hogy a cél nyilvános címre mutasson, és blokkolja a helyi vagy magánhálózati címekre irányuló kéréseket.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d8d5abffe6425bea:
    english: Agents and other integrations can instead manage webhooks through the Bearer-authenticated chatbot endpoints described below. The resource is named `chatbots` for compatibility with Loomio's chat integrations, but it also represents general outgoing webhooks.
    translation: Az ügynökök és más integrációk az alább ismertetett, Bearer-hitelesítést használó chatbotvégpontokon keresztül is kezelhetik a webhookokat. Az erőforrás neve `chatbots`, hogy kompatibilis legyen a Loomio csevegési integrációival, de általános kimenő webhookokat is jelöl.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  28fb6371af33b66f:
    english: "### List webhooks"
    translation: "### Webhookok listázása"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7187e5a26c3ec864:
    english: Return the chat integrations configured for a group. The API-key user must be an administrator of that group. The response includes destination URLs, so it must not be exposed to ordinary group members.
    translation: Egy csoporthoz beállított csevegési integrációk lekérése. Az API-kulcs tulajdonosának a csoport adminisztrátorának kell lennie. A válasz tartalmazza a cél URL-eket, ezért nem szabad elérhetővé tenni a csoport többi tagja számára.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  788d370538bdda46:
    english: "`GET /api/b2/chatbots?group_id=123`"
    translation: "`GET /api/b2/chatbots?group_id=123`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d676ca45c3e1074a:
    english: 'The response contains a `chatbots` array with these fields:'
    translation: 'A válasz egy `chatbots` tömböt tartalmaz a következő mezőkkel:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ca00f7d0a52ce803:
    english: |-
      | Field | Description |
      | --- | --- |
      | `id` | Integration ID used for updates and deletion |
      | `group_id` | Group receiving the events |
      | `name` | Administrative name for the integration |
      | `kind` | `webhook` for an outgoing webhook or `matrix` for a Matrix integration |
      | `webhook_kind` | Payload format: `markdown`, `slack`, `discord`, `microsoft`, or `webex` |
      | `server` | Destination URL |
      | `event_kinds` | Events sent automatically |
      | `notification_only` | Whether messages contain only the notification headline |
    translation: |-
      | Mező | Leírás |
      | --- | --- |
      | `id` | Az integráció frissítéséhez és törléséhez használt azonosító |
      | `group_id` | Az eseményekhez tartozó csoport |
      | `name` | Az integráció adminisztrációs neve |
      | `kind` | Kimenő webhook esetén `webhook`, Matrix-integráció esetén `matrix` |
      | `webhook_kind` | Az adat formátuma: `markdown`, `slack`, `discord`, `microsoft` vagy `webex` |
      | `server` | Cél-URL |
      | `event_kinds` | Automatikusan elküldött események |
      | `notification_only` | Az üzenetek csak az értesítés címét tartalmazzák-e |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d72d8237eded6fdd:
    english: "### Create a webhook"
    translation: "### Webhook létrehozása"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e33c05cb2770fe21:
    english: "`POST /api/b2/chatbots`"
    translation: "`POST /api/b2/chatbots`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  acee55f2470a1eef:
    english: The API-key user must be an administrator of `group_id`. The destination is validated as a public URL before it is saved.
    translation: Az API-kulcshoz tartozó felhasználónak a `group_id` által jelölt csoport adminisztrátorának kell lennie. Mentés előtt a rendszer ellenőrzi, hogy a cél nyilvánosan elérhető URL-e.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  05d9e1cdc6185f85:
    english: "### Update a webhook"
    translation: "### Webhook frissítése"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  eb7a96b45abe57c2:
    english: "`PATCH /api/b2/chatbots/:id`"
    translation: "`PATCH /api/b2/chatbots/:id`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2696d4fd91cd5f6f:
    english: Send any fields that should change. The webhook cannot be transferred to another group by changing `group_id`.
    translation: Küldd el a módosítani kívánt mezőket. A `group_id` módosításával nem helyezheted át a webhookot másik csoportba.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e56bb884ce5ef3c5:
    english: "### Test a webhook destination"
    translation: "### Webhook céljának tesztelése"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  10c1e636b20121c2:
    english: Send a Markdown-compatible test message to a destination before or after saving its configuration.
    translation: A beállítások mentése előtt vagy után küldj a cél címére egy Markdown-kompatibilis tesztüzenetet.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cf0e0fae3c68178d:
    english: "`POST /api/b2/chatbots/check`"
    translation: "`POST /api/b2/chatbots/check`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fcb55f73325b9f2a:
    english: "### Delete a webhook"
    translation: "### Webhook törlése"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f7e12256467f6c49:
    english: "`DELETE /api/b2/chatbots/:id`"
    translation: "`DELETE /api/b2/chatbots/:id`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f158f3939e36074c:
    english: Deleting the configuration stops future deliveries. It does not delete any Loomio group content.
    translation: A beállítás törlése leállítja a későbbi kézbesítéseket. A Loomio-csoport tartalmát nem törli.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f0fe37689a7c3646:
    english: "### Event types"
    translation: "### Eseménytípusok"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  066ca1423e999efa:
    english: 'A webhook can subscribe to these event types:'
    translation: 'A webhook ezekre az eseménytípusokra iratkozhat fel:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  82962625b0583140:
    english: |-
      | Event | When it is sent |
      | --- | --- |
      | `new_discussion` | A discussion is started |
      | `discussion_edited` | A discussion is edited |
      | `new_comment` | A comment is created |
      | `poll_created` | A poll is started |
      | `poll_edited` | A poll is edited |
      | `poll_closing_soon` | A poll is approaching its closing time |
      | `poll_expired` | A poll reaches its closing time |
      | `poll_closed_by_user` | A person closes a poll manually |
      | `poll_reopened` | A poll is reopened |
      | `outcome_created` | An outcome is published |
      | `outcome_updated` | An outcome is updated |
      | `outcome_review_due` | An outcome review becomes due |
      | `stance_created` | A vote is cast |
      | `stance_updated` | A vote is changed |
    translation: |-
      | Esemény | Mikor küldi el a rendszer |
      | --- | --- |
      | `new_discussion` | Beszélgetés indul |
      | `discussion_edited` | Szerkesztenek egy beszélgetést |
      | `new_comment` | Hozzászólás születik |
      | `poll_created` | Szavazás indul |
      | `poll_edited` | Szerkesztenek egy szavazást |
      | `poll_closing_soon` | Közeledik egy szavazás lezárási ideje |
      | `poll_expired` | Egy szavazás eléri a lezárási idejét |
      | `poll_closed_by_user` | Valaki kézzel lezár egy szavazást |
      | `poll_reopened` | Újra megnyitnak egy szavazást |
      | `outcome_created` | Közzétesznek egy következtetést |
      | `outcome_updated` | Frissítenek egy következtetést |
      | `outcome_review_due` | Esedékessé válik egy következtetés felülvizsgálata |
      | `stance_created` | Valaki leadja a szavazatát |
      | `stance_updated` | Valaki módosítja a szavazatát |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ed1d3fc4a6fb67b9:
    english: The webhook belongs to one group and receives subscribed events from that group. People can also explicitly select the integration when sharing or sending some notifications, even when the corresponding automatic event is not selected.
    translation: A webhook egy csoporthoz tartozik, és annak feliratkozott eseményeit fogadja. Az integrációt az emberek egyes értesítések megosztásakor vagy küldésekor külön is kiválaszthatják, akkor is, ha a megfelelő automatikus esemény nincs kiválasztva.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  512f0701765b66ec:
    english: "### HTTP delivery"
    translation: "### HTTP-kézbesítés"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dca082a687dc5505:
    english: 'Loomio sends an asynchronous HTTP `POST` to the configured URL with this header:'
    translation: 'A Loomio aszinkron HTTP `POST` kérést küld a beállított URL-re ezzel a fejléccel:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a4f66c4c94afa135:
    english: The request timeout is five seconds. A `2xx` response, including `204 No Content`, is treated as successful. Webhook consumers should respond promptly, process longer work asynchronously, and tolerate duplicate or out-of-order deliveries.
    translation: A kérés időkorlátja öt másodperc. A rendszer minden `2xx` választ sikeresnek tekint, beleértve a `204 No Content` választ is. A webhookot fogadó szolgáltatás válaszoljon gyorsan, a hosszabb feladatokat dolgozza fel aszinkron módon, és kezelje a többször vagy eltérő sorrendben érkező kézbesítéseket.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  84faa7dad6f34739:
    english: Loomio does not currently add a webhook signature, shared-secret header, event ID, or delivery ID. Treat the full destination URL as a credential, do not expose it publicly, and include an unguessable token in the URL when the receiving service supports one. If a stable machine-readable event schema or signed delivery is required, use the webhook as a change notification and retrieve the current records through the authenticated User API.
    translation: A Loomio jelenleg nem ad a webhookhoz aláírást, közös titkot tartalmazó fejlécet, eseményazonosítót vagy kézbesítési azonosítót. A teljes cél-URL-t kezeld hozzáférési adatként, ne tedd nyilvánossá, és használj benne nehezen kitalálható tokent, ha a fogadó szolgáltatás ezt támogatja. Ha állandó, géppel feldolgozható eseménysémára vagy aláírt kézbesítésre van szükséged, használd a webhookot változásjelzésként, majd kérd le az aktuális rekordokat a hitelesített felhasználói API-n keresztül.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f3d956b4694f793c:
    english: "### Payload formats"
    translation: "### Adatformátumok"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  deed1ccba8a70ac2:
    english: Webhook payloads are presentation-oriented messages intended for chat services. They are not complete serialized Loomio records. Links in the message identify the affected Loomio content; an integration can follow up through the User API when it needs structured current state.
    translation: A webhookok csevegőszolgáltatásoknak szánt üzeneteket küldenek. Ezek nem teljes Loomio-rekordok. Az üzenetben lévő hivatkozások megmutatják, melyik Loomio-tartalmat érinti az esemény. Ha az integrációnak strukturált, aktuális adatokra van szüksége, lekérheti őket a felhasználói API-n keresztül.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c2e9782a81b59ab2:
    english: |-
      | Integration format | Principal JSON fields |
      | --- | --- |
      | Mattermost/Markdown | `text`, `icon_url`, `username` |
      | Slack | `text` |
      | Discord | `content`, limited to approximately 1,900 characters |
      | Microsoft Teams | `@type`, `@context`, `themeColor`, `text`, `sections` |
      | Webex | `markdown` |
    translation: |-
      | Integráció formátuma | Fő JSON-mezők |
      | --- | --- |
      | Mattermost/Markdown | `text`, `icon_url`, `username` |
      | Slack | `text` |
      | Discord | `content`, körülbelül 1900 karakterre korlátozva |
      | Microsoft Teams | `@type`, `@context`, `themeColor`, `text`, `sections` |
      | Webex | `markdown` |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  132dd698f11d1d08:
    english: 'For example, the general Markdown format sends a body shaped like:'
    translation: 'Az általános Markdown-formátum például ilyen szerkezetű üzenettörzset küld:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d224ca01f360918e:
    english: The exact message text depends on the event, group locale, notification-only setting, and Loomio version. Consumers should rely on the selected format's documented top-level fields rather than parsing sentence wording.
    translation: Az üzenet pontos szövege az eseménytől, a csoport nyelvi beállításától, a csak értesítést tartalmazó beállítástól és a Loomio verziójától függ. Az üzenetet fogadó szolgáltatás a választott formátum dokumentált felső szintű mezőire támaszkodjon az egyes mondatok elemzése helyett.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  62c53ea4911e0c79:
    english: "## Search"
    translation: "## Keresés"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f7346561ccdfcfce:
    english: Search discussions, comments, polls, votes, and outcomes visible to the API-key user. Results include public content even when the user is not a member of its group; private content remains subject to normal topic visibility.
    translation: Keress az API-kulcshoz tartozó felhasználó számára látható beszélgetések, hozzászólások, szavazások, leadott szavazatok és következtetések között. A találatok között nyilvános tartalom is szerepelhet olyan csoportból, amelynek a felhasználó nem tagja. A privát tartalmakra a témák szokásos láthatósági szabályai vonatkoznak.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e9101cf4a72bde36:
    english: "`GET /api/b2/search`"
    translation: "`GET /api/b2/search`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9bc24da4bd85dac2:
    english: "### Params"
    translation: "### Paraméterek"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ac9bc86d81bfd39f:
    english: |-
      | Name | Description |
      | --- | --- |
      | `query` | Search text. Exact and fuzzy matches are supported |
      | `group_id` | Restrict results to one visible group |
      | `org_id` | Restrict results to a visible parent group and its visible subgroups. Use `0` for direct discussions |
      | `type` | Restrict results to one type: `Discussion`, `Comment`, `Poll`, `Stance`, or `Outcome` |
      | `types` | Comma-separated list of result types |
      | `tag` | Restrict results to topics with this tag |
      | `author_id` | Restrict results to content by one author. Without `query`, returns that author's recent visible activity |
      | `order` | Set to `authored_at_desc` to order matching content by authoring time |
    translation: |-
      | Név | Leírás |
      | --- | --- |
      | `query` | Keresett szöveg. Pontos és közelítő egyezések is támogatottak |
      | `group_id` | A találatokat egy látható csoportra korlátozza |
      | `org_id` | A találatokat egy látható szülőcsoportra és annak látható alcsoportjaira korlátozza. Közvetlen beszélgetésekhez használd a `0` értéket |
      | `type` | A találatokat egy típusra korlátozza: `Discussion`, `Comment`, `Poll`, `Stance` vagy `Outcome` |
      | `types` | A találattípusok vesszővel elválasztott listája |
      | `tag` | A találatokat az ezzel a címkével ellátott témákra korlátozza |
      | `author_id` | A találatokat egy szerző tartalmaira korlátozza. `query` nélkül a szerző közelmúltbeli, látható tevékenységét adja vissza |
      | `order` | Állítsd `authored_at_desc` értékre, hogy az egyező tartalmakat a létrehozásuk ideje szerint rendezze |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  00e046b622446633:
    english: The response contains a `search_results` array. Each result identifies the matched record and its visible context with fields including `searchable_type`, `searchable_id`, `highlight`, `group_id`, `group_name`, `discussion_key`, `poll_key`, `author_id`, `author_name`, `authored_at`, and `tags`. Fields that do not apply to a result are `null`.
    translation: A válasz egy `search_results` tömböt tartalmaz. Minden találat azonosítja az egyező rekordot és annak látható környezetét. A mezők között szerepel a `searchable_type`, `searchable_id`, `highlight`, `group_id`, `group_name`, `discussion_key`, `poll_key`, `author_id`, `author_name`, `authored_at` és `tags`. Az adott találatra nem vonatkozó mezők értéke `null`.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f90d2c11582b8bfa:
    english: "## Participation report"
    translation: "## Részvételi jelentés"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0fbe24cde7a5e1aa:
    english: Return the same aggregated participation data used by Loomio's Participation report.
    translation: A Loomio Részvételi jelentésében használt összesített részvételi adatokat adja vissza.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0f176aa4823b4ece:
    english: "`GET /api/b2/reports`"
    translation: "`GET /api/b2/reports`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fc4488304bf3735e:
    english: |-
      | Name | Description |
      | --- | --- |
      | `section` | Report section: `base`, `users`, or `countries`. Use `users` for per-person activity |
      | `group_scope` | `custom` or `my`. The legacy `all` value is treated as `my` because User API keys never receive instance-wide access |
      | `group_ids` | Comma-separated group IDs when `group_scope=custom`. IDs outside the API user's memberships are ignored |
      | `start_month` | First month to include in `YYYY-MM` format; defaults to 12 months ago |
      | `end_month` | Last month to include in `YYYY-MM` format; defaults to the current month |
      | `interval` | Interval for the `base` section: `day`, `week`, `month`, or `year` |
      | `member_type` | Set to `delegate` with `section=users` to return only current delegates |
    translation: |-
      | Név | Leírás |
      | --- | --- |
      | `section` | A jelentés része: `base`, `users` vagy `countries`. Személyenkénti tevékenységhez használd a `users` értéket |
      | `group_scope` | `custom` vagy `my`. A régi `all` értéket a rendszer `my` értékként kezeli, mert a felhasználói API-kulcsok nem adnak hozzáférést a teljes példányhoz |
      | `group_ids` | Vesszővel elválasztott csoportazonosítók, ha `group_scope=custom`. A rendszer figyelmen kívül hagyja azokat az azonosítókat, amelyekhez az API-felhasználó nem rendelkezik tagsággal |
      | `start_month` | Az első szerepeltetendő hónap `YYYY-MM` formátumban; alapértelmezés szerint 12 hónappal ezelőtt |
      | `end_month` | Az utolsó szerepeltetendő hónap `YYYY-MM` formátumban; alapértelmezés szerint az aktuális hónap |
      | `interval` | A `base` rész időköze: `day`, `week`, `month` vagy `year` |
      | `member_type` | Állítsd `delegate` értékre a `section=users` mellett, hogy csak a jelenlegi küldöttek jelenjenek meg |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '09b3d2247802eae7':
    english: A person is a delegate when they have an active delegate membership in any selected group. Their counts are aggregated across all selected groups. Delegate rows are returned even when every activity count is zero. Counts cover threads, comments, polls, votes, outcomes, and reactions; they are not voting participation rates. User rows also include identified ballots issued, cast, and missed. Anonymous polls are excluded from all per-person voting counts. `all_votes_cast` is true only when at least one ballot was issued and every issued ballot was cast.
    translation: Valaki akkor küldött, ha a kiválasztott csoportok bármelyikében aktív küldötti tagsága van. A rendszer az összes kiválasztott csoportból összesíti az adatait. A küldöttek akkor is szerepelnek a jelentésben, ha minden tevékenységi számuk nulla. A számok a témákat, hozzászólásokat, szavazásokat, leadott szavazatokat, következtetéseket és reakciókat fedik le; nem a szavazási részvételi arányt mutatják. A felhasználói sorok a névhez kötött szavazólapok kiadott, leadott és elmulasztott számát is tartalmazzák. Az anonim szavazások minden személyenkénti szavazatszámból kimaradnak. Az `all_votes_cast` csak akkor igaz, ha legalább egy szavazólapot kiadtak, és mindegyiket leadták.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  be9b5cd02a9b5930:
    english: The API applies the same group visibility rules as the in-product report. A user API key cannot expose report data from groups that user cannot access.
    translation: Az API ugyanazokat a csoportláthatósági szabályokat alkalmazza, mint a Loomio felületén elérhető jelentés. A felhasználói API-kulcs nem teszi elérhetővé azoknak a csoportoknak a jelentésadatait, amelyekhez a felhasználó nem fér hozzá.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
