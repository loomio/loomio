    translated_on: '2026-09-29'
  cdd3c098983b6066:
    english: 'The tabs under the group description provide access to:'
    translation: 'הלשוניות שמתחת לתיאור הקבוצה מאפשרות גישה אל:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  02760342b07f5ff4:
    english: "**Discussions** - The group's discussion threads and recent activity."
    translation: "**דיונים** - הדיונים של הקבוצה והפעילות האחרונה בהם."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e2c7a0c137330c27:
    english: "**Polls** - A list of polls active in your group."
    translation: "**סקרים** - רשימת הסקרים הפעילים בקבוצה."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '085bd9dfce8144dc':
    english: "**Members** - The people who belong to the group."
    translation: "**חברים** - האנשים החברים בקבוצה."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cfdb369a7fd6e14f:
    english: "**Files** - Documents and other files attached throughout the group. The tab collects files from discussion contexts, comments, proposals, and polls, so you can find a document without remembering where it was attached."
    translation: "**קבצים** - מסמכים וקבצים אחרים שצורפו ברחבי הקבוצה. הלשונית מרכזת קבצים שצורפו לדיונים, לתגובות, להצעות ולסקרים, כך שאפשר למצוא מסמך בלי לזכור היכן צורף."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6483153cbc12b458:
