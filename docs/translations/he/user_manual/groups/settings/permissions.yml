  d661e5fc8cc1b460:
    english: "# Group permissions"
    translation: "# הרשאות קבוצה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  712830f14602c6c7:
    english: The permissions tab controls which group operations are available to ordinary members and, for non-secret groups, to non-members. Open **Edit group settings** from the group page, then select **Permissions**.
    translation: הלשונית **הרשאות** קובעת אילו פעולות בקבוצה זמינות לחברים רגילים, ובקבוצות שאינן סודיות גם למי שאינם חברים. בדף הקבוצה יש לפתוח את **ערוך הגדרות קבוצה** ולבחור **הרשאות**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b71bf8cce1cb369c:
    english: "![Group permission settings](group_group_settings_permissions.png)"
    translation: "![הגדרות הרשאות קבוצה](group_group_settings_permissions.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  88e5fcd302a53620:
    english: Administrators retain the ability to manage the group. Enabling a member permission extends that particular action to ordinary members; it does not make them administrators.
    translation: למנהלי הקבוצה נשמרת האפשרות לנהל אותה. הפעלת הרשאה לחברים מאפשרת לחברים רגילים לבצע את הפעולה המסוימת, אך אינה הופכת אותם למנהלים.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5b2b9af0f68b7a57:
    english: 'Permissions include whether members can:'
    translation: 'ההרשאות קובעות אם חברים יכולים:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8377b499d13690c0:
    english: |-
      - add members or invite guests;
      - send announcements;
      - create subgroups;
      - start and manage discussions;
      - create and manage tags;
      - edit or delete comments where the setting permits;
      - start proposals and polls; and
      - create discussion and poll templates.
    translation: |-
      - להוסיף חברים או להזמין אורחים;
      - לשלוח הודעות;
      - ליצור תת־קבוצות;
      - לפתוח דיונים ולנהל אותם;
      - ליצור תגיות ולנהל אותן;
      - לערוך או למחוק תגובות כשההגדרה מאפשרת זאת;
      - לפתוח הצעות ומשאלים; וגם
      - ליצור תבניות לדיונים ולמשאלים.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  87166abe7eea1ab3:
    english: For groups that are not secret, administrators can separately allow non-members to start discussions. A non-member who starts a discussion becomes a guest of that discussion but does not gain access to other private discussions or become a group member.
    translation: בקבוצות שאינן סודיות, מנהלי הקבוצה יכולים לאפשר בנפרד למי שאינם חברים לפתוח דיונים. מי שפותחים דיון בלי להיות חברים בקבוצה הופכים לאורחים באותו דיון, אך אינם מקבלים גישה לדיונים פרטיים אחרים ואינם הופכים לחברים בקבוצה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3d01d10a97636b1e:
    english: The **Admins can edit members' comments** setting gives administrators an exceptional moderation capability. Enable it only when the group has agreed that administrators should be able to alter member-authored content.
    translation: ההגדרה **מנהלי מערכת יכולים לערוך תגובות של חברים** מעניקה למנהלי הקבוצה יכולת חריגה לערוך תוכן במסגרת ניהול הדיונים. יש להפעיל אותה רק אם הקבוצה הסכימה שמנהליה יוכלו לשנות תוכן שנכתב בידי חברים.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b0af0135752a461f:
    english: Review permissions when the group's purpose, membership, or moderation responsibilities change. Give each role only the capabilities it needs.
    translation: כדאי לבדוק מחדש את ההרשאות כשמטרת הקבוצה, הרכב החברים או האחריות לניהול הדיונים משתנים. יש להעניק לכל תפקיד רק את היכולות הנחוצות לו.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
