  f3106c22cd3d4059:
    english: 'Loomio can send notifications into your Matrix channels when new discussions, proposals, comments, votes, and outcomes occur. '
    translation: Loomio può inviare notifiche ai tuoi canali Matrix quando vengono create discussioni, proposte, commenti, voti e conclusioni.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a20cf2be00dac0ce:
    english: Matrix is nice because it allows some HTML in the chatroom, and Loomio takes advantage of this.
    translation: Matrix consente di usare parte dell'HTML nelle chat e Loomio sfrutta questa possibilità.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ffe12502f0030fec:
    english: Our Matrix integration is a little different to our other chat integrations - it does not use a webhook - we've built a custom bot client for this one.
    translation: 'L''integrazione con Matrix funziona in modo diverso dalle altre integrazioni con le chat: non usa un webhook, ma un bot creato appositamente.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  44db147f65127a55:
    english: You will need to create a matrix user for the bot to login as.
    translation: Devi creare un utente Matrix che il bot possa usare per accedere.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  98045e5bf1339543:
    english: Once you've created a user for the bot, sign in at that user to obtain the following information.
    translation: Dopo aver creato l'utente per il bot, accedi con quell'account per ottenere le informazioni seguenti.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
