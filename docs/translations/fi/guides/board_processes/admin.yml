  8e67ece08e454475:
    english: There is a range of features in Loomio to help you administer discussions accessible from the drop down menu to the right of the discussion.
    translation: Loomiossa on useita keskustelujen hallinnointiin tarkoitettuja toimintoja. Löydät ne keskustelun oikealla puolella olevasta pudotusvalikosta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2d5be8c39f22ec28:
    english: 'Keep the discussion list current by using:'
    translation: 'Pidä keskusteluluettelo ajan tasalla näillä toiminnoilla:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  75739da1bd5910a6:
    english: |-
      - **Pin discussion** to keep important discussions at the top of the list
      - **Edit discussion** to change discussion title or update discussion context
      - **Move to group** when you want to move a discussion to another group or subgroup, or to an archive group.
      - **Lock thread** to prevent further comments or changes and remove the thread from the list of open threads. Locked threads are available under the discussion filter and from the search bar, and can be unlocked at any time.
      - **Delete discussion** when you do not want to keep a record of the discussion.  Note that deleted discussions can not be un-deleted.
    translation: |-
      - **Kiinnitä keskustelu** pitää tärkeät keskustelut luettelon alussa
      - **Muokkaa lankaa** muuttaa keskustelun otsikkoa tai päivittää sen taustatietoja
      - **Siirrä ryhmään** siirtää keskustelun toiseen ryhmään, alaryhmään tai arkistoryhmään
      - **Lukitse ketju** estää uudet kommentit ja muutokset sekä poistaa ketjun avoimien ketjujen luettelosta. Löydät lukitut ketjut keskustelusuodattimella ja hakupalkista. Voit avata ne uudelleen milloin tahansa.
      - **Poista keskustelu** poistaa keskustelun, jos et halua säilyttää sitä. Poistettua keskustelua ei voi palauttaa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
