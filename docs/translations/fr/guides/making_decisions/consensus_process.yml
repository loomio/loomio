    english: Build consensus for a decision you need to make together, to reach an agreement that satisfies the needs and concerns of all participants.
    translation: Construisez un consensus autour d’une décision à prendre ensemble, afin de parvenir à un accord qui tienne compte des besoins et des préoccupations de toutes les personnes participantes.
