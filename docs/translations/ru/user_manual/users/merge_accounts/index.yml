---
navigation_title: Объединить аккаунты
blocks:
  e3a50952a2ce6cfc:
    english: "# Merge accounts"
    translation: "# Объединить аккаунты"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e0bdfaac5741d310:
    english: Merge two Loomio accounts when each account uses a different email address and you want to continue with one account.
    translation: Объедините два аккаунта Loomio с разными адресами электронной почты, если хотите продолжить работу с одним аккаунтом.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '08d4fcba2e0a2b3b':
    english: 'Before you begin, decide which account you want to keep:'
    translation: 'Прежде чем начать, решите, какой аккаунт сохранить:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6f7efc1ebdc680c7:
    english: |-
      - The **account to keep** is the account whose email address and profile you will use after the merge
      - The **account to retire** is the account you sign in to first. Its email address will no longer work for signing in after the merge
    translation: |-
      - **Аккаунт, который вы сохраните**, — это аккаунт, чьи адрес электронной почты и профиль вы будете использовать после объединения
      - **Аккаунт, который вы удалите**, — это аккаунт, в который вы войдёте первым. После объединения его адрес электронной почты больше нельзя будет использовать для входа
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  060fb4b1c12c153a:
    english: You need access to both accounts and to the email address of the account you want to keep.
    translation: Вам нужен доступ к обоим аккаунтам и к почте аккаунта, который вы хотите сохранить.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9c9a7e082a3b67ae:
    english: |-
      > [!WARNING]
      > Merging accounts is irreversible. Check the source and target email addresses carefully before the final confirmation.
    translation: |-
      > [!WARNING]
      > Объединение аккаунтов нельзя отменить. Перед окончательным подтверждением внимательно проверьте адреса электронной почты обоих аккаунтов.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4d6defccb0f2a2ec:
    english: "## Start the merge"
    translation: "## Начните объединение"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0c49f5d2284571d3:
    english: |-
      1. Sign in to the **account you want to retire**.
      2. Open the sidebar, select your name, and select **Edit profile**.
      3. Select **Merge accounts**.
    translation: |-
      1. Войдите в **аккаунт, который вы хотите удалить**.
      2. Откройте боковое меню, выберите своё имя, затем **Редактировать профиль**.
      3. Выберите **Объединить аккаунты**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a05689d18f3c3337:
    english: "![The profile actions with Merge accounts highlighted](merge_accounts_profile.png)"
    translation: "![Действия с профилем: выделен пункт «Объединить аккаунты»](merge_accounts_profile.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  29656e0572127b88:
    english: 4. Enter the destination account's email address—the address belonging to the **account you want to keep**—and select **Send verification email**. Loomio always shows the same confirmation and signs you out. If an account uses that address, Loomio sends it the verification email.
    translation: 4. Введите адрес электронной почты **аккаунта, который вы хотите сохранить**, и выберите **Отправить письмо с подтверждением**. Loomio всегда показывает одинаковое подтверждение и выводит вас из аккаунта. Если аккаунт с таким адресом существует, Loomio отправит на него письмо для подтверждения.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d045b6c7e8a5b853:
    english: "## Verify the account you want to keep"
    translation: "## Подтвердите аккаунт, который хотите сохранить"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  57255cdb29b384d7:
    english: 5. Open the verification email sent to the address of the account you want to keep and select **Verify email and proceed**.
    translation: 5. Откройте письмо, отправленное на адрес аккаунта, который вы хотите сохранить, и выберите **Подтвердите адрес электронной почты и продолжайте**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5e496b2d8f551efa:
    english: "![The merge verification email with the Verify email and proceed button highlighted](merge_accounts_email.png)"
    translation: "![Письмо для подтверждения объединения: выделена кнопка «Подтвердите адрес электронной почты и продолжайте»](merge_accounts_email.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ad19dc0399f9d446:
    english: |-
      6. Sign in as the account you want to keep if Loomio asks you to sign in.
      7. On the **Confirm merge** page, check both email addresses again. Select **Merge accounts** to complete the merge.
    translation: |-
      6. Если Loomio попросит вас войти, войдите в аккаунт, который хотите сохранить.
      7. На странице **Подтвердить объединение** ещё раз проверьте оба адреса электронной почты. Выберите **Объединить аккаунты**, чтобы завершить объединение.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a575e2cd16aa66b4:
    english: "![The final confirmation page with the Merge accounts button highlighted](merge_accounts_confirm.png)"
    translation: "![Страница окончательного подтверждения: выделена кнопка «Объединить аккаунты»](merge_accounts_confirm.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cf8eba685cfdbf04:
    english: "## What happens after the merge"
    translation: "## Что произойдёт после объединения"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6ae4c6c893430735:
    english: The account you keep remains your Loomio identity and sign-in account. Group memberships and activity from the retired account, including discussions, comments, polls, and votes, are reassigned to the account you keep. Where both accounts already belong to the same group, the existing membership for the account you keep remains.
    translation: Сохранённый аккаунт останется вашим аккаунтом Loomio для входа. Участие в группах и действия из удалённого аккаунта, включая обсуждения, комментарии, голосования и голоса, будут перенесены в сохранённый аккаунт. Если оба аккаунта уже состоят в одной группе, членство сохранённого аккаунта не изменится.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  eb05b57367c0815c:
    english: The retired account is deleted and its email address can no longer be used to sign in. Loomio sends a confirmation email to the address of the account you kept when the merge is complete.
    translation: Второй аккаунт будет удалён, и его адрес электронной почты больше нельзя будет использовать для входа. После объединения Loomio отправит письмо с подтверждением на адрес сохранённого аккаунта.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
