navigation_title: Sottogruppi
blocks:
  782c5b3df26b17ae:
    english: "# Subgroups"
    translation: "# Sottogruppi"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0025fb895cd6cae8:
    english: Subgroups help you organize your communications and members so that the right people are engaged in their work together.
    translation: I sottogruppi ti aiutano a organizzare le comunicazioni e i membri, coinvolgendo le persone giuste nel lavoro comune.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cc3abd19bc310546:
    english: |-
      For example, an organization may have the following subgroups:
      - governance board
      - working team or a project working group
      - a topic (such as 'strategy' or 'learning')
    translation: |-
      Per esempio, un'organizzazione potrebbe avere questi sottogruppi:
      - consiglio direttivo
      - gruppo di lavoro o gruppo di progetto
      - gruppo dedicato a un tema, come «strategia» o «formazione»
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eab908c78ccd923d:
    english: Subgroups work just like groups do, but are located within your "parent" group. Most of the features and settings available are the same as in the parent group. This also means that someone can be a member of your subgroup, such as your board, but not of your parent group.
    translation: I sottogruppi funzionano come i gruppi, ma si trovano all'interno di un gruppo principale. Hanno quasi tutte le stesse funzionalità e impostazioni. Una persona può essere membro di un tuo sottogruppo, per esempio del consiglio direttivo, senza essere membro del gruppo principale.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  aaa62c1b02d15779:
    english: "## Add a subgroup"
    translation: "## Aggiungere un sottogruppo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8ed2fcd2a209a53d:
    english: |-
      >[!Note]
      >The ability to add new subgroups is part of the group's [permission settings](/en/user_manual/groups/settings/permissions). By default, only admins can start new subgroups.
    translation: |-
      >[!Note]
      >La possibilità di aggiungere sottogruppi dipende dalle [impostazioni dei permessi](/en/user_manual/groups/settings/permissions) del gruppo. Per impostazione predefinita, solo gli amministratori possono creare sottogruppi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  483b820f123b5ae0:
    english: 'To add a subgroup, visit your main group page, then click **New Subgroup** from the sidebar.  '
    translation: Per aggiungere un sottogruppo, apri la pagina del gruppo principale e seleziona **Nuovo sottogruppo** nella barra laterale.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  abceea91b4638844:
    english: "![New subgroup button in the Oatmilk Cooperative sidebar](subgroups-sidebar.png)"
    translation: "![Pulsante Nuovo sottogruppo nella barra laterale di Oatmilk Cooperative](subgroups-sidebar.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b8e3d3477eb6765d:
    english: Click the **New subgroup** button, give it a name and select the privacy setting, then click **Start subgroup**.
    translation: Seleziona **Nuovo sottogruppo**, inserisci un nome e scegli l'impostazione della privacy. Poi seleziona **Avvia sottogruppo**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1d49b46575af3f21:
    english: "![New subgroup form for the Packaging Working Group](subgroups_new.png)"
    translation: "![Modulo per creare il sottogruppo Packaging Working Group](subgroups_new.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  348e88e5c0ca37d0:
    english: When you are ready, [invite people](/en/user_manual/groups/inviting_people/) to the subgroup.
    translation: Quando vuoi, [invita persone](/en/user_manual/groups/inviting_people/) nel sottogruppo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4ac901bff75cf342:
    english: You can edit the subgroups [group settings](/en/user_manual/groups/settings/) by clicking the cog icon on the subgroup page.
    translation: Puoi modificare le [impostazioni del gruppo](/en/user_manual/groups/settings/) del sottogruppo selezionando l'icona a forma di ingranaggio nella sua pagina.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  926676e3163dbc8e:
    english: "![Edit group settings action on the Packaging Working Group](subgroups_edit_group_settings.png)"
    translation: "![Azione per modificare le impostazioni del gruppo Packaging Working Group](subgroups_edit_group_settings.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  737225cc4bebe7e8:
    english: "## Subgroup settings"
    translation: "## Impostazioni del sottogruppo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c93e5ec8b6f3ceb7:
    english: "### Privacy"
    translation: "### Privacy"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  92a47fe13740347a:
    english: The privacy settings for subgroups are similar to the parent group.
    translation: Le impostazioni della privacy dei sottogruppi sono simili a quelle del gruppo principale.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cee5963ea2acac16:
    english: "**Secret** subgroups are not visible to people not invited to the subgroup."
    translation: I sottogruppi **Segreto** non sono visibili alle persone che non sono state invitate.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c8fb4caaa5a2cb9:
    english: "**Closed** subgroups are listed in the Subgroups tab of the parent group and user's sidebar menu. Members of the parent group can request to join the subgroup. Membership is approved by a subgroup admin."
    translation: I sottogruppi **Chiuso** compaiono nella scheda Sottogruppi del gruppo principale e nel menu laterale degli utenti. I membri del gruppo principale possono chiedere di entrare nel sottogruppo. Un amministratore del sottogruppo approva la richiesta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b35b1b3450b2d1e1:
    english: Closed subgroups have an additional setting that allow members of its parent group to see private threads.
    translation: I sottogruppi chiusi hanno un'impostazione aggiuntiva che permette ai membri del gruppo principale di vedere le discussioni private.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  933fe2f0cbdec143:
    english: "[Read about group privacy here](/en/user_manual/groups/settings/privacy)."
    translation: "[Scopri di più sulla privacy dei gruppi](/en/user_manual/groups/settings/privacy)."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d16c8b1258b67c9e:
    english: "### Permissions"
    translation: "### Permessi"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eb5de97caadd5166:
    english: Subgroups operate independently of the main group. For example, if the subgroup privacy setting is set to **Secret**, then only invited members can find this subgroup, see who is in it, and see threads.
    translation: I sottogruppi funzionano indipendentemente dal gruppo principale. Per esempio, se la privacy di un sottogruppo è impostata su **Segreto**, solo i membri invitati possono trovarlo, vedere chi ne fa parte e leggere le discussioni.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e7897aa59ffe96a1:
    english: "**Closed** subgroups have an additional setting that allow members of its parent group to see private threads, enabling the subgroup to be transparent to members of the parent group."
    translation: I sottogruppi **Chiuso** hanno un'impostazione aggiuntiva che permette ai membri del gruppo principale di vedere le discussioni private del sottogruppo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8dd3770fefa7d7e6:
    english: "![Setting that lets parent group members see private subgroup threads](subgroups_private_threads_settings.png)"
    translation: "![Impostazione che permette ai membri del gruppo principale di vedere le discussioni private del sottogruppo](subgroups_private_threads_settings.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c78effb175b8924b:
    english: "## Find subgroups"
    translation: "## Trovare i sottogruppi"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5692ebbfe3fe83e9:
    english: Open the sidebar menu, and click your group name to see it's subgroups.
    translation: Apri il menu laterale e seleziona il nome del tuo gruppo per vedere i suoi sottogruppi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0abefe88cc8bea7f:
    english: "![Oatmilk Cooperative subgroups listed in the sidebar](subgroups_find_subgroups.png)"
    translation: "![Sottogruppi di Oatmilk Cooperative elencati nella barra laterale](subgroups_find_subgroups.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8988135e14e40636:
    english: "## Invite to a subgroup"
    translation: "## Invitare persone in un sottogruppo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  217a985e9afb5421:
    english: Invite people to a subgroup as you invite them into a group. If they already belong to a parent group or another subgroup in the same organization that you also belong to, you can type their name or select that group as an audience. Select the audience chip to expand it into individual people, then remove anyone you do not want to invite.
    translation: Invita le persone in un sottogruppo come faresti per un gruppo. Se appartengono già al gruppo principale o a un altro sottogruppo della stessa organizzazione di cui fai parte, puoi digitare il loro nome o selezionare quel gruppo come destinatario. Seleziona il riquadro dei destinatari per vedere le singole persone, poi rimuovi quelle che non vuoi invitare.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2d4a28c2306fc3c6:
    english: "### Simultaneously invite people to subgroups and parent group"
    translation: "### Invitare persone nel gruppo principale e nei sottogruppi contemporaneamente"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cf301ba403b3a28e:
    english: If you use the **Invite people** button from your parent group's **Members** tab, you can invite people to multiple subgroups at the same time by ticking the boxes of those you would like them to join immediately.
    translation: Se usi il pulsante **Invita persone** nella scheda **Membri** del gruppo principale, puoi invitare le persone in più sottogruppi contemporaneamente. Seleziona le caselle dei sottogruppi a cui vuoi che si uniscano subito.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  28a271be7caa0590:
    english: "![Selecting the parent group and subgroup in the invitation form](group_invite_email_subgroups.png)"
    translation: "![Selezione del gruppo principale e del sottogruppo nel modulo di invito](group_invite_email_subgroups.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5323cb0e01e3e171:
    english: "## Administer a subgroup"
    translation: "## Amministrare un sottogruppo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e7c6ae867d7d3813:
    english: Subgroups can have their own admins, and admins of a subgroup may not be the same as the admins of the parent group.
    translation: I sottogruppi possono avere amministratori propri, diversi da quelli del gruppo principale.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  937ae9d3e8948a26:
    english: However an admin of the 'parent' group can make themselves admin of any subgroup.  This helps administrators of the parent group to administer subgroups as necessary.
    translation: Un amministratore del gruppo principale può comunque diventare amministratore di qualsiasi sottogruppo. In questo modo può gestire i sottogruppi quando serve.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  282547a6c728d20c:
    english: Go to the Subgroup tab, find the subgroup and click **Join group**.
    translation: Apri la scheda Sottogruppi, trova il sottogruppo e seleziona **Iscriviti al gruppo**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  64102057b4f533dd:
    english: "![Join group button on a closed subgroup](member_join_subgroup.png)"
    translation: "![Pulsante Iscriviti al gruppo in un sottogruppo chiuso](member_join_subgroup.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0f91a4020a9484ef:
    english: Now a member of the subgroup, an admin of the parent group can make themselves an admin of the subgroup.
    translation: Una volta entrato nel sottogruppo, l'amministratore del gruppo principale può nominarsi amministratore del sottogruppo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b10fec2c4c3ebb6c:
    english: "![Make admin action for a parent group admin](member_make_admin.png)"
    translation: "![Azione per nominare amministratore un amministratore del gruppo principale](member_make_admin.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dcb00619954e30a2:
    english: "## Delete a subgroup"
    translation: "## Eliminare un sottogruppo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  92e05281b2891dd5:
    english: Admins can delete a subgroup in the same way you delete a group. When deleting a subgroup, be careful to not delete the 'parent' group.
    translation: Gli amministratori possono eliminare un sottogruppo nello stesso modo in cui eliminano un gruppo. Quando elimini un sottogruppo, fai attenzione a non eliminare il gruppo principale.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a29b8361fb910cde:
    english: Learn [how to delete groups](/en/user_manual/groups/deleting_your_group/).
    translation: Scopri [come eliminare i gruppi](/en/user_manual/groups/deleting_your_group/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
