  2072a463e55dfba1:
    english: "# Advice"
    translation: "# Tanács"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  aadbf3844be4a95f:
    english: An Advice proposal gathers input for a decision that a person or team is responsible for making. Participants can offer advice or indicate that they have no advice to add.
    translation: A Tanács javaslat olyan döntéshez gyűjt véleményeket, amelyet egy személynek vagy csapatnak kell meghoznia. A résztvevők tanácsot adhatnak, vagy jelezhetik, hogy nincs hozzáfűznivalójuk.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  769a2446fc3ec4a9:
    english: This page explains the Advice proposal form, voting, and results. See the [Advice process](/en/guides/making_decisions/advice_process) for the complete workflow from framing the decision to publishing an outcome.
    translation: Ez az oldal bemutatja a Tanács javaslat űrlapját, a szavazást és az eredményeket. A döntés megfogalmazásától a következtetés közzétételéig tartó teljes folyamatot a [Tanácsadási folyamat](/en/guides/making_decisions/advice_process) oldalon találod.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f19e32088d70eec4:
    english: "## When to use Advice"
    translation: "## Mikor használd a Tanács javaslatot"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d4c7e7da6f2d5860:
    english: Use Advice when the decision maker wants input from people with relevant expertise or people affected by the decision. It works well for supplier choices, operational decisions, policy drafts, and decisions within a delegated role.
    translation: A Tanács javaslatot akkor használd, ha a döntéshozó az érintettek vagy a témában jártas emberek véleményét szeretné megismerni. Jól használható beszállítóválasztáshoz, működési döntésekhez, szabályzattervezetekhez és átruházott hatáskörben hozott döntésekhez.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a81e33e00080fbe4:
    english: Advice is not an approval vote. Say who will make the decision, what constraints apply, and how they will consider the responses.
    translation: A Tanács javaslat nem jóváhagyó szavazás. Írd le, ki hozza meg a döntést, milyen korlátok érvényesek, és hogyan veszi figyelembe a válaszokat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4be7ef0783f6e444:
    english: "## Example: choose a washing supplier"
    translation: "## Példa: mosási szolgáltató kiválasztása"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d8157e98107798c6:
    english: Oatmilk Cooperative's operations coordinator must select a washing supplier. They invite advice about capacity, food-safety records, water use, service response times, and support.
    translation: A Zabtej Szövetkezet működési koordinátorának mosási szolgáltatót kell választania. Tanácsot kér a kapacitásról, az élelmiszer-biztonsági nyilvántartásokról, a vízfelhasználásról, a megkeresésekre adott válaszidőről és a támogatásról.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9703f1f9474243af:
    english: "## Set up the proposal"
    translation: "## A javaslat létrehozása"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6b9c305f0f4000d9:
    english: Describe the decision, name the decision maker, and include the information participants need. Invite people who are affected or have relevant knowledge. The default options let someone offer advice or abstain.
    translation: Írd le a döntést, nevezd meg a döntéshozót, és adj meg minden információt, amelyre a résztvevőknek szükségük van. Hívd meg az érintetteket és a témában jártas embereket. Az alapértelmezett lehetőségek közül választhatnak tanácsadást vagy tartózkodást.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Szavazás"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0a259af7a59899b7:
    english: Participants select **Advice** and give a concrete recommendation, risk, question, or relevant experience. They can abstain when they have no useful input.
    translation: A résztvevők kiválasztják a **Tanács** lehetőséget, és konkrét javaslatot, kockázatot, kérdést vagy kapcsolódó tapasztalatot osztanak meg. Tartózkodhatnak is, ha nincs hasznos észrevételük.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Az eredmények áttekintése"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1d4bf7b5d0079f87:
    english: The chart confirms who has responded, but the reasons contain the substance of an Advice proposal. Look for constraints, agreements, and conflicting recommendations rather than treating the most common response as the decision.
    translation: A diagram megmutatja, ki válaszolt, de a Tanács javaslat lényegét az indoklások adják. Figyelj a korlátokra, az egyetértési pontokra és az egymásnak ellentmondó ajánlásokra. A leggyakoribb választ ne tekintsd döntésnek.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e9fc01ce6c059f29:
    english: The decision maker publishes an outcome explaining what they decided and how the advice informed it.
    translation: A döntéshozó közzétesz egy következtetést, amelyben leírja, mit döntött, és hogyan vette figyelembe a kapott tanácsokat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
