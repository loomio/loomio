    translated_on: '2026-09-30'
  964f575e90aa9cde:
    english: Return the groups in which the API-key user has an active membership.
    translation: Ruft die Gruppen ab, in denen der API-Schlüssel-Benutzer eine aktive Mitgliedschaft hat.
    status: machine
