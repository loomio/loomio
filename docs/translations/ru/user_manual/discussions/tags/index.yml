  1d390c0c4f4cea4a:
    english: Category tags make it easy to find threads and polls about a particular type of work or topic.
    translation: Теги категорий помогают находить обсуждения и опросы по определённой теме или виду работы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  572adf8961fc1178:
    english: |-
      Tags belong to the whole organization. A tag used in a parent group is the
      same tag in its subgroups, making it possible to organize related work across
      the organization. Loomio displays tag names alphabetically and shows their
      colors as dots beside the names.
    translation: |-
      Теги действуют во всей организации. Тег родительской группы — это тот же
      тег в её подгруппах. Так можно объединять связанную работу во всей
      организации. Loomio показывает названия тегов в алфавитном порядке, а их
      цвета — точками рядом с названиями.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b5340bcbf37095dc:
    english: |-
      On your group page, click **Tags** above the thread list to see the tags used in
      the current group. Select a tag to show only threads with that tag. Use the
      filter textbox to search a long list, or select **Show more** to include all
      tags in the organization. Select **Show fewer** to return to the current
      group's tags.
    translation: |-
      На странице группы нажмите **Метки** над списком обсуждений, чтобы увидеть теги,
      используемые в этой группе. Выберите тег, чтобы показать только обсуждения с ним. Используйте
      поле поиска, если список длинный, или нажмите **Показать больше**, чтобы увидеть все
      теги организации. Нажмите **Показать меньше**, чтобы снова увидеть теги
      текущей группы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9de81b9a795d066d:
    english: "## Apply tags"
    translation: "## Добавление тегов"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bf284f7568360b53:
    english: Members who can edit a thread or poll can apply tags to it.
    translation: Участники, которые могут редактировать обсуждение или опрос, могут добавлять к ним теги.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  58488fe368513138:
    english: When you start a thread or poll, click the **Tags** field and select one or more tags.
    translation: При создании обсуждения или опроса нажмите на поле **Метки** и выберите один или несколько тегов.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e060934a2853a35a:
    english: Start typing to filter the list. Select a tag again, or click the × on its chip, to remove it.
    translation: Начните вводить текст, чтобы отфильтровать список. Чтобы удалить тег, выберите его ещё раз или нажмите × на его плашке.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9f5e48b7e520d1a0:
    english: "## Create tags"
    translation: "## Создание тегов"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  efa789e9365b2ab2:
    english: |-
      Parent-group admins can always create tags for the parent group and its
      subgroups. Subgroup admins can create tags while tagging content in their
      subgroup. The **Members can create tags** group permission, enabled by default,
      allows other members who can tag a thread or poll to create new tag names. If
      the permission is disabled, members can still apply existing tags.
    translation: |-
      Администраторы родительской группы всегда могут создавать теги для неё и её
      подгрупп. Администраторы подгрупп могут создавать теги при добавлении их к материалам
      своей подгруппы. Включённое по умолчанию разрешение группы **Участники могут создавать теги.**
      позволяет другим участникам, которые могут добавлять теги к обсуждениям и опросам, создавать новые теги. Если
      разрешение отключено, участники всё равно могут использовать существующие теги.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7e06376f3431ad2f:
    english: To create a tag while starting a thread or poll, type its name in the **Tags** field and press Enter.
    translation: Чтобы создать тег при создании обсуждения или опроса, введите его название в поле **Метки** и нажмите Enter.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
