  '099449b0e1fe4f85':
    english: Loomio also includes a Question round for collecting questions without voting. Group administrators can make it available from [Poll templates](/en/user_manual/polls/poll_templates/).
    translation: Loomio heeft ook een Vragenronde om vragen te verzamelen zonder te stemmen. Groepsbeheerders kunnen deze beschikbaar maken via [Poll-sjablonen](/en/user_manual/polls/poll_templates/).
    status: machine
