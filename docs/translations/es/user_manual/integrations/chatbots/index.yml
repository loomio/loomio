  290b36f9178272e2:
    english: |-
      Our webhook based system can also be used to support other systems that support incoming webhooks with either HTML or Markdown formatting. This could be something like Zapier or Rocketchat.
      Just select the mattermost bot, but use a custom webhook URL.
    translation: |-
      El sistema de webhooks también puede funcionar con otros servicios que acepten webhooks entrantes con formato HTML o Markdown, como Zapier o Rocketchat.
      Selecciona el bot de Mattermost y usa una URL de webhook personalizada.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f76c44196c94dcef:
    english: "## Set up a chat integration"
    translation: "## Configurar una integración de chat"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3c63f567f90fd1eb:
    english: |-
      After configuring your chosen service (see above), you'll have a webhook URL.
      Open **Chat integrations** from the group menu and add a new chat integration for your group.
    translation: |-
      Después de configurar el servicio que hayas elegido (consulta las guías anteriores), tendrás una URL de webhook.
      Abre **Integraciones de chat** desde el menú del grupo y añade una nueva integración de chat para tu grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
