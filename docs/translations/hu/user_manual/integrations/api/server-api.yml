    translated_on: '2026-09-30'
  f64bc40a8142367d:
    english: Send credentials only in the `Authorization` header. API keys in query strings or request bodies are rejected.
    translation: A hitelesítési adatokat csak az `Authorization` fejlécben küldd el. A lekérdezési karakterláncban vagy a kérés törzsében megadott API-kulcsokat a rendszer elutasítja.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
