  2e7de12fecf4173f:
    english: "# Chat integrations"
    translation: "# אינטגרציות צ'אט"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  195fe68dbcc6418f:
    english: Loomio can send notifications to your chatroom.
    translation: Loomio יכולה לשלוח התראות לחדר הצ'אט של הקבוצה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bf886ec0d398e8d7:
    english: Chat tools and Loomio work well together. Use chat for quick conversation and timely updates. Move important topics to Loomio when people need time to participate, when a decision must be made, or when the group will need a lasting record.
    translation: כלי צ'אט ו־Loomio משתלבים היטב. צ'אט מתאים לשיחות מהירות ולעדכונים שוטפים. כשנדרש זמן להשתתפות, יש לקבל החלטה או חשוב לשמור תיעוד לאורך זמן, כדאי להעביר את הנושא ל־Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  db7d26a18ddc651d:
    english: Loomio supports Slack, Discord, Microsoft Teams, Matrix and Mattermost.
    translation: Loomio תומכת ב־Slack, ב־Discord, ב־Microsoft Teams, ב־Matrix וב־Mattermost.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  765fc0d609a0db99:
    english: You can send notifications to your chatroom any time you like, just the same way you would invite individual people to vote, or to join a thread.
    translation: ניתן לשלוח התראות לחדר הצ'אט בכל עת, כפי שניתן להזמין אנשים להצביע או להצטרף לשרשור.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a89717f4f41f3212:
    english: You can also configure notifications to always happen when a specific event happens, like someone starting a thread.
    translation: אפשר גם להגדיר שליחה אוטומטית של התראות כשמתרחש אירוע מסוים, למשל כשנפתח שרשור.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c425490496cb0ed2:
    english: |-
      ## What it looks like in chat
      ![](chatbot_in_slack.png)
    translation: |-
      ## כך זה נראה בצ'אט
      ![](chatbot_in_slack.png)
    status: machine
