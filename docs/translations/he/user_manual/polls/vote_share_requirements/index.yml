  54368e42ed93ae0c:
    english: "# Vote share requirements"
    translation: "# דרישות לשיעור הקולות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2051086558658db2:
    english: Set a vote share requirement on an option when a proposal must receive a particular percentage of support, or remain below a particular percentage of opposition, to pass.
    translation: אפשר להגדיר דרישה לשיעור הקולות עבור אפשרות בהצעה, כאשר אישור ההצעה מחייב אחוז מסוים של תמיכה או שיעור התנגדות שאינו עולה על אחוז מסוים.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f00d3806d6b890ae:
    english: Vote share requirements can be combined with a [quorum](/en/user_manual/polls/quorum/) to require both sufficient participation and a particular distribution of votes.
    translation: אפשר לשלב דרישות לשיעור הקולות עם [מניין משתתפים מינימלי](/en/user_manual/polls/quorum/) כדי לחייב גם השתתפות מספקת וגם חלוקה מסוימת של הקולות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0fc0acd12134f67e:
    english: When creating a proposal, select the edit icon beside an option.
    translation: בעת יצירת הצעה, יש לבחור בסמל העריכה שליד האפשרות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  27979c31066e397f:
    english: "![The edit icon beside the Consent option](edit-highlight-on-option.png)"
    translation: "![סמל העריכה שליד האפשרות הַסכָּמָה](edit-highlight-on-option.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b3a4dee73762bea4:
    english: "## Eligible voters and votes cast"
    translation: "## בעלי זכות הצבעה וקולות שהושלכו"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1d04d75fa16a2a18:
    english: The percentage can be based on either **Votes cast** or **Eligible voters**.
    translation: אפשר לחשב את האחוז על בסיס **קולות שהושלכו** או **בעלי זכות הצבעה**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  590e1a316f9ad174:
    english: "![Choosing whether a vote share requirement uses votes cast or eligible voters](./eligible-vs-cast.png)"
    translation: "![בחירה אם הדרישה לשיעור הקולות מבוססת על קולות שהושלכו או על בעלי זכות הצבעה](./eligible-vs-cast.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d4c72d50982e071d:
    english: "**Eligible voters** means everyone who is able to vote in the proposal. **Votes cast** means only the votes that have been submitted."
    translation: "**בעלי זכות הצבעה** הם כל מי שיכולים להצביע בהצעה. **קולות שהושלכו** הם רק ההצבעות שהוגשו."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  24945a1a4f0d08e3:
    english: A requirement of 75 percent agreement from eligible voters can pass only when at least 75 percent of all eligible voters vote for that option.
    translation: דרישה להסכמה של 75 אחוז מבעלי זכות ההצבעה מתקיימת רק אם לפחות 75 אחוז מכל בעלי זכות ההצבעה מצביעים בעד האפשרות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  14e4ff7cd000c7af:
    english: A requirement of 60 percent agreement from votes cast can pass when 60 percent of submitted votes support the option, regardless of overall turnout. Add a quorum when your process also requires a minimum level of participation.
    translation: דרישה להסכמה של 60 אחוז מהקולות שהושלכו מתקיימת אם 60 אחוז מההצבעות שהוגשו תומכות באפשרות, ללא תלות בשיעור ההשתתפות הכולל. אם התהליך מחייב גם רמת השתתפות מינימלית, יש להוסיף מניין משתתפים מינימלי.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a8f235434b40ecd9:
    english: "## Different vote share requirements"
    translation: "## דרישות שונות לשיעור הקולות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6682c9656815bdbc:
    english: 'A proposal can have requirements on more than one option. For example:'
    translation: 'אפשר להגדיר דרישות ליותר מאפשרות אחת בהצעה. לדוגמה:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dac1980305bef52d:
    english: |-
      - Agreement must be at least 75 percent of eligible voters
      - Abstention must be no more than 30 percent of votes cast
      - Block must be no more than 0 percent of votes cast
    translation: |-
      - הסכמה של לפחות 75 אחוז מבעלי זכות ההצבעה
      - הימנעות של לא יותר מ־30 אחוז מהקולות שהושלכו
      - חסימה של לא יותר מ־0 אחוז מהקולות שהושלכו
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  11325e607f603eb7:
    english: You can also add requirements to a [poll template](/en/user_manual/polls/poll_templates/) so that new proposals created from the template use them by default.
    translation: אפשר להוסיף דרישות גם ל[תבנית משאל](/en/user_manual/polls/poll_templates/), כך שהן יחולו כברירת מחדל על הצעות חדשות שנוצרות מהתבנית.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d6bffbdadc45e7f5:
    english: "## Detailed example"
    translation: "## דוגמה מפורטת"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4318dab03fe217ad:
    english: Oatmilk Cooperative is deciding whether to approve the budget for its six-week returnable bottle trial. Five people are eligible to vote.
    translation: קואופרטיב Oatmilk מחליט אם לאשר את התקציב לניסוי בן שישה שבועות בבקבוקים להחזרה. לחמישה אנשים יש זכות הצבעה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8f5779f2f1bb9ec3:
    english: Jamie uses the **Consent** proposal template, edits the Consent option, and enables its vote share requirement.
    translation: ג׳יימי משתמשת בתבנית ההצעה **הַסכָּמָה**, עורכת את האפשרות הַסכָּמָה ומפעילה את הדרישה שלה לשיעור הקולות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  842038ffbd273e57:
    english: The cooperative's process requires at least 75 percent of eligible voters to support the proposal. Jamie sets the requirement to **At least 75% of Eligible voters**.
    translation: התהליך של הקואופרטיב מחייב תמיכה בהצעה של לפחות 75 אחוז מבעלי זכות ההצבעה. ג׳יימי מגדירה את הדרישה ל־**לפחות 75% מבעלי זכות הצבעה**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5b852b2e7a9b3034:
    english: "![The Consent option requiring at least 75 percent of eligible voters](./consent-vote-option.png)"
    translation: "![האפשרות הַסכָּמָה עם דרישה לתמיכה של לפחות 75 אחוז מבעלי זכות ההצבעה](./consent-vote-option.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8a42a135c0c11c98:
    english: Jamie also sets a 60 percent quorum. Jamie and Samira vote in agreement. All submitted votes support the proposal, but they represent only 40 percent of eligible voters, so neither requirement has been reached.
    translation: ג׳יימי מגדירה גם מניין משתתפים מינימלי של 60 אחוז. ג׳יימי וסמירה מצביעות בעד. כל ההצבעות שהוגשו תומכות בהצעה, אך הן מייצגות רק 40 אחוז מבעלי זכות ההצבעה. לכן אף אחת מהדרישות עדיין לא התקיימה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2284440b974635e3:
    english: "![Two of five people have voted in agreement and neither requirement is reached](./first-vote-breakdown.png)"
    translation: "![שניים מתוך חמישה אנשים הצביעו בעד, ואף אחת מהדרישות לא התקיימה](./first-vote-breakdown.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2cb3890f4ef20320:
    english: Alex and Morgan then agree, while Taylor disagrees. All five people have voted, reaching the quorum, and four of five eligible voters agree. The 80 percent agreement exceeds the 75 percent vote share requirement, so both requirements show green check marks.
    translation: לאחר מכן אלכס ומורגן מצביעים בעד, וטיילור מצביעים נגד. כל חמשת בעלי זכות ההצבעה הצביעו, ולכן הושג מניין המשתתפים המינימלי. ארבעה מתוך החמישה תומכים בהצעה. שיעור התמיכה של 80 אחוז עולה על הדרישה ל־75 אחוז, ולכן ליד שתי הדרישות מופיעים סימני אישור ירוקים.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6b09cbe2063c0a6a:
    english: "![All five people have voted and both requirements are reached](./final-vote-breakdown.png)"
    translation: "![כל חמשת האנשים הצביעו ושתי הדרישות התקיימו](./final-vote-breakdown.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
