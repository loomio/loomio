  1d390c0c4f4cea4a:
    english: Category tags make it easy to find threads and polls about a particular type of work or topic.
    translation: Luokkatunnisteiden avulla löydät helposti tiettyyn työhön tai aiheeseen liittyvät keskustelut ja kyselyt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  572adf8961fc1178:
    english: |-
      Tags belong to the whole organization. A tag used in a parent group is the
      same tag in its subgroups, making it possible to organize related work across
      the organization. Loomio displays tag names alphabetically and shows their
      colors as dots beside the names.
    translation: |-
      Tunnisteet ovat koko organisaation yhteisiä. Pääryhmässä käytetty tunniste on
      sama myös sen alaryhmissä. Näin voit järjestää toisiinsa liittyvää työtä koko
      organisaatiossa. Loomio näyttää tunnisteiden nimet aakkosjärjestyksessä ja
      niiden värit pisteinä nimien vieressä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b5340bcbf37095dc:
    english: |-
      On your group page, click **Tags** above the thread list to see the tags used in
      the current group. Select a tag to show only threads with that tag. Use the
      filter textbox to search a long list, or select **Show more** to include all
      tags in the organization. Select **Show fewer** to return to the current
      group's tags.
    translation: |-
      Näet ryhmässä käytetyt tunnisteet napsauttamalla ryhmäsivulla keskusteluluettelon
      yläpuolella olevaa **Tunnisteet**-painiketta. Valitse tunniste, niin näet vain sillä
      merkityt keskustelut. Voit etsiä tunnisteita pitkästä luettelosta suodatuskentän
      avulla tai valita **Näytä lisää**, jolloin näet organisaation kaikki tunnisteet.
      Valitse **Näytä vähemmän**, niin näet taas vain tämän ryhmän tunnisteet.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9de81b9a795d066d:
    english: "## Apply tags"
    translation: "## Lisää tunnisteita"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bf284f7568360b53:
    english: Members who can edit a thread or poll can apply tags to it.
    translation: Jäsenet, jotka voivat muokata keskustelua tai kyselyä, voivat lisätä siihen tunnisteita.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  58488fe368513138:
    english: When you start a thread or poll, click the **Tags** field and select one or more tags.
    translation: Kun aloitat keskustelun tai kyselyn, napsauta **Tunnisteet**-kenttää ja valitse yksi tai useampi tunniste.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e060934a2853a35a:
    english: Start typing to filter the list. Select a tag again, or click the × on its chip, to remove it.
    translation: Ala kirjoittaa suodattaaksesi luetteloa. Poista tunniste valitsemalla se uudelleen tai napsauttamalla sen merkissä olevaa ×-painiketta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9f5e48b7e520d1a0:
    english: "## Create tags"
    translation: "## Luo tunnisteita"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  efa789e9365b2ab2:
    english: |-
      Parent-group admins can always create tags for the parent group and its
      subgroups. Subgroup admins can create tags while tagging content in their
      subgroup. The **Members can create tags** group permission, enabled by default,
      allows other members who can tag a thread or poll to create new tag names. If
      the permission is disabled, members can still apply existing tags.
    translation: |-
      Pääryhmän ylläpitäjät voivat aina luoda tunnisteita pääryhmälle ja sen
      alaryhmille. Alaryhmän ylläpitäjät voivat luoda tunnisteita merkitessään
      alaryhmänsä sisältöä. Oletusarvoisesti käytössä oleva **Jäsenet voivat luoda tunnisteita**
      -ryhmäoikeus sallii uusien tunnisteiden luomisen myös muille jäsenille, jotka
      voivat merkitä keskustelun tai kyselyn. Jos oikeus poistetaan käytöstä, jäsenet voivat edelleen käyttää olemassa olevia tunnisteita.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7e06376f3431ad2f:
    english: To create a tag while starting a thread or poll, type its name in the **Tags** field and press Enter.
    translation: 'Voit luoda tunnisteen aloittaessasi keskustelun tai kyselyn: kirjoita sen nimi **Tunnisteet**-kenttään ja paina Enter-näppäintä.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
