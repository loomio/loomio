  a0a3c706db8ca405:
    english: "| **Advice process** | **On Loomio** |\n|---|---|\n| You notice a problem or opportunity and take the initiative. |  |\n| Seek input to sound out perspectives before proposing action. | Start a Loomio **discussion** to provide context and open conversation. Run an **[Advice proposal](/en/user_manual/polls/proposals/advice/)** when you want a defined response period, vote reasons, and a clear record of who participated. |\n| Taking advice received into account, you make a decision and inform the people who have given advice. | Add an an **outcome** to the discussion thread.   <br /><br />State the decision made and thank people for their advice and feedback.  <br /><br />   Say what will happen next and notify people about the outcome.  <br /><br />The outcome statement is an important record of the decision for future reference. <br /> <br /> Either update the context to include this outcome, or state it in a comment you pin to the timeline to quickly find it in the future.<br /><br/> |        "
    translation: |-
      | **Processo de aconselhamento** | **No Loomio** |
      |---|---|
      | Você percebe um problema ou uma oportunidade e toma a iniciativa. |  |
      | Peça opiniões para conhecer diferentes perspectivas antes de propor uma ação. | Inicie uma **discussão** no Loomio para apresentar o contexto e abrir a conversa. Crie uma **[proposta de aconselhamento](/en/user_manual/polls/proposals/advice/)** quando quiser definir um período para respostas, receber justificativas dos votos e registrar claramente quem participou. |
      | Considere os conselhos recebidos, tome uma decisão e informe as pessoas que contribuíram. | Adicione uma **conclusão** à discussão.   <br /><br />Descreva a decisão tomada e agradeça às pessoas pelos conselhos e comentários.  <br /><br />   Explique o que acontecerá em seguida e notifique as pessoas sobre a conclusão.  <br /><br />A conclusão é um registro importante da decisão para consultas futuras. <br /> <br /> Atualize o contexto para incluir a conclusão ou registre-a em um comentário fixado na linha do tempo para encontrá-la facilmente depois.<br /><br/> |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
