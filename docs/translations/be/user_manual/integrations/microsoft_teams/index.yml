  9e82eeed268ff95b:
    english: |-
      Visit [https://teams.microsoft.com](https://teams.microsoft.com) then click Apps
      ![](t1.png)
    translation: |-
      Адкрыйце [https://teams.microsoft.com](https://teams.microsoft.com), затым націсніце «Праграмы»
      ![](t1.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4013a8134cd33c5e:
    english: |-
      Search for "webhook" in the search field, then click Incoming Webhook
      ![](t2.png)
    translation: |-
      Увядзіце «webhook» у поле пошуку, затым націсніце «Уваходны вэбхук»
      ![](t2.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  27e11023c40ed56d:
    english: |-
      Click "Add to a team"
      ![](t3.png)
    translation: |-
      Націсніце «Дадаць у каманду»
      ![](t3.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6d1831726b04a7f5:
    english: |-
      Type and select the channel you want Loomio notifications to appear within.
      ![](t4.png)
    translation: |-
      Увядзіце назву канала, у якім павінны з’яўляцца апавяшчэнні Loomio, і выберыце яго.
      ![](t4.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a046f5d6ec1f29bd:
    english: |-
      Give it a name, such as "Loomio notifications", then click "Create"
      ![](t5.png)
    translation: |-
      Дайце вэбхуку назву, напрыклад «Апавяшчэнні Loomio», затым націсніце «Стварыць»
      ![](t5.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  10c1340978fde8ff:
    english: |-
      Copy the URL it gives you, you'll paste it into Loomio in the last step.
      ![](t6.png)
    translation: |-
      Скапіруйце атрыманы URL-адрас. На апошнім кроку вы ўставіце яго ў Loomio.
      ![](t6.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
