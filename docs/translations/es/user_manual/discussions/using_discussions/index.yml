---
navigation_title: Usar los hilos
blocks:
  d6fe7310d19b1141:
    english: "# Using threads"
    translation: "# Usar los hilos"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  031f9244f107aba8:
    english: A discussion keeps its context, comments, decisions, and outcomes together in one thread. This page explains how to participate in a thread and use its navigation and actions.
    translation: Una discusión reúne su contexto, comentarios, decisiones y conclusiones en un solo hilo. Esta página explica cómo participar en un hilo y utilizar sus opciones de navegación y acciones.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  479a1564b496bfed:
    english: "## Thread anatomy"
    translation: "## Partes de un hilo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb745de96e6a612d:
    english: 'A typical thread looks like this:'
    translation: 'Un hilo típico tiene este aspecto:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e69f7f0b13fd9f9:
    english: 'From the top of the page, a thread contains:'
    translation: 'De arriba abajo, un hilo contiene:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5b47d6434aa50e94:
    english: "**Group name** - At the top left of the discussion page is the name of the group or subgroup that the discussion belongs to.  Click on this name to go back to the group page."
    translation: "**Nombre del grupo** - En la parte superior izquierda de la página de la discusión aparece el nombre del grupo o subgrupo al que pertenece. Haz clic en el nombre para volver a la página del grupo."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0dab4c46c2bee003:
    english: "**Discussion access** - The access icon at the top right opens the discussion's access settings. A group discussion is available to group members and anyone specifically invited to it, subject to the group's privacy settings."
    translation: "**Acceso a la discusión** - El icono de acceso, en la parte superior derecha, abre la configuración de acceso a la discusión. Los miembros del grupo y las personas invitadas expresamente pueden acceder a una discusión del grupo, según la configuración de privacidad del grupo."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e20178954e6d3ce0:
    english: "**Discussion title** - The name of the discussion."
    translation: "**Título de la discusión** - El nombre de la discusión."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  47687209ed924849:
    english: "**Category tags** - The discussion may have one or more category tags. Using simple tags helps people more easily find discussions of a similar type."
    translation: "**Etiquetas por categorías ** - La discusión puede tener una o varias etiquetas de categoría. Las etiquetas sencillas ayudan a encontrar discusiones similares."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b817649f985f51de:
    english: "**Discussion author** - The name and avatar of the person who started the discussion, shown beneath the title."
    translation: "**Autor de la discusión** - El nombre y el avatar de la persona que inició la discusión aparecen debajo del título."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c44d5a833b4ec9ff:
    english: "**Date** - Hover over the date to see the full date and time of discussion start."
    translation: "**Fecha** - Pasa el cursor sobre la fecha para ver el día y la hora en que comenzó la discusión."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b8062113f1078acb:
    english: "**Seen by** - In the right sidebar, shows who has read the discussion and when."
    translation: "**Visto por** - En la barra lateral derecha, muestra quién ha leído la discusión y cuándo."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  133d0c2e469e9683:
    english: "**Notified** - In the right sidebar, shows who has been notified about the discussion and whether each notification has been read or its email opened."
    translation: "**Notificado** - En la barra lateral derecha, muestra a quién se ha notificado sobre la discusión y si cada persona ha leído la notificación o abierto el correo electrónico."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9f788adb4eab80cc:
    english: "**Discussion context** - Content to frame the discussion."
    translation: "**Contexto de la discusión** - Contenido que presenta el tema de la discusión."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e8c5ae76dfb5b89b:
    english: "**Discussion interaction and administration tools** - The discussion context has controls to react to and edit it. The right sidebar contains notification, membership and administration actions."
    translation: "**Herramientas de interacción y administración de la discusión** - El contexto de la discusión incluye controles para reaccionar y editarlo. La barra lateral derecha contiene acciones relacionadas con las notificaciones, los miembros y la administración."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8f6eac4359c2b9f6:
    english: "**Comments** - Comments are displayed under the discussion context. The author's name, avatar and posting time show who wrote each comment and when. Interaction and administration tools are available on each comment."
    translation: "**Comentarios** - Los comentarios aparecen debajo del contexto de la discusión. El nombre, el avatar y la hora de publicación indican quién escribió cada comentario y cuándo. Cada comentario dispone de herramientas de interacción y administración."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f978af6c9af4afe5:
    english: |-
      **Navigation, notifications and actions** - The right sidebar contains
      shortcuts to activity and milestones, notification and membership information,
      and the thread actions available to you.
    translation: |-
      **Navegación, notificaciones y acciones** - La barra lateral derecha contiene
      accesos directos a la actividad y los hitos, información sobre notificaciones y miembros,
      y las acciones del hilo disponibles para ti.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f8c4084e9e8a2b27:
    english: "## Discussion context"
    translation: "## Contexto de la discusión"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5940bad6cb1cb49f:
    english: The discussion **context** is always found at the top of the discussion. Use the context to frame the discussion or decision.
    translation: El **contexto** siempre aparece al principio de la discusión. Úsalo para presentar la discusión o la decisión.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  415dd2d0f1eacc9f:
    english: Think of your group as you write content in the discussion context.  Your aim is to get a discussion going, so consider how you can motivate people to participate.  In general, keep the discussion context simple and clear.
    translation: Piensa en tu grupo al redactar el contexto de la discusión. El objetivo es iniciar una conversación, así que considera cómo animar a las personas a participar. En general, mantén el contexto sencillo y claro.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a1fcece28d8fb61d:
    english: Write the discussion context when starting or editing a discussion. **Edit** a discussion with the pencil icon.
    translation: Escribe el contexto al iniciar o editar una discusión. Para editarla, selecciona **Editar** mediante el icono del lápiz.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2f47adddef6b31d9:
    english: As the discussion progresses, update discussion context.  Think of the context like a whiteboard in your meeting room, where you can write the agenda, the outcomes intended and how you plan to get there.
    translation: 'Actualiza el contexto a medida que avanza la discusión. Puedes usarlo como una pizarra de reuniones: anota el orden del día, las conclusiones que buscáis y cómo pensáis llegar a ellas.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c82ec20629208982:
    english: At the bottom of the context panel is a formatting bar, where you can format text, attach files, images and embed a video.
    translation: En la parte inferior del panel de contexto hay una barra con la que puedes dar formato al texto, adjuntar archivos e imágenes e insertar un vídeo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e606d83ae0fb2178:
    english: "### Notify people about context changes"
    translation: "### Notificar a las personas sobre cambios en el contexto"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d188326a58b28d96:
    english: When you edit the discussion context, use **What's changed?** to summarize the update and choose who should be notified.
    translation: Cuando edites el contexto de la discusión, usa **¿Qué ha cambiado?** para resumir la actualización y elegir a quién notificar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  842091a987742d6d:
    english: "![Editing a discussion context with a change summary and notification recipients](../notifying_people/thread_editcontext.png)"
    translation: "![Edición del contexto de una discusión con un resumen de cambios y destinatarios de la notificación](../notifying_people/thread_editcontext.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b885359dd7e83428:
    english: The summary appears as an item in the thread so participants can see what changed.
    translation: El resumen aparece como un elemento del hilo para que quienes participan puedan ver qué ha cambiado.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c899c47e98f79a23:
    english: "![A timeline item describing a discussion context change](../notifying_people/thread_edit_comment.png)"
    translation: "![Elemento de la cronología que describe un cambio en el contexto de la discusión](../notifying_people/thread_edit_comment.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  44ffd1d0a732b897:
    english: "## Navigation"
    translation: "## Navegación"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e96aef7a28a85001:
    english: 'The **Jump to** section of the right sidebar helps you move through a thread:'
    translation: 'La sección **Saltar a** de la barra lateral derecha te ayuda a desplazarte por el hilo:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4790c088af5fc09f:
    english: |-
      - **Start** goes to the discussion context
      - **New to you** appears when the thread contains activity you have not read
      - **Latest** appears when newer activity is available beyond the items currently loaded
      - milestone links go directly to important comments, polls, and outcomes
      - **End** goes to the latest item in the thread
    translation: |-
      - **Comenzar** te lleva al contexto de la discusión
      - **Nuevo para ti** aparece cuando el hilo contiene actividad que no has leído
      - **Últimos** aparece cuando hay actividad más reciente que los elementos cargados
      - los enlaces a hitos te llevan directamente a comentarios, sondeos y conclusiones importantes
      - **Fin** te lleva al último elemento del hilo
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  941ea9900465724a:
    english: Comments that include an H2 or H3 heading, polls, and proposals are automatically included as milestone links. Select any milestone to go directly to it.
    translation: Los comentarios que incluyen un encabezado H2 o H3, los sondeos y las propuestas se añaden automáticamente como enlaces a hitos. Selecciona un hito para ir directamente a él.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e94ea6f4b9dae8d4:
    english: When you add a comment, poll, vote, or outcome, Loomio marks your own new item as read. It will not appear as something new for you to review.
    translation: Cuando añades un comentario, sondeo, voto o conclusión, Loomio marca ese elemento como leído para ti. No aparecerá como actividad nueva pendiente de revisar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  34251ada1ba3e50b:
    english: "## Notifications and members"
    translation: "## Notificaciones y miembros"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  36a20a0e10208c7c:
    english: The right sidebar controls your email notifications and shows who has been invited, who has seen the thread, and who has been notified.
    translation: La barra lateral derecha te permite controlar tus notificaciones por correo electrónico y muestra a quién se ha invitado, quién ha visto el hilo y a quién se ha notificado.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f2a437ac1169c882:
    english: "### Email notifications for this thread"
    translation: "### Notificaciones por correo electrónico de este hilo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9bd7269489ed048e:
    english: Select the current notification setting to choose whether Loomio emails you about all activity, only activity that specifically notifies you, or no activity. Receiving email for all activity can produce many messages in an active thread.
    translation: Selecciona la configuración actual de notificaciones para elegir si Loomio te envía correos sobre toda la actividad, solo sobre la actividad que te notifica expresamente o sobre ninguna actividad. En un hilo activo, recibir correos sobre toda la actividad puede generar muchos mensajes.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0d64de2345c8eba9:
    english: "![Email when notified selected in the discussion sidebar](../notifying_people/thread_interact.png)"
    translation: "![Opción de recibir un correo cuando te notifican seleccionada en la barra lateral de la discusión](../notifying_people/thread_interact.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7bdbdaa98e89d1c3:
    english: "### Invite people"
    translation: "### Invitar personas"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e81f85e723885264:
    english: Select **Invite people** to add people after the thread has started.
    translation: Selecciona **Invitar personas** para añadir personas después de iniciar el hilo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e38a572cdffad5cb:
    english: "![Invite people in the thread sidebar](../notifying_people/thread_invite_icon.png)"
    translation: "![Invitar personas desde la barra lateral del hilo](../notifying_people/thread_invite_icon.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7e4e643fb327aa06:
    english: Select a group or subgroup, enter the names of individual members, or enter an email address to invite a guest.
    translation: Selecciona un grupo o subgrupo, escribe los nombres de los miembros o introduce una dirección de correo electrónico para invitar a una persona como invitada.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  03c1d74b4a8bc31d:
    english: "![Invite people window with a field for names and email addresses](../notifying_people/thread_invite.png)"
    translation: "![Ventana para invitar personas con un campo para nombres y direcciones de correo electrónico](../notifying_people/thread_invite.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  85fc948a4e849ba8:
    english: A guest can see and participate in this thread but cannot see other discussions in the group unless separately invited.
    translation: Una persona invitada puede ver este hilo y participar en él, pero no puede ver otras discusiones del grupo a menos que también la invites a ellas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9f1010b58cc5439f:
    english: "![Inviting a guest by email address](../notifying_people/invite_guest.png)"
    translation: "![Invitación a una persona por correo electrónico](../notifying_people/invite_guest.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e688189fa93b1e49:
    english: To remove someone, open the three-dot menu (**⋯**) beside their name and select **Remove from discussion**.
    translation: Para quitar a alguien, abre el menú de tres puntos (**⋯**) junto a su nombre y selecciona **Eliminar de la discusión**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5602fbfa565eaf45:
    english: "### Seen by"
    translation: "### Visto por"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a929b22d02292573:
    english: "**Seen by** shows who has opened the thread and when. It can help you identify people who may not have seen important information yet."
    translation: "**Visto por** muestra quién ha abierto el hilo y cuándo. Te ayuda a identificar a quienes aún no hayan visto información importante."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d0335d202c5bbaa3:
    english: "![Seen by and Notified in the Thread members section](../notifying_people/thread_engagement.png)"
    translation: "![Visto por y Notificado en la sección de miembros del hilo](../notifying_people/thread_engagement.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb77150441a43f5c:
    english: "![Seen by window listing thread members](../notifying_people/thread_seenby.png)"
    translation: "![Ventana Visto por con la lista de miembros del hilo](../notifying_people/thread_seenby.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  185f80d66c2091d8:
    english: "### Notified"
    translation: "### Notificado"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  885a21cbc1a44f7d:
    english: "**Notified** opens the discussion notification history. It includes invitations, mentions, and replies, showing who was notified and whether each notification has been read when that information is available."
    translation: "**Notificado** abre el historial de notificaciones de la discusión. Incluye invitaciones, menciones y respuestas. Muestra quién recibió cada notificación y, cuando esa información está disponible, si la leyó."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e73fae9309f626e2:
    english: "![Discussion notification history](../notifying_people/thread_notified.png)"
    translation: "![Historial de notificaciones de la discusión](../notifying_people/thread_notified.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  347def7574cf5f1d:
    english: "## Actions"
    translation: "## Acciones"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '08ff4ccd500c2a69':
    english: The right sidebar contains actions for the whole thread. Some actions are also available from the three-dot menu (**⋯**) beside a thread on the group page.
    translation: La barra lateral derecha contiene acciones para todo el hilo. Algunas también están disponibles en el menú de tres puntos (**⋯**) junto al hilo en la página del grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e73701c7d36f95ef:
    english: The actions shown depend on your permissions. Group admins can manage threads, and group settings may allow members to perform some management actions. See [Group permissions](/en/user_manual/groups/settings/permissions).
    translation: Las acciones disponibles dependen de tus permisos. Los administradores del grupo pueden gestionar los hilos, y la configuración del grupo puede permitir que los miembros realicen algunas de estas acciones. Consulta [Permisos del grupo](/en/user_manual/groups/settings/permissions).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4fce317a163b0a40:
    english: "### Print"
    translation: "### Imprimir"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9317d4c7c5ef4764:
    english: Select **Print** to generate a page suitable for printing. Use your browser's print dialog to save it as a PDF.
    translation: Selecciona **Imprimir ** para generar una página apta para imprimir. Usa el cuadro de impresión de tu navegador para guardarla como PDF.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  443af0749df1db2a:
    english: "### Markdown"
    translation: "### Markdown"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eb0442148f7c042d:
    english: Select **Markdown** to save the complete thread as structured Markdown. Choose **Copy Markdown** to copy it to your clipboard, or **Download Markdown** to save it as a `.md` file. You can use it for meeting minutes, a document, an archive of decisions, an AI assistant, or another tool that supports Markdown.
    translation: Selecciona **Markdown** para guardar el hilo completo como Markdown estructurado. Elige **Copiar Markdown** para copiarlo al portapapeles o **Descargar Markdown** para guardarlo como un archivo `.md`. Puedes usarlo como acta de una reunión, documento, archivo de decisiones o contenido para un asistente de IA u otra herramienta compatible con Markdown.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  80e3f57638b53cb4:
    english: The document begins with YAML front matter containing the thread key, group, creation date, last activity date, and tags. It then includes the discussion context and every comment, poll, vote, and outcome in the same order and nesting as the threaded view.
    translation: El documento comienza con metadatos YAML que incluyen la clave del hilo, el grupo, la fecha de creación, la fecha de la última actividad y las etiquetas. Después incluye el contexto de la discusión y todos los comentarios, sondeos, votos y conclusiones, con el mismo orden y la misma estructura de respuestas que la vista en hilos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f99823b7b44e2cdd:
    english: Each poll is a section. Comments, votes, and outcomes are quoted, and replies are quoted beneath the item they answer. This shows where each person's text begins and ends. Each quote starts with one line showing the person, when they posted, the item's number in the thread, and any reactions. Votes and outcomes also say what they are. The thread key and item number identify each item in Loomio.
    translation: Cada sondeo forma una sección. Los comentarios, votos y conclusiones aparecen como citas, y las respuestas se citan debajo del elemento al que responden. Así puedes distinguir dónde empieza y termina el texto de cada persona. Cada cita comienza con una línea que indica quién publicó el elemento, cuándo lo hizo, su número en el hilo y sus reacciones, si las hay. Los votos y las conclusiones también indican qué tipo de elemento son. La clave del hilo y el número del elemento permiten identificar cada elemento en Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e5bdfbb4a0d7646f:
    english: Loomio applies the same visibility rules as the thread. Results and vote reasons you cannot see are not included, and voters are not identified in anonymous polls. If an open poll hides results until you vote, vote before exporting the thread. **Markdown** and **Print** are unavailable until you do.
    translation: Loomio aplica las mismas reglas de visibilidad que en el hilo. No se incluyen los resultados ni los motivos de voto que no puedes ver, y no se identifica a quienes votan en sondeos anónimos. Si un sondeo abierto oculta los resultados hasta que votes, vota antes de exportar el hilo. **Markdown** e **Imprimir ** no estarán disponibles hasta entonces.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
