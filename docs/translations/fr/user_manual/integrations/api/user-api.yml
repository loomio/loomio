    english: Send a list of emails. It will invite all the new email addresses to the group. Unlike listing memberships, this operation requires group-administrator permission.
    translation: Envoyez une liste d’adresses e-mail. Chaque nouvelle adresse recevra une invitation à rejoindre le groupe. Contrairement à la consultation des adhésions, cette opération nécessite les droits d’administration du groupe.
