  00be127a2f453ab3:
    english: 'Admin and keeping good records for audit is an important, and often legal requirement for your board or committee. '
    translation: ניהול ושמירת רשומות מסודרות לצורכי ביקורת הם עניין חשוב, ולעיתים גם דרישה חוקית, עבור מועצת המנהלים או הוועדה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e4617bf502879b0d:
    english: 'Increasingly, electronic records are supplanting the requirement for paper.  '
    translation: רשומות דיגיטליות מחליפות בהדרגה את הצורך ברשומות נייר.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e1d587f71cdcc6c1:
    english: 'However digital tools enable your board to do much more than just file meeting minutes.  '
    translation: כלים דיגיטליים מאפשרים למועצת המנהלים לעשות הרבה יותר מאשר לתייק פרוטוקולים של ישיבות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f249e5f83d487c4b:
    english: 'Transform your board: '
    translation: 'כך אפשר לשנות את עבודת מועצת המנהלים:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fd8154295c7350b7:
    english: |-
      *“Our board group has been particularly transformative, enabling continuous governance, improving response times and increasing our agility, resilience and sustainability… Loomio saves us thousands of pounds every year”*
      - Austen Cordasco Co-operative Assistance Network Limited (CAN) Business support services , United Kingdom
    translation: |-
      *״הקבוצה של מועצת המנהלים שלנו חוללה שינוי משמעותי. היא מאפשרת ניהול רציף, מקצרת את זמני התגובה ומשפרת את יכולת ההסתגלות, העמידות והקיימות שלנו… Loomio חוסכת לנו אלפי לירות שטרלינג בכל שנה״*
      - אוסטן קורדסקו, Co-operative Assistance Network Limited (CAN), שירותי תמיכה לעסקים, בריטניה
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b8eb8dcae7d7a78b:
    english: Let's look at how to organize work, administer discussions, keep data safe and store records in Loomio.
    translation: נראה כיצד לארגן את העבודה, לנהל דיונים, להגן על הנתונים ולשמור רשומות ב־Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a27011d28c4f11a6:
    english: "## Administering discussions"
    translation: "## ניהול דיונים"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8e67ece08e454475:
    english: There is a range of features in Loomio to help you administer discussions accessible from the drop down menu to the right of the discussion.
    translation: בתפריט הנפתח שמימין לדיון יש מגוון פעולות לניהול הדיון.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2d5be8c39f22ec28:
    english: 'Keep the discussion list current by using:'
    translation: 'כדי לשמור על רשימת דיונים מעודכנת, ניתן להשתמש בפעולות הבאות:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  75739da1bd5910a6:
    english: |-
      - **Pin discussion** to keep important discussions at the top of the list
      - **Edit discussion** to change discussion title or update discussion context
      - **Move to group** when you want to move a discussion to another group or subgroup, or to an archive group.
      - **Lock thread** to prevent further comments or changes and remove the thread from the list of open threads. Locked threads are available under the discussion filter and from the search bar, and can be unlocked at any time.
      - **Delete discussion** when you do not want to keep a record of the discussion.  Note that deleted discussions can not be un-deleted.
    translation: |-
      - **דיון בהצמדה** כדי להשאיר דיונים חשובים בראש הרשימה
      - **עריכת שיחה** כדי לשנות את כותרת הדיון או לעדכן את ההקשר שלו
      - **העבר לקבוצה** כדי להעביר דיון לקבוצה אחרת, לתת־קבוצה או לקבוצת ארכיון.
      - **נעילת שרשור** כדי למנוע תגובות או שינויים נוספים ולהסיר את השרשור מרשימת השרשורים הפתוחים. שרשורים נעולים זמינים דרך מסנן הדיונים ושורת החיפוש, ואפשר לבטל את נעילתם בכל עת.
      - **מחיקת דיון** כאשר אין צורך לשמור רשומה של הדיון. לתשומת לב: אי אפשר לשחזר דיונים שנמחקו.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e3d2099d0e6fe6fa:
    english: "## Category tags"
    translation: "## תגי קטגוריה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  24b03357f6f6c3b9:
    english: Category tags are a great way to label discussions so they can be easily found. Set tags and apply to each discussion  - try to be consistent.
    translation: תגי קטגוריה מקלים על מציאת דיונים. כדאי להגדיר תגיות, להחיל אותן על כל דיון ולהשתמש בהן באופן עקבי.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f0f5f5abd586fb61:
    english: 'Common board tags include: Administration, AGM, Board meeting, Report, Finance, Legal, Members, Minutes, Planning, Policy, Resolution, Constitution, General meeting, Strategy.'
    translation: 'תגיות נפוצות במועצות מנהלים כוללות: ניהול, אספה כללית שנתית, ישיבת מועצת מנהלים, דוח, כספים, עניינים משפטיים, חברים, פרוטוקולים, תכנון, מדיניות, החלטה, תקנון, אספה כללית ואסטרטגיה.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  89d8ec222f5019df:
    english: Group members can search for discussions by tag under the **tags** drop down menu.
    translation: חברי הקבוצה יכולים לחפש דיונים לפי תגית בתפריט הנפתח **תגיות**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  54ee008489cceaca:
    english: "## Maintaining the discussion topic"
    translation: "## שמירה על נושא הדיון"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e9007433ca60ae39:
    english: Discussions work best for everyone when you can keep the discussion on a single topic.
    translation: הדיונים מועילים יותר לכולם כשהם נשארים ממוקדים בנושא אחד.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f742ae07824b35c6:
    english: If a new topic is introduced in the middle of a discussion, you can select and move specific comments to another discussion, or start a new discussion.
    translation: אם עולה נושא חדש במהלך דיון, ניתן לבחור תגובות מסוימות ולהעביר אותן לדיון אחר, או לפתוח דיון חדש.
    status: machine
