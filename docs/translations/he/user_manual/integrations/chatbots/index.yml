  290b36f9178272e2:
    english: |-
      Our webhook based system can also be used to support other systems that support incoming webhooks with either HTML or Markdown formatting. This could be something like Zapier or Rocketchat.
      Just select the mattermost bot, but use a custom webhook URL.
    translation: |-
      אפשר להשתמש במערכת המבוססת על Webhook גם עם שירותים אחרים שתומכים ב־Webhooks נכנסים בפורמט HTML או Markdown, כגון Zapier או Rocketchat.
      יש לבחור בבוט של Mattermost ולהזין כתובת URL מותאמת של Webhook.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f76c44196c94dcef:
    english: "## Set up a chat integration"
    translation: "## הגדרת אינטגרציית צ'אט"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3c63f567f90fd1eb:
    english: |-
      After configuring your chosen service (see above), you'll have a webhook URL.
      Open **Chat integrations** from the group menu and add a new chat integration for your group.
    translation: |-
      לאחר הגדרת השירות שנבחר (ראו למעלה), תהיה כתובת URL של Webhook.
      יש לפתוח את **אינטגרציות צ'אט** מתפריט הקבוצה ולהוסיף אינטגרציית צ'אט חדשה לקבוצה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a2e8e555406040a6:
    english: |-
      ![](loomio-group-settings.png)
      ![](loomio-settings-chatbots.png)
    translation: |-
      ![](loomio-group-settings.png)
      ![](loomio-settings-chatbots.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ca092d1c3fdb9f59:
    english: 'You probably don''t want to click any of the checkboxes for now. Just enter the name (such as "Discord #general") and the URL and click the save button at the bottom of the form.'
    translation: 'בשלב זה אפשר להשאיר את תיבות הסימון ריקות. יש להזין שם (למשל "Discord #general") ואת כתובת ה־URL, וללחוץ על כפתור השמירה בתחתית הטופס.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a63a4be4a45bcfdb:
    english: If you decide later that you want the integration to receive automatic notifications, return to its settings and select the relevant events.
    translation: אם בהמשך רוצים לקבל התראות אוטומטיות דרך האינטגרציה, יש לחזור להגדרות שלה ולבחור את האירועים המתאימים.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f1d9c09f9d3c2a82:
    english: "### Invite to poll"
    translation: "### הזמנה להצביע"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cbc7b5fd5afcc24c:
    english: |-
      This is how to send a notification to your chatroom inviting people to vote in a proposal.
      It's the same process for Share outcome, Invite to thread, Remind to vote, Poll edited etc.
    translation: |-
      כך שולחים לחדר הצ'אט התראה שמזמינה אנשים להצביע על הצעה.
      התהליך זהה גם לשיתוף מסקנה, להזמנה לשרשור, לשליחת תזכורת להצביע, להודעה על עריכת סקר ועוד.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  290001bb97dee010:
    english: |-
      ### Automatic notifications
      To send a notification whenever a specific event happens, edit the chat integration and select that event.
    translation: |-
      ### התראות אוטומטיות
      כדי לשלוח התראה בכל פעם שמתרחש אירוע מסוים, יש לערוך את אינטגרציית הצ'אט ולבחור באירוע הזה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
