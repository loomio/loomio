    translated_on: '2026-09-30'
  0ce0604bb021d98f:
    english: "## Invitation"
    translation: "## Kutsu"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d5fabca3934dafd:
    english: How participants are invited into a facilitated space is incredibly important. People understand huge amounts of information from the invitation, and use it to judge how a space will be held and if they belong there. The moment of invitation is in many ways the defining opportunity to set the tone and establish trust.
    translation: Tapa, jolla osallistujat kutsutaan ohjattuun yhteiseen tilaan, on hyvin tärkeä. Kutsu kertoo paljon siitä, miten toimintaa ohjataan ja kokeeko ihminen kuuluvansa joukkoon. Kutsu on myös tilaisuus luoda toiminnalle sävy ja rakentaa luottamusta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a8d7e10a50432195:
    english: |-
      > <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../rich_200.png"> Decision making is all about communication: your group can only make good decisions together if there’s a foundation of good communication in place first. This means being clear about what the purpose of a discussion or meeting is, who needs to be involved, what the time-frame is, and what people can expect.
      >
      > — Richard Bartlett
    translation: |-
      > <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../rich_200.png"> Päätöksenteossa on kyse viestinnästä. Ryhmäsi voi tehdä hyviä päätöksiä yhdessä vain, jos sen viestintä toimii. Siksi on kerrottava selvästi, mikä on keskustelun tai kokouksen tarkoitus, keiden on osallistuttava, mikä on aikataulu ja mitä osallistujat voivat odottaa.
      >
      > — Richard Bartlett
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ab260e60bf87a11d:
    english: 'Key aspects to an invitation:'
    translation: 'Kutsun tärkeimmät asiat:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ff258493e21d7f3a:
    english: |-
      * **Background.** What is this thing? What am I being asked to do? Who is behind this? Who else will be involved? What is the time commitment, topic focus, and protocol?
      * **Context.** What is the character of this specific engagement? Of all the possible formats and ways it could go, which one will it be? Why now, why this way?
      * **Belonging.** Am I welcome? Is this for me? Am I needed in this process? What is my unique value and contribution? Why should I specifically be compelled?
      * **Safety.** Does this invitation indicate thoughtfulness, trust, and understanding? Is the structure of the engagement up to handling the inherent power dynamics at play? What level of honesty or vulnerability will this require of me? Do I think the person inviting is going to hold me well?
      * **Accessibility.** Will my basic requirements for participation be accommodated? Language, assistive technology, unfamiliar jargon, etc. Will it be possible for me to engage?
    translation: |-
      * **Tausta.** Mistä on kyse? Mitä minua pyydetään tekemään? Kuka järjestää tämän? Keitä muita osallistuu? Kuinka paljon aikaa tämä vie, mikä on aihe ja miten toimitaan?
      * **Tilanne.** Millainen juuri tämä tilaisuus on? Miten se järjestetään ja miten se etenee? Miksi se järjestetään nyt ja tällä tavalla?
      * **Joukkoon kuuluminen.** Olenko tervetullut? Onko tämä minua varten? Tarvitaanko minua? Mitä erityistä voin tuoda mukaan? Miksi minun kannattaisi osallistua?
      * **Turvallisuus.** Osoittaako kutsu harkintaa, luottamusta ja ymmärrystä? Huomioidaanko osallistujien väliset valtasuhteet? Kuinka avoin minun odotetaan olevan? Voinko luottaa siihen, että kutsuja huolehtii osallistujista?
      * **Saavutettavuus.** Otetaanko osallistumiseni perusedellytykset huomioon, kuten kieli, apuvälineet ja vieras erikoissanasto? Voinko osallistua?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aabfa9d842af2688:
    english: On Loomio
    translation: Loomiossa
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8a87ed2ddb6c659f:
    english: |-
      * The tool has a built-in function to [invite users](/en/user_manual/groups/inviting_people/) by email or by sending them a special link. Users can also request to join your group if your settings allow.
      * The invitation tools built into the software are very basic, and getting an unexpected login request for new software without context isn't very inviting, so group creators often introduce people to the idea of Loomio through a separate process.
      * Many aspects of Loomio are already designed to create a safe and respectful space users would want to enter — such as thoughtful [privacy options](/en/user_manual/groups/starting_a_group/#privacy).
      * The design of the software itself is meant to be friendly, simple, and professional, hopefully putting out a trustworthy vibe.
      * Loomio has accessibility features, for people who use assistive technology like screen readers, and translation features for people who speak different languages. Emphasising these aspects in an invitation can make some people feel more welcome.
    translation: |-
      * Loomiossa voit [kutsua käyttäjiä](/en/user_manual/groups/inviting_people/) sähköpostitse tai lähettämällä heille kutsulinkin. Käyttäjät voivat myös pyytää päästä ryhmääsi, jos ryhmän asetukset sallivat sen.
      * Loomion kutsutoiminnot ovat yksinkertaisia. Odottamaton pyyntö kirjautua uuteen ohjelmistoon ilman taustatietoja ei tunnu kutsuvalta. Siksi ryhmän perustajat esittelevät Loomion usein ensin muulla tavoin.
      * Monet Loomion ominaisuudet auttavat luomaan turvallisen ja kunnioittavan tilan, johon on helppo tulla. Tällaisia ovat esimerkiksi harkitut [yksityisyysasetukset](/en/user_manual/groups/starting_a_group/#privacy).
      * Loomion käyttöliittymä on suunniteltu ystävälliseksi, selkeäksi ja asialliseksi, jotta se herättää luottamusta.
      * Loomiossa on saavutettavuusominaisuuksia esimerkiksi ruudunlukijaa käyttäville sekä käännösominaisuuksia eri kieliä puhuville. Näistä kertominen kutsussa voi auttaa ihmisiä tuntemaan itsensä tervetulleiksi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cb459c1230aaf54c:
    english: "## Arrival"
    translation: "## Saapuminen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ef55fa893f9e1034:
    english: The moment of arrival is the “first impression” of an engagement, and sets the trajectory from there on in. The person has accepted an invitation and decided to step in. They are open and expectant, and the impression they get will make a big impact on their experience.
    translation: Saapumishetkellä syntyy ensivaikutelma, joka vaikuttaa kokemukseen myöhemmin. Ihminen on hyväksynyt kutsun ja päättänyt tulla mukaan. Hän on avoin ja odottaa, mitä tapahtuu. Saamallaan vaikutelmalla on suuri merkitys hänen kokemukselleen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  66e7e79597f6a3d0:
    english: |-
      ### Welcoming
      To enable openness to engagement, participation, and receptivity, a person has to feel welcome. They need their existence acknowledged, and to feel a sense of hospitality.
    translation: |-
      ### Vastaanotto
      Jotta ihminen voi osallistua avoimesti, hänen täytyy tuntea itsensä tervetulleeksi. Hänet on huomattava ja otettava vastaan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b3ce2bd5e2ea9acd:
    english: |-
      ### Settling
      When someone enters a physical room, they want to know where to sit, where the exit is, where to go to the bathroom, and if there is coffee available. They need a basic introduction to the space and their place in it.
    translation: |-
      ### Asettuminen
      Kun ihminen saapuu fyysiseen tilaan, hän haluaa tietää, minne istua, missä uloskäynti ja wc ovat ja onko kahvia tarjolla. Hän tarvitsee perustiedot tilasta ja omasta paikastaan siinä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d6fd9d29415a172:
    english: |-
      * The group description fields and discussion context box are the main space to put a “welcome message” for people arriving into the space.
      * Take a tour of the Loomio space, tweak things to make yourself comfortable (like [notification settings](/en/user_manual/users/email_settings/) and your [profile photo](/en/user_manual/users/user_profile/).
      * See information how you like using different thread views and options like Recent, Unread, Mute, and Star. Make yourself at home.
    translation: |-
      * Ryhmän kuvauskentät ja keskustelun taustatietokenttä ovat tärkeimmät paikat, joihin voit kirjoittaa uusille tulijoille tervetuloviestin.
      * Tutustu Loomion tilaan ja säädä se itsellesi sopivaksi. Voit esimerkiksi muuttaa [ilmoitusasetuksia](/en/user_manual/users/email_settings/) ja lisätä [profiilikuvan](/en/user_manual/users/user_profile/).
      * Tarkastele tietoja itsellesi sopivalla tavalla käyttämällä keskusteluketjujen eri näkymiä ja toimintoja, kuten Viimeisimmät, Lukemattomat, Mykistä ja Merkitse tähdellä. Asetu taloksi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8acf15fe96515738:
    english: "## Who’s in the Room"
    translation: "## Ketkä ovat mukana"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  48c4449cd1d9b135:
    english: Introducing yourself and being introduced to others is one of the most basic and most important human social functions. From Māori *mihimihi* to British “how do you do” to Japanese business card exchanges, every culture places a lot of importance on this. It goes beyond practicalities and politeness and touches on a deep human need, which is a prerequisite for comfort, openness, and focus.
    translation: Itsensä esitteleminen ja muihin tutustuminen kuuluvat ihmisten tärkeimpiin sosiaalisiin tapoihin. Kaikissa kulttuureissa niille annetaan paljon arvoa, olipa kyse maorien *mihimihistä*, brittiläisestä tervehdyksestä tai japanilaisesta käyntikorttien vaihdosta. Kyse on muustakin kuin käytännön järjestelyistä ja kohteliaisuudesta. Toisiin tutustuminen vastaa ihmisen perustarpeeseen ja auttaa tuntemaan olon mukavaksi, olemaan avoin ja keskittymään.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a8eec818aeb74e64:
    english: As a facilitator, if you don’t give people a chance to introduce themselves and find out who is around them, they will generally subvert whatever else you’re trying to point their attention at until you allow this process to occur. Consciously design introductions as a feature, and use them as an opportunity to further the overall goals of the interaction.
    translation: Jos ohjaajana et anna ihmisille tilaisuutta esitellä itseään ja tutustua muihin, heidän huomionsa pysyy usein siinä, vaikka yrittäisit ohjata sitä muualle. Varaa esittelyille tietoisesti aikaa. Ne voivat myös edistää yhteisen toiminnan tavoitteita.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ad3d2a31a23af036:
    english: "### Check in"
    translation: "### Kuulumiskierros"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  71d51a259d8b2c35:
    english: Even among groups who already know each other well, this introduction process continues with “checking in” – where everyone has a chance to speak at the beginning of a meeting (often to a question of "what is on top for you", "how are you", or "is there anything preventing you from being present") and other good practices for team cohesion. People have a multitude of identities, which change based on the context. People answer and re-answer “who am I for this moment” all the time, and that is what allows them to orient around one another.
    translation: Myös toisensa hyvin tuntevissa ryhmissä on hyödyllistä aloittaa tapaaminen kuulumiskierroksella. Silloin jokainen saa puheenvuoron ja voi kertoa esimerkiksi, mikä häntä juuri nyt mietityttää, miten hän voi tai estääkö jokin häntä olemasta läsnä. Tämä tukee ryhmän yhteenkuuluvuutta. Ihmisillä on monia puolia, jotka tulevat esiin eri tilanteissa. He pohtivat yhä uudelleen, keitä ovat juuri tässä hetkessä, ja se auttaa heitä löytämään suhteensa toisiinsa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0573ae3aef6f1c6c:
    english: People's expression does not occur in a vaccuum, but in the context of who they are. A multi-faceted view of someone’s identity is an essential aspect of interpreting their contributions.
    translation: Ihmisen sanat eivät synny tyhjiössä, vaan hänen elämäntilanteensa ja kokemustensa pohjalta. Kun tunnet ihmistä monipuolisemmin, pystyt tulkitsemaan paremmin hänen puheenvuorojaan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  86eb005fd168a424:
    english: "> We start many of our meetings with everyone “checking in” before we get to the agenda. These check-ins are focused not on your work tasks, but on how you’re doing as a human being. If you’re going through a rough patch at home, or you’re sick, or you have exciting positive news, understanding your state of mind will help the entire group have the right context to interpret how you’re communicating. — Richard Bartlett"
    translation: "> Aloitamme monet kokoukset kuulumiskierroksella ennen kuin siirrymme esityslistaan. Emme keskity työtehtäviin vaan siihen, miten kukin voi ihmisenä. Jos sinulla on vaikeaa kotona, olet sairaana tai sinulla on iloisia uutisia, mielialasi tunteminen auttaa koko ryhmää ymmärtämään viestintääsi oikeassa asiayhteydessä. — Richard Bartlett"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d5aea1c0564ccff8:
    english: |-
      * Create a thread called "Introduce yourself" or "Check in". It provides a useful first _call to action_ everyone coming in will understand.
      * For “request to join” groups, we have a function that allows the requestor to introduce themselves to the coordinator, to get access to the group. Some groups have a process of re-posting this content in the intro thread to welcome people in.
      * Upload profile photos! Photos of faces are one of the most powerful ways of feeling like you know who is in the room with you online.
    translation: |-
      * Luo keskusteluketju nimeltä "Esittele itsesi" tai "Mitä kuuluu?". Se antaa uusille tulijoille selkeän ensimmäisen _tehtävän_, johon tarttua.
      * Ryhmissä, joihin voi pyytää pääsyä, liittymistä pyytävä voi esitellä itsensä ryhmän koordinaattorille. Joissakin ryhmissä tämä esittely julkaistaan uudelleen esittelyketjussa, jotta muut voivat toivottaa tulijan tervetulleeksi.
      * Lisää profiilikuva. Kasvokuvien avulla on helpompi tuntea, keitä muita verkkotilassa on mukana.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d3b245589018cebf:
    english: "## Who’s NOT in the Room"
    translation: "## Ketkä eivät ole mukana"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5daf97a7cbbdd355:
    english: Diversity is critical for quality group decision making. The “wisdom of the crowd effect” (collective intelligence) only works by combining a variety of viewpoints. Outcomes of collaboration processes depend heavily on which voices are, and are not, represented. It’s impossible to have perfect representative inclusion, but you need to take into account who might be missing.
    translation: Moninaisuus on tärkeää ryhmän hyvälle päätöksenteolle. Joukon viisaus eli kollektiivinen älykkyys syntyy erilaisten näkökulmien yhdistämisestä. Yhteistyön tulos riippuu paljon siitä, keiden ääni kuuluu ja keiden ei. Kaikkia ei voi koskaan saada mukaan täysin edustavasti, mutta sinun on hyvä miettiä, ketkä saattavat puuttua.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b16b07380f6bc37c:
    english: It’s extremely common for people to have blind spots around privilege. Humans are not great at intuiting bias, and are a lot better at noticing the presence of something, rather than the absence. Our minds trick us. For example, when women and men are deliberately given an equal amount of talking time there is often a perception that women are getting more than their fair share, due to different ideas about how much they “should” talk ([more details](https://www.quora.com/Do-women-tend-to-talk-more-than-men)). It can be necessary to actually measure or count to get an accurate picture, instead of relying on intuition.
    translation: Ihmiset eivät usein huomaa omaan etuoikeutettuun asemaansa liittyviä sokeita pisteitä. Huomaamme helpommin sen, mikä on läsnä, kuin sen, mikä puuttuu, emmekä aina tunnista omia ennakkokäsityksiämme. Esimerkiksi silloin, kun naisille ja miehille annetaan tarkoituksella yhtä paljon puheaikaa, naisten voidaan silti kokea puhuvan liikaa. Käsitykset siitä, kuinka paljon heidän "kuuluisi" puhua, vaihtelevat ([lisätietoja](https://www.quora.com/Do-women-tend-to-talk-more-than-men)). Tarkan kuvan saamiseksi voi olla tarpeen mitata tai laskea asioita sen sijaan, että luottaisi vaikutelmaan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2b720395fe4e451f:
    english: Someone who does not have particular accessibility needs may not even notice that a venue isn’t wheelchair accessible, a document isn’t formatted for screen readers, or a situation is excluding someone with hearing loss. But the people with those challenges will notice. Someone without kids might not consider that a 7PM meeting time won't work for parents. These, and a thousand other practical, social, and cultural elements, could block someone from *being in the room*.
    translation: Ihminen, jolla ei ole erityisiä saavutettavuustarpeita, ei ehkä huomaa, ettei tilaan pääse pyörätuolilla, asiakirja sovi ruudunlukijalle tai tilanne mahdollista kuulovammaisen osallistumista. Näitä esteitä kohtaavat huomaavat ne. Lapseton ihminen ei ehkä tule ajatelleeksi, ettei kello 19 alkava kokous sovi vanhemmille. Nämä ja monet muut käytännölliset, sosiaaliset ja kulttuuriset tekijät voivat estää jotakuta *olemasta mukana*.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  25ac4ed8610c591c:
    english: 'It’s especially important to think about who is not in room when trying to solve problems for others: build with, not for; talk with people, not about them. If the people you are trying to serve are not in the room, it’s very unlikely you’ll have all the input you need to be effective. This is just as much about effectiveness for business outcomes as about social justice; it’s almost always better to design collaboration *with* the users or stakeholders.'
    translation: On erityisen tärkeää miettiä, ketkä puuttuvat, kun yrität ratkaista muiden ongelmia. Kehitä ratkaisuja yhdessä ihmisten kanssa ja keskustele heidän kanssaan. Jos ihmiset, joita haluat auttaa, eivät ole mukana, et todennäköisesti saa kaikkea tarvitsemaasi tietoa. Tämä koskee sekä toiminnan tuloksellisuutta että sosiaalista oikeudenmukaisuutta. Yhteistyö kannattaa yleensä suunnitella *yhdessä* käyttäjien tai muiden osallisten kanssa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6b44ef1725c36586:
    english: |-
      * Collaborating online can allow for whole other levels of inclusion. Instead of thinking about a “digital divide”, think about the “digital bridge” — how technology can include people who cannot attend in-person meetings or participate at a specific time, and enable whole new possibilities like multi-lingual discussions.
      * Loomio makes it very clear who is invited to a group and who has participated in a discussion, giving important information for thinking about inclusion. If people are missing, you can see that.
      * If inclusive decision making and diversity of thinking are important to you, periodically ask yourself, “Who’s not in the room? Why?”
    translation: |-
      * Verkkoyhteistyö voi avata uusia mahdollisuuksia osallistua. Digitaalisen kuilun sijaan voit ajatella digitaalista siltaa: teknologia voi tuoda mukaan ihmisiä, jotka eivät pääse paikalle tai voi osallistua tiettyyn aikaan. Se mahdollistaa myös esimerkiksi monikieliset keskustelut.
      * Loomiosta näet selvästi, ketkä on kutsuttu ryhmään ja ketkä ovat osallistuneet keskusteluun. Tämä auttaa arvioimaan, ketkä ovat mukana ja keitä puuttuu.
      * Jos osallistava päätöksenteko ja näkökulmien moninaisuus ovat sinulle tärkeitä, kysy aika ajoin itseltäsi: "Ketkä eivät ole mukana? Miksi?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0a5324e7de64cdba:
    english: "## Culture, Protocol, Expectations"
    translation: "## Kulttuuri, toimintatavat ja odotukset"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  851a2601b835fbb1:
    english: Culture can be quite a nebulous concept, and operates at multiple levels. The culture of the wider society has a big influence, but you can think of every group, and every session or discussion, as having a culture of its own.
    translation: Kulttuuri voi olla vaikeasti määriteltävä käsite, ja se vaikuttaa monella tasolla. Ympäröivän yhteiskunnan kulttuurilla on suuri vaikutus. Voit silti ajatella, että jokaisella ryhmällä, tapaamisella ja keskustelulla on myös oma kulttuurinsa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  27d3b10b80ade309:
    english: How do we roll? How do we talk to one another? What is and is not ok here? What are the rules of the game, of how we interact?
    translation: Miten toimimme yhdessä? Miten puhumme toisillemme? Mikä täällä on hyväksyttävää ja mikä ei? Millaiset säännöt ohjaavat vuorovaikutustamme?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  54d83e0b3e487190:
    english: The process of confronting cultural questions can be a powerful moment of self-awareness for a group. Not confronting them can harm ability to meet goals, or sometimes tear a group apart completely.
    translation: Kulttuuriin liittyvien kysymysten käsittely voi auttaa ryhmää ymmärtämään itseään paremmin. Jos kysymyksiä vältetään, ryhmän voi olla vaikeampi saavuttaa tavoitteensa. Joskus ristiriidat voivat jopa hajottaa ryhmän.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f9918d7d61cef0c9:
    english: Culture, protocol, and expectations can be implicit or explicit, and by nature intersect in complex ways with power dynamics and social capital. It’s a challenging balance to keep things loose enough to allow emergence, evolution, creativity, and freedom, while being explicit enough about bottom lines and boundaries to ensure safety.
    translation: 'Kulttuuri, toimintatavat ja odotukset voivat olla ääneen lausuttuja tai oletettuja. Ne kietoutuvat monimutkaisesti valtasuhteisiin ja sosiaaliseen asemaan. Ryhmän on löydettävä tasapaino: toiminnan pitää olla riittävän väljää uusille ajatuksille, muutokselle, luovuudelle ja vapaudelle, mutta rajojen on oltava riittävän selviä turvallisuuden takaamiseksi.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3d484eafb8524354:
    english: Facilitators often guide the group to live up to the culture it has set, follow the protocols it has agreed, and hold expectations to account. If a facilitator is tasked with this role, they need to be backed by a certain level of explicitness about those agreements, and a certain mandate. Otherwise, it can get messy.
    translation: Ohjaajat auttavat usein ryhmää toimimaan sopimansa kulttuurin ja toimintatapojen mukaisesti sekä pitämään kiinni yhteisistä odotuksista. Jos tämä kuuluu ohjaajan tehtävään, sopimusten on oltava riittävän selviä ja ryhmän on annettava hänelle valtuudet toimia. Muuten tilanteista voi tulla hankalia.
    status: machine
    provider: codex/gpt-6-sol
