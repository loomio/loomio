  fce0c96bcc92d0aa:
    english: "> *“With the advice process, any person can make any decision but must seek advice from affected parties and people with expertise.” - Frederick Laloux, Reinventing Organizations.*"
    translation: "> *“In een adviesproces mag iedereen elke beslissing nemen, maar moet diegene advies vragen aan betrokkenen en deskundigen.” - Frederick Laloux, Reinventing Organizations.*"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  66f32f2b3cf56e0d:
    english: |-
      ## Key points
      - Freedom to make a decision.
      - Invite people to offer their advice.
      - Take into account other people’s voices.
    translation: |-
      ## Kernpunten
      - Je hebt de vrijheid om een beslissing te nemen.
      - Nodig mensen uit om advies te geven.
      - Houd rekening met de inbreng van anderen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  54d4f1ac3c2bd91f:
    english: |-
      ## Steps in the Advice process
      You notice a problem or opportunity and take the initiative.
      1. Frame the decision, identify who owns it, and invite the affected people and relevant experts.
      2. Start a Loomio **discussion** and, when a structured response or deadline is useful, run an **Advice proposal**.
      3. Clarify and build on the advice through vote reasons and discussion comments.
      4. Make the decision, then publish an **outcome** explaining what was decided and how the advice informed it.
    translation: |-
      ## Stappen in het adviesproces
      Je ziet een probleem of kans en neemt het initiatief.
      1. Beschrijf de beslissing, bepaal wie ervoor verantwoordelijk is en nodig de betrokkenen en relevante deskundigen uit.
      2. Start een Loomio-**discussie** en gebruik een **adviesvoorstel** als een gestructureerde reactie of een deadline nuttig is.
      3. Verduidelijk en verdiep het advies aan de hand van stemverklaringen en reacties in de discussie.
      4. Neem de beslissing en publiceer een **conclusie** waarin je uitlegt wat is besloten en hoe het advies daaraan heeft bijgedragen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6088bbd1e12e8920:
    english: "## Benefits\n- Advice helps you make a better decision for your organization. \n- Foster relationships, learning opportunities and diverse input.\n- Stimulate initiative and creativity, and more enjoyable work."
    translation: "## Voordelen\n- Advies helpt je een betere beslissing te nemen voor jouw organisatie. \n- Het versterkt relaties en biedt ruimte om te leren en verschillende inzichten te horen.\n- Het stimuleert initiatief en creativiteit en maakt het werk prettiger."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0b6fc6b802feebda:
    english: "## Applying the Advice process on Loomio"
    translation: "## Het adviesproces toepassen in Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a0a3c706db8ca405:
    english: "| **Advice process** | **On Loomio** |\n|---|---|\n| You notice a problem or opportunity and take the initiative. |  |\n| Seek input to sound out perspectives before proposing action. | Start a Loomio **discussion** to provide context and open conversation. Run an **[Advice proposal](/en/user_manual/polls/proposals/advice/)** when you want a defined response period, vote reasons, and a clear record of who participated. |\n| Taking advice received into account, you make a decision and inform the people who have given advice. | Add an an **outcome** to the discussion thread.   <br /><br />State the decision made and thank people for their advice and feedback.  <br /><br />   Say what will happen next and notify people about the outcome.  <br /><br />The outcome statement is an important record of the decision for future reference. <br /> <br /> Either update the context to include this outcome, or state it in a comment you pin to the timeline to quickly find it in the future.<br /><br/> |        "
    translation: |-
      | **Adviesproces** | **In Loomio** |
      |---|---|
      | Je ziet een probleem of kans en neemt het initiatief. |  |
      | Vraag om inbreng om verschillende perspectieven te verkennen voordat je een actie voorstelt. | Start een Loomio-**discussie** om context te geven en het gesprek te openen. Gebruik een **[adviesvoorstel](/en/user_manual/polls/proposals/advice/)** als je een vaste reactietermijn, stemverklaringen en een duidelijk overzicht van de deelnemers wilt. |
      | Je weegt het ontvangen advies mee, neemt een beslissing en informeert de mensen die advies hebben gegeven. | Voeg een **conclusie** toe aan de discussiedraad.   <br /><br />Beschrijf de beslissing en bedank mensen voor hun advies en feedback.  <br /><br />   Vertel wat er hierna gebeurt en breng mensen op de hoogte van de conclusie.  <br /><br />De conclusie legt de beslissing vast zodat je die later kunt terugvinden. <br /> <br /> Werk de context bij met deze conclusie, of zet haar in een reactie die je vastzet op de tijdlijn.<br /><br/> |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
