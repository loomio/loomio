  aadbf3844be4a95f:
    english: An Advice proposal gathers input for a decision that a person or team is responsible for making. Participants can offer advice or indicate that they have no advice to add.
    translation: Une proposition de Conseil recueille des avis pour une décision qu'une personne ou une équipe est chargée de prendre. Les participants peuvent donner un conseil ou indiquer qu'ils n'ont rien à ajouter.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  769a2446fc3ec4a9:
    english: This page explains the Advice proposal form, voting, and results. See the [Advice process](/en/guides/making_decisions/advice_process) for the complete workflow from framing the decision to publishing an outcome.
    translation: Cette page explique comment remplir une proposition de Conseil, voter et lire les résultats. Consultez le [processus de Conseil](/en/guides/making_decisions/advice_process) pour suivre toutes les étapes, de la définition de la décision à la publication d'une conclusion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f19e32088d70eec4:
    english: "## When to use Advice"
    translation: "## Quand utiliser Conseil"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d4c7e7da6f2d5860:
    english: Use Advice when the decision maker wants input from people with relevant expertise or people affected by the decision. It works well for supplier choices, operational decisions, policy drafts, and decisions within a delegated role.
    translation: Utilisez Conseil lorsque la personne chargée de décider souhaite recueillir l'avis de personnes concernées par la décision ou possédant une expertise pertinente. Ce type de proposition convient au choix d'un fournisseur, aux décisions opérationnelles, aux projets de règles et aux décisions relevant d'un rôle délégué.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a81e33e00080fbe4:
    english: Advice is not an approval vote. Say who will make the decision, what constraints apply, and how they will consider the responses.
    translation: Conseil n'est pas un vote d'approbation. Précisez qui prendra la décision, quelles contraintes s'appliquent et comment les réponses seront prises en compte.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4be7ef0783f6e444:
    english: "## Example: choose a washing supplier"
    translation: "## Exemple : choisir un prestataire de lavage"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d8157e98107798c6:
    english: Oatmilk Cooperative's operations coordinator must select a washing supplier. They invite advice about capacity, food-safety records, water use, service response times, and support.
    translation: La personne chargée des opérations chez Oatmilk Cooperative doit choisir un prestataire de lavage. Elle sollicite des avis sur sa capacité, ses pratiques en matière de sécurité alimentaire, sa consommation d'eau, ses délais d'intervention et son assistance.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9703f1f9474243af:
    english: "## Set up the proposal"
    translation: "## Préparer la proposition"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6b9c305f0f4000d9:
    english: Describe the decision, name the decision maker, and include the information participants need. Invite people who are affected or have relevant knowledge. The default options let someone offer advice or abstain.
    translation: Décrivez la décision, indiquez qui la prendra et fournissez les informations nécessaires aux participants. Invitez les personnes concernées ou possédant des connaissances pertinentes. Les options par défaut permettent de donner un conseil ou de s'abstenir.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Voter"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0a259af7a59899b7:
    english: Participants select **Advice** and give a concrete recommendation, risk, question, or relevant experience. They can abstain when they have no useful input.
    translation: Les participants choisissent **Conseil** et présentent une recommandation concrète, un risque, une question ou une expérience pertinente. Ils peuvent s'abstenir s'ils n'ont rien d'utile à ajouter.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Lire les résultats"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1d4bf7b5d0079f87:
    english: The chart confirms who has responded, but the reasons contain the substance of an Advice proposal. Look for constraints, agreements, and conflicting recommendations rather than treating the most common response as the decision.
    translation: Le graphique indique qui a répondu, mais l'essentiel d'une proposition de Conseil se trouve dans les explications. Repérez les contraintes, les points d'accord et les recommandations contradictoires. La réponse la plus fréquente ne détermine pas la décision.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e9fc01ce6c059f29:
    english: The decision maker publishes an outcome explaining what they decided and how the advice informed it.
    translation: La personne chargée de décider publie une conclusion qui explique sa décision et la manière dont les conseils l'ont éclairée.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
