    translated_on: '2026-09-29'
  fb77150441a43f5c:
    english: "![Seen by window listing thread members](../notifying_people/thread_seenby.png)"
    translation: "![Fenster „Angesehen von“ mit einer Liste der Thread-Mitglieder](../notifying_people/thread_seenby.png)"
    status: machine
