  66f32f2b3cf56e0d:
    english: |-
      ## Key points
      - Freedom to make a decision.
      - Invite people to offer their advice.
      - Take into account other people’s voices.
    translation: |-
      ## Puntos clave
      - Libertad para tomar una decisión.
      - Invitar a otras personas a dar su opinión.
      - Tener en cuenta las opiniones de los demás.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  54d4f1ac3c2bd91f:
    english: |-
      ## Steps in the Advice process
      You notice a problem or opportunity and take the initiative.
      1. Frame the decision, identify who owns it, and invite the affected people and relevant experts.
      2. Start a Loomio **discussion** and, when a structured response or deadline is useful, run an **Advice proposal**.
      3. Clarify and build on the advice through vote reasons and discussion comments.
      4. Make the decision, then publish an **outcome** explaining what was decided and how the advice informed it.
    translation: |-
      ## Pasos del proceso de asesoramiento
      Detectas un problema o una oportunidad y tomas la iniciativa.
      1. Define la decisión, identifica quién la tomará e invita a las personas afectadas y a quienes tengan experiencia relevante.
      2. Inicia una **discusión** en Loomio y, si conviene recoger respuestas estructuradas o fijar un plazo, abre una **propuesta de asesoramiento**.
      3. Aclara y desarrolla los consejos mediante los motivos de los votos y los comentarios en la discusión.
      4. Toma la decisión y publica una **conclusión** que explique qué decidiste y cómo influyeron los consejos recibidos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6088bbd1e12e8920:
    english: "## Benefits\n- Advice helps you make a better decision for your organization. \n- Foster relationships, learning opportunities and diverse input.\n- Stimulate initiative and creativity, and more enjoyable work."
    translation: "## Beneficios\n- El asesoramiento te ayuda a tomar una mejor decisión para tu organización. \n- Fortalece las relaciones, crea oportunidades para aprender y reúne distintas perspectivas.\n- Impulsa la iniciativa y la creatividad, y hace el trabajo más agradable."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
