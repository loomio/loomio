    english: "## Choose where work belongs"
    translation: "## Выберыце інструмент для кожнай задачы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  828de256c39d112c:
    english: Loomio complements chat, shared documents, and task-management tools rather than replacing every kind of work.
    translation: Loomio дапаўняе чаты, супольныя дакументы і інструменты кіравання задачамі. Розныя віды працы зручна весці ў розных інструментах.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ad42655c9ef79337:
    english: |-
      | Work | Suggested tool |
      |---|---|
      | Quick questions, social conversation, and timely updates | Chat |
      | Collaborative editing of a living document | Shared document |
      | Assigning and tracking tasks | Project or task-management tool |
      | Important topic-based discussion, broad participation, decisions, and outcomes | Loomio |
    translation: |-
      | Праца | Рэкамендаваны інструмент |
      |---|---|
      | Кароткія пытанні, нефармальныя размовы і тэрміновыя навіны | Чат |
      | Сумеснае рэдагаванне дакумента, які пастаянна абнаўляецца | Супольны дакумент |
      | Размеркаванне задач і адсочванне іх выканання | Інструмент кіравання праектамі або задачамі |
      | Абмеркаванне важных тэм, шырокі ўдзел, прыняцце рашэнняў і высновы | Loomio |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  40e853f5116f28eb:
    english: Put work in Loomio when people need time to consider a topic, when everyone affected should have a meaningful opportunity to participate, or when the group will need to find the discussion and decision later. Link to the relevant document or task from the Loomio discussion so its context remains easy to find.
    translation: Выкарыстоўвайце Loomio, калі людзям патрэбны час на разгляд тэмы, калі ўсе, каго яна закранае, павінны мець магчымасць паўдзельнічаць або калі групе пазней спатрэбіцца знайсці абмеркаванне і рашэнне. Дадайце ў абмеркаванне Loomio спасылку на адпаведны дакумент або задачу, каб іх было лёгка знайсці.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
