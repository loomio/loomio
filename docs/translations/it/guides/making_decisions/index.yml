  b27fab33a1dd5176:
    english: 'These guides explain complete decision processes: how to frame a decision, involve the right people, use discussion and proposals, respond to concerns, and record an outcome.'
    translation: 'Queste guide spiegano come svolgere un intero processo decisionale: definire la decisione da prendere, coinvolgere le persone giuste, discutere e formulare proposte, rispondere alle obiezioni e registrare una conclusione.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bcbe5e3fd75700a6:
    english: They are different from the proposal-template pages. A [proposal template](/en/user_manual/polls/proposals/) explains one proposal and its response options. A decision process can use several proposals over time.
    translation: Queste guide sono diverse dalle pagine sui modelli di proposta. Un [modello di proposta](/en/user_manual/polls/proposals/) spiega una singola proposta e le possibili risposte. Un processo decisionale può comprendere più proposte nel tempo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  af00d65d38e41f8b:
    english: "## Choose a process"
    translation: "## Scegli un processo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f41e345421a1a1e8:
    english: |-
      | Process | Who decides? | Main question |
      |---|---|---|
      | [Simple decision process](simple_decision_process) | Defined by the group | How can we discuss, test, and decide? |
      | [Advice process](advice_process) | A person or delegated team | What advice should the decision maker consider? |
      | [Consent process](consent_process) | The group | Is the proposal safe to try without a meaningful objection? |
      | [Consensus process](consensus_process) | The group | Can we reach collective agreement? |
    translation: |-
      | Processo | Chi decide? | Domanda principale |
      |---|---|---|
      | [Processo decisionale semplice](simple_decision_process) | Dipende dalle regole del gruppo | Come possiamo discutere, verificare una proposta e decidere? |
      | [Processo consultivo](advice_process) | Una persona o un gruppo di persone delegate | Quali pareri dovrebbe considerare chi prende la decisione? |
      | [Processo per consenso senza obiezioni](consent_process) | Il gruppo | Possiamo provare la proposta senza obiezioni sostanziali? |
      | [Processo per consenso](consensus_process) | Il gruppo | Possiamo raggiungere un accordo collettivo? |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d2843889568043c0:
    english: Use the process required by your group's governing rules or decision policy. Different kinds of decisions may use different processes.
    translation: Usa il processo previsto dalle regole di governance o dalla politica decisionale del tuo gruppo. Tipi diversi di decisioni possono richiedere processi diversi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bb120914edd79d13:
    english: If you only need help choosing a response format, compare [Proposals](/en/user_manual/polls/proposals/) and [Polls](/en/user_manual/polls/proposal_types/). If you administer the reusable choices shown when someone selects **Start a vote**, see [Poll templates](/en/user_manual/polls/poll_templates/).
    translation: Se ti serve solo scegliere un formato per le risposte, confronta [Proposte](/en/user_manual/polls/proposals/) e [Sondaggi](/en/user_manual/polls/proposal_types/). Se gestisci le opzioni riutilizzabili mostrate quando qualcuno seleziona **Inizia una votazione**, consulta [Modelli di sondaggio](/en/user_manual/polls/poll_templates/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
