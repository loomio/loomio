---
navigation_title: Modèles de discussion
blocks:
  80c5dfc46bb963d2:
    english: "# Discussion templates"
    translation: "# Modèles de discussion"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  488fbd5167707cba:
    english: Discussion templates help your group start discussions the same way each time. A template can supply a title, context, tags, and instructions for the person starting the discussion. It also sets defaults, such as whether to notify the whole group and which polls to suggest.
    translation: Les modèles de discussion aident votre groupe à lancer ses discussions selon un même processus. Un modèle peut fournir un titre, un contexte, des mots-clés et des instructions pour la personne qui lance la discussion. Il définit aussi des paramètres par défaut, comme la notification de tout le groupe et les sondages à suggérer.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2571bc9cc405d927:
    english: Every new discussion in a group starts from a template. When someone selects **Start discussion**, Loomio shows the group's templates. Even **Blank template** is a template, so your group can change its defaults too.
    translation: 'Chaque nouvelle discussion dans un groupe part d’un modèle. Lorsque quelqu’un sélectionne **Lancer une discussion**, Loomio affiche les modèles du groupe. **Modèle vierge** est également un modèle : votre groupe peut donc modifier ses paramètres par défaut.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  834ac31697ef254b:
    english: Templates work well for processes your group repeats, such as project reviews, advice processes, meeting preparation, funding decisions, or document approvals. The person starting the discussion can still edit everything before they start it.
    translation: Les modèles conviennent aux processus que votre groupe répète, comme les bilans de projet, les consultations, la préparation de réunions, les décisions de financement ou l’approbation de documents. La personne qui lance la discussion peut encore tout modifier avant de la créer.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  74d1c850f63c0518:
    english: "## How templates are used"
    translation: "## Utilisation des modèles"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6e5927441d982c01:
    english: |-
      1. A member selects **Start discussion** on the group page.
      2. Loomio lists the group's visible templates. Each one shows its title and subtitle.
      3. The member selects a template. Loomio opens the new discussion form, filled in from the template.
      4. The template's help appears at the top of the form as guidance.
      5. The member edits the title, context, tags, and invite list, then selects **Start discussion**.
    translation: |-
      1. Un membre sélectionne **Lancer une discussion** sur la page du groupe.
      2. Loomio affiche les modèles visibles du groupe. Chacun présente son titre et son sous-titre.
      3. Le membre sélectionne un modèle. Loomio ouvre le formulaire de nouvelle discussion, prérempli à partir du modèle.
      4. L’aide du modèle apparaît en haut du formulaire pour guider le membre.
      5. Le membre modifie le titre, le contexte, les mots-clés et la liste des personnes invitées, puis sélectionne **Lancer une discussion**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  464984a60c23366b:
    english: Changing a template affects only discussions started after the change. Discussions already started from it keep their content and settings.
    translation: La modification d’un modèle ne concerne que les discussions lancées après ce changement. Les discussions déjà créées à partir de ce modèle conservent leur contenu et leurs paramètres.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  70c22d24ec0d248b:
    english: "## Choose who is notified by default"
    translation: "## Choisir qui reçoit une notification par défaut"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  77feebf56c2ee9a7:
    english: 'The **Invite** setting controls who the new discussion form invites by default. It has two options:'
    translation: 'Le paramètre **Inviter** détermine qui est invité par défaut dans le formulaire de nouvelle discussion. Deux options sont proposées :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6c93f4222436028f:
    english: |-
      - **Everyone in the group**: the group appears in the discussion form's **Invite** field, and every member is notified when the discussion starts.
      - **None**: the **Invite** field starts empty. Nobody is notified unless the author adds people.
    translation: |-
      - **Tout le monde dans le groupe** : le groupe apparaît dans le champ **Inviter** du formulaire de discussion, et chaque membre reçoit une notification au lancement de la discussion.
      - **Aucun** : le champ **Inviter** est vide au départ. Personne ne reçoit de notification, sauf si l’auteur ajoute des personnes.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  17cca49613fff23d:
    english: Loomio's built-in templates, including **Blank template**, use **Everyone in the group**. If your group does not want every new discussion to notify all members, edit the templates your group uses and set **Invite** to **None**.
    translation: Les modèles fournis par Loomio, dont **Modèle vierge**, utilisent **Tout le monde dans le groupe**. Si votre groupe ne souhaite pas notifier tous ses membres à chaque nouvelle discussion, modifiez les modèles qu’il utilise et réglez **Inviter** sur **Aucun**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5fd184e64e0605bc:
    english: The author can always change the invite list before starting the discussion. They can remove the group to notify nobody, or add specific people instead. This setting only affects notifications. Group members can still find and read the discussion in the group, whichever option you choose.
    translation: L’auteur peut toujours modifier la liste des personnes invitées avant de lancer la discussion. Il peut retirer le groupe pour ne notifier personne, ou ajouter certaines personnes à la place. Ce paramètre concerne uniquement les notifications. Les membres du groupe peuvent toujours trouver et lire la discussion dans le groupe, quelle que soit l’option choisie.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  58f24313ca36c890:
    english: The group is added to the invite list only when the author is allowed to notify the whole group. Admins can always do this. Members can do it when **Members can notify everyone in the group** is enabled in the group's permissions.
    translation: Le groupe n’est ajouté à la liste des personnes invitées que si l’auteur a le droit de notifier tout le groupe. Les administrateurs ont toujours ce droit. Les membres l’ont lorsque **Les membres peuvent notifier n'importe qui dans le groupe** est activé dans les permissions du groupe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  33afd174376e933b:
    english: "## Template settings"
    translation: "## Paramètres du modèle"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b02be20543f228a7:
    english: 'Group admins can edit a template from the action menu beside it in the template list. The form has these settings:'
    translation: 'Les administrateurs du groupe peuvent modifier un modèle depuis le menu d’actions situé à côté de celui-ci dans la liste des modèles. Le formulaire comprend les paramètres suivants :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f2fc57fe20100911:
    english: |-
      - **Template title**: the short name shown in the template list.
      - **Template subtitle**: one line explaining when to use the template.
      - **Template help**: instructions shown at the top of the new discussion form. Use it to explain the process and link to resources. It is not part of the discussion.
      - **Group**: whether the template starts a discussion in the group or a direct discussion. A direct discussion is visible only to the people invited to it.
      - **Default title**: a title filled in for each new discussion. The author can edit it.
      - **Example title**: an example shown in an empty title field. Use it when a default title would not fit every discussion.
      - **Tags**: tags applied to each new discussion. The author can remove them.
      - **Context**: the starting text of the discussion. Use headings, questions, or links to guide what people write.
      - **Invite**: whether to invite everyone in the group by default. See [Choose who is notified by default](#choose-who-is-notified-by-default).
      - **Poll templates**: polls suggested for this process. They are listed on the new discussion form. They also appear first when someone starts a poll in the discussion. They do not start automatically.
      - **Allow concurrent polls**: whether more than one poll can be open in the discussion at the same time.
      - **Comment length limit**: an optional maximum length for comments.
    translation: |-
      - **Titre du modèle** : le nom court affiché dans la liste des modèles.
      - **Sous-titre du modèle** : une ligne qui explique quand utiliser le modèle.
      - **Aide sur les modèles** : les instructions affichées en haut du formulaire de nouvelle discussion. Utilisez-les pour expliquer le processus et fournir des liens vers des ressources. Elles ne font pas partie de la discussion.
      - **Groupe** : indique si le modèle lance une discussion dans le groupe ou une discussion directe. Seules les personnes invitées peuvent voir une discussion directe.
      - **titre par défaut** : un titre prérempli pour chaque nouvelle discussion. L’auteur peut le modifier.
      - **Exemple de titre** : un exemple affiché lorsque le champ du titre est vide. Utilisez-le si un titre par défaut ne convient pas à toutes les discussions.
      - **Mots-clés** : les mots-clés appliqués à chaque nouvelle discussion. L’auteur peut les retirer.
      - **Contexte** : le texte initial de la discussion. Utilisez des titres, des questions ou des liens pour guider les contributions.
      - **Inviter** : indique si tout le groupe est invité par défaut. Voir [Choisir qui reçoit une notification par défaut](#choose-who-is-notified-by-default).
      - **Modèles de sondage** : les sondages suggérés pour ce processus. Ils figurent dans le formulaire de nouvelle discussion. Ils apparaissent aussi en premier lorsqu’une personne lance un sondage dans la discussion. Ils ne démarrent pas automatiquement.
      - **Autoriser les sondages simultanés** : indique si plusieurs sondages peuvent être ouverts en même temps dans la discussion.
      - **Limite de longueur des commentaires** : une longueur maximale facultative pour les commentaires.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a9e44919507a613:
    english: Use a default title only when it will stay accurate. Otherwise, write an example title that prompts the author to name the specific review, period, document, or decision.
    translation: N’utilisez un titre par défaut que s’il reste adapté à chaque discussion. Sinon, proposez un exemple qui invite l’auteur à nommer le bilan, la période, le document ou la décision concernés.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c5db289e27f54169:
    english: "## Example: bottle trial review"
    translation: "## Exemple : bilan d’un essai de bouteilles"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  89e7b8f9b36a8ae7:
    english: Oatmilk Cooperative reviews its returnable-bottle trial after each cycle. Its template is titled "Bottle trial review" and has a default title. It adds the "Bottle trial" tag. Its context asks members to read the weekly report and consider return rates, washing records, cafe feedback, and transport costs. It recommends a Sense check followed by Consent.
    translation: La coopérative Oatmilk fait le bilan de son essai de bouteilles consignées après chaque cycle. Son modèle s’intitule « Bilan de l’essai de bouteilles » et comporte un titre par défaut. Il ajoute le mot-clé « Essai de bouteilles ». Son contexte demande aux membres de lire le rapport hebdomadaire et d’examiner les taux de retour, les registres de lavage, les retours des cafés et les coûts de transport. Il recommande une vérification de compréhension suivie d’un consentement.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f896031f8dcc2f84:
    english: This works as a template because the purpose and evidence stay the same each cycle. Only the observations and decisions change.
    translation: Ce processus se prête à un modèle, car son objectif et les éléments à examiner restent les mêmes à chaque cycle. Seules les observations et les décisions changent.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7e5955c442f6c8ae:
    english: "## Create a template"
    translation: "## Créer un modèle"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c2b2bc41cbe6f6a:
    english: Group admins can select **New template** from the template list. Choose an example from Loomio's gallery or start with a blank template, then adapt it and save it.
    translation: Les administrateurs du groupe peuvent sélectionner **Nouveau modèle** dans la liste des modèles. Choisissez un exemple dans la galerie de Loomio ou partez d’un modèle vierge, puis adaptez-le et enregistrez-le.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a9cb80d574e2d865:
    english: You can search or filter the gallery. An example is not added to your group until you save it.
    translation: Vous pouvez effectuer une recherche ou filtrer la galerie. Un exemple n’est ajouté à votre groupe qu’une fois enregistré.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1f0dab3f50320e75:
    english: "## Manage the template list"
    translation: "## Gérer la liste des modèles"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7462593f2f6d1614:
    english: When a group is created, Loomio adds a set of templates suited to the kind of group. Only **Blank template** and **Practice discussion** are visible at first. The others are hidden, and admins can unhide them.
    translation: Lorsqu’un groupe est créé, Loomio ajoute un ensemble de modèles adaptés à son type. Seuls **Modèle vierge** et **Discussion pratique** sont visibles au départ. Les autres sont cachés, et les administrateurs peuvent les rendre visibles.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e6f7eaa63e353ef7:
    english: 'Group admins can use the action menu beside a template to:'
    translation: 'Les administrateurs du groupe peuvent utiliser le menu d’actions situé à côté d’un modèle pour :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e8767178e42cd4e0:
    english: |-
      - edit its content and settings;
      - hide it from the template list;
      - unhide it from **Hidden templates**;
      - rearrange the order of visible templates;
      - export it as a JSON file; or
      - delete it.
    translation: |-
      - modifier son contenu et ses paramètres ;
      - le cacher de la liste des modèles ;
      - le rendre visible depuis **Modèles cachés** ;
      - modifier l’ordre des modèles visibles ;
      - l’exporter dans un fichier JSON ; ou
      - le supprimer.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5d4cbc918551c211:
    english: Hiding a template keeps it for later use. Deleting a template does not delete discussions started from it.
    translation: Un modèle caché reste disponible pour une utilisation ultérieure. La suppression d’un modèle ne supprime pas les discussions créées à partir de celui-ci.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c0ae844752e20ef:
    english: "## Share templates between groups"
    translation: "## Partager des modèles entre groupes"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  acf646688b9b79f4:
    english: Select **Export json** in a template's action menu to download it as a file. To use it in another group, select **New template**, then **Import json**. The form opens with the imported content so you can review it before saving.
    translation: Sélectionnez **Exporter au format JSON** dans le menu d’actions d’un modèle pour le télécharger sous forme de fichier. Pour l’utiliser dans un autre groupe, sélectionnez **Nouveau modèle**, puis **Importer du JSON**. Le formulaire s’ouvre avec le contenu importé pour que vous puissiez le vérifier avant de l’enregistrer.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a168253bda3147e8:
    english: Links to custom poll templates are not included in the file. Export and import those poll templates separately.
    translation: Les liens vers les modèles de sondage personnalisés ne sont pas inclus dans le fichier. Exportez et importez ces modèles de sondage séparément.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4833d57d46ccb98e:
    english: "## Let members create templates"
    translation: "## Permettre aux membres de créer des modèles"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1ac138e713feea59:
    english: By default, only group admins can create and edit templates. An admin can enable **Members can create templates** under **Group settings** → **Permissions**.
    translation: Par défaut, seuls les administrateurs du groupe peuvent créer et modifier des modèles. Un administrateur peut activer **Les membres peuvent créer des modèles** dans **Paramètres de groupe** → **Permissions**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  889e8792d7937424:
    english: When this is enabled, members can create discussion and poll templates and edit the templates they created. Admins can edit every template in the group. A member's template appears in the group's template list once it is saved, so agree on naming and review practices before enabling this permission.
    translation: Lorsque cette permission est activée, les membres peuvent créer des modèles de discussion et de sondage, puis modifier ceux qu’ils ont créés. Les administrateurs peuvent modifier tous les modèles du groupe. Dès qu’un membre enregistre son modèle, celui-ci apparaît dans la liste des modèles du groupe. Convenez donc de règles pour les noms et la vérification des modèles avant d’activer cette permission.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1284dfc3e68170d8:
    english: "## Templates for non-members"
    translation: "## Modèles pour les personnes qui ne sont pas membres"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5c701c3795724027:
    english: If **Non-members can start discussions** is enabled, people outside the group choose from the same template list. Their discussion form never invites the group by default. See [Collect private submissions](/en/user_manual/discussions/private_submissions).
    translation: Si **Les non-membres peuvent démarrer des discussions** est activé, les personnes extérieures au groupe choisissent dans la même liste de modèles. Leur formulaire de discussion n’invite jamais le groupe par défaut. Voir [Recueillir des contributions privées](/en/user_manual/discussions/private_submissions).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  630a5d69a7093105:
    english: "## Related"
    translation: "## Voir aussi"
    status: machine
