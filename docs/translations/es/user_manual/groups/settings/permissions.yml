  d661e5fc8cc1b460:
    english: "# Group permissions"
    translation: "# Permisos del grupo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  712830f14602c6c7:
    english: The permissions tab controls which group operations are available to ordinary members and, for non-secret groups, to non-members. Open **Edit group settings** from the group page, then select **Permissions**.
    translation: La pestaña de permisos determina qué acciones del grupo pueden realizar los miembros y, en los grupos que no son secretos, las personas que no son miembros. En la página del grupo, abre **Editar la configuración del grupo** y selecciona **Permisos**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b71bf8cce1cb369c:
    english: "![Group permission settings](group_group_settings_permissions.png)"
    translation: "![Configuración de permisos del grupo](group_group_settings_permissions.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  88e5fcd302a53620:
    english: Administrators retain the ability to manage the group. Enabling a member permission extends that particular action to ordinary members; it does not make them administrators.
    translation: Los administradores conservan la capacidad de gestionar el grupo. Si activas un permiso para los miembros, podrán realizar esa acción, pero no se convertirán en administradores.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5b2b9af0f68b7a57:
    english: 'Permissions include whether members can:'
    translation: 'Los permisos determinan si los miembros pueden:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8377b499d13690c0:
    english: |-
      - add members or invite guests;
      - send announcements;
      - create subgroups;
      - start and manage discussions;
      - create and manage tags;
      - edit or delete comments where the setting permits;
      - start proposals and polls; and
      - create discussion and poll templates.
    translation: |-
      - añadir miembros o invitar a personas como invitadas;
      - enviar anuncios;
      - crear subgrupos;
      - iniciar y gestionar discusiones;
      - crear y gestionar etiquetas;
      - editar o eliminar comentarios cuando la configuración lo permita;
      - iniciar propuestas y sondeos; y
      - crear plantillas de discusiones y sondeos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  87166abe7eea1ab3:
    english: For groups that are not secret, administrators can separately allow non-members to start discussions. A non-member who starts a discussion becomes a guest of that discussion but does not gain access to other private discussions or become a group member.
    translation: En los grupos que no son secretos, los administradores pueden permitir por separado que las personas que no son miembros inicien discusiones. Si una persona que no es miembro inicia una discusión, pasa a ser invitada de esa discusión. Esto no le da acceso a otras discusiones privadas ni la convierte en miembro del grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3d01d10a97636b1e:
    english: The **Admins can edit members' comments** setting gives administrators an exceptional moderation capability. Enable it only when the group has agreed that administrators should be able to alter member-authored content.
    translation: La opción **Los administradores pueden editar comentarios de los miembros** concede a los administradores una capacidad excepcional de moderación. Actívala solo si el grupo ha acordado que los administradores puedan modificar contenido escrito por los miembros.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b0af0135752a461f:
    english: Review permissions when the group's purpose, membership, or moderation responsibilities change. Give each role only the capabilities it needs.
    translation: Revisa los permisos cuando cambien el propósito del grupo, sus miembros o las responsabilidades de moderación. Concede a cada función solo las capacidades que necesite.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
