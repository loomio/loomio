  '09907f3ec328e9d2':
    english: "## Applying the Consent process on Loomio"
    translation: "## Den Einwilligungsprozess auf Loomio anwenden"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d7c91a6160b45cf:
    english: |-
      | **Consent process** | **On Loomio** |
      |---|---|
      | You notice a problem or opportunity and take the initiative. |  |
      | **Present a proposal** <br /><br />Write a clear and concise proposal and share it with people impacted. Describe it in a way so that others will understand what you are proposing. | Start a Loomio **discussion**. <br /><br />Name the proposal in the discussion title, and describe it in the context. |
      | **Questions** (Optional) <br /><br />Invite clarifying questions to help people understand the proposal. <br /><br />*“A clarifying question round helps make sure everyone understands the proposal before they say what they think about it.”* | Run a **Question round**. If it is hidden, a group administrator can make it available from [Poll templates](/en/user_manual/polls/poll_templates/). <br /><br />Ask “what do you need to know so you understand the proposal?” |
      | **Reactions** <br /><br />Invite people to offer reactions and comments to improve the proposal. <br /><br />This is a sensing and responding round - *to actively sense and interpret information from the group and then respond or adapt accordingly.* | Run a **[Sense check](/en/user_manual/polls/proposals/sense_check/)** proposal. <br /><br />*In the title:* Name the proposal and say this is an opportunity to react and comment. <br /><br />*In the proposal details:* Clearly frame the proposal and say why it is important.  Include any background information necessary and a link to the current proposal version.  <br /><br />Invite everyone to respond, and to do so before the proposal closes.  |
      | **Amendment** <br /><br />Consider comments and suggestions from people and amend the proposal as appropriate for the good of your organization. <br /><br />Consider any amendments you want to make for the new proposal version. | Reply to comments and suggestions raised in the Sense check proposal. <br /><br />State an **outcome** to summarize the results of the proposal.  <br /><br />Note any concerns or new information discovered, and outline how the proposal will be amended. <br /><br />Say what will happen next and notify people about the outcome. |
      | **Objections** <br /><br />Present the amended proposal version and invite people to state valid objections - objections that might cause harm. <br /><br />Respond to and integrate each objection by amending the proposal. | Run a **[Consent proposal](/en/user_manual/polls/proposals/consent/)** with the amended proposal. <br /><br />*In the title:* Name the decision to be made. <br /><br />*In the proposal details:* Present the proposal and invite people to vote consent or to state a valid objection - an objection that might cause harm.  Remember we are seeking consent that the proposal is 'safe to try'. <br /><br />Respond to and integrate each objection, creating an amended version of the proposal. <br /><br />Notify everyone that there has been a further amendment, and invite them to reconsider their Consent and “change your vote”. <br /><br />Or run successive Consent proposals as necessary until objections are resolved. |
      | **Outcome** <br /><br />When there are no remaining objections and everyone has consented, the result of the decision is announced. | State an **outcome**. <br /><br />Close the proposal. State an outcome and notify everyone involved. <br /><br />State the decision made and thank people for participation in the process. <br /><br />Summarize results of the process and say what will happen next. <br /><br />If no valid objections remain, state that there is consent the proposal is 'safe to try'. <br /><br />The outcome statement is an important record of the decision for future reference. |
    translation: |-
      | **Einwilligungsprozess** | **Auf Loomio** |
      |---|---|
      | Du bemerkst ein Problem oder eine Gelegenheit und ergreifst die Initiative. |  |
      | **Vorschlag vorstellen** <br /><br />Schreibe einen klaren, knappen Vorschlag und teile ihn mit den betroffenen Personen. Beschreibe ihn so, dass andere verstehen, was du vorschlägst. | Starte eine Loomio-**Diskussion**. <br /><br />Nenne den Vorschlag im Titel der Diskussion und beschreibe ihn im Diskussionskontext. |
      | **Fragen** (optional) <br /><br />Lade zu klärenden Fragen ein, damit alle den Vorschlag verstehen. <br /><br />*„Eine Fragerunde hilft sicherzustellen, dass alle den Vorschlag verstehen, bevor sie ihre Meinung dazu äußern.“* | Starte eine **Fragerunde**. Falls sie ausgeblendet ist, kann ein Gruppenadmin sie unter [Umfragevorlagen](/en/user_manual/polls/poll_templates/) verfügbar machen. <br /><br />Frage: „Was musst du wissen, um den Vorschlag zu verstehen?“ |
      | **Reaktionen** <br /><br />Lade zu Reaktionen und Kommentaren ein, um den Vorschlag zu verbessern. <br /><br />In dieser Runde geht es darum, *Informationen aus der Gruppe wahrzunehmen und einzuordnen und den Vorschlag entsprechend anzupassen.* | Starte einen Vorschlag zur **[Meinungsabfrage](/en/user_manual/polls/proposals/sense_check/)**. <br /><br />*Im Titel:* Benenne den Vorschlag und mache deutlich, dass alle reagieren und kommentieren können. <br /><br />*In den Vorschlagsdetails:* Beschreibe den Vorschlag klar und erkläre, warum er wichtig ist. Füge nötige Hintergrundinformationen und einen Link zur aktuellen Version hinzu. <br /><br />Lade alle ein, vor dem Ende des Vorschlags zu antworten. |
      | **Überarbeitung** <br /><br />Prüfe die Kommentare und Anregungen und überarbeite den Vorschlag so, wie es für deine Organisation sinnvoll ist. <br /><br />Überlege, welche Änderungen du in die neue Version aufnehmen willst. | Antworte auf Kommentare und Anregungen zum Vorschlag der Meinungsabfrage. <br /><br />Halte die Ergebnisse des Vorschlags in einem **Fazit** fest. <br /><br />Notiere Bedenken und neue Erkenntnisse und beschreibe, wie du den Vorschlag überarbeiten wirst. <br /><br />Erkläre die nächsten Schritte und benachrichtige alle über das Fazit. |
      | **Einwände** <br /><br />Stelle den überarbeiteten Vorschlag vor und lade zu begründeten Einwänden ein, etwa wenn der Vorschlag Schaden verursachen könnte. <br /><br />Gehe auf jeden Einwand ein und berücksichtige ihn bei der Überarbeitung. | Starte mit dem überarbeiteten Vorschlag einen **[Zustimmungsvorschlag](/en/user_manual/polls/proposals/consent/)**. <br /><br />*Im Titel:* Benenne die anstehende Entscheidung. <br /><br />*In den Vorschlagsdetails:* Stelle den Vorschlag vor und lade alle ein, zuzustimmen oder einen begründeten Einwand zu nennen, etwa wenn der Vorschlag Schaden verursachen könnte. Es geht um die Zustimmung, dass sich der Vorschlag ausprobieren lässt. <br /><br />Gehe auf jeden Einwand ein und erstelle eine überarbeitete Version des Vorschlags. <br /><br />Benachrichtige alle über die weitere Änderung und lade sie ein, ihre Zustimmung zu überdenken und ihre „Stimme zu ändern“. <br /><br />Starte bei Bedarf weitere Zustimmungsvorschläge, bis die Einwände ausgeräumt sind. |
      | **Fazit** <br /><br />Wenn keine Einwände mehr bestehen und alle zugestimmt haben, wird die Entscheidung bekannt gegeben. | Halte ein **Fazit** fest. <br /><br />Schließe den Vorschlag, halte das Fazit fest und benachrichtige alle Beteiligten. <br /><br />Nenne die getroffene Entscheidung und danke allen für ihre Beteiligung. <br /><br />Fasse den Prozess zusammen und erkläre die nächsten Schritte. <br /><br />Wenn keine begründeten Einwände mehr bestehen, halte fest, dass alle zustimmen, den Vorschlag auszuprobieren. <br /><br />Das Fazit dokumentiert die Entscheidung für später. |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  525fe55f979f05e3:
