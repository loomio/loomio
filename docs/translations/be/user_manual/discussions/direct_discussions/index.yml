    translation: Выберыце **Прамыя тэмы** на бакавой панэлі, каб убачыць свае прамыя дыскусіі. Каб пачаць яшчэ адну, выберыце **Новая дыскусія** на гэтай старонцы.
    status: machine
    provider: codex/gpt-6-sol
