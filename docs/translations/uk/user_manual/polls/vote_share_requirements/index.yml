navigation_title: Вимоги до частки голосів
blocks:
  54368e42ed93ae0c:
    english: "# Vote share requirements"
    translation: "# Вимоги до частки голосів"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2051086558658db2:
    english: Set a vote share requirement on an option when a proposal must receive a particular percentage of support, or remain below a particular percentage of opposition, to pass.
    translation: Установіть вимогу до частки голосів для варіанта, якщо для прийняття пропозиції він має отримати певний відсоток підтримки або не перевищити певний відсоток голосів проти.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f00d3806d6b890ae:
    english: Vote share requirements can be combined with a [quorum](/en/user_manual/polls/quorum/) to require both sufficient participation and a particular distribution of votes.
    translation: Вимоги до частки голосів можна поєднати з [кворумом](/en/user_manual/polls/quorum/), щоб визначити мінімальну участь і потрібний розподіл голосів.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0fc0acd12134f67e:
    english: When creating a proposal, select the edit icon beside an option.
    translation: Під час створення пропозиції натисніть значок редагування поруч із варіантом.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  27979c31066e397f:
    english: "![The edit icon beside the Consent option](edit-highlight-on-option.png)"
    translation: "![Значок редагування поруч із варіантом «Згода»](edit-highlight-on-option.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b3a4dee73762bea4:
    english: "## Eligible voters and votes cast"
    translation: "## Виборці, що мають право голосу, і віддані голоси"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1d04d75fa16a2a18:
    english: The percentage can be based on either **Votes cast** or **Eligible voters**.
    translation: Відсоток можна обчислювати на основі **Віддані голоси** або **Виборці, що мають право голосу**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  590e1a316f9ad174:
    english: "![Choosing whether a vote share requirement uses votes cast or eligible voters](./eligible-vs-cast.png)"
    translation: "![Вибір основи для вимоги до частки голосів: віддані голоси або виборці, що мають право голосу](./eligible-vs-cast.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d4c72d50982e071d:
    english: "**Eligible voters** means everyone who is able to vote in the proposal. **Votes cast** means only the votes that have been submitted."
    translation: "**Виборці, що мають право голосу** — це всі, хто може голосувати за пропозицію. **Віддані голоси** — це лише подані голоси."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  24945a1a4f0d08e3:
    english: A requirement of 75 percent agreement from eligible voters can pass only when at least 75 percent of all eligible voters vote for that option.
    translation: Вимогу щодо підтримки 75 відсотків виборців, що мають право голосу, буде виконано лише тоді, коли за цей варіант проголосують щонайменше 75 відсотків усіх таких виборців.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  14e4ff7cd000c7af:
    english: A requirement of 60 percent agreement from votes cast can pass when 60 percent of submitted votes support the option, regardless of overall turnout. Add a quorum when your process also requires a minimum level of participation.
    translation: Вимогу щодо підтримки 60 відсотків відданих голосів буде виконано, якщо цей варіант підтримають 60 відсотків тих, хто проголосував, незалежно від загальної явки. Додайте кворум, якщо ваш процес також вимагає мінімальної участі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a8f235434b40ecd9:
    english: "## Different vote share requirements"
    translation: "## Різні вимоги до частки голосів"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6682c9656815bdbc:
    english: 'A proposal can have requirements on more than one option. For example:'
    translation: 'У пропозиції можна встановити вимоги для кількох варіантів. Наприклад:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dac1980305bef52d:
    english: |-
      - Agreement must be at least 75 percent of eligible voters
      - Abstention must be no more than 30 percent of votes cast
      - Block must be no more than 0 percent of votes cast
    translation: |-
      - Підтримка — щонайменше 75 відсотків виборців, що мають право голосу
      - Утримання — не більш ніж 30 відсотків відданих голосів
      - Блокування — не більш ніж 0 відсотків відданих голосів
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  11325e607f603eb7:
    english: You can also add requirements to a [poll template](/en/user_manual/polls/poll_templates/) so that new proposals created from the template use them by default.
    translation: Ви також можете додати вимоги до [шаблону опитування](/en/user_manual/polls/poll_templates/). Тоді вони за замовчуванням застосовуватимуться до нових пропозицій, створених із цього шаблону.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d6bffbdadc45e7f5:
    english: "## Detailed example"
    translation: "## Докладний приклад"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4318dab03fe217ad:
    english: Oatmilk Cooperative is deciding whether to approve the budget for its six-week returnable bottle trial. Five people are eligible to vote.
    translation: Кооператив Oatmilk вирішує, чи затвердити бюджет шеститижневого випробування багаторазових пляшок. Право голосу мають п’ятеро людей.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8f5779f2f1bb9ec3:
    english: Jamie uses the **Consent** proposal template, edits the Consent option, and enables its vote share requirement.
    translation: Джеймі використовує шаблон пропозиції **Згода**, редагує варіант «Згода» та вмикає вимогу до частки голосів для нього.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  842038ffbd273e57:
    english: The cooperative's process requires at least 75 percent of eligible voters to support the proposal. Jamie sets the requirement to **At least 75% of Eligible voters**.
    translation: За правилами кооперативу пропозицію мають підтримати щонайменше 75 відсотків виборців, що мають право голосу. Джеймі встановлює вимогу **Щонайменше 75% виборців, що мають право голосу**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5b852b2e7a9b3034:
    english: "![The Consent option requiring at least 75 percent of eligible voters](./consent-vote-option.png)"
    translation: "![Варіант «Згода» з вимогою підтримки щонайменше 75 відсотків виборців, що мають право голосу](./consent-vote-option.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8a42a135c0c11c98:
    english: Jamie also sets a 60 percent quorum. Jamie and Samira vote in agreement. All submitted votes support the proposal, but they represent only 40 percent of eligible voters, so neither requirement has been reached.
    translation: Джеймі також установлює кворум 60 відсотків. Джеймі й Саміра голосують за. Усі подані голоси підтримують пропозицію, але їх віддали лише 40 відсотків виборців, що мають право голосу. Тому жодної з двох вимог ще не виконано.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2284440b974635e3:
    english: "![Two of five people have voted in agreement and neither requirement is reached](./first-vote-breakdown.png)"
    translation: "![Двоє з п’яти людей проголосували за, але жодної з вимог не виконано](./first-vote-breakdown.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2cb3890f4ef20320:
    english: Alex and Morgan then agree, while Taylor disagrees. All five people have voted, reaching the quorum, and four of five eligible voters agree. The 80 percent agreement exceeds the 75 percent vote share requirement, so both requirements show green check marks.
    translation: Потім Алекс і Морган голосують за, а Тейлор — проти. Усі п’ятеро проголосували, тож кворум досягнуто. Пропозицію підтримали четверо з п’яти виборців, що мають право голосу. Підтримка 80 відсотків перевищує встановлену вимогу 75 відсотків, тому біля обох вимог з’являються зелені позначки.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6b09cbe2063c0a6a:
    english: "![All five people have voted and both requirements are reached](./final-vote-breakdown.png)"
    translation: "![Усі п’ятеро проголосували, і обидві вимоги виконано](./final-vote-breakdown.png)"
    status: machine
