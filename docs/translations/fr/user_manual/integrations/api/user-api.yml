  '09b3d2247802eae7':
    english: A person is a delegate when they have an active delegate membership in any selected group. Their counts are aggregated across all selected groups. Delegate rows are returned even when every activity count is zero. Counts cover threads, comments, polls, votes, outcomes, and reactions; they are not voting participation rates. User rows also include identified ballots issued, cast, and missed. Anonymous polls are excluded from all per-person voting counts. `all_votes_cast` is true only when at least one ballot was issued and every issued ballot was cast.
    translation: Une personne est déléguée si elle possède un rôle de délégué actif dans au moins un groupe sélectionné. Ses nombres d’activités sont agrégés sur tous les groupes sélectionnés. Les lignes des délégués sont renvoyées même si tous ces nombres sont nuls. Ils couvrent les fils de discussion, les commentaires, les sondages, les votes, les conclusions et les réactions. Ils ne représentent pas des taux de participation aux votes. Les lignes des utilisateurs indiquent aussi les bulletins de vote nominatif envoyés, déposés et non déposés. Les sondages anonymes sont exclus de tous les nombres de votes par personne. `all_votes_cast` vaut true uniquement si au moins un bulletin a été envoyé et que tous les bulletins envoyés ont été déposés.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
