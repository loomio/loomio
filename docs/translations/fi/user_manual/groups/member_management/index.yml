  f9901909d4cd86e0:
    english: If you are an admin, you can manage members from the **Members** tab on your group page.
    translation: Jos olet ryhmän ylläpitäjä, voit hallita jäseniä ryhmäsivun **Jäsenet**-välilehdellä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d25e71106f726cac:
    english: Click on the three dots (**⋮**) to the right of the group member to set their title, make them an admin, make them a delegate, or remove them from the group.
    translation: Napsauta ryhmän jäsenen oikealla puolella olevaa kolmen pisteen valikkoa (**⋮**). Voit asettaa jäsenelle otsikon, nimetä hänet ylläpitäjäksi tai edustajaksi tai poistaa hänet ryhmästä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  db5a08225152e80a:
    english: "![Member actions menu on the Oatmilk Cooperative members page](member_management.png)"
    translation: "![Jäsenen toimintovalikko Oatmilk Cooperativen jäsensivulla](member_management.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0f29eb85fabc200d:
    english: |-
      ## Administering your group
      There are only two user types in a Loomio group: **member** and **admin**.
    translation: |-
      ## Ryhmän hallinnointi
      Loomio-ryhmässä on vain kahdenlaisia käyttäjiä: **jäseniä** ja **ylläpitäjiä**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4317e6fcbbedcdaa:
    english: 'Admins perform administrative tasks for your group, including: adding and removing members, managing member permissions, setting the group privacy levels, and managing the subscription plans.  In addition, admins are able to see the email addresses of members and export the group''s data.'
    translation: Ylläpitäjät lisäävät ja poistavat jäseniä, hallitsevat jäsenten käyttöoikeuksia, määrittävät ryhmän yksityisyysasetukset ja hallitsevat tilaussopimuksia. Lisäksi he näkevät jäsenten sähköpostiosoitteet ja voivat viedä ryhmän tiedot.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7de2ea0e85a19d0a:
    english: The person creating a new Loomio group is made admin by default. We recommend to make at least one other trusted person in your group an admin, to insure someone can always administer your group. You can have as many admins in your group as you wish.
    translation: Uuden Loomio-ryhmän luojasta tulee oletusarvoisesti ylläpitäjä. Suosittelemme nimeämään ylläpitäjäksi vähintään yhden muun luotettavan ryhmän jäsenen, jotta joku voi aina hallinnoida ryhmää. Ylläpitäjien määrää ei ole rajoitettu.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ac9e3bb2da56869e:
    english: To make a member **admin**, go to the Members tab, find the member and click on the three dots (**⋮**) next to their name. Choose **Make admin**. An `Admin` tag will appear beside their name.
    translation: Voit tehdä jäsenestä **ylläpitäjän** siirtymällä Jäsenet-välilehdelle ja napsauttamalla hänen nimensä vieressä olevaa kolmen pisteen valikkoa (**⋮**). Valitse **Nimeä ylläpitäjäksi**. Hänen nimensä viereen ilmestyy `Admin`-merkintä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b93c8eaf5367f572:
    english: "![Make admin action in a member's menu](member_make_admin.png)"
    translation: "![Nimeä ylläpitäjäksi -toiminto jäsenen valikossa](member_make_admin.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f6d7a993e2d32771:
    english: |-
      ## Managing subgroups
      If you are the admin of a parent group, or organization, you have additional permissions with regards to any __closed__ subgroups.
    translation: |-
      ## Alaryhmien hallinta
      Jos olet pääryhmän eli organisaation ylläpitäjä, sinulla on lisäoikeuksia __suljettuihin__ alaryhmiin.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cd781594b26ae052:
    english: You will be able to join any closed subgroup by clicking the "Join Group" button on the left of the Subgroup page in question (just under the tabs).
    translation: Voit liittyä mihin tahansa suljettuun alaryhmään napsauttamalla kyseisen alaryhmän sivun vasemmassa reunassa, välilehtien alapuolella, olevaa ”Liity ryhmään” -painiketta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ba630e95409473a5:
    english: "![Join group button on a closed Oatmilk Cooperative subgroup](member_join_subgroup.png)"
    translation: "![Liity ryhmään -painike Oatmilk Cooperativen suljetussa alaryhmässä](member_join_subgroup.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  87c2d0e0fa784cff:
    english: Once you have joined the subgroup, you will also be able to make yourself the admin of that subgroup, just as you would promote anyone to admin.
    translation: Kun olet liittynyt alaryhmään, voit nimetä itsesi sen ylläpitäjäksi samalla tavalla kuin nimeäisit kenet tahansa muun.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e439992d86591319:
    english: |-
      >[!Note]
      >These permissions do not extend to [**secret** subgroups](/en/user_manual/groups/subgroups/?highlight=secret#permissions).
    translation: |-
      >[!Note]
      >Nämä oikeudet eivät koske [**salaisia** alaryhmiä](/en/user_manual/groups/subgroups/?highlight=secret#permissions).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  31a8fbe10f50c1a0:
    english: |-
      ## Removing members
      When you click **Remove from group** you'll be asked to confirm the removal. Upon removal, this user will no longer have access to the group's pages, threads, polls, or proposals. They will receive no further emails or notifications of group activity. However, any comments and votes written by the user will remain untouched.
    translation: |-
      ## Jäsenten poistaminen
      Kun napsautat **Poista ryhmästä**, sinua pyydetään vahvistamaan poisto. Poistettu käyttäjä ei enää pääse ryhmän sivuille, keskusteluketjuihin, kyselyihin tai ehdotuksiin. Hän ei myöskään saa ryhmän toiminnasta sähköpostiviestejä tai ilmoituksia. Hänen kirjoittamansa kommentit ja antamansa äänet säilyvät ennallaan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8bf29fce0f0d8e9b:
    english: "![Remove from group action in a member's menu](member_remove.png)"
    translation: "![Poista ryhmästä -toiminto jäsenen valikossa](member_remove.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  aa3b173ffd048b99:
    english: You can add removed members back to the group later if you wish.
    translation: Voit halutessasi lisätä poistetun jäsenen takaisin ryhmään myöhemmin.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6ef7d0422c66d652:
    english: |-
      ## Leaving group
      To leave a group: go to the group page, open the 3 dot menu, and click **Leave group**.
    translation: |-
      ## Ryhmästä poistuminen
      Poistu ryhmästä siirtymällä ryhmäsivulle, avaamalla kolmen pisteen valikko ja valitsemalla **Poistu ryhmästä**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5395b374b5814162:
    english: "![Leave group action in the Oatmilk Cooperative settings menu](member_leave_group.png)"
    translation: "![Poistu ryhmästä -toiminto Oatmilk Cooperativen asetusvalikossa](member_leave_group.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d926fc8d1e3cbac2:
    english: |-
      ## Set title
      Within the Members tab, you can also name your role within the group, or identify an organization you represent using **title**. You or a group admin can change your title with **Set title** from the 3 dot menu near your name.
    translation: |-
      ## Aseta otsikko
      **Jäsenet**-välilehdellä voit kertoa roolistasi ryhmässä tai ilmoittaa edustamasi organisaation käyttämällä **otsikko**-kenttää. Sinä tai ryhmän ylläpitäjä voitte muuttaa otsikkoasi valitsemalla nimesi vieressä olevasta kolmen pisteen valikosta **Aseta otsikko**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2425e4d5b1e8047d:
    english: "![Set title action in a member's menu](member_set_title.png)"
    translation: "![Aseta otsikko -toiminto jäsenen valikossa](member_set_title.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6af456317883a890:
    english: You can have different titles in different subgroups.
    translation: Sinulla voi olla eri otsikko eri alaryhmissä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2d59cb70493e06b1:
    english: "## Member email addresses"
    translation: "## Jäsenten sähköpostiosoitteet"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cee3a1e0e1031377:
    english: Only admins can see group member email addresses.  This is sometimes necessary to audit the members in a group.
    translation: Vain ylläpitäjät näkevät ryhmän jäsenten sähköpostiosoitteet. Niitä voidaan tarvita ryhmän jäsenyyksien tarkistamiseen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4ff1112b058a3205:
    english: 'To see member email addresses: Use [data export](/en/user_manual/groups/data_export/) to download a CSV file, and open the file in Excel or Google sheets.'
    translation: Näet jäsenten sähköpostiosoitteet lataamalla CSV-tiedoston [tietojen viennillä](/en/user_manual/groups/data_export/) ja avaamalla sen Excelissä tai Google Sheetsissä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  105be57911f832fc:
    english: The export group data file shows every person and their email address in every subgroup.
    translation: Viety ryhmätiedosto sisältää kaikkien alaryhmien jäsenet ja heidän sähköpostiosoitteensa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  20f87bcff4ec41e6:
    english: You can also search for members by email address in the members tab. So if you see someone you want to remove, you can search by email to remove them.
    translation: Voit myös hakea jäseniä sähköpostiosoitteen perusteella Jäsenet-välilehdellä. Jos haluat poistaa jonkun ryhmästä, voit etsiä hänet sähköpostiosoitteella.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
