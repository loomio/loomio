  ca5b9583bfe78b65:
    english: A proposal asks people to respond to a statement or course of action. Participants choose a defined response and can explain their vote. Use a proposal to gather feedback, seek advice, identify objections, or test for agreement.
    translation: Uma proposta pede que as pessoas respondam a uma afirmação ou a um plano de ação. Os participantes escolhem uma resposta entre as opções definidas e podem explicar seu voto. Use uma proposta para receber comentários, pedir conselhos, identificar objeções ou verificar se há acordo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  143dc77c58a4c881:
    english: This section helps you choose and run Loomio's default proposal templates. For a complete sequence of discussion, proposals, amendments, and outcome, use the [decision-making guides](/en/guides/making_decisions/). To change the templates available to your group, see [Poll templates](../poll_templates/).
    translation: Esta seção ajuda você a escolher e usar os modelos de proposta padrão do Loomio. Para acompanhar todas as etapas, da discussão às propostas, alterações e conclusão, consulte os [guias para tomar decisões](/en/guides/making_decisions/). Para alterar os modelos disponíveis para seu grupo, consulte [Modelos de enquetes](../poll_templates/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e0f8614f95c9c5ff:
    english: "## Choose a proposal template"
    translation: "## Escolha um modelo de proposta"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  525699503edbe342:
    english: |-
      | Template | What it asks | Use it when… |
      |---|---|---|
      | [Sense check](sense_check/) | Is this on the right track? | An idea is still being developed |
      | [Advice](advice/) | What advice should the decision maker consider? | A person or team owns the decision |
      | [Consent](consent/) | Is this safe to try, or is there a meaningful objection? | The group uses consent decision-making |
      | [Consensus](consensus/) | What is your position on this proposal? | The group is seeking collective agreement |
    translation: |-
      | Modelo | O que pergunta | Use quando… |
      |---|---|---|
      | [Verificação de sentido](sense_check/) | Estamos no caminho certo? | Uma ideia ainda está em desenvolvimento |
      | [Conselho](advice/) | Que conselhos a pessoa responsável pela decisão deve considerar? | Uma pessoa ou equipe é responsável pela decisão |
      | [Consentimento](consent/) | É seguro experimentar ou há alguma objeção relevante? | O grupo toma decisões por consentimento |
      | [Consenso](consensus/) | Qual é sua posição sobre esta proposta? | O grupo busca um acordo coletivo |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0cb03ac4a22f02b4:
    english: Choose the template whose response options match the question you need answered. Each template page explains its use cases, setup, voting form, and results.
    translation: Escolha o modelo cujas opções de resposta correspondam à pergunta que você precisa fazer. A página de cada modelo explica quando usá-lo, como configurá-lo, como votar e como ver os resultados.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d379b02c308b3b55:
    english: "## Other proposal templates"
    translation: "## Outros modelos de proposta"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  44cdb16aebf757ca:
    english: Loomio also provides templates such as Proposal, Gradients of agreement, Question round, and Majority. Some are hidden initially. Group administrators can make them available or create a template for the group's own terminology and rules from [Poll templates](../poll_templates/).
    translation: O Loomio também oferece modelos como Proposta, Gradientes de concordância, Rodada de perguntas e Maioria. Alguns ficam ocultos inicialmente. Os administradores do grupo podem disponibilizá-los ou criar um modelo com os termos e as regras do próprio grupo em [Modelos de enquetes](../poll_templates/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ca179ba4cb53c5e3:
    english: "## Proposal records"
    translation: "## Registro da proposta"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  460a90e796fc4dc0:
    english: Votes and reasons update while the proposal is open, and participants can change their response. After it closes, publish an [outcome](../outcomes/) that states the decision or next step. The discussion, proposal, votes, reasons, and outcome form a record of how the group reached its decision.
    translation: Os votos e suas justificativas são atualizados enquanto a proposta está aberta, e os participantes podem mudar sua resposta. Depois que ela for encerrada, publique uma [conclusão](../outcomes/) com a decisão ou o próximo passo. A discussão, a proposta, os votos, as justificativas e a conclusão registram como o grupo chegou à decisão.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
