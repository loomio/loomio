  cb82daa3594be60c:
    english: Comments are the main way people participate in a discussion. They are visible to anyone who has permission to see the thread.
    translation: A hozzászólásokkal vehetsz részt a beszélgetésben. Mindenki láthatja őket, aki hozzáfér a témához.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  96ffa85117001d18:
    english: "## Reading comments"
    translation: "## Hozzászólások olvasása"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2d82b2da2ee96a1f:
    english: When you open a discussion, Loomio takes you to activity that is new to you.
    translation: Amikor megnyitsz egy beszélgetést, a Loomio a számodra új tevékenységekhez visz.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c4a1b0be655249a9:
    english: Unread comments have a blue **new** label beside their posting time.
    translation: Az olvasatlan hozzászólások közzétételi ideje mellett kék **új** címke látható.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  82bce54322fa6023:
    english: "## Writing a comment"
    translation: "## Hozzászólás írása"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7b14a17025b52e3d:
    english: Write a comment to contribute to the discussion. Other people can reply, react, or post their own comments.
    translation: Írj hozzászólást, ha részt szeretnél venni a beszélgetésben. Mások válaszolhatnak rá, reagálhatnak rá, vagy saját hozzászólást írhatnak.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6e0c07cfcb8f1166:
    english: Select **Post Comment** to publish it. Your comment will be visible to anyone who has permission to see the discussion.
    translation: A közzétételhez válaszd a **Hozzászólás** lehetőséget. A hozzászólásodat mindenki láthatja, aki hozzáfér a beszélgetéshez.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  edfadd8f1dcac9c4:
    english: The tools described in [Formatting](/en/user_manual/discussions/formatting/) are available when writing comments.
    translation: Hozzászólás írásakor használhatod a [Formázás](/en/user_manual/discussions/formatting/) oldalon ismertetett eszközöket.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b4dce878f57863ff:
    english: "## Mentioning people"
    translation: "## Emberek megemlítése"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  70543178fe9e7b4b:
    english: Type **@**, start typing a person's name, then select them from the list. A mention notifies that person immediately and is a useful way to ask for their attention or response.
    translation: Írd be a **@** jelet, kezdd el begépelni valakinek a nevét, majd válaszd ki a listából. Az említés azonnal értesíti őt, így felhívhatod a figyelmét valamire, vagy választ kérhetsz tőle.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b1d5a5e3d5bb86e3:
    english: "![Mentioning Samira Patel in a comment](../notifying_people/comment_mention.png)"
    translation: "![Samira Patel megemlítése egy hozzászólásban](../notifying_people/comment_mention.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  07aa88bffb5b1700:
    english: To notify everyone in the group, type **@**, start typing the group name, then select it from the list.
    translation: A csoport minden tagjának értesítéséhez írd be a **@** jelet, kezdd el begépelni a csoport nevét, majd válaszd ki a listából.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  794c26be4050ac1b:
    english: "![Searching for Oatmilk Cooperative while writing a group mention](../notifying_people/mentioning_group_1.png)"
    translation: "![Az Oatmilk Cooperative keresése csoportemlítés írásakor](../notifying_people/mentioning_group_1.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  111625a57c02bc5c:
    english: "![Oatmilk Cooperative selected as a group mention](../notifying_people/mentioning_group_2.png)"
    translation: "![Az Oatmilk Cooperative kiválasztva csoportemlítésként](../notifying_people/mentioning_group_2.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b4fb3c8390c32e31:
    english: Mentioning someone does not give them access to the thread. Use **Invite people** in the thread sidebar if they are not already a thread member.
    translation: Az említés önmagában nem ad hozzáférést a témához. Ha az illető még nem tagja a témának, használd a téma oldalsávjában a **Hívj meg embereket** lehetőséget.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6bba3d93a1845f91:
    english: "## Replying to a comment"
    translation: "## Válasz hozzászólásra"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e7776c198f2f2f48:
    english: Select **Reply** below a comment to respond to it. The reply is prefilled with an @mention of the comment author, which notifies them when you post it. Remove the mention if you do not want to notify them.
    translation: Ha válaszolni szeretnél egy hozzászólásra, válaszd alatta a **Válasz** lehetőséget. A válaszban automatikusan szerepel a hozzászólás szerzőjének @említése, így a közzétételkor értesítést kap. Töröld az említést, ha nem szeretnéd értesíteni.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eb45d23f7f968858:
    english: You can also reply to your own comment to nest a response beneath it.
    translation: A saját hozzászólásodra is válaszolhatsz, így a válasz alatta jelenik meg.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ab1caf06d54d3bcb:
    english: If a Loomio email says you can reply by email, your emailed reply will appear in the thread.
    translation: Ha egy Loomio-e-mail szerint e-mailben is válaszolhatsz, az így elküldött válaszod megjelenik a témában.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72d9282ce2bc763a:
    english: "## Reactions"
    translation: "## Reakciók"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1875a303c30b5343:
    english: Use the smiley button to respond with an emoji. Reactions notify the comment author within Loomio but do not send an email.
    translation: A mosolygó arcot ábrázoló gombbal emojival reagálhatsz. A reakciókról a hozzászólás szerzője értesítést kap a Loomióban, de e-mailt nem.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ce997bcd34b2eae0:
    english: "## Translating comments"
    translation: "## Hozzászólások fordítása"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b50a435640652d31:
    english: If the author uses a language other than yours, a **Translate** action appears below the comment.
    translation: Ha a szerző más nyelven ír, mint te, a hozzászólás alatt megjelenik a **Fordítás** lehetőség.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9077e2c891750fe8:
    english: Select **Translate comment** to see the comment in your language.
    translation: Válaszd a **Megjegyzés lefordítása** lehetőséget, hogy a hozzászólást a saját nyelveden olvasd.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  60a885598057c1bf:
    english: "## Comment actions"
    translation: "## Hozzászólások műveletei"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9689ea71da9051d8:
    english: Common actions appear directly below a comment. Additional actions are available from the three-dot menu (**⋯**).
    translation: A gyakori műveletek közvetlenül a hozzászólás alatt találhatók. További műveleteket a hárompontos menüben (**⋯**) találsz.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  88263de7d2158dae:
    english: "### Add a comment to Jump to"
    translation: "### Hozzászólás hozzáadása az Ugrás ide: listához"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dd60de0295088aa5:
    english: Use **Pin to timeline** to add a comment to the thread's **Jump to** list.
    translation: A **Rögzítsd az idővonalhoz** lehetőséggel hozzáadhatsz egy hozzászólást a téma **Ugrás ide:** listájához.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  90252c4d66b752d4:
    english: You can edit the label shown in **Jump to**. Unpin and then pin the comment again to change the link text.
    translation: Az **Ugrás ide:** listában megjelenő címkét módosíthatod. A hivatkozás szövegének megváltoztatásához oldd fel a hozzászólás rögzítését, majd rögzítsd újra.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  28c2ffaa171b6b1b:
    english: |-
      >[!Tip]
      >Highlight the words you want to use as the link text before selecting **Pin to timeline**.
    translation: |-
      >[!Tip]
      >Jelöld ki a hivatkozás szövegeként használni kívánt szavakat, mielőtt a **Rögzítsd az idővonalhoz** lehetőséget választod.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7545e856758edb22:
    english: Select **Unpin** to remove the item from **Jump to**.
    translation: Válaszd a **Rögzítés feloldása** lehetőséget, ha el szeretnéd távolítani az elemet az **Ugrás ide:** listából.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c3b33d31cbce93c3:
    english: "### Edit a comment and view changes"
    translation: "### Hozzászólás szerkesztése és a változások megtekintése"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  abaeaac4c1f2c966:
    english: Select **Edit** below one of your comments to change it. Group admins can also edit member comments when the relevant group permission is enabled.
    translation: Egy saját hozzászólásod módosításához válaszd alatta a **Szerkesztés** lehetőséget. A csoportadminisztrátorok is szerkeszthetik a tagok hozzászólásait, ha a megfelelő csoportengedély be van kapcsolva.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  69647eee1f3fcfb7:
    english: An **Edited** action appears below an edited comment.
    translation: A szerkesztett hozzászólások alatt megjelenik a **Szerkesztette** lehetőség.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fcaa0d6329f5c5d4:
    english: Select **Edited** to see what changed. Red highlighting shows removed text and green highlighting shows added text. Loomio records who made each edit and when it was made.
    translation: Válaszd a **Szerkesztette** lehetőséget a változások megtekintéséhez. A törölt szöveg piros, a hozzáadott szöveg zöld kiemelést kap. A Loomio rögzíti, hogy ki és mikor végezte az egyes szerkesztéseket.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  042b22530d14a486:
    english: 'You can edit a comment when:'
    translation: 'Akkor szerkeszthetsz egy hozzászólást, ha:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  afe0ed6535a96b15:
    english: |-
      - you wrote it and the group allows members to edit their comments
      - you are a group admin and [Admins can edit members' comments](/en/user_manual/groups/settings/permissions) is enabled
    translation: |-
      - te írtad, és a csoport engedélyezi a tagoknak a saját hozzászólásaik szerkesztését
      - csoportadminisztrátor vagy, és be van kapcsolva az [Adminisztrátorok szerkeszthetik a tagok hozzászólásait](/en/user_manual/groups/settings/permissions) beállítás
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6962d0caeeea20e8:
    english: "### Copy a comment link"
    translation: "### Hozzászólás hivatkozásának másolása"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0fb9e2ebde71573e:
    english: Select **Copy link** to copy the comment's unique URL. You can paste the link elsewhere to refer directly to that comment.
    translation: Válaszd a **Link másolása** lehetőséget a hozzászólás egyedi URL-címének másolásához. A hivatkozást máshová beillesztve közvetlenül erre a hozzászólásra utalhatsz.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  04e4537024da788c:
    english: "### View notification history"
    translation: "### Az értesítési előzmények megtekintése"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  957677befce0ab3f:
    english: Open the three-dot menu (**⋯**) beside a comment and select **Notification history**.
    translation: Nyisd meg a hozzászólás melletti hárompontos menüt (**⋯**), majd válaszd az **Értesítési előzmények** lehetőséget.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fa9d0f2448239944:
    english: "![Notification history in a comment's actions menu](../notifying_people/comment_notification_history.png)"
    translation: "![Értesítési előzmények egy hozzászólás műveleteinek menüjében](../notifying_people/comment_notification_history.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  30a58d4ef7d80c15:
    english: The notification history shows who was notified about the comment, when the notification was sent, and whether it has been read when that information is available.
    translation: Az értesítési előzményekben láthatod, kit értesítettek a hozzászólásról, mikor küldték el az értesítést, és ha ez az adat rendelkezésre áll, elolvasták-e.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4f6ead46c3f9759e:
    english: "![Notification history for a comment mentioning Samira Patel](../notifying_people/comment_notification_example.png)"
    translation: "![Értesítési előzmények egy Samira Patelt megemlítő hozzászóláshoz](../notifying_people/comment_notification_example.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fa2204fb0745dec4:
    english: "### Discard, restore, or delete a comment"
    translation: "### Hozzászólás eldobása, visszaállítása vagy törlése"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  592dfa766814bb8e:
    english: Discarding a comment removes it from the thread but retains it in a trash bin. You can discard your own comments with **Discard** in the three-dot menu. Group admins can also discard comments.
    translation: Ha eldobsz egy hozzászólást, az eltűnik a témából, de a lomtárban megmarad. A saját hozzászólásaidat a hárompontos menü **Eldobni** lehetőségével dobhatod el. A csoport adminisztrátorai is eldobhatnak hozzászólásokat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  670a46d5274f9ab5:
    english: "**Restore a comment**"
    translation: "**Hozzászólás visszaállítása**"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9b202a60d5665ac6:
    english: The location of a discarded comment is labelled **Item removed**. Open its three-dot menu and select **Restore**.
    translation: Az eldobott hozzászólás helyén az **Elem törölve** felirat jelenik meg. Nyisd meg a hárompontos menüjét, majd válaszd a **Visszaállítás** lehetőséget.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d6427576dab2b2c5:
    english: "**Delete a comment**"
    translation: "**Hozzászólás törlése**"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d8b9add122e73295:
    english: Deleting a comment removes it permanently. It cannot be restored.
    translation: A törölt hozzászólás végleg eltűnik. Nem lehet visszaállítani.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  51f7dce6a0188a51:
    english: If **Members can delete their own comments** is enabled in [Group permissions](/en/user_manual/groups/settings/permissions), members can permanently delete their own discarded comments. Group admins can delete any comment.
    translation: Ha a [Csoportjogosultságok](/en/user_manual/groups/settings/permissions) között engedélyezve van az **A tagok törölhetik saját megjegyzéseiket** beállítás, a tagok végleg törölhetik a saját eldobott hozzászólásaikat. A csoport adminisztrátorai bármely hozzászólást törölhetnek.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  63134f860609d669:
    english: Open the three-dot menu on an **Item removed** entry and select **Delete**.
    translation: Nyisd meg egy **Elem törölve** bejegyzés hárompontos menüjét, majd válaszd a **Törlés** lehetőséget.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  19580f91a59bf5ef:
    english: A confirmation message explains that the comment will be permanently deleted.
    translation: A megerősítő üzenet tájékoztat arról, hogy a hozzászólás végleg törlődik.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
