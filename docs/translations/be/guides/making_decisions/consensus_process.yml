  9872b82ded022524:
    english: |-
      ## Key points
      - Discuss and develop a proposal together
      - Include and respect everyone involved
      - Seek agreement from most people
    translation: |-
      ## Асноўнае
      - Разам абмяркоўвайце і распрацоўвайце прапанову
      - Далучайце ўсіх, каго датычыцца рашэнне, і паважайце іх меркаванні
      - Імкніцеся да згоды большасці
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a1cd3fa440013e0c:
    english: "**Consensus is typically used in:**\n- Working teams building shared understanding of an issue or opportunity, collaborating on a proposal and deciding course of action. \n- Governance board decisions where the board shows it is acting jointly, such as decisions on vision, policy, strategic planning and budget.\n- AGMs and General Assemblies where members and stakeholders seek general agreement for major decisions, such as revisions to statutes, major transactions and the elections of directors or council members."
    translation: |-
      **Кансенсус звычайна выкарыстоўваюць:**
      - У працоўных камандах, каб разам разабрацца ў праблеме або магчымасці, распрацаваць прапанову і вызначыць далейшыя дзеянні.
      - У кіроўных радах, каб прымаць сумесныя рашэнні адносна бачання, палітыкі, стратэгічнага планавання і бюджэту.
      - На штогадовых агульных сходах і асамблеях, каб удзельнікі і зацікаўленыя бакі дасягалі агульнай згоды па важных пытаннях, такіх як змены статута, буйныя здзелкі і выбары ў раду.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7c5d3122a1333ba5:
    english: |-
      **Typical roles:**
      - Appoint a facilitator.  In board meetings this is usually the Chairperson.
      - A quorum or supermajority of members to participate, as specified in the organization's statutes.
    translation: |-
      **Звычайныя ролі і ўмовы ўдзелу:**
      - Прызначце чалавека, які будзе весці працэс.  На пасяджэннях рады гэтую ролю звычайна выконвае старшыня.
      - Для ўдзелу патрэбны кворум або кваліфікаваная большасць удзельнікаў, калі гэта прадугледжана статутам арганізацыі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1d8ee54aa5e87423:
    english: |-
      ## Consensus process steps
      1. State the issue to be decided - start a Loomio **discussion**.
      2. Present a proposal to test for consensus - start a **Sense check proposal**.
      3. Clarify any points, invite constructive modifications and amend the proposal.
      4. Test for agreement - start a **Consensus proposal**.
      5. Outcome - state the decision **outcome**.
    translation: |-
      ## Этапы працэсу дасягнення кансенсусу
      1. Сфармулюйце пытанне, па якім трэба прыняць рашэнне, — пачніце ў Loomio **абмеркаванне**.
      2. Прадстаўце прапанову, каб праверыць, ці ёсць кансенсус, — стварыце **прапанову для папярэдняй праверкі меркаванняў**.
      3. Удакладніце незразумелыя моманты, прапануйце ўнесці канструктыўныя змены і дапрацуйце прапанову.
      4. Праверце, ці ёсць згода, — стварыце **прапанову для дасягнення кансенсусу**.
      5. Сфармулюйце **выснову** і запішыце прынятае рашэнне.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0b5249cfd4c92c35:
    english: |-
      ## Benefits
      - Grow shared understanding.
      - Decisions for the collective will of the group.
      - Encourage people to value the group over their personal preferences.
    translation: |-
      ## Перавагі
      - Дапамагае разам разабрацца ў пытанні.
      - Дапамагае прымаць рашэнні, якія адлюстроўваюць агульную волю групы.
      - Заахвочвае ўлічваць інтарэсы групы разам з асабістымі перавагамі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  55d7d6c48f056550:
    english: "## Applying the Consensus process on Loomio"
    translation: "## Як правесці працэс дасягнення кансенсусу ў Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e50b473237140170:
    english: |-
      | **Consensus process** | **On Loomio** |
      |---|---|
      | You notice a problem or opportunity and take the initiative. |  |
      | **State the issue to be decided**  <br /><br />Provide background information and open a broad ranging discussion to build shared understanding. Look for emerging proposals. | Start a Loomio discussion <br /><br />Name the topic of discussion in the discussion title, and what you hope to achieve. <br /><br />Attach or link to background information. Invite people to ask questions, contribute information and write comments. |
      | **Present a proposal** <br /><br />Test for consensus. | Run a [Sense check proposal](/en/user_manual/polls/proposals/sense_check/). <br /><br />*In the title:* Name the proposal. <br /><br />*In the proposal details:* Clearly frame the proposal and say why it is important.  Include any background information necessary and a link to the proposal.  <br /><br />Invite everyone to respond, and to do so before the proposal closes.  |
      | **Amendment** <br /><br />Discuss, clarify and amend the proposal. <br /><br />Seek to understand and resolve any objections. <br /><br />Invite people objecting to to propose a constructive and practical modification to the proposed decision or course of action. | Facilitate discussion in the thread to address concerns and modify the proposal. |
      | **Agreement** <br /><br />Do you have an agreement?  Check for: <br /><br />Agreement: I support the proposal. <br /><br />Abstain: This decision does not affect me and I am happy with whatever the group decides. <br /><br />Disagreement: Something in the proposal needs to be changed before I can support it. <br /><br />Block: I have a fundamental disagreement with the proposal that cannot be resolved. | Run a [Consensus proposal](/en/user_manual/polls/proposals/consensus/) with the current proposal version. <br /><br />*In the title:* Name the decision to be made. <br /><br />*In the proposal details:* Present the proposal and invite people to vote. <br /><br />Include a clear statement of what agreement means, say 'for this proposal to pass, we need everyone to vote agree' or 'for this proposal to pass, we need 75% of members to agree'.  <br /><br />Ask participants to leave a vote 'Reason' - and if they do not agree to say why, and what needs to change for them to agree. <br /><br />Some organizations also use the Block (or veto) voting option. <br /><br />As voting progresses, respond to comments, post updates, close early, or let the proposal run to conclusion. <br /><br />Participants can *“change vote”* up to proposal close time, say in response to new information that arrives during voting. |
      | **Outcome** <br /><br />State if agreement was reached and the decision that has been made. <br /><br />Implement the decision and plan actions to be taken. | Consider voting results and state the decision made. <br /><br />Summarize results of the process and say what will happen next. <br /><br />If results are inconclusive, you may choose to re-open the discussion and run a new proposal. <br /><br />The outcome statement is an important record of the decision for future reference. |
    translation: |-
      | **Працэс дасягнення кансенсусу** | **У Loomio** |
      |---|---|
      | Вы заўважаеце праблему або магчымасць і праяўляеце ініцыятыву. |  |
      | **Сфармулюйце пытанне, па якім трэба прыняць рашэнне** <br /><br />Дайце кантэкст і пачніце шырокае абмеркаванне, каб разам разабрацца ў пытанні. Звяртайце ўвагу на прапановы, якія ўзнікаюць падчас абмеркавання. | Пачніце абмеркаванне ў Loomio. <br /><br />У назве абмеркавання пазначце яго тэму і тое, чаго вы хочаце дасягнуць. <br /><br />Далучыце даведачныя матэрыялы або дайце спасылкі на іх. Запрасіце людзей задаваць пытанні, дзяліцца інфармацыяй і пакідаць каментарыі. |
      | **Прадстаўце прапанову** <br /><br />Праверце, ці ёсць кансенсус. | Стварыце [прапанову для папярэдняй праверкі меркаванняў](/en/user_manual/polls/proposals/sense_check/). <br /><br />*У назве:* Назавіце прапанову. <br /><br />*У апісанні прапановы:* Ясна сфармулюйце прапанову і патлумачце, чаму яна важная. Дадайце неабходны кантэкст і спасылку на прапанову. <br /><br />Запрасіце ўсіх адказаць да закрыцця прапановы. |
      | **Дапрацоўка** <br /><br />Абмяркуйце, удакладніце і дапрацуйце прапанову. <br /><br />Паспрабуйце зразумець і зняць пярэчанні. <br /><br />Запрасіце тых, хто пярэчыць, прапанаваць канструктыўныя і практычныя змены да рашэння або плана дзеянняў. | Падтрымлівайце абмеркаванне ў тэме, каб разгледзець занепакоенасць удзельнікаў і змяніць прапанову. |
      | **Згода** <br /><br />Ці дасягнута згода? Праверце пазіцыі: <br /><br />Згода: я падтрымліваю прапанову. <br /><br />Устрыманне: гэтае рашэнне мяне не закранае, і я прыму любы выбар групы. <br /><br />Нязгода: каб я мог падтрымаць прапанову, у ёй трэба нешта змяніць. <br /><br />Блакіроўка: у мяне ёсць прынцыповае пярэчанне супраць прапановы, якое немагчыма зняць. | Стварыце [прапанову для дасягнення кансенсусу](/en/user_manual/polls/proposals/consensus/) на аснове яе актуальнай версіі. <br /><br />*У назве:* Назавіце рашэнне, якое трэба прыняць. <br /><br />*У апісанні прапановы:* Прадстаўце прапанову і запрасіце людзей прагаласаваць. <br /><br />Ясна пазначце ўмову прыняцця прапановы, напрыклад: «Каб прапанова была прынята, усе павінны прагаласаваць „Згодзен“» або «Каб прапанова была прынята, за яе павінны прагаласаваць 75% удзельнікаў». <br /><br />Папрасіце ўдзельнікаў пазначыць «Прычыну» свайго голасу. Калі яны не згодныя, папрасіце патлумачыць чаму і што трэба змяніць для дасягнення згоды. <br /><br />Некаторыя арганізацыі таксама выкарыстоўваюць варыянт галасавання «Блок» (вета). <br /><br />Пакуль ідзе галасаванне, адказвайце на каментарыі, публікуйце абнаўленні, закрыйце прапанову датэрмінова або дачакайцеся запланаванага часу закрыцця. <br /><br />Да закрыцця прапановы ўдзельнікі могуць *«змяніць голас»*, напрыклад калі падчас галасавання з'явіцца новая інфармацыя. |
      | **Выснова** <br /><br />Паведаміце, ці дасягнута згода і якое рашэнне прынята. <br /><br />Рэалізуйце рашэнне і заплануйце неабходныя дзеянні. | Разгледзьце вынікі галасавання і сфармулюйце прынятае рашэнне. <br /><br />Падсумуйце працэс і паведаміце, што будзе далей. <br /><br />Калі вынікі не дазваляюць зрабіць пэўную выснову, вы можаце аднавіць абмеркаванне і стварыць новую прапанову. <br /><br />Выснова захоўвае рашэнне, каб да яго можна было звярнуцца пазней. |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
