  a1c12efad8cb82f5:
    english: "## Name and handle"
    translation: "## Nome e identificativo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3643c2e2ffd5db73:
    english: Choose a concise group name, particularly if the group will contain subgroups. Loomio uses the handle in the group's web address and group email address, such as `loomio.com/your-group-handle` and `your-group-handle@loomio.com`.
    translation: Scegli un nome breve per il gruppo, soprattutto se conterrà sottogruppi. Loomio usa l'identificativo nell'indirizzo web e nell'indirizzo email del gruppo, per esempio `loomio.com/your-group-handle` e `your-group-handle@loomio.com`.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5a6e298a019f6a15:
    english: When you change the handle, links using the previous handle redirect to the new address, and email sent to the previous group address continues to reach the group. Loomio retains up to three previous handles; changing the handle again after that causes the oldest one to expire.
    translation: Quando cambi l'identificativo, i link che usano quello precedente reindirizzano al nuovo indirizzo. Anche le email inviate al vecchio indirizzo continuano a raggiungere il gruppo. Loomio conserva fino a tre identificativi precedenti; se lo cambi ancora, il più vecchio scade.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2b45dd41be9c3d1d:
    english: "## Description"
    translation: "## Descrizione"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7b707620077d9d19:
    english: Use the description to explain what the group is for, who participates, and how people are expected to use it. You can format the description and include links, documents, and videos.
    translation: Usa la descrizione per spiegare lo scopo del gruppo, chi partecipa e come usare questo spazio. Puoi formattare il testo e includere link, documenti e video.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  93a11a5e2927833e:
    english: The name and description may be visible to non-members depending on the group's [privacy settings](/en/user_manual/groups/settings/privacy).
    translation: Il nome e la descrizione possono essere visibili anche a chi non è membro, a seconda delle [impostazioni sulla privacy](/en/user_manual/groups/settings/privacy) del gruppo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0dff03268238aa26:
    english: "## Cover image and logo"
    translation: "## Immagine di copertina e logo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9d08dda635bd5ce6:
    english: The cover image appears across the top of the group page. A wide image works best; the recommended size is 2048 × 512 pixels.
    translation: L'immagine di copertina appare nella parte superiore della pagina del gruppo. Scegli un'immagine larga; la dimensione consigliata è 2048 × 512 pixel.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cc04654d8d08da59:
    english: The group logo identifies the group in navigation and other compact contexts. Upload the cover image and logo separately so each can be cropped for its intended shape.
    translation: Il logo identifica il gruppo nei menu di navigazione e negli altri spazi ridotti. Carica separatamente l'immagine di copertina e il logo, così puoi ritagliare ciascuno nel formato adatto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
