  e21550bf41c185b9:
    english: |-
      ## Generate a Webhook URL
      We've prepared step by step walk-throughs for each service we support. Follow the right one for your service to obtain the webhook URL you'll need to add the chat integration in Loomio.
    translation: |-
      ## Generar una URL de webhook
      Hemos preparado guías paso a paso para cada servicio compatible. Sigue la guía de tu servicio para obtener la URL de webhook que necesitarás para añadir la integración de chat en Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
