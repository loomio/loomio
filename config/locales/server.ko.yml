    funding_decision:
      funding: 자금 지원
      title_placeholder: 로봇 순회 행사 자금 신청
      process_name: 자금 지원 결정
      process_subtitle: 보조금, 대출, 투자 신청을 검토하고 자금 지원을 결정하세요.
      process_introduction: "<p>자금 지원 신청을 소개하고 문서와 기타 증빙 자료를 첨부하세요.</p><p>스레드 배경에 신청 내용을 요약하세요.</p><p>권한이 있는 사람들이 신청서를 검토하고 질문하도록 안내하세요. 토론할 시간을 충분히 주세요.</p><p>합의 제안을 올려 자금 지원을 승인하세요.</p><p>반대하는 사람이 있으면 이유를 물어보세요. 예를 들어 정보가 더 필요할 수 있습니다. 우려가 해소되면 표를 바꾸도록 안내하세요.</p><p>자금 지원 신청에 대한 결정이 명확해지면 결론을 작성해 결정을 기록하세요.</p>"
      description: <h3 id="introduce-and-summarize-the-funding-application">자금 지원 신청을 소개하고 요약하세요</h3><p></p><h3 id="how-does-this-application-fit-with-funding-criteria">이 신청은 자금 지원 기준에 어떻게 부합하나요?</h3><p></p><h3 id="who-is-authorized-to-approve-this-funding-decision">이 자금 지원 결정을 승인할 권한은 누구에게 있나요?</h3><p></p><h3 id="invite-questions-from-decision-makers-to-process-the-applica">신청을 검토할 수 있도록 결정권자들의 질문을 받으세요</h3><p></p>
    approve_a_document:
      title_placeholder: 브랜드 전략 수립
      process_name: 문서 승인
      process_subtitle: 중요한 문서, 정책 또는 합의문을 소개하고 토론하며 발전시키세요.
      process_introduction: "<p>배경 정보와 함께 문서를 소개하세요. 초점을 유지할 수 있도록 문서의 목적을 밝히세요.</p><p>참여자들이 정보와 전문 지식을 나누도록 요청하고, 이를 바탕으로 문서의 틀을 잡으세요. 참여자들의 의견과 기여를 인정하고 검토하세요.</p><p>참여자들의 기여를 반영해 초안을 작성하고, 승인할 준비가 될 때까지 수정하세요.</p><p>의견 확인 투표로 의견을 모으고 초안의 쟁점을 명확히 하세요.</p><p>의견을 검토하고 문서에 반영한 뒤, 이의 없음 또는 합의 제안으로 승인이나 합의를 진행하세요.</p><p>스레드에는 문서 작성 과정과 결정 사항이 명확하게 기록됩니다.</p>"
      description: <h3 id="what-is-the-purpose-of-the-document">문서의 목적은 무엇인가요?</h3><p></p><h3 id="why-is-this-important">왜 중요한가요?</h3><p></p><h3 id="what-are-you-asking-people-to-do">참여자들에게 무엇을 요청하나요?</h3><p></p>
      document: 문서
    practice_thread:
      process_name: 토론 연습
      process_subtitle: 그룹에 온 사람들을 환영하고 Loomio 사용을 연습하세요
      process_introduction: "<p>새 멤버를 환영하고 처음부터 참여하도록 격려하세요. 자기소개를 부탁하고 Loomio의 기능을 함께 살펴보세요.</p>"
      title: "\U0001F44B 환영합니다. 인사하고 기능을 사용해 보세요"
      description: "<p>Loomio 그룹에 오신 것을 환영합니다. 함께하게 되어 반갑습니다.</p><p>이 스레드에서 다음을 해 보세요:</p><ul>\n<li><p>그룹에 자기소개하기</p></li>\n<li><p>Loomio의 기능 사용해 보기 - 예: 반응 남기기 \U0001F44D</p></li>\n<li><p>지금 궁금한 점 질문하기</p></li>\n</ul><p>무슨 말을 할지 모르겠다면 간단한 인사도 좋습니다 \U0001F642</p>"
      process_subtitle_v2: 서로 환영하고 함께 Loomio 사용에 익숙해지세요
      process_introduction_v2: "<p>새 그룹을 위한 환영 스레드입니다. 서로 소개하고, 댓글과 반응 같은 기능을 써 보고, 첫 제안을 진행합니다.</p>"
      title_v2: 환영합니다. 자기소개하고 기능을 사용해 보세요
      description_v2: "<p>그룹에 오신 것을 환영합니다. 이 스레드에서 인사하고, 질문하고, 기능을 써 보며 Loomio에 익숙해지세요.</p><p>댓글이나 반응을 남기거나 아래 제안 중 하나를 시작하세요.</p><p>무슨 말을 할지 모르겠다면 간단한 인사도 좋습니다. 아래 투표 도구 중 하나를 사용해 보셔도 좋습니다.</p>"
    blank:
      process_name: 빈 템플릿
      process_subtitle: 어떤 주제로든 새 토론을 시작하세요
      process_introduction: "<p>원하는 주제로 그룹에서 토론을 시작하세요.</p> <p>기본적으로 토론을 시작하면 그룹의 모든 멤버에게 알림이 갑니다. 아래 '초대' 항목을 수정해 변경할 수 있습니다.</p>"
    discuss_a_topic:
      title_placeholder: 어떤 주제로 토론하고 싶나요?
      process_name: 주제 토론
      process_subtitle: 그룹과 토론을 시작하세요
      process_introduction: "<p>그룹에서 다루고 싶은 사안, 문제 또는 기회가 있나요?</p><p>주제를 소개하고, 배경 정보 링크를 추가하고, 댓글과 아이디어, 도움을 요청하세요.</p><p>생각과 관련 정보를 나누며 참여하도록 사람들을 초대하세요. 특정 사람의 관심이 필요하면 @멘션을 사용하세요.</p><p>토론이 결론으로 이어지도록 진행 상황에 맞춰 스레드 배경을 업데이트하세요.</p><p>모든 정보가 모일 때까지 기다리지 말고 스레드를 시작하세요. 스레드에서 함께 주제를 살펴보고 해결책을 찾도록 도움을 요청하세요.</p>"
      description: <h3 id="introduce-and-describe-the-topic">주제를 소개하고 설명하세요</h3><p></p><h3 id="why-is-this-important">왜 중요한가요?</h3><p></p><h3 id="how-would-you-like-people-to-respond">어떤 응답을 원하나요?</h3><p></p>
    onboarding_to_loomio:
      title: 우리 그룹의 Loomio 활용
      process_name: 함께 Loomio 사용해 보기
      process_subtitle: Loomio를 처음 쓰는 사람들이 댓글 작성과 투표를 연습하는 스레드입니다.
      process_introduction: "<p>사람들에게 Loomio를 소개하세요.</p><p>간단한 자기소개 스레드와 연습용 제안으로 Loomio를 경험해 보세요</p>"
      description: <h3 id="why-are-you-interested-in-using-loomio">Loomio를 사용하려는 이유는 무엇인가요?</h3><p>우리 조직의 결정에 사람들이 참여하도록 Loomio를 사용하려고 합니다.</p><h3 id="what-are-you-asking-people-to-do">어떤 참여를 요청하나요?</h3><p>생각을 들려주세요. 아래에 댓글을 남기고 제안에 투표하세요.</p><p>댓글 오른쪽 아래의 답글 아이콘을 클릭하면 답글을 쓸 수 있습니다.</p><p>@멘션으로 사람들에게 알림을 보내세요.</p>
      onboarding: 시작 안내
    consent_process:
      title_placeholder: 우리 조직의 보건·안전 정책 수립
      process_name: 이의 없는 의사결정
      process_subtitle: 이의 없이 ‘시도해도 안전한’ 결정을 내리세요.
      process_introduction: '<p>제안에 타당한 이의가 없는지 확인해, 지금 ''시도해도 안전한'' 결정을 빠르게 내리세요.</p><p>주요 역할:</p><ul><li><p>제안자: 결정이 필요한 주제를 꺼내는 사람입니다.</p></li><li><p>진행자: 제안자가 일을 효율적으로 진행하도록 돕는 사람입니다.</p></li></ul><p>일반적인 진행 단계:</p><p>1단계. Loomio 스레드로 제안을 소개하세요.</p><p>2단계. 의견 확인으로 질문, 반응, 댓글을 나누는 라운드를 진행해 제안을 개선하세요.</p><p>3단계. 제시된 의견과 댓글을 반영해 제안을 수정하세요.</p><p>4단계. 이의 없음 제안으로 수정된 제안에 타당한 이의가 있는지 물어보세요.</p><p>5단계. 타당한 이의를 반영해 모두가 ‘시도해도 안전하다’고 이의 없이 받아들이는 제안으로 수정하고, 마무리되면 결정의 결론을 작성하세요.</p><p><a target="_blank" rel="noopener noreferrer nofollow" href="/docs/en/guides/making_decisions/consent_process">자세히 보기: 이의 없는 의사결정.</a></p>'
      description: <h3 id="what-is-the-decision-you-need-to-make">어떤 결정을 내려야 하나요?</h3><h3 id=""></h3><h3 id="why-is-this-important-and-what-impact-does-it-have">왜 중요하며 어떤 영향이 있나요?</h3><p></p><h3 id="what-information-do-people-need-for-context">배경을 이해하는 데 어떤 정보가 필요한가요?</h3><p></p><h3 id="who-is-the-facilitator-for-this-process">이 과정의 진행자는 누구인가요?</h3><p></p>
      consent: 이의 없음
    advice_process:
      title_placeholder: 새 컴퓨터 구매를 위한 조언 구하기
      process_name: 조언 절차
      process_subtitle: 내려야 할 결정에 관해 조언을 구하세요.
      process_introduction: '<p>영향을 받는 사람이나 전문 지식이 있는 사람의 조언을 바탕으로 조직에 더 나은 결정을 내리세요.</p><p>주요 역할:</p><ul><li><p>진행자: 결정을 내리는 사람이 맡거나 다른 사람에게 진행을 부탁하세요.</p></li><li><p>조언자: 영향을 받거나 전문 지식이 있어 초대한 사람들입니다.</p></li></ul><p>일반적인 진행 단계:</p><p>1단계. 행동을 제안하기 전에 의견을 구해 여러 관점을 살펴보세요.</p><p>2단계. 제안을 작성하고 조언을 구하세요 - 조언 제안을 진행하세요.</p><p>3단계. 받은 조언을 고려해 결정을 내리고 조언한 사람들에게 알리세요 - 결론을 작성하세요.</p><p><a target="_blank" rel="noopener noreferrer nofollow" href="/docs/en/guides/making_decisions/advice_process">자세히 보기: 조언 절차.</a></p>'
      description: <h3 id="what-is-the-decision-you-need-to-make">어떤 결정을 내려야 하나요?</h3><p></p><h3 id="why-is-this-important-and-what-impact-does-it-have">왜 중요하며 어떤 영향이 있나요?</h3><p></p><h3 id="what-advice-are-you-asking-to-help-you-make-a-good-decision">좋은 결정을 내리기 위해 어떤 조언을 구하나요?</h3><p></p><h3 id="who-is-the-facilitator-for-this-process">이 과정의 진행자는 누구인가요?</h3><p></p>
      advice: 조언
    pass_a_resolution:
      title_placeholder: 전략 승인 결의안
      process_name: 결의안 통과
      process_subtitle: 배경 정보와 함께 결의안을 소개하고, 질문에 답한 뒤 결의안 통과를 위한 제안을 올리세요.
      process_introduction: <p>로버트 의사규칙은 다수의 뜻을 따르면서도 소수의 의견을 들을 수 있도록 그룹이 질서 있게 회의를 진행하는 데 도움이 되는 규정과 윤리 규칙입니다. <a target="_blank" rel="noopener noreferrer nofollow" href="https://www.boardeffect.com/blog/roberts-rules-of-order-cheat-sheet/">https://www.boardeffect.com/blog/roberts-rules-of-order-cheat-sheet/</a> 멤버가 “다음과 같이 동의합니다…”라고 말하며 행동이나 결정을 제안합니다. 다른 멤버가 “그 동의에 재청합니다.”라고 말해 재청해야 합니다. 재청이 있으면 그룹은 해당 동의안을 표결합니다. 정관에 정한 규칙에 따라 과반수 찬성이나 정족수 충족으로 통과됩니다.</p>
      description: "<p><strong>통과시킬 결의안을 적으세요</strong></p><p></p><p><strong>배경 정보를 간략히 적으세요</strong></p><p></p><p><strong>멤버들이 질문하고, 댓글을 남기고, 정보를 보태 함께 이해를 넓히도록 안내하세요</strong></p><p></p>"
      resolution: 결의안
    decision_by_consensus:
      title_placeholder: 우리 단체 정관 개정
      process_name: 합의로 결정
      process_subtitle: 관련된 모든 사람과 함께 합의에 이르세요.
      process_introduction: '<p>함께 내려야 할 결정에 대해 합의를 이루어 모든 참여자의 필요와 우려를 충족하세요.</p><p>일반적인 역할:</p><ul><li><p>진행자를 정하세요.&nbsp; (이사회 회의에서는 보통 의장이 맡습니다.)</p></li><li><p>단체 정관에 명시된 정족수 또는 특별다수에 해당하는 멤버가 참여해야 합니다.</p></li></ul><p>일반적인 진행 단계:</p><p>1단계. 쟁점이나 결정안에 대해 자유롭게 토론할 자리를 마련하세요.</p><p>2단계. 의견 확인 제안으로 합의 여부를 확인하고 이의를 파악하세요.&nbsp;</p><p>3단계. 불분명한 점을 설명하고, 건설적인 수정 의견을 받아 제안을 수정하세요.</p><p>4단계. 합의 제안으로 동의 여부와 남은 이의를 확인하세요.</p><p>5단계. 결론과 단체의 공식 회의록에 결정을 기록하세요.</p><p><a target="_blank" rel="noopener noreferrer nofollow" href="/docs/en/guides/making_decisions/consensus_process">자세히 보기: 합의 절차.</a></p>'
      description: <h3 id="what-is-the-decision-you-need-to-make">어떤 결정을 내려야 하나요?</h3><p></p><h3 id="why-is-this-important-and-what-impact-does-it-have">왜 중요하며 어떤 영향이 있나요?</h3><p></p><h3 id="what-information-do-people-need-for-context">배경을 이해하려면 어떤 정보가 필요한가요?</h3><p></p><h3 id="who-is-the-facilitator">진행자는 누구인가요?</h3><p></p><h3 id="what-conditions-need-to-be-met-for-a-decision">결정하려면 어떤 조건을 충족해야 하나요?</h3><h3 id=""></h3>
      consensus: 합의
    share_links_and_info:
      title_placeholder: 링크와 정보 공유
      process_name: 링크와 정보 공유
      process_subtitle: 정보, 링크, 보고서를 올려 공유하고 댓글과 토론으로 의견을 나누세요.
      process_introduction: "<p>스레드를 그룹의 '담벼락'이나 '게시판'으로 사용해 서로 나누고 싶은 정보, 소식, 아이디어를 올리세요.</p><p>그룹이 Loomio 안에서 정보를 볼 수 있도록 <strong>링크 삽입</strong>과 <strong>동영상 삽입</strong> 서식 도구를 사용하도록 안내하세요. 댓글에 <strong>제목</strong>을 사용하면 스레드 타임라인에 표시되어 쉽게 찾을 수 있습니다.</p><p>스레드를 <strong>고정</strong>해 계속 눈에 띄게 하고, <strong>반응</strong>으로 게시물을 봤다는 것을 알려 활발한 참여를 이끌어 보세요.</p><p>이 스레드의 기본 정렬은 <strong>최신순</strong>으로, 가장 최근 댓글이 스레드 맨 위에 표시됩니다.</p>"
      description: <p>이 스레드에 정보, 공지, 나누고 싶은 내용을 올리세요. 어떤 일이 있는지 살펴보고 참여할 수 있는 공간입니다.</p><p data-text-align="start">행사, 보고서, 팟캐스트 등 흥미로운 온라인 정보를 공유하세요.</p><p data-text-align="start">Loomio 안에서 정보를 볼 수 있도록 <strong>링크 삽입</strong>과 <strong>동영상 삽입</strong> 서식 도구를 사용하세요.</p>
      information: 정보
    prepare_for_a_meeting:
      title_placeholder: 다음 회의 준비
      process_name: 회의 준비
      process_subtitle: 안건을 정하고, 이사회 자료를 올리고, 행정 사항을 정리해 모두가 최신 상황과 배경을 파악하고 준비하도록 하세요.
      description: <p><strong>회의의 핵심 주제</strong></p><p></p><p data-text-align="start"><strong>주요 안건</strong></p><p data-text-align="start"></p><p data-text-align="start"><strong>지난 회의의 실행 사항</strong></p><p data-text-align="start"></p><p data-text-align="start"><strong>참여자는 회의를 어떻게 준비해야 하나요?</strong></p><p data-text-align="start"></p><p data-text-align="start"><strong>회의 자료 목록</strong></p><p data-text-align="start"></p>
      process_introduction: <p>처음부터 사람들을 참여시키고 가장 중요한 주제에 집중해 효과적인 회의를 계획하고, 함께하는 소중한 시간을 알차게 쓰세요.</p> <p>스레드를 회의 공간으로 활용해 핵심 주제와 안건을 정하고, 적절한 날짜를 찾고, 주요 문서와 보고서를 올리고, 안건 토론을 시작하고, 실행 사항과 회의록을 공유하세요.</p><p>이렇게 하면 모두가 자료를 읽고 토론 주제와 내려야 할 결정을 생각하며 회의를 준비할 수 있습니다. 멤버들이 배경을 파악하고 준비된 상태로 회의에 참석하는 데 도움이 됩니다.</p> <p>Loomio의 좋은 거버넌스 가이드에서 <a target="_blank" rel="noopener noreferrer nofollow" href="/docs/en/guides/board_processes/meeting"><u>회의 준비</u></a>에 대해 자세히 알아보세요.</p>
      meeting: 회의
    build_a_policy:
      title_placeholder: 채용 정책 개정
      process_name: 정책 수립
      process_subtitle: 팀과 함께 정책이나 절차 문서를 만들고 합의하세요.
      process_introduction: "<p><span>스레드는 정책을 토론하는 공간으로, 요구 사항과 원칙에 합의하고 문서 초안을 올려 의견을 받을 수 있습니다.</span></p><p><span>이 템플릿으로 소수의 사람들과 정책을 만들거나, 단체 전체에 과정을 공개하고 문서가 수정될 때마다 의견을 받아 보세요.</span></p><p><span>의견 확인 제안으로 그룹 멤버에게 초안을 검토할 준비가 되었다고 알리고, 문서를 읽은 뒤 의견이나 질문을 남기도록 안내하세요.</span></p><p><span>'최종' 초안이 준비되면 이의 없음 또는 합의 제안을 올려 문서를 승인하세요.</span></p>"
      description: "<p><strong><span>어떤 정책이나 문서를 만들어야 하나요?</span></strong></p><p></p><p><strong><span>왜 중요한가요?</span></strong></p><p></p><p><strong><span>사람들에게 무엇을 요청하나요?</span></strong></p><p></p>"
      policy: 정책
    elect_a_governance_position:
      title_placeholder: 평의회 후보 추천 및 선거
      process_name: 임원 선출
      process_subtitle: 평의회, 위원회, 이사회의 임원 후보를 추천하고 선출하세요.
      process_introduction: "<p>멤버들이 후보자를 평가할 수 있도록 직책의 역할과 자격 요건을 소개하세요.</p><p>참여 신청 투표로 후보 추천을 받으세요. 추천된 후보자에게 사진, 약력, 추천서를 올리도록 안내하세요. 후보자의 동영상 메시지를 삽입해 멤버들이 후보자의 이야기를 직접 보고 들을 수 있게 하세요.</p><p>후보자를 선출할 준비가 되면 이의 없음 제안을 사용하세요.</p><p>한 자리에 후보자가 여럿이면 투표자가 선호하는 순서대로 후보자의 순위를 정할 수 있는 선호 순위 투표 제안을 사용하세요.</p>"
      description: '<h3 id="what-position-do-you-need-to-fill">어떤 직책을 맡을 사람을 선출하나요?</h3><p></p><h3 id="why-is-this-important">왜 중요한가요?</h3><p></p><h3 id="what-qualifications-skills-and-experiences-make-a-good-cand">적합한 후보자는 어떤 자격, 역량, 경험을 갖춰야 하나요?</h3><p></p><h3 id="what-is-the-election-process">선거 절차는 어떻게 되나요?</h3><p>1단계: 후보 추천 - 적합한 후보자를 추천받습니다.</p><p>2단계: 후보 소개 - 각 후보자의 사진, 짧은 약력, 추천서를 포함하세요.</p><p>3단계: 선거 - 투표로 해당 직책을 맡을 후보자를 선출합니다.</p>'
