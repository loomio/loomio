  195fe68dbcc6418f:
    english: Loomio can send notifications to your chatroom.
    translation: Loomio peut envoyer des notifications dans votre salon de discussion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bf886ec0d398e8d7:
    english: Chat tools and Loomio work well together. Use chat for quick conversation and timely updates. Move important topics to Loomio when people need time to participate, when a decision must be made, or when the group will need a lasting record.
    translation: Les outils de chat et Loomio se complètent. Utilisez le chat pour les échanges rapides et les nouvelles à partager sans attendre. Ouvrez une discussion dans Loomio lorsque les personnes ont besoin de temps pour participer, qu'une décision doit être prise ou que le groupe doit conserver une trace des échanges.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  db7d26a18ddc651d:
    english: Loomio supports Slack, Discord, Microsoft Teams, Matrix and Mattermost.
    translation: Loomio prend en charge Slack, Discord, Microsoft Teams, Matrix et Mattermost.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  765fc0d609a0db99:
    english: You can send notifications to your chatroom any time you like, just the same way you would invite individual people to vote, or to join a thread.
    translation: Vous pouvez envoyer une notification dans votre salon de discussion à tout moment, comme vous inviteriez des personnes à voter ou à rejoindre une discussion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a89717f4f41f3212:
    english: You can also configure notifications to always happen when a specific event happens, like someone starting a thread.
    translation: Vous pouvez aussi configurer l'envoi automatique de notifications pour certains événements, par exemple lorsqu'une personne ouvre une discussion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
