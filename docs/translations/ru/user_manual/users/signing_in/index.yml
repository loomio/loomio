---
navigation_title: Вход в систему
blocks:
  7d0aa091e06fa112:
    english: "# Signing in"
    translation: "# Вход в систему"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3bede807c136909b:
    english: On Loomio.com, you can sign in with a passkey, your email and password, an emailed sign-in code, or Google. You can choose whichever available method is most convenient for you.
    translation: На Loomio.com вы можете войти с помощью ключа доступа, адреса электронной почты и пароля, кода из письма или аккаунта Google. Выберите удобный вам доступный способ.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2bc2277a8ee0508d:
    english: "![The Loomio sign-in form with passkey, email, password, and emailed-code options](sign_in_email.png)"
    translation: "![Форма входа в Loomio с вариантами входа по ключу доступа, электронной почте и паролю или коду из письма](sign_in_email.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e3daf63d410d5513:
    english: "## Sign in with a passkey"
    translation: "## Вход с помощью ключа доступа"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5c82bc1e8baa9f0b:
    english: Select **Use a passkey**. Your browser or device shows the Loomio passkeys available to you and asks you to unlock the selected passkey with its normal screen lock, fingerprint, face recognition, PIN, or security key. You do not enter an email address first.
    translation: 'Нажмите **Используйте пароль**. Браузер или устройство покажет доступные вам ключи доступа Loomio и предложит разблокировать выбранный ключ обычным способом: с помощью блокировки экрана, отпечатка пальца, распознавания лица, PIN-кода или аппаратного ключа безопасности. Предварительно вводить адрес электронной почты не нужно.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9386303ee98cb592:
    english: You can add, name, and remove passkeys from your profile. For security, Loomio may ask you to sign in again before changing them. Give each passkey a recognizable name such as “Work laptop” or “Phone”. Passkeys are tied to the Loomio site where they were created and may be synchronized by your device or password manager.
    translation: Вы можете добавлять, переименовывать и удалять ключи доступа в своём профиле. В целях безопасности Loomio может попросить вас повторно войти перед их изменением. Дайте каждому ключу понятное имя, например «Рабочий ноутбук» или «Телефон». Ключи доступа привязаны к сайту Loomio, на котором они созданы, и могут синхронизироваться вашим устройством или менеджером паролей.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5f10999e671f9b56:
    english: "## Sign in with email and password"
    translation: "## Вход по электронной почте и паролю"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5c8a380df0b08c86:
    english: Enter your email address and password, then select **Sign in**. For account privacy, Loomio uses the same error when the email or password cannot be used to sign in.
    translation: Введите адрес электронной почты и пароль, затем нажмите **Войти**. Для защиты данных аккаунта Loomio показывает одинаковую ошибку, если для входа нельзя использовать указанный адрес или пароль.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  63c19e6f58a1de53:
    english: If you have not added a passkey, Loomio offers to add one after you sign in with a password. You can dismiss the offer, and Loomio will remember your choice.
    translation: Если вы ещё не добавили ключ доступа, после входа по паролю Loomio предложит вам это сделать. Вы можете отклонить предложение, и Loomio запомнит ваш выбор.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dde79982546607b4:
    english: If you do not have a password or cannot remember it, select **Send me a code** instead.
    translation: Если у вас нет пароля или вы его не помните, нажмите **Пришлите мне код**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5f3c6f8eca20d49c:
    english: "## Get a sign-in code"
    translation: "## Получение кода для входа"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9713c017e247d8e2:
    english: Select **Send me a code**, enter your email address, and submit the form. Loomio displays the same confirmation whether or not the address belongs to an account, so another person cannot use the form to discover who uses Loomio.
    translation: Нажмите **Пришлите мне код**, введите адрес электронной почты и отправьте форму. Loomio покажет одинаковое подтверждение независимо от того, связан ли адрес с аккаунтом. Так другие люди не смогут узнать через форму, кто пользуется Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  546aaa95b133da11:
    english: If the address belongs to your account, Loomio sends a six-digit code. Return to the sign-in form, enter the code, and select **Sign in**. Sign-in codes normally expire after 24 hours and cannot be reused. Check your spam folder if the message does not arrive, and make sure you entered the address associated with your account.
    translation: Если адрес связан с вашим аккаунтом, Loomio отправит шестизначный код. Вернитесь к форме входа, введите код и нажмите **Войти**. Обычно коды действуют 24 часа и не могут использоваться повторно. Если письмо не пришло, проверьте папку «Спам» и убедитесь, что вы указали адрес, связанный с вашим аккаунтом.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  26171d5996050130:
    english: "![The Loomio form for entering a six-digit sign-in code](sign_in_code.png)"
    translation: "![Форма Loomio для ввода шестизначного кода входа](sign_in_code.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '087809317d00494a':
    english: After each sign-in with a code, Loomio offers to set or replace your password. If your browser supports passkeys, you can also add one, even if you have already added a passkey on another device. A passkey lets you sign in quickly with your device’s fingerprint, face, or screen lock. You can skip the offer and continue using emailed codes.
    translation: После каждого входа по коду Loomio предлагает установить или заменить пароль. Если браузер поддерживает ключи доступа, вы также можете добавить ключ, даже если уже добавили его на другом устройстве. Ключ доступа позволяет быстро входить с помощью отпечатка пальца, распознавания лица или блокировки экрана вашего устройства. Вы можете пропустить предложение и продолжить пользоваться кодами из писем.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fa960675e8369daf:
    english: "## Create an account"
    translation: "## Создание аккаунта"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  75fc0885f772c8cf:
    english: Select **Create account** and follow the email-verification steps.
    translation: Нажмите **Зарегистрироваться** и подтвердите адрес электронной почты, следуя инструкциям.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  aa461253943b989a:
    english: For privacy, use the same email address that received your group invitation. If you have accounts under more than one address, you can [merge your accounts](/en/user_manual/users/merge_accounts).
    translation: Для защиты личных данных используйте тот же адрес электронной почты, на который вы получили приглашение в группу. Если у вас есть аккаунты с разными адресами, вы можете [объединить их](/en/user_manual/users/merge_accounts).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d9844ac27d806c35:
    english: "## Sign in with Google"
    translation: "## Вход через Google"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8445cfcb9e9ecef5:
    english: Select **Sign in with Google** and authenticate with your Google account. If an existing Loomio account has the same email address, Loomio links the Google identity to that account.
    translation: Нажмите **Войти через Google** и войдите в свой аккаунт Google. Если существующий аккаунт Loomio связан с тем же адресом электронной почты, Loomio привяжет к нему аккаунт Google.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  46281cafc4a889bf:
    english: "## Other Loomio sites"
    translation: "## Другие сайты Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  23c2dffa5d5056e2:
    english: Organizations that host their own Loomio site can configure different sign-in methods. A site may offer passwords, emailed codes, passkeys, Google, SAML, or another OAuth provider alongside each other.
    translation: Организации, которые размещают собственный сайт Loomio, могут настроить разные способы входа. На одном сайте могут быть доступны пароли, коды из писем, ключи доступа, Google, SAML и другие поставщики OAuth.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3de129c7bac50409:
    english: Some sites require an invitation before you can create an account. On these sites, **Create account** appears only when you follow an invitation link.
    translation: На некоторых сайтах для создания аккаунта требуется приглашение. На таких сайтах кнопка **Зарегистрироваться** появляется, только когда вы переходите по ссылке в приглашении.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  16004d08bcad640b:
    english: An SSO-only private site shows only its organization sign-in option. It does not offer Loomio-managed passwords, emailed sign-in codes, native account creation, or Loomio-managed passkeys. If the organization uses passkeys, its identity provider asks for them during SSO.
    translation: На закрытом сайте с входом только через SSO отображается лишь способ входа, настроенный организацией. Там недоступны пароли, коды из писем, создание аккаунтов и ключи доступа, управляемые Loomio. Если организация использует ключи доступа, её служба входа запросит их при входе через SSO.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  148bcb52b49eb179:
    english: "## Sign out"
    translation: "## Выход из системы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dc9ad2d75eb9da48:
    english: Open the sidebar, select your name, then select **Sign out**. On a shared computer, sign out when you finish rather than closing only the browser tab.
    translation: Откройте боковое меню, нажмите на своё имя, затем выберите **Выйти**. Если вы пользуетесь общим компьютером, по окончании работы выйдите из аккаунта, а не просто закройте вкладку браузера.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
