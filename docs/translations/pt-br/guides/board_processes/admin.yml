    translated_on: '2026-09-30'
  f742ae07824b35c6:
    english: If a new topic is introduced in the middle of a discussion, you can select and move specific comments to another discussion, or start a new discussion.
    translation: Se surgir um novo assunto durante uma discussão, você pode selecionar e mover comentários específicos para outra discussão ou iniciar uma nova.
    status: machine
