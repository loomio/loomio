  0b8bb762e37fb8c3:
    english: |-
      To create a poll or proposal and only invite the delegates, use the "Selected people only" poll setting.
      ![Selected people only setting when starting a proposal](poll_invited_people_only.png)
      Then when inviting people to vote you will see the "Delegates of group-name" option.
      ![Delegates of Oatmilk Cooperative option in the invite-to-vote form](poll_invite_delegates_group.png)
    translation: |-
      Ha szavazást vagy javaslatot indítasz, és csak a küldötteket szeretnéd meghívni, válaszd a „Csak kiválasztott személyek” beállítást.
      ![Csak kiválasztott személyek beállítás javaslat indításakor](poll_invited_people_only.png)
      Amikor szavazásra hívsz meg embereket, megjelenik a „csoportnév küldöttei” lehetőség.
      ![Az Oatmilk Cooperative küldöttei lehetőség a szavazásra meghívó űrlapon](poll_invite_delegates_group.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e895a07efeaf4dcf:
    english: |-
      You can see a list of who the delegates are from the members tab of your group page. Use the filter menu and select "Delegates".
      ![Delegates option in the members filter](members_list_delegates.png)
    translation: |-
      A csoportod oldalán, a tagok lapján láthatod a küldöttek listáját. Nyisd meg a szűrő menüt, és válaszd a „Küldöttek” lehetőséget.
      ![Küldöttek lehetőség a tagok szűrőjében](members_list_delegates.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
