  '09b3d2247802eae7':
    english: A person is a delegate when they have an active delegate membership in any selected group. Their counts are aggregated across all selected groups. Delegate rows are returned even when every activity count is zero. Counts cover threads, comments, polls, votes, outcomes, and reactions; they are not voting participation rates. User rows also include identified ballots issued, cast, and missed. Anonymous polls are excluded from all per-person voting counts. `all_votes_cast` is true only when at least one ballot was issued and every issued ballot was cast.
    translation: 'Uma pessoa é delegada quando tem uma associação ativa como delegada em qualquer um dos grupos selecionados. Suas contagens são agregadas em todos os grupos selecionados. Delegados aparecem no relatório mesmo quando todas as contagens de atividade são zero. As contagens incluem tópicos, comentários, enquetes, votos, conclusões e reações; elas não representam taxas de participação nas votações. Os registros de usuários também incluem os convites para votar em enquetes identificadas: quantos foram emitidos, atendidos e não atendidos. Enquetes anônimas ficam fora de todas as contagens de votos por pessoa. `all_votes_cast` só é verdadeiro quando pelo menos um convite para votar foi emitido e todos os convites emitidos resultaram em voto.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
