navigation_title: Valitse
blocks:
  581de5d50d3dc442:
    english: "# Choose"
    translation: "# Valitse"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  733b320e0407fbdc:
    english: Choose is a simple poll for finding the most popular option or making a shortlist. Participants select one or more options, depending on the limits you set. This voting method is commonly known as multiple choice.
    translation: Valitse on yksinkertainen kysely, jolla löydät suosituimman vaihtoehdon tai kokoat lyhyen listan. Osallistujat valitsevat yhden tai useamman vaihtoehdon asettamiesi rajojen mukaan. Tätä äänestystapaa kutsutaan monivalinnaksi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '09aefb579b50874b':
    english: "## When to use Choose"
    translation: "## Milloin Valitse sopii käyttöön"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  be35cf72fcaf9c4d:
    english: 'Use Choose when the options are distinct and you need to count how many people select each one. It works well for:'
    translation: 'Käytä Valitse-kyselyä, kun vaihtoehdot ovat erillisiä ja haluat laskea, kuinka moni valitsee kunkin niistä. Se sopii esimerkiksi seuraaviin tilanteisiin:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dcc6f6b9238155b2:
    english: |-
      - choosing one venue from a shortlist;
      - selecting up to three topics for an agenda;
      - deciding which design should proceed to the next round; or
      - checking which services members intend to use.
    translation: |-
      - yhden kokouspaikan valitseminen lyhyeltä listalta;
      - enintään kolmen aiheen valitseminen esityslistalle;
      - jatkoon etenevän suunnitelman valitseminen; tai
      - sen selvittäminen, mitä palveluja jäsenet aikovat käyttää.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3770d0653b752de5:
    english: Choose records selections, not the strength or order of a person's preferences. Use [Score](/en/user_manual/polls/score/) to measure how strongly people support every option, [Allocate](/en/user_manual/polls/allocate/) when there is a limited budget, or [Rank](/en/user_manual/polls/rank/) when preference order matters.
    translation: Valitse-kysely tallentaa valinnat, mutta ei sitä, kuinka vahvasti osallistuja kannattaa vaihtoehtoja tai missä järjestyksessä hän niitä suosii. Käytä [Pisteet](/en/user_manual/polls/score/)-kyselyä, kun haluat mitata kunkin vaihtoehdon kannatuksen voimakkuutta, [Kohdista](/en/user_manual/polls/allocate/)-kyselyä, kun käytettävissä on rajallinen budjetti, tai [Sijoitus](/en/user_manual/polls/rank/)-kyselyä, kun vaihtoehtojen järjestyksellä on merkitystä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f15aca327e894f30:
    english: "## Example: set a planning-meeting agenda"
    translation: "## Esimerkki: suunnittelukokouksen esityslista"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f51e09afa0ed1e53:
    english: Oatmilk Cooperative needs to decide which parts of a returnable-bottle trial need the most time at its next planning meeting. The poll asks each person to choose up to two topics. Its details explain how the result will be used, and each option includes enough information to distinguish it from the others.
    translation: Oatmilk-osuuskunnan pitää päättää, mitkä palautuspullojen kokeilun osa-alueet tarvitsevat eniten aikaa seuraavassa suunnittelukokouksessa. Kyselyssä jokaista pyydetään valitsemaan enintään kaksi aihetta. Kyselyn tiedoissa kerrotaan, miten tulosta käytetään. Jokaisesta vaihtoehdosta annetaan riittävästi tietoa, jotta se erottuu muista.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c74ebb16f872b3c6:
    english: "## Set up the poll"
    translation: "## Määritä kysely"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  abc749fec8671661:
    english: Give the poll a specific question as its title. In **Details**, explain what participants should consider and what will happen with the result. Add each available option, then set the **Minimum choices** and **Maximum choices**.
    translation: Kirjoita kyselyn otsikoksi täsmällinen kysymys. Kerro **Tiedot**-kohdassa, mitä osallistujien tulee ottaa huomioon ja mitä tuloksen perusteella tehdään. Lisää kaikki tarjolla olevat vaihtoehdot ja aseta sitten **Vähimmäisvalinnat** ja **Maksimi valinnanvaraa**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e878ddc9f61dd243:
    english: Set both limits to 1 when participants must choose exactly one option. Set a higher maximum when you want a shortlist. Avoid allowing so many choices that participants can select nearly every option, because that makes the result less useful.
    translation: Aseta molemmiksi rajoiksi 1, jos osallistujan on valittava täsmälleen yksi vaihtoehto. Aseta suurempi enimmäismäärä, jos haluat koota lyhyen listan. Älä salli niin montaa valintaa, että osallistujat voivat valita lähes kaikki vaihtoehdot. Silloin tulos on vähemmän hyödyllinen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  152fec5018fc232b:
    english: Use the pencil icon beside an option to add a meaning or further explanation. This is useful when a short option name could be interpreted in different ways.
    translation: Voit lisätä vaihtoehdolle tarkennuksen tai lisäselityksen sen vieressä olevasta kynäkuvakkeesta. Tämä auttaa, jos vaihtoehdon lyhyen nimen voi ymmärtää eri tavoin.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  59e405cf9a028c8d:
    english: Under **More settings**, **Show options in random order** can reduce the effect of always presenting one option first.
    translation: "**Lisää asetuksia** -kohdassa **Näytä vaihtoehdot satunnaisessa järjestyksessä** voi vähentää sitä vaikutusta, että sama vaihtoehto näytetään aina ensimmäisenä."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Äänestä"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7db2d0e58e5fb4e4:
    english: The vote form tells participants how many options they may select. In this example, the voter selects **Cafe collection schedule** and **Washing workflow**, then gives a reason connecting those choices to the trial.
    translation: Äänestyslomake kertoo osallistujille, kuinka monta vaihtoehtoa he voivat valita. Tässä esimerkissä äänestäjä valitsee **Kahviloiden pullojen noutoaikataulun** ja **Pesuprosessin**. Hän perustelee valintansa suhteessa kokeiluun.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e55e4b8950a5fd46:
    english: A reason can reveal why an option matters and what work participants expect it to cover. If reasons are important to the decision, configure the vote-reason setting before starting the poll.
    translation: Perustelu voi kertoa, miksi vaihtoehto on tärkeä ja mitä työtä osallistujat odottavat siihen kuuluvan. Jos perustelut ovat päätöksen kannalta tärkeitä, määritä äänestyksen perusteluja koskeva asetus ennen kyselyn aloittamista.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Lue tulokset"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c1ec47f66384e3bb:
    english: The results show the share of all selections received by each option, the number of voters who selected it, and who has not voted. Because each person could choose two options, the percentages describe selections rather than a percentage of people.
    translation: Tuloksista näet kunkin vaihtoehdon osuuden kaikista valinnoista, sen valinneiden äänestäjien määrän sekä sen, ketkä eivät ole äänestäneet. Koska jokainen sai valita kaksi vaihtoehtoa, prosentit kuvaavat valintojen osuutta eivätkä ihmisten osuutta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6cbc0f9d6fdf6727:
    english: In this example, **Cafe collection schedule** has three selections. **Washing workflow** and **Return-rate reporting** each have two. The result supports giving cafe collections the most agenda time, but the tied topics still require the organizer to decide how the remaining time is divided.
    translation: Tässä esimerkissä **Kahviloiden pullojen noutoaikataulu** on saanut kolme valintaa. **Pesuprosessi** ja **Palautusasteen raportointi** ovat kumpikin saaneet kaksi. Tuloksen perusteella kahviloiden pullojen noudolle kannattaa varata eniten aikaa esityslistalla. Järjestäjän on silti päätettävä, miten jäljelle jäävä aika jaetaan tasatuloksen saaneiden aiheiden kesken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  adb7eb28e16616be:
    english: When the poll closes, publish an **Outcome** explaining what the group will do with the result.
    translation: Kun kysely sulkeutuu, julkaise **Tulokset**, jossa kerrot, mitä ryhmä tekee kyselyn tuloksen perusteella.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
