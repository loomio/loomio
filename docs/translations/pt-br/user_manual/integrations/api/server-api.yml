  d914243a6d80944b:
    english: Users can still edit Loomio-local fields such as `short_bio` and `location`.
    translation: Os usuários ainda podem editar campos locais do Loomio, como `short_bio` e `location`.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d2d40191ec060f7e:
    english: "`LOOMIO_SSO_UPDATE_USER_PROFILE_ON_LOGIN=1` updates `name` and `email` from SSO login data. Leave it commented out or unset when an external sync script should be the only source of those updates."
    translation: "`LOOMIO_SSO_UPDATE_USER_PROFILE_ON_LOGIN=1` atualiza `name` e `email` com os dados de login do SSO. Deixe a linha comentada ou não defina essa variável quando um script de sincronização externa precisar ser a única fonte dessas atualizações."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f19f0588ef52b814:
    english: "`LOOMIO_SSO_FORCE_USER_ATTRS` still works for existing installs. It both disables user edits and updates `name` and `email` on SSO login."
    translation: "`LOOMIO_SSO_FORCE_USER_ATTRS` continua funcionando nas instalações existentes. Essa variável impede que os usuários editem o perfil e atualiza `name` e `email` no login por SSO."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
