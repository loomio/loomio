  62c53ea4911e0c79:
    english: "## Search"
    translation: "## Buscar"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  29cbb6f48ca978fa:
    english: The Search button in the top navigation bar opens global search from any page in Loomio.
    translation: El botón Buscar de la barra de navegación superior abre la búsqueda global desde cualquier página de Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6286c9b6f2b16fc4:
    english: Search includes content you can access across all your groups and direct discussions. It can find discussion titles and context, comments, polls, votes, and outcomes.
    translation: La búsqueda incluye el contenido al que tienes acceso en todos tus grupos y discusiones directas. Puedes encontrar títulos y contexto de discusiones, comentarios, sondeos, votos y conclusiones.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c5a77d75258a11e6:
    english: Enter a word or phrase, then press Enter or select the search icon. For example, searching for **bottle** finds Oatmilk Cooperative content containing that word.
    translation: Escribe una palabra o frase y pulsa Intro o selecciona el icono de búsqueda. Por ejemplo, si buscas **bottle**, encontrarás contenido de Oatmilk Cooperative que contiene esa palabra.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1b93fd8aaf142d37:
    english: "### Search tips"
    translation: "### Consejos de búsqueda"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  99f906ecbde3a538:
    english: "- Start with one or two distinctive words from the title or content you remember.\n- Search matches the beginning of a word, so a partial word such as **bott** can match **bottle**. \n- It will compensate for misspellings when results for the given query are very few.\n- Use the filters to limit results to an organization, subgroup, tag, or content type such as comments or polls.\n- Sort by **Best match** when relevance matters, or by newest or oldest when you know roughly when the content was posted."
    translation: |-
      - Empieza con una o dos palabras distintivas del título o del contenido que recuerdes.
      - La búsqueda reconoce el comienzo de una palabra, así que una palabra parcial como **bott** puede encontrar **bottle**.
      - Si hay muy pocos resultados para tu búsqueda, intentará compensar los errores ortográficos.
      - Usa los filtros para limitar los resultados a una organización, un subgrupo, una etiqueta o un tipo de contenido, como comentarios o sondeos.
      - Ordena por **Mejor partido** si buscas los resultados más relevantes, o por los más recientes o antiguos si sabes aproximadamente cuándo se publicó el contenido.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e7c532f120c4807d:
    english: "## Filter discussions"
    translation: "## Filtrar discusiones"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  91bf7098343a1efa:
    english: Use the controls beside Search to filter discussions by open or closed status or by category tag. Combining a search term with a filter can narrow a long discussion list quickly.
    translation: Usa los controles junto a Buscar para filtrar las discusiones por estado abierto o cerrado, o por etiqueta de categoría. Combina un término de búsqueda con un filtro para acortar rápidamente una lista larga de discusiones.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e3d2099d0e6fe6fa:
    english: "## Category tags"
    translation: "## Etiquetas de categoría"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  932506e53b51fac1:
    english: Tags group related discussions and polls under names chosen by your group, such as a project, team, or area of work.
    translation: Las etiquetas agrupan discusiones y sondeos relacionados bajo nombres que elige tu grupo, como un proyecto, un equipo o un área de trabajo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d761f1c7397d8e51:
    english: Select a tag on the **Discussions** tab to show matching discussions. People with permission to start or edit discussions can apply tags. See [Category tags](/en/user_manual/discussions/tags) for setup and permission details.
    translation: Selecciona una etiqueta en la pestaña **Discusiones** para ver las discusiones correspondientes. Las personas con permiso para iniciar o editar discusiones pueden aplicar etiquetas. Consulta [Etiquetas de categoría](/en/user_manual/discussions/tags) para conocer los detalles de configuración y permisos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b620c9f42e31a54f:
    english: "## Unread discussions"
    translation: "## Discusiones no leídas"
    status: machine
