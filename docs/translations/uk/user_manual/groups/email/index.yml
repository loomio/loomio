---
navigation_title: Адреса електронної пошти
blocks:
  14280ff177b248ab:
    english: "# Send an email to start a thread in your group"
    translation: "# Надішліть електронного листа, щоб розпочати обговорення у вашій групі"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e3de5524e10b9928:
    english: Your Loomio group has an email address! You can send or forward email to this address to start a thread in the group.
    translation: Ваша група Loomio має адресу електронної пошти. Надішліть або перешліть лист на цю адресу, щоб розпочати обговорення в групі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  85a7436d4a1b4396:
    english: |-
      You can see your group's email address on the group page:
      ![location of the email address on the group page](email_email_button.png)
    translation: |-
      Адресу електронної пошти вашої групи можна знайти на сторінці групи:
      ![Розташування адреси електронної пошти на сторінці групи](email_email_button.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e34019bbcf3b319f:
    english: When you send an email to this address, a new thread will be started. The email subject becomes the thread title, the body of the email becomes the description, and any attached files will be attached to the thread.
    translation: Коли ви надсилаєте лист на цю адресу, створюється нове обговорення. Тема листа стає заголовком обговорення, текст листа — описом, а вкладені файли додаються до обговорення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  46a53b8267a61c2f:
    english: The email "From" address is used to find the group member who will be the author of the thread.
    translation: За адресою в полі «Від» Loomio визначає учасника групи, який стане автором обговорення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bd7df6f632af8db1:
    english: "## Preventing unauthorized emails"
    translation: "## Захист від листів сторонніх осіб"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a5118468df167ba0:
    english: To ensure that this feature cannot be used by people who are not members of your group, Loomio will require that the "From" address of an incoming email matches the address of someone in the group.
    translation: Щоб люди поза вашою групою не могли скористатися цією функцією, адреса в полі «Від» вхідного листа має збігатися з адресою одного з учасників групи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f11910ae643c5b47:
    english: If you use multiple email addresses, you can add an alias so Loomio knows about your other email addresses.
    translation: Якщо ви користуєтеся кількома адресами електронної пошти, додайте псевдонім для іншої адреси.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e3d88a25128322b5:
    english: When the "from" address does not match a member of the group, you will receive a notification asking you to add an alias or reject all further emails from that address.
    translation: Якщо адреса в полі «Від» не належить учаснику групи, ви отримаєте сповіщення з пропозицією додати псевдонім або відхиляти всі подальші листи з цієї адреси.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  890546269cfa56b6:
    english: This means that the first time you send email from an unrecognised address, you will need to add an alias. After that, emails will be accepted immediately.
    translation: Коли ви вперше надішлете лист із невідомої адреси, вам потрібно буде додати псевдонім. Після цього листи з цієї адреси прийматимуться одразу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e778a27d6b286135:
    english: "![Location of the approve and reject buttons for an unrecognised email](email_unreleased_emails.png)"
    translation: "![Розташування кнопок схвалення та відхилення листа з невідомої адреси](email_unreleased_emails.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
