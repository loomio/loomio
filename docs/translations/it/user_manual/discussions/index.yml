  '0479bd2337b02443':
    english: "### Boards and Governance"
    translation: "### Consigli direttivi e governance"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5b0a3e2c653d47f8:
    english: "**Prepare for a meeting** - Build an agenda, post board papers and organize administrative matters so everyone is up to date, in context and prepared. "
    translation: "**Preparati per un incontro** - Prepara l'ordine del giorno, condividi i documenti del consiglio e organizza le questioni amministrative, così tutti hanno le informazioni necessarie e possono prepararsi."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5c1c6aa79c3556dc:
    english: "**Pass a resolution** - Post context and background information, respond to questions and raise a proposal to pass a resolution. "
    translation: "**Approvare una risoluzione** - Condividi il contesto e le informazioni di base, rispondi alle domande e presenta una proposta per approvare una risoluzione."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  07ae9c6a1f0a32d0:
    english: "**Discuss an agenda item on Loomio** - Start discussion about an agenda item prior to your meeting. Or, if you run out of time in the meeting, move the discussion on to Loomio."
    translation: "**Discutere un punto all'ordine del giorno su Loomio** - Avvia una discussione su un punto all'ordine del giorno prima dell'incontro. Se durante l'incontro il tempo non basta, prosegui la discussione su Loomio."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f0b0de7094b1cfc9:
    english: "**Approve minutes and track actions** - Post minutes and assign actions. Use a poll to approve minutes. "
    translation: "**Approvare il verbale e seguire le attività** - Pubblica il verbale e assegna le attività. Usa un sondaggio per approvare il verbale."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ba7cf177191baadb:
    english: "### Member participation"
    translation: "### Partecipazione dei membri"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3cf51f837c0a3e9f:
    english: "**Share news (replace mailing list)** - Post information for members, invite comments."
    translation: "**Condividere notizie (al posto di una mailing list)** - Pubblica informazioni per i membri e invitali a commentare."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d2cd391b61042129:
    english: "**Organize an event** - Work with your organizing team on details. Keep all discussion and info within the thread. Then announce the event to wider membership."
    translation: "**Organizzare un evento** - Definisci i dettagli con il gruppo organizzatore. Tieni la discussione e le informazioni nello stesso thread. Poi annuncia l'evento a tutti i membri."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cf59a44a8643cc96:
    english: "**Develop a policy** - Post a policy draft, seek member feedback and input, finalize and ratify the policy."
    translation: "**Elaborare una politica** - Pubblica una bozza, chiedi ai membri commenti e contributi, poi completa e approva la politica."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6ddec467576426ca:
    english: "**General Assembly** - Organize, prepare and run a formal meeting including all members, to deliberate and make decisions on strategic matters."
    translation: "**Assemblea generale** - Organizza, prepara e svolgi un incontro formale con tutti i membri per discutere e prendere decisioni su questioni strategiche."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8d32bb446c4ca025:
    english: "### Self-organizing working teams"
    translation: "### Gruppi di lavoro autorganizzati"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  87ab6b2d51a7c1b6:
    english: "**Share information** - Post information and reports of interest to your team, invite comment and discussion."
    translation: "**Condividere informazioni** - Pubblica informazioni e resoconti utili al tuo gruppo di lavoro e invita le persone a commentare e discuterne."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e93205aa183cd1e0:
    english: "**Progress work** - Outline a work task and seek advice, input and feedback from team members through to completion."
    translation: "**Portare avanti il lavoro** - Descrivi un'attività e chiedi consigli, contributi e commenti ai membri del gruppo di lavoro fino al suo completamento."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1ddaef5d44653691:
    english: "**Meeting notes and actions** - Post meeting notes as a record of discussion, and follow up on tasks. "
    translation: "**Appunti e attività di un incontro** - Pubblica gli appunti per conservare traccia della discussione e segui lo stato delle attività."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8ce9169d72c90788:
    english: "**Explore ideas** - Share thoughts and invite discussion about a concern you notice, or an improvement that can be made."
    translation: "**Esplorare idee** - Condividi le tue idee e invita le persone a discutere di un problema che hai notato o di un possibile miglioramento."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a06e734e86f07828:
    english: "**Advice, Consent and Generative decision making** - Prepare, propose, clarify, respond to reactions and objections, agree and implement - all within a Loomio discussion."
    translation: "**Decisioni basate su consultazione, consenso e generazione di idee** - Prepara una proposta, presentala, chiariscila, rispondi alle reazioni e alle obiezioni, raggiungi un accordo e mettilo in pratica: tutto nella stessa discussione su Loomio."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
