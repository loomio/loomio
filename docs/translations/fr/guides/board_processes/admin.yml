  435f52763f0d9a5b:
    english: To keep a record of a thread discussion and decisions in polls, use **[Print thread](/en/user_manual/groups/data_export#print-thread-to-pdf)** and print the file to pdf.  You can then store a published copy of the thread in your chosen document storage archive.
    translation: Pour conserver une trace d’une discussion et des décisions prises dans les sondages, utilisez **[Imprimer la discussion](/en/user_manual/groups/data_export#print-thread-to-pdf)** et enregistrez le fichier au format PDF. Vous pouvez ensuite conserver une copie publiée de la discussion dans l’espace d’archivage de votre choix.
    status: machine
