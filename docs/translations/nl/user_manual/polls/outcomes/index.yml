    translation: 'Je kunt ook een **Beoordelingsdatum** instellen: een datum waarop je deze peiling of beslissing opnieuw wilt bekijken. Je kunt bijvoorbeeld een strategie volgend jaar rond dezelfde tijd beoordelen.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
