---
navigation_title: Verzamel privé-inzendingen
blocks:
  c4a53a596a037fc0:
    english: "# Collect private submissions"
    translation: "# Verzamel privé-inzendingen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b24abc6bf93b1c0f:
    english: Use a Closed group to collect private submissions from people who are not members of the group. Each submission becomes a separate discussion that the submitter and the group's review team can use to exchange information, ask questions, and record a decision. Submitters cannot see other private discussions or submissions in the group.
    translation: Gebruik een gesloten groep om privé-inzendingen te verzamelen van mensen die geen lid zijn van de groep. Elke inzending wordt een aparte discussie. De inzender en het beoordelingsteam van de groep kunnen daarin informatie uitwisselen, vragen stellen en een besluit vastleggen. Inzenders kunnen andere privéd discussies of inzendingen in de groep niet zien.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  feb5105698bca188:
    english: Nominations are a clear use case when candidate details or the list of nominees must remain private during selection. A person can nominate themselves or someone else for an election, appointment, committee, board, or representative role, while a selection panel reviews each nomination in its own discussion.
    translation: Nominaties zijn een duidelijk voorbeeld wanneer gegevens van kandidaten of de lijst met genomineerden tijdens de selectie privé moeten blijven. Iemand kan zichzelf of een ander nomineren voor een verkiezing, benoeming, commissie, bestuur of vertegenwoordigende functie. Een selectiecommissie beoordeelt elke nominatie in een aparte discussie.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a64597508a4f7f3d:
    english: 'Other suitable purposes where submissions should not be public include:'
    translation: 'Andere situaties waarin inzendingen privé moeten blijven, zijn:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e4bd382899a8e7d9:
    english: |-
      - Complaints, safeguarding reports, safety concerns, and incident reports
      - Appeals and requests to reconsider a decision about an individual case
      - Requests for mediation, conflict resolution, or personal support
      - Applications containing personal, financial, or eligibility information, such as hardship grants or scholarships
      - Sealed bids or tender responses that must remain private during assessment
    translation: |-
      - Klachten, meldingen over de bescherming van kwetsbare personen, zorgen over veiligheid en incidentmeldingen
      - Bezwaren en verzoeken om een besluit over een individuele zaak te heroverwegen
      - Verzoeken om bemiddeling, conflictoplossing of persoonlijke ondersteuning
      - Aanvragen met persoonlijke of financiële gegevens of informatie over toelatingsvoorwaarden, zoals aanvragen voor noodhulp of studiebeurzen
      - Gesloten biedingen of reacties op aanbestedingen die tijdens de beoordeling privé moeten blijven
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bab86da011a22a2a:
    english: This workflow is private between submitters, but it is not anonymous. Submitters need a user account, and every member of the Closed group can see the submissions. Consider who belongs to the review group before using it for sensitive information.
    translation: Inzenders kunnen elkaars inzendingen niet zien, maar dit proces is niet anoniem. Inzenders hebben een gebruikersaccount nodig en elk lid van de gesloten groep kan de inzendingen zien. Bedenk wie lid is van de beoordelingsgroep voordat je deze gebruikt voor gevoelige informatie.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b82ae8f3f04d257f:
    english: "## Enable private submissions"
    translation: "## Privé-inzendingen inschakelen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0cebe3c5801844ce:
    english: You must be an admin of the group or subgroup where you want to collect submissions.
    translation: Je moet beheerder zijn van de groep of subgroep waarin je inzendingen wilt verzamelen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  831d833d53a12ece:
    english: |-
      1. Open the group.
      2. Select **Settings** (or **More** and then **Edit group settings**).
      3. Open **Permissions**.
      4. Enable **Non-members can start discussions**.
      5. Save the group settings.
    translation: |-
      1. Open de groep.
      2. Selecteer **Instellingen** (of **Meer** en daarna **Bewerk groepsinstellingen**).
      3. Open **Toestemmingen**.
      4. Schakel **Niet-leden kunnen discussies starten** in.
      5. Sla de groepsinstellingen op.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f3962a27b1c4ffa8:
    english: "![The Permissions tab in group settings, with Non-members can start discussions highlighted](non_members_can_start_discussions.png)"
    translation: "![Het tabblad Toestemmingen in de groepsinstellingen, met Niet-leden kunnen discussies starten gemarkeerd](non_members_can_start_discussions.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  99ace15d10e78f33:
    english: This option is available only for **Open** and **Closed** groups. It is hidden for **Secret** groups. If you cannot see it, open **Privacy** in the group settings and change **Group privacy** to **Closed** (recommended for private submissions) or **Open**, then return to **Permissions**.
    translation: Deze optie is alleen beschikbaar voor **Open** en **Gesloten** groepen. Ze is verborgen voor **Geheim** groepen. Zie je de optie niet, open dan **Privacy** in de groepsinstellingen en verander **Groepsprivacy** in **Gesloten** (aanbevolen voor privé-inzendingen) of **Open**. Ga daarna terug naar **Toestemmingen**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  449517e6293a3acc:
    english: Enabling this permission does not make the group's discussions public. A non-member can start a new discussion and access that discussion as a guest, but cannot see the group's other private discussions.
    translation: Door deze toestemming in te schakelen worden de discussies van de groep niet openbaar. Een niet-lid kan een nieuwe discussie starten en die als gast openen, maar kan de andere privéd discussies van de groep niet zien.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  151f68a3f638fb67:
    english: "## Set up a private submission process"
    translation: "## Een proces voor privé-inzendingen opzetten"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ae924433d81f5eac:
    english: |-
      1. Create a dedicated subgroup for the submission process and set its privacy to **Closed**. A subgroup keeps the submissions separate from the parent group's other work.
      2. Add the selection panel or other people responsible for reviewing submissions as members of the subgroup. Every subgroup member can see every submission, so add only people who should have that access.
      3. Create a [discussion template](/en/user_manual/discussions/templates) in the subgroup. Include the questions and information submitters should provide. You can create different discussion templates for different kinds of submissions.
      4. If submitters should not request subgroup membership, set membership to **Invitation only**.
      5. [Enable private submissions](#enable-private-submissions) in the subgroup's permissions.
      6. Test the process with an account that is not a member of the subgroup.
      7. Share the subgroup page with prospective submitters. They must sign in to their user account before making a submission.
    translation: |-
      1. Maak een aparte subgroep voor de inzendingen en stel de privacy in op **Gesloten**. Zo blijven de inzendingen gescheiden van het andere werk van de hoofdgroep.
      2. Voeg de selectiecommissie of andere beoordelaars toe als leden van de subgroep. Elk lid van de subgroep kan alle inzendingen zien. Voeg daarom alleen mensen toe die deze toegang nodig hebben.
      3. Maak een [discussiesjabloon](/en/user_manual/discussions/templates) in de subgroep. Neem daarin de vragen en informatie op die inzenders moeten aanleveren. Je kunt voor verschillende soorten inzendingen verschillende discussiesjablonen maken.
      4. Als inzenders geen lidmaatschap van de subgroep mogen aanvragen, stel het lidmaatschap dan in op **Alleen op uitnodiging**.
      5. [Schakel privé-inzendingen in](#enable-private-submissions) bij de toestemmingen van de subgroep.
      6. Test het proces met een account dat geen lid is van de subgroep.
      7. Deel de pagina van de subgroep met mogelijke inzenders. Zij moeten inloggen op hun gebruikersaccount voordat ze iets kunnen inzenden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3acec1b4a6724a65:
    english: "## Make a submission"
    translation: "## Een inzending doen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  58f96f48b6aacf65:
    english: The submitter opens the subgroup and selects **Start discussion**. Loomio shows the subgroup's available discussion templates. The submitter selects the relevant discussion template, completes its questions, and starts the discussion.
    translation: De inzender opent de subgroep en selecteert **Start discussie**. Loomio toont de beschikbare discussiesjablonen van de subgroep. De inzender kiest het juiste sjabloon, beantwoordt de vragen en start de discussie.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5a65043771edeb44:
    english: The discussion belongs to the subgroup, but the submitter does not become a subgroup member. Loomio adds them as a guest of their discussion thread, enabling them to see and participate in the discussion with the panel or review team. They cannot see other private discussions or submissions in the subgroup.
    translation: De discussie hoort bij de subgroep, maar de inzender wordt geen lid van de subgroep. Loomio voegt de inzender als gast toe aan de discussiethread. Zo kan die de discussie zien en deelnemen aan het gesprek met de commissie of het beoordelingsteam. Andere privéd discussies of inzendingen in de subgroep blijven verborgen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9338fd073b26dafc:
    english: "## Review submissions"
    translation: "## Inzendingen beoordelen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  50e33fa0f0868cf5:
    english: Subgroup members can see every submission discussion in the subgroup. They can ask follow-up questions and use comments, polls, or other discussion tools to complete their review.
    translation: Leden van de subgroep kunnen elke discussie over een inzending zien. Ze kunnen aanvullende vragen stellen en reacties, peilingen of andere hulpmiddelen in de discussie gebruiken om hun beoordeling af te ronden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  537b76c6f85cc575:
    english: If another person needs to provide information, a subgroup member with permission can invite them to the submission discussion. For example, when a nominator submits a nomination, the subgroup can invite the nominee to the thread if their participation is required. The invited person joins as a guest without gaining access to the subgroup's other private discussions.
    translation: Als iemand anders informatie moet aanleveren, kan een lid van de subgroep met de juiste toestemming die persoon uitnodigen voor de discussie over de inzending. Als iemand bijvoorbeeld een ander nomineert, kan de subgroep de genomineerde uitnodigen voor de thread wanneer deelname nodig is. De uitgenodigde persoon neemt als gast deel en krijgt geen toegang tot de andere privéd discussies van de subgroep.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1fb7da309186b19e:
    english: Each submitter can see their own submission but cannot see the subgroup's other private discussions or submissions. Disable **Non-members can start discussions** when submissions close. Existing discussions and guest access are unchanged.
    translation: Elke inzender kan de eigen inzending zien, maar niet de andere privéd discussies of inzendingen in de subgroep. Schakel **Niet-leden kunnen discussies starten** uit wanneer de inzendperiode sluit. Bestaande discussies en toegang voor gasten blijven ongewijzigd.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
