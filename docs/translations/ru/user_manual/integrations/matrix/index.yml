  90c643b33736cf22:
    english: "# Matrix integration"
    translation: "# Интеграция с Matrix"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f3106c22cd3d4059:
    english: 'Loomio can send notifications into your Matrix channels when new discussions, proposals, comments, votes, and outcomes occur. '
    translation: Loomio может отправлять уведомления в ваши каналы Matrix о новых обсуждениях, предложениях, комментариях, голосах и итогах.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a20cf2be00dac0ce:
    english: Matrix is nice because it allows some HTML in the chatroom, and Loomio takes advantage of this.
    translation: Matrix поддерживает некоторые HTML-теги в чате, и Loomio использует эту возможность.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ffe12502f0030fec:
    english: Our Matrix integration is a little different to our other chat integrations - it does not use a webhook - we've built a custom bot client for this one.
    translation: 'Интеграция с Matrix устроена иначе, чем другие интеграции Loomio с чатами: вместо вебхука она использует специально созданного бота.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  44db147f65127a55:
    english: You will need to create a matrix user for the bot to login as.
    translation: Создайте пользователя Matrix, от имени которого бот будет входить в систему.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  98045e5bf1339543:
    english: Once you've created a user for the bot, sign in at that user to obtain the following information.
    translation: После этого войдите в учётную запись бота, чтобы получить данные, указанные ниже.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
