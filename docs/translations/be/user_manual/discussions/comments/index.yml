---
navigation_title: Каментарыі
blocks:
  e6981c530fad6f45:
    english: "# Comments"
    translation: "# Каментарыі"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cb82daa3594be60c:
    english: Comments are the main way people participate in a discussion. They are visible to anyone who has permission to see the thread.
    translation: Каментарыі — асноўны спосаб удзелу ў абмеркаванні. Іх бачаць усе, хто мае доступ да ніткі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  96ffa85117001d18:
    english: "## Reading comments"
    translation: "## Чытанне каментарыяў"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2d82b2da2ee96a1f:
    english: When you open a discussion, Loomio takes you to activity that is new to you.
    translation: Калі вы адкрываеце абмеркаванне, Loomio паказвае вам новыя для вас падзеі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c4a1b0be655249a9:
    english: Unread comments have a blue **new** label beside their posting time.
    translation: Побач з часам публікацыі непрачытаных каментарыяў ёсць сіняя пазнака **новы**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  82bce54322fa6023:
    english: "## Writing a comment"
    translation: "## Напісанне каментарыя"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7b14a17025b52e3d:
    english: Write a comment to contribute to the discussion. Other people can reply, react, or post their own comments.
    translation: Напішыце каментар, каб далучыцца да абмеркавання. Іншыя людзі могуць адказаць на яго, пакінуць рэакцыю або напісаць свае каментарыі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6e0c07cfcb8f1166:
    english: Select **Post Comment** to publish it. Your comment will be visible to anyone who has permission to see the discussion.
    translation: Выберыце **Дадаць каментар**, каб апублікаваць яго. Ваш каментар убачаць усе, хто мае доступ да абмеркавання.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  edfadd8f1dcac9c4:
    english: The tools described in [Formatting](/en/user_manual/discussions/formatting/) are available when writing comments.
    translation: Пры напісанні каментарыяў можна карыстацца інструментамі, апісанымі ў раздзеле [Фарматаванне](/en/user_manual/discussions/formatting/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b4dce878f57863ff:
    english: "## Mentioning people"
    translation: "## Згадванне людзей"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  70543178fe9e7b4b:
    english: Type **@**, start typing a person's name, then select them from the list. A mention notifies that person immediately and is a useful way to ask for their attention or response.
    translation: Увядзіце **@**, пачніце ўводзіць імя чалавека і выберыце патрэбнае імя са спіса. Згаданы чалавек адразу атрымае апавяшчэнне. Так можна звярнуць увагу на каментар або папрасіць адказаць.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b1d5a5e3d5bb86e3:
    english: "![Mentioning Samira Patel in a comment](../notifying_people/comment_mention.png)"
    translation: "![Згадванне Саміры Патэль у каментарыі](../notifying_people/comment_mention.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  07aa88bffb5b1700:
    english: To notify everyone in the group, type **@**, start typing the group name, then select it from the list.
    translation: Каб апавясціць усіх у групе, увядзіце **@**, пачніце ўводзіць назву групы і выберыце яе са спіса.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  794c26be4050ac1b:
    english: "![Searching for Oatmilk Cooperative while writing a group mention](../notifying_people/mentioning_group_1.png)"
    translation: "![Пошук Oatmilk Cooperative пры згадванні групы](../notifying_people/mentioning_group_1.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  111625a57c02bc5c:
    english: "![Oatmilk Cooperative selected as a group mention](../notifying_people/mentioning_group_2.png)"
    translation: "![Oatmilk Cooperative выбрана для згадвання групы](../notifying_people/mentioning_group_2.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b4fb3c8390c32e31:
    english: Mentioning someone does not give them access to the thread. Use **Invite people** in the thread sidebar if they are not already a thread member.
    translation: Згадванне чалавека не дае яму доступу да ніткі. Калі гэты чалавек яшчэ не ўдзельнічае ў нітцы, скарыстайцеся кнопкай **Запрасіць людзей** на бакавой панэлі ніткі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6bba3d93a1845f91:
    english: "## Replying to a comment"
    translation: "## Адказ на каментар"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e7776c198f2f2f48:
    english: Select **Reply** below a comment to respond to it. The reply is prefilled with an @mention of the comment author, which notifies them when you post it. Remove the mention if you do not want to notify them.
    translation: Выберыце **Адказаць** пад каментарыем. У адказ аўтаматычна дадаецца згадванне аўтара праз @, каб ён атрымаў апавяшчэнне пасля публікацыі. Выдаліце згадванне, калі апавяшчэнне не патрэбнае.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  eb45d23f7f968858:
    english: You can also reply to your own comment to nest a response beneath it.
    translation: Вы таксама можаце адказаць на ўласны каментар, каб размясціць адказ пад ім.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ab1caf06d54d3bcb:
    english: If a Loomio email says you can reply by email, your emailed reply will appear in the thread.
    translation: Калі ў лісце ад Loomio пазначана, што на яго можна адказаць, ваш адказ па электроннай пошце з’явіцца ў нітцы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  72d9282ce2bc763a:
    english: "## Reactions"
    translation: "## Рэакцыі"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1875a303c30b5343:
    english: Use the smiley button to respond with an emoji. Reactions notify the comment author within Loomio but do not send an email.
    translation: Націсніце кнопку са смайлікам, каб адказаць эмодзі. Рэакцыі апавяшчаюць аўтара каментарыя ў Loomio, але электронны ліст не адпраўляецца.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ce997bcd34b2eae0:
    english: "## Translating comments"
    translation: "## Пераклад каментарыяў"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b50a435640652d31:
    english: If the author uses a language other than yours, a **Translate** action appears below the comment.
    translation: Калі каментар напісаны на іншай мове, пад ім з’яўляецца дзеянне **Перакласці**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9077e2c891750fe8:
    english: Select **Translate comment** to see the comment in your language.
    translation: Выберыце **Перакласці каментар**, каб прачытаць яго на сваёй мове.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  60a885598057c1bf:
    english: "## Comment actions"
    translation: "## Дзеянні з каментарыямі"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9689ea71da9051d8:
    english: Common actions appear directly below a comment. Additional actions are available from the three-dot menu (**⋯**).
    translation: Асноўныя дзеянні паказаны пад каментарыем. Дадатковыя дзеянні знаходзяцца ў меню з трыма кропкамі (**⋯**).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  88263de7d2158dae:
    english: "### Add a comment to Jump to"
    translation: "### Даданне каментарыя ў спіс «Перайсці да»"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dd60de0295088aa5:
    english: Use **Pin to timeline** to add a comment to the thread's **Jump to** list.
    translation: Выкарыстайце **Замацаваць на храналогіі**, каб дадаць каментар у спіс **Перайсці да** гэтай ніткі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  90252c4d66b752d4:
    english: You can edit the label shown in **Jump to**. Unpin and then pin the comment again to change the link text.
    translation: Вы можаце змяніць назву спасылкі ў спісе **Перайсці да**. Для гэтага адмацуйце каментар, а потым замацуйце яго зноў.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  28c2ffaa171b6b1b:
    english: |-
      >[!Tip]
      >Highlight the words you want to use as the link text before selecting **Pin to timeline**.
    translation: |-
      >[!Tip]
      >Перад тым як выбраць **Замацаваць на храналогіі**, вылучыце словы, якія хочаце выкарыстаць як тэкст спасылкі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7545e856758edb22:
    english: Select **Unpin** to remove the item from **Jump to**.
    translation: Выберыце **Адмацаваць**, каб выдаліць элемент са спіса **Перайсці да**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c3b33d31cbce93c3:
    english: "### Edit a comment and view changes"
    translation: "### Рэдагаванне каментарыя і прагляд змен"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  abaeaac4c1f2c966:
    english: Select **Edit** below one of your comments to change it. Group admins can also edit member comments when the relevant group permission is enabled.
    translation: Каб змяніць свой каментар, выберыце пад ім **Рэдагаваць**. Адміністратары групы таксама могуць рэдагаваць каментарыі ўдзельнікаў, калі ўключаны адпаведны дазвол групы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  69647eee1f3fcfb7:
    english: An **Edited** action appears below an edited comment.
    translation: Пад адрэдагаваным каментарыем з’яўляецца дзеянне **Рэдагавана**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fcaa0d6329f5c5d4:
    english: Select **Edited** to see what changed. Red highlighting shows removed text and green highlighting shows added text. Loomio records who made each edit and when it was made.
    translation: Выберыце **Рэдагавана**, каб паглядзець змены. Выдалены тэкст вылучаны чырвоным, а дададзены — зялёным. Loomio захоўвае звесткі пра тое, хто і калі ўнёс кожную змену.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  042b22530d14a486:
    english: 'You can edit a comment when:'
    translation: 'Вы можаце рэдагаваць каментар, калі:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  afe0ed6535a96b15:
    english: |-
      - you wrote it and the group allows members to edit their comments
      - you are a group admin and [Admins can edit members' comments](/en/user_manual/groups/settings/permissions) is enabled
    translation: |-
      - вы напісалі яго, а група дазваляе ўдзельнікам рэдагаваць свае каментарыі
      - вы адміністратар групы і ўключаны дазвол [Адміністратары могуць рэдагаваць каментарыі ўдзельнікаў](/en/user_manual/groups/settings/permissions)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6962d0caeeea20e8:
    english: "### Copy a comment link"
    translation: "### Капіраванне спасылкі на каментар"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0fb9e2ebde71573e:
    english: Select **Copy link** to copy the comment's unique URL. You can paste the link elsewhere to refer directly to that comment.
    translation: Выберыце **Скапіяваць спасылку**, каб скапіяваць унікальны URL каментарыя. Гэтую спасылку можна ўставіць у іншым месцы, каб накіраваць людзей непасрэдна да каментарыя.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  04e4537024da788c:
    english: "### View notification history"
    translation: "### Прагляд гісторыі апавяшчэнняў"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  957677befce0ab3f:
    english: Open the three-dot menu (**⋯**) beside a comment and select **Notification history**.
    translation: Адкрыйце меню з трыма кропкамі (**⋯**) побач з каментарыем і выберыце **Гісторыя апавяшчэнняў**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fa9d0f2448239944:
    english: "![Notification history in a comment's actions menu](../notifying_people/comment_notification_history.png)"
    translation: "![Гісторыя апавяшчэнняў у меню дзеянняў з каментарыем](../notifying_people/comment_notification_history.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  30a58d4ef7d80c15:
    english: The notification history shows who was notified about the comment, when the notification was sent, and whether it has been read when that information is available.
    translation: Гісторыя апавяшчэнняў паказвае, хто атрымаў апавяшчэнне пра каментар, калі яно было адпраўлена і ці было прачытана, калі гэтыя звесткі даступныя.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4f6ead46c3f9759e:
    english: "![Notification history for a comment mentioning Samira Patel](../notifying_people/comment_notification_example.png)"
    translation: "![Гісторыя апавяшчэнняў пра каментар са згадкай Саміры Патэл](../notifying_people/comment_notification_example.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fa2204fb0745dec4:
    english: "### Discard, restore, or delete a comment"
    translation: "### Адкінуць, аднавіць або выдаліць каментар"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  592dfa766814bb8e:
    english: Discarding a comment removes it from the thread but retains it in a trash bin. You can discard your own comments with **Discard** in the three-dot menu. Group admins can also discard comments.
    translation: Адкінуты каментар знікае з тэмы, але захоўваецца ў кошыку. Каб адкінуць свой каментар, выберыце **Адкінуць** у меню з трыма кропкамі. Адміністратары групы таксама могуць адкідаць каментарыі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  670a46d5274f9ab5:
    english: "**Restore a comment**"
    translation: "**Аднавіць каментар**"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9b202a60d5665ac6:
    english: The location of a discarded comment is labelled **Item removed**. Open its three-dot menu and select **Restore**.
    translation: На месцы адкінутага каментарыя з’яўляецца надпіс **Элемент выдалены**. Адкрыйце меню з трыма кропкамі побач з ім і выберыце **Аднавіць**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d6427576dab2b2c5:
    english: "**Delete a comment**"
    translation: "**Выдаліць каментар**"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d8b9add122e73295:
    english: Deleting a comment removes it permanently. It cannot be restored.
    translation: Пасля выдалення каментар знікае назаўсёды. Аднавіць яго нельга.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  51f7dce6a0188a51:
    english: If **Members can delete their own comments** is enabled in [Group permissions](/en/user_manual/groups/settings/permissions), members can permanently delete their own discarded comments. Group admins can delete any comment.
    translation: Калі ў [дазволах групы](/en/user_manual/groups/settings/permissions) уключана налада **Удзельнікі могуць выдаляць свае ўласныя каментарыі**, удзельнікі могуць назаўсёды выдаляць свае адкінутыя каментарыі. Адміністратары групы могуць выдаліць любы каментар.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  63134f860609d669:
    english: Open the three-dot menu on an **Item removed** entry and select **Delete**.
    translation: Адкрыйце меню з трыма кропкамі побач з запісам **Элемент выдалены** і выберыце **Выдаліць**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  19580f91a59bf5ef:
    english: A confirmation message explains that the comment will be permanently deleted.
    translation: Паведамленне з просьбай пацвердзіць дзеянне тлумачыць, што каментар будзе выдалены назаўсёды.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
