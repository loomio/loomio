---
navigation_title: Emberek meghívása
blocks:
  47820acef0cf3fe9:
    english: "# Inviting people"
    translation: "# Emberek meghívása"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6a2bc749ec2883c0:
    english: Go to your group page and click the **Members** tab to access member management.
    translation: A tagok kezeléséhez nyisd meg a csoportod oldalát, és kattints a **Tagok** fülre.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7fc9a792512e50bb:
    english: You can **Invite** particular people to your group with their email address or **Share** a link to your group via email, newsletter, chat or from your website.
    translation: E-mail-címük megadásával **Meghív**hatsz embereket a csoportodba, vagy a **Megoszt** gombbal megoszthatod a csoport linkjét e-mailben, hírlevélben, csevegésben vagy a weboldaladon.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3fc7875402babd63:
    english: "## Send invitations via email"
    translation: "## Meghívók küldése e-mailben"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4e91c3f036e94808:
    english: Click **Invite** on the **Members** tab to send an email containing a single-use invitation link. The recipient can create a Loomio user account and join your group.
    translation: A **Tagok** fülön kattints a **Meghív** gombra. A címzett e-mailt kap egy egyszer használható meghívólinkkel. Létrehozhat egy Loomio-fiókot, és csatlakozhat a csoportodhoz.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  37a98960a11df300:
    english: If the recipient already has a Loomio user account they can still accept the invitation to join your group with their existing account.
    translation: Ha a címzettnek már van Loomio-fiókja, a meglévő fiókjával is elfogadhatja a meghívást, és csatlakozhat a csoportodhoz.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c40b8865bc90ab0b:
    english: "### Invite many at once"
    translation: "### Több ember meghívása egyszerre"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f92bf789ad23e4c3:
    english: You can send invitations by email to up to 100 people at a time by entering (or copy/pasting) multiple email addresses into the "Who would you like to invite" box. Separate email addresses by comma or space.
    translation: Egyszerre legfeljebb 100 embernek küldhetsz meghívót e-mailben. Írj vagy illessz be több e-mail-címet a „Kit szeretnél meghívni?” mezőbe. A címeket vesszővel vagy szóközzel válaszd el.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1e8ea8567d051081:
    english: When inviting people to a group within an organization, the parent group and related subgroups you belong to appear as audience suggestions. Select a group, then select its chip to expand the audience into individual people. You can remove anyone you do not want to invite before sending the invitations. People who already belong to the destination group are excluded.
    translation: Ha egy szervezeten belüli csoportba hívsz meg embereket, a szülőcsoport és azok a kapcsolódó alcsoportok, amelyeknek tagja vagy, címzettjavaslatként jelennek meg. Válassz ki egy csoportot, majd kattints a címkéjére, hogy megjelenjenek a tagjai. A meghívók elküldése előtt eltávolíthatod azokat, akiket nem szeretnél meghívni. A célcsoport meglévő tagjai nem kerülnek a címzettek közé.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  23c96c665ed9ad1c:
    english: |-
      >[!Tip]
      >Copy email addresses from a column in a Google or Excel spreadsheet, and paste into the invitation box.
    translation: |-
      >[!Tip]
      >Másold ki az e-mail-címeket egy Google- vagy Excel-táblázat oszlopából, és illeszd be őket a meghívási mezőbe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  697177b4211a5479:
    english: When you click **Invite** an email will be sent to each of the email addresses you supplied, containing a unique invitation link that can only be used once. This email will be sent in your current language.
    translation: Amikor a **Meghív** gombra kattintasz, minden megadott e-mail-címre külön üzenet érkezik. Mindegyikben egy egyedi, egyszer használható meghívólink található. Az e-mailt a jelenleg beállított nyelveden küldi el a Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bcce66d3fb6f6b8e:
    english: "### Invite people to Subgroups"
    translation: "### Emberek meghívása alcsoportokba"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e422dfc71ef2fe0:
    english: Following the same process as above, you can invite people to a 'parent' group, and one or more subgroups simultaneously when you invite them with the **Invite people** button. Tick the boxes next to the subgroups you want them to immediately be a part of when they join the group.
    translation: A fenti módon a **Hívj meg embereket** gombbal egyszerre hívhatsz meg embereket egy szülőcsoportba és egy vagy több alcsoportba. Jelöld be azoknak az alcsoportoknak a jelölőnégyzetét, amelyekhez a csoportba lépésükkor azonnal csatlakozzanak.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  87f0b0c3281b6228:
    english: "## Share a link to your group"
    translation: "## A csoport linkjének megosztása"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2f014bdf9b719ec0:
    english: You can share a link to your group with the **Share** button. This is useful if you want to send a link via email, newsletter, chat or post on your website.
    translation: A **Megoszt** gombbal megoszthatod a csoportod linkjét. Elküldheted e-mailben, hírlevélben vagy csevegésben, illetve közzéteheted a weboldaladon.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  18ff20426c02846e:
    english: Click on the "copy" icon to copy the link to your clipboard, then paste in your email, newsletter or chat channel.
    translation: Kattints a „másolás” ikonra a link vágólapra másolásához, majd illeszd be az e-mailbe, a hírlevélbe vagy a csevegésbe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c6506b3c529f683c:
    english: If you want to stop people from joining via this link, click "Reset this link". The existing link will no longer work and a new link will be created.
    translation: Ha nem szeretnéd, hogy ezen a linken keresztül csatlakozzanak az emberek, kattints a „Link visszaállítása” lehetőségre. A régi link megszűnik működni, és új link jön létre.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6d57daddf1df6a2d:
    english: "## Request to join group"
    translation: "## Csatlakozási kérelem küldése"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  70b9af34b3bc2a9e:
    english: People can request to join an Open or Closed group. Share the group URL, such as `https://www.loomio.com/group-name`. When people arrive at the group page, they can see the public group information and select **Join group** to answer the joining prompt and send their request.
    translation: 'Az emberek nyitott vagy zárt csoporthoz kérhetnek csatlakozást. Oszd meg a csoport URL-jét, például ezt: `https://www.loomio.com/group-name`. A csoport oldalán láthatják a nyilvános csoportadatokat. A **Kapcsolódj a csoporthoz** gombra kattintva válaszolhatnak a csatlakozási kérdésre, és elküldhetik a kérelmüket.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a5534ae2aba161ba:
    english: The joining prompt gives people a chance to introduce themselves and explain why they want to join.
    translation: A csatlakozási kérdésnél az emberek bemutatkozhatnak, és leírhatják, miért szeretnének csatlakozni.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bb13bbdbfd6da80b:
    english: Under [Group privacy](/en/user_manual/groups/settings/privacy#how-people-join), choose **Request approval** to require requests to be reviewed. You can also customize the joining prompt in the group settings.
    translation: A [Csoport adatvédelmi beállításai](/en/user_manual/groups/settings/privacy#how-people-join) alatt válaszd a **Jóváhagyás kérése** lehetőséget, ha szeretnéd, hogy a csatlakozási kérelmeket elbírálják. A csatlakozási kérdést is testre szabhatod a csoport beállításaiban.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5b0e7c47a0518a3e:
    english: "### Review membership requests"
    translation: "### Csatlakozási kérelmek elbírálása"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d4a03352457d41cb:
    english: 'Group administrators and members with permission to add members review requests from the **Membership requests** section of the **Members** tab. A reviewer can:'
    translation: 'A csoport adminisztrátorai és a tagok felvételére jogosult tagok a **Tagok** fül **Csatlakozási kérelmek** részében bírálhatják el a kérelmeket. Az elbíráló a következőket teheti:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  84c6d641f9dba801:
    english: |-
      - **Approve** the request to add the applicant as a member and notify them.
      - **Ignore** the request to close it without notifying the applicant or allowing another request.
      - **Decline** the request with a message explaining the decision. Loomio sends the message to the applicant by email and notification, and they can submit a new request.
    translation: |-
      - **Érvényesítés**: felveszi a kérelmezőt a tagok közé, és értesíti őt.
      - **Figyelmen kívül hagyás**: lezárja a kérelmet a kérelmező értesítése nélkül, és nem engedélyez új kérelmet.
      - **Visszautasítás**: üzenetben indokolja a döntést. A Loomio e-mailben és értesítésben küldi el az üzenetet a kérelmezőnek, aki később új kérelmet nyújthat be.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b1de5132fa942ba8:
    english: Select the decline button to write a message or ignore the request.
    translation: Üzenet írásához válaszd a visszautasítás gombot, vagy hagyd figyelmen kívül a kérelmet.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a87e3fdd4ce43ee9:
    english: "## Managing invitations"
    translation: "## Meghívások kezelése"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  84dc2f66c60f3237:
    english: To manage invitations, open the filter/ drop down from the Members tab of your Group page and select **Invitations**. You can manage individual invitations by clicking the three dot menu (**⋮**) to the right of the member.
    translation: A meghívások kezeléséhez nyisd meg a csoportod oldalán a Tagok fül szűrőmenüjét, és válaszd a **Meghívások** lehetőséget. Az egyes meghívásokat a tag neve mellett jobbra található hárompontos menüben (**⋮**) kezelheted.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c8d12991b8edb22f:
    english: You can also make people administrators or set their title (e.g. "IT Support") within the group before they accept their invitation.
    translation: Mielőtt elfogadják a meghívást, adminisztrátorrá teheted az embereket, vagy megadhatod a csoporton belüli megnevezésüket, például „IT-támogatás”.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e8aec784f84451cc:
    english: "### Re-send invitations"
    translation: "### Meghívások újraküldése"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c201c2b360b1877:
    english: Follow up on people who don't make it into the group and give them a nudge. If someone has lost or forgotten about their invitation email, you can re-send it from the dropdown menu beside their name on the Members page.
    translation: Ha valaki még nem csatlakozott a csoporthoz, emlékeztetheted a meghívásra. Ha elvesztette vagy elfelejtette a meghívó e-mailt, a Tagok oldalon a neve melletti legördülő menüből újraküldheted.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8b4674400f9a3f09:
    english: Click on the three dots (**⋮**) next to the person you want to resend the invitation to, and then choose **Resend invitation**.
    translation: Kattints a három pontra (**⋮**) annak az embernek a neve mellett, akinek újra szeretnéd küldeni a meghívást, majd válaszd a **Meghívás újraküldése** lehetőséget.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  abc5a934440fb8e1:
    english: |-
      ### Cancelling invitations
      If you entered the wrong email address, or have changed your mind about inviting someone, you can cancel an invitation from the Members tab on your Group page. Select **Cancel Invitation** from the drop down menu to the right of the member invitation (**⋮**).
    translation: |-
      ### Meghívások visszavonása
      Ha rossz e-mail-címet adtál meg, vagy mégsem szeretnél meghívni valakit, a csoportod oldalán, a Tagok fülön visszavonhatod a meghívást. Válaszd a meghívás jobb oldalán található legördülő menüből (**⋮**) a **Meghívás visszavonása** lehetőséget.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
