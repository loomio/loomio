  14280ff177b248ab:
    english: "# Send an email to start a thread in your group"
    translation: "# Start een thread in je groep via e-mail"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e3de5524e10b9928:
    english: Your Loomio group has an email address! You can send or forward email to this address to start a thread in the group.
    translation: Je Loomio-groep heeft een e-mailadres. Stuur of stuur een e-mail door naar dit adres om een thread in de groep te starten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  85a7436d4a1b4396:
    english: |-
      You can see your group's email address on the group page:
      ![location of the email address on the group page](email_email_button.png)
    translation: |-
      Je vindt het e-mailadres van je groep op de groepspagina:
      ![Locatie van het e-mailadres op de groepspagina](email_email_button.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e34019bbcf3b319f:
    english: When you send an email to this address, a new thread will be started. The email subject becomes the thread title, the body of the email becomes the description, and any attached files will be attached to the thread.
    translation: Als je een e-mail naar dit adres stuurt, wordt een nieuwe thread gestart. Het onderwerp van de e-mail wordt de titel van de thread, de inhoud wordt de beschrijving en eventuele bijlagen worden aan de thread toegevoegd.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  46a53b8267a61c2f:
    english: The email "From" address is used to find the group member who will be the author of the thread.
    translation: Loomio gebruikt het adres in het veld "Van" om te bepalen welk groepslid de auteur van de thread wordt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bd7df6f632af8db1:
    english: "## Preventing unauthorized emails"
    translation: "## E-mails van onbevoegden voorkomen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a5118468df167ba0:
    english: To ensure that this feature cannot be used by people who are not members of your group, Loomio will require that the "From" address of an incoming email matches the address of someone in the group.
    translation: Alleen leden van je groep kunnen op deze manier een thread starten. Daarom moet het adres in het veld "Van" van een inkomende e-mail overeenkomen met het e-mailadres van een groepslid.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f11910ae643c5b47:
    english: If you use multiple email addresses, you can add an alias so Loomio knows about your other email addresses.
    translation: Gebruik je meerdere e-mailadressen? Voeg dan een alias toe, zodat Loomio je andere adressen herkent.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e3d88a25128322b5:
    english: When the "from" address does not match a member of the group, you will receive a notification asking you to add an alias or reject all further emails from that address.
    translation: Als het adres in het veld "Van" niet overeenkomt met dat van een groepslid, krijg je een melding. Daarin kun je een alias toevoegen of alle volgende e-mails van dat adres afwijzen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  890546269cfa56b6:
    english: This means that the first time you send email from an unrecognised address, you will need to add an alias. After that, emails will be accepted immediately.
    translation: De eerste keer dat je vanaf een onbekend adres mailt, moet je dus een alias toevoegen. Daarna worden e-mails vanaf dat adres direct geaccepteerd.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
