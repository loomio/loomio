  a1b7f7b282933a3c:
    english: 'You must be an admin of the group to export it. The JSON export includes:'
    translation: 'Чтобы экспортировать группу, вы должны быть её администратором. В экспорт JSON входят:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6a0b307d50fa35cf:
    english: |-
      - The group, its members and membership requests
      - Threads, comments, reactions, tags, templates, notifications and related records from the included groups
      - Polls, options, votes and outcomes; an anonymous poll is included only after it has closed
      - Subgroups you belong to
      - Open and closed subgroups when you export their parent group as a parent group admin, even if you do not belong to those subgroups
      - References to files and images attached to the included content
    translation: |-
      - Группа, её участники и запросы на вступление
      - Обсуждения, комментарии, реакции, теги, шаблоны, уведомления и связанные записи из включённых групп
      - Голосования, варианты, голоса и итоги; анонимное голосование включается только после его завершения
      - Подгруппы, в которых вы состоите
      - Открытые и закрытые подгруппы при экспорте родительской группы её администратором, даже если вы не состоите в этих подгруппах
      - Ссылки на файлы и изображения, прикреплённые к включённым материалам
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4dee92f966ec24c9:
    english: 'The JSON export does not include:'
    translation: 'В экспорт JSON не входят:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a40deeed41d9937e:
    english: |-
      - Secret subgroups you do not belong to, including their membership and content
      - Subgroups awaiting deletion
      - Anonymous polls that have not closed
      - Direct threads and polls that do not belong to the group
    translation: |-
      - Секретные подгруппы, в которых вы не состоите, включая сведения об их участниках и содержимое
      - Подгруппы, ожидающие удаления
      - Анонимные голосования, которые ещё не завершились
      - Прямые обсуждения и голосования, не принадлежащие группе
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d789fbf93f8cebeb:
