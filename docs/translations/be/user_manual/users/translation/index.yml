  bdd96ea053e98eb3:
    english: |-
      1. Application translation - Change the language of the user interface, IE: the buttons and application text.
      2. Content translation - Translate comments, discussions and proposals into your preferred language.
    translation: |-
      1. Пераклад інтэрфейсу — вы можаце змяніць мову кнопак і тэксту праграмы.
      2. Пераклад кантэнту — вы можаце перакладаць каментары, абмеркаванні і прапановы на мову, якой аддаеце перавагу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
