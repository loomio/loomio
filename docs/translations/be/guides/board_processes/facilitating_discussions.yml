---
navigation_title: Вядзенне абмеркаванняў
blocks:
  c377321bc013336b:
    english: "# Facilitating discussions"
    translation: "# Вядзенне абмеркаванняў"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b771c6c746b8dc40:
    english: 'At times topics arise that require the attention of board or committee members mid-cycle, between meetings. '
    translation: Паміж пасяджэннямі могуць узнікаць пытанні, якія патрабуюць увагі членаў праўлення або камітэта.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b5fc5f12c8e44c40:
    english: And sometimes there is just not space during a meeting for discussion or to sufficiently deliberate on a decision.
    translation: Часам на пасяджэнні не хапае часу, каб абмеркаваць пытанне або ўважліва разгледзець рашэнне.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  79f2f83380e195c4:
    english: "## On Loomio"
    translation: "## У Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  14d5e62d33996982:
    english: Use a Loomio **thread** to facilitate a discussion.  Give the thread a descriptive title that members will recognize and provide details in the thread context.  Add a relevant category tag to help members find the thread in future.
    translation: Выкарыстоўвайце **абмеркаванне** ў Loomio, каб разам разгледзець пытанне. Дайце яму зразумелую назву і апішыце падрабязнасці ў кантэксце абмеркавання. Дадайце адпаведны тэг катэгорыі, каб удзельнікі маглі пазней яго знайсці.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d35b4315f4e42cb:
    english: Notify members of the thread by inviting them, so they will receive a copy of the thread by email.  Members can participate in the discussion by clicking on the link to go to Loomio, or reply to the notification email and their comment will appear as a comment in the thread.
    translation: Запрасіце ўдзельнікаў да абмеркавання. Яны атрымаюць электронны ліст з яго зместам. Каб далучыцца, яны могуць перайсці па спасылцы ў Loomio або адказаць на ліст. Адказ з’явіцца ў абмеркаванні як каментарый.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f7d839f27c1a6f72:
    english: A Loomio thread enables you to attach files or link to online resources to support the discussion.
    translation: У абмеркаванні Loomio можна далучаць файлы і дадаваць спасылкі на інтэрнэт-рэсурсы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e45d25d90798cf1e:
    english: "Common examples include:\n- review and develop a policy\n- seek advice from the board about a topic or issue\n- discuss strategy \n- explore an idea or opportunity\n- assess risk"
    translation: |-
      Напрыклад, можна:
      - разгледзець і распрацаваць палітыку
      - папрасіць у праўлення парады наконт пытання або праблемы
      - абмеркаваць стратэгію
      - вывучыць ідэю або магчымасць
      - ацаніць рызыкі
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  86ace2adbcf3df6f:
    english: "## Issues that arise between board meetings"
    translation: "## Пытанні, якія ўзнікаюць паміж пасяджэннямі праўлення"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  48f6023950ee0729:
    english: 'A lot can happen in an organization between meetings, and most people rely on email to alert board members.  Trying to keep track of a discussion on email is tricky, with replies often lost in in-boxes and people left out.  '
    translation: 'Паміж пасяджэннямі ў арганізацыі можа шмат што адбыцца. Каб паведаміць пра гэта членам праўлення, часта выкарыстоўваюць электронную пошту. Але за абмеркаваннем у лістах цяжка сачыць: адказы губляюцца сярод іншых лістоў, а частка людзей не атрымлівае паведамленняў.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1cb0e78c848b9621:
    english: "*“You can’t do governance by email!”, Richard Westlake (Westlake Governance).*"
    translation: "*«Нельга кіраваць арганізацыяй праз электронную пошту!», Рычард Уэстлейк (Westlake Governance).*"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  eddf348746c93b4c:
    english: 'When an issue arises requiring board attention, use a Loomio thread rather than email.  Members can reply via email and their comment will appear in the Loomio thread, keeping the discussion in one place. '
    translation: Калі пытанне патрабуе ўвагі праўлення, пачніце абмеркаванне ў Loomio. Удзельнікі змогуць адказваць па электроннай пошце, а іх каментарыі будуць з’яўляцца ў абмеркаванні. Так усе адказы застануцца ў адным месцы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2f7ad89003f79fb8:
    english: |-
      Here's how:
      - Make the email subject line the title of your thread,
      - write your email content in the thread context,
      - invite your team to the thread with their email address or Loomio user name.
    translation: |-
      Як гэта зрабіць:
      - Выкарыстоўвайце тэму электроннага ліста як назву абмеркавання,
      - змясціце тэкст ліста ў кантэкст абмеркавання,
      - запрасіце каманду да абмеркавання па адрасах электроннай пошты або імёнах карыстальнікаў Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9825cbb88dcedc3d:
    english: |-
      A Loomio thread means that:
      - All info about a topic is organized in one easily accessible place,
      - people can respond without generating reply/reply-all email chains that risk leaving people out,
      - you can see who has read the message and who needs a nudge,
      - you can progress actual work to an outcome, and cut down on the amount of email.
    translation: |-
      Абмеркаванне ў Loomio дапамагае:
      - захоўваць усю інфармацыю па пытанні ў адным даступным месцы,
      - адказваць без доўгіх ланцужкоў электронных лістоў, у якіх частка людзей можа не атрымаць адказу,
      - бачыць, хто прачытаў паведамленне, а каму варта нагадаць пра яго,
      - давесці працу да высновы і скараціць колькасць лістоў.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fb9adc7cb7922016:
    english: "## When there isn't space during meetings"
    translation: "## Калі на пасяджэнні не хапае часу"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6b1c61424aa7e74b:
    english: When an agenda item cannot be resolved within the time available in your board meeting, you can move this for further discussion to Loomio. Direct people to the relevant thread, or start a new one and notify your board members.
    translation: Калі на пасяджэнні праўлення не хапіла часу вырашыць пытанне з парадку дня, працягніце яго абмеркаванне ў Loomio. Накіруйце людзей да адпаведнага абмеркавання або пачніце новае і паведаміце пра яго членам праўлення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ced9caddb281230f:
    english: This relieves pressure on your board, allows more time for information gathering, discussion and deeper reflection which often results in a better quality decision.
    translation: Гэта зніжае нагрузку на праўленне і дае больш часу, каб сабраць інфармацыю, абмеркаваць пытанне і ўважліва яго абдумаць. Часта гэта дапамагае прыняць больш абгрунтаванае рашэнне.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
