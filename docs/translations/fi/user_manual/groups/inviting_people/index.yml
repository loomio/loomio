---
navigation_title: Ihmisten kutsuminen
blocks:
  47820acef0cf3fe9:
    english: "# Inviting people"
    translation: "# Ihmisten kutsuminen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6a2bc749ec2883c0:
    english: Go to your group page and click the **Members** tab to access member management.
    translation: Siirry ryhmäsi sivulle ja avaa **Jäsenet**-välilehti, jossa voit hallita jäseniä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7fc9a792512e50bb:
    english: You can **Invite** particular people to your group with their email address or **Share** a link to your group via email, newsletter, chat or from your website.
    translation: Voit **Kutsu**-toiminnolla kutsua ihmisiä ryhmääsi sähköpostiosoitteella tai **Jaa**-toiminnolla jakaa linkin ryhmääsi sähköpostissa, uutiskirjeessä, keskustelussa tai verkkosivustollasi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3fc7875402babd63:
    english: "## Send invitations via email"
    translation: "## Lähetä kutsuja sähköpostitse"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4e91c3f036e94808:
    english: Click **Invite** on the **Members** tab to send an email containing a single-use invitation link. The recipient can create a Loomio user account and join your group.
    translation: Napsauta **Jäsenet**-välilehdellä **Kutsu**. Vastaanottajalle lähetetään sähköposti, jossa on kertakäyttöinen kutsulinkki. Hän voi luoda Loomio-käyttäjätilin ja liittyä ryhmääsi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  37a98960a11df300:
    english: If the recipient already has a Loomio user account they can still accept the invitation to join your group with their existing account.
    translation: Jos vastaanottajalla on jo Loomio-käyttäjätili, hän voi hyväksyä kutsun ja liittyä ryhmääsi nykyisellä tilillään.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c40b8865bc90ab0b:
    english: "### Invite many at once"
    translation: "### Kutsu useita ihmisiä kerralla"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f92bf789ad23e4c3:
    english: You can send invitations by email to up to 100 people at a time by entering (or copy/pasting) multiple email addresses into the "Who would you like to invite" box. Separate email addresses by comma or space.
    translation: Voit kutsua sähköpostitse enintään 100 ihmistä kerralla. Kirjoita tai liitä useita sähköpostiosoitteita "Kenet haluat kutsua" -kenttään. Erota osoitteet pilkulla tai välilyönnillä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1e8ea8567d051081:
    english: When inviting people to a group within an organization, the parent group and related subgroups you belong to appear as audience suggestions. Select a group, then select its chip to expand the audience into individual people. You can remove anyone you do not want to invite before sending the invitations. People who already belong to the destination group are excluded.
    translation: Kun kutsut ihmisiä organisaatioon kuuluvaan ryhmään, pääryhmä ja siihen liittyvät alaryhmät, joihin kuulut, näkyvät vastaanottajaehdotuksina. Valitse ryhmä ja sitten sen tunniste, niin näet ryhmän jäsenet yksitellen. Voit poistaa vastaanottajista kenet tahansa ennen kutsujen lähettämistä. Kohderyhmään jo kuuluville ei lähetetä kutsua.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  23c96c665ed9ad1c:
    english: |-
      >[!Tip]
      >Copy email addresses from a column in a Google or Excel spreadsheet, and paste into the invitation box.
    translation: |-
      >[!Tip]
      >Kopioi sähköpostiosoitteet Google- tai Excel-taulukon sarakkeesta ja liitä ne kutsukenttään.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  697177b4211a5479:
    english: When you click **Invite** an email will be sent to each of the email addresses you supplied, containing a unique invitation link that can only be used once. This email will be sent in your current language.
    translation: Kun napsautat **Kutsu**, jokaiseen antamaasi sähköpostiosoitteeseen lähetetään viesti. Viesti sisältää yksilöllisen kutsulinkin, jota voi käyttää vain kerran. Viesti lähetetään sillä kielellä, jota parhaillaan käytät.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bcce66d3fb6f6b8e:
    english: "### Invite people to Subgroups"
    translation: "### Kutsu ihmisiä alaryhmiin"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e422dfc71ef2fe0:
    english: Following the same process as above, you can invite people to a 'parent' group, and one or more subgroups simultaneously when you invite them with the **Invite people** button. Tick the boxes next to the subgroups you want them to immediately be a part of when they join the group.
    translation: Voit kutsua ihmisiä samalla kertaa pääryhmään ja yhteen tai useampaan alaryhmään **Kutsu ihmisiä** -painikkeella. Toimi kuten edellä ja valitse niiden alaryhmien valintaruudut, joihin haluat kutsuttujen liittyvän heti pääryhmään liittyessään.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  87f0b0c3281b6228:
    english: "## Share a link to your group"
    translation: "## Jaa linkki ryhmääsi"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2f014bdf9b719ec0:
    english: You can share a link to your group with the **Share** button. This is useful if you want to send a link via email, newsletter, chat or post on your website.
    translation: Voit jakaa linkin ryhmääsi **Jaa**-painikkeella. Voit lähettää linkin sähköpostissa, uutiskirjeessä tai keskustelussa tai julkaista sen verkkosivustollasi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  18ff20426c02846e:
    english: Click on the "copy" icon to copy the link to your clipboard, then paste in your email, newsletter or chat channel.
    translation: Kopioi linkki leikepöydälle napsauttamalla kopiointikuvaketta. Liitä linkki sitten sähköpostiin, uutiskirjeeseen tai keskusteluun.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c6506b3c529f683c:
    english: If you want to stop people from joining via this link, click "Reset this link". The existing link will no longer work and a new link will be created.
    translation: Jos haluat estää ihmisiä liittymästä tämän linkin kautta, napsauta "Nollaa tämä linkki". Vanha linkki lakkaa toimimasta, ja sen tilalle luodaan uusi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6d57daddf1df6a2d:
    english: "## Request to join group"
    translation: "## Pyydä pääsyä ryhmään"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  70b9af34b3bc2a9e:
    english: People can request to join an Open or Closed group. Share the group URL, such as `https://www.loomio.com/group-name`. When people arrive at the group page, they can see the public group information and select **Join group** to answer the joining prompt and send their request.
    translation: Ihmiset voivat pyytää päästä avoimeen tai suljettuun ryhmään. Jaa ryhmän osoite, esimerkiksi `https://www.loomio.com/group-name`. Ryhmän sivulla he näkevät ryhmän julkiset tiedot. Valitsemalla **Liittyä ryhmään** he voivat vastata liittymiskysymykseen ja lähettää pyyntönsä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a5534ae2aba161ba:
    english: The joining prompt gives people a chance to introduce themselves and explain why they want to join.
    translation: Liittymiskysymyksessä ihmiset voivat esitellä itsensä ja kertoa, miksi he haluavat liittyä ryhmään.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bb13bbdbfd6da80b:
    english: Under [Group privacy](/en/user_manual/groups/settings/privacy#how-people-join), choose **Request approval** to require requests to be reviewed. You can also customize the joining prompt in the group settings.
    translation: Valitse [Ryhmän yksityisyys](/en/user_manual/groups/settings/privacy#how-people-join) -asetuksista **Pyydä hyväksyntä**, jos haluat, että liittymispyynnöt tarkistetaan. Voit myös muokata liittymiskysymystä ryhmän asetuksissa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5b0e7c47a0518a3e:
    english: "### Review membership requests"
    translation: "### Tarkista liittymispyynnöt"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d4a03352457d41cb:
    english: 'Group administrators and members with permission to add members review requests from the **Membership requests** section of the **Members** tab. A reviewer can:'
    translation: 'Ryhmän ylläpitäjät ja jäsenet, joilla on oikeus lisätä jäseniä, voivat tarkistaa pyynnöt **Jäsenet**-välilehden **Liittymispyynnöt**-osiosta. Pyynnön tarkistaja voi:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  84c6d641f9dba801:
    english: |-
      - **Approve** the request to add the applicant as a member and notify them.
      - **Ignore** the request to close it without notifying the applicant or allowing another request.
      - **Decline** the request with a message explaining the decision. Loomio sends the message to the applicant by email and notification, and they can submit a new request.
    translation: |-
      - **Hyväksyä** pyynnön, jolloin hakija lisätään jäseneksi ja hänelle ilmoitetaan siitä.
      - **Jättää huomiotta** pyynnön, jolloin se suljetaan ilmoittamatta hakijalle eikä hän voi lähettää uutta pyyntöä.
      - **Hylkää** pyynnön ja perustella päätöksen viestissä. Loomio lähettää viestin hakijalle sähköpostitse ja ilmoituksena. Hän voi lähettää uuden pyynnön.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b1de5132fa942ba8:
    english: Select the decline button to write a message or ignore the request.
    translation: Valitse hylkäyspainike, jos haluat kirjoittaa viestin, tai jätä pyyntö huomiotta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a87e3fdd4ce43ee9:
    english: "## Managing invitations"
    translation: "## Kutsujen hallinta"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  84dc2f66c60f3237:
    english: To manage invitations, open the filter/ drop down from the Members tab of your Group page and select **Invitations**. You can manage individual invitations by clicking the three dot menu (**⋮**) to the right of the member.
    translation: Voit hallita kutsuja avaamalla ryhmäsi sivun **Jäsenet**-välilehden suodatinvalikon ja valitsemalla **Kutsut**. Yksittäistä kutsua voit hallita jäsenen oikealla puolella olevasta kolmen pisteen valikosta (**⋮**).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c8d12991b8edb22f:
    english: You can also make people administrators or set their title (e.g. "IT Support") within the group before they accept their invitation.
    translation: Voit myös tehdä kutsutuista ryhmän ylläpitäjiä tai määrittää heille tehtävänimikkeen, esimerkiksi "IT-tuki", jo ennen kuin he hyväksyvät kutsun.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e8aec784f84451cc:
    english: "### Re-send invitations"
    translation: "### Lähetä kutsu uudelleen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c201c2b360b1877:
    english: Follow up on people who don't make it into the group and give them a nudge. If someone has lost or forgotten about their invitation email, you can re-send it from the dropdown menu beside their name on the Members page.
    translation: Jos kutsuttu ei ole liittynyt ryhmään, voit muistuttaa häntä kutsusta. Jos kutsusähköposti on kadonnut tai unohtunut, lähetä kutsu uudelleen hänen nimensä vieressä olevasta valikosta **Jäsenet**-sivulla.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8b4674400f9a3f09:
    english: Click on the three dots (**⋮**) next to the person you want to resend the invitation to, and then choose **Resend invitation**.
    translation: Napsauta kolmea pistettä (**⋮**) sen henkilön vieressä, jolle haluat lähettää kutsun uudelleen. Valitse sitten **Lähetä kutsu uudelleen**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  abc5a934440fb8e1:
    english: |-
      ### Cancelling invitations
      If you entered the wrong email address, or have changed your mind about inviting someone, you can cancel an invitation from the Members tab on your Group page. Select **Cancel Invitation** from the drop down menu to the right of the member invitation (**⋮**).
    translation: |-
      ### Kutsujen peruuttaminen
      Jos annoit väärän sähköpostiosoitteen tai et enää halua kutsua henkilöä, voit peruuttaa kutsun ryhmäsi sivun **Jäsenet**-välilehdellä. Valitse kutsun oikealla puolella olevasta pudotusvalikosta (**⋮**) **Peruuta kutsu**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
