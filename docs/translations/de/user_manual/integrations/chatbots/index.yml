  290b36f9178272e2:
    english: |-
      Our webhook based system can also be used to support other systems that support incoming webhooks with either HTML or Markdown formatting. This could be something like Zapier or Rocketchat.
      Just select the mattermost bot, but use a custom webhook URL.
    translation: |-
      Das Webhook-System lässt sich auch mit anderen Diensten nutzen, die eingehende Webhooks mit HTML- oder Markdown-Formatierung unterstützen, zum Beispiel Zapier oder Rocketchat.
      Wähle dazu den Mattermost-Bot und verwende eine eigene Webhook-URL.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f76c44196c94dcef:
    english: "## Set up a chat integration"
    translation: "## Eine Chat-Integration einrichten"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3c63f567f90fd1eb:
    english: |-
      After configuring your chosen service (see above), you'll have a webhook URL.
      Open **Chat integrations** from the group menu and add a new chat integration for your group.
    translation: |-
      Nachdem du den gewählten Dienst eingerichtet hast (siehe oben), erhältst du eine Webhook-URL.
      Öffne **Chat-Integrationen** im Gruppenmenü und füge eine neue Chat-Integration für deine Gruppe hinzu.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
