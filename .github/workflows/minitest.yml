name: minitest

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  minitest:
    runs-on: ubuntu-latest
    env:
      PGDATABASE: loomio_test
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      RAILS_ENV: test
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: install image processing tools
      run: |
        sudo apt-get update
        sudo apt-get install -y imagemagick libvips
    - name: git checkout
      uses: actions/checkout@v5
    - name: install ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '4.0.5'
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically
    - name: install node.js
      uses: actions/setup-node@v6
      with:
        node-version-file: .node-version
    - name: install npm
      run: npm install --global "npm@$(cat .npm-version)" --no-audit --no-fund
    - name: init db
      run: |
        createdb
        cp config/database.yml.postgresql config/database.yml
        bundle exec rake db:setup
    - name: build client
      run: |
        cd vue
        npm ci
        npm run build
    - name: run minitest
      run: |
        bundle exec rails test
