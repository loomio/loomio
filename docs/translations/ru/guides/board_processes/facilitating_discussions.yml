navigation_title: Ведение обсуждений
blocks:
  c377321bc013336b:
    english: "# Facilitating discussions"
    translation: "# Ведение обсуждений"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b771c6c746b8dc40:
    english: 'At times topics arise that require the attention of board or committee members mid-cycle, between meetings. '
    translation: Иногда между заседаниями возникают вопросы, требующие внимания членов совета или комитета.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b5fc5f12c8e44c40:
    english: And sometimes there is just not space during a meeting for discussion or to sufficiently deliberate on a decision.
    translation: А иногда во время заседания не хватает времени, чтобы обсудить вопрос и тщательно обдумать решение.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  79f2f83380e195c4:
    english: "## On Loomio"
    translation: "## В Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  14d5e62d33996982:
    english: Use a Loomio **thread** to facilitate a discussion.  Give the thread a descriptive title that members will recognize and provide details in the thread context.  Add a relevant category tag to help members find the thread in future.
    translation: Используйте **тему** в Loomio для обсуждения. Дайте ей понятное участникам название и изложите подробности в описании. Добавьте подходящий тег категории, чтобы участники могли найти тему позже.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d35b4315f4e42cb:
    english: Notify members of the thread by inviting them, so they will receive a copy of the thread by email.  Members can participate in the discussion by clicking on the link to go to Loomio, or reply to the notification email and their comment will appear as a comment in the thread.
    translation: Пригласите участников в тему, чтобы они получили её копию по электронной почте. Они могут перейти по ссылке в Loomio и присоединиться к обсуждению или ответить на письмо с уведомлением. Их ответ появится в теме как комментарий.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f7d839f27c1a6f72:
    english: A Loomio thread enables you to attach files or link to online resources to support the discussion.
    translation: К теме в Loomio можно прикрепить файлы или добавить ссылки на интернет-ресурсы, полезные для обсуждения.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e45d25d90798cf1e:
    english: "Common examples include:\n- review and develop a policy\n- seek advice from the board about a topic or issue\n- discuss strategy \n- explore an idea or opportunity\n- assess risk"
    translation: |-
      Например, в теме можно:
      - рассмотреть и разработать правила
      - попросить совет по вопросу или проблеме у членов совета
      - обсудить стратегию
      - изучить идею или возможность
      - оценить риски
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  86ace2adbcf3df6f:
    english: "## Issues that arise between board meetings"
    translation: "## Вопросы, возникающие между заседаниями совета"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  48f6023950ee0729:
    english: 'A lot can happen in an organization between meetings, and most people rely on email to alert board members.  Trying to keep track of a discussion on email is tricky, with replies often lost in in-boxes and people left out.  '
    translation: 'Между заседаниями в организации может произойти многое. Чтобы сообщить об этом членам совета, обычно используют электронную почту. Но следить за обсуждением в переписке трудно: ответы теряются среди писем, а кто-то может остаться вне разговора.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1cb0e78c848b9621:
    english: "*“You can’t do governance by email!”, Richard Westlake (Westlake Governance).*"
    translation: "*«Управлять организацией по электронной почте невозможно», — Ричард Уэстлейк (Westlake Governance).*"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  eddf348746c93b4c:
    english: 'When an issue arises requiring board attention, use a Loomio thread rather than email.  Members can reply via email and their comment will appear in the Loomio thread, keeping the discussion in one place. '
    translation: Если возник вопрос, требующий внимания совета, создайте тему в Loomio. Участники смогут отвечать по электронной почте, а их комментарии появятся в теме. Так всё обсуждение останется в одном месте.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2f7ad89003f79fb8:
    english: |-
      Here's how:
      - Make the email subject line the title of your thread,
      - write your email content in the thread context,
      - invite your team to the thread with their email address or Loomio user name.
    translation: |-
      Для этого:
      - используйте тему письма как название темы в Loomio,
      - поместите текст письма в описание темы,
      - пригласите коллег в тему по адресу электронной почты или имени пользователя Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9825cbb88dcedc3d:
    english: |-
      A Loomio thread means that:
      - All info about a topic is organized in one easily accessible place,
      - people can respond without generating reply/reply-all email chains that risk leaving people out,
      - you can see who has read the message and who needs a nudge,
      - you can progress actual work to an outcome, and cut down on the amount of email.
    translation: |-
      Тема в Loomio помогает:
      - собрать всю информацию по вопросу в одном доступном месте,
      - отвечать без длинных цепочек писем, в которых легко забыть кого-то из участников,
      - видеть, кто прочитал сообщение и кому стоит напомнить о нём,
      - довести работу до решения и сократить переписку.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fb9adc7cb7922016:
    english: "## When there isn't space during meetings"
    translation: "## Когда на заседании не хватает времени"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6b1c61424aa7e74b:
    english: When an agenda item cannot be resolved within the time available in your board meeting, you can move this for further discussion to Loomio. Direct people to the relevant thread, or start a new one and notify your board members.
    translation: Если на заседании совета не хватило времени решить вопрос повестки дня, продолжите обсуждение в Loomio. Направьте участников в подходящую тему или создайте новую и уведомите членов совета.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ced9caddb281230f:
    english: This relieves pressure on your board, allows more time for information gathering, discussion and deeper reflection which often results in a better quality decision.
    translation: Так у совета будет больше времени собрать информацию, обсудить вопрос и обдумать его. Это часто помогает принять более взвешенное решение.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
