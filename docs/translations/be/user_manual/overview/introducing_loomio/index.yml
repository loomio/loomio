---
navigation_title: Як прадставіць Loomio вашай групе
blocks:
  6c777a62b2b77732:
    english: "# Introducing Loomio to your group"
    translation: "# Як прадставіць Loomio вашай групе"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  438cc622ae730bd8:
    english: Introduce Loomio through one useful piece of work. Prepare the group before inviting people, help everyone participate once, and complete the process through to an outcome.
    translation: Пачніце знаёмства з Loomio з адной карыснай справы. Падрыхтуйце групу, перш чым запрашаць людзей, дапамажыце ўсім узяць удзел і давядзіце працэс да высновы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9c9fa4e8f6e208e4:
    english: "## Choose one useful starting point"
    translation: "## Выберыце адну карысную справу для пачатку"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3353fb04e83837e5:
    english: Start with a real process that your group already needs. A good first use is small enough to complete soon, but relevant enough that people have a reason to participate.
    translation: Пачніце з рэальнай справы, якой ваша група ўжо павінна заняцца. Для першага разу выберыце нешта, што можна хутка завяршыць і ў чым людзям ёсць сэнс удзельнічаць.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  652744a2ab28954b:
    english: 'For example:'
    translation: 'Напрыклад:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  19bc6c09eeea816e:
    english: |-
      - prepare the agenda for an upcoming meeting;
      - review and approve meeting minutes;
      - gather feedback on a draft document;
      - decide a small operational question; or
      - identify priorities for the next month.
    translation: |-
      - падрыхтаваць парадак дня наступнай сустрэчы;
      - разгледзець і зацвердзіць пратакол сустрэчы;
      - сабраць водгукі на чарнавік дакумента;
      - вырашыць невялікае арганізацыйнае пытанне; або
      - вызначыць прыярытэты на наступны месяц.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  68a0d6b76f36ebaf:
    english: Avoid moving every discussion and decision into Loomio at once. A repeatable process gives the group a clear reason to return and lets you improve the way you run it each time.
    translation: Не пераносьце адразу ўсе абмеркаванні і рашэнні ў Loomio. Рэгулярны працэс дае групе зразумелую прычыну вяртацца і дазваляе кожны раз паляпшаць яго.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4b65243ef120921b:
    english: "## Prepare the group before inviting people"
    translation: "## Падрыхтуйце групу, перш чым запрашаць людзей"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  305b29c1c832c246:
    english: 'Give people a useful and recognizable place to arrive in:'
    translation: 'Падрыхтуйце месца, у якім людзі пазнаюць сваю групу і змогуць адразу пачаць працу:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  76d859d168805706:
    english: |-
      - add the group's name, logo, cover image, purpose, and important links;
      - check the group's privacy and permissions;
      - add any [category tags](/en/user_manual/discussions/tags) the group will use regularly;
      - create the first real discussion, with the background information people need; and
      - create a practice discussion if members would benefit from trying comments, reactions, and voting without consequences.
    translation: |-
      - дадайце назву групы, лагатып, выяву вокладкі, мэту і важныя спасылкі;
      - праверце налады прыватнасці і дазволы групы;
      - дадайце [тэгі катэгорый](/en/user_manual/discussions/tags), якімі група будзе рэгулярна карыстацца;
      - стварыце першае абмеркаванне з патрэбнай для ўдзелу інфармацыяй; і
      - стварыце трэніровачнае абмеркаванне, калі ўдзельнікам карысна паспрабаваць каментары, рэакцыі і галасаванне без наступстваў.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f1decb57ec9d48cb:
    english: Use your own photo in your profile and the organization's logo for the group. This helps people recognize who invited them and which organization an email is about.
    translation: Дадайце ў свой профіль уласнае фота, а для групы выкарыстоўвайце лагатып арганізацыі. Так людзям будзе лягчэй пазнаць, хто іх запрасіў і ад якой арганізацыі прыйшоў ліст.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '01965093f234bb36':
    english: "## Decide where work belongs"
    translation: "## Вызначце, дзе весці розныя справы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7fbd0d770cbed2bd:
    english: 'Loomio can sit alongside tools your group already uses:'
    translation: 'Loomio можна выкарыстоўваць разам з інструментамі, якімі ваша група ўжо карыстаецца:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '0168271b154f6931':
    english: |-
      | Use | Good place for it |
      |---|---|
      | Quick questions, social conversation, and timely updates | Chat, such as Slack, Teams, Matrix, or Discord |
      | Collaborative editing of a living document | A shared document tool |
      | Assigning work and tracking its completion | A task or project-management tool |
      | A focused discussion, broad participation, a decision, and its lasting record | Loomio |
    translation: |-
      | Для чаго | Дзе гэта зручна рабіць |
      |---|---|
      | Кароткія пытанні, нефармальныя размовы і тэрміновыя навіны | Чат, напрыклад Slack, Teams, Matrix або Discord |
      | Сумеснае рэдагаванне дакумента, які пастаянна абнаўляецца | Інструмент для сумеснай працы з дакументамі |
      | Размеркаванне задач і адсочванне іх выканання | Інструмент для кіравання задачамі або праектамі |
      | Мэтанакіраванае абмеркаванне, шырокі ўдзел, рашэнне і яго захаваны запіс | Loomio |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  50fae2027411e538:
    english: Link to documents and other systems from the group description or discussion context. Use [chat integrations](/en/user_manual/integrations/chatbots) to bring important Loomio activity into a channel people already follow.
    translation: Дадавайце спасылкі на дакументы і іншыя сістэмы ў апісанне групы або кантэкст абмеркавання. Выкарыстоўвайце [інтэграцыі з чатамі](/en/user_manual/integrations/chatbots), каб важныя падзеі ў Loomio з'яўляліся ў канале, за якім людзі ўжо сочаць.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ed67af54bdf1c775:
    english: Tell members what you expect to happen in Loomio. A simple boundary such as “important discussions and decisions go in Loomio; quick coordination stays in chat” is easier to adopt than an unexplained new tool.
    translation: Скажыце ўдзельнікам, для чаго вы прапануеце выкарыстоўваць Loomio. Простае правіла, напрыклад «важныя абмеркаванні і рашэнні — у Loomio, хуткая каардынацыя — у чаце», лягчэй прыняць, чым новы інструмент без тлумачэння.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0a799d7911a46f6f:
    english: "## Decide how your group decides"
    translation: "## Вызначце, як ваша група прымае рашэнні"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9e1c64de2dc68593:
    english: Loomio does not require every group, or every decision, to use the same process. Some groups arrive with established rules. Others use Loomio while they develop a clearer decision-making practice together.
    translation: Loomio не патрабуе ад усіх груп або для ўсіх рашэнняў аднаго працэсу. У некаторых груп ужо ёсць правілы. Іншыя выкарыстоўваюць Loomio, пакуль разам выпрацоўваюць больш выразны парадак прыняцця рашэнняў.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6d0c0f50959ab9d6:
    english: "### If your process is already established"
    translation: "### Калі ў вашай групы ўжо ёсць усталяваны парадак"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5fbfe86e935d5a8c:
    english: 'Translate the group''s existing requirements into Loomio. Before running a formal decision, make sure participants can tell:'
    translation: 'Адлюструйце дзейныя патрабаванні групы ў Loomio. Перш чым прымаць афіцыйнае рашэнне, пераканайцеся, што ўдзельнікам зразумела:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9a1b89bd4c5fe02c:
    english: |-
      - which kinds of decisions can be made in Loomio;
      - who provides input and who has authority to decide;
      - who is eligible to vote;
      - whether a [quorum](/en/user_manual/polls/quorum) is required;
      - whether the decision requires a majority, supermajority, unanimous agreement, consent, or another [vote share requirement](/en/user_manual/polls/vote_share_requirements);
      - whether the decision takes effect when its outcome is published or must be ratified elsewhere; and
      - who will record and carry out the outcome.
    translation: |-
      - якія рашэнні можна прымаць у Loomio;
      - хто выказвае меркаванне, а хто мае паўнамоцтвы прымаць рашэнне;
      - хто мае права галасаваць;
      - ці патрэбны [кворум](/en/user_manual/polls/quorum);
      - ці патрэбная для рашэння простая большасць, кваліфікаваная большасць, аднагалосная згода, адсутнасць пярэчанняў або іншая [неабходная доля галасоў](/en/user_manual/polls/vote_share_requirements);
      - ці набудзе рашэнне сілу пасля публікацыі высновы, ці яго яшчэ трэба зацвердзіць у іншым месцы; і
      - хто зафіксуе і выканае рашэнне.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4b48b6e0aff5cfc0:
    english: If your constitution, bylaws, policy, or local law governs electronic decisions, make sure the Loomio process follows those requirements. Configure [delegated voters](/en/user_manual/groups/delegated_voters), proposal settings, and [poll templates](/en/user_manual/polls/poll_templates) to make the agreed process easy to repeat.
    translation: Калі электроннае прыняцце рашэнняў рэгулююць статут, унутраныя правілы, палітыка або мясцовае заканадаўства, пераканайцеся, што працэс у Loomio адпавядае гэтым патрабаванням. Наладзьце [дэлегаваных выбаршчыкаў](/en/user_manual/groups/delegated_voters), параметры прапаноў і [шаблоны апытанняў](/en/user_manual/polls/poll_templates), каб узгоднены працэс было лёгка паўтараць.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b068624ed6c7c6b3:
    english: "### If your group is still deciding"
    translation: "### Калі ваша група яшчэ вызначае парадак"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  14449de544d28a6b:
    english: 'Start a discussion about how decisions should be made. Instead of beginning with a voting tool, ask the group to consider:'
    translation: 'Пачніце абмеркаванне таго, як трэба прымаць рашэнні. Перш чым выбіраць інструмент для галасавання, прапануйце групе абмеркаваць:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f65b39a74ae25ed7:
    english: |-
      - What kinds of decisions do we make?
      - Who is affected, who should be consulted, and who is responsible for deciding?
      - Which decisions need advice, consent, consensus, a vote, or delegated authority?
      - What level of participation or support makes a decision valid?
      - How will we respond to objections, tied results, or insufficient participation?
      - How will we communicate, record, review, and change a decision?
    translation: |-
      - Якія рашэнні мы прымаем?
      - Каго яны закранаюць, з кім трэба параіцца і хто адказвае за прыняцце рашэння?
      - Для якіх рашэнняў патрэбныя парада, згода, кансенсус, галасаванне або дэлегаваныя паўнамоцтвы?
      - Які ўзровень удзелу або падтрымкі робіць рашэнне сапраўдным?
      - Як мы будзем рэагаваць на пярэчанні, роўную колькасць галасоў або недастатковы ўдзел?
      - Як мы будзем паведамляць пра рашэнне, фіксаваць, пераглядаць і змяняць яго?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ce7c0af2ad170b5c:
    english: The answers may be different for an operational decision, a policy, an election, and a constitutional change. See [Making decisions](/en/guides/making_decisions) to compare several complete processes.
    translation: Для арганізацыйнага рашэння, палітыкі, выбараў і змены статута адказы могуць адрознівацца. Параўнайце некалькі поўных працэсаў у матэрыяле [Прыняцце рашэнняў](/en/guides/making_decisions).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aac26fc96b90744d:
    english: If the group is not ready to settle every rule, agree on a provisional process for one low-risk decision. State what the result will mean before asking people to participate, publish an outcome, then review how the process worked. Record what the group learns in its description, governance documents, or reusable templates.
    translation: Калі група яшчэ не гатовая ўзгадніць усе правілы, дамоўцеся пра часовы працэс для аднаго рашэння з невялікай рызыкай. Перш чым запрашаць людзей да ўдзелу, патлумачце, што будзе азначаць вынік. Апублікуйце выснову, а затым абмяркуйце, як спрацаваў працэс. Зафіксуйце высновы групы ў яе апісанні, дакументах пра кіраванне або шаблонах для паўторнага выкарыстання.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  23ed8fb3e887afbc:
    english: "## Invite people"
    translation: "## Запрасіце людзей"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a5d369ad9df691fe:
    english: "[Invite people](/en/user_manual/groups/inviting_people) with a short personal message that explains:"
    translation: "[Запрасіце людзей](/en/user_manual/groups/inviting_people) і дадайце кароткае асабістае паведамленне, у якім растлумачце:"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3383207ff2fcc99b:
    english: |-
      - why the group is using Loomio;
      - what you are asking them to do first;
      - when you need their response; and
      - where they can get help.
    translation: |-
      - чаму група выкарыстоўвае Loomio;
      - што вы прапануеце ім зрабіць спачатку;
      - калі вам патрэбны іх адказ; і
      - дзе яны могуць атрымаць дапамогу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  282ef8673815823e:
    english: You can begin with a small group of people who will actively test the process, or invite the whole group when everyone needs to participate from the start. In either case, have a discussion ready for them rather than inviting people into an empty group.
    translation: Можна пачаць з невялікай групы людзей, якія будуць актыўна выпрабоўваць працэс, або адразу запрасіць усю групу, калі ўдзел кожнага патрэбны з самага пачатку. У абодвух выпадках падрыхтуйце абмеркаванне да запрашэння, каб людзі не трапілі ў пустую групу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cd6511a78ce7c9b7:
    english: "## Help everyone participate once"
    translation: "## Дапамажыце ўсім узяць удзел упершыню"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4a37273687b4f4b0:
    english: The first objective is for each person to cross the threshold from receiving an invitation to contributing something.
    translation: Першая мэта — каб кожная асоба не толькі атрымала запрашэнне, але і зрабіла свой унёсак.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ce285f27cca389c4:
    english: 'Ask people to:'
    translation: 'Прапануйце людзям:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d0b9e80af995edff:
    english: |-
      1. sign in and add a profile photo;
      2. open the welcome or practice discussion;
      3. post a short comment or reaction; and
      4. vote in a low-stakes proposal and, if useful, leave a reason.
    translation: |-
      1. увайсці і дадаць фота профілю;
      2. адкрыць вітальнае або трэніровачнае абмеркаванне;
      3. пакінуць кароткі каментар або рэакцыю; і
      4. прагаласаваць па прапанове без сур'ёзных наступстваў і, калі карысна, патлумачыць свой выбар.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  919e32e7adb7c4c8:
    english: Members do not need to create a password. They can [sign in by email](/en/user_manual/users/signing_in), and they can reply to eligible discussion emails without first navigating back to the thread.
    translation: Удзельнікам не трэба ствараць пароль. Яны могуць [увайсці праз электронную пошту](/en/user_manual/users/signing_in), а таксама адказваць на адпаведныя лісты аб абмеркаваннях без папярэдняга вяртання да ніткі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  22ceb7104d416acf:
    english: "## Use notifications deliberately"
    translation: "## Выкарыстоўвайце апавяшчэнні абдумана"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dd99e6dd5c93d9ee:
    english: Access to content and notification about it are separate. Group members can find discussions in their group even when they were not notified immediately.
    translation: Доступ да матэрыялаў і апавяшчэнні пра іх — розныя рэчы. Удзельнікі групы могуць знайсці абмеркаванні ў сваёй групе, нават калі не атрымалі апавяшчэнне адразу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0e20732d957eb282:
    english: When starting a discussion, notify the people whose input is needed at that stage. Use @mentions and replies when asking particular people to respond. When voting opens later, invite the eligible voters.
    translation: Калі пачынаеце абмеркаванне, апавясціце людзей, чыё меркаванне патрэбнае на гэтым этапе. Выкарыстоўвайце @mentions і адказы, калі звяртаецеся да канкрэтных людзей. Калі пазней пачнецца галасаванне, запрасіце тых, хто мае права галасаваць.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  43339ff0f3d30a50:
    english: If you create a discussion and poll together only to capture a vote, avoid sending a discussion invitation immediately followed by a poll invitation. Either start the discussion without notifying people and invite them through the poll, or run a [standalone poll](/en/user_manual/polls/intro_to_decisions#without-a-discussion).
    translation: Калі вы адначасова ствараеце абмеркаванне і апытанне толькі для збору галасоў, не адпраўляйце запрашэнне да абмеркавання адразу перад запрашэннем да апытання. Пачніце абмеркаванне без апавяшчэнняў і запрасіце людзей праз апытанне або правядзіце [асобнае апытанне](/en/user_manual/polls/intro_to_decisions#without-a-discussion).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  467cf9d1e5bd2973:
    english: Show members the [Catch-up and notification settings](/en/user_manual/users/email_settings), especially if they do not expect to visit Loomio every day.
    translation: Пакажыце ўдзельнікам [налады аглядных лістоў і апавяшчэнняў](/en/user_manual/users/email_settings), асабліва калі яны не плануюць заходзіць у Loomio штодня.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ebe7764d64b17823:
    english: "## Complete the first process"
    translation: "## Завяршыце першы працэс"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9a165c59ba0aed5a:
    english: 'A first process should demonstrate the complete pattern:'
    translation: 'Першы працэс павінен паказаць увесь шлях ад абмеркавання да высновы:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8bc60d4319adf204:
    english: |-
      1. Introduce the topic and provide context.
      2. Invite discussion or questions when they are needed.
      3. Start the appropriate proposal or poll.
      4. Remind people who have not participated when necessary.
      5. Publish an [outcome](/en/user_manual/polls/outcomes) stating what was decided and what happens next.
    translation: |-
      1. Прадстаўце тэму і дайце неабходную інфармацыю.
      2. Запрасіце да абмеркавання або прапануйце задаваць пытанні, калі гэта патрэбна.
      3. Пачніце адпаведную прапанову або апытанне.
      4. Пры неабходнасці нагадайце тым, хто яшчэ не далучыўся.
      5. Апублікуйце [выснову](/en/user_manual/polls/outcomes), у якой сказана, якое рашэнне прынята і што будзе далей.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1235244007a8559b:
    english: The outcome closes the loop and creates a record that members can return to later. Afterward, ask what worked, adjust the process, and choose the next recurring piece of work to run in Loomio.
    translation: Выснова завяршае працэс і захоўвае рашэнне, да якога ўдзельнікі змогуць вярнуцца пазней. Пасля гэтага абмяркуйце, што атрымалася, удасканальце працэс і выберыце наступную рэгулярную задачу для працы ў Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c699f8804cdd41b1:
    english: For a facilitated sequence from discussion to decision, see [Making decisions](/en/guides/making_decisions). For board-specific practices, see [Introducing Loomio to your board](/en/guides/board_processes/introduce).
    translation: Пра тое, як правесці групу ад абмеркавання да рашэння, чытайце ў кіраўніцтве [«Прыняцце рашэнняў»](/en/guides/making_decisions). Пра працу рады чытайце ў кіраўніцтве [«Як пазнаёміць вашу раду з Loomio»](/en/guides/board_processes/introduce).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
