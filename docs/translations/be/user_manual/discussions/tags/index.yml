  7d3b350731e07a2c:
    english: Use short, familiar names that group members will recognize, such as Finance, Governance, Packaging, or Cafe partnerships.
    translation: Выбірайце кароткія і зразумелыя ўдзельнікам групы назвы, напрыклад «Фінансы», «Кіраванне», «Упакоўка» або «Партнёрства з кавярнямі».
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d7df1acb0ce347f5:
    english: "## Edit tags"
    translation: "## Рэдагаваць тэгі"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  67bc6cfdb2afad04:
    english: |-
      Only parent-group admins can rename, recolor, merge, or delete tags. These
      changes apply throughout the organization, including its subgroups.
    translation: |-
      Толькі адміністратары асноўнай групы могуць перайменаваць тэгі, змяніць іх
      колер, аб’яднаць або выдаліць. Гэтыя змены дзейнічаюць ва ўсёй арганізацыі,
      уключаючы падгрупы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b4ca99a5204d8526:
    english: On the group page, open **Tags** and select **Edit tags**.
    translation: На старонцы групы адкрыйце **Тэгі** і выберыце **Рэдагаваць тэгі**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
