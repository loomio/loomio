  828de256c39d112c:
    english: Loomio complements chat, shared documents, and task-management tools rather than replacing every kind of work.
    translation: Loomio affianca chat, documenti condivisi e strumenti per gestire le attività. Ogni strumento serve a un tipo di lavoro diverso.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ad42655c9ef79337:
    english: |-
      | Work | Suggested tool |
      |---|---|
      | Quick questions, social conversation, and timely updates | Chat |
      | Collaborative editing of a living document | Shared document |
      | Assigning and tracking tasks | Project or task-management tool |
      | Important topic-based discussion, broad participation, decisions, and outcomes | Loomio |
    translation: |-
      | Attività | Strumento suggerito |
      |---|---|
      | Domande rapide, conversazioni informali e aggiornamenti tempestivi | Chat |
      | Modifica collaborativa di un documento in continua evoluzione | Documento condiviso |
      | Assegnazione e monitoraggio delle attività | Strumento per gestire progetti o attività |
      | Discussioni su temi importanti, ampia partecipazione, decisioni e conclusioni | Loomio |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  40e853f5116f28eb:
    english: Put work in Loomio when people need time to consider a topic, when everyone affected should have a meaningful opportunity to participate, or when the group will need to find the discussion and decision later. Link to the relevant document or task from the Loomio discussion so its context remains easy to find.
    translation: Usa Loomio quando le persone hanno bisogno di tempo per riflettere su un tema, quando tutte le persone coinvolte devono avere la possibilità di partecipare, o quando il gruppo dovrà ritrovare la discussione e la decisione in seguito. Aggiungi alla discussione su Loomio un link al documento o all'attività pertinente, così sarà facile ritrovare il contesto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
