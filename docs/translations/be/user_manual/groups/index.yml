  cce1047bc62d8a5e:
    english: "# Intro to Groups"
    translation: "# Знаёмства з групамі"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  91a303d3d1fb3894:
    english: 'A Loomio group is a safe place for people to meet, have discussions and make decisions. '
    translation: Група ў Loomio — бяспечная прастора, дзе людзі могуць сустракацца, абмяркоўваць пытанні і прымаць рашэнні.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ea5096230dfe16d4:
    english: 'It’s a container where group members can find and share information, participate in important discussions and decisions that affect their work.  '
    translation: У групе ўдзельнікі могуць знаходзіць інфармацыю і дзяліцца ёю, удзельнічаць у важных абмеркаваннях і рашэннях, якія ўплываюць на іх працу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  47903117cdc64e73:
    english: A Loomio group looks like this.  At the top of the page you will see an image and logo that you can tailor to represent your organization.  This allows people arriving into your group to see they have joined a place they recognize and feel welcome - a safe space where people feel at home, amongst friends and can participate effectively.
    translation: Так выглядае група ў Loomio. Уверсе старонкі вы ўбачыце выяву і лагатып. Іх можна змяніць, каб яны прадстаўлялі вашу арганізацыю. Гэта дапамагае людзям, якія далучаюцца да групы, пазнаць яе і адчуць сябе часткай бяспечнай, знаёмай прасторы, дзе можна свабодна ўдзельнічаць.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3d39462ab98c79e6:
    english: "![The Oatmilk Cooperative group page, with its description and discussion list](group_page.png)"
    translation: "![Старонка групы кааператыва Oatmilk з апісаннем і спісам абмеркаванняў](group_page.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  59f3bebbce1676a6:
    english: |-
      Choose a representative name for your group and use the group description to outline;
      - **what** this group is used for,
      - **why** this is important,
      - **who** is involved, and
      - **how** members can participate.
    translation: |-
      Выберыце назву, якая адлюстроўвае вашу групу, і ў апісанні пазначце:
      - **для чаго** прызначана група,
      - **чаму** гэта важна,
      - **хто** ўдзельнічае і
      - **як** удзельнікі могуць далучыцца да працы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  79ae54bca7eb1797:
    english: You may also include information like a code of conduct, terms of reference or other governing documents for the group.
    translation: Вы таксама можаце дадаць кодэкс паводзін, правілы працы або іншыя дакументы, якія вызначаюць дзейнасць групы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '018c400616dad5f4':
    english: If you are preparing a new group, see [Introducing Loomio to your group](/en/user_manual/overview/introducing_loomio) for a practical sequence from choosing the first piece of work through to recording an outcome.
    translation: Калі вы рыхтуеце новую групу, прачытайце [Як пазнаёміць вашу групу з Loomio](/en/user_manual/overview/introducing_loomio). Там апісаны практычныя крокі ад выбару першай задачы да запісу высновы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1bda53ca8e31780c:
    english: "## Administration, Facilitation and Moderation - Code of Conduct"
    translation: "## Адміністраванне, садзейнічанне абмеркаванню і мадэрацыя — кодэкс паводзін"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1091f77d5ab879ed:
    english: 'Loomio is built to foster inclusive participation, diversity and trust - helping groups make better decisions together. '
    translation: Loomio дапамагае людзям з розным досведам удзельнічаць у працы групы і будаваць давер. Гэта дапамагае групам разам прымаць больш абгрунтаваныя рашэнні.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1ac058350eea2c6d:
    english: 'Some topics bring tension in a group.  So it''s important to allow a robust discussion to take place, while ensuring it is also a safe place, particularly for vulnerable people in your group. '
    translation: Некаторыя тэмы выклікаюць напружанне ў групе. Важна даць магчымасць адкрыта іх абмеркаваць і пры гэтым захаваць бяспечную прастору, асабліва для людзей у вашай групе, якім можа спатрэбіцца дадатковая падтрымка.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  999bb2251bf623cd:
    english: 'We recommend establishing a code of conduct for your group, to help everyone be aware of their responsibility for appropriate behaviour and encourage self-regulation. '
    translation: Рэкамендуем прыняць кодэкс паводзін для вашай групы. Ён дапаможа ўсім разумець сваю адказнасць за належныя паводзіны і самастойна іх рэгуляваць.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9a77fa2d5f4fdb01:
    english: See the [Facilitator's Guide](/en/guides/facilitators_guide/commencing#culture-protocol-expectations) to further explore the value of a code of conduct.
    translation: Больш пра карысць кодэкса паводзін чытайце ў [Кіраўніцтве для вядоўцаў абмеркаванняў](/en/guides/facilitators_guide/commencing#culture-protocol-expectations).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
