navigation_title: Van start gaan
blocks:
  43e4cbf778263d11:
    english: "# Commencing"
    translation: "# Van start gaan"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0ce0604bb021d98f:
    english: "## Invitation"
    translation: "## Uitnodiging"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d5fabca3934dafd:
    english: How participants are invited into a facilitated space is incredibly important. People understand huge amounts of information from the invitation, and use it to judge how a space will be held and if they belong there. The moment of invitation is in many ways the defining opportunity to set the tone and establish trust.
    translation: Hoe je deelnemers uitnodigt voor een begeleide bijeenkomst of discussie is belangrijk. Uit de uitnodiging halen mensen veel informatie. Op basis daarvan beoordelen ze hoe de bijeenkomst zal verlopen en of ze erbij horen. De uitnodiging is vaak hét moment om de toon te zetten en vertrouwen op te bouwen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a8d7e10a50432195:
    english: |-
      > <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../rich_200.png"> Decision making is all about communication: your group can only make good decisions together if there’s a foundation of good communication in place first. This means being clear about what the purpose of a discussion or meeting is, who needs to be involved, what the time-frame is, and what people can expect.
      >
      > — Richard Bartlett
    translation: |-
      > <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../rich_200.png"> Besluiten nemen draait om communicatie. Jouw groep kan alleen samen goede besluiten nemen als er eerst een basis is voor goede communicatie. Wees daarom duidelijk over het doel van een discussie of bijeenkomst, wie erbij moet zijn, hoeveel tijd het kost en wat mensen kunnen verwachten.
      >
      > — Richard Bartlett
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ab260e60bf87a11d:
    english: 'Key aspects to an invitation:'
    translation: 'Belangrijke onderdelen van een uitnodiging:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ff258493e21d7f3a:
    english: |-
      * **Background.** What is this thing? What am I being asked to do? Who is behind this? Who else will be involved? What is the time commitment, topic focus, and protocol?
      * **Context.** What is the character of this specific engagement? Of all the possible formats and ways it could go, which one will it be? Why now, why this way?
      * **Belonging.** Am I welcome? Is this for me? Am I needed in this process? What is my unique value and contribution? Why should I specifically be compelled?
      * **Safety.** Does this invitation indicate thoughtfulness, trust, and understanding? Is the structure of the engagement up to handling the inherent power dynamics at play? What level of honesty or vulnerability will this require of me? Do I think the person inviting is going to hold me well?
      * **Accessibility.** Will my basic requirements for participation be accommodated? Language, assistive technology, unfamiliar jargon, etc. Will it be possible for me to engage?
    translation: |-
      * **Achtergrond.** Wat is dit? Wat wordt er van mij gevraagd? Wie organiseert dit? Wie doen er nog meer mee? Hoeveel tijd kost het, wat is het onderwerp en welke afspraken gelden er?
      * **Context.** Wat voor bijeenkomst of gesprek wordt dit? Welke vorm krijgt het, en waarom? Waarom nu en waarom op deze manier?
      * **Erbij horen.** Ben ik welkom? Is dit iets voor mij? Is mijn deelname nodig? Wat kan ik bijdragen? Waarom zou juist ik meedoen?
      * **Veiligheid.** Laat de uitnodiging zien dat er zorgvuldig is nagedacht en dat er vertrouwen en begrip zijn? Kan de opzet omgaan met de machtsverhoudingen die een rol spelen? Hoe eerlijk of kwetsbaar moet ik zijn? Vertrouw ik erop dat degene die mij uitnodigt goed met mij omgaat?
      * **Toegankelijkheid.** Is er rekening gehouden met wat ik nodig heb om mee te doen? Denk aan taal, ondersteunende technologie en onbekend jargon. Kan ik deelnemen?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aabfa9d842af2688:
    english: On Loomio
    translation: Op Loomio
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8a87ed2ddb6c659f:
    english: |-
      * The tool has a built-in function to [invite users](/en/user_manual/groups/inviting_people/) by email or by sending them a special link. Users can also request to join your group if your settings allow.
      * The invitation tools built into the software are very basic, and getting an unexpected login request for new software without context isn't very inviting, so group creators often introduce people to the idea of Loomio through a separate process.
      * Many aspects of Loomio are already designed to create a safe and respectful space users would want to enter — such as thoughtful [privacy options](/en/user_manual/groups/starting_a_group/#privacy).
      * The design of the software itself is meant to be friendly, simple, and professional, hopefully putting out a trustworthy vibe.
      * Loomio has accessibility features, for people who use assistive technology like screen readers, and translation features for people who speak different languages. Emphasising these aspects in an invitation can make some people feel more welcome.
    translation: |-
      * Met Loomio kun je [gebruikers uitnodigen](/en/user_manual/groups/inviting_people/) via e-mail of een speciale link. Mensen kunnen ook vragen om lid te worden van jouw groep, als de groepsinstellingen dat toestaan.
      * De ingebouwde uitnodigingsmogelijkheden zijn eenvoudig. Een onverwacht verzoek om in te loggen bij nieuwe software, zonder uitleg, voelt niet erg uitnodigend. Daarom laten groepsoprichters mensen vaak eerst op een andere manier kennismaken met Loomio.
      * Verschillende onderdelen van Loomio helpen een veilige en respectvolle ruimte te creëren, zoals de [privacyopties](/en/user_manual/groups/starting_a_group/#privacy).
      * De software is ontworpen om vriendelijk, eenvoudig en professioneel over te komen en zo vertrouwen te wekken.
      * Loomio heeft toegankelijkheidsfuncties voor mensen die ondersteunende technologie gebruiken, zoals schermlezers. Er zijn ook vertalingen voor mensen die verschillende talen spreken. Door dit in een uitnodiging te noemen, kun je mensen helpen zich welkom te voelen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cb459c1230aaf54c:
    english: "## Arrival"
    translation: "## Binnenkomen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ef55fa893f9e1034:
    english: The moment of arrival is the “first impression” of an engagement, and sets the trajectory from there on in. The person has accepted an invitation and decided to step in. They are open and expectant, and the impression they get will make a big impact on their experience.
    translation: Bij binnenkomst krijgen mensen hun eerste indruk van een bijeenkomst of discussie. Die indruk bepaalt mede hoe het verder gaat. Iemand heeft de uitnodiging aangenomen en besloten mee te doen. Diegene staat open voor wat er gaat gebeuren en heeft verwachtingen. De eerste indruk heeft veel invloed op de ervaring.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  66e7e79597f6a3d0:
    english: |-
      ### Welcoming
      To enable openness to engagement, participation, and receptivity, a person has to feel welcome. They need their existence acknowledged, and to feel a sense of hospitality.
    translation: |-
      ### Welkom heten
      Om open te staan voor een gesprek en mee te doen, moet iemand zich welkom voelen. Mensen willen merken dat hun aanwezigheid wordt gezien en dat ze gastvrij worden ontvangen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b3ce2bd5e2ea9acd:
    english: |-
      ### Settling
      When someone enters a physical room, they want to know where to sit, where the exit is, where to go to the bathroom, and if there is coffee available. They need a basic introduction to the space and their place in it.
    translation: |-
      ### Je plek vinden
      Wie een ruimte binnenkomt, wil weten waar je kunt zitten, waar de uitgang en het toilet zijn en of er koffie is. Mensen hebben een korte uitleg nodig over de ruimte en hun plek daarin.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d6fd9d29415a172:
    english: |-
      * The group description fields and discussion context box are the main space to put a “welcome message” for people arriving into the space.
      * Take a tour of the Loomio space, tweak things to make yourself comfortable (like [notification settings](/en/user_manual/users/email_settings/) and your [profile photo](/en/user_manual/users/user_profile/).
      * See information how you like using different thread views and options like Recent, Unread, Mute, and Star. Make yourself at home.
    translation: |-
      * De groepsbeschrijving en het contextvak van een discussie zijn de belangrijkste plekken voor een welkomstbericht aan nieuwe deelnemers.
      * Kijk rond in Loomio en pas instellingen aan zodat ze voor jou werken, zoals je [meldingsinstellingen](/en/user_manual/users/email_settings/) en je [profielfoto](/en/user_manual/users/user_profile/).
      * Bekijk informatie op de manier die bij je past. Gebruik verschillende weergaven van discussies en opties zoals Recent, Ongelezen, Dempen en Ster. Maak jezelf vertrouwd met de omgeving.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8acf15fe96515738:
    english: "## Who’s in the Room"
    translation: "## Wie zijn erbij?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  48c4449cd1d9b135:
    english: Introducing yourself and being introduced to others is one of the most basic and most important human social functions. From Māori *mihimihi* to British “how do you do” to Japanese business card exchanges, every culture places a lot of importance on this. It goes beyond practicalities and politeness and touches on a deep human need, which is a prerequisite for comfort, openness, and focus.
    translation: 'Jezelf voorstellen en kennismaken met anderen behoren tot de belangrijkste sociale gewoonten. Van de Māori *mihimihi* tot het Britse “how do you do” en het uitwisselen van visitekaartjes in Japan: in elke cultuur krijgt kennismaken veel aandacht. Het gaat om meer dan praktische zaken en beleefdheid. Mensen hebben behoefte om te weten met wie ze samen zijn. Dat helpt hen zich op hun gemak te voelen, open te zijn en zich te concentreren.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a8eec818aeb74e64:
    english: As a facilitator, if you don’t give people a chance to introduce themselves and find out who is around them, they will generally subvert whatever else you’re trying to point their attention at until you allow this process to occur. Consciously design introductions as a feature, and use them as an opportunity to further the overall goals of the interaction.
    translation: Geef mensen als gespreksleider de kans om zich voor te stellen en te ontdekken wie er meedoen. Als je dat niet doet, zullen ze daar vaak toch aandacht aan besteden, ook wanneer je hun aandacht ergens anders op wilt richten. Plan de kennismaking bewust in en gebruik die om het doel van het gesprek te ondersteunen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ad3d2a31a23af036:
    english: "### Check in"
    translation: "### Inchecken"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  71d51a259d8b2c35:
    english: Even among groups who already know each other well, this introduction process continues with “checking in” – where everyone has a chance to speak at the beginning of a meeting (often to a question of "what is on top for you", "how are you", or "is there anything preventing you from being present") and other good practices for team cohesion. People have a multitude of identities, which change based on the context. People answer and re-answer “who am I for this moment” all the time, and that is what allows them to orient around one another.
    translation: Ook groepen waarin mensen elkaar goed kennen, blijven kennismaken door in te checken. Aan het begin van een bijeenkomst krijgt iedereen dan de kans om iets te zeggen, bijvoorbeeld als antwoord op “Wat houdt je bezig?”, “Hoe gaat het met je?” of “Is er iets waardoor je er niet helemaal bij kunt zijn?”. Dit kan ook de onderlinge band versterken. Mensen hebben verschillende kanten, die afhankelijk van de situatie naar voren komen. Ze beantwoorden steeds opnieuw de vraag “Wie ben ik op dit moment?”. Zo kunnen ze zich op elkaar afstemmen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0573ae3aef6f1c6c:
    english: People's expression does not occur in a vaccuum, but in the context of who they are. A multi-faceted view of someone’s identity is an essential aspect of interpreting their contributions.
    translation: Wat iemand zegt, staat niet los van wie die persoon is. Om iemands bijdrage goed te begrijpen, helpt het om oog te hebben voor de verschillende kanten van diens identiteit.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  86eb005fd168a424:
    english: "> We start many of our meetings with everyone “checking in” before we get to the agenda. These check-ins are focused not on your work tasks, but on how you’re doing as a human being. If you’re going through a rough patch at home, or you’re sick, or you have exciting positive news, understanding your state of mind will help the entire group have the right context to interpret how you’re communicating. — Richard Bartlett"
    translation: "> Veel van onze bijeenkomsten beginnen met een ronde waarin iedereen incheckt, voordat we de agenda bespreken. Daarbij gaat het niet om je werktaken, maar om hoe het met jou als mens gaat. Misschien heb je het thuis moeilijk, ben je ziek of heb je goed nieuws. Als de groep weet hoe je je voelt, kan iedereen beter begrijpen hoe je communiceert. — Richard Bartlett"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d5aea1c0564ccff8:
    english: |-
      * Create a thread called "Introduce yourself" or "Check in". It provides a useful first _call to action_ everyone coming in will understand.
      * For “request to join” groups, we have a function that allows the requestor to introduce themselves to the coordinator, to get access to the group. Some groups have a process of re-posting this content in the intro thread to welcome people in.
      * Upload profile photos! Photos of faces are one of the most powerful ways of feeling like you know who is in the room with you online.
    translation: |-
      * Start een discussie met de titel "Stel jezelf voor" of "Check in". Dat geeft nieuwe deelnemers een duidelijke eerste _uitnodiging om iets te doen_.
      * In groepen waar mensen kunnen vragen om lid te worden, kan de aanvrager zich voorstellen aan de coördinator. Sommige groepen plaatsen die introductie daarna opnieuw in een kennismakingsdiscussie om de persoon welkom te heten.
      * Upload profielfoto's. Een gezicht bij een naam helpt je te herkennen met wie je online samen bent.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d3b245589018cebf:
    english: "## Who’s NOT in the Room"
    translation: "## Wie ontbreken er?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5daf97a7cbbdd355:
    english: Diversity is critical for quality group decision making. The “wisdom of the crowd effect” (collective intelligence) only works by combining a variety of viewpoints. Outcomes of collaboration processes depend heavily on which voices are, and are not, represented. It’s impossible to have perfect representative inclusion, but you need to take into account who might be missing.
    translation: Verschillende perspectieven zijn belangrijk voor goede groepsbesluiten. Collectieve intelligentie werkt alleen als je meerdere gezichtspunten samenbrengt. De uitkomst van samenwerking hangt sterk af van wie er wel en niet meepraten. Volledige vertegenwoordiging is onmogelijk, maar denk na over wie er ontbreekt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b16b07380f6bc37c:
    english: It’s extremely common for people to have blind spots around privilege. Humans are not great at intuiting bias, and are a lot better at noticing the presence of something, rather than the absence. Our minds trick us. For example, when women and men are deliberately given an equal amount of talking time there is often a perception that women are getting more than their fair share, due to different ideas about how much they “should” talk ([more details](https://www.quora.com/Do-women-tend-to-talk-more-than-men)). It can be necessary to actually measure or count to get an accurate picture, instead of relying on intuition.
    translation: Mensen zien hun eigen privileges vaak niet. We merken eerder op dat iets aanwezig is dan dat het ontbreekt, en herkennen onze eigen vooroordelen niet altijd goed. Onze waarneming kan ons misleiden. Wanneer vrouwen en mannen bewust evenveel spreektijd krijgen, vinden mensen bijvoorbeeld vaak dat vrouwen te veel spreken. Dat hangt samen met hun verwachtingen over hoeveel vrouwen “horen” te praten ([meer informatie](https://www.quora.com/Do-women-tend-to-talk-more-than-men)). Soms moet je meten of tellen om een juist beeld te krijgen, in plaats van op je gevoel te vertrouwen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2b720395fe4e451f:
    english: Someone who does not have particular accessibility needs may not even notice that a venue isn’t wheelchair accessible, a document isn’t formatted for screen readers, or a situation is excluding someone with hearing loss. But the people with those challenges will notice. Someone without kids might not consider that a 7PM meeting time won't work for parents. These, and a thousand other practical, social, and cultural elements, could block someone from *being in the room*.
    translation: Wie zelf geen specifieke toegankelijkheidsvoorzieningen nodig heeft, merkt misschien niet dat een locatie niet rolstoeltoegankelijk is, een document niet geschikt is voor schermlezers of een situatie iemand met gehoorverlies uitsluit. De mensen voor wie dit geldt, merken het wel. Wie geen kinderen heeft, denkt er misschien niet aan dat een bijeenkomst om 19.00 uur voor ouders lastig kan zijn. Deze en talloze andere praktische, sociale en culturele factoren kunnen iemand ervan weerhouden *erbij te zijn*.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  25ac4ed8610c591c:
    english: 'It’s especially important to think about who is not in room when trying to solve problems for others: build with, not for; talk with people, not about them. If the people you are trying to serve are not in the room, it’s very unlikely you’ll have all the input you need to be effective. This is just as much about effectiveness for business outcomes as about social justice; it’s almost always better to design collaboration *with* the users or stakeholders.'
    translation: 'Als je problemen voor anderen probeert op te lossen, is het extra belangrijk om na te denken over wie er ontbreekt: bouw samen met mensen en praat met hen. Als de mensen voor wie je iets wilt betekenen niet meedoen, mis je waarschijnlijk informatie die je nodig hebt. Dat geldt voor goede bedrijfsresultaten net zo goed als voor sociale rechtvaardigheid. Samenwerking kun je bijna altijd beter *met* gebruikers of belanghebbenden vormgeven.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6b44ef1725c36586:
    english: |-
      * Collaborating online can allow for whole other levels of inclusion. Instead of thinking about a “digital divide”, think about the “digital bridge” — how technology can include people who cannot attend in-person meetings or participate at a specific time, and enable whole new possibilities like multi-lingual discussions.
      * Loomio makes it very clear who is invited to a group and who has participated in a discussion, giving important information for thinking about inclusion. If people are missing, you can see that.
      * If inclusive decision making and diversity of thinking are important to you, periodically ask yourself, “Who’s not in the room? Why?”
    translation: |-
      * Online samenwerken kan meer mensen de kans geven om mee te doen. Denk niet alleen aan een “digitale kloof”, maar ook aan een “digitale brug”: technologie kan mensen betrekken die niet naar een fysieke bijeenkomst kunnen komen of niet op een bepaald tijdstip beschikbaar zijn. Ze maakt ook nieuwe mogelijkheden mogelijk, zoals discussies in meerdere talen.
      * In Loomio kun je zien wie voor een groep is uitgenodigd en wie aan een discussie heeft deelgenomen. Dat helpt je te beoordelen of mensen ontbreken.
      * Als inclusieve besluitvorming en verschillende perspectieven voor jou belangrijk zijn, vraag jezelf dan af en toe af: “Wie ontbreken er? Waarom?”
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0a5324e7de64cdba:
    english: "## Culture, Protocol, Expectations"
    translation: "## Cultuur, afspraken en verwachtingen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  851a2601b835fbb1:
    english: Culture can be quite a nebulous concept, and operates at multiple levels. The culture of the wider society has a big influence, but you can think of every group, and every session or discussion, as having a culture of its own.
    translation: Cultuur is niet altijd eenvoudig te omschrijven en speelt op verschillende niveaus. De samenleving heeft veel invloed, maar ook elke groep, bijeenkomst en discussie heeft een eigen cultuur.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  27d3b10b80ade309:
    english: How do we roll? How do we talk to one another? What is and is not ok here? What are the rules of the game, of how we interact?
    translation: Hoe gaan we hier te werk? Hoe praten we met elkaar? Wat vinden we hier wel en niet goed? Welke regels gelden voor onze omgang met elkaar?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  54d83e0b3e487190:
    english: The process of confronting cultural questions can be a powerful moment of self-awareness for a group. Not confronting them can harm ability to meet goals, or sometimes tear a group apart completely.
    translation: Door culturele vragen samen te bespreken, kan een groep zich bewuster worden van haar gewoonten. Als een groep dat gesprek uit de weg gaat, kan het moeilijker worden om doelen te bereiken. Soms kan het de groep zelfs uiteen laten vallen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f9918d7d61cef0c9:
    english: Culture, protocol, and expectations can be implicit or explicit, and by nature intersect in complex ways with power dynamics and social capital. It’s a challenging balance to keep things loose enough to allow emergence, evolution, creativity, and freedom, while being explicit enough about bottom lines and boundaries to ensure safety.
    translation: Cultuur, afspraken en verwachtingen kunnen uitgesproken of onuitgesproken zijn. Ze hangen op ingewikkelde manieren samen met machtsverhoudingen en iemands positie binnen de groep. Het is lastig om genoeg ruimte te laten voor ontwikkeling, creativiteit en vrijheid, en tegelijk duidelijk genoeg te zijn over grenzen die voor veiligheid zorgen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3d484eafb8524354:
    english: Facilitators often guide the group to live up to the culture it has set, follow the protocols it has agreed, and hold expectations to account. If a facilitator is tasked with this role, they need to be backed by a certain level of explicitness about those agreements, and a certain mandate. Otherwise, it can get messy.
    translation: Gespreksleiders helpen een groep vaak om volgens haar eigen cultuur en afspraken te werken en elkaar aan verwachtingen te houden. Wie deze taak krijgt, heeft duidelijke afspraken en een mandaat van de groep nodig. Anders wordt het moeilijk om op te treden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ba3ef231a647d607:
    english: People often want to leave things to “common sense” and avoid agreeing a code of conduct or explicit protocols. However, this can disproportionately affect the most vulnerable members of the group, since they will feel the negative impacts of bad behavior or culture first and strongest, and are least empowered to counteract it themselves. It's the responsibility of the more privileged or influential members of the group to think through these questions carefully.
    translation: Mensen laten de omgang met elkaar vaak liever aan het “gezond verstand” over dan dat ze een gedragscode of duidelijke afspraken maken. Dat kan kwetsbare groepsleden onevenredig raken. Zij ondervinden de gevolgen van schadelijk gedrag vaak als eerste en het sterkst, terwijl ze minder mogelijkheden hebben om er zelf iets tegen te doen. Groepsleden met meer invloed of privileges hebben de verantwoordelijkheid om goed over deze vragen na te denken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d14bcec24555318c:
    english: Like a legal contract, you hope you never have to enforce a code of conduct, but if you need it you’re very glad it’s there. You want to agree *before* it becomes necessary. In order for a facilitator or any member of the group to effectively stand up and say, “that’s not OK here”, you need to have already invested in culture-building and expectation-setting.
    translation: Net als bij een juridisch contract hoop je dat je een gedragscode nooit hoeft toe te passen. Maar als het nodig is, ben je blij dat die er is. Maak de afspraken *voordat* je ze nodig hebt. Een gespreksleider of groepslid kan pas goed zeggen “Dit is hier niet oké” als de groep eerder heeft gewerkt aan haar cultuur en verwachtingen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dda14b86acbd8199:
    english: |-
      * Because Loomio is usually used as a space for constructive deliberation among groups with a specific purpose and set of members, for the most part people engage in good faith and behave respectfully.
      * Loomio is designed specifically to give voice to the individual, and let them communicate their needs and concerns. Even if a majority doesn’t see a problem, a single person can raise it and be heard.
      * Communicating online enables a certain level of physical safety, because people are not face to face.
      * Some groups already use the group description field to note a code of conduct or expectations for behavior. Others have collectively agreed a set of expectations that govern participation.
      * Many groups use Loomio itself to decide their group protocols, such as how to engage, what is allowed, what a decision means and what makes it valid, etc.
      * Some core protocol issues are answered simply by using Loomio: Who is allowed here? How do we communicate?
      * One of the most basic decisions Loomio users all encounter is about decision-making protocol — Consensus? Majority? Quorum? Unanimity? Bringing the question of decision-making protocol to the fore can be a very productive step in cultural development.
    translation: |-
      * Loomio wordt meestal gebruikt door groepen met een duidelijk doel en vaste leden, om samen zorgvuldig te overleggen. Mensen nemen daarom doorgaans met goede bedoelingen deel en behandelen elkaar respectvol.
      * Loomio geeft ieder individu ruimte om behoeften en zorgen te uiten. Ook als de meerderheid geen probleem ziet, kan één persoon het ter sprake brengen en gehoord worden.
      * Online communiceren biedt enige fysieke veiligheid, doordat mensen niet tegenover elkaar zitten.
      * Sommige groepen zetten een gedragscode of gedragsverwachtingen in de groepsbeschrijving. Andere groepen hebben samen afspraken gemaakt over deelname.
      * Veel groepen gebruiken Loomio om afspraken te maken over hun werkwijze: hoe ze met elkaar omgaan, wat is toegestaan, wat een besluit betekent en wanneer het geldig is.
      * Sommige basisvragen over deelname worden al beantwoord door de manier waarop Loomio werkt: Wie mag meedoen? Hoe communiceren we?
      * Een van de eerste keuzes die Loomio-gebruikers tegenkomen, gaat over de manier van besluiten nemen: consensus, meerderheid, quorum of unanimiteit? Door die vraag expliciet te bespreken, kan een groep haar cultuur verder ontwikkelen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
