navigation_title: Alaryhmät
blocks:
  782c5b3df26b17ae:
    english: "# Subgroups"
    translation: "# Alaryhmät"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0025fb895cd6cae8:
    english: Subgroups help you organize your communications and members so that the right people are engaged in their work together.
    translation: Alaryhmien avulla voit järjestää viestintää ja jäseniä niin, että oikeat ihmiset voivat työskennellä yhdessä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cc3abd19bc310546:
    english: |-
      For example, an organization may have the following subgroups:
      - governance board
      - working team or a project working group
      - a topic (such as 'strategy' or 'learning')
    translation: |-
      Organisaatiolla voi esimerkiksi olla seuraavia alaryhmiä:
      - hallitus
      - työryhmä tai projektiryhmä
      - tiettyä aihetta, kuten strategiaa tai oppimista, käsittelevä ryhmä
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eab908c78ccd923d:
    english: Subgroups work just like groups do, but are located within your "parent" group. Most of the features and settings available are the same as in the parent group. This also means that someone can be a member of your subgroup, such as your board, but not of your parent group.
    translation: Alaryhmät toimivat kuten muutkin ryhmät, mutta ne kuuluvat pääryhmän alle. Useimmat ominaisuudet ja asetukset ovat samoja kuin pääryhmässä. Henkilö voi kuulua esimerkiksi hallituksen alaryhmään kuulumatta pääryhmään.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  aaa62c1b02d15779:
    english: "## Add a subgroup"
    translation: "## Lisää alaryhmä"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8ed2fcd2a209a53d:
    english: |-
      >[!Note]
      >The ability to add new subgroups is part of the group's [permission settings](/en/user_manual/groups/settings/permissions). By default, only admins can start new subgroups.
    translation: |-
      >[!Note]
      >Uusien alaryhmien lisääminen määräytyy ryhmän [käyttöoikeusasetusten](/en/user_manual/groups/settings/permissions) mukaan. Oletusarvoisesti vain ylläpitäjät voivat aloittaa uusia alaryhmiä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  483b820f123b5ae0:
    english: 'To add a subgroup, visit your main group page, then click **New Subgroup** from the sidebar.  '
    translation: Lisää alaryhmä siirtymällä pääryhmäsi sivulle ja napsauttamalla sivupalkissa **Uusi alaryhmä**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  abceea91b4638844:
    english: "![New subgroup button in the Oatmilk Cooperative sidebar](subgroups-sidebar.png)"
    translation: "![Uusi alaryhmä -painike Oatmilk Cooperativen sivupalkissa](subgroups-sidebar.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b8e3d3477eb6765d:
    english: Click the **New subgroup** button, give it a name and select the privacy setting, then click **Start subgroup**.
    translation: Napsauta **Uusi alaryhmä** -painiketta, anna alaryhmälle nimi ja valitse yksityisyysasetus. Napsauta sitten **Aloita alaryhmä**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1d49b46575af3f21:
    english: "![New subgroup form for the Packaging Working Group](subgroups_new.png)"
    translation: "![Packaging Working Group -alaryhmän luontilomake](subgroups_new.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  348e88e5c0ca37d0:
    english: When you are ready, [invite people](/en/user_manual/groups/inviting_people/) to the subgroup.
    translation: Kun olet valmis, [kutsu ihmisiä](/en/user_manual/groups/inviting_people/) alaryhmään.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4ac901bff75cf342:
    english: You can edit the subgroups [group settings](/en/user_manual/groups/settings/) by clicking the cog icon on the subgroup page.
    translation: Voit muokata alaryhmän [ryhmäasetuksia](/en/user_manual/groups/settings/) napsauttamalla rataskuvaketta alaryhmän sivulla.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  926676e3163dbc8e:
    english: "![Edit group settings action on the Packaging Working Group](subgroups_edit_group_settings.png)"
    translation: "![Ryhmäasetusten muokkaustoiminto Packaging Working Group -alaryhmässä](subgroups_edit_group_settings.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  737225cc4bebe7e8:
    english: "## Subgroup settings"
    translation: "## Alaryhmän asetukset"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c93e5ec8b6f3ceb7:
    english: "### Privacy"
    translation: "### Yksityisyys"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  92a47fe13740347a:
    english: The privacy settings for subgroups are similar to the parent group.
    translation: Alaryhmien yksityisyysasetukset ovat samankaltaiset kuin pääryhmän.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cee5963ea2acac16:
    english: "**Secret** subgroups are not visible to people not invited to the subgroup."
    translation: "**Salainen** alaryhmä näkyy vain siihen kutsutuille ihmisille."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c8fb4caaa5a2cb9:
    english: "**Closed** subgroups are listed in the Subgroups tab of the parent group and user's sidebar menu. Members of the parent group can request to join the subgroup. Membership is approved by a subgroup admin."
    translation: "**Suljettu** alaryhmä näkyy pääryhmän Alaryhmät-välilehdellä ja käyttäjän sivupalkissa. Pääryhmän jäsenet voivat pyytää pääsyä alaryhmään. Alaryhmän ylläpitäjä hyväksyy jäsenyyden."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b35b1b3450b2d1e1:
    english: Closed subgroups have an additional setting that allow members of its parent group to see private threads.
    translation: Suljetuissa alaryhmissä on lisäasetus, jonka avulla pääryhmän jäsenet voivat nähdä yksityiset keskusteluketjut.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  933fe2f0cbdec143:
    english: "[Read about group privacy here](/en/user_manual/groups/settings/privacy)."
    translation: "[Lue lisää ryhmän yksityisyydestä](/en/user_manual/groups/settings/privacy)."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d16c8b1258b67c9e:
    english: "### Permissions"
    translation: "### Käyttöoikeudet"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eb5de97caadd5166:
    english: Subgroups operate independently of the main group. For example, if the subgroup privacy setting is set to **Secret**, then only invited members can find this subgroup, see who is in it, and see threads.
    translation: Alaryhmät toimivat pääryhmästä riippumatta. Jos alaryhmän yksityisyysasetuksena on esimerkiksi **Salainen**, vain kutsutut jäsenet voivat löytää alaryhmän sekä nähdä sen jäsenet ja keskusteluketjut.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e7897aa59ffe96a1:
    english: "**Closed** subgroups have an additional setting that allow members of its parent group to see private threads, enabling the subgroup to be transparent to members of the parent group."
    translation: "**Suljettu** alaryhmä voidaan määrittää niin, että pääryhmän jäsenet näkevät sen yksityiset keskusteluketjut. Näin pääryhmän jäsenet voivat seurata alaryhmän toimintaa."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8dd3770fefa7d7e6:
    english: "![Setting that lets parent group members see private subgroup threads](subgroups_private_threads_settings.png)"
    translation: "![Asetus, jonka avulla pääryhmän jäsenet näkevät alaryhmän yksityiset keskusteluketjut](subgroups_private_threads_settings.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c78effb175b8924b:
    english: "## Find subgroups"
    translation: "## Etsi alaryhmiä"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5692ebbfe3fe83e9:
    english: Open the sidebar menu, and click your group name to see it's subgroups.
    translation: Avaa sivupalkin valikko ja napsauta ryhmäsi nimeä nähdäksesi sen alaryhmät.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0abefe88cc8bea7f:
    english: "![Oatmilk Cooperative subgroups listed in the sidebar](subgroups_find_subgroups.png)"
    translation: "![Oatmilk Cooperativen alaryhmät sivupalkissa](subgroups_find_subgroups.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8988135e14e40636:
    english: "## Invite to a subgroup"
    translation: "## Kutsu ihmisiä alaryhmään"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  217a985e9afb5421:
    english: Invite people to a subgroup as you invite them into a group. If they already belong to a parent group or another subgroup in the same organization that you also belong to, you can type their name or select that group as an audience. Select the audience chip to expand it into individual people, then remove anyone you do not want to invite.
    translation: Kutsu ihmisiä alaryhmään samalla tavalla kuin ryhmään. Jos kutsuttava kuuluu jo pääryhmään tai saman organisaation toiseen alaryhmään, johon sinäkin kuulut, voit kirjoittaa hänen nimensä tai valita kyseisen ryhmän vastaanottajiksi. Napsauta vastaanottajaryhmän tunnistetta nähdäksesi yksittäiset ihmiset ja poista ne, joita et halua kutsua.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2d4a28c2306fc3c6:
    english: "### Simultaneously invite people to subgroups and parent group"
    translation: "### Kutsu ihmisiä pääryhmään ja alaryhmiin samalla kertaa"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cf301ba403b3a28e:
    english: If you use the **Invite people** button from your parent group's **Members** tab, you can invite people to multiple subgroups at the same time by ticking the boxes of those you would like them to join immediately.
    translation: Kun käytät pääryhmäsi **Jäsenet**-välilehden **Kutsu ihmisiä** -painiketta, voit kutsua ihmisiä samalla kertaa useisiin alaryhmiin. Valitse niiden alaryhmien valintaruudut, joihin haluat heidän liittyvän heti.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  28a271be7caa0590:
    english: "![Selecting the parent group and subgroup in the invitation form](group_invite_email_subgroups.png)"
    translation: "![Pääryhmän ja alaryhmän valitseminen kutsulomakkeessa](group_invite_email_subgroups.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5323cb0e01e3e171:
    english: "## Administer a subgroup"
    translation: "## Hallinnoi alaryhmää"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e7c6ae867d7d3813:
    english: Subgroups can have their own admins, and admins of a subgroup may not be the same as the admins of the parent group.
    translation: Alaryhmällä voi olla omat ylläpitäjänsä, jotka voivat olla eri ihmisiä kuin pääryhmän ylläpitäjät.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  937ae9d3e8948a26:
    english: However an admin of the 'parent' group can make themselves admin of any subgroup.  This helps administrators of the parent group to administer subgroups as necessary.
    translation: Pääryhmän ylläpitäjä voi kuitenkin tehdä itsestään minkä tahansa alaryhmän ylläpitäjän. Näin hän voi hallinnoida alaryhmiä tarvittaessa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  282547a6c728d20c:
    english: Go to the Subgroup tab, find the subgroup and click **Join group**.
    translation: Siirry Alaryhmät-välilehdelle, etsi alaryhmä ja napsauta **Liittyä ryhmään**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  64102057b4f533dd:
    english: "![Join group button on a closed subgroup](member_join_subgroup.png)"
    translation: "![Liittyä ryhmään -painike suljetussa alaryhmässä](member_join_subgroup.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0f91a4020a9484ef:
    english: Now a member of the subgroup, an admin of the parent group can make themselves an admin of the subgroup.
    translation: Liityttyään alaryhmään pääryhmän ylläpitäjä voi tehdä itsestään myös alaryhmän ylläpitäjän.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b10fec2c4c3ebb6c:
    english: "![Make admin action for a parent group admin](member_make_admin.png)"
    translation: "![Toiminto, jolla pääryhmän ylläpitäjästä tehdään alaryhmän ylläpitäjä](member_make_admin.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dcb00619954e30a2:
    english: "## Delete a subgroup"
    translation: "## Poista alaryhmä"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  92e05281b2891dd5:
    english: Admins can delete a subgroup in the same way you delete a group. When deleting a subgroup, be careful to not delete the 'parent' group.
    translation: Ylläpitäjät voivat poistaa alaryhmän samalla tavalla kuin ryhmän. Kun poistat alaryhmän, varmista, ettet poista yläryhmää.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a29b8361fb910cde:
    english: Learn [how to delete groups](/en/user_manual/groups/deleting_your_group/).
    translation: Lue, [miten ryhmä poistetaan](/en/user_manual/groups/deleting_your_group/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
