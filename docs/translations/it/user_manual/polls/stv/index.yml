    translated_on: '2026-09-29'
  ed4aaa0a898906fd:
    english: "## Exporting ballots"
    translation: "## Esportare le schede"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c96d54ebfbedae32:
    english: After the election closes, people who can view the results can export the ballots in BLT format for an independent recount or audit. The export contains candidate rankings and combines identical rankings into a single row with a ballot count. For anonymous elections it does not contain voter identities, ballot identifiers, submission times, or submission order.
    translation: Dopo la chiusura dell'elezione, chi può vedere i risultati può esportare le schede in formato BLT per un riconteggio o una verifica indipendente. L'esportazione contiene le classifiche dei candidati e riunisce quelle identiche in un'unica riga, indicando il numero di schede. Per le elezioni anonime, non contiene le identità di chi ha votato, gli identificativi delle schede, gli orari di invio né l'ordine di invio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
