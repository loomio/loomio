navigation_title: Exportación de datos
blocks:
  '053719812e2be1ea':
    english: "# Group data backup or export"
    translation: "# Copia de seguridad o exportación de los datos del grupo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  42721518a91907da:
    english: 'With the group data export feature you can:'
    translation: 'Con la función de exportación de datos del grupo puedes:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f978c97e52e0b00a:
    english: |-
      - Download a file containing member data to audit group membership.
      - Download content of your group including text of threads and polls for archive or analysis.
      - Open poll results in a spreadsheet or scripting language.
      - [Print or save PDF's of a thread or poll for archival purposes.](#print-thread-to-pdf)
      - Move your group, including all users, threads, polls, and files to another Loomio server.
    translation: |-
      - Descargar un archivo con los datos de los miembros para revisar quién pertenece al grupo.
      - Descargar el contenido del grupo, incluido el texto de los hilos y sondeos, para archivarlo o analizarlo.
      - Abrir los resultados de los sondeos en una hoja de cálculo o con un lenguaje de programación.
      - [Imprimir un hilo o sondeo, o guardarlo como PDF para archivarlo.](#print-thread-to-pdf)
      - Trasladar tu grupo, con todos sus usuarios, hilos, sondeos y archivos, a otro servidor de Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  94b3081b62cd0a45:
    english: If you ever want to move from Loomio managed servers [to your own](https://github.com/loomio/loomio), you can use this feature.
    translation: Si alguna vez quieres pasar de los servidores gestionados por Loomio [a uno propio](https://github.com/loomio/loomio), puedes usar esta función.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  223d5690921676c4:
    english: If you're running your own Loomio server, and would rather not anymore, Loomio offer managed hosting in USA, EU and Australia. If you'd like to migrate your group to one of these servers, please [contact us](/contact).
    translation: Si tienes tu propio servidor de Loomio y prefieres dejar de administrarlo, Loomio ofrece alojamiento gestionado en Estados Unidos, la Unión Europea y Australia. Si quieres trasladar tu grupo a uno de estos servidores, [ponte en contacto con nosotros](/contact).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cabd4ab01146ea7c:
    english: "[Contact us](/contact) if you would like to transfer your Loomio group from Loomio's global hosted service at loomio.com to one of our regional services; loomio.eu for Europe or loomio.nz for Australia and New Zealand."
    translation: "[Ponte en contacto con nosotros](/contact) si quieres trasladar tu grupo del servicio global de Loomio en loomio.com a uno de nuestros servicios regionales: loomio.eu para Europa o loomio.nz para Australia y Nueva Zelanda."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
