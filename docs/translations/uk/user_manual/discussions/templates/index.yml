---
navigation_title: Шаблони обговорень
blocks:
  80c5dfc46bb963d2:
    english: "# Discussion templates"
    translation: "# Шаблони обговорень"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  488fbd5167707cba:
    english: Discussion templates help your group start discussions the same way each time. A template can supply a title, context, tags, and instructions for the person starting the discussion. It also sets defaults, such as whether to notify the whole group and which polls to suggest.
    translation: Шаблони обговорень допомагають вашій групі щоразу розпочинати обговорення за однаковою схемою. Шаблон може містити назву, контекст, мітки та вказівки для людини, яка розпочинає обговорення. Він також задає налаштування за замовчуванням, зокрема чи повідомляти всю групу та які опитування пропонувати.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2571bc9cc405d927:
    english: Every new discussion in a group starts from a template. When someone selects **Start discussion**, Loomio shows the group's templates. Even **Blank template** is a template, so your group can change its defaults too.
    translation: Кожне нове обговорення в групі починається із шаблону. Коли хтось вибирає **Розпочати обговорення**, Loomio показує шаблони групи. Навіть **Порожній шаблон** є шаблоном, тому ваша група може змінити і його налаштування за замовчуванням.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  834ac31697ef254b:
    english: Templates work well for processes your group repeats, such as project reviews, advice processes, meeting preparation, funding decisions, or document approvals. The person starting the discussion can still edit everything before they start it.
    translation: 'Шаблони корисні для процесів, які ваша група повторює: перегляду проєктів, надання порад, підготовки до зустрічей, рішень про фінансування чи затвердження документів. Перед початком обговорення його автор може змінити всі поля.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  74d1c850f63c0518:
    english: "## How templates are used"
    translation: "## Як використовують шаблони"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6e5927441d982c01:
    english: |-
      1. A member selects **Start discussion** on the group page.
      2. Loomio lists the group's visible templates. Each one shows its title and subtitle.
      3. The member selects a template. Loomio opens the new discussion form, filled in from the template.
      4. The template's help appears at the top of the form as guidance.
      5. The member edits the title, context, tags, and invite list, then selects **Start discussion**.
    translation: |-
      1. Учасник вибирає **Розпочати обговорення** на сторінці групи.
      2. Loomio показує видимі шаблони групи. Для кожного наведено назву й підзаголовок.
      3. Учасник вибирає шаблон. Loomio відкриває форму нового обговорення із заповненими даними шаблону.
      4. У верхній частині форми з’являється довідка щодо шаблону.
      5. Учасник редагує назву, контекст, мітки та список запрошених, а потім вибирає **Розпочати обговорення**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  464984a60c23366b:
    english: Changing a template affects only discussions started after the change. Discussions already started from it keep their content and settings.
    translation: Зміна шаблону впливає лише на обговорення, розпочаті після неї. Обговорення, які вже почалися із цього шаблону, зберігають свій вміст і налаштування.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  70c22d24ec0d248b:
    english: "## Choose who is notified by default"
    translation: "## Вибір отримувачів сповіщень за замовчуванням"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  77feebf56c2ee9a7:
    english: 'The **Invite** setting controls who the new discussion form invites by default. It has two options:'
    translation: 'Налаштування **Запросити** визначає, кого за замовчуванням запрошують у формі нового обговорення. Є два варіанти:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6c93f4222436028f:
    english: |-
      - **Everyone in the group**: the group appears in the discussion form's **Invite** field, and every member is notified when the discussion starts.
      - **None**: the **Invite** field starts empty. Nobody is notified unless the author adds people.
    translation: |-
      - **Всі в групі**: група з’являється в полі **Запросити** форми обговорення, і кожен учасник отримує сповіщення, коли обговорення починається.
      - **Жодного**: поле **Запросити** спочатку порожнє. Ніхто не отримує сповіщення, якщо автор не додасть людей.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  17cca49613fff23d:
    english: Loomio's built-in templates, including **Blank template**, use **Everyone in the group**. If your group does not want every new discussion to notify all members, edit the templates your group uses and set **Invite** to **None**.
    translation: У вбудованих шаблонах Loomio, зокрема в шаблоні **Порожній шаблон**, вибрано **Всі в групі**. Якщо ваша група не хоче сповіщати всіх учасників про кожне нове обговорення, відредагуйте шаблони, які вона використовує, і виберіть **Жодного** в налаштуванні **Запросити**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5fd184e64e0605bc:
    english: The author can always change the invite list before starting the discussion. They can remove the group to notify nobody, or add specific people instead. This setting only affects notifications. Group members can still find and read the discussion in the group, whichever option you choose.
    translation: Перед початком обговорення автор завжди може змінити список запрошених. Він може вилучити групу, щоб нікого не сповіщати, або натомість додати конкретних людей. Це налаштування впливає лише на сповіщення. Учасники групи все одно можуть знайти й прочитати обговорення в групі незалежно від вибраного варіанта.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  58f24313ca36c890:
    english: The group is added to the invite list only when the author is allowed to notify the whole group. Admins can always do this. Members can do it when **Members can notify everyone in the group** is enabled in the group's permissions.
    translation: Групу додають до списку запрошених лише тоді, коли автор має право сповістити всю групу. Адміністратори завжди мають таке право. Учасники мають його, якщо в дозволах групи ввімкнено **Учасники можуть повідомити усіх в групі.**
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  33afd174376e933b:
    english: "## Template settings"
    translation: "## Налаштування шаблону"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b02be20543f228a7:
    english: 'Group admins can edit a template from the action menu beside it in the template list. The form has these settings:'
    translation: 'Адміністратори групи можуть відредагувати шаблон через меню дій поруч із ним у списку шаблонів. У формі є такі налаштування:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f2fc57fe20100911:
    english: |-
      - **Template title**: the short name shown in the template list.
      - **Template subtitle**: one line explaining when to use the template.
      - **Template help**: instructions shown at the top of the new discussion form. Use it to explain the process and link to resources. It is not part of the discussion.
      - **Group**: whether the template starts a discussion in the group or a direct discussion. A direct discussion is visible only to the people invited to it.
      - **Default title**: a title filled in for each new discussion. The author can edit it.
      - **Example title**: an example shown in an empty title field. Use it when a default title would not fit every discussion.
      - **Tags**: tags applied to each new discussion. The author can remove them.
      - **Context**: the starting text of the discussion. Use headings, questions, or links to guide what people write.
      - **Invite**: whether to invite everyone in the group by default. See [Choose who is notified by default](#choose-who-is-notified-by-default).
      - **Poll templates**: polls suggested for this process. They are listed on the new discussion form. They also appear first when someone starts a poll in the discussion. They do not start automatically.
      - **Allow concurrent polls**: whether more than one poll can be open in the discussion at the same time.
      - **Comment length limit**: an optional maximum length for comments.
    translation: |-
      - **Назва шаблону**: коротка назва, яку показують у списку шаблонів.
      - **Шаблон підзаголовка**: один рядок із поясненням, коли використовувати шаблон.
      - **Довідка щодо шаблонів**: вказівки у верхній частині форми нового обговорення. Тут можна пояснити процес і додати посилання на матеріали. Цей текст не стає частиною обговорення.
      - **Група**: чи створює шаблон обговорення в групі, чи пряме обговорення. Пряме обговорення бачать лише запрошені до нього люди.
      - **Назва за замовчуванням**: назва, якою заповнюють кожне нове обговорення. Автор може її змінити.
      - **Приклад назви**: приклад, який показують у порожньому полі назви. Використовуйте його, якщо одна назва за замовчуванням не підходить для всіх обговорень.
      - **Мітки**: мітки, які додають до кожного нового обговорення. Автор може їх вилучити.
      - **Контекст**: початковий текст обговорення. Використовуйте заголовки, запитання або посилання, щоб підказати людям, про що писати.
      - **Запросити**: чи запрошувати всіх у групі за замовчуванням. Дивіться [Вибір отримувачів сповіщень за замовчуванням](#choose-who-is-notified-by-default).
      - **Шаблони опитувань**: опитування, запропоновані для цього процесу. Вони з’являються у формі нового обговорення. Вони також стоять першими в списку, коли хтось починає опитування в обговоренні. Автоматично вони не починаються.
      - **Дозволити одночасні опитування**: чи можуть в обговоренні одночасно бути відкриті кілька опитувань.
      - **Обмеження довжини коментаря**: необов’язкова максимальна довжина коментарів.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a9e44919507a613:
    english: Use a default title only when it will stay accurate. Otherwise, write an example title that prompts the author to name the specific review, period, document, or decision.
    translation: Використовуйте назву за замовчуванням, лише якщо вона завжди буде доречною. Інакше наведіть приклад назви, який підкаже автору вказати конкретний перегляд, період, документ або рішення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c5db289e27f54169:
    english: "## Example: bottle trial review"
    translation: "## Приклад: огляд випробування пляшок"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  89e7b8f9b36a8ae7:
    english: Oatmilk Cooperative reviews its returnable-bottle trial after each cycle. Its template is titled "Bottle trial review" and has a default title. It adds the "Bottle trial" tag. Its context asks members to read the weekly report and consider return rates, washing records, cafe feedback, and transport costs. It recommends a Sense check followed by Consent.
    translation: Кооператив «Вівсяне молоко» після кожного циклу переглядає результати випробування багаторазових пляшок. Його шаблон має назву «Огляд випробування пляшок» і назву за замовчуванням. Він додає мітку «Випробування пляшок». У контексті учасників просять прочитати тижневий звіт і розглянути частку повернених пляшок, записи про миття, відгуки кафе та транспортні витрати. Шаблон рекомендує спочатку перевірку розуміння, а потім згоду.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f896031f8dcc2f84:
    english: This works as a template because the purpose and evidence stay the same each cycle. Only the observations and decisions change.
    translation: Шаблон підходить для цього процесу, тому що його мета й потрібні дані залишаються однаковими в кожному циклі. Змінюються лише спостереження та рішення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7e5955c442f6c8ae:
    english: "## Create a template"
    translation: "## Створення шаблону"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c2b2bc41cbe6f6a:
    english: Group admins can select **New template** from the template list. Choose an example from Loomio's gallery or start with a blank template, then adapt it and save it.
    translation: Адміністратори групи можуть вибрати **Новий шаблон** у списку шаблонів. Виберіть приклад із галереї Loomio або почніть із порожнього шаблону, потім налаштуйте й збережіть його.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a9cb80d574e2d865:
    english: You can search or filter the gallery. An example is not added to your group until you save it.
    translation: Ви можете шукати приклади в галереї або відфільтрувати їх. Приклад додається до вашої групи лише після збереження.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1f0dab3f50320e75:
    english: "## Manage the template list"
    translation: "## Керування списком шаблонів"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7462593f2f6d1614:
    english: When a group is created, Loomio adds a set of templates suited to the kind of group. Only **Blank template** and **Practice discussion** are visible at first. The others are hidden, and admins can unhide them.
    translation: Коли створюють групу, Loomio додає набір шаблонів відповідно до її типу. Спочатку видно лише **Порожній шаблон** і **Практичне обговорення**. Решту приховано, але адміністратори можуть їх показати.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e6f7eaa63e353ef7:
    english: 'Group admins can use the action menu beside a template to:'
    translation: 'Через меню дій поруч із шаблоном адміністратори групи можуть:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e8767178e42cd4e0:
    english: |-
      - edit its content and settings;
      - hide it from the template list;
      - unhide it from **Hidden templates**;
      - rearrange the order of visible templates;
      - export it as a JSON file; or
      - delete it.
    translation: |-
      - редагувати його вміст і налаштування;
      - приховати його зі списку шаблонів;
      - показати його з розділу **Приховані шаблони**;
      - змінити порядок видимих шаблонів;
      - експортувати його як файл JSON; або
      - видалити його.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5d4cbc918551c211:
    english: Hiding a template keeps it for later use. Deleting a template does not delete discussions started from it.
    translation: Прихований шаблон можна використати пізніше. Видалення шаблону не видаляє обговорення, розпочаті з нього.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c0ae844752e20ef:
    english: "## Share templates between groups"
    translation: "## Передавання шаблонів між групами"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  acf646688b9b79f4:
    english: Select **Export json** in a template's action menu to download it as a file. To use it in another group, select **New template**, then **Import json**. The form opens with the imported content so you can review it before saving.
    translation: Виберіть **Експортувати JSON** у меню дій шаблону, щоб завантажити його як файл. Щоб використати шаблон в іншій групі, виберіть **Новий шаблон**, а потім **Імпорт JSON**. Форма відкриється з імпортованим вмістом, і ви зможете переглянути його перед збереженням.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a168253bda3147e8:
    english: Links to custom poll templates are not included in the file. Export and import those poll templates separately.
    translation: Посилання на власні шаблони опитувань не входять до файлу. Експортуйте й імпортуйте ці шаблони опитувань окремо.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4833d57d46ccb98e:
    english: "## Let members create templates"
    translation: "## Дозвіл учасникам створювати шаблони"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1ac138e713feea59:
    english: By default, only group admins can create and edit templates. An admin can enable **Members can create templates** under **Group settings** → **Permissions**.
    translation: За замовчуванням лише адміністратори групи можуть створювати й редагувати шаблони. Адміністратор може ввімкнути **Учасники можуть створювати шаблони** в розділі **Налаштування групи** → **Дозволи**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  889e8792d7937424:
    english: When this is enabled, members can create discussion and poll templates and edit the templates they created. Admins can edit every template in the group. A member's template appears in the group's template list once it is saved, so agree on naming and review practices before enabling this permission.
    translation: Після ввімкнення цього дозволу учасники можуть створювати шаблони обговорень і опитувань та редагувати створені ними шаблони. Адміністратори можуть редагувати всі шаблони групи. Збережений шаблон учасника з’являється в списку шаблонів групи, тому перед увімкненням дозволу узгодьте правила назв і перегляду шаблонів.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1284dfc3e68170d8:
    english: "## Templates for non-members"
    translation: "## Шаблони для людей поза групою"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5c701c3795724027:
    english: If **Non-members can start discussions** is enabled, people outside the group choose from the same template list. Their discussion form never invites the group by default. See [Collect private submissions](/en/user_manual/discussions/private_submissions).
    translation: Якщо ввімкнено **Неучасники можуть розпочинати обговорення**, люди поза групою вибирають шаблон із того самого списку. У їхній формі обговорення групу ніколи не запрошують за замовчуванням. Дивіться [Збір приватних подань](/en/user_manual/discussions/private_submissions).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  630a5d69a7093105:
    english: "## Related"
    translation: "## Пов’язані матеріали"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  32717eb37456dbfd:
    english: "- [Poll templates](/en/user_manual/polls/poll_templates)"
    translation: "- [Шаблони опитувань](/en/user_manual/polls/poll_templates)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
