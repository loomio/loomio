  2072a463e55dfba1:
    english: "# Advice"
    translation: "# Conselho"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  aadbf3844be4a95f:
    english: An Advice proposal gathers input for a decision that a person or team is responsible for making. Participants can offer advice or indicate that they have no advice to add.
    translation: Uma proposta de Conselho reúne contribuições para uma decisão que cabe a uma pessoa ou equipe tomar. Os participantes podem oferecer conselhos ou indicar que não têm nada a acrescentar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  769a2446fc3ec4a9:
    english: This page explains the Advice proposal form, voting, and results. See the [Advice process](/en/guides/making_decisions/advice_process) for the complete workflow from framing the decision to publishing an outcome.
    translation: Esta página explica o formulário da proposta de Conselho, a votação e os resultados. Consulte o [processo de Conselho](/en/guides/making_decisions/advice_process) para conhecer todas as etapas, desde a definição da decisão até a publicação da conclusão.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f19e32088d70eec4:
    english: "## When to use Advice"
    translation: "## Quando usar Conselho"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d4c7e7da6f2d5860:
    english: Use Advice when the decision maker wants input from people with relevant expertise or people affected by the decision. It works well for supplier choices, operational decisions, policy drafts, and decisions within a delegated role.
    translation: Use Conselho quando a pessoa responsável pela decisão quiser ouvir pessoas com conhecimento relevante ou afetadas pela decisão. É útil para escolher fornecedores, tomar decisões operacionais, elaborar políticas e decidir questões de uma função delegada.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a81e33e00080fbe4:
    english: Advice is not an approval vote. Say who will make the decision, what constraints apply, and how they will consider the responses.
    translation: Conselho não é uma votação para aprovar uma decisão. Informe quem tomará a decisão, quais são as restrições e como as respostas serão consideradas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4be7ef0783f6e444:
    english: "## Example: choose a washing supplier"
    translation: "## Exemplo: escolher um fornecedor de lavagem"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d8157e98107798c6:
    english: Oatmilk Cooperative's operations coordinator must select a washing supplier. They invite advice about capacity, food-safety records, water use, service response times, and support.
    translation: A pessoa responsável pelas operações da Cooperativa Oatmilk precisa escolher um fornecedor de lavagem. Ela convida outras pessoas a opinar sobre capacidade, registros de segurança alimentar, uso de água, tempo de resposta do serviço e suporte.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9703f1f9474243af:
    english: "## Set up the proposal"
    translation: "## Configure a proposta"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6b9c305f0f4000d9:
    english: Describe the decision, name the decision maker, and include the information participants need. Invite people who are affected or have relevant knowledge. The default options let someone offer advice or abstain.
    translation: Descreva a decisão, indique quem a tomará e inclua as informações necessárias para os participantes. Convide pessoas afetadas pela decisão ou com conhecimento relevante. As opções padrão permitem oferecer conselhos ou abster-se.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Vote"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0a259af7a59899b7:
    english: Participants select **Advice** and give a concrete recommendation, risk, question, or relevant experience. They can abstain when they have no useful input.
    translation: Os participantes selecionam **Conselho** e apresentam uma recomendação concreta, um risco, uma pergunta ou uma experiência relevante. Eles podem abster-se quando não têm uma contribuição útil.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Leia os resultados"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1d4bf7b5d0079f87:
    english: The chart confirms who has responded, but the reasons contain the substance of an Advice proposal. Look for constraints, agreements, and conflicting recommendations rather than treating the most common response as the decision.
    translation: O gráfico mostra quem respondeu, mas as justificativas trazem o conteúdo principal de uma proposta de Conselho. Procure restrições, pontos de concordância e recomendações divergentes. A resposta mais comum não determina a decisão.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e9fc01ce6c059f29:
    english: The decision maker publishes an outcome explaining what they decided and how the advice informed it.
    translation: A pessoa responsável pela decisão publica uma conclusão que explica o que decidiu e como os conselhos contribuíram para a decisão.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
