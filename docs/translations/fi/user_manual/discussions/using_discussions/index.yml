  885a21cbc1a44f7d:
    english: "**Notified** opens the discussion notification history. It includes invitations, mentions, and replies, showing who was notified and whether each notification has been read when that information is available."
    translation: "**Ilmoitettu** avaa keskustelun ilmoitushistorian. Siinä näkyvät kutsut, maininnat ja vastaukset sekä se, kenelle ilmoitus lähetettiin. Jos tieto on saatavilla, näet myös, onko ilmoitus luettu."
