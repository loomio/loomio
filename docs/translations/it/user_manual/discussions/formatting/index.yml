  b631d0ab368ebfb0:
    english: "## Insert link"
    translation: "## Inserisci collegamento"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  909769fda18f0ec6:
    english: 'You can add a link to any shareable document or page on the internet.  '
    translation: Puoi aggiungere un collegamento a qualsiasi documento condivisibile o pagina web.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e034be8c0fbe76db:
    english: 'To add a link:'
    translation: 'Per aggiungere un collegamento:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dcf90e79aba1a2f9:
    english: |-
      1. Select the text you want to link to - say the name of a document.
      2. Click the link icon.
      3. Paste the address into the **Insert link** field and select **Apply**.
    translation: |-
      1. Seleziona il testo da collegare, per esempio il nome di un documento.
      2. Seleziona l'icona del collegamento.
      3. Incolla l'indirizzo nel campo **Inserisci collegamento** e seleziona **Applica**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  40ecf7d0c79432b2:
    english: For a document hosted elsewhere, check its sharing permissions so discussion participants can open it.
    translation: Se il documento è ospitato altrove, controlla le sue autorizzazioni di condivisione affinché i partecipanti alla discussione possano aprirlo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3f1824fc07dded13:
    english: A preview of the doc will appear under the text space. You can remove this if you want.
    translation: Sotto il campo di testo apparirà un'anteprima del documento. Puoi rimuoverla.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c6061aa7deff27ac:
    english: Now, anyone with access to your Loomio discussion and permission to view the doc can open and read it.
    translation: Chi ha accesso alla tua discussione su Loomio e il permesso di visualizzare il documento può ora aprirlo e leggerlo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
