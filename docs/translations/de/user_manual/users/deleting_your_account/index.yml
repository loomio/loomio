navigation_title: Deinen Account löschen
blocks:
  b69fb514fd196dd7:
    english: "# Deleting your Loomio account"
    translation: "# Deinen Loomio-Account löschen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  941f0addde6f7326:
    english: "## What does delete account mean?"
    translation: "## Was bedeutet es, deinen Account zu löschen?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dab05d98ad64604f:
    english: |-
      When you delete your account:
      - Your user account including your name, email address and other personally identifying data will be deleted from our systems. You will not be able to sign in to Loomio with this account.
      - Comments, proposal and discussions you have made will remain but your name will be removed from them. We do this because we have an obligation to groups to keep threads and proposals coherent.
      - You will no longer be listed as a member of any groups.
      - You will no longer receive notification emails.
    translation: |-
      Wenn du deinen Account löschst:
      - Dein Benutzerkonto mit deinem Namen, deiner E-Mail-Adresse und anderen personenbezogenen Daten wird aus unseren Systemen gelöscht. Du kannst dich mit diesem Account nicht mehr bei Loomio anmelden.
      - Deine Kommentare, Vorschläge und Diskussionen bleiben erhalten, aber dein Name wird daraus entfernt. So bleiben Diskussionen und Vorschläge für die Gruppen nachvollziehbar.
      - Du wirst in keiner Gruppe mehr als Mitglied geführt.
      - Du erhältst keine Benachrichtigungen mehr per E-Mail.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dbeaf194bb8bd9e8:
    english: It is important to understand that copies of the data you have generated on Loomio have likely been emailed to everyone in the group - Loomio has no ability to delete those.
    translation: Kopien der Daten, die du auf Loomio erstellt hast, wurden wahrscheinlich per E-Mail an alle Mitglieder der Gruppe verschickt. Loomio kann diese Kopien nicht löschen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fa98dfeef486cf05:
    english: Deleting your account will _not_ cancel your subscription; to stop your payments see [Subscriptions](/en/policy/subscriptions/management#cancel-your-plan).
    translation: Wenn du deinen Account löschst, wird dein Abonnement _nicht_ gekündigt. Wie du deine Zahlungen beendest, erfährst du unter [Abonnements](/en/policy/subscriptions/management#cancel-your-plan).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c1ceda8f829133c7:
    english: Loomio has made fundamental decisions about its ownership, business model and software to protect users' rights. Loomio is an independent, worker-owned cooperative, the software is open source, you can [export your data](/en/user_manual/groups/data_export), and Loomio never sells your data or uses it for advertising. These commitments are set out in our [privacy policy](/en/policy/privacy) and grounded in the purpose and values in our [constitution](https://www.loomio.coop/constitution.html) and [cooperative handbook](https://www.loomio.coop/purpose_and_vision.html). If you have any questions, [contact us](/contact).
    translation: Loomio hat bei der Eigentumsstruktur, dem Geschäftsmodell und der Software grundlegende Entscheidungen zum Schutz der Rechte der Nutzer getroffen. Loomio ist eine unabhängige Genossenschaft im Besitz der Beschäftigten. Die Software ist quelloffen, du kannst [deine Daten exportieren](/en/user_manual/groups/data_export), und Loomio verkauft deine Daten nicht und nutzt sie nicht für Werbung. Diese Verpflichtungen stehen in unserer [Datenschutzerklärung](/en/policy/privacy) und beruhen auf dem Zweck und den Werten, die in unserer [Satzung](https://www.loomio.coop/constitution.html) und unserem [Genossenschaftshandbuch](https://www.loomio.coop/purpose_and_vision.html) beschrieben sind. Wenn du Fragen hast, [kontaktiere uns](/contact).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d8cc22d615b8f5d9:
    english: "## To delete your account entirely"
    translation: "## So löschst du deinen Account vollständig"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  77235d504409d763:
    english: Sign in to Loomio.  Go to the sidebar from the (☰) menu icon at screen top left Click on your account avatar or initials, at the top right of your screen.
    translation: Melde dich bei Loomio an. Öffne die Seitenleiste über das Menüsymbol (☰) oben links. Klicke dann oben rechts auf dein Profilbild oder deine Initialen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  04127f38282f6bd2:
    english: Click the down arrow ( ∨ ) alongside your name to open user settings. Select **Edit profile**.
    translation: Klicke auf den Pfeil nach unten ( ∨ ) neben deinem Namen, um die Benutzereinstellungen zu öffnen. Wähle **Profil bearbeiten**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  28b9f49f98d62fae:
    english: Scroll to the bottom, and click on **Delete account**.
    translation: Scrolle nach unten und klicke auf **Account löschen**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7151ebb20cf3efbb:
    english: A pop up will appear requesting confirmation that you wish to delete your account.
    translation: Ein Pop-up-Fenster erscheint und bittet dich zu bestätigen, dass du deinen Account löschen möchtest.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
