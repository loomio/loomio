navigation_title: Facilitando discussões
blocks:
  c377321bc013336b:
    english: "# Facilitating discussions"
    translation: "# Facilitando discussões"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b771c6c746b8dc40:
    english: 'At times topics arise that require the attention of board or committee members mid-cycle, between meetings. '
    translation: Às vezes, surgem assuntos que precisam da atenção dos membros do conselho ou de um comitê entre as reuniões.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b5fc5f12c8e44c40:
    english: And sometimes there is just not space during a meeting for discussion or to sufficiently deliberate on a decision.
    translation: Em outros casos, não há tempo suficiente durante uma reunião para discutir um assunto ou avaliar uma decisão com cuidado.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  79f2f83380e195c4:
    english: "## On Loomio"
    translation: "## No Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  14d5e62d33996982:
    english: Use a Loomio **thread** to facilitate a discussion.  Give the thread a descriptive title that members will recognize and provide details in the thread context.  Add a relevant category tag to help members find the thread in future.
    translation: Use um **tópico** do Loomio para facilitar uma discussão. Dê ao tópico um título descritivo que os membros reconheçam e inclua os detalhes no contexto. Adicione uma tag de categoria relevante para ajudar os membros a encontrar o tópico depois.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d35b4315f4e42cb:
    english: Notify members of the thread by inviting them, so they will receive a copy of the thread by email.  Members can participate in the discussion by clicking on the link to go to Loomio, or reply to the notification email and their comment will appear as a comment in the thread.
    translation: Convide os membros para o tópico para que recebam uma cópia por e-mail. Eles podem participar da discussão pelo link que leva ao Loomio ou responder ao e-mail de notificação. Nesse caso, a resposta aparecerá como um comentário no tópico.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f7d839f27c1a6f72:
    english: A Loomio thread enables you to attach files or link to online resources to support the discussion.
    translation: Em um tópico do Loomio, você pode anexar arquivos ou incluir links para recursos online que apoiem a discussão.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e45d25d90798cf1e:
    english: "Common examples include:\n- review and develop a policy\n- seek advice from the board about a topic or issue\n- discuss strategy \n- explore an idea or opportunity\n- assess risk"
    translation: |-
      Alguns exemplos comuns:
      - revisar e desenvolver uma política
      - pedir orientação ao conselho sobre um assunto ou problema
      - discutir a estratégia
      - explorar uma ideia ou oportunidade
      - avaliar riscos
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  86ace2adbcf3df6f:
    english: "## Issues that arise between board meetings"
    translation: "## Assuntos que surgem entre as reuniões do conselho"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  48f6023950ee0729:
    english: 'A lot can happen in an organization between meetings, and most people rely on email to alert board members.  Trying to keep track of a discussion on email is tricky, with replies often lost in in-boxes and people left out.  '
    translation: 'Muita coisa pode acontecer em uma organização entre as reuniões, e muitas pessoas recorrem ao e-mail para avisar os membros do conselho. Acompanhar uma discussão por e-mail é difícil: respostas podem se perder nas caixas de entrada e algumas pessoas podem ficar de fora.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1cb0e78c848b9621:
    english: "*“You can’t do governance by email!”, Richard Westlake (Westlake Governance).*"
    translation: "*“Não dá para fazer governança por e-mail!”, Richard Westlake (Westlake Governance).*"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  eddf348746c93b4c:
    english: 'When an issue arises requiring board attention, use a Loomio thread rather than email.  Members can reply via email and their comment will appear in the Loomio thread, keeping the discussion in one place. '
    translation: Quando surgir um assunto que precise da atenção do conselho, use um tópico do Loomio em vez de e-mail. Os membros podem responder por e-mail, e os comentários aparecerão no tópico do Loomio, mantendo a discussão em um só lugar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2f7ad89003f79fb8:
    english: |-
      Here's how:
      - Make the email subject line the title of your thread,
      - write your email content in the thread context,
      - invite your team to the thread with their email address or Loomio user name.
    translation: |-
      Veja como:
      - Use o assunto do e-mail como título do tópico,
      - escreva o conteúdo do e-mail no contexto do tópico,
      - convide sua equipe para o tópico pelo endereço de e-mail ou nome de usuário no Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9825cbb88dcedc3d:
    english: |-
      A Loomio thread means that:
      - All info about a topic is organized in one easily accessible place,
      - people can respond without generating reply/reply-all email chains that risk leaving people out,
      - you can see who has read the message and who needs a nudge,
      - you can progress actual work to an outcome, and cut down on the amount of email.
    translation: |-
      Com um tópico do Loomio:
      - Todas as informações sobre um assunto ficam organizadas em um lugar de fácil acesso,
      - as pessoas podem responder sem criar sequências de e-mails que deixam participantes de fora,
      - você pode ver quem leu a mensagem e quem precisa de um lembrete,
      - você pode levar o trabalho a uma conclusão e reduzir a quantidade de e-mails.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fb9adc7cb7922016:
    english: "## When there isn't space during meetings"
    translation: "## Quando falta tempo durante as reuniões"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6b1c61424aa7e74b:
    english: When an agenda item cannot be resolved within the time available in your board meeting, you can move this for further discussion to Loomio. Direct people to the relevant thread, or start a new one and notify your board members.
    translation: Se não houver tempo para resolver um item da pauta durante a reunião do conselho, continue a discussão no Loomio. Indique o tópico relevante às pessoas ou crie um novo e notifique os membros do conselho.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ced9caddb281230f:
    english: This relieves pressure on your board, allows more time for information gathering, discussion and deeper reflection which often results in a better quality decision.
    translation: Isso reduz a pressão sobre o conselho e dá mais tempo para reunir informações, discutir e refletir. Muitas vezes, esse processo leva a uma decisão melhor.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
