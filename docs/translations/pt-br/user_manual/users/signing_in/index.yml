  3bede807c136909b:
    english: On Loomio.com, you can sign in with a passkey, your email and password, an emailed sign-in code, or Google. You can choose whichever available method is most convenient for you.
    translation: No Loomio.com, você pode entrar com uma chave de acesso, seu e-mail e senha, um código enviado por e-mail ou sua conta do Google. Escolha o método disponível que for mais conveniente para você.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2bc2277a8ee0508d:
    english: "![The Loomio sign-in form with passkey, email, password, and emailed-code options](sign_in_email.png)"
    translation: "![Formulário de entrada do Loomio com opções de chave de acesso, e-mail, senha e código enviado por e-mail](sign_in_email.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e3daf63d410d5513:
    english: "## Sign in with a passkey"
    translation: "## Entrar com uma chave de acesso"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5c82bc1e8baa9f0b:
    english: Select **Use a passkey**. Your browser or device shows the Loomio passkeys available to you and asks you to unlock the selected passkey with its normal screen lock, fingerprint, face recognition, PIN, or security key. You do not enter an email address first.
    translation: 'Selecione **Use uma chave de acesso**. Seu navegador ou dispositivo mostra as chaves de acesso do Loomio disponíveis para você e pede que desbloqueie a chave escolhida com seu método habitual: bloqueio de tela, impressão digital, reconhecimento facial, PIN ou chave de segurança. Você não precisa informar seu endereço de e-mail antes.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9386303ee98cb592:
    english: You can add, name, and remove passkeys from your profile. For security, Loomio may ask you to sign in again before changing them. Give each passkey a recognizable name such as “Work laptop” or “Phone”. Passkeys are tied to the Loomio site where they were created and may be synchronized by your device or password manager.
    translation: Você pode adicionar, nomear e remover chaves de acesso no seu perfil. Por segurança, o Loomio pode pedir que você entre novamente antes de alterá-las. Dê a cada chave um nome fácil de reconhecer, como “Notebook do trabalho” ou “Celular”. As chaves de acesso estão vinculadas ao site do Loomio em que foram criadas e podem ser sincronizadas pelo seu dispositivo ou gerenciador de senhas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5f10999e671f9b56:
    english: "## Sign in with email and password"
    translation: "## Entrar com e-mail e senha"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5c8a380df0b08c86:
    english: Enter your email address and password, then select **Sign in**. For account privacy, Loomio uses the same error when the email or password cannot be used to sign in.
    translation: Digite seu endereço de e-mail e senha e selecione **Entrar**. Para proteger a privacidade das contas, o Loomio mostra o mesmo erro quando não é possível entrar com o e-mail ou a senha informados.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  63c19e6f58a1de53:
    english: If you have not added a passkey, Loomio offers to add one after you sign in with a password. You can dismiss the offer, and Loomio will remember your choice.
    translation: Se você ainda não adicionou uma chave de acesso, o Loomio oferece essa opção após você entrar com uma senha. Você pode dispensar a oferta, e o Loomio lembrará sua escolha.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dde79982546607b4:
    english: If you do not have a password or cannot remember it, select **Send me a code** instead.
    translation: Se você não tem uma senha ou não se lembra dela, selecione **Envie-me um código**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5f3c6f8eca20d49c:
    english: "## Get a sign-in code"
    translation: "## Receber um código para entrar"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9713c017e247d8e2:
    english: Select **Send me a code**, enter your email address, and submit the form. Loomio displays the same confirmation whether or not the address belongs to an account, so another person cannot use the form to discover who uses Loomio.
    translation: Selecione **Envie-me um código**, digite seu endereço de e-mail e envie o formulário. O Loomio mostra a mesma confirmação independentemente de o endereço pertencer a uma conta. Assim, ninguém pode usar o formulário para descobrir quem usa o Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  546aaa95b133da11:
    english: If the address belongs to your account, Loomio sends a six-digit code. Return to the sign-in form, enter the code, and select **Sign in**. Sign-in codes normally expire after 24 hours and cannot be reused. Check your spam folder if the message does not arrive, and make sure you entered the address associated with your account.
    translation: Se o endereço pertencer à sua conta, o Loomio enviará um código de seis dígitos. Volte ao formulário, digite o código e selecione **Entrar**. Os códigos normalmente expiram após 24 horas e não podem ser reutilizados. Se a mensagem não chegar, verifique a pasta de spam e confirme que você informou o endereço associado à sua conta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  26171d5996050130:
    english: "![The Loomio form for entering a six-digit sign-in code](sign_in_code.png)"
    translation: "![Formulário do Loomio para inserir um código de seis dígitos](sign_in_code.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '087809317d00494a':
    english: After each sign-in with a code, Loomio offers to set or replace your password. If your browser supports passkeys, you can also add one, even if you have already added a passkey on another device. A passkey lets you sign in quickly with your device’s fingerprint, face, or screen lock. You can skip the offer and continue using emailed codes.
    translation: Sempre que você entra com um código, o Loomio oferece a opção de definir ou substituir sua senha. Se seu navegador aceita chaves de acesso, você também pode adicionar uma, mesmo que já tenha adicionado outra em um dispositivo diferente. Com uma chave de acesso, você pode entrar rapidamente usando a impressão digital, o reconhecimento facial ou o bloqueio de tela do seu dispositivo. Você pode dispensar a oferta e continuar usando códigos enviados por e-mail.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fa960675e8369daf:
    english: "## Create an account"
    translation: "## Criar uma conta"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  75fc0885f772c8cf:
    english: Select **Create account** and follow the email-verification steps.
    translation: Selecione **Criar conta** e siga as etapas de verificação do e-mail.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  aa461253943b989a:
    english: For privacy, use the same email address that received your group invitation. If you have accounts under more than one address, you can [merge your accounts](/en/user_manual/users/merge_accounts).
    translation: Para preservar sua privacidade, use o mesmo endereço de e-mail em que recebeu o convite para o grupo. Se você tem contas com endereços diferentes, pode [mesclar suas contas](/en/user_manual/users/merge_accounts).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d9844ac27d806c35:
    english: "## Sign in with Google"
    translation: "## Entrar com o Google"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8445cfcb9e9ecef5:
    english: Select **Sign in with Google** and authenticate with your Google account. If an existing Loomio account has the same email address, Loomio links the Google identity to that account.
    translation: Selecione **Entrar com Google** e autentique-se com sua conta do Google. Se já existir uma conta do Loomio com o mesmo endereço de e-mail, o Loomio vinculará a identidade do Google a essa conta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  46281cafc4a889bf:
    english: "## Other Loomio sites"
    translation: "## Outros sites do Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  23c2dffa5d5056e2:
    english: Organizations that host their own Loomio site can configure different sign-in methods. A site may offer passwords, emailed codes, passkeys, Google, SAML, or another OAuth provider alongside each other.
    translation: Organizações que hospedam seu próprio site do Loomio podem configurar diferentes formas de entrar. Um site pode oferecer, ao mesmo tempo, senhas, códigos enviados por e-mail, chaves de acesso, Google, SAML ou outro provedor OAuth.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3de129c7bac50409:
    english: Some sites require an invitation before you can create an account. On these sites, **Create account** appears only when you follow an invitation link.
    translation: Alguns sites exigem um convite para você criar uma conta. Neles, **Criar conta** aparece apenas quando você acessa um link de convite.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  16004d08bcad640b:
    english: An SSO-only private site shows only its organization sign-in option. It does not offer Loomio-managed passwords, emailed sign-in codes, native account creation, or Loomio-managed passkeys. If the organization uses passkeys, its identity provider asks for them during SSO.
    translation: Um site privado que usa apenas SSO mostra somente a opção de entrar pela organização. Ele não oferece senhas, códigos enviados por e-mail, criação de contas ou chaves de acesso gerenciados pelo Loomio. Se a organização usa chaves de acesso, o provedor de identidade as solicita durante o SSO.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  148bcb52b49eb179:
    english: "## Sign out"
    translation: "## Sair"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dc9ad2d75eb9da48:
    english: Open the sidebar, select your name, then select **Sign out**. On a shared computer, sign out when you finish rather than closing only the browser tab.
    translation: Abra a barra lateral, selecione seu nome e depois **Sair**. Em um computador compartilhado, saia da sua conta ao terminar, em vez de apenas fechar a aba do navegador.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
