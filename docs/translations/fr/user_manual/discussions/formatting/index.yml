  7bda51ac3285357f:
    english: When starting or editing a discussion or poll, or writing a comment, you will see a formatting bar below the text field. Select the arrow at the end of the bar to show or hide the full set of tools.
    translation: Lorsque vous créez ou modifiez une discussion ou un sondage, ou que vous rédigez un commentaire, une barre de mise en forme apparaît sous le champ de texte. Cliquez sur la flèche au bout de la barre pour afficher ou masquer tous les outils.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2f2944ad10684b7f:
    english: Hover the mouse or cursor over each item for the name of each tool.
    translation: Passez le pointeur sur chaque icône pour voir le nom de l’outil.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5f45a085deb9eff1:
    english: Use formatting to add structure and emphasis so information is easier to scan.
    translation: Utilisez la mise en forme pour structurer le contenu et mettre en évidence les informations importantes.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
