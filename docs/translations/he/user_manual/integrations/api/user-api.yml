  fc4488304bf3735e:
    english: |-
      | Name | Description |
      | --- | --- |
      | `section` | Report section: `base`, `users`, or `countries`. Use `users` for per-person activity |
      | `group_scope` | `custom` or `my`. The legacy `all` value is treated as `my` because User API keys never receive instance-wide access |
      | `group_ids` | Comma-separated group IDs when `group_scope=custom`. IDs outside the API user's memberships are ignored |
      | `start_month` | First month to include in `YYYY-MM` format; defaults to 12 months ago |
      | `end_month` | Last month to include in `YYYY-MM` format; defaults to the current month |
      | `interval` | Interval for the `base` section: `day`, `week`, `month`, or `year` |
      | `member_type` | Set to `delegate` with `section=users` to return only current delegates |
    translation: |-
      | שם | תיאור |
      | --- | --- |
      | `section` | חלק בדוח: `base`, `users` או `countries`. עבור פעילות של כל אדם בנפרד יש להשתמש ב-`users` |
      | `group_scope` | `custom` או `my`. הערך הישן `all` מטופל כמו `my`, כי מפתחות API למשתמשים אינם מקנים גישה לכל המערכת |
      | `group_ids` | מזהי קבוצות מופרדים בפסיקים כאשר `group_scope=custom`. מזהים של קבוצות שחשבון ה-API אינו חבר בהן אינם נכללים |
      | `start_month` | החודש הראשון שייכלל בפורמט `YYYY-MM`; ברירת המחדל היא לפני 12 חודשים |
      | `end_month` | החודש האחרון שייכלל בפורמט `YYYY-MM`; ברירת המחדל היא החודש הנוכחי |
      | `interval` | מרווח הזמן עבור החלק `base`: `day`, `week`, `month` או `year` |
      | `member_type` | כדי להחזיר רק נציגים ונציגות נוכחיים, יש להגדיר `delegate` יחד עם `section=users` |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '09b3d2247802eae7':
    english: A person is a delegate when they have an active delegate membership in any selected group. Their counts are aggregated across all selected groups. Delegate rows are returned even when every activity count is zero. Counts cover threads, comments, polls, votes, outcomes, and reactions; they are not voting participation rates. User rows also include identified ballots issued, cast, and missed. Anonymous polls are excluded from all per-person voting counts. `all_votes_cast` is true only when at least one ballot was issued and every issued ballot was cast.
    translation: אדם נחשב לנציג או לנציגה כאשר יש לו חברות פעילה בתפקיד זה באחת הקבוצות שנבחרו. הספירות מצטברות מכל הקבוצות שנבחרו. שורות של נציגים ונציגות מוחזרות גם כשכל ספירות הפעילות הן אפס. הספירות כוללות שרשורים, תגובות, משאלים, הצבעות, מסקנות ותגובות רגשיות; הן אינן שיעורי השתתפות בהצבעה. שורות המשתמשים כוללות גם פתקי הצבעה מזוהים שהונפקו, שמולאו ושלא מולאו. משאלים אנונימיים אינם נכללים באף ספירת הצבעה אישית. הערך של `all_votes_cast` הוא true רק אם הונפק לפחות פתק הצבעה אחד וכל הפתקים שהונפקו מולאו.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  be9b5cd02a9b5930:
