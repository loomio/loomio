    translated_on: '2026-09-30'
  b8eb8dcae7d7a78b:
    english: Let's look at how to organize work, administer discussions, keep data safe and store records in Loomio.
    translation: Hier erfährst du, wie du in Loomio die Arbeit organisierst, Diskussionen verwaltest, Daten schützt und Aufzeichnungen archivierst.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a27011d28c4f11a6:
    english: "## Administering discussions"
    translation: "## Diskussionen verwalten"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8e67ece08e454475:
    english: There is a range of features in Loomio to help you administer discussions accessible from the drop down menu to the right of the discussion.
    translation: Loomio bietet mehrere Funktionen zur Verwaltung von Diskussionen. Du findest sie im Dropdown-Menü rechts neben der Diskussion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2d5be8c39f22ec28:
    english: 'Keep the discussion list current by using:'
    translation: 'Mit diesen Funktionen hältst du die Diskussionsliste aktuell:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  75739da1bd5910a6:
    english: |-
      - **Pin discussion** to keep important discussions at the top of the list
      - **Edit discussion** to change discussion title or update discussion context
      - **Move to group** when you want to move a discussion to another group or subgroup, or to an archive group.
      - **Lock thread** to prevent further comments or changes and remove the thread from the list of open threads. Locked threads are available under the discussion filter and from the search bar, and can be unlocked at any time.
      - **Delete discussion** when you do not want to keep a record of the discussion.  Note that deleted discussions can not be un-deleted.
    translation: |-
      - **Diskussion anpinnen**, damit wichtige Diskussionen oben in der Liste bleiben
      - **Diskussion bearbeiten**, um den Titel oder den Kontext einer Diskussion zu ändern
      - **Diskussion verschieben **, um eine Diskussion in eine andere Gruppe, Untergruppe oder Archivgruppe zu verschieben.
      - **Thread sperren**, um weitere Kommentare und Änderungen zu verhindern und den Thread aus der Liste offener Threads zu entfernen. Gesperrte Threads findest du über den Diskussionsfilter und die Suchleiste. Du kannst sie jederzeit entsperren.
      - **Diskussion löschen**, wenn du die Diskussion nicht aufbewahren möchtest. Gelöschte Diskussionen können nicht wiederhergestellt werden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e3d2099d0e6fe6fa:
    english: "## Category tags"
    translation: "## Schlagwörter"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  24b03357f6f6c3b9:
    english: Category tags are a great way to label discussions so they can be easily found. Set tags and apply to each discussion  - try to be consistent.
    translation: Mit Schlagwörtern kennzeichnest du Diskussionen, damit sie leicht zu finden sind. Lege Schlagwörter fest und verwende sie einheitlich für die Diskussionen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f0f5f5abd586fb61:
    english: 'Common board tags include: Administration, AGM, Board meeting, Report, Finance, Legal, Members, Minutes, Planning, Policy, Resolution, Constitution, General meeting, Strategy.'
    translation: 'Häufige Schlagwörter für Vorstände sind: Verwaltung, Jahreshauptversammlung, Vorstandssitzung, Bericht, Finanzen, Rechtliches, Mitglieder, Protokolle, Planung, Richtlinien, Beschluss, Satzung, Mitgliederversammlung, Strategie.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  89d8ec222f5019df:
    english: Group members can search for discussions by tag under the **tags** drop down menu.
    translation: Gruppenmitglieder können im Dropdown-Menü **Schlagwörter** nach Diskussionen mit einem bestimmten Schlagwort suchen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  54ee008489cceaca:
    english: "## Maintaining the discussion topic"
    translation: "## Beim Thema der Diskussion bleiben"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e9007433ca60ae39:
    english: Discussions work best for everyone when you can keep the discussion on a single topic.
    translation: Diskussionen sind für alle leichter zu verfolgen, wenn sie bei einem Thema bleiben.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f742ae07824b35c6:
    english: If a new topic is introduced in the middle of a discussion, you can select and move specific comments to another discussion, or start a new discussion.
    translation: Kommt während einer Diskussion ein neues Thema auf, kannst du einzelne Kommentare auswählen und in eine andere Diskussion verschieben oder eine neue Diskussion beginnen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c8b5176f58dceb8b:
    english: "## Subgroups"
    translation: "## Untergruppen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  79ad157a95adc8ef:
    english: Subgroups help you organize your communications and members so that the right people are engaged in their work together.  For example, you can use a subgroup for a subcommittee or working group.
    translation: Untergruppen helfen dir, die Kommunikation und die Mitglieder so zu organisieren, dass die richtigen Personen zusammenarbeiten. Du kannst zum Beispiel für einen Unterausschuss oder eine Arbeitsgruppe eine Untergruppe einrichten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0f4ebdab4c62be34:
