  40861d5640e63eef:
    english: "> _I've taken on board everyone's input. As the project manager, this is my call to make and I've decided we are going to extend the timeline by 10 days._"
    translation: "> _Ich habe die Beiträge aller Beteiligten berücksichtigt. Als Projektleiterin liegt die Entscheidung bei mir. Ich habe entschieden, dass wir den Zeitplan um 10 Tage verlängern._"
