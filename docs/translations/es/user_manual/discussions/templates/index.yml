---
navigation_title: Plantillas de discusión
blocks:
  80c5dfc46bb963d2:
    english: "# Discussion templates"
    translation: "# Plantillas de discusión"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  488fbd5167707cba:
    english: Discussion templates help your group start discussions the same way each time. A template can supply a title, context, tags, and instructions for the person starting the discussion. It also sets defaults, such as whether to notify the whole group and which polls to suggest.
    translation: Las plantillas de discusión ayudan a tu grupo a iniciar las discusiones de la misma manera cada vez. Una plantilla puede incluir un título, contexto, etiquetas e instrucciones para quien inicia la discusión. También establece valores predeterminados, como si se notificará a todo el grupo y qué sondeos se sugerirán.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2571bc9cc405d927:
    english: Every new discussion in a group starts from a template. When someone selects **Start discussion**, Loomio shows the group's templates. Even **Blank template** is a template, so your group can change its defaults too.
    translation: Cada nueva discusión de un grupo parte de una plantilla. Cuando alguien selecciona **Iniciar discusión**, Loomio muestra las plantillas del grupo. Incluso **Plantilla en blanco** es una plantilla, así que tu grupo también puede cambiar sus valores predeterminados.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  834ac31697ef254b:
    english: Templates work well for processes your group repeats, such as project reviews, advice processes, meeting preparation, funding decisions, or document approvals. The person starting the discussion can still edit everything before they start it.
    translation: Las plantillas son útiles para procesos que tu grupo repite, como revisiones de proyectos, consultas, preparación de reuniones, decisiones de financiación o aprobación de documentos. Quien inicia la discusión puede editarlo todo antes de iniciarla.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  74d1c850f63c0518:
    english: "## How templates are used"
    translation: "## Cómo se usan las plantillas"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6e5927441d982c01:
    english: |-
      1. A member selects **Start discussion** on the group page.
      2. Loomio lists the group's visible templates. Each one shows its title and subtitle.
      3. The member selects a template. Loomio opens the new discussion form, filled in from the template.
      4. The template's help appears at the top of the form as guidance.
      5. The member edits the title, context, tags, and invite list, then selects **Start discussion**.
    translation: |-
      1. Un miembro selecciona **Iniciar discusión** en la página del grupo.
      2. Loomio muestra las plantillas visibles del grupo. Cada una muestra su título y subtítulo.
      3. El miembro selecciona una plantilla. Loomio abre el formulario de nueva discusión con el contenido de la plantilla.
      4. La ayuda de la plantilla aparece en la parte superior del formulario.
      5. El miembro edita el título, el contexto, las etiquetas y la lista de invitados, y luego selecciona **Iniciar discusión**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  464984a60c23366b:
    english: Changing a template affects only discussions started after the change. Discussions already started from it keep their content and settings.
    translation: Los cambios en una plantilla solo afectan a las discusiones iniciadas después del cambio. Las discusiones ya iniciadas con ella conservan su contenido y configuración.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  70c22d24ec0d248b:
    english: "## Choose who is notified by default"
    translation: "## Elige a quién notificar de forma predeterminada"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  77feebf56c2ee9a7:
    english: 'The **Invite** setting controls who the new discussion form invites by default. It has two options:'
    translation: 'La opción **Invitar** controla a quién invita de forma predeterminada el formulario de nueva discusión. Tiene dos opciones:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6c93f4222436028f:
    english: |-
      - **Everyone in the group**: the group appears in the discussion form's **Invite** field, and every member is notified when the discussion starts.
      - **None**: the **Invite** field starts empty. Nobody is notified unless the author adds people.
    translation: |-
      - **Todos en el grupo**: el grupo aparece en el campo **Invitar** del formulario de discusión y cada miembro recibe una notificación cuando comienza la discusión.
      - **Ninguno**: el campo **Invitar** aparece vacío. Nadie recibe una notificación a menos que quien inicia la discusión añada personas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  17cca49613fff23d:
    english: Loomio's built-in templates, including **Blank template**, use **Everyone in the group**. If your group does not want every new discussion to notify all members, edit the templates your group uses and set **Invite** to **None**.
    translation: Las plantillas incluidas en Loomio, entre ellas **Plantilla en blanco**, usan **Todos en el grupo**. Si tu grupo no quiere que cada nueva discusión notifique a todos los miembros, edita las plantillas que utiliza y cambia **Invitar** a **Ninguno**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5fd184e64e0605bc:
    english: The author can always change the invite list before starting the discussion. They can remove the group to notify nobody, or add specific people instead. This setting only affects notifications. Group members can still find and read the discussion in the group, whichever option you choose.
    translation: Quien inicia la discusión siempre puede cambiar la lista de invitados antes de iniciarla. Puede quitar al grupo para no notificar a nadie o añadir personas concretas. Esta opción solo afecta a las notificaciones. Los miembros del grupo pueden encontrar y leer la discusión en el grupo con cualquiera de las dos opciones.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  58f24313ca36c890:
    english: The group is added to the invite list only when the author is allowed to notify the whole group. Admins can always do this. Members can do it when **Members can notify everyone in the group** is enabled in the group's permissions.
    translation: El grupo solo se añade a la lista de invitados cuando quien inicia la discusión tiene permiso para notificar a todo el grupo. Los administradores siempre pueden hacerlo. Los miembros pueden hacerlo si **Los miembros pueden notificar a cualquiera en el grupo** está habilitado en los permisos del grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  33afd174376e933b:
    english: "## Template settings"
    translation: "## Configuración de la plantilla"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b02be20543f228a7:
    english: 'Group admins can edit a template from the action menu beside it in the template list. The form has these settings:'
    translation: 'Los administradores del grupo pueden editar una plantilla desde el menú de acciones situado junto a ella en la lista de plantillas. El formulario incluye estas opciones:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f2fc57fe20100911:
    english: |-
      - **Template title**: the short name shown in the template list.
      - **Template subtitle**: one line explaining when to use the template.
      - **Template help**: instructions shown at the top of the new discussion form. Use it to explain the process and link to resources. It is not part of the discussion.
      - **Group**: whether the template starts a discussion in the group or a direct discussion. A direct discussion is visible only to the people invited to it.
      - **Default title**: a title filled in for each new discussion. The author can edit it.
      - **Example title**: an example shown in an empty title field. Use it when a default title would not fit every discussion.
      - **Tags**: tags applied to each new discussion. The author can remove them.
      - **Context**: the starting text of the discussion. Use headings, questions, or links to guide what people write.
      - **Invite**: whether to invite everyone in the group by default. See [Choose who is notified by default](#choose-who-is-notified-by-default).
      - **Poll templates**: polls suggested for this process. They are listed on the new discussion form. They also appear first when someone starts a poll in the discussion. They do not start automatically.
      - **Allow concurrent polls**: whether more than one poll can be open in the discussion at the same time.
      - **Comment length limit**: an optional maximum length for comments.
    translation: |-
      - **Título de la plantilla**: el nombre corto que aparece en la lista de plantillas.
      - **Subtítulo de plantilla**: una línea que explica cuándo usar la plantilla.
      - **Ayuda con la plantilla**: instrucciones que aparecen en la parte superior del formulario de nueva discusión. Úsalas para explicar el proceso y enlazar recursos. No forman parte de la discusión.
      - **Grupo**: indica si la plantilla inicia una discusión en el grupo o una discusión directa. Una discusión directa solo es visible para las personas invitadas.
      - **Título predeterminado**: un título que se rellena en cada nueva discusión. Quien la inicia puede editarlo.
      - **Título de ejemplo**: un ejemplo que aparece en un campo de título vacío. Úsalo cuando un título predeterminado no sirva para todas las discusiones.
      - **Etiquetas**: etiquetas que se aplican a cada nueva discusión. Quien la inicia puede quitarlas.
      - **Contexto**: el texto inicial de la discusión. Usa encabezados, preguntas o enlaces para orientar lo que escriben las personas.
      - **Invitar**: indica si se invita a todos los miembros del grupo de forma predeterminada. Consulta [Elige a quién notificar de forma predeterminada](#choose-who-is-notified-by-default).
      - **Plantillas de encuestas**: sondeos sugeridos para este proceso. Aparecen en el formulario de nueva discusión y también al principio de la lista cuando alguien inicia un sondeo en la discusión. No se inician automáticamente.
      - **Permitir sondeos simultáneos**: indica si puede haber más de un sondeo abierto a la vez en la discusión.
      - **Límite de longitud de los comentarios**: una longitud máxima opcional para los comentarios.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a9e44919507a613:
    english: Use a default title only when it will stay accurate. Otherwise, write an example title that prompts the author to name the specific review, period, document, or decision.
    translation: Usa un título predeterminado solo si seguirá siendo adecuado. De lo contrario, escribe un título de ejemplo que anime a quien inicia la discusión a indicar la revisión, el periodo, el documento o la decisión concreta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c5db289e27f54169:
    english: "## Example: bottle trial review"
    translation: "## Ejemplo: revisión de la prueba de botellas"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  89e7b8f9b36a8ae7:
    english: Oatmilk Cooperative reviews its returnable-bottle trial after each cycle. Its template is titled "Bottle trial review" and has a default title. It adds the "Bottle trial" tag. Its context asks members to read the weekly report and consider return rates, washing records, cafe feedback, and transport costs. It recommends a Sense check followed by Consent.
    translation: La Cooperativa Leche de Avena revisa su prueba de botellas retornables después de cada ciclo. Su plantilla se llama «Revisión de la prueba de botellas» y tiene un título predeterminado. Añade la etiqueta «Prueba de botellas». El contexto pide a los miembros que lean el informe semanal y consideren las tasas de devolución, los registros de lavado, los comentarios de las cafeterías y los costes de transporte. Recomienda primero un sondeo de comprobación y después uno de consentimiento.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f896031f8dcc2f84:
    english: This works as a template because the purpose and evidence stay the same each cycle. Only the observations and decisions change.
    translation: La plantilla sirve para este proceso porque el objetivo y la información que se revisa son los mismos en cada ciclo. Solo cambian las observaciones y las decisiones.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7e5955c442f6c8ae:
    english: "## Create a template"
    translation: "## Crea una plantilla"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c2b2bc41cbe6f6a:
    english: Group admins can select **New template** from the template list. Choose an example from Loomio's gallery or start with a blank template, then adapt it and save it.
    translation: Los administradores del grupo pueden seleccionar **Nueva plantilla** en la lista de plantillas. Elige un ejemplo de la galería de Loomio o empieza con una plantilla en blanco. Después, adáptala y guárdala.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a9cb80d574e2d865:
    english: You can search or filter the gallery. An example is not added to your group until you save it.
    translation: Puedes buscar o filtrar los ejemplos de la galería. Un ejemplo no se añade a tu grupo hasta que lo guardas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1f0dab3f50320e75:
    english: "## Manage the template list"
    translation: "## Gestiona la lista de plantillas"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7462593f2f6d1614:
    english: When a group is created, Loomio adds a set of templates suited to the kind of group. Only **Blank template** and **Practice discussion** are visible at first. The others are hidden, and admins can unhide them.
    translation: Al crear un grupo, Loomio añade un conjunto de plantillas adecuadas para ese tipo de grupo. Al principio, solo son visibles **Plantilla en blanco** y **Discusión práctica**. Las demás están ocultas y los administradores pueden mostrarlas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e6f7eaa63e353ef7:
    english: 'Group admins can use the action menu beside a template to:'
    translation: 'Los administradores del grupo pueden usar el menú de acciones junto a una plantilla para:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e8767178e42cd4e0:
    english: |-
      - edit its content and settings;
      - hide it from the template list;
      - unhide it from **Hidden templates**;
      - rearrange the order of visible templates;
      - export it as a JSON file; or
      - delete it.
    translation: |-
      - editar su contenido y configuración;
      - ocultarla de la lista de plantillas;
      - mostrarla desde **Plantillas ocultas**;
      - cambiar el orden de las plantillas visibles;
      - exportarla como archivo JSON; o
      - eliminarla.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5d4cbc918551c211:
    english: Hiding a template keeps it for later use. Deleting a template does not delete discussions started from it.
    translation: Si ocultas una plantilla, podrás volver a usarla más adelante. Si la eliminas, las discusiones iniciadas con ella permanecen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c0ae844752e20ef:
    english: "## Share templates between groups"
    translation: "## Comparte plantillas entre grupos"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  acf646688b9b79f4:
    english: Select **Export json** in a template's action menu to download it as a file. To use it in another group, select **New template**, then **Import json**. The form opens with the imported content so you can review it before saving.
    translation: Selecciona **Exportar json** en el menú de acciones de una plantilla para descargarla como archivo. Para usarla en otro grupo, selecciona **Nueva plantilla** y luego **Importar json**. El formulario se abre con el contenido importado para que puedas revisarlo antes de guardarlo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a168253bda3147e8:
    english: Links to custom poll templates are not included in the file. Export and import those poll templates separately.
    translation: El archivo no incluye enlaces a plantillas de encuestas personalizadas. Exporta e importa esas plantillas de encuestas por separado.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4833d57d46ccb98e:
    english: "## Let members create templates"
    translation: "## Permite que los miembros creen plantillas"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1ac138e713feea59:
    english: By default, only group admins can create and edit templates. An admin can enable **Members can create templates** under **Group settings** → **Permissions**.
    translation: De forma predeterminada, solo los administradores del grupo pueden crear y editar plantillas. Un administrador puede habilitar **Los miembros pueden crear plantillas** en **Configuración del grupo** → **Permisos**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  889e8792d7937424:
    english: When this is enabled, members can create discussion and poll templates and edit the templates they created. Admins can edit every template in the group. A member's template appears in the group's template list once it is saved, so agree on naming and review practices before enabling this permission.
    translation: Cuando esta opción está habilitada, los miembros pueden crear plantillas de discusión y de encuestas, y editar las que hayan creado. Los administradores pueden editar todas las plantillas del grupo. La plantilla de un miembro aparece en la lista del grupo en cuanto se guarda. Por eso, acordad cómo nombrar y revisar las plantillas antes de habilitar este permiso.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1284dfc3e68170d8:
    english: "## Templates for non-members"
    translation: "## Plantillas para personas que no son miembros"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5c701c3795724027:
    english: If **Non-members can start discussions** is enabled, people outside the group choose from the same template list. Their discussion form never invites the group by default. See [Collect private submissions](/en/user_manual/discussions/private_submissions).
    translation: Si **Los no miembros pueden iniciar debates** está habilitado, las personas ajenas al grupo eligen entre las mismas plantillas. Su formulario de discusión nunca invita al grupo de forma predeterminada. Consulta [Recopilar aportaciones privadas](/en/user_manual/discussions/private_submissions).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  630a5d69a7093105:
    english: "## Related"
    translation: "## Páginas relacionadas"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
