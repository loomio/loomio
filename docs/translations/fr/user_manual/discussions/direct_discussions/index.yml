  b3ed13f5612f4ff9:
    english: A direct discussion is a private discussion for a specific set of people.
    translation: Une discussion directe est une discussion privée réservée à des personnes précises.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  479f7faed056ab51:
    english: A direct discussion does not belong to a group. Invited people do not need to be a member of your Loomio group.
    translation: Une discussion directe n’appartient à aucun groupe. Les personnes invitées n’ont pas besoin d’être membres de votre groupe Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2f5362faecc07fa0:
    english: You control who can see and participate by adding people or email addresses to the **Invite** field.
    translation: Vous choisissez qui peut voir la discussion et y participer en ajoutant des personnes ou des adresses e-mail dans le champ **Inviter**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f31343ea54b4f899:
    english: Direct discussions support the same comments, polls and other tools as group discussions. They can be useful when creating a subgroup is unnecessary.
    translation: Les discussions directes disposent des mêmes commentaires, sondages et autres outils que les discussions de groupe. Elles sont utiles lorsqu’il n’est pas nécessaire de créer un sous-groupe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
