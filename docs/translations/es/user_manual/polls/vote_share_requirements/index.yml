  2051086558658db2:
    english: Set a vote share requirement on an option when a proposal must receive a particular percentage of support, or remain below a particular percentage of opposition, to pass.
    translation: Establece un porcentaje de votos requerido para una opción cuando una propuesta necesita alcanzar un porcentaje determinado de apoyo, o mantenerse por debajo de un porcentaje determinado de oposición, para aprobarse.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f00d3806d6b890ae:
    english: Vote share requirements can be combined with a [quorum](/en/user_manual/polls/quorum/) to require both sufficient participation and a particular distribution of votes.
    translation: Puedes combinar los requisitos de porcentaje de votos con un [cuórum](/en/user_manual/polls/quorum/) para exigir tanto una participación suficiente como una distribución determinada de los votos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0fc0acd12134f67e:
    english: When creating a proposal, select the edit icon beside an option.
    translation: Al crear una propuesta, selecciona el icono de edición junto a una opción.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  27979c31066e397f:
    english: "![The edit icon beside the Consent option](edit-highlight-on-option.png)"
    translation: "![El icono de edición junto a la opción Consentir](edit-highlight-on-option.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b3a4dee73762bea4:
    english: "## Eligible voters and votes cast"
    translation: "## Votantes elegibles y votos emitidos"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1d04d75fa16a2a18:
    english: The percentage can be based on either **Votes cast** or **Eligible voters**.
    translation: El porcentaje puede calcularse sobre los **Votos emitidos** o los **votantes elegibles**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  590e1a316f9ad174:
    english: "![Choosing whether a vote share requirement uses votes cast or eligible voters](./eligible-vs-cast.png)"
    translation: "![Elección de votos emitidos o votantes elegibles para calcular el porcentaje requerido](./eligible-vs-cast.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d4c72d50982e071d:
    english: "**Eligible voters** means everyone who is able to vote in the proposal. **Votes cast** means only the votes that have been submitted."
    translation: "**votantes elegibles** son todas las personas que pueden votar en la propuesta. **Votos emitidos** son únicamente los votos que se han enviado."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  24945a1a4f0d08e3:
    english: A requirement of 75 percent agreement from eligible voters can pass only when at least 75 percent of all eligible voters vote for that option.
    translation: Un requisito del 75 % de apoyo entre los votantes elegibles solo se cumple si al menos el 75 % de todas las personas elegibles vota por esa opción.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  14e4ff7cd000c7af:
    english: A requirement of 60 percent agreement from votes cast can pass when 60 percent of submitted votes support the option, regardless of overall turnout. Add a quorum when your process also requires a minimum level of participation.
    translation: Un requisito del 60 % de apoyo entre los votos emitidos se cumple si el 60 % de los votos enviados apoya la opción, independientemente de la participación total. Añade un cuórum si tu proceso también exige un nivel mínimo de participación.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a8f235434b40ecd9:
    english: "## Different vote share requirements"
    translation: "## Distintos requisitos de porcentaje de votos"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6682c9656815bdbc:
    english: 'A proposal can have requirements on more than one option. For example:'
    translation: 'Una propuesta puede tener requisitos en más de una opción. Por ejemplo:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dac1980305bef52d:
    english: |-
      - Agreement must be at least 75 percent of eligible voters
      - Abstention must be no more than 30 percent of votes cast
      - Block must be no more than 0 percent of votes cast
    translation: |-
      - El apoyo debe alcanzar al menos el 75 % de los votantes elegibles
      - La abstención no debe superar el 30 % de los votos emitidos
      - El bloqueo no debe superar el 0 % de los votos emitidos
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  11325e607f603eb7:
    english: You can also add requirements to a [poll template](/en/user_manual/polls/poll_templates/) so that new proposals created from the template use them by default.
    translation: También puedes añadir requisitos a una [plantilla de sondeo](/en/user_manual/polls/poll_templates/) para que las nuevas propuestas creadas a partir de ella los utilicen de forma predeterminada.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d6bffbdadc45e7f5:
    english: "## Detailed example"
    translation: "## Ejemplo detallado"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4318dab03fe217ad:
    english: Oatmilk Cooperative is deciding whether to approve the budget for its six-week returnable bottle trial. Five people are eligible to vote.
    translation: La cooperativa Oatmilk está decidiendo si aprueba el presupuesto de una prueba de seis semanas con botellas retornables. Cinco personas pueden votar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8f5779f2f1bb9ec3:
    english: Jamie uses the **Consent** proposal template, edits the Consent option, and enables its vote share requirement.
    translation: Jamie usa la plantilla de propuesta **Consentimiento**, edita la opción Consentir y activa su requisito de porcentaje de votos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  842038ffbd273e57:
    english: The cooperative's process requires at least 75 percent of eligible voters to support the proposal. Jamie sets the requirement to **At least 75% of Eligible voters**.
    translation: El proceso de la cooperativa exige el apoyo de al menos el 75 % de los votantes elegibles. Jamie establece el requisito en **Al menos el 75 % de los votantes elegibles**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5b852b2e7a9b3034:
    english: "![The Consent option requiring at least 75 percent of eligible voters](./consent-vote-option.png)"
    translation: "![La opción Consentir exige el apoyo de al menos el 75 % de los votantes elegibles](./consent-vote-option.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8a42a135c0c11c98:
    english: Jamie also sets a 60 percent quorum. Jamie and Samira vote in agreement. All submitted votes support the proposal, but they represent only 40 percent of eligible voters, so neither requirement has been reached.
    translation: Jamie también establece un cuórum del 60 %. Jamie y Samira votan a favor. Todos los votos emitidos apoyan la propuesta, pero representan solo el 40 % de los votantes elegibles. Por eso, aún no se cumple ninguno de los dos requisitos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2284440b974635e3:
    english: "![Two of five people have voted in agreement and neither requirement is reached](./first-vote-breakdown.png)"
    translation: "![Dos de las cinco personas han votado a favor y no se cumple ninguno de los requisitos](./first-vote-breakdown.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2cb3890f4ef20320:
    english: Alex and Morgan then agree, while Taylor disagrees. All five people have voted, reaching the quorum, and four of five eligible voters agree. The 80 percent agreement exceeds the 75 percent vote share requirement, so both requirements show green check marks.
    translation: Después, Alex y Morgan votan a favor, mientras que Taylor vota en contra. Las cinco personas han votado, por lo que se alcanza el cuórum, y cuatro de las cinco personas elegibles apoyan la propuesta. El 80 % de apoyo supera el requisito del 75 %, así que ambos requisitos muestran marcas verdes de verificación.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
