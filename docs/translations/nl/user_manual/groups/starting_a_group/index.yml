    translated_on: '2026-09-29'
  1a464543c51ded45:
    english: This short description will show at the top of the dashboard, to offer any necessary context for new members.
    translation: Deze korte beschrijving staat bovenaan het dashboard en geeft nieuwe leden de nodige context.
