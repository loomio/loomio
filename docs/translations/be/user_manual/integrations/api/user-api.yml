---
navigation_title: API карыстальніка
blocks:
  0217b93dddc627ac:
    english: "# Loomio User API documentation"
    translation: "# Дакументацыя API карыстальніка Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bc6fcbf5f783fd29:
    english: "<!-- seo-description: Use the Loomio User API to create and manage discussions, comments, polls, threads, and group memberships from other software. -->"
    translation: "<!-- seo-description: Выкарыстоўвайце API карыстальніка Loomio, каб ствараць абмеркаванні, каментарыі, апытанні і ніткі, а таксама кіраваць удзелам у групах з іншага праграмнага забеспячэння. -->"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cc2da08540808ada:
    english: "`/api/b2` is the user-oriented API for integrations with Loomio. It uses the API key of a user account, and every action is performed as that user."
    translation: "`/api/b2` — API для інтэграцый з Loomio, якія дзейнічаюць ад імя карыстальніка. Ён выкарыстоўвае ключ API ўліковага запісу, і кожнае дзеянне выконваецца ад імя гэтага карыстальніка."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7036a6661aac00f2:
    english: Group operations use the memberships and group permissions of the API-key user. Instance-administrator status does not expand an API key's access to groups or content; use the Server API for instance-level administration.
    translation: Аперацыі з групамі залежаць ад удзелу ў групах і правоў карыстальніка, якому належыць ключ API. Правы адміністратара сервера не пашыраюць доступ ключа API да груп або іх змесціва. Для адміністравання сервера выкарыстоўвайце API сервера.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c4436493b062b9f1:
    english: Use the API key from the Loomio user account that will perform the actions. A dedicated bot account is useful when an integration should not be invited to polls or receive notifications.
    translation: Выкарыстоўвайце ключ API ўліковага запісу Loomio, ад імя якога будуць выконвацца дзеянні. Асобны ўліковы запіс бота падыходзіць для інтэграцыі, якой не трэба атрымліваць запрашэнні да апытанняў або апавяшчэнні.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ade21c593f08100c:
    english: Signed-in users can find their API key and group IDs on the [API access page](/profile/api_access).
    translation: Карыстальнікі, якія ўвайшлі ў сістэму, могуць знайсці свой ключ API і ідэнтыфікатары груп на [старонцы доступу да API](/profile/api_access).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  15160edafaf441c1:
    english: 'Send the API key in an `Authorization: Bearer` header. API keys in query strings are rejected because URLs can be recorded by proxies and access logs.'
    translation: 'Перадавайце ключ API ў загалоўку `Authorization: Bearer`. Ключы API ў радку запыту адхіляюцца, бо URL-адрасы могуць захоўвацца ў журналах проксі-сервераў і доступу.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2215e57186277325:
    english: "### Authentication change"
    translation: "### Змена спосабу аўтэнтыфікацыі"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ff5f4c1055e80fb6:
    english: 'The API key was previously accepted as an `api_key` URL parameter. Requests using `?api_key=YOUR_API_KEY` no longer work. Use the HTTP `Authorization` header instead:'
    translation: 'Раней ключ API можна было перадаваць у параметры URL-адраса `api_key`. Запыты з `?api_key=YOUR_API_KEY` больш не працуюць. Замест гэтага выкарыстоўвайце HTTP-загаловак `Authorization`:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  65574ba500243c80:
    english: The examples use `YOUR_API_KEY`, group ID `123`, and `https://www.loomio.com/`. Replace these with your API key, group ID, and Loomio installation URL.
    translation: У прыкладах выкарыстоўваюцца `YOUR_API_KEY`, ідэнтыфікатар групы `123` і `https://www.loomio.com/`. Замяніце іх сваім ключом API, ідэнтыфікатарам групы і URL-адрасам вашага сервера Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bec1e4f30aeef4ce:
    english: "## Response size and related records"
    translation: "## Памер адказу і звязаныя запісы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  da004eb4e005fae1:
    english: 'User API responses use a compound format: the primary records are accompanied by related records such as topics, groups, users, polls, and reactions. This lets a client populate a local record store from one request, but can include more data than a simple integration needs.'
    translation: 'Адказы API карыстальніка маюць складаны фармат: разам з асноўнымі запісамі вяртаюцца звязаныя запісы, напрыклад тэмы, групы, карыстальнікі, апытанні і рэакцыі. Гэта дазваляе кліенту запоўніць лакальнае сховішча запісаў адным запытам, але аб''ём даных можа быць большым, чым патрэбна простай інтэграцыі.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  64d9a631b54cbaba:
    english: Pass `compact=1` to omit bulky related topics, groups, parent groups, memberships, reactions, tags, and translations. Primary records and the related records needed to interpret their content remain present.
    translation: Перадайце `compact=1`, каб выключыць аб'ёмныя звязаныя запісы тэм, груп, бацькоўскіх груп, удзелу ў групах, рэакцый, тэгаў і перакладаў. Асноўныя запісы і звязаныя запісы, неабходныя для разумення іх змесціва, застануцца ў адказе.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e4e671db39dbe6f1:
    english: For direct control, pass `exclude_types` with space-separated singular record types. For example, `exclude_types=group reaction` omits related groups and reactions. Common values are `topic`, `group`, `parent`, `membership`, `reaction`, `tag`, `translation`, `user`, `discussion`, `poll`, `poll_option`, `stance`, `stance_choice`, `outcome`, and `topic_item`. Exclusions apply to related records, not the primary resource requested by the endpoint.
    translation: 'Для дакладнейшага кіравання перадайце `exclude_types` з тыпамі запісаў у адзіночным ліку, падзеленымі прабеламі. Напрыклад, `exclude_types=group reaction` выключае звязаныя групы і рэакцыі. Распаўсюджаныя значэнні: `topic`, `group`, `parent`, `membership`, `reaction`, `tag`, `translation`, `user`, `discussion`, `poll`, `poll_option`, `stance`, `stance_choice`, `outcome` і `topic_item`. Выключэнні тычацца звязаных запісаў, а не асноўнага рэсурсу, запытанага праз гэты адрас API.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ded075da3c2aa815:
    english: Collection responses include `meta.total` when an exact collection size is defined. The total is calculated before `limit` and `offset` are applied. Endpoints such as search that intentionally return a bounded result set omit `meta.total` rather than returning `null`.
    translation: Адказы з калекцыямі ўтрымліваюць `meta.total`, калі можна вызначыць дакладны памер калекцыі. Агульная колькасць вылічаецца да прымянення `limit` і `offset`. Адрасы API, якія наўмысна вяртаюць абмежаваны набор вынікаў, напрыклад пошук, не ўключаюць `meta.total` замест вяртання `null`.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  17cb8ef90a2acdb3:
    english: "## Endpoint summary"
    translation: "## Агляд адрасоў API"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  608edb13080e57c2:
    english: |-
      | Method | Endpoint | Purpose |
      | --- | --- | --- |
      | `GET` | `/api/b2/groups` | List the API-key user's groups |
      | `GET` | `/api/b2/groups/:id_or_key_or_handle` | Get a visible group |
      | `GET` | `/api/b2/reports` | Generate a participation report |
      | `GET` | `/api/b2/search` | Search visible discussions, comments, polls, votes, and outcomes |
      | `POST` | `/api/b2/discussions` | Create a discussion |
      | `GET` | `/api/b2/discussions/:id` | Get a discussion |
      | `GET` | `/api/b2/discussions` | List discussions in a group |
      | `PATCH` | `/api/b2/discussions/:id` | Edit a discussion |
      | `DELETE` | `/api/b2/discussions/:id` | Soft-delete a discussion |
      | `GET` | `/api/b2/threads` | List visible discussion and standalone-poll threads |
      | `GET` | `/api/b2/threads/:topic_id` | Get a thread |
      | `GET` | `/api/b2/threads/:topic_id/items` | Get the ordered items in a thread |
      | `GET` | `/api/b2/threads/:topic_id/markdown` | Get a complete thread as Markdown |
      | `POST` | `/api/b2/comments` | Create a comment or reply |
      | `PATCH` | `/api/b2/comments/:id` | Edit a comment |
      | `DELETE` | `/api/b2/comments/:id` | Soft-delete a comment |
      | `POST` | `/api/b2/polls` | Create a poll |
      | `GET` | `/api/b2/polls/:id` | Get a poll |
      | `GET` | `/api/b2/polls` | List polls in a group |
      | `PATCH` | `/api/b2/polls/:id` | Edit a poll |
      | `DELETE` | `/api/b2/polls/:id` | Soft-delete a poll |
      | `GET` | `/api/b2/memberships` | List a group's memberships |
      | `POST` | `/api/b2/memberships` | Add members and optionally remove absent members |
      | `GET` | `/api/b2/chatbots` | List a group's chat integrations and webhooks |
      | `POST` | `/api/b2/chatbots` | Create a chat integration or webhook |
      | `PATCH` | `/api/b2/chatbots/:id` | Update a chat integration or webhook |
      | `DELETE` | `/api/b2/chatbots/:id` | Delete a chat integration or webhook |
      | `POST` | `/api/b2/chatbots/check` | Send a webhook connection test |
    translation: |-
      | Метад | Адрас API | Прызначэнне |
      | --- | --- | --- |
      | `GET` | `/api/b2/groups` | Атрымаць спіс груп карыстальніка, якому належыць ключ API |
      | `GET` | `/api/b2/groups/:id_or_key_or_handle` | Атрымаць даступную групу |
      | `GET` | `/api/b2/reports` | Стварыць справаздачу аб удзеле |
      | `GET` | `/api/b2/search` | Шукаць даступныя абмеркаванні, каментарыі, апытанні, галасы і высновы |
      | `POST` | `/api/b2/discussions` | Стварыць абмеркаванне |
      | `GET` | `/api/b2/discussions/:id` | Атрымаць абмеркаванне |
      | `GET` | `/api/b2/discussions` | Атрымаць спіс абмеркаванняў у групе |
      | `PATCH` | `/api/b2/discussions/:id` | Рэдагаваць абмеркаванне |
      | `DELETE` | `/api/b2/discussions/:id` | Мякка выдаліць абмеркаванне |
      | `GET` | `/api/b2/threads` | Атрымаць спіс даступных нітак абмеркаванняў і асобных апытанняў |
      | `GET` | `/api/b2/threads/:topic_id` | Атрымаць нітку |
      | `GET` | `/api/b2/threads/:topic_id/items` | Атрымаць элементы ніткі па парадку |
      | `GET` | `/api/b2/threads/:topic_id/markdown` | Атрымаць поўную нітку ў фармаце Markdown |
      | `POST` | `/api/b2/comments` | Стварыць каментарый або адказ |
      | `PATCH` | `/api/b2/comments/:id` | Рэдагаваць каментарый |
      | `DELETE` | `/api/b2/comments/:id` | Мякка выдаліць каментарый |
      | `POST` | `/api/b2/polls` | Стварыць апытанне |
      | `GET` | `/api/b2/polls/:id` | Атрымаць апытанне |
      | `GET` | `/api/b2/polls` | Атрымаць спіс апытанняў у групе |
      | `PATCH` | `/api/b2/polls/:id` | Рэдагаваць апытанне |
      | `DELETE` | `/api/b2/polls/:id` | Мякка выдаліць апытанне |
      | `GET` | `/api/b2/memberships` | Атрымаць спіс удзельнікаў групы |
      | `POST` | `/api/b2/memberships` | Дадаць удзельнікаў і, пры неабходнасці, выдаліць тых, каго няма ў спісе |
      | `GET` | `/api/b2/chatbots` | Атрымаць спіс інтэграцый з чатам і вэбхукаў групы |
      | `POST` | `/api/b2/chatbots` | Стварыць інтэграцыю з чатам або вэбхук |
      | `PATCH` | `/api/b2/chatbots/:id` | Абнавіць інтэграцыю з чатам або вэбхук |
      | `DELETE` | `/api/b2/chatbots/:id` | Выдаліць інтэграцыю з чатам або вэбхук |
      | `POST` | `/api/b2/chatbots/check` | Адправіць тэставы запыт для праверкі падключэння вэбхука |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0473f1f7fb78f074:
    english: "## Groups"
    translation: "## Групы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dc819221f371c435:
    english: "### List groups"
    translation: "### Спіс груп"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  964f575e90aa9cde:
    english: Return the groups in which the API-key user has an active membership.
    translation: Вяртае групы, у якіх карыстальнік, якому належыць ключ API, мае актыўны ўдзел.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3835e6e77bc0ad10:
    english: "`GET /api/b2/groups`"
    translation: "`GET /api/b2/groups`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4f588e981afc3069:
    english: The response contains all matching records in a non-paginated `groups` array. It includes parent groups and subgroups, including groups whose subscription is not currently active. Check the `enabled` field when an integration should operate only on enabled groups.
    translation: Адказ утрымлівае ўсе адпаведныя запісы ў масіве `groups` без падзелу на старонкі. Ён уключае бацькоўскія групы і падгрупы, у тым ліку групы, падпіска якіх цяпер неактыўная. Правярайце поле `enabled`, калі інтэграцыя павінна працаваць толькі з актыўнымі групамі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  213de8ce539a42c3:
    english: 'Important group fields include:'
    translation: 'Асноўныя палі групы:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d377f7c9b224a6d7:
    english: |-
      | Field | Description |
      | --- | --- |
      | `id` | Numeric group ID used by other User API endpoints |
      | `key` | Stable short key used in Loomio URLs |
      | `handle` | Human-readable group handle |
      | `name` | Group name |
      | `full_name` | Group name including its parent-group context |
      | `parent_id` | Numeric parent-group ID for a subgroup, otherwise `null` |
      | `enabled` | Whether the group and its subscription are active |
      | `memberships_count` | Number of active and pending memberships |
      | `accepted_memberships_count` | Number of accepted memberships |
      | `pending_memberships_count` | Number of pending invitations |
      | `admin_memberships_count` | Number of group administrators |
      | `delegates_count` | Number of delegates |
      | `discussions_count` | Number of discussions directly in the group |
      | `polls_count` | Number of polls directly in the group |
      | `subgroups_count` | Number of subgroups |
    translation: |-
      | Поле | Апісанне |
      | --- | --- |
      | `id` | Лічбавы ідэнтыфікатар групы, які выкарыстоўваюць іншыя адрасы API карыстальніка |
      | `key` | Сталы кароткі ключ, які выкарыстоўваецца ў URL-адрасах Loomio |
      | `handle` | Зразумелы людзям ідэнтыфікатар групы |
      | `name` | Назва групы |
      | `full_name` | Назва групы з улікам яе бацькоўскай групы |
      | `parent_id` | Лічбавы ідэнтыфікатар бацькоўскай групы для падгрупы, інакш `null` |
      | `enabled` | Ці актыўныя група і яе падпіска |
      | `memberships_count` | Колькасць актыўных удзельнікаў і тых, хто чакае далучэння |
      | `accepted_memberships_count` | Колькасць прынятых запрашэнняў да ўдзелу |
      | `pending_memberships_count` | Колькасць запрашэнняў, якія чакаюць адказу |
      | `admin_memberships_count` | Колькасць адміністратараў групы |
      | `delegates_count` | Колькасць дэлегатаў |
      | `discussions_count` | Колькасць абмеркаванняў непасрэдна ў групе |
      | `polls_count` | Колькасць апытанняў непасрэдна ў групе |
      | `subgroups_count` | Колькасць падгруп |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  34f1693ba28fcb80:
    english: The response may include additional group settings, related parent-group records and the API user's memberships. Clients should ignore fields they do not use.
    translation: Адказ можа таксама ўтрымліваць дадатковыя налады групы, звязаныя запісы бацькоўскай групы і звесткі пра ўдзел карыстальніка API ў групах. Кліенты павінны ігнараваць палі, якія ім не патрэбныя.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d7c327b8ed7f7bf2:
    english: "### Get a group"
    translation: "### Атрымаць групу"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  15ab63bc2d396657:
    english: Return one group visible to the API-key user.
    translation: Вяртае адну групу, даступную карыстальніку, якому належыць ключ API.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8ba2cc9e3c67b1dd:
    english: "`GET /api/b2/groups/:id_or_key_or_handle`"
    translation: "`GET /api/b2/groups/:id_or_key_or_handle`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  71e5812ff9890c9b:
    english: The identifier can be the group's numeric ID, key or handle.
    translation: Ідэнтыфікатарам можа быць лічбавы ID групы, яе ключ або кароткая назва.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8ba79a283b7b77d5:
    english: The response contains the group in the `groups` array and uses the same fields as the list endpoint. A request for a group the API-key user cannot access returns a permission error.
    translation: Адказ утрымлівае групу ў масіве `groups` з тымі ж палямі, што і адрас API для спісу груп. Запыт групы, да якой карыстальнік з ключом API не мае доступу, вяртае памылку правоў доступу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  18d823df4d7f8fac:
    english: "## Webhooks"
    translation: "## Вэбхукі"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f33d58fc1f2fd84c:
    english: 'The User API is request-based: an integration calls Loomio when it wants to read or change data. A group webhook provides the push direction. Loomio sends selected group events to your endpoint as they happen, so an integration does not need to poll the REST API for changes.'
    translation: 'API карыстальніка працуе праз запыты: інтэграцыя звяртаецца да Loomio, калі хоча прачытаць або змяніць даныя. Вэбхук групы перадае даныя ў адваротным кірунку. Loomio адпраўляе выбраныя падзеі групы на ваш адрас API адразу пасля іх узнікнення, таму інтэграцыі не трэба рэгулярна апытваць REST API пра змены.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3b5b4b0ac52b9010:
    english: 'Webhooks are configured per group and require group-administrator permission. They can be managed through the Loomio interface:'
    translation: 'Вэбхукі наладжваюцца асобна для кожнай групы. Для гэтага патрэбныя правы адміністратара групы. Кіраваць імі можна праз інтэрфейс Loomio:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  318710be7b3aae7d:
    english: |-
      1. Open the group.
      2. Open the group menu and select **Chat integrations**.
      3. Add the integration matching the payload format your endpoint accepts. For a general-purpose endpoint, use the Mattermost/Markdown format.
      4. Enter a name and the destination URL.
      5. Select the events that Loomio should send automatically.
      6. Save the integration and use **Test connection** to send a test message.
    translation: |-
      1. Адкрыйце групу.
      2. Адкрыйце меню групы і выберыце **Інтэграцыі з чатам**.
      3. Дадайце інтэграцыю з фарматам даных, які прымае ваш адрас API. Для адраса агульнага прызначэння выкарыстоўвайце фармат Mattermost/Markdown.
      4. Увядзіце назву і URL-адрас атрымальніка.
      5. Выберыце падзеі, якія Loomio павінен адпраўляць аўтаматычна.
      6. Захавайце інтэграцыю і націсніце **Тэставае падключэнне**, каб адправіць тэставае паведамленне.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  43fb95cf304fced6:
    english: Use an HTTPS destination with an unguessable URL. Loomio requires the destination to resolve to a public address and blocks requests to local or private network addresses.
    translation: Выкарыстоўвайце HTTPS-адрас атрымальніка, які немагчыма адгадаць. Loomio патрабуе, каб адрас вёў да публічнага IP-адраса, і блакуе запыты да лакальных або прыватных сеткавых адрасоў.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d8d5abffe6425bea:
    english: Agents and other integrations can instead manage webhooks through the Bearer-authenticated chatbot endpoints described below. The resource is named `chatbots` for compatibility with Loomio's chat integrations, but it also represents general outgoing webhooks.
    translation: Агенты і іншыя інтэграцыі могуць кіраваць вэбхукамі праз апісаныя ніжэй адрасы API чат-ботаў з аўтэнтыфікацыяй Bearer. Рэсурс называецца `chatbots` дзеля сумяшчальнасці з інтэграцыямі Loomio з чатам, але ён таксама прадстаўляе звычайныя выходныя вэбхукі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  28fb6371af33b66f:
    english: "### List webhooks"
    translation: "### Спіс вэбхукаў"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7187e5a26c3ec864:
    english: Return the chat integrations configured for a group. The API-key user must be an administrator of that group. The response includes destination URLs, so it must not be exposed to ordinary group members.
    translation: Вяртае інтэграцыі з чатам, наладжаныя для групы. Карыстальнік, якому належыць ключ API, павінен быць адміністратарам гэтай групы. Адказ утрымлівае URL-адрасы атрымальнікаў, таму яго нельга паказваць звычайным удзельнікам групы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  788d370538bdda46:
    english: "`GET /api/b2/chatbots?group_id=123`"
    translation: "`GET /api/b2/chatbots?group_id=123`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d676ca45c3e1074a:
    english: 'The response contains a `chatbots` array with these fields:'
    translation: 'Адказ утрымлівае масіў `chatbots` з наступнымі палямі:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ca00f7d0a52ce803:
    english: |-
      | Field | Description |
      | --- | --- |
      | `id` | Integration ID used for updates and deletion |
      | `group_id` | Group receiving the events |
      | `name` | Administrative name for the integration |
      | `kind` | `webhook` for an outgoing webhook or `matrix` for a Matrix integration |
      | `webhook_kind` | Payload format: `markdown`, `slack`, `discord`, `microsoft`, or `webex` |
      | `server` | Destination URL |
      | `event_kinds` | Events sent automatically |
      | `notification_only` | Whether messages contain only the notification headline |
    translation: |-
      | Поле | Апісанне |
      | --- | --- |
      | `id` | ID інтэграцыі для абнаўлення і выдалення |
      | `group_id` | Група, падзеі якой перадаюцца |
      | `name` | Назва інтэграцыі для адміністравання |
      | `kind` | `webhook` для выходнага вэбхука або `matrix` для інтэграцыі з Matrix |
      | `webhook_kind` | Фармат даных: `markdown`, `slack`, `discord`, `microsoft` або `webex` |
      | `server` | URL атрымальніка |
      | `event_kinds` | Падзеі, якія адпраўляюцца аўтаматычна |
      | `notification_only` | Ці змяшчаюць паведамленні толькі загаловак апавяшчэння |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d72d8237eded6fdd:
    english: "### Create a webhook"
    translation: "### Стварыць вэбхук"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e33c05cb2770fe21:
    english: "`POST /api/b2/chatbots`"
    translation: "`POST /api/b2/chatbots`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  acee55f2470a1eef:
    english: The API-key user must be an administrator of `group_id`. The destination is validated as a public URL before it is saved.
    translation: Карыстальнікам, якому належыць ключ API, патрэбныя правы адміністратара групы `group_id`. Перад захаваннем правяраецца, ці вядзе URL атрымальніка на агульнадаступны адрас.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  05d9e1cdc6185f85:
    english: "### Update a webhook"
    translation: "### Абнавіць вэбхук"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  eb7a96b45abe57c2:
    english: "`PATCH /api/b2/chatbots/:id`"
    translation: "`PATCH /api/b2/chatbots/:id`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2696d4fd91cd5f6f:
    english: Send any fields that should change. The webhook cannot be transferred to another group by changing `group_id`.
    translation: Перадайце палі, якія трэба змяніць. Змяніць групу вэбхука праз поле `group_id` нельга.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e56bb884ce5ef3c5:
    english: "### Test a webhook destination"
    translation: "### Праверыць адрас вэбхука"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  10c1e636b20121c2:
    english: Send a Markdown-compatible test message to a destination before or after saving its configuration.
    translation: Адпраўце на адрас тэставае паведамленне ў фармаце, сумяшчальным з Markdown. Гэта можна зрабіць да або пасля захавання канфігурацыі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cf0e0fae3c68178d:
    english: "`POST /api/b2/chatbots/check`"
    translation: "`POST /api/b2/chatbots/check`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fcb55f73325b9f2a:
    english: "### Delete a webhook"
    translation: "### Выдаліць вэбхук"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f7e12256467f6c49:
    english: "`DELETE /api/b2/chatbots/:id`"
    translation: "`DELETE /api/b2/chatbots/:id`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f158f3939e36074c:
    english: Deleting the configuration stops future deliveries. It does not delete any Loomio group content.
    translation: Пасля выдалення канфігурацыі новыя паведамленні больш не адпраўляюцца. Змесціва групы ў Loomio не выдаляецца.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f0fe37689a7c3646:
    english: "### Event types"
    translation: "### Тыпы падзей"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  066ca1423e999efa:
    english: 'A webhook can subscribe to these event types:'
    translation: 'Вэбхук можа атрымліваць паведамленні пра наступныя тыпы падзей:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  82962625b0583140:
    english: |-
      | Event | When it is sent |
      | --- | --- |
      | `new_discussion` | A discussion is started |
      | `discussion_edited` | A discussion is edited |
      | `new_comment` | A comment is created |
      | `poll_created` | A poll is started |
      | `poll_edited` | A poll is edited |
      | `poll_closing_soon` | A poll is approaching its closing time |
      | `poll_expired` | A poll reaches its closing time |
      | `poll_closed_by_user` | A person closes a poll manually |
      | `poll_reopened` | A poll is reopened |
      | `outcome_created` | An outcome is published |
      | `outcome_updated` | An outcome is updated |
      | `outcome_review_due` | An outcome review becomes due |
      | `stance_created` | A vote is cast |
      | `stance_updated` | A vote is changed |
    translation: |-
      | Падзея | Калі адпраўляецца |
      | --- | --- |
      | `new_discussion` | Пачынаецца абмеркаванне |
      | `discussion_edited` | Рэдагуецца абмеркаванне |
      | `new_comment` | Ствараецца каментарый |
      | `poll_created` | Пачынаецца апытанне |
      | `poll_edited` | Рэдагуецца апытанне |
      | `poll_closing_soon` | Набліжаецца час закрыцця апытання |
      | `poll_expired` | Надыходзіць час закрыцця апытання |
      | `poll_closed_by_user` | Апытанне закрываюць уручную |
      | `poll_reopened` | Апытанне адкрываюць паўторна |
      | `outcome_created` | Публікуецца выснова |
      | `outcome_updated` | Абнаўляецца выснова |
      | `outcome_review_due` | Надыходзіць час перагледзець выснову |
      | `stance_created` | Падаецца голас |
      | `stance_updated` | Змяняецца голас |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ed1d3fc4a6fb67b9:
    english: The webhook belongs to one group and receives subscribed events from that group. People can also explicitly select the integration when sharing or sending some notifications, even when the corresponding automatic event is not selected.
    translation: Вэбхук належыць адной групе і атрымлівае паведамленні пра выбраныя падзеі гэтай групы. Людзі таксама могуць самі выбраць інтэграцыю, калі дзеляцца змесцівам або адпраўляюць некаторыя апавяшчэнні, нават калі адпаведная аўтаматычная падзея не выбрана.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  512f0701765b66ec:
    english: "### HTTP delivery"
    translation: "### Дастаўка праз HTTP"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dca082a687dc5505:
    english: 'Loomio sends an asynchronous HTTP `POST` to the configured URL with this header:'
    translation: 'Loomio асінхронна адпраўляе HTTP-запыт `POST` на зададзены URL з наступным загалоўкам:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a4f66c4c94afa135:
    english: The request timeout is five seconds. A `2xx` response, including `204 No Content`, is treated as successful. Webhook consumers should respond promptly, process longer work asynchronously, and tolerate duplicate or out-of-order deliveries.
    translation: Час чакання адказу складае пяць секунд. Любы адказ `2xx`, у тым ліку `204 No Content`, лічыцца паспяховым. Сэрвісам, якія прымаюць вэбхукі, варта адказваць хутка, выконваць працяглую апрацоўку асінхронна і ўлічваць магчымасць паўторнай дастаўкі або дастаўкі не ў парадку адпраўкі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  84faa7dad6f34739:
    english: Loomio does not currently add a webhook signature, shared-secret header, event ID, or delivery ID. Treat the full destination URL as a credential, do not expose it publicly, and include an unguessable token in the URL when the receiving service supports one. If a stable machine-readable event schema or signed delivery is required, use the webhook as a change notification and retrieve the current records through the authenticated User API.
    translation: Цяпер Loomio не дадае подпіс вэбхука, загаловак з агульным сакрэтам, ID падзеі або ID дастаўкі. Лічыце поўны URL атрымальніка ўліковымі данымі і не публікуйце яго. Калі сэрвіс-атрымальнік падтрымлівае гэта, уключыце ў URL токен, які немагчыма адгадаць. Калі патрэбная стабільная схема падзей для машыннай апрацоўкі або дастаўка з подпісам, выкарыстоўвайце вэбхук як апавяшчэнне пра змену, а актуальныя запісы атрымлівайце праз API карыстальніка з аўтэнтыфікацыяй.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f3d956b4694f793c:
    english: "### Payload formats"
    translation: "### Фарматы даных"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  deed1ccba8a70ac2:
    english: Webhook payloads are presentation-oriented messages intended for chat services. They are not complete serialized Loomio records. Links in the message identify the affected Loomio content; an integration can follow up through the User API when it needs structured current state.
    translation: Даныя вэбхукаў — гэта паведамленні для чат-сэрвісаў, а не поўныя серыялізаваныя запісы Loomio. Спасылкі ў паведамленні паказваюць на адпаведнае змесціва ў Loomio. Калі інтэграцыі патрэбныя структураваныя актуальныя даныя, яна можа атрымаць іх праз API карыстальніка.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c2e9782a81b59ab2:
    english: |-
      | Integration format | Principal JSON fields |
      | --- | --- |
      | Mattermost/Markdown | `text`, `icon_url`, `username` |
      | Slack | `text` |
      | Discord | `content`, limited to approximately 1,900 characters |
      | Microsoft Teams | `@type`, `@context`, `themeColor`, `text`, `sections` |
      | Webex | `markdown` |
    translation: |-
      | Фармат інтэграцыі | Асноўныя палі JSON |
      | --- | --- |
      | Mattermost/Markdown | `text`, `icon_url`, `username` |
      | Slack | `text` |
      | Discord | `content`, не больш за прыкладна 1 900 сімвалаў |
      | Microsoft Teams | `@type`, `@context`, `themeColor`, `text`, `sections` |
      | Webex | `markdown` |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  132dd698f11d1d08:
    english: 'For example, the general Markdown format sends a body shaped like:'
    translation: 'Напрыклад, паведамленне ў агульным фармаце Markdown мае такую структуру:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d224ca01f360918e:
    english: The exact message text depends on the event, group locale, notification-only setting, and Loomio version. Consumers should rely on the selected format's documented top-level fields rather than parsing sentence wording.
    translation: Дакладны тэкст паведамлення залежыць ад падзеі, мовы групы, налады адпраўкі толькі загалоўка апавяшчэння і версіі Loomio. Пры апрацоўцы абапірайцеся на задакументаваныя палі верхняга ўзроўню выбранага фармату, а не на фармулёўкі сказаў.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  62c53ea4911e0c79:
    english: "## Search"
    translation: "## Пошук"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f7346561ccdfcfce:
    english: Search discussions, comments, polls, votes, and outcomes visible to the API-key user. Results include public content even when the user is not a member of its group; private content remains subject to normal topic visibility.
    translation: Шукайце абмеркаванні, каментарыі, апытанні, галасы і высновы, даступныя карыстальніку з ключом API. Вынікі ўключаюць агульнадаступнае змесціва, нават калі гэты карыстальнік не ўваходзіць у адпаведную групу. Доступ да прыватнага змесціва вызначаецца звычайнымі правіламі бачнасці тэм.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e9101cf4a72bde36:
    english: "`GET /api/b2/search`"
    translation: "`GET /api/b2/search`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9bc24da4bd85dac2:
    english: "### Params"
    translation: "### Параметры"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ac9bc86d81bfd39f:
    english: |-
      | Name | Description |
      | --- | --- |
      | `query` | Search text. Exact and fuzzy matches are supported |
      | `group_id` | Restrict results to one visible group |
      | `org_id` | Restrict results to a visible parent group and its visible subgroups. Use `0` for direct discussions |
      | `type` | Restrict results to one type: `Discussion`, `Comment`, `Poll`, `Stance`, or `Outcome` |
      | `types` | Comma-separated list of result types |
      | `tag` | Restrict results to topics with this tag |
      | `author_id` | Restrict results to content by one author. Without `query`, returns that author's recent visible activity |
      | `order` | Set to `authored_at_desc` to order matching content by authoring time |
    translation: |-
      | Назва | Апісанне |
      | --- | --- |
      | `query` | Тэкст для пошуку. Падтрымліваюцца дакладныя і прыблізныя супадзенні |
      | `group_id` | Абмежаваць вынікі адной даступнай групай |
      | `org_id` | Абмежаваць вынікі даступнай бацькоўскай групай і яе даступнымі падгрупамі. Для прамых абмеркаванняў выкарыстоўвайце `0` |
      | `type` | Абмежаваць вынікі адным тыпам: `Discussion`, `Comment`, `Poll`, `Stance` або `Outcome` |
      | `types` | Спіс тыпаў вынікаў, падзеленых коскамі |
      | `tag` | Абмежаваць вынікі тэмамі з гэтым тэгам |
      | `author_id` | Абмежаваць вынікі змесцівам аднаго аўтара. Без `query` вяртаюцца апошнія даступныя дзеянні гэтага аўтара |
      | `order` | Задайце `authored_at_desc`, каб упарадкаваць адпаведнае змесціва паводле часу стварэння |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  00e046b622446633:
    english: The response contains a `search_results` array. Each result identifies the matched record and its visible context with fields including `searchable_type`, `searchable_id`, `highlight`, `group_id`, `group_name`, `discussion_key`, `poll_key`, `author_id`, `author_name`, `authored_at`, and `tags`. Fields that do not apply to a result are `null`.
    translation: Адказ змяшчае масіў `search_results`. Кожны вынік вызначае знойдзены запіс і яго даступны кантэкст праз палі, у тым ліку `searchable_type`, `searchable_id`, `highlight`, `group_id`, `group_name`, `discussion_key`, `poll_key`, `author_id`, `author_name`, `authored_at` і `tags`. Палі, якія не датычацца выніку, маюць значэнне `null`.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
