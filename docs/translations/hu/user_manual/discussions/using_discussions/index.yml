    translated_on: '2026-09-29'
  eb0442148f7c042d:
    english: Select **Markdown** to save the complete thread as structured Markdown. Choose **Copy Markdown** to copy it to your clipboard, or **Download Markdown** to save it as a `.md` file. You can use it for meeting minutes, a document, an archive of decisions, an AI assistant, or another tool that supports Markdown.
    translation: Válaszd a **Markdown** lehetőséget a teljes szál strukturált Markdown formátumú mentéséhez. A **Markdown másolása** a vágólapra másolja, a **Markdown letöltése** pedig `.md` fájlként menti. Használhatod jegyzőkönyvhöz, dokumentumhoz, döntések archiválásához, mesterségesintelligencia-asszisztenssel vagy más, Markdownt támogató eszközzel.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  80e3f57638b53cb4:
    english: The document begins with YAML front matter containing the thread key, group, creation date, last activity date, and tags. It then includes the discussion context and every comment, poll, vote, and outcome in the same order and nesting as the threaded view.
    translation: A dokumentum elején YAML-metaadatok szerepelnek a szál azonosítójával, a csoporttal, a létrehozás és az utolsó aktivitás dátumával, valamint a címkékkel. Ezután a beszélgetés kontextusa, majd minden hozzászólás, szavazás, leadott szavazat és következtetés következik a szálas nézettel azonos sorrendben és egymásba ágyazva.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f99823b7b44e2cdd:
    english: Each poll is a section. Comments, votes, and outcomes are quoted, and replies are quoted beneath the item they answer. This shows where each person's text begins and ends. Each quote starts with one line showing the person, when they posted, the item's number in the thread, and any reactions. Votes and outcomes also say what they are. The thread key and item number identify each item in Loomio.
    translation: Minden szavazás külön szakasz. A hozzászólások, a leadott szavazatok és a következtetések idézetként jelennek meg, a válaszok pedig az alatt az elem alatt, amelyre érkeztek. Így látható, hol kezdődik és végződik az egyes résztvevők szövege. Minden idézet első sora megadja a résztvevő nevét, a közzététel idejét, az elem sorszámát a szálban és az esetleges reakciókat. A leadott szavazatoknál és a következtetéseknél az elemtípus is szerepel. A szál azonosítója és az elem sorszáma együtt azonosítja az elemet a Loomióban.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e5bdfbb4a0d7646f:
    english: Loomio applies the same visibility rules as the thread. Results and vote reasons you cannot see are not included, and voters are not identified in anonymous polls. If an open poll hides results until you vote, vote before exporting the thread. **Markdown** and **Print** are unavailable until you do.
    translation: A Loomio ugyanazokat a láthatósági szabályokat alkalmazza, mint a szálban. Az általad nem látható eredmények és szavazási indokok kimaradnak, névtelen szavazásnál pedig nem derül ki, ki hogyan szavazott. Ha egy nyitott szavazás a szavazatod leadásáig elrejti az eredményeket, a szál exportálása előtt szavazz. Addig a **Markdown** és a **Nyomtatás** nem érhető el.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7989d3386a42f180:
    english: 'For example, a discussion containing a comment, reactions, a proposal, two votes, a reply, and an outcome produces this Markdown:'
    translation: 'Például egy hozzászólást, reakciókat, egy javaslatot, két leadott szavazatot, egy választ és egy következtetést tartalmazó beszélgetésből ilyen Markdown készül:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  275f4d9025c017c4:
    english: The headings and labels use your selected language. Content written by participants remains in its original language.
    translation: A címsorok és a címkék a kiválasztott nyelven jelennek meg. A résztvevők által írt tartalom az eredeti nyelvén marad.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dab18fdf3c56269d:
    english: "### Thread settings and display"
    translation: "### Szálbeállítások és megjelenítés"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7bc55279f97c6d1b:
    english: Group admins can select **Thread settings** to change how replies are arranged and configure other discussion options.
    translation: A csoportadminisztrátorok a **Szálbeállítások** alatt módosíthatják a válaszok elrendezését és a beszélgetés további beállításait.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  32b2640ba23524aa:
    english: Choose **Timeline** to list items in the order they were posted, or **Threaded** to group replies beneath the item they respond to. Thread settings also control whether multiple polls may run at once and can set a maximum comment length. These settings apply to everyone in the discussion.
    translation: Válaszd az **Idővonal** lehetőséget, ha az elemeket közzétételi sorrendben szeretnéd látni, vagy a **Threaded** lehetőséget, ha a válaszokat az általuk megválaszolt elem alatt szeretnéd csoportosítani. A szálbeállításokkal azt is szabályozhatod, futhat-e egyszerre több szavazás, és megadhatod a hozzászólások maximális hosszát. Ezek a beállítások a beszélgetés minden résztvevőjére érvényesek.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a520339278bcc2a:
    english: "### Pin or unpin a thread"
    translation: "### Szál rögzítése vagy rögzítésének megszüntetése"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0433e7a61db60003:
    english: Pinned threads appear above other threads on the group page. Welcome discussions, news items, and announcements are typical uses for pinned threads.
    translation: A rögzített szálak a többi szál fölött jelennek meg a csoport oldalán. Így például üdvözlő beszélgetéseket, híreket és közleményeket emelhetsz ki.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b2712588a5e0aab3:
    english: Open the three-dot menu (**⋯**) beside the thread on the group page and select **Pin thread**. Pinned threads are ordered by the time they were pinned. To change their order, unpin and pin them again.
    translation: Nyisd meg a csoport oldalán a szál melletti hárompontos menüt (**⋯**), és válaszd a **Téma rögzítése** lehetőséget. A rögzített szálak a rögzítésük időpontja szerint követik egymást. A sorrend módosításához szüntesd meg a rögzítésüket, majd rögzítsd őket újra.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a0443f076d1b8ae5:
    english: Select **Unpin thread** to return a thread to the activity-based order.
    translation: Válaszd a **Téma rögzítésének megszüntetése** lehetőséget, hogy a szál ismét az aktivitás szerinti sorrendben jelenjen meg.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b90a469963b02ffc:
    english: "### Move a thread"
    translation: "### Szál áthelyezése"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8b2071f4625705e5:
    english: Select **Move thread** to move a thread to another group, subgroup, or to a direct thread. It will be visible to members of the destination group and anyone specifically invited to it.
    translation: Válaszd a **Szál áthelyezése** lehetőséget, ha a szálat másik csoportba, alcsoportba vagy közvetlen szálba szeretnéd áthelyezni. Ezután a célcsoport tagjai és a külön meghívott személyek láthatják.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f09d5f2afce03ee8:
    english: |-
      >[!Tip]
      >Start a draft as a direct discussion or in a private subgroup, then move it to the group when it is ready.
    translation: |-
      >[!Tip]
      >Kezdd a piszkozatot közvetlen beszélgetésként vagy egy privát alcsoportban, majd amikor elkészült, helyezd át a csoportba.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c82562b641053308:
    english: To move selected activity rather than the whole thread, see [Moving items between threads](/en/user_manual/discussions/moving_items/).
    translation: 'Ha nem az egész szálat, hanem csak bizonyos elemeket szeretnél áthelyezni, lásd: [Elemek áthelyezése szálak között](/en/user_manual/discussions/moving_items/).'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  be22d2980075fdaa:
    english: "### Lock or unlock a thread"
    translation: "### Szál zárolása vagy zárolásának feloldása"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e7c24a610fd2bf8b:
    english: Lock a thread to prevent comments or further changes. A thread can only be locked after its active polls have closed.
    translation: Zárold a szálat a további hozzászólások és módosítások megakadályozásához. A szálat csak az aktív szavazások lezárása után lehet zárolni.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  edb983bb6366aa6c:
    english: Select **Lock thread** under **Actions**. Locked threads are removed from the list of open discussions and marked with a **Locked** tag.
    translation: Válaszd a **Téma zárolása** lehetőséget a **Műveletek** alatt. A zárolt szálak eltűnnek a nyitott beszélgetések listájából, és **Zárolva** címkét kapnak.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ba2794349524cc33:
    english: To find a locked thread, open the discussion filter on the group page and select **Locked**. Open the thread and select **Unlock thread** to allow comments and changes again.
    translation: Zárolt szál kereséséhez nyisd meg a beszélgetések szűrőjét a csoport oldalán, és válaszd a **Zárolva** lehetőséget. Nyisd meg a szálat, majd válaszd a **Téma zárolásának feloldása** lehetőséget, hogy újra lehessen hozzászólni és módosításokat végezni.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3a75fb1ad0ffab87:
    english: "### Delete a thread"
    translation: "### Téma törlése"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0103a5729bd6a095:
    english: Deleting a thread removes it permanently and cannot be undone. Lock the thread instead if you may need it again.
    translation: A téma törlése végleges, és nem vonható vissza. Ha később még szükséged lehet rá, inkább zárold.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  daf08ca8895b0fe2:
    english: Select **Delete thread** and confirm the deletion.
    translation: Válaszd a **Téma törlése** lehetőséget, majd erősítsd meg a törlést.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
