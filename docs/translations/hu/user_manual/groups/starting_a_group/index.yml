  e8632dbb628c7c7d:
    english: "# Starting a new group"
    translation: "# Új csoport indítása"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2a4a6907d4e2049d:
    english: If you are new to Loomio, you can start a group on a free trial at any time from the [Loomio website](https://www.loomio.com/). If you already use Loomio and would like to start a new group for another organization or purpose, you can do this from the sidebar menu - click on **New group**.
    translation: Ha még nem használtad a Loomiót, bármikor indíthatsz csoportot ingyenes próbaidőszakkal a [Loomio weboldalán](https://www.loomio.com/). Ha már használod a Loomiót, és másik szervezet vagy cél számára szeretnél új csoportot indítani, kattints az oldalsáv menüjében az **Új csoport** lehetőségre.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  10e8756c96038e58:
    english: For many organizations, a single Loomio group is sufficient. You can start as many subgroups as you need within the group. See [Subgroups](/en/user_manual/groups/subgroups/) for more info.
    translation: Sok szervezetnek elég egyetlen Loomio-csoport. Ezen belül annyi alcsoportot indíthatsz, amennyire szükséged van. További információt az [Alcsoportok](/en/user_manual/groups/subgroups/) oldalon találsz.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
