---
navigation_title: Kommentare
blocks:
  e6981c530fad6f45:
    english: "# Comments"
    translation: "# Kommentare"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cb82daa3594be60c:
    english: Comments are the main way people participate in a discussion. They are visible to anyone who has permission to see the thread.
    translation: Kommentare sind die wichtigste Möglichkeit, sich an einer Diskussion zu beteiligen. Sie sind für alle sichtbar, die Zugriff auf die Diskussion haben.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  96ffa85117001d18:
    english: "## Reading comments"
    translation: "## Kommentare lesen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2d82b2da2ee96a1f:
    english: When you open a discussion, Loomio takes you to activity that is new to you.
    translation: Wenn du eine Diskussion öffnest, zeigt Loomio dir zuerst neue Aktivitäten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c4a1b0be655249a9:
    english: Unread comments have a blue **new** label beside their posting time.
    translation: Ungelesene Kommentare haben neben der Veröffentlichungszeit eine blaue Markierung **neu**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  82bce54322fa6023:
    english: "## Writing a comment"
    translation: "## Einen Kommentar schreiben"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7b14a17025b52e3d:
    english: Write a comment to contribute to the discussion. Other people can reply, react, or post their own comments.
    translation: Schreibe einen Kommentar, um dich an der Diskussion zu beteiligen. Andere können darauf antworten, reagieren oder eigene Kommentare schreiben.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6e0c07cfcb8f1166:
    english: Select **Post Comment** to publish it. Your comment will be visible to anyone who has permission to see the discussion.
    translation: Wähle **Kommentar abschicken**, um deinen Kommentar zu veröffentlichen. Er ist für alle sichtbar, die Zugriff auf die Diskussion haben.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  edfadd8f1dcac9c4:
    english: The tools described in [Formatting](/en/user_manual/discussions/formatting/) are available when writing comments.
    translation: Beim Schreiben von Kommentaren stehen dir die unter [Formatierung](/en/user_manual/discussions/formatting/) beschriebenen Werkzeuge zur Verfügung.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b4dce878f57863ff:
    english: "## Mentioning people"
    translation: "## Personen erwähnen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  70543178fe9e7b4b:
    english: Type **@**, start typing a person's name, then select them from the list. A mention notifies that person immediately and is a useful way to ask for their attention or response.
    translation: Gib **@** ein, beginne den Namen einer Person zu tippen und wähle sie aus der Liste aus. Die Person wird sofort über die Erwähnung benachrichtigt. So kannst du sie auf etwas aufmerksam machen oder um eine Antwort bitten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b1d5a5e3d5bb86e3:
    english: "![Mentioning Samira Patel in a comment](../notifying_people/comment_mention.png)"
    translation: "![Samira Patel in einem Kommentar erwähnen](../notifying_people/comment_mention.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  07aa88bffb5b1700:
    english: To notify everyone in the group, type **@**, start typing the group name, then select it from the list.
    translation: Um alle in der Gruppe zu benachrichtigen, gib **@** ein, beginne den Gruppennamen zu tippen und wähle die Gruppe aus der Liste aus.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  794c26be4050ac1b:
    english: "![Searching for Oatmilk Cooperative while writing a group mention](../notifying_people/mentioning_group_1.png)"
    translation: "![Beim Schreiben einer Gruppenerwähnung nach Oatmilk Cooperative suchen](../notifying_people/mentioning_group_1.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  111625a57c02bc5c:
    english: "![Oatmilk Cooperative selected as a group mention](../notifying_people/mentioning_group_2.png)"
    translation: "![Oatmilk Cooperative als Gruppenerwähnung ausgewählt](../notifying_people/mentioning_group_2.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b4fb3c8390c32e31:
    english: Mentioning someone does not give them access to the thread. Use **Invite people** in the thread sidebar if they are not already a thread member.
    translation: Eine Erwähnung gibt der Person keinen Zugriff auf die Diskussion. Wenn sie noch kein Mitglied der Diskussion ist, verwende **Leute einladen** in der Seitenleiste.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6bba3d93a1845f91:
    english: "## Replying to a comment"
    translation: "## Auf einen Kommentar antworten"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e7776c198f2f2f48:
    english: Select **Reply** below a comment to respond to it. The reply is prefilled with an @mention of the comment author, which notifies them when you post it. Remove the mention if you do not want to notify them.
    translation: Wähle **Antworten** unter einem Kommentar. Die Antwort enthält bereits eine @Erwähnung der Person, die den Kommentar geschrieben hat. Sie wird benachrichtigt, wenn du die Antwort veröffentlichst. Entferne die Erwähnung, wenn du sie nicht benachrichtigen möchtest.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eb45d23f7f968858:
    english: You can also reply to your own comment to nest a response beneath it.
    translation: Du kannst auch auf deinen eigenen Kommentar antworten, um eine Antwort darunter einzurücken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ab1caf06d54d3bcb:
    english: If a Loomio email says you can reply by email, your emailed reply will appear in the thread.
    translation: Wenn in einer Loomio-E-Mail steht, dass du per E-Mail antworten kannst, erscheint deine Antwort in der Diskussion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72d9282ce2bc763a:
    english: "## Reactions"
    translation: "## Reaktionen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1875a303c30b5343:
    english: Use the smiley button to respond with an emoji. Reactions notify the comment author within Loomio but do not send an email.
    translation: Verwende die Smiley-Schaltfläche, um mit einem Emoji zu reagieren. Reaktionen benachrichtigen die Person, die den Kommentar geschrieben hat, innerhalb von Loomio. Es wird keine E-Mail gesendet.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ce997bcd34b2eae0:
    english: "## Translating comments"
    translation: "## Kommentare übersetzen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b50a435640652d31:
    english: If the author uses a language other than yours, a **Translate** action appears below the comment.
    translation: Wenn ein Kommentar in einer anderen Sprache als deiner geschrieben wurde, erscheint darunter die Aktion **Übersetzen**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9077e2c891750fe8:
    english: Select **Translate comment** to see the comment in your language.
    translation: Wähle **Kommentar übersetzen**, um den Kommentar in deiner Sprache zu sehen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  60a885598057c1bf:
    english: "## Comment actions"
    translation: "## Aktionen für Kommentare"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9689ea71da9051d8:
    english: Common actions appear directly below a comment. Additional actions are available from the three-dot menu (**⋯**).
    translation: Häufig verwendete Aktionen stehen direkt unter einem Kommentar. Weitere findest du im Menü mit den drei Punkten (**⋯**).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  88263de7d2158dae:
    english: "### Add a comment to Jump to"
    translation: "### Einen Kommentar zu Springen zu hinzufügen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dd60de0295088aa5:
    english: Use **Pin to timeline** to add a comment to the thread's **Jump to** list.
    translation: Verwende **An Timeline anheften**, um einen Kommentar zur Liste **Springen zu** der Diskussion hinzuzufügen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  90252c4d66b752d4:
    english: You can edit the label shown in **Jump to**. Unpin and then pin the comment again to change the link text.
    translation: Du kannst die Bezeichnung unter **Springen zu** ändern. Löse dazu die Anheftung und hefte den Kommentar mit dem gewünschten Linktext erneut an.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  28c2ffaa171b6b1b:
    english: |-
      >[!Tip]
      >Highlight the words you want to use as the link text before selecting **Pin to timeline**.
    translation: |-
      >[!Tip]
      >Markiere die Wörter, die du als Linktext verwenden möchtest, bevor du **An Timeline anheften** auswählst.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7545e856758edb22:
    english: Select **Unpin** to remove the item from **Jump to**.
    translation: Wähle **Anheften deaktivieren**, um den Eintrag aus **Springen zu** zu entfernen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c3b33d31cbce93c3:
    english: "### Edit a comment and view changes"
    translation: "### Einen Kommentar bearbeiten und Änderungen ansehen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  abaeaac4c1f2c966:
    english: Select **Edit** below one of your comments to change it. Group admins can also edit member comments when the relevant group permission is enabled.
    translation: Wähle **Bearbeiten** unter einem deiner Kommentare, um ihn zu ändern. Gruppenadmins können auch Kommentare von Mitgliedern bearbeiten, wenn die entsprechende Gruppenberechtigung aktiviert ist.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  69647eee1f3fcfb7:
    english: An **Edited** action appears below an edited comment.
    translation: Unter einem bearbeiteten Kommentar erscheint die Aktion **Bearbeitet**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fcaa0d6329f5c5d4:
    english: Select **Edited** to see what changed. Red highlighting shows removed text and green highlighting shows added text. Loomio records who made each edit and when it was made.
    translation: Wähle **Bearbeitet**, um die Änderungen anzusehen. Entfernte Textstellen sind rot und hinzugefügte grün markiert. Loomio hält fest, wer den Kommentar wann bearbeitet hat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  042b22530d14a486:
    english: 'You can edit a comment when:'
    translation: 'Du kannst einen Kommentar bearbeiten, wenn:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  afe0ed6535a96b15:
    english: |-
      - you wrote it and the group allows members to edit their comments
      - you are a group admin and [Admins can edit members' comments](/en/user_manual/groups/settings/permissions) is enabled
    translation: |-
      - du ihn geschrieben hast und die Gruppe Mitgliedern erlaubt, ihre Kommentare zu bearbeiten
      - du Gruppenadmin bist und [Admins können Kommentare von Mitgliedern bearbeiten](/en/user_manual/groups/settings/permissions) aktiviert ist
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6962d0caeeea20e8:
    english: "### Copy a comment link"
    translation: "### Einen Kommentarlink kopieren"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0fb9e2ebde71573e:
    english: Select **Copy link** to copy the comment's unique URL. You can paste the link elsewhere to refer directly to that comment.
    translation: Wähle **Link kopieren**, um die eindeutige URL des Kommentars zu kopieren. Du kannst den Link an anderer Stelle einfügen, um direkt auf den Kommentar zu verweisen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  04e4537024da788c:
    english: "### View notification history"
    translation: "### Benachrichtigungsverlauf ansehen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  957677befce0ab3f:
    english: Open the three-dot menu (**⋯**) beside a comment and select **Notification history**.
    translation: Öffne das Drei-Punkte-Menü (**⋯**) neben einem Kommentar und wähle **Benachrichtigungsverlauf**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fa9d0f2448239944:
    english: "![Notification history in a comment's actions menu](../notifying_people/comment_notification_history.png)"
    translation: "![Benachrichtigungsverlauf im Aktionsmenü eines Kommentars](../notifying_people/comment_notification_history.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  30a58d4ef7d80c15:
    english: The notification history shows who was notified about the comment, when the notification was sent, and whether it has been read when that information is available.
    translation: Im Benachrichtigungsverlauf siehst du, wer über den Kommentar benachrichtigt wurde, wann die Benachrichtigung gesendet wurde und, falls diese Information verfügbar ist, ob sie gelesen wurde.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4f6ead46c3f9759e:
    english: "![Notification history for a comment mentioning Samira Patel](../notifying_people/comment_notification_example.png)"
    translation: "![Benachrichtigungsverlauf für einen Kommentar, in dem Samira Patel erwähnt wird](../notifying_people/comment_notification_example.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fa2204fb0745dec4:
    english: "### Discard, restore, or delete a comment"
    translation: "### Kommentar verwerfen, wiederherstellen oder löschen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  592dfa766814bb8e:
    english: Discarding a comment removes it from the thread but retains it in a trash bin. You can discard your own comments with **Discard** in the three-dot menu. Group admins can also discard comments.
    translation: Wenn du einen Kommentar verwirfst, wird er aus dem Thread entfernt und im Papierkorb aufbewahrt. Du kannst deine eigenen Kommentare über **Verwerfen** im Drei-Punkte-Menü verwerfen. Gruppenadmins können ebenfalls Kommentare verwerfen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  670a46d5274f9ab5:
    english: "**Restore a comment**"
    translation: "**Kommentar wiederherstellen**"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9b202a60d5665ac6:
    english: The location of a discarded comment is labelled **Item removed**. Open its three-dot menu and select **Restore**.
    translation: An der Stelle eines verworfenen Kommentars steht **Element entfernt**. Öffne dort das Drei-Punkte-Menü und wähle **Wiederherstellen**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d6427576dab2b2c5:
    english: "**Delete a comment**"
    translation: "**Kommentar löschen**"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d8b9add122e73295:
    english: Deleting a comment removes it permanently. It cannot be restored.
    translation: Wenn du einen Kommentar löschst, wird er dauerhaft entfernt. Er kann nicht wiederhergestellt werden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  51f7dce6a0188a51:
    english: If **Members can delete their own comments** is enabled in [Group permissions](/en/user_manual/groups/settings/permissions), members can permanently delete their own discarded comments. Group admins can delete any comment.
    translation: Wenn **Mitglieder können ihre eigenen Kommentare löschen** unter [Gruppenberechtigungen](/en/user_manual/groups/settings/permissions) aktiviert ist, können Mitglieder ihre eigenen verworfenen Kommentare dauerhaft löschen. Gruppenadmins können jeden Kommentar löschen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  63134f860609d669:
    english: Open the three-dot menu on an **Item removed** entry and select **Delete**.
    translation: Öffne das Drei-Punkte-Menü bei einem Eintrag mit der Kennzeichnung **Element entfernt** und wähle **Löschen**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  19580f91a59bf5ef:
    english: A confirmation message explains that the comment will be permanently deleted.
    translation: Eine Bestätigungsmeldung erklärt, dass der Kommentar dauerhaft gelöscht wird.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
