  54368e42ed93ae0c:
    english: "# Vote share requirements"
    translation: "# Requisiti di quota di voto"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2051086558658db2:
    english: Set a vote share requirement on an option when a proposal must receive a particular percentage of support, or remain below a particular percentage of opposition, to pass.
    translation: Imposta un requisito di quota di voto per un'opzione quando, per essere approvata, una proposta deve ottenere una determinata percentuale di sostegno o non superare una determinata percentuale di opposizione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f00d3806d6b890ae:
    english: Vote share requirements can be combined with a [quorum](/en/user_manual/polls/quorum/) to require both sufficient participation and a particular distribution of votes.
    translation: Puoi combinare i requisiti di quota di voto con un [quorum](/en/user_manual/polls/quorum/) per richiedere sia una partecipazione sufficiente sia una determinata distribuzione dei voti.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0fc0acd12134f67e:
    english: When creating a proposal, select the edit icon beside an option.
    translation: Quando crei una proposta, seleziona l'icona di modifica accanto a un'opzione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  27979c31066e397f:
    english: "![The edit icon beside the Consent option](edit-highlight-on-option.png)"
    translation: "![L'icona di modifica accanto all'opzione Consenso](edit-highlight-on-option.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b3a4dee73762bea4:
    english: "## Eligible voters and votes cast"
    translation: "## Elettori aventi diritto e voti espressi"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1d04d75fa16a2a18:
    english: The percentage can be based on either **Votes cast** or **Eligible voters**.
    translation: La percentuale può essere calcolata in base ai **Voti espressi** o agli **Elettori aventi diritto**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  590e1a316f9ad174:
    english: "![Choosing whether a vote share requirement uses votes cast or eligible voters](./eligible-vs-cast.png)"
    translation: "![Scelta tra voti espressi ed elettori aventi diritto per il requisito di quota di voto](./eligible-vs-cast.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d4c72d50982e071d:
    english: "**Eligible voters** means everyone who is able to vote in the proposal. **Votes cast** means only the votes that have been submitted."
    translation: "**Elettori aventi diritto** indica tutte le persone che possono votare sulla proposta. **Voti espressi** indica solo i voti già inviati."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  24945a1a4f0d08e3:
    english: A requirement of 75 percent agreement from eligible voters can pass only when at least 75 percent of all eligible voters vote for that option.
    translation: Un requisito del 75% di voti favorevoli tra gli elettori aventi diritto può essere soddisfatto solo se almeno il 75% di tutti gli aventi diritto vota per quell'opzione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  14e4ff7cd000c7af:
    english: A requirement of 60 percent agreement from votes cast can pass when 60 percent of submitted votes support the option, regardless of overall turnout. Add a quorum when your process also requires a minimum level of participation.
    translation: Un requisito del 60% di voti favorevoli tra i voti espressi può essere soddisfatto se il 60% dei voti inviati sostiene l'opzione, indipendentemente dalla partecipazione complessiva. Aggiungi un quorum se il tuo processo richiede anche una partecipazione minima.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a8f235434b40ecd9:
    english: "## Different vote share requirements"
    translation: "## Requisiti di quota di voto diversi"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6682c9656815bdbc:
    english: 'A proposal can have requirements on more than one option. For example:'
    translation: 'Puoi impostare requisiti per più opzioni della stessa proposta. Per esempio:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dac1980305bef52d:
    english: |-
      - Agreement must be at least 75 percent of eligible voters
      - Abstention must be no more than 30 percent of votes cast
      - Block must be no more than 0 percent of votes cast
    translation: |-
      - I voti favorevoli devono rappresentare almeno il 75% degli elettori aventi diritto
      - Le astensioni non devono superare il 30% dei voti espressi
      - I voti di blocco non devono superare lo 0% dei voti espressi
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  11325e607f603eb7:
    english: You can also add requirements to a [poll template](/en/user_manual/polls/poll_templates/) so that new proposals created from the template use them by default.
    translation: Puoi anche aggiungere requisiti a un [modello di sondaggio](/en/user_manual/polls/poll_templates/), così le nuove proposte create dal modello li useranno per impostazione predefinita.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d6bffbdadc45e7f5:
    english: "## Detailed example"
    translation: "## Esempio dettagliato"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4318dab03fe217ad:
    english: Oatmilk Cooperative is deciding whether to approve the budget for its six-week returnable bottle trial. Five people are eligible to vote.
    translation: La cooperativa Oatmilk sta decidendo se approvare il budget per una prova di sei settimane con bottiglie a rendere. Cinque persone hanno diritto di voto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8f5779f2f1bb9ec3:
    english: Jamie uses the **Consent** proposal template, edits the Consent option, and enables its vote share requirement.
    translation: Jamie usa il modello di proposta **Consenso**, modifica l'opzione Consenso e attiva il relativo requisito di quota di voto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  842038ffbd273e57:
    english: The cooperative's process requires at least 75 percent of eligible voters to support the proposal. Jamie sets the requirement to **At least 75% of Eligible voters**.
    translation: Il processo della cooperativa richiede il sostegno di almeno il 75% degli elettori aventi diritto. Jamie imposta il requisito su **Almeno il 75% degli Elettori aventi diritto**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5b852b2e7a9b3034:
    english: "![The Consent option requiring at least 75 percent of eligible voters](./consent-vote-option.png)"
    translation: "![L'opzione Consenso richiede il sostegno di almeno il 75% degli elettori aventi diritto](./consent-vote-option.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8a42a135c0c11c98:
    english: Jamie also sets a 60 percent quorum. Jamie and Samira vote in agreement. All submitted votes support the proposal, but they represent only 40 percent of eligible voters, so neither requirement has been reached.
    translation: Jamie imposta anche un quorum del 60%. Jamie e Samira votano a favore. Tutti i voti espressi sostengono la proposta, ma rappresentano solo il 40% degli elettori aventi diritto. Nessuno dei due requisiti è quindi soddisfatto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2284440b974635e3:
