  2df60ea964109f11:
    english: "## Group data is permanently deleted after 90 days"
    translation: "## Os dados do grupo são excluídos permanentemente após 90 dias"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e09923078301b8d:
    english: After 90 days, all the threads, polls, files and other group content will be permanently deleted. ***This is non-reversible!***
    translation: Após 90 dias, todas as discussões, enquetes, arquivos e demais conteúdos do grupo serão excluídos permanentemente. ***Essa ação não pode ser desfeita.***
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8695a5ebfb09611d:
    english: We recommend that you [export the group data](/en/user_manual/groups/data_export/)and manually download any important files you have uploaded before you continue.
    translation: Recomendamos que você [exporte os dados do grupo](/en/user_manual/groups/data_export/)e baixe manualmente os arquivos importantes que você enviou antes de continuar.
    status: machine
