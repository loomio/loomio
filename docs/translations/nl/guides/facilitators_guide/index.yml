  e19d687b56819302:
    english: Hi! I'm Alanna.
    translation: Hoi, ik ben Alanna.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  10352ad196487ff3:
    english: I'm one of the founders of Loomio, and I've been thinking deeply about how it works from a facilitation perspective since the beginning. I am not a seminal facilitation expert; I consider myself only a beginner in this craft that one could spend a lifetime honing.
    translation: Ik ben een van de oprichters van Loomio. Vanaf het begin denk ik na over hoe het werkt vanuit het perspectief van gespreksbegeleiding. Ik ben geen vooraanstaande expert op dit gebied. Ik zie mezelf als een beginner in een vak dat je je hele leven kunt blijven ontwikkelen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c637c96f9723f02d:
    english: What I can offer is help translating between the offline and online spaces, as a practitioner in both. I've facilitated a lot of groups who use Loomio, and learned from their experiences.
    translation: Ik kan wel helpen de vertaalslag te maken tussen gespreksbegeleiding in persoon en online. Ik heb ervaring met beide. Ik heb veel groepen begeleid die Loomio gebruiken en van hun ervaringen geleerd.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c376e38821fb6c2f:
    english: You can find out [more about me on my website](http://alanna.space).
    translation: Je kunt [meer over mij lezen op mijn website](http://alanna.space).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b893957534fa37e2:
    english: I'm only one person, with one perspective and approach to facilitation, when there are myriad approaches. I've tried to bring in a couple other facilitator's voices here, including [Rich](http://richdecibels.com/) from Loomio and Silvia from [EXP](http://exp.agency).
    translation: Ik ben maar één persoon, met één perspectief en één manier van gespreksbegeleiding. Er zijn veel andere manieren. Daarom heb ik geprobeerd ook enkele andere gespreksbegeleiders aan het woord te laten, onder wie [Rich](http://richdecibels.com/) van Loomio en Silvia van [EXP](http://exp.agency).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
