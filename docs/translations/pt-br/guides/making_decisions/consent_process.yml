  55ccc01c9b274a87:
    english: |-
      ## Key points
      - Aim for a ‘good enough’ decision.
      - Involve many voices to develop a workable proposal.
      - Ask if anyone has a valid objection.
      - Amend the proposal to resolve objections.
    translation: |-
      ## Pontos principais
      - Busque uma decisão ‘boa o suficiente’.
      - Envolva muitas pessoas para desenvolver uma proposta viável.
      - Pergunte se alguém tem uma objeção válida.
      - Altere a proposta para resolver as objeções.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7c2ef9fc3419f4b7:
    english: |-
      **Typical roles:**
      - Proposer: The person who raises a topic that requires a decision.
      - Facilitator: Someone who can help the proposer do their job efficiently.
    translation: |-
      **Papéis típicos:**
      - Proponente: a pessoa que apresenta um assunto que exige uma decisão.
      - Facilitador: alguém que ajuda o proponente a conduzir o trabalho com eficiência.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c56d1ea7a5582723:
    english: |-
      ## Consent process steps
      You notice a problem or opportunity and take the initiative.
      1. Present a proposal - start a Loomio **discussion**.
      2. Facilitate a round of questions, reactions and any comments to improve the proposal - run a **Sense check proposal**.
      3. Amend the proposal with suggestions and comments.
      4. Ask if anyone has a meaningful objection to the amended proposal - run a **Consent proposal**.
      5. Integrate valid objections to create an amended version of the proposal that everyone consents is ‘safe to try’ - state the decision **outcome**.
    translation: |-
      ## Etapas do processo de consentimento
      Você identifica um problema ou uma oportunidade e toma a iniciativa.
      1. Apresente uma proposta — inicie uma **discussão** no Loomio.
      2. Facilite uma rodada de perguntas, reações e comentários para melhorar a proposta — faça uma proposta de **Verificação de sentido**.
      3. Altere a proposta com base nas sugestões e nos comentários.
      4. Pergunte se alguém tem uma objeção relevante à proposta alterada — faça uma proposta de **Consentimento**.
      5. Incorpore as objeções válidas para criar uma versão da proposta que todos considerem ‘segura para experimentar’ — apresente a **Conclusão** da decisão.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  735e10dde58793f0:
    english: |-
      >[!Tip]
      >In more complex decisions you may also include a clarifying **Questions round** at step 2, to help people understand the proposal before inviting them to react and comment on the proposal.
    translation: |-
      >[!Tip]
      >Em decisões mais complexas, você também pode incluir uma **Rodada de perguntas** na etapa 2. Isso ajuda as pessoas a entender a proposta antes de apresentar reações e comentários.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
