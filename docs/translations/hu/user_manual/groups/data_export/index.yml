  42721518a91907da:
    english: 'With the group data export feature you can:'
    translation: 'A csoportadatok exportálásával:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f978c97e52e0b00a:
    english: |-
      - Download a file containing member data to audit group membership.
      - Download content of your group including text of threads and polls for archive or analysis.
      - Open poll results in a spreadsheet or scripting language.
      - [Print or save PDF's of a thread or poll for archival purposes.](#print-thread-to-pdf)
      - Move your group, including all users, threads, polls, and files to another Loomio server.
    translation: |-
      - Letöltheted a tagok adatait tartalmazó fájlt a csoporttagság ellenőrzéséhez.
      - Letöltheted a csoport tartalmát, köztük a témák és szavazások szövegét archiváláshoz vagy elemzéshez.
      - Megnyithatod a szavazások eredményeit táblázatkezelőben vagy programozási nyelvvel.
      - [Kinyomtathatod vagy PDF-ként mentheted a témákat és szavazásokat archiváláshoz.](#print-thread-to-pdf)
      - Átköltöztetheted a csoportodat, az összes felhasználóval, témával, szavazással és fájllal együtt, egy másik Loomio-szerverre.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  94b3081b62cd0a45:
    english: If you ever want to move from Loomio managed servers [to your own](https://github.com/loomio/loomio), you can use this feature.
    translation: Ezt a funkciót akkor is használhatod, ha a Loomio által üzemeltetett szerverekről [saját szerverre](https://github.com/loomio/loomio) szeretnél költözni.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  223d5690921676c4:
    english: If you're running your own Loomio server, and would rather not anymore, Loomio offer managed hosting in USA, EU and Australia. If you'd like to migrate your group to one of these servers, please [contact us](/contact).
    translation: Ha saját Loomio-szervert üzemeltetsz, de inkább a Loomio tárhelyszolgáltatását használnád, az USA-ban, az EU-ban és Ausztráliában működő szerverek közül választhatsz. Ha valamelyikre át szeretnéd költöztetni a csoportodat, [lépj kapcsolatba velünk](/contact).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cabd4ab01146ea7c:
    english: "[Contact us](/contact) if you would like to transfer your Loomio group from Loomio's global hosted service at loomio.com to one of our regional services; loomio.eu for Europe or loomio.nz for Australia and New Zealand."
    translation: "[Lépj kapcsolatba velünk](/contact), ha a csoportodat a Loomio globális, loomio.com címen elérhető szolgáltatásából valamelyik regionális szolgáltatásunkba szeretnéd átköltöztetni: Európában a loomio.eu, Ausztráliában és Új-Zélandon a loomio.nz érhető el."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
