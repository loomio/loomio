  0b903e1c3c7e1862:
    english: The profile tab controls how your group is identified and introduced. Open **Edit group settings** from the group page, then select **Profile**.
    translation: プロフィールタブでは、グループの名前や紹介を設定できます。グループページで**グループ設定を編集する**を開き、**プロフィール**を選択します。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
