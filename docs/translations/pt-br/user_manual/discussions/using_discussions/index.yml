    translated_on: '2026-09-29'
  85fc948a4e849ba8:
    english: A guest can see and participate in this thread but cannot see other discussions in the group unless separately invited.
    translation: Uma pessoa convidada pode ver e participar desta conversa, mas só pode ver outras discussões do grupo se receber um convite específico para elas.
    status: machine
