  a1c12efad8cb82f5:
    english: "## Name and handle"
    translation: "## Nom et identifiant"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3643c2e2ffd5db73:
    english: Choose a concise group name, particularly if the group will contain subgroups. Loomio uses the handle in the group's web address and group email address, such as `loomio.com/your-group-handle` and `your-group-handle@loomio.com`.
    translation: Choisissez un nom de groupe concis, surtout si le groupe doit contenir des sous-groupes. Loomio utilise l’identifiant dans l’adresse web et l’adresse e-mail du groupe, par exemple `loomio.com/your-group-handle` et `your-group-handle@loomio.com`.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5a6e298a019f6a15:
    english: When you change the handle, links using the previous handle redirect to the new address, and email sent to the previous group address continues to reach the group. Loomio retains up to three previous handles; changing the handle again after that causes the oldest one to expire.
    translation: Lorsque vous modifiez l’identifiant, les liens qui utilisent l’ancien identifiant redirigent vers la nouvelle adresse. Les e-mails envoyés à l’ancienne adresse du groupe continuent de lui parvenir. Loomio conserve jusqu’à trois anciens identifiants. Si vous modifiez encore l’identifiant après avoir atteint cette limite, le plus ancien cesse de fonctionner.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2b45dd41be9c3d1d:
    english: "## Description"
    translation: "## Description"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7b707620077d9d19:
    english: Use the description to explain what the group is for, who participates, and how people are expected to use it. You can format the description and include links, documents, and videos.
    translation: Utilisez la description pour expliquer le rôle du groupe, qui y participe et comment l’utiliser. Vous pouvez mettre le texte en forme et ajouter des liens, des documents et des vidéos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  93a11a5e2927833e:
    english: The name and description may be visible to non-members depending on the group's [privacy settings](/en/user_manual/groups/settings/privacy).
    translation: Selon les [paramètres de confidentialité](/en/user_manual/groups/settings/privacy) du groupe, son nom et sa description peuvent être visibles par des personnes qui n’en sont pas membres.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0dff03268238aa26:
    english: "## Cover image and logo"
    translation: "## Image de couverture et logo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9d08dda635bd5ce6:
    english: The cover image appears across the top of the group page. A wide image works best; the recommended size is 2048 × 512 pixels.
    translation: L’image de couverture apparaît en haut de la page du groupe. Une image large convient le mieux. La taille recommandée est de 2048 × 512 pixels.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cc04654d8d08da59:
    english: The group logo identifies the group in navigation and other compact contexts. Upload the cover image and logo separately so each can be cropped for its intended shape.
    translation: Le logo permet de reconnaître le groupe dans la navigation et les espaces où la place est limitée. Téléversez l’image de couverture et le logo séparément afin de pouvoir recadrer chacun selon son format.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
