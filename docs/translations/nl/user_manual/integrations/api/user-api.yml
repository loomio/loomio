---
navigation_title: Gebruikers-API
blocks:
  0217b93dddc627ac:
    english: "# Loomio User API documentation"
    translation: "# Documentatie voor de Loomio Gebruikers-API"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bc6fcbf5f783fd29:
    english: "<!-- seo-description: Use the Loomio User API to create and manage discussions, comments, polls, threads, and group memberships from other software. -->"
    translation: "<!-- seo-description: Gebruik de Loomio Gebruikers-API om vanuit andere software discussies, reacties, peilingen, discussiedraden en groepslidmaatschappen aan te maken en te beheren. -->"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cc2da08540808ada:
    english: "`/api/b2` is the user-oriented API for integrations with Loomio. It uses the API key of a user account, and every action is performed as that user."
    translation: "`/api/b2` is de API voor integraties met Loomio die namens een gebruiker werken. De API gebruikt de API-sleutel van een gebruikersaccount en voert elke handeling uit als die gebruiker."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7036a6661aac00f2:
    english: Group operations use the memberships and group permissions of the API-key user. Instance-administrator status does not expand an API key's access to groups or content; use the Server API for instance-level administration.
    translation: Voor groepshandelingen gelden de lidmaatschappen en groepsrechten van de gebruiker bij de API-sleutel. Beheerdersrechten voor de installatie geven een API-sleutel geen extra toegang tot groepen of inhoud. Gebruik de Server API voor beheer op installatieniveau.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c4436493b062b9f1:
    english: Use the API key from the Loomio user account that will perform the actions. A dedicated bot account is useful when an integration should not be invited to polls or receive notifications.
    translation: Gebruik de API-sleutel van het Loomio-account waarmee de handelingen moeten worden uitgevoerd. Een apart botaccount is handig als de integratie geen uitnodigingen voor peilingen of meldingen moet ontvangen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ade21c593f08100c:
    english: Signed-in users can find their API key and group IDs on the [API access page](/profile/api_access).
    translation: Als je bent ingelogd, vind je jouw API-sleutel en groeps-ID's op de [pagina voor API-toegang](/profile/api_access).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  15160edafaf441c1:
    english: 'Send the API key in an `Authorization: Bearer` header. API keys in query strings are rejected because URLs can be recorded by proxies and access logs.'
    translation: 'Stuur de API-sleutel mee in een `Authorization: Bearer`-header. API-sleutels in querystrings worden geweigerd, omdat proxyservers en toegangslogboeken URL''s kunnen vastleggen.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2215e57186277325:
    english: "### Authentication change"
    translation: "### Wijziging in authenticatie"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ff5f4c1055e80fb6:
    english: 'The API key was previously accepted as an `api_key` URL parameter. Requests using `?api_key=YOUR_API_KEY` no longer work. Use the HTTP `Authorization` header instead:'
    translation: 'Voorheen werd de API-sleutel geaccepteerd als URL-parameter `api_key`. Verzoeken met `?api_key=YOUR_API_KEY` werken niet meer. Gebruik in plaats daarvan de HTTP-header `Authorization`:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  65574ba500243c80:
    english: The examples use `YOUR_API_KEY`, group ID `123`, and `https://www.loomio.com/`. Replace these with your API key, group ID, and Loomio installation URL.
    translation: De voorbeelden gebruiken `YOUR_API_KEY`, groeps-ID `123` en `https://www.loomio.com/`. Vervang deze door jouw API-sleutel, groeps-ID en de URL van jouw Loomio-installatie.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bec1e4f30aeef4ce:
    english: "## Response size and related records"
    translation: "## Omvang van antwoorden en gerelateerde records"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  da004eb4e005fae1:
    english: 'User API responses use a compound format: the primary records are accompanied by related records such as topics, groups, users, polls, and reactions. This lets a client populate a local record store from one request, but can include more data than a simple integration needs.'
    translation: 'Antwoorden van de Gebruikers-API hebben een samengesteld formaat: de hoofdrecords worden geleverd met gerelateerde records, zoals onderwerpen, groepen, gebruikers, peilingen en reacties. Zo kan een client met één verzoek een lokale verzameling records vullen. Het antwoord kan daardoor meer gegevens bevatten dan een eenvoudige integratie nodig heeft.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  64d9a631b54cbaba:
    english: Pass `compact=1` to omit bulky related topics, groups, parent groups, memberships, reactions, tags, and translations. Primary records and the related records needed to interpret their content remain present.
    translation: Geef `compact=1` mee om omvangrijke gerelateerde onderwerpen, groepen, bovenliggende groepen, lidmaatschappen, reacties, tags en vertalingen weg te laten. De hoofdrecords en de gerelateerde records die nodig zijn om hun inhoud te begrijpen, blijven aanwezig.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e4e671db39dbe6f1:
    english: For direct control, pass `exclude_types` with space-separated singular record types. For example, `exclude_types=group reaction` omits related groups and reactions. Common values are `topic`, `group`, `parent`, `membership`, `reaction`, `tag`, `translation`, `user`, `discussion`, `poll`, `poll_option`, `stance`, `stance_choice`, `outcome`, and `topic_item`. Exclusions apply to related records, not the primary resource requested by the endpoint.
    translation: Voor meer controle geef je `exclude_types` mee met enkelvoudige recordtypen, gescheiden door spaties. Met `exclude_types=group reaction` laat je bijvoorbeeld gerelateerde groepen en reacties weg. Veelgebruikte waarden zijn `topic`, `group`, `parent`, `membership`, `reaction`, `tag`, `translation`, `user`, `discussion`, `poll`, `poll_option`, `stance`, `stance_choice`, `outcome` en `topic_item`. Uitsluitingen gelden voor gerelateerde records, niet voor de hoofdresource die je via het endpoint opvraagt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ded075da3c2aa815:
    english: Collection responses include `meta.total` when an exact collection size is defined. The total is calculated before `limit` and `offset` are applied. Endpoints such as search that intentionally return a bounded result set omit `meta.total` rather than returning `null`.
    translation: Antwoorden met verzamelingen bevatten `meta.total` wanneer de exacte omvang van de verzameling is gedefinieerd. Het totaal wordt berekend voordat `limit` en `offset` worden toegepast. Endpoints zoals zoeken, die bewust een begrensde reeks resultaten teruggeven, laten `meta.total` weg in plaats van `null` terug te geven.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  17cb8ef90a2acdb3:
    english: "## Endpoint summary"
    translation: "## Overzicht van endpoints"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  608edb13080e57c2:
    english: |-
      | Method | Endpoint | Purpose |
      | --- | --- | --- |
      | `GET` | `/api/b2/groups` | List the API-key user's groups |
      | `GET` | `/api/b2/groups/:id_or_key_or_handle` | Get a visible group |
      | `GET` | `/api/b2/reports` | Generate a participation report |
      | `GET` | `/api/b2/search` | Search visible discussions, comments, polls, votes, and outcomes |
      | `POST` | `/api/b2/discussions` | Create a discussion |
      | `GET` | `/api/b2/discussions/:id` | Get a discussion |
      | `GET` | `/api/b2/discussions` | List discussions in a group |
      | `PATCH` | `/api/b2/discussions/:id` | Edit a discussion |
      | `DELETE` | `/api/b2/discussions/:id` | Soft-delete a discussion |
      | `GET` | `/api/b2/threads` | List visible discussion and standalone-poll threads |
      | `GET` | `/api/b2/threads/:topic_id` | Get a thread |
      | `GET` | `/api/b2/threads/:topic_id/items` | Get the ordered items in a thread |
      | `GET` | `/api/b2/threads/:topic_id/markdown` | Get a complete thread as Markdown |
      | `POST` | `/api/b2/comments` | Create a comment or reply |
      | `PATCH` | `/api/b2/comments/:id` | Edit a comment |
      | `DELETE` | `/api/b2/comments/:id` | Soft-delete a comment |
      | `POST` | `/api/b2/polls` | Create a poll |
      | `GET` | `/api/b2/polls/:id` | Get a poll |
      | `GET` | `/api/b2/polls` | List polls in a group |
      | `PATCH` | `/api/b2/polls/:id` | Edit a poll |
      | `DELETE` | `/api/b2/polls/:id` | Soft-delete a poll |
      | `GET` | `/api/b2/memberships` | List a group's memberships |
      | `POST` | `/api/b2/memberships` | Add members and optionally remove absent members |
      | `GET` | `/api/b2/chatbots` | List a group's chat integrations and webhooks |
      | `POST` | `/api/b2/chatbots` | Create a chat integration or webhook |
      | `PATCH` | `/api/b2/chatbots/:id` | Update a chat integration or webhook |
      | `DELETE` | `/api/b2/chatbots/:id` | Delete a chat integration or webhook |
      | `POST` | `/api/b2/chatbots/check` | Send a webhook connection test |
    translation: |-
      | Methode | Endpoint | Doel |
      | --- | --- | --- |
      | `GET` | `/api/b2/groups` | Groepen van de gebruiker bij de API-sleutel tonen |
      | `GET` | `/api/b2/groups/:id_or_key_or_handle` | Een zichtbare groep ophalen |
      | `GET` | `/api/b2/reports` | Een deelnamerapport maken |
      | `GET` | `/api/b2/search` | Zichtbare discussies, reacties, peilingen, stemmen en conclusies doorzoeken |
      | `POST` | `/api/b2/discussions` | Een discussie aanmaken |
      | `GET` | `/api/b2/discussions/:id` | Een discussie ophalen |
      | `GET` | `/api/b2/discussions` | Discussies in een groep tonen |
      | `PATCH` | `/api/b2/discussions/:id` | Een discussie bewerken |
      | `DELETE` | `/api/b2/discussions/:id` | Een discussie zacht verwijderen |
      | `GET` | `/api/b2/threads` | Zichtbare discussiedraden en zelfstandige peilingsdraden tonen |
      | `GET` | `/api/b2/threads/:topic_id` | Een discussiedraad ophalen |
      | `GET` | `/api/b2/threads/:topic_id/items` | De items in een discussiedraad in volgorde ophalen |
      | `GET` | `/api/b2/threads/:topic_id/markdown` | Een volledige discussiedraad als Markdown ophalen |
      | `POST` | `/api/b2/comments` | Een reactie of antwoord aanmaken |
      | `PATCH` | `/api/b2/comments/:id` | Een reactie bewerken |
      | `DELETE` | `/api/b2/comments/:id` | Een reactie zacht verwijderen |
      | `POST` | `/api/b2/polls` | Een peiling aanmaken |
      | `GET` | `/api/b2/polls/:id` | Een peiling ophalen |
      | `GET` | `/api/b2/polls` | Peilingen in een groep tonen |
      | `PATCH` | `/api/b2/polls/:id` | Een peiling bewerken |
      | `DELETE` | `/api/b2/polls/:id` | Een peiling zacht verwijderen |
      | `GET` | `/api/b2/memberships` | Lidmaatschappen van een groep tonen |
      | `POST` | `/api/b2/memberships` | Leden toevoegen en eventueel ontbrekende leden verwijderen |
      | `GET` | `/api/b2/chatbots` | Chatintegraties en webhooks van een groep tonen |
      | `POST` | `/api/b2/chatbots` | Een chatintegratie of webhook aanmaken |
      | `PATCH` | `/api/b2/chatbots/:id` | Een chatintegratie of webhook bijwerken |
      | `DELETE` | `/api/b2/chatbots/:id` | Een chatintegratie of webhook verwijderen |
      | `POST` | `/api/b2/chatbots/check` | Een testbericht naar een webhook sturen |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0473f1f7fb78f074:
    english: "## Groups"
    translation: "## Groepen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dc819221f371c435:
    english: "### List groups"
    translation: "### Groepen tonen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  964f575e90aa9cde:
    english: Return the groups in which the API-key user has an active membership.
    translation: Geef de groepen terug waarvan de gebruiker bij de API-sleutel actief lid is.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3835e6e77bc0ad10:
    english: "`GET /api/b2/groups`"
    translation: "`GET /api/b2/groups`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4f588e981afc3069:
    english: The response contains all matching records in a non-paginated `groups` array. It includes parent groups and subgroups, including groups whose subscription is not currently active. Check the `enabled` field when an integration should operate only on enabled groups.
    translation: Het antwoord bevat alle overeenkomende records in een `groups`-array zonder paginering. Deze omvat bovenliggende groepen en subgroepen, ook als hun abonnement momenteel niet actief is. Controleer het veld `enabled` als een integratie alleen voor ingeschakelde groepen mag werken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  213de8ce539a42c3:
    english: 'Important group fields include:'
    translation: 'Belangrijke groepsvelden zijn:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d377f7c9b224a6d7:
    english: |-
      | Field | Description |
      | --- | --- |
      | `id` | Numeric group ID used by other User API endpoints |
      | `key` | Stable short key used in Loomio URLs |
      | `handle` | Human-readable group handle |
      | `name` | Group name |
      | `full_name` | Group name including its parent-group context |
      | `parent_id` | Numeric parent-group ID for a subgroup, otherwise `null` |
      | `enabled` | Whether the group and its subscription are active |
      | `memberships_count` | Number of active and pending memberships |
      | `accepted_memberships_count` | Number of accepted memberships |
      | `pending_memberships_count` | Number of pending invitations |
      | `admin_memberships_count` | Number of group administrators |
      | `delegates_count` | Number of delegates |
      | `discussions_count` | Number of discussions directly in the group |
      | `polls_count` | Number of polls directly in the group |
      | `subgroups_count` | Number of subgroups |
    translation: |-
      | Veld | Beschrijving |
      | --- | --- |
      | `id` | Numerieke groeps-ID die door andere endpoints van de Gebruikers-API wordt gebruikt |
      | `key` | Vaste korte sleutel die in Loomio-URL's wordt gebruikt |
      | `handle` | Leesbare aanduiding van de groep |
      | `name` | Groepsnaam |
      | `full_name` | Groepsnaam met de context van de bovenliggende groep |
      | `parent_id` | Numerieke ID van de bovenliggende groep voor een subgroep, anders `null` |
      | `enabled` | Of de groep en het abonnement actief zijn |
      | `memberships_count` | Aantal actieve en aangevraagde lidmaatschappen |
      | `accepted_memberships_count` | Aantal geaccepteerde lidmaatschappen |
      | `pending_memberships_count` | Aantal openstaande uitnodigingen |
      | `admin_memberships_count` | Aantal groepsbeheerders |
      | `delegates_count` | Aantal afgevaardigden |
      | `discussions_count` | Aantal discussies direct in de groep |
      | `polls_count` | Aantal peilingen direct in de groep |
      | `subgroups_count` | Aantal subgroepen |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  34f1693ba28fcb80:
    english: The response may include additional group settings, related parent-group records and the API user's memberships. Clients should ignore fields they do not use.
    translation: Het antwoord kan aanvullende groepsinstellingen, gerelateerde records van bovenliggende groepen en de lidmaatschappen van de API-gebruiker bevatten. Clients kunnen velden die ze niet gebruiken negeren.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d7c327b8ed7f7bf2:
    english: "### Get a group"
    translation: "### Een groep ophalen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  15ab63bc2d396657:
    english: Return one group visible to the API-key user.
    translation: Geef één groep terug die zichtbaar is voor de gebruiker bij de API-sleutel.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8ba2cc9e3c67b1dd:
    english: "`GET /api/b2/groups/:id_or_key_or_handle`"
    translation: "`GET /api/b2/groups/:id_or_key_or_handle`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  71e5812ff9890c9b:
    english: The identifier can be the group's numeric ID, key or handle.
    translation: Als identificatie kun je de numerieke ID, sleutel of aanduiding van de groep gebruiken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8ba79a283b7b77d5:
    english: The response contains the group in the `groups` array and uses the same fields as the list endpoint. A request for a group the API-key user cannot access returns a permission error.
    translation: Het antwoord bevat de groep in de `groups`-array en gebruikt dezelfde velden als het endpoint voor de groepslijst. Een verzoek om een groep waartoe de gebruiker bij de API-sleutel geen toegang heeft, geeft een rechtenfout.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  18d823df4d7f8fac:
    english: "## Webhooks"
    translation: "## Webhooks"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f33d58fc1f2fd84c:
    english: 'The User API is request-based: an integration calls Loomio when it wants to read or change data. A group webhook provides the push direction. Loomio sends selected group events to your endpoint as they happen, so an integration does not need to poll the REST API for changes.'
    translation: 'De Gebruikers-API werkt op basis van verzoeken: een integratie roept Loomio aan wanneer ze gegevens wil lezen of wijzigen. Met een groepswebhook stuurt Loomio gegevens de andere kant op. Loomio stuurt geselecteerde groepsgebeurtenissen naar jouw endpoint zodra ze plaatsvinden. Daardoor hoeft een integratie de REST API niet regelmatig op wijzigingen te controleren.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3b5b4b0ac52b9010:
    english: 'Webhooks are configured per group and require group-administrator permission. They can be managed through the Loomio interface:'
    translation: 'Webhooks worden per groep ingesteld en vereisen beheerdersrechten voor die groep. Je kunt ze beheren via de Loomio-interface:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  318710be7b3aae7d:
    english: |-
      1. Open the group.
      2. Open the group menu and select **Chat integrations**.
      3. Add the integration matching the payload format your endpoint accepts. For a general-purpose endpoint, use the Mattermost/Markdown format.
      4. Enter a name and the destination URL.
      5. Select the events that Loomio should send automatically.
      6. Save the integration and use **Test connection** to send a test message.
    translation: |-
      1. Open de groep.
      2. Open het groepsmenu en selecteer **Chatintegraties**.
      3. Voeg de integratie toe waarvan jouw endpoint het gegevensformaat accepteert. Gebruik voor een algemeen endpoint het formaat Mattermost/Markdown.
      4. Voer een naam en de doel-URL in.
      5. Selecteer de gebeurtenissen die Loomio automatisch moet versturen.
      6. Sla de integratie op en gebruik **Test verbinding** om een testbericht te versturen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  43fb95cf304fced6:
    english: Use an HTTPS destination with an unguessable URL. Loomio requires the destination to resolve to a public address and blocks requests to local or private network addresses.
    translation: Gebruik een HTTPS-bestemming met een URL die niet te raden is. Loomio vereist dat de bestemming naar een openbaar adres verwijst en blokkeert verzoeken naar lokale of privénetwerkadressen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d8d5abffe6425bea:
    english: Agents and other integrations can instead manage webhooks through the Bearer-authenticated chatbot endpoints described below. The resource is named `chatbots` for compatibility with Loomio's chat integrations, but it also represents general outgoing webhooks.
    translation: Agents en andere integraties kunnen webhooks ook beheren via de hieronder beschreven chatbot-endpoints met Bearer-authenticatie. De resource heet `chatbots` vanwege de compatibiliteit met de chatintegraties van Loomio, maar omvat ook algemene uitgaande webhooks.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  28fb6371af33b66f:
    english: "### List webhooks"
    translation: "### Webhooks tonen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7187e5a26c3ec864:
    english: Return the chat integrations configured for a group. The API-key user must be an administrator of that group. The response includes destination URLs, so it must not be exposed to ordinary group members.
    translation: Geef de chatintegraties terug die voor een groep zijn ingesteld. De gebruiker bij de API-sleutel moet beheerder van die groep zijn. Het antwoord bevat doel-URL's en mag daarom niet toegankelijk zijn voor gewone groepsleden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  788d370538bdda46:
    english: "`GET /api/b2/chatbots?group_id=123`"
    translation: "`GET /api/b2/chatbots?group_id=123`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d676ca45c3e1074a:
    english: 'The response contains a `chatbots` array with these fields:'
    translation: 'Het antwoord bevat een `chatbots`-array met deze velden:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ca00f7d0a52ce803:
    english: |-
      | Field | Description |
      | --- | --- |
      | `id` | Integration ID used for updates and deletion |
      | `group_id` | Group receiving the events |
      | `name` | Administrative name for the integration |
      | `kind` | `webhook` for an outgoing webhook or `matrix` for a Matrix integration |
      | `webhook_kind` | Payload format: `markdown`, `slack`, `discord`, `microsoft`, or `webex` |
      | `server` | Destination URL |
      | `event_kinds` | Events sent automatically |
