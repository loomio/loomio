  2ae3991d9865a2bb:
    english: "## Invite people to vote in a poll"
    translation: "## Nodig mensen uit om te stemmen in een peiling"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  56d96764605291b4:
    english: Invite people to your poll by sending them a notification.
    translation: Stuur mensen een melding om ze uit te nodigen voor je peiling.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3632ef534c8c03f7:
    english: After you start a poll, the **Invite to vote** box appears. Select an audience such as **Everyone in the thread** or your group, or enter individual names and email addresses.
    translation: Nadat je een peiling hebt gestart, verschijnt het vak **Nodig uit om te stemmen**. Kies wie je wilt uitnodigen, bijvoorbeeld **Iedereen in het bord** of je groep, of voer namen en e-mailadressen in.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  835f178f0b52f3b6:
    english: You can include an optional message with the invitation.
    translation: Je kunt een bericht aan de uitnodiging toevoegen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  78da00061d5815a4:
    english: Select a group chip to expand it into the people you are inviting. Select the x beside a name to remove that person from the invitation.
    translation: Selecteer een groepslabel om te zien welke mensen je uitnodigt. Selecteer de x naast een naam om die persoon uit de uitnodiging te verwijderen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e6969f4c4b62b6ff:
    english: "### Invite guests or experts"
    translation: "### Nodig gasten of deskundigen uit"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9bb72d11863e1f46:
    english: You can also invite a guest to the poll by entering their email address. They will be given permission to participate in only this poll.
    translation: Je kunt ook een gast uitnodigen voor de peiling door diens e-mailadres in te voeren. Die persoon krijgt alleen toestemming om aan deze peiling deel te nemen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dd20b166a40eb798:
    english: If the poll is within a thread, they will also be able to see that thread and its comments. They will not be able to comment, participate in other polls in the thread, or see other threads in the group.
    translation: Als de peiling in een bord staat, kan de gast ook dat bord en de reacties bekijken. De gast kan niet reageren, deelnemen aan andere peilingen in het bord of andere borden in de groep bekijken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  84cc8773a5337094:
    english: "### Invite a subgroup to vote"
    translation: "### Nodig een subgroep uit om te stemmen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  80ca3c8c753b0ebb:
    english: To limit voting to invited people, select **Selected people only** when you create the poll. You can then invite a subgroup from the parent group. See also [Delegated voters](/en/user_manual/groups/delegated_voters/).
    translation: Kies **Alleen voor geselecteerde personen.** wanneer je de peiling maakt om het stemmen te beperken tot uitgenodigde mensen. Je kunt daarna een subgroep uit de bovenliggende groep uitnodigen. Zie ook [Gedelegeerde stemmers](/en/user_manual/groups/delegated_voters/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2074aff770fa7610:
    english: |-
      ![Selecting invited people only](invited-people-only.png)
      ![Inviting a subgroup to vote](invite-voters-subgroup.png)
    translation: |-
      ![Alleen uitgenodigde personen selecteren](invited-people-only.png)
      ![Een subgroep uitnodigen om te stemmen](invite-voters-subgroup.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  29103b18580994a1:
    english: "## Engage people while a poll is running"
    translation: "## Betrek mensen bij een lopende peiling"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1ce57a2542eebaab:
    english: At the bottom of the poll are several features to help you engage with people once the poll is running.
    translation: Onderaan de peiling vind je verschillende functies om mensen bij de lopende peiling te betrekken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  45090f8260d19a47:
    english: "### Add voters to the poll"
    translation: "### Voeg stemmers toe aan de peiling"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3116212829910b50:
    english: You can add new people to the poll at any time, including before voting opens on a scheduled poll.
    translation: Je kunt op elk moment mensen aan de peiling toevoegen, ook voordat het stemmen voor een geplande peiling begint.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5e851e072e9dc1de:
    english: Select **Add voters**, then enter the names or email addresses of the people you want to add.
    translation: Selecteer **Kiezers toevoegen** en voer de namen of e-mailadressen in van de mensen die je wilt toevoegen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  be5aceb4caf93c11:
    english: If the poll has a scheduled opening time and voting has not yet opened, voters will not receive an immediate notification. Instead, they will be notified when voting opens.
    translation: Als de peiling een geplande begintijd heeft en het stemmen nog niet is begonnen, krijgen de stemmers niet meteen een melding. Ze krijgen een melding zodra het stemmen begint.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b9a08269e3e252ce:
    english: "### Remove people from the poll"
    translation: "### Verwijder mensen uit de peiling"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ce37b0af98854c79:
    english: Select **Add voters**, find the person's name, open the three-dot menu beside it, and select **Remove from proposal**.
    translation: Selecteer **Kiezers toevoegen**, zoek de naam van de persoon, open het menu met drie puntjes ernaast en selecteer **Verwijder van voorstel**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '08df94a4269ad100':
    english: People cannot be removed from an anonymous poll.
    translation: Je kunt geen mensen uit een anonieme peiling verwijderen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3d13453394c79f30:
    english: For example, an administrator who creates a poll on behalf of board members can remove themself if they are not authorised to vote.
    translation: Een beheerder die namens bestuursleden een peiling maakt, kan bijvoorbeeld zichzelf verwijderen als die geen stemrecht heeft.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2a354792a1f1f517:
    english: "### Remind people to vote"
    translation: "### Herinner mensen eraan te stemmen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  501e7846380326fd:
    english: Select **Remind** to send a notification to people who have not voted. **Everyone invited to vote** is selected by default. Select the chip to see or change the recipients.
    translation: Selecteer **Herinneren** om mensen die nog niet hebben gestemd een melding te sturen. **Iedereen die uitgenodigd is om te stemmen** is standaard geselecteerd. Selecteer het label om de ontvangers te bekijken of te wijzigen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  04e4537024da788c:
    english: "### View notification history"
    translation: "### Bekijk de meldingsgeschiedenis"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  46145a9dd950c8eb:
    english: Open the three-dot menu (**⋯**) at the bottom of the poll and select **Notification history**.
    translation: Open het menu met drie puntjes (**⋯**) onderaan de peiling en selecteer **Meldingsgeschiedenis**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e74eafb1566d5dea:
    english: "![Notification history in a poll's actions menu](../../discussions/notifying_people/poll_notification_history.png)"
    translation: "![Meldingsgeschiedenis in het actiemenu van een peiling](../../discussions/notifying_people/poll_notification_history.png)"
    status: machine
