---
navigation_title: Выдаленне вашай групы
blocks:
  6e0bf431fbefa0d3:
    english: "# Deleting your group"
    translation: "# Выдаленне вашай групы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f8e8d1ee802cae90:
    english: 'Deleting your Loomio group initiates a process to permanently delete all group data. '
    translation: Выдаленне групы Loomio запускае працэс незваротнага выдалення ўсіх даных групы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  214aa96eca0b90ca:
    english: If there is any data you wish to retain, make sure you [export group data](/en/user_manual/groups/data_export/) and manually download any important files you have uploaded before you continue.
    translation: Калі вы хочаце захаваць якія-небудзь даныя, перад выдаленнем [экспартуйце даныя групы](/en/user_manual/groups/data_export/) і ўручную спампуйце важныя файлы, якія вы загрузілі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  181fecc458dcc49d:
    english: Open the group drop down menu by clicking on the three dots, and select the **Delete group** option to remove access to the group and to initiate deletion of all group data from our records. You must be an admin to delete a group.
    translation: Націсніце на тры кропкі, каб адкрыць меню групы, і выберыце **Выдаліць групу**. Гэта закрые доступ да групы і запусціць выдаленне ўсіх яе даных з нашых сістэм. Выдаліць групу могуць толькі адміністратары.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f5178957964c2bc0:
    english: When you delete a group, it is removed from view immediately and will be permanently deleted after 90 days. You and group members immediately lose access to the group. If a mistake was made, contact us within 90 days of deleting your group to request restoration.
    translation: Пасля выдалення група адразу знікне з прагляду, а праз 90 дзён яе даныя будуць выдалены незваротна. Вы і ўдзельнікі групы адразу страціце да яе доступ. Калі вы выдалілі групу памылкова, звяжыцеся з намі на працягу 90 дзён, каб папрасіць аднавіць яе.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c15f72841d15dc52:
    english: Groups awaiting deletion and their subgroups are unavailable to members and coordinators for viewing, participation, or export, including polls opened from saved links. Members cannot create or edit content, vote, send announcements or reminders, or accept invitations. Export the group and download important files before confirming deletion. Direct discussions and polls are unaffected.
    translation: Удзельнікі і каардынатары не могуць праглядаць групы, якія чакаюць выдалення, і іх падгрупы, удзельнічаць у іх працы або экспартаваць іх даныя. Гэта датычыцца і апытанняў, адкрытых па захаваных спасылках. Удзельнікі не могуць ствараць або рэдагаваць змесціва, галасаваць, адпраўляць абвяшчэнні і напаміны або прымаць запрашэнні. Перад пацвярджэннем выдалення экспартуйце даныя групы і спампуйце важныя файлы. Гэта не ўплывае на непасрэдныя абмеркаванні і апытанні.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5122280818cc30c7:
    english: Scheduling the group for deletion stops pending activity notifications and poll reminders for the group and its subgroups. Messages already being sent may still arrive.
    translation: Пасля прызначэння выдалення групы спыняецца адпраўка запланаваных апавяшчэнняў пра актыўнасць і напамінаў пра апытанні ў групе і яе падгрупах. Паведамленні, якія ўжо адпраўляюцца, могуць яшчэ прыйсці.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  953ebf00860389c1:
    english: The warning email includes counts for the group's subgroups, members, discussions, polls and comments. If you need to keep the group or [export its data](/en/user_manual/groups/data_export/), reply within 90 days so access can be restored before deletion.
    translation: У электронным лісце з папярэджаннем указана колькасць падгруп, удзельнікаў, абмеркаванняў, апытанняў і каментарыяў у групе. Калі вам трэба захаваць групу або [экспартаваць яе даныя](/en/user_manual/groups/data_export/), адкажыце на ліст на працягу 90 дзён, каб доступ можна было аднавіць да выдалення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  17dc58c271e429d5:
    english: Deleting your group will also cancel your Loomio subscription.
    translation: Выдаленне групы таксама скасуе вашу падпіску на Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fa7cec0f3ba570ef:
    english: "![Delete group action in the Oatmilk Cooperative menu](group_delete_group.png)"
    translation: "![Пункт выдалення групы ў меню Oatmilk Cooperative](group_delete_group.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cb0d8b2f2c8b9630:
    english: You will be invited to type the name of your group (*case sensitive*) to confirm you wish to delete your group.
    translation: Каб пацвердзіць выдаленне групы, вам прапануюць увесці яе назву (*з улікам рэгістра літар*).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5430eb3885d98872:
    english: "![Confirmation form requiring the Oatmilk Cooperative handle](group_delete_group_confirm.png)"
    translation: "![Форма пацвярджэння, у якой трэба ўвесці ідэнтыфікатар Oatmilk Cooperative](group_delete_group_confirm.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2df60ea964109f11:
    english: "## Group data is permanently deleted after 90 days"
    translation: "## Даныя групы незваротна выдаляюцца праз 90 дзён"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9e09923078301b8d:
    english: After 90 days, all the threads, polls, files and other group content will be permanently deleted. ***This is non-reversible!***
    translation: Праз 90 дзён усе ніткі, апытанні, файлы і іншае змесціва групы будуць выдалены незваротна. ***Аднавіць іх будзе немагчыма.***
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8695a5ebfb09611d:
    english: We recommend that you [export the group data](/en/user_manual/groups/data_export/)and manually download any important files you have uploaded before you continue.
    translation: Рэкамендуем перад выдаленнем [экспартаваць даныя групы](/en/user_manual/groups/data_export/) і ўручную спампаваць важныя файлы, якія вы загрузілі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
