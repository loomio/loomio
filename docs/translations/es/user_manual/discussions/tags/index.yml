  1d390c0c4f4cea4a:
    english: Category tags make it easy to find threads and polls about a particular type of work or topic.
    translation: Las etiquetas de categoría te ayudan a encontrar hilos y sondeos sobre un tipo de trabajo o tema concreto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  572adf8961fc1178:
    english: |-
      Tags belong to the whole organization. A tag used in a parent group is the
      same tag in its subgroups, making it possible to organize related work across
      the organization. Loomio displays tag names alphabetically and shows their
      colors as dots beside the names.
    translation: |-
      Las etiquetas pertenecen a toda la organización. Una etiqueta usada en un grupo principal es la
      misma en sus subgrupos. Así puedes organizar el trabajo relacionado en toda
      la organización. Loomio muestra los nombres de las etiquetas por orden alfabético y sus
      colores como puntos junto a los nombres.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b5340bcbf37095dc:
    english: |-
      On your group page, click **Tags** above the thread list to see the tags used in
      the current group. Select a tag to show only threads with that tag. Use the
      filter textbox to search a long list, or select **Show more** to include all
      tags in the organization. Select **Show fewer** to return to the current
      group's tags.
    translation: |-
      En la página de tu grupo, haz clic en **Etiquetas** encima de la lista de hilos para ver las etiquetas usadas en
      el grupo actual. Selecciona una etiqueta para mostrar solo los hilos que la tengan. Usa el
      cuadro de filtro para buscar en una lista larga o selecciona **Mostrar más** para incluir todas las
      etiquetas de la organización. Selecciona **Mostrar menos** para volver a las etiquetas
      del grupo actual.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9de81b9a795d066d:
    english: "## Apply tags"
    translation: "## Aplicar etiquetas"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bf284f7568360b53:
    english: Members who can edit a thread or poll can apply tags to it.
    translation: Los miembros que pueden editar un hilo o sondeo también pueden aplicarle etiquetas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  58488fe368513138:
    english: When you start a thread or poll, click the **Tags** field and select one or more tags.
    translation: Al iniciar un hilo o sondeo, haz clic en el campo **Etiquetas** y selecciona una o varias etiquetas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e060934a2853a35a:
    english: Start typing to filter the list. Select a tag again, or click the × on its chip, to remove it.
    translation: Empieza a escribir para filtrar la lista. Para quitar una etiqueta, selecciónala de nuevo o haz clic en la × de su ficha.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9f5e48b7e520d1a0:
    english: "## Create tags"
    translation: "## Crear etiquetas"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  efa789e9365b2ab2:
    english: |-
      Parent-group admins can always create tags for the parent group and its
      subgroups. Subgroup admins can create tags while tagging content in their
      subgroup. The **Members can create tags** group permission, enabled by default,
      allows other members who can tag a thread or poll to create new tag names. If
      the permission is disabled, members can still apply existing tags.
    translation: |-
      Los administradores del grupo principal siempre pueden crear etiquetas para ese grupo y sus
      subgrupos. Los administradores de un subgrupo pueden crear etiquetas al etiquetar contenido de
      su subgrupo. El permiso **Los miembros pueden crear etiquetas**, activado de forma predeterminada,
      permite que otros miembros que pueden etiquetar un hilo o sondeo creen etiquetas nuevas. Si
      el permiso está desactivado, los miembros aún pueden aplicar las etiquetas existentes.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7e06376f3431ad2f:
    english: To create a tag while starting a thread or poll, type its name in the **Tags** field and press Enter.
    translation: Para crear una etiqueta al iniciar un hilo o sondeo, escribe el nombre en el campo **Etiquetas** y pulsa Enter.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
