  f64bc40a8142367d:
    english: Send credentials only in the `Authorization` header. API keys in query strings or request bodies are rejected.
    translation: Передавайте учётные данные только в заголовке `Authorization`. API-ключи в строке запроса или теле запроса отклоняются.
    status: machine
