navigation_title: Supprimer votre groupe
blocks:
  6e0bf431fbefa0d3:
    english: "# Deleting your group"
    translation: "# Supprimer votre groupe"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f8e8d1ee802cae90:
    english: 'Deleting your Loomio group initiates a process to permanently delete all group data. '
    translation: La suppression de votre groupe Loomio lance un processus qui supprimera définitivement toutes les données du groupe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  214aa96eca0b90ca:
    english: If there is any data you wish to retain, make sure you [export group data](/en/user_manual/groups/data_export/) and manually download any important files you have uploaded before you continue.
    translation: Si vous souhaitez conserver des données, veillez à [exporter les données du groupe](/en/user_manual/groups/data_export/) et à télécharger manuellement les fichiers importants que vous avez ajoutés avant de continuer.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  181fecc458dcc49d:
    english: Open the group drop down menu by clicking on the three dots, and select the **Delete group** option to remove access to the group and to initiate deletion of all group data from our records. You must be an admin to delete a group.
    translation: Cliquez sur les trois points pour ouvrir le menu du groupe, puis choisissez **Supprimer le groupe**. Cette action retire l’accès au groupe et lance la suppression de toutes ses données de nos systèmes. Vous devez être administrateur pour supprimer un groupe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f5178957964c2bc0:
    english: When you delete a group, it is removed from view immediately and will be permanently deleted after 90 days. You and group members immediately lose access to the group. If a mistake was made, contact us within 90 days of deleting your group to request restoration.
    translation: Lorsque vous supprimez un groupe, il disparaît immédiatement et ses données sont définitivement supprimées après 90 jours. Vous et les membres du groupe perdez immédiatement l’accès au groupe. Si vous l’avez supprimé par erreur, contactez-nous dans les 90 jours pour demander sa restauration.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c15f72841d15dc52:
    english: Groups awaiting deletion and their subgroups are unavailable to members and coordinators for viewing, participation, or export, including polls opened from saved links. Members cannot create or edit content, vote, send announcements or reminders, or accept invitations. Export the group and download important files before confirming deletion. Direct discussions and polls are unaffected.
    translation: Les membres et les administrateurs ne peuvent plus consulter les groupes en attente de suppression ni leurs sous-groupes, y participer ou en exporter les données. Cela comprend les sondages ouverts à partir de liens enregistrés. Les membres ne peuvent plus créer ni modifier de contenu, voter, envoyer des annonces ou des rappels, ni accepter des invitations. Exportez les données du groupe et téléchargez les fichiers importants avant de confirmer la suppression. Les discussions directes et les sondages directs ne sont pas concernés.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5122280818cc30c7:
    english: Scheduling the group for deletion stops pending activity notifications and poll reminders for the group and its subgroups. Messages already being sent may still arrive.
    translation: La programmation de la suppression du groupe arrête les notifications d’activité et les rappels de sondage en attente pour le groupe et ses sous-groupes. Les messages déjà en cours d’envoi peuvent encore arriver.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  953ebf00860389c1:
    english: The warning email includes counts for the group's subgroups, members, discussions, polls and comments. If you need to keep the group or [export its data](/en/user_manual/groups/data_export/), reply within 90 days so access can be restored before deletion.
    translation: L’e-mail d’avertissement indique le nombre de sous-groupes, de membres, de discussions, de sondages et de commentaires du groupe. Si vous souhaitez conserver le groupe ou [exporter ses données](/en/user_manual/groups/data_export/), répondez dans les 90 jours afin que l’accès puisse être rétabli avant la suppression.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  17dc58c271e429d5:
    english: Deleting your group will also cancel your Loomio subscription.
    translation: La suppression de votre groupe résilie également votre abonnement Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fa7cec0f3ba570ef:
