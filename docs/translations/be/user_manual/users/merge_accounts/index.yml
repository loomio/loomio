---
navigation_title: Аб'яднаць рахункі
blocks:
  e3a50952a2ce6cfc:
    english: "# Merge accounts"
    translation: "# Аб'яднаць рахункі"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e0bdfaac5741d310:
    english: Merge two Loomio accounts when each account uses a different email address and you want to continue with one account.
    translation: Аб'яднайце два ўліковыя запісы Loomio з рознымі адрасамі электроннай пошты, каб працягваць карыстацца адным уліковым запісам.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '08d4fcba2e0a2b3b':
    english: 'Before you begin, decide which account you want to keep:'
    translation: 'Перш чым пачаць, вырашыце, які ўліковы запіс хочаце захаваць:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6f7efc1ebdc680c7:
    english: |-
      - The **account to keep** is the account whose email address and profile you will use after the merge
      - The **account to retire** is the account you sign in to first. Its email address will no longer work for signing in after the merge
    translation: |-
      - **Уліковы запіс, які вы захаваеце**, — гэта запіс, адрас электроннай пошты і профіль якога вы будзеце выкарыстоўваць пасля аб'яднання
      - **Уліковы запіс, які вы выдаліце**, — гэта запіс, у які трэба ўвайсці спачатку. Пасля аб'яднання яго адрас электроннай пошты больш нельга будзе выкарыстоўваць для ўваходу
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  060fb4b1c12c153a:
    english: You need access to both accounts and to the email address of the account you want to keep.
    translation: Вам патрэбны доступ да абодвух уліковых запісаў і да адраса электроннай пошты ўліковага запісу, які вы хочаце захаваць.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9c9a7e082a3b67ae:
    english: |-
      > [!WARNING]
      > Merging accounts is irreversible. Check the source and target email addresses carefully before the final confirmation.
    translation: |-
      > [!WARNING]
      > Аб'яднанне ўліковых запісаў нельга адмяніць. Перад канчатковым пацвярджэннем уважліва праверце адрасы электроннай пошты абодвух уліковых запісаў.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4d6defccb0f2a2ec:
    english: "## Start the merge"
    translation: "## Пачніце аб'яднанне"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0c49f5d2284571d3:
    english: |-
      1. Sign in to the **account you want to retire**.
      2. Open the sidebar, select your name, and select **Edit profile**.
      3. Select **Merge accounts**.
    translation: |-
      1. Увайдзіце ва **ўліковы запіс, які вы хочаце выдаліць**.
      2. Адкрыйце бакавую панэль, выберыце сваё імя, затым выберыце **Рэдагаваць профіль**.
      3. Выберыце **Аб'яднаць рахункі**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a05689d18f3c3337:
    english: "![The profile actions with Merge accounts highlighted](merge_accounts_profile.png)"
    translation: "![Дзеянні з профілем, дзе вылучана «Аб'яднаць рахункі»](merge_accounts_profile.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  29656e0572127b88:
    english: 4. Enter the destination account's email address—the address belonging to the **account you want to keep**—and select **Send verification email**. Loomio always shows the same confirmation and signs you out. If an account uses that address, Loomio sends it the verification email.
    translation: 4. Увядзіце адрас электроннай пошты **ўліковага запісу, які вы хочаце захаваць**, і выберыце **Адправіць ліст з пацвярджэннем**. Loomio пакажа адно і тое ж пацвярджэнне незалежна ад таго, ці існуе ўліковы запіс з гэтым адрасам, і завершыць ваш сеанс. Калі такі ўліковы запіс існуе, Loomio адправіць на гэты адрас ліст для пацвярджэння.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d045b6c7e8a5b853:
    english: "## Verify the account you want to keep"
    translation: "## Пацвердзіце ўліковы запіс, які хочаце захаваць"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  57255cdb29b384d7:
    english: 5. Open the verification email sent to the address of the account you want to keep and select **Verify email and proceed**.
    translation: 5. Адкрыйце ліст для пацвярджэння, адпраўлены на адрас уліковага запісу, які вы хочаце захаваць, і выберыце **Праверце адрас электроннай пошты і працягвайце**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5e496b2d8f551efa:
    english: "![The merge verification email with the Verify email and proceed button highlighted](merge_accounts_email.png)"
    translation: "![Ліст для пацвярджэння аб'яднання, дзе вылучана кнопка «Праверце адрас электроннай пошты і працягвайце»](merge_accounts_email.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ad19dc0399f9d446:
    english: |-
      6. Sign in as the account you want to keep if Loomio asks you to sign in.
      7. On the **Confirm merge** page, check both email addresses again. Select **Merge accounts** to complete the merge.
    translation: |-
      6. Калі Loomio папросіць вас увайсці, увайдзіце ва ўліковы запіс, які хочаце захаваць.
      7. На старонцы **Пацвердзіць аб'яднанне** яшчэ раз праверце абодва адрасы электроннай пошты. Выберыце **Аб'яднаць рахункі**, каб завяршыць аб'яднанне.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a575e2cd16aa66b4:
    english: "![The final confirmation page with the Merge accounts button highlighted](merge_accounts_confirm.png)"
    translation: "![Старонка канчатковага пацвярджэння, дзе вылучана кнопка «Аб'яднаць рахункі»](merge_accounts_confirm.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cf8eba685cfdbf04:
    english: "## What happens after the merge"
    translation: "## Што адбудзецца пасля аб'яднання"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6ae4c6c893430735:
    english: The account you keep remains your Loomio identity and sign-in account. Group memberships and activity from the retired account, including discussions, comments, polls, and votes, are reassigned to the account you keep. Where both accounts already belong to the same group, the existing membership for the account you keep remains.
    translation: Уліковы запіс, які вы захаваеце, застанецца вашым профілем Loomio і запісам для ўваходу. Удзел у групах і дзеянні з выдаленага ўліковага запісу, у тым ліку абмеркаванні, каментарыі, апытанні і галасы, будуць перанесены ва ўліковы запіс, які вы захаваеце. Калі абодва ўліковыя запісы ўжо належаць да адной групы, захаваецца ўдзел у гэтай групе ўліковага запісу, які вы пакінеце.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  eb05b57367c0815c:
    english: The retired account is deleted and its email address can no longer be used to sign in. Loomio sends a confirmation email to the address of the account you kept when the merge is complete.
    translation: Другі ўліковы запіс будзе выдалены, і яго адрас электроннай пошты больш нельга будзе выкарыстоўваць для ўваходу. Пасля завяршэння аб'яднання Loomio адправіць ліст з пацвярджэннем на адрас уліковага запісу, які вы захавалі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
