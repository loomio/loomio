    translation: "## Navegação"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e96aef7a28a85001:
    english: 'The **Jump to** section of the right sidebar helps you move through a thread:'
    translation: 'A seção **Pular para** da barra lateral direita ajuda você a navegar pela discussão:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4790c088af5fc09f:
    english: |-
      - **Start** goes to the discussion context
      - **New to you** appears when the thread contains activity you have not read
      - **Latest** appears when newer activity is available beyond the items currently loaded
      - milestone links go directly to important comments, polls, and outcomes
      - **End** goes to the latest item in the thread
    translation: |-
      - **Iniciar** leva ao contexto da discussão
      - **Novo para você** aparece quando há atividades na discussão que você ainda não leu
      - **Mais recente** aparece quando há atividades mais recentes além dos itens carregados
      - os links para marcos importantes levam diretamente a comentários, enquetes e conclusões relevantes
      - **Fim** leva ao item mais recente da discussão
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  941ea9900465724a:
    english: Comments that include an H2 or H3 heading, polls, and proposals are automatically included as milestone links. Select any milestone to go directly to it.
    translation: Comentários com um título H2 ou H3, enquetes e propostas são incluídos automaticamente como links para marcos importantes. Selecione um deles para ir diretamente ao item.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e94ea6f4b9dae8d4:
    english: When you add a comment, poll, vote, or outcome, Loomio marks your own new item as read. It will not appear as something new for you to review.
    translation: Quando você adiciona um comentário, uma enquete, um voto ou uma conclusão, o Loomio marca esse novo item como lido para você. Ele não aparecerá como uma novidade para você revisar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  34251ada1ba3e50b:
    english: "## Notifications and members"
    translation: "## Notificações e participantes"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  36a20a0e10208c7c:
    english: The right sidebar controls your email notifications and shows who has been invited, who has seen the thread, and who has been notified.
    translation: Na barra lateral direita, você controla suas notificações por e-mail e vê quem foi convidado, quem viu a discussão e quem recebeu uma notificação.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f2a437ac1169c882:
    english: "### Email notifications for this thread"
    translation: "### Notificações por e-mail desta discussão"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9bd7269489ed048e:
    english: Select the current notification setting to choose whether Loomio emails you about all activity, only activity that specifically notifies you, or no activity. Receiving email for all activity can produce many messages in an active thread.
    translation: Selecione a configuração atual de notificações para escolher se o Loomio envia e-mails sobre todas as atividades, apenas sobre atividades que notificam você especificamente ou sobre nenhuma atividade. Receber e-mails sobre todas as atividades pode gerar muitas mensagens em uma discussão movimentada.
    status: machine
    provider: codex/gpt-6-sol
