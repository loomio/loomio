    translated_on: '2026-09-29'
  d128ccedfd3f1379:
    english: See [Notifications](/en/user_manual/users/email_settings) to learn about in-app notifications, email preferences, and notification settings for groups and discussions.
    translation: Про сповіщення в застосунку, налаштування електронних листів і сповіщень для груп та обговорень читайте в розділі [Сповіщення](/en/user_manual/users/email_settings).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
