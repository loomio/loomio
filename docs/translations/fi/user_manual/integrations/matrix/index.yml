  f3106c22cd3d4059:
    english: 'Loomio can send notifications into your Matrix channels when new discussions, proposals, comments, votes, and outcomes occur. '
    translation: Loomio voi lähettää Matrix-kanaviisi ilmoituksia uusista keskusteluista, ehdotuksista, kommenteista, äänistä ja kyselyiden yhteenvedoista.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a20cf2be00dac0ce:
    english: Matrix is nice because it allows some HTML in the chatroom, and Loomio takes advantage of this.
    translation: Matrixin keskusteluhuoneissa voi käyttää HTML-muotoilua, jota Loomio hyödyntää ilmoituksissa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ffe12502f0030fec:
    english: Our Matrix integration is a little different to our other chat integrations - it does not use a webhook - we've built a custom bot client for this one.
    translation: Matrix-integraatio toimii eri tavalla kuin muut keskustelupalvelujen integraatiomme. Se ei käytä webhookia, vaan sitä varten on rakennettu oma bottiohjelma.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  44db147f65127a55:
    english: You will need to create a matrix user for the bot to login as.
    translation: Luo botille Matrix-käyttäjätili, jolla se voi kirjautua sisään.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  98045e5bf1339543:
    english: Once you've created a user for the bot, sign in at that user to obtain the following information.
    translation: Kun olet luonut botin käyttäjätilin, kirjaudu sisään sillä saadaksesi seuraavat tiedot.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
