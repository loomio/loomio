  b3a4dee73762bea4:
    english: "## Eligible voters and votes cast"
    translation: "## Äänestäjäoikeutetut ja annetut äänet"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1d04d75fa16a2a18:
    english: The percentage can be based on either **Votes cast** or **Eligible voters**.
    translation: Prosenttiosuuden perusteeksi voit valita joko **Annetut äänet** tai **Äänestäjäoikeutetut**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  590e1a316f9ad174:
    english: "![Choosing whether a vote share requirement uses votes cast or eligible voters](./eligible-vs-cast.png)"
    translation: "![Valinta, lasketaanko ääniosuusvaatimus annetuista äänistä vai äänestäjäoikeutetuista](./eligible-vs-cast.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d4c72d50982e071d:
    english: "**Eligible voters** means everyone who is able to vote in the proposal. **Votes cast** means only the votes that have been submitted."
    translation: "**Äänestäjäoikeutetut** tarkoittaa kaikkia, jotka voivat äänestää ehdotuksessa. **Annetut äänet** tarkoittaa vain lähetettyjä ääniä."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  24945a1a4f0d08e3:
    english: A requirement of 75 percent agreement from eligible voters can pass only when at least 75 percent of all eligible voters vote for that option.
    translation: Jos vaatimus on 75 prosenttia äänestäjäoikeutetuista, ehdotus voidaan hyväksyä vain, kun vähintään 75 prosenttia kaikista äänestäjäoikeutetuista äänestää kyseisen vaihtoehdon puolesta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  14e4ff7cd000c7af:
    english: A requirement of 60 percent agreement from votes cast can pass when 60 percent of submitted votes support the option, regardless of overall turnout. Add a quorum when your process also requires a minimum level of participation.
    translation: Jos vaatimus on 60 prosenttia annetuista äänistä, ehdotus voidaan hyväksyä, kun 60 prosenttia lähetetyistä äänistä kannattaa vaihtoehtoa, vaikka kaikki äänestäjäoikeutetut eivät äänestäisi. Lisää päätösvaltaisuusvaatimus, jos prosessisi edellyttää myös osallistumisen vähimmäistasoa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a8f235434b40ecd9:
    english: "## Different vote share requirements"
    translation: "## Useita ääniosuusvaatimuksia"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6682c9656815bdbc:
    english: 'A proposal can have requirements on more than one option. For example:'
    translation: 'Voit asettaa vaatimuksia ehdotuksen useammalle vaihtoehdolle. Esimerkiksi:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dac1980305bef52d:
    english: |-
      - Agreement must be at least 75 percent of eligible voters
      - Abstention must be no more than 30 percent of votes cast
      - Block must be no more than 0 percent of votes cast
    translation: |-
      - Kannatuksen on oltava vähintään 75 prosenttia äänestäjäoikeutetuista
      - Äänestämisestä pidättäytyvien osuus saa olla enintään 30 prosenttia annetuista äänistä
      - Ehdotuksen estävien äänten osuus saa olla enintään 0 prosenttia annetuista äänistä
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  11325e607f603eb7:
    english: You can also add requirements to a [poll template](/en/user_manual/polls/poll_templates/) so that new proposals created from the template use them by default.
    translation: Voit lisätä vaatimukset myös [kyselymalliin](/en/user_manual/polls/poll_templates/), jolloin mallista luodut uudet ehdotukset käyttävät niitä oletusarvoisesti.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
