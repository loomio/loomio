---
navigation_title: Ананімнае галасаванне
blocks:
  b4e842083054a400:
    english: "# Anonymous voting"
    translation: "# Ананімнае галасаванне"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9b5c46644a952388:
    english: Anonymous voting, also known as blind voting, separates the record of who has voted from the votes themselves. Poll coordinators can see who was eligible and, once at least three people have voted, verify participation. Application users cannot connect a submitted vote with the person who submitted it.
    translation: Пры ананімным галасаванні, якое таксама называюць сляпым, звесткі пра тое, хто прагаласаваў, захоўваюцца асобна ад саміх галасоў. Каардынатары апытання могуць бачыць, хто меў права голасу, а пасля таго, як прагаласуюць прынамсі тры чалавекі, — правяраць удзел. Карыстальнікі праграмы не могуць вызначыць, хто падаў канкрэтны голас.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  105abff68025f002:
    english: This page explains the protections provided by anonymous voting, the information that is retained, and the limits of the guarantee.
    translation: На гэтай старонцы тлумачыцца, як абараняецца ананімнасць галасавання, якія звесткі захоўваюцца і дзе праходзяць межы гэтай абароны.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6d97c8b835a3f1f2:
    english: "## How anonymous voting protects voters"
    translation: "## Як ананімнае галасаванне абараняе выбар людзей"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e01d5c77096b953e:
    english: 'An anonymous poll keeps two separate sets of records:'
    translation: 'У ананімным апытанні асобна захоўваюцца два наборы запісаў:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  757ab56b1165a71d:
    english: |-
      | Participation records | Submitted votes |
      | --- | --- |
      | Who is eligible to vote | The selected options or scores |
      | Who was invited, and by whom | The poll the vote belongs to |
      | Whether each eligible person has voted | No name or user account |
      | No selected options or scores | No link to a participation record |
    translation: |-
      | Запісы пра ўдзел | Пададзеныя галасы |
      | --- | --- |
      | Хто мае права голасу | Выбраныя варыянты або адзнакі |
      | Каго запрасілі і хто запрасіў | Апытанне, да якога належыць голас |
      | Ці прагаласавалі людзі, якія маюць права голасу | Без імя або ўліковага запісу карыстальніка |
      | Без выбраных варыянтаў або адзнак | Без сувязі з запісам пра ўдзел |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b908c49acc827932:
    english: There is no shared identifier that connects these records. Submitted votes also omit the actual submission time, invitation information, written reasons, attachments, and other metadata that could help identify a voter.
    translation: У гэтых запісаў няма агульнага ідэнтыфікатара, які мог бы іх звязаць. Пададзеныя галасы таксама не ўтрымліваюць дакладнага часу падачы, звестак пра запрашэнне, пісьмовых абгрунтаванняў, укладанняў ды іншых метаданых, якія маглі б дапамагчы вызначыць асобу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6430a3d863d135b6:
    english: This separation is enforced when the vote is stored. It does not depend only on hiding names in the interface.
    translation: Гэты падзел забяспечваецца пры захаванні голасу. Абарона не абмяжоўваецца тым, што імёны схаваныя ў інтэрфейсе.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b8e31aef3d559f28:
    english: "## While voting is open"
    translation: "## Пакуль галасаванне адкрытае"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f905c85734898a41:
    english: Results remain hidden from everyone until the poll closes. This includes poll coordinators, group administrators, and instance administrators using the application.
    translation: Вынікі застаюцца схаванымі для ўсіх да закрыцця апытання. Гэта датычыцца і каардынатараў апытання, і адміністратараў групы, і адміністратараў асобніка, якія карыстаюцца праграмай.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  828df5247b61c9e6:
    english: 'When someone votes:'
    translation: 'Калі людзі галасуюць:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  69b471d43b2148a1:
    english: |-
      - their submitted vote is stored without their name or participation record;
      - their participation record is marked to show that they have voted;
      - no vote event, notification, email, comment, or activity entry is created;
      - no copy of their selections is returned after submission; and
      - the interface confirms only that their vote was recorded.
    translation: |-
      - пададзены голас захоўваецца без імя і без сувязі з запісам пра ўдзел;
      - у запісе пра ўдзел пазначаецца, што голас пададзены;
      - не ствараюцца падзея галасавання, апавяшчэнне, электронны ліст, каментар або запіс пра актыўнасць;
      - пасля падачы голасу інтэрфейс не вяртае копію выбраных варыянтаў; і
      - інтэрфейс пацвярджае толькі тое, што голас запісаны.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4ffe4b38db135dab:
    english: The participation record does not store a precise time for when the person voted. Submitted votes are not ordered by submission time.
    translation: У запісе пра ўдзел не захоўваецца дакладны час галасавання. Пададзеныя галасы не ўпарадкаваныя паводле часу падачы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7acaf6b48fc42105:
    english: "## Votes cannot be changed"
    translation: "## Галасы нельга змяніць"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  996ef90a3eee857b:
    english: Each eligible person can vote once. A submitted anonymous vote cannot be reviewed, changed, withdrawn, or replaced, including by a coordinator or administrator.
    translation: Кожны чалавек, які мае права голасу, можа прагаласаваць адзін раз. Пасля падачы ананімны голас нельга прагледзець, змяніць, адклікаць або замяніць. Гэта не могуць зрабіць і каардынатары або адміністратары.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  58f0aaa6a45c1d37:
    english: Allowing a person to retrieve or replace their vote would require a persistent link between that person and the vote. Anonymous voting deliberately does not create that link.
    translation: Каб даць людзям магчымасць знайсці або замяніць свой голас, патрэбная пастаянная сувязь паміж чалавекам і голасам. Пры ананімным галасаванні такая сувязь не ствараецца.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2fd2c9d6ab0d6f68:
    english: Review your selections carefully before submitting.
    translation: Уважліва праверце свой выбар перад падачай голасу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  59f83c0e359484c4:
    english: "## Why anonymous votes do not have reasons"
    translation: "## Чаму ў ананімных галасоў няма абгрунтаванняў"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  89f9d9a1d4bcb395:
    english: New anonymous votes cannot include a written reason or an attachment. Reasons can contain names, personal details, writing patterns, mentions, or other information that identifies the voter. They would also make individual votes easier to distinguish from the aggregate result.
    translation: Пры падачы новых ананімных галасоў нельга дадаваць пісьмовае абгрунтаванне або ўкладанне. Абгрунтаванні могуць утрымліваць імёны, асабістыя звесткі, асаблівасці пісьма, згадкі ды іншую інфармацыю, якая дазваляе вызначыць асобу. Яны таксама могуць дапамагчы адрозніць асобныя галасы ад агульнага выніку.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  932f88aa929fb4eb:
    english: Participants can still discuss the poll in its thread where discussion is available. Those comments are ordinary named discussion contributions and are not attached to an anonymous vote.
    translation: Там, дзе даступнае абмеркаванне, удзельнікі па-ранейшаму могуць абмяркоўваць апытанне ў яго нітцы. Такія каментары — звычайныя імянныя допісы ў абмеркаванні. Яны не далучаюцца да ананімнага голасу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1b21c2826270bd52:
    english: "## Results and exports"
    translation: "## Вынікі і экспарт"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  afc45e50b74e075b:
    english: After the poll closes, the results are calculated from the detached votes and displayed as totals and other aggregate results supported by the poll type.
    translation: Пасля закрыцця апытання вынікі падлічваюцца на аснове галасоў, аддзеленых ад звестак пра ўдзел. Яны паказваюцца як агульныя падлікі і іншыя сукупныя вынікі, якія падтрымлівае гэты тып апытання.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b28c82ffcb4ffeb5:
    english: The application does not publish vote identifiers, submission order, or submission times. Poll exports contain aggregate results rather than a row for each anonymous vote, except that a closed STV election can be exported in BLT format. A BLT export contains the candidate rankings needed to recount the election, grouped when multiple ballots have the same ranking, without voter identities or ballot metadata.
    translation: Праграма не публікуе ідэнтыфікатары галасоў, парадак іх падачы або час падачы. Экспарт апытання змяшчае сукупныя вынікі, а не асобны радок для кожнага ананімнага голасу. Выключэнне — закрытыя выбары паводле сістэмы STV, якія можна экспартаваць у фармаце BLT. Экспарт BLT змяшчае рэйтынгі кандыдатаў, патрэбныя для паўторнага падліку. Бюлетэні з аднолькавым рэйтынгам аб’ядноўваюцца ў групы; асобы выбаршчыкаў і метаданыя бюлетэняў не ўключаюцца.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8088fc78d955e9bb:
    english: An anonymous poll cannot be reopened after it closes.
    translation: Пасля закрыцця ананімнае апытанне нельга адкрыць зноў.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c368b542923cd542:
    english: "## Participation verification"
    translation: "## Праверка ўдзелу"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ab086d63c01514bf:
    english: Poll coordinators can view the named participation records. These always show who was eligible. Once at least three people have voted, they also show whether each person voted, but never show how anyone voted. If a poll closes with fewer than three votes, the participation status remains hidden.
    translation: Каардынатары апытання могуць праглядаць імянныя запісы пра ўдзел. У іх заўсёды відаць, хто меў права голасу. Пасля таго, як прагаласуюць прынамсі тры чалавекі, таксама становіцца відаць, хто прагаласаваў, але не тое, як яны прагаласавалі. Калі да закрыцця апытання пададзена менш за тры галасы, звесткі пра ўдзел застаюцца схаванымі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dcad5d728e5e7cfd:
    english: Other participants cannot view this named participation information. Access to poll results does not grant access to the participation records.
    translation: Іншыя ўдзельнікі не могуць праглядаць гэтыя імянныя звесткі пра ўдзел. Доступ да вынікаў апытання не дае доступу да запісаў пра ўдзел.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  37cf06402ac47fa2:
    english: |-
      Coordinators can add eligible people while voting remains open, including after
      other people have voted. Existing voters cannot be removed from an anonymous
      poll.
    translation: |-
      Пакуль галасаванне адкрытае, каардынатары могуць дадаваць людзей, якія маюць права голасу, у тым ліку пасля таго, як
      іншыя людзі ўжо прагаласавалі. Людзей, якія ўжо прагаласавалі, нельга выдаліць з ананімнага
      апытання.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  705e9b807681f6c1:
    english: "## Reminders"
    translation: "## Напаміны"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8ef8b501a1b27f63:
    english: For an anonymous poll lasting at least 24 hours, eligible people who have not voted receive one automatic reminder during the final 24 hours.
    translation: Калі ананімнае апытанне доўжыцца прынамсі 24 гадзіны, людзі, якія маюць права голасу і яшчэ не прагаласавалі, атрымліваюць адзін аўтаматычны напамін у апошнія 24 гадзіны.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b23e579a8ef628de:
    english: The reminder is selected from participation records only. It does not inspect submitted votes or create a connection to them. If the deadline changes, the hourly reminder check uses the current deadline without maintaining a separate scheduled reminder for the poll.
    translation: Атрымальнікі напаміну вызначаюцца толькі па запісах пра ўдзел. Пададзеныя галасы не правяраюцца і сувязь з імі не ствараецца. Калі тэрмін завяршэння змяняецца, штогадзінная праверка напамінаў выкарыстоўвае актуальны тэрмін. Асобны запланаваны напамін для апытання не захоўваецца.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  053ce04ce5f98ed8:
    english: Polls with a total voting period of less than 24 hours do not send this automatic reminder.
    translation: Калі ўвесь перыяд галасавання карацейшы за 24 гадзіны, такі аўтаматычны напамін не адпраўляецца.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fb1f13e60fe178fe:
    english: "## What coordinators and administrators can see"
    translation: "## Што могуць бачыць каардынатары і адміністратары"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e59c22e94231a746:
    english: 'Through the application, a poll coordinator, group administrator, or instance administrator may be able to see:'
    translation: 'У праграме каардынатарам апытання, адміністратарам групы або адміністратарам асобніка могуць быць даступныя:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2da6b1feaa8b36f1:
    english: |-
      - the poll and its eligible voters;
      - whether each eligible person has voted, where their role permits access and at least three people have voted; and
      - aggregate results after the poll closes.
    translation: |-
      - апытанне і спіс людзей, якія маюць права голасу;
      - звесткі пра тое, хто прагаласаваў, калі гэта дазваляе іх роля і прагаласавалі прынамсі тры чалавекі; і
      - сукупныя вынікі пасля закрыцця апытання.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6a96a87699625dc6:
    english: 'They cannot use application features to see:'
    translation: 'Функцыі праграмы не дазваляюць ім убачыць:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dd4756253d1ee6dc:
    english: |-
      - which selections belong to a person;
      - individual votes or voting patterns;
      - when a particular vote was submitted; or
      - a reason, attachment, event, or notification associated with a submitted vote.
    translation: |-
      - якія варыянты выбраў канкрэтны чалавек;
      - асобныя галасы або заканамернасці галасавання;
      - калі быў пададзены канкрэтны голас; або
      - абгрунтаванне, укладанне, падзею ці апавяшчэнне, звязаныя з пададзеным голасам.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c350875c33492237:
    english: "## Limits of anonymous voting"
    translation: "## Межы абароны ананімнага галасавання"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  48d04d7b4817e710:
    english: These protections prevent application users from linking a submitted vote to its voter. They are not a cryptographic protection against an operator who can inspect the database, backups, server logs, process memory, network traffic, or a modified version of the application.
    translation: Гэтая абарона не дазваляе карыстальнікам праграмы звязаць пададзены голас з чалавекам, які яго падаў. Яна не забяспечвае крыптаграфічнай абароны ад аператараў, якія могуць праглядаць базу даных, рэзервовыя копіі, журналы сервера, памяць працэсаў, сеткавы трафік або змененую версію праграмы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f901f505362e46b4:
    english: The result itself may also reveal information. A small electorate, a unanimous result, a distinctive combination of selections, or information shared outside the poll can make a person's choices easier to infer. Voters may also choose to identify themselves in discussion outside their submitted vote.
    translation: Сам вынік таксама можа раскрыць інфармацыю. Калі выбаршчыкаў мала, вынік аднагалосны, спалучэнне выбраных варыянтаў незвычайнае або звесткі распаўсюджаныя па-за апытаннем, зрабіць выснову пра выбар чалавека можа быць прасцей. Людзі таксама могуць самі раскрыць свой выбар у абмеркаванні па-за пададзеным голасам.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dfe97db86db52d15:
    english: Consider the size of the electorate and the sensitivity of the decision when deciding whether application-level anonymous voting is suitable.
    translation: Вырашаючы, ці падыходзіць ананімнае галасаванне ў дадатку, улічвайце колькасць людзей, якія маюць права голасу, і адчувальнасць рашэння.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  60cc6f1a0163ec5d:
    english: "## Questions"
    translation: "## Пытанні"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  57615f2c4c040dce:
    english: "### Can a coordinator see how I voted?"
    translation: "### Ці можа каардынатар убачыць, як я прагаласаваў(-ла)?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9dc1d151cc90e94e:
    english: No. Once at least three people have voted, a coordinator can verify whether you voted but cannot connect you with a submitted vote through the application. Below that threshold, your participation status remains hidden.
    translation: Не. Калі прагаласавалі прынамсі тры чалавекі, каардынатар можа праверыць, ці прагаласавалі вы, але не можа праз дадатак звязаць вас з пададзеным голасам. Пакуль галасоў менш за тры, звесткі пра ваш удзел застаюцца схаванымі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b3b382d2575b715d:
    english: "### Can I see my vote after submitting it?"
    translation: "### Ці магу я ўбачыць свой голас пасля падачы?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  52aaaa1c764d5745:
    english: No. The application confirms that your vote was recorded, then discards the selections from the voting interface. It cannot retrieve your vote without creating the link that anonymous voting is designed to avoid.
    translation: Не. Дадатак пацвярджае, што ваш голас запісаны, а затым прыбірае ваш выбар з інтэрфейсу галасавання. Каб зноў паказаць ваш голас, спатрэбілася б стварыць сувязь, якой ананімнае галасаванне павінна пазбягаць.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  071dd89d6eb38ebf:
    english: "### Can I change or withdraw my vote?"
    translation: "### Ці магу я змяніць або адклікаць свой голас?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '059b75c51b4225ab':
    english: No. There is no link that would let the application identify which submitted vote to change or remove.
    translation: Не. Няма сувязі, якая дазволіла б дадатку вызначыць, які з пададзеных галасоў трэба змяніць або выдаліць.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c94077837455425f:
    english: "### Will I receive an email confirming my vote?"
    translation: "### Ці атрымаю я ліст з пацвярджэннем майго голасу?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f36a8b43a3fdee36:
    english: No. Voting creates only the on-screen acknowledgement and updates your participation record. It does not send a confirmation email or create a notification or activity event.
    translation: Не. Пасля галасавання на экране з'яўляецца толькі пацвярджэнне, а запіс пра ваш удзел абнаўляецца. Ліст з пацвярджэннем не адпраўляецца; апавяшчэнне або падзея актыўнасці не ствараюцца.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f320754cf7ee77bc:
    english: "### Does a public poll reveal more information?"
    translation: "### Ці раскрывае публічнае апытанне больш звестак?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f84121f0c18e03ab:
    english: Public access may allow people to see the poll and its aggregate results after it closes. It does not expose the named participation records or individual anonymous votes.
    translation: Публічны доступ можа дазваляць людзям бачыць апытанне і зводныя вынікі пасля яго закрыцця. Ён не адкрывае імянныя запісы пра ўдзел або асобныя ананімныя галасы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e2dbe0c181f865ca:
    english: "### Is anonymous voting suitable for every election?"
    translation: "### Ці падыходзіць ананімнае галасаванне для любых выбараў?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  05fc871619a2170d:
    english: No. It provides application-level separation between identities and votes. Decisions requiring protection from system operators or independently verifiable cryptographic elections need a system designed for those requirements.
    translation: Не. Яно аддзяляе асобы ад галасоў на ўзроўні дадатку. Калі патрэбна абарона ад аператараў сістэмы або незалежная крыптаграфічная праверка выбараў, патрэбна сістэма, распрацаваная для такіх патрабаванняў.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
