navigation_title: שימוש בשרשורים
blocks:
  d6fe7310d19b1141:
    english: "# Using threads"
    translation: "# שימוש בשרשורים"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  031f9244f107aba8:
    english: A discussion keeps its context, comments, decisions, and outcomes together in one thread. This page explains how to participate in a thread and use its navigation and actions.
    translation: דיון מרכז בשרשור אחד את הרקע, ההערות, ההחלטות והמסקנות. בדף זה מוסבר כיצד להשתתף בשרשור ולהשתמש בניווט ובפעולות שלו.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  479a1564b496bfed:
    english: "## Thread anatomy"
    translation: "## מבנה השרשור"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb745de96e6a612d:
    english: 'A typical thread looks like this:'
    translation: 'כך נראה שרשור טיפוסי:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e69f7f0b13fd9f9:
    english: 'From the top of the page, a thread contains:'
    translation: 'מלמעלה למטה, השרשור כולל:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5b47d6434aa50e94:
    english: "**Group name** - At the top left of the discussion page is the name of the group or subgroup that the discussion belongs to.  Click on this name to go back to the group page."
    translation: "**שם הקבוצה** - בפינה הימנית העליונה של דף הדיון מופיע שם הקבוצה או תת־הקבוצה שאליה הדיון שייך. ניתן לבחור בשם כדי לחזור לדף הקבוצה."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0dab4c46c2bee003:
    english: "**Discussion access** - The access icon at the top right opens the discussion's access settings. A group discussion is available to group members and anyone specifically invited to it, subject to the group's privacy settings."
    translation: "**גישה לדיון** - סמל הגישה בחלק העליון של הדף פותח את הגדרות הגישה לדיון. דיון קבוצתי זמין לחברי הקבוצה ולמי שקיבלו אליו הזמנה אישית, בהתאם להגדרות הפרטיות של הקבוצה."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e20178954e6d3ce0:
    english: "**Discussion title** - The name of the discussion."
    translation: "**כותרת הדיון** - שם הדיון."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  47687209ed924849:
    english: "**Category tags** - The discussion may have one or more category tags. Using simple tags helps people more easily find discussions of a similar type."
    translation: "**תגי קטגוריה** - לדיון יכולים להיות תג קטגוריה אחד או יותר. תגים פשוטים עוזרים למצוא דיונים מסוג דומה."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b817649f985f51de:
    english: "**Discussion author** - The name and avatar of the person who started the discussion, shown beneath the title."
    translation: "**יוצר הדיון** - השם ותמונת הפרופיל של מי שפתחו את הדיון, המופיעים מתחת לכותרת."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c44d5a833b4ec9ff:
    english: "**Date** - Hover over the date to see the full date and time of discussion start."
    translation: "**תאריך** - ניתן להצביע על התאריך כדי לראות את התאריך והשעה המלאים שבהם הדיון התחיל."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b8062113f1078acb:
    english: "**Seen by** - In the right sidebar, shows who has read the discussion and when."
    translation: '**נראה ע"י** - בסרגל הצדדי מוצג מי קראו את הדיון ומתי.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  133d0c2e469e9683:
    english: "**Notified** - In the right sidebar, shows who has been notified about the discussion and whether each notification has been read or its email opened."
    translation: "**עודכן** - בסרגל הצדדי מוצג מי קיבלו הודעה על הדיון, ואם קראו את ההודעה או פתחו את הודעת האימייל."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9f788adb4eab80cc:
    english: "**Discussion context** - Content to frame the discussion."
    translation: "**רקע הדיון** - תוכן שמציג את הרקע לדיון."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e8c5ae76dfb5b89b:
    english: "**Discussion interaction and administration tools** - The discussion context has controls to react to and edit it. The right sidebar contains notification, membership and administration actions."
    translation: "**כלים להשתתפות בדיון ולניהולו** - לצד רקע הדיון יש כלים להוספת תגובות ולעריכה. בסרגל הצדדי יש פעולות הקשורות להתראות, לחברות ולניהול."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8f6eac4359c2b9f6:
    english: "**Comments** - Comments are displayed under the discussion context. The author's name, avatar and posting time show who wrote each comment and when. Interaction and administration tools are available on each comment."
    translation: "**הערות** - ההערות מוצגות מתחת לרקע הדיון. השם, תמונת הפרופיל ושעת הפרסום מראים מי כתבו כל הערה ומתי. לכל הערה יש כלים להשתתפות ולניהול."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f978af6c9af4afe5:
    english: |-
      **Navigation, notifications and actions** - The right sidebar contains
      shortcuts to activity and milestones, notification and membership information,
      and the thread actions available to you.
    translation: |-
      **ניווט, התראות ופעולות** - בסרגל הצדדי יש
      קיצורי דרך לפעילות ולציוני דרך, מידע על התראות וחברות,
      והפעולות הזמינות בשרשור.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f8c4084e9e8a2b27:
    english: "## Discussion context"
    translation: "## רקע הדיון"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5940bad6cb1cb49f:
    english: The discussion **context** is always found at the top of the discussion. Use the context to frame the discussion or decision.
    translation: "**רקע** הדיון מופיע תמיד בראש הדיון. ניתן להשתמש בו כדי להציג את הנושא או את ההחלטה שעל הפרק."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  415dd2d0f1eacc9f:
    english: Think of your group as you write content in the discussion context.  Your aim is to get a discussion going, so consider how you can motivate people to participate.  In general, keep the discussion context simple and clear.
    translation: בעת כתיבת רקע הדיון, כדאי לחשוב על הקבוצה ועל מה שיעזור לחבריה להשתתף. בדרך כלל עדיף לכתוב רקע פשוט וברור.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a1fcece28d8fb61d:
    english: Write the discussion context when starting or editing a discussion. **Edit** a discussion with the pencil icon.
    translation: ניתן לכתוב את רקע הדיון בעת פתיחת דיון או עריכתו. כדי **עריכה** דיון, יש לבחור בסמל העיפרון.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2f47adddef6b31d9:
    english: As the discussion progresses, update discussion context.  Think of the context like a whiteboard in your meeting room, where you can write the agenda, the outcomes intended and how you plan to get there.
    translation: 'ככל שהדיון מתקדם, כדאי לעדכן את הרקע שלו. אפשר להשתמש בו כמו בלוח בחדר ישיבות: לכתוב את סדר היום, את המסקנות הרצויות ואת הדרך להגיע אליהן.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c82ec20629208982:
    english: At the bottom of the context panel is a formatting bar, where you can format text, attach files, images and embed a video.
    translation: בתחתית חלונית הרקע יש סרגל עיצוב. ניתן לעצב בו טקסט, לצרף קבצים ותמונות ולהטמיע סרטון.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e606d83ae0fb2178:
    english: "### Notify people about context changes"
    translation: "### עדכון אנשים על שינויים ברקע הדיון"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d188326a58b28d96:
    english: When you edit the discussion context, use **What's changed?** to summarize the update and choose who should be notified.
    translation: בעת עריכת רקע הדיון, יש להשתמש ב־**מה השתנה?** כדי לסכם את העדכון ולבחור למי תישלח הודעה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  842091a987742d6d:
    english: "![Editing a discussion context with a change summary and notification recipients](../notifying_people/thread_editcontext.png)"
    translation: "![עריכת רקע דיון עם סיכום השינוי ובחירת מקבלי ההודעה](../notifying_people/thread_editcontext.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b885359dd7e83428:
    english: The summary appears as an item in the thread so participants can see what changed.
    translation: הסיכום מופיע כפריט בשרשור, כך שהמשתתפים יכולים לראות מה השתנה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c899c47e98f79a23:
    english: "![A timeline item describing a discussion context change](../notifying_people/thread_edit_comment.png)"
    translation: "![פריט בציר הזמן המתאר שינוי ברקע הדיון](../notifying_people/thread_edit_comment.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  44ffd1d0a732b897:
    english: "## Navigation"
    translation: "## ניווט"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e96aef7a28a85001:
    english: 'The **Jump to** section of the right sidebar helps you move through a thread:'
    translation: 'החלק **קפיצה אל** בסרגל הצדדי עוזר לעבור בין חלקי השרשור:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4790c088af5fc09f:
    english: |-
      - **Start** goes to the discussion context
      - **New to you** appears when the thread contains activity you have not read
      - **Latest** appears when newer activity is available beyond the items currently loaded
      - milestone links go directly to important comments, polls, and outcomes
      - **End** goes to the latest item in the thread
    translation: |-
      - **התחלה** מעביר לרקע הדיון
      - **חדש לך** מופיע כשיש בשרשור פעילות שטרם נקראה
      - **אחרונים** מופיע כשיש פעילות חדשה יותר מהפריטים שנטענו עד כה
      - קישורים לציוני דרך מובילים ישירות להערות, למשאלים ולמסקנות חשובים
      - **סוֹף** מעביר לפריט האחרון בשרשור
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  941ea9900465724a:
    english: Comments that include an H2 or H3 heading, polls, and proposals are automatically included as milestone links. Select any milestone to go directly to it.
    translation: הערות הכוללות כותרת H2 או H3, משאלים והצעות נכללים אוטומטית כקישורים לציוני דרך. ניתן לבחור בכל ציון דרך כדי לעבור אליו ישירות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e94ea6f4b9dae8d4:
    english: When you add a comment, poll, vote, or outcome, Loomio marks your own new item as read. It will not appear as something new for you to review.
    translation: כשמוסיפים הערה, משאל, הצבעה או מסקנה, Loomio מסמן את הפריט החדש כפריט שנקרא. הוא לא יופיע כפעילות חדשה לעיון.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  34251ada1ba3e50b:
    english: "## Notifications and members"
    translation: "## התראות ומשתתפים"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  36a20a0e10208c7c:
    english: The right sidebar controls your email notifications and shows who has been invited, who has seen the thread, and who has been notified.
    translation: בסרגל הצדדי ניתן לשלוט בהתראות האימייל ולראות מי הוזמנו, מי צפו בשרשור ומי קיבלו הודעה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f2a437ac1169c882:
    english: "### Email notifications for this thread"
    translation: "### התראות אימייל עבור השרשור הזה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9bd7269489ed048e:
    english: Select the current notification setting to choose whether Loomio emails you about all activity, only activity that specifically notifies you, or no activity. Receiving email for all activity can produce many messages in an active thread.
    translation: יש לבחור בהגדרת ההתראות הנוכחית כדי לקבוע אם Loomio ישלח אימייל על כל פעילות, רק על פעילות שמפעילה התראה אישית, או שלא ישלח אימייל כלל. בשרשור פעיל, קבלת אימייל על כל פעילות עשויה להוביל להודעות רבות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0d64de2345c8eba9:
    english: "![Email when notified selected in the discussion sidebar](../notifying_people/thread_interact.png)"
    translation: "![האפשרות לשלוח אימייל כשמתקבלת התראה נבחרה בסרגל הצדדי של הדיון](../notifying_people/thread_interact.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7bdbdaa98e89d1c3:
    english: "### Invite people"
    translation: "### הזמנת אנשים"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e81f85e723885264:
    english: Select **Invite people** to add people after the thread has started.
    translation: לאחר פתיחת השרשור, ניתן לבחור ב־**הזמינו אנשים** כדי להוסיף משתתפים.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e38a572cdffad5cb:
    english: "![Invite people in the thread sidebar](../notifying_people/thread_invite_icon.png)"
    translation: "![הזמנת אנשים מסרגל הצד של השרשור](../notifying_people/thread_invite_icon.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7e4e643fb327aa06:
    english: Select a group or subgroup, enter the names of individual members, or enter an email address to invite a guest.
    translation: יש לבחור קבוצה או תת־קבוצה, להזין שמות של חברים או להזין כתובת דוא״ל כדי להזמין אורח.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  03c1d74b4a8bc31d:
    english: "![Invite people window with a field for names and email addresses](../notifying_people/thread_invite.png)"
    translation: "![חלון הזמנת אנשים עם שדה לשמות ולכתובות דוא״ל](../notifying_people/thread_invite.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  85fc948a4e849ba8:
    english: A guest can see and participate in this thread but cannot see other discussions in the group unless separately invited.
    translation: אורחים יכולים לצפות בשרשור ולהשתתף בו, אך אינם יכולים לראות דיונים אחרים בקבוצה ללא הזמנה נפרדת.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9f1010b58cc5439f:
    english: "![Inviting a guest by email address](../notifying_people/invite_guest.png)"
    translation: "![הזמנת אורח באמצעות כתובת דוא״ל](../notifying_people/invite_guest.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e688189fa93b1e49:
    english: To remove someone, open the three-dot menu (**⋯**) beside their name and select **Remove from discussion**.
    translation: כדי להסיר אדם מהדיון, יש לפתוח את תפריט שלוש הנקודות (**⋯**) לצד שמו ולבחור **הסר מהדיון**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5602fbfa565eaf45:
    english: "### Seen by"
    translation: '### נראה ע"י'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a929b22d02292573:
    english: "**Seen by** shows who has opened the thread and when. It can help you identify people who may not have seen important information yet."
    translation: '**נראה ע"י** מציג מי פתחו את השרשור ומתי. כך ניתן לזהות אנשים שאולי עדיין לא ראו מידע חשוב.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d0335d202c5bbaa3:
    english: "![Seen by and Notified in the Thread members section](../notifying_people/thread_engagement.png)"
    translation: '![נראה ע"י ועודכן באזור חברי השרשור](../notifying_people/thread_engagement.png)'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb77150441a43f5c:
    english: "![Seen by window listing thread members](../notifying_people/thread_seenby.png)"
    translation: '![חלון נראה ע"י המציג את חברי השרשור](../notifying_people/thread_seenby.png)'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  185f80d66c2091d8:
    english: "### Notified"
    translation: "### עודכן"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  885a21cbc1a44f7d:
    english: "**Notified** opens the discussion notification history. It includes invitations, mentions, and replies, showing who was notified and whether each notification has been read when that information is available."
    translation: "**עודכן** פותח את היסטוריית ההתראות של הדיון. היא כוללת הזמנות, אזכורים ותגובות, ומציגה למי נשלחה התראה ואם נקראה, כשהמידע זמין."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e73fae9309f626e2:
    english: "![Discussion notification history](../notifying_people/thread_notified.png)"
    translation: "![היסטוריית ההתראות של הדיון](../notifying_people/thread_notified.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  347def7574cf5f1d:
    english: "## Actions"
    translation: "## פעולות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '08ff4ccd500c2a69':
    english: The right sidebar contains actions for the whole thread. Some actions are also available from the three-dot menu (**⋯**) beside a thread on the group page.
    translation: סרגל הצד הימני מכיל פעולות על השרשור כולו. חלק מהפעולות זמינות גם בתפריט שלוש הנקודות (**⋯**) לצד השרשור בדף הקבוצה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e73701c7d36f95ef:
    english: The actions shown depend on your permissions. Group admins can manage threads, and group settings may allow members to perform some management actions. See [Group permissions](/en/user_manual/groups/settings/permissions).
    translation: הפעולות המוצגות תלויות בהרשאות. מנהלי קבוצה יכולים לנהל שרשורים, והגדרות הקבוצה עשויות לאפשר גם לחברים לבצע חלק מפעולות הניהול. ראו [הרשאות קבוצה](/en/user_manual/groups/settings/permissions).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4fce317a163b0a40:
    english: "### Print"
    translation: "### הדפס"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9317d4c7c5ef4764:
    english: Select **Print** to generate a page suitable for printing. Use your browser's print dialog to save it as a PDF.
    translation: יש לבחור **הדפס** כדי ליצור דף המתאים להדפסה. ניתן לשמור אותו כקובץ PDF באמצעות חלון ההדפסה של הדפדפן.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  443af0749df1db2a:
    english: "### Markdown"
    translation: "### Markdown"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eb0442148f7c042d:
    english: Select **Markdown** to save the complete thread as structured Markdown. Choose **Copy Markdown** to copy it to your clipboard, or **Download Markdown** to save it as a `.md` file. You can use it for meeting minutes, a document, an archive of decisions, an AI assistant, or another tool that supports Markdown.
    translation: יש לבחור **Markdown** כדי לשמור את השרשור המלא כקובץ Markdown מובנה. יש לבחור **העתקת Markdown** כדי להעתיק אותו ללוח, או **הורד את Markdown** כדי לשמור אותו כקובץ `.md`. ניתן להשתמש בו לפרוטוקול ישיבה, למסמך, לארכיון החלטות, לעוזר בינה מלאכותית או לכלי אחר שתומך ב־Markdown.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  80e3f57638b53cb4:
    english: The document begins with YAML front matter containing the thread key, group, creation date, last activity date, and tags. It then includes the discussion context and every comment, poll, vote, and outcome in the same order and nesting as the threaded view.
    translation: המסמך נפתח במקטע YAML המכיל את מזהה השרשור, הקבוצה, תאריך היצירה, תאריך הפעילות האחרונה והתגים. אחריו מופיעים הקשר הדיון וכל הערה, משאל, הצבעה ומסקנה, באותו סדר ובאותו מבנה מקונן כמו בתצוגת השרשור.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f99823b7b44e2cdd:
    english: Each poll is a section. Comments, votes, and outcomes are quoted, and replies are quoted beneath the item they answer. This shows where each person's text begins and ends. Each quote starts with one line showing the person, when they posted, the item's number in the thread, and any reactions. Votes and outcomes also say what they are. The thread key and item number identify each item in Loomio.
    translation: כל משאל מופיע כמקטע. הערות, הצבעות ומסקנות מופיעות כציטוטים, ותגובות מופיעות כציטוטים מתחת לפריט שאליו הן מתייחסות. כך ניתן לראות היכן הטקסט של כל אדם מתחיל ומסתיים. כל ציטוט מתחיל בשורה המציגה את שם האדם, מועד הפרסום, מספר הפריט בשרשור ותגובות האימוג׳י, אם יש. בהצבעות ובמסקנות מצוין גם סוג הפריט. מזהה השרשור ומספר הפריט מזהים כל פריט ב־Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e5bdfbb4a0d7646f:
    english: Loomio applies the same visibility rules as the thread. Results and vote reasons you cannot see are not included, and voters are not identified in anonymous polls. If an open poll hides results until you vote, vote before exporting the thread. **Markdown** and **Print** are unavailable until you do.
    translation: Loomio מחילה את אותם כללי נראות שחלים על השרשור. תוצאות ונימוקי הצבעה שאין הרשאה לראות אינם נכללים, ובמשאלים אנונימיים זהות המצביעים אינה מוצגת. אם תוצאות של משאל פתוח מוסתרות עד להצבעה, יש להצביע לפני ייצוא השרשור. עד אז הפעולות **Markdown** ו־**הדפס** אינן זמינות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7989d3386a42f180:
    english: 'For example, a discussion containing a comment, reactions, a proposal, two votes, a reply, and an outcome produces this Markdown:'
    translation: 'לדוגמה, דיון הכולל הערה, תגובות אימוג׳י, הצעה, שתי הצבעות, תגובה ומסקנה יוצר את מסמך ה־Markdown הבא:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  275f4d9025c017c4:
    english: The headings and labels use your selected language. Content written by participants remains in its original language.
    translation: הכותרות והתוויות מופיעות בשפה שנבחרה. תוכן שנכתב בידי משתתפים נשאר בשפת המקור.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dab18fdf3c56269d:
    english: "### Thread settings and display"
    translation: "### הגדרות השרשור והתצוגה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7bc55279f97c6d1b:
    english: Group admins can select **Thread settings** to change how replies are arranged and configure other discussion options.
    translation: מנהלי קבוצה יכולים לבחור **הגדרות שרשור** כדי לשנות את אופן סידור התגובות ולהגדיר אפשרויות נוספות לדיון.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  32b2640ba23524aa:
    english: Choose **Timeline** to list items in the order they were posted, or **Threaded** to group replies beneath the item they respond to. Thread settings also control whether multiple polls may run at once and can set a maximum comment length. These settings apply to everyone in the discussion.
    translation: יש לבחור **ציר זמן** כדי להציג פריטים לפי סדר פרסומם, או **Threaded** כדי לקבץ תגובות מתחת לפריט שאליו הן מתייחסות. בהגדרות השרשור ניתן גם לקבוע אם כמה משאלים יוכלו לפעול בו־זמנית ולהגדיר אורך מרבי להערות. ההגדרות האלה חלות על כל המשתתפים בדיון.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a520339278bcc2a:
    english: "### Pin or unpin a thread"
    translation: "### נעיצה או ביטול נעיצה של שרשור"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0433e7a61db60003:
    english: Pinned threads appear above other threads on the group page. Welcome discussions, news items, and announcements are typical uses for pinned threads.
    translation: שרשורים נעוצים מופיעים מעל שרשורים אחרים בדף הקבוצה. נהוג לנעוץ דיוני קבלת פנים, ידיעות והודעות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b2712588a5e0aab3:
    english: Open the three-dot menu (**⋯**) beside the thread on the group page and select **Pin thread**. Pinned threads are ordered by the time they were pinned. To change their order, unpin and pin them again.
    translation: יש לפתוח את תפריט שלוש הנקודות (**⋯**) לצד השרשור בדף הקבוצה ולבחור **דקור שיחה**. שרשורים נעוצים מסודרים לפי מועד הנעיצה. כדי לשנות את סדרם, יש לבטל את הנעיצה ולנעוץ אותם מחדש.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a0443f076d1b8ae5:
    english: Select **Unpin thread** to return a thread to the activity-based order.
    translation: יש לבחור **ביטול נעיצת שרשור** כדי להחזיר את השרשור לסדר המבוסס על פעילות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b90a469963b02ffc:
    english: "### Move a thread"
    translation: "### העברת שרשור"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8b2071f4625705e5:
    english: Select **Move thread** to move a thread to another group, subgroup, or to a direct thread. It will be visible to members of the destination group and anyone specifically invited to it.
    translation: יש לבחור **הזזת שרשור** כדי להעביר שרשור לקבוצה אחרת, לתת־קבוצה או לשרשור ישיר. השרשור יהיה גלוי לחברי קבוצת היעד ולכל מי שהוזמנו אליו במיוחד.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f09d5f2afce03ee8:
    english: |-
      >[!Tip]
      >Start a draft as a direct discussion or in a private subgroup, then move it to the group when it is ready.
    translation: |-
      >[!Tip]
      >ניתן להתחיל טיוטה כדיון ישיר או בתת־קבוצה פרטית, ולהעביר אותה לקבוצה כשהיא מוכנה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c82562b641053308:
    english: To move selected activity rather than the whole thread, see [Moving items between threads](/en/user_manual/discussions/moving_items/).
    translation: להעברת פעילות מסוימת במקום השרשור כולו, ראו [העברת פריטים בין שרשורים](/en/user_manual/discussions/moving_items/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  be22d2980075fdaa:
    english: "### Lock or unlock a thread"
    translation: "### נעילה או ביטול נעילה של שרשור"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e7c24a610fd2bf8b:
    english: Lock a thread to prevent comments or further changes. A thread can only be locked after its active polls have closed.
    translation: ניתן לנעול שרשור כדי למנוע הוספת הערות ושינויים נוספים. אפשר לנעול שרשור רק לאחר שכל המשאלים הפעילים בו נסגרו.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  edb983bb6366aa6c:
    english: Select **Lock thread** under **Actions**. Locked threads are removed from the list of open discussions and marked with a **Locked** tag.
    translation: יש לבחור **נעילת שרשור** תחת **פעולות**. שרשורים נעולים מוסרים מרשימת הדיונים הפתוחים ומסומנים בתג **נָעוּל**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ba2794349524cc33:
    english: To find a locked thread, open the discussion filter on the group page and select **Locked**. Open the thread and select **Unlock thread** to allow comments and changes again.
    translation: כדי למצוא שרשור נעול, יש לפתוח את מסנן הדיונים בדף הקבוצה ולבחור **נָעוּל**. כדי לאפשר שוב הוספת הערות ושינויים, יש לפתוח את השרשור ולבחור **ביטול נעילת שרשור**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3a75fb1ad0ffab87:
    english: "### Delete a thread"
    translation: "### מחיקת שרשור"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0103a5729bd6a095:
    english: Deleting a thread removes it permanently and cannot be undone. Lock the thread instead if you may need it again.
    translation: מחיקת שרשור היא לצמיתות ואי אפשר לבטל אותה. אם ייתכן שיהיה בו צורך שוב, יש לנעול את השרשור במקום למחוק אותו.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  daf08ca8895b0fe2:
    english: Select **Delete thread** and confirm the deletion.
    translation: יש לבחור **מחיקת שיחה** ולאשר את המחיקה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
