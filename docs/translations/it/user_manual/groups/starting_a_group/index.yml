    translated_on: '2026-09-29'
  '019cdfc169ea858a':
    english: Type your group name. It's best to keep your group name short and concise.
    translation: Inserisci il nome del gruppo. Scegli un nome breve e chiaro.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6ae6b08ae7fbe257:
    english: "### Group handle"
    translation: "### Identificativo del gruppo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b054d0f760888add:
    english: Your group is automatically assigned a handle. The handle is used in the group's URL and email address, such as **loomio.com/your-group-handle** and **your-group-handle@loomio.com**.
    translation: Al gruppo viene assegnato automaticamente un identificativo, usato nell'URL e nell'indirizzo email del gruppo, per esempio **loomio.com/your-group-handle** e **your-group-handle@loomio.com**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1dee654ba628ba95:
    english: You can edit the handle when you create the group and change it later in group settings. When you change it, links and email addresses that use the old handle continue to work. Loomio keeps up to three old handles; after that, the oldest handle expires.
    translation: Puoi modificare l'identificativo quando crei il gruppo o in seguito nelle impostazioni del gruppo. Se lo cambi, i link e gli indirizzi email che usano quello precedente continuano a funzionare. Loomio conserva fino a tre identificativi precedenti; quando ne cambi un quarto, il più vecchio scade.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
