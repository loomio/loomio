---
navigation_title: Iniciar uma discussão
blocks:
  8fae4100a4f3548b:
    english: "# Start a discussion"
    translation: "# Iniciar uma discussão"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4ba984e9573c27ff:
    english: Starting a Loomio discussion is like writing an email. The subject line of an email is like the discussion title, and the text you write in an email is like the context of a discussion.
    translation: Iniciar uma discussão no Loomio é como escrever um e-mail. O assunto do e-mail corresponde ao título da discussão, e o texto corresponde ao contexto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4f81447c072f5dfe:
    english: As you add people in the send list of your email, in Loomio you can invite people individually or as a group to the discussion - they will receive an email notification with the content of your discussion.
    translation: Assim como você adiciona destinatários a um e-mail, no Loomio você pode convidar pessoas individualmente ou um grupo inteiro para a discussão. Elas receberão uma notificação por e-mail com o conteúdo da discussão.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2408b54e3b78a282:
    english: People can reply to your discussion via email and their comments will appear in the discussion.
    translation: As pessoas podem responder à discussão por e-mail. Os comentários delas aparecerão na discussão.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  24ced64c5c4cf853:
    english: As with an email, a discussion may be a simple question, or a more detailed introduction to a topic with links or files attached for background information.
    translation: Como um e-mail, uma discussão pode conter uma pergunta simples ou uma apresentação mais detalhada do assunto, com links ou arquivos para dar contexto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ec39413fa07094c8:
    english: "## New discussion"
    translation: "## Nova discussão"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  92b37b2e208bfd57:
    english: Find the **New discussion** button on your Loomio group page to start a new discussion.
    translation: Na página do seu grupo no Loomio, selecione **Nova discussão** para iniciar uma discussão.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  515ac46bdfccb401:
    english: You can start a discussion within your Loomio group or any subgroup.
    translation: Você pode iniciar uma discussão no seu grupo do Loomio ou em qualquer subgrupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ef9721ba6b69b86b:
    english: "![New discussion button on the Oatmilk Cooperative page](new-discussion-button.png)"
    translation: "![Botão Nova discussão na página da Cooperativa Oatmilk](new-discussion-button.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1cf9e569475cd2cc:
    english: "![New discussion form for planning the returnable bottle trial](new-discussion-example.png)"
    translation: "![Formulário de nova discussão para planejar o teste com garrafas retornáveis](new-discussion-example.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f973f5b9f1c4b1dd:
    english: |-
      ### Group
      Check the name of the group or subgroup is correct for your discussion.  Anyone in this group will be able to see the discussion. You can also start the discussion in another group or as a 'direct' discussion (no group).
    translation: |-
      ### Grupo
      Confira se o grupo ou subgrupo selecionado para a discussão está correto. Qualquer pessoa desse grupo poderá ver a discussão. Você também pode iniciá-la em outro grupo ou como uma discussão 'direta' (sem grupo).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f0b0bda9877ce0ed:
    english: |-
      >[!Tip]
      >If you are not ready to make the discussion visible in your group, start the discussion as 'direct'.  You can move the discussion to your Loomio group when ready.
    translation: |-
      >[!Tip]
      >Se você ainda não quiser tornar a discussão visível para seu grupo, inicie uma discussão 'direta'. Quando estiver pronta, você poderá movê-la para seu grupo no Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cd1b45c3cb71503b:
    english: "### Invite and notify"
    translation: "### Convidar e notificar"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f3f388d23b06b25c:
    english: The **Invite** field controls who receives the new discussion immediately.
    translation: O campo **Convidar** define quem recebe a nova discussão imediatamente.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c1b5c23770d3692:
    english: Group members can see a discussion in their group even if you do not notify them. Adding a group member to **Invite** sends them an email notification and a notification in Loomio.
    translation: Os membros do grupo podem ver uma discussão no grupo mesmo sem receber uma notificação. Ao adicionar um membro ao campo **Convidar**, você envia uma notificação por e-mail e outra no Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e2e5906a39131506:
    english: Select a group to notify everyone in it, or expand the group to choose individual members. Select the × beside a name to remove that person from the notification.
    translation: Selecione um grupo para notificar todos os membros ou expanda o grupo para escolher membros individualmente. Selecione o × ao lado de um nome para remover essa pessoa da notificação.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  81b57efbb3c428b7:
    english: "![Invite field expanded to show individual recipients](../notifying_people/thread_notification.png)"
    translation: "![Campo Convidar expandido para mostrar os destinatários individuais](../notifying_people/thread_notification.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5cbd2b7b0bcc486f:
    english: Start typing a member's name and select it from the list.
    translation: Comece a digitar o nome de um membro e selecione-o na lista.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dc128abbc65cb0c8:
    english: "![Searching for Samira Patel in the Invite field](../notifying_people/thread_notify_user.png)"
    translation: "![Busca por Samira Patel no campo Convidar](../notifying_people/thread_notify_user.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3274fe93fcf29b29:
    english: Enter an email address to invite a guest. A guest can see and participate in this thread but cannot see other discussions in the group unless separately invited.
    translation: Digite um endereço de e-mail para convidar uma pessoa. Ela poderá ver e participar desta discussão, mas só poderá ver outras discussões do grupo se receber um convite separado para cada uma.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ab3214ccf77143e3:
    english: "![Adding a guest email address to the Invite field](../notifying_people/thread_notify_email.png)"
    translation: "![Adição do endereço de e-mail de uma pessoa convidada ao campo Convidar](../notifying_people/thread_notify_email.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cba9346e727b829a:
    english: You can also start the discussion without notifying anyone. Group members can still find it in Loomio and may see it in their catch-up email, depending on their notification settings.
    translation: Você também pode iniciar a discussão sem notificar ninguém. Os membros do grupo ainda poderão encontrá-la no Loomio e talvez a vejam no e-mail de atualização, conforme suas configurações de notificação.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6518afe373ff1959:
    english: "### Tags"
    translation: "### Tags"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ff67c09f89479873:
    english: Add tag(s) to help people find your discussion when searching by tag. Admins can create new tags.
    translation: Adicione tags para ajudar as pessoas a encontrar sua discussão ao pesquisar por tag. Administradores podem criar novas tags.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ba80a903c4ecc7d1:
    english: |-
      ### Title
      Give your discussion a relevant title.  A discussion title is similar to an email subject line.
    translation: |-
      ### Título
      Dê à discussão um título relevante. O título funciona como o assunto de um e-mail.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a91cf4b0b1b2ad5e:
    english: |-
      ### Context
      Use discussion context to introduce the topic and frame the conversation or decision to make. Use the formatting tools to emphasize key points. Include background information, attach files, link to online documents and embed a video.
    translation: |-
      ### Contexto
      Use o contexto da discussão para apresentar o assunto e orientar a conversa ou a decisão a ser tomada. Use as ferramentas de formatação para destacar os pontos principais. Inclua informações relevantes, anexe arquivos, adicione links para documentos on-line e incorpore um vídeo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1bf690aa841299cd:
    english: The context will always stay at the top of the discussion and you can update it at any time as the discussion progresses.  When the discussion ends, update the context with the outcome.
    translation: O contexto permanece no início da discussão. Você pode atualizá-lo a qualquer momento conforme a conversa avança. Quando a discussão terminar, atualize o contexto com a conclusão.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
