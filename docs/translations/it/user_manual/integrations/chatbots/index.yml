  a63a4be4a45bcfdb:
    english: If you decide later that you want the integration to receive automatic notifications, return to its settings and select the relevant events.
    translation: Se in seguito vuoi ricevere notifiche automatiche tramite l'integrazione, torna alle sue impostazioni e seleziona gli eventi pertinenti.
    status: machine
    provider: codex/gpt-6-sol
