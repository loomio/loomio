  519237662235d020:
    english: |-
      ### Actions per user
      Understand who are the most and least active contributors in your group.
    translation: |-
      ### Acties per gebruiker
      Bekijk wie in je groep het meest en het minst actief zijn.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b538bd1f65e69d28:
    english: This table shows how many threads, comments, polls, votes and reactions each user in the specified groups was responsible for during the time frame. Click specific headings in the table to sort the table by that column.
    translation: Deze tabel toont hoeveel threads, opmerkingen, polls, stemmen en reacties elke gebruiker in de geselecteerde groepen tijdens de gekozen periode heeft geplaatst of uitgebracht. Klik op een kolomkop om de tabel op die kolom te sorteren.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7d416ad780b3ca85:
    english: Turn on **Delegates only** to show people who are currently delegates in any of the selected groups. Their activity and voting record are aggregated across all selected groups, and delegates with no activity during the selected period remain in the table. The CSV download uses the same filter.
    translation: Schakel **Alleen voor afgevaardigden** in om mensen te tonen die momenteel afgevaardigde zijn in een van de geselecteerde groepen. Hun activiteit en stemgegevens worden over alle geselecteerde groepen samengevoegd. Afgevaardigden zonder activiteit in de gekozen periode blijven in de tabel staan. De CSV-download gebruikt hetzelfde filter.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  12baf5af62638134:
    english: "![Actions per delegate showing three levels of participation](group_participation_report_actions_per_user.png)"
    translation: "![Acties per afgevaardigde met drie niveaus van deelname](group_participation_report_actions_per_user.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1650f708482b4789:
    english: "### Voting record per user"
    translation: "### Stemgegevens per gebruiker"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e6670b54039f316a:
    english: Compare the number of votes issued to each person with the number they cast, see missed votes, and identify people who cast every vote issued to them. A person with no issued votes is not shown as having cast all votes. Anonymous polls are excluded because an anonymous ballot must not be associated with the person who cast it.
    translation: Vergelijk hoeveel stemmen aan iemand zijn toegekend met hoeveel stemmen die persoon heeft uitgebracht. Bekijk gemiste stemmen en zie wie alle toegekende stemmen heeft uitgebracht. Iemand aan wie geen stemmen zijn toegekend, wordt niet getoond alsof die alle stemmen heeft uitgebracht. Anonieme polls tellen niet mee, omdat een anonieme stem niet aan de stemmer gekoppeld mag worden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  252da2b72775c4f8:
    english: Use **Delegates only** to review the voting record of current delegates. The CSV download uses the same name and delegate filters.
    translation: Gebruik **Alleen voor afgevaardigden** om de stemgegevens van huidige afgevaardigden te bekijken. De CSV-download gebruikt dezelfde filters voor naam en afgevaardigden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d720230a7ca893dc:
    english: "![Voting record for delegates showing issued, cast, and missed votes](group_participation_report_voting_record.png)"
    translation: "![Stemgegevens van afgevaardigden met toegekende, uitgebrachte en gemiste stemmen](group_participation_report_voting_record.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
