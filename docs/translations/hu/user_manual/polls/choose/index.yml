  733b320e0407fbdc:
    english: Choose is a simple poll for finding the most popular option or making a shortlist. Participants select one or more options, depending on the limits you set. This voting method is commonly known as multiple choice.
    translation: A Választás egyszerű szavazás a legnépszerűbb lehetőség kiválasztásához vagy egy szűkített lista összeállításához. A résztvevők egy vagy több lehetőséget választhatnak ki, a beállított korlátoktól függően. Ezt a szavazási módot többválaszos szavazásnak is nevezik.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '09aefb579b50874b':
    english: "## When to use Choose"
    translation: "## Mikor használd a Választást"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  be35cf72fcaf9c4d:
    english: 'Use Choose when the options are distinct and you need to count how many people select each one. It works well for:'
    translation: 'A Választást akkor használd, ha a lehetőségek jól elkülönülnek, és meg szeretnéd számolni, hányan választják az egyes lehetőségeket. Például:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dcc6f6b9238155b2:
    english: |-
      - choosing one venue from a shortlist;
      - selecting up to three topics for an agenda;
      - deciding which design should proceed to the next round; or
      - checking which services members intend to use.
    translation: |-
      - egy helyszín kiválasztása egy rövid listáról;
      - legfeljebb három téma kiválasztása a napirendre;
      - annak eldöntése, melyik terv jusson tovább a következő fordulóba; vagy
      - annak felmérése, mely szolgáltatásokat tervezik használni a tagok.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3770d0653b752de5:
    english: Choose records selections, not the strength or order of a person's preferences. Use [Score](/en/user_manual/polls/score/) to measure how strongly people support every option, [Allocate](/en/user_manual/polls/allocate/) when there is a limited budget, or [Rank](/en/user_manual/polls/rank/) when preference order matters.
    translation: A Választás azt rögzíti, ki melyik lehetőséget jelölte meg, nem pedig a preferenciák erősségét vagy sorrendjét. A [Pontozást](/en/user_manual/polls/score/) akkor használd, ha azt szeretnéd felmérni, mennyire támogatják az egyes lehetőségeket. Ha korlátozott keretet kell elosztani, válaszd az [Elosztást](/en/user_manual/polls/allocate/); ha a preferenciák sorrendje számít, a [Rangsorolást](/en/user_manual/polls/rank/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f15aca327e894f30:
    english: "## Example: set a planning-meeting agenda"
    translation: "## Példa: egy tervezési megbeszélés napirendje"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f51e09afa0ed1e53:
    english: Oatmilk Cooperative needs to decide which parts of a returnable-bottle trial need the most time at its next planning meeting. The poll asks each person to choose up to two topics. Its details explain how the result will be used, and each option includes enough information to distinguish it from the others.
    translation: A Zabtej Szövetkezetnek el kell döntenie, hogy a visszaváltható palackokkal végzett próba mely részeire fordítsák a legtöbb időt a következő tervezési megbeszélésen. A szavazásban mindenki legfeljebb két témát választhat. A részletek elmagyarázzák, hogyan használják fel az eredményt, és minden lehetőségről elegendő információt adnak ahhoz, hogy megkülönböztethető legyen a többitől.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c74ebb16f872b3c6:
    english: "## Set up the poll"
    translation: "## A szavazás beállítása"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  abc749fec8671661:
    english: Give the poll a specific question as its title. In **Details**, explain what participants should consider and what will happen with the result. Add each available option, then set the **Minimum choices** and **Maximum choices**.
    translation: A szavazás címeként adj meg egy konkrét kérdést. A **Részletek** mezőben írd le, mit vegyenek figyelembe a résztvevők, és mi történik az eredménnyel. Add meg az összes választható lehetőséget, majd állítsd be a **Minimális választási lehetőségek** és a **Maximális választási lehetőségek** értékét.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e878ddc9f61dd243:
    english: Set both limits to 1 when participants must choose exactly one option. Set a higher maximum when you want a shortlist. Avoid allowing so many choices that participants can select nearly every option, because that makes the result less useful.
    translation: Ha a résztvevőknek pontosan egy lehetőséget kell választaniuk, mindkét korlátot állítsd 1-re. Szűkített lista összeállításához állíts be magasabb felső korlátot. Ne engedd, hogy a résztvevők szinte minden lehetőséget kiválaszthassanak, mert így az eredmény kevésbé lesz hasznos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  152fec5018fc232b:
    english: Use the pencil icon beside an option to add a meaning or further explanation. This is useful when a short option name could be interpreted in different ways.
    translation: A lehetőség melletti ceruza ikonnal pontosíthatod a jelentését, vagy további magyarázatot adhatsz hozzá. Ez akkor hasznos, ha egy rövid megnevezés többféleképpen értelmezhető.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  59e405cf9a028c8d:
    english: Under **More settings**, **Show options in random order** can reduce the effect of always presenting one option first.
    translation: A **További beállítások** között az **Opciók megjelenítése véletlenszerű sorrendben** beállítás csökkentheti annak hatását, hogy mindig ugyanaz a lehetőség szerepel elsőként.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Szavazás"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7db2d0e58e5fb4e4:
    english: The vote form tells participants how many options they may select. In this example, the voter selects **Cafe collection schedule** and **Washing workflow**, then gives a reason connecting those choices to the trial.
    translation: A szavazási űrlap jelzi a résztvevőknek, hány lehetőséget választhatnak ki. Ebben a példában a szavazó a **Kávézói begyűjtés ütemezése** és a **Mosási munkafolyamat** lehetőséget választja, majd megindokolja, hogyan kapcsolódnak ezek a próbához.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e55e4b8950a5fd46:
    english: A reason can reveal why an option matters and what work participants expect it to cover. If reasons are important to the decision, configure the vote-reason setting before starting the poll.
    translation: Az indoklásból kiderülhet, miért fontos egy lehetőség, és milyen feladatokat várnak tőle a résztvevők. Ha az indoklások fontosak a döntéshez, a szavazás indoklására vonatkozó beállítást még a szavazás indítása előtt állítsd be.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Az eredmények értelmezése"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c1ec47f66384e3bb:
    english: The results show the share of all selections received by each option, the number of voters who selected it, and who has not voted. Because each person could choose two options, the percentages describe selections rather than a percentage of people.
    translation: Az eredmények megmutatják, hogy az egyes lehetőségek az összes jelölés mekkora részét kapták, hány szavazó választotta őket, és kik nem szavaztak. Mivel mindenki két lehetőséget választhatott, a százalékok a jelölések arányát mutatják, nem a szavazók arányát.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6cbc0f9d6fdf6727:
    english: In this example, **Cafe collection schedule** has three selections. **Washing workflow** and **Return-rate reporting** each have two. The result supports giving cafe collections the most agenda time, but the tied topics still require the organizer to decide how the remaining time is divided.
    translation: Ebben a példában a **Kávézói begyűjtés ütemezése** három jelölést kapott. A **Mosási munkafolyamat** és a **Visszaváltási arány jelentése** két-két jelölést kapott. Az eredmény alapján érdemes a legtöbb napirendi időt a kávézói begyűjtésre fordítani. A két azonos eredményt elért téma között azonban a szervezőnek kell elosztania a fennmaradó időt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  adb7eb28e16616be:
    english: When the poll closes, publish an **Outcome** explaining what the group will do with the result.
    translation: A szavazás lezárása után tegyél közzé egy **Következtetés** bejegyzést arról, hogyan használja fel a csoport az eredményt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
