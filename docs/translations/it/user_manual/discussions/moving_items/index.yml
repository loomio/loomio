---
navigation_title: Spostare elementi tra discussioni
blocks:
  875a42e08000fffe:
    english: "# Moving items between threads"
    translation: "# Spostare elementi tra discussioni"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5c0fcd38f9276e8f:
    english: Move selected items when a conversation belongs in another thread, when one thread has split into separate topics, or when you want to combine related discussions. There is no separate **Merge discussions** command.
    translation: Sposta gli elementi selezionati quando una conversazione appartiene a un'altra discussione, quando una discussione si è divisa in argomenti distinti o quando vuoi riunire discussioni collegate. Non esiste un comando separato **Unisci discussioni**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f43c7835d05a135e:
    english: The option is available to group admins and to members when **Members can manage discussions and comments** is enabled in [Group permissions](/en/user_manual/groups/settings/permissions).
    translation: L'opzione è disponibile per gli amministratori del gruppo e per i membri quando **I membri possono gestire discussioni e commenti** è attiva nelle [Autorizzazioni del gruppo](/en/user_manual/groups/settings/permissions).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  30a4e31dab983f89:
    english: Open the three-dot menu (**⋯**) on an item and select **Move item**.
    translation: Apri il menu con i tre puntini (**⋯**) di un elemento e seleziona **Sposta l'elemento**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  24fd0043effa14fb:
    english: Select the items you want to move.
    translation: Seleziona gli elementi che vuoi spostare.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  81551cd5134f24c5:
    english: Select any additional items with the checkboxes, then click **Move** in the banner at the top of the discussion.
    translation: Seleziona eventuali altri elementi con le caselle di controllo, poi fai clic su **Sposta** nel banner in cima alla discussione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f53055845c214b05:
    english: Choose the group or subgroup, then search for the destination discussion.
    translation: Scegli il gruppo o il sottogruppo, poi cerca la discussione di destinazione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  19bc2092ac28011b:
    english: To move the items into a new discussion, select **New discussion** and add its title and context.
    translation: Per spostare gli elementi in una nuova discussione, seleziona **Nuova discussione** e aggiungi il titolo e il contesto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '092b56e69505636f':
    english: The items are moved from the original thread into the selected or newly created thread.
    translation: Gli elementi vengono spostati dalla discussione originale a quella selezionata o appena creata.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  162c0d0c47ca798f:
    english: If the original thread is no longer needed, you can [lock it](/en/user_manual/discussions/using_discussions/#lock-or-unlock-a-thread). Delete it only if you are certain it will not be needed again.
    translation: Se la discussione originale non serve più, puoi [bloccarla](/en/user_manual/discussions/using_discussions/#lock-or-unlock-a-thread). Eliminala solo se sei certo che non servirà più.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
