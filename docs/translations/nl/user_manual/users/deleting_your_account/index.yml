  b69fb514fd196dd7:
    english: "# Deleting your Loomio account"
    translation: "# Je Loomio-account verwijderen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  941f0addde6f7326:
    english: "## What does delete account mean?"
    translation: "## Wat betekent het om je account te verwijderen?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dab05d98ad64604f:
    english: |-
      When you delete your account:
      - Your user account including your name, email address and other personally identifying data will be deleted from our systems. You will not be able to sign in to Loomio with this account.
      - Comments, proposal and discussions you have made will remain but your name will be removed from them. We do this because we have an obligation to groups to keep threads and proposals coherent.
      - You will no longer be listed as a member of any groups.
      - You will no longer receive notification emails.
    translation: |-
      Wanneer je je account verwijdert:
      - Je gebruikersaccount, inclusief je naam, e-mailadres en andere gegevens waarmee je persoonlijk kunt worden geïdentificeerd, wordt uit onze systemen verwijderd. Je kunt je met dit account niet meer aanmelden bij Loomio.
      - Reacties, voorstellen en discussies die je hebt geplaatst, blijven bestaan, maar je naam wordt eruit verwijderd. Zo blijven de threads en voorstellen voor de groepen begrijpelijk.
      - Je staat niet meer als lid van groepen vermeld.
      - Je ontvangt geen meldingen meer per e-mail.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dbeaf194bb8bd9e8:
    english: It is important to understand that copies of the data you have generated on Loomio have likely been emailed to everyone in the group - Loomio has no ability to delete those.
    translation: Kopieën van gegevens die je op Loomio hebt geplaatst, zijn waarschijnlijk per e-mail verstuurd naar iedereen in de groep. Loomio kan die kopieën niet verwijderen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fa98dfeef486cf05:
    english: Deleting your account will _not_ cancel your subscription; to stop your payments see [Subscriptions](/en/policy/subscriptions/management#cancel-your-plan).
    translation: Als je je account verwijdert, wordt je abonnement _niet_ opgezegd. Lees bij [Abonnementen](/en/policy/subscriptions/management#cancel-your-plan) hoe je betalingen stopt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c1ceda8f829133c7:
    english: Loomio has made fundamental decisions about its ownership, business model and software to protect users' rights. Loomio is an independent, worker-owned cooperative, the software is open source, you can [export your data](/en/user_manual/groups/data_export), and Loomio never sells your data or uses it for advertising. These commitments are set out in our [privacy policy](/en/policy/privacy) and grounded in the purpose and values in our [constitution](https://www.loomio.coop/constitution.html) and [cooperative handbook](https://www.loomio.coop/purpose_and_vision.html). If you have any questions, [contact us](/contact).
    translation: Loomio heeft keuzes gemaakt over eigendom, bedrijfsmodel en software om de rechten van gebruikers te beschermen. Loomio is een onafhankelijke coöperatie in eigendom van de werknemers. De software is open source, je kunt [je gegevens exporteren](/en/user_manual/groups/data_export) en Loomio verkoopt je gegevens nooit en gebruikt ze niet voor advertenties. Deze afspraken staan in ons [privacybeleid](/en/policy/privacy) en zijn gebaseerd op het doel en de waarden in onze [statuten](https://www.loomio.coop/constitution.html) en ons [coöperatieve handboek](https://www.loomio.coop/purpose_and_vision.html). Heb je vragen, [neem dan contact met ons op](/contact).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d8cc22d615b8f5d9:
    english: "## To delete your account entirely"
    translation: "## Je account volledig verwijderen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  77235d504409d763:
    english: Sign in to Loomio.  Go to the sidebar from the (☰) menu icon at screen top left Click on your account avatar or initials, at the top right of your screen.
    translation: Meld je aan bij Loomio. Open de zijbalk met het menupictogram (☰) linksboven op het scherm. Klik rechtsboven op je profielfoto of initialen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  04127f38282f6bd2:
    english: Click the down arrow ( ∨ ) alongside your name to open user settings. Select **Edit profile**.
    translation: Klik op de pijl omlaag ( ∨ ) naast je naam om de gebruikersinstellingen te openen. Selecteer **Profiel bewerken**.
