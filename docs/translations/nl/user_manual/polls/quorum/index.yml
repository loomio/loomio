  ef25fbaed498cfbe:
    english: The cooperative requires 60 percent participation for significant decisions, so Jamie enters **60** in the participation quorum field and starts the proposal.
    translation: De coöperatie vereist 60 procent deelname bij belangrijke besluiten. Daarom vult Jamie **60** in bij het deelnamequorum en start het voorstel.
