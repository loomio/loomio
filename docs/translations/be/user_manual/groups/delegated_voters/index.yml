  cde9fe3639ac5e9e:
    english: "# Delegated voters"
    translation: "# Выбаршчыкі-дэлегаты"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9cfb3b7835dc5cb0:
    english: If some members of your group should have voting rights while others should not, you can use the "Make delegate" feature to identify those people with voting rights. There is a corresponding "Revoke delegate" action too.
    translation: Калі права голасу павінны мець толькі некаторыя ўдзельнікі вашай групы, пазначце іх з дапамогай дзеяння «Зрабіць дэлегатам». Каб скасаваць гэтае права, выкарыстоўвайце дзеянне «Адклікаць дэлегата».
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e017eafb51368777:
    english: Use delegates when people should share the same discussion space but only a defined set, such as directors or elected representatives, may vote. This is usually simpler than maintaining a second subgroup whose only purpose is to separate voters from non-voters.
    translation: Выкарыстоўвайце дэлегатаў, калі ўсім патрэбна агульная прастора для абмеркаванняў, але галасаваць можа толькі вызначанае кола людзей, напрыклад члены праўлення або абраныя прадстаўнікі. Звычайна гэта прасцей, чым падтрымліваць асобную падгрупу толькі для размежавання тых, хто можа галасаваць, і тых, хто не можа.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1942a47ae47ca813:
    english: Use a private subgroup instead when its members also need discussions, files, or membership information that other members must not see.
    translation: Калі ўдзельнікам таксама патрэбны асобныя абмеркаванні, файлы або звесткі пра склад групы, недаступныя іншым, стварыце прыватную падгрупу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3346f757dc7bcd14:
    english: "![Make delegate action in a member's menu](member_make_delegate.png)"
    translation: "![Дзеянне «Зрабіць дэлегатам» у меню ўдзельніка](member_make_delegate.png)"
    status: machine
