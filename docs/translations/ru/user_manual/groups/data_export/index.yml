---
navigation_title: Экспорт данных
blocks:
  '053719812e2be1ea':
    english: "# Group data backup or export"
    translation: "# Резервное копирование и экспорт данных группы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  42721518a91907da:
    english: 'With the group data export feature you can:'
    translation: 'Экспорт данных группы позволяет:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f978c97e52e0b00a:
    english: |-
      - Download a file containing member data to audit group membership.
      - Download content of your group including text of threads and polls for archive or analysis.
      - Open poll results in a spreadsheet or scripting language.
      - [Print or save PDF's of a thread or poll for archival purposes.](#print-thread-to-pdf)
      - Move your group, including all users, threads, polls, and files to another Loomio server.
    translation: |-
      - Скачать файл с данными участников, чтобы проверить состав группы.
      - Скачать содержимое группы, включая тексты обсуждений и голосований, для архива или анализа.
      - Открыть результаты голосования в электронной таблице или обработать их с помощью скрипта.
      - [Распечатать обсуждение или голосование либо сохранить его в PDF для архива.](#print-thread-to-pdf)
      - Перенести группу вместе со всеми пользователями, обсуждениями, голосованиями и файлами на другой сервер Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  94b3081b62cd0a45:
    english: If you ever want to move from Loomio managed servers [to your own](https://github.com/loomio/loomio), you can use this feature.
    translation: Если вы решите перейти с серверов под управлением Loomio [на собственный сервер](https://github.com/loomio/loomio), воспользуйтесь этой функцией.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  223d5690921676c4:
    english: If you're running your own Loomio server, and would rather not anymore, Loomio offer managed hosting in USA, EU and Australia. If you'd like to migrate your group to one of these servers, please [contact us](/contact).
    translation: Если вы больше не хотите поддерживать собственный сервер Loomio, можно перейти на хостинг Loomio в США, ЕС или Австралии. Чтобы перенести группу на один из этих серверов, [свяжитесь с нами](/contact).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cabd4ab01146ea7c:
    english: "[Contact us](/contact) if you would like to transfer your Loomio group from Loomio's global hosted service at loomio.com to one of our regional services; loomio.eu for Europe or loomio.nz for Australia and New Zealand."
    translation: "[Свяжитесь с нами](/contact), если хотите перенести группу с общего сервиса Loomio на loomio.com на один из региональных сервисов: loomio.eu для Европы или loomio.nz для Австралии и Новой Зеландии."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
