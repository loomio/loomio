  ef2b52204ab83521:
    english: Select **Edit rich text** to return to the formatting tools. This converts supported Markdown into its displayed form.
    translation: Wähle **Formatierten Text bearbeiten**, um zu den Formatierungswerkzeugen zurückzukehren. Unterstütztes Markdown wird dabei in seine angezeigte Form umgewandelt.
