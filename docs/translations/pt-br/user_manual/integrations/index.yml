  828de256c39d112c:
    english: Loomio complements chat, shared documents, and task-management tools rather than replacing every kind of work.
    translation: O Loomio complementa ferramentas de conversa, documentos compartilhados e ferramentas de gestão de tarefas. Cada uma atende a necessidades diferentes.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ad42655c9ef79337:
    english: |-
      | Work | Suggested tool |
      |---|---|
      | Quick questions, social conversation, and timely updates | Chat |
      | Collaborative editing of a living document | Shared document |
      | Assigning and tracking tasks | Project or task-management tool |
      | Important topic-based discussion, broad participation, decisions, and outcomes | Loomio |
    translation: |-
      | Trabalho | Ferramenta sugerida |
      |---|---|
      | Perguntas rápidas, conversas informais e atualizações que exigem atenção imediata | Ferramenta de conversa |
      | Edição colaborativa de um documento em constante atualização | Documento compartilhado |
      | Distribuição e acompanhamento de tarefas | Ferramenta de gestão de projetos ou tarefas |
      | Discussões importantes sobre um assunto, ampla participação, decisões e conclusões | Loomio |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  40e853f5116f28eb:
    english: Put work in Loomio when people need time to consider a topic, when everyone affected should have a meaningful opportunity to participate, or when the group will need to find the discussion and decision later. Link to the relevant document or task from the Loomio discussion so its context remains easy to find.
    translation: Use o Loomio quando as pessoas precisarem de tempo para considerar um assunto, quando todos os envolvidos precisarem de uma oportunidade real de participar ou quando o grupo precisar consultar a discussão e a decisão mais tarde. Inclua um link para o documento ou a tarefa relevante na discussão do Loomio para facilitar o acesso ao contexto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
