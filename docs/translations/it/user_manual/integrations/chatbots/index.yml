  f1d9c09f9d3c2a82:
    english: "### Invite to poll"
    translation: "### Invita a votare"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cbc7b5fd5afcc24c:
    english: |-
      This is how to send a notification to your chatroom inviting people to vote in a proposal.
      It's the same process for Share outcome, Invite to thread, Remind to vote, Poll edited etc.
    translation: |-
      Per invitare le persone a votare una proposta, invia una notifica alla tua chat in questo modo.
      La procedura è la stessa per Condividi conclusione, Invita alla discussione, Ricorda di votare, Sondaggio modificato e altri eventi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  290001bb97dee010:
    english: |-
      ### Automatic notifications
      To send a notification whenever a specific event happens, edit the chat integration and select that event.
    translation: |-
      ### Notifiche automatiche
      Per inviare una notifica ogni volta che si verifica un evento specifico, modifica l'integrazione di chat e seleziona quell'evento.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
