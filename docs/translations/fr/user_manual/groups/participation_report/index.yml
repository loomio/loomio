    translation: "### Votes par utilisateur"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e6670b54039f316a:
    english: Compare the number of votes issued to each person with the number they cast, see missed votes, and identify people who cast every vote issued to them. A person with no issued votes is not shown as having cast all votes. Anonymous polls are excluded because an anonymous ballot must not be associated with the person who cast it.
    translation: Comparez le nombre de votes proposés à chaque personne au nombre de votes qu’elle a exprimés. Repérez les votes manqués et les personnes qui ont participé à tous les votes qui leur ont été proposés. Une personne à qui aucun vote n’a été proposé n’est pas considérée comme ayant participé à tous les votes. Les sondages anonymes sont exclus, car un bulletin anonyme ne doit pas être associé à la personne qui l’a déposé.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  252da2b72775c4f8:
    english: Use **Delegates only** to review the voting record of current delegates. The CSV download uses the same name and delegate filters.
    translation: Utilisez **Délégués seulement** pour consulter les votes des personnes actuellement déléguées. Le téléchargement CSV applique les mêmes filtres par nom et par statut de délégué.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
