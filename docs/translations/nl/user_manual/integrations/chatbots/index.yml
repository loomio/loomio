  195fe68dbcc6418f:
    english: Loomio can send notifications to your chatroom.
    translation: Loomio kan meldingen naar je chatruimte sturen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bf886ec0d398e8d7:
    english: Chat tools and Loomio work well together. Use chat for quick conversation and timely updates. Move important topics to Loomio when people need time to participate, when a decision must be made, or when the group will need a lasting record.
    translation: Chat en Loomio vullen elkaar aan. Gebruik chat voor korte gesprekken en snelle updates. Verplaats belangrijke onderwerpen naar Loomio als mensen tijd nodig hebben om mee te doen, als er een besluit genomen moet worden of als de groep het gesprek later wil kunnen terugvinden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  db7d26a18ddc651d:
    english: Loomio supports Slack, Discord, Microsoft Teams, Matrix and Mattermost.
    translation: Loomio ondersteunt Slack, Discord, Microsoft Teams, Matrix en Mattermost.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  765fc0d609a0db99:
    english: You can send notifications to your chatroom any time you like, just the same way you would invite individual people to vote, or to join a thread.
    translation: Je kunt op elk moment een melding naar je chatruimte sturen, net zoals je mensen kunt uitnodigen om te stemmen of deel te nemen aan een discussie.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a89717f4f41f3212:
    english: You can also configure notifications to always happen when a specific event happens, like someone starting a thread.
    translation: Je kunt ook instellen dat Loomio automatisch een melding stuurt bij een bepaalde gebeurtenis, bijvoorbeeld wanneer iemand een discussie start.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c425490496cb0ed2:
    english: |-
      ## What it looks like in chat
      ![](chatbot_in_slack.png)
    translation: |-
      ## Zo ziet het eruit in de chat
      ![](chatbot_in_slack.png)
    status: machine
    provider: codex/gpt-6-sol
