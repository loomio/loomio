  2df60ea964109f11:
    english: "## Group data is permanently deleted after 90 days"
    translation: "## Les données du groupe sont définitivement supprimées après 90 jours"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e09923078301b8d:
    english: After 90 days, all the threads, polls, files and other group content will be permanently deleted. ***This is non-reversible!***
    translation: Après 90 jours, toutes les discussions, tous les sondages, les fichiers et les autres contenus du groupe seront définitivement supprimés. ***Cette suppression est irréversible.***
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8695a5ebfb09611d:
    english: We recommend that you [export the group data](/en/user_manual/groups/data_export/)and manually download any important files you have uploaded before you continue.
    translation: Nous vous recommandons d’[exporter les données du groupe](/en/user_manual/groups/data_export/) et de télécharger manuellement les fichiers importants que vous avez ajoutés avant de continuer.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
