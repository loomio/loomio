  '099449b0e1fe4f85':
    english: Loomio also includes a Question round for collecting questions without voting. Group administrators can make it available from [Poll templates](/en/user_manual/polls/poll_templates/).
    translation: У Loomio таксама ёсць раўнд пытанняў, які дазваляе збіраць пытанні без галасавання. Адміністратары групы могуць зрабіць яго даступным праз [шаблоны апытанняў](/en/user_manual/polls/poll_templates/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
