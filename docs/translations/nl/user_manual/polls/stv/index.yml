  85590745d00e23c1:
    english: "# STV Elections"
    translation: "# STV-verkiezingen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  366f56443108e10f:
    english: "**Single Transferable Vote (STV)** is a proportional representation voting method for electing multiple winners from a field of candidates. It ensures that elected candidates proportionally represent the diversity of views among voters."
    translation: "**Single Transferable Vote (STV)** is een methode voor evenredige vertegenwoordiging waarmee meerdere kandidaten worden gekozen. De gekozen kandidaten vertegenwoordigen zo de verschillende opvattingen van de kiezers in verhouding tot hun steun."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  61dee55b45038f56:
    english: "## When to use STV"
    translation: "## Wanneer gebruik je STV?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8311dca26cec6519:
    english: 'Use an STV Election when you need to:'
    translation: 'Gebruik een STV-verkiezing als je:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1d4338734ec6e113:
    english: |-
      - Elect a **committee, board, or slate of delegates** from a pool of nominees
      - Ensure **proportional representation**, where minority factions can win seats proportional to their support
      - Run elections where voters rank candidates by preference
    translation: |-
      - Uit een groep genomineerden een **commissie, bestuur of groep afgevaardigden** wilt kiezen
      - **Evenredige vertegenwoordiging** wilt, zodat minderheidsgroepen zetels kunnen winnen in verhouding tot hun steun
      - Een verkiezing wilt houden waarin kiezers kandidaten op volgorde van voorkeur zetten
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e6e1ae026f65a715:
    english: |-
      >[!NOTE]
      >STV is **not** the same as Loomio's [Rank poll](/en/user_manual/polls/rank/), which is a simpler score-based ranking for choosing a single best option. STV handles multi-winner elections with vote transfers and elimination rounds.
    translation: |-
      >[!NOTE]
      >STV is **niet** hetzelfde als Loomio's [rangschikkingspeiling](/en/user_manual/polls/rank/). Die gebruikt een eenvoudiger puntensysteem om één beste optie te kiezen. STV kiest meerdere winnaars door stemmen over te dragen en kandidaten in telrondes uit te schakelen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  62af8f95f18dbafe:
    english: "## Creating an STV Election"
    translation: "## Een STV-verkiezing maken"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  edf2f36e75c81665:
    english: When starting a poll, select **STV Election** as the poll type, then add the candidates as the poll options. You can customize the poll by setting the **number of seats**, the **counting method**, and the **quota type**.
    translation: Selecteer **STV-verkiezing** als peilingtype wanneer je een peiling start. Voeg daarna de kandidaten toe als opties. Je kunt de verkiezing instellen met het **aantal te vullen zetels**, de **telmethode** en het **quotatype**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b40ddcfb8cdc44fd:
    english: In this example, Oatmilk Cooperative is electing three people to oversee its returnable packaging trial. The form explains the role, lists five candidates, and uses Scottish STV with the Droop quota.
    translation: In dit voorbeeld kiest Oatmilk Cooperative drie mensen die toezicht houden op een proef met herbruikbare verpakkingen. Het formulier legt de rol uit, toont vijf kandidaten en gebruikt Scottish STV met het Droop-quotum.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a34592929349d06:
    english: "### Number of seats"
    translation: "### Aantal te vullen zetels"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c09f5f51333612dc:
    english: How many winners should be elected. Must be less than the number of candidates.
    translation: Het aantal kandidaten dat gekozen moet worden. Dit moet kleiner zijn dan het aantal kandidaten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ddceec01d910b152:
    english: "### Counting method"
    translation: "### Telmethode"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  39e9e81a89272771:
    english: 'There are two available methods for counting the votes:'
    translation: 'Er zijn twee methoden om de stemmen te tellen:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a7031d1180e95273:
    english: |-
      Scottish STV
        : Recommended. The Weighted Inclusive Gregory Method (WIGM) used in Scottish local elections since 2007. Well-defined, straightforward rules. Best for most organizations.
    translation: |-
      Scottish STV
        : Aanbevolen. De Weighted Inclusive Gregory Method (WIGM), die sinds 2007 wordt gebruikt bij Schotse lokale verkiezingen. De regels zijn duidelijk en eenvoudig. Geschikt voor de meeste organisaties.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1507e4fde88848dd:
    english: |-
      Meek STV
        : A more mathematically precise iterative method. When a candidate is eliminated, votes are recounted as if that candidate was never in the race.
    translation: |-
      Meek STV
        : Een wiskundig nauwkeurigere methode die de telling herhaalt. Als een kandidaat wordt uitgeschakeld, worden de stemmen opnieuw geteld alsof die kandidaat nooit had meegedaan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b9abcd12eef5f629:
    english: "### Quota type"
    translation: "### Quotatype"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6dc3aea49266d40d:
    english: 'The quota is the minimum number of votes a candidate needs to win a seat. It can be either:'
    translation: 'Het quotum is het minimumaantal stemmen dat een kandidaat nodig heeft om een zetel te winnen. Je kunt kiezen uit:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  88f62f286d8c550f:
    english: |-
      Droop
        : Recommended. The standard quota type for most STV elections, and used by Ireland, Australia, and Scotland. Droop guarantees a majority coalition wins a majority of seats. It is calculated as:
      \\[ floor(\frac{votes}{(seats + 1)}) + 1 \\]
    translation: |-
      Droop
        : Aanbevolen. Het gebruikelijke quotatype voor de meeste STV-verkiezingen. Het wordt gebruikt in Ierland, Australië en Schotland. Droop garandeert dat een coalitie met een meerderheid van de stemmen ook een meerderheid van de zetels krijgt. Het wordt zo berekend:
      \\[ floor(\frac{votes}{(seats + 1)}) + 1 \\]
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  817b3994e92898e8:
    english: |-
      Hare
        : A higher minimum threshold, and more proportional for smaller factions.
          Hare is preferred by DSA chapters to protect minority representation.
         It is calculated as:
          \\[ \frac{votes}{seats}\\]
    translation: |-
      Hare
        : Een hoger minimum, dat kleinere groepen evenrediger vertegenwoordigt.
          DSA-afdelingen geven de voorkeur aan Hare om de vertegenwoordiging van minderheden te beschermen.
         Het wordt zo berekend:
          \\[ \frac{votes}{seats}\\]
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f12065bdf5d3678e:
    english: |2-
        >[!TIP]
        > Droop will always compute to a smaller number of votes than Hare. For example, in an election with 100 votes and four seats, the Droop quota would be 21 and the Hare quota 25.
    translation: |-
      >[!TIP]
        > Het Droop-quotum is altijd lager dan het Hare-quotum. Bij een verkiezing met 100 stemmen en vier zetels is het Droop-quotum bijvoorbeeld 21 en het Hare-quotum 25.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  984516abc3cfd89b:
    english: "## How voting works"
    translation: "## Hoe stemmen werkt"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  40e98247d87cdf27:
    english: 'In this example, Oatmilk Cooperative is electing three people to oversee the reusable packaging trial. Voters drag candidates above the line and rank them in order of preference:'
    translation: 'In dit voorbeeld kiest Oatmilk Cooperative drie mensen die toezicht houden op de proef met herbruikbare verpakkingen. Kiezers slepen kandidaten boven de lijn en zetten hen op volgorde van voorkeur:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f8aaa5391f05117f:
    english: |-
      - **Rank 1** = most preferred candidate
      - **Rank 2** = second choice
      - Continue ranking as many candidates as desired
    translation: |-
      - **Rang 1** = kandidaat met de hoogste voorkeur
      - **Rang 2** = tweede keuze
      - Rangschik zoveel kandidaten als je wilt
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  70bd790faf93c916:
    english: Voters are not required to rank every candidate. Unranked candidates will not receive any of that voter's support.
    translation: Kiezers hoeven niet elke kandidaat te rangschikken. Kandidaten zonder rang krijgen geen steun van die kiezer.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d82e369c7c293a0c:
    english: |-
      ## How counting works
      The count is performed as follows:
    translation: |-
      ## Hoe het tellen werkt
      De stemmen worden als volgt geteld:
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0ea01b5d531abc06:
    english: |-
      1. A **quota** is calculated (minimum votes needed to win a seat).
      2. **First preferences** are counted for each candidate.
      3. If a candidate meets the quota, they are **elected**. Their surplus votes (above the quota) are **transferred** to voters' next preferences at a fractional value.
      4. If no candidate meets the quota, the candidate with the **fewest votes is eliminated**. Their votes transfer to voters' next preferences at full value.
      5. This process repeats until all seats are filled.
    translation: |-
      1. Er wordt een **quotum** berekend: het minimumaantal stemmen dat nodig is om een zetel te winnen.
      2. De **Eerste voorkeuren** worden voor elke kandidaat geteld.
      3. Als een kandidaat het quotum haalt, wordt die **gekozen**. Het overschot aan stemmen boven het quotum wordt voor een deel van de waarde **overgedragen** aan de volgende voorkeuren van de kiezers.
      4. Als geen kandidaat het quotum haalt, wordt de kandidaat met de **minste stemmen uitgeschakeld**. De stemmen van die kandidaat worden voor hun volledige waarde overgedragen aan de volgende voorkeuren van de kiezers.
      5. Dit proces wordt herhaald totdat alle zetels zijn gevuld.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c6f397233ad479e5:
    english: |-
      >[!TIP]
      >If a voter has ranked no remaining candidates, their ballot is "exhausted" and that vote is lost. This is why ranking more candidates is generally better.
    translation: |-
      >[!TIP]
      >Als een kiezer geen overgebleven kandidaten heeft gerangschikt, is het stembiljet 'uitgeput' en telt die stem niet meer mee. Daarom is het meestal beter om meer kandidaten te rangschikken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  acba228efb586cca:
    english: "## Understanding results"
    translation: "## De uitslag begrijpen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3b584c17ac358371:
    english: 'After the poll closes, results are displayed in several sections. In this election, Samira Patel, Alex Morgan, and Morgan Price fill the three committee seats:'
    translation: 'Na het sluiten van de peiling wordt de uitslag in verschillende onderdelen getoond. In deze verkiezing vullen Samira Patel, Alex Morgan en Morgan Price de drie zetels in de commissie:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9c3f3c8a80729fbf:
    english: "### Method and quota"
    translation: "### Methode en quotum"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  feee79b9f6e92de3:
    english: At the top, you'll see the counting method (Scottish STV or Meek STV) and quota type (Droop or Hare) along with the quota — the number of votes a candidate needed to win a seat.
    translation: 'Bovenaan zie je de telmethode (Scottish STV of Meek STV), het quotatype (Droop of Hare) en het quotum: het aantal stemmen dat een kandidaat nodig had om een zetel te winnen.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e180eb800c3435cd:
    english: "### Elected candidates"
    translation: "### Gekozen kandidaten"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8db8b2466db56f2b:
    english: 'A summary table of the winners with five columns:'
    translation: 'Een overzichtstabel van de winnaars met vijf kolommen:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f998ffc721953501:
    english: |-
      | Column | Meaning |
      |--------|---------|
      | **Candidate** | The name of the elected candidate |
      | **Round elected** | Which counting round they reached the quota and won a seat. Round 1 means they won on first preferences alone; higher rounds mean they needed transferred votes from eliminated or surplus candidates. |
      | **First preferences** | How many voters ranked this candidate as their first choice. This shows a candidate's direct support before any vote transfers. |
      | **Final tally** | The candidate's vote tally at the moment they were elected. Due to vote transfers, this is often higher than their first preferences. |
      | **Surplus** | How much the candidate's final tally exceeded the quota (final tally minus quota). A larger surplus means stronger support beyond what was needed to win. In Scottish STV, this surplus is redistributed to voters' next preferences. |
    translation: |-
      | Kolom | Betekenis |
      |--------|---------|
      | **Kandidaat** | De naam van de gekozen kandidaat |
      | **Ronde gekozen** | De telronde waarin de kandidaat het quotum haalde en een zetel won. Ronde 1 betekent dat de kandidaat alleen met eerste voorkeuren won. In latere rondes waren ook overgedragen stemmen van uitgeschakelde kandidaten of uit een overschot nodig. |
      | **Eerste voorkeuren** | Het aantal kiezers dat deze kandidaat als eerste keuze rangschikte. Dit toont de directe steun vóór de overdracht van stemmen. |
      | **Eindstand** | Het aantal stemmen van de kandidaat op het moment van verkiezing. Door overgedragen stemmen is dit vaak hoger dan het aantal eerste voorkeuren. |
      | **Overschot** | Het aantal stemmen waarmee de eindstand van de kandidaat het quotum overschreed (eindstand min quotum). Een groter overschot betekent meer steun dan nodig was om te winnen. Bij Scottish STV wordt dit overschot verdeeld over de volgende voorkeuren van de kiezers. |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  efc41c326d955758:
    english: If the count results in a tie — where eliminating any of the remaining candidates would change the outcome — those candidates are shown in a separate table rather than arbitrarily choosing a winner.
    translation: Als de telling eindigt in een gelijkspel waarbij het uitschakelen van een van de overgebleven kandidaten de uitslag zou veranderen, worden die kandidaten in een aparte tabel getoond. Er wordt dan niet willekeurig een winnaar gekozen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8a6ae4ad28f0acf6:
    english: "### Round-by-round details"
    translation: "### Details per ronde"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3d907145fd075144:
    english: 'Expand **Round-by-round details** to see vote transfers and eliminations. Each row is a candidate and each column is a counting round:'
    translation: 'Klap **Details per ronde** uit om te zien hoe stemmen zijn overgedragen en kandidaten zijn uitgeschakeld. Elke rij toont een kandidaat en elke kolom een telronde:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cc37217cd681fabe:
    english: The green highlight shows when a candidate was elected, red shows when they were eliminated, and orange shows when they tied.
    translation: Groen geeft aan wanneer een kandidaat werd gekozen, rood wanneer een kandidaat werd uitgeschakeld en oranje wanneer kandidaten gelijk eindigden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ed4aaa0a898906fd:
    english: "## Exporting ballots"
    translation: "## Stembiljetten exporteren"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c96d54ebfbedae32:
    english: After the election closes, people who can view the results can export the ballots in BLT format for an independent recount or audit. The export contains candidate rankings and combines identical rankings into a single row with a ballot count. For anonymous elections it does not contain voter identities, ballot identifiers, submission times, or submission order.
    translation: Na het sluiten van de verkiezing kunnen mensen die de uitslag mogen bekijken de stembiljetten exporteren in BLT-formaat voor een onafhankelijke hertelling of controle. De export bevat de rangschikkingen van kandidaten en voegt identieke rangschikkingen samen op één rij met het aantal stembiljetten. Bij anonieme verkiezingen bevat de export geen identiteit van kiezers, stembiljet-ID's, tijdstippen van indiening of volgorde van indiening.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
