  '0479bd2337b02443':
    english: "### Boards and Governance"
    translation: "### Bestuur en governance"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5b0a3e2c653d47f8:
    english: "**Prepare for a meeting** - Build an agenda, post board papers and organize administrative matters so everyone is up to date, in context and prepared. "
    translation: "**Bereid je voor op een vergadering** - Stel een agenda op, deel vergaderstukken en regel praktische zaken, zodat iedereen op de hoogte is en zich kan voorbereiden."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5c1c6aa79c3556dc:
    english: "**Pass a resolution** - Post context and background information, respond to questions and raise a proposal to pass a resolution. "
    translation: "**Neem een resolutie aan** - Deel de context en achtergrondinformatie, beantwoord vragen en dien een voorstel in om een resolutie aan te nemen."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  07ae9c6a1f0a32d0:
    english: "**Discuss an agenda item on Loomio** - Start discussion about an agenda item prior to your meeting. Or, if you run out of time in the meeting, move the discussion on to Loomio."
    translation: "**Bespreek een agendapunt op Loomio** - Begin vóór je vergadering een discussie over een agendapunt. Of zet de discussie voort op Loomio als er tijdens de vergadering te weinig tijd is."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f0b0de7094b1cfc9:
    english: "**Approve minutes and track actions** - Post minutes and assign actions. Use a poll to approve minutes. "
    translation: "**Keur notulen goed en volg actiepunten op** - Deel de notulen en wijs actiepunten toe. Gebruik een peiling om de notulen goed te keuren."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ba7cf177191baadb:
    english: "### Member participation"
    translation: "### Deelname van leden"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3cf51f837c0a3e9f:
    english: "**Share news (replace mailing list)** - Post information for members, invite comments."
    translation: "**Deel nieuws (als alternatief voor een mailinglijst)** - Deel informatie met leden en nodig ze uit om te reageren."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d2cd391b61042129:
    english: "**Organize an event** - Work with your organizing team on details. Keep all discussion and info within the thread. Then announce the event to wider membership."
    translation: "**Organiseer een evenement** - Werk met je organisatieteam de details uit. Houd alle informatie en gesprekken binnen de discussiedraad. Kondig het evenement daarna aan bij alle leden."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cf59a44a8643cc96:
    english: "**Develop a policy** - Post a policy draft, seek member feedback and input, finalize and ratify the policy."
    translation: "**Ontwikkel beleid** - Deel een conceptbeleid, vraag leden om feedback en ideeën, en stel het beleid vast."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6ddec467576426ca:
    english: "**General Assembly** - Organize, prepare and run a formal meeting including all members, to deliberate and make decisions on strategic matters."
    translation: "**Algemene vergadering** - Organiseer, bereid voor en leid een formele vergadering voor alle leden, waarin je strategische onderwerpen bespreekt en besluiten neemt."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8d32bb446c4ca025:
    english: "### Self-organizing working teams"
    translation: "### Zelforganiserende werkgroepen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  87ab6b2d51a7c1b6:
    english: "**Share information** - Post information and reports of interest to your team, invite comment and discussion."
    translation: "**Deel informatie** - Deel informatie en verslagen die relevant zijn voor je team en nodig mensen uit om te reageren en mee te praten."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e93205aa183cd1e0:
    english: "**Progress work** - Outline a work task and seek advice, input and feedback from team members through to completion."
    translation: "**Breng werk verder** - Beschrijf een taak en vraag teamleden om advies, ideeën en feedback totdat de taak is afgerond."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1ddaef5d44653691:
    english: "**Meeting notes and actions** - Post meeting notes as a record of discussion, and follow up on tasks. "
    translation: "**Vergadernotities en actiepunten** - Deel vergadernotities als verslag van de discussie en volg taken op."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8ce9169d72c90788:
    english: "**Explore ideas** - Share thoughts and invite discussion about a concern you notice, or an improvement that can be made."
    translation: "**Verken ideeën** - Deel je gedachten en nodig anderen uit om mee te praten over iets dat je zorgen baart of dat beter kan."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a06e734e86f07828:
    english: "**Advice, Consent and Generative decision making** - Prepare, propose, clarify, respond to reactions and objections, agree and implement - all within a Loomio discussion."
    translation: "**Besluitvorming op basis van advies, consent of nieuwe ideeën** - Bereid een besluit voor, doe een voorstel, verduidelijk het, reageer op reacties en bezwaren, bereik overeenstemming en voer het uit. Dat kan allemaal binnen een Loomio-discussie."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
