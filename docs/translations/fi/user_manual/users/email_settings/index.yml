  37e2be2c73fbb06d:
    english: "## Turn off external notifications"
    translation: "## Poista sähköposti- ja push-ilmoitukset käytöstä"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5e3d442fa885bcd4:
    english: To stop email and push messages for group and thread activity, open **Notification settings** from your user menu, set the catch-up to **Never**, and choose **No email updates** and **No push updates**. Notifications and activity remain available when you open Loomio.
    translation: Jos haluat lopettaa ryhmien ja keskusteluketjujen toimintaa koskevat sähköpostit ja push-ilmoitukset, avaa käyttäjävalikosta **Ilmoitusasetukset**. Aseta kertauksen aikatauluksi **Ei koskaan** ja valitse **Ei sähköposti-päivityksiä** sekä **Ei push-päivityksiä**. Ilmoitukset ja toiminta näkyvät edelleen, kun avaat Loomion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
