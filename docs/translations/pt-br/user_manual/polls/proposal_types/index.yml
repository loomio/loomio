  d370759001be4e21:
    english: Polls collect selections, scores, allocations, rankings, availability, or election ballots. Choose the voting method based on what participants need to express and how you intend to use the result. Use a [Proposal](/en/user_manual/polls/proposals/) when people need to respond to a statement or course of action.
    translation: As enquetes coletam escolhas, pontuações, distribuições de pontos, classificações, disponibilidade ou votos em eleições. Escolha o método de votação conforme o que os participantes precisam expressar e como você pretende usar o resultado. Use uma [Proposta](/en/user_manual/polls/proposals/) quando as pessoas precisarem responder a uma declaração ou a um plano de ação.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1132ff680c7b2562:
    english: "## Simple poll"
    translation: "## Enquete de escolha"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6b957bf5630c1470:
    english: "[Choose](/en/user_manual/polls/choose/) lets participants select one or more options. Use it to find the most popular option or make a shortlist."
    translation: A [enquete de escolha](/en/user_manual/polls/choose/) permite que os participantes selecionem uma ou mais opções. Use-a para identificar a opção mais popular ou criar uma lista de opções preferidas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c982974685e1b5d6:
    english: "## Score poll"
    translation: "## Enquete de pontuação"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fbbfe14196388606:
    english: "[Score](/en/user_manual/polls/score/) lets participants rate every option on the same scale. Use it to compare the strength of support, readiness, suitability, or importance across options."
    translation: A [enquete de pontuação](/en/user_manual/polls/score/) permite que os participantes avaliem cada opção na mesma escala. Use-a para comparar o grau de apoio, preparo, adequação ou importância das opções.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0465fcb48a56ca78:
    english: "## Dot vote"
    translation: "## Enquete de distribuição"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ffb7d1711a5fca3b:
    english: "[Allocate](/en/user_manual/polls/allocate/) gives each participant a fixed budget of points to distribute. Use it to identify priorities when choosing one thing means giving less attention or resources to another."
    translation: A [enquete de distribuição](/en/user_manual/polls/allocate/) dá a cada participante uma quantidade fixa de pontos para distribuir. Use-a para identificar prioridades quando dedicar mais atenção ou recursos a uma opção significa dedicar menos a outra.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a1b15c28fbe526f6:
    english: "## Ranked choice"
    translation: "## Enquete de classificação"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8811f455b7ab3821:
    english: "[Rank](/en/user_manual/polls/rank/) lets participants arrange options in order of preference. Use it to find the group's overall preferred order or select one leading option."
    translation: A [enquete de classificação](/en/user_manual/polls/rank/) permite que os participantes ordenem as opções por preferência. Use-a para encontrar a ordem de preferência geral do grupo ou selecionar a opção mais bem colocada.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2e21bb1b54b6fcf9:
    english: "## Time poll"
    translation: "## Enquete de horário"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb768f07eb0d1971:
    english: "[Time poll](/en/user_manual/polls/meeting_polls/) lets participants indicate when they are available. Use it to schedule a meeting or event across time zones."
    translation: A [enquete de horário](/en/user_manual/polls/meeting_polls/) permite que os participantes indiquem quando estão disponíveis. Use-a para marcar uma reunião ou um evento entre diferentes fusos horários.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
