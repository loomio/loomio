navigation_title: Кансенсус
blocks:
  9f617c478e625137:
    english: "# Consensus"
    translation: "# Кансенсус"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7fdabc28ebd47ad3:
    english: A Consensus proposal seeks collective agreement from everyone involved. The default responses let participants agree, abstain, disagree, or block.
    translation: Прапанова «Кансенсус» дапамагае ўсім удзельнікам прыйсці да агульнай згоды. Стандартныя варыянты адказу дазваляюць выказаць згоду, устрымацца, выказаць нязгоду або заблакіраваць прапанову.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  82dbfd2dd1160c29:
    english: This page explains how to run one Consensus proposal. See the [Consensus process](/en/guides/making_decisions/consensus_process) for the complete workflow from discussion and Sense check through amendment and outcome.
    translation: 'На гэтай старонцы апісана, як правесці адно галасаванне па прапанове «Кансенсус». У [працэсе дасягнення кансенсусу](/en/guides/making_decisions/consensus_process) апісаны ўсе этапы: ад абмеркавання і праверкі настрояў да ўнясення паправак і публікацыі высновы.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  12074389ed4de458:
    english: "## When to use Consensus"
    translation: "## Калі выкарыстоўваць кансенсус"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e1e89b6df3a1dbe1:
    english: Use Consensus for decisions where broad ownership matters and the group is prepared to work through concerns together. It suits shared standards, governance agreements, strategic commitments, and decisions that affect the whole group.
    translation: Выкарыстоўвайце кансенсус для рашэнняў, за якія важна ўзяць адказнасць усёй групай і па якіх група гатовая разам разглядаць сумневы. Ён падыходзіць для агульных стандартаў, дамоўленасцей аб кіраванні, стратэгічных абавязацельстваў і рашэнняў, якія ўплываюць на ўсю групу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a28ea900326c3254:
    english: Consensus usually requires discussion and proposal development before voting. Define the meaning and consequences of **Block** for your group. If your process does not use blocks, edit the template to remove that option.
    translation: Кансенсус звычайна патрабуе абмеркавання і дапрацоўкі прапановы перад галасаваннем. Вызначце, што для вашай групы азначае **Блок** і якія ён мае наступствы. Калі ў вашым працэсе блакіроўка не выкарыстоўваецца, выдаліце гэты варыянт з шаблону.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f795d33e2be59883:
    english: "## Example: adopt a bottle return standard"
    translation: "## Прыклад: прыняцце стандарту вяртання бутэлек"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dda29f07ddb547f7:
    english: Oatmilk Cooperative has developed a standard covering deposits, collection, washing, food-safety records, and reporting. Because every team will use it, the cooperative seeks consensus before adopting it.
    translation: Кааператыў «Аўсянае малако» распрацаваў стандарт, які ахоплівае заклад за бутэлькі, іх збор і мыццё, улік бяспекі харчовых прадуктаў і справаздачнасць. Паколькі стандарт будуць выкарыстоўваць усе каманды, кааператыў імкнецца дасягнуць кансенсусу перад яго прыняццем.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9703f1f9474243af:
    english: "## Set up the proposal"
    translation: "## Падрыхтуйце прапанову"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9e63b2959e1f6553:
    english: State the complete agreement being considered and link to supporting information. Explain each response, particularly the distinction between disagreeing and blocking. Allow enough time for questions and amendments.
    translation: Выкладзіце поўны тэкст дамоўленасці, якая разглядаецца, і дадайце спасылкі на дапаможныя матэрыялы. Растлумачце кожны варыянт адказу, асабліва розніцу паміж нязгодай і блакіроўкай. Пакіньце дастаткова часу для пытанняў і паправак.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Прагаласуйце"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  955925e0c6998049:
    english: Participants choose the response that matches their position and explain the interests or concerns behind it. A block reason should identify why adopting the proposal would violate a fundamental need or agreed principle.
    translation: Удзельнікі выбіраюць адказ, які адпавядае іх пазіцыі, і тлумачаць свае інтарэсы або сумневы. У прычыне блакіроўкі трэба патлумачыць, чаму прыняцце прапановы парушыць асноўную патрэбу або ўзгоднены прынцып.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Азнаёмцеся з вынікамі"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d5d9f0dbb463bed7:
    english: The chart shows the balance of responses. Review every disagreement and block reason; consensus is a process of resolving concerns, not only counting agreement votes.
    translation: Дыяграма паказвае суадносіны адказаў. Разгледзьце кожную нязгоду і прычыну блакіроўкі. Дасягненне кансенсусу патрабуе развязаць спрэчныя пытанні, а не толькі падлічыць галасы за прапанову.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f7318776f4a978fc:
    english: If the group reaches agreement, publish an outcome recording the final standard and responsibilities. Otherwise, record what will be revised and when the group will return to the proposal.
    translation: Калі група дасягне згоды, апублікуйце выснову з канчатковым стандартам і размеркаваннем абавязкаў. Інакш запішыце, што трэба перагледзець і калі група вернецца да прапановы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
