---
navigation_title: Presenta Loomio a tu junta directiva
blocks:
  2d7d9e9285159d4f:
    english: "# Introducing Loomio to your board"
    translation: "# Presenta Loomio a tu junta directiva"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6a42b6e2aba774c1:
    english: Loomio can become the online place where your board or committee meet, discuss, decide and build an auditable record for your organization.
    translation: Loomio puede ser el espacio en línea donde tu junta directiva o comité se reúna, debata, tome decisiones y cree un registro verificable para tu organización.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1e26a40fe8b74f47:
    english: Start with the general sequence in [Introducing Loomio to your group](/en/user_manual/overview/introducing_loomio). This page adds considerations specific to boards and committees.
    translation: Empieza con los pasos generales de [Presenta Loomio a tu grupo](/en/user_manual/overview/introducing_loomio). Esta página añade recomendaciones específicas para juntas directivas y comités.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2999c11b8e274b1b:
    english: However Loomio will be of little value if only some of your board participate.  Information and communication will likely remain scattered over multiple tools, lost in email inboxes and the confusion will waste everyone's time.
    translation: Si solo participa una parte de la junta directiva, Loomio tendrá poco valor. La información y las conversaciones seguirán dispersas entre varias herramientas y bandejas de correo. La confusión hará perder tiempo a todos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  28097dbe6dfd2fd7:
    english: 'Consider the problem you are trying to solve by using Loomio, say to improve and track communication or build institutional memory.  Then commit as a board to move your work into Loomio, and encourage everyone to make a genuine effort.  '
    translation: Piensa qué problema quieres resolver con Loomio, como mejorar la comunicación y darle seguimiento o conservar el conocimiento de la organización. Después, acordad como junta directiva trasladar el trabajo a Loomio y anima a todos a participar de forma activa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  449e6d5c90588dd2:
    english: As administrator your primary objective is to set up Loomio effectively for your board.
    translation: Como administrador, tu objetivo principal es configurar Loomio para que tu junta directiva pueda usarlo de forma eficaz.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '08969c9eca0d9855':
    english: 'Aim to encourage directors to join and participate. They should be able to:'
    translation: 'Anima a los integrantes de la junta directiva a unirse y participar. Deben poder:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  70bf0ec81830055e:
    english: |-
      - Sign in to Loomio
      - Read and comment on threads
      - Vote in polls
      - See how your governance practices work in Loomio
    translation: |-
      - Iniciar sesión en Loomio
      - Leer y comentar en los hilos
      - Votar en las encuestas
      - Ver cómo funcionan vuestras prácticas de gobierno en Loomio
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d41ec118bb86c93f:
    english: "## Check technical proficiency "
    translation: "## Comprueba las habilidades digitales"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  728e1c8d201cacca:
    english: Board members will need a computer or smartphone connected to the internet. They must be capable of sending and receiving email, browsing the web, reading digital documents, viewing and hearing videos.
    translation: Los miembros de la junta directiva necesitarán un ordenador o un teléfono inteligente con conexión a internet. Deben poder enviar y recibir correos electrónicos, navegar por internet, leer documentos digitales y ver vídeos con sonido.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  de1b1186edaff7c6:
    english: 'Check that members have all of the following:'
    translation: 'Comprueba que los miembros tengan todo lo siguiente:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9932640dbf8944e3:
    english: |-
      - an up-to-date device—a computer, tablet or smart phone with email and a modern internet browser
      - internet service via WIFI, ethernet cable or mobile data plan (3G or above)
      - capability to send and receive email, browse the internet, download documents and play videos.
    translation: |-
      - un dispositivo actualizado: ordenador, tableta o teléfono inteligente con correo electrónico y un navegador moderno
      - conexión a internet por WIFI, cable Ethernet o datos móviles (3G o superior)
      - capacidad para enviar y recibir correos electrónicos, navegar por internet, descargar documentos y reproducir vídeos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4496ce2ee6172b32:
    english: Loomio works with all standard internet browsers such as Google Chrome, Microsoft Edge, Firefox and Apple Safari. Old out-of-date browsers such as Microsoft Internet Explorer may not work.
    translation: Loomio funciona con los navegadores habituales, como Google Chrome, Microsoft Edge, Firefox y Apple Safari. Los navegadores antiguos y desactualizados, como Microsoft Internet Explorer, podrían no funcionar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bd5dc5f2d0f56a28:
    english: If you have a problem using Loomio on your device, [Contact Loomio support](/contact).
    translation: Si tienes problemas para usar Loomio en tu dispositivo, [contacta con el servicio de asistencia de Loomio](/contact).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ca7b25bb2d86ba90:
    english: "## Configure your group"
    translation: "## Configura tu grupo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  92712f3a984128af:
    english: |-
      ### Group Description
      The group description is the first place people see when they arrive into your Loomio group. Write it to help new members  understand the purpose of the group and the work you will do together. Provide any other information that orients people and encourages them to participate.
    translation: |-
      ### Descripción del grupo
      La descripción del grupo es lo primero que ven las personas cuando llegan a tu grupo de Loomio. Escríbela para que los nuevos miembros entiendan el propósito del grupo y el trabajo que haréis juntos. Añade cualquier otra información que les ayude a orientarse y participar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7e018e436df9afa1:
    english: 'For example, welcome people and let them know that this is there online space for communication and governance of your organization:'
    translation: 'Por ejemplo, da la bienvenida a las personas y explícales que este es el espacio en línea para la comunicación y el gobierno de tu organización:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  826a76aa71e6d689:
    english: |-
      - Remind members of the purpose of the board or committee.
      - Outline how you intend to use Loomio; prepare for meetings, progress discussions, make decisions and stay in context between meetings.
      - Be clear who has access to the group, can read and participate.
      - Attach or link any background or governance documents.
    translation: |-
      - Recuerda a los miembros el propósito de la junta directiva o del comité.
      - Explica cómo vais a usar Loomio para preparar reuniones, avanzar en las discusiones, tomar decisiones y mantener el contexto entre reuniones.
      - Aclara quién tiene acceso al grupo y puede leer y participar.
      - Adjunta o enlaza documentos de referencia o de gobierno.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  00c14924ec3f24cb:
    english: |-
      ### Check privacy and permission settings
      Loomio groups are **Secret** by default, which means only the people you specifically invite to the group know of its existence.
    translation: |-
      ### Comprueba la configuración de privacidad y permisos
      Los grupos de Loomio son **Secreto ** por defecto. Esto significa que solo las personas a las que invites expresamente al grupo sabrán que existe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9158ac7ea9b0db99:
    english: See [member permissions](/en/user_manual/groups/settings#permissions), and set to suit the proficiency of members in your group.  It may help to remove some permissions to avoid confusion as you are starting out. You can always restore permissions and everyone becomes more familiar with Loomio.
    translation: Consulta los [permisos de los miembros](/en/user_manual/groups/settings#permissions) y ajústalos a las habilidades de los miembros de tu grupo. Al empezar, puede ser útil quitar algunos permisos para evitar confusiones. Siempre puedes restablecerlos cuando todos conozcan mejor Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6a139f43ad2871f8:
    english: |-
      ### Category tags
      Add [category tags](/en/user_manual/discussions/tags/) to suit your organization.  Setting these in advance will help everyone use tags and find the threads and info they are looking for.
    translation: |-
      ### Etiquetas de categoría
      Añade [etiquetas de categoría](/en/user_manual/discussions/tags/) adecuadas para tu organización. Si las configuras de antemano, ayudarás a todos a usarlas y a encontrar los hilos y la información que buscan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7435f3589b1f26e3:
    english: |-
      ### Set up your personal profile
      Your [personal profile](/en/user_manual/users/user_profile) will help members of your group easily identify you, and have confidence that the messages they receive from you actually come from you.
    translation: |-
      ### Configura tu perfil personal
      Tu [perfil personal](/en/user_manual/users/user_profile) ayudará a los miembros de tu grupo a reconocerte y a saber que los mensajes que reciben de ti proceden realmente de ti.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cf3684fe138b05fe:
    english: |-
      ### Manage group membership
      Make sure all the members of your board or committee have been [invited](/en/user_manual/groups/inviting_people/) to the group, and accepted their invitation.
    translation: |-
      ### Gestiona los miembros del grupo
      Asegúrate de que todos los miembros de tu junta directiva o comité hayan sido [invitados](/en/user_manual/groups/inviting_people/) al grupo y hayan aceptado la invitación.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '029e18cb13c89e7b':
    english: "### Start with a board process"
    translation: "### Empieza con un proceso de la junta directiva"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ba8a6193de9c928f:
    english: The general introduction guide explains how to help everyone comment and vote once. For a board, follow that practice with one recurring governance process, such as preparing an agenda, approving minutes, reviewing a report, or making a small out-of-session decision.
    translation: La guía general de introducción explica cómo ayudar a todos a comentar y votar una vez. Después, prueba un proceso de gobierno recurrente de la junta directiva, como preparar un orden del día, aprobar un acta, revisar un informe o tomar una decisión sencilla entre reuniones.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f7c156fde7984f49:
    english: Agree whether decisions made in Loomio take effect when their outcome is published or must be ratified at the next meeting. Record the agreed quorum, vote threshold, eligible voters, and ratification process in the group description or governance documents.
    translation: Acordad si las decisiones tomadas en Loomio entran en vigor cuando se publica la conclusión o si deben ratificarse en la siguiente reunión. Anota el quórum, el porcentaje de votos necesario, quiénes pueden votar y el proceso de ratificación acordados en la descripción del grupo o en los documentos de gobierno.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
