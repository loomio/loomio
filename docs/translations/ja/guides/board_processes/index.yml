  eecfb12ed1d28d50:
    english: Good governance exists where an organization has systems and processes in place that are appropriate to its circumstances, and which enable the organization to pursue its purpose effectively and meet its obligations under the law.
    translation: 適切な組織運営には、組織の状況に合った仕組みと手続きが必要です。それによって、組織は目的に向けて効果的に活動し、法律上の義務を果たせます。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e54f67d22cf67a93:
    english: "*“It is participatory, consensus-oriented, accountable, transparent, responsive, effective and efficient, equitable and inclusive and follows the rule of law.”* [United Nations Economic and Social Commission for Asia and the Pacific](https://www.unescap.org/sites/default/d8files/knowledge-products/good-governance.pdf)."
    translation: "*「参加型で、合意形成を重視し、説明責任と透明性があり、状況に対応でき、効果的かつ効率的で、公平かつ包摂的であり、法の支配に従うものです。」* [国連アジア太平洋経済社会委員会](https://www.unescap.org/sites/default/d8files/knowledge-products/good-governance.pdf)。"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1661a79cfda1a9df:
    english: Underpinning all of these principles is the need for good communication.
    translation: こうした原則はすべて、十分なコミュニケーションに支えられています。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2819f114c9d74160:
    english: 'Here are some or the challenges directors and boards experience:'
    translation: 理事や理事会が直面する課題には、次のようなものがあります。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ed750814c61b85fb:
    english: "* Getting directors together in person\n* Time available to consider important issues \n* Tracking communication\n* Urgency of critical issues\n* Online video meeting fatigue\n* Directors in multiple, remote locations, sometimes with poor internet connectivity\n* Mixed governance practice and experience\n* Dealing with high volumes of transactional business \n* Maintaining institutional memory"
    translation: "* 理事が対面で集まるのが難しい\n* 重要な問題を検討する時間が限られている \n* やり取りを追跡しにくい\n* 重要な問題に急いで対応する必要がある\n* オンラインのビデオ会議で疲れやすい\n* 理事が離れた複数の場所にいて、インターネット接続が不安定な場合もある\n* 組織運営の方法や経験がさまざまである\n* 多くの日常的な業務に対応する必要がある \n* 組織の知識を引き継ぐ必要がある"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b910c5253cf77950:
    english: Loomio offers an opportunity to strengthen governance, to extend collaboration beyond board meetings, to include everyone in open, honest and respectful discussion while documenting everything.
    translation: Loomioを使うと、理事会の会議以外でも協力を続けられます。全員が率直に、互いを尊重して話し合い、その内容を記録することで、組織運営を強化できます。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
