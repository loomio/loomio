    translated_on: '2026-09-30'
  d78d13409c481c71:
    english: |-
      1. Open the group page.
      2. Open the notification settings for the group.
    translation: |-
      1. Avaa ryhmän sivu.
      2. Avaa ryhmän ilmoitusasetukset.
    status: machine
