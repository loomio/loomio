    translated_on: '2026-09-30'
  84faa7dad6f34739:
    english: Loomio does not currently add a webhook signature, shared-secret header, event ID, or delivery ID. Treat the full destination URL as a credential, do not expose it publicly, and include an unguessable token in the URL when the receiving service supports one. If a stable machine-readable event schema or signed delivery is required, use the webhook as a change notification and retrieve the current records through the authenticated User API.
    translation: Atualmente, o Loomio não adiciona assinatura ao webhook, cabeçalho com segredo compartilhado, ID de evento nem ID de envio. Trate a URL de destino completa como uma credencial, não a divulgue publicamente e inclua um token difícil de adivinhar na URL quando o serviço receptor permitir. Se você precisar de um esquema de eventos estável e legível por máquina ou de envios assinados, use o webhook como aviso de mudança e consulte os registros atuais pela API do usuário autenticada.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
