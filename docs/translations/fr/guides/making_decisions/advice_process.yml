  abd59b5e28c00123:
    english: Make a decision with the advice of people impacted or who have expertise, so you can make a better decision for your organization.
    translation: Prenez votre décision en tenant compte des conseils des personnes concernées et de celles qui possèdent une expertise pertinente. Vous pourrez ainsi prendre une meilleure décision pour votre organisation.
