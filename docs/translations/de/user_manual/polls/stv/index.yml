navigation_title: STV-Wahlen
blocks:
  85590745d00e23c1:
    english: "# STV Elections"
    translation: "# STV-Wahlen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  366f56443108e10f:
    english: "**Single Transferable Vote (STV)** is a proportional representation voting method for electing multiple winners from a field of candidates. It ensures that elected candidates proportionally represent the diversity of views among voters."
    translation: "**Single Transferable Vote (STV)** ist ein Verhältniswahlverfahren, bei dem mehrere Personen aus einer Gruppe von Kandidaten gewählt werden. Die gewählten Personen vertreten die unterschiedlichen Ansichten der Abstimmenden entsprechend ihrem Stimmenanteil."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  61dee55b45038f56:
    english: "## When to use STV"
    translation: "## Wann du STV verwenden kannst"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8311dca26cec6519:
    english: 'Use an STV Election when you need to:'
    translation: 'Verwende eine STV-Wahl, wenn du:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1d4338734ec6e113:
    english: |-
      - Elect a **committee, board, or slate of delegates** from a pool of nominees
      - Ensure **proportional representation**, where minority factions can win seats proportional to their support
      - Run elections where voters rank candidates by preference
    translation: |-
      - einen **Ausschuss, Vorstand oder eine Delegation** aus mehreren vorgeschlagenen Personen wählen möchtest
      - eine **verhältnismäßige Vertretung** erreichen möchtest, bei der auch kleinere Gruppen Sitze entsprechend ihrer Unterstützung gewinnen können
      - eine Wahl durchführen möchtest, bei der die Abstimmenden Kandidaten nach ihrer Präferenz ordnen
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e6e1ae026f65a715:
    english: |-
      >[!NOTE]
      >STV is **not** the same as Loomio's [Rank poll](/en/user_manual/polls/rank/), which is a simpler score-based ranking for choosing a single best option. STV handles multi-winner elections with vote transfers and elimination rounds.
    translation: |-
      >[!NOTE]
      >STV ist **nicht** dasselbe wie Loomios [Rangfolge-Umfrage](/en/user_manual/polls/rank/). Bei dieser einfacheren Umfrage werden Optionen mit Punkten bewertet, um eine beste Option zu bestimmen. Bei STV werden mehrere Personen durch die Übertragung von Stimmen und das Ausscheiden von Kandidaten gewählt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  62af8f95f18dbafe:
    english: "## Creating an STV Election"
    translation: "## Eine STV-Wahl erstellen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  edf2f36e75c81665:
    english: When starting a poll, select **STV Election** as the poll type, then add the candidates as the poll options. You can customize the poll by setting the **number of seats**, the **counting method**, and the **quota type**.
    translation: Wähle beim Erstellen einer Umfrage **STV-Wahl** als Umfragetyp und füge die Kandidaten als Umfrageoptionen hinzu. Du kannst die **Anzahl der zu besetzenden Plätze**, die **Zählmethode** und den **Quotentyp** festlegen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b40ddcfb8cdc44fd:
    english: In this example, Oatmilk Cooperative is electing three people to oversee its returnable packaging trial. The form explains the role, lists five candidates, and uses Scottish STV with the Droop quota.
    translation: In diesem Beispiel wählt die Oatmilk Cooperative drei Personen, die ihren Versuch mit Mehrwegverpackungen begleiten. Das Formular beschreibt die Aufgabe, nennt fünf Kandidaten und verwendet Scottish STV mit der Droop-Quote.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a34592929349d06:
    english: "### Number of seats"
    translation: "### Anzahl der zu besetzenden Plätze"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c09f5f51333612dc:
    english: How many winners should be elected. Must be less than the number of candidates.
    translation: Die Anzahl der Personen, die gewählt werden sollen. Sie muss kleiner sein als die Anzahl der Kandidaten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ddceec01d910b152:
    english: "### Counting method"
    translation: "### Zählmethode"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  39e9e81a89272771:
    english: 'There are two available methods for counting the votes:'
    translation: 'Für die Auszählung stehen zwei Methoden zur Verfügung:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a7031d1180e95273:
    english: |-
      Scottish STV
        : Recommended. The Weighted Inclusive Gregory Method (WIGM) used in Scottish local elections since 2007. Well-defined, straightforward rules. Best for most organizations.
    translation: |-
      Scottish STV
        : Empfohlen. Diese Methode verwendet das Weighted Inclusive Gregory Method (WIGM), das seit 2007 bei schottischen Kommunalwahlen eingesetzt wird. Die Regeln sind klar definiert und einfach anzuwenden. Sie eignet sich für die meisten Organisationen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1507e4fde88848dd:
    english: |-
      Meek STV
        : A more mathematically precise iterative method. When a candidate is eliminated, votes are recounted as if that candidate was never in the race.
    translation: |-
      Meek STV
        : Eine mathematisch genauere Methode mit wiederholter Berechnung. Wenn ein Kandidat ausscheidet, werden die Stimmen neu ausgezählt, als hätte diese Person nie kandidiert.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b9abcd12eef5f629:
    english: "### Quota type"
    translation: "### Quotentyp"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6dc3aea49266d40d:
    english: 'The quota is the minimum number of votes a candidate needs to win a seat. It can be either:'
    translation: 'Die Quote ist die Mindestzahl an Stimmen, die ein Kandidat für einen Sitz braucht. Es gibt zwei Arten:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  88f62f286d8c550f:
    english: |-
      Droop
        : Recommended. The standard quota type for most STV elections, and used by Ireland, Australia, and Scotland. Droop guarantees a majority coalition wins a majority of seats. It is calculated as:
      \\[ floor(\frac{votes}{(seats + 1)}) + 1 \\]
    translation: |-
      Droop
        : Empfohlen. Die Droop-Quote ist bei den meisten STV-Wahlen üblich und wird in Irland, Australien und Schottland verwendet. Sie stellt sicher, dass eine Koalition mit der Mehrheit der Stimmen auch die Mehrheit der Sitze erhält. Sie wird so berechnet:
      \\[ floor(\frac{votes}{(seats + 1)}) + 1 \\]
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  817b3994e92898e8:
    english: |-
      Hare
        : A higher minimum threshold, and more proportional for smaller factions.
          Hare is preferred by DSA chapters to protect minority representation.
         It is calculated as:
          \\[ \frac{votes}{seats}\\]
    translation: |-
      Hare
        : Eine höhere Mindestzahl an Stimmen, die kleinere Gruppen stärker berücksichtigt.
          DSA-Ortsgruppen bevorzugen Hare, um die Vertretung von Minderheiten zu schützen.
         Sie wird so berechnet:
          \\[ \frac{votes}{seats}\\]
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f12065bdf5d3678e:
    english: |2-
        >[!TIP]
        > Droop will always compute to a smaller number of votes than Hare. For example, in an election with 100 votes and four seats, the Droop quota would be 21 and the Hare quota 25.
    translation: |-
      >[!TIP]
        > Die Droop-Quote ist immer niedriger als die Hare-Quote. Bei einer Wahl mit 100 Stimmen und vier Sitzen beträgt die Droop-Quote zum Beispiel 21 und die Hare-Quote 25.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  984516abc3cfd89b:
    english: "## How voting works"
    translation: "## So funktioniert die Stimmabgabe"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  40e98247d87cdf27:
    english: 'In this example, Oatmilk Cooperative is electing three people to oversee the reusable packaging trial. Voters drag candidates above the line and rank them in order of preference:'
    translation: 'In diesem Beispiel wählt die Oatmilk Cooperative drei Personen, die ihren Versuch mit Mehrwegverpackungen begleiten. Die Abstimmenden ziehen Kandidaten über die Linie und ordnen sie nach ihrer Präferenz:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f8aaa5391f05117f:
    english: |-
      - **Rank 1** = most preferred candidate
      - **Rank 2** = second choice
      - Continue ranking as many candidates as desired
    translation: |-
      - **Rang 1** = bevorzugter Kandidat
      - **Rang 2** = zweite Wahl
      - Ordne so viele weitere Kandidaten, wie du möchtest
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  70bd790faf93c916:
    english: Voters are not required to rank every candidate. Unranked candidates will not receive any of that voter's support.
    translation: Die Abstimmenden müssen nicht alle Kandidaten in eine Rangfolge bringen. Kandidaten ohne Rang erhalten keine Unterstützung von dieser Person.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d82e369c7c293a0c:
    english: |-
      ## How counting works
      The count is performed as follows:
    translation: |-
      ## So funktioniert die Auszählung
      Die Stimmen werden wie folgt ausgezählt:
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0ea01b5d531abc06:
    english: |-
      1. A **quota** is calculated (minimum votes needed to win a seat).
      2. **First preferences** are counted for each candidate.
      3. If a candidate meets the quota, they are **elected**. Their surplus votes (above the quota) are **transferred** to voters' next preferences at a fractional value.
      4. If no candidate meets the quota, the candidate with the **fewest votes is eliminated**. Their votes transfer to voters' next preferences at full value.
      5. This process repeats until all seats are filled.
    translation: |-
      1. Die **Quote** wird berechnet (die Mindestzahl an Stimmen für einen Sitz).
      2. Für jeden Kandidaten werden die **Erste Präferenzen** gezählt.
      3. Erreicht ein Kandidat die Quote, ist er **gewählt**. Seine überschüssigen Stimmen (über der Quote) werden anteilig auf die nächsten Präferenzen der Wähler **übertragen**.
      4. Erreicht kein Kandidat die Quote, **scheidet der Kandidat mit den wenigsten Stimmen aus**. Seine Stimmen werden mit vollem Wert auf die nächsten Präferenzen der Wähler übertragen.
      5. Das wiederholt sich, bis alle Sitze besetzt sind.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c6f397233ad479e5:
    english: |-
      >[!TIP]
      >If a voter has ranked no remaining candidates, their ballot is "exhausted" and that vote is lost. This is why ranking more candidates is generally better.
    translation: |-
      >[!TIP]
      >Wenn eine abstimmende Person keinen der verbleibenden Kandidaten eingeordnet hat, ist ihr Stimmzettel „erschöpft“ und die Stimme kann nicht weiter übertragen werden. Deshalb ist es meist sinnvoll, mehr Kandidaten einzuordnen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  acba228efb586cca:
    english: "## Understanding results"
    translation: "## Ergebnisse verstehen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3b584c17ac358371:
    english: 'After the poll closes, results are displayed in several sections. In this election, Samira Patel, Alex Morgan, and Morgan Price fill the three committee seats:'
    translation: 'Nach dem Schließen der Umfrage werden die Ergebnisse in mehreren Abschnitten angezeigt. Bei dieser Wahl erhalten Samira Patel, Alex Morgan und Morgan Price die drei Ausschusssitze:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9c3f3c8a80729fbf:
    english: "### Method and quota"
    translation: "### Methode und Quote"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  feee79b9f6e92de3:
    english: At the top, you'll see the counting method (Scottish STV or Meek STV) and quota type (Droop or Hare) along with the quota — the number of votes a candidate needed to win a seat.
    translation: Oben siehst du die Zählmethode (Scottish STV oder Meek STV), den Quotentyp (Droop oder Hare) und die Quote – also die Zahl der Stimmen, die ein Kandidat für einen Sitz brauchte.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e180eb800c3435cd:
    english: "### Elected candidates"
    translation: "### Gewählte Kandidaten"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8db8b2466db56f2b:
    english: 'A summary table of the winners with five columns:'
    translation: 'Eine Übersichtstabelle der gewählten Personen mit fünf Spalten:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f998ffc721953501:
    english: |-
      | Column | Meaning |
      |--------|---------|
      | **Candidate** | The name of the elected candidate |
      | **Round elected** | Which counting round they reached the quota and won a seat. Round 1 means they won on first preferences alone; higher rounds mean they needed transferred votes from eliminated or surplus candidates. |
      | **First preferences** | How many voters ranked this candidate as their first choice. This shows a candidate's direct support before any vote transfers. |
      | **Final tally** | The candidate's vote tally at the moment they were elected. Due to vote transfers, this is often higher than their first preferences. |
      | **Surplus** | How much the candidate's final tally exceeded the quota (final tally minus quota). A larger surplus means stronger support beyond what was needed to win. In Scottish STV, this surplus is redistributed to voters' next preferences. |
    translation: |-
      | Spalte | Bedeutung |
      |--------|---------|
      | **Kandidat** | Der Name des gewählten Kandidaten |
      | **Runde gewählt** | Die Auszählungsrunde, in der der Kandidat die Quote erreicht und einen Sitz gewonnen hat. Runde 1 bedeutet, dass die Ersten Präferenzen allein ausgereicht haben. In späteren Runden waren übertragene Stimmen von ausgeschiedenen oder bereits gewählten Kandidaten nötig. |
      | **Erste Präferenzen** | Wie viele Abstimmende diesen Kandidaten auf Rang 1 gesetzt haben. Das zeigt seine direkte Unterstützung vor der Übertragung von Stimmen. |
      | **Endergebnis** | Der Stimmenstand des Kandidaten zum Zeitpunkt seiner Wahl. Durch übertragene Stimmen liegt er oft über der Zahl seiner Ersten Präferenzen. |
      | **Überschuss** | Der Betrag, um den der Stimmenstand des Kandidaten die Quote überschritten hat (Stimmenstand minus Quote). Ein größerer Überschuss zeigt mehr Unterstützung, als für die Wahl nötig war. Bei Scottish STV wird dieser Überschuss auf die nächsten Präferenzen der Abstimmenden verteilt. |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  efc41c326d955758:
    english: If the count results in a tie — where eliminating any of the remaining candidates would change the outcome — those candidates are shown in a separate table rather than arbitrarily choosing a winner.
    translation: Führt die Auszählung zu einem Gleichstand, bei dem das Ausscheiden eines der verbleibenden Kandidaten das Ergebnis verändern würde, werden diese Kandidaten in einer eigenen Tabelle angezeigt. Es wird kein Gewinner willkürlich bestimmt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8a6ae4ad28f0acf6:
    english: "### Round-by-round details"
    translation: "### Details zu jeder Runde"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3d907145fd075144:
    english: 'Expand **Round-by-round details** to see vote transfers and eliminations. Each row is a candidate and each column is a counting round:'
    translation: 'Klappe **Details zu jeder Runde** auf, um die Übertragung von Stimmen und das Ausscheiden von Kandidaten zu sehen. Jede Zeile steht für einen Kandidaten und jede Spalte für eine Auszählungsrunde:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cc37217cd681fabe:
    english: The green highlight shows when a candidate was elected, red shows when they were eliminated, and orange shows when they tied.
    translation: Grün zeigt, wann ein Kandidat gewählt wurde, Rot zeigt sein Ausscheiden und Orange einen Gleichstand.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ed4aaa0a898906fd:
    english: "## Exporting ballots"
    translation: "## Stimmzettel exportieren"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c96d54ebfbedae32:
    english: After the election closes, people who can view the results can export the ballots in BLT format for an independent recount or audit. The export contains candidate rankings and combines identical rankings into a single row with a ballot count. For anonymous elections it does not contain voter identities, ballot identifiers, submission times, or submission order.
    translation: Nach dem Schließen der Wahl können Personen, die die Ergebnisse sehen dürfen, die Stimmzettel im BLT-Format für eine unabhängige Nachzählung oder Prüfung exportieren. Der Export enthält die Rangfolgen der Kandidaten. Identische Rangfolgen werden in einer Zeile mit der Anzahl der entsprechenden Stimmzettel zusammengefasst. Bei anonymen Wahlen enthält der Export keine Angaben zur Identität der Abstimmenden, keine Stimmzettelkennungen, keine Abgabezeiten und keine Reihenfolge der Abgabe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
