---
navigation_title: Удаление группы
blocks:
  6e0bf431fbefa0d3:
    english: "# Deleting your group"
    translation: "# Удаление группы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f8e8d1ee802cae90:
    english: 'Deleting your Loomio group initiates a process to permanently delete all group data. '
    translation: Удаление группы в Loomio запускает процесс безвозвратного удаления всех данных группы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  214aa96eca0b90ca:
    english: If there is any data you wish to retain, make sure you [export group data](/en/user_manual/groups/data_export/) and manually download any important files you have uploaded before you continue.
    translation: Если вы хотите сохранить какие-либо данные, сначала [экспортируйте данные группы](/en/user_manual/groups/data_export/) и вручную скачайте важные файлы, которые вы загрузили.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  181fecc458dcc49d:
    english: Open the group drop down menu by clicking on the three dots, and select the **Delete group** option to remove access to the group and to initiate deletion of all group data from our records. You must be an admin to delete a group.
    translation: Нажмите на три точки, чтобы открыть меню группы, и выберите **Удалить группу**. Это закроет доступ к группе и запустит удаление всех её данных из наших записей. Удалить группу может только администратор.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f5178957964c2bc0:
    english: When you delete a group, it is removed from view immediately and will be permanently deleted after 90 days. You and group members immediately lose access to the group. If a mistake was made, contact us within 90 days of deleting your group to request restoration.
    translation: После удаления группа сразу исчезнет из списка, а через 90 дней её данные будут удалены безвозвратно. Вы и участники группы сразу потеряете к ней доступ. Если вы удалили группу по ошибке, свяжитесь с нами в течение 90 дней, чтобы запросить восстановление.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c15f72841d15dc52:
    english: Groups awaiting deletion and their subgroups are unavailable to members and coordinators for viewing, participation, or export, including polls opened from saved links. Members cannot create or edit content, vote, send announcements or reminders, or accept invitations. Export the group and download important files before confirming deletion. Direct discussions and polls are unaffected.
    translation: Группы, ожидающие удаления, и их подгруппы недоступны участникам и координаторам для просмотра, участия и экспорта. Это касается и опросов, открытых по сохранённым ссылкам. Участники не могут создавать или редактировать материалы, голосовать, отправлять объявления и напоминания или принимать приглашения. Перед подтверждением удаления экспортируйте данные группы и скачайте важные файлы. Прямые обсуждения и опросы не затрагиваются.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5122280818cc30c7:
    english: Scheduling the group for deletion stops pending activity notifications and poll reminders for the group and its subgroups. Messages already being sent may still arrive.
    translation: После постановки группы в очередь на удаление прекращается отправка запланированных уведомлений об активности и напоминаний об опросах в этой группе и её подгруппах. Сообщения, отправка которых уже началась, ещё могут прийти.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  953ebf00860389c1:
    english: The warning email includes counts for the group's subgroups, members, discussions, polls and comments. If you need to keep the group or [export its data](/en/user_manual/groups/data_export/), reply within 90 days so access can be restored before deletion.
    translation: В письме с предупреждением указано количество подгрупп, участников, обсуждений, опросов и комментариев. Если вы хотите сохранить группу или [экспортировать её данные](/en/user_manual/groups/data_export/), ответьте на письмо в течение 90 дней, чтобы доступ успели восстановить до удаления.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  17dc58c271e429d5:
    english: Deleting your group will also cancel your Loomio subscription.
    translation: При удалении группы ваша подписка на Loomio также будет отменена.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fa7cec0f3ba570ef:
    english: "![Delete group action in the Oatmilk Cooperative menu](group_delete_group.png)"
    translation: "![Пункт «Удалить группу» в меню Oatmilk Cooperative](group_delete_group.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cb0d8b2f2c8b9630:
    english: You will be invited to type the name of your group (*case sensitive*) to confirm you wish to delete your group.
    translation: Для подтверждения удаления вам предложат ввести название группы (*с учётом регистра*).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5430eb3885d98872:
    english: "![Confirmation form requiring the Oatmilk Cooperative handle](group_delete_group_confirm.png)"
    translation: "![Форма подтверждения, в которой нужно ввести идентификатор Oatmilk Cooperative](group_delete_group_confirm.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2df60ea964109f11:
    english: "## Group data is permanently deleted after 90 days"
    translation: "## Данные группы безвозвратно удаляются через 90 дней"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e09923078301b8d:
    english: After 90 days, all the threads, polls, files and other group content will be permanently deleted. ***This is non-reversible!***
    translation: Через 90 дней все обсуждения, опросы, файлы и другие материалы группы будут удалены безвозвратно. ***Восстановить их будет невозможно.***
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8695a5ebfb09611d:
    english: We recommend that you [export the group data](/en/user_manual/groups/data_export/)and manually download any important files you have uploaded before you continue.
    translation: Перед продолжением рекомендуем [экспортировать данные группы](/en/user_manual/groups/data_export/) и вручную скачать важные файлы, которые вы загрузили.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
