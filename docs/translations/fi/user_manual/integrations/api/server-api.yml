  4a423dbb4fd59b45:
    english: Redaction keeps the user's comments and other user-generated content within their groups, but removes known personally identifying information such as name, bio, profile photo, email address, login credentials, identities, and active sessions.
    translation: Henkilötietojen poisto säilyttää käyttäjän kommentit ja muun hänen luomansa sisällön ryhmissä. Se poistaa tunnetut henkilöön yhdistettävät tiedot, kuten nimen, esittelytekstin, profiilikuvan, sähköpostiosoitteen, kirjautumistiedot, identiteetit ja aktiiviset istunnot.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9b472af7dbef98ac:
    english: This is the recommended way to remove a user from Loomio.
    translation: Tämä on suositeltu tapa poistaa käyttäjä Loomiosta.
