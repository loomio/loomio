  dca082a687dc5505:
    english: 'Loomio sends an asynchronous HTTP `POST` to the configured URL with this header:'
    translation: 'Loomio verstuurt asynchroon een HTTP-`POST` naar de ingestelde URL met deze header:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a4f66c4c94afa135:
    english: The request timeout is five seconds. A `2xx` response, including `204 No Content`, is treated as successful. Webhook consumers should respond promptly, process longer work asynchronously, and tolerate duplicate or out-of-order deliveries.
    translation: De time-out voor het verzoek is vijf seconden. Een `2xx`-antwoord, waaronder `204 No Content`, geldt als geslaagd. Ontvangers van webhooks moeten snel antwoorden, langer durend werk asynchroon verwerken en kunnen omgaan met dubbele of in een andere volgorde afgeleverde berichten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  84faa7dad6f34739:
    english: Loomio does not currently add a webhook signature, shared-secret header, event ID, or delivery ID. Treat the full destination URL as a credential, do not expose it publicly, and include an unguessable token in the URL when the receiving service supports one. If a stable machine-readable event schema or signed delivery is required, use the webhook as a change notification and retrieve the current records through the authenticated User API.
    translation: Loomio voegt momenteel geen webhookhandtekening, header met een gedeeld geheim, gebeurtenis-ID of afleverings-ID toe. Behandel de volledige doel-URL als een toegangsmiddel en maak deze niet openbaar. Neem een niet te raden token op in de URL als de ontvangende dienst dat ondersteunt. Als je een stabiel, machineleesbaar gebeurtenisformaat of ondertekende aflevering nodig hebt, gebruik de webhook dan als melding van een wijziging en haal de actuele gegevens op via de geauthenticeerde gebruikers-API.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f3d956b4694f793c:
