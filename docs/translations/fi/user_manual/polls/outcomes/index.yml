  457a047ee6ae5975:
    english: |-
      | **Decision process** | **When the decision is made** | **Outcome** |
      |---|---|---|
      | Advice process | When advice has been received and taken into account. | State the decision made and thank people for their advice and feedback. |
      | Consent process | When there are no remaining objections. | State that no valid objections remain and there is consent that the proposal is 'safe to try'.  |
      | Consensus process | When most* people agree. | State proposal results and the decision made. |
    translation: |-
      | **Päätöksentekotapa** | **Milloin päätös tehdään** | **Johtopäätös** |
      |---|---|---|
      | Neuvoihin perustuva päätöksenteko | Kun neuvot on saatu ja otettu huomioon. | Kerro tehty päätös ja kiitä ihmisiä neuvoista ja palautteesta. |
      | Suostumukseen perustuva päätöksenteko | Kun vastalauseita ei enää ole. | Kerro, ettei perusteltuja vastalauseita ole jäljellä ja että ehdotuksen kokeilemiseen suostutaan.  |
      | Konsensukseen perustuva päätöksenteko | Kun useimmat* ovat samaa mieltä. | Kerro ehdotuksen tulokset ja tehty päätös. |
    status: machine
    provider: codex/gpt-6-sol
