    english: Build consensus for a decision you need to make together, to reach an agreement that satisfies the needs and concerns of all participants.
    translation: Findet für eine gemeinsame Entscheidung einen Konsens, der die Bedürfnisse und Bedenken aller Beteiligten berücksichtigt.
    status: machine
