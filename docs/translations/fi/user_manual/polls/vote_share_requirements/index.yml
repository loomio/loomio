  4318dab03fe217ad:
    english: Oatmilk Cooperative is deciding whether to approve the budget for its six-week returnable bottle trial. Five people are eligible to vote.
    translation: Oatmilk-osuuskunta päättää, hyväksyykö se kuuden viikon palautuspullokokeilun budjetin. Viidellä henkilöllä on äänioikeus.
