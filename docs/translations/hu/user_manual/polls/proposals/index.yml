  ca5b9583bfe78b65:
    english: A proposal asks people to respond to a statement or course of action. Participants choose a defined response and can explain their vote. Use a proposal to gather feedback, seek advice, identify objections, or test for agreement.
    translation: A javaslat egy állításról vagy tervezett lépésről kér véleményt. A résztvevők a megadott válaszlehetőségek közül választanak, és megindokolhatják a szavazatukat. Javaslattal visszajelzést és tanácsot kérhetsz, feltárhatod a kifogásokat, vagy felmérheted az egyetértést.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  143dc77c58a4c881:
    english: This section helps you choose and run Loomio's default proposal templates. For a complete sequence of discussion, proposals, amendments, and outcome, use the [decision-making guides](/en/guides/making_decisions/). To change the templates available to your group, see [Poll templates](../poll_templates/).
    translation: Ez a rész segít kiválasztani és használni a Loomio alapértelmezett javaslatsablonjait. Ha a beszélgetéstől a javaslatokon és módosításokon át a következtetésig tartó teljes folyamatot szeretnéd áttekinteni, olvasd el a [döntéshozatali útmutatókat](/en/guides/making_decisions/). A csoportod számára elérhető sablonok módosításáról a [Szavazási sablonok](../poll_templates/) oldalon olvashatsz.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e0f8614f95c9c5ff:
    english: "## Choose a proposal template"
    translation: "## Válassz javaslatsablont"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  525699503edbe342:
    english: |-
      | Template | What it asks | Use it when… |
      |---|---|---|
      | [Sense check](sense_check/) | Is this on the right track? | An idea is still being developed |
      | [Advice](advice/) | What advice should the decision maker consider? | A person or team owns the decision |
      | [Consent](consent/) | Is this safe to try, or is there a meaningful objection? | The group uses consent decision-making |
      | [Consensus](consensus/) | What is your position on this proposal? | The group is seeking collective agreement |
    translation: |-
      | Sablon | Milyen kérdést tesz fel? | Mikor használd? |
      |---|---|---|
      | [Érzékellenőrzés](sense_check/) | Jó irányba haladunk? | Amikor az ötlet még alakul |
      | [Tanács](advice/) | Milyen tanácsokat érdemes figyelembe vennie a döntéshozónak? | Amikor egy személy vagy csapat felel a döntésért |
      | [Beleegyezés](consent/) | Biztonságos kipróbálni, vagy van érdemi kifogás? | Amikor a csoport beleegyezésen alapuló döntéshozatalt használ |
      | [Konszenzus](consensus/) | Mi az álláspontod erről a javaslatról? | Amikor a csoport közös egyetértésre törekszik |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0cb03ac4a22f02b4:
    english: Choose the template whose response options match the question you need answered. Each template page explains its use cases, setup, voting form, and results.
    translation: Válaszd azt a sablont, amelynek válaszlehetőségei illenek a kérdésedhez. Minden sablon oldala bemutatja, mikor érdemes használni, hogyan állíthatod be, milyen a szavazási űrlapja, és hogyan jelennek meg az eredmények.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d379b02c308b3b55:
    english: "## Other proposal templates"
    translation: "## További javaslatsablonok"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  44cdb16aebf757ca:
    english: Loomio also provides templates such as Proposal, Gradients of agreement, Question round, and Majority. Some are hidden initially. Group administrators can make them available or create a template for the group's own terminology and rules from [Poll templates](../poll_templates/).
    translation: A Loomióban más sablonok is vannak, például Javaslat, Az egyetértés gradiensei, Kérdés kör és Többség. Egyes sablonok kezdetben rejtve vannak. A csoport adminisztrátorai elérhetővé tehetik őket, vagy a csoport saját kifejezéseihez és szabályaihoz illő sablont hozhatnak létre a [Szavazási sablonok](../poll_templates/) oldalon.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ca179ba4cb53c5e3:
    english: "## Proposal records"
    translation: "## A javaslat dokumentációja"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  460a90e796fc4dc0:
    english: Votes and reasons update while the proposal is open, and participants can change their response. After it closes, publish an [outcome](../outcomes/) that states the decision or next step. The discussion, proposal, votes, reasons, and outcome form a record of how the group reached its decision.
    translation: Amíg a javaslat nyitva van, a szavazatok és az indoklások frissülnek, a résztvevők pedig módosíthatják a válaszukat. A lezárás után tegyél közzé egy [következtetést](../outcomes/), amely rögzíti a döntést vagy a következő lépést. A beszélgetés, a javaslat, a szavazatok, az indoklások és a következtetés együtt dokumentálják, hogyan jutott döntésre a csoport.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
