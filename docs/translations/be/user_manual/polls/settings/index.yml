---
navigation_title: Налады
blocks:
  145c23b2412eff98:
    english: "# Proposal and poll settings"
    translation: "# Налады прапаноў і апытанняў"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9e0347d976f79179:
    english: "## Setting up a proposal or poll"
    translation: "## Як наладзіць прапанову або апытанне"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e5d6f17041c19d41:
    english: "### Proposal and poll templates"
    translation: "### Шаблоны прапаноў і апытанняў"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8913cabb2f1f8227:
    english: 'Choose the proposal template you want to use. '
    translation: Выберыце шаблон прапановы, які хочаце выкарыстаць.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3620f6321777ca50:
    english: "### Add content"
    translation: "### Дадайце змест"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bc7ebb222e9ff4d1:
    english: "**Group:** Check that the correct group is selected for your proposal or poll."
    translation: "**Група:** Праверце, ці выбрана патрэбная група для вашай прапановы або апытання."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3a1d375da02f3a49:
    english: "**Title:** Give your proposal or poll a short, relevant title."
    translation: "**Назва:** Дайце прапанове або апытанню кароткую назву, якая адлюстроўвае іх змест."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a62a7e63f9db295c:
    english: "**Details:** Explain what you are asking of people and include enough details so everyone knows what it means to vote.  "
    translation: "**Падрабязнасці:** Растлумачце, што вы прапануеце людзям вырашыць, і дайце дастаткова звестак, каб усе разумелі, за што галасуюць."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e17c2ab4878716f2:
    english: The predefined templates include some prompts to help you write a good proposal - use these or add your own details.
    translation: Гатовыя шаблоны змяшчаюць падказкі, якія дапамогуць напісаць прапанову. Скарыстайцеся імі або дадайце свае падрабязнасці.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  74daa7f0cc476971:
    english: Avoid combining a range of ideas in one proposal, because people might agree to some aspects but not others and be unsure how to respond. You can break complex decisions down into multiple proposals.
    translation: 'Не аб’ядноўвайце розныя ідэі ў адной прапанове: людзі могуць пагаджацца з аднымі часткамі і не пагаджацца з іншымі, таму ім будзе цяжка выбраць адказ. Складаныя рашэнні можна падзяліць на некалькі прапаноў.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0da6e449688940bb:
    english: When making a proposal, state your expectations and describe the impact the proposal will have if adopted. If it's a formal or binding proposal it's often worth describing what it means if the proposal is not adopted.
    translation: Калі ствараеце прапанову, пазначце, чаго вы чакаеце, і апішыце, што зменіцца, калі яе прымуць. Калі прапанова афіцыйная або абавязковая да выканання, варта таксама растлумачыць, што будзе, калі яе не прымуць.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a6db66b75f495e21:
    english: Use the formatting tools to support your poll.  For example, attach a document file with the paperclip icon, insert an image, link to a website or online document, or even embed a video.
    translation: Выкарыстоўвайце сродкі фарматавання, каб дапоўніць апытанне. Напрыклад, прымацуйце дакумент значком сашчэпкі, устаўце выяву, дадайце спасылку на сайт ці анлайн-дакумент або ўбудуйце відэа.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f4f85f131878c36d:
    english: "### Voting options"
    translation: "### Варыянты галасавання"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  616aab74af2072ba:
    english: Each proposal and poll template provides options for voting.
    translation: Кожны шаблон прапановы або апытання змяшчае варыянты галасавання.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7a85de7eefe74178:
    english: Depending on the template, you can edit, remove, reorder, or add voting options to suit the decision process you are running.
    translation: У залежнасці ад шаблону вы можаце рэдагаваць, выдаляць, перастаўляць або дадаваць варыянты галасавання адпаведна да вашага працэсу прыняцця рашэнняў.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9bc44bf4b28ac5d8:
    english: "- Use the pencil icon to edit voting option \n- Use the trash can icon to remove unwanted voting options\n- Use the handle to move the order of voting options\n- Add voting options with **Add option** when the template allows custom options"
    translation: |-
      - Каб змяніць варыянт галасавання, націсніце значок алоўка
      - Каб выдаліць непатрэбны варыянт галасавання, націсніце значок сметніцы
      - Каб змяніць парадак варыянтаў галасавання, перацягніце іх за маркер
      - Калі шаблон дазваляе ўласныя варыянты, дадайце іх кнопкай **Дадаць опцыю**
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2062f39334fbd629:
    english: |-
      ### Edit voting options
      There is a lot of flexibility to configure voting options to suit the way your organization makes decisions.
    translation: |-
      ### Рэдагаваць варыянты галасавання
      Варыянты галасавання можна наладзіць у адпаведнасці з тым, як ваша арганізацыя прымае рашэнні.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5ac5b47c81fe187b:
    english: 'Use the pencil icon alongside the voting option to open the edit modal:'
    translation: 'Націсніце значок алоўка побач з варыянтам галасавання, каб адкрыць акно рэдагавання:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3c791f8140ad3b39:
    english: "**Option name:** A short name for the option."
    translation: "**Назва варыянту:** Кароткая назва варыянту."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  77a0fb7409cf1711:
    english: "**Icon:** Select an icon for the option, such as thumbs up, thumbs down, abstain, or block."
    translation: "**Значок:** Выберыце значок для варыянту, напрыклад падняты або апушчаны вялікі палец, устрыманне ці блакіроўку."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9126ee91e5d1cb95:
    english: "**Meaning:** A sentence that explains what choosing this options means."
    translation: "**Значэнне:** Сказ, які тлумачыць, што азначае выбар гэтага варыянту."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e88d83b93ba47666:
    english: "**Reason prompt:** A question to prompt voters to provide their reasoning or reconsider their position. "
    translation: "**Падказка для абгрунтавання:** Пытанне, якое прапануе людзям патлумачыць свой выбар або перагледзець пазіцыю."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d05197892ea46087:
    english: "### Opening time"
    translation: "### Час адкрыцця галасавання"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1b56f0ad52a3aed8:
    english: By default, voting opens immediately when you create the poll. If you want to schedule voting to open at a later time, uncheck **Voting opens immediately** and select an opening date and time.
    translation: Па змаўчанні галасаванне адкрываецца адразу пасля стварэння апытання. Каб адкрыць яго пазней, зніміце пазнаку **Галасаванне адкрываецца адразу** і выберыце дату і час адкрыцця.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  48ccc43734b062eb:
    english: This is useful to give time for discussion before voting opens, or to ensure a poll or proposal is correctly set up and scheduled to happen at the right time.
    translation: Гэта дае час на абмеркаванне перад галасаваннем і дапамагае праверыць налады прапановы або апытання да запланаванага пачатку.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b68fccc3132988ff:
    english: When a poll has a scheduled opening time, you can add voters before voting opens. Voters will be notified when voting opens, rather than when they are added.
    translation: Калі час адкрыцця галасавання запланаваны, можна дадаць людзей загадзя. Яны атрымаюць апавяшчэнне, калі галасаванне адкрыецца, а не ў момант дадання.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  82d4cacfa780dd98:
    english: "**Notify voters when poll opens:** When checked (default), all voters will receive a notification when voting opens. Uncheck this if you want to open voting without sending notifications."
    translation: "**Апавясціць удзельнікаў галасавання пры адкрыцці апытання:** Калі гэты параметр уключаны (па змаўчанні), усе ўдзельнікі галасавання атрымаюць апавяшчэнне, калі галасаванне адкрыецца. Зніміце пазнаку, калі хочаце адкрыць галасаванне без апавяшчэнняў."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d084620657803f93:
    english: "**Closing date and time:** Select the closing date and time for your poll."
    translation: "**Дата і час закрыцця:** Выберыце дату і час закрыцця апытання."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c0472419a2671222:
    english: Give sufficient time for people to vote. You could time the proposal so it closes before a meeting, or avoid closing over a weekend, so that people will receive a timely reminder. If necessary, you can close the poll early or extend the closing time.
    translation: Дайце людзям дастаткова часу, каб прагаласаваць. Можна закрыць прапанову перад сустрэчай або выбраць час закрыцця па-за выхаднымі, каб людзі своечасова атрымалі напамін. Пры патрэбе апытанне можна закрыць раней або падоўжыць тэрмін галасавання.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c87f87e6cbc1a4d7:
    english: "**Who can vote?** Invite everyone in the group or only specific people that you invite."
    translation: "**Хто можа галасаваць?** Запрасіце ўсю групу або толькі выбраных людзей."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e02a9cefc3082334:
    english: |-
      You can later add people to an 'Invite people only' poll. For identified polls,
      you can also remove people who should no longer be eligible to vote. People
      cannot be removed from an anonymous poll.
    translation: |-
      Пазней вы можаце дадаць людзей у апытанне з удзелам толькі па запрашэнні. У неананімным апытанні
      можна таксама выдаліць людзей, якія больш не павінны мець права голасу. З ананімнага апытання
      выдаляць людзей нельга.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2e959157d75ed7bd:
    english: "## More settings"
    translation: "## Дадатковыя налады"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3d4443d3e6d3b13d:
    english: |-
      ### Reminder
      Send a 'Closing soon' notification 24 hours before the poll closes. This can be an opportunity for people to see how others have voted and reconsider their own vote, or just a way to increase participation in the poll.
    translation: |-
      ### Напамін
      Адпраўце апавяшчэнне «Хутка закрыццё» за 24 гадзіны да закрыцця апытання. Гэта дае людзям магчымасць паглядзець, як прагаласавалі іншыя, і перагледзець свой голас або проста нагадвае ім пра ўдзел у апытанні.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  62067c0573d7a64e:
    english: |-
      Setting options:
      - Nobody
      - Author
      - Undecided voters (default)
      - All voters
    translation: |-
      Варыянты налады:
      - Нікому
      - Аўтарам прапановы або апытання
      - Тым, хто яшчэ не вызначыліся (па змаўчанні)
      - Усім удзельнікам галасавання
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6cd67c3f92302551:
    english: |-
      For an anonymous poll lasting at least 24 hours, Loomio automatically reminds
      eligible people who have not voted during the final 24 hours. This reminder
      cannot be changed in the poll settings.
    translation: |-
      Калі ананімнае апытанне доўжыцца не менш за 24 гадзіны, Loomio аўтаматычна нагадвае
      людзям з правам голасу, якія яшчэ не прагаласавалі, на працягу апошніх 24 гадзін. Гэты напамін
      нельга змяніць у наладах апытання.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  72f172271e2a636a:
    english: |-
      ### Anonymous voting
      If enabled, votes are stored separately from voter identities. Results appear after voting closes, and voters cannot add reasons, review their submitted vote, or change it.
    translation: |-
      ### Ананімнае галасаванне
      Калі яно ўключана, галасы захоўваюцца асобна ад звестак пра асобаў, якія галасуюць. Вынікі з’яўляюцца пасля закрыцця галасавання. Нельга дадаваць абгрунтаванні, праглядаць пададзены голас або змяняць яго.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3393027493510f2f:
    english: See [Anonymous voting](/en/user_manual/polls/anonymous_voting) for details about how voter identities are separated from submitted votes, what information is retained, and the limits of the protection.
    translation: У раздзеле [Ананімнае галасаванне](/en/user_manual/polls/anonymous_voting) падрабязна тлумачыцца, як звесткі пра асобаў аддзяляюцца ад пададзеных галасоў, якая інфармацыя захоўваецца і якія межы мае гэтая абарона.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b731b9118e48dee5:
    english: |-
      > [!WARNING]
      > Once a poll has started you cannot edit the poll to make it anonymous or to undo the anonymous setting.
    translation: |-
      > [!WARNING]
      > Пасля пачатку апытання нельга ўключыць або адключыць ананімнасць праз рэдагаванне яго налад.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e8660d089a3c07bb:
    english: |-
      > [!WARNING]
      > You cannot re-open an anonymous poll after it has closed. Submitted votes are not linked to the participation records that show who has voted.
    translation: |-
      > [!WARNING]
      > Пасля закрыцця ананімнага апытання яго нельга адкрыць паўторна. Пададзеныя галасы не звязаны з запісамі ўдзелу, якія паказваюць, хто прагаласаваў.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aaaaa28a4b435835:
    english: |-
      ### Vote reason
      It can be helpful to understand why people voted the way they did. With this setting, you can prompt people to share their thoughts when they vote.
    translation: |-
      ### Абгрунтаванне голасу
      Разуменне прычын выбару можа дапамагчы пры прыняцці рашэння. Гэтая налада дазваляе прапанаваць людзям падзяліцца сваімі думкамі падчас галасавання.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  309645182b157738:
    english: 'Available settings depend on the template:'
    translation: 'Даступныя налады залежаць ад шаблону:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d67e2c2914e91a6f:
    english: |-
      - **Optional** lets voters choose whether to give a reason
      - **Required for disagree or block** requires a reason when the selected option
        uses the Disagree or Block voting icon
      - **Required for block** requires a reason when the selected option uses the
        Block voting icon
      - **Required** requires every voter to give a reason
      - **Disabled** removes the vote-reason field
    translation: |-
      - **Дадаткова** дазваляе выбаршчыкам вырашаць, ці пазначаць прычыну
      - **Абавязкова для нязгоды або блакіроўкі** патрабуе пазначыць прычыну, калі выбраная опцыя
        мае значок галасавання «Не згодны» або «Блакіраваць»
      - **Патрабуецца для блока** патрабуе пазначыць прычыну, калі выбраная опцыя мае
        значок галасавання «Блакіраваць»
      - **Абавязкова** патрабуе, каб усе выбаршчыкі пазначалі прычыну
      - **Інвалід** прыбірае поле для прычыны галасавання
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  af5e7c0557aec611:
    english: |-
      The conditional settings follow the voting icon rather than the option name.
      They still apply if you rename Disagree to a term such as Objection. The
      Consent template defaults to **Required for disagree or block**, while the
      Consensus template defaults to **Required for block**. Other templates default
      to **Optional**, except Question rounds where the response itself is required.
      The poll author can change the setting for an individual poll.
    translation: |-
      Умоўныя налады залежаць ад значка галасавання, а не ад назвы опцыі.
      Яны дзейнічаюць, нават калі перайменаваць «Не згодны», напрыклад, у «Пярэчанне». У
      шаблоне «Згода» стандартная налада — **Абавязкова для нязгоды або блакіроўкі**, а ў
      шаблоне «Кансенсус» — **Патрабуецца для блока**. У іншых шаблонах стандартная налада —
      **Дадаткова**, акрамя раўндаў пытанняў, дзе адказ абавязковы.
      Аўтары апытанняў могуць змяніць наладу для асобнага апытання.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ecb0d89c623db459:
    english: "**Limit reason to maximum 500 characters:** Keeping vote reasons short makes them easier to understand. A collection of concise reasons is a great resource for making a decision.  This setting is ticked by default. Untick to allow for longer reasons."
    translation: "**Абмежаваць прычыну 500 знакамі:** Кароткія прычыны галасавання лягчэй зразумець. Збор кароткіх тлумачэнняў дапамагае прыняць рашэнне. Гэтая налада ўключана стандартна. Зніміце пазнаку, каб дазволіць даўжэйшыя тлумачэнні."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  35bd4f116b9ff26a:
    english: |-
      ### Hide results
      If you want people to vote without knowing how others have voted, you can hide the results of the poll.  Useful if you do not want people to be affected by how other people have voted.
    translation: |-
      ### Схаваць вынікі
      Калі вы хочаце, каб людзі галасавалі, не ведаючы, як прагаласавалі іншыя, схавайце вынікі апытання. Гэта дапаможа пазбегнуць уплыву чужых галасоў на выбар.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8cc5b82f4cc5e94e:
    english: |-
      Setting options:
      - Do not hide results
      - Hide results until a vote is cast
      - Hide results until voting closes
    translation: |-
      Варыянты налады:
      - Не хаваць вынікі
      - Хаваць вынікі, пакуль не аддадзены голас
      - Хаваць вынікі да закрыцця галасавання
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4be103ffd97e7e8f:
    english: While results are hidden, nobody can reply to votes. Replies to votes open when voting closes.
    translation: Пакуль вынікі схаваныя, ніхто не можа адказваць на галасы. Магчымасць адказваць з’явіцца пасля закрыцця галасавання.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a488ebe6712a5e1d:
