    translated_on: '2026-09-30'
  4e03229937f959ed:
    english: "## Outcomes & Next Steps"
    translation: "## Conclusões e próximos passos"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  eaf0fe98db301c7f:
    english: 'Confirming the outcome can be critical to feel like the goals of a collaborative discussion have been achieved. A facilitator can pull together what’s been decided and reflect it back, to help the group walk away with the answers to some key questions:'
    translation: 'Confirmar a conclusão ajuda o grupo a reconhecer que a discussão colaborativa atingiu seus objetivos. A pessoa que facilita pode reunir as decisões e apresentá-las ao grupo, para que todos saiam com respostas a algumas perguntas importantes:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  00ed94f662c9643a:
    english: |-
      * What did we do?
      * What does it mean?
      * What will happen now?
      * What is my responsibility?
      * What will be different because we went through this experience?
    translation: |-
      * O que fizemos?
      * O que isso significa?
      * O que acontecerá agora?
      * Qual é a minha responsabilidade?
      * O que será diferente depois dessa experiência?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0f9ecf512b4990b7:
    english: Sometimes the answers to these questions are very concrete, such as action points, while other times they are more abstract, such as deepening shared understanding.
    translation: Às vezes, as respostas são concretas, como tarefas a realizar. Em outros casos, são mais abstratas, como uma compreensão compartilhada mais profunda.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aabfa9d842af2688:
    english: On Loomio
    translation: No Loomio
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a63bbb12b1a1e04c:
    english: |-
      * [Outcomes](/en/user_manual/polls/outcomes/) are a very important tool. A proposal ending is not quite the end: there’s a need to sum up conclusively. That's what the outcome feature is for.
      * Many Loomio discussions come to a natural end without even using proposals or publishing outcomes. These discussions still provide a lot of value, and it can be helpful to update the context box with an outcome summary for later reference.
      * If specific people have action points, you can @mention their names and they will be notified.
    translation: |-
      * As [conclusões](/en/user_manual/polls/outcomes/) são uma ferramenta importante. O encerramento de uma proposta ainda pede um resumo final. É para isso que serve o recurso de conclusão.
      * Muitas discussões no Loomio chegam ao fim sem propostas nem conclusões publicadas. Elas ainda têm valor. Atualizar a caixa de contexto com um resumo da conclusão pode ajudar quem consultar a discussão depois.
      * Se algumas pessoas tiverem tarefas a realizar, você pode mencionar seus nomes com @ para que recebam uma notificação.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  55a9b345194f80d6:
    english: "## Reporting & Harvesting"
    translation: "## Registro e documentação"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fc6ee28887dd5ab1:
    english: To understand the meaning of an experience, you have to inquire into how it fits into the bigger context. What was this moment, in the bigger rhythm of our progress? What form will our understanding from this experience take — a story, a report, a change, a call to action?
    translation: 'Para entender uma experiência, considere como ela se encaixa no contexto mais amplo. Que papel esse momento teve no andamento do trabalho? Que forma terá o que aprendemos com ele: uma história, um relatório, uma mudança ou um chamado à ação?'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  eb2cdc1c6526e053:
    english: The experience happens in the moment, but its impact often comes from putting handles on it, giving it a name, and being able to use it and refer to it. Otherwise you risk forgetting, leaving people out who weren't there, or having to repeat it later. Productive collaboration is often helped by tangible documentation or reporting.
    translation: A experiência acontece em um momento, mas seu impacto costuma depender de dar a ela um nome e uma forma que permitam retomá-la. Sem isso, você pode esquecê-la, deixar de fora quem não estava presente ou ter de repetir o trabalho mais tarde. Documentos e relatórios concretos costumam ajudar na colaboração.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4104d8b917a87b0e:
    english: |-
      * Loomio is self-documenting — notes write themselves as an integrated part of the process. This creates a gold-mine of archival content for groups, without any extra effort.
      * We have some features to support harvesting and archiving: the search function, the “previous decisions” list, and the print discussion option.
      * Premium plans offer the option to export all your group's Loomio data.
      * Many groups use Loomio to integrate content from various channels. For example, posting a meeting announcement and building the agenda on Loomio, having the meeting in person, posting the notes back on Loomio, and making related decisions in the same thread. This expands the “self-harvesting” ability of Loomio beyond the online space.
    translation: |-
      * O Loomio registra o processo enquanto ele acontece. As contribuições ficam documentadas como parte da própria colaboração, criando um arquivo de conteúdo para os grupos sem trabalho adicional.
      * Alguns recursos ajudam a consultar e arquivar esse conteúdo: a busca, a lista de “decisões anteriores” e a opção de imprimir a discussão.
      * Os planos Premium permitem exportar todos os dados do seu grupo no Loomio.
      * Muitos grupos usam o Loomio para reunir conteúdo de diferentes canais. Por exemplo, anunciam uma reunião e organizam a pauta no Loomio, realizam a reunião presencialmente, publicam as notas no Loomio e tomam as decisões relacionadas na mesma discussão. Assim, o registro do trabalho também abrange o que aconteceu fora do espaço online.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dae98cfd5f14b034:
    english: "## Turning Discussion into Action"
    translation: "## Transformando a discussão em ação"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a39a66938d6cadb0:
    english: There comes a moment when you have to re-engage with the reality outside the room. Occasionally, the need is simply to work with ideas and feelings, without worrying about implementation. But usually a group will not reach its goals without applying its conclusions to real-world action. This transition is part of the total facilitated experience.
    translation: Em algum momento, é preciso voltar a lidar com o que acontece fora da discussão. Às vezes, basta trabalhar ideias e sentimentos, sem se preocupar com a implementação. Em geral, porém, um grupo precisa transformar suas conclusões em ações concretas para alcançar seus objetivos. Essa transição faz parte do processo de facilitação.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3e26f1939ffe69fe:
    english: 'It’s at this point that a collaborative process intersects with other organizational systems, and the facilitator has to help figure out how it will work. These other systems might include:'
    translation: 'É nesse ponto que o processo colaborativo encontra outros sistemas da organização. A pessoa que facilita precisa ajudar o grupo a definir como essa relação vai funcionar. Esses sistemas podem envolver:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cb030c5876714643:
    english: |-
      * **Power** — Who actually makes decisions? What has to happen for ideas to turn into reality here?
      * **Management** — How does this fit into other priorities? What dependencies might exist?
      * **Delegation** — Who will take responsibility for next steps? Will they be held accountable?
      * **Communication** — How will this process or discussion be relayed to others? What do they need to know?
      * **Administration** — How will information from one system be input into another, such as a task tracking or communications tool? Where will information be stored?
    translation: |-
      * **Poder** — Quem realmente toma as decisões? O que precisa acontecer para que as ideias se tornem realidade?
      * **Gestão** — Como isso se encaixa nas outras prioridades? De que outras ações pode depender?
      * **Delegação** — Quem assumirá a responsabilidade pelos próximos passos? Como prestará contas?
      * **Comunicação** — Como esse processo ou essa discussão será apresentado a outras pessoas? O que elas precisam saber?
      * **Administração** — Como as informações passarão de um sistema para outro, como uma ferramenta de acompanhamento de tarefas ou de comunicação? Onde elas serão armazenadas?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5fd6382726e6e5c0:
    english: If there are any blocks around these issues, it can be damaging to leave this realisation until the moment of conclusion. For example, if the participants don’t actually have the power to make a change they have decided, they will feel defeated.Think ahead toward confronting reality when setting up the process, and scope the collaboration accordingly.
    translation: Se houver obstáculos nessas questões, descobri-los apenas no encerramento pode prejudicar o processo. Por exemplo, se as pessoas participantes não tiverem autoridade para realizar uma mudança que decidiram fazer, poderão se sentir frustradas. Ao planejar o processo, considere essas condições e defina o alcance da colaboração de acordo com elas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c3f96d2ea17ab236:
    english: |-
      * You can @mention the names of people who will take actions out of a decision.
      * Many users accomplish integrating Loomio content into other organizational systems through other channels like reviewing Loomio decisions in regular offline meetings, or transferring outcomes to their task tracking process.
      * Making an explicit decision naturally leads people to ask, “OK, but how are we going to take this forward?”
      * Forming a Loomio group often surfaces important questions like, “Who needs to participate here to turn these decisions into action?” If you're missing key stakeholders, leaders, or administrators, you'll get stuck.
    translation: |-
      * Você pode mencionar com @ as pessoas responsáveis por realizar ações decorrentes de uma decisão.
      * Muitos usuários integram o conteúdo do Loomio a outros processos da organização. Por exemplo, revisam as decisões do Loomio em reuniões presenciais regulares ou transferem as conclusões para uma ferramenta de acompanhamento de tarefas.
      * Uma decisão explícita costuma levar à pergunta: “Certo, como vamos colocar isso em prática?”
      * Criar um grupo no Loomio muitas vezes traz à tona perguntas importantes, como: “Quem precisa participar para transformar essas decisões em ação?” Se pessoas com papel essencial, lideranças ou administradores ficarem de fora, o trabalho pode parar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  60bb517775f11e5d:
    english: "## It Ain’t Over Til It’s Over"
    translation: "## Encerrar de fato"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '079da8800a401a45':
    english: Ending well is important. There’s a ritual to closing a process, and if it’s missed people will feel unsettled. Sometimes the end is determined by running out of time, and sometimes it’s when certain goals are achieved. Recognize implicit and explicit cues indicating if the individuals, and the group as a whole, can feel completion of a process or phase.
    translation: É importante encerrar bem um processo. O fechamento pode seguir um ritual, e sua ausência pode deixar as pessoas sem a sensação de que o trabalho terminou. Às vezes, o processo acaba porque o tempo terminou; outras vezes, porque certos objetivos foram alcançados. Observe os sinais explícitos e implícitos de que as pessoas e o grupo como um todo consideram concluído o processo ou uma de suas etapas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  280969e6212842cc:
    english: Participants often look to the leader or facilitator for confirmation of when it’s actually over, and it usually pays to be explicit. Sometimes the signal is a clear statement that the session is wrapping up, a recap of decisions or next steps, and bidding everyone goodbye. Other times groups have established practices like a check-out. Letting a session vaguely trail off will leave a bad taste.
    translation: As pessoas participantes costumam esperar que a liderança ou a pessoa que facilita confirme quando o processo terminou. Por isso, convém ser explícito. Você pode anunciar o fim da sessão, recapitular as decisões ou os próximos passos e se despedir. Alguns grupos têm práticas próprias de encerramento, como uma rodada final. Deixar a sessão terminar sem um fechamento claro pode causar desconforto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e15896aadc163225:
    english: |-
      * The clearest indication of conclusion on Loomio is publishing a decision outcome.
      * Some groups use the [lock thread](/en/user_manual/discussions/using_discussions/#lock-or-unlock-a-thread) feature to prevent further changes and reduce clutter.
      * Deactivating a group is the strongest possible “closure” move. No one can say anything else after that.
      * Since Loomio groups can remain while group activity goes up and down, it can be useful to recognize milestones like the conclusion of a particular phase, even if the group will reactivate in the future.
    translation: |-
      * No Loomio, o sinal mais claro de encerramento é publicar a conclusão de uma decisão.
      * Alguns grupos usam o recurso de [bloquear a discussão](/en/user_manual/discussions/using_discussions/#lock-or-unlock-a-thread) para impedir novas alterações e reduzir o acúmulo de conteúdo.
      * Desativar um grupo é a forma mais definitiva de encerrá-lo. Depois disso, ninguém pode publicar mais nada nele.
      * Como os grupos no Loomio podem continuar existindo mesmo quando a atividade varia, pode ser útil reconhecer marcos como o fim de uma etapa, ainda que o grupo volte a ficar ativo no futuro.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
