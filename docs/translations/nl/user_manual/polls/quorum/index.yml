  a79abb23e8e1c82f:
    english: A quorum is the minimum percentage of eligible voters who must participate for a poll to be valid. Use it when your governance process requires a particular level of participation.
    translation: Een quorum is het minimumpercentage stemgerechtigden dat moet deelnemen om een peiling geldig te maken. Gebruik het als voor een besluit een bepaald niveau van deelname nodig is.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d83e75068f697f6f:
    english: When creating a poll, open **More settings** and enter the required percentage in **Participation quorum**. Leave the field blank when no quorum is required.
    translation: Open bij het maken van een peiling **Meer instellingen** en vul het vereiste percentage in bij **Deelnamequorum**. Laat het veld leeg als er geen quorum nodig is.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a04b99724fe62a56:
    english: "![The Quorum setting with a 60 percent participation quorum](./quorum-section.png)"
    translation: "![De quoruminstelling met een deelnamequorum van 60 procent](./quorum-section.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  432f570094ad5b24:
    english: You can also set a quorum in a [poll template](/en/user_manual/polls/poll_templates/) so that polls created from that template use it by default.
    translation: Je kunt ook een quorum instellen in een [peilingssjabloon](/en/user_manual/polls/poll_templates/). Peilingen die je met dat sjabloon maakt, gebruiken het quorum dan standaard.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
