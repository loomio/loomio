  86490ad15147169e:
    english: Use a **Time poll** to find a time for a meeting or event. It serves the same purpose as scheduling tools such as Doodle, while keeping the scheduling process with the group's other Loomio work. Participants see the options in their own time zone.
    translation: Используйте **Опрос времени**, чтобы выбрать время для встречи или мероприятия. Он помогает согласовать время, как и сервисы планирования встреч, например Doodle, но обсуждение остаётся рядом с другой работой группы в Loomio. Участники видят варианты в своём часовом поясе.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2e21bb1b54b6fcf9:
    english: "## Time poll"
    translation: "## Опрос времени"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  27ba736f4b564fe3:
    english: _Find when people are available to meet_
    translation: _Узнайте, когда участники могут встретиться_
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2f5455ba3b487407:
    english: Save time arranging a date for your meeting or event.
    translation: Сэкономьте время на согласовании даты встречи или мероприятия.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  859c3efc07ce0b04:
    english: Time poll makes it easy to see everyone's availability and find the best time.
    translation: Опрос времени помогает увидеть, когда участники свободны, и выбрать подходящее время.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  12ae9e9d3bdb0a4e:
    english: Give your Time poll a title and details. Enter a list of date and time options in your time zone.
    translation: Укажите название и подробности опроса времени. Добавьте варианты даты и времени в своём часовом поясе.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  548fb6cd6fcd9376:
    english: When setting timeslots, consider people in different time zones. Participants will see times localized in their time zone.
    translation: Учитывайте часовые пояса других участников при выборе времени. Каждый увидит варианты в своём часовом поясе.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3105405631b53c31:
    english: Set a meeting duration.
    translation: Укажите продолжительность встречи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8d56a5d9986286e9:
    english: "### Voting"
    translation: "### Голосование"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  41d1e6a3a6739d95:
    english: People mark each time with the green thumbs-up icon when they are available, the yellow sideways thumb when they can attend if needed, or the red thumbs-down icon when they are unavailable.
    translation: Участники отмечают каждый вариант зелёным значком с поднятым большим пальцем, если могут прийти, жёлтым значком с пальцем в сторону, если смогут прийти при необходимости, или красным значком с опущенным пальцем, если не могут.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b4784042c82735af:
    english: Participants can leave a reason comment to help the organizer find a suitable time.
    translation: Участники могут пояснить свой выбор в комментарии. Это поможет организатору выбрать подходящее время.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0165a90bc22b6f7f:
    english: If the times don't work, participants can suggest alternatives using the message field. You can then update the poll with new times.
    translation: Если предложенное время не подходит, участники могут предложить другие варианты в поле сообщения. Затем вы можете добавить новые варианты в опрос.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6c7c09879e7d9bf8:
    english: The results update as voting proceeds in a table showing who is available when, so everyone can see which timeslots are popular.
    translation: По мере голосования таблица обновляется и показывает, кто и когда может прийти. Так все видят, какие варианты времени подходят большему числу участников.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b4783489f09ccf19:
    english: "### Outcome"
    translation: "### Исход"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3c0061b9af0a6bca:
    english: When the Time poll closes, pick the best time and post an outcome.
    translation: Когда опрос времени закроется, выберите подходящее время и опубликуйте итоговое решение.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  62ef08e40ed2f44b:
    english: "**Notify**: Add the people you are inviting to the meeting or event"
    translation: "**Поставить в известность**: Добавьте людей, которых вы приглашаете на встречу или мероприятие"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  945f9e19218fb1bf:
    english: "**Meeting time**: Select the time that works best"
    translation: "**Время встречи**: Выберите наиболее подходящее время"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c5909628c21cd884:
    english: "**Meeting name**: Give your meeting a name. The Time poll title is used by default"
    translation: "**Название встречи**: Укажите название встречи. По умолчанию используется название опроса времени"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  81195d01767895e4:
    english: "**Location**: Add a physical location or a meeting link"
    translation: "**Расположение**: Укажите место проведения или добавьте ссылку на встречу"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  af5765f5bdf83132:
    english: "**Statement**: Summarize the result and add any instructions for the meeting"
    translation: "**Заявление**: Подведите итог и добавьте инструкции для участников встречи"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6c0cb92cca53d36a:
    english: Loomio includes the selected time, meeting name, duration, location, and statement in the outcome notification and calendar invitation.
    translation: Loomio добавит выбранное время, название и продолжительность встречи, место проведения и заявление в уведомление об итоговом решении и приглашение в календарь.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
