  828de256c39d112c:
    english: Loomio complements chat, shared documents, and task-management tools rather than replacing every kind of work.
    translation: Loomio complementa el chat, los documentos compartidos y las herramientas de gestión de tareas. Cada herramienta sirve para un tipo de trabajo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ad42655c9ef79337:
    english: |-
      | Work | Suggested tool |
      |---|---|
      | Quick questions, social conversation, and timely updates | Chat |
      | Collaborative editing of a living document | Shared document |
      | Assigning and tracking tasks | Project or task-management tool |
      | Important topic-based discussion, broad participation, decisions, and outcomes | Loomio |
    translation: |-
      | Trabajo | Herramienta recomendada |
      |---|---|
      | Preguntas rápidas, conversaciones informales y novedades que requieren atención inmediata | Chat |
      | Edición conjunta de un documento que se actualiza con frecuencia | Documento compartido |
      | Asignación y seguimiento de tareas | Herramienta de gestión de proyectos o tareas |
      | Discusiones sobre temas importantes, participación amplia, decisiones y conclusiones | Loomio |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  40e853f5116f28eb:
    english: Put work in Loomio when people need time to consider a topic, when everyone affected should have a meaningful opportunity to participate, or when the group will need to find the discussion and decision later. Link to the relevant document or task from the Loomio discussion so its context remains easy to find.
    translation: Usa Loomio cuando las personas necesiten tiempo para considerar un tema, cuando todas las personas afectadas deban tener la oportunidad de participar o cuando el grupo necesite encontrar la discusión y la decisión más adelante. Enlaza el documento o la tarea pertinente desde la discusión de Loomio para que sea fácil encontrar el contexto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
