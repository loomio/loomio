---
navigation_title: Notifiche
blocks:
  3a65b66c581936a1:
    english: "# Notifications"
    translation: "# Notifiche"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c343eb5a1db968d8:
    english: Notifications help groups maintain momentum by drawing your attention to discussions and decisions that need a response.
    translation: Le notifiche aiutano i gruppi a portare avanti il lavoro richiamando la tua attenzione sulle discussioni e sulle decisioni che richiedono una risposta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3d7b27f3b9880973:
    english: 'Notifications are often the starting point when you return to Loomio. They let you know when:'
    translation: 'Quando torni su Loomio, spesso inizi dalle notifiche. Ti avvisano quando:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c4aec8fcb9fbc0de:
    english: |-
      - someone mentions you or replies to something you wrote
      - a new discussion is shared with you
      - you are invited or reminded to vote
      - a poll is closing soon
      - an outcome is announced
    translation: |-
      - qualcuno ti menziona o risponde a qualcosa che hai scritto
      - viene condivisa con te una nuova discussione
      - ricevi un invito o un promemoria per votare
      - un sondaggio sta per chiudersi
      - viene annunciata una conclusione
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  792dcad0f81e8cc5:
    english: Loomio's notification settings let you choose how closely you want to follow each group or thread. Notifications remain available in Loomio, so you can review what needs your attention when you are ready.
    translation: Le impostazioni delle notifiche di Loomio ti permettono di scegliere quanto seguire ogni gruppo o thread. Le notifiche restano disponibili in Loomio, così puoi consultarle quando vuoi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '082fae961275aaaf':
    english: "## Two ways to begin"
    translation: "## Due modi per iniziare"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cbea008bb7c0ee02:
    english: 'Most people can start with one of two approaches:'
    translation: 'Puoi iniziare scegliendo uno di questi due modi:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3349bdb53fc33195:
    english: |-
      - **When notified** — receive an email when someone asks for your attention, and include everything else in your daily catch-up. Start here if you are still learning how your group uses Loomio.
      - **Once per day** — set Email to **Catch-up only** and keep your catch-up set to **Every day**. Your notifications and other unread activity will be delivered together in one email.
    translation: |-
      - **Quando viene notificato** — ricevi un'email quando qualcuno richiede la tua attenzione e trovi il resto nel riepilogo giornaliero. È un buon punto di partenza se stai ancora imparando come il tuo gruppo usa Loomio.
      - **Una volta al giorno** — imposta l'email su **Solo recupero** e mantieni il riepilogo su **Tutti i giorni**. Riceverai le notifiche e le altre attività non lette in un'unica email.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  74e84c4946aa3713:
    english: New accounts start with **When notified** and a daily catch-up. This brings mentions, replies, discussions shared with you, invitations and reminders to vote, polls closing soon, and outcomes to your attention as they happen without sending an immediate update about every comment or vote.
    translation: I nuovi account iniziano con **Quando viene notificato** e un riepilogo giornaliero. Ricevi subito le menzioni, le risposte, le discussioni condivise con te, gli inviti e i promemoria per votare, gli avvisi sui sondaggi in chiusura e le conclusioni. Non ricevi invece un aggiornamento immediato per ogni commento o voto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  896722cbb87e98be:
    english: If you would rather receive your Loomio notifications all at once, move to the once-per-day approach. You can change this later as your pattern of work changes.
    translation: Se preferisci ricevere tutte le notifiche di Loomio insieme, passa al riepilogo una volta al giorno. Potrai cambiare questa scelta quando cambierà il tuo modo di lavorare.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e2c60724226ad68a:
    english: For a group or thread that you want to follow more closely, choose **All activity** to receive every update as it happens.
    translation: Per seguire più da vicino un gruppo o un thread, scegli **Tutte le attività** e riceverai ogni aggiornamento quando avviene.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  91fd24c60a6a84ee:
    english: These defaults apply when you join a group. Threads initially inherit the settings of their group, but you can follow an important thread more closely or reduce its notifications without changing the rest of the group.
    translation: Queste impostazioni predefinite si applicano quando entri in un gruppo. All'inizio i thread ereditano le impostazioni del gruppo, ma puoi seguire più da vicino un thread importante o ricevere meno notifiche da quel thread senza modificare le impostazioni del resto del gruppo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a75df26cfc4e6614:
    english: "## Notifications in Loomio"
    translation: "## Notifiche in Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9286edc0ac459625:
    english: The bell icon in the top-right is where notifications are accessed within the app; a number shows how many notifications you have yet to read.
    translation: Puoi accedere alle notifiche nell'app tramite l'icona della campana in alto a destra. Il numero indica quante notifiche non hai ancora letto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bfacf52b815e1252:
    english: Select a notification to open the related discussion or poll.
    translation: Seleziona una notifica per aprire la discussione o il sondaggio a cui si riferisce.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b7ed6a5c5c661d60:
    english: "## Catch-up"
    translation: "## Riepilogo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fc61461d684c5b47:
    english: The catch-up provides a regular overview of activity without requiring you to follow each group throughout the day.
    translation: Il riepilogo ti offre una panoramica periodica delle attività senza dover seguire ogni gruppo durante il giorno.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9e519b17a3847cee:
    english: It shows your unseen notifications first, followed by unread discussions and standalone polls grouped by group. Notifications provide linked summaries of activity that needs your attention, while the unread section includes the discussion, poll, comment, vote, and edit details. Direct discussions and threads you have joined as a guest are included when they contain unread activity.
    translation: Mostra prima le notifiche che non hai ancora visto, poi le discussioni e i sondaggi autonomi non letti, raggruppati per gruppo. Le notifiche contengono riepiloghi con link alle attività che richiedono la tua attenzione. La sezione delle attività non lette include i dettagli di discussioni, sondaggi, commenti, voti e modifiche. Sono incluse anche le discussioni dirette e i thread a cui partecipi come ospite, se contengono attività non lette.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  00703333f277e3c0:
    english: You can turn on **Follow updates** on an open Group that you have not joined. Unread discussions and polls from that Group are then included in your catch-up at your existing schedule. Reading the threads or marking the catch-up as read updates their read status in the same way as threads from Groups you belong to. Turn off **Follow updates** on the Group page to stop including them.
    translation: Puoi attivare **Segui gli aggiornamenti** per un gruppo aperto di cui non fai parte. Le discussioni e i sondaggi non letti di quel gruppo compariranno nel tuo riepilogo secondo la frequenza che hai già impostato. Quando leggi i thread o segni il riepilogo come letto, il loro stato di lettura si aggiorna come per i thread dei gruppi di cui fai parte. Per non includerli più, disattiva **Segui gli aggiornamenti** nella pagina del gruppo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fcac102a70f7ee7f:
    english: Loomio does not send a catch-up when there are no unseen notifications or unread threads from the relevant period.
    translation: Loomio non invia un riepilogo se nel periodo interessato non ci sono notifiche che non hai ancora visto o thread non letti.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  888011209ac583be:
    english: "![A catch-up with unseen notifications and unread thread activity from one group](digest_email_example.png)"
    translation: "![Un riepilogo con notifiche non ancora viste e attività non lette nei thread di un gruppo](digest_email_example.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7d80cf08a383f6bd:
    english: "### Choose your catch-up schedule"
    translation: "### Scegli la frequenza del riepilogo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  677863d68136156b:
    english: Open **Notification settings** from your user menu to choose how often you receive a catch-up.
    translation: Apri **Impostazioni notifiche** dal menu utente per scegliere quanto spesso ricevere il riepilogo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7c0dece94210f807:
    english: The **Unsubscribe** link in a catch-up email opens a catch-up schedule form. The email link authorizes that form, so you can change or stop catch-up emails without signing in. The full **Notification settings** page in Loomio remains available when you sign in.
    translation: Il link **Discriviti** in un'email di riepilogo apre un modulo per modificarne la frequenza. Il link nell'email ti autorizza a usare quel modulo, così puoi modificare o interrompere le email di riepilogo senza accedere a Loomio. Dopo aver effettuato l'accesso, puoi usare anche la pagina completa **Impostazioni notifiche**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  da5740fd6dbd5737:
    english: "![Notification settings in the user menu](sidebar_notification_settings.png)"
    translation: "![Impostazioni notifiche nel menu utente](sidebar_notification_settings.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  58af77d870a877e2:
    english: 'New accounts start with a daily catch-up. The available schedules are:'
    translation: 'I nuovi account iniziano con un riepilogo giornaliero. Puoi scegliere tra queste frequenze:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b0fe04b2b5284253:
    english: |-
      - **Never** to turn off the catch-up
      - **Every day** for activity from approximately the previous 24 hours
      - **Every second day** for activity from approximately the previous two days
      - a weekday to receive a weekly catch-up on that day
    translation: |-
      - **Mai** per disattivare il riepilogo
      - **Tutti i giorni** per le attività delle 24 ore precedenti circa
      - **Ogni due giorni** per le attività dei due giorni precedenti circa
      - un giorno della settimana per ricevere un riepilogo settimanale in quel giorno
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a23935f518dd15cb:
    english: The catch-up is sent in the morning according to the time zone in your Loomio profile.
    translation: Il riepilogo viene inviato al mattino, in base al fuso orario impostato nel tuo profilo Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b214c0634763fb51:
    english: "![Catch-up schedule setting](digest_email_setting.png)"
    translation: "![Impostazione della frequenza del riepilogo](digest_email_setting.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  efbcecfe827438a5:
    english: "### Mark a catch-up as read"
    translation: "### Segna un riepilogo come letto"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2b764b73f48d3185:
    english: Select **Mark catch-up as read** to mark its notifications and topic activity as read in Loomio. Opening or previewing the catch-up does not mark anything as read.
    translation: Seleziona **Segna come letto il recupero dei contenuti** per segnare come lette in Loomio le notifiche e le attività dei topic incluse nel riepilogo. Aprire il riepilogo o visualizzarne l'anteprima non segna nulla come letto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  81ffa4a869f82451:
    english: A catch-up is not specific to one discussion, so do not reply to it. Open a discussion or poll from the catch-up before commenting or replying.
    translation: Il riepilogo non riguarda una sola discussione, quindi non rispondere all'email. Apri una discussione o un sondaggio dal riepilogo prima di commentare o rispondere.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f7dfee93901e5eea:
    english: "## Group and thread notification settings"
    translation: "## Impostazioni delle notifiche per gruppi e thread"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  31be594005b6bcfc:
    english: You can choose how closely to follow each group and thread. These settings belong to you; group administrators cannot change them.
    translation: 'Puoi scegliere quanto seguire ogni gruppo e thread. Queste impostazioni sono personali: gli amministratori del gruppo non possono modificarle.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6c9a762b18c9f92d:
    english: Change your defaults for groups you join from **Notification settings** in your user menu. You can then override the default for a particular group or thread. A thread override changes only that thread and does not affect the rest of its group.
    translation: Modifica le impostazioni predefinite per i gruppi a cui ti unisci da **Impostazioni notifiche** nel menu utente. Puoi poi scegliere un'impostazione diversa per un gruppo o un thread specifico. L'impostazione di un thread riguarda solo quel thread e non gli altri thread del gruppo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f4b6aa6eab1beb2b:
    english: "### Group notification settings"
    translation: "### Impostazioni delle notifiche del gruppo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  977289761daba9db:
    english: 'To change the notification setting for a group:'
    translation: 'Per modificare le notifiche di un gruppo:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d78d13409c481c71:
    english: |-
      1. Open the group page.
      2. Open the notification settings for the group.
    translation: |-
      1. Apri la pagina del gruppo.
      2. Apri le impostazioni delle notifiche del gruppo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  02116f695da0a946:
    english: "![Notification settings on a group page](group_notifications.png)"
    translation: "![Impostazioni delle notifiche nella pagina di un gruppo](group_notifications.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8ce50d3418e2d9fa:
    english: The form asks **How do you want to stay updated?** Choose **Catch-up only**, **When notified**, or **All activity**. If your catch-up is set to **Never**, **Catch-up only** is replaced by **No email updates** or **No push updates**.
    translation: Il modulo chiede **Come preferisci rimanere aggiornato?** Scegli **Solo recupero**, **Quando viene notificato** o **Tutte le attività**. Se hai impostato il riepilogo su **Mai**, al posto di **Solo recupero** trovi **Nessun aggiornamento via email** o **Nessun aggiornamento push**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  24db74c2c82737eb:
    english: Select **Apply to all groups** to use the same setting for all of your groups.
    translation: Seleziona **Applica a tutti i gruppi** per usare la stessa impostazione per tutti i tuoi gruppi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  54cd6a8eac96e073:
    english: "![Group notification settings](group_notification_settings.png)"
    translation: "![Impostazioni di notifica del gruppo](group_notification_settings.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d0ab43e865282241:
    english: "### Thread notification settings"
    translation: "### Impostazioni di notifica del thread"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f61284373b7afc42:
    english: To change notification settings for an individual thread, open the notification control in the thread sidebar.
    translation: Per modificare le notifiche di un singolo thread, apri il controllo delle notifiche nella barra laterale del thread.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b329b8421ab5d4f8:
    english: "![The notification control in a thread](thread_subscribe.png)"
    translation: "![Il controllo delle notifiche in un thread](thread_subscribe.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  226c5e321d735005:
    english: "![Thread notification settings](thread_notifications.png)"
    translation: "![Impostazioni di notifica del thread](thread_notifications.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3178b3b456acd783:
    english: Thread notification settings use the same **Catch-up only**, **When notified**, and **All activity** choices. A thread setting overrides the group setting for that thread.
    translation: 'Le impostazioni di notifica del thread offrono le stesse opzioni: **Solo recupero**, **Quando viene notificato** e **Tutte le attività**. L''impostazione del thread prevale su quella del gruppo solo per quel thread.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f53fa37c98c9b747:
    english: |-
      >[!Note]
      >The changes in **Thread notification settings** apply only to the thread you have open. Select **Change notifications for group** to change the setting inherited by the group's other threads.
    translation: |-
      >[!Note]
      >Le modifiche in **Impostazioni di notifica del thread** si applicano solo al thread che hai aperto. Seleziona **Modifica le notifiche per il gruppo** per cambiare l'impostazione ereditata dagli altri thread del gruppo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  99a0923cdcdc1cdf:
    english: "## Email delivery"
    translation: "## Notifiche via email"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6cf70b2dc7cdbf83:
    english: By default, Loomio sends an email when you are notified. Depending on your group and thread notification settings, this can include mentions, replies, discussions shared with you, invitations and reminders to vote, outcomes, and polls closing soon. Choose **All activity** to also receive emails about every new comment, vote, thread, poll, and outcome.
    translation: Per impostazione predefinita, Loomio ti invia un'email quando ricevi una notifica. In base alle impostazioni dei gruppi e dei thread, puoi ricevere email per menzioni, risposte, discussioni condivise con te, inviti e promemoria di voto, conclusioni e sondaggi in prossimità della chiusura. Scegli **Tutte le attività** per ricevere email anche per ogni nuovo commento, voto, thread, sondaggio e conclusione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ce2919b895be45b3:
    english: The **Unsubscribe** link in a notification email opens settings for that thread or group, including emails sent because someone mentioned you or replied to you. That form shows your current catch-up schedule for all groups and links to the catch-up email settings. These email links authorize only their own settings forms; they do not sign you in to Loomio.
    translation: 'Il link **Discriviti** in un''email di notifica apre le impostazioni del thread o del gruppo, anche quando l''email ti è stata inviata perché qualcuno ti ha menzionato o ti ha risposto. Il modulo mostra la frequenza attuale del tuo riepilogo per tutti i gruppi e contiene un link alle impostazioni delle email di riepilogo. Questi link autorizzano solo l''accesso ai rispettivi moduli: non effettuano l''accesso a Loomio per te.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d615e84f882a2728:
    english: When a discussion email says that replies are accepted, you can reply directly from your email and your message will be posted into the Loomio discussion.
    translation: Se un'email relativa a una discussione indica che le risposte sono accettate, puoi rispondere direttamente via email. Il tuo messaggio verrà pubblicato nella discussione su Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5b4ce168b24bc44a:
    english: Poll invitation emails show the poll and its response options, but selecting an option opens Loomio in your browser to complete the vote. You may need to sign in or confirm your account. The catch-up cannot accept replies; open the linked discussion or poll first.
    translation: 'Le email di invito a un sondaggio mostrano il sondaggio e le opzioni di risposta. Selezionando un''opzione, Loomio si apre nel browser per completare il voto. Potresti dover effettuare l''accesso o confermare il tuo account. Non puoi rispondere al riepilogo: apri prima la discussione o il sondaggio collegato.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0c2b2867a1ace598:
    english: "![A proposal invitation email with response options and the related thread](proposal_invitation_email.png)"
    translation: "![Un'email di invito a votare su una proposta con le opzioni di risposta e il thread collegato](proposal_invitation_email.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a73508aa897d96cf:
    english: "## Enable mobile notifications with web push"
    translation: "## Attiva le notifiche mobili con le notifiche push web"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f4b14a4ba068b670:
    english: Web push is how Loomio delivers mobile notifications today. It can notify you about Loomio activity on your phone when Loomio is not open.
    translation: Loomio usa le notifiche push web per inviare notifiche sul telefono. Puoi ricevere notifiche sulle attività di Loomio anche quando l'app non è aperta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  811ee794dea12cd3:
    english: On Android, open **Notification settings** in a supported browser and enable push. On an iPhone or iPad, first open Loomio in Safari, use **Share** then **Add to Home Screen**, open Loomio from the new Home Screen icon, and enable push from there. Select **Test connection** to verify delivery to every browser listed under **Enabled browsers**.
    translation: Su Android, apri **Impostazioni notifiche** in un browser supportato e attiva le notifiche push. Su iPhone o iPad, apri prima Loomio in Safari, usa **Condividi** e poi **Aggiungi alla schermata Home**. Apri Loomio dalla nuova icona nella schermata Home e attiva le notifiche push. Seleziona **Test connection** per verificare che le notifiche arrivino a ogni browser elencato in **Browser abilitati**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  72f0707b2d67bf0e:
    english: Web push also works in supported desktop browsers. Enable it there if you want Loomio notifications on your computer.
    translation: Le notifiche push web funzionano anche nei browser desktop supportati. Attivale se vuoi ricevere le notifiche di Loomio sul computer.
    status: machine
    provider: codex/gpt-6-sol
