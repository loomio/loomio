  e6670b54039f316a:
    english: Compare the number of votes issued to each person with the number they cast, see missed votes, and identify people who cast every vote issued to them. A person with no issued votes is not shown as having cast all votes. Anonymous polls are excluded because an anonymous ballot must not be associated with the person who cast it.
    translation: Vertaa, kuinka moneen äänestykseen kukin henkilö on kutsuttu ja kuinka monessa hän on äänestänyt. Näet väliin jääneet äänestykset ja henkilöt, jotka ovat osallistuneet jokaiseen heille osoitettuun äänestykseen. Henkilöä, jolle ei ole osoitettu yhtään äänestystä, ei merkitä kaikkiin äänestäneeksi. Nimettömät kyselyt jätetään pois, koska nimetöntä ääntä ei saa yhdistää sen antajaan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
