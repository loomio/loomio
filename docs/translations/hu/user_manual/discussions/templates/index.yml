    translated_on: '2026-09-29'
  488fbd5167707cba:
    english: Discussion templates help your group start discussions the same way each time. A template can supply a title, context, tags, and instructions for the person starting the discussion. It also sets defaults, such as whether to notify the whole group and which polls to suggest.
    translation: A beszélgetési sablonok segítenek a csoportodnak abban, hogy az ismétlődő beszélgetéseket azonos módon indítsa el. A sablon címet, leírást, címkéket és útmutatást adhat a beszélgetés indítójának. Alapértelmezett beállításokat is megadhat, például hogy értesüljön-e az egész csoport, és mely szavazásokat javasolja a Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2571bc9cc405d927:
    english: Every new discussion in a group starts from a template. When someone selects **Start discussion**, Loomio shows the group's templates. Even **Blank template** is a template, so your group can change its defaults too.
    translation: A csoportban minden új beszélgetés sablonból indul. Amikor valaki a **Beszélgetés indítása** lehetőséget választja, a Loomio megmutatja a csoport sablonjait. Az **Üres sablon** is sablon, így annak alapértelmezett beállításait is módosíthatjátok.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  834ac31697ef254b:
    english: Templates work well for processes your group repeats, such as project reviews, advice processes, meeting preparation, funding decisions, or document approvals. The person starting the discussion can still edit everything before they start it.
    translation: A sablonok jól használhatók a csoportban ismétlődő folyamatokhoz, például projektértékeléshez, tanácskéréshez, megbeszélés előkészítéséhez, támogatási döntésekhez vagy dokumentumok jóváhagyásához. A beszélgetés indítója az indítás előtt mindent szerkeszthet.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  74d1c850f63c0518:
    english: "## How templates are used"
    translation: "## A sablonok használata"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6e5927441d982c01:
    english: |-
      1. A member selects **Start discussion** on the group page.
      2. Loomio lists the group's visible templates. Each one shows its title and subtitle.
      3. The member selects a template. Loomio opens the new discussion form, filled in from the template.
      4. The template's help appears at the top of the form as guidance.
      5. The member edits the title, context, tags, and invite list, then selects **Start discussion**.
    translation: |-
      1. Egy tag a csoport oldalán kiválasztja a **Beszélgetés indítása** lehetőséget.
      2. A Loomio felsorolja a csoport látható sablonjait. Mindegyiknél megjelenik a cím és az alcím.
      3. A tag kiválaszt egy sablont. A Loomio megnyitja az új beszélgetés űrlapját a sablonból kitöltött adatokkal.
      4. A sablon útmutatása az űrlap tetején jelenik meg.
      5. A tag szerkeszti a címet, a leírást, a címkéket és a meghívottak listáját, majd kiválasztja a **Beszélgetés indítása** lehetőséget.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  464984a60c23366b:
    english: Changing a template affects only discussions started after the change. Discussions already started from it keep their content and settings.
    translation: A sablon módosítása csak a módosítás után indított beszélgetésekre hat. A korábban indított beszélgetések tartalma és beállításai megmaradnak.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  70c22d24ec0d248b:
    english: "## Choose who is notified by default"
    translation: "## Válaszd ki, kik kapjanak értesítést alapértelmezés szerint"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  77feebf56c2ee9a7:
    english: 'The **Invite** setting controls who the new discussion form invites by default. It has two options:'
    translation: 'A **Meghív** beállítás határozza meg, hogy az új beszélgetés űrlapja alapértelmezés szerint kiket hív meg. Két lehetőség van:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6c93f4222436028f:
    english: |-
      - **Everyone in the group**: the group appears in the discussion form's **Invite** field, and every member is notified when the discussion starts.
      - **None**: the **Invite** field starts empty. Nobody is notified unless the author adds people.
    translation: |-
      - **Mindenki a csoportban**: a csoport megjelenik a beszélgetés űrlapjának **Meghív** mezőjében, és a beszélgetés indításakor minden tag értesítést kap.
      - **Egyik sem**: a **Meghív** mező üresen jelenik meg. Senki nem kap értesítést, hacsak a szerző nem ad hozzá embereket.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  17cca49613fff23d:
    english: Loomio's built-in templates, including **Blank template**, use **Everyone in the group**. If your group does not want every new discussion to notify all members, edit the templates your group uses and set **Invite** to **None**.
    translation: A Loomio beépített sablonjai, köztük az **Üres sablon**, a **Mindenki a csoportban** beállítást használják. Ha nem szeretnétek, hogy minden új beszélgetésről értesítést kapjon az összes tag, szerkeszd a csoport által használt sablonokat, és állítsd a **Meghív** mezőt **Egyik sem** értékre.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5fd184e64e0605bc:
    english: The author can always change the invite list before starting the discussion. They can remove the group to notify nobody, or add specific people instead. This setting only affects notifications. Group members can still find and read the discussion in the group, whichever option you choose.
    translation: A szerző az indítás előtt bármikor módosíthatja a meghívottak listáját. Eltávolíthatja a csoportot, hogy senki ne kapjon értesítést, vagy helyette konkrét embereket adhat hozzá. Ez a beállítás csak az értesítésekre hat. A csoport tagjai bármelyik lehetőség mellett megtalálhatják és elolvashatják a beszélgetést a csoportban.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  58f24313ca36c890:
    english: The group is added to the invite list only when the author is allowed to notify the whole group. Admins can always do this. Members can do it when **Members can notify everyone in the group** is enabled in the group's permissions.
    translation: A csoport csak akkor kerül a meghívottak listájára, ha a szerző értesítheti az egész csoportot. Az adminisztrátorok ezt mindig megtehetik. A tagok akkor tehetik meg, ha a csoport engedélyei között be van kapcsolva **A tagok mindenkit értesíthetnek a csoportban**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  33afd174376e933b:
    english: "## Template settings"
    translation: "## A sablon beállításai"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b02be20543f228a7:
    english: 'Group admins can edit a template from the action menu beside it in the template list. The form has these settings:'
    translation: 'A csoport adminisztrátorai a sablonlistában, a sablon melletti műveleti menüből szerkeszthetik a sablont. Az űrlapon ezek a beállítások szerepelnek:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f2fc57fe20100911:
    english: |-
      - **Template title**: the short name shown in the template list.
      - **Template subtitle**: one line explaining when to use the template.
      - **Template help**: instructions shown at the top of the new discussion form. Use it to explain the process and link to resources. It is not part of the discussion.
      - **Group**: whether the template starts a discussion in the group or a direct discussion. A direct discussion is visible only to the people invited to it.
      - **Default title**: a title filled in for each new discussion. The author can edit it.
      - **Example title**: an example shown in an empty title field. Use it when a default title would not fit every discussion.
      - **Tags**: tags applied to each new discussion. The author can remove them.
      - **Context**: the starting text of the discussion. Use headings, questions, or links to guide what people write.
      - **Invite**: whether to invite everyone in the group by default. See [Choose who is notified by default](#choose-who-is-notified-by-default).
      - **Poll templates**: polls suggested for this process. They are listed on the new discussion form. They also appear first when someone starts a poll in the discussion. They do not start automatically.
      - **Allow concurrent polls**: whether more than one poll can be open in the discussion at the same time.
      - **Comment length limit**: an optional maximum length for comments.
    translation: |-
      - **Sablon címe**: a sablonlistában megjelenő rövid név.
      - **Sablon alcíme**: egy sor arról, mikor érdemes használni a sablont.
      - **Sablon súgó**: az új beszélgetés űrlapjának tetején megjelenő útmutatás. Itt ismertetheted a folyamatot, és hivatkozhatsz a szükséges anyagokra. Nem lesz része a beszélgetésnek.
      - **Csoport**: a sablon a csoportban vagy közvetlen beszélgetésként indítson-e beszélgetést. A közvetlen beszélgetést csak a meghívottak láthatják.
      - **Alapértelmezett cím**: az új beszélgetésekhez előre kitöltött cím. A szerző szerkesztheti.
      - **Példa cím**: az üres címmezőben megjelenő példa. Akkor használd, ha ugyanaz az alapértelmezett cím nem illene minden beszélgetéshez.
      - **Címkék**: az új beszélgetésekhez hozzáadott címkék. A szerző eltávolíthatja őket.
      - **Leírás**: a beszélgetés kezdőszövege. Címsorokkal, kérdésekkel vagy hivatkozásokkal segítheted, hogy mit írjanak a résztvevők.
      - **Meghív**: alapértelmezés szerint meghívja-e a csoport minden tagját. Lásd: [Válaszd ki, kik kapjanak értesítést alapértelmezés szerint](#choose-who-is-notified-by-default).
      - **Szavazási sablonok**: a folyamathoz javasolt szavazások. Megjelennek az új beszélgetés űrlapján, és elsőként szerepelnek, amikor valaki szavazást indít a beszélgetésben. Nem indulnak el automatikusan.
      - **Egyidejű szavazások engedélyezése**: lehet-e egyszerre egynél több nyitott szavazás a beszélgetésben.
      - **Hozzászóláshossz-korlát**: a hozzászólások megadható maximális hossza.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a9e44919507a613:
    english: Use a default title only when it will stay accurate. Otherwise, write an example title that prompts the author to name the specific review, period, document, or decision.
    translation: Csak akkor adj meg alapértelmezett címet, ha az minden alkalommal pontos lesz. Egyébként írj olyan példacímet, amely segít a szerzőnek megnevezni az adott értékelést, időszakot, dokumentumot vagy döntést.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c5db289e27f54169:
    english: "## Example: bottle trial review"
    translation: "## Példa: a visszaváltható palackok kipróbálásának értékelése"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  89e7b8f9b36a8ae7:
    english: Oatmilk Cooperative reviews its returnable-bottle trial after each cycle. Its template is titled "Bottle trial review" and has a default title. It adds the "Bottle trial" tag. Its context asks members to read the weekly report and consider return rates, washing records, cafe feedback, and transport costs. It recommends a Sense check followed by Consent.
    translation: Az Oatmilk Cooperative minden ciklus után értékeli a visszaváltható palackok kipróbálását. A sablon címe „A palackok kipróbálásának értékelése”, és alapértelmezett címet is tartalmaz. Hozzáadja a „Palackok kipróbálása” címkét. A leírás arra kéri a tagokat, hogy olvassák el a heti jelentést, és vegyék figyelembe a visszaváltási arányt, a mosási nyilvántartást, a kávézók visszajelzéseit és a szállítási költségeket. Előbb egy helyzetfelmérést, majd egy egyetértésen alapuló döntést javasol.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f896031f8dcc2f84:
    english: This works as a template because the purpose and evidence stay the same each cycle. Only the observations and decisions change.
    translation: Ez azért használható sablonként, mert a cél és a vizsgált adatok minden ciklusban azonosak. Csak a megfigyelések és a döntések változnak.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7e5955c442f6c8ae:
    english: "## Create a template"
    translation: "## Sablon létrehozása"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c2b2bc41cbe6f6a:
    english: Group admins can select **New template** from the template list. Choose an example from Loomio's gallery or start with a blank template, then adapt it and save it.
    translation: A csoport adminisztrátorai a sablonlistában kiválaszthatják az **Új sablon** lehetőséget. Válassz egy példát a Loomio gyűjteményéből, vagy indulj egy üres sablonból, majd alakítsd át és mentsd el.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a9cb80d574e2d865:
    english: You can search or filter the gallery. An example is not added to your group until you save it.
    translation: A gyűjteményben kereshetsz és szűrhetsz. A példa csak akkor kerül a csoportodhoz, amikor elmented.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1f0dab3f50320e75:
    english: "## Manage the template list"
    translation: "## A sablonlista kezelése"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7462593f2f6d1614:
    english: When a group is created, Loomio adds a set of templates suited to the kind of group. Only **Blank template** and **Practice discussion** are visible at first. The others are hidden, and admins can unhide them.
    translation: Egy csoport létrehozásakor a Loomio a csoport típusához illő sablonokat ad hozzá. Kezdetben csak az **Üres sablon** és a **Gyakorlati megbeszélés** látható. A többi sablon rejtett, de az adminisztrátorok láthatóvá tehetik őket.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e6f7eaa63e353ef7:
    english: 'Group admins can use the action menu beside a template to:'
    translation: 'A csoport adminisztrátorai a sablon melletti műveleti menüben:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e8767178e42cd4e0:
    english: |-
      - edit its content and settings;
      - hide it from the template list;
      - unhide it from **Hidden templates**;
      - rearrange the order of visible templates;
      - export it as a JSON file; or
      - delete it.
    translation: |-
      - szerkeszthetik a tartalmát és a beállításait;
      - elrejthetik a sablonlistából;
      - láthatóvá tehetik a **Rejtett sablonok** közül;
      - átrendezhetik a látható sablonokat;
      - exportálhatják JSON-fájlként; vagy
      - törölhetik.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5d4cbc918551c211:
    english: Hiding a template keeps it for later use. Deleting a template does not delete discussions started from it.
    translation: Az elrejtett sablon később is használható. A sablon törlése nem törli a belőle indított beszélgetéseket.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c0ae844752e20ef:
    english: "## Share templates between groups"
    translation: "## Sablonok megosztása csoportok között"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  acf646688b9b79f4:
    english: Select **Export json** in a template's action menu to download it as a file. To use it in another group, select **New template**, then **Import json**. The form opens with the imported content so you can review it before saving.
    translation: A sablon műveleti menüjében válaszd a **JSON exportálása** lehetőséget a fájl letöltéséhez. Ha egy másik csoportban szeretnéd használni, válaszd az **Új sablon**, majd a **JSON importálása** lehetőséget. Az űrlap az importált tartalommal nyílik meg, így mentés előtt átnézheted.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a168253bda3147e8:
    english: Links to custom poll templates are not included in the file. Export and import those poll templates separately.
    translation: Az egyéni szavazási sablonokra mutató hivatkozások nem kerülnek bele a fájlba. Ezeket a szavazási sablonokat külön exportáld és importáld.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4833d57d46ccb98e:
    english: "## Let members create templates"
    translation: "## Sablonok létrehozásának engedélyezése a tagoknak"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1ac138e713feea59:
    english: By default, only group admins can create and edit templates. An admin can enable **Members can create templates** under **Group settings** → **Permissions**.
    translation: Alapértelmezés szerint csak a csoport adminisztrátorai hozhatnak létre és szerkeszthetnek sablonokat. Egy adminisztrátor bekapcsolhatja **A tagok sablonokat hozhatnak létre** beállítást a **Csoport beállítások** → **Engedélyek** alatt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  889e8792d7937424:
    english: When this is enabled, members can create discussion and poll templates and edit the templates they created. Admins can edit every template in the group. A member's template appears in the group's template list once it is saved, so agree on naming and review practices before enabling this permission.
    translation: Ha ez be van kapcsolva, a tagok beszélgetési és szavazási sablonokat hozhatnak létre, és szerkeszthetik a saját sablonjaikat. Az adminisztrátorok a csoport minden sablonját szerkeszthetik. A tagok sablonjai mentés után megjelennek a csoport sablonlistájában, ezért az engedély bekapcsolása előtt állapodjatok meg az elnevezés és az ellenőrzés módjában.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1284dfc3e68170d8:
    english: "## Templates for non-members"
    translation: "## Sablonok nem tagok számára"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5c701c3795724027:
    english: If **Non-members can start discussions** is enabled, people outside the group choose from the same template list. Their discussion form never invites the group by default. See [Collect private submissions](/en/user_manual/discussions/private_submissions).
    translation: 'Ha a **Nem tagok is indíthatnak beszélgetéseket** beállítás be van kapcsolva, a csoporton kívüliek ugyanabból a sablonlistából választhatnak. Az ő beszélgetési űrlapjuk alapértelmezés szerint soha nem hívja meg a csoportot. Lásd: [Privát beküldések gyűjtése](/en/user_manual/discussions/private_submissions).'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
