  91a303d3d1fb3894:
    english: 'A Loomio group is a safe place for people to meet, have discussions and make decisions. '
    translation: Um grupo no Loomio é um espaço seguro para as pessoas se reunirem, discutirem e tomarem decisões.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ea5096230dfe16d4:
    english: 'It’s a container where group members can find and share information, participate in important discussions and decisions that affect their work.  '
    translation: É um espaço onde os membros do grupo podem encontrar e compartilhar informações e participar de discussões e decisões importantes para seu trabalho.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  47903117cdc64e73:
    english: A Loomio group looks like this.  At the top of the page you will see an image and logo that you can tailor to represent your organization.  This allows people arriving into your group to see they have joined a place they recognize and feel welcome - a safe space where people feel at home, amongst friends and can participate effectively.
    translation: Esta é a aparência de um grupo no Loomio.  No topo da página, você verá uma imagem e um logotipo que pode personalizar para representar sua organização.  Assim, quem chega ao grupo reconhece o espaço e se sente à vontade para participar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3d39462ab98c79e6:
    english: "![The Oatmilk Cooperative group page, with its description and discussion list](group_page.png)"
    translation: "![Página do grupo Cooperativa Oatmilk, com a descrição e a lista de discussões](group_page.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  59f3bebbce1676a6:
    english: |-
      Choose a representative name for your group and use the group description to outline;
      - **what** this group is used for,
      - **why** this is important,
      - **who** is involved, and
      - **how** members can participate.
    translation: |-
      Escolha um nome que represente seu grupo e use a descrição para explicar:
      - **para que** o grupo é usado,
      - **por que** isso é importante,
      - **quem** participa e
      - **como** os membros podem participar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  79ae54bca7eb1797:
    english: You may also include information like a code of conduct, terms of reference or other governing documents for the group.
    translation: Você também pode incluir um código de conduta, termos de referência ou outros documentos que orientem o funcionamento do grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '018c400616dad5f4':
    english: If you are preparing a new group, see [Introducing Loomio to your group](/en/user_manual/overview/introducing_loomio) for a practical sequence from choosing the first piece of work through to recording an outcome.
    translation: Se você está preparando um novo grupo, consulte [Apresentando o Loomio ao seu grupo](/en/user_manual/overview/introducing_loomio) para seguir um roteiro prático, desde a escolha da primeira atividade até o registro de uma conclusão.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1bda53ca8e31780c:
    english: "## Administration, Facilitation and Moderation - Code of Conduct"
    translation: "## Administração, facilitação e moderação - Código de conduta"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1091f77d5ab879ed:
    english: 'Loomio is built to foster inclusive participation, diversity and trust - helping groups make better decisions together. '
    translation: O Loomio foi criado para apoiar a participação inclusiva, a diversidade e a confiança, ajudando os grupos a tomar decisões em conjunto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1ac058350eea2c6d:
    english: 'Some topics bring tension in a group.  So it''s important to allow a robust discussion to take place, while ensuring it is also a safe place, particularly for vulnerable people in your group. '
    translation: Alguns assuntos podem gerar tensão em um grupo.  Por isso, é importante permitir uma discussão aprofundada e manter um espaço seguro, especialmente para as pessoas mais vulneráveis do grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  999bb2251bf623cd:
    english: 'We recommend establishing a code of conduct for your group, to help everyone be aware of their responsibility for appropriate behaviour and encourage self-regulation. '
    translation: Recomendamos estabelecer um código de conduta para o grupo. Ele ajuda todos a entender sua responsabilidade por um comportamento adequado e a regular a própria conduta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9a77fa2d5f4fdb01:
    english: See the [Facilitator's Guide](/en/guides/facilitators_guide/commencing#culture-protocol-expectations) to further explore the value of a code of conduct.
    translation: Consulte o [Guia de facilitação](/en/guides/facilitators_guide/commencing#culture-protocol-expectations) para saber mais sobre a importância de um código de conduta.
    status: machine
