  554dc5536fdb1a60:
    english: Alex then agrees. Three of five eligible voters have participated, reaching the 60 percent quorum. The requirement now shows a green check mark. Jamie can close the poll early or wait for the remaining voters.
    translation: Затем Алекс соглашается. Проголосовали трое из пяти, и кворум в 60 процентов достигнут. Рядом с требованием появляется зелёная галочка. Джейми может закрыть опрос досрочно или дождаться остальных голосов.
