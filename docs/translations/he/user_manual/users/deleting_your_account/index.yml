  77235d504409d763:
    english: Sign in to Loomio.  Go to the sidebar from the (☰) menu icon at screen top left Click on your account avatar or initials, at the top right of your screen.
    translation: יש להיכנס ל-Loomio. יש לפתוח את סרגל הצד באמצעות סמל התפריט (☰) בפינה השמאלית העליונה של המסך. לאחר מכן יש ללחוץ על תמונת החשבון או על ראשי התיבות בפינה הימנית העליונה.
