navigation_title: В процессе
blocks:
  30163152525e029c:
    english: "# Underway"
    translation: "# В процессе"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  02feef9bf78ef420:
    english: "## Where are we on the Map?"
    translation: "## На каком этапе мы находимся?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '083f066ff9a3cfde':
    english: People feel more confident and better held if they can orient themselves on a timeline or agenda. They want to know what they’re doing now, what’s coming up, and to be reminded of what they’ve already done. Understanding the overall shape of the process helps people understand how to contribute effectively.
    translation: Людям проще участвовать, когда они понимают, на каком этапе находятся. Им важно знать, что происходит сейчас, что будет дальше и что уже сделано. Общее представление о ходе работы помогает понять, как внести полезный вклад.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ea2ef3e629108828:
    english: For example if they can see there’s a Q&A section later, they'll be more willing to hold their questions during a presentation. If it’s clear that there’s a divergent phase and then a convergent phase, people will hold back from jumping to solutions too soon. People need to know what kind of input they are being asked for, and when.
    translation: Например, если люди знают, что позже будет время для вопросов и ответов, им проще отложить вопросы до конца выступления. Если ясно, что сначала группа исследует разные идеи, а затем выбирает решение, участники не будут спешить с готовыми ответами. Людям нужно знать, какого вклада от них ждут и когда.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7a5d009dfc4e0f6b:
    english: Mapping the process well enough to communicate it also challenges facilitators to fully think through the journey, and helps them make sure each part of the process has a purpose that builds a cohesive whole. A well-facilitated experience follows a logical progression.
    translation: Чтобы понятно представить ход работы, ведущим нужно самим продумать его целиком. Это помогает убедиться, что у каждого этапа есть цель и все этапы связаны между собой. Хорошо организованный процесс развивается последовательно.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aabfa9d842af2688:
    english: On Loomio
    translation: В Loomio
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  af3599a59685a726:
    english: |-
      * A Loomio decision already follows a basic logical progression (which is why it works): Gather (open/invite), Discuss (divergent), Propose (convergent), Decide and Act (conclude).
      * Many Loomio users are employing the tool as part of explicitly mapped experiences, such as a multi-stage consultation process.
      * We offer some tools of facilitators to help “reveal the map” to users, such as the group description field, and proposal deadlines. These can be proactively leveraged to increase context for participants.
    translation: |-
      * Принятие решения в Loomio уже следует простой последовательности: собрать участников и информацию (открыть обсуждение и пригласить людей), обсудить разные точки зрения, выдвинуть предложение, принять решение и приступить к действиям.
      * Многие используют Loomio как часть заранее спланированного процесса, например консультации в несколько этапов.
      * Ведущие могут показывать участникам ход работы с помощью описания группы и сроков голосования по предложениям. Эти инструменты помогают заранее дать участникам нужный контекст.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  228ae545a39cd553:
    english: "## The Art of Noticing"
    translation: "## Искусство замечать"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  04155220f602a7e8:
    english: Noticing is probably the most critical facilitation skill of all. The facilitator uses noticing to figure out what interventions or responses are needed, how to invite the right contributions, and to help the group notice itself. The value of facilitation is having someone paying attention and acting on what they notice, while others may be focused on specific content or their own agendas.
    translation: Умение замечать происходящее — один из важнейших навыков ведущего. Оно помогает понять, когда нужно вмешаться или ответить, как пригласить людей к участию и как помочь группе увидеть собственную динамику. Ценность работы ведущего в том, что кто-то следит за процессом и действует с учётом замеченного, пока остальные сосредоточены на теме или своих задачах.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  90a03fdb345369b7:
    english: 'Effective noticing is a combination of good informational inputs, and sensitivity and skill to interpret them. Many facilitators talk about “reading” a room: emotional reactions, tensions,  power dynamics. Facilitators need effective information signalling systems.'
    translation: 'Чтобы замечать важное, нужны информация, чуткость и умение её осмыслить. Ведущие часто говорят, что нужно «считывать» обстановку: эмоциональные реакции, напряжение и распределение влияния. Для этого им нужны способы вовремя получать сигналы о происходящем.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  49b0f2cc823e0384:
    english: |-
      * Many current features assist with noticing — the biggest one is probably watching how the pie is shaping up in a proposal.
      * The software notices some things: who has and has not yet participated, what topics are being raised, who has and has not accepted their group invitation, etc.
      * On Loomio, a single facilitator can read across dozens of discussions at the same time, see clearly what’s being shared, and act accordingly.
      * Talking online can make the implicit explicit, and therefore easier to notice.
      * Communicating in writing can be very good for naming what’s being noticed and why a certain action is being taken in response. For example, you can quote someone’s exact words and reflect back what’s revealed by them. Or you can do the same thing at the level of a whole discussion, picking out a range of quotes and noticing themes or emerging conflicts.
      * Noticing is much easier when you slow things down, which is one of Loomio’s great advantages — asynchronous communication you can read at any pace. It also makes it possible to notice across time, referring directly to past discussions.
      * Because you can have simultaneous discussions, it's possible to have a layer of “meta” discussion (aka “blue hat”, aka discussion about the discussion) at the same time as progressing the main discussions. So you can collectively have a space to practice noticing without slowing down the process.
    translation: |-
      * Многие функции Loomio помогают замечать происходящее. Пожалуй, самый наглядный пример — наблюдение за тем, как меняется круговая диаграмма голосования по предложению.
      * Программа показывает, кто уже участвовал, а кто ещё нет, какие темы поднимаются и кто принял приглашение в группу.
      * В Loomio один ведущий может одновременно следить за десятками обсуждений, видеть, чем делятся участники, и действовать с учётом этого.
      * В общении через интернет то, что обычно остаётся невысказанным, можно выразить словами — и тогда это проще заметить.
      * Письменное общение помогает назвать то, что вы заметили, и объяснить, почему решили действовать определённым образом. Например, вы можете точно процитировать чьи-то слова и показать, что за ними стоит. Так же можно рассмотреть обсуждение целиком: выбрать несколько цитат и указать на общие темы или возникающие разногласия.
      * Замечать происходящее легче, когда процесс идёт медленнее. Это одно из преимуществ Loomio: асинхронное общение можно читать в удобном темпе. Можно также проследить изменения со временем, обращаясь к прошлым обсуждениям.
      * Поскольку обсуждения могут идти одновременно, рядом с основными темами можно вести обсуждение самого процесса — «метаобсуждение», или обсуждение в режиме «синей шляпы». Так группа может вместе осмыслять происходящее, не замедляя основную работу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cdb52080510ddb69:
    english: "## Hearing Diverse Voices"
    translation: "## Услышать разные голоса"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  150ff74c2805696b:
    english: In our society, multiple layers of history, power dynamics, culture, and psychology conspire to amplify certain voices and suppress others. This plays out at every level of experience, from our innermost subconscious beliefs to our political system and laws.
    translation: 'История, распределение власти, культура и психология влияют на то, чьи голоса в обществе звучат громче, а чьи остаются незамеченными. Это проявляется на всех уровнях: от глубинных убеждений до политической системы и законов.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a3dccb91d161d18a:
    english: But the best ideas do not always come from the loudest voices, and the role of facilitation is to counteract these biases. It’s important to be aware of the dynamics we are collectively grappling with if our goals are social justice, group effectiveness, and high quality decision making.
    translation: Но лучшие идеи не всегда высказывают самые громкие участники. Задача ведущего — помогать группе преодолевать такие перекосы. Если группа стремится к социальной справедливости, эффективной работе и качественным решениям, ей важно замечать эту динамику.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5e8160d5b0da948a:
    english: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../rich_200.png"> If you want to innovate, you have to make space for different points of view — luckily, this is also what you need to do if you want a team where everyone is empowered. All kinds of cultural and technical factors conspire to privilege some voices at the expense of others. There are many practices you can implement to systematically challenge that bias, but just being aware of it is a good starting point. — Richard Bartlett'
    translation: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../rich_200.png"> Для новых идей нужно пространство для разных точек зрения. Оно же необходимо команде, в которой каждый может действовать самостоятельно. Культурные и технические факторы дают одним голосам преимущество перед другими. Есть много способов последовательно устранять этот перекос, но для начала полезно просто его замечать. — Ричард Бартлетт'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  63e0bdf44ad2df5f:
    english: Our lived human experience is to inhabit a singular consciousness, so humans tend to forget that others experience the world differently. Even within a seemingly homogenous group, there is incredible diversity — perspectives, pace, preferences. Internalising this truth — that others are different from myself — is a central personal growth challenge.
    translation: Каждый человек воспринимает мир через собственный опыт, поэтому легко забыть, что другие видят его иначе. Даже в группе, которая кажется однородной, люди сильно различаются взглядами, темпом и предпочтениями. Принять то, что другие люди отличаются от вас, — важная часть личного развития.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  62f6a86aa220b787:
    english: There is no such thing as one size fits all. Any mode of interacting enhances some voices and quiets others, or emphasises different tendencies within an individual. So, it’s necessary to employ a range of approaches to invite the best from multiple diverse voices.
    translation: Единого подхода для всех нет. Любой способ взаимодействия помогает одним людям высказаться, а другим мешает; он также может раскрывать разные стороны одного человека. Поэтому стоит использовать разные способы участия, чтобы каждый мог внести свой лучший вклад.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8f9c1b2c0e40b1fc:
    english: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../silvia_200.png"> Check you’re catering to different learning styles. One simple way to check is with the Head, Heart, Hands metaphor. People who learn with their Head need facts and detailed information. A Heart learner thrives off stories. They need an emotional connection to the work. Learning with the Hands is all about doing stuff and getting active. — Silvia Zuur'
    translation: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../silvia_200.png"> Учитывайте, что люди учатся по-разному. Проверить это помогает метафора головы, сердца и рук. Тем, кто учится «головой», нужны факты и подробная информация. Тем, кто учится «сердцем», помогают истории и эмоциональная связь с работой. Те, кто учится «руками», лучше усваивают новое через действие. — Сильвия Зюр'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  04a3a7bc850913ab:
    english: One of the best approaches to bringing out and weaving together diverse voices is to invite diverse modes of interaction, which will serve different needs and preferences, and level the communication playing field.
    translation: Один из лучших способов услышать разные голоса и объединить их вклад — предложить разные формы взаимодействия. Это помогает учесть потребности и предпочтения участников и дать каждому равную возможность высказаться.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ba31b7da59193745:
    english: 'Some classic design building blocks to address communication diversity in collaborative communication:'
    translation: 'Вот несколько распространённых способов учесть различия в общении при совместной работе:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fbcafe73c1d8720b:
    english: |-
      * **Group size** — individual reflection, pairs, small group, large group, one-to-one, one-to-many, many-to-many.
      * **Medium of expression** — writing, drawing, video, singing, dance, flowcharts, equations, symbols, stories, tears, laughter, debate, etc.
      * **Discussion protocols** — rounds (hear from each person once before moving on), rate limiting (you can only speak again after two others have spoken), talking stick (only speak when you have the stick — no interrupting), time-limited contributions (you can talk for 1 minute only), time-unlimited contributions (you can hold the floor indefinitely and everyone will deeply listen), tracking contributions (how much have women vs men spoken, etc), holding periods of silence between speakers (for processing and reflection).
      * **Embrace silence** *Silence is only awkward if you let it be awkward. Silence is a chance for people to think. — Silvia Zuur*
    translation: |-
      * **Размер группы** — личное размышление, работа в парах, малых и больших группах, общение один на один, один со многими или многие со многими.
      * **Форма выражения** — текст, рисунок, видео, пение, танец, схемы, уравнения, символы, истории, слёзы, смех, дискуссия и другое.
      * **Правила обсуждения** — круг высказываний (каждый говорит один раз, прежде чем группа продолжит), ограничение частоты выступлений (снова говорить можно только после двух других участников), «говорящий предмет» (говорит только тот, у кого он в руках; перебивать нельзя), ограничение времени выступления (например, одна минута), выступление без ограничения времени (человека внимательно слушают столько, сколько ему нужно), учёт того, кто и сколько говорил (например, женщины и мужчины), паузы между выступлениями для осмысления услышанного.
      * **Принимайте тишину** *Тишина становится неловкой, только если считать её неловкой. Она даёт людям время подумать. — Сильвия Зюр*
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ff925b4be393907c:
    english: |-
      * The design of Loomio has always been about “hearing all voices”, including people who aren’t able to be there in person, are quieter, are busy, etc.
      * In text, every voice is more or less the same “volume” and “speed”. Written asynchronous communication offers a kind of leveling of the field.
      * The proposal feature is essentially a “round”, assisting groups to facilitate each individual person having their say (if they want to) on an equal basis.
      * Loomio enables multi-media (links, videos, images, diagrams, supporting evidence), which serve various communication styles.
      * Loomio itself is pretty basic, but with active facilitation and group maturity, it is possible to employ discussion protocols “manually” using cultural norms or agreed rules (eg, a discussion where everyone only posts once until everyone else has participated).
      * Loomio provides flexible tools for small and large group interaction, using parent groups and subgroups. Some large consultation processes have involved multiple smaller groups which are then synthesised into a larger outcome.
      * People who want time for individual reflection can take time out and process their thoughts, and then come back and share a longer comment or link to a document. This is a “self-selecting” example of creating interplay between individual and group communication.
      * Loomio accessibility features and multi-lingual translations make it possible for people with very different needs to participate as equals in one discussion. This is a key example of how technology can enable equitable participation in a way that’s nearly impossible in person.
      * If someone is contributing more than their share (talking too much), it’s technically possible to just scroll on by (whereas in person this behaviour can totally dominate the interaction). However, people posting “walls of text” can still be detrimental to a balanced Loomio discussion.
    translation: |-
      * Loomio изначально создавался, чтобы помогать слышать всех: в том числе тех, кто не может присутствовать лично, редко выступает или занят.
      * В тексте голоса участников звучат примерно с одинаковой «громкостью» и «скоростью». Асинхронное письменное общение помогает уравнять возможности.
      * Голосование по предложению по сути напоминает круг высказываний: каждый участник группы может выразить свою позицию на равных, если хочет.
      * Loomio поддерживает разные материалы — ссылки, видео, изображения, схемы и подтверждающие данные. Они подходят людям с разными способами общения.
      * Возможности Loomio сами по себе довольно просты. Но при активной работе ведущего и налаженном взаимодействии в группе правила обсуждения можно применять вручную — через общие нормы и договорённости. Например, участники могут договориться публиковать не более одного сообщения, пока не выскажутся остальные.
      * Loomio даёт гибкие инструменты для работы малых и больших групп: основные группы и подгруппы. В некоторых крупных консультациях несколько небольших групп сначала работали отдельно, а затем их результаты объединяли в общий итог.
      * Те, кому нужно время на самостоятельное размышление, могут сделать паузу, обдумать мысли, а затем вернуться с развёрнутым комментарием или ссылкой на документ. Так личная работа сочетается с общением в группе.
      * Возможности доступности и переводы Loomio позволяют людям с разными потребностями участвовать в одном обсуждении на равных. Технология помогает обеспечить равное участие там, где при личной встрече это было бы почти невозможно.
      * Если кто-то пишет слишком много, другие могут прокрутить его сообщения. При личной встрече такой человек мог бы занять всё пространство разговора. Однако длинные сплошные тексты тоже могут нарушить баланс обсуждения в Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bb74ebca94285a48:
    english: "## Counter Cognitive Bias"
    translation: "## Как уменьшить влияние когнитивных искажений"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c8d4a9a10da47a62:
    english: Human brains have evolved over millions of years to balance quick, efficient “good enough” thinking with slow, expensive, deep analysis. This allows us to use instincts, heuristics, and generalisations as cheap and fast solutions most of the time, and to engage deep analysis when needed.
    translation: Человеческий мозг формировался миллионы лет, сочетая быстрое мышление, которое даёт «достаточно хороший» ответ, с медленным и трудоёмким глубоким анализом. Поэтому большую часть времени мы опираемся на интуицию, простые правила и обобщения, а при необходимости разбираем вопрос подробнее.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3a35775e59cdea17:
    english: But sometimes we get it wrong. In fact, there are well-known “bugs” in the human cognition program, which can keep people from making the best decisions. This is further complicated in group situations. We need to be aware of these dynamics.
    translation: Но иногда мы ошибаемся. Известны устойчивые ошибки мышления, которые мешают принимать лучшие решения. В группе их влияние ещё сложнее. Эту динамику важно учитывать.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e3d808eb17e1aa5a:
    english: There is a huge [range of cognitive biases](https://en.wikipedia.org/wiki/List_of_cognitive_biases) (this list is really worth a read), all of which have potential impacts on decision making and collaboration. Facilitation can be an important tool to deal with them, to raise awareness of their existence, encourage proactive choices about them. For example, asking when is it more important to move quickly and when is it more important to be accurate.
    translation: Существует множество [когнитивных искажений](https://en.wikipedia.org/wiki/List_of_cognitive_biases), которые могут влиять на решения и совместную работу. Ведущий может помочь группе замечать их и осознанно выбирать, как действовать. Например, обсудить, когда важнее принять решение быстро, а когда — добиться большей точности.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c4755a454121a7b6:
    english: One powerful tool to counter cognitive bias and increase quality of decisions is structured processes and communication. The challenge of following a process instead of the “path of least resistance” can help highlight thinking errors and bias. Facilitators sometimes push for things that feel challenging or trigger resistance, precisely because brains are being asked to step out of familiar patterns. Discipline in this area can help groups achieve their deeper goals, which can be worth some temporary discomfort.
    translation: Структурированный процесс и общение помогают уменьшить влияние когнитивных искажений и повысить качество решений. Если следовать намеченному процессу, а не идти по пути наименьшего сопротивления, ошибки мышления и предубеждения становятся заметнее. Иногда ведущий предлагает шаги, которые кажутся трудными и вызывают сопротивление, потому что они требуют выйти за рамки привычного мышления. Такая дисциплина помогает группе достичь важных целей, даже если поначалу возникает дискомфорт.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  99caa45d2ab4ae8b:
    english: 'Some examples of processes that can help mitigate cognitive bias:'
    translation: 'Вот несколько методов, которые помогают уменьшить влияние когнитивных искажений:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ebd2c767ea8fae2e:
    english: |-
      * [De Bono’s Hats](http://www.debonoforschools.com/asp/six_hats.asp): different colored hats participants can wear (metaphorically) to step outside their own opinions and try on different modes of thinking.
      * Checklists: thinking “ruts” can cause us to miss even obvious things (especially in areas we're very familiar with), so a checklist can weed out errors.
      * The Five Why’s: only asking why once or twice can mislead you into thinking you’ve reached the conclusion before you get to the root level of the issue. Asking five times tends to get to the bottom of it.
      * Mental models: exercises like [SWOT analysis](https://en.wikipedia.org/wiki/SWOT_analysis), the [business model canvas](https://en.wikipedia.org/wiki/Business_Model_Canvas), or any number of countless other structured information gathering exercises can guide you to cleaner analysis and reveal assumptions.
    translation: |-
      * [Шесть шляп де Боно](http://www.debonoforschools.com/asp/six_hats.asp): участники мысленно надевают шляпы разных цветов, чтобы выйти за пределы собственной позиции и попробовать разные способы мышления.
      * Контрольные списки: привычные схемы мышления заставляют нас упускать даже очевидное, особенно в знакомых областях. Список помогает заметить ошибки.
      * Метод пяти «почему»: один или два вопроса «почему?» могут создать ощущение, что причина уже найдена. Если спросить пять раз, чаще удаётся добраться до сути проблемы.
      * Модели мышления: [SWOT-анализ](https://en.wikipedia.org/wiki/SWOT_analysis), [канва бизнес-модели](https://en.wikipedia.org/wiki/Business_Model_Canvas) и другие структурированные способы сбора информации помогают точнее анализировать ситуацию и выявлять скрытые предположения.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  073fb22a0e7cd744:
    english: |-
      * Diverse information and inputs can disrupt assumptions or bias. This is built into Loomio’s basic design: by enabling more voices to contribute to a discussion on a more equitable basis, you have a chance to escape “groupthink”.
      * Loomio gives participants the ability to dissent constructively. Safe and valued dissent is essential for a culture of critical thinking.
      * Communicating asynchronously in writing slows conversation down and lets it be more carefully considered, giving people a chance to think more carefully and avoid cognitive errors.
      * Loomio invites people into a semi-structured process that leads to more considered decision making. Loomio can be used for a huge range of different processes, but simply having *some* structure in a discussion enables other possibilities.
    translation: |-
      * Разная информация и разные точки зрения помогают пересматривать предположения и замечать предубеждения. Это заложено в основу Loomio: когда больше людей могут участвовать в обсуждении на равных, группе проще избежать группового мышления.
      * Loomio позволяет участникам конструктивно выражать несогласие. Возможность безопасно возражать и понимание ценности возражений необходимы для критического мышления.
      * Асинхронное письменное общение замедляет разговор и даёт время обдумать сказанное, что помогает избегать ошибок мышления.
      * Loomio предлагает частично структурированный процесс, который помогает принимать более взвешенные решения. Его можно использовать для самых разных задач, но даже *небольшая* структура обсуждения открывает новые возможности.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4ae16a63e2dd047a:
    english: "## Balancing Divergent & Convergent"
    translation: "## Баланс между поиском идей и выбором решения"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2983c2d32846ebd5:
    english: The “diamond” of divergence and convergence is a conversational shape. It expands outward at first — opening up space for ideas, information, and different perspectives — then begins to come to a point. The right timing for this shift is key for effective facilitation of action-oriented, productive, collaborative discussions.
    translation: "«Ромб» расхождения и схождения описывает ход разговора. Сначала он расширяется: группа собирает идеи, информацию и разные точки зрения. Затем сужается: участники приближаются к решению. Для продуктивного обсуждения, которое ведёт к действиям, важно выбрать подходящий момент для этого перехода."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bce4c52d377dbdbd:
    english: If divergence is missed out or cut off too early, there will be a lack of information to work with, people may not feel heard, and great ideas will be left unsaid. If convergence is missed out or left too late, discussion can continue indefinitely without reaching an actionable conclusion, burning participants energy and failing to achieve results.
    translation: Если слишком рано закончить поиск разных идей или вовсе пропустить его, группе не хватит информации. Люди могут почувствовать, что их не услышали, а ценные идеи останутся невысказанными. Если слишком поздно перейти к выбору решения или не сделать этого вовсе, обсуждение может продолжаться бесконечно, отнимая силы участников и не приводя к результату.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9f787be37e0492cc:
    english: Each sub-phase of the larger process also requires awareness of the right timing and intervention. Divergence consists of introduction, clarification, ideation. Convergence consists of analysis, conclusion, commitment. Some discussions succeed with only a vague nod toward the diamond, while others are served by a meticulous breakdown of each phase and sub-phase.
    translation: На каждом этапе важно вовремя выбирать подходящие действия. Поиск идей включает постановку вопроса, уточнение и выработку вариантов. Выбор решения включает анализ, выводы и принятие обязательств. Для одних обсуждений достаточно общего понимания этой схемы, другим полезно подробно распланировать каждый этап.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d8c7970db55ea11:
    english: Within a group, different individuals will usually tend to prefer one mode or the other, and the group as a whole will have collective tendencies. Imbalance looks like too much blue sky thinking, or jumping to solutions. Facilitation can help each person and the group as a whole spend the right amount of energy on the different modes.
    translation: Одним участникам обычно ближе поиск вариантов, другим — выбор решения. У группы в целом тоже складываются предпочтения. Дисбаланс проявляется, когда группа слишком долго обсуждает отвлечённые идеи или слишком быстро переходит к готовому решению. Ведущий помогает всем уделить каждому этапу достаточно внимания.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  36405c3bfcb951b6:
    english: |-
      * The core Loomio process does an excellent job of guiding groups to touch on each phase of the process, with the discussion being divergent and proposals being convergent. Awareness of the diamond was a big inspiration for the original design of the Loomio process.
      * Loomio helps groups to use the diamond in dynamic ways, such as when an attempt to converge (a proposal) ends up becoming a deeper level of divergence (disagreement), revealing or clarifying information to support an even better convergence (iterated proposal).
      * Some of Loomio’s basic features go a long way toward supporting each mode, such as notifications to group members when a new discussion is starting (prompting divergent contribution), and deadlines on proposals (prompting participation in convergence).
      * Loomio users are already able to use the existing feature set to facilitate convergence — namely starting a proposal. Good use of proposals is one of the most obvious symptoms of an effective Loomio group, and simply advising users to start more proposals unblocks many groups who are having issues.
    translation: |-
      * Основной процесс Loomio помогает группам пройти все этапы: обсуждение расширяет круг идей, а голосование по предложениям помогает выбрать решение. Схема «ромба» во многом повлияла на первоначальный замысел Loomio.
      * Loomio позволяет гибко проходить эти этапы. Например, попытка прийти к решению через предложение может выявить разногласия и новые сведения. После их обсуждения группа сможет выдвинуть более удачное предложение.
      * Даже простые функции Loomio поддерживают разные этапы. Уведомление о новом обсуждении приглашает участников предложить идеи, а срок голосования по предложению побуждает их участвовать в выборе решения.
      * Чтобы помочь группе выбрать решение, достаточно воспользоваться существующей функцией Loomio — начать голосование по предложению. Умение вовремя выдвигать предложения часто отличает эффективно работающие группы. Иногда совет чаще выдвигать предложения помогает группе сдвинуться с места.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  af83d6e3b408e008:
    english: "## Working with Scope"
    translation: "## Как определить рамки обсуждения"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  209f071ae0c7ae0f:
    english: Successful collaboration often depends on biting off the right size pieces in the right order.
    translation: Успешная совместная работа часто зависит от того, удаётся ли разбить задачу на части подходящего размера и взяться за них в правильном порядке.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  24658aca54702290:
    english: 'You can apply a “project management” mindset to facilitation, designing for questions like:'
    translation: 'При планировании работы ведущий может опираться на подходы управления проектами и задать такие вопросы:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '09c7ee57551e1980':
    english: |-
      * What are the dependencies (what’s the critical path, which things need to be done first to enable other things)?
      * What are the most important bits to focus on? What can be left out?
      * What is an achievable scope to tackle at a given time to get to a useful place with the time, energy, and information available?
    translation: |-
      * Что от чего зависит? Какие шаги нужно выполнить сначала, чтобы стали возможны следующие?
      * На чём важнее всего сосредоточиться? Что можно оставить за рамками?
      * Какую часть задачи реально решить сейчас с учётом имеющегося времени, сил и информации?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bca4d47c3dc6f3cf:
    english: It’s important not to try to “boil the ocean”, and instead break things down into manageable chunks. You can build toward a bigger outcome in a series of smaller pieces. It’s often better to achieve something small but useful, than to fail to reach any conclusions. It’s also possible to get too bogged down in details and fail to hit the bigger issues.
    translation: Не пытайтесь решить всё сразу. Разбейте задачу на части, с которыми можно справиться. Несколько небольших шагов могут привести к значимому результату. Часто лучше добиться небольшого, но полезного результата, чем не прийти ни к какому выводу. При этом можно увязнуть в деталях и упустить главные вопросы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ce5ed5c5115c7b90:
    english: In a collaboration, no one knows exactly what will emerge, so scope must evolve with the discussion. Whether branching out at a given moment is a distraction or an evolution is a judgement call. Too much rigidity and too much flexibility can both be damaging. Often times it’s not about whether something is relevant or not, but a question of sequence and timing in terms of what will be most constructive.
    translation: При совместной работе никто не знает заранее, к чему приведёт обсуждение, поэтому его рамки должны меняться по ходу дела. Когда стоит расширить тему, а когда это лишь отвлечёт участников, приходится решать по ситуации. Излишняя жёсткость и излишняя гибкость одинаково мешают. Часто вопрос не в том, относится ли тема к делу, а в том, когда и в каком порядке к ней лучше обратиться.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3510d751f00b1ae6:
    english: "> If you plan a session with multiple, interlinked parts – each one building on the other, and all leading to a life-changing, mind-exploding conclusion – and you can pull it off, then that’s amazing. But more often than not, a complicated session will go over-time and may not hit the participant’s wants and needs. - Silvia Zuur"
    translation: "> Если вы запланировали встречу из нескольких связанных частей, каждая из которых опирается на предыдущую, и всё ведёт к поразительному выводу, а затем сумели провести её по плану — прекрасно. Но чаще сложная встреча затягивается и может не ответить на запросы и потребности участников. — Сильвия Зуур"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9204dd47d88ac308:
    english: |-
      ## A series of small yes's
      Lumping too many conversations together simply creates confusion. Frustrated groups are often helped by breaking things down. If an issue seems hopeless, complex or conflicted, it can be possible to separate out individual questions and reach consensus on them, starting with the easiest things to agree. Then when it comes to points of disagreement, you can pare it down to only the crux of the issues and work on them in a focused way.
    translation: |-
      ## Несколько небольших согласований
      Если объединить слишком много вопросов в одно обсуждение, возникнет путаница. Группам, которые зашли в тупик, часто помогает разделение задачи на части. Если вопрос кажется неразрешимым, сложным или спорным, выделите отдельные вопросы и ищите согласие по каждому из них, начиная с самых простых. Тогда можно сосредоточиться на сути оставшихся разногласий.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2d86c0488159e380:
    english: |-
      * Topic-based discussion threads are a powerful tool for effective scope — even more than face-to-face conversation, Loomio discussions can be usefully delineated to encourage focus on a specific question, while other aspects can be addressed simultaneously in other threads.
      * We often see users making facilitation interventions like “That’s out of the scope of this topic, but why don’t you start a new discussion about it?”
      * The act of creating a Loomio group helps define who are we and what are we here to discuss. This helps participants manage scope.
      * The sequential proposals design of Loomio is very good for a “series of small yess's” approach — you can build small agreements while maintaining context in a single discussion thread, and build on the history of previous proposals.
      * Asynchronous online communication can allow some people to go way out of scope without holding up others. They can simply start a new discussion or subgroup and go as deep and long as they want, while the main scope of the group is maintained.
      * The discussion context box and group description are spaces to define the scope of a conversation or group, respectively.
    translation: |-
      * Тематические ветки обсуждения помогают задавать чёткие рамки. В Loomio даже проще, чем при личном разговоре, сосредоточиться на одном вопросе, а другие вопросы параллельно обсуждать в отдельных ветках.
      * Пользователи нередко помогают удерживать рамки обсуждения словами: «Это выходит за рамки темы. Почему бы вам не начать об этом новое обсуждение?»
      * Создание группы в Loomio помогает определить, кто в неё входит и что участники будут обсуждать. Так проще удерживать рамки работы.
      * Последовательные предложения в Loomio подходят для подхода «несколько небольших согласований»: в одной ветке можно шаг за шагом достигать согласия, сохраняя контекст и опираясь на предыдущие предложения.
      * Асинхронное общение позволяет отдельным участникам далеко уходить от основной темы, не задерживая остальных. Они могут начать новое обсуждение или создать подгруппу и подробно рассмотреть свой вопрос, пока группа продолжает работу над основной темой.
      * Описание обсуждения и описание группы позволяют задать рамки соответствующего обсуждения или работы группы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0b70d200637c265f:
    english: "## Pacing & Timing"
    translation: "## Темп и выбор момента"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d2b056c4b3edb54a:
    english: A productive conversation has a rhythm. The right beat comes from a complex combination of factors and often feels intuitive, like a musician improvising. When is the moment to go deeper, or pull back? When is it right to bring in new information, or further delve into what’s already on the table? This is pacing.
    translation: У продуктивного разговора есть ритм. Он зависит от многих факторов, и подходящий момент часто приходится находить интуитивно, как музыканту во время импровизации. Когда стоит углубиться в вопрос, а когда сделать шаг назад? Когда добавить новую информацию, а когда подробнее рассмотреть уже сказанное? От этих решений зависит темп обсуждения.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d421940782402742:
    english: Different participants will have different needs and preferences — some will need reigning in, while others need pulling along. The right pace emerges when a creative tension between digging deeper and moving forward is found. When it’s off, people will feel frustrated — either impatient or left behind.
    translation: 'У участников разные потребности и предпочтения: одних нужно сдерживать, других — побуждать к участию. Подходящий темп возникает, когда группа находит равновесие между углублением в тему и движением вперёд. Если темп не подходит, одни начинают торопиться, а другие не успевают за обсуждением.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7165c12910a2b3bb:
    english: |-
      * Because it’s asynchronous, people can read and respond at their own pace on Loomio, allowing a natural pace to emerge.
      * It’s possible to scroll right past people moving slowly and push for forward momentum, and simultaneously possible to continue digging into something slowly while others press forward. This is not possible in synchronous communication.
      * Proposal deadlines are a pace-setting tool. Topics that need to move quickly use shorter timeframes, and longer ones can have more time. Different decisions can go at different speeds.
      * It’s easy to modulate your own pace of engagement. If a conversation is moving too fast or slowly for you, you can drop your input and step back, and then return later when a proposal is raised.
      * It’s interesting to note how a “fast” decision on Loomio is 1 or 2 days, while a “fast” decision in person is more like 5 minutes. And yet, Loomio does not seem “slow”, the way taking 2 days to reach a decision in person would. Loomio runs decisions in parallel to other ongoing work, and it's much more efficient gathering everyone’s input on Loomio over 2 days versus having to schedule an in-person meeting.
      * Facilitation on Loomio could be likened to “bullet time” (when Neo can stop time and just walk around a bullet in the Matrix) — you can walk through a living conversation frame by frame. It’s like a superpower.
    translation: |-
      * Общение в Loomio асинхронно: участники могут читать и отвечать в своём темпе. Это помогает группе найти удобный ритм.
      * Можно двигать обсуждение вперёд, не дожидаясь тех, кому нужно больше времени, а они могут продолжать разбирать вопрос, пока остальные идут дальше. При общении в реальном времени это невозможно.
      * Сроки для предложений помогают задавать темп. Для срочных вопросов можно назначить короткий срок, для других — более длинный. Разные решения могут приниматься с разной скоростью.
      * Вы можете менять темп своего участия. Если обсуждение идёт для вас слишком быстро или медленно, оставьте свой комментарий, сделайте паузу и вернитесь позже, когда появится предложение.
      * «Быстрое» решение в Loomio может занять один или два дня, а при личной встрече — около пяти минут. При этом Loomio не кажется медленным, хотя двухдневное очное обсуждение воспринималось бы иначе. Решения в Loomio принимаются параллельно с другой работой, а собрать мнения всех участников за два дня часто проще, чем организовать очную встречу.
      * Ведение обсуждения в Loomio напоминает замедление времени в «Матрице», когда Нео может остановить время и обойти летящую пулю: вы можете наблюдать за живым разговором кадр за кадром. Это даёт особые возможности.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  79fbcf8bb8520bf1:
    english: "## Managing the Attention Economy"
    translation: "## Управление вниманием"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c71302b08c3b6394:
    english: A facilitator is a curator of attention. The information available can be literally infinite. It becomes critical to filter it in order to avoid becoming overwhelmed. Managing the attention economy means balancing importance against time and capacity.
    translation: Ведущий помогает группе направлять внимание. Объём доступной информации практически не ограничен, поэтому её важно отбирать, чтобы не перегружать участников. Управлять вниманием — значит соотносить важность вопросов с доступным временем и возможностями группы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  865afb1b25257bbd:
    english: Facilitation can help the group agree what the purpose and scope of a given discussion or process is, so they can have a rubric for prioritising attention. Limiting distractions and steering the conversation back on track are common interventions.
    translation: Ведущий может помочь группе согласовать цель и рамки обсуждения или всего процесса. Тогда участникам проще понять, чему уделить внимание в первую очередь. Для этого ведущий сокращает отвлекающие факторы и возвращает разговор к теме.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3dd99b496718a570:
    english: Another important way facilitators work with attention is to insist on the group holding it long enough. When things get challenging, unclear, or uncomfortable, people to want to give up too soon, jump to another topic, or look away. A facilitator can help the group see things through, in service of their collective goals.
    translation: Ещё одна задача ведущего — помочь группе достаточно долго удерживать внимание на вопросе. Когда становится сложно, непонятно или некомфортно, людям хочется прекратить обсуждение, перейти к другой теме или оставить проблему без внимания. Ведущий помогает группе довести дело до конца ради общей цели.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  811f79cee2eed8c1:
    english: 'Structured processes and information sorting exercises are important facilitation tools in this area. Some examples:'
    translation: 'В этом помогают структурированные процессы и упражнения по упорядочиванию информации. Например:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1254ab2b182bbd46:
    english: |-
      * **Time-boxing** — specifying a period of brainstorming, or conversation on a given topic.
      * **Agenda prioritisation** — listing everything people want to talk about and then picking to top items to focus on, before jumping into content.
      * **Post-it cloud** — generating a bunch of ideas or questions and grouping them thematically and then condensing them into topics.
      * **Parking lot** — a space to stick ideas or questions that come up that are not immediately relevant, to be addressed later.
      * **What does success look like??** Defining success criteria and keeping the group focused on it until those criteria are achieved.
    translation: |-
      * **Ограничение времени** — заранее отведённое время на поиск идей или обсуждение конкретной темы.
      * **Расстановка приоритетов в повестке** — сначала собрать все вопросы, которые участники хотят обсудить, затем выбрать самые важные и только после этого перейти к обсуждению.
      * **Группировка заметок** — собрать идеи и вопросы, объединить их по смыслу и выделить основные темы.
      * **Список на потом** — место для идей и вопросов, которые сейчас не относятся к теме, но к которым стоит вернуться позже.
      * **Как выглядит успех?** — определить критерии успеха и удерживать на них внимание группы, пока они не будут выполнены.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  11cc1fd7daee10e8:
    english: |-
      * One of the most important attention management features in Loomio is topic-based discussion threading. There’s a reason why this format was one of the first to emerge in online communication decades ago, and continues to be used widely today: it’s a highly effective way to sort attention. Most Loomio users intuitively understand how to stay on topic when it’s listed in big letters at the top of the page.
      * Activity in Loomio is the currency of its attention economy, and everything that generates a notification spends that currency. The software has opinions about what should be considered “salient” activity that generates notifications (for example, comments, votes, and outcomes are, while a “like” on a comment is not), developed based on user feedback.
      * Users can exercise a lot of customised control over their Loomio attention economy through notification settings. Helping users set these preferences is an important tool to wisely using the attention economy of the group.
      * Subgroups can be a powerful tool to help people moderate their attention economy. If only some people need to pay attention, you can split it out.
      * The intentional but somewhat unpopular design decision to disallow concurrent proposals in Loomio is about the flow of attention — holding a group’s “feet to the fire” to fully process a proposal before moving on.
    translation: |-
      * Один из главных способов управлять вниманием в Loomio — разделять обсуждения по темам. Такой формат появился в интернет-общении десятилетия назад и до сих пор широко используется, потому что помогает сосредоточиться. Когда тема крупно указана вверху страницы, большинству пользователей Loomio понятно, о чём идёт разговор.
      * Внимание участников — ограниченный ресурс, и каждое уведомление его расходует. На основе отзывов пользователей в Loomio определено, какие действия достаточно важны для уведомления: например, комментарии, голоса и итоги. Отметка «Нравится» под комментарием уведомления не создаёт.
      * Пользователи могут управлять своим вниманием с помощью настроек уведомлений. Помогая участникам выбрать подходящие настройки, вы помогаете группе разумно расходовать внимание.
      * Подгруппы тоже помогают распределять внимание. Если вопрос касается лишь части участников, его можно вынести в подгруппу.
      * Решение не разрешать одновременные предложения в Loomio было принято осознанно, хотя нравится не всем. Оно помогает группе уделить достаточно внимания одному предложению, прежде чем переходить к следующему.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e522b56bbe8b16c9:
    english: "> Many designers of information systems incorrectly represented their design problem as information scarcity rather than attention scarcity, and as a result they built systems that excelled at providing more and more information to people, when what was really needed were systems that excelled at filtering out unimportant or irrelevant information. — **[Wikipedia](https://en.wikipedia.org/wiki/Attention_economy)**"
    translation: "> Многие разработчики информационных систем ошибочно считали главной проблемой нехватку информации, а не внимания. Поэтому они создавали системы, которые предоставляли людям всё больше информации, хотя нужны были системы, способные отсеивать неважное и не относящееся к делу. — **[Википедия](https://en.wikipedia.org/wiki/Attention_economy)**"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  12f78aa04c29d66d:
    english: "## Facilitation Interventions"
    translation: "## Действия ведущего"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  51065e352a92bf84:
    english: There are as many facilitation techniques as there are facilitators in the world, and entire libraries of books have been written on the topic. It’s not possible to provide a comprehensive list of interventions.
    translation: Способов вести обсуждение столько же, сколько ведущих, и этой теме посвящены целые библиотеки книг. Перечислить все возможные действия невозможно.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1e23df53c3b816be:
    english: 'However, it might be useful to consider two categories of interventions:'
    translation: 'Однако полезно выделить две группы действий:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d5738a06518b45da:
    english: |-
      1. **Supportive interventions**: inviting contribution, going deeper, drawing out, coaxing, nurturing, protecting, creating space.
      2. **Assertive interventions**: pulling back, shutting down, drawing lines, interrupting, challenging, steering on course, excluding bad behaviour.
    translation: |-
      1. **Поддерживающие действия**: приглашать к участию, углублять обсуждение, помогать людям высказаться, подбадривать, поддерживать, защищать и давать пространство для разговора.
      2. **Направляющие действия**: останавливать или прерывать разговор, обозначать границы, ставить под сомнение сказанное, возвращать обсуждение в нужное русло и пресекать недопустимое поведение.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9f30fd7cd75da986:
    english: Almost all interventions in face-to-face facilitation can be reimagined and employed in the online space.
    translation: Почти все приёмы ведения очного обсуждения можно адаптировать для общения в интернете.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1ed397ff049f2888:
    english: "> Singling people out for a contribution will just make them feel like the stupid kid in class who doesn’t know the answer. Instead, a general invite to people who haven’t spoken yet to contribute tells the regular contributors to stay quiet, and gives quieter people the opportunity to step forward. — Silvia Zuur"
    translation: "> Если попросить конкретного человека высказаться, он может почувствовать себя школьником, которого вызвали отвечать, а он не знает ответа. Лучше пригласить к участию всех, кто ещё не говорил. Так те, кто обычно говорит много, поймут, что стоит помолчать, а у более молчаливых участников появится возможность высказаться. — Сильвия Зуур"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2d6c0a7189745fe1:
    english: |-
      * Intervention tools in Loomio include comments, @mentions, adding/removing users, and starting/deleting discussions. These can be employed for various forms of supportive and assertive interventions.
      * The most commonly used intervention is the comment — simply talking to the group and inviting or trying to reduce certain behaviour.
      * [Participation permissions](/en/user_manual/groups/settings/#permissions) offer relatively blunt but effective tools to moderate users, such as allowing or disallowing posting discussions or proposals.
      * Loomio offers some trust-based features that other tools lack, such as the default ability for all participants to edit discussion contexts (even if it was posted originally by another user). These are inspired by things like Wikipedia and open source software development.
    translation: |-
      * В Loomio ведущий может использовать комментарии, @mentions, добавлять и удалять пользователей, начинать и удалять обсуждения. Эти инструменты подходят и для поддержки участников, и для более решительных действий.
      * Чаще всего ведущий использует комментарии: обращается к группе, поощряет одни действия или просит воздержаться от других.
      * [Права на участие](/en/user_manual/groups/settings/#permissions) — довольно прямой, но действенный способ регулировать участие пользователей. Например, можно разрешить или запретить им создавать обсуждения и предложения.
      * В Loomio есть возможности, основанные на доверии к участникам, которых нет в некоторых других инструментах. Например, по умолчанию все участники могут редактировать описание обсуждения, даже если его написал другой пользователь. Такой подход вдохновлён Википедией и разработкой программного обеспечения с открытым исходным кодом.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
