navigation_title: Blijven verbeteren
blocks:
  508e19e18ba4a97e:
    english: "# Ongoing Practice"
    translation: "# Blijven verbeteren"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fba51c92285b31c7:
    english: "## Continuous Improvement"
    translation: "## Voortdurend verbeteren"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  121b4afb86de3c31:
    english: No matter how amazing a group or facilitator is, they can always improve. If they incrementally head in a good direction they will get to a better place. Incremental improvement requires an effective protocol for meta-conversation (talking about how you collaborate). With it, anything is possible. Without it, you stagnate.
    translation: Hoe goed een groep of facilitator ook is, er is altijd ruimte voor verbetering. Door steeds kleine stappen in de goede richting te zetten, kom je verder. Daarvoor moet je goed met elkaar kunnen praten over hoe je samenwerkt. Zo kun je blijven verbeteren. Zonder dat gesprek kom je niet verder.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  331d258dee610e96:
    english: There are many approaches to continuous improvement, but they all create space for reflection and feedback, and a way to make changes in response. For teams that work together on an ongoing basis, they might employ a methodology like <a href="https://en.wikipedia.org/wiki/Scrum_(software_development)" target="_blank">scrum</a>, including retrospectives and regular process improvements. For a one-off session, a facilitator might simply follow up with a request for feedback.
    translation: Er zijn veel manieren om voortdurend te verbeteren. Ze bieden allemaal ruimte voor reflectie en feedback, en een manier om op basis daarvan iets te veranderen. Teams die langdurig samenwerken, kunnen een methode gebruiken zoals <a href="https://en.wikipedia.org/wiki/Scrum_(software_development)" target="_blank">scrum</a>, met terugblikken en regelmatige verbeteringen van hun werkwijze. Na een eenmalige bijeenkomst kan een facilitator ook eenvoudig om feedback vragen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aabfa9d842af2688:
    english: On Loomio
    translation: Op Loomio
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ac2f489368566562:
    english: |-
      * People use Loomio itself to talk about how they use Loomio. It provides an obvious platform to “talk about the talking”.
      * The process of joining Loomio causes groups to reflect on many aspects of their collaboration and decision-making process, which creates the opportunity to improve.
    translation: |-
      * Mensen gebruiken Loomio om te bespreken hoe ze Loomio gebruiken. Het is een plek om te praten over de manier waarop ze met elkaar praten.
      * Wanneer groepen Loomio gaan gebruiken, denken ze na over verschillende kanten van hun samenwerking en besluitvorming. Dat biedt kansen om hun werkwijze te verbeteren.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7b11f212a312312e:
    english: "## Distributed Facilitation / Self-facilitation"
    translation: "## Gedeelde begeleiding / Zelf begeleiden"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1e385970a624bf63:
    english: As a group becomes more experienced, more individuals build capacity for facilitation. Facilitation can cease to be a role held by a specific person, and become more of a function that can be distributed. Anyone can take acts of facilitation, and a dance of give and take, leading and following, can emerge among participants. For groups with aspirations toward shared leadership and non-hierarchy, this is a very important thing to encourage.
    translation: Naarmate een groep meer ervaring opdoet, leren meer mensen het groepsproces te begeleiden. Die taak hoeft dan niet meer bij één persoon te liggen. Iedereen kan bijdragen aan de begeleiding. Deelnemers kunnen afwisselend het initiatief nemen en anderen volgen. Voor groepen die gedeeld leiderschap en gelijkwaardigheid nastreven, is het belangrijk om dit aan te moedigen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fa78b242f7390326:
    english: 'People who are less used to taking acts of facilitation can be supported with education, invitations, and suggestions of first steps. Some examples of acts of facilitation almost anyone can be encouraged to try:'
    translation: 'Je kunt mensen die minder gewend zijn om een groepsproces te begeleiden, helpen met uitleg, uitnodigingen en suggesties voor een eerste stap. Bijna iedereen kan bijvoorbeeld:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1f490f466a1893ed:
    english: |-
      * reflecting back what you’re hearing or summarising
      * inviting others to contribute
      * asking questions to enhance collective understanding
      * noticing who is and is not participating
      * appreciating contributions explicitly
    translation: |-
      * herhalen wat je hoort of het samenvatten
      * anderen uitnodigen om bij te dragen
      * vragen stellen om samen tot meer begrip te komen
      * opmerken wie wel en niet deelneemt
      * bijdragen uitdrukkelijk waarderen
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e2eed897e0f564d2:
    english: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../silvia_200.png"> You don’t need an agenda to be a facilitator. Facilitating is just about making a group situation easy. Next time you’re at a family gathering, party or morning tea: approach it like a facilitator and make sure everybody in the group feels included and able to participate. — Silvia Zuur'
    translation: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../silvia_200.png"> Je hebt geen agenda nodig om een groep te begeleiden. Het gaat erom dat je het mensen makkelijker maakt om samen te komen. Benader je volgende familiebijeenkomst, feest of koffiepauze eens als facilitator. Zorg dat iedereen zich betrokken voelt en kan meedoen. — Silvia Zuur'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  180b1232871c44c4:
    english: Distributed facilitation can work beautifully, but it can also cause people to step all over each other. At first, it’s awkward as people learn the dance. It’s important to differentiate between distributed facilitation (peers helping the collective), “facipulation” (manipulating the group toward your own agenda), and backseat facilitation (taking acts of facilitation when you do not have the mandate).
    translation: Gedeelde begeleiding kan goed werken, maar mensen kunnen elkaar ook in de weg zitten. In het begin is het wennen om elkaar af te wisselen. Maak onderscheid tussen gedeelde begeleiding (groepsleden die de groep helpen), ‘facipulatie’ (de groep naar je eigen agenda sturen) en ongevraagde begeleiding (de begeleiding op je nemen zonder daarvoor een mandaat te hebben).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ea5faa685be1ceae:
    english: Consciously decide when peer facilitation is a good choice, and when a specific facilitator is called for. In certain situations, such as a high-conflict discussion where a specified neutral party is needed, or there is a lack of trust, distributed facilitation might not work.
    translation: Bepaal bewust wanneer groepsleden elkaar kunnen helpen bij de begeleiding en wanneer je een aangewezen facilitator nodig hebt. Bij een discussie met veel conflicten, waarin een neutrale persoon nodig is, of bij gebrek aan vertrouwen werkt gedeelde begeleiding mogelijk niet.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d6df5458ecb8e45:
    english: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../rich_200.png"> Acts of facilitation are not just for the manager, or the person who called the meeting — they are for everyone. — Richard Bartlett'
    translation: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../rich_200.png"> Het begeleiden van een groep is niet alleen de taak van de manager of van degene die de bijeenkomst heeft georganiseerd — iedereen kan eraan bijdragen. — Richard Bartlett'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c3215e63fca09b79:
    english: "## Translating this into Loomio"
    translation: "## Zo werkt dit op Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  35ce75e6810e0611:
    english: |-
      * The online space is uniquely suited to distributed facilitation. Different people can come along at different points depending on what they notice and their skill set.
      * An online discussion is by default a distributed collaboration among peers. Any other setup requires explicit design. This is the opposite of offline spaces where the default is that someone called a meeting and distributing the role requires proactivity.
      * Loomio is designed with a group of equals in mind. In many ways, a distributed facilitation approach is the best fit for the tool.
      * Current Loomio users do peer facilitation all the time, whether they realize that’s what they are doing or not. Simple things like suggesting someone raise a proposal, tagging people, summarising the process so far, etc, are all acts of facilitation.
    translation: |-
      * Een online omgeving is bijzonder geschikt voor gedeelde begeleiding. Verschillende mensen kunnen op verschillende momenten bijdragen, afhankelijk van wat ze opmerken en waar ze goed in zijn.
      * Een online discussie is van nature een samenwerking tussen gelijkwaardige deelnemers. Voor een andere werkwijze moet je bewust kiezen. Bij een fysieke bijeenkomst is het meestal anders: iemand roept de bijeenkomst bijeen en moet actief ruimte maken om de begeleiding te delen.
      * Loomio is ontworpen voor groepen waarin mensen gelijkwaardig samenwerken. Gedeelde begeleiding past daar goed bij.
      * Mensen die Loomio gebruiken, helpen elkaar voortdurend om discussies te begeleiden, ook als ze het zelf niet zo noemen. Iemand voorstellen om een voorstel te doen, mensen taggen of het verloop van een discussie samenvatten: het zijn allemaal manieren om de groep te begeleiden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  efde81539c545bae:
    english: "## The Art of Being Facilitated"
    translation: "## De kunst om je te laten begeleiden"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  93ed1980d0cc95b4:
    english: Like the skill of being the follow in a ballroom dance pair, being facilitated is an art itself. People with experience facilitating themselves, or who have participated in a lot of well-facilitated processes, will receive facilitation differently than those who haven't.
    translation: Net zoals je bij een stijldans moet leren volgen, moet je ook leren hoe je je laat begeleiden. Mensen die zelf ervaring hebben met het begeleiden van groepen, of vaak aan goed begeleide processen hebben deelgenomen, reageren anders op begeleiding dan mensen zonder die ervaring.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d2bcd9f07f5bd25b:
    english: On the positive side, skillful receptivity to facilitation is a capacoty that can be grown, and it can have a big impact on group success. This ranges from things as simple as showing up on time, to following instructions, to being willing to try a new style of thinking or communicating. Sometimes people have a good experience and they don’t quite know why — pointing out that facilitation is the reason for the smoothness or depth can help them understand what it is they valued about the process.
    translation: Leren om begeleiding aan te nemen kan veel bijdragen aan het succes van een groep. Het begint bij eenvoudige dingen, zoals op tijd komen en aanwijzingen volgen. Het vraagt ook de bereidheid om een andere manier van denken of communiceren te proberen. Soms ervaren mensen een bijeenkomst als prettig zonder precies te weten waarom. Door te benoemen hoe de begeleiding zorgde voor een soepel of diepgaand gesprek, help je hen begrijpen wat ze aan het proces waardeerden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  87345b383ccba81d:
    english: On the negative side, people who can’t or won’t be facilitated can be detrimental to group collaboration. No matter how skilled a facilitator is, if they encounter a certain level of resistance they won’t be able to do their job. Common problems include dominating the discussion, playing devil’s advocate, disrupting the process, disrespecting the facilitator or participants, or being disengaged. At some level individuals must take responsibility for their willingness to be facilitated.
    translation: Mensen die zich niet kunnen of willen laten begeleiden, kunnen de samenwerking in een groep bemoeilijken. Ook een ervaren facilitator kan het werk niet doen als er te veel weerstand is. Veelvoorkomende problemen zijn de discussie overheersen, steeds de rol van advocaat van de duivel aannemen, het proces verstoren, de facilitator of deelnemers niet respecteren, of niet betrokken zijn. Iedereen draagt een deel van de verantwoordelijkheid om zich te laten begeleiden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c096fd0a7e12ddd4:
    english: |-
      * With a little practice, most users quickly upskill on being responsive to acts of facilitation on Loomio, such as replying when @mentioned.
      * Taking acts of facilitation on Loomio helps people become more responsive to facilitation themselves.
      * Because everything is archived, users can see past acts of facilitation “frozen in time”, gaining the benefits of observing them without having been there.
    translation: |-
      * Met een beetje oefening leren de meeste mensen snel te reageren wanneer iemand op Loomio de discussie helpt begeleiden, bijvoorbeeld door te antwoorden als ze met @ worden genoemd.
      * Door zelf op Loomio een discussie te helpen begeleiden, leer je ook beter op de begeleiding van anderen te reageren.
      * Omdat alles wordt bewaard, kunnen mensen eerdere vormen van begeleiding terugzien. Zo kunnen ze ervan leren zonder erbij te zijn geweest.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f930b325aaedb19a:
    english: "## Culture Change"
    translation: "## Cultuurverandering"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  82936abec2b50e3f:
    english: A collaborative, participatory culture is something that emerges over time, with lots of practice and trial and error. Understanding, valuing, and inviting facilitation can play a pivotal role in this cultural emergence. Facilitation can evolve from a role, to a function, to a mindset. A truly collaborative culture is one where everyone is facilitating everyone in myriad different ways.
    translation: Een cultuur waarin mensen samenwerken en deelnemen, ontstaat na verloop van tijd, door veel te oefenen en dingen uit te proberen. Als mensen begrijpen wat begeleiding kan bijdragen, die waarderen en anderen uitnodigen om eraan mee te doen, helpt dat de cultuur te veranderen. Begeleiding kan groeien van een rol naar een gedeelde taak en uiteindelijk een manier van denken worden. In een cultuur van samenwerking helpt iedereen op allerlei manieren anderen om mee te doen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  898bf6557380a042:
    english: Is the company party participatory? Does the office potluck just happen like magic? Are ideas able to emerge from anywhere, evolve through many brains and hands, and get implemented in a way better than anyone first imagined?
    translation: Kan iedereen meedoen aan het bedrijfsfeest? Ontstaat de gezamenlijke lunch op kantoor vanzelf? Kunnen ideeën overal vandaan komen, door veel mensen verder worden ontwikkeld en uiteindelijk beter worden uitgevoerd dan iemand aanvankelijk had bedacht?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f4964381b3c6dc7b:
    english: Deep culture change is when the culture of collaboration starts to leak out of specific “collaboration” spaces and shows up in every aspect of the organization. Collaboration is not about post-it notes and check-ins, but the very timbre of organizational life.
    translation: Een diepgaande cultuurverandering zie je wanneer samenwerking niet beperkt blijft tot momenten die daarvoor zijn ingericht, maar in de hele organisatie zichtbaar wordt. Samenwerking gaat verder dan briefjes plakken en korte rondjes aan het begin van een bijeenkomst. Je merkt haar in de dagelijkse gang van zaken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6962aa4815c01b0f:
    english: |-
      * The [theory of change of Loomio](http://www.loomio.com/about) is that more groups practicing effective, inclusive decision making can change organizational dynamics at a global scale. This shows up in everything about how the tool is designed and [how we run as a co-op](http://loomio.coop). Ultimately, it’s about culture change through collaborative practice.
      * Loomio groups have experienced evolving culture through the tool. Like groups that already has a collaborative culture scale while holding onto that, or a participatory group continuing to exists instead of imploding due to challanges around inclusive decicion-making.
      * Loomio makes a certain kind of “new normal” of collaborative practice possible, through making collaborative practice more accessible and achievable.
    translation: |-
      * Volgens de [verandertheorie van Loomio](http://www.loomio.com/about) kunnen meer groepen die doeltreffend en inclusief besluiten nemen, wereldwijd veranderen hoe organisaties werken. Die gedachte zie je terug in het ontwerp van Loomio en in [hoe we als coöperatie werken](http://loomio.coop). Het doel is cultuurverandering door samen te werken.
      * Groepen hebben via Loomio hun cultuur zien veranderen. Groepen met een bestaande samenwerkingscultuur konden groeien en die cultuur behouden. Andere groepen konden blijven bestaan ondanks de uitdagingen van inclusieve besluitvorming.
      * Loomio maakt samenwerking voor meer mensen toegankelijk en uitvoerbaar. Daardoor kan deze manier van werken vanzelfsprekender worden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3f2cee633e8b83c2:
    english: For inspiration about Ongoing Practice, check out [stories of Loomio groups](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help).
    translation: Lees voor inspiratie over hoe je kunt blijven verbeteren de [verhalen van Loomio-groepen](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
