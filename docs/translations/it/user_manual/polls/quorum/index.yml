    english: Oatmilk Cooperative is discussing a six-week returnable bottle trial. The discussion has reached the point where the cooperative needs to approve the trial budget.
    translation: La cooperativa Oatmilk sta discutendo una prova di sei settimane con bottiglie a rendere. La discussione è arrivata al punto in cui la cooperativa deve approvare il budget della prova.
