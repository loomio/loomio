---
navigation_title: Счет
blocks:
  c719d051fa2f700e:
    english: "# Score"
    translation: "# Счет"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  517adc384b38d256:
    english: Score measures how participants evaluate each option on a shared numeric scale. Unlike Choose, it asks people to respond to every option, so the results show both what people prefer and how strongly they prefer it.
    translation: В опросе «Счет» участники оценивают каждый вариант по общей числовой шкале. В отличие от опроса «Выбирать», здесь нужно оценить все варианты. Результаты показывают, каким вариантам люди отдают предпочтение и насколько сильно.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a678333f6d814e87:
    english: "## When to use Score"
    translation: "## Когда использовать опрос «Счет»"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c4ca19abb53e3ddc:
    english: 'Use Score when every option can be evaluated independently against the same question. It works well for:'
    translation: 'Используйте опрос «Счет», когда каждый вариант можно независимо оценить по одному и тому же вопросу. Он подходит, чтобы:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c77c1ad6b2a9d697:
    english: |-
      - assessing how ready each part of a project is;
      - rating the importance of several principles;
      - measuring interest in possible meeting topics;
      - evaluating grant applications against a common criterion; or
      - comparing the suitability of several proposals.
    translation: |-
      - оценить готовность каждой части проекта;
      - оценить важность нескольких принципов;
      - узнать, какие темы встреч интересуют участников;
      - оценить заявки на грант по общему критерию; или
      - сравнить, насколько подходят несколько предложений.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d91459d96a31a671:
    english: Define what the bottom and top of the scale mean. A number without a shared definition can mean different things to different voters. Use [Choose](/en/user_manual/polls/choose/) when you only need selections, or [Allocate](/en/user_manual/polls/allocate/) when participants must make trade-offs within a limited budget.
    translation: Объясните, что означают нижняя и верхняя границы шкалы. Без общего определения разные избиратели могут понимать одно и то же число по-разному. Используйте [Выбирать](/en/user_manual/polls/choose/), если участникам достаточно выбрать варианты, или [Выделить](/en/user_manual/polls/allocate/), если им нужно распределить ограниченное количество баллов.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6160518dc06b70a7:
    english: "## Example: score possible trial locations"
    translation: "## Пример: оценка мест для пробного проекта"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a75c387743cad529:
    english: Oatmilk Cooperative is choosing locations for a returnable-bottle trial. It asks members to score four locations from 0 (**unsuitable**) to 10 (**ideal**), considering customer access, staff capacity, storage, and collection transport.
    translation: Кооператив Oatmilk выбирает места для пробного проекта с возвратными бутылками. Он просит участников оценить четыре места по шкале от 0 (**не подходит**) до 10 (**идеально подходит**), учитывая доступность для клиентов, возможности сотрудников, место для хранения и перевозку собранных бутылок.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c74ebb16f872b3c6:
    english: "## Set up the poll"
    translation: "## Настройка опроса"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b03122ee279f9c91:
    english: State one question that applies equally to every option. Add the items to be assessed, set the **Minimum score** and **Maximum score**, and explain the endpoints in the details. Option meanings can clarify the scope of each item.
    translation: Сформулируйте один вопрос, который одинаково относится ко всем вариантам. Добавьте варианты для оценки, задайте **Минимальный балл** и **Максимальный балл** и объясните крайние значения шкалы в описании. Пояснения к вариантам помогут уточнить, что именно оценивается.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  85e66520acf78264:
    english: Choose a scale participants can apply consistently. A 0–5 scale is quick to use; a 0–10 scale allows finer distinctions. More precision does not necessarily produce better information, so use the shortest scale that fits the question.
    translation: Выберите шкалу, которой участники смогут пользоваться одинаково. По шкале от 0 до 5 оценивать быстрее, а шкала от 0 до 10 позволяет точнее различать варианты. Более подробная шкала не всегда даёт более полезные сведения, поэтому выбирайте самую короткую шкалу, подходящую для вопроса.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bb3998655598796f:
    english: Anonymous voting and showing options in random order can be useful when you want to reduce social or ordering effects.
    translation: Анонимное голосование и случайный порядок вариантов могут быть полезны, если вы хотите уменьшить влияние других участников и порядка вариантов на оценки.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Голосование"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  33199814c9ad8a64:
    english: Participants move a slider to score every option. In this example, the voter scores Central Station cafe at 8, Riverside market at 6, the University food court at 7, and Harbour offices at 5.
    translation: Участники оценивают каждый вариант с помощью ползунка. В этом примере избиратель даёт кафе у Центрального вокзала 8 баллов, рынку у реки — 6, университетскому фуд-корту — 7, а офисам у гавани — 5.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fba3d21a09846414:
    english: The reason explains how the voter applied the scale. This helps the group distinguish a low score caused by missing information from one caused by substantive concern.
    translation: Причина голоса поясняет, как избиратель применил шкалу. Это помогает группе понять, связана ли низкая оценка с недостатком информации или с существенными опасениями.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Как читать результаты"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  846b7759f9d54232:
    english: 'For each option, the results show:'
    translation: 'Для каждого варианта результаты показывают:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cac30fa54f0aeaf7:
    english: |-
      - **Points**: the sum of all scores;
      - **Mean**: the average score; and
      - **Voters**: how many people scored the option.
    translation: |-
      - **Точки**: сумму всех оценок;
      - **Иметь в виду**: среднюю оценку; и
      - **Избиратели**: сколько человек оценили вариант.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7e063d4b1babcb9e:
    english: In this example, **Central Station cafe** has the highest mean at 7.5. **Harbour offices** has the lowest mean at 5.25, while Riverside market and the University food court are tied at 7. Four of five invited people have voted, so the group can also see that one response is outstanding.
    translation: В этом примере у **кафе у Центрального вокзала** самая высокая средняя оценка — 7,5. У **офисов у гавани** самая низкая — 5,25. Рынок у реки и университетский фуд-корт получили по 7. Проголосовали четверо из пяти приглашённых, поэтому группа также видит, что один человек ещё не ответил.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  147800d3643d9942:
    english: Compare means only when the options have a similar number of voters. Read the vote reasons before treating a small difference as meaningful, and publish an outcome explaining what action follows from the scores.
    translation: Сравнивайте средние оценки, только если варианты оценило примерно одинаковое число избирателей. Прежде чем придавать значение небольшой разнице, прочитайте причины голосов. Затем опубликуйте итог и объясните, какие действия последуют на основании оценок.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
