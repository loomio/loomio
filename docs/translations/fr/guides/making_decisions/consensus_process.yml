  223c90e3fe5b24d7:
    english: "> *“Consensus is the process – a participatory process by which a group thinks and feels together, en route to their decision.” - Sam Kaner, Community at Work*"
    translation: "> *« Le consensus est un processus participatif par lequel un groupe réfléchit et ressent les choses ensemble jusqu’à prendre une décision. » — Sam Kaner, Community at Work*"
