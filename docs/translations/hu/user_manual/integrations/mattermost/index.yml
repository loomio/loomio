      Start from your Mattermost team in your browser. Then open the Integrations settings page.
      ![](mm1.png)
    translation: |-
      Nyisd meg a Mattermost-csapatodat a böngésződben, majd az integrációs beállításokat.
      ![](mm1.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  71a08631e70f06c9:
    english: |-
      Click "Incoming Webhooks"
      ![](mm2.png)
    translation: |-
      Kattints a „Bejövő webhookok” lehetőségre.
      ![](mm2.png)
    status: machine
    provider: codex/gpt-6-sol
