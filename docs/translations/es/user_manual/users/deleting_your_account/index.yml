    translation: Inicia sesión en Loomio. Abre la barra lateral desde el icono de menú (☰) en la esquina superior izquierda. Haz clic en tu avatar o tus iniciales en la esquina superior derecha de la pantalla.
    status: machine
    provider: codex/gpt-6-sol
