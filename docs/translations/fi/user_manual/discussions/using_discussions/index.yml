    english: The right sidebar controls your email notifications and shows who has been invited, who has seen the thread, and who has been notified.
    translation: Oikeassa sivupalkissa voit hallita sähköposti-ilmoituksiasi. Siellä näet myös, keitä on kutsuttu, ketkä ovat nähneet keskusteluketjun ja keille on ilmoitettu.
