---
navigation_title: Anonyme Abstimmung
blocks:
  b4e842083054a400:
    english: "# Anonymous voting"
    translation: "# Anonyme Abstimmung"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9b5c46644a952388:
    english: Anonymous voting, also known as blind voting, separates the record of who has voted from the votes themselves. Poll coordinators can see who was eligible and, once at least three people have voted, verify participation. Application users cannot connect a submitted vote with the person who submitted it.
    translation: Bei einer anonymen Abstimmung, auch geheime Abstimmung genannt, werden die Angaben darüber, wer abgestimmt hat, getrennt von den abgegebenen Stimmen gespeichert. Koordinatoren der Abstimmung können sehen, wer stimmberechtigt war. Sobald mindestens drei Personen abgestimmt haben, können sie auch die Teilnahme überprüfen. Wer die Anwendung nutzt, kann eine abgegebene Stimme keiner Person zuordnen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  105abff68025f002:
    english: This page explains the protections provided by anonymous voting, the information that is retained, and the limits of the guarantee.
    translation: Diese Seite erklärt, wie die anonyme Abstimmung die Abstimmenden schützt, welche Informationen gespeichert bleiben und wo die Grenzen dieses Schutzes liegen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6d97c8b835a3f1f2:
    english: "## How anonymous voting protects voters"
    translation: "## Wie die anonyme Abstimmung Abstimmende schützt"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e01d5c77096b953e:
    english: 'An anonymous poll keeps two separate sets of records:'
    translation: 'Bei einer anonymen Abstimmung werden zwei Arten von Einträgen getrennt gespeichert:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  757ab56b1165a71d:
    english: |-
      | Participation records | Submitted votes |
      | --- | --- |
      | Who is eligible to vote | The selected options or scores |
      | Who was invited, and by whom | The poll the vote belongs to |
      | Whether each eligible person has voted | No name or user account |
      | No selected options or scores | No link to a participation record |
    translation: |-
      | Teilnahmeinformationen | Abgegebene Stimmen |
      | --- | --- |
      | Wer stimmberechtigt ist | Die gewählten Optionen oder vergebenen Punktzahlen |
      | Wer eingeladen wurde und von wem | Zu welcher Abstimmung die Stimme gehört |
      | Ob eine stimmberechtigte Person abgestimmt hat | Kein Name und kein Benutzerkonto |
      | Keine gewählten Optionen oder Punktzahlen | Keine Verbindung zu einem Teilnahme­eintrag |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b908c49acc827932:
    english: There is no shared identifier that connects these records. Submitted votes also omit the actual submission time, invitation information, written reasons, attachments, and other metadata that could help identify a voter.
    translation: Es gibt keine gemeinsame Kennung, die diese Einträge verbindet. Abgegebene Stimmen enthalten auch keinen genauen Abgabezeitpunkt, keine Angaben zur Einladung, keine schriftlichen Begründungen, keine Anhänge und keine anderen Metadaten, die Rückschlüsse auf die abstimmende Person zulassen könnten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6430a3d863d135b6:
    english: This separation is enforced when the vote is stored. It does not depend only on hiding names in the interface.
    translation: Die Trennung erfolgt bereits beim Speichern der Stimme. Sie beruht nicht allein darauf, dass Namen in der Oberfläche ausgeblendet werden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b8e31aef3d559f28:
    english: "## While voting is open"
    translation: "## Solange die Abstimmung offen ist"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f905c85734898a41:
    english: Results remain hidden from everyone until the poll closes. This includes poll coordinators, group administrators, and instance administrators using the application.
    translation: Die Ergebnisse bleiben bis zum Ende der Abstimmung für alle verborgen. Das gilt auch für Koordinatoren der Abstimmung, Gruppenadmins und Instanzadmins, die die Anwendung nutzen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  828df5247b61c9e6:
    english: 'When someone votes:'
    translation: 'Wenn jemand abstimmt:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  69b471d43b2148a1:
    english: |-
      - their submitted vote is stored without their name or participation record;
      - their participation record is marked to show that they have voted;
      - no vote event, notification, email, comment, or activity entry is created;
      - no copy of their selections is returned after submission; and
      - the interface confirms only that their vote was recorded.
    translation: |-
      - wird die abgegebene Stimme ohne Namen oder Verbindung zum Teilnahme­eintrag gespeichert;
      - wird im Teilnahme­eintrag vermerkt, dass die Person abgestimmt hat;
      - werden weder ein Abstimmungsereignis noch eine Benachrichtigung, E-Mail, ein Kommentar oder ein Aktivitätseintrag erstellt;
      - wird nach der Abgabe keine Kopie der gewählten Optionen zurückgegeben; und
      - bestätigt die Oberfläche nur, dass die Stimme erfasst wurde.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4ffe4b38db135dab:
    english: The participation record does not store a precise time for when the person voted. Submitted votes are not ordered by submission time.
    translation: Im Teilnahme­eintrag wird kein genauer Zeitpunkt der Stimmabgabe gespeichert. Abgegebene Stimmen werden nicht nach dem Zeitpunkt ihrer Abgabe sortiert.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7acaf6b48fc42105:
    english: "## Votes cannot be changed"
    translation: "## Stimmen können nicht geändert werden"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  996ef90a3eee857b:
    english: Each eligible person can vote once. A submitted anonymous vote cannot be reviewed, changed, withdrawn, or replaced, including by a coordinator or administrator.
    translation: Jede stimmberechtigte Person kann einmal abstimmen. Eine abgegebene anonyme Stimme kann nicht eingesehen, geändert, zurückgezogen oder ersetzt werden. Das gilt auch für Koordinatoren und Admins.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  58f0aaa6a45c1d37:
    english: Allowing a person to retrieve or replace their vote would require a persistent link between that person and the vote. Anonymous voting deliberately does not create that link.
    translation: Damit jemand die eigene Stimme abrufen oder ersetzen könnte, müsste eine dauerhafte Verbindung zwischen der Person und ihrer Stimme bestehen. Bei einer anonymen Abstimmung wird diese Verbindung bewusst nicht hergestellt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2fd2c9d6ab0d6f68:
    english: Review your selections carefully before submitting.
    translation: Prüfe deine Auswahl sorgfältig, bevor du sie abgibst.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  59f83c0e359484c4:
    english: "## Why anonymous votes do not have reasons"
    translation: "## Warum anonyme Stimmen keine Begründungen enthalten"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  89f9d9a1d4bcb395:
    english: New anonymous votes cannot include a written reason or an attachment. Reasons can contain names, personal details, writing patterns, mentions, or other information that identifies the voter. They would also make individual votes easier to distinguish from the aggregate result.
    translation: Neue anonyme Stimmen können weder eine schriftliche Begründung noch einen Anhang enthalten. Begründungen können Namen, persönliche Angaben, einen wiedererkennbaren Schreibstil, Erwähnungen oder andere Hinweise auf die abstimmende Person enthalten. Sie könnten einzelne Stimmen außerdem leichter vom Gesamtergebnis unterscheidbar machen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  932f88aa929fb4eb:
    english: Participants can still discuss the poll in its thread where discussion is available. Those comments are ordinary named discussion contributions and are not attached to an anonymous vote.
    translation: Wo eine Diskussion verfügbar ist, können die Teilnehmenden die Abstimmung weiterhin im zugehörigen Thread besprechen. Diese Kommentare sind gewöhnliche, namentlich zugeordnete Diskussionsbeiträge und gehören nicht zu einer anonymen Stimme.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1b21c2826270bd52:
    english: "## Results and exports"
    translation: "## Ergebnisse und Exporte"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  afc45e50b74e075b:
    english: After the poll closes, the results are calculated from the detached votes and displayed as totals and other aggregate results supported by the poll type.
    translation: Nach dem Ende der Abstimmung werden die Ergebnisse aus den getrennt gespeicherten Stimmen berechnet. Angezeigt werden die Gesamtzahlen und weitere zusammengefasste Ergebnisse, die der Abstimmungstyp unterstützt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b28c82ffcb4ffeb5:
    english: The application does not publish vote identifiers, submission order, or submission times. Poll exports contain aggregate results rather than a row for each anonymous vote, except that a closed STV election can be exported in BLT format. A BLT export contains the candidate rankings needed to recount the election, grouped when multiple ballots have the same ranking, without voter identities or ballot metadata.
    translation: Die Anwendung veröffentlicht weder Stimmenkennungen noch die Reihenfolge oder Zeitpunkte der Stimmabgabe. Exporte enthalten zusammengefasste Ergebnisse statt einer Zeile pro anonymer Stimme. Eine abgeschlossene STV-Wahl kann jedoch im BLT-Format exportiert werden. Ein BLT-Export enthält die Rangfolgen der Kandidierenden, die für eine erneute Auszählung nötig sind. Stimmen mit gleicher Rangfolge werden zusammengefasst. Identitäten der Abstimmenden und Metadaten zu einzelnen Stimmzetteln sind nicht enthalten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8088fc78d955e9bb:
    english: An anonymous poll cannot be reopened after it closes.
    translation: Eine anonyme Abstimmung kann nach ihrem Ende nicht wieder geöffnet werden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c368b542923cd542:
    english: "## Participation verification"
    translation: "## Überprüfung der Teilnahme"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ab086d63c01514bf:
    english: Poll coordinators can view the named participation records. These always show who was eligible. Once at least three people have voted, they also show whether each person voted, but never show how anyone voted. If a poll closes with fewer than three votes, the participation status remains hidden.
    translation: Koordinatoren der Abstimmung können die namentlich zugeordneten Teilnahme­einträge einsehen. Daraus geht immer hervor, wer stimmberechtigt war. Sobald mindestens drei Personen abgestimmt haben, ist auch zu sehen, ob die einzelnen Personen abgestimmt haben. Wie jemand abgestimmt hat, ist nie zu sehen. Endet die Abstimmung mit weniger als drei Stimmen, bleibt der Teilnahmestatus verborgen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dcad5d728e5e7cfd:
    english: Other participants cannot view this named participation information. Access to poll results does not grant access to the participation records.
    translation: Andere Teilnehmende können diese namentlich zugeordneten Teilnahmeinformationen nicht einsehen. Der Zugriff auf die Abstimmungsergebnisse gewährt keinen Zugriff auf die Teilnahme­einträge.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  37cf06402ac47fa2:
    english: |-
      Coordinators can add eligible people while voting remains open, including after
      other people have voted. Existing voters cannot be removed from an anonymous
      poll.
    translation: |-
      Koordinatoren können weitere stimmberechtigte Personen hinzufügen, solange die Abstimmung offen ist, auch nachdem
      andere Personen abgestimmt haben. Personen, die bereits abgestimmt haben, können aus einer anonymen
      Abstimmung nicht entfernt werden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  705e9b807681f6c1:
    english: "## Reminders"
    translation: "## Erinnerungen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8ef8b501a1b27f63:
    english: For an anonymous poll lasting at least 24 hours, eligible people who have not voted receive one automatic reminder during the final 24 hours.
    translation: Bei einer anonymen Abstimmung mit einer Laufzeit von mindestens 24 Stunden erhalten stimmberechtigte Personen, die noch nicht abgestimmt haben, in den letzten 24 Stunden eine automatische Erinnerung.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b23e579a8ef628de:
    english: The reminder is selected from participation records only. It does not inspect submitted votes or create a connection to them. If the deadline changes, the hourly reminder check uses the current deadline without maintaining a separate scheduled reminder for the poll.
    translation: Wer eine Erinnerung erhält, wird ausschließlich anhand der Teilnahme­einträge bestimmt. Dafür werden keine abgegebenen Stimmen geprüft oder mit Teilnahme­einträgen verknüpft. Ändert sich die Frist, verwendet die stündliche Prüfung die aktuelle Frist. Für die Abstimmung wird kein gesonderter Erinnerungstermin gespeichert.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  053ce04ce5f98ed8:
    english: Polls with a total voting period of less than 24 hours do not send this automatic reminder.
    translation: Bei Abstimmungen mit einer gesamten Abstimmungsdauer von weniger als 24 Stunden wird keine solche automatische Erinnerung versendet.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb1f13e60fe178fe:
    english: "## What coordinators and administrators can see"
    translation: "## Was Koordinatoren und Admins sehen können"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e59c22e94231a746:
    english: 'Through the application, a poll coordinator, group administrator, or instance administrator may be able to see:'
    translation: 'Über die Anwendung können Koordinatoren der Abstimmung, Gruppenadmins oder Instanzadmins je nach Zugriffsrecht Folgendes sehen:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2da6b1feaa8b36f1:
    english: |-
      - the poll and its eligible voters;
      - whether each eligible person has voted, where their role permits access and at least three people have voted; and
      - aggregate results after the poll closes.
    translation: |-
      - die Abstimmung und die stimmberechtigten Personen;
      - ob eine stimmberechtigte Person abgestimmt hat, sofern ihre Rolle den Zugriff erlaubt und mindestens drei Personen abgestimmt haben; und
      - die zusammengefassten Ergebnisse nach dem Ende der Abstimmung.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6a96a87699625dc6:
    english: 'They cannot use application features to see:'
    translation: 'Mit Funktionen der Anwendung können sie Folgendes nicht sehen:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dd4756253d1ee6dc:
    english: |-
      - which selections belong to a person;
      - individual votes or voting patterns;
      - when a particular vote was submitted; or
      - a reason, attachment, event, or notification associated with a submitted vote.
    translation: |-
      - welche Auswahl zu einer bestimmten Person gehört;
      - einzelne Stimmen oder Abstimmungsmuster;
      - wann eine bestimmte Stimme abgegeben wurde; oder
      - eine Begründung, einen Anhang, ein Ereignis oder eine Benachrichtigung zu einer abgegebenen Stimme.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c350875c33492237:
    english: "## Limits of anonymous voting"
    translation: "## Grenzen der anonymen Abstimmung"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  48d04d7b4817e710:
    english: These protections prevent application users from linking a submitted vote to its voter. They are not a cryptographic protection against an operator who can inspect the database, backups, server logs, process memory, network traffic, or a modified version of the application.
    translation: Dieser Schutz verhindert, dass Nutzer der Anwendung eine abgegebene Stimme der abstimmenden Person zuordnen. Er bietet keinen kryptografischen Schutz vor Betreibern, die die Datenbank, Sicherungskopien, Serverprotokolle, den Prozessspeicher, den Netzwerkverkehr oder eine veränderte Version der Anwendung untersuchen können.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f901f505362e46b4:
    english: The result itself may also reveal information. A small electorate, a unanimous result, a distinctive combination of selections, or information shared outside the poll can make a person's choices easier to infer. Voters may also choose to identify themselves in discussion outside their submitted vote.
    translation: Auch das Ergebnis selbst kann Informationen preisgeben. Bei wenigen Stimmberechtigten, einem einstimmigen Ergebnis, einer auffälligen Kombination gewählter Optionen oder Informationen, die außerhalb der Abstimmung geteilt wurden, lassen sich die Entscheidungen einer Person möglicherweise leichter erschließen. Abstimmende können sich auch selbst in einer Diskussion außerhalb ihrer abgegebenen Stimme zu erkennen geben.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dfe97db86db52d15:
    english: Consider the size of the electorate and the sensitivity of the decision when deciding whether application-level anonymous voting is suitable.
    translation: Berücksichtige die Zahl der Wahlberechtigten und die Sensibilität der Entscheidung, wenn du prüfst, ob eine anonyme Abstimmung auf Anwendungsebene geeignet ist.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  60cc6f1a0163ec5d:
    english: "## Questions"
    translation: "## Fragen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  57615f2c4c040dce:
    english: "### Can a coordinator see how I voted?"
    translation: "### Kann ein Koordinator sehen, wie ich abgestimmt habe?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9dc1d151cc90e94e:
    english: No. Once at least three people have voted, a coordinator can verify whether you voted but cannot connect you with a submitted vote through the application. Below that threshold, your participation status remains hidden.
    translation: Nein. Sobald mindestens drei Personen abgestimmt haben, kann ein Koordinator sehen, ob du abgestimmt hast. Über die Anwendung kann er deine Stimme aber keiner abgegebenen Stimme zuordnen. Bei weniger als drei Stimmen bleibt verborgen, ob du abgestimmt hast.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b3b382d2575b715d:
    english: "### Can I see my vote after submitting it?"
    translation: "### Kann ich meine Stimme nach der Abgabe sehen?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  52aaaa1c764d5745:
    english: No. The application confirms that your vote was recorded, then discards the selections from the voting interface. It cannot retrieve your vote without creating the link that anonymous voting is designed to avoid.
    translation: Nein. Die Anwendung bestätigt, dass deine Stimme erfasst wurde, und entfernt deine Auswahl dann aus der Abstimmungsansicht. Sie kann deine Stimme nicht wieder abrufen, ohne die Verbindung herzustellen, die bei einer anonymen Abstimmung vermieden werden soll.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  071dd89d6eb38ebf:
    english: "### Can I change or withdraw my vote?"
    translation: "### Kann ich meine Stimme ändern oder zurückziehen?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '059b75c51b4225ab':
    english: No. There is no link that would let the application identify which submitted vote to change or remove.
    translation: Nein. Es gibt keine Verbindung, über die die Anwendung erkennen könnte, welche abgegebene Stimme sie ändern oder entfernen müsste.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c94077837455425f:
    english: "### Will I receive an email confirming my vote?"
    translation: "### Bekomme ich eine Bestätigung meiner Stimme per E-Mail?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f36a8b43a3fdee36:
    english: No. Voting creates only the on-screen acknowledgement and updates your participation record. It does not send a confirmation email or create a notification or activity event.
    translation: Nein. Nach der Stimmabgabe erscheint nur eine Bestätigung auf dem Bildschirm, und dein Teilnahmevermerk wird aktualisiert. Es wird keine Bestätigungs-E-Mail versendet und keine Benachrichtigung oder Aktivität erstellt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f320754cf7ee77bc:
    english: "### Does a public poll reveal more information?"
    translation: "### Gibt eine öffentliche Abstimmung mehr Informationen preis?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f84121f0c18e03ab:
    english: Public access may allow people to see the poll and its aggregate results after it closes. It does not expose the named participation records or individual anonymous votes.
    translation: Bei öffentlichem Zugriff können andere Personen möglicherweise die Abstimmung und nach ihrem Ende die zusammengefassten Ergebnisse sehen. Die Teilnahmevermerke mit Namen und die einzelnen anonymen Stimmen bleiben verborgen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e2dbe0c181f865ca:
    english: "### Is anonymous voting suitable for every election?"
    translation: "### Eignet sich die anonyme Abstimmung für jede Wahl?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  05fc871619a2170d:
    english: No. It provides application-level separation between identities and votes. Decisions requiring protection from system operators or independently verifiable cryptographic elections need a system designed for those requirements.
    translation: Nein. Sie trennt Identitäten und Stimmen innerhalb der Anwendung. Wenn eine Entscheidung Schutz vor den Betreibern des Systems oder eine unabhängig überprüfbare kryptografische Wahl erfordert, brauchst du ein System, das dafür ausgelegt ist.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
