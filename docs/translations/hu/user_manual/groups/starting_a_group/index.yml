    translated_on: '2026-09-29'
  b054d0f760888add:
    english: Your group is automatically assigned a handle. The handle is used in the group's URL and email address, such as **loomio.com/your-group-handle** and **your-group-handle@loomio.com**.
    translation: 'A csoport automatikusan kap egy azonosítót. Ez szerepel a csoport URL-jében és e-mail-címében, például: **loomio.com/your-group-handle** és **your-group-handle@loomio.com**.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1dee654ba628ba95:
    english: You can edit the handle when you create the group and change it later in group settings. When you change it, links and email addresses that use the old handle continue to work. Loomio keeps up to three old handles; after that, the oldest handle expires.
    translation: Az azonosítót a csoport létrehozásakor szerkesztheted, később pedig a csoport beállításaiban módosíthatod. Módosítás után a régi azonosítót használó linkek és e-mail-címek továbbra is működnek. A Loomio legfeljebb három korábbi azonosítót őriz meg; ezután a legrégebbi érvényét veszti.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
