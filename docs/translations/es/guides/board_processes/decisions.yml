  50902da4933b32b7:
    english: Board and committee members frequently need to make 'out-of-session' decisions. These are governance decisions and discussion where either;
    translation: 'Los miembros de juntas directivas y comités a menudo necesitan tomar decisiones entre reuniones. Son decisiones de gobierno que requieren discusión cuando:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4355b569fb0f9ee4:
    english: |-
      - There was insufficient time to make a decision in the board meeting,
      - the decision does not require a lot of discussion (including administrative decisions),
      - something has happened (internally or externally) that requires the board to act before the next meeting,
      - a director has a particular interest to explore with the board.
    translation: |-
      - No hubo tiempo suficiente para tomar una decisión durante la reunión de la junta directiva,
      - la decisión no requiere mucha discusión, como ocurre con algunas decisiones administrativas,
      - ha sucedido algo, dentro o fuera de la organización, que exige actuar antes de la próxima reunión,
      - un miembro de la junta directiva tiene un asunto que quiere tratar con los demás.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c46be74fd433f516:
    english: |-
      ## On Loomio
      Start a **thread** and open a discussion:
      - Introduce the topic or decision that you would like to make,
      - invite directors to comment with their thoughts, opinions and any information they have to help everyone understand their perspective about the 'out-of-session' topic or decision,
      - encourage members to participate by posting or reply to comments.
    translation: |-
      ## En Loomio
      Inicia un **hilo** para abrir la discusión:
      - Presenta el tema o la decisión que quieres tomar,
      - invita a los miembros de la junta directiva a compartir sus ideas, opiniones y cualquier información que ayude a los demás a comprender su perspectiva sobre el asunto que se tratará entre reuniones,
      - anima a los miembros a participar mediante publicaciones o respuestas a los comentarios.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  337cfc1a7b434acd:
    english: "When ready, raise a **poll** and invite members to vote. \nIf the issue is straightforward use a **Proposal** or if the issue is more complex use a **Sense check** poll to clearly ask fellow members how they feel about the proposal.\n- State the decision and invite people to vote,\n- ask people to leave a reason for their vote, particularly if they want to qualify any points,\n- choose the decision options that work for your board's decision-making processes.\n- You can ratify and minute the 'out-of-session' decision at your next board meeting."
    translation: "Cuando llegue el momento, abre un **sondeo** e invita a los miembros a votar. \nSi el asunto es sencillo, usa una **Propuesta**. Si es más complejo, usa un sondeo de **Comprobación de sentido** para preguntar claramente a los demás miembros qué opinan de la propuesta.\n- Expón la decisión e invita a las personas a votar,\n- pide que expliquen el motivo de su voto, especialmente si quieren hacer alguna salvedad,\n- elige las opciones de decisión que se ajusten al proceso de toma de decisiones de tu junta directiva.\n- Puedes ratificar la decisión tomada entre reuniones y dejarla asentada en el acta de la próxima reunión de la junta directiva."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  19a80c3ce7d106e0:
    english: It's not a failure if a decision does not get agreement. You can ask members what changes they would make to enable them to agree to a decision. This helps you build to a better decision. A new Proposal with amendments is then more likely to achieve agreement.
    translation: Si no se alcanza un acuerdo, puedes preguntar a los miembros qué cambios les permitirían apoyar la decisión. Esto ayuda a formular una decisión mejor. Una nueva propuesta con esas modificaciones tendrá más posibilidades de lograr un acuerdo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b06f2d2a0e68f99d:
    english: State an **outcome** when the proposal closes. Let everyone know the result of the decision and what will happen next.
    translation: Publica una **conclusión** cuando se cierre la propuesta. Comunica a todos el resultado de la decisión y qué sucederá después.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6a4d6a8c978bcb11:
    english: "## Examples of out-of-session decisions"
    translation: "## Ejemplos de decisiones tomadas entre reuniones"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fff64b1ac620cc4a:
    english: |-
      ### Decision about property purchase
      At the last board meeting, a property purchase was discussed. A director required an independent engineering report before making the decision. At the board meeting, the board agreed to purchase the property subject to a satisfactory engineering report. However as the purchase must be made before the next board meeting, the board agreed to upload the engineering report to Loomio when ready, for discussion and to make the final decision for the property purchase on Loomio.
    translation: |-
      ### Decisión sobre la compra de un inmueble
      En la última reunión de la junta directiva se debatió la compra de un inmueble. Uno de sus miembros pidió un informe técnico independiente antes de tomar la decisión. La junta acordó comprar el inmueble si el informe era satisfactorio. Como la compra debía realizarse antes de la siguiente reunión, acordó subir el informe a Loomio cuando estuviera listo, debatirlo allí y tomar la decisión final sobre la compra.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b279ed6b1c5aadfa:
    english: |-
      ### Decision to accept Directors and Officers Liability insurance
      During the board meeting it was noted that the annual insurance renewal was coming up. As this was considered to be an administrative matter, the board agreed to use Loomio to discuss the renewal application, seek the required information from each director, submit the application and to accept the insurance renewal quote.
    translation: |-
      ### Decisión sobre la renovación del seguro de responsabilidad civil de directivos
      Durante la reunión de la junta directiva se señaló que se acercaba la renovación anual del seguro. Como se consideró un asunto administrativo, la junta acordó usar Loomio para debatir la solicitud de renovación, recabar la información necesaria de cada miembro, presentar la solicitud y aceptar la cotización para renovar el seguro.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ca3a40286ca25a9a:
    english: |-
      ### A security breach has occurred at one of our facilities
      A break-in and theft of property has occurred that has put the corporation and staff at risk. Directors must be made aware of the event and risks, and evaluate an appropriate response.
    translation: |-
      ### Se ha producido una brecha de seguridad en una de nuestras instalaciones
      Se ha producido una entrada por la fuerza y un robo que han puesto en riesgo a la organización y al personal. Es necesario informar a los miembros de la junta directiva sobre lo sucedido y los riesgos, y evaluar una respuesta adecuada.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c406842807e1091b:
    english: |-
      ### A director has challenged the board about gender and diversity of board membership
      The director has provided good reasons and evidence that the board should diversify membership to be more representative of the corporation. Directors need to digest the information, ask questions, discuss the issue and decide a response.
    translation: |-
      ### Un miembro de la junta directiva plantea la diversidad de género entre sus integrantes
      Este miembro ha aportado razones y pruebas para diversificar la composición de la junta y hacerla más representativa de la organización. Los demás miembros necesitan examinar la información, hacer preguntas, debatir el asunto y decidir cómo responder.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bf35cdb4a62a85f4:
    english: "## Keeping a record of decisions made and supporting discussion"
    translation: "## Conservar un registro de las decisiones y las discusiones que las respaldan"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6231d476f6bddb27:
    english: Record keeping is a legal requirement for governance boards and good practice for committees.
    translation: Conservar registros es un requisito legal para las juntas directivas y una buena práctica para los comités.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  511470c795509c7e:
    english: Today, many organizations record and store formal minutes, resolutions, policies and key decisions electronically. Document records are created and approved, distributed and used, retained and stored, and ultimately disposed of.
    translation: Hoy, muchas organizaciones registran y almacenan electrónicamente actas formales, resoluciones, políticas y decisiones importantes. Los documentos se crean y aprueban, se distribuyen y utilizan, se conservan y almacenan y, finalmente, se eliminan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  324fc531e7a78088:
    english: |-
      ### On Loomio
      Minutes, reports, resolutions and other documents can be attached to a meeting **thread**, in the thread context, within a poll or any to thread comment.  This means the documents are always associated with the relevant discussion.
    translation: |-
      ### En Loomio
      Puedes adjuntar actas, informes, resoluciones y otros documentos a un **hilo** de una reunión, al contexto del hilo, a un sondeo o a cualquier comentario del hilo.  Así, los documentos quedan asociados a la discusión correspondiente.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9be58ccab5189118:
    english: A list of files can also be found under the **Files** tab.
    translation: También encontrarás una lista de archivos en la pestaña **Archivos**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  24bc6a0bf5139b23:
    english: You can also add a link within any thread or poll to a document stored in your preferred document management system.  Find the online shareable link to the document, copy and paste into your thread, poll or comment.
    translation: También puedes añadir en cualquier hilo o sondeo un enlace a un documento almacenado en el sistema de gestión documental que prefieras.  Busca el enlace que permite compartir el documento en línea, cópialo y pégalo en el hilo, el sondeo o un comentario.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4fee216f27a3fdff:
    english: Anyone with permission can then click the link to open and read the document.
    translation: Cualquier persona con permiso podrá hacer clic en el enlace para abrir y leer el documento.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9f0e1cd18ae1a402:
    english: Because Loomio discussions and decisions are always already documented, it provides a robust way to verify all your board's decision-making. You can easily demonstrate what was decided, and when. If directors have discussed and commented, as well as voted on a resolution—you will also know how and why each decision was reached.
    translation: Las discusiones y decisiones en Loomio quedan documentadas, lo que permite verificar las decisiones de tu junta directiva. Puedes mostrar fácilmente qué se decidió y cuándo. Si los miembros debatieron, comentaron y votaron una resolución, también podrás saber cómo y por qué se tomó cada decisión.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  71071cda2f1c034e:
    english: Over time, you are creating a history for your organization where you can easily search and find past decisions and related discussion.
    translation: Con el tiempo, crearás un historial de tu organización en el que podrás buscar y encontrar decisiones anteriores y las discusiones relacionadas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  629c2034788a9fd5:
    english: In Loomio all data is written and stored on multiple disks and multiple locations, *in the cloud*, backed up daily.  Files uploaded are stored on servers that use modern techniques to remove bottlenecks and points of failure.
    translation: En Loomio, todos los datos se escriben y almacenan en varios discos y ubicaciones, *en la nube*, y se realizan copias de seguridad a diario.  Los archivos subidos se almacenan en servidores que utilizan técnicas modernas para evitar cuellos de botella y puntos únicos de fallo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
