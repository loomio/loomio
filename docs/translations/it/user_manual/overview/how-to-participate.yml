---
navigation_title: Come partecipare
blocks:
  b07064bf98055393:
    english: "# How to participate"
    translation: "# Come partecipare"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c121de54fbe72331:
    english: 'Once signed in to a Loomio group you have been invited to, you can participate in a Loomio discussion or decision.  '
    translation: Dopo aver effettuato l'accesso a un gruppo Loomio a cui sei stato invitato, puoi partecipare a una discussione o a una decisione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9bb48e2f2f1858af:
    english: Read on to see  how to write a comment in a thread and how to vote in a poll.
    translation: Qui trovi come scrivere un commento in una discussione e come votare in un sondaggio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '095ec081a6f1d74e':
    english: "## Comment"
    translation: "## Commentare"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d5dadbc416d8603a:
    english: You can write a comment in a thread, and people can reply, react or post their own comment to continue the discussion.
    translation: Puoi scrivere un commento in una discussione. Le altre persone possono rispondere, aggiungere una reazione o scrivere un altro commento per proseguire la discussione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  250f7bc0e6e6c93c:
    english: 'When you have written your text, use **Post Comment** to instantly publish the comment. Your comment will be visible to anyone who has permission to see the thread. '
    translation: Dopo aver scritto il testo, seleziona **Pubblica un commento** per pubblicarlo subito. Il commento sarà visibile a chiunque abbia il permesso di vedere la discussione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  76a3378441f45ebf:
    english: "### Reply to a comment"
    translation: "### Rispondere a un commento"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c3495aed9ac78348:
    english: You can reply to someone's comment by clicking on the reply icon beneath the comment.
    translation: Per rispondere a un commento, seleziona l'icona di risposta sotto il commento.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b2698ab73e65442c:
    english: Your reply is published in the thread and an email notification is sent to the author of the comment.
    translation: La tua risposta viene pubblicata nella discussione e l'autore del commento riceve una notifica via email.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  04743dedbee0de5c:
    english: "### Get someone's attention"
    translation: "### Richiamare l'attenzione di qualcuno"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  455fea8aa593dad4:
    english: You can notify people when you write a comment.
    translation: Quando scrivi un commento, puoi inviare una notifica ad altre persone.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  316ef3257eaebd54:
    english: "### Reactions"
    translation: "### Reazioni"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4b68204cf35c85f1:
    english: Reacting to a comment is a great way to encourage and acknowledge a comment by letting the comment author know how you feel.  It is a quick and light-weight way to participate that does not require any text, nor send an email. Click the smile emoji icon beneath a comment to leave an emoji reaction.
    translation: 'Puoi usare una reazione per far sapere all''autore di un commento che cosa ne pensi. È un modo rapido per partecipare: non devi scrivere nulla e non viene inviata alcuna email. Seleziona l''icona con la faccina sotto un commento per aggiungere una reazione emoji.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Votare"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4432b9c5b263014a:
    english: You may receive an invitation to vote in a poll via email or by notification in Loomio. Click on the link in the email to vote.
    translation: Puoi ricevere un invito a votare in un sondaggio via email o tramite una notifica su Loomio. Per votare, seleziona il link nell'email.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2a8641a22cf13597:
    english: Voting is easy, just click or tap on the icon of your choice.
    translation: Per votare, seleziona l'icona dell'opzione che preferisci.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  00d6e2698ade53cc:
    english: There are many types of polls. The example below shows a typical proposal with voting options of **Agree**, **Abstain** or **Disagree**. Other options may be available.
    translation: Esistono diversi tipi di sondaggio. L'esempio qui sotto mostra una proposta con le opzioni di voto **Favorevole**, **Astenuto** e **Contrario**. Potrebbero essere disponibili anche altre opzioni.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4f327c4a766af0ab:
    english: Read the poll, and any attached files, then cast your vote by selecting one of the options.
    translation: Leggi il sondaggio e gli eventuali file allegati, poi seleziona un'opzione per votare.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2cf633f37997e8b8:
    english: "### State a reason"
    translation: "### Indicare un motivo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c976385dcb75f67b:
    english: When voting, you can also leave a **Reason** to say why you have voted this way. This is optional.
    translation: Quando voti, puoi anche indicare un **Motivo** per spiegare la tua scelta. È facoltativo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6d0d884b0832dda9:
    english: "### Change your vote"
    translation: "### Cambiare il tuo voto"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  84629138984e43d0:
    english: You can **change your vote**, up until the proposal closes.
    translation: Puoi **cambiare il tuo voto** fino alla chiusura della proposta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8fcddbe7856e926b:
    english: There are many reasons why you might want to change your vote. For example if new information emerges it may cause you to rethink your decision, and change your vote.
    translation: Puoi cambiare voto per diversi motivi. Per esempio, nuove informazioni potrebbero farti riconsiderare la tua decisione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f7078b517c8bfed8:
    english: Once again, you can leave a reason to say why you have changed your vote.
    translation: Anche in questo caso, puoi indicare il motivo per cui hai cambiato voto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8e1b2953471f22ba:
    english: "### Results"
    translation: "### Risultati"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2153df12cd2b4fe2:
    english: Results of the proposal are updated as people vote, so you can see how a proposal is trending.
    translation: I risultati della proposta si aggiornano man mano che le persone votano, così puoi seguirne l'andamento.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  229571fe36c571b0:
    english: 'In a controversial proposal it is common to see mixed results, however this does not mean the proposal has failed.  '
    translation: Una proposta controversa può ricevere voti diversi, ma questo non significa che sia stata respinta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c3d5e53684bf3e88:
    english: Often the new information revealed during the proposal helps form a better proposal that is more likely to pass.
    translation: Spesso le nuove informazioni emerse durante la proposta aiutano a formularne una migliore, con maggiori possibilità di essere approvata.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b4783489f09ccf19:
    english: "### Outcome"
    translation: "### Conclusione"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  592f419764241ef6:
    english: When the proposal closes, the author is prompted to state the **Outcome**.
    translation: Alla chiusura della proposta, all'autore viene chiesto di indicare la **Conclusione**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0fae106181bbc6ac:
    english: This is an important final step to record the result of the decision and let everyone know what will happen next.
    translation: È il passaggio finale per registrare il risultato della decisione e far sapere a tutti che cosa accadrà in seguito.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
