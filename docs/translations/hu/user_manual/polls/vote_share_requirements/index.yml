    translated_on: '2026-09-29'
  2051086558658db2:
    english: Set a vote share requirement on an option when a proposal must receive a particular percentage of support, or remain below a particular percentage of opposition, to pass.
    translation: Állíts be szavazati arányra vonatkozó követelményt egy lehetőségnél, ha a javaslat elfogadásához a támogatásnak el kell érnie egy meghatározott százalékot, vagy az ellenző szavazatok arányának egy meghatározott százalék alatt kell maradnia.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f00d3806d6b890ae:
    english: Vote share requirements can be combined with a [quorum](/en/user_manual/polls/quorum/) to require both sufficient participation and a particular distribution of votes.
    translation: A szavazati arányra vonatkozó követelményt [részvételi küszöbbel](/en/user_manual/polls/quorum/) is kombinálhatod. Így a javaslat elfogadásához elegendő részvétel és megfelelő szavazati arány is szükséges.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0fc0acd12134f67e:
    english: When creating a proposal, select the edit icon beside an option.
    translation: Javaslat létrehozásakor kattints az egyik lehetőség melletti szerkesztés ikonra.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  27979c31066e397f:
    english: "![The edit icon beside the Consent option](edit-highlight-on-option.png)"
    translation: "![A szerkesztés ikon az Egyetértés lehetőség mellett](edit-highlight-on-option.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b3a4dee73762bea4:
    english: "## Eligible voters and votes cast"
    translation: "## Jogosult szavazók és leadott szavazatok"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1d04d75fa16a2a18:
    english: The percentage can be based on either **Votes cast** or **Eligible voters**.
    translation: A százalékot a **Leadott szavazatok** vagy a **Jogosult szavazók** alapján számíthatod.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  590e1a316f9ad174:
    english: "![Choosing whether a vote share requirement uses votes cast or eligible voters](./eligible-vs-cast.png)"
    translation: "![Annak kiválasztása, hogy a szavazati arányra vonatkozó követelmény a leadott szavazatokon vagy a jogosult szavazókon alapuljon](./eligible-vs-cast.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d4c72d50982e071d:
    english: "**Eligible voters** means everyone who is able to vote in the proposal. **Votes cast** means only the votes that have been submitted."
    translation: A **Jogosult szavazók** a javaslatban szavazásra jogosult összes embert jelenti. A **Leadott szavazatok** csak a beküldött szavazatokat jelenti.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  24945a1a4f0d08e3:
    english: A requirement of 75 percent agreement from eligible voters can pass only when at least 75 percent of all eligible voters vote for that option.
    translation: Ha a követelmény a jogosult szavazók legalább 75 százalékának egyetértése, az csak akkor teljesülhet, ha az összes jogosult szavazó legalább 75 százaléka erre a lehetőségre szavaz.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  14e4ff7cd000c7af:
    english: A requirement of 60 percent agreement from votes cast can pass when 60 percent of submitted votes support the option, regardless of overall turnout. Add a quorum when your process also requires a minimum level of participation.
    translation: Ha a követelmény a leadott szavazatok legalább 60 százalékának egyetértése, az akkor is teljesülhet, ha nem mindenki szavaz, feltéve hogy a beküldött szavazatok 60 százaléka támogatja a lehetőséget. Állíts be részvételi küszöböt is, ha a folyamatod minimális részvételt ír elő.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a8f235434b40ecd9:
    english: "## Different vote share requirements"
    translation: "## Többféle szavazati arányra vonatkozó követelmény"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6682c9656815bdbc:
    english: 'A proposal can have requirements on more than one option. For example:'
    translation: 'Egy javaslat több lehetőségéhez is beállíthatsz követelményt. Például:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dac1980305bef52d:
    english: |-
      - Agreement must be at least 75 percent of eligible voters
      - Abstention must be no more than 30 percent of votes cast
      - Block must be no more than 0 percent of votes cast
    translation: |-
      - Az Egyetértés aránya érje el a jogosult szavazók legalább 75 százalékát
      - A Tartózkodik aránya legfeljebb a leadott szavazatok 30 százaléka lehet
      - A Tiltakozás aránya legfeljebb a leadott szavazatok 0 százaléka lehet
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  11325e607f603eb7:
    english: You can also add requirements to a [poll template](/en/user_manual/polls/poll_templates/) so that new proposals created from the template use them by default.
    translation: A követelményeket [szavazássablonhoz](/en/user_manual/polls/poll_templates/) is hozzáadhatod. Így a sablonból létrehozott új javaslatok alapértelmezés szerint használják őket.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d6bffbdadc45e7f5:
    english: "## Detailed example"
    translation: "## Részletes példa"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4318dab03fe217ad:
    english: Oatmilk Cooperative is deciding whether to approve the budget for its six-week returnable bottle trial. Five people are eligible to vote.
    translation: A Zabtej Szövetkezet arról dönt, hogy jóváhagyja-e a visszaváltható palackok hathetes próbaidőszakának költségvetését. Öten jogosultak szavazni.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8f5779f2f1bb9ec3:
    english: Jamie uses the **Consent** proposal template, edits the Consent option, and enables its vote share requirement.
    translation: Jamie a **Beleegyezés** javaslatsablont használja, szerkeszti az Egyetértés lehetőséget, és bekapcsolja a szavazati arányra vonatkozó követelményt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  842038ffbd273e57:
    english: The cooperative's process requires at least 75 percent of eligible voters to support the proposal. Jamie sets the requirement to **At least 75% of Eligible voters**.
    translation: A szövetkezet szabályai szerint a javaslatot a jogosult szavazók legalább 75 százalékának támogatnia kell. Jamie a követelményt **Legalább 75% a Jogosult szavazókból** értékre állítja.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5b852b2e7a9b3034:
    english: "![The Consent option requiring at least 75 percent of eligible voters](./consent-vote-option.png)"
    translation: "![Az Egyetértés lehetőséghez a jogosult szavazók legalább 75 százalékának támogatása szükséges](./consent-vote-option.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8a42a135c0c11c98:
    english: Jamie also sets a 60 percent quorum. Jamie and Samira vote in agreement. All submitted votes support the proposal, but they represent only 40 percent of eligible voters, so neither requirement has been reached.
    translation: Jamie 60 százalékos részvételi küszöböt is beállít. Jamie és Samira egyetértésre szavaz. Minden leadott szavazat támogatja a javaslatot, de ez a jogosult szavazók mindössze 40 százalékát jelenti, így egyik követelmény sem teljesül.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2284440b974635e3:
    english: "![Two of five people have voted in agreement and neither requirement is reached](./first-vote-breakdown.png)"
    translation: "![Ötből ketten szavaztak egyetértésre, és egyik követelmény sem teljesül](./first-vote-breakdown.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2cb3890f4ef20320:
    english: Alex and Morgan then agree, while Taylor disagrees. All five people have voted, reaching the quorum, and four of five eligible voters agree. The 80 percent agreement exceeds the 75 percent vote share requirement, so both requirements show green check marks.
    translation: Ezután Alex és Morgan egyetértésre, Taylor pedig az egyet nem értésre szavaz. Mind az öten szavaztak, így teljesül a részvételi küszöb. Az öt jogosult szavazóból négyen egyetértenek. A 80 százalékos egyetértés meghaladja a 75 százalékos követelményt, ezért mindkét követelménynél zöld pipa jelenik meg.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
