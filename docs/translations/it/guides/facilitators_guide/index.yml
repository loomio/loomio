  980342866ab7bee6:
    english: An in-depth guide to applying key facilitation concepts in the online space.
    translation: Una guida approfondita per applicare i principi fondamentali della facilitazione online.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ac8728f5ce2ea8ce:
    english: Loomio is made by facilitators, and that plays a huge role in how it has been designed. This guide is about revealing more of that context, and translating facilitation concepts from the offline space to the online space.
    translation: Loomio è stato creato da persone che si occupano di facilitazione, e questo ha influito molto sulla sua progettazione. Questa guida spiega tale contesto e mostra come applicare online i principi della facilitazione usati negli incontri di persona.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e802660a44da1775:
    english: "## More about this guide"
    translation: "## Questa guida"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5cbd64dba51ca485:
    english: Whether employed by a professional facilitator, people peer-facilitating each other, or a group that has no awareness of facilitation at all, Loomio’s essential function is to mediate and support group communication toward a desired outcome. In other words, facilitation.
    translation: 'Che sia usato da una persona esperta di facilitazione, da persone che facilitano il lavoro reciproco o da un gruppo che non conosce la facilitazione, Loomio ha una funzione essenziale: mediare e sostenere la comunicazione del gruppo verso una conclusione condivisa. In altre parole, facilitare.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  25a956280b647fa6:
    english: 'Loomio is *groupware*:'
    translation: 'Loomio è un *software collaborativo*:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  33e304be58a0a55b:
    english: "> Collaborative software, or groupware, is designed to help people involved in a common task achieve their goals. One of the earliest definitions of collaborative software is “intentional group processes plus software to support them.” -- Wikipedia"
    translation: "> Il software collaborativo, o groupware, è progettato per aiutare le persone che svolgono un compito comune a raggiungere i propri obiettivi. Una delle prime definizioni di software collaborativo è «processi di gruppo intenzionali, insieme a software che li sostiene». -- Wikipedia"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  170a0b463e1ad8ca:
    english: There is a huge body of knowledge, best practice, and tradition in both in-person facilitation and online moderation, but the art and science of their intersection is only just emerging. This is the specific space where Loomio strives to excel.
    translation: La facilitazione degli incontri di persona e la moderazione online hanno entrambe un vasto patrimonio di conoscenze, buone pratiche e tradizioni. L'incontro tra questi due ambiti, però, è ancora in evoluzione. È qui che Loomio cerca di dare il meglio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
