  0b8bb762e37fb8c3:
    english: |-
      To create a poll or proposal and only invite the delegates, use the "Selected people only" poll setting.
      ![Selected people only setting when starting a proposal](poll_invited_people_only.png)
      Then when inviting people to vote you will see the "Delegates of group-name" option.
      ![Delegates of Oatmilk Cooperative option in the invite-to-vote form](poll_invite_delegates_group.png)
    translation: |-
      Gebruik de peilinginstelling "Alleen voor geselecteerde personen." om een peiling of voorstel te starten waarvoor je alleen afgevaardigden uitnodigt.
      ![De instelling Alleen voor geselecteerde personen bij het starten van een voorstel](poll_invited_people_only.png)
      Wanneer je mensen uitnodigt om te stemmen, zie je de optie "Afgevaardigden van groepsnaam".
      ![De optie Afgevaardigden van Oatmilk Cooperative in het uitnodigingsformulier](poll_invite_delegates_group.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e895a07efeaf4dcf:
    english: |-
      You can see a list of who the delegates are from the members tab of your group page. Use the filter menu and select "Delegates".
      ![Delegates option in the members filter](members_list_delegates.png)
    translation: |-
      Op het tabblad met leden van je groepspagina zie je wie de afgevaardigden zijn. Open het filtermenu en selecteer "Afgevaardigden".
      ![De optie Afgevaardigden in het ledenfilter](members_list_delegates.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
