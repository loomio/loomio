name: loomio-push-relay

services:
  database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: loomio_push_relay
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
    volumes:
      - database:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U relay -d loomio_push_relay"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    logging: &logging
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  relay:
    build: ..
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://relay:${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}@database:5432/loomio_push_relay
      APNS_PRIVATE_KEY_FILE: /run/secrets/apns-production.p8
      APNS_SANDBOX_PRIVATE_KEY_FILE: /run/secrets/apns-sandbox.p8
    volumes:
      - ./secrets:/run/secrets:ro
    networks: [backend]
    depends_on:
      database: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 256m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging

  ingress:
    image: nginx:1.31.0-alpine
    restart: unless-stopped
    environment:
      PROXY_TRUSTED_CIDR: ${PROXY_TRUSTED_CIDR:?Set the TLS proxy network subnet}
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      backend:
      proxy:
        aliases: [loomio-push-relay-ingress]
    depends_on:
      relay: {condition: service_healthy}
    mem_limit: 64m
    logging: *logging

networks:
  backend:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-kamal}

volumes:
  database:
