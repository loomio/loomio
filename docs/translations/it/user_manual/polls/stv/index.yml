  feee79b9f6e92de3:
    english: At the top, you'll see the counting method (Scottish STV or Meek STV) and quota type (Droop or Hare) along with the quota — the number of votes a candidate needed to win a seat.
    translation: 'In alto trovi il metodo di conteggio (Scottish STV o Meek STV), il tipo di quota (Droop o Hare) e la quota stessa: il numero di voti necessario a un candidato per ottenere un seggio.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e180eb800c3435cd:
    english: "### Elected candidates"
    translation: "### Candidati eletti"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8db8b2466db56f2b:
    english: 'A summary table of the winners with five columns:'
    translation: 'Una tabella riassume i vincitori in cinque colonne:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f998ffc721953501:
    english: |-
      | Column | Meaning |
      |--------|---------|
      | **Candidate** | The name of the elected candidate |
      | **Round elected** | Which counting round they reached the quota and won a seat. Round 1 means they won on first preferences alone; higher rounds mean they needed transferred votes from eliminated or surplus candidates. |
      | **First preferences** | How many voters ranked this candidate as their first choice. This shows a candidate's direct support before any vote transfers. |
      | **Final tally** | The candidate's vote tally at the moment they were elected. Due to vote transfers, this is often higher than their first preferences. |
      | **Surplus** | How much the candidate's final tally exceeded the quota (final tally minus quota). A larger surplus means stronger support beyond what was needed to win. In Scottish STV, this surplus is redistributed to voters' next preferences. |
    translation: |-
      | Colonna | Significato |
      |--------|---------|
      | **Candidato** | Il nome del candidato eletto |
      | **Round eletto** | Il turno di conteggio in cui ha raggiunto la quota e ottenuto un seggio. Il turno 1 indica che sono bastate le prime preferenze; nei turni successivi sono serviti voti trasferiti da candidati eliminati o con voti in eccedenza. |
      | **Prime preferenze** | Quante persone hanno indicato questo candidato come prima scelta. Mostra il sostegno diretto ricevuto prima di qualsiasi trasferimento di voti. |
      | **Conteggio finale** | I voti del candidato nel momento in cui è stato eletto. Grazie ai trasferimenti, spesso sono più delle sue prime preferenze. |
      | **Surplus** | Di quanto i voti del candidato al momento dell'elezione superavano la quota (conteggio finale meno quota). Un surplus maggiore indica un sostegno superiore a quello necessario per vincere. Nel metodo Scottish STV, questo surplus viene ridistribuito alle preferenze successive di chi ha votato il candidato. |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  efc41c326d955758:
    english: If the count results in a tie — where eliminating any of the remaining candidates would change the outcome — those candidates are shown in a separate table rather than arbitrarily choosing a winner.
    translation: Se il conteggio produce un pareggio in cui eliminare uno qualsiasi dei candidati rimasti cambierebbe il risultato, quei candidati vengono mostrati in una tabella separata, senza scegliere arbitrariamente un vincitore.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
