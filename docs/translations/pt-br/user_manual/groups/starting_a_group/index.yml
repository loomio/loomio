    translated_on: '2026-09-29'
  '019cdfc169ea858a':
    english: Type your group name. It's best to keep your group name short and concise.
    translation: Digite o nome do seu grupo. Prefira um nome curto e claro.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6ae6b08ae7fbe257:
    english: "### Group handle"
    translation: "### Sigla da organização"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b054d0f760888add:
    english: Your group is automatically assigned a handle. The handle is used in the group's URL and email address, such as **loomio.com/your-group-handle** and **your-group-handle@loomio.com**.
    translation: Uma sigla é atribuída automaticamente ao seu grupo. Ela aparece no endereço da página e no endereço de e-mail do grupo, como **loomio.com/your-group-handle** e **your-group-handle@loomio.com**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1dee654ba628ba95:
    english: You can edit the handle when you create the group and change it later in group settings. When you change it, links and email addresses that use the old handle continue to work. Loomio keeps up to three old handles; after that, the oldest handle expires.
    translation: Você pode editar a sigla ao criar o grupo ou alterá-la depois nas configurações do grupo. Após a alteração, os links e endereços de e-mail com a sigla antiga continuam funcionando. O Loomio mantém até três siglas antigas. Quando esse limite é ultrapassado, a mais antiga deixa de funcionar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
