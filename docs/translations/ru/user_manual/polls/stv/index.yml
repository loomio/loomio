---
navigation_title: Выборы STV
blocks:
  85590745d00e23c1:
    english: "# STV Elections"
    translation: "# Выборы STV"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  366f56443108e10f:
    english: "**Single Transferable Vote (STV)** is a proportional representation voting method for electing multiple winners from a field of candidates. It ensures that elected candidates proportionally represent the diversity of views among voters."
    translation: "**Единый передаваемый голос (STV)** — метод пропорционального голосования для избрания нескольких кандидатов. Он помогает распределить места в соответствии с разными взглядами избирателей."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  61dee55b45038f56:
    english: "## When to use STV"
    translation: "## Когда использовать STV"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8311dca26cec6519:
    english: 'Use an STV Election when you need to:'
    translation: 'Используйте выборы STV, если вам нужно:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1d4338734ec6e113:
    english: |-
      - Elect a **committee, board, or slate of delegates** from a pool of nominees
      - Ensure **proportional representation**, where minority factions can win seats proportional to their support
      - Run elections where voters rank candidates by preference
    translation: |-
      - Избрать **комитет, совет или группу делегатов** из числа выдвинутых кандидатов
      - Обеспечить **пропорциональное представительство**, чтобы группы меньшинства получили места соразмерно своей поддержке
      - Провести выборы, на которых избиратели располагают кандидатов в порядке предпочтения
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e6e1ae026f65a715:
    english: |-
      >[!NOTE]
      >STV is **not** the same as Loomio's [Rank poll](/en/user_manual/polls/rank/), which is a simpler score-based ranking for choosing a single best option. STV handles multi-winner elections with vote transfers and elimination rounds.
    translation: |-
      >[!NOTE]
      >STV отличается от [рейтингового голосования](/en/user_manual/polls/rank/) в Loomio. В рейтинговом голосовании варианты получают баллы, чтобы выбрать один лучший вариант. STV позволяет избрать нескольких кандидатов с передачей голосов и раундами исключения.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  62af8f95f18dbafe:
    english: "## Creating an STV Election"
    translation: "## Как создать выборы STV"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  edf2f36e75c81665:
    english: When starting a poll, select **STV Election** as the poll type, then add the candidates as the poll options. You can customize the poll by setting the **number of seats**, the **counting method**, and the **quota type**.
    translation: При создании голосования выберите тип **Выборы STV**, затем добавьте кандидатов в качестве вариантов. Вы можете задать **количество мест**, **метод подсчёта** и **тип квоты**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b40ddcfb8cdc44fd:
    english: In this example, Oatmilk Cooperative is electing three people to oversee its returnable packaging trial. The form explains the role, lists five candidates, and uses Scottish STV with the Droop quota.
    translation: В этом примере кооператив Oatmilk выбирает трёх человек для наблюдения за испытанием возвратной упаковки. В форме описана их роль, перечислены пять кандидатов и выбраны метод Scottish STV и квота Droop.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a34592929349d06:
    english: "### Number of seats"
    translation: "### Количество мест"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c09f5f51333612dc:
    english: How many winners should be elected. Must be less than the number of candidates.
    translation: Укажите, сколько человек нужно избрать. Мест должно быть меньше, чем кандидатов.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ddceec01d910b152:
    english: "### Counting method"
    translation: "### Метод подсчёта"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  39e9e81a89272771:
    english: 'There are two available methods for counting the votes:'
    translation: 'Доступны два метода подсчёта голосов:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a7031d1180e95273:
    english: |-
      Scottish STV
        : Recommended. The Weighted Inclusive Gregory Method (WIGM) used in Scottish local elections since 2007. Well-defined, straightforward rules. Best for most organizations.
    translation: |-
      Scottish STV
        : Рекомендуемый метод. Взвешенный инклюзивный метод Грегори (WIGM), который используется на местных выборах в Шотландии с 2007 года. У него чёткие и простые правила. Подходит большинству организаций.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1507e4fde88848dd:
    english: |-
      Meek STV
        : A more mathematically precise iterative method. When a candidate is eliminated, votes are recounted as if that candidate was never in the race.
    translation: |-
      Meek STV
        : Итеративный метод, более точный с математической точки зрения. Когда кандидат выбывает, голоса пересчитываются так, как если бы он не участвовал в выборах.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b9abcd12eef5f629:
    english: "### Quota type"
    translation: "### Тип квоты"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6dc3aea49266d40d:
    english: 'The quota is the minimum number of votes a candidate needs to win a seat. It can be either:'
    translation: 'Квота — минимальное число голосов, необходимое кандидату для получения места. Доступны два типа:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  88f62f286d8c550f:
    english: |-
      Droop
        : Recommended. The standard quota type for most STV elections, and used by Ireland, Australia, and Scotland. Droop guarantees a majority coalition wins a majority of seats. It is calculated as:
      \\[ floor(\frac{votes}{(seats + 1)}) + 1 \\]
    translation: |-
      Droop
        : Рекомендуемая квота. Это стандартный тип квоты для большинства выборов STV. Он используется в Ирландии, Австралии и Шотландии. Квота Droop гарантирует, что коалиция большинства получит большинство мест. Она рассчитывается так:
      \\[ floor(\frac{votes}{(seats + 1)}) + 1 \\]
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  817b3994e92898e8:
    english: |-
      Hare
        : A higher minimum threshold, and more proportional for smaller factions.
          Hare is preferred by DSA chapters to protect minority representation.
         It is calculated as:
          \\[ \frac{votes}{seats}\\]
    translation: |-
      Hare
        : Более высокий минимальный порог, который даёт более пропорциональное представительство небольшим группам.
          Отделения DSA предпочитают квоту Hare для защиты представительства меньшинств.
         Она рассчитывается так:
          \\[ \frac{votes}{seats}\\]
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f12065bdf5d3678e:
    english: |2-
        >[!TIP]
        > Droop will always compute to a smaller number of votes than Hare. For example, in an election with 100 votes and four seats, the Droop quota would be 21 and the Hare quota 25.
    translation: |-
      >[!TIP]
        > Квота Droop всегда требует меньше голосов, чем квота Hare. Например, при 100 голосах и четырёх местах квота Droop составит 21 голос, а квота Hare — 25 голосов.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  984516abc3cfd89b:
    english: "## How voting works"
    translation: "## Как проходит голосование"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  40e98247d87cdf27:
    english: 'In this example, Oatmilk Cooperative is electing three people to oversee the reusable packaging trial. Voters drag candidates above the line and rank them in order of preference:'
    translation: 'В этом примере кооператив Oatmilk выбирает трёх человек для наблюдения за испытанием многоразовой упаковки. Избиратели перетаскивают кандидатов выше линии и располагают их в порядке предпочтения:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f8aaa5391f05117f:
    english: |-
      - **Rank 1** = most preferred candidate
      - **Rank 2** = second choice
      - Continue ranking as many candidates as desired
    translation: |-
      - **Ранг 1** = наиболее предпочтительный кандидат
      - **Ранг 2** = второй по предпочтению кандидат
      - Вы можете ранжировать столько кандидатов, сколько хотите
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  70bd790faf93c916:
    english: Voters are not required to rank every candidate. Unranked candidates will not receive any of that voter's support.
    translation: Ранжировать всех кандидатов необязательно. Кандидаты без ранга не получат голоса этого избирателя при передаче.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d82e369c7c293a0c:
    english: |-
      ## How counting works
      The count is performed as follows:
    translation: |-
      ## Как подсчитываются голоса
      Подсчёт проходит следующим образом:
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0ea01b5d531abc06:
    english: |-
      1. A **quota** is calculated (minimum votes needed to win a seat).
      2. **First preferences** are counted for each candidate.
      3. If a candidate meets the quota, they are **elected**. Their surplus votes (above the quota) are **transferred** to voters' next preferences at a fractional value.
      4. If no candidate meets the quota, the candidate with the **fewest votes is eliminated**. Their votes transfer to voters' next preferences at full value.
      5. This process repeats until all seats are filled.
    translation: |-
      1. Рассчитывается **квота** — минимальное число голосов для получения места.
      2. Для каждого кандидата подсчитываются **Первые предпочтения**.
      3. Если кандидат достигает квоты, он **избирается**. Голоса сверх квоты **передаются** следующим по предпочтению кандидатам с дробным весом.
      4. Если никто не достигает квоты, кандидат с **наименьшим числом голосов выбывает**. Его голоса передаются следующим по предпочтению кандидатам с полным весом.
      5. Процесс повторяется, пока все места не будут заполнены.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c6f397233ad479e5:
    english: |-
      >[!TIP]
      >If a voter has ranked no remaining candidates, their ballot is "exhausted" and that vote is lost. This is why ranking more candidates is generally better.
    translation: |-
      >[!TIP]
      >Если среди оставшихся кандидатов нет никого, кого избиратель ранжировал, его бюллетень считается «исчерпанным» и голос больше не учитывается. Поэтому обычно полезно ранжировать больше кандидатов.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  acba228efb586cca:
    english: "## Understanding results"
    translation: "## Как читать результаты"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3b584c17ac358371:
    english: 'After the poll closes, results are displayed in several sections. In this election, Samira Patel, Alex Morgan, and Morgan Price fill the three committee seats:'
    translation: 'После закрытия голосования результаты появляются в нескольких разделах. На этих выборах три места в комитете получили Самира Патель, Алекс Морган и Морган Прайс:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9c3f3c8a80729fbf:
    english: "### Method and quota"
    translation: "### Метод и квота"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  feee79b9f6e92de3:
    english: At the top, you'll see the counting method (Scottish STV or Meek STV) and quota type (Droop or Hare) along with the quota — the number of votes a candidate needed to win a seat.
    translation: Вверху указаны метод подсчёта (Scottish STV или Meek STV), тип квоты (Droop или Hare) и сама квота — число голосов, необходимое кандидату для получения места.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e180eb800c3435cd:
    english: "### Elected candidates"
    translation: "### Избранные кандидаты"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8db8b2466db56f2b:
    english: 'A summary table of the winners with five columns:'
    translation: 'Сводная таблица избранных кандидатов состоит из пяти столбцов:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f998ffc721953501:
    english: |-
      | Column | Meaning |
      |--------|---------|
      | **Candidate** | The name of the elected candidate |
      | **Round elected** | Which counting round they reached the quota and won a seat. Round 1 means they won on first preferences alone; higher rounds mean they needed transferred votes from eliminated or surplus candidates. |
      | **First preferences** | How many voters ranked this candidate as their first choice. This shows a candidate's direct support before any vote transfers. |
      | **Final tally** | The candidate's vote tally at the moment they were elected. Due to vote transfers, this is often higher than their first preferences. |
      | **Surplus** | How much the candidate's final tally exceeded the quota (final tally minus quota). A larger surplus means stronger support beyond what was needed to win. In Scottish STV, this surplus is redistributed to voters' next preferences. |
    translation: |-
      | Столбец | Значение |
      |--------|---------|
      | **Кандидат** | Имя избранного кандидата |
      | **Раунд избран** | Раунд подсчёта, в котором кандидат достиг квоты и получил место. Раунд 1 означает, что ему хватило первых предпочтений. В последующих раундах для избрания понадобились голоса, переданные от выбывших кандидатов или излишек голосов избранных кандидатов. |
      | **Первые предпочтения** | Число избирателей, поставивших кандидата на первое место. Показывает прямую поддержку до передачи голосов. |
      | **Итоговый результат** | Число голосов у кандидата в момент избрания. После передачи голосов оно часто превышает число первых предпочтений. |
      | **Излишек** | Число голосов сверх квоты в момент избрания: итоговый результат минус квота. Чем больше излишек, тем выше поддержка сверх необходимой для избрания. В методе Scottish STV излишек перераспределяется следующим по предпочтению кандидатам. |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  efc41c326d955758:
    english: If the count results in a tie — where eliminating any of the remaining candidates would change the outcome — those candidates are shown in a separate table rather than arbitrarily choosing a winner.
    translation: Если при подсчёте возникает ничья и исключение любого из оставшихся кандидатов изменило бы результат, эти кандидаты показываются в отдельной таблице. Победитель не выбирается произвольно.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8a6ae4ad28f0acf6:
    english: "### Round-by-round details"
    translation: "### Подробности по каждому раунду"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3d907145fd075144:
    english: 'Expand **Round-by-round details** to see vote transfers and eliminations. Each row is a candidate and each column is a counting round:'
    translation: 'Разверните **Подробности по каждому раунду**, чтобы увидеть передачу голосов и исключение кандидатов. Каждая строка соответствует кандидату, а каждый столбец — раунду подсчёта:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cc37217cd681fabe:
    english: The green highlight shows when a candidate was elected, red shows when they were eliminated, and orange shows when they tied.
    translation: Зелёная подсветка показывает, когда кандидат был избран, красная — когда он выбыл, а оранжевая — когда возникла ничья.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ed4aaa0a898906fd:
    english: "## Exporting ballots"
    translation: "## Экспорт бюллетеней"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c96d54ebfbedae32:
    english: After the election closes, people who can view the results can export the ballots in BLT format for an independent recount or audit. The export contains candidate rankings and combines identical rankings into a single row with a ballot count. For anonymous elections it does not contain voter identities, ballot identifiers, submission times, or submission order.
    translation: После закрытия выборов люди с доступом к результатам могут экспортировать бюллетени в формате BLT для независимого пересчёта или проверки. Экспорт содержит порядок предпочтения кандидатов. Одинаковые варианты ранжирования объединяются в одну строку с числом бюллетеней. Для анонимных выборов экспорт не содержит имён избирателей, идентификаторов бюллетеней, времени отправки или порядка отправки.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
