      Give it a name, such as "Loomio notifications", then click "Create"
      ![](t5.png)
    translation: |-
      Вкажіть назву, наприклад «Сповіщення Loomio», і натисніть «Створити»
      ![](t5.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  10c1340978fde8ff:
