  bea1dad1b0b47107:
    english: Use tasks in threads and comments to name an action, assign it to someone, set a due date, and track whether it is complete.
    translation: Gebruik taken in threads en reacties om vast te leggen wat er moet gebeuren, wie het doet en wanneer het af moet zijn. Je kunt bijhouden of een taak is voltooid.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2398b3493bad759e:
    english: "## Add a task"
    translation: "## Een taak toevoegen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c240866e019fab51:
    english: While writing a thread or comment, expand the formatting toolbar and click **Task list**. Type the action beside the checkbox.
    translation: Open tijdens het schrijven van een thread of reactie de opmaakwerkbalk en klik op **Takenlijst**. Schrijf de taak naast het selectievakje.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f7d4f63b321e9af1:
    english: "## Name and assign the task to a person"
    translation: "## Een taak beschrijven en aan iemand toewijzen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5ea902e45aaf1f7a:
    english: Use an @mention in the task to assign it to a group member. An **Add due date** button appears once the task has an assignee.
    translation: Gebruik een @vermelding in de taak om deze aan een groepslid toe te wijzen. Zodra de taak aan iemand is toegewezen, verschijnt de knop **Voeg vervaldatum toe**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1134aedee6cafd8c:
    english: Tasks assigned to you appear on your **Tasks** page. Open **Tasks** from the sidebar to see them grouped by thread or poll.
    translation: Taken die aan jou zijn toegewezen, staan op de pagina **Taken**. Open **Taken** via de zijbalk om ze per thread of peiling te bekijken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5eae519b81c94f7a:
    english: "## Set a reminder"
    translation: "## Een herinnering instellen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  561597d43d716888:
    english: Click **Add due date** to choose a due date and when Loomio should email the assignee a reminder. You can also remove an existing due date from this dialog.
    translation: Klik op **Voeg vervaldatum toe** om een vervaldatum te kiezen en in te stellen wanneer Loomio een herinnering per e-mail stuurt naar degene aan wie de taak is toegewezen. Je kunt in dit venster ook een bestaande vervaldatum verwijderen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bd36c23f297b0429:
    english: "## Mark it as done"
    translation: "## Een taak als voltooid markeren"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  59b6138f35694902:
    english: Click the checkbox beside a task to mark it as done. You can do this while editing the text, while reading it if you are the assignee, or from the **Tasks** page. Click it again to reopen the task.
    translation: Klik op het selectievakje naast een taak om deze als voltooid te markeren. Dat kan terwijl je de tekst bewerkt, terwijl je de taak leest als deze aan jou is toegewezen, of op de pagina **Taken**. Klik er opnieuw op om de taak te heropenen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
