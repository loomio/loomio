  435f52763f0d9a5b:
    english: To keep a record of a thread discussion and decisions in polls, use **[Print thread](/en/user_manual/groups/data_export#print-thread-to-pdf)** and print the file to pdf.  You can then store a published copy of the thread in your chosen document storage archive.
    translation: Per conservare una copia di una discussione e delle decisioni prese nei sondaggi, usa **[Stampa discussione](/en/user_manual/groups/data_export#print-thread-to-pdf)** e salva il file in PDF. Puoi quindi archiviare una copia pubblicata della discussione nel sistema di conservazione documentale che preferisci.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a6b96750c9e1e590:
    english: To keep a complete record of the data in your Loomio group, use **[Export group data](/en/user_manual/groups/data_export#group-data-backup-or-export)**.
    translation: Per conservare una copia completa dei dati del tuo gruppo Loomio, usa **[Esporta i dati del gruppo](/en/user_manual/groups/data_export#group-data-backup-or-export)**.
    status: machine
