    translation: "**Archivos** - Documentos y otros archivos adjuntos en distintas partes del grupo. La pestaña reúne archivos de contextos de discusión, comentarios, propuestas y sondeos para que puedas encontrar un documento sin recordar dónde se adjuntó."
    status: machine
    provider: codex/gpt-6-sol
