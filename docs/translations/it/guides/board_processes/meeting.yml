    translated_on: '2026-09-30'
  6e6785b547007644:
    english: "## Meeting focus and review actions"
    translation: "## Definire le priorità e rivedere le attività"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  26bf98782eb61549:
    english: 'Establish a focus for the meeting, so you spend your precious time together talking about the most important topics.  '
    translation: Definisci le priorità della riunione, così potrete dedicare il tempo insieme agli argomenti più importanti.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c23fdd52f0a29b2c:
    english: Inviting members to contribute to the agenda helps everyone align, think about topics and energize for the meeting.
    translation: Invitare i membri a contribuire all'ordine del giorno aiuta tutti a prepararsi, riflettere sugli argomenti e arrivare alla riunione pronti a partecipare.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  52409f3ffabfb7d1:
    english: |-
      Actions:
      - focus the meeting on the most important things,
      - follow up and talk to members about actions from previous meetings.
    translation: |-
      Attività:
      - concentra la riunione sulle questioni più importanti,
      - verifica le attività concordate nelle riunioni precedenti e parlane con i membri.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a52dd7ebb4619e46:
    english: |-
      ### On Loomio
      Use a Loomio **Discussion** to prepare for your meeting:
      * remind members about the meeting coming up,
      * invite comment about the most important things to focus on,
      * summarize actions from the previous meeting and ask for an update.
    translation: |-
      ### Su Loomio
      Usa una **Discussione** su Loomio per preparare la riunione:
      * ricorda ai membri la prossima riunione,
      * chiedi quali sono gli argomenti più importanti da affrontare,
      * riepiloga le attività concordate nella riunione precedente e chiedi un aggiornamento.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5bcd10bb61edcc35:
    english: "## Agenda and notify"
    translation: "## Ordine del giorno e notifiche"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d9431846021bb8f3:
    english: Announce the meeting with a clear agenda. Attach papers, link to key documents and notify members.
    translation: Annuncia la riunione con un ordine del giorno chiaro. Allega i materiali, inserisci i link ai documenti principali e invia una notifica ai membri.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  41e84b882fa9bab1:
    english: This helps everyone prepare for the meeting, by reading the materials and thinking about topics of discussion and the decisions to be made.  Members are then more likely to arrive in context and ready for the meeting.
    translation: In questo modo, tutti possono prepararsi leggendo i materiali e riflettendo sugli argomenti da discutere e sulle decisioni da prendere.  I membri arriveranno alla riunione conoscendo il contesto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b6b0e7ed67711d5b:
    english: |-
      Actions:
      - prepare agenda, documents, materials and board papers,
      - notify members of meeting and send materials.
    translation: |-
      Attività:
      - prepara l'ordine del giorno, i documenti e gli altri materiali per il consiglio,
      - informa i membri della riunione e invia i materiali.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5b6d4a5158e41747:
    english: |-
      ### On Loomio
      Use a Loomio **Discussion** to prepare for your board meeting:
      * state details of meeting,
      * attach or link agenda, documents and other meeting materials,
      * invite members with a notification,
      * monitor 'Seen by' to see who has read the thread.
    translation: |-
      ### Su Loomio
      Usa una **Discussione** su Loomio per preparare la riunione del consiglio:
      * indica i dettagli della riunione,
      * allega l'ordine del giorno, i documenti e gli altri materiali oppure inserisci i relativi link,
      * invita i membri inviando una notifica,
      * controlla «Visto da» per sapere chi ha letto la discussione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f2c8f10394bf10c8:
    english: |-
      While similar to sending an email, a Loomio thread has advantages:
      - you can see who has read the thread, and remind those who haven't,
      - member replies or comments are visible to everyone who has permission to view the thread,
      - any discussion or questions about the agenda or meeting materials is held in a single place.
    translation: |-
      Una discussione su Loomio offre alcuni vantaggi rispetto a un'email:
      - puoi vedere chi l'ha letta e inviare un promemoria a chi non l'ha ancora fatto,
      - le risposte e i commenti dei membri sono visibili a tutte le persone autorizzate a vedere la discussione,
      - le domande e gli scambi sull'ordine del giorno e sui materiali restano in un unico posto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dd6d8cabe5f1810d:
    english: Members can find all the information about the meeting readily available in one place, thereby avoiding confusing email chains and losing important info in their email inbox.
    translation: I membri trovano tutte le informazioni sulla riunione in un unico posto, senza dover seguire lunghe catene di email o cercare informazioni importanti nella posta in arrivo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6a57d003a0bd5f07:
    english: |-
      ### Confirm
      Ask members to leave a comment confirming they have read the agenda and meeting papers and are prepared for the meeting. Use **Seen by** to identify anyone who may need a reminder.
    translation: |-
      ### Confermare
      Chiedi ai membri di lasciare un commento per confermare che hanno letto l'ordine del giorno e i materiali e che sono pronti per la riunione. Usa **Visto da** per individuare chi potrebbe aver bisogno di un promemoria.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d08b0ae5712ef2d:
    english: "## Find a time for meeting\nFinding a time to meet can be a frequent headache for many administrators. "
    translation: |-
      ## Trovare una data per la riunione
      Trovare un momento in cui tutti possano partecipare richiede spesso molto lavoro a chi organizza le riunioni.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1da8fdf943571a19:
    english: |-
      ### On Loomio
      If you have not yet set a date and time for the meeting or you need to find a time for a future meeting, you can use **Time poll**.
    translation: |-
      ### Su Loomio
      Se non hai ancora fissato la data e l'ora della riunione, oppure devi organizzare una riunione futura, puoi usare un **Sondaggio temporale**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f1c92e27dfd63153:
    english: Time poll makes it easy to see everyone's availability and find the best time, reducing time and energy needed for this common admin task.
    translation: Il sondaggio temporale ti permette di vedere facilmente quando tutti sono disponibili e di trovare il momento migliore, riducendo il tempo necessario per organizzare la riunione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  45b90fd46cce4976:
    english: Members in different time zones will see dates and times localized in their time zone.
    translation: I membri che si trovano in fusi orari diversi vedranno date e orari nel proprio fuso orario.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dc159c751f73d5d1:
    english: 'When the Time poll closes, choose the best time and send an outcome notification with a calendar invitation, so members can add the meeting to their calendar. '
    translation: Quando il sondaggio temporale si chiude, scegli il momento migliore e invia una notifica con la conclusione e un invito di calendario, così i membri possono aggiungere la riunione al proprio calendario.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4bafee41dd5f774c:
    english: "## Sign off minutes\nApproving or ratifying minutes is standard practice for formal meetings and good practice for all meetings.  "
    translation: |-
      ## Approvare il verbale
      Approvare o ratificare il verbale è una pratica standard nelle riunioni formali e utile anche nelle altre riunioni.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d9795ed92dabff7:
    english: 'Minutes provide a record of the meeting, key points raised during discussion, results of decisions and how people voted. They include the actions agreed and the person(s) responsible, and are often the starting point for the next meeting.  '
    translation: Il verbale documenta la riunione, i punti principali emersi nella discussione, le decisioni prese e come hanno votato le persone. Include le attività concordate e le persone responsabili e spesso costituisce il punto di partenza per la riunione successiva.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1fd0d860cba070db:
    english: Minutes are valuable as a reminder for people present, helpful for those absent and a record to consult in case of conflict.
    translation: Il verbale serve da promemoria a chi era presente, informa chi era assente e offre un riferimento in caso di disaccordo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  166796d872f35962:
    english: "### On Loomio"
    translation: "### Su Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ef51b49480cb721a:
    english: Post the minutes in the Loomio meeting thread within a few days of the meeting and invite participants to approve.  This keeps the minutes relevant and fresh in member's minds and is a great way to remind members of their actions.  It also saves some time during your meeting.
    translation: Pubblica il verbale nella discussione della riunione su Loomio entro pochi giorni e invita i partecipanti ad approvarlo.  Così i contenuti sono ancora recenti e puoi ricordare ai membri le attività concordate.  Questo consente anche di risparmiare tempo durante la riunione successiva.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ea02d6cf3ede73dc:
    english: The example above uses a **Choose** poll with two options 'Accept' or 'Review'.
    translation: 'L''esempio qui sopra usa un sondaggio **Scegliere** con due opzioni: «Accetta» e «Rivedi».'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  56c55da82e5ddeb7:
    english: 'When everyone has voted and the poll closes, state an outcome so everyone knows what has happened.  '
    translation: Quando tutti hanno votato e il sondaggio si chiude, pubblica una conclusione per comunicare a tutti che cosa è stato deciso.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e8b710a05eb113dc:
    english: 'If your meeting practice requires formal acceptance at the next meeting, schedule an agenda item to acknowledge and confirm polls and decisions made on Loomio, and record this in the meeting minutes.  '
    translation: Se la procedura del tuo gruppo richiede un'approvazione formale nella riunione successiva, aggiungi un punto all'ordine del giorno per prendere atto e confermare i sondaggi e le decisioni su Loomio. Riportalo nel verbale.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '06339a98b65ccc2c':
    english: For example; *"Does anyone wish to change their votes in Loomio?  If no, then let's resolve to formally approve polls made in Loomio during the last period."*
    translation: 'Per esempio: *"Qualcuno vuole cambiare il proprio voto su Loomio?  Se nessuno vuole cambiarlo, approviamo formalmente i sondaggi svolti su Loomio dall''ultima riunione."*'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f460b4ae218b375a:
    english: |-
      ## Approve reports
      Most meeting agendas include time for reports to be presented, discussed and approved; for example reports from the CEO, Financial, Operations, Health & Safety, and project reports.
    translation: |-
      ## Approvare le relazioni
      La maggior parte degli ordini del giorno prevede la presentazione, la discussione e l'approvazione di relazioni, per esempio quelle della direzione, dell'area finanziaria, delle attività operative, della salute e sicurezza o dei progetti.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  00abfe283956509a:
    english: Reports are very important to help everyone get on the same page, however they can absorb valuable time in a meeting that may be used more effectively.
    translation: Le relazioni aiutano tutti a condividere le stesse informazioni, ma possono occupare tempo prezioso durante una riunione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  861200207a1e1dfb:
    english: Attach or link reports to your meeting **thread** and invite questions about the reports in advance of the meeting.
    translation: Allega le relazioni alla **discussione** della riunione, oppure inserisci i relativi link, e invita i membri a porre domande prima dell'incontro.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  11f124875e8a5945:
    english: Members receive and read the reports at a time and place that works for them.  As members read and think about the reports, they can comment, ask questions and see responses in Loomio.
    translation: I membri ricevono e leggono le relazioni quando e dove preferiscono.  Mentre le leggono e ci riflettono, possono commentare, fare domande e vedere le risposte su Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2871f1673d36999a:
    english: A question asked by one member is likely of interest to other members, so when someone replies to the question, their response  is visible to everyone in the Loomio group.
    translation: Una domanda posta da un membro può interessare anche agli altri. Quando qualcuno risponde, la risposta è visibile a tutto il gruppo su Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  851a2a86a1047697:
    english: As members become familiar with discussing reports in Loomio, save a little more time by taking it a step further - seek approval of reports ahead of the meeting.
    translation: Quando i membri hanno preso familiarità con la discussione delle relazioni su Loomio, puoi risparmiare altro tempo chiedendo di approvarle prima della riunione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
