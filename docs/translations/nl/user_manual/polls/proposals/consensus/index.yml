  9f617c478e625137:
    english: "# Consensus"
    translation: "# Consensus"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7fdabc28ebd47ad3:
    english: A Consensus proposal seeks collective agreement from everyone involved. The default responses let participants agree, abstain, disagree, or block.
    translation: Een consensusvoorstel is bedoeld om met alle betrokkenen tot overeenstemming te komen. De standaardreacties zijn eens, onthouden, oneens en blokkeren.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  82dbfd2dd1160c29:
    english: This page explains how to run one Consensus proposal. See the [Consensus process](/en/guides/making_decisions/consensus_process) for the complete workflow from discussion and Sense check through amendment and outcome.
    translation: 'Deze pagina legt uit hoe je één consensusvoorstel behandelt. Bekijk het [consensusproces](/en/guides/making_decisions/consensus_process) voor het volledige verloop: van discussie en een peiling van de standpunten tot aanpassingen en een conclusie.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  12074389ed4de458:
    english: "## When to use Consensus"
    translation: "## Wanneer gebruik je consensus?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e1e89b6df3a1dbe1:
    english: Use Consensus for decisions where broad ownership matters and the group is prepared to work through concerns together. It suits shared standards, governance agreements, strategic commitments, and decisions that affect the whole group.
    translation: Gebruik consensus voor besluiten waarbij brede betrokkenheid belangrijk is en de groep bereid is zorgen samen te bespreken. Het past bij gezamenlijke standaarden, afspraken over bestuur, strategische toezeggingen en besluiten die de hele groep raken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a28ea900326c3254:
    english: Consensus usually requires discussion and proposal development before voting. Define the meaning and consequences of **Block** for your group. If your process does not use blocks, edit the template to remove that option.
    translation: Voor consensus zijn meestal een discussie en de uitwerking van een voorstel nodig voordat er wordt gestemd. Spreek met je groep af wat **Blokkeer** betekent en wat de gevolgen ervan zijn. Gebruikt jouw groep deze optie niet, verwijder die dan uit het sjabloon.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f795d33e2be59883:
    english: "## Example: adopt a bottle return standard"
    translation: "## Voorbeeld: een standaard voor het retourneren van flessen invoeren"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dda29f07ddb547f7:
    english: Oatmilk Cooperative has developed a standard covering deposits, collection, washing, food-safety records, and reporting. Because every team will use it, the cooperative seeks consensus before adopting it.
    translation: Oatmilk Cooperative heeft een standaard opgesteld voor statiegeld, inzameling, reiniging, voedselveiligheidsregistratie en verslaglegging. Omdat elk team de standaard gaat gebruiken, zoekt de coöperatie eerst consensus over de invoering ervan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9703f1f9474243af:
    english: "## Set up the proposal"
    translation: "## Stel het voorstel op"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e63b2959e1f6553:
    english: State the complete agreement being considered and link to supporting information. Explain each response, particularly the distinction between disagreeing and blocking. Allow enough time for questions and amendments.
    translation: Beschrijf de volledige afspraak waarover de groep beslist en verwijs naar ondersteunende informatie. Leg elke reactie uit, vooral het verschil tussen oneens zijn en blokkeren. Geef voldoende tijd voor vragen en aanpassingen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Stem"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  955925e0c6998049:
    english: Participants choose the response that matches their position and explain the interests or concerns behind it. A block reason should identify why adopting the proposal would violate a fundamental need or agreed principle.
    translation: Deelnemers kiezen de reactie die bij hun standpunt past en leggen uit welke belangen of zorgen eraan ten grondslag liggen. Wie blokkeert, moet aangeven waarom het voorstel een fundamentele behoefte of een afgesproken principe zou schenden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Bekijk de resultaten"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d5d9f0dbb463bed7:
    english: The chart shows the balance of responses. Review every disagreement and block reason; consensus is a process of resolving concerns, not only counting agreement votes.
    translation: De grafiek laat de verdeling van de reacties zien. Bekijk elke reden om het oneens te zijn of te blokkeren. Consensus draait om het oplossen van zorgen, niet alleen om het tellen van stemmen vóór het voorstel.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f7318776f4a978fc:
    english: If the group reaches agreement, publish an outcome recording the final standard and responsibilities. Otherwise, record what will be revised and when the group will return to the proposal.
    translation: Bereikt de groep overeenstemming, publiceer dan een conclusie waarin je de definitieve standaard en de verantwoordelijkheden vastlegt. Leg anders vast wat er wordt aangepast en wanneer de groep het voorstel opnieuw bespreekt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
