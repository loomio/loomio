  86490ad15147169e:
    english: Use a **Time poll** to find a time for a meeting or event. It serves the same purpose as scheduling tools such as Doodle, while keeping the scheduling process with the group's other Loomio work. Participants see the options in their own time zone.
    translation: Выкарыстоўвайце **Апытанне часу**, каб выбраць час для сустрэчы або мерапрыемства. Яно дапамагае ўзгадніць час, як і сэрвісы планавання накшталт Doodle, а ўвесь працэс застаецца разам з іншай працай групы ў Loomio. Удзельнікі бачаць прапанаваныя варыянты ў сваім часавым поясе.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2e21bb1b54b6fcf9:
    english: "## Time poll"
    translation: "## Апытанне часу"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  27ba736f4b564fe3:
    english: _Find when people are available to meet_
    translation: _Даведайцеся, калі людзі могуць сустрэцца_
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2f5455ba3b487407:
    english: Save time arranging a date for your meeting or event.
    translation: Выдаткоўвайце менш часу на ўзгадненне даты сустрэчы або мерапрыемства.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  859c3efc07ce0b04:
    english: Time poll makes it easy to see everyone's availability and find the best time.
    translation: Апытанне часу дапамагае ўбачыць, калі кожны можа сустрэцца, і выбраць найлепшы час.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  12ae9e9d3bdb0a4e:
    english: Give your Time poll a title and details. Enter a list of date and time options in your time zone.
    translation: Дайце апытанню часу назву і дадайце падрабязнасці. Увядзіце варыянты даты і часу ў сваім часавым поясе.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  548fb6cd6fcd9376:
    english: When setting timeslots, consider people in different time zones. Participants will see times localized in their time zone.
    translation: Калі прапануеце час, улічвайце людзей у іншых часавых паясах. Удзельнікі ўбачаць час у сваім часавым поясе.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3105405631b53c31:
    english: Set a meeting duration.
    translation: Задайце працягласць сустрэчы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d56a5d9986286e9:
    english: "### Voting"
    translation: "### Галасаванне"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  41d1e6a3a6739d95:
    english: People mark each time with the green thumbs-up icon when they are available, the yellow sideways thumb when they can attend if needed, or the red thumbs-down icon when they are unavailable.
    translation: Каля кожнага варыянту часу людзі выбіраюць зялёны значок з паднятым вялікім пальцам, калі могуць прыйсці, жоўты значок з вялікім пальцам убок, калі могуць прыйсці пры неабходнасці, або чырвоны значок з апушчаным вялікім пальцам, калі не могуць прыйсці.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b4784042c82735af:
    english: Participants can leave a reason comment to help the organizer find a suitable time.
    translation: Удзельнікі могуць пакінуць каментарый з тлумачэннем, каб дапамагчы арганізатарам выбраць прыдатны час.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0165a90bc22b6f7f:
    english: If the times don't work, participants can suggest alternatives using the message field. You can then update the poll with new times.
    translation: Калі прапанаваны час не падыходзіць, удзельнікі могуць прапанаваць іншыя варыянты ў полі паведамлення. Пасля гэтага вы можаце дадаць новыя варыянты часу ў апытанне.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6c7c09879e7d9bf8:
    english: The results update as voting proceeds in a table showing who is available when, so everyone can see which timeslots are popular.
    translation: Па меры галасавання табліца вынікаў абнаўляецца і паказвае, хто калі можа сустрэцца. Так усе бачаць, якія варыянты часу падыходзяць найбольшай колькасці людзей.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b4783489f09ccf19:
    english: "### Outcome"
    translation: "### Выснова"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3c0061b9af0a6bca:
    english: When the Time poll closes, pick the best time and post an outcome.
    translation: Калі апытанне часу закрыецца, выберыце найлепшы час і апублікуйце выснову.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  62ef08e40ed2f44b:
    english: "**Notify**: Add the people you are inviting to the meeting or event"
    translation: "**Паведаміць**: Дадайце людзей, якіх запрашаеце на сустрэчу або мерапрыемства"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  945f9e19218fb1bf:
    english: "**Meeting time**: Select the time that works best"
    translation: "**Час сустрэчы**: Выберыце час, які падыходзіць найлепш"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c5909628c21cd884:
    english: "**Meeting name**: Give your meeting a name. The Time poll title is used by default"
    translation: "**Назва сустрэчы**: Назавіце сустрэчу. Па змаўчанні выкарыстоўваецца назва апытання часу"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  81195d01767895e4:
    english: "**Location**: Add a physical location or a meeting link"
    translation: "**Месцазнаходжанне**: Дадайце фізічны адрас або спасылку на сустрэчу"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  af5765f5bdf83132:
    english: "**Statement**: Summarize the result and add any instructions for the meeting"
    translation: "**Заява**: Падсумуйце рашэнне і дадайце неабходныя ўказанні для сустрэчы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6c0cb92cca53d36a:
    english: Loomio includes the selected time, meeting name, duration, location, and statement in the outcome notification and calendar invitation.
    translation: Loomio дадае выбраны час, назву сустрэчы, працягласць, месцазнаходжанне і заяву ў апавяшчэнне аб выснове і запрашэнне ў каляндар.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
