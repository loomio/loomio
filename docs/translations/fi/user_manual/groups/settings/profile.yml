    english: "![Group profile settings](group_profile.png)"
    translation: "![Ryhmän profiiliasetukset](group_profile.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a1c12efad8cb82f5:
    english: "## Name and handle"
    translation: "## Nimi ja osoitetunnus"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3643c2e2ffd5db73:
    english: Choose a concise group name, particularly if the group will contain subgroups. Loomio uses the handle in the group's web address and group email address, such as `loomio.com/your-group-handle` and `your-group-handle@loomio.com`.
    translation: Valitse ryhmälle lyhyt nimi, etenkin jos ryhmään tulee alaryhmiä. Loomio käyttää osoitetunnusta ryhmän verkko- ja sähköpostiosoitteessa, esimerkiksi `loomio.com/your-group-handle` ja `your-group-handle@loomio.com`.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5a6e298a019f6a15:
    english: When you change the handle, links using the previous handle redirect to the new address, and email sent to the previous group address continues to reach the group. Loomio retains up to three previous handles; changing the handle again after that causes the oldest one to expire.
    translation: Kun vaihdat osoitetunnuksen, vanhaa tunnusta käyttävät linkit ohjautuvat uuteen osoitteeseen. Myös vanhaan ryhmän osoitteeseen lähetetty sähköposti tavoittaa ryhmän edelleen. Loomio säilyttää enintään kolme aiempaa osoitetunnusta. Jos vaihdat tunnuksen tämän jälkeen uudelleen, vanhin tunnus lakkaa toimimasta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2b45dd41be9c3d1d:
    english: "## Description"
    translation: "## Kuvaus"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7b707620077d9d19:
    english: Use the description to explain what the group is for, who participates, and how people are expected to use it. You can format the description and include links, documents, and videos.
    translation: Kerro kuvauksessa, mitä varten ryhmä on, ketkä siihen osallistuvat ja miten sitä on tarkoitus käyttää. Voit muotoilla kuvausta ja lisätä siihen linkkejä, asiakirjoja ja videoita.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  93a11a5e2927833e:
    english: The name and description may be visible to non-members depending on the group's [privacy settings](/en/user_manual/groups/settings/privacy).
    translation: Ryhmän nimi ja kuvaus voivat näkyä myös muille kuin jäsenille ryhmän [yksityisyysasetuksista](/en/user_manual/groups/settings/privacy) riippuen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0dff03268238aa26:
    english: "## Cover image and logo"
    translation: "## Kansikuva ja logo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9d08dda635bd5ce6:
    english: The cover image appears across the top of the group page. A wide image works best; the recommended size is 2048 × 512 pixels.
    translation: Kansikuva näkyy ryhmän sivun yläreunassa. Leveä kuva toimii parhaiten. Suositeltu koko on 2048 × 512 pikseliä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cc04654d8d08da59:
    english: The group logo identifies the group in navigation and other compact contexts. Upload the cover image and logo separately so each can be cropped for its intended shape.
    translation: Ryhmän logo auttaa tunnistamaan ryhmän navigoinnissa ja muissa pienissä näkymissä. Lataa kansikuva ja logo erikseen, jotta voit rajata kummankin sille sopivaan muotoon.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
