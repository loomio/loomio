---
navigation_title: Анонимное голосование
blocks:
  b4e842083054a400:
    english: "# Anonymous voting"
    translation: "# Анонимное голосование"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9b5c46644a952388:
    english: Anonymous voting, also known as blind voting, separates the record of who has voted from the votes themselves. Poll coordinators can see who was eligible and, once at least three people have voted, verify participation. Application users cannot connect a submitted vote with the person who submitted it.
    translation: При анонимном голосовании сведения о том, кто проголосовал, хранятся отдельно от самих голосов. Координаторы опроса видят, кто имел право голоса, а после того как проголосуют как минимум три человека, могут проверить участие каждого. Пользователи приложения не могут определить, кому принадлежит отправленный голос.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  105abff68025f002:
    english: This page explains the protections provided by anonymous voting, the information that is retained, and the limits of the guarantee.
    translation: На этой странице описано, как защищены участники анонимного голосования, какие сведения сохраняются и где проходят границы этой защиты.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6d97c8b835a3f1f2:
    english: "## How anonymous voting protects voters"
    translation: "## Как анонимное голосование защищает участников"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e01d5c77096b953e:
    english: 'An anonymous poll keeps two separate sets of records:'
    translation: 'В анонимном опросе отдельно хранятся два набора записей:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  757ab56b1165a71d:
    english: |-
      | Participation records | Submitted votes |
      | --- | --- |
      | Who is eligible to vote | The selected options or scores |
      | Who was invited, and by whom | The poll the vote belongs to |
      | Whether each eligible person has voted | No name or user account |
      | No selected options or scores | No link to a participation record |
    translation: |-
      | Записи об участии | Отправленные голоса |
      | --- | --- |
      | Кто имеет право голоса | Выбранные варианты или оценки |
      | Кто и кем был приглашён | Опрос, к которому относится голос |
      | Проголосовал ли каждый человек, имеющий право голоса | Нет имени или учётной записи пользователя |
      | Нет выбранных вариантов или оценок | Нет связи с записью об участии |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b908c49acc827932:
    english: There is no shared identifier that connects these records. Submitted votes also omit the actual submission time, invitation information, written reasons, attachments, and other metadata that could help identify a voter.
    translation: У этих записей нет общего идентификатора, который мог бы их связать. Вместе с отправленным голосом не сохраняются точное время его отправки, сведения о приглашении, письменные обоснования, вложения и другие данные, которые могли бы помочь установить личность голосовавшего.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6430a3d863d135b6:
    english: This separation is enforced when the vote is stored. It does not depend only on hiding names in the interface.
    translation: Разделение происходит при сохранении голоса. Защита не сводится к тому, что имена скрыты в интерфейсе.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b8e31aef3d559f28:
    english: "## While voting is open"
    translation: "## Пока голосование открыто"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f905c85734898a41:
    english: Results remain hidden from everyone until the poll closes. This includes poll coordinators, group administrators, and instance administrators using the application.
    translation: Результаты скрыты от всех до закрытия опроса, включая координаторов опроса, администраторов группы и администраторов сервиса, работающих через приложение.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  828df5247b61c9e6:
    english: 'When someone votes:'
    translation: 'Когда человек голосует:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  69b471d43b2148a1:
    english: |-
      - their submitted vote is stored without their name or participation record;
      - their participation record is marked to show that they have voted;
      - no vote event, notification, email, comment, or activity entry is created;
      - no copy of their selections is returned after submission; and
      - the interface confirms only that their vote was recorded.
    translation: |-
      - его голос сохраняется без имени и связи с записью об участии;
      - в записи об участии отмечается, что он проголосовал;
      - не создаётся событие голосования, уведомление, письмо, комментарий или запись о действиях;
      - после отправки ему не возвращается копия выбранных вариантов;
      - интерфейс подтверждает только то, что голос учтён.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4ffe4b38db135dab:
    english: The participation record does not store a precise time for when the person voted. Submitted votes are not ordered by submission time.
    translation: В записи об участии не хранится точное время голосования. Отправленные голоса не упорядочены по времени отправки.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7acaf6b48fc42105:
    english: "## Votes cannot be changed"
    translation: "## Голоса нельзя изменить"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  996ef90a3eee857b:
    english: Each eligible person can vote once. A submitted anonymous vote cannot be reviewed, changed, withdrawn, or replaced, including by a coordinator or administrator.
    translation: Каждый человек, имеющий право голоса, может проголосовать один раз. Отправленный анонимный голос нельзя просмотреть, изменить, отозвать или заменить. Это не могут сделать и координатор или администратор.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  58f0aaa6a45c1d37:
    english: Allowing a person to retrieve or replace their vote would require a persistent link between that person and the vote. Anonymous voting deliberately does not create that link.
    translation: Чтобы человек мог найти или заменить свой голос, пришлось бы сохранять постоянную связь между ним и голосом. При анонимном голосовании такая связь не создаётся.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2fd2c9d6ab0d6f68:
    english: Review your selections carefully before submitting.
    translation: Внимательно проверьте свой выбор перед отправкой.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  59f83c0e359484c4:
    english: "## Why anonymous votes do not have reasons"
    translation: "## Почему к анонимным голосам нельзя добавить обоснование"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  89f9d9a1d4bcb395:
    english: New anonymous votes cannot include a written reason or an attachment. Reasons can contain names, personal details, writing patterns, mentions, or other information that identifies the voter. They would also make individual votes easier to distinguish from the aggregate result.
    translation: К новому анонимному голосу нельзя добавить письменное обоснование или вложение. Обоснование может содержать имена, личные сведения, характерные особенности письма, упоминания или другие данные, позволяющие установить личность голосовавшего. Оно также помогло бы отличить отдельный голос от общих результатов.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  932f88aa929fb4eb:
    english: Participants can still discuss the poll in its thread where discussion is available. Those comments are ordinary named discussion contributions and are not attached to an anonymous vote.
    translation: Если обсуждение доступно, участники могут обсудить опрос в его теме. Такие комментарии публикуются от имени автора и не прикрепляются к анонимному голосу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1b21c2826270bd52:
    english: "## Results and exports"
    translation: "## Результаты и экспорт"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  afc45e50b74e075b:
    english: After the poll closes, the results are calculated from the detached votes and displayed as totals and other aggregate results supported by the poll type.
    translation: После закрытия опроса результаты рассчитываются по голосам, хранящимся отдельно от сведений об участниках. Они показываются в виде итоговых чисел и других сводных данных, предусмотренных для этого типа опроса.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b28c82ffcb4ffeb5:
    english: The application does not publish vote identifiers, submission order, or submission times. Poll exports contain aggregate results rather than a row for each anonymous vote, except that a closed STV election can be exported in BLT format. A BLT export contains the candidate rankings needed to recount the election, grouped when multiple ballots have the same ranking, without voter identities or ballot metadata.
    translation: Приложение не публикует идентификаторы голосов, порядок их отправки или время отправки. Экспорт опроса содержит сводные результаты, а не отдельную строку для каждого анонимного голоса. Исключение — завершённые выборы по системе STV, которые можно экспортировать в формате BLT. Экспорт BLT содержит порядок предпочтения кандидатов, необходимый для повторного подсчёта. Бюллетени с одинаковым порядком объединяются; личности голосовавших и метаданные бюллетеней не включаются.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8088fc78d955e9bb:
    english: An anonymous poll cannot be reopened after it closes.
    translation: После закрытия анонимный опрос нельзя открыть снова.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c368b542923cd542:
    english: "## Participation verification"
    translation: "## Проверка участия"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ab086d63c01514bf:
    english: Poll coordinators can view the named participation records. These always show who was eligible. Once at least three people have voted, they also show whether each person voted, but never show how anyone voted. If a poll closes with fewer than three votes, the participation status remains hidden.
    translation: Координаторы опроса могут просматривать записи об участии с именами людей. В них всегда видно, кто имел право голоса. После того как проголосуют как минимум три человека, в них также становится видно, кто проголосовал, но не то, как он проголосовал. Если к моменту закрытия опроса подано менее трёх голосов, сведения об участии остаются скрытыми.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dcad5d728e5e7cfd:
    english: Other participants cannot view this named participation information. Access to poll results does not grant access to the participation records.
    translation: Другие участники не могут просматривать эти сведения об участии с именами людей. Доступ к результатам опроса не даёт доступа к записям об участии.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  37cf06402ac47fa2:
    english: |-
      Coordinators can add eligible people while voting remains open, including after
      other people have voted. Existing voters cannot be removed from an anonymous
      poll.
    translation: |-
      Пока голосование открыто, координаторы могут добавлять людей с правом голоса, в том числе после того, как
      другие уже проголосовали. Удалить из анонимного опроса тех, кто уже
      проголосовал, нельзя.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  705e9b807681f6c1:
    english: "## Reminders"
    translation: "## Напоминания"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8ef8b501a1b27f63:
    english: For an anonymous poll lasting at least 24 hours, eligible people who have not voted receive one automatic reminder during the final 24 hours.
    translation: Если анонимный опрос длится не менее 24 часов, люди с правом голоса, которые ещё не проголосовали, получают одно автоматическое напоминание в последние 24 часа.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b23e579a8ef628de:
    english: The reminder is selected from participation records only. It does not inspect submitted votes or create a connection to them. If the deadline changes, the hourly reminder check uses the current deadline without maintaining a separate scheduled reminder for the poll.
    translation: Получатели напоминания определяются только по записям об участии. Отправленные голоса при этом не проверяются и не связываются с этими записями. Если срок голосования меняется, ежечасная проверка использует текущий срок. Отдельное напоминание по расписанию для опроса не создаётся.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  053ce04ce5f98ed8:
    english: Polls with a total voting period of less than 24 hours do not send this automatic reminder.
    translation: Если общая продолжительность голосования составляет менее 24 часов, автоматическое напоминание не отправляется.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb1f13e60fe178fe:
    english: "## What coordinators and administrators can see"
    translation: "## Что могут видеть координаторы и администраторы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e59c22e94231a746:
    english: 'Through the application, a poll coordinator, group administrator, or instance administrator may be able to see:'
    translation: 'Через приложение координатор опроса, администратор группы или администратор сервиса может видеть:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2da6b1feaa8b36f1:
    english: |-
      - the poll and its eligible voters;
      - whether each eligible person has voted, where their role permits access and at least three people have voted; and
      - aggregate results after the poll closes.
    translation: |-
      - опрос и список людей с правом голоса;
      - проголосовал ли каждый из них, если его роль даёт доступ к этим сведениям и проголосовали как минимум три человека;
      - сводные результаты после закрытия опроса.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6a96a87699625dc6:
    english: 'They cannot use application features to see:'
    translation: 'Возможности приложения не позволяют им увидеть:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dd4756253d1ee6dc:
    english: |-
      - which selections belong to a person;
      - individual votes or voting patterns;
      - when a particular vote was submitted; or
      - a reason, attachment, event, or notification associated with a submitted vote.
    translation: |-
      - какие варианты выбрал конкретный человек;
      - отдельные голоса или закономерности в голосовании;
      - когда был отправлен конкретный голос;
      - обоснование, вложение, событие или уведомление, связанное с отправленным голосом.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c350875c33492237:
    english: "## Limits of anonymous voting"
    translation: "## Ограничения анонимного голосования"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  48d04d7b4817e710:
    english: These protections prevent application users from linking a submitted vote to its voter. They are not a cryptographic protection against an operator who can inspect the database, backups, server logs, process memory, network traffic, or a modified version of the application.
    translation: Эти меры не позволяют пользователям приложения связать отправленный голос с человеком, который его подал. Они не дают криптографической защиты от оператора, имеющего доступ к базе данных, резервным копиям, журналам сервера, памяти процессов, сетевому трафику или изменённой версии приложения.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f901f505362e46b4:
    english: The result itself may also reveal information. A small electorate, a unanimous result, a distinctive combination of selections, or information shared outside the poll can make a person's choices easier to infer. Voters may also choose to identify themselves in discussion outside their submitted vote.
    translation: Сами результаты тоже могут раскрывать сведения. Если голосующих мало, результат единогласный, сочетание выбранных вариантов необычно или сведения о выборе стали известны за пределами опроса, определить, как проголосовал человек, может быть проще. Участники также могут сами рассказать о своём выборе в обсуждении, отдельно от отправленного голоса.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dfe97db86db52d15:
    english: Consider the size of the electorate and the sensitivity of the decision when deciding whether application-level anonymous voting is suitable.
    translation: Решая, подходит ли анонимное голосование в приложении, учитывайте число избирателей и важность сохранения тайны их выбора.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  60cc6f1a0163ec5d:
    english: "## Questions"
    translation: "## Вопросы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  57615f2c4c040dce:
    english: "### Can a coordinator see how I voted?"
    translation: "### Может ли координатор увидеть, как я проголосовал?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9dc1d151cc90e94e:
    english: No. Once at least three people have voted, a coordinator can verify whether you voted but cannot connect you with a submitted vote through the application. Below that threshold, your participation status remains hidden.
    translation: Нет. Когда проголосуют не менее трёх человек, координатор сможет проверить, голосовали ли вы. Но через приложение он не сможет связать вас с поданным голосом. Пока голосов меньше трёх, информация о вашем участии остаётся скрытой.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b3b382d2575b715d:
    english: "### Can I see my vote after submitting it?"
    translation: "### Могу ли я увидеть свой голос после его подачи?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  52aaaa1c764d5745:
    english: No. The application confirms that your vote was recorded, then discards the selections from the voting interface. It cannot retrieve your vote without creating the link that anonymous voting is designed to avoid.
    translation: Нет. Приложение подтвердит, что ваш голос учтён, и удалит выбранные вами варианты из интерфейса голосования. Чтобы снова показать ваш голос, потребовалась бы связь между вами и голосом, которой при анонимном голосовании нет.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  071dd89d6eb38ebf:
    english: "### Can I change or withdraw my vote?"
    translation: "### Могу ли я изменить или отозвать свой голос?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '059b75c51b4225ab':
    english: No. There is no link that would let the application identify which submitted vote to change or remove.
    translation: Нет. Приложение не может определить, какой из поданных голосов нужно изменить или удалить, поскольку между вами и голосом нет связи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c94077837455425f:
    english: "### Will I receive an email confirming my vote?"
    translation: "### Получу ли я письмо с подтверждением голосования?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f36a8b43a3fdee36:
    english: No. Voting creates only the on-screen acknowledgement and updates your participation record. It does not send a confirmation email or create a notification or activity event.
    translation: Нет. На экране появится подтверждение, а в записи о вашем участии будет отмечено, что вы проголосовали. Письмо с подтверждением не отправляется. Уведомление или запись в ленте активности также не создаётся.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f320754cf7ee77bc:
    english: "### Does a public poll reveal more information?"
    translation: "### Раскрывает ли публичное голосование больше информации?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f84121f0c18e03ab:
    english: Public access may allow people to see the poll and its aggregate results after it closes. It does not expose the named participation records or individual anonymous votes.
    translation: Публичный доступ может позволить людям увидеть голосование и его сводные результаты после закрытия. Именные записи об участии и отдельные анонимные голоса остаются скрытыми.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e2dbe0c181f865ca:
    english: "### Is anonymous voting suitable for every election?"
    translation: "### Подходит ли анонимное голосование для любых выборов?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  05fc871619a2170d:
    english: No. It provides application-level separation between identities and votes. Decisions requiring protection from system operators or independently verifiable cryptographic elections need a system designed for those requirements.
    translation: Нет. Оно разделяет данные об избирателях и их голосах на уровне приложения. Если требуется защита от операторов системы или независимо проверяемые криптографические выборы, нужна система, рассчитанная на эти требования.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
