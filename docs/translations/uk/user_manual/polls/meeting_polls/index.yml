navigation_title: Опитування щодо часу
blocks:
  ebb0b3146e7f6937:
    english: "# Time poll"
    translation: "# Опитування щодо часу"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  86490ad15147169e:
    english: Use a **Time poll** to find a time for a meeting or event. It serves the same purpose as scheduling tools such as Doodle, while keeping the scheduling process with the group's other Loomio work. Participants see the options in their own time zone.
    translation: Використовуйте **Опитування щодо часу**, щоб знайти час для зустрічі або події. Воно допомагає узгодити час, як і сервіси на кшталт Doodle, але зберігає цей процес поряд з іншою роботою групи в Loomio. Учасники бачать запропоновані варіанти у своєму часовому поясі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2e21bb1b54b6fcf9:
    english: "## Time poll"
    translation: "## Опитування щодо часу"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  27ba736f4b564fe3:
    english: _Find when people are available to meet_
    translation: _Дізнайтеся, коли люди можуть зустрітися_
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2f5455ba3b487407:
    english: Save time arranging a date for your meeting or event.
    translation: Заощадьте час на узгодженні дати зустрічі або події.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  859c3efc07ce0b04:
    english: Time poll makes it easy to see everyone's availability and find the best time.
    translation: Опитування щодо часу допомагає побачити, коли всі вільні, і вибрати найкращий час.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  12ae9e9d3bdb0a4e:
    english: Give your Time poll a title and details. Enter a list of date and time options in your time zone.
    translation: Додайте назву й подробиці опитування щодо часу. Вкажіть варіанти дати й часу у своєму часовому поясі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  548fb6cd6fcd9376:
    english: When setting timeslots, consider people in different time zones. Participants will see times localized in their time zone.
    translation: Вибираючи варіанти часу, враховуйте людей в інших часових поясах. Учасники побачать час у своєму часовому поясі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3105405631b53c31:
    english: Set a meeting duration.
    translation: Вкажіть тривалість зустрічі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8d56a5d9986286e9:
    english: "### Voting"
    translation: "### Голосування"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  41d1e6a3a6739d95:
    english: People mark each time with the green thumbs-up icon when they are available, the yellow sideways thumb when they can attend if needed, or the red thumbs-down icon when they are unavailable.
    translation: Для кожного варіанта часу люди вибирають зелений значок із піднятим великим пальцем, якщо можуть прийти, жовтий значок із повернутим убік пальцем, якщо можуть прийти за потреби, або червоний значок з опущеним пальцем, якщо не можуть.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b4784042c82735af:
    english: Participants can leave a reason comment to help the organizer find a suitable time.
    translation: Учасники можуть залишити коментар із поясненням, щоб допомогти організатору вибрати відповідний час.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0165a90bc22b6f7f:
    english: If the times don't work, participants can suggest alternatives using the message field. You can then update the poll with new times.
    translation: Якщо запропонований час не підходить, учасники можуть запропонувати інші варіанти в полі повідомлення. Тоді ви зможете додати нові варіанти часу до опитування.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6c7c09879e7d9bf8:
    english: The results update as voting proceeds in a table showing who is available when, so everyone can see which timeslots are popular.
    translation: Результати оновлюються під час голосування. Таблиця показує, хто й коли може прийти, тож усі бачать, які варіанти часу підходять більшості.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b4783489f09ccf19:
    english: "### Outcome"
    translation: "### Висновок"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3c0061b9af0a6bca:
    english: When the Time poll closes, pick the best time and post an outcome.
    translation: Коли опитування щодо часу завершиться, виберіть найкращий час і опублікуйте висновок.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  62ef08e40ed2f44b:
    english: "**Notify**: Add the people you are inviting to the meeting or event"
    translation: "**Повідомити**: Додайте людей, яких запрошуєте на зустріч або подію"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  945f9e19218fb1bf:
    english: "**Meeting time**: Select the time that works best"
    translation: "**Час зустрічі**: Виберіть час, який підходить найкраще"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c5909628c21cd884:
    english: "**Meeting name**: Give your meeting a name. The Time poll title is used by default"
    translation: "**Назва наради**: Дайте зустрічі назву. За замовчуванням використовується назва опитування щодо часу"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  81195d01767895e4:
    english: "**Location**: Add a physical location or a meeting link"
    translation: "**Місце**: Додайте адресу або посилання на онлайн-зустріч"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  af5765f5bdf83132:
    english: "**Statement**: Summarize the result and add any instructions for the meeting"
    translation: "**Пояснення**: Підсумуйте висновок і додайте вказівки для учасників зустрічі"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6c0cb92cca53d36a:
    english: Loomio includes the selected time, meeting name, duration, location, and statement in the outcome notification and calendar invitation.
    translation: Loomio додає вибраний час, назву зустрічі, її тривалість, місце й пояснення до сповіщення про висновок і запрошення в календарі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
