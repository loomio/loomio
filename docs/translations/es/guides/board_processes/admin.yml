  435f52763f0d9a5b:
    english: To keep a record of a thread discussion and decisions in polls, use **[Print thread](/en/user_manual/groups/data_export#print-thread-to-pdf)** and print the file to pdf.  You can then store a published copy of the thread in your chosen document storage archive.
    translation: Para conservar un registro de la discusión de un hilo y de las decisiones tomadas en las encuestas, usa **[Imprimir hilo](/en/user_manual/groups/data_export#print-thread-to-pdf)** e imprime el archivo en PDF. Después puedes guardar una copia publicada del hilo en el archivo de documentos que elijas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a6b96750c9e1e590:
    english: To keep a complete record of the data in your Loomio group, use **[Export group data](/en/user_manual/groups/data_export#group-data-backup-or-export)**.
    translation: Para conservar un registro completo de los datos de tu grupo de Loomio, usa **[Exportar datos del grupo](/en/user_manual/groups/data_export#group-data-backup-or-export)**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
