  fea51a2c49fc3f27:
    english: Does it impact other people and your organization?  Takashi's colleagues want him to perform his role effectively, not waste time in meetings, and so appreciate he needs a working computer.  Purchase of a piece of equipment also impacts on the organization budget, purchasing policies and may need to be aligned with other team members.
    translation: Betrifft das andere Menschen und deine Organisation?  Takashis Kolleginnen und Kollegen möchten, dass er seine Aufgaben gut erfüllen kann und in Besprechungen keine Zeit durch Computerprobleme verliert. Sie verstehen daher, dass er einen funktionierenden Computer braucht.  Der Kauf betrifft auch das Budget und die Beschaffungsregeln der Organisation und muss möglicherweise mit anderen Teammitgliedern abgestimmt werden.
