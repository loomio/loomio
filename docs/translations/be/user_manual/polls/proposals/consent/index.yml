  9153f30a2c3db9f2:
    english: "# Consent"
    translation: "# Згода"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e16bed826124695f:
    english: A Consent proposal asks whether a course of action is safe to try. Participants either consent or raise an objection. An objection identifies a concrete risk or harm that the proposal should address.
    translation: Прапанова са згодай дапамагае высветліць, ці бяспечна паспрабаваць пэўны спосаб дзеянняў. Удзельнікі выказваюць згоду або пярэчанне. Пярэчанне ўказвае на канкрэтную рызыку або шкоду, якую трэба ўлічыць у прапанове.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d675dd47ae42c929:
    english: This page explains how to run one Consent proposal. See the [Consent process](/en/guides/making_decisions/consent_process) for the complete workflow, including questions, Sense check, amendments, objections, and outcome.
    translation: На гэтай старонцы апісана, як правесці адну прапанову са згодай. Поўны парадак дзеянняў, у тым ліку пытанні, праверка разумення, папраўкі, пярэчанні і выснова, апісаны ў раздзеле [Працэс згоды](/en/guides/making_decisions/consent_process).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7c4c79526b1d437b:
    english: "## When to use Consent"
    translation: "## Калі выкарыстоўваць згоду"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1b99c0443bd1e4c8:
    english: Use Consent when the group needs a workable decision that can proceed unless there is a valid objection. It suits experiments, operational policies, role agreements, and other decisions the group can review after gaining experience.
    translation: Выкарыстоўвайце згоду, калі групе патрэбна рашэнне, якое можна выканаць пры адсутнасці абгрунтаваных пярэчанняў. Гэты спосаб падыходзіць для эксперыментаў, правілаў працы, дамоўленасцяў аб ролях і іншых рашэнняў, якія група можа перагледзець пасля набыцця досведу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  966f3146dc9f61f1:
    english: Consent does not require everyone to prefer the proposal. Define what counts as an objection before voting, and explain how objections will be tested and resolved.
    translation: Згода не азначае, што прапанова павінна падабацца ўсім. Да пачатку галасавання вызначце, што лічыцца пярэчаннем, і патлумачце, як пярэчанні будуць правяраць і вырашаць.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e6cf2f0ebd4a7f58:
    english: "## Example: start a bottle trial"
    translation: "## Прыклад: пачаць выпрабаванне зваротных бутэлек"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ad7be5e188748cb3:
    english: Oatmilk Cooperative proposes starting a six-week returnable-bottle trial next month. The trial is limited in scope and includes a review, so the group asks whether it is safe to try.
    translation: Кааператыў «Аўсянае малако» прапануе ў наступным месяцы пачаць шасцітыднёвае выпрабаванне зваротных бутэлек. Выпрабаванне мае абмежаваны маштаб і прадугледжвае перагляд, таму група высвятляе, ці бяспечна яго паспрабаваць.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9703f1f9474243af:
    english: "## Set up the proposal"
    translation: "## Падрыхтуйце прапанову"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6458750b94201df6:
    english: Describe the proposed action, its limits, safeguards, and review point. Keep **Consent** and **Objection** meanings precise, and require a reason for objections so the concern can be understood and addressed.
    translation: Апішыце прапанаванае дзеянне, яго межы, меры засцярогі і тэрмін перагляду. Дакладна растлумачце значэнне варыянтаў **Згода** і **Пярэчанне**. Патрабуйце абгрунтавання пярэчанняў, каб група магла зразумець і разгледзець выказаную занепакоенасць.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Галасуйце"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d98c0e71880c8828:
    english: Participants select **Consent** when the proposal is safe enough to try, even if it is not their preferred plan. They select **Objection** when they can describe a material risk or harm.
    translation: Удзельнікі выбіраюць **Згода**, калі прапанову дастаткова бяспечна паспрабаваць, нават калі яны аддалі б перавагу іншаму плану. Яны выбіраюць **Пярэчанне**, калі могуць апісаць істотную рызыку або шкоду.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Азнаёмцеся з вынікамі"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b0265040032f48e5:
    english: The chart makes objections visible, but the group must examine the reasons. Resolve a valid objection by amending the proposal, adding a safeguard, changing its scope, or deciding not to proceed.
    translation: Дыяграма паказвае пярэчанні, але групе трэба разгледзець іх прычыны. Каб вырашыць абгрунтаванае пярэчанне, змяніце прапанову, дадайце меру засцярогі, змяніце маштаб дзеянняў або вырашыце не працягваць.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a87df65569cb3a09:
    english: Publish an outcome that records the agreed action, any safeguards, who is responsible, and when the group will review it.
    translation: Апублікуйце выснову і запішыце ў ёй узгодненыя дзеянні, меры засцярогі, адказных за выкананне і час, калі група перагледзіць рашэнне.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
