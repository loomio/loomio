  66f32f2b3cf56e0d:
    english: |-
      ## Key points
      - Freedom to make a decision.
      - Invite people to offer their advice.
      - Take into account other people’s voices.
    translation: |-
      ## Pontos principais
      - Liberdade para tomar uma decisão.
      - Convide as pessoas a dar conselhos.
      - Considere o que outras pessoas têm a dizer.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  54d4f1ac3c2bd91f:
    english: |-
      ## Steps in the Advice process
      You notice a problem or opportunity and take the initiative.
      1. Frame the decision, identify who owns it, and invite the affected people and relevant experts.
      2. Start a Loomio **discussion** and, when a structured response or deadline is useful, run an **Advice proposal**.
      3. Clarify and build on the advice through vote reasons and discussion comments.
      4. Make the decision, then publish an **outcome** explaining what was decided and how the advice informed it.
    translation: |-
      ## Etapas do processo de aconselhamento
      Você percebe um problema ou uma oportunidade e toma a iniciativa.
      1. Defina a decisão, identifique quem é responsável por ela e convide as pessoas afetadas e quem tem experiência relevante.
      2. Inicie uma **discussão** no Loomio e, se for útil ter respostas estruturadas ou um prazo, crie uma **proposta de aconselhamento**.
      3. Esclareça e aprofunde os conselhos por meio das justificativas dos votos e dos comentários na discussão.
      4. Tome a decisão e publique uma **conclusão** explicando o que foi decidido e como os conselhos contribuíram para a decisão.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6088bbd1e12e8920:
    english: "## Benefits\n- Advice helps you make a better decision for your organization. \n- Foster relationships, learning opportunities and diverse input.\n- Stimulate initiative and creativity, and more enjoyable work."
    translation: "## Benefícios\n- Os conselhos ajudam você a tomar uma decisão melhor para sua organização. \n- Fortalecem as relações, criam oportunidades de aprendizado e trazem diferentes perspectivas.\n- Estimulam a iniciativa, a criatividade e um trabalho mais agradável."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
