---
navigation_title: Vote anonyme
blocks:
  b4e842083054a400:
    english: "# Anonymous voting"
    translation: "# Vote anonyme"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9b5c46644a952388:
    english: Anonymous voting, also known as blind voting, separates the record of who has voted from the votes themselves. Poll coordinators can see who was eligible and, once at least three people have voted, verify participation. Application users cannot connect a submitted vote with the person who submitted it.
    translation: Le vote anonyme, aussi appelé vote à bulletin secret, sépare les informations sur la participation des votes eux-mêmes. Les coordinateurs du sondage peuvent voir qui avait le droit de voter et, dès qu’au moins trois personnes ont voté, vérifier la participation. Les utilisateurs de l’application ne peuvent pas relier un vote enregistré à la personne qui l’a exprimé.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  105abff68025f002:
    english: This page explains the protections provided by anonymous voting, the information that is retained, and the limits of the guarantee.
    translation: Cette page explique les protections offertes par le vote anonyme, les informations conservées et les limites de cette garantie.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6d97c8b835a3f1f2:
    english: "## How anonymous voting protects voters"
    translation: "## Comment le vote anonyme protège les votants"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e01d5c77096b953e:
    english: 'An anonymous poll keeps two separate sets of records:'
    translation: 'Un sondage anonyme conserve deux ensembles de données distincts :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  757ab56b1165a71d:
    english: |-
      | Participation records | Submitted votes |
      | --- | --- |
      | Who is eligible to vote | The selected options or scores |
      | Who was invited, and by whom | The poll the vote belongs to |
      | Whether each eligible person has voted | No name or user account |
      | No selected options or scores | No link to a participation record |
    translation: |-
      | Données de participation | Votes enregistrés |
      | --- | --- |
      | Les personnes ayant le droit de voter | Les options choisies ou les notes attribuées |
      | Les personnes invitées et l’auteur de chaque invitation | Le sondage auquel appartient le vote |
      | Le fait que chaque personne ayant le droit de voter ait voté ou non | Aucun nom ni compte utilisateur |
      | Aucune option choisie ni note attribuée | Aucun lien vers une donnée de participation |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b908c49acc827932:
    english: There is no shared identifier that connects these records. Submitted votes also omit the actual submission time, invitation information, written reasons, attachments, and other metadata that could help identify a voter.
    translation: Aucun identifiant commun ne relie ces données. Les votes enregistrés ne contiennent pas non plus l’heure exacte de leur envoi, les informations d’invitation, les raisons écrites, les pièces jointes ou d’autres métadonnées susceptibles d’identifier un votant.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6430a3d863d135b6:
    english: This separation is enforced when the vote is stored. It does not depend only on hiding names in the interface.
    translation: Cette séparation est appliquée lors de l’enregistrement du vote. Elle ne repose pas uniquement sur le masquage des noms dans l’interface.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b8e31aef3d559f28:
    english: "## While voting is open"
    translation: "## Pendant que le vote est ouvert"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f905c85734898a41:
    english: Results remain hidden from everyone until the poll closes. This includes poll coordinators, group administrators, and instance administrators using the application.
    translation: Les résultats restent masqués pour tout le monde jusqu’à la clôture du sondage. Cela inclut les coordinateurs du sondage, les administrateurs du groupe et les administrateurs de l’instance qui utilisent l’application.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  828df5247b61c9e6:
    english: 'When someone votes:'
    translation: 'Lorsqu’une personne vote :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  69b471d43b2148a1:
    english: |-
      - their submitted vote is stored without their name or participation record;
      - their participation record is marked to show that they have voted;
      - no vote event, notification, email, comment, or activity entry is created;
      - no copy of their selections is returned after submission; and
      - the interface confirms only that their vote was recorded.
    translation: |-
      - son vote est enregistré sans son nom ni ses données de participation ;
      - ses données de participation indiquent qu’elle a voté ;
      - aucun événement de vote, notification, e-mail, commentaire ou entrée d’activité n’est créé ;
      - aucune copie de ses choix ne lui est renvoyée après l’envoi ; et
      - l’interface confirme uniquement que son vote a été enregistré.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4ffe4b38db135dab:
    english: The participation record does not store a precise time for when the person voted. Submitted votes are not ordered by submission time.
    translation: Les données de participation ne conservent pas l’heure précise à laquelle la personne a voté. Les votes enregistrés ne sont pas classés par ordre d’envoi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7acaf6b48fc42105:
    english: "## Votes cannot be changed"
    translation: "## Les votes ne peuvent pas être modifiés"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  996ef90a3eee857b:
    english: Each eligible person can vote once. A submitted anonymous vote cannot be reviewed, changed, withdrawn, or replaced, including by a coordinator or administrator.
    translation: Chaque personne ayant le droit de voter ne peut voter qu’une fois. Un vote anonyme enregistré ne peut pas être consulté, modifié, retiré ou remplacé, même par un coordinateur ou un administrateur.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  58f0aaa6a45c1d37:
    english: Allowing a person to retrieve or replace their vote would require a persistent link between that person and the vote. Anonymous voting deliberately does not create that link.
    translation: Permettre à une personne de retrouver ou de remplacer son vote nécessiterait un lien permanent entre cette personne et son vote. Le vote anonyme ne crée pas ce lien.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2fd2c9d6ab0d6f68:
    english: Review your selections carefully before submitting.
    translation: Vérifiez attentivement vos choix avant d’envoyer votre vote.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  59f83c0e359484c4:
    english: "## Why anonymous votes do not have reasons"
    translation: "## Pourquoi les votes anonymes ne comportent pas de raisons"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  89f9d9a1d4bcb395:
    english: New anonymous votes cannot include a written reason or an attachment. Reasons can contain names, personal details, writing patterns, mentions, or other information that identifies the voter. They would also make individual votes easier to distinguish from the aggregate result.
    translation: Les nouveaux votes anonymes ne peuvent contenir ni raison écrite ni pièce jointe. Une raison peut contenir des noms, des détails personnels, des habitudes d’écriture, des mentions ou d’autres informations permettant d’identifier la personne qui a voté. Elle peut aussi rendre un vote individuel plus facile à distinguer du résultat global.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  932f88aa929fb4eb:
    english: Participants can still discuss the poll in its thread where discussion is available. Those comments are ordinary named discussion contributions and are not attached to an anonymous vote.
    translation: Les participants peuvent toujours parler du sondage dans son fil de discussion, lorsque la discussion est disponible. Ces commentaires sont des contributions ordinaires portant le nom de leur auteur. Ils ne sont pas associés à un vote anonyme.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1b21c2826270bd52:
    english: "## Results and exports"
    translation: "## Résultats et exportations"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  afc45e50b74e075b:
    english: After the poll closes, the results are calculated from the detached votes and displayed as totals and other aggregate results supported by the poll type.
    translation: Après la clôture du sondage, les résultats sont calculés à partir des votes séparés des données de participation. Ils sont affichés sous forme de totaux et d’autres résultats globaux selon le type de sondage.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b28c82ffcb4ffeb5:
    english: The application does not publish vote identifiers, submission order, or submission times. Poll exports contain aggregate results rather than a row for each anonymous vote, except that a closed STV election can be exported in BLT format. A BLT export contains the candidate rankings needed to recount the election, grouped when multiple ballots have the same ranking, without voter identities or ballot metadata.
    translation: L’application ne publie ni les identifiants des votes, ni leur ordre d’envoi, ni l’heure à laquelle ils ont été envoyés. Les exportations de sondages contiennent des résultats globaux plutôt qu’une ligne par vote anonyme. Une élection STV clôturée peut toutefois être exportée au format BLT. Cette exportation contient les classements des candidats nécessaires pour recompter les voix. Les bulletins ayant le même classement sont regroupés, sans identité des votants ni métadonnées des bulletins.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8088fc78d955e9bb:
    english: An anonymous poll cannot be reopened after it closes.
    translation: Un sondage anonyme ne peut pas être rouvert après sa clôture.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c368b542923cd542:
    english: "## Participation verification"
    translation: "## Vérification de la participation"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ab086d63c01514bf:
    english: Poll coordinators can view the named participation records. These always show who was eligible. Once at least three people have voted, they also show whether each person voted, but never show how anyone voted. If a poll closes with fewer than three votes, the participation status remains hidden.
    translation: Les coordinateurs du sondage peuvent consulter les données de participation nominatives. Elles indiquent toujours qui avait le droit de voter. Dès qu’au moins trois personnes ont voté, elles indiquent également si chaque personne a voté, mais jamais ce qu’elle a choisi. Si un sondage se termine avec moins de trois votes, les informations sur la participation restent masquées.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dcad5d728e5e7cfd:
    english: Other participants cannot view this named participation information. Access to poll results does not grant access to the participation records.
    translation: Les autres participants ne peuvent pas consulter ces données de participation nominatives. L’accès aux résultats du sondage ne donne pas accès aux données de participation.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  37cf06402ac47fa2:
    english: |-
      Coordinators can add eligible people while voting remains open, including after
      other people have voted. Existing voters cannot be removed from an anonymous
      poll.
    translation: |-
      Les coordinateurs peuvent ajouter des personnes ayant le droit de voter tant que le vote reste ouvert, y compris après que
      d’autres personnes ont voté. Les personnes ayant déjà voté ne peuvent pas être retirées d’un sondage
      anonyme.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  705e9b807681f6c1:
    english: "## Reminders"
    translation: "## Rappels"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8ef8b501a1b27f63:
    english: For an anonymous poll lasting at least 24 hours, eligible people who have not voted receive one automatic reminder during the final 24 hours.
    translation: Pour un sondage anonyme qui dure au moins 24 heures, les personnes ayant le droit de voter qui ne l’ont pas encore fait reçoivent un rappel automatique au cours des dernières 24 heures.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b23e579a8ef628de:
    english: The reminder is selected from participation records only. It does not inspect submitted votes or create a connection to them. If the deadline changes, the hourly reminder check uses the current deadline without maintaining a separate scheduled reminder for the poll.
    translation: Les destinataires du rappel sont déterminés uniquement à partir des données de participation. Le rappel ne consulte pas les votes enregistrés et ne crée aucun lien avec eux. Si l’échéance change, la vérification horaire des rappels utilise la nouvelle échéance, sans conserver de rappel programmé séparément pour le sondage.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  053ce04ce5f98ed8:
    english: Polls with a total voting period of less than 24 hours do not send this automatic reminder.
    translation: Les sondages dont la période de vote totale est inférieure à 24 heures n’envoient pas ce rappel automatique.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb1f13e60fe178fe:
    english: "## What coordinators and administrators can see"
    translation: "## Ce que peuvent voir les coordinateurs et les administrateurs"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e59c22e94231a746:
    english: 'Through the application, a poll coordinator, group administrator, or instance administrator may be able to see:'
    translation: 'Dans l’application, un coordinateur du sondage, un administrateur du groupe ou un administrateur de l’instance peut, selon ses droits, voir :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2da6b1feaa8b36f1:
    english: |-
      - the poll and its eligible voters;
      - whether each eligible person has voted, where their role permits access and at least three people have voted; and
      - aggregate results after the poll closes.
    translation: |-
      - le sondage et les personnes ayant le droit de voter ;
      - si chaque personne ayant le droit de voter a voté, lorsque son rôle lui donne accès à cette information et qu’au moins trois personnes ont voté ; et
      - les résultats globaux après la clôture du sondage.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6a96a87699625dc6:
    english: 'They cannot use application features to see:'
    translation: 'Les fonctionnalités de l’application ne leur permettent pas de voir :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dd4756253d1ee6dc:
    english: |-
      - which selections belong to a person;
      - individual votes or voting patterns;
      - when a particular vote was submitted; or
      - a reason, attachment, event, or notification associated with a submitted vote.
    translation: |-
      - les choix d’une personne ;
      - les votes individuels ou les tendances de vote ;
      - le moment où un vote particulier a été envoyé ; ou
      - une raison, une pièce jointe, un événement ou une notification associé à un vote enregistré.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c350875c33492237:
    english: "## Limits of anonymous voting"
    translation: "## Limites du vote anonyme"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  48d04d7b4817e710:
    english: These protections prevent application users from linking a submitted vote to its voter. They are not a cryptographic protection against an operator who can inspect the database, backups, server logs, process memory, network traffic, or a modified version of the application.
    translation: Ces protections empêchent les utilisateurs de l’application de relier un vote enregistré à la personne qui l’a exprimé. Elles ne constituent pas une protection cryptographique contre un opérateur capable d’inspecter la base de données, les sauvegardes, les journaux du serveur, la mémoire des processus, le trafic réseau ou une version modifiée de l’application.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f901f505362e46b4:
    english: The result itself may also reveal information. A small electorate, a unanimous result, a distinctive combination of selections, or information shared outside the poll can make a person's choices easier to infer. Voters may also choose to identify themselves in discussion outside their submitted vote.
    translation: Le résultat lui-même peut aussi révéler des informations. Un petit nombre de votants, un résultat unanime, une combinaison de choix distinctive ou des informations partagées hors du sondage peuvent faciliter la déduction des choix d’une personne. Les votants peuvent également choisir de révéler leur identité dans une discussion, en dehors de leur vote enregistré.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dfe97db86db52d15:
    english: Consider the size of the electorate and the sensitivity of the decision when deciding whether application-level anonymous voting is suitable.
    translation: Pour déterminer si le vote anonyme proposé par l’application convient, tenez compte du nombre de personnes appelées à voter et de la sensibilité de la décision.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  60cc6f1a0163ec5d:
    english: "## Questions"
    translation: "## Questions"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  57615f2c4c040dce:
    english: "### Can a coordinator see how I voted?"
    translation: "### Une personne qui coordonne le sondage peut-elle voir mon vote ?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9dc1d151cc90e94e:
    english: No. Once at least three people have voted, a coordinator can verify whether you voted but cannot connect you with a submitted vote through the application. Below that threshold, your participation status remains hidden.
    translation: Non. Dès qu’au moins trois personnes ont voté, la personne qui coordonne le sondage peut vérifier si vous avez voté, mais l’application ne lui permet pas d’associer votre nom à un vote. En dessous de ce seuil, votre participation reste masquée.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b3b382d2575b715d:
    english: "### Can I see my vote after submitting it?"
    translation: "### Puis-je consulter mon vote après l’avoir envoyé ?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  52aaaa1c764d5745:
    english: No. The application confirms that your vote was recorded, then discards the selections from the voting interface. It cannot retrieve your vote without creating the link that anonymous voting is designed to avoid.
    translation: Non. L’application confirme que votre vote a été enregistré, puis retire vos choix de l’interface de vote. Elle ne peut pas retrouver votre vote sans créer le lien que le vote anonyme vise à éviter.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  071dd89d6eb38ebf:
    english: "### Can I change or withdraw my vote?"
    translation: "### Puis-je modifier ou retirer mon vote ?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '059b75c51b4225ab':
    english: No. There is no link that would let the application identify which submitted vote to change or remove.
    translation: Non. Aucun lien ne permet à l’application de déterminer quel vote modifier ou retirer.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c94077837455425f:
    english: "### Will I receive an email confirming my vote?"
    translation: "### Vais-je recevoir un courriel confirmant mon vote ?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f36a8b43a3fdee36:
    english: No. Voting creates only the on-screen acknowledgement and updates your participation record. It does not send a confirmation email or create a notification or activity event.
    translation: Non. Lorsque vous votez, l’application affiche une confirmation à l’écran et met à jour votre dossier de participation. Elle n’envoie pas de courriel de confirmation et ne crée ni notification ni événement d’activité.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f320754cf7ee77bc:
    english: "### Does a public poll reveal more information?"
    translation: "### Un sondage public révèle-t-il davantage d’informations ?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f84121f0c18e03ab:
    english: Public access may allow people to see the poll and its aggregate results after it closes. It does not expose the named participation records or individual anonymous votes.
    translation: L’accès public peut permettre de consulter le sondage et ses résultats agrégés après sa clôture. Il ne donne pas accès aux dossiers de participation nominatifs ni aux votes anonymes individuels.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e2dbe0c181f865ca:
    english: "### Is anonymous voting suitable for every election?"
    translation: "### Le vote anonyme convient-il à toutes les élections ?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  05fc871619a2170d:
    english: No. It provides application-level separation between identities and votes. Decisions requiring protection from system operators or independently verifiable cryptographic elections need a system designed for those requirements.
    translation: Non. Il sépare les identités des votes au sein de l’application. Les décisions qui exigent une protection contre les personnes qui exploitent le système ou une vérification cryptographique indépendante nécessitent un système conçu pour répondre à ces exigences.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
