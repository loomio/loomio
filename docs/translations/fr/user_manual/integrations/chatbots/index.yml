  e21550bf41c185b9:
    english: |-
      ## Generate a Webhook URL
      We've prepared step by step walk-throughs for each service we support. Follow the right one for your service to obtain the webhook URL you'll need to add the chat integration in Loomio.
    translation: |-
      ## Générer une URL de webhook
      Nous avons préparé des guides détaillés pour chaque service pris en charge. Suivez le guide correspondant à votre service pour obtenir l'URL de webhook nécessaire à la configuration de l'intégration de chat dans Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
