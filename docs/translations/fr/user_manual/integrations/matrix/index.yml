  f3106c22cd3d4059:
    english: 'Loomio can send notifications into your Matrix channels when new discussions, proposals, comments, votes, and outcomes occur. '
    translation: Loomio peut envoyer des notifications dans vos salons Matrix lors de nouvelles discussions, propositions, commentaires, votes et conclusions.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a20cf2be00dac0ce:
    english: Matrix is nice because it allows some HTML in the chatroom, and Loomio takes advantage of this.
    translation: Matrix accepte certains éléments HTML dans les salons de discussion, que Loomio utilise pour présenter ses notifications.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ffe12502f0030fec:
    english: Our Matrix integration is a little different to our other chat integrations - it does not use a webhook - we've built a custom bot client for this one.
    translation: 'L’intégration Matrix fonctionne différemment des autres intégrations de chat de Loomio : elle utilise un robot dédié plutôt qu’un webhook.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  44db147f65127a55:
    english: You will need to create a matrix user for the bot to login as.
    translation: Vous devez créer un compte Matrix que le robot utilisera pour se connecter.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  98045e5bf1339543:
    english: Once you've created a user for the bot, sign in at that user to obtain the following information.
    translation: Une fois le compte créé, connectez-vous avec ce compte pour obtenir les informations suivantes.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
