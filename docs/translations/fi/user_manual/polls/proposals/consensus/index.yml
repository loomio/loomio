  7fdabc28ebd47ad3:
    english: A Consensus proposal seeks collective agreement from everyone involved. The default responses let participants agree, abstain, disagree, or block.
    translation: Konsensusehdotuksessa pyritään kaikkien osallistujien yhteiseen sopimukseen. Oletusvastauksilla osallistujat voivat kannattaa ehdotusta, pidättäytyä äänestämästä, olla eri mieltä tai estää ehdotuksen etenemisen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  82dbfd2dd1160c29:
    english: This page explains how to run one Consensus proposal. See the [Consensus process](/en/guides/making_decisions/consensus_process) for the complete workflow from discussion and Sense check through amendment and outcome.
    translation: Tällä sivulla kerrotaan, miten toteutat yksittäisen konsensusehdotuksen. [Konsensusprosessin](/en/guides/making_decisions/consensus_process) kuvauksessa käydään läpi koko työnkulku keskustelusta ja alustavasta kannanotosta muutoksiin ja lopulliseen päätelmään.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  12074389ed4de458:
    english: "## When to use Consensus"
    translation: "## Milloin käyttää konsensusta"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e1e89b6df3a1dbe1:
    english: Use Consensus for decisions where broad ownership matters and the group is prepared to work through concerns together. It suits shared standards, governance agreements, strategic commitments, and decisions that affect the whole group.
    translation: Käytä konsensusta päätöksissä, joihin koko ryhmän on tärkeää sitoutua ja joiden herättämät huolenaiheet ryhmä on valmis käsittelemään yhdessä. Se sopii yhteisiin käytäntöihin, hallintosopimuksiin, strategisiin sitoumuksiin ja koko ryhmää koskeviin päätöksiin.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a28ea900326c3254:
    english: Consensus usually requires discussion and proposal development before voting. Define the meaning and consequences of **Block** for your group. If your process does not use blocks, edit the template to remove that option.
    translation: Konsensus edellyttää yleensä keskustelua ja ehdotuksen kehittämistä ennen äänestystä. Määritelkää ryhmässänne, mitä **Lohko** tarkoittaa ja mitä siitä seuraa. Jos estäminen ei kuulu ryhmänne päätöksentekoon, poista tämä vastausvaihtoehto mallista.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f795d33e2be59883:
    english: "## Example: adopt a bottle return standard"
    translation: "## Esimerkki: pullonpalautuksen käytännön hyväksyminen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dda29f07ddb547f7:
    english: Oatmilk Cooperative has developed a standard covering deposits, collection, washing, food-safety records, and reporting. Because every team will use it, the cooperative seeks consensus before adopting it.
    translation: Kauramaito-osuuskunta on laatinut yhteisen käytännön, joka kattaa pantit, keräyksen, pesun, elintarviketurvallisuuden kirjaukset ja raportoinnin. Koska kaikki tiimit käyttävät sitä, osuuskunta hakee konsensusta ennen sen hyväksymistä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9703f1f9474243af:
    english: "## Set up the proposal"
    translation: "## Luo ehdotus"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e63b2959e1f6553:
    english: State the complete agreement being considered and link to supporting information. Explain each response, particularly the distinction between disagreeing and blocking. Allow enough time for questions and amendments.
    translation: Kuvaa hyväksyttäväksi ehdotettu sopimus kokonaisuudessaan ja linkitä sitä tukeviin tietoihin. Selitä, mitä kukin vastaus tarkoittaa, erityisesti ero eri mieltä olemisen ja estämisen välillä. Varaa riittävästi aikaa kysymyksille ja muutosehdotuksille.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Äänestä"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  955925e0c6998049:
    english: Participants choose the response that matches their position and explain the interests or concerns behind it. A block reason should identify why adopting the proposal would violate a fundamental need or agreed principle.
    translation: Osallistujat valitsevat kantaansa vastaavan vaihtoehdon ja kertovat sen taustalla olevista tarpeista tai huolenaiheista. Estämisen perustelussa tulee kertoa, miksi ehdotuksen hyväksyminen olisi vastoin perustavanlaatuista tarvetta tai sovittua periaatetta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Tarkastele tuloksia"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d5d9f0dbb463bed7:
    english: The chart shows the balance of responses. Review every disagreement and block reason; consensus is a process of resolving concerns, not only counting agreement votes.
    translation: Kaavio näyttää vastausten jakauman. Käy läpi jokainen eriävä mielipide ja estämisen perustelu. Konsensuksessa käsitellään huolenaiheita, ei vain lasketa ehdotusta kannattavia ääniä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f7318776f4a978fc:
    english: If the group reaches agreement, publish an outcome recording the final standard and responsibilities. Otherwise, record what will be revised and when the group will return to the proposal.
    translation: Jos ryhmä pääsee sopimukseen, julkaise lopullinen päätelmä, johon kirjataan hyväksytty käytäntö ja vastuut. Muussa tapauksessa kirjaa, mitä tarkistetaan ja milloin ryhmä palaa ehdotukseen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
