  62c53ea4911e0c79:
    english: "## Search"
    translation: "## חיפוש"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  29cbb6f48ca978fa:
    english: The Search button in the top navigation bar opens global search from any page in Loomio.
    translation: כפתור החיפוש בסרגל הניווט העליון פותח חיפוש בכל Loomio מכל עמוד.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6286c9b6f2b16fc4:
    english: Search includes content you can access across all your groups and direct discussions. It can find discussion titles and context, comments, polls, votes, and outcomes.
    translation: החיפוש כולל תוכן שיש לכם גישה אליו בכל הקבוצות והדיונים הישירים. אפשר למצוא בו כותרות ותוכן של דיונים, תגובות, סקרים, הצבעות ומסקנות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c5a77d75258a11e6:
    english: Enter a word or phrase, then press Enter or select the search icon. For example, searching for **bottle** finds Oatmilk Cooperative content containing that word.
    translation: יש להזין מילה או ביטוי, ואז ללחוץ על Enter או לבחור בסמל החיפוש. לדוגמה, חיפוש של **bottle** ימצא תוכן של Oatmilk Cooperative שמכיל את המילה הזאת.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1b93fd8aaf142d37:
    english: "### Search tips"
    translation: "### טיפים לחיפוש"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  99f906ecbde3a538:
    english: "- Start with one or two distinctive words from the title or content you remember.\n- Search matches the beginning of a word, so a partial word such as **bott** can match **bottle**. \n- It will compensate for misspellings when results for the given query are very few.\n- Use the filters to limit results to an organization, subgroup, tag, or content type such as comments or polls.\n- Sort by **Best match** when relevance matters, or by newest or oldest when you know roughly when the content was posted."
    translation: "- כדאי להתחיל במילה אחת או שתיים שקל לזהות מהכותרת או מהתוכן הזכור לכם.\n- החיפוש מזהה תחילת מילים, כך שגם מילה חלקית כמו **bott** יכולה למצוא את **bottle**. \n- כשיש מעט מאוד תוצאות לשאילתה, החיפוש עשוי לפצות על שגיאות כתיב.\n- ניתן להשתמש במסננים כדי להגביל את התוצאות לארגון, לתת־קבוצה, לתגית או לסוג תוכן, כגון תגובות או סקרים.\n- כדאי למיין לפי **ההתאמה הטובה ביותר** כשהרלוונטיות חשובה, או לפי החדש ביותר או הישן ביותר כשידוע בקירוב מתי התוכן פורסם."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e7c532f120c4807d:
    english: "## Filter discussions"
    translation: "## סינון דיונים"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  91bf7098343a1efa:
    english: Use the controls beside Search to filter discussions by open or closed status or by category tag. Combining a search term with a filter can narrow a long discussion list quickly.
    translation: ניתן להשתמש בפקדים שלצד החיפוש כדי לסנן דיונים לפי מצב פתוח או סגור, או לפי תגית קטגוריה. שילוב של מילת חיפוש ומסנן יכול לצמצם במהירות רשימה ארוכה של דיונים.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e3d2099d0e6fe6fa:
    english: "## Category tags"
    translation: "## תגיות קטגוריה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  932506e53b51fac1:
    english: Tags group related discussions and polls under names chosen by your group, such as a project, team, or area of work.
    translation: תגיות מקבצות דיונים וסקרים קשורים תחת שמות שהקבוצה בוחרת, כגון פרויקט, צוות או תחום עבודה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d761f1c7397d8e51:
    english: Select a tag on the **Discussions** tab to show matching discussions. People with permission to start or edit discussions can apply tags. See [Category tags](/en/user_manual/discussions/tags) for setup and permission details.
    translation: יש לבחור תגית בלשונית **דיונים** כדי להציג דיונים תואמים. מי שיש להם הרשאה לפתוח או לערוך דיונים יכולים להוסיף להם תגיות. למידע על הגדרה והרשאות, ראו [תגיות קטגוריה](/en/user_manual/discussions/tags).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b620c9f42e31a54f:
    english: "## Unread discussions"
    translation: "## דיונים שלא נקראו"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b2f3737cd46d903a:
    english: Select **Unread discussions** in the sidebar to see discussions with activity you have not read. Within a discussion, the timeline helps you move to unread items and important events.
    translation: יש לבחור **דיונים שלא נקראו** בסרגל הצד כדי לראות דיונים עם פעילות שטרם נקראה. בתוך דיון, ציר הזמן מסייע להגיע לפריטים שלא נקראו ולאירועים חשובים.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e016a4cafcaee460:
    english: "## Polls awaiting your vote"
    translation: "## סקרים שממתינים להצבעה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  873929c0f1d06567:
    english: Select **Polls to vote on** in the sidebar to see active polls where you have been invited but have not yet voted. You can also open a group's **Polls** tab to see its active and closed polls.
    translation: יש לבחור **סקרים להצביע עליהם** בסרגל הצד כדי לראות סקרים פעילים שהתקבלה הזמנה להצביע בהם ושטרם הצבעתם בהם. ניתן גם לפתוח את לשונית **סקרים** של קבוצה כדי לראות את הסקרים הפעילים והסגורים שלה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3bb08c3343e3efd7:
    english: "## Bookmarks"
    translation: "## סימניות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1bec2703cc5fe70a:
    english: Bookmark a discussion, comment, poll, vote, or outcome when you want to return to it. Open **Bookmarks** from your user menu to see everything you have saved. See [Bookmarks](/en/user_manual/users/bookmarks) for details.
    translation: כדי לחזור לדיון, לתגובה, לסקר, להצבעה או למסקנה, ניתן לשמור אותם כסימנייה. יש לפתוח את **סימניות** מתפריט המשתמש כדי לראות את כל מה שנשמר. לפרטים נוספים, ראו [סימניות](/en/user_manual/users/bookmarks).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
