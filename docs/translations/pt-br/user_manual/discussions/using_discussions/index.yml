    translated_on: '2026-09-29'
  03c1d74b4a8bc31d:
    english: "![Invite people window with a field for names and email addresses](../notifying_people/thread_invite.png)"
    translation: "![Janela Convidar pessoas com um campo para nomes e endereços de e-mail](../notifying_people/thread_invite.png)"
    status: machine
