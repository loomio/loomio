  73449e09f559b4bd:
    english: Loomio is a discussion and decision making tool for collaborative organizations.
    translation: Loomio on keskustelun ja päätöksenteon työkalu yhteistyötä tekeville organisaatioille.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c6d663f00c64f35d:
    english: It enables you to bring people together to discuss topics, explore proposals and make decisions.
    translation: Sen avulla voit tuoda ihmiset yhteen keskustelemaan aiheista, pohtimaan ehdotuksia ja tekemään päätöksiä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
