  40ec8b1a5fe05e37:
    english: "# Outcome"
    translation: "# Висновок"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7478a826673bce70:
    english: When your proposal or poll closes, you’ll be prompted to enter an **outcome**.
    translation: Коли ваша пропозиція або опитування завершиться, вам запропонують написати **висновок**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ccaf1bc50a4f4734:
    english: State the results of the proposal or poll and say what will happen next.
    translation: Опишіть результати пропозиції або опитування та подальші дії.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fde482f3a84e26e6:
    english: The outcome statement is an important record of the poll or decision - a succinct statement for future reference.
    translation: Висновок зберігає короткий підсумок опитування або рішення, до якого можна буде звернутися згодом.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9f4a341103cf4286:
    english: "## Outcome statements for common decision processes"
    translation: "## Висновки для поширених способів ухвалення рішень"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  457a047ee6ae5975:
    english: |-
      | **Decision process** | **When the decision is made** | **Outcome** |
      |---|---|---|
      | Advice process | When advice has been received and taken into account. | State the decision made and thank people for their advice and feedback. |
      | Consent process | When there are no remaining objections. | State that no valid objections remain and there is consent that the proposal is 'safe to try'.  |
      | Consensus process | When most* people agree. | State proposal results and the decision made. |
    translation: |-
      | **Спосіб ухвалення рішення** | **Коли ухвалюють рішення** | **Висновок** |
      |---|---|---|
      | Ухвалення рішення з урахуванням порад | Коли поради отримано й враховано. | Опишіть ухвалене рішення та подякуйте людям за поради й відгуки. |
      | Ухвалення рішення за відсутності заперечень | Коли заперечень більше немає. | Зазначте, що обґрунтованих заперечень не залишилося і є згода вважати пропозицію «безпечною для випробування».  |
      | Ухвалення рішення консенсусом | Коли більшість* людей погоджується. | Опишіть результати пропозиції та ухвалене рішення. |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f8adf692b7b22c59:
    english: "**The majority or supermajority as governed by constitution or by prior agreement within your organization.*  "
    translation: "**Більшість або кваліфікована більшість відповідно до статуту чи попередньої домовленості у вашій організації.*"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  278c243b460bef68:
    english: 'Whatever the results, there is always something to learn from the proposal and poll. '
    translation: Незалежно від результатів, пропозиція та опитування допомагають дізнатися щось нове.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e694b60515143fcb:
    english: If your proposal fails, consider what new understanding has been gained, and if this can be accommodated to reach a better decision.
    translation: Якщо вашу пропозицію не підтримали, поміркуйте, що нового ви дізналися і чи допоможе це ухвалити краще рішення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  780a97e6dd058d5d:
    english: 'The outcome statement is an opportunity to state the results and what has been learnt.  '
    translation: У висновку можна описати результати й те, що ви дізналися.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ca65851b5da70691:
    english: You can notify people - they will receive an email from Loomio containing the poll results and your outcome statement.
    translation: 'Ви можете сповістити людей: вони отримають лист від Loomio з результатами опитування та вашим висновком.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  64d6b82a9343b3a6:
    english: 'You can also set a **Review date**: a future date when you would like to review this poll or decision. For example, you might review a strategy at the same time next year.'
    translation: Ви також можете встановити **Дата перегляду** — майбутню дату, коли захочете переглянути це опитування або рішення. Наприклад, ви можете переглянути стратегію в той самий час наступного року.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  60605804c2662fc8:
    english: "**Example outcome statements**"
    translation: "**Приклади висновків**"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  96f33990f48604cd:
    english: "> _This proposal did not reach consensus because several people were concerned about budget impacts. George and Jimena will do some financial modelling and raise a new proposal next week._"
    translation: "> _Щодо цієї пропозиції не вдалося досягти консенсусу, оскільки кількох людей непокоїть її вплив на бюджет. Джордж і Хімена підготують фінансові розрахунки та наступного тижня внесуть нову пропозицію._"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7175517a370b5cd2:
    english: or
    translation: або
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  40861d5640e63eef:
    english: "> _I've taken on board everyone's input. As the project manager, this is my call to make and I've decided we are going to extend the timeline by 10 days._"
    translation: "> _Я врахував усі думки. Як керівник проєкту, я маю ухвалити рішення й вирішив подовжити термін роботи на 10 днів._"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
