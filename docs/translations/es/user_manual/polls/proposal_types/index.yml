    translated_on: '2026-09-29'
  6b957bf5630c1470:
    english: "[Choose](/en/user_manual/polls/choose/) lets participants select one or more options. Use it to find the most popular option or make a shortlist."
    translation: "[Elegir](/en/user_manual/polls/choose/) permite seleccionar una o varias opciones. Úsalo para encontrar la opción más popular o preparar una lista de opciones finalistas."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c982974685e1b5d6:
    english: "## Score poll"
    translation: "## Encuesta de puntuación"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fbbfe14196388606:
    english: "[Score](/en/user_manual/polls/score/) lets participants rate every option on the same scale. Use it to compare the strength of support, readiness, suitability, or importance across options."
    translation: "[Puntuación](/en/user_manual/polls/score/) permite valorar cada opción con la misma escala. Úsala para comparar el grado de apoyo, preparación, idoneidad o importancia de las opciones."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0465fcb48a56ca78:
    english: "## Dot vote"
    translation: "## Votación por puntos"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ffb7d1711a5fca3b:
    english: "[Allocate](/en/user_manual/polls/allocate/) gives each participant a fixed budget of points to distribute. Use it to identify priorities when choosing one thing means giving less attention or resources to another."
    translation: "[Distribuir](/en/user_manual/polls/allocate/) da a cada participante un número fijo de puntos para repartir. Úsalo para identificar prioridades cuando dedicar recursos o atención a una opción implica dedicar menos a otra."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a1b15c28fbe526f6:
    english: "## Ranked choice"
    translation: "## Elección clasificada"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8811f455b7ab3821:
    english: "[Rank](/en/user_manual/polls/rank/) lets participants arrange options in order of preference. Use it to find the group's overall preferred order or select one leading option."
    translation: "[Ordenar](/en/user_manual/polls/rank/) permite ordenar las opciones por preferencia. Úsalo para conocer el orden de preferencia del grupo o elegir la opción mejor situada."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2e21bb1b54b6fcf9:
    english: "## Time poll"
    translation: "## Coordinación de horario"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb768f07eb0d1971:
    english: "[Time poll](/en/user_manual/polls/meeting_polls/) lets participants indicate when they are available. Use it to schedule a meeting or event across time zones."
    translation: "[Coordinación de horario](/en/user_manual/polls/meeting_polls/) permite indicar cuándo está disponible cada participante. Úsala para programar una reunión o un evento entre distintas zonas horarias."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
