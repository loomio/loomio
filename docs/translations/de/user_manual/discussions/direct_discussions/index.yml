  6e1409b4f3f725d9:
    english: Select **Direct threads** in the sidebar to see your direct discussions. Select **New discussion** on that page to start another one.
    translation: Wähle **Direkte Diskussionen** in der Seitenleiste, um deine direkten Diskussionen zu sehen. Wähle auf dieser Seite **Neue Diskussion**, um eine weitere zu beginnen.
    status: machine
