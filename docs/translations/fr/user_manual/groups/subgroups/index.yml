  782c5b3df26b17ae:
    english: "# Subgroups"
    translation: "# Sous-groupes"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0025fb895cd6cae8:
    english: Subgroups help you organize your communications and members so that the right people are engaged in their work together.
    translation: Les sous-groupes vous aident à organiser vos échanges et vos membres pour que les bonnes personnes travaillent ensemble.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cc3abd19bc310546:
    english: |-
      For example, an organization may have the following subgroups:
      - governance board
      - working team or a project working group
      - a topic (such as 'strategy' or 'learning')
    translation: |-
      Par exemple, une organisation peut avoir les sous-groupes suivants :
      - un conseil de gouvernance
      - une équipe ou un groupe de travail sur un projet
      - un groupe consacré à un sujet, comme la stratégie ou l’apprentissage
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eab908c78ccd923d:
    english: Subgroups work just like groups do, but are located within your "parent" group. Most of the features and settings available are the same as in the parent group. This also means that someone can be a member of your subgroup, such as your board, but not of your parent group.
    translation: Les sous-groupes fonctionnent comme les groupes, mais se trouvent au sein de votre groupe « parent ». Ils disposent de la plupart des mêmes fonctionnalités et paramètres. Une personne peut donc être membre d’un sous-groupe, comme votre conseil, sans être membre du groupe parent.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  aaa62c1b02d15779:
    english: "## Add a subgroup"
    translation: "## Ajouter un sous-groupe"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8ed2fcd2a209a53d:
    english: |-
      >[!Note]
      >The ability to add new subgroups is part of the group's [permission settings](/en/user_manual/groups/settings/permissions). By default, only admins can start new subgroups.
    translation: |-
      >[!Note]
      >La possibilité d’ajouter des sous-groupes dépend des [paramètres d’autorisation](/en/user_manual/groups/settings/permissions) du groupe. Par défaut, seuls les administrateurs peuvent créer des sous-groupes.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  483b820f123b5ae0:
    english: 'To add a subgroup, visit your main group page, then click **New Subgroup** from the sidebar.  '
    translation: Pour ajouter un sous-groupe, ouvrez la page de votre groupe principal, puis cliquez sur **Nouveau sous-groupe** dans la barre latérale.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  abceea91b4638844:
    english: "![New subgroup button in the Oatmilk Cooperative sidebar](subgroups-sidebar.png)"
    translation: "![Bouton Nouveau sous-groupe dans la barre latérale d’Oatmilk Cooperative](subgroups-sidebar.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b8e3d3477eb6765d:
    english: Click the **New subgroup** button, give it a name and select the privacy setting, then click **Start subgroup**.
    translation: Cliquez sur **Nouveau sous-groupe**, donnez-lui un nom et choisissez un paramètre de confidentialité, puis cliquez sur **Créer un sous-groupe**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1d49b46575af3f21:
    english: "![New subgroup form for the Packaging Working Group](subgroups_new.png)"
    translation: "![Formulaire de création d’un sous-groupe pour le groupe de travail sur l’emballage](subgroups_new.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  348e88e5c0ca37d0:
    english: When you are ready, [invite people](/en/user_manual/groups/inviting_people/) to the subgroup.
    translation: Lorsque vous êtes prêt, [invitez des personnes](/en/user_manual/groups/inviting_people/) dans le sous-groupe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4ac901bff75cf342:
    english: You can edit the subgroups [group settings](/en/user_manual/groups/settings/) by clicking the cog icon on the subgroup page.
    translation: Pour modifier les [paramètres du groupe](/en/user_manual/groups/settings/) du sous-groupe, cliquez sur l’icône en forme d’engrenage sur sa page.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
