    translation: בסרגל הצד אפשר לפתוח את לוח הבקרה, סקרים שממתינים להצבעה, דיונים שלא נקראו ודיונים ישירים, משימות וקבוצות. יש בו גם קישורים למדריך למשתמש ולתמיכה.
