  02feef9bf78ef420:
    english: "## Where are we on the Map?"
    translation: "## Hol tartunk a folyamatban?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '083f066ff9a3cfde':
    english: People feel more confident and better held if they can orient themselves on a timeline or agenda. They want to know what they’re doing now, what’s coming up, and to be reminded of what they’ve already done. Understanding the overall shape of the process helps people understand how to contribute effectively.
    translation: Az emberek magabiztosabban vesznek részt, ha látják a folyamat időrendjét vagy napirendjét. Tudni szeretnék, min dolgoznak most, mi következik, és mire jutottak eddig. A teljes folyamat áttekintése segít nekik megérteni, hogyan járulhatnak hozzá érdemben.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ea2ef3e629108828:
    english: For example if they can see there’s a Q&A section later, they'll be more willing to hold their questions during a presentation. If it’s clear that there’s a divergent phase and then a convergent phase, people will hold back from jumping to solutions too soon. People need to know what kind of input they are being asked for, and when.
    translation: Ha például látják, hogy később lesz idő a kérdésekre, könnyebben megvárják az előadás végét. Ha világos, hogy előbb az ötletek feltárása, majd a lehetőségek szűkítése következik, nem sietnek rögtön a megoldásokhoz. Tudniuk kell, mikor és milyen hozzájárulást várnak tőlük.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7a5d009dfc4e0f6b:
    english: Mapping the process well enough to communicate it also challenges facilitators to fully think through the journey, and helps them make sure each part of the process has a purpose that builds a cohesive whole. A well-facilitated experience follows a logical progression.
    translation: A folyamat bemutatható megtervezése a facilitátorokat is arra készteti, hogy végiggondolják az egész utat. Így ellenőrizhetik, hogy minden szakasznak van célja, és a szakaszok összefüggő egészet alkotnak. A jól vezetett folyamat logikus rendben halad.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aabfa9d842af2688:
    english: On Loomio
    translation: A Loomióban
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  af3599a59685a726:
    english: |-
      * A Loomio decision already follows a basic logical progression (which is why it works): Gather (open/invite), Discuss (divergent), Propose (convergent), Decide and Act (conclude).
      * Many Loomio users are employing the tool as part of explicitly mapped experiences, such as a multi-stage consultation process.
      * We offer some tools of facilitators to help “reveal the map” to users, such as the group description field, and proposal deadlines. These can be proactively leveraged to increase context for participants.
    translation: |-
      * A Loomióban hozott döntés már eleve logikus rendet követ: összegyűjtés (megnyitás és meghívás), megbeszélés (a lehetőségek feltárása), javaslattétel (a lehetőségek szűkítése), döntés és cselekvés (lezárás). Ez is hozzájárul a működéséhez.
      * Sokan előre felvázolt folyamatok részeként használják a Loomiót, például több szakaszból álló konzultációban.
      * Néhány eszköz segít a facilitátoroknak láthatóvá tenni a folyamatot a résztvevők számára. Ilyen a csoport leírása és a javaslatok határideje. Ezekkel előre megadhatják a részvételhez szükséges összefüggéseket.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  228ae545a39cd553:
    english: "## The Art of Noticing"
    translation: "## Az észrevétel művészete"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  04155220f602a7e8:
    english: Noticing is probably the most critical facilitation skill of all. The facilitator uses noticing to figure out what interventions or responses are needed, how to invite the right contributions, and to help the group notice itself. The value of facilitation is having someone paying attention and acting on what they notice, while others may be focused on specific content or their own agendas.
    translation: A facilitálás egyik legfontosabb készsége az észrevétel. A facilitátor ebből tudja, mikor kell közbelépnie vagy válaszolnia, hogyan kérjen megfelelő hozzájárulásokat, és mire hívja fel a csoport figyelmét saját működésében. A facilitálás értéke abban rejlik, hogy valaki figyel a folyamatra és cselekszik a tapasztalatai alapján, miközben mások az adott tartalomra vagy saját céljaikra összpontosítanak.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  90a03fdb345369b7:
    english: 'Effective noticing is a combination of good informational inputs, and sensitivity and skill to interpret them. Many facilitators talk about “reading” a room: emotional reactions, tensions,  power dynamics. Facilitators need effective information signalling systems.'
    translation: 'A jó észrevételhez megfelelő információ, valamint annak érzékeny és hozzáértő értelmezése kell. A facilitátorok gyakran beszélnek a helyzet „olvasásáról”: figyelik az érzelmi reakciókat, a feszültségeket és a hatalmi viszonyokat. Ehhez olyan rendszerekre van szükségük, amelyek jól jelzik a fontos információkat.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  49b0f2cc823e0384:
    english: |-
      * Many current features assist with noticing — the biggest one is probably watching how the pie is shaping up in a proposal.
      * The software notices some things: who has and has not yet participated, what topics are being raised, who has and has not accepted their group invitation, etc.
      * On Loomio, a single facilitator can read across dozens of discussions at the same time, see clearly what’s being shared, and act accordingly.
      * Talking online can make the implicit explicit, and therefore easier to notice.
      * Communicating in writing can be very good for naming what’s being noticed and why a certain action is being taken in response. For example, you can quote someone’s exact words and reflect back what’s revealed by them. Or you can do the same thing at the level of a whole discussion, picking out a range of quotes and noticing themes or emerging conflicts.
      * Noticing is much easier when you slow things down, which is one of Loomio’s great advantages — asynchronous communication you can read at any pace. It also makes it possible to notice across time, referring directly to past discussions.
      * Because you can have simultaneous discussions, it's possible to have a layer of “meta” discussion (aka “blue hat”, aka discussion about the discussion) at the same time as progressing the main discussions. So you can collectively have a space to practice noticing without slowing down the process.
    translation: |-
      * A Loomio több funkciója segíti az észrevételt. Az egyik legfontosabb annak követése, hogyan alakul egy javaslat kördiagramja.
      * A szoftver is jelez bizonyos dolgokat: ki vett már részt, ki nem, milyen témák merülnek fel, és ki fogadta már el a csoportba szóló meghívását.
      * A Loomióban egyetlen facilitátor egyszerre több tucat beszélgetést követhet, világosan láthatja, mit osztanak meg a résztvevők, és ennek megfelelően cselekedhet.
      * Az online beszélgetés kimondottá teheti azt, ami egyébként rejtve maradna. Így könnyebb észrevenni.
      * Írásban jól meg lehet nevezni, mit vettél észre, és miért cselekszel erre válaszul. Például pontosan idézheted valaki szavait, és visszajelezheted, mit mutatnak meg. Egy egész beszélgetésből is kiemelhetsz idézeteket, hogy rámutass a visszatérő témákra vagy a kialakuló nézeteltérésekre.
      * Lassabb tempóban könnyebb észrevenni a mintázatokat. Ez a Loomio egyik nagy előnye: az aszinkron kommunikációt a saját tempódban olvashatod. Korábbi beszélgetésekre közvetlenül hivatkozva az időbeli változásokat is követheted.
      * Mivel egyszerre több beszélgetés is folyhat, a fő beszélgetésekkel párhuzamosan helyet kaphat egy „meta” beszélgetés is („kék kalap”, vagyis beszélgetés a beszélgetésről). Így a csoport közösen gyakorolhatja az észrevételt anélkül, hogy lelassítaná a folyamatot.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cdb52080510ddb69:
    english: "## Hearing Diverse Voices"
    translation: "## Különböző hangok meghallása"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  150ff74c2805696b:
    english: In our society, multiple layers of history, power dynamics, culture, and psychology conspire to amplify certain voices and suppress others. This plays out at every level of experience, from our innermost subconscious beliefs to our political system and laws.
    translation: Társadalmunkban a történelem, a hatalmi viszonyok, a kultúra és a pszichológia több rétege egyes hangokat felerősít, másokat háttérbe szorít. Ez a legbelső, tudattalan meggyőződéseinktől a politikai rendszerünkig és a törvényekig minden szinten megjelenik.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a3dccb91d161d18a:
    english: But the best ideas do not always come from the loudest voices, and the role of facilitation is to counteract these biases. It’s important to be aware of the dynamics we are collectively grappling with if our goals are social justice, group effectiveness, and high quality decision making.
    translation: A legjobb ötletek azonban nem mindig a leghangosabb emberektől származnak. A facilitálás egyik feladata e torzítások ellensúlyozása. Ha a társadalmi igazságosság, a csoport eredményes működése és a jó döntéshozatal a cél, fontos felismerni a közösen átélt viszonyokat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5e8160d5b0da948a:
    english: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../rich_200.png"> If you want to innovate, you have to make space for different points of view — luckily, this is also what you need to do if you want a team where everyone is empowered. All kinds of cultural and technical factors conspire to privilege some voices at the expense of others. There are many practices you can implement to systematically challenge that bias, but just being aware of it is a good starting point. — Richard Bartlett'
    translation: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../rich_200.png"> Ha újítani szeretnél, teret kell adnod a különböző nézőpontoknak. Ugyanerre van szükség egy olyan csapatban is, ahol mindenki részt vehet a döntésekben. Kulturális és technikai tényezők egyes hangokat mások rovására előnyben részesítenek. Sok módszerrel lehet ezt a torzítást következetesen ellensúlyozni, de már a felismerése is jó kiindulópont. — Richard Bartlett'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  63e0bdf44ad2df5f:
    english: Our lived human experience is to inhabit a singular consciousness, so humans tend to forget that others experience the world differently. Even within a seemingly homogenous group, there is incredible diversity — perspectives, pace, preferences. Internalising this truth — that others are different from myself — is a central personal growth challenge.
    translation: Mindannyian a saját tudatunkon keresztül éljük meg a világot, ezért könnyű megfeledkezni arról, hogy mások másként tapasztalják meg. Még egy látszólag egységes csoportban is nagy különbségek lehetnek a nézőpontokban, a tempóban és az igényekben. Annak elfogadása, hogy mások különböznek tőlem, a személyes fejlődés fontos része.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  62f6a86aa220b787:
    english: There is no such thing as one size fits all. Any mode of interacting enhances some voices and quiets others, or emphasises different tendencies within an individual. So, it’s necessary to employ a range of approaches to invite the best from multiple diverse voices.
    translation: Nincs mindenkinek megfelelő módszer. A kapcsolattartás minden formája egyes hangokat felerősít, másokat elcsendesít, vagy ugyanazon ember más oldalait hozza előtérbe. Ezért többféle megközelítésre van szükség ahhoz, hogy a különböző résztvevők a legjobbat adhassák.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8f9c1b2c0e40b1fc:
    english: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../silvia_200.png"> Check you’re catering to different learning styles. One simple way to check is with the Head, Heart, Hands metaphor. People who learn with their Head need facts and detailed information. A Heart learner thrives off stories. They need an emotional connection to the work. Learning with the Hands is all about doing stuff and getting active. — Silvia Zuur'
    translation: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../silvia_200.png"> Figyelj arra, hogy a különböző tanulási módoknak is teret adj. Ezt egyszerűen ellenőrizheted a fej, a szív és a kéz metaforájával. A fejükkel tanulóknak tényekre és részletes információkra van szükségük. A szívükkel tanulóknak a történetek és a munkához fűződő érzelmi kapcsolat segít. A kezükkel tanulók tevékenység közben sajátítják el a dolgokat. — Silvia Zuur'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  04a3a7bc850913ab:
    english: One of the best approaches to bringing out and weaving together diverse voices is to invite diverse modes of interaction, which will serve different needs and preferences, and level the communication playing field.
    translation: A különböző hangokat úgy lehet jól megszólaltatni és összekapcsolni, ha többféle részvételi módot kínálsz. Ezek eltérő igényekhez és preferenciákhoz illenek, és kiegyenlítik a megszólalási lehetőségeket.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ba31b7da59193745:
    english: 'Some classic design building blocks to address communication diversity in collaborative communication:'
    translation: 'Néhány bevált eszköz a közös munkában megjelenő kommunikációs különbségek kezelésére:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fbcafe73c1d8720b:
    english: |-
      * **Group size** — individual reflection, pairs, small group, large group, one-to-one, one-to-many, many-to-many.
      * **Medium of expression** — writing, drawing, video, singing, dance, flowcharts, equations, symbols, stories, tears, laughter, debate, etc.
      * **Discussion protocols** — rounds (hear from each person once before moving on), rate limiting (you can only speak again after two others have spoken), talking stick (only speak when you have the stick — no interrupting), time-limited contributions (you can talk for 1 minute only), time-unlimited contributions (you can hold the floor indefinitely and everyone will deeply listen), tracking contributions (how much have women vs men spoken, etc), holding periods of silence between speakers (for processing and reflection).
      * **Embrace silence** *Silence is only awkward if you let it be awkward. Silence is a chance for people to think. — Silvia Zuur*
    translation: |-
      * **Csoportméret** — egyéni átgondolás, páros munka, kis csoport, nagy csoport, négyszemközti, egy embertől sokakhoz, sokak között zajló kommunikáció.
      * **Kifejezési mód** — írás, rajz, videó, ének, tánc, folyamatábra, egyenlet, szimbólum, történet, könnyek, nevetés, vita és más formák.
      * **Beszélgetési szabályok** — körök (mindenki egyszer megszólal, mielőtt továbbléptek), a megszólalások korlátozása (csak akkor szólhatsz újra, ha közben két másik ember is beszélt), beszélő tárgy (csak az beszél, akinél a tárgy van, megszakítás nélkül), időkorlátos hozzászólások (csak egy percig beszélhetsz), időkorlát nélküli hozzászólások (addig beszélhetsz, ameddig szükséged van rá, a többiek pedig figyelmesen hallgatnak), a megszólalások követése (például mennyit beszéltek a nők és a férfiak), csend tartása a megszólalások között (az elhangzottak feldolgozására és átgondolására).
      * **Adj teret a csendnek** *A csend csak akkor kínos, ha annak hagyod. Lehetőséget ad az embereknek a gondolkodásra. — Silvia Zuur*
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ff925b4be393907c:
    english: |-
      * The design of Loomio has always been about “hearing all voices”, including people who aren’t able to be there in person, are quieter, are busy, etc.
      * In text, every voice is more or less the same “volume” and “speed”. Written asynchronous communication offers a kind of leveling of the field.
      * The proposal feature is essentially a “round”, assisting groups to facilitate each individual person having their say (if they want to) on an equal basis.
      * Loomio enables multi-media (links, videos, images, diagrams, supporting evidence), which serve various communication styles.
      * Loomio itself is pretty basic, but with active facilitation and group maturity, it is possible to employ discussion protocols “manually” using cultural norms or agreed rules (eg, a discussion where everyone only posts once until everyone else has participated).
      * Loomio provides flexible tools for small and large group interaction, using parent groups and subgroups. Some large consultation processes have involved multiple smaller groups which are then synthesised into a larger outcome.
      * People who want time for individual reflection can take time out and process their thoughts, and then come back and share a longer comment or link to a document. This is a “self-selecting” example of creating interplay between individual and group communication.
      * Loomio accessibility features and multi-lingual translations make it possible for people with very different needs to participate as equals in one discussion. This is a key example of how technology can enable equitable participation in a way that’s nearly impossible in person.
      * If someone is contributing more than their share (talking too much), it’s technically possible to just scroll on by (whereas in person this behaviour can totally dominate the interaction). However, people posting “walls of text” can still be detrimental to a balanced Loomio discussion.
    translation: |-
      * A Loomio kialakításának kezdettől fogva célja, hogy minden hang hallható legyen: azoké is, akik nem tudnak személyesen jelen lenni, csendesebbek vagy elfoglaltak.
      * Írásban minden hang nagyjából azonos „hangerővel” és „sebességgel” jelenik meg. Az aszinkron írásos kommunikáció valamelyest kiegyenlíti a részvételi lehetőségeket.
      * A javaslat lényegében egy megszólalási kör: segít a csoportnak abban, hogy mindenki egyenlő alapon elmondhassa a véleményét, ha szeretné.
      * A Loomióban linkeket, videókat, képeket, ábrákat és alátámasztó anyagokat is megoszthattok. Ezek különböző kommunikációs módokat támogatnak.
      * A Loomio önmagában egyszerű eszköz, de aktív facilitálással és egy összeszokott csoportban közösen elfogadott szabályok alapján beszélgetési rendek is alkalmazhatók. Például mindenki csak egyszer ír, amíg a többiek is hozzá nem szóltak.
      * A Loomio főcsoportokkal és alcsoportokkal rugalmasan támogatja a kis és nagy csoportok közös munkáját. Egyes nagy konzultációkban több kisebb csoport dolgozott, majd a munkájukat egy közös következtetésben foglalták össze.
      * Aki időt szeretne az egyéni átgondolásra, félrevonulhat, rendezheti a gondolatait, majd később hosszabb hozzászólással vagy egy dokumentum linkjével térhet vissza. Így a résztvevő maga választja meg, hogyan kapcsolja össze az egyéni gondolkodást és a csoportos kommunikációt.
      * A Loomio akadálymentesítési funkciói és többnyelvű fordításai lehetővé teszik, hogy nagyon eltérő igényű emberek egyenlő félként vegyenek részt ugyanabban a beszélgetésben. A technológia így olyan egyenlő részvételt tehet lehetővé, amelyet személyesen szinte lehetetlen megvalósítani.
      * Ha valaki a többieknél jóval többet szól hozzá, a bejegyzésein egyszerűen tovább lehet görgetni. Személyes találkozón ugyanez a viselkedés teljesen uralhatja a beszélgetést. A hosszú, tömör szövegfalak azonban a Loomióban is ronthatják a beszélgetés egyensúlyát.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bb74ebca94285a48:
    english: "## Counter Cognitive Bias"
    translation: "## A kognitív torzítások ellensúlyozása"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c8d4a9a10da47a62:
    english: Human brains have evolved over millions of years to balance quick, efficient “good enough” thinking with slow, expensive, deep analysis. This allows us to use instincts, heuristics, and generalisations as cheap and fast solutions most of the time, and to engage deep analysis when needed.
    translation: Az emberi agy évmilliók alatt úgy fejlődött, hogy egyensúlyt teremtsen a gyors, hatékony, „elég jó” gondolkodás és a lassú, sok energiát igénylő, alapos elemzés között. Így legtöbbször ösztönökre, egyszerűsítő szabályokra és általánosításokra támaszkodhatunk, szükség esetén pedig mélyebben elemezhetünk.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3a35775e59cdea17:
    english: But sometimes we get it wrong. In fact, there are well-known “bugs” in the human cognition program, which can keep people from making the best decisions. This is further complicated in group situations. We need to be aware of these dynamics.
    translation: Néha azonban tévedünk. Az emberi gondolkodásnak vannak jól ismert „hibái”, amelyek megakadályozhatják a legjobb döntés meghozatalát. Csoportban mindez még összetettebb. Fontos felismerni ezeket a hatásokat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e3d808eb17e1aa5a:
    english: There is a huge [range of cognitive biases](https://en.wikipedia.org/wiki/List_of_cognitive_biases) (this list is really worth a read), all of which have potential impacts on decision making and collaboration. Facilitation can be an important tool to deal with them, to raise awareness of their existence, encourage proactive choices about them. For example, asking when is it more important to move quickly and when is it more important to be accurate.
    translation: A [kognitív torzítások sokfélék](https://en.wikipedia.org/wiki/List_of_cognitive_biases) (érdemes átolvasni a listát), és mind hatással lehetnek a döntéshozatalra és az együttműködésre. A facilitálás segíthet felismerni őket, és tudatos döntésekre ösztönözhet. Például felvetheti, mikor fontosabb a gyorsaság, és mikor a pontosság.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c4755a454121a7b6:
    english: One powerful tool to counter cognitive bias and increase quality of decisions is structured processes and communication. The challenge of following a process instead of the “path of least resistance” can help highlight thinking errors and bias. Facilitators sometimes push for things that feel challenging or trigger resistance, precisely because brains are being asked to step out of familiar patterns. Discipline in this area can help groups achieve their deeper goals, which can be worth some temporary discomfort.
    translation: A kognitív torzítások ellensúlyozásának és a döntések javításának egyik hatékony eszköze a strukturált folyamat és kommunikáció. Ha a legkisebb ellenállás útja helyett egy folyamatot követtek, könnyebben felismerhetitek a gondolkodási hibákat és torzításokat. A facilitátorok néha éppen azért javasolnak nehéznek tűnő vagy ellenállást kiváltó lépéseket, hogy a csoport kilépjen a megszokott gondolkodási mintákból. Az ebben mutatott fegyelem segíthet elérni a csoport mélyebb céljait, még ha átmenetileg kényelmetlen is.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  99caa45d2ab4ae8b:
    english: 'Some examples of processes that can help mitigate cognitive bias:'
    translation: 'Néhány folyamat, amely segíthet mérsékelni a kognitív torzításokat:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ebd2c767ea8fae2e:
    english: |-
      * [De Bono’s Hats](http://www.debonoforschools.com/asp/six_hats.asp): different colored hats participants can wear (metaphorically) to step outside their own opinions and try on different modes of thinking.
      * Checklists: thinking “ruts” can cause us to miss even obvious things (especially in areas we're very familiar with), so a checklist can weed out errors.
      * The Five Why’s: only asking why once or twice can mislead you into thinking you’ve reached the conclusion before you get to the root level of the issue. Asking five times tends to get to the bottom of it.
      * Mental models: exercises like [SWOT analysis](https://en.wikipedia.org/wiki/SWOT_analysis), the [business model canvas](https://en.wikipedia.org/wiki/Business_Model_Canvas), or any number of countless other structured information gathering exercises can guide you to cleaner analysis and reveal assumptions.
    translation: |-
      * [De Bono kalapjai](http://www.debonoforschools.com/asp/six_hats.asp): a résztvevők jelképesen különböző színű kalapokat öltenek, hogy kilépjenek saját véleményükből, és más gondolkodási módokat próbáljanak ki.
      * Ellenőrzőlisták: a megszokott gondolatmenet miatt még nyilvánvaló dolgokat is kihagyhatunk, különösen ismerős területen. Egy ellenőrzőlista segít kiszűrni az ilyen hibákat.
      * Az öt miért módszere: ha csak egyszer vagy kétszer kérdezed meg, hogy miért történt valami, azt hiheted, hogy megtaláltad a választ, mielőtt eljutnál a probléma gyökeréig. Öt egymást követő kérdés többnyire segít feltárni az alapvető okot.
      * Gondolkodási modellek: a [SWOT-elemzés](https://en.wikipedia.org/wiki/SWOT_analysis), az [üzleti modell vászon](https://en.wikipedia.org/wiki/Business_Model_Canvas) és más strukturált információgyűjtési módszerek tisztább elemzéshez vezethetnek, és feltárhatják a kimondatlan feltételezéseket.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  073fb22a0e7cd744:
    english: |-
      * Diverse information and inputs can disrupt assumptions or bias. This is built into Loomio’s basic design: by enabling more voices to contribute to a discussion on a more equitable basis, you have a chance to escape “groupthink”.
      * Loomio gives participants the ability to dissent constructively. Safe and valued dissent is essential for a culture of critical thinking.
      * Communicating asynchronously in writing slows conversation down and lets it be more carefully considered, giving people a chance to think more carefully and avoid cognitive errors.
      * Loomio invites people into a semi-structured process that leads to more considered decision making. Loomio can be used for a huge range of different processes, but simply having *some* structure in a discussion enables other possibilities.
    translation: |-
      * A sokféle információ és hozzájárulás megkérdőjelezheti a feltételezéseket és torzításokat. Ez a Loomio alapvető működésének része: ha több ember járulhat hozzá egy beszélgetéshez egyenlőbb feltételekkel, a csoport könnyebben elkerülheti a csoportgondolkodást.
      * A Loomio lehetőséget ad az építő jellegű ellenvéleményre. A biztonságos és megbecsült ellenvélemény elengedhetetlen a kritikus gondolkodáshoz.
      * Az aszinkron írásos kommunikáció lelassítja a beszélgetést, így több idő jut az álláspontok átgondolására és a gondolkodási hibák elkerülésére.
      * A Loomio részben strukturált folyamatba hívja a résztvevőket, ami átgondoltabb döntésekhez vezethet. Sokféle folyamathoz használható, és már *valamennyi* szerkezet is új lehetőségeket nyit egy beszélgetésben.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4ae16a63e2dd047a:
    english: "## Balancing Divergent & Convergent"
    translation: "## Az ötletek feltárásának és szűkítésének egyensúlya"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2983c2d32846ebd5:
    english: The “diamond” of divergence and convergence is a conversational shape. It expands outward at first — opening up space for ideas, information, and different perspectives — then begins to come to a point. The right timing for this shift is key for effective facilitation of action-oriented, productive, collaborative discussions.
    translation: 'Az ötletek feltárásának és szűkítésének „gyémántja” a beszélgetés menetét ábrázolja. Először szélesedik: teret ad az ötleteknek, információknak és különböző nézőpontoknak. Ezután egy pont felé szűkül. A váltás megfelelő időzítése kulcsfontosságú a cselekvésre irányuló, eredményes közös beszélgetések facilitálásában.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bce4c52d377dbdbd:
    english: If divergence is missed out or cut off too early, there will be a lack of information to work with, people may not feel heard, and great ideas will be left unsaid. If convergence is missed out or left too late, discussion can continue indefinitely without reaching an actionable conclusion, burning participants energy and failing to achieve results.
    translation: Ha az ötletek feltárása kimarad vagy túl korán véget ér, nem lesz elég információ a munkához. Egyesek úgy érezhetik, hogy nem hallgatták meg őket, és jó ötletek maradhatnak kimondatlanul. Ha a lehetőségek szűkítése kimarad vagy túl későn kezdődik, a beszélgetés cselekvésre alkalmas következtetés nélkül folytatódhat, felemésztve a résztvevők energiáját.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9f787be37e0492cc:
    english: Each sub-phase of the larger process also requires awareness of the right timing and intervention. Divergence consists of introduction, clarification, ideation. Convergence consists of analysis, conclusion, commitment. Some discussions succeed with only a vague nod toward the diamond, while others are served by a meticulous breakdown of each phase and sub-phase.
    translation: A teljes folyamat minden kisebb szakaszában figyelni kell a megfelelő időzítésre és beavatkozásra. A feltárás részei a bevezetés, a tisztázás és az ötletalkotás. A szűkítés részei az elemzés, a következtetés és az elköteleződés. Egyes beszélgetésekben elég nagy vonalakban követni a gyémántot, másoknak az egyes szakaszok részletes megtervezése segít.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d8c7970db55ea11:
    english: Within a group, different individuals will usually tend to prefer one mode or the other, and the group as a whole will have collective tendencies. Imbalance looks like too much blue sky thinking, or jumping to solutions. Facilitation can help each person and the group as a whole spend the right amount of energy on the different modes.
    translation: Egy csoport tagjai rendszerint eltérően viszonyulnak a feltáráshoz és a szűkítéshez, és a csoport egészének is lehetnek jellemző hajlamai. Az egyensúly hiánya túl sok kötetlen ötletelésben vagy a megoldásokhoz való túl gyors ugrásban mutatkozhat meg. A facilitálás segíthet abban, hogy mindenki és a csoport egésze megfelelő energiát fordítson mindkét módra.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  36405c3bfcb951b6:
    english: |-
      * The core Loomio process does an excellent job of guiding groups to touch on each phase of the process, with the discussion being divergent and proposals being convergent. Awareness of the diamond was a big inspiration for the original design of the Loomio process.
      * Loomio helps groups to use the diamond in dynamic ways, such as when an attempt to converge (a proposal) ends up becoming a deeper level of divergence (disagreement), revealing or clarifying information to support an even better convergence (iterated proposal).
      * Some of Loomio’s basic features go a long way toward supporting each mode, such as notifications to group members when a new discussion is starting (prompting divergent contribution), and deadlines on proposals (prompting participation in convergence).
      * Loomio users are already able to use the existing feature set to facilitate convergence — namely starting a proposal. Good use of proposals is one of the most obvious symptoms of an effective Loomio group, and simply advising users to start more proposals unblocks many groups who are having issues.
    translation: |-
      * A Loomio alapfolyamata végigvezeti a csoportokat a szakaszokon: a beszélgetés a lehetőségek feltárását, a javaslatok a szűkítésüket segítik. A gyémánt modellje erősen hatott a Loomio folyamatának eredeti kialakítására.
      * A Loomio segít a csoportoknak rugalmasan használni a gyémántot. Például egy szűkítésre tett kísérletből, vagyis egy javaslatból nézeteltérés születhet. Ez új információkat tárhat fel vagy tisztázhat, amelyek alapján jobb, átdolgozott javaslat készülhet.
      * A Loomio alapfunkciói mindkét módot támogatják. Az új beszélgetésről szóló értesítés hozzájárulásra hívja a csoport tagjait, a javaslat határideje pedig a döntés felé haladást ösztönzi.
      * A Loomio meglévő funkcióival már most is segítheted a lehetőségek szűkítését: indíthatsz egy javaslatot. A javaslatok jó használata egy eredményesen működő Loomio-csoport egyik legvilágosabb jele. Sok elakadt csoportnak már az is segít, ha több javaslat indítására ösztönzik.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  af83d6e3b408e008:
    english: "## Working with Scope"
    translation: "## A téma határainak kezelése"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  209f071ae0c7ae0f:
    english: Successful collaboration often depends on biting off the right size pieces in the right order.
    translation: A sikeres együttműködés gyakran azon múlik, hogy a megfelelő méretű feladatokat a megfelelő sorrendben veszitek elő.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  24658aca54702290:
    english: 'You can apply a “project management” mindset to facilitation, designing for questions like:'
    translation: 'A facilitálást projektvezetési szemlélettel is megtervezheted. Például ezeket a kérdéseket érdemes feltenni:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '09c7ee57551e1980':
    english: |-
      * What are the dependencies (what’s the critical path, which things need to be done first to enable other things)?
      * What are the most important bits to focus on? What can be left out?
      * What is an achievable scope to tackle at a given time to get to a useful place with the time, energy, and information available?
    translation: |-
      * Mely feladatok függenek egymástól? Mi a kritikus út, és mit kell előbb elvégezni ahhoz, hogy más feladatok elkezdődhessenek?
      * Melyek a legfontosabb kérdések? Mit lehet kihagyni?
      * Mekkora feladatot lehet az adott idő, energia és információ birtokában úgy elvégezni, hogy hasznos eredményre jussatok?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bca4d47c3dc6f3cf:
    english: It’s important not to try to “boil the ocean”, and instead break things down into manageable chunks. You can build toward a bigger outcome in a series of smaller pieces. It’s often better to achieve something small but useful, than to fail to reach any conclusions. It’s also possible to get too bogged down in details and fail to hit the bigger issues.
    translation: Fontos, hogy ne akarj mindent egyszerre megoldani. Bontsd a munkát kezelhető részekre. Kisebb lépésekkel is eljuthatsz egy nagyobb következtetéshez. Gyakran jobb egy kisebb, de hasznos eredményre jutni, mint semmilyen következtetésre sem jutni. Arra is figyelj, hogy a részletek ne vonják el a figyelmet a fontosabb kérdésekről.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ce5ed5c5115c7b90:
    english: In a collaboration, no one knows exactly what will emerge, so scope must evolve with the discussion. Whether branching out at a given moment is a distraction or an evolution is a judgement call. Too much rigidity and too much flexibility can both be damaging. Often times it’s not about whether something is relevant or not, but a question of sequence and timing in terms of what will be most constructive.
    translation: Az együttműködés során senki sem tudja előre pontosan, mi fog kialakulni. Ezért a munka keretének a beszélgetéssel együtt kell alakulnia. Mérlegelni kell, hogy egy új irány adott pillanatban elterelés vagy hasznos továbbfejlődés. A túl merev és a túl rugalmas keretek egyaránt árthatnak. Sokszor nem az a kérdés, hogy valami kapcsolódik-e a témához, hanem az, hogy mikor és milyen sorrendben érdemes foglalkozni vele.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3510d751f00b1ae6:
    english: "> If you plan a session with multiple, interlinked parts – each one building on the other, and all leading to a life-changing, mind-exploding conclusion – and you can pull it off, then that’s amazing. But more often than not, a complicated session will go over-time and may not hit the participant’s wants and needs. - Silvia Zuur"
    translation: "> Ha egy alkalmat több, egymásra épülő részből tervezel meg, amelyek mind egy sorsfordító felismeréshez vezetnek, és ezt meg is tudod valósítani, az nagyszerű. Egy bonyolult alkalom azonban gyakrabban tart tovább a tervezettnél, és előfordulhat, hogy nem felel meg a résztvevők igényeinek. - Silvia Zuur"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9204dd47d88ac308:
    english: |-
      ## A series of small yes's
      Lumping too many conversations together simply creates confusion. Frustrated groups are often helped by breaking things down. If an issue seems hopeless, complex or conflicted, it can be possible to separate out individual questions and reach consensus on them, starting with the easiest things to agree. Then when it comes to points of disagreement, you can pare it down to only the crux of the issues and work on them in a focused way.
    translation: |-
      ## Kis egyetértések sorozata
      Ha túl sok beszélgetést vonsz össze, abból könnyen zavar lesz. A nehéz helyzetbe került csoportoknak gyakran segít, ha kisebb részekre bontják a kérdést. Ha egy ügy reménytelennek, bonyolultnak vagy megosztónak tűnik, különválaszthatjátok az egyes kérdéseket, és először azokban juthattok egyetértésre, amelyekben ez a legkönnyebb. Így a nézeteltéréseknél már a lényegi kérdésekre összpontosíthattok.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2d86c0488159e380:
    english: |-
      * Topic-based discussion threads are a powerful tool for effective scope — even more than face-to-face conversation, Loomio discussions can be usefully delineated to encourage focus on a specific question, while other aspects can be addressed simultaneously in other threads.
      * We often see users making facilitation interventions like “That’s out of the scope of this topic, but why don’t you start a new discussion about it?”
      * The act of creating a Loomio group helps define who are we and what are we here to discuss. This helps participants manage scope.
      * The sequential proposals design of Loomio is very good for a “series of small yess's” approach — you can build small agreements while maintaining context in a single discussion thread, and build on the history of previous proposals.
      * Asynchronous online communication can allow some people to go way out of scope without holding up others. They can simply start a new discussion or subgroup and go as deep and long as they want, while the main scope of the group is maintained.
      * The discussion context box and group description are spaces to define the scope of a conversation or group, respectively.
    translation: |-
      * A témák szerint elkülönített beszélgetések segítenek a keretek tartásában. A Loomióban még a személyes beszélgetésnél is könnyebb egy kérdésre összpontosítani, miközben más szálakban párhuzamosan foglalkoztok a kapcsolódó kérdésekkel.
      * A felhasználók gyakran így terelik vissza a beszélgetést: „Ez túlmutat ennek a témának a keretein, de indíthatnál róla egy új beszélgetést.”
      * Egy Loomio-csoport létrehozása segít meghatározni, kik vagytok, és miről szeretnétek beszélni. Ez a résztvevőknek is segít tartani a kereteket.
      * A Loomióban egymást követő javaslatok jól támogatják a kis egyetértések sorozatát. Egyetlen beszélgetési szálban kisebb megállapodásokra juthattok, miközben megmarad a közös kontextus, és építhettek a korábbi javaslatokra.
      * Az időben eltolt online kommunikációban valaki messzire elkanyarodhat az eredeti témától anélkül, hogy feltartaná a többieket. Indíthat új beszélgetést vagy alcsoportot, és ott olyan mélyen foglalkozhat a kérdéssel, amennyire szeretne. A csoport fő témája közben megmarad.
      * A beszélgetés kontextusát tartalmazó mezőben a beszélgetés, a csoport leírásában pedig a csoport kereteit határozhatjátok meg.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0b70d200637c265f:
    english: "## Pacing & Timing"
    translation: "## Ütem és időzítés"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d2b056c4b3edb54a:
    english: A productive conversation has a rhythm. The right beat comes from a complex combination of factors and often feels intuitive, like a musician improvising. When is the moment to go deeper, or pull back? When is it right to bring in new information, or further delve into what’s already on the table? This is pacing.
    translation: Egy eredményes beszélgetésnek ritmusa van. A megfelelő ritmus sok tényezőtől függ, és gyakran ösztönösen alakul, mint amikor egy zenész rögtönöz. Mikor érdemes mélyebbre menni, és mikor hátralépni? Mikor kell új információt behozni, és mikor jobb tovább vizsgálni azt, ami már elhangzott? Erről szól az ütemezés.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d421940782402742:
    english: Different participants will have different needs and preferences — some will need reigning in, while others need pulling along. The right pace emerges when a creative tension between digging deeper and moving forward is found. When it’s off, people will feel frustrated — either impatient or left behind.
    translation: A résztvevők igényei és preferenciái eltérnek. Van, akit lassítani kell, mást bátorítani a továbblépésre. A megfelelő ütem akkor alakul ki, ha egyensúlyba kerül az elmélyülés és a haladás. Ha ez nem sikerül, egyesek türelmetlenné válnak, mások pedig lemaradnak.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7165c12910a2b3bb:
    english: |-
      * Because it’s asynchronous, people can read and respond at their own pace on Loomio, allowing a natural pace to emerge.
      * It’s possible to scroll right past people moving slowly and push for forward momentum, and simultaneously possible to continue digging into something slowly while others press forward. This is not possible in synchronous communication.
      * Proposal deadlines are a pace-setting tool. Topics that need to move quickly use shorter timeframes, and longer ones can have more time. Different decisions can go at different speeds.
      * It’s easy to modulate your own pace of engagement. If a conversation is moving too fast or slowly for you, you can drop your input and step back, and then return later when a proposal is raised.
      * It’s interesting to note how a “fast” decision on Loomio is 1 or 2 days, while a “fast” decision in person is more like 5 minutes. And yet, Loomio does not seem “slow”, the way taking 2 days to reach a decision in person would. Loomio runs decisions in parallel to other ongoing work, and it's much more efficient gathering everyone’s input on Loomio over 2 days versus having to schedule an in-person meeting.
      * Facilitation on Loomio could be likened to “bullet time” (when Neo can stop time and just walk around a bullet in the Matrix) — you can walk through a living conversation frame by frame. It’s like a superpower.
    translation: |-
      * A Loomióban a kommunikáció időben eltolt, ezért mindenki a saját tempójában olvashat és válaszolhat. Így természetes ütem alakulhat ki.
      * Átlépheted a lassabban haladó hozzászólásokat, és viheted előre a beszélgetést. Közben mások tovább vizsgálhatnak egy kérdést a saját tempójukban. Egyidejű beszélgetésben ez nem lehetséges.
      * A javaslatok határideje segít meghatározni az ütemet. A sürgős témákhoz rövidebb, a több időt igénylőkhöz hosszabb határidőt adhattok. A különböző döntések eltérő sebességgel haladhatnak.
      * Könnyen alakíthatod a részvételed tempóját. Ha neked túl gyors vagy túl lassú a beszélgetés, megoszthatod a véleményedet, majd később visszatérhetsz, amikor javaslat születik.
      * A Loomióban egy „gyors” döntés 1–2 napot vesz igénybe, míg személyesen akár 5 perc alatt is megszülethet. A Loomio mégsem feltétlenül érződik lassúnak. A döntés más munkával párhuzamosan halad, és két nap alatt mindenki véleményét összegyűjteni gyakran hatékonyabb, mint személyes találkozót szervezni.
      * A Loomión végzett facilitálás a Mátrix „golyóidő” jelenetéhez hasonlítható, amikor Neo megállítja az időt, és elsétál egy golyó mellett. Egy élő beszélgetést képkockáról képkockára követhetsz.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  79fbcf8bb8520bf1:
    english: "## Managing the Attention Economy"
    translation: "## A figyelem kezelése"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c71302b08c3b6394:
    english: A facilitator is a curator of attention. The information available can be literally infinite. It becomes critical to filter it in order to avoid becoming overwhelmed. Managing the attention economy means balancing importance against time and capacity.
    translation: A facilitátor segít irányítani a figyelmet. A rendelkezésre álló információ mennyisége szinte végtelen lehet, ezért szűrni kell, hogy ne váljon kezelhetetlenné. A figyelem kezelése azt jelenti, hogy a fontosságot összehangoljuk a rendelkezésre álló idővel és kapacitással.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  865afb1b25257bbd:
    english: Facilitation can help the group agree what the purpose and scope of a given discussion or process is, so they can have a rubric for prioritising attention. Limiting distractions and steering the conversation back on track are common interventions.
    translation: A facilitálás segíthet a csoportnak megállapodni egy beszélgetés vagy folyamat céljáról és kereteiről. Így könnyebb eldönteni, mire fordítsanak figyelmet. Gyakori lépés a zavaró tényezők csökkentése és a beszélgetés visszaterelése a témához.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3dd99b496718a570:
    english: Another important way facilitators work with attention is to insist on the group holding it long enough. When things get challenging, unclear, or uncomfortable, people to want to give up too soon, jump to another topic, or look away. A facilitator can help the group see things through, in service of their collective goals.
    translation: 'A facilitátor azzal is segíti a figyelem kezelését, hogy a csoportot arra ösztönzi: maradjon egy kérdésnél elég sokáig. Amikor a helyzet nehézzé, bizonytalanná vagy kényelmetlenné válik, könnyű túl korán feladni, más témára váltani vagy elfordulni tőle. A facilitátor segíthet a csoportnak végigvinni a munkát a közös cél érdekében.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  811f79cee2eed8c1:
    english: 'Structured processes and information sorting exercises are important facilitation tools in this area. Some examples:'
    translation: 'A strukturált folyamatok és az információ rendszerezésére szolgáló gyakorlatok fontos facilitációs eszközök. Néhány példa:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1254ab2b182bbd46:
    english: |-
      * **Time-boxing** — specifying a period of brainstorming, or conversation on a given topic.
      * **Agenda prioritisation** — listing everything people want to talk about and then picking to top items to focus on, before jumping into content.
      * **Post-it cloud** — generating a bunch of ideas or questions and grouping them thematically and then condensing them into topics.
      * **Parking lot** — a space to stick ideas or questions that come up that are not immediately relevant, to be addressed later.
      * **What does success look like??** Defining success criteria and keeping the group focused on it until those criteria are achieved.
    translation: |-
      * **Időkeretek kijelölése** — meghatározott időt szántok ötletelésre vagy egy adott téma megbeszélésére.
      * **A napirend rangsorolása** — felsoroljátok, miről szeretnétek beszélni, majd a tartalmi munka előtt kiválasztjátok a legfontosabb témákat.
      * **Ötletek csoportosítása** — összegyűjtitek az ötleteket és kérdéseket, témák szerint csoportosítjátok, majd fő témákká vonjátok össze őket.
      * **Későbbre félretett kérdések** — külön helyet adtok azoknak az ötleteknek és kérdéseknek, amelyek most nem tartoznak szorosan a témához, de később visszatértek rájuk.
      * **Honnan tudjuk, hogy sikerrel jártunk?** Meghatározzátok a siker feltételeit, és ezek teljesüléséig rájuk összpontosítotok.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  11cc1fd7daee10e8:
    english: |-
      * One of the most important attention management features in Loomio is topic-based discussion threading. There’s a reason why this format was one of the first to emerge in online communication decades ago, and continues to be used widely today: it’s a highly effective way to sort attention. Most Loomio users intuitively understand how to stay on topic when it’s listed in big letters at the top of the page.
      * Activity in Loomio is the currency of its attention economy, and everything that generates a notification spends that currency. The software has opinions about what should be considered “salient” activity that generates notifications (for example, comments, votes, and outcomes are, while a “like” on a comment is not), developed based on user feedback.
      * Users can exercise a lot of customised control over their Loomio attention economy through notification settings. Helping users set these preferences is an important tool to wisely using the attention economy of the group.
      * Subgroups can be a powerful tool to help people moderate their attention economy. If only some people need to pay attention, you can split it out.
      * The intentional but somewhat unpopular design decision to disallow concurrent proposals in Loomio is about the flow of attention — holding a group’s “feet to the fire” to fully process a proposal before moving on.
    translation: |-
      * A Loomio figyelemkezelésének egyik legfontosabb eszköze a témák szerint elkülönített beszélgetési szál. Ez a forma évtizedekkel ezelőtt megjelent az online kommunikációban, és ma is széles körben használják, mert segít a figyelem rendezésében. Ha a téma jól látható az oldal tetején, a legtöbb Loomio-felhasználó könnyen rajta tud maradni.
      * A Loomióban a figyelem korlátozott erőforrás, és minden értesítést kiváltó tevékenység igénybe veszi. A felhasználói visszajelzések alapján a szoftver különbséget tesz az értesítést érdemlő tevékenységek, például hozzászólások, szavazatok és következtetések, valamint az olyan tevékenységek között, mint egy hozzászólás kedvelése.
      * Az értesítési beállításokkal a felhasználók részletesen szabályozhatják, mire fordítanak figyelmet a Loomióban. Ha segítesz nekik beállítani ezeket, a csoport is jobban gazdálkodhat a figyelemmel.
      * Az alcsoportok segíthetnek a figyelem elosztásában. Ha egy kérdésre csak néhány embernek kell figyelnie, külön alcsoportban foglalkozhatnak vele.
      * A Loomio tudatos, bár nem mindig népszerű döntése, hogy nem enged párhuzamos javaslatokat. Ez segít a csoportnak alaposan feldolgozni egy javaslatot, mielőtt továbblép.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e522b56bbe8b16c9:
    english: "> Many designers of information systems incorrectly represented their design problem as information scarcity rather than attention scarcity, and as a result they built systems that excelled at providing more and more information to people, when what was really needed were systems that excelled at filtering out unimportant or irrelevant information. — **[Wikipedia](https://en.wikipedia.org/wiki/Attention_economy)**"
    translation: "> Sok információs rendszer tervezője tévesen az információ hiányát tekintette problémának a figyelem hiánya helyett. Ezért olyan rendszereket építettek, amelyek egyre több információt adtak az embereknek, pedig olyan rendszerekre lett volna szükség, amelyek hatékonyan kiszűrik a lényegtelen vagy nem kapcsolódó információt. — **[Wikipédia](https://en.wikipedia.org/wiki/Attention_economy)**"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  12f78aa04c29d66d:
    english: "## Facilitation Interventions"
    translation: "## Facilitációs beavatkozások"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  51065e352a92bf84:
    english: There are as many facilitation techniques as there are facilitators in the world, and entire libraries of books have been written on the topic. It’s not possible to provide a comprehensive list of interventions.
    translation: Ahány facilitátor van, annyiféle facilitációs módszer létezik, és könyvtárnyi művet írtak a témáról. Nem lehet minden beavatkozást felsorolni.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1e23df53c3b816be:
    english: 'However, it might be useful to consider two categories of interventions:'
    translation: 'Kétféle beavatkozást azonban érdemes megkülönböztetni:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d5738a06518b45da:
    english: |-
      1. **Supportive interventions**: inviting contribution, going deeper, drawing out, coaxing, nurturing, protecting, creating space.
      2. **Assertive interventions**: pulling back, shutting down, drawing lines, interrupting, challenging, steering on course, excluding bad behaviour.
    translation: |-
      1. **Támogató beavatkozások**: részvételre hívás, elmélyülés, vélemények előhívása, bátorítás, gondoskodás, védelem, tér biztosítása.
      2. **Határozott beavatkozások**: visszafogás, lezárás, határok kijelölése, félbeszakítás, kihívás elé állítás, a beszélgetés visszaterelése, a nem megfelelő viselkedés kizárása.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9f30fd7cd75da986:
    english: Almost all interventions in face-to-face facilitation can be reimagined and employed in the online space.
    translation: A személyes facilitálás szinte minden beavatkozása átgondolható és alkalmazható online is.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1ed397ff049f2888:
    english: "> Singling people out for a contribution will just make them feel like the stupid kid in class who doesn’t know the answer. Instead, a general invite to people who haven’t spoken yet to contribute tells the regular contributors to stay quiet, and gives quieter people the opportunity to step forward. — Silvia Zuur"
    translation: "> Ha név szerint kérsz valakitől hozzászólást, könnyen úgy érezheti magát, mint az a gyerek az osztályban, aki nem tudja a választ. Inkább általában hívd hozzászólásra azokat, akik még nem szólaltak meg. Ez jelzi a rendszeresen megszólalóknak, hogy adjanak teret másoknak, a csendesebbeknek pedig lehetőséget ad a részvételre. — Silvia Zuur"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2d6c0a7189745fe1:
    english: |-
      * Intervention tools in Loomio include comments, @mentions, adding/removing users, and starting/deleting discussions. These can be employed for various forms of supportive and assertive interventions.
      * The most commonly used intervention is the comment — simply talking to the group and inviting or trying to reduce certain behaviour.
      * [Participation permissions](/en/user_manual/groups/settings/#permissions) offer relatively blunt but effective tools to moderate users, such as allowing or disallowing posting discussions or proposals.
      * Loomio offers some trust-based features that other tools lack, such as the default ability for all participants to edit discussion contexts (even if it was posted originally by another user). These are inspired by things like Wikipedia and open source software development.
    translation: |-
      * A Loomióban beavatkozásra használhatod a hozzászólásokat, a @megemlítéseket, a felhasználók hozzáadását vagy eltávolítását, valamint a beszélgetések indítását vagy törlését. Ezek támogató és határozott beavatkozásokra is alkalmasak.
      * A leggyakoribb beavatkozás egy hozzászólás: megszólítod a csoportot, és bátorítasz vagy visszafogsz egy bizonyos viselkedést.
      * A [részvételi jogosultságok](/en/user_manual/groups/settings/#permissions) egyszerű, de hatékony eszközök a felhasználók tevékenységének szabályozására. Például engedélyezheted vagy tilthatod, hogy beszélgetéseket vagy javaslatokat tegyenek közzé.
      * A Loomio olyan, bizalmon alapuló lehetőségeket is kínál, amelyek más eszközökből hiányoznak. Alapértelmezés szerint például minden résztvevő szerkesztheti a beszélgetés kontextusát, akkor is, ha azt eredetileg valaki más írta. Ezt többek között a Wikipédia és a nyílt forráskódú szoftverfejlesztés gyakorlata ihlette.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
