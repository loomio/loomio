  e19d687b56819302:
    english: Hi! I'm Alanna.
    translation: Здравствуйте, я Аланна.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  10352ad196487ff3:
    english: I'm one of the founders of Loomio, and I've been thinking deeply about how it works from a facilitation perspective since the beginning. I am not a seminal facilitation expert; I consider myself only a beginner in this craft that one could spend a lifetime honing.
    translation: Я одна из основательниц Loomio. С самого начала я много размышляла о том, как сервис помогает проводить обсуждения. Я не считаю себя крупным специалистом по фасилитации. Для меня это ремесло, которому можно учиться всю жизнь, и я пока в начале пути.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c637c96f9723f02d:
    english: What I can offer is help translating between the offline and online spaces, as a practitioner in both. I've facilitated a lot of groups who use Loomio, and learned from their experiences.
    translation: Я могу поделиться опытом переноса фасилитации из очных встреч в интернет, поскольку работала в обоих форматах. Я помогала многим группам, использующим Loomio, и многому научилась на их опыте.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c376e38821fb6c2f:
    english: You can find out [more about me on my website](http://alanna.space).
    translation: "[На моём сайте](http://alanna.space) вы можете узнать обо мне больше."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b893957534fa37e2:
    english: I'm only one person, with one perspective and approach to facilitation, when there are myriad approaches. I've tried to bring in a couple other facilitator's voices here, including [Rich](http://richdecibels.com/) from Loomio and Silvia from [EXP](http://exp.agency).
    translation: Мой взгляд на фасилитацию — лишь один из многих. Поэтому я постаралась включить в руководство мнения других фасилитаторов, в том числе [Рича](http://richdecibels.com/) из Loomio и Сильвии из [EXP](http://exp.agency).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
