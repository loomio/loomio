    translated_on: '2026-09-29'
  f3bbc883f6429276:
    english: "### Close early"
    translation: "### Sluit vroeg"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  af6a9acaafaaa96a:
    english: Select **Close early** to close a poll before its scheduled closing time.
    translation: Selecteer **Sluit vroeg** om een peiling vóór de geplande sluitingstijd te sluiten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3cdbb11687fa03c0:
    english: You might do this when everyone has voted or the poll no longer needs to remain open.
    translation: Dat kan als iedereen heeft gestemd of de peiling niet langer open hoeft te blijven.
    status: machine
