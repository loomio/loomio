  02feef9bf78ef420:
    english: "## Where are we on the Map?"
    translation: "## A che punto siamo?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '083f066ff9a3cfde':
    english: People feel more confident and better held if they can orient themselves on a timeline or agenda. They want to know what they’re doing now, what’s coming up, and to be reminded of what they’ve already done. Understanding the overall shape of the process helps people understand how to contribute effectively.
    translation: Le persone si sentono più sicure e sostenute quando possono orientarsi in una sequenza di tappe o in un programma. Vogliono sapere che cosa stanno facendo, che cosa succederà dopo e che cosa hanno già fatto. Comprendere il percorso nel suo insieme le aiuta a capire come contribuire in modo efficace.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ea2ef3e629108828:
    english: For example if they can see there’s a Q&A section later, they'll be more willing to hold their questions during a presentation. If it’s clear that there’s a divergent phase and then a convergent phase, people will hold back from jumping to solutions too soon. People need to know what kind of input they are being asked for, and when.
    translation: Per esempio, se sanno che più avanti ci sarà uno spazio per le domande, saranno più propense ad aspettare la fine di una presentazione. Se è chiaro che a una fase di esplorazione seguirà una fase in cui si arriva a una conclusione, eviteranno di proporre soluzioni troppo presto. Le persone devono sapere quale contributo viene chiesto loro e quando.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7a5d009dfc4e0f6b:
    english: Mapping the process well enough to communicate it also challenges facilitators to fully think through the journey, and helps them make sure each part of the process has a purpose that builds a cohesive whole. A well-facilitated experience follows a logical progression.
    translation: Definire il percorso con chiarezza per poterlo comunicare spinge anche chi facilita a riflettere su ogni tappa. Aiuta a verificare che ciascuna abbia uno scopo e contribuisca a un insieme coerente. Un percorso ben facilitato segue una progressione logica.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aabfa9d842af2688:
    english: On Loomio
    translation: Su Loomio
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  af3599a59685a726:
    english: |-
      * A Loomio decision already follows a basic logical progression (which is why it works): Gather (open/invite), Discuss (divergent), Propose (convergent), Decide and Act (conclude).
      * Many Loomio users are employing the tool as part of explicitly mapped experiences, such as a multi-stage consultation process.
      * We offer some tools of facilitators to help “reveal the map” to users, such as the group description field, and proposal deadlines. These can be proactively leveraged to increase context for participants.
    translation: |-
      * Una decisione su Loomio segue già una progressione logica di base: raccogliere le persone (aprire e invitare), discutere (esplorare), formulare una proposta (convergere), decidere e agire (concludere).
      * Molte persone usano Loomio all'interno di percorsi con tappe definite, come una consultazione in più fasi.
      * Alcuni strumenti aiutano chi facilita a mostrare il percorso alle persone partecipanti, per esempio la descrizione del gruppo e le scadenze delle proposte. Usarli in anticipo offre più contesto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  228ae545a39cd553:
    english: "## The Art of Noticing"
    translation: "## L'arte di osservare"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  04155220f602a7e8:
    english: Noticing is probably the most critical facilitation skill of all. The facilitator uses noticing to figure out what interventions or responses are needed, how to invite the right contributions, and to help the group notice itself. The value of facilitation is having someone paying attention and acting on what they notice, while others may be focused on specific content or their own agendas.
    translation: Saper osservare è forse la competenza più importante per chi facilita. Permette di capire quali interventi servono, come invitare le persone a contribuire e come aiutare il gruppo a riconoscere ciò che sta accadendo. Il valore della facilitazione sta nell'avere qualcuno che presta attenzione e agisce di conseguenza, mentre le altre persone possono concentrarsi sui contenuti o sui propri obiettivi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  90a03fdb345369b7:
    english: 'Effective noticing is a combination of good informational inputs, and sensitivity and skill to interpret them. Many facilitators talk about “reading” a room: emotional reactions, tensions,  power dynamics. Facilitators need effective information signalling systems.'
    translation: 'Per osservare bene servono informazioni utili, sensibilità e capacità di interpretazione. Chi facilita parla spesso di «leggere la stanza»: cogliere reazioni emotive, tensioni e dinamiche di potere. Per farlo servono segnali e informazioni efficaci.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  49b0f2cc823e0384:
    english: |-
      * Many current features assist with noticing — the biggest one is probably watching how the pie is shaping up in a proposal.
      * The software notices some things: who has and has not yet participated, what topics are being raised, who has and has not accepted their group invitation, etc.
      * On Loomio, a single facilitator can read across dozens of discussions at the same time, see clearly what’s being shared, and act accordingly.
      * Talking online can make the implicit explicit, and therefore easier to notice.
      * Communicating in writing can be very good for naming what’s being noticed and why a certain action is being taken in response. For example, you can quote someone’s exact words and reflect back what’s revealed by them. Or you can do the same thing at the level of a whole discussion, picking out a range of quotes and noticing themes or emerging conflicts.
      * Noticing is much easier when you slow things down, which is one of Loomio’s great advantages — asynchronous communication you can read at any pace. It also makes it possible to notice across time, referring directly to past discussions.
      * Because you can have simultaneous discussions, it's possible to have a layer of “meta” discussion (aka “blue hat”, aka discussion about the discussion) at the same time as progressing the main discussions. So you can collectively have a space to practice noticing without slowing down the process.
    translation: |-
      * Molte funzioni aiutano a osservare ciò che accade. Una delle più utili è vedere come si compone il grafico a torta di una proposta.
      * Il software rileva alcuni aspetti: chi ha già partecipato e chi no, quali temi emergono, chi ha accettato l'invito al gruppo e chi non l'ha ancora fatto.
      * Su Loomio, una sola persona può seguire decine di discussioni contemporaneamente, vedere con chiarezza ciò che viene condiviso e intervenire di conseguenza.
      * Parlare online può rendere esplicito ciò che altrimenti resterebbe implicito, facilitandone l'osservazione.
      * La comunicazione scritta aiuta a descrivere ciò che si osserva e a spiegare perché si interviene. Per esempio, puoi citare le parole esatte di una persona e mettere in luce ciò che rivelano. Puoi fare lo stesso con un'intera discussione, scegliendo diverse citazioni per individuare temi ricorrenti o conflitti emergenti.
      * È più facile osservare quando il ritmo rallenta. Questo è uno dei vantaggi di Loomio: puoi leggere la comunicazione asincrona con i tuoi tempi. Puoi anche osservare come le cose cambiano nel tempo, facendo riferimento diretto alle discussioni passate.
      * Poiché possono svolgersi più discussioni contemporaneamente, puoi aprire una discussione «meta» (detta anche «cappello blu», cioè una discussione sulla discussione) mentre le discussioni principali proseguono. Il gruppo può così osservare insieme ciò che accade senza rallentare il percorso.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cdb52080510ddb69:
    english: "## Hearing Diverse Voices"
    translation: "## Ascoltare voci diverse"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  150ff74c2805696b:
    english: In our society, multiple layers of history, power dynamics, culture, and psychology conspire to amplify certain voices and suppress others. This plays out at every level of experience, from our innermost subconscious beliefs to our political system and laws.
    translation: Nella nostra società, la storia, le dinamiche di potere, la cultura e la psicologia si intrecciano e danno più spazio ad alcune voci, mentre ne mettono a tacere altre. Questo accade a ogni livello, dalle convinzioni più profonde e inconsce fino al sistema politico e alle leggi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a3dccb91d161d18a:
    english: But the best ideas do not always come from the loudest voices, and the role of facilitation is to counteract these biases. It’s important to be aware of the dynamics we are collectively grappling with if our goals are social justice, group effectiveness, and high quality decision making.
    translation: Le idee migliori, però, non arrivano sempre dalle voci più forti. La facilitazione aiuta a contrastare questi pregiudizi. Se vogliamo promuovere la giustizia sociale, aiutare i gruppi a lavorare bene e prendere decisioni di qualità, dobbiamo riconoscere le dinamiche che affrontiamo insieme.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5e8160d5b0da948a:
    english: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../rich_200.png"> If you want to innovate, you have to make space for different points of view — luckily, this is also what you need to do if you want a team where everyone is empowered. All kinds of cultural and technical factors conspire to privilege some voices at the expense of others. There are many practices you can implement to systematically challenge that bias, but just being aware of it is a good starting point. — Richard Bartlett'
    translation: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../rich_200.png"> Se vuoi innovare, devi dare spazio a punti di vista diversi. È anche ciò che serve per creare un gruppo in cui tutte le persone possano contribuire. Fattori culturali e tecnici di ogni tipo favoriscono alcune voci a scapito di altre. Ci sono molte pratiche per contrastare sistematicamente questo squilibrio, ma riconoscerlo è già un buon punto di partenza. — Richard Bartlett'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  63e0bdf44ad2df5f:
    english: Our lived human experience is to inhabit a singular consciousness, so humans tend to forget that others experience the world differently. Even within a seemingly homogenous group, there is incredible diversity — perspectives, pace, preferences. Internalising this truth — that others are different from myself — is a central personal growth challenge.
    translation: Ciascuno vive il mondo attraverso la propria coscienza e tende a dimenticare che le altre persone lo vivono in modo diverso. Anche in un gruppo apparentemente omogeneo c'è una grande varietà di prospettive, ritmi e preferenze. Accettare che gli altri siano diversi da noi è una parte fondamentale della crescita personale.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  62f6a86aa220b787:
    english: There is no such thing as one size fits all. Any mode of interacting enhances some voices and quiets others, or emphasises different tendencies within an individual. So, it’s necessary to employ a range of approaches to invite the best from multiple diverse voices.
    translation: Non esiste un approccio adatto a tutti. Ogni modo di interagire dà più spazio ad alcune voci e meno ad altre, oppure mette in risalto aspetti diversi della stessa persona. Per raccogliere il meglio da voci diverse servono quindi più modi di partecipare.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8f9c1b2c0e40b1fc:
    english: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../silvia_200.png"> Check you’re catering to different learning styles. One simple way to check is with the Head, Heart, Hands metaphor. People who learn with their Head need facts and detailed information. A Heart learner thrives off stories. They need an emotional connection to the work. Learning with the Hands is all about doing stuff and getting active. — Silvia Zuur'
    translation: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../silvia_200.png"> Verifica di offrire spazio a diversi modi di apprendere. Un modo semplice per farlo è usare la metafora della testa, del cuore e delle mani. Chi apprende con la testa ha bisogno di fatti e informazioni dettagliate. Chi apprende con il cuore trae beneficio dalle storie e ha bisogno di un legame emotivo con il lavoro. Chi apprende con le mani impara facendo e partecipando attivamente. — Silvia Zuur'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  04a3a7bc850913ab:
    english: One of the best approaches to bringing out and weaving together diverse voices is to invite diverse modes of interaction, which will serve different needs and preferences, and level the communication playing field.
    translation: Per far emergere e intrecciare voci diverse, invita le persone a interagire in modi differenti. Questo risponde a esigenze e preferenze diverse e rende la comunicazione più equilibrata.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ba31b7da59193745:
    english: 'Some classic design building blocks to address communication diversity in collaborative communication:'
    translation: 'Ecco alcuni elementi classici per tenere conto dei diversi modi di comunicare nella collaborazione:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fbcafe73c1d8720b:
    english: |-
      * **Group size** — individual reflection, pairs, small group, large group, one-to-one, one-to-many, many-to-many.
      * **Medium of expression** — writing, drawing, video, singing, dance, flowcharts, equations, symbols, stories, tears, laughter, debate, etc.
      * **Discussion protocols** — rounds (hear from each person once before moving on), rate limiting (you can only speak again after two others have spoken), talking stick (only speak when you have the stick — no interrupting), time-limited contributions (you can talk for 1 minute only), time-unlimited contributions (you can hold the floor indefinitely and everyone will deeply listen), tracking contributions (how much have women vs men spoken, etc), holding periods of silence between speakers (for processing and reflection).
      * **Embrace silence** *Silence is only awkward if you let it be awkward. Silence is a chance for people to think. — Silvia Zuur*
    translation: |-
      * **Dimensione del gruppo** — riflessione individuale, coppie, piccoli gruppi, gruppi numerosi, comunicazione tra due persone, da una a molte persone o tra molte persone.
      * **Mezzo di espressione** — scrittura, disegno, video, canto, danza, diagrammi di flusso, equazioni, simboli, racconti, lacrime, risate, dibattito e altro.
      * **Regole di discussione** — turni di parola (ascoltare ogni persona una volta prima di proseguire), limiti agli interventi (puoi parlare di nuovo solo dopo altre due persone), bastone della parola (parli solo quando lo hai, senza interruzioni), interventi a tempo (puoi parlare per un solo minuto), interventi senza limiti di tempo (puoi parlare finché vuoi e tutte le persone ascoltano con attenzione), monitoraggio degli interventi (per esempio, quanto hanno parlato le donne rispetto agli uomini), pause di silenzio tra gli interventi (per elaborare e riflettere).
      * **Accogliere il silenzio** *Il silenzio è imbarazzante solo se lo lasci diventare tale. È un'occasione per pensare. — Silvia Zuur*
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ff925b4be393907c:
    english: |-
      * The design of Loomio has always been about “hearing all voices”, including people who aren’t able to be there in person, are quieter, are busy, etc.
      * In text, every voice is more or less the same “volume” and “speed”. Written asynchronous communication offers a kind of leveling of the field.
      * The proposal feature is essentially a “round”, assisting groups to facilitate each individual person having their say (if they want to) on an equal basis.
      * Loomio enables multi-media (links, videos, images, diagrams, supporting evidence), which serve various communication styles.
      * Loomio itself is pretty basic, but with active facilitation and group maturity, it is possible to employ discussion protocols “manually” using cultural norms or agreed rules (eg, a discussion where everyone only posts once until everyone else has participated).
      * Loomio provides flexible tools for small and large group interaction, using parent groups and subgroups. Some large consultation processes have involved multiple smaller groups which are then synthesised into a larger outcome.
      * People who want time for individual reflection can take time out and process their thoughts, and then come back and share a longer comment or link to a document. This is a “self-selecting” example of creating interplay between individual and group communication.
      * Loomio accessibility features and multi-lingual translations make it possible for people with very different needs to participate as equals in one discussion. This is a key example of how technology can enable equitable participation in a way that’s nearly impossible in person.
      * If someone is contributing more than their share (talking too much), it’s technically possible to just scroll on by (whereas in person this behaviour can totally dominate the interaction). However, people posting “walls of text” can still be detrimental to a balanced Loomio discussion.
    translation: |-
      * Loomio è stato progettato per «ascoltare tutte le voci», comprese quelle di chi non può partecipare di persona, parla meno o ha poco tempo.
      * Nel testo, tutte le voci hanno più o meno lo stesso «volume» e la stessa «velocità». La comunicazione scritta e asincrona rende la partecipazione più equilibrata.
      * Una proposta funziona, in sostanza, come un turno di parola: aiuta il gruppo a dare a ogni persona la stessa opportunità di esprimersi, se lo desidera.
      * Loomio permette di condividere contenuti multimediali (link, video, immagini, diagrammi e documenti a sostegno), adatti a diversi modi di comunicare.
      * Gli strumenti di Loomio sono semplici, ma con una facilitazione attiva e un gruppo maturo è possibile applicare «manualmente» regole di discussione attraverso abitudini condivise o accordi. Per esempio, ogni persona può pubblicare un solo intervento finché tutte le altre non hanno partecipato.
      * Loomio offre strumenti flessibili per gruppi piccoli e grandi, attraverso gruppi principali e sottogruppi. In alcune consultazioni ampie, più gruppi piccoli hanno lavorato separatamente e i loro contributi sono stati poi riuniti in una conclusione comune.
      * Chi desidera riflettere individualmente può prendersi del tempo per elaborare le proprie idee e tornare più tardi con un commento più lungo o un link a un documento. È un modo, scelto dalla persona stessa, di alternare riflessione individuale e comunicazione di gruppo.
      * Le funzioni di accessibilità e le traduzioni di Loomio permettono a persone con esigenze molto diverse di partecipare alla stessa discussione in condizioni più eque. È un esempio di come la tecnologia possa rendere possibile una partecipazione difficile da ottenere di persona.
      * Se una persona interviene troppo spesso, puoi tecnicamente scorrere oltre i suoi messaggi, mentre di persona potrebbe dominare la conversazione. I messaggi molto lunghi, però, possono comunque rendere meno equilibrata una discussione su Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bb74ebca94285a48:
    english: "## Counter Cognitive Bias"
    translation: "## Contrastare i bias cognitivi"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c8d4a9a10da47a62:
    english: Human brains have evolved over millions of years to balance quick, efficient “good enough” thinking with slow, expensive, deep analysis. This allows us to use instincts, heuristics, and generalisations as cheap and fast solutions most of the time, and to engage deep analysis when needed.
    translation: Nel corso di milioni di anni, il cervello umano si è evoluto per bilanciare il pensiero rapido ed efficiente, «sufficientemente buono», con un'analisi lenta, impegnativa e approfondita. Così, per la maggior parte del tempo possiamo affidarci a istinti, scorciatoie mentali e generalizzazioni, e ricorrere a un'analisi approfondita quando serve.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3a35775e59cdea17:
    english: But sometimes we get it wrong. In fact, there are well-known “bugs” in the human cognition program, which can keep people from making the best decisions. This is further complicated in group situations. We need to be aware of these dynamics.
    translation: A volte, però, sbagliamo. Esistono errori ricorrenti nel modo in cui pensiamo che possono impedirci di prendere le decisioni migliori. Nei gruppi, queste dinamiche diventano ancora più complesse. Dobbiamo imparare a riconoscerle.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e3d808eb17e1aa5a:
    english: There is a huge [range of cognitive biases](https://en.wikipedia.org/wiki/List_of_cognitive_biases) (this list is really worth a read), all of which have potential impacts on decision making and collaboration. Facilitation can be an important tool to deal with them, to raise awareness of their existence, encourage proactive choices about them. For example, asking when is it more important to move quickly and when is it more important to be accurate.
    translation: Esiste una vasta [gamma di bias cognitivi](https://en.wikipedia.org/wiki/List_of_cognitive_biases) (vale la pena leggere questo elenco) che possono influire sulle decisioni e sulla collaborazione. La facilitazione può aiutare a riconoscerli e a scegliere consapevolmente come affrontarli. Per esempio, può aiutare a chiedersi quando sia più importante procedere rapidamente e quando sia più importante essere accurati.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c4755a454121a7b6:
    english: One powerful tool to counter cognitive bias and increase quality of decisions is structured processes and communication. The challenge of following a process instead of the “path of least resistance” can help highlight thinking errors and bias. Facilitators sometimes push for things that feel challenging or trigger resistance, precisely because brains are being asked to step out of familiar patterns. Discipline in this area can help groups achieve their deeper goals, which can be worth some temporary discomfort.
    translation: Processi e forme di comunicazione strutturati sono strumenti efficaci per contrastare i bias cognitivi e migliorare le decisioni. Seguire un percorso invece della «via più facile» può far emergere errori di ragionamento e pregiudizi. A volte chi facilita propone attività che sembrano difficili o suscitano resistenza proprio perché chiedono di uscire dagli schemi abituali. Un po' di disciplina può aiutare il gruppo a raggiungere obiettivi più importanti, anche se comporta un disagio temporaneo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  99caa45d2ab4ae8b:
    english: 'Some examples of processes that can help mitigate cognitive bias:'
    translation: 'Ecco alcuni processi che possono ridurre l''effetto dei bias cognitivi:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ebd2c767ea8fae2e:
    english: |-
      * [De Bono’s Hats](http://www.debonoforschools.com/asp/six_hats.asp): different colored hats participants can wear (metaphorically) to step outside their own opinions and try on different modes of thinking.
      * Checklists: thinking “ruts” can cause us to miss even obvious things (especially in areas we're very familiar with), so a checklist can weed out errors.
      * The Five Why’s: only asking why once or twice can mislead you into thinking you’ve reached the conclusion before you get to the root level of the issue. Asking five times tends to get to the bottom of it.
      * Mental models: exercises like [SWOT analysis](https://en.wikipedia.org/wiki/SWOT_analysis), the [business model canvas](https://en.wikipedia.org/wiki/Business_Model_Canvas), or any number of countless other structured information gathering exercises can guide you to cleaner analysis and reveal assumptions.
    translation: |-
      * [I cappelli di De Bono](http://www.debonoforschools.com/asp/six_hats.asp): cappelli di colori diversi che le persone possono indossare metaforicamente per mettere da parte le proprie opinioni e provare modi diversi di pensare.
      * Liste di controllo: le abitudini mentali possono farci trascurare anche aspetti evidenti, soprattutto negli ambiti che conosciamo bene. Una lista di controllo aiuta a individuare gli errori.
      * I cinque perché: chiedere «perché» solo una o due volte può farci credere di aver trovato la risposta prima di arrivare alla causa di fondo. Chiederlo cinque volte aiuta ad approfondire.
      * Modelli mentali: esercizi come l'[analisi SWOT](https://en.wikipedia.org/wiki/SWOT_analysis), il [Business Model Canvas](https://en.wikipedia.org/wiki/Business_Model_Canvas) e molti altri metodi strutturati per raccogliere informazioni possono guidare un'analisi più chiara e far emergere le ipotesi implicite.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  073fb22a0e7cd744:
    english: |-
      * Diverse information and inputs can disrupt assumptions or bias. This is built into Loomio’s basic design: by enabling more voices to contribute to a discussion on a more equitable basis, you have a chance to escape “groupthink”.
      * Loomio gives participants the ability to dissent constructively. Safe and valued dissent is essential for a culture of critical thinking.
      * Communicating asynchronously in writing slows conversation down and lets it be more carefully considered, giving people a chance to think more carefully and avoid cognitive errors.
      * Loomio invites people into a semi-structured process that leads to more considered decision making. Loomio can be used for a huge range of different processes, but simply having *some* structure in a discussion enables other possibilities.
    translation: |-
      * Informazioni e contributi diversi possono mettere in discussione ipotesi e pregiudizi. Questo principio è alla base di Loomio: quando più persone possono contribuire a una discussione in condizioni più eque, il gruppo ha maggiori possibilità di evitare il pensiero di gruppo.
      * Loomio permette alle persone di esprimere il dissenso in modo costruttivo. Un dissenso accolto e considerato è essenziale per il pensiero critico.
      * La comunicazione scritta e asincrona rallenta la conversazione e lascia più tempo per riflettere, aiutando a evitare errori di ragionamento.
      * Loomio invita a seguire un percorso in parte strutturato che favorisce decisioni più ponderate. Può essere usato per molti processi diversi, ma anche una struttura minima nella discussione apre nuove possibilità.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4ae16a63e2dd047a:
    english: "## Balancing Divergent & Convergent"
    translation: "## Bilanciare esplorazione e convergenza"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2983c2d32846ebd5:
    english: The “diamond” of divergence and convergence is a conversational shape. It expands outward at first — opening up space for ideas, information, and different perspectives — then begins to come to a point. The right timing for this shift is key for effective facilitation of action-oriented, productive, collaborative discussions.
    translation: Il «diamante» dell'esplorazione e della convergenza descrive la forma di una conversazione. All'inizio si allarga, dando spazio a idee, informazioni e prospettive diverse; poi si restringe verso una conclusione. Scegliere il momento giusto per passare da una fase all'altra è fondamentale per facilitare discussioni collaborative che portino ad agire.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bce4c52d377dbdbd:
    english: If divergence is missed out or cut off too early, there will be a lack of information to work with, people may not feel heard, and great ideas will be left unsaid. If convergence is missed out or left too late, discussion can continue indefinitely without reaching an actionable conclusion, burning participants energy and failing to achieve results.
    translation: Se la fase di esplorazione manca o finisce troppo presto, ci saranno poche informazioni su cui lavorare, alcune persone potrebbero non sentirsi ascoltate e buone idee resteranno inespresse. Se la convergenza manca o arriva troppo tardi, la discussione può continuare senza fine e senza una conclusione su cui agire, consumando le energie delle persone senza produrre risultati.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9f787be37e0492cc:
    english: Each sub-phase of the larger process also requires awareness of the right timing and intervention. Divergence consists of introduction, clarification, ideation. Convergence consists of analysis, conclusion, commitment. Some discussions succeed with only a vague nod toward the diamond, while others are served by a meticulous breakdown of each phase and sub-phase.
    translation: Anche ogni fase del percorso richiede attenzione ai tempi e agli interventi. L'esplorazione comprende introduzione, chiarimento e generazione di idee. La convergenza comprende analisi, conclusione e impegno ad agire. Per alcune discussioni basta seguire il diamante in modo generale; per altre è utile definire con cura ogni fase e sottofase.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d8c7970db55ea11:
    english: Within a group, different individuals will usually tend to prefer one mode or the other, and the group as a whole will have collective tendencies. Imbalance looks like too much blue sky thinking, or jumping to solutions. Facilitation can help each person and the group as a whole spend the right amount of energy on the different modes.
    translation: In un gruppo, le persone tendono a preferire una fase o l'altra e anche il gruppo nel suo insieme sviluppa delle tendenze. Lo squilibrio si manifesta quando si resta troppo a lungo nel campo delle idee astratte o si passa troppo presto alle soluzioni. La facilitazione aiuta le persone e il gruppo a dedicare la giusta energia a entrambe le fasi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  36405c3bfcb951b6:
    english: |-
      * The core Loomio process does an excellent job of guiding groups to touch on each phase of the process, with the discussion being divergent and proposals being convergent. Awareness of the diamond was a big inspiration for the original design of the Loomio process.
      * Loomio helps groups to use the diamond in dynamic ways, such as when an attempt to converge (a proposal) ends up becoming a deeper level of divergence (disagreement), revealing or clarifying information to support an even better convergence (iterated proposal).
      * Some of Loomio’s basic features go a long way toward supporting each mode, such as notifications to group members when a new discussion is starting (prompting divergent contribution), and deadlines on proposals (prompting participation in convergence).
      * Loomio users are already able to use the existing feature set to facilitate convergence — namely starting a proposal. Good use of proposals is one of the most obvious symptoms of an effective Loomio group, and simply advising users to start more proposals unblocks many groups who are having issues.
    translation: |-
      * Il percorso di base di Loomio guida i gruppi attraverso le diverse fasi: la discussione favorisce l'esplorazione e le proposte favoriscono la convergenza. Il modello del diamante ha ispirato la progettazione iniziale di Loomio.
      * Loomio aiuta i gruppi a usare il diamante in modo flessibile. Per esempio, un tentativo di convergere attraverso una proposta può far emergere un disaccordo e aprire una nuova esplorazione. Le informazioni emerse possono sostenere una proposta successiva migliore.
      * Alcune funzioni di base sostengono le diverse fasi: le notifiche ai membri del gruppo quando inizia una discussione invitano a esplorare, mentre le scadenze delle proposte incoraggiano a partecipare alla convergenza.
      * Le persone possono già favorire la convergenza con gli strumenti esistenti, soprattutto avviando una proposta. Un gruppo che usa bene le proposte tende a lavorare in modo efficace. Spesso, suggerire di avviare più proposte aiuta un gruppo a superare una difficoltà.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  af83d6e3b408e008:
    english: "## Working with Scope"
    translation: "## Definire l'ambito"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  209f071ae0c7ae0f:
    english: Successful collaboration often depends on biting off the right size pieces in the right order.
    translation: Una collaborazione efficace dipende spesso dalla capacità di affrontare questioni della giusta dimensione e nell'ordine giusto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  24658aca54702290:
    english: 'You can apply a “project management” mindset to facilitation, designing for questions like:'
    translation: 'Puoi applicare alla facilitazione un approccio da «gestione dei progetti», ponendoti domande come:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '09c7ee57551e1980':
    english: |-
      * What are the dependencies (what’s the critical path, which things need to be done first to enable other things)?
      * What are the most important bits to focus on? What can be left out?
      * What is an achievable scope to tackle at a given time to get to a useful place with the time, energy, and information available?
    translation: |-
      * Quali sono le dipendenze? Qual è il percorso critico e che cosa bisogna fare prima per rendere possibile il resto?
      * Quali sono gli aspetti più importanti su cui concentrarsi? Che cosa si può lasciare da parte?
      * Quale ambito si può affrontare ora, tenendo conto del tempo, delle energie e delle informazioni disponibili, per arrivare a un risultato utile?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bca4d47c3dc6f3cf:
    english: It’s important not to try to “boil the ocean”, and instead break things down into manageable chunks. You can build toward a bigger outcome in a series of smaller pieces. It’s often better to achieve something small but useful, than to fail to reach any conclusions. It’s also possible to get too bogged down in details and fail to hit the bigger issues.
    translation: È importante non cercare di affrontare tutto insieme, ma suddividere il lavoro in parti gestibili. Una serie di piccoli passi può portare a una conclusione più ampia. Spesso è meglio ottenere un risultato piccolo ma utile che non arrivare ad alcuna conclusione. Allo stesso tempo, soffermarsi troppo sui dettagli può far perdere di vista le questioni principali.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ce5ed5c5115c7b90:
    english: In a collaboration, no one knows exactly what will emerge, so scope must evolve with the discussion. Whether branching out at a given moment is a distraction or an evolution is a judgement call. Too much rigidity and too much flexibility can both be damaging. Often times it’s not about whether something is relevant or not, but a question of sequence and timing in terms of what will be most constructive.
    translation: In un lavoro collaborativo nessuno sa esattamente cosa emergerà, quindi l'ambito deve evolvere con la discussione. Decidere se aprire una nuova direzione sia una distrazione o uno sviluppo richiede giudizio. Sia troppa rigidità sia troppa flessibilità possono creare problemi. Spesso la questione non è se un argomento sia pertinente, ma quando sia più utile affrontarlo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3510d751f00b1ae6:
    english: "> If you plan a session with multiple, interlinked parts – each one building on the other, and all leading to a life-changing, mind-exploding conclusion – and you can pull it off, then that’s amazing. But more often than not, a complicated session will go over-time and may not hit the participant’s wants and needs. - Silvia Zuur"
    translation: "> Se progetti una sessione con molte parti collegate, ciascuna basata sulla precedente, che portano tutte a una conclusione capace di cambiare tutto, e riesci a realizzarla, è un grande risultato. Più spesso, però, una sessione complicata supera il tempo previsto e rischia di non rispondere alle esigenze di chi partecipa. - Silvia Zuur"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9204dd47d88ac308:
    english: |-
      ## A series of small yes's
      Lumping too many conversations together simply creates confusion. Frustrated groups are often helped by breaking things down. If an issue seems hopeless, complex or conflicted, it can be possible to separate out individual questions and reach consensus on them, starting with the easiest things to agree. Then when it comes to points of disagreement, you can pare it down to only the crux of the issues and work on them in a focused way.
    translation: |-
      ## Una serie di piccoli sì
      Mettere troppe conversazioni insieme crea confusione. Suddividere un problema spesso aiuta i gruppi in difficoltà. Se una questione sembra senza soluzione, complessa o controversa, puoi separare le singole domande e cercare un accordo su ciascuna, partendo da quelle più semplici. Quando arrivi ai punti di disaccordo, puoi concentrarti sugli aspetti essenziali.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2d86c0488159e380:
    english: |-
      * Topic-based discussion threads are a powerful tool for effective scope — even more than face-to-face conversation, Loomio discussions can be usefully delineated to encourage focus on a specific question, while other aspects can be addressed simultaneously in other threads.
      * We often see users making facilitation interventions like “That’s out of the scope of this topic, but why don’t you start a new discussion about it?”
      * The act of creating a Loomio group helps define who are we and what are we here to discuss. This helps participants manage scope.
      * The sequential proposals design of Loomio is very good for a “series of small yess's” approach — you can build small agreements while maintaining context in a single discussion thread, and build on the history of previous proposals.
      * Asynchronous online communication can allow some people to go way out of scope without holding up others. They can simply start a new discussion or subgroup and go as deep and long as they want, while the main scope of the group is maintained.
      * The discussion context box and group description are spaces to define the scope of a conversation or group, respectively.
    translation: |-
      * Le discussioni organizzate per argomento aiutano a definire l'ambito. Più che nelle conversazioni di persona, su Loomio puoi delimitare una discussione per concentrarti su una domanda specifica, mentre altri aspetti vengono affrontati contemporaneamente in altre discussioni.
      * Spesso vediamo interventi di facilitazione come: «Questo esula dall'argomento, ma perché non avvii una nuova discussione?»
      * Creare un gruppo Loomio aiuta a definire chi ne fa parte e di cosa si discuterà. Questo aiuta i partecipanti a mantenere chiaro l'ambito.
      * Le proposte successive di Loomio si prestano a una «serie di piccoli sì»: puoi costruire piccoli accordi mantenendo il contesto in un'unica discussione e basandoti sulle proposte precedenti.
      * La comunicazione online asincrona permette ad alcune persone di approfondire temi fuori dall'ambito principale senza rallentare le altre. Possono avviare una nuova discussione o un sottogruppo e approfondire quanto vogliono, mentre il gruppo mantiene il proprio obiettivo.
      * Il campo Contesto della discussione e la descrizione del gruppo permettono di definire rispettivamente l'ambito di una conversazione e quello di un gruppo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0b70d200637c265f:
    english: "## Pacing & Timing"
    translation: "## Ritmo e tempi"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d2b056c4b3edb54a:
    english: A productive conversation has a rhythm. The right beat comes from a complex combination of factors and often feels intuitive, like a musician improvising. When is the moment to go deeper, or pull back? When is it right to bring in new information, or further delve into what’s already on the table? This is pacing.
    translation: Una conversazione produttiva ha un ritmo. Trovare quello giusto dipende da molti fattori e spesso richiede intuito, come quando un musicista improvvisa. Quando è il momento di approfondire o di fare un passo indietro? Quando conviene introdurre nuove informazioni o esaminare meglio quelle già disponibili? Gestire queste scelte significa dare ritmo alla conversazione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d421940782402742:
    english: Different participants will have different needs and preferences — some will need reigning in, while others need pulling along. The right pace emerges when a creative tension between digging deeper and moving forward is found. When it’s off, people will feel frustrated — either impatient or left behind.
    translation: 'I partecipanti hanno esigenze e preferenze diverse: alcuni avranno bisogno di rallentare, altri di essere incoraggiati ad andare avanti. Il ritmo giusto nasce da un equilibrio tra approfondire e procedere. Quando manca, alcune persone diventano impazienti e altre faticano a tenere il passo.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7165c12910a2b3bb:
    english: |-
      * Because it’s asynchronous, people can read and respond at their own pace on Loomio, allowing a natural pace to emerge.
      * It’s possible to scroll right past people moving slowly and push for forward momentum, and simultaneously possible to continue digging into something slowly while others press forward. This is not possible in synchronous communication.
      * Proposal deadlines are a pace-setting tool. Topics that need to move quickly use shorter timeframes, and longer ones can have more time. Different decisions can go at different speeds.
      * It’s easy to modulate your own pace of engagement. If a conversation is moving too fast or slowly for you, you can drop your input and step back, and then return later when a proposal is raised.
      * It’s interesting to note how a “fast” decision on Loomio is 1 or 2 days, while a “fast” decision in person is more like 5 minutes. And yet, Loomio does not seem “slow”, the way taking 2 days to reach a decision in person would. Loomio runs decisions in parallel to other ongoing work, and it's much more efficient gathering everyone’s input on Loomio over 2 days versus having to schedule an in-person meeting.
      * Facilitation on Loomio could be likened to “bullet time” (when Neo can stop time and just walk around a bullet in the Matrix) — you can walk through a living conversation frame by frame. It’s like a superpower.
    translation: |-
      * Poiché Loomio è asincrono, le persone possono leggere e rispondere con i propri tempi. Questo permette alla conversazione di trovare un ritmo naturale.
      * Puoi scorrere oltre i contributi di chi procede lentamente e continuare a far avanzare la discussione. Allo stesso tempo, puoi approfondire con calma un punto mentre altri vanno avanti. Nella comunicazione sincrona questo non è possibile.
      * Le scadenze delle proposte aiutano a stabilire il ritmo. Le questioni urgenti possono avere scadenze più brevi; altre possono richiedere più tempo. Decisioni diverse possono procedere a velocità diverse.
      * Puoi regolare facilmente il ritmo della tua partecipazione. Se una conversazione procede troppo in fretta o troppo lentamente per te, puoi dare il tuo contributo, fare una pausa e tornare quando viene avviata una proposta.
      * Su Loomio una decisione «rapida» richiede uno o due giorni; di persona, potrebbe richiedere cinque minuti. Eppure Loomio non sembra lento come sembrerebbe una riunione di due giorni per prendere una decisione. Le decisioni procedono insieme alle altre attività, e raccogliere i contributi di tutti su Loomio nell'arco di due giorni può essere molto più efficiente che organizzare una riunione di persona.
      * Facilitare su Loomio può ricordare il «bullet time», quando Neo ferma il tempo e cammina intorno a un proiettile in Matrix: puoi osservare una conversazione in corso fotogramma per fotogramma. È quasi un superpotere.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  79fbcf8bb8520bf1:
    english: "## Managing the Attention Economy"
    translation: "## Gestire l'attenzione"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c71302b08c3b6394:
    english: A facilitator is a curator of attention. The information available can be literally infinite. It becomes critical to filter it in order to avoid becoming overwhelmed. Managing the attention economy means balancing importance against time and capacity.
    translation: Chi facilita aiuta a orientare l'attenzione. Le informazioni disponibili possono essere praticamente infinite, quindi è essenziale filtrarle per non esserne sopraffatti. Gestire l'attenzione significa trovare un equilibrio tra importanza, tempo e capacità del gruppo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  865afb1b25257bbd:
    english: Facilitation can help the group agree what the purpose and scope of a given discussion or process is, so they can have a rubric for prioritising attention. Limiting distractions and steering the conversation back on track are common interventions.
    translation: La facilitazione può aiutare il gruppo a concordare lo scopo e l'ambito di una discussione o di un processo. In questo modo, il gruppo ha criteri per decidere a cosa prestare attenzione. Limitare le distrazioni e riportare la conversazione sul tema sono interventi comuni.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3dd99b496718a570:
    english: Another important way facilitators work with attention is to insist on the group holding it long enough. When things get challenging, unclear, or uncomfortable, people to want to give up too soon, jump to another topic, or look away. A facilitator can help the group see things through, in service of their collective goals.
    translation: Un altro compito di chi facilita è aiutare il gruppo a mantenere l'attenzione abbastanza a lungo. Quando una questione diventa difficile, poco chiara o scomoda, può venire voglia di abbandonarla troppo presto, cambiare argomento o distogliere lo sguardo. Chi facilita può aiutare il gruppo a seguirla fino in fondo per raggiungere i propri obiettivi comuni.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  811f79cee2eed8c1:
    english: 'Structured processes and information sorting exercises are important facilitation tools in this area. Some examples:'
    translation: 'I processi strutturati e gli esercizi per organizzare le informazioni sono strumenti utili a questo scopo. Ecco alcuni esempi:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1254ab2b182bbd46:
    english: |-
      * **Time-boxing** — specifying a period of brainstorming, or conversation on a given topic.
      * **Agenda prioritisation** — listing everything people want to talk about and then picking to top items to focus on, before jumping into content.
      * **Post-it cloud** — generating a bunch of ideas or questions and grouping them thematically and then condensing them into topics.
      * **Parking lot** — a space to stick ideas or questions that come up that are not immediately relevant, to be addressed later.
      * **What does success look like??** Defining success criteria and keeping the group focused on it until those criteria are achieved.
    translation: |-
      * **Limiti di tempo** — stabilire un periodo per raccogliere idee o discutere un argomento.
      * **Priorità dell'ordine del giorno** — elencare tutto ciò di cui le persone vogliono parlare e scegliere gli argomenti principali prima di iniziare la discussione.
      * **Raggruppamento dei post-it** — raccogliere idee o domande, raggrupparle per tema e sintetizzarle in argomenti.
      * **Spazio per le questioni da riprendere** — annotare idee o domande che emergono ma non sono subito pertinenti, per affrontarle in seguito.
      * **Come riconosciamo il successo??** Definire criteri di successo e mantenere l'attenzione del gruppo su di essi finché non vengono soddisfatti.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  11cc1fd7daee10e8:
    english: |-
      * One of the most important attention management features in Loomio is topic-based discussion threading. There’s a reason why this format was one of the first to emerge in online communication decades ago, and continues to be used widely today: it’s a highly effective way to sort attention. Most Loomio users intuitively understand how to stay on topic when it’s listed in big letters at the top of the page.
      * Activity in Loomio is the currency of its attention economy, and everything that generates a notification spends that currency. The software has opinions about what should be considered “salient” activity that generates notifications (for example, comments, votes, and outcomes are, while a “like” on a comment is not), developed based on user feedback.
      * Users can exercise a lot of customised control over their Loomio attention economy through notification settings. Helping users set these preferences is an important tool to wisely using the attention economy of the group.
      * Subgroups can be a powerful tool to help people moderate their attention economy. If only some people need to pay attention, you can split it out.
      * The intentional but somewhat unpopular design decision to disallow concurrent proposals in Loomio is about the flow of attention — holding a group’s “feet to the fire” to fully process a proposal before moving on.
    translation: |-
      * Una delle funzioni più importanti di Loomio per gestire l'attenzione è l'organizzazione delle discussioni per argomento. Questo formato è nato agli inizi della comunicazione online ed è ancora molto usato perché aiuta a orientare l'attenzione. Quando l'argomento è ben visibile in cima alla pagina, per la maggior parte delle persone è naturale restare in tema.
      * Su Loomio, ogni attività che genera una notifica richiede attenzione. In base ai riscontri degli utenti, il software distingue le attività da segnalare, come commenti, voti e conclusioni, da quelle che non richiedono una notifica, come un «Mi piace» a un commento.
      * Le impostazioni delle notifiche permettono agli utenti di scegliere a quali attività dedicare attenzione. Aiutarli a configurare queste preferenze è un modo importante per gestire bene l'attenzione del gruppo.
      * I sottogruppi possono aiutare le persone a gestire la propria attenzione. Se una questione riguarda solo alcune persone, puoi affrontarla in un sottogruppo.
      * Loomio non consente di avere proposte contemporanee nella stessa discussione. Questa scelta, intenzionale ma non sempre apprezzata, aiuta il gruppo a dedicare piena attenzione a una proposta prima di passare alla successiva.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e522b56bbe8b16c9:
    english: "> Many designers of information systems incorrectly represented their design problem as information scarcity rather than attention scarcity, and as a result they built systems that excelled at providing more and more information to people, when what was really needed were systems that excelled at filtering out unimportant or irrelevant information. — **[Wikipedia](https://en.wikipedia.org/wiki/Attention_economy)**"
    translation: "> Molti progettisti di sistemi informativi hanno interpretato erroneamente il problema come scarsità di informazioni anziché di attenzione. Hanno quindi creato sistemi capaci di offrire sempre più informazioni, quando servivano sistemi capaci di filtrare quelle poco importanti o irrilevanti. — **[Wikipedia](https://en.wikipedia.org/wiki/Attention_economy)**"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  12f78aa04c29d66d:
    english: "## Facilitation Interventions"
    translation: "## Interventi di facilitazione"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  51065e352a92bf84:
    english: There are as many facilitation techniques as there are facilitators in the world, and entire libraries of books have been written on the topic. It’s not possible to provide a comprehensive list of interventions.
    translation: Esistono tante tecniche di facilitazione quante sono le persone che facilitano, e sull'argomento sono stati scritti moltissimi libri. Non è possibile elencare tutti gli interventi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1e23df53c3b816be:
    english: 'However, it might be useful to consider two categories of interventions:'
    translation: 'Può però essere utile distinguere due categorie di interventi:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d5738a06518b45da:
    english: |-
      1. **Supportive interventions**: inviting contribution, going deeper, drawing out, coaxing, nurturing, protecting, creating space.
      2. **Assertive interventions**: pulling back, shutting down, drawing lines, interrupting, challenging, steering on course, excluding bad behaviour.
    translation: |-
      1. **Interventi di sostegno**: invitare a contribuire, approfondire, far emergere le idee, incoraggiare, accompagnare, proteggere, creare spazio.
      2. **Interventi decisi**: fare un passo indietro, fermare un comportamento, stabilire limiti, interrompere, mettere in discussione, riportare sul percorso, escludere comportamenti inappropriati.
    status: machine
    provider: codex/gpt-6-sol
