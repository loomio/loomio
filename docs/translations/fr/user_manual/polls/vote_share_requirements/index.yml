  8f5779f2f1bb9ec3:
    english: Jamie uses the **Consent** proposal template, edits the Consent option, and enables its vote share requirement.
    translation: Jamie utilise le modèle de proposition **Consentement**, modifie l’option Consentement et active son exigence de répartition des votes.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  842038ffbd273e57:
    english: The cooperative's process requires at least 75 percent of eligible voters to support the proposal. Jamie sets the requirement to **At least 75% of Eligible voters**.
    translation: Le processus de la coopérative exige le soutien d’au moins 75 % des électeurs éligibles. Jamie définit l’exigence sur **Au moins 75 % des Électeurs éligibles**.
