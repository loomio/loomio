  980342866ab7bee6:
    english: An in-depth guide to applying key facilitation concepts in the online space.
    translation: מדריך מעמיק ליישום עקרונות מרכזיים של הנחיית קבוצות במרחב המקוון.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ac8728f5ce2ea8ce:
    english: Loomio is made by facilitators, and that plays a huge role in how it has been designed. This guide is about revealing more of that context, and translating facilitation concepts from the offline space to the online space.
    translation: Loomio נוצרה בידי מנחות ומנחים של קבוצות, והשפעתם על עיצובה רבה. המדריך מציג את הרקע הזה ומראה כיצד ליישם עקרונות של הנחיית קבוצות מהמרחב הפיזי במרחב המקוון.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e802660a44da1775:
    english: "## More about this guide"
    translation: "## עוד על המדריך"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5cbd64dba51ca485:
    english: Whether employed by a professional facilitator, people peer-facilitating each other, or a group that has no awareness of facilitation at all, Loomio’s essential function is to mediate and support group communication toward a desired outcome. In other words, facilitation.
    translation: בין אם משתמשים ב־Loomio בהנחיה מקצועית, בהנחיה הדדית בין חברי קבוצה או בקבוצה שאינה מכירה את תחום ההנחיה, תפקידה הבסיסי הוא לתווך את התקשורת בקבוצה ולסייע לה להגיע לתוצאה הרצויה. במילים אחרות, להנחות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  25a956280b647fa6:
    english: 'Loomio is *groupware*:'
    translation: 'Loomio היא *תוכנה לעבודה קבוצתית*:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  33e304be58a0a55b:
    english: "> Collaborative software, or groupware, is designed to help people involved in a common task achieve their goals. One of the earliest definitions of collaborative software is “intentional group processes plus software to support them.” -- Wikipedia"
    translation: "> תוכנה שיתופית, או תוכנה לעבודה קבוצתית, נועדה לעזור לאנשים שעוסקים במשימה משותפת להשיג את מטרותיהם. אחת ההגדרות המוקדמות לתוכנה שיתופית היא ״תהליכים קבוצתיים מכוונים ותוכנה התומכת בהם״. -- ויקיפדיה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  170a0b463e1ad8ca:
    english: There is a huge body of knowledge, best practice, and tradition in both in-person facilitation and online moderation, but the art and science of their intersection is only just emerging. This is the specific space where Loomio strives to excel.
    translation: קיים ידע רב על הנחיית קבוצות פנים אל פנים ועל ניהול שיח מקוון, לצד שיטות עבודה ומסורות בתחומים האלה. הידע על המפגש ביניהם עדיין מתפתח. זהו התחום שבו Loomio שואפת להצטיין.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
