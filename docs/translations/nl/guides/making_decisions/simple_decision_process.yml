---
navigation_title: Eenvoudig besluitvormingsproces
blocks:
  84ddd86a61d09414:
    english: "# Simple decision process"
    translation: "# Eenvoudig besluitvormingsproces"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2e868ae6bc4a493b:
    english: This guide describes an end-to-end process using a discussion, Sense check, final proposal, and outcome. For help with the fields and response options of one proposal, see [Proposals](/en/user_manual/polls/proposals/).
    translation: 'Deze gids beschrijft het hele proces: van een discussie en een gevoelscontrole tot een definitief voorstel en een conclusie. Meer informatie over de velden en antwoordopties van een voorstel vind je bij [Voorstellen](/en/user_manual/polls/proposals/).'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d9877680762afa22:
    english: Some organizations arrive at Loomio having already developed a deep culture and practice of collaborative decision making.  Such organizations have often written handbooks and codified their practices, however, most organizations are still on the journey and looking for some helpful first steps towards making better decisions together.  If the burning question in your organization is **how do we make decisions together?**, then this guide is for you.
    translation: Sommige organisaties gebruiken Loomio al vanuit een gevestigde praktijk van gezamenlijke besluitvorming. Zij hebben hun werkwijze vaak vastgelegd in handboeken. Veel andere organisaties zoeken nog naar eerste stappen om samen betere besluiten te nemen. Als jouw organisatie zich afvraagt **hoe nemen we samen besluiten?**, dan helpt deze gids je op weg.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6b321a0ba71f92b8:
    english: "***Here are three steps to help you co-create a better, more cohesive decision with less stress and anxiety.***"
    translation: "***Deze drie stappen helpen je samen tot een beter en samenhangender besluit te komen, met minder spanning en onzekerheid.***"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c46b32b56b933b0a:
    english: "## Simple decision making - in 3 steps"
    translation: "## Eenvoudige besluitvorming in 3 stappen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e3208a84f88ba36f:
    english: Good collaborative decisions rarely happen by themselves.  They almost always benefit from someone facilitating the discussion through to decision.  So when you launch a discussion thread, you take on a facilitation role (unless someone else is facilitating).
    translation: Goede gezamenlijke besluiten ontstaan zelden vanzelf. Het helpt bijna altijd als iemand de discussie naar een besluit begeleidt. Wanneer je een discussie begint, neem je die rol op je, tenzij iemand anders de begeleiding verzorgt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1a1da8788ddb01c7:
    english: Follow these 3 steps as you facilitate your group to make a good decision.
    translation: Volg deze 3 stappen om je groep naar een goed besluit te begeleiden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5b83a53a3f4caad5:
    english: |-
      ### Step 1 - Introduce and discuss
      Start a Loomio **discussion** to introduce the topic, open conversation and invite people. Include all the context-setting information your group needs to meaningfully participate, along with relevant background so everyone understands the purpose.
    translation: |-
      ### Stap 1 - Introduceer en bespreek
      Start een **discussie** in Loomio om het onderwerp te introduceren, het gesprek te openen en mensen uit te nodigen. Geef je groep de informatie en achtergrond die nodig zijn om mee te doen en het doel te begrijpen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8aab998cb04b8635:
    english: 'Be clear about your objective - what is the decision to be made or intended outcome of the discussion? '
    translation: 'Maak je doel duidelijk: welk besluit moet er worden genomen, of wat wil je met de discussie bereiken?'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d8f53cbae173f5ac:
    english: As the discussion progresses, create space for diverse input - sometimes the best ideas and input come from outside the box.  Work together to explore and test ideas, encouraging a healthy and open discussion.
    translation: Geef tijdens de discussie ruimte aan verschillende inzichten. De beste ideeën komen soms uit onverwachte hoek. Onderzoek en toets ideeën samen en moedig een open gesprek aan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7f447ab455f6cea4:
    english: 'Notice when the same voices are dominating and invite some of the quieter people to contribute by @mentioning them and asking them what they think. '
    translation: Let erop of steeds dezelfde mensen het woord voeren. Nodig ook stillere deelnemers uit door hen met @ te vermelden en te vragen wat zij denken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d4bad2b5207ac1d8:
    english: You can make a complex discussion easier to engage with by updating the context section with a summary of the key points.
    translation: Maak een ingewikkelde discussie toegankelijker door de belangrijkste punten samen te vatten in de contextsectie.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  daeddff561f62553:
    english: |-
      ### Step 2 - Sense check
      As your group begins to converge on path forwards, use a **Sense check** poll to survey opinions and test how the group feels.
    translation: |-
      ### Stap 2 - Gevoelscontrole
      Als je groep een mogelijke richting begint te zien, gebruik dan een peiling van het type **Gevoelscontrole** om meningen te verzamelen en te peilen hoe de groep erover denkt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c1d4e97ce180d85b:
    english: |-
      A ‘Sense check’ lets people know a proposal is forming and encourages them to engage.
      It can also be used to clarify an issue, even if the solution might not be apparent yet.
    translation: |-
      Een ‘Gevoelscontrole’ laat mensen weten dat er een voorstel in de maak is en nodigt hen uit om mee te doen.
      Je kunt er ook een kwestie mee verduidelijken als er nog geen oplossing in zicht is.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5ff914227bb8706a:
    english: Sense check is a great way to surface concerns before moving to a formal agreement.  You can find out if people are happy with where this is going, if they have questions or need more time, or if they are concerned.
    translation: Met een gevoelscontrole kun je zorgen naar voren brengen voordat je formele overeenstemming zoekt. Je ontdekt of mensen tevreden zijn met de richting, vragen hebben, meer tijd nodig hebben of zich zorgen maken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  01433544fefb70a5:
    english: 'Use feedback to improve and refine the proposal. If there’s still some work to do, you may need to go back to Step 1 and then run another Sense check round. '
    translation: Gebruik de reacties om het voorstel te verbeteren. Als er nog werk nodig is, ga dan terug naar stap 1 en houd daarna eventueel nog een gevoelscontrole.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  440474199fd76019:
    english: Good engagement will help you assess when you are ready to proceed to a proposal.
    translation: De reacties helpen je bepalen wanneer de groep klaar is voor een voorstel.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f3799fd76f9d9446:
    english: "### Step 3 - Proposal\nNow when you raise a formal **Proposal**, you do so with confidence that it will pass. "
    translation: |-
      ### Stap 3 - Voorstel
      Als je nu een formeel **Voorstel** start, weet je beter of het steun zal krijgen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a3e74110f5a3c7a2:
    english: There may have been a lot of discussion and variations suggested, so be specific about the decision being made, so that everyone knows what the voting options mean.
    translation: Er kunnen veel ideeën en varianten zijn besproken. Beschrijf daarom precies waarover de groep beslist, zodat iedereen weet wat de stemopties betekenen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b7581cfd1ecffd78:
    english: Set proposal deadlines consciously, so group members have time to consider and engage.  You can always extend the closing date if need be.
    translation: Kies een sluitingsdatum die groepsleden genoeg tijd geeft om het voorstel te overwegen en erop te reageren. Je kunt de datum zo nodig verlengen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b5bcc06f15cde560:
    english: This step is important to formalize agreement with people’s vote and to state an outcome - what just happened and what will happen next.
    translation: In deze stap leggen mensen met hun stem de overeenstemming vast. Daarna vermeld je in een conclusie wat er is gebeurd en wat de volgende stappen zijn.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c2f2bbcacfd77ab0:
    english: Proposal results are logged, along with a record of the discussion leading to the decision.
    translation: De stemresultaten worden vastgelegd, samen met de discussie die tot het besluit heeft geleid.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2d82209e751f2ffa:
    english: |-
      ### Outcome
      When a Loomio poll closes, you will be prompted to set an **outcome** to let everyone know what happened and what is going to happen next.
    translation: |-
      ### Conclusie
      Wanneer een peiling in Loomio sluit, krijg je de vraag een **conclusie** te schrijven. Zo laat je iedereen weten wat er is gebeurd en wat er daarna gaat gebeuren.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fb14b31115927d74:
    english: "## Proposals can help in many situations"
    translation: "## Voorstellen helpen in veel situaties"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c1a27b25e2c01ff3:
    english: 'Don''t hesitate to start a proposal just because you''re not sure everyone will agree - proposals are not only for when you have consensus, they''re designed to surface issues that need resolving and are useful for clarifying disagreements. '
    translation: Je kunt ook een voorstel starten als je niet zeker weet of iedereen het ermee eens zal zijn. Voorstellen helpen kwesties zichtbaar te maken die nog moeten worden opgelost en meningsverschillen te verduidelijken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6dbf0f3af984b8e8:
    english: The next pages show a few more complex processes for reaching decisions, through [advice](/en/guides/making_decisions/advice_process), [consent](/en/guides/making_decisions/consent_process ), or [consensus](/en/guides/making_decisions/consensus_process ).
    translation: 'De volgende pagina''s beschrijven een paar uitgebreidere manieren om tot een besluit te komen: via [advies](/en/guides/making_decisions/advice_process), [consent](/en/guides/making_decisions/consent_process ) of [consensus](/en/guides/making_decisions/consensus_process ).'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
