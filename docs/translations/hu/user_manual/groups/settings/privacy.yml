navigation_title: Adatvédelem
blocks:
  946f29d3bdb2e2af:
    english: "# Group privacy"
    translation: "# Csoportok adatvédelme"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6a2fbb3e7cecad6e:
    english: Privacy controls who can find a group and who can read its content. Open **Edit group settings** from the group page, then select **Privacy**.
    translation: Az adatvédelmi beállítások határozzák meg, ki találhatja meg a csoportot, és ki olvashatja a tartalmát. A csoport oldalán nyisd meg **A csoportbeállítások szerkesztése** lehetőséget, majd válaszd az **Adatvédelem** lehetőséget.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bf79bc420fc36377:
    english: "![Group privacy settings](group_privacy_settings.png#width-90)"
    translation: "![Csoport adatvédelmi beállításai](group_privacy_settings.png#width-90)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4d275c75fe1a2c77:
    english: Changing privacy can expose or hide existing group content, not only content created afterward. Choose the most restrictive setting that still supports the group's purpose.
    translation: Az adatvédelmi beállítás módosítása a csoport meglévő tartalmát is láthatóvá teheti vagy elrejtheti, nem csak az ezután létrehozott tartalmat. Válaszd a legszigorúbb beállítást, amely még megfelel a csoport céljának.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7510b0e8a0fcf7b3:
    english: "## Open"
    translation: "## Nyitva"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f202c6fba754adaa:
    english: Open groups are public spaces. Anyone can find the group and read its discussions, polls, and files. The member list remains visible only to members.
    translation: A nyitott csoportok nyilvánosak. Bárki megtalálhatja a csoportot, és elolvashatja a beszélgetéseit, szavazásait és fájljait. A tagok listáját továbbra is csak a tagok láthatják.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c8d2b41a601ed65e:
    english: Open groups can allow people to join immediately, require approval, or remain invitation only.
    translation: A nyitott csoportokhoz az emberek azonnal csatlakozhatnak, a csatlakozáshoz jóváhagyás lehet szükséges, vagy a tagság meghíváshoz köthető.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f07a1c59f30e5fea:
    english: "### Follow an Open group"
    translation: "### Nyitott csoport frissítéseinek követése"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d6f9ee2eb742720e:
    english: People can stay up to date with an Open group without joining. Following adds unread group activity to their catch-up email so they can review it in their own time. Followers do not become members, receive member voting rights, or receive immediate notifications just because they follow the group.
    translation: Az emberek csatlakozás nélkül is követhetik egy nyitott csoport tevékenységét. A követett csoport olvasatlan tevékenysége megjelenik a napi összefoglaló e-mailjükben, így akkor nézhetik át, amikor ráérnek. A követéstől nem válnak taggá, nem kapnak tagsághoz kötött szavazati jogot vagy azonnali értesítéseket.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  17cb84d9141c9728:
    english: Turn on **Follow updates** on the group page to include its unread discussions, comments, polls, and other thread activity in your catch-up. Turn the setting off to stop including the group.
    translation: Kapcsold be a **Frissítések követése** beállítást a csoport oldalán, hogy az olvasatlan beszélgetései, hozzászólásai, szavazásai és egyéb témabeli tevékenységei megjelenjenek az összefoglaló e-mailedben. Ha ezt nem szeretnéd, kapcsold ki a beállítást.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b0c06651e8c0df2b:
    english: "![Follow updates on an Open group](group_follow_updates.png)"
    translation: "![Frissítések követése egy nyitott csoportban](group_follow_updates.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c5becc4d01b10f3:
    english: "## Closed"
    translation: "## Zárva"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eaf6878c89438b53:
    english: Anyone can find a Closed group and read its name and description. Discussions, polls, files, and the member list are private to members and invited guests.
    translation: Bárki megtalálhatja a zárt csoportot, és elolvashatja a nevét és a leírását. A beszélgetéseket, szavazásokat, fájlokat és a tagok listáját csak a tagok és a meghívott vendégek láthatják.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ab7851d3b88d4e27:
    english: Closed groups can let people request membership or remain invitation only. They cannot let people join immediately without approval.
    translation: A zárt csoportokban az emberek kérhetik a tagságot, vagy a tagság meghíváshoz köthető. Jóváhagyás nélkül nem lehet azonnal csatlakozni hozzájuk.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e2f094fc6e490216:
    english: A Closed subgroup of a parent group can optionally allow members of the parent group to read its discussions without joining the subgroup.
    translation: Egy zárt alcsoport beállítható úgy, hogy a szülőcsoport tagjai az alcsoporthoz való csatlakozás nélkül is olvashassák a beszélgetéseit.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9c21e144af9492a6:
    english: "## Secret"
    translation: "## Titkos"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6a9871bdd7fde747:
    english: Secret groups and their content are visible only to people who have been invited or added. Membership is invitation only. Secret groups do not appear in the public group directory.
    translation: A titkos csoportokat és tartalmukat csak a meghívott vagy hozzáadott emberek láthatják. Csatlakozni csak meghívással lehet. A titkos csoportok nem jelennek meg a nyilvános csoportjegyzékben.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  405ac2846a65b06c:
    english: "## How people join"
    translation: "## Csatlakozás a csoporthoz"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c7aebb687bbffbf:
    english: 'Privacy determines which joining options are available:'
    translation: 'Az adatvédelmi beállítás határozza meg, mely csatlakozási lehetőségek érhetők el:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a6a7608fe4510b67:
    english: |-
      | Group privacy | Available joining options |
      | --- | --- |
      | **Open** | Anyone can join, request approval, or invitation only |
      | **Closed** | Request approval or invitation only |
      | **Secret** | Invitation only |
    translation: |-
      | Csoport adatvédelmi beállítása | Elérhető csatlakozási lehetőségek |
      | --- | --- |
      | **Nyitva** | Bárki csatlakozhat, jóváhagyást kérhet, vagy csak meghívással csatlakozhat |
      | **Zárva** | Jóváhagyás kérése vagy csatlakozás csak meghívással |
      | **Titkos** | Csatlakozás csak meghívással |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  473a620db15dff75:
    english: When approval is required, people select **Join group**, answer the group's joining prompt, and send a request to join. See [Inviting people](/en/user_manual/groups/inviting_people#request-to-join-group) for instructions on configuring the prompt, reviewing requests, and inviting people directly.
    translation: Ha jóváhagyás szükséges, az emberek kiválasztják a **Kapcsolódj a csoporthoz** lehetőséget, válaszolnak a csoport csatlakozási kérdésére, majd elküldik a csatlakozási kérelmüket. A kérdés beállításáról, a kérelmek elbírálásáról és az emberek közvetlen meghívásáról lásd a [Meghívás](/en/user_manual/groups/inviting_people#request-to-join-group) című részt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4c02de0d4580f7e6:
    english: "## Group directory"
    translation: "## Csoportjegyzék"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2dc848ec1af0064e:
    english: Open and Closed parent groups can be listed in the public group directory so people can discover them. Directory listing does not change who can read group content or become a member. Subgroups and Secret groups cannot be listed.
    translation: A nyitott és zárt szülőcsoportok megjelenhetnek a nyilvános csoportjegyzékben, így az emberek megtalálhatják őket. A jegyzékben való megjelenés nem változtat azon, ki olvashatja a csoport tartalmát, vagy ki válhat taggá. Az alcsoportok és a titkos csoportok nem jelenhetnek meg a jegyzékben.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
