---
navigation_title: Подготовка к встрече
blocks:
  165e9dec4d4660aa:
    english: "# Prepare for a meeting"
    translation: "# Подготовка к встрече"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5d14c790e0c05446:
    english: Effective meetings are productive, inclusive, and collaborative - they improve engagement, help build strong relationships, establish alignment, make better and faster decisions, promote inclusion, facilitate creative thinking and innovation, are a great channel for feedback and continuous improvement.
    translation: Эффективные встречи помогают участникам работать вместе, обсуждать важные вопросы и быстрее принимать решения. Они укрепляют отношения, дают возможность обменяться мнениями и находить новые идеи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c69f325003094ac5:
    english: Use Loomio to plan an effective meeting; involve people from the outset, align towards the most important topics, and make better use of your precious time together.
    translation: 'Используйте Loomio, чтобы подготовить встречу: вовлеките участников с самого начала, определите самые важные темы и проведите время вместе с пользой.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a30a32e8b06a9432:
    english: If the group is new to Loomio, begin with [Introducing Loomio to your group](/en/user_manual/overview/introducing_loomio), then use this meeting process as a practical first recurring workflow.
    translation: Если группа только начинает пользоваться Loomio, сначала прочитайте [Как познакомить группу с Loomio](/en/user_manual/overview/introducing_loomio), а затем используйте этот порядок подготовки встреч как первый регулярный процесс.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9a0eb26797e28e0f:
    english: There are several things you can do to make your next board or committee meeting effective...
    translation: Вот что поможет провести следующую встречу совета или комитета с пользой...
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c04e8fcfc9edb01c:
    english: |-
      - [Meeting focus and review actions](#meeting-focus-and-review-actions)
      - [Announce agenda and notify](#agenda-and-notify)
      - [Find a time for meeting](#find-a-time-for-meeting)
      - [Sign off minutes](#sign-off-minutes)
      - [Approve reports](#approve-reports)
    translation: |-
      - [Определите главные темы и проверьте выполнение задач](#meeting-focus-and-review-actions)
      - [Сообщите повестку и уведомите участников](#agenda-and-notify)
      - [Выберите время встречи](#find-a-time-for-meeting)
      - [Утвердите протокол](#sign-off-minutes)
      - [Утвердите отчёты](#approve-reports)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6e6785b547007644:
    english: "## Meeting focus and review actions"
    translation: "## Главные темы и проверка выполнения задач"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  26bf98782eb61549:
    english: 'Establish a focus for the meeting, so you spend your precious time together talking about the most important topics.  '
    translation: Определите главные темы встречи, чтобы уделить время самым важным вопросам.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c23fdd52f0a29b2c:
    english: Inviting members to contribute to the agenda helps everyone align, think about topics and energize for the meeting.
    translation: Предложите участникам дополнить повестку. Так каждый сможет заранее обдумать темы и подготовиться к встрече.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  52409f3ffabfb7d1:
    english: |-
      Actions:
      - focus the meeting on the most important things,
      - follow up and talk to members about actions from previous meetings.
    translation: |-
      Что сделать:
      - сосредоточьте встречу на самом важном,
      - узнайте, как продвигаются задачи с прошлых встреч, и обсудите их с участниками.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a52dd7ebb4619e46:
    english: |-
      ### On Loomio
      Use a Loomio **Discussion** to prepare for your meeting:
      * remind members about the meeting coming up,
      * invite comment about the most important things to focus on,
      * summarize actions from the previous meeting and ask for an update.
    translation: |-
      ### В Loomio
      Создайте **Обсуждение**, чтобы подготовиться к встрече:
      * напомните участникам о предстоящей встрече,
      * предложите обсудить самые важные вопросы,
      * перечислите задачи с прошлой встречи и попросите сообщить о ходе их выполнения.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5bcd10bb61edcc35:
    english: "## Agenda and notify"
    translation: "## Повестка и уведомление участников"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d9431846021bb8f3:
    english: Announce the meeting with a clear agenda. Attach papers, link to key documents and notify members.
    translation: Сообщите участникам о встрече и представьте понятную повестку. Прикрепите материалы, добавьте ссылки на важные документы и отправьте уведомление.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  41e84b882fa9bab1:
    english: This helps everyone prepare for the meeting, by reading the materials and thinking about topics of discussion and the decisions to be made.  Members are then more likely to arrive in context and ready for the meeting.
    translation: Так участники смогут прочитать материалы, обдумать темы обсуждения и предстоящие решения. На встрече им будет проще сразу перейти к делу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b6b0e7ed67711d5b:
    english: |-
      Actions:
      - prepare agenda, documents, materials and board papers,
      - notify members of meeting and send materials.
    translation: |-
      Что сделать:
      - подготовьте повестку, документы и другие материалы для встречи,
      - сообщите участникам о встрече и отправьте материалы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5b6d4a5158e41747:
    english: |-
      ### On Loomio
      Use a Loomio **Discussion** to prepare for your board meeting:
      * state details of meeting,
      * attach or link agenda, documents and other meeting materials,
      * invite members with a notification,
      * monitor 'Seen by' to see who has read the thread.
    translation: |-
      ### В Loomio
      Создайте **Обсуждение**, чтобы подготовить заседание совета:
      * укажите сведения о встрече,
      * прикрепите повестку, документы и другие материалы или добавьте ссылки на них,
      * пригласите участников с помощью уведомления,
      * проверяйте отметку «Виденный», чтобы узнать, кто прочитал тему.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f2c8f10394bf10c8:
    english: |-
      While similar to sending an email, a Loomio thread has advantages:
      - you can see who has read the thread, and remind those who haven't,
      - member replies or comments are visible to everyone who has permission to view the thread,
      - any discussion or questions about the agenda or meeting materials is held in a single place.
    translation: |-
      Тема в Loomio похожа на переписку по электронной почте, но даёт дополнительные возможности:
      - вы можете увидеть, кто прочитал тему, и напомнить остальным,
      - ответы и комментарии участников видны всем, у кого есть доступ к теме,
      - обсуждение повестки и материалов встречи остаётся в одном месте.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dd6d8cabe5f1810d:
    english: Members can find all the information about the meeting readily available in one place, thereby avoiding confusing email chains and losing important info in their email inbox.
    translation: Участники могут найти всю информацию о встрече в одном месте. Им не придётся искать важные сведения среди писем.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6a57d003a0bd5f07:
    english: |-
      ### Confirm
      Ask members to leave a comment confirming they have read the agenda and meeting papers and are prepared for the meeting. Use **Seen by** to identify anyone who may need a reminder.
    translation: |-
      ### Подтверждение
      Попросите участников оставить комментарий о том, что они прочитали повестку и материалы и готовы к встрече. По отметке **Виденный** определите, кому нужно напомнить об этом.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d08b0ae5712ef2d:
    english: "## Find a time for meeting\nFinding a time to meet can be a frequent headache for many administrators. "
    translation: |-
      ## Выбор времени встречи
      Подобрать удобное для всех время бывает непросто.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1da8fdf943571a19:
    english: |-
      ### On Loomio
      If you have not yet set a date and time for the meeting or you need to find a time for a future meeting, you can use **Time poll**.
    translation: |-
      ### В Loomio
      Если дата и время встречи ещё не назначены или вы планируете будущую встречу, создайте **Опрос времени**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f1c92e27dfd63153:
    english: Time poll makes it easy to see everyone's availability and find the best time, reducing time and energy needed for this common admin task.
    translation: Опрос времени помогает узнать, когда участники свободны, и выбрать наиболее удобное время. Это упрощает подготовку встречи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  45b90fd46cce4976:
    english: Members in different time zones will see dates and times localized in their time zone.
    translation: Участники в разных часовых поясах увидят даты и время в своём часовом поясе.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dc159c751f73d5d1:
    english: 'When the Time poll closes, choose the best time and send an outcome notification with a calendar invitation, so members can add the meeting to their calendar. '
    translation: Когда опрос времени закроется, выберите наиболее удобное время и отправьте уведомление с итоговым решением и приглашением в календарь. Участники смогут добавить встречу в свои календари.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4bafee41dd5f774c:
    english: "## Sign off minutes\nApproving or ratifying minutes is standard practice for formal meetings and good practice for all meetings.  "
    translation: |-
      ## Утверждение протокола
      Протоколы обычно утверждают на официальных заседаниях. Это полезно и для других встреч.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d9795ed92dabff7:
    english: 'Minutes provide a record of the meeting, key points raised during discussion, results of decisions and how people voted. They include the actions agreed and the person(s) responsible, and are often the starting point for the next meeting.  '
    translation: В протоколе фиксируют основные вопросы обсуждения, принятые решения и результаты голосования. В нём также указывают согласованные задачи и ответственных. Протокол часто становится отправной точкой для следующей встречи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1fd0d860cba070db:
    english: Minutes are valuable as a reminder for people present, helpful for those absent and a record to consult in case of conflict.
    translation: Протокол помогает присутствовавшим вспомнить договорённости, знакомит отсутствовавших с итогами встречи и служит записью, к которой можно обратиться при разногласиях.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  166796d872f35962:
    english: "### On Loomio"
    translation: "### В Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ef51b49480cb721a:
    english: Post the minutes in the Loomio meeting thread within a few days of the meeting and invite participants to approve.  This keeps the minutes relevant and fresh in member's minds and is a great way to remind members of their actions.  It also saves some time during your meeting.
    translation: Опубликуйте протокол в теме встречи в Loomio в течение нескольких дней и предложите участникам его утвердить. Пока встреча свежа в памяти, участникам проще проверить протокол и вспомнить о своих задачах. Это также сэкономит время на следующей встрече.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ea02d6cf3ede73dc:
    english: The example above uses a **Choose** poll with two options 'Accept' or 'Review'.
    translation: 'В примере выше используется голосование **Выбирать** с двумя вариантами: «Принять» и «Пересмотреть».'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  56c55da82e5ddeb7:
    english: 'When everyone has voted and the poll closes, state an outcome so everyone knows what has happened.  '
    translation: Когда все проголосуют и голосование закроется, опубликуйте итоговое решение, чтобы участники знали, чем завершилось голосование.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e8b710a05eb113dc:
    english: 'If your meeting practice requires formal acceptance at the next meeting, schedule an agenda item to acknowledge and confirm polls and decisions made on Loomio, and record this in the meeting minutes.  '
    translation: Если по правилам вашей группы требуется официально утвердить протокол на следующей встрече, добавьте в повестку подтверждение голосований и решений, принятых в Loomio. Зафиксируйте это в протоколе встречи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '06339a98b65ccc2c':
    english: For example; *"Does anyone wish to change their votes in Loomio?  If no, then let's resolve to formally approve polls made in Loomio during the last period."*
    translation: 'Например: *«Кто-нибудь хочет изменить свой голос в Loomio? Если нет, предлагаю официально утвердить результаты голосований, проведённых в Loomio с прошлой встречи».*'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f460b4ae218b375a:
    english: |-
      ## Approve reports
      Most meeting agendas include time for reports to be presented, discussed and approved; for example reports from the CEO, Financial, Operations, Health & Safety, and project reports.
    translation: |-
      ## Утверждение отчётов
      Во многих повестках предусмотрено представление, обсуждение и утверждение отчётов: например, отчётов руководителя, финансовых и операционных отчётов, отчётов по охране труда и проектам.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  00abfe283956509a:
    english: Reports are very important to help everyone get on the same page, however they can absorb valuable time in a meeting that may be used more effectively.
    translation: Отчёты помогают всем участникам получить общее представление о делах группы. Но их обсуждение может занять много времени встречи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  861200207a1e1dfb:
    english: Attach or link reports to your meeting **thread** and invite questions about the reports in advance of the meeting.
    translation: Прикрепите отчёты к **теме** встречи или добавьте ссылки на них. Предложите участникам задать вопросы до встречи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  11f124875e8a5945:
    english: Members receive and read the reports at a time and place that works for them.  As members read and think about the reports, they can comment, ask questions and see responses in Loomio.
    translation: Участники смогут прочитать отчёты в удобное для них время. По мере чтения они могут оставлять комментарии, задавать вопросы и видеть ответы в Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2871f1673d36999a:
    english: A question asked by one member is likely of interest to other members, so when someone replies to the question, their response  is visible to everyone in the Loomio group.
    translation: Вопрос одного участника может быть важен и для других. Когда кто-то ответит, ответ увидят все участники группы в Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  851a2a86a1047697:
    english: As members become familiar with discussing reports in Loomio, save a little more time by taking it a step further - seek approval of reports ahead of the meeting.
    translation: Когда участники привыкнут обсуждать отчёты в Loomio, предложите утверждать их до встречи. Это поможет сэкономить ещё немного времени.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
