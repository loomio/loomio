  b538bd1f65e69d28:
    english: This table shows how many threads, comments, polls, votes and reactions each user in the specified groups was responsible for during the time frame. Click specific headings in the table to sort the table by that column.
    translation: Esta tabla muestra cuántos hilos, comentarios, encuestas, votos y reacciones aportó cada persona de los grupos seleccionados durante el período indicado. Haz clic en los encabezados para ordenar los datos por columna.
    status: machine
