navigation_title: Ergebnis
blocks:
  c719d051fa2f700e:
    english: "# Score"
    translation: "# Ergebnis"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  517adc384b38d256:
    english: Score measures how participants evaluate each option on a shared numeric scale. Unlike Choose, it asks people to respond to every option, so the results show both what people prefer and how strongly they prefer it.
    translation: Mit Ergebnis bewerten Teilnehmende jede Option auf derselben Zahlenskala. Anders als bei Auswählen geben sie zu jeder Option eine Bewertung ab. So zeigen die Ergebnisse, welche Optionen sie bevorzugen und wie stark ihre Präferenz ist.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a678333f6d814e87:
    english: "## When to use Score"
    translation: "## Wann du Ergebnis verwenden kannst"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c4ca19abb53e3ddc:
    english: 'Use Score when every option can be evaluated independently against the same question. It works well for:'
    translation: 'Verwende Ergebnis, wenn sich jede Option unabhängig anhand derselben Frage bewerten lässt. Das eignet sich zum Beispiel dafür:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c77c1ad6b2a9d697:
    english: |-
      - assessing how ready each part of a project is;
      - rating the importance of several principles;
      - measuring interest in possible meeting topics;
      - evaluating grant applications against a common criterion; or
      - comparing the suitability of several proposals.
    translation: |-
      - einzuschätzen, wie weit die einzelnen Teile eines Projekts sind;
      - die Bedeutung mehrerer Grundsätze zu bewerten;
      - das Interesse an möglichen Besprechungsthemen zu messen;
      - Förderanträge nach einem gemeinsamen Kriterium zu bewerten; oder
      - die Eignung mehrerer Vorschläge zu vergleichen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d91459d96a31a671:
    english: Define what the bottom and top of the scale mean. A number without a shared definition can mean different things to different voters. Use [Choose](/en/user_manual/polls/choose/) when you only need selections, or [Allocate](/en/user_manual/polls/allocate/) when participants must make trade-offs within a limited budget.
    translation: Lege fest, was das untere und obere Ende der Skala bedeuten. Ohne gemeinsame Definition können Abstimmende dieselbe Zahl unterschiedlich verstehen. Verwende [Auswählen](/en/user_manual/polls/choose/), wenn du nur eine Auswahl brauchst, oder [Verteilen](/en/user_manual/polls/allocate/), wenn Teilnehmende ein begrenztes Budget aufteilen müssen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6160518dc06b70a7:
    english: "## Example: score possible trial locations"
    translation: "## Beispiel: Mögliche Teststandorte bewerten"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a75c387743cad529:
    english: Oatmilk Cooperative is choosing locations for a returnable-bottle trial. It asks members to score four locations from 0 (**unsuitable**) to 10 (**ideal**), considering customer access, staff capacity, storage, and collection transport.
    translation: Die Hafermilch-Genossenschaft sucht Standorte für einen Test mit Mehrwegflaschen. Sie bittet ihre Mitglieder, vier Standorte auf einer Skala von 0 (**ungeeignet**) bis 10 (**ideal**) zu bewerten. Dabei sollen sie die Erreichbarkeit für Kundinnen und Kunden, die Kapazität des Personals, die Lagerung und den Transport der gesammelten Flaschen berücksichtigen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c74ebb16f872b3c6:
    english: "## Set up the poll"
    translation: "## Umfrage einrichten"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b03122ee279f9c91:
    english: State one question that applies equally to every option. Add the items to be assessed, set the **Minimum score** and **Maximum score**, and explain the endpoints in the details. Option meanings can clarify the scope of each item.
    translation: Formuliere eine Frage, die für jede Option gleichermaßen gilt. Füge die zu bewertenden Punkte hinzu, lege das **Minimale Ergebnis** und das **Maximale Ergebnis** fest und erkläre die Endpunkte in den Details. Mit einer Beschreibung der Optionen kannst du verdeutlichen, was jeweils dazugehört.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  85e66520acf78264:
    english: Choose a scale participants can apply consistently. A 0–5 scale is quick to use; a 0–10 scale allows finer distinctions. More precision does not necessarily produce better information, so use the shortest scale that fits the question.
    translation: Wähle eine Skala, die Teilnehmende einheitlich anwenden können. Eine Skala von 0 bis 5 ist schnell zu verwenden. Eine Skala von 0 bis 10 erlaubt feinere Abstufungen. Mehr Abstufungen liefern nicht unbedingt bessere Informationen. Wähle daher die kürzeste Skala, die zur Frage passt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bb3998655598796f:
    english: Anonymous voting and showing options in random order can be useful when you want to reduce social or ordering effects.
    translation: Anonyme Stimmabgabe und eine zufällige Reihenfolge der Optionen können helfen, soziale Einflüsse und Reihenfolgeeffekte zu verringern.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Abstimmen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  33199814c9ad8a64:
    english: Participants move a slider to score every option. In this example, the voter scores Central Station cafe at 8, Riverside market at 6, the University food court at 7, and Harbour offices at 5.
    translation: Teilnehmende bewerten jede Option mit einem Schieberegler. In diesem Beispiel gibt eine abstimmende Person dem Café am Hauptbahnhof 8 Punkte, dem Markt am Fluss 6, der Mensa der Universität 7 und den Büros am Hafen 5.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fba3d21a09846414:
    english: The reason explains how the voter applied the scale. This helps the group distinguish a low score caused by missing information from one caused by substantive concern.
    translation: Die Begründung erklärt, wie die abstimmende Person die Skala angewendet hat. So kann die Gruppe erkennen, ob eine niedrige Bewertung auf fehlenden Informationen oder auf inhaltlichen Bedenken beruht.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Ergebnisse lesen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  846b7759f9d54232:
    english: 'For each option, the results show:'
    translation: 'Für jede Option zeigen die Ergebnisse:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cac30fa54f0aeaf7:
    english: |-
      - **Points**: the sum of all scores;
      - **Mean**: the average score; and
      - **Voters**: how many people scored the option.
    translation: |-
      - **Punkte**: die Summe aller Bewertungen;
      - **Bedeuten**: die durchschnittliche Bewertung; und
      - **Wähler*innen**: wie viele Personen die Option bewertet haben.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7e063d4b1babcb9e:
    english: In this example, **Central Station cafe** has the highest mean at 7.5. **Harbour offices** has the lowest mean at 5.25, while Riverside market and the University food court are tied at 7. Four of five invited people have voted, so the group can also see that one response is outstanding.
    translation: In diesem Beispiel hat das **Café am Hauptbahnhof** mit 7,5 den höchsten Durchschnitt. Die **Büros am Hafen** haben mit 5,25 den niedrigsten. Der Markt am Fluss und die Mensa der Universität liegen mit jeweils 7 gleichauf. Vier von fünf eingeladenen Personen haben abgestimmt. Die Gruppe sieht also auch, dass noch eine Antwort aussteht.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  147800d3643d9942:
    english: Compare means only when the options have a similar number of voters. Read the vote reasons before treating a small difference as meaningful, and publish an outcome explaining what action follows from the scores.
    translation: Vergleiche Durchschnittswerte nur, wenn die Optionen von ähnlich vielen Personen bewertet wurden. Lies die Begründungen, bevor du kleine Unterschiede als bedeutsam einstufst. Veröffentliche anschließend ein Fazit, das erklärt, welche Schritte aus den Bewertungen folgen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
