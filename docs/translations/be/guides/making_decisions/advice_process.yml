  aa1feddec315ed04:
    english: Seek advice on a decision you need to make.
    translation: Звярніцеся па парады перад прыняццем рашэння.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  abd59b5e28c00123:
    english: Make a decision with the advice of people impacted or who have expertise, so you can make a better decision for your organization.
    translation: Улічыце парады людзей, якіх закране рашэнне, і тых, хто мае адпаведныя веды. Гэта дапаможа прыняць лепшае рашэнне для вашай арганізацыі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fce0c96bcc92d0aa:
    english: "> *“With the advice process, any person can make any decision but must seek advice from affected parties and people with expertise.” - Frederick Laloux, Reinventing Organizations.*"
    translation: "> *«У працэсе кансультавання любы чалавек можа прыняць любое рашэнне, але перад гэтым трэба звярнуцца па парады да тых, каго яно закране, і да людзей з адпаведнымі ведамі». — Фрэдэрык Лалу, «Reinventing Organizations».*"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  66f32f2b3cf56e0d:
    english: |-
      ## Key points
      - Freedom to make a decision.
      - Invite people to offer their advice.
      - Take into account other people’s voices.
    translation: |-
      ## Асноўныя прынцыпы
      - Свабода прымаць рашэнні.
      - Запрашэнне людзей падзяліцца парадамі.
      - Улік меркаванняў іншых людзей.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  54d4f1ac3c2bd91f:
    english: |-
      ## Steps in the Advice process
      You notice a problem or opportunity and take the initiative.
      1. Frame the decision, identify who owns it, and invite the affected people and relevant experts.
      2. Start a Loomio **discussion** and, when a structured response or deadline is useful, run an **Advice proposal**.
      3. Clarify and build on the advice through vote reasons and discussion comments.
      4. Make the decision, then publish an **outcome** explaining what was decided and how the advice informed it.
    translation: |-
      ## Крокі працэсу кансультавання
      Вы заўважаеце праблему або магчымасць і бераце на сябе ініцыятыву.
      1. Вызначце, якое рашэнне трэба прыняць і хто за яго адказвае. Запрасіце людзей, якіх яно закране, і спецыялістаў з адпаведнымі ведамі.
      2. Пачніце **абмеркаванне** ў Loomio. Калі патрэбныя адказы ў пэўным фармаце або тэрмін, запусціце **прапанову для кансультавання**.
      3. Удакладняйце парады і развівайце іх праз абгрунтаванні галасоў і каментарыі ў абмеркаванні.
      4. Прыміце рашэнне і апублікуйце **выснову**: растлумачце, што было вырашана і як парады паўплывалі на рашэнне.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6088bbd1e12e8920:
    english: "## Benefits\n- Advice helps you make a better decision for your organization. \n- Foster relationships, learning opportunities and diverse input.\n- Stimulate initiative and creativity, and more enjoyable work."
    translation: "## Перавагі\n- Парады дапамагаюць прыняць лепшае рашэнне для вашай арганізацыі. \n- Працэс умацоўвае адносіны, дае магчымасць вучыцца і пачуць розныя меркаванні.\n- Ён заахвочвае ініцыятыву і творчасць, а праца становіцца больш прыемнай."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0b6fc6b802feebda:
    english: "## Applying the Advice process on Loomio"
    translation: "## Як выкарыстоўваць працэс кансультавання ў Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a0a3c706db8ca405:
    english: "| **Advice process** | **On Loomio** |\n|---|---|\n| You notice a problem or opportunity and take the initiative. |  |\n| Seek input to sound out perspectives before proposing action. | Start a Loomio **discussion** to provide context and open conversation. Run an **[Advice proposal](/en/user_manual/polls/proposals/advice/)** when you want a defined response period, vote reasons, and a clear record of who participated. |\n| Taking advice received into account, you make a decision and inform the people who have given advice. | Add an an **outcome** to the discussion thread.   <br /><br />State the decision made and thank people for their advice and feedback.  <br /><br />   Say what will happen next and notify people about the outcome.  <br /><br />The outcome statement is an important record of the decision for future reference. <br /> <br /> Either update the context to include this outcome, or state it in a comment you pin to the timeline to quickly find it in the future.<br /><br/> |        "
    translation: |-
      | **Працэс кансультавання** | **У Loomio** |
      |---|---|
      | Вы заўважаеце праблему або магчымасць і бераце на сябе ініцыятыву. |  |
      | Перш чым прапанаваць дзеянне, даведайцеся пра меркаванні іншых людзей. | Пачніце **абмеркаванне** ў Loomio: апішыце сітуацыю і запрасіце людзей да размовы. Запусціце **[прапанову для кансультавання](/en/user_manual/polls/proposals/advice/)**, калі патрэбныя тэрмін для адказаў, абгрунтаванні галасоў і выразны запіс пра тое, хто ўдзельнічаў. |
      | Улічыўшы атрыманыя парады, прыміце рашэнне і паведаміце пра яго людзям, якія далі парады. | Дадайце **выснову** ў нітку абмеркавання.   <br /><br />Сфармулюйце рашэнне і падзякуйце людзям за парады і водгукі.  <br /><br />   Раскажыце, што будзе далей, і паведаміце людзям пра выснову.  <br /><br />Тэкст высновы захоўвае рашэнне, каб да яго можна было звярнуцца пазней. <br /> <br /> Дадайце выснову ў апісанне сітуацыі або выкладзіце яе ў каментарыі, замацаваным у храналогіі, каб яе было лёгка знайсці.<br /><br/> |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f303a5de08c09a87:
    english: "## Example of an Advice process on Loomio"
    translation: "## Прыклад працэсу кансультавання ў Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  12055e74d3733a99:
    english: "### Step 0 - You notice a problem or opportunity and take the initiative."
    translation: "### Крок 0 — Вы заўважаеце праблему або магчымасць і бераце на сябе ініцыятыву."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  77f49576383e36ca:
    english: Is the problem or opportunity is worth pursuing?  Takashi is experiencing problems with his old computer, and it crashed during a recent presentation.
    translation: Ці варта заняцца гэтай праблемай або магчымасцю?  У Такасі ўзнікаюць праблемы са старым камп’ютарам. Падчас нядаўняй прэзентацыі камп’ютар перастаў працаваць.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  997d519afbb87519:
    english: Is there a decision to be made?  It's time to replace the computer.
    translation: Ці трэба прыняць рашэнне?  Прыйшоў час замяніць камп’ютар.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fea51a2c49fc3f27:
    english: Does it impact other people and your organization?  Takashi's colleagues want him to perform his role effectively, not waste time in meetings, and so appreciate he needs a working computer.  Purchase of a piece of equipment also impacts on the organization budget, purchasing policies and may need to be aligned with other team members.
    translation: Ці закране гэта іншых людзей і вашу арганізацыю?  Калегі Такасі хочуць, каб ён мог добра выконваць сваю працу і не губляў час на сустрэчах. Яны разумеюць, што яму патрэбны спраўны камп’ютар. Купля абсталявання таксама ўплывае на бюджэт арганізацыі, павінна адпавядаць правілам закупак і, магчыма, патрабуе ўзгаднення з іншымі членамі каманды.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  93da70b78b1d57ff:
    english: "### Step 1. Seek input to sound out perspectives before proposing action"
    translation: "### Крок 1. Даведайцеся пра меркаванні іншых людзей, перш чым прапанаваць дзеянне"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  105886bcb6f7807b:
    english: Takashi starts a Loomio discussion with a clear statement of the decision he needs to make.  He provides some context to open a discussion, that he is starting an advice process.
    translation: Такасі пачынае абмеркаванне ў Loomio і ясна апісвае рашэнне, якое яму трэба прыняць. Ён тлумачыць сітуацыю і паведамляе, што пачынае працэс кансультавання.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5dbbbc9ad1569679:
    english: He can also run an [Advice proposal](/en/user_manual/polls/proposals/advice/) in the discussion to request structured responses by a closing date.
    translation: Таксама ён можа запусціць у абмеркаванні [прапанову для кансультавання](/en/user_manual/polls/proposals/advice/), каб атрымаць адказы ў пэўным фармаце да даты закрыцця.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1c0ef4c1e9221705:
    english: "### Step 2.  Clarify and strengthen the advice through discussion"
    translation: "### Крок 2.  Удакладніце і дапоўніце парады праз абмеркаванне"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ed50411e67d1df0a:
    english: Takashi replies to advice given in comments in the discussion thread, clarifying his situation and asking questions to expand on the advice given.
    translation: Такасі адказвае на парады ў каментарыях ніткі абмеркавання, тлумачыць сваю сітуацыю і задае пытанні, каб даведацца больш.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b27279b9ea3b1f0a:
    english: As people offer advice and comments, Takashi grows resolved in his decision.
    translation: Парады і каментарыі дапамагаюць Такасі вызначыцца з рашэннем.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f3a820171554b2c9:
    english: "### Step 3. Make a decision with advice and inform people"
    translation: "### Крок 3. Прыміце рашэнне з улікам парад і паведаміце пра яго людзям"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8a0d4bfcbc87c5bb:
    english: When everyone has offered advice, or the proposal closes, Takashi makes a decision and states the **[outcome](/en/user_manual/polls/outcomes/)**.
    translation: Калі ўсе ахвотныя падзеляцца парадамі або прапанова закрыецца, Такасі прымае рашэнне і публікуе **[выснову](/en/user_manual/polls/outcomes/)**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e638fad69da59644:
    english: The outcome is a clear statement of the decision made and what will happen next. It  becomes an important record for the organization.
    translation: У выснове ясна сфармулявана рашэнне і апісана, што будзе далей. Яна захоўвае важны запіс для арганізацыі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  05eae3956cc1a84d:
    english: Takashi edits the discussion context to include this outcome.
    translation: Такасі рэдагуе апісанне сітуацыі ў абмеркаванні і дадае туды выснову.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5289a72f0eed9bd9:
    english: Alternatively, he could state it in a comment that he pins to the thread, so the outcome appears prominently in the discussion timeline.
    translation: Таксама ён можа выкласці выснову ў каментарыі і замацаваць яго ў нітцы, каб яе было добра відаць у храналогіі абмеркавання.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
