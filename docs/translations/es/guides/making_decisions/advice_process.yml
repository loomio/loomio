  a0a3c706db8ca405:
    english: "| **Advice process** | **On Loomio** |\n|---|---|\n| You notice a problem or opportunity and take the initiative. |  |\n| Seek input to sound out perspectives before proposing action. | Start a Loomio **discussion** to provide context and open conversation. Run an **[Advice proposal](/en/user_manual/polls/proposals/advice/)** when you want a defined response period, vote reasons, and a clear record of who participated. |\n| Taking advice received into account, you make a decision and inform the people who have given advice. | Add an an **outcome** to the discussion thread.   <br /><br />State the decision made and thank people for their advice and feedback.  <br /><br />   Say what will happen next and notify people about the outcome.  <br /><br />The outcome statement is an important record of the decision for future reference. <br /> <br /> Either update the context to include this outcome, or state it in a comment you pin to the timeline to quickly find it in the future.<br /><br/> |        "
    translation: |-
      | **Proceso de asesoramiento** | **En Loomio** |
      |---|---|
      | Detectas un problema o una oportunidad y tomas la iniciativa. |  |
      | Pide opiniones para conocer distintas perspectivas antes de proponer una acción. | Inicia una **discusión** en Loomio para aportar contexto y abrir la conversación. Abre una **[propuesta de asesoramiento](/en/user_manual/polls/proposals/advice/)** si quieres fijar un plazo para responder, recoger los motivos de los votos y dejar constancia de quién participó. |
      | Tienes en cuenta los consejos recibidos, tomas una decisión e informas a quienes te aconsejaron. | Añade una **conclusión** al hilo de discusión.   <br /><br />Explica la decisión y agradece los consejos y comentarios recibidos.  <br /><br />   Indica qué ocurrirá después y notifica la conclusión a las personas participantes.  <br /><br />La conclusión deja constancia de la decisión para futuras consultas. <br /> <br /> Inclúyela en el contexto o escríbela en un comentario que fijes en la cronología para encontrarla fácilmente más adelante.<br /><br/> |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
