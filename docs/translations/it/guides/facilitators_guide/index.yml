  e19d687b56819302:
    english: Hi! I'm Alanna.
    translation: Ciao, sono Alanna.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  10352ad196487ff3:
    english: I'm one of the founders of Loomio, and I've been thinking deeply about how it works from a facilitation perspective since the beginning. I am not a seminal facilitation expert; I consider myself only a beginner in this craft that one could spend a lifetime honing.
    translation: 'Sono una delle fondatrici di Loomio e fin dall''inizio rifletto su come funziona dal punto di vista della facilitazione. Non sono un''autorità in questo campo: mi considero ancora agli inizi di una pratica che si può perfezionare per tutta la vita.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c637c96f9723f02d:
    english: What I can offer is help translating between the offline and online spaces, as a practitioner in both. I've facilitated a lot of groups who use Loomio, and learned from their experiences.
    translation: Posso aiutare a trasferire le pratiche di facilitazione dagli incontri di persona agli spazi online, perché lavoro in entrambi gli ambiti. Ho facilitato molti gruppi che usano Loomio e ho imparato dalle loro esperienze.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c376e38821fb6c2f:
    english: You can find out [more about me on my website](http://alanna.space).
    translation: Puoi trovare [altre informazioni su di me nel mio sito](http://alanna.space).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b893957534fa37e2:
    english: I'm only one person, with one perspective and approach to facilitation, when there are myriad approaches. I've tried to bring in a couple other facilitator's voices here, including [Rich](http://richdecibels.com/) from Loomio and Silvia from [EXP](http://exp.agency).
    translation: Sono una sola persona, con un mio punto di vista e un mio approccio alla facilitazione, tra i molti possibili. Ho cercato di includere qui anche le voci di altre persone che si occupano di facilitazione, tra cui [Rich](http://richdecibels.com/) di Loomio e Silvia di [EXP](http://exp.agency).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
