---
navigation_title: Anonyymi äänestys
blocks:
  b4e842083054a400:
    english: "# Anonymous voting"
    translation: "# Anonyymi äänestys"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9b5c46644a952388:
    english: Anonymous voting, also known as blind voting, separates the record of who has voted from the votes themselves. Poll coordinators can see who was eligible and, once at least three people have voted, verify participation. Application users cannot connect a submitted vote with the person who submitted it.
    translation: Anonyymissä äänestyksessä tieto siitä, kuka on äänestänyt, säilytetään erillään annetuista äänistä. Kyselyn koordinaattorit näkevät, ketkä olivat äänioikeutettuja. Kun vähintään kolme henkilöä on äänestänyt, he voivat myös tarkistaa, ketkä osallistuivat. Sovelluksen käyttäjät eivät voi yhdistää annettua ääntä sen antajaan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  105abff68025f002:
    english: This page explains the protections provided by anonymous voting, the information that is retained, and the limits of the guarantee.
    translation: Tällä sivulla kerrotaan, miten anonyymi äänestys suojaa äänestäjiä, mitä tietoja säilytetään ja missä suojan rajat kulkevat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6d97c8b835a3f1f2:
    english: "## How anonymous voting protects voters"
    translation: "## Miten anonyymi äänestys suojaa äänestäjiä"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e01d5c77096b953e:
    english: 'An anonymous poll keeps two separate sets of records:'
    translation: 'Anonyymissä kyselyssä säilytetään kahta erillistä tietojoukkoa:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  757ab56b1165a71d:
    english: |-
      | Participation records | Submitted votes |
      | --- | --- |
      | Who is eligible to vote | The selected options or scores |
      | Who was invited, and by whom | The poll the vote belongs to |
      | Whether each eligible person has voted | No name or user account |
      | No selected options or scores | No link to a participation record |
    translation: |-
      | Osallistumistiedot | Annetut äänet |
      | --- | --- |
      | Ketkä ovat äänioikeutettuja | Valitut vaihtoehdot tai annetut pisteet |
      | Ketkä kutsuttiin ja kuka heidät kutsui | Kysely, johon ääni kuuluu |
      | Onko kukin äänioikeutettu äänestänyt | Ei nimeä eikä käyttäjätiliä |
      | Ei valittuja vaihtoehtoja eikä annettuja pisteitä | Ei yhteyttä osallistumistietoihin |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b908c49acc827932:
    english: There is no shared identifier that connects these records. Submitted votes also omit the actual submission time, invitation information, written reasons, attachments, and other metadata that could help identify a voter.
    translation: Näillä tiedoilla ei ole yhteistä tunnistetta, jonka avulla ne voisi yhdistää. Annettuihin ääniin ei myöskään tallenneta tarkkaa lähetysaikaa, kutsutietoja, kirjallisia perusteluja, liitteitä tai muita tietoja, jotka voisivat auttaa tunnistamaan äänestäjän.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6430a3d863d135b6:
    english: This separation is enforced when the vote is stored. It does not depend only on hiding names in the interface.
    translation: Tiedot pidetään erillään jo ääntä tallennettaessa. Suoja ei perustu pelkästään siihen, että nimet piilotetaan käyttöliittymässä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b8e31aef3d559f28:
    english: "## While voting is open"
    translation: "## Äänestyksen ollessa käynnissä"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f905c85734898a41:
    english: Results remain hidden from everyone until the poll closes. This includes poll coordinators, group administrators, and instance administrators using the application.
    translation: Tulokset pysyvät piilossa kaikilta, kunnes kysely sulkeutuu. Tämä koskee myös kyselyn koordinaattoreita, ryhmän ylläpitäjiä ja sovellusta käyttäviä palvelun ylläpitäjiä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  828df5247b61c9e6:
    english: 'When someone votes:'
    translation: 'Kun joku äänestää:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  69b471d43b2148a1:
    english: |-
      - their submitted vote is stored without their name or participation record;
      - their participation record is marked to show that they have voted;
      - no vote event, notification, email, comment, or activity entry is created;
      - no copy of their selections is returned after submission; and
      - the interface confirms only that their vote was recorded.
    translation: |-
      - annettu ääni tallennetaan ilman äänestäjän nimeä tai yhteyttä hänen osallistumistietoihinsa;
      - osallistumistietoihin merkitään, että hän on äänestänyt;
      - äänestä ei luoda tapahtumaa, ilmoitusta, sähköpostia, kommenttia eikä merkintää toimintalokiin;
      - hänen valinnoistaan ei palauteta kopiota lähettämisen jälkeen; ja
      - käyttöliittymä vahvistaa vain, että ääni tallennettiin.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4ffe4b38db135dab:
    english: The participation record does not store a precise time for when the person voted. Submitted votes are not ordered by submission time.
    translation: Osallistumistietoihin ei tallenneta tarkkaa äänestysaikaa. Annettuja ääniä ei järjestetä lähetysajan mukaan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7acaf6b48fc42105:
    english: "## Votes cannot be changed"
    translation: "## Annettua ääntä ei voi muuttaa"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  996ef90a3eee857b:
    english: Each eligible person can vote once. A submitted anonymous vote cannot be reviewed, changed, withdrawn, or replaced, including by a coordinator or administrator.
    translation: Jokainen äänioikeutettu voi äänestää kerran. Annettua anonyymiä ääntä ei voi tarkastella, muuttaa, perua eikä korvata. Tämä koskee myös koordinaattoreita ja ylläpitäjiä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  58f0aaa6a45c1d37:
    english: Allowing a person to retrieve or replace their vote would require a persistent link between that person and the vote. Anonymous voting deliberately does not create that link.
    translation: Jotta henkilö voisi hakea tai korvata äänensä, hänen ja äänen välillä pitäisi säilyttää pysyvä yhteys. Anonyymissä äänestyksessä tällaista yhteyttä ei luoda.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2fd2c9d6ab0d6f68:
    english: Review your selections carefully before submitting.
    translation: Tarkista valintasi huolellisesti ennen äänen lähettämistä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  59f83c0e359484c4:
    english: "## Why anonymous votes do not have reasons"
    translation: "## Miksi anonyymeihin ääniin ei voi lisätä perusteluja"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  89f9d9a1d4bcb395:
    english: New anonymous votes cannot include a written reason or an attachment. Reasons can contain names, personal details, writing patterns, mentions, or other information that identifies the voter. They would also make individual votes easier to distinguish from the aggregate result.
    translation: Uuteen anonyymiin ääneen ei voi lisätä kirjallista perustelua tai liitettä. Perustelu voi sisältää nimiä, henkilötietoja, tunnistettavan kirjoitustyylin, mainintoja tai muita tietoja, joista äänestäjän voi tunnistaa. Perustelut voisivat myös helpottaa yksittäisten äänten erottamista yhteistuloksesta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  932f88aa929fb4eb:
    english: Participants can still discuss the poll in its thread where discussion is available. Those comments are ordinary named discussion contributions and are not attached to an anonymous vote.
    translation: Osallistujat voivat edelleen keskustella kyselystä sen keskusteluketjussa, jos keskustelu on käytettävissä. Nämä kommentit ovat tavallisia, kirjoittajan nimellä näkyviä keskusteluviestejä. Niitä ei liitetä anonyymiin ääneen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1b21c2826270bd52:
    english: "## Results and exports"
    translation: "## Tulokset ja viennit"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  afc45e50b74e075b:
    english: After the poll closes, the results are calculated from the detached votes and displayed as totals and other aggregate results supported by the poll type.
    translation: Kun kysely sulkeutuu, tulokset lasketaan erillään tallennetuista äänistä. Ne näytetään kokonaismäärinä ja muina kyselytyypin tukemina yhteistuloksina.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b28c82ffcb4ffeb5:
    english: The application does not publish vote identifiers, submission order, or submission times. Poll exports contain aggregate results rather than a row for each anonymous vote, except that a closed STV election can be exported in BLT format. A BLT export contains the candidate rankings needed to recount the election, grouped when multiple ballots have the same ranking, without voter identities or ballot metadata.
    translation: Sovellus ei julkaise äänten tunnisteita, lähetysjärjestystä eikä lähetysaikoja. Kyselyn vientitiedostot sisältävät yhteistulokset, eivät erillistä riviä jokaisesta anonyymistä äänestä. Suljetusta STV-vaalista voi kuitenkin viedä BLT-tiedoston. Se sisältää vaalin uudelleenlaskentaan tarvittavat ehdokkaiden paremmuusjärjestykset. Saman järjestyksen sisältävät äänestysliput ryhmitellään. Tiedosto ei sisällä äänestäjien henkilöllisyyksiä eikä äänestyslippujen metatietoja.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8088fc78d955e9bb:
    english: An anonymous poll cannot be reopened after it closes.
    translation: Anonyymiä kyselyä ei voi avata uudelleen sen sulkeuduttua.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c368b542923cd542:
    english: "## Participation verification"
    translation: "## Osallistumisen tarkistaminen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ab086d63c01514bf:
    english: Poll coordinators can view the named participation records. These always show who was eligible. Once at least three people have voted, they also show whether each person voted, but never show how anyone voted. If a poll closes with fewer than three votes, the participation status remains hidden.
    translation: Kyselyn koordinaattorit voivat tarkastella nimettyjä osallistumistietoja. Niistä näkyy aina, ketkä olivat äänioikeutettuja. Kun vähintään kolme henkilöä on äänestänyt, tiedoista näkyy myös, onko kukin henkilö äänestänyt. Niistä ei koskaan näy, miten kukaan äänesti. Jos kysely sulkeutuu alle kolmen annetun äänen jälkeen, tieto osallistumisesta pysyy piilossa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dcad5d728e5e7cfd:
    english: Other participants cannot view this named participation information. Access to poll results does not grant access to the participation records.
    translation: Muut osallistujat eivät voi tarkastella nimettyjä osallistumistietoja. Oikeus nähdä kyselyn tulokset ei anna oikeutta nähdä osallistumistietoja.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  37cf06402ac47fa2:
    english: |-
      Coordinators can add eligible people while voting remains open, including after
      other people have voted. Existing voters cannot be removed from an anonymous
      poll.
    translation: |-
      Koordinaattorit voivat lisätä äänioikeutettuja äänestyksen ollessa käynnissä, myös sen jälkeen kun
      muut ovat äänestäneet. Jo äänestäneitä henkilöitä ei voi poistaa anonyymistä
      kyselystä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  705e9b807681f6c1:
    english: "## Reminders"
    translation: "## Muistutukset"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8ef8b501a1b27f63:
    english: For an anonymous poll lasting at least 24 hours, eligible people who have not voted receive one automatic reminder during the final 24 hours.
    translation: Jos anonyymi kysely kestää vähintään 24 tuntia, äänioikeutetut, jotka eivät ole äänestäneet, saavat yhden automaattisen muistutuksen viimeisen 24 tunnin aikana.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b23e579a8ef628de:
    english: The reminder is selected from participation records only. It does not inspect submitted votes or create a connection to them. If the deadline changes, the hourly reminder check uses the current deadline without maintaining a separate scheduled reminder for the poll.
    translation: Muistutuksen saajat valitaan vain osallistumistietojen perusteella. Annettuja ääniä ei tarkastella eikä niihin luoda yhteyttä. Jos määräaika muuttuu, tunneittain tehtävä muistutustarkistus käyttää senhetkistä määräaikaa. Kyselylle ei ylläpidetä erillistä ajastettua muistutusta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  053ce04ce5f98ed8:
    english: Polls with a total voting period of less than 24 hours do not send this automatic reminder.
    translation: Automaattista muistutusta ei lähetetä, jos kyselyn koko äänestysaika on alle 24 tuntia.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fb1f13e60fe178fe:
    english: "## What coordinators and administrators can see"
    translation: "## Mitä koordinaattorit ja ylläpitäjät voivat nähdä"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e59c22e94231a746:
    english: 'Through the application, a poll coordinator, group administrator, or instance administrator may be able to see:'
    translation: 'Kyselyn koordinaattori, ryhmän ylläpitäjä tai palvelun ylläpitäjä voi roolinsa mukaan nähdä sovelluksessa:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2da6b1feaa8b36f1:
    english: |-
      - the poll and its eligible voters;
      - whether each eligible person has voted, where their role permits access and at least three people have voted; and
      - aggregate results after the poll closes.
    translation: |-
      - kyselyn ja sen äänioikeutetut;
      - onko kukin äänioikeutettu äänestänyt, jos hänen roolinsa antaa siihen oikeuden ja vähintään kolme henkilöä on äänestänyt; ja
      - yhteistulokset kyselyn sulkeuduttua.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6a96a87699625dc6:
    english: 'They cannot use application features to see:'
    translation: 'Sovelluksen toiminnoilla he eivät voi nähdä:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dd4756253d1ee6dc:
    english: |-
      - which selections belong to a person;
      - individual votes or voting patterns;
      - when a particular vote was submitted; or
      - a reason, attachment, event, or notification associated with a submitted vote.
    translation: |-
      - mitkä valinnat kuuluvat tietylle henkilölle;
      - yksittäisiä ääniä tai äänestysmalleja;
      - milloin tietty ääni lähetettiin; tai
      - annettuun ääneen liittyvää perustelua, liitettä, tapahtumaa tai ilmoitusta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c350875c33492237:
    english: "## Limits of anonymous voting"
    translation: "## Anonyymin äänestyksen rajat"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  48d04d7b4817e710:
    english: These protections prevent application users from linking a submitted vote to its voter. They are not a cryptographic protection against an operator who can inspect the database, backups, server logs, process memory, network traffic, or a modified version of the application.
    translation: Nämä suojaukset estävät sovelluksen käyttäjiä yhdistämästä annettua ääntä sen antajaan. Ne eivät tarjoa kryptografista suojaa järjestelmän ylläpitäjältä, joka voi tarkastella tietokantaa, varmuuskopioita, palvelinlokeja, prosessimuistia, verkkoliikennettä tai sovelluksen muokattua versiota.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f901f505362e46b4:
    english: The result itself may also reveal information. A small electorate, a unanimous result, a distinctive combination of selections, or information shared outside the poll can make a person's choices easier to infer. Voters may also choose to identify themselves in discussion outside their submitted vote.
    translation: Myös tulos voi paljastaa tietoja. Jos äänioikeutettuja on vähän, tulos on yksimielinen tai valintojen yhdistelmä on erottuva, henkilön valintoja voi olla helpompi päätellä. Sama koskee kyselyn ulkopuolella jaettuja tietoja. Äänestäjä voi myös itse kertoa, miten äänesti, kyselyn ulkopuolisessa keskustelussa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dfe97db86db52d15:
    english: Consider the size of the electorate and the sensitivity of the decision when deciding whether application-level anonymous voting is suitable.
    translation: Harkitse äänestäjien määrää ja päätöksen arkaluonteisuutta, kun arvioit, sopiiko sovelluksen tarjoama anonyymi äänestäminen tilanteeseen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  60cc6f1a0163ec5d:
    english: "## Questions"
    translation: "## Kysymyksiä"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  57615f2c4c040dce:
    english: "### Can a coordinator see how I voted?"
    translation: "### Voiko koordinaattori nähdä, miten äänestin?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9dc1d151cc90e94e:
    english: No. Once at least three people have voted, a coordinator can verify whether you voted but cannot connect you with a submitted vote through the application. Below that threshold, your participation status remains hidden.
    translation: Ei. Kun vähintään kolme henkilöä on äänestänyt, koordinaattori voi tarkistaa, oletko äänestänyt. Hän ei kuitenkaan voi yhdistää sinua antamaasi ääneen sovelluksen kautta. Jos ääniä on vähemmän kuin kolme, tieto osallistumisestasi pysyy piilossa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b3b382d2575b715d:
    english: "### Can I see my vote after submitting it?"
    translation: "### Voinko nähdä ääneni lähettämisen jälkeen?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  52aaaa1c764d5745:
    english: No. The application confirms that your vote was recorded, then discards the selections from the voting interface. It cannot retrieve your vote without creating the link that anonymous voting is designed to avoid.
    translation: Et. Sovellus vahvistaa, että äänesi tallennettiin, ja poistaa sitten valintasi äänestysnäkymästä. Sovellus ei voi hakea ääntäsi luomatta yhteyttä, jonka anonyymi äänestäminen on tarkoitettu välttämään.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  071dd89d6eb38ebf:
    english: "### Can I change or withdraw my vote?"
    translation: "### Voinko muuttaa ääntäni tai perua sen?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '059b75c51b4225ab':
    english: No. There is no link that would let the application identify which submitted vote to change or remove.
    translation: Et. Sovelluksella ei ole yhteyttä, jonka avulla se voisi tunnistaa muutettavan tai poistettavan äänen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c94077837455425f:
    english: "### Will I receive an email confirming my vote?"
    translation: "### Saanko sähköpostivahvistuksen äänestämisestäni?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f36a8b43a3fdee36:
    english: No. Voting creates only the on-screen acknowledgement and updates your participation record. It does not send a confirmation email or create a notification or activity event.
    translation: Et. Äänestäminen näyttää vain vahvistuksen näytöllä ja päivittää osallistumistietosi. Se ei lähetä vahvistussähköpostia eikä luo ilmoitusta tai tapahtumaa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f320754cf7ee77bc:
    english: "### Does a public poll reveal more information?"
    translation: "### Paljastaako julkinen äänestys enemmän tietoa?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f84121f0c18e03ab:
    english: Public access may allow people to see the poll and its aggregate results after it closes. It does not expose the named participation records or individual anonymous votes.
    translation: Julkisen äänestyksen ja sen koottujen tulosten katselu voi olla mahdollista äänestyksen päätyttyä. Nimetyt osallistumistiedot ja yksittäiset anonyymit äänet eivät tule näkyviin.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e2dbe0c181f865ca:
    english: "### Is anonymous voting suitable for every election?"
    translation: "### Sopiiko anonyymi äänestäminen kaikkiin vaaleihin?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  05fc871619a2170d:
    english: No. It provides application-level separation between identities and votes. Decisions requiring protection from system operators or independently verifiable cryptographic elections need a system designed for those requirements.
    translation: Ei. Se erottaa äänestäjien henkilöllisyydet äänistä sovelluksessa. Jos päätös edellyttää suojaa järjestelmän ylläpitäjiä vastaan tai itsenäisesti todennettavaa kryptografista vaalia, tarvitset näihin vaatimuksiin suunnitellun järjestelmän.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
