  4bf082d10976bc31:
    english: 'Governance board members are invited to vote and approve the Brand Concept.  The board has previously agreed that proposals like this require >75% of members to vote Agree for it to pass. '
    translation: 理事会のメンバーに投票を呼びかけ、ブランド案の承認を求めます。理事会は、この種の提案の可決にはメンバーの75%を超える人が「同意する」に投票する必要があると、あらかじめ決めています。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  feb488e50bdd3834:
    english: This template includes a Block option by default. Block isn't suitable for every group — it can be controversial or misused. If you don't use block in your decision-making process, we recommend editing the template to remove it.
    translation: このテンプレートには、標準で「ブロック」の選択肢が含まれています。ブロックは、意見の対立を招いたり、不適切に使われたりする可能性があり、すべてのグループに適しているわけではありません。意思決定にブロックを使わない場合は、テンプレートを編集して削除することをお勧めします。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5130a17b3032bee3:
