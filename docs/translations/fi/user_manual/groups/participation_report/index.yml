  0d23c0831f1ea6ca:
    english: 'You''re able to choose which groups to include in the report, the start and end date for the report, and the interval (year, month, week or day) for grouping results. '
    translation: Voit valita raporttiin sisällytettävät ryhmät, alku- ja loppupäivän sekä aikavälin, jonka mukaan tulokset ryhmitellään (vuosi, kuukausi, viikko tai päivä).
