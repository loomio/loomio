  a1b7f7b282933a3c:
    english: 'You must be an admin of the group to export it. The JSON export includes:'
    translation: 'Vous devez être administrateur du groupe pour l’exporter. L’exportation JSON comprend :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6a0b307d50fa35cf:
    english: |-
      - The group, its members and membership requests
      - Threads, comments, reactions, tags, templates, notifications and related records from the included groups
      - Polls, options, votes and outcomes; an anonymous poll is included only after it has closed
      - Subgroups you belong to
      - Open and closed subgroups when you export their parent group as a parent group admin, even if you do not belong to those subgroups
      - References to files and images attached to the included content
    translation: |-
      - Le groupe, ses membres et les demandes d’adhésion
      - Les discussions, commentaires, réactions, étiquettes, modèles, notifications et données associées des groupes inclus
      - Les sondages, options, votes et conclusions ; un sondage anonyme n’est inclus qu’après sa clôture
      - Les sous-groupes dont vous faites partie
      - Les sous-groupes ouverts et fermés lorsque vous exportez leur groupe parent en tant qu’administrateur de ce groupe, même si vous ne faites pas partie de ces sous-groupes
      - Les références aux fichiers et images joints au contenu inclus
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4dee92f966ec24c9:
    english: 'The JSON export does not include:'
    translation: 'L’exportation JSON ne comprend pas :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a40deeed41d9937e:
    english: |-
      - Secret subgroups you do not belong to, including their membership and content
      - Subgroups awaiting deletion
      - Anonymous polls that have not closed
      - Direct threads and polls that do not belong to the group
    translation: |-
      - Les sous-groupes secrets dont vous ne faites pas partie, ainsi que leurs membres et leur contenu
      - Les sous-groupes en attente de suppression
      - Les sondages anonymes qui ne sont pas encore clos
      - Les discussions et sondages directs qui n’appartiennent pas au groupe
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
