  ced10eda436a40ca:
    english: "## How people use Loomio"
    translation: "## Mire használják a Loomiót"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4198817a2724ad0a:
    english: "**Member organizations** to involve members in decisions at scale. Political parties, consumer and worker co-operatives, and membership associations use Loomio to facilitate a safe, inclusive space for members to share information and raise topics, participate in important decisions and vote in General Assembly. Streamline decision processes, improve transparency and accountability, document discussions and record decisions, and include members' voices to organize for action."
    translation: "**Tagságon alapuló szervezetek** a tagok bevonására használják a Loomiót, akár nagy létszám mellett is. Politikai pártok, fogyasztói és dolgozói szövetkezetek, valamint egyesületek olyan teret teremtenek vele, ahol a tagok biztonságosan megoszthatják az információkat, témákat vethetnek fel, részt vehetnek a fontos döntésekben és szavazhatnak a közgyűlésen. Egyszerűsíthetik a döntési folyamatokat, átláthatóbbá tehetik a működést, dokumentálhatják a beszélgetéseket és a döntéseket, és a tagok véleményét is bevonhatják a közös cselekvés megszervezésébe."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7b2fd1306e05f4e3:
    english: "**Self-managing organizations** to involve staff in decisions. Self-managing teams, worker co-operatives, and sociocratic organisations use Loomio to run consent, consensus, and advice-based decision processes across distributed teams and time zones. Tap into collective intelligence, distribute decision making, build governance and policy together, and document decisions and discussion."
    translation: "**Önszerveződő szervezetek** a munkatársak bevonására használják a Loomiót. Önszerveződő csapatok, dolgozói szövetkezetek és szociokratikus szervezetek beleegyezésen, konszenzuson és tanácskérésen alapuló döntési folyamatokat folytathatnak vele, akkor is, ha tagjaik különböző helyeken és időzónákban dolgoznak. Hasznosíthatják a közös tudást, megoszthatják a döntéshozatalt, együtt alakíthatják ki az irányítási elveket és szabályzatokat, valamint dokumentálhatják a döntéseket és a beszélgetéseket."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  75d7266c562f65c2:
    english: "**Boards, councils, and distributed networks** to involve stakeholders in decisions. Create a safe space for discussion, keep track of communications, and coordinate across geographies and time zones. Structure decision making processes, improve agility and response times, and preserve organizational memory."
    translation: "**Igazgatóságok, tanácsok és több helyszínen működő hálózatok** az érintettek bevonására használják a Loomiót. Biztonságos teret hozhatnak létre a beszélgetésekhez, követhetik a kommunikációt, és összehangolhatják a munkát különböző helyszínek és időzónák között. Rendezettebbé tehetik a döntési folyamatokat, gyorsabban reagálhatnak, és megőrizhetik a szervezet közös emlékezetét."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cbe5ae77738f2704:
    english: "**Residential communities and co-ops** to make decisions together as neighbours. Cohousing communities, ecovillages, coliving cooperatives, housing co-ops, and land trusts use Loomio to replace or augment traditional strata and property management with democratic governance. Residents shape decisions about shared land, common spaces, and community agreements, and asynchronous discussion means members can fully participate whether they're on-site or away travelling, keeping a clear record of how the community has chosen to live together."
    translation: "**Lakóközösségek és lakásszövetkezetek** a szomszédok közös döntéseihez használják a Loomiót. Közösségi lakhatási csoportok, ökofalvak, együttélésre épülő szövetkezetek, lakásszövetkezetek és közösségi földtulajdont kezelő szervezetek a hagyományos ingatlanüzemeltetést demokratikus döntéshozatallal egészíthetik ki vagy válthatják fel. A lakók közösen alakíthatják a földhasználatról, a közös terekről és az együttélés szabályairól szóló döntéseket. Mivel a beszélgetésekhez nem kell egyszerre jelen lenni, a tagok akkor is teljes értékűen részt vehetnek bennük, ha éppen máshol tartózkodnak. A döntések nyomán világos feljegyzés marad arról, hogyan szeretne együtt élni a közösség."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb1039083c952286:
    english: Loomio builds a living record of your organization; the decisions made, who was involved and the discussion leading up to the decision.
    translation: A Loomio folyamatosan bővülő nyilvántartást készít a szervezeted döntéseiről, a résztvevőkről és a döntésekhez vezető beszélgetésekről.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
