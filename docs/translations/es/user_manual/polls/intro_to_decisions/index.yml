  ff07fce3bab705aa:
    english: Proposals and polls collect structured responses from a group. They can help test an idea, make a decision, identify priorities, schedule a meeting, or elect representatives.
    translation: Las propuestas y los sondeos recogen respuestas estructuradas de un grupo. Sirven para poner a prueba una idea, tomar una decisión, identificar prioridades, programar una reunión o elegir representantes.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f031d2644fee2a91:
    english: "## Find the right help"
    translation: "## Encuentra la ayuda que necesitas"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  34039c79ea769793:
    english: 'These parts of the manual answer different questions:'
    translation: 'Estas secciones del manual responden a distintas preguntas:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  34ea9d58ccbf80fb:
    english: |-
      | If you want to… | Read… |
      |---|---|
      | Choose what participants should express | [Proposals](../proposals/) or [Polls](../proposal_types/) |
      | Run a specific proposal template | [Sense check](../proposals/sense_check/), [Advice](../proposals/advice/), [Consent](../proposals/consent/), or [Consensus](../proposals/consensus/) |
      | Configure the templates available to a group | [Poll templates](../poll_templates/) |
      | Facilitate a decision from discussion to outcome | [Making decisions](/en/guides/making_decisions/) |
    translation: |-
      | Si quieres… | Lee… |
      |---|---|
      | Elegir qué deben expresar las personas participantes | [Propuestas](../proposals/) o [Sondeos](../proposal_types/) |
      | Usar una plantilla de propuesta concreta | [Consulta inicial](../proposals/sense_check/), [Asesoramiento](../proposals/advice/), [Consentimiento](../proposals/consent/) o [Consenso](../proposals/consensus/) |
      | Configurar las plantillas disponibles para un grupo | [Plantillas de sondeo](../poll_templates/) |
      | Facilitar una decisión desde la discusión hasta la conclusión | [Tomar decisiones](/en/guides/making_decisions/) |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7eddb057cca077f4:
    english: A **voting method** defines how people respond and how results are calculated. A **poll template** is a reusable configuration built on a voting method, with preset instructions, options, and settings. A **decision process** may use a discussion and several templates before the group reaches an outcome.
    translation: Un **método de votación** define cómo responde la gente y cómo se calculan los resultados. Una **plantilla de sondeo** es una configuración reutilizable basada en un método de votación, con instrucciones, opciones y ajustes predefinidos. Un **proceso de decisión** puede incluir una discusión y varias plantillas antes de que el grupo llegue a una conclusión.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3cd46aa2f1240e88:
    english: "## Proposals"
    translation: "## Propuestas"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  85a55fccaf4e4032:
    english: 'A proposal asks people to respond to a statement or course of action. Loomio includes templates for common purposes:'
    translation: 'Una propuesta pide a la gente que responda a una afirmación o un plan de acción. Loomio incluye plantillas para distintos fines:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  51bf1ffa7d057d9e:
    english: |-
      - [Sense check](../proposals/sense_check/) gathers early reactions;
      - [Advice](../proposals/advice/) gathers input for a decision maker;
      - [Consent](../proposals/consent/) tests for meaningful objections; and
      - [Consensus](../proposals/consensus/) seeks collective agreement.
    translation: |-
      - [Consulta inicial](../proposals/sense_check/) recoge las primeras reacciones;
      - [Asesoramiento](../proposals/advice/) recoge aportaciones para quien toma la decisión;
      - [Consentimiento](../proposals/consent/) comprueba si hay objeciones importantes; y
      - [Consenso](../proposals/consensus/) busca un acuerdo colectivo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d01e9f85fcd2d9c2:
    english: See [Proposals](../proposals/) to compare them.
    translation: Consulta [Propuestas](../proposals/) para compararlas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  821dcd89b5460804:
    english: "## Polls"
    translation: "## Sondeos"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ec746235c7fe89c4:
    english: 'Use a poll when participants need to select, score, allocate, rank, state their availability, or cast an election ballot:'
    translation: 'Usa un sondeo cuando las personas participantes necesiten elegir, puntuar, distribuir puntos, ordenar preferencias, indicar su disponibilidad o votar en una elección:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b93f9fe9611d9205:
    english: |-
      - [Choose](../choose/) finds popular options;
      - [Score](../score/) evaluates every option on a scale;
      - [Allocate](../allocate/) distributes a limited budget of points;
      - [Rank](../rank/) finds an overall order of preference;
      - [Time poll](../meeting_polls/) finds when people are available; and
      - [STV Election](../stv/) elects multiple winners proportionally.
    translation: |-
      - [Elegir](../choose/) identifica las opciones más populares;
      - [Puntuar](../score/) evalúa cada opción en una escala;
      - [Distribuir](../allocate/) reparte una cantidad limitada de puntos;
      - [Ordenar](../rank/) establece un orden general de preferencias;
      - [Sondeo de horarios](../meeting_polls/) identifica cuándo está disponible la gente; y
      - [Elección por voto único transferible](../stv/) elige a varios representantes de forma proporcional.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9972b34ccc3ea79b:
    english: See [Polls](../proposal_types/) to compare them.
    translation: Consulta [Sondeos](../proposal_types/) para compararlos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5890626db6dcbb68:
    english: "## Start a proposal or poll"
    translation: "## Inicia una propuesta o un sondeo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4b5338cae269fd32:
    english: "### Choose whether to use a discussion"
    translation: "### Decide si quieres usar una discusión"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c45fe8ff31f71486:
    english: Start the proposal or poll inside a discussion when people need context, questions, or conversation before responding. A discussion can contain several proposals over time, keeping amendments and the eventual outcome together as one record of the topic.
    translation: Inicia la propuesta o el sondeo dentro de una discusión cuando la gente necesite contexto, hacer preguntas o conversar antes de responder. Una discusión puede contener varias propuestas a lo largo del tiempo. Así, las modificaciones y la conclusión final quedan reunidas en un mismo registro del tema.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0bb2a90f8f9dad0c:
    english: Run a standalone poll when the discussion has already happened elsewhere, such as at a meeting, or when the question is simple and you only need to collect responses. Include enough detail or a link to the relevant record so voters understand what they are responding to.
    translation: Crea un sondeo independiente si la discusión ya tuvo lugar en otro sitio, por ejemplo, en una reunión, o si la pregunta es sencilla y solo necesitas recoger respuestas. Incluye suficientes detalles o un enlace al registro correspondiente para que quienes voten sepan a qué están respondiendo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7d50445f0c54190d:
    english: "### In a discussion"
    translation: "### Dentro de una discusión"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  05e03f7ee0e1b4dc:
    english: Open the discussion, scroll to the reply area, select **Start a vote**, and choose a template.
    translation: Abre la discusión, desplázate hasta el área de respuestas, selecciona **Iniciar una votación** y elige una plantilla.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  55dc0481a5c4ecb6:
    english: "### Without a discussion"
    translation: "### Sin una discusión"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  af5fd115de5f7aec:
    english: Open the **Polls** tab on the group page, select **New poll**, and choose a template.
    translation: Abre la pestaña **Sondeos** en la página del grupo, selecciona **Nuevo sondeo** y elige una plantilla.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  23479ea263004d4a:
    english: If you create a discussion and poll at the same time only to run a vote, avoid notifying people twice. Start the discussion without notifying them and use the poll invitation, or run the poll without a discussion.
    translation: Si creas una discusión y un sondeo al mismo tiempo solo para celebrar una votación, evita enviar dos notificaciones a la gente. Inicia la discusión sin notificarla y usa la invitación del sondeo, o crea el sondeo sin una discusión.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  31f857d230319a3c:
    english: "## What happens next"
    translation: "## Qué ocurre después"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb709a76dfeabd4f:
    english: When starting a proposal or poll, you provide a title and details, review its response options and settings, set a closing time, and invite participants. While it is open, participants can vote, explain their response, and change their vote. Results update as votes are submitted, subject to the poll's result-visibility setting.
    translation: Al iniciar una propuesta o un sondeo, añades un título y los detalles, revisas las opciones de respuesta y los ajustes, estableces una hora de cierre e invitas a las personas participantes. Mientras está abierto, pueden votar, explicar su respuesta y cambiar su voto. Los resultados se actualizan a medida que se emiten los votos, según el ajuste de visibilidad de los resultados del sondeo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  acd2e813b56034a0:
    english: When it closes, publish an [outcome](../outcomes/) that records what the result means and what will happen next.
    translation: Cuando se cierre, publica una [conclusión](../outcomes/) que explique qué significa el resultado y qué ocurrirá después.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
