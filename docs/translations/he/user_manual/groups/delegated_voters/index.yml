  9cfb3b7835dc5cb0:
    english: If some members of your group should have voting rights while others should not, you can use the "Make delegate" feature to identify those people with voting rights. There is a corresponding "Revoke delegate" action too.
    translation: אם רק לחלק מחברי הקבוצה צריכה להיות זכות הצבעה, ניתן לסמן אותם באמצעות הפעולה "לעשות נציג". ניתן גם להסיר את המינוי באמצעות "בטל נציג".
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e017eafb51368777:
    english: Use delegates when people should share the same discussion space but only a defined set, such as directors or elected representatives, may vote. This is usually simpler than maintaining a second subgroup whose only purpose is to separate voters from non-voters.
    translation: כדאי להשתמש בנציגים כאשר כולם צריכים להשתתף באותם דיונים, אך רק קבוצה מוגדרת, כגון חברי הנהלה או נציגים נבחרים, רשאית להצביע. בדרך כלל זה פשוט יותר מניהול תת־קבוצה נוספת שמטרתה היחידה היא להפריד בין בעלי זכות הצבעה לשאר החברים.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1942a47ae47ca813:
    english: Use a private subgroup instead when its members also need discussions, files, or membership information that other members must not see.
    translation: אם החברים האלה צריכים גם דיונים, קבצים או פרטי חברות שאסור לשאר החברים לראות, יש להשתמש בתת־קבוצה פרטית.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3346f757dc7bcd14:
    english: "![Make delegate action in a member's menu](member_make_delegate.png)"
    translation: "![הפעולה לעשות נציג בתפריט של חבר קבוצה](member_make_delegate.png)"
    status: machine
