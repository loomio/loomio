---
navigation_title: Anoniem stemmen
blocks:
  b4e842083054a400:
    english: "# Anonymous voting"
    translation: "# Anoniem stemmen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9b5c46644a952388:
    english: Anonymous voting, also known as blind voting, separates the record of who has voted from the votes themselves. Poll coordinators can see who was eligible and, once at least three people have voted, verify participation. Application users cannot connect a submitted vote with the person who submitted it.
    translation: Bij anoniem stemmen, ook wel blind stemmen genoemd, worden de gegevens over wie heeft gestemd gescheiden van de stemmen zelf. Coördinatoren van een peiling kunnen zien wie mocht stemmen en, zodra minstens drie mensen hebben gestemd, controleren wie heeft deelgenomen. Gebruikers van de applicatie kunnen een uitgebrachte stem niet koppelen aan de persoon die deze heeft uitgebracht.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  105abff68025f002:
    english: This page explains the protections provided by anonymous voting, the information that is retained, and the limits of the guarantee.
    translation: Deze pagina legt uit hoe anoniem stemmen kiezers beschermt, welke gegevens bewaard blijven en waar de grenzen van die bescherming liggen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6d97c8b835a3f1f2:
    english: "## How anonymous voting protects voters"
    translation: "## Hoe anoniem stemmen kiezers beschermt"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e01d5c77096b953e:
    english: 'An anonymous poll keeps two separate sets of records:'
    translation: 'Een anonieme peiling bewaart twee afzonderlijke soorten gegevens:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  757ab56b1165a71d:
    english: |-
      | Participation records | Submitted votes |
      | --- | --- |
      | Who is eligible to vote | The selected options or scores |
      | Who was invited, and by whom | The poll the vote belongs to |
      | Whether each eligible person has voted | No name or user account |
      | No selected options or scores | No link to a participation record |
    translation: |-
      | Deelnamegegevens | Uitgebrachte stemmen |
      | --- | --- |
      | Wie mag stemmen | De gekozen opties of scores |
      | Wie is uitgenodigd en door wie | Bij welke peiling de stem hoort |
      | Of elke stemgerechtigde heeft gestemd | Geen naam of gebruikersaccount |
      | Geen gekozen opties of scores | Geen koppeling met deelnamegegevens |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b908c49acc827932:
    english: There is no shared identifier that connects these records. Submitted votes also omit the actual submission time, invitation information, written reasons, attachments, and other metadata that could help identify a voter.
    translation: Deze gegevens hebben geen gedeelde identificatiecode waarmee ze aan elkaar kunnen worden gekoppeld. Bij uitgebrachte stemmen worden ook het exacte tijdstip van indiening, uitnodigingsgegevens, schriftelijke toelichtingen, bijlagen en andere gegevens weggelaten die een kiezer kunnen identificeren.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6430a3d863d135b6:
    english: This separation is enforced when the vote is stored. It does not depend only on hiding names in the interface.
    translation: Deze scheiding wordt afgedwongen wanneer de stem wordt opgeslagen. Ze berust dus niet alleen op het verbergen van namen in de interface.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b8e31aef3d559f28:
    english: "## While voting is open"
    translation: "## Zolang de stemming open is"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f905c85734898a41:
    english: Results remain hidden from everyone until the poll closes. This includes poll coordinators, group administrators, and instance administrators using the application.
    translation: De resultaten blijven voor iedereen verborgen totdat de peiling sluit. Dat geldt ook voor coördinatoren van de peiling, groepsbeheerders en instantie-​​beheerders die de applicatie gebruiken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  828df5247b61c9e6:
    english: 'When someone votes:'
    translation: 'Wanneer iemand stemt:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  69b471d43b2148a1:
    english: |-
      - their submitted vote is stored without their name or participation record;
      - their participation record is marked to show that they have voted;
      - no vote event, notification, email, comment, or activity entry is created;
      - no copy of their selections is returned after submission; and
      - the interface confirms only that their vote was recorded.
    translation: |-
      - wordt de uitgebrachte stem opgeslagen zonder naam of koppeling met deelnamegegevens;
      - wordt in de deelnamegegevens vastgelegd dat die persoon heeft gestemd;
      - wordt er geen stemgebeurtenis, melding, e-mail, reactie of activiteit aangemaakt;
      - krijgt die persoon na het indienen geen kopie van de gemaakte keuzes terug; en
      - bevestigt de interface alleen dat de stem is vastgelegd.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4ffe4b38db135dab:
    english: The participation record does not store a precise time for when the person voted. Submitted votes are not ordered by submission time.
    translation: In de deelnamegegevens staat niet precies wanneer iemand heeft gestemd. Uitgebrachte stemmen worden niet op tijdstip van indiening gesorteerd.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7acaf6b48fc42105:
    english: "## Votes cannot be changed"
    translation: "## Stemmen kunnen niet worden gewijzigd"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  996ef90a3eee857b:
    english: Each eligible person can vote once. A submitted anonymous vote cannot be reviewed, changed, withdrawn, or replaced, including by a coordinator or administrator.
    translation: Elke stemgerechtigde kan één keer stemmen. Een uitgebrachte anonieme stem kan niet worden bekeken, gewijzigd, ingetrokken of vervangen, ook niet door een coördinator of beheerder.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  58f0aaa6a45c1d37:
    english: Allowing a person to retrieve or replace their vote would require a persistent link between that person and the vote. Anonymous voting deliberately does not create that link.
    translation: Om iemand diens stem te laten terugvinden of vervangen, zou een blijvende koppeling tussen de persoon en de stem nodig zijn. Bij anoniem stemmen wordt die koppeling bewust niet gemaakt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2fd2c9d6ab0d6f68:
    english: Review your selections carefully before submitting.
    translation: Controleer je keuzes zorgvuldig voordat je ze indient.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  59f83c0e359484c4:
    english: "## Why anonymous votes do not have reasons"
    translation: "## Waarom anonieme stemmen geen toelichting hebben"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  89f9d9a1d4bcb395:
    english: New anonymous votes cannot include a written reason or an attachment. Reasons can contain names, personal details, writing patterns, mentions, or other information that identifies the voter. They would also make individual votes easier to distinguish from the aggregate result.
    translation: Bij nieuwe anonieme stemmen kun je geen schriftelijke toelichting of bijlage toevoegen. Een toelichting kan namen, persoonlijke gegevens, schrijfstijl, vermeldingen of andere informatie bevatten die de kiezer herkenbaar maakt. Daardoor zouden afzonderlijke stemmen ook gemakkelijker te onderscheiden zijn van het gezamenlijke resultaat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  932f88aa929fb4eb:
    english: Participants can still discuss the poll in its thread where discussion is available. Those comments are ordinary named discussion contributions and are not attached to an anonymous vote.
    translation: Deelnemers kunnen de peiling nog steeds bespreken in de bijbehorende thread, als discussie daar mogelijk is. Die reacties zijn gewone bijdragen aan de discussie waarbij de naam van de schrijver zichtbaar is. Ze zijn niet aan een anonieme stem gekoppeld.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1b21c2826270bd52:
    english: "## Results and exports"
    translation: "## Resultaten en exports"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  afc45e50b74e075b:
    english: After the poll closes, the results are calculated from the detached votes and displayed as totals and other aggregate results supported by the poll type.
    translation: Na sluiting van de peiling worden de resultaten berekend uit de losstaande stemmen. Ze verschijnen als totalen en andere gezamenlijke resultaten die het type peiling ondersteunt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b28c82ffcb4ffeb5:
    english: The application does not publish vote identifiers, submission order, or submission times. Poll exports contain aggregate results rather than a row for each anonymous vote, except that a closed STV election can be exported in BLT format. A BLT export contains the candidate rankings needed to recount the election, grouped when multiple ballots have the same ranking, without voter identities or ballot metadata.
    translation: De applicatie publiceert geen identificatiecodes van stemmen, volgorde van indiening of tijdstippen van indiening. Exports van peilingen bevatten gezamenlijke resultaten, geen afzonderlijke regel voor elke anonieme stem. Een gesloten STV-verkiezing kan wel in BLT-formaat worden geëxporteerd. Een BLT-export bevat de rangschikking van kandidaten die nodig is om de verkiezing opnieuw te tellen. Stembiljetten met dezelfde rangschikking worden gegroepeerd. De export bevat geen identiteit van kiezers of andere gegevens over de stembiljetten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8088fc78d955e9bb:
    english: An anonymous poll cannot be reopened after it closes.
    translation: Een anonieme peiling kan na sluiting niet opnieuw worden geopend.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c368b542923cd542:
    english: "## Participation verification"
    translation: "## Deelname controleren"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ab086d63c01514bf:
    english: Poll coordinators can view the named participation records. These always show who was eligible. Once at least three people have voted, they also show whether each person voted, but never show how anyone voted. If a poll closes with fewer than three votes, the participation status remains hidden.
    translation: Coördinatoren van de peiling kunnen de deelnamegegevens met namen bekijken. Daarin staat altijd wie mocht stemmen. Zodra minstens drie mensen hebben gestemd, staat er ook of elke persoon heeft gestemd, maar nooit hoe iemand heeft gestemd. Sluit een peiling met minder dan drie stemmen, dan blijft de deelname per persoon verborgen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dcad5d728e5e7cfd:
    english: Other participants cannot view this named participation information. Access to poll results does not grant access to the participation records.
    translation: Andere deelnemers kunnen deze deelnamegegevens met namen niet bekijken. Toegang tot de resultaten van de peiling geeft geen toegang tot de deelnamegegevens.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  37cf06402ac47fa2:
    english: |-
      Coordinators can add eligible people while voting remains open, including after
      other people have voted. Existing voters cannot be removed from an anonymous
      poll.
    translation: |-
      Coördinatoren kunnen stemgerechtigden toevoegen zolang de stemming open is, ook nadat
      anderen hebben gestemd. Mensen die al hebben gestemd, kunnen niet uit een anonieme
      peiling worden verwijderd.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  705e9b807681f6c1:
    english: "## Reminders"
    translation: "## Herinneringen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8ef8b501a1b27f63:
    english: For an anonymous poll lasting at least 24 hours, eligible people who have not voted receive one automatic reminder during the final 24 hours.
    translation: Bij een anonieme peiling met een stemperiode van minstens 24 uur krijgen stemgerechtigden die nog niet hebben gestemd één automatische herinnering in de laatste 24 uur.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b23e579a8ef628de:
    english: The reminder is selected from participation records only. It does not inspect submitted votes or create a connection to them. If the deadline changes, the hourly reminder check uses the current deadline without maintaining a separate scheduled reminder for the poll.
    translation: Voor de herinnering worden alleen de deelnamegegevens gebruikt. Uitgebrachte stemmen worden niet bekeken of eraan gekoppeld. Als de deadline verandert, gebruikt de controle die elk uur plaatsvindt de actuele deadline. Er wordt geen afzonderlijke herinnering voor de peiling ingepland.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  053ce04ce5f98ed8:
    english: Polls with a total voting period of less than 24 hours do not send this automatic reminder.
    translation: Bij peilingen met een totale stemperiode van minder dan 24 uur wordt deze automatische herinnering niet verstuurd.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb1f13e60fe178fe:
    english: "## What coordinators and administrators can see"
    translation: "## Wat coördinatoren en beheerders kunnen zien"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e59c22e94231a746:
    english: 'Through the application, a poll coordinator, group administrator, or instance administrator may be able to see:'
    translation: 'Een coördinator van de peiling, groepsbeheerder of instantiebeheerder kan via de applicatie mogelijk het volgende zien:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2da6b1feaa8b36f1:
    english: |-
      - the poll and its eligible voters;
      - whether each eligible person has voted, where their role permits access and at least three people have voted; and
      - aggregate results after the poll closes.
    translation: |-
      - de peiling en de mensen die mogen stemmen;
      - of elke stemgerechtigde heeft gestemd, als diens rol toegang geeft tot die informatie en minstens drie mensen hebben gestemd; en
      - de gezamenlijke resultaten nadat de peiling is gesloten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6a96a87699625dc6:
    english: 'They cannot use application features to see:'
    translation: 'Via de functies van de applicatie kunnen zij niet zien:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dd4756253d1ee6dc:
    english: |-
      - which selections belong to a person;
      - individual votes or voting patterns;
      - when a particular vote was submitted; or
      - a reason, attachment, event, or notification associated with a submitted vote.
    translation: |-
      - welke keuzes bij een persoon horen;
      - afzonderlijke stemmen of stempatronen;
      - wanneer een bepaalde stem is uitgebracht; of
      - een toelichting, bijlage, gebeurtenis of melding die bij een uitgebrachte stem hoort.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c350875c33492237:
    english: "## Limits of anonymous voting"
    translation: "## Grenzen van anoniem stemmen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  48d04d7b4817e710:
    english: These protections prevent application users from linking a submitted vote to its voter. They are not a cryptographic protection against an operator who can inspect the database, backups, server logs, process memory, network traffic, or a modified version of the application.
    translation: Deze bescherming voorkomt dat gebruikers van de applicatie een uitgebrachte stem aan een kiezer koppelen. Ze biedt geen cryptografische bescherming tegen een beheerder die de database, back-ups, serverlogboeken, het procesgeheugen, netwerkverkeer of een aangepaste versie van de applicatie kan onderzoeken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f901f505362e46b4:
    english: The result itself may also reveal information. A small electorate, a unanimous result, a distinctive combination of selections, or information shared outside the poll can make a person's choices easier to infer. Voters may also choose to identify themselves in discussion outside their submitted vote.
    translation: Ook het resultaat zelf kan informatie prijsgeven. Bij een klein aantal stemgerechtigden, een unanieme uitslag, een opvallende combinatie van keuzes of informatie die buiten de peiling wordt gedeeld, kunnen de keuzes van een persoon gemakkelijker worden afgeleid. Kiezers kunnen er ook voor kiezen om buiten hun uitgebrachte stem, in de discussie, bekend te maken hoe ze hebben gestemd.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dfe97db86db52d15:
    english: Consider the size of the electorate and the sensitivity of the decision when deciding whether application-level anonymous voting is suitable.
    translation: Houd rekening met het aantal kiesgerechtigden en de gevoeligheid van de beslissing wanneer je bepaalt of anoniem stemmen binnen de applicatie geschikt is.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  60cc6f1a0163ec5d:
    english: "## Questions"
    translation: "## Vragen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  57615f2c4c040dce:
    english: "### Can a coordinator see how I voted?"
    translation: "### Kan een coördinator zien wat ik heb gestemd?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9dc1d151cc90e94e:
    english: No. Once at least three people have voted, a coordinator can verify whether you voted but cannot connect you with a submitted vote through the application. Below that threshold, your participation status remains hidden.
    translation: Nee. Zodra minstens drie mensen hebben gestemd, kan een coördinator controleren of je hebt gestemd. Via de applicatie kan die jouw stem niet aan jou koppelen. Bij minder dan drie stemmen blijft verborgen of je hebt gestemd.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b3b382d2575b715d:
    english: "### Can I see my vote after submitting it?"
    translation: "### Kan ik mijn stem bekijken nadat ik die heb uitgebracht?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  52aaaa1c764d5745:
    english: No. The application confirms that your vote was recorded, then discards the selections from the voting interface. It cannot retrieve your vote without creating the link that anonymous voting is designed to avoid.
    translation: Nee. De applicatie bevestigt dat je stem is vastgelegd en verwijdert daarna jouw keuzes uit de steminterface. De applicatie kan jouw stem niet terughalen zonder de koppeling te maken die anoniem stemmen juist voorkomt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  071dd89d6eb38ebf:
    english: "### Can I change or withdraw my vote?"
    translation: "### Kan ik mijn stem wijzigen of intrekken?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '059b75c51b4225ab':
    english: No. There is no link that would let the application identify which submitted vote to change or remove.
    translation: Nee. Er is geen koppeling waarmee de applicatie kan bepalen welke uitgebrachte stem moet worden gewijzigd of verwijderd.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c94077837455425f:
    english: "### Will I receive an email confirming my vote?"
    translation: "### Krijg ik een e-mail ter bevestiging van mijn stem?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f36a8b43a3fdee36:
    english: No. Voting creates only the on-screen acknowledgement and updates your participation record. It does not send a confirmation email or create a notification or activity event.
    translation: Nee. Je krijgt alleen een bevestiging op het scherm en je deelnamegegevens worden bijgewerkt. Er wordt geen bevestigingsmail verstuurd en er wordt geen melding of activiteitsgebeurtenis aangemaakt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f320754cf7ee77bc:
    english: "### Does a public poll reveal more information?"
    translation: "### Geeft een openbare peiling meer informatie prijs?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f84121f0c18e03ab:
    english: Public access may allow people to see the poll and its aggregate results after it closes. It does not expose the named participation records or individual anonymous votes.
    translation: Bij een openbare peiling kunnen mensen de peiling en, na sluiting, de gezamenlijke resultaten zien. Ze kunnen niet zien wie er heeft deelgenomen of hoe afzonderlijke mensen hebben gestemd.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e2dbe0c181f865ca:
    english: "### Is anonymous voting suitable for every election?"
    translation: "### Is anoniem stemmen geschikt voor elke verkiezing?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  05fc871619a2170d:
    english: No. It provides application-level separation between identities and votes. Decisions requiring protection from system operators or independently verifiable cryptographic elections need a system designed for those requirements.
    translation: Nee. Binnen de applicatie blijven de identiteit van stemmers en hun stemmen gescheiden. Als een beslissing bescherming tegen systeembeheerders of een onafhankelijk controleerbare cryptografische verkiezing vereist, is een systeem nodig dat daarvoor is ontworpen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
