    translated_on: '2026-09-30'
  8ce50d3418e2d9fa:
    english: The form asks **How do you want to stay updated?** Choose **Catch-up only**, **When notified**, or **All activity**. If your catch-up is set to **Never**, **Catch-up only** is replaced by **No email updates** or **No push updates**.
    translation: Lomake kysyy **Miten haluat pysyä ajan tasalla?** Valitse **Vain kertaus**, **Kun ilmoitetaan** tai **Kaikki toiminta**. Jos kertauksen aikatauluksi on asetettu **Ei koskaan**, vaihtoehdon **Vain kertaus** tilalla näkyy **Ei sähköposti-päivityksiä** tai **Ei push-päivityksiä**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  24db74c2c82737eb:
    english: Select **Apply to all groups** to use the same setting for all of your groups.
    translation: Valitse **Käytä kaikissa ryhmissä**, jos haluat käyttää samaa asetusta kaikissa ryhmissäsi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
