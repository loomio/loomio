  c98dda573e480da3:
    english: Vivien starts a Loomio discussion outlining the need to review the organization's brand, inviting participation to develop a new brand concept, and that the approval decision is to be made by the governance board using the consensus process.
    translation: Vivien inicia una discusión en Loomio. Explica la necesidad de revisar la marca de la organización, invita a participar en el desarrollo de un nuevo concepto de marca e indica que la junta directiva tomará la decisión de aprobación mediante el proceso de consenso.
