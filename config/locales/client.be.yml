    anonymous_voting_explanation: Зрабіць немагчымым даведацца, як хтосьці галасаваў. Ананімныя галасы рэгіструюцца асобна ад асоб выбаршчыкаў. Вынікі адлюстроўваюцца толькі пасля заканчэння галасавання. Выбаршчыкі не могуць дадаваць абгрунтаванні, праглядаць свой голас пасля яго адпраўкі або змяняць яго.
    anonymous_voting_risk_explanation: Ананімныя галасы захоўваюцца асобна ад ідэнтыфікацыйных дадзеных выбаршчыкаў. Вынікі з'яўляюцца толькі пасля завяршэння галасавання, і выбаршчыкі не могуць дадаваць прычыны, праглядаць свой голас пасля яго адпраўкі або змяняць яго. Гэтыя меры зніжаюць рызыку прывязкі чалавека да галасавання, але вынікі ўсё роўна могуць раскрываць інфармацыю, калі мала людзей маюць права галасаваць або галасуюць, вынік аднагалосны, мадэлі галасавання адметныя або выбаршчыкі раскрываюць свой выбар.
    anonymous_votes_stored_separately: Ананімныя галасы захоўваюцца асобна ад ідэнтыфікацыйных дадзеных выбаршчыкаў. Вынікі з'яўляюцца толькі пасля заканчэння галасавання, і выбаршчыкі не могуць дадаваць прычыны, праглядаць свой голас пасля яго адпраўкі або змяняць яго.
