    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '08ff4ccd500c2a69':
    english: The right sidebar contains actions for the whole thread. Some actions are also available from the three-dot menu (**⋯**) beside a thread on the group page.
    translation: Oikeassa sivupalkissa on koko ketjua koskevia toimintoja. Osa niistä on myös ryhmäsivulla ketjun vieressä olevassa kolmen pisteen valikossa (**⋯**).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e73701c7d36f95ef:
    english: The actions shown depend on your permissions. Group admins can manage threads, and group settings may allow members to perform some management actions. See [Group permissions](/en/user_manual/groups/settings/permissions).
    translation: Näkyvät toiminnot riippuvat käyttöoikeuksistasi. Ryhmän ylläpitäjät voivat hallita ketjuja. Ryhmän asetukset voivat sallia myös jäsenille joitakin hallintatoimia. Katso [Ryhmän käyttöoikeudet](/en/user_manual/groups/settings/permissions).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4fce317a163b0a40:
    english: "### Print"
    translation: "### Tulosta"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9317d4c7c5ef4764:
    english: Select **Print** to generate a page suitable for printing. Use your browser's print dialog to save it as a PDF.
    translation: Valitse **Tulosta**, niin saat tulostamiseen sopivan sivun. Voit tallentaa sen PDF-tiedostoksi selaimen tulostusikkunassa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  443af0749df1db2a:
    english: "### Markdown"
    translation: "### Markdown"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eb0442148f7c042d:
    english: Select **Markdown** to save the complete thread as structured Markdown. Choose **Copy Markdown** to copy it to your clipboard, or **Download Markdown** to save it as a `.md` file. You can use it for meeting minutes, a document, an archive of decisions, an AI assistant, or another tool that supports Markdown.
    translation: Valitse **Markdown**, kun haluat tallentaa koko ketjun jäsenneltynä Markdown-tekstinä. Valitse **Kopioi Markdown**, jos haluat kopioida sen leikepöydälle, tai **Lataa Markdown**, jos haluat tallentaa sen `.md`-tiedostoksi. Voit käyttää sitä kokousmuistiona, asiakirjana, päätösarkistona tai tekoälyavustajassa tai muussa Markdownia tukevassa työkalussa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  80e3f57638b53cb4:
    english: The document begins with YAML front matter containing the thread key, group, creation date, last activity date, and tags. It then includes the discussion context and every comment, poll, vote, and outcome in the same order and nesting as the threaded view.
    translation: Asiakirjan alussa on YAML-alkuosa, joka sisältää ketjun tunnisteen, ryhmän, luontipäivän, viimeisimmän toiminnan päivämäärän ja tunnisteet. Sen jälkeen tulevat keskustelun konteksti sekä kaikki kommentit, kyselyt, äänet ja lopputulokset samassa järjestyksessä ja sisäkkäisessä rakenteessa kuin ketjunäkymässä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f99823b7b44e2cdd:
    english: Each poll is a section. Comments, votes, and outcomes are quoted, and replies are quoted beneath the item they answer. This shows where each person's text begins and ends. Each quote starts with one line showing the person, when they posted, the item's number in the thread, and any reactions. Votes and outcomes also say what they are. The thread key and item number identify each item in Loomio.
    translation: Jokainen kysely muodostaa oman osionsa. Kommentit, äänet ja lopputulokset esitetään lainauksina. Vastaukset lainataan sen kohdan alla, johon ne vastaavat. Näin näet, mistä kunkin henkilön teksti alkaa ja mihin se päättyy. Jokaisen lainauksen ensimmäisellä rivillä näkyvät kirjoittaja, julkaisuajankohta, kohdan numero ketjussa ja mahdolliset reaktiot. Äänistä ja lopputuloksista näkyy myös niiden tyyppi. Ketjun tunniste ja kohdan numero yksilöivät kunkin kohdan Loomiossa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e5bdfbb4a0d7646f:
    english: Loomio applies the same visibility rules as the thread. Results and vote reasons you cannot see are not included, and voters are not identified in anonymous polls. If an open poll hides results until you vote, vote before exporting the thread. **Markdown** and **Print** are unavailable until you do.
    translation: Loomio noudattaa samoja näkyvyyssääntöjä kuin ketjussa. Tulokset ja äänestyksen perustelut, joita et voi nähdä, jätetään pois. Anonyymeissä kyselyissä äänestäjiä ei nimetä. Jos avoimen kyselyn tulokset ovat piilossa äänestämiseen asti, äänestä ennen ketjun vientiä. **Markdown** ja **Tulosta** ovat käytettävissä vasta sen jälkeen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7989d3386a42f180:
    english: 'For example, a discussion containing a comment, reactions, a proposal, two votes, a reply, and an outcome produces this Markdown:'
    translation: 'Esimerkiksi keskustelu, jossa on kommentti, reaktioita, ehdotus, kaksi ääntä, vastaus ja lopputulos, tuottaa tällaisen Markdown-tekstin:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  275f4d9025c017c4:
    english: The headings and labels use your selected language. Content written by participants remains in its original language.
    translation: Otsikot ja tunnisteet ovat valitsemallasi kielellä. Osallistujien kirjoittama sisältö säilyy alkuperäisellä kielellään.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dab18fdf3c56269d:
    english: "### Thread settings and display"
    translation: "### Ketjun asetukset ja näkymä"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7bc55279f97c6d1b:
    english: Group admins can select **Thread settings** to change how replies are arranged and configure other discussion options.
    translation: Ryhmän ylläpitäjät voivat valita **Ketjun asetukset**, jos he haluavat muuttaa vastausten järjestystä tai muita keskustelun asetuksia.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  32b2640ba23524aa:
    english: Choose **Timeline** to list items in the order they were posted, or **Threaded** to group replies beneath the item they respond to. Thread settings also control whether multiple polls may run at once and can set a maximum comment length. These settings apply to everyone in the discussion.
    translation: Valitse **Aikajana**, jos haluat nähdä kohdat julkaisujärjestyksessä, tai **Threaded**, jos haluat nähdä vastaukset sen kohdan alla, johon ne vastaavat. Ketjun asetuksissa voi myös määrittää, voiko useita kyselyitä olla käynnissä yhtä aikaa, sekä asettaa kommentin enimmäispituuden. Asetukset koskevat kaikkia keskustelun osallistujia.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a520339278bcc2a:
    english: "### Pin or unpin a thread"
    translation: "### Kiinnitä ketju tai poista sen kiinnitys"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0433e7a61db60003:
    english: Pinned threads appear above other threads on the group page. Welcome discussions, news items, and announcements are typical uses for pinned threads.
    translation: Kiinnitetyt ketjut näkyvät ryhmäsivulla muiden ketjujen yläpuolella. Niihin sopivat esimerkiksi tervetulokeskustelut, uutiset ja ilmoitukset.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b2712588a5e0aab3:
    english: Open the three-dot menu (**⋯**) beside the thread on the group page and select **Pin thread**. Pinned threads are ordered by the time they were pinned. To change their order, unpin and pin them again.
    translation: Avaa ryhmäsivulla ketjun vieressä oleva kolmen pisteen valikko (**⋯**) ja valitse **Kiinnitä lanka**. Kiinnitetyt ketjut järjestetään kiinnitysajankohdan mukaan. Jos haluat muuttaa järjestystä, poista kiinnitykset ja kiinnitä ketjut uudelleen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a0443f076d1b8ae5:
    english: Select **Unpin thread** to return a thread to the activity-based order.
    translation: Valitse **Irrota lanka**, jos haluat palauttaa ketjun toiminnan mukaiseen järjestykseen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b90a469963b02ffc:
    english: "### Move a thread"
    translation: "### Siirrä ketju"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8b2071f4625705e5:
    english: Select **Move thread** to move a thread to another group, subgroup, or to a direct thread. It will be visible to members of the destination group and anyone specifically invited to it.
    translation: Valitse **Siirrä ketju**, jos haluat siirtää ketjun toiseen ryhmään, alaryhmään tai suoraksi ketjuksi. Kohderyhmän jäsenet ja ketjuun erikseen kutsutut henkilöt voivat nähdä sen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f09d5f2afce03ee8:
    english: |-
      >[!Tip]
      >Start a draft as a direct discussion or in a private subgroup, then move it to the group when it is ready.
    translation: |-
      >[!Tip]
      >Aloita luonnos suorana keskusteluna tai yksityisessä alaryhmässä. Siirrä se ryhmään, kun se on valmis.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c82562b641053308:
    english: To move selected activity rather than the whole thread, see [Moving items between threads](/en/user_manual/discussions/moving_items/).
    translation: Jos haluat siirtää vain valittuja kohtia koko ketjun sijaan, katso [Kohtien siirtäminen ketjujen välillä](/en/user_manual/discussions/moving_items/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  be22d2980075fdaa:
    english: "### Lock or unlock a thread"
    translation: "### Lukitse ketju tai avaa sen lukitus"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e7c24a610fd2bf8b:
    english: Lock a thread to prevent comments or further changes. A thread can only be locked after its active polls have closed.
    translation: Lukitse ketju, jos haluat estää kommentoinnin ja muut muutokset. Ketjun voi lukita vasta, kun kaikki sen käynnissä olevat kyselyt ovat päättyneet.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  edb983bb6366aa6c:
    english: Select **Lock thread** under **Actions**. Locked threads are removed from the list of open discussions and marked with a **Locked** tag.
    translation: Valitse **Toiminnot**-osiosta **Lukitse ketju**. Lukitut ketjut poistuvat avoimien keskustelujen luettelosta ja saavat **Lukittu**-tunnisteen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ba2794349524cc33:
    english: To find a locked thread, open the discussion filter on the group page and select **Locked**. Open the thread and select **Unlock thread** to allow comments and changes again.
    translation: Löydät lukitun ketjun avaamalla keskustelujen suodattimen ryhmäsivulla ja valitsemalla **Lukittu**. Avaa ketju ja valitse **Avaa ketju**, jos haluat sallia kommentoinnin ja muut muutokset uudelleen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3a75fb1ad0ffab87:
    english: "### Delete a thread"
    translation: "### Ketjun poistaminen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0103a5729bd6a095:
    english: Deleting a thread removes it permanently and cannot be undone. Lock the thread instead if you may need it again.
    translation: Ketjun poistaminen poistaa sen pysyvästi, eikä sitä voi perua. Lukitse ketju, jos saatat tarvita sitä myöhemmin.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  daf08ca8895b0fe2:
    english: Select **Delete thread** and confirm the deletion.
    translation: Valitse **Poista lanka** ja vahvista poistaminen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
