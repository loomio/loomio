  7069de909d719ef2:
    english: Build consensus for a decision you need to make together, to reach an agreement that satisfies the needs and concerns of all participants.
    translation: Construye un consenso sobre una decisión que debéis tomar en conjunto. Busca un acuerdo que atienda las necesidades e inquietudes de todas las personas participantes.
    status: machine
