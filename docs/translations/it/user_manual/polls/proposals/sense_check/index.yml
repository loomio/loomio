---
navigation_title: Verifica delle opinioni
blocks:
  5c5bf2d96ddf4ca2:
    english: "# Sense check"
    translation: "# Verifica delle opinioni"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4ec1b55b6ebaf563:
    english: Sense check gathers reactions while an idea is still being developed. Its options—**Looks good**, **Could be better**, and **Needs a rethink**—show whether the group is ready to proceed or should revise the idea first.
    translation: La verifica delle opinioni raccoglie le reazioni mentre un'idea è ancora in fase di sviluppo. Le opzioni **Sembra buono**, **Potrebbe essere migliore** e **Ha bisogno di essere ripensato** mostrano se il gruppo è pronto a procedere o se deve prima rivedere l'idea.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  43573d5547783c67:
    english: This page explains how to run one Sense check. See the [Simple decision process](/en/guides/making_decisions/simple_decision_process), [Consent process](/en/guides/making_decisions/consent_process), or [Consensus process](/en/guides/making_decisions/consensus_process) for examples of using Sense check as one stage of a larger process.
    translation: Questa pagina spiega come avviare una verifica delle opinioni. Consulta il [Processo decisionale semplice](/en/guides/making_decisions/simple_decision_process), il [Processo per consenso senza obiezioni](/en/guides/making_decisions/consent_process) o il [Processo per consenso](/en/guides/making_decisions/consensus_process) per vedere come usarla in un processo più ampio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5ad4c12fda490468:
    english: "## When to use Sense check"
    translation: "## Quando usare la verifica delle opinioni"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dc841c725ef4e519:
    english: 'Use Sense check to:'
    translation: 'Usa la verifica delle opinioni per:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8472db2ec587add8:
    english: |-
      - test an early draft before investing in a detailed proposal;
      - uncover questions and concerns before a formal decision;
      - check whether another round of discussion is needed; or
      - compare support before and after revising an idea.
    translation: |-
      - valutare una prima bozza prima di preparare una proposta dettagliata;
      - far emergere domande e dubbi prima di una decisione formale;
      - capire se serve un altro giro di discussione; oppure
      - confrontare il sostegno prima e dopo la revisione di un'idea.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f411d599f7810e88:
    english: Do not treat **Looks good** as formal approval unless the group has explicitly agreed to do so. Use [Consent](../consent/) or [Consensus](../consensus/) when the response must authorize a decision.
    translation: Non considerare **Sembra buono** un'approvazione formale, a meno che il gruppo non abbia concordato esplicitamente di farlo. Usa il [Consenso senza obiezioni](../consent/) o il [Consenso](../consensus/) quando la risposta deve autorizzare una decisione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e504f1a6f38ec6ad:
    english: "## Example: check a trial plan"
    translation: "## Esempio: valutare un piano di prova"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dd13b88fd1a52d50:
    english: Oatmilk Cooperative has drafted a returnable-bottle trial. It runs a Sense check to learn whether the collection schedule, washing checks, and reporting plan are ready for final review.
    translation: La cooperativa Oatmilk ha preparato una bozza per sperimentare bottiglie a rendere. Avvia una verifica delle opinioni per capire se il calendario di raccolta, i controlli sul lavaggio e il piano per riferire i risultati sono pronti per la revisione finale.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9703f1f9474243af:
    english: "## Set up the proposal"
    translation: "## Prepara la proposta"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  48d89110b4c23c6f:
    english: State what stage the idea has reached and what will happen with the feedback. Keep the default response meanings or edit them to match the group's language. Set a closing time that leaves enough time to revise the plan.
    translation: Indica a che punto è l'idea e come verranno usati i commenti. Mantieni il significato predefinito delle risposte oppure modificalo per adattarlo al linguaggio del gruppo. Imposta una scadenza che lasci abbastanza tempo per rivedere il piano.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Vota"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a0f4779c6103c9c:
    english: Participants choose the response that best represents their current view and explain what is ready or what should change. A useful reason gives the proposal author something specific to act on.
    translation: I partecipanti scelgono la risposta che rappresenta meglio la loro opinione attuale e spiegano cosa è pronto o cosa dovrebbe cambiare. Una motivazione utile dà a chi ha scritto la proposta un'indicazione concreta su cui agire.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Leggi i risultati"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ddcd496a30ab97da:
    english: 'The chart shows the number and proportion of votes for each response. Read the reasons as well as the distribution: one well-founded concern may require attention even when most participants select **Looks good**.'
    translation: 'Il grafico mostra il numero e la percentuale dei voti per ogni risposta. Leggi le motivazioni oltre alla distribuzione dei voti: un dubbio ben fondato può richiedere attenzione anche se la maggior parte dei partecipanti sceglie **Sembra buono**.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d9ac55d3e75e5484:
    english: Publish an outcome that summarizes the changes the group will make, or records that the idea is ready for the next decision stage.
    translation: Pubblica una conclusione che riassuma le modifiche che il gruppo farà, oppure che registri che l'idea è pronta per la fase decisionale successiva.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
