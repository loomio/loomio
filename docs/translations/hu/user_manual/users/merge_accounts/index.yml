navigation_title: Fiókok egyesítése
blocks:
  e3a50952a2ce6cfc:
    english: "# Merge accounts"
    translation: "# Fiókok egyesítése"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e0bdfaac5741d310:
    english: Merge two Loomio accounts when each account uses a different email address and you want to continue with one account.
    translation: Ha két Loomio-fiókod van különböző e-mail-címekkel, egyesítheted őket, hogy ezután egy fiókot használj.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '08d4fcba2e0a2b3b':
    english: 'Before you begin, decide which account you want to keep:'
    translation: 'Mielőtt elkezded, döntsd el, melyik fiókot szeretnéd megtartani:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6f7efc1ebdc680c7:
    english: |-
      - The **account to keep** is the account whose email address and profile you will use after the merge
      - The **account to retire** is the account you sign in to first. Its email address will no longer work for signing in after the merge
    translation: |-
      - A **megtartandó fiók** e-mail-címét és profilját fogod használni az egyesítés után
      - A **megszüntetendő fiókba** jelentkezel be először. Az e-mail-címével az egyesítés után már nem lehet bejelentkezni
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  060fb4b1c12c153a:
    english: You need access to both accounts and to the email address of the account you want to keep.
    translation: Mindkét fiókhoz és a megtartandó fiók e-mail-címéhez is hozzá kell férned.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9c9a7e082a3b67ae:
    english: |-
      > [!WARNING]
      > Merging accounts is irreversible. Check the source and target email addresses carefully before the final confirmation.
    translation: |-
      > [!WARNING]
      > A fiókok egyesítése nem vonható vissza. A végső megerősítés előtt gondosan ellenőrizd mindkét e-mail-címet.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4d6defccb0f2a2ec:
    english: "## Start the merge"
    translation: "## Az egyesítés indítása"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0c49f5d2284571d3:
    english: |-
      1. Sign in to the **account you want to retire**.
      2. Open the sidebar, select your name, and select **Edit profile**.
      3. Select **Merge accounts**.
    translation: |-
      1. Jelentkezz be a **megszüntetendő fiókba**.
      2. Nyisd meg az oldalsávot, válaszd ki a nevedet, majd a **Profil szerkesztése** lehetőséget.
      3. Válaszd a **Fiókok egyesítése** lehetőséget.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a05689d18f3c3337:
    english: "![The profile actions with Merge accounts highlighted](merge_accounts_profile.png)"
    translation: "![A profilműveletek, kiemelve a Fiókok egyesítése lehetőséget](merge_accounts_profile.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  29656e0572127b88:
    english: 4. Enter the destination account's email address—the address belonging to the **account you want to keep**—and select **Send verification email**. Loomio always shows the same confirmation and signs you out. If an account uses that address, Loomio sends it the verification email.
    translation: 4. Add meg a **megtartandó fiók** e-mail-címét, majd válaszd az **Ellenőrző e-mail küldése** lehetőséget. A Loomio minden esetben ugyanazt a megerősítő üzenetet jeleníti meg, majd kijelentkeztet. Ha tartozik fiók a megadott címhez, a Loomio ellenőrző e-mailt küld rá.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d045b6c7e8a5b853:
    english: "## Verify the account you want to keep"
    translation: "## A megtartandó fiók ellenőrzése"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  57255cdb29b384d7:
    english: 5. Open the verification email sent to the address of the account you want to keep and select **Verify email and proceed**.
    translation: 5. Nyisd meg a megtartandó fiók címére küldött ellenőrző e-mailt, majd válaszd az **Ellenőrizze az e-mail-címet, és folytassa** lehetőséget.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5e496b2d8f551efa:
    english: "![The merge verification email with the Verify email and proceed button highlighted](merge_accounts_email.png)"
    translation: "![Az egyesítést ellenőrző e-mail, kiemelve az Ellenőrizze az e-mail-címet, és folytassa gombot](merge_accounts_email.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ad19dc0399f9d446:
    english: |-
      6. Sign in as the account you want to keep if Loomio asks you to sign in.
      7. On the **Confirm merge** page, check both email addresses again. Select **Merge accounts** to complete the merge.
    translation: |-
      6. Ha a Loomio kéri, jelentkezz be a megtartandó fiókba.
      7. Az **Egyesítés megerősítése** oldalon ellenőrizd újra mindkét e-mail-címet. Az egyesítés befejezéséhez válaszd a **Fiókok egyesítése** lehetőséget.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a575e2cd16aa66b4:
    english: "![The final confirmation page with the Merge accounts button highlighted](merge_accounts_confirm.png)"
    translation: "![A végső megerősítő oldal, kiemelve a Fiókok egyesítése gombot](merge_accounts_confirm.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cf8eba685cfdbf04:
    english: "## What happens after the merge"
    translation: "## Mi történik az egyesítés után"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6ae4c6c893430735:
    english: The account you keep remains your Loomio identity and sign-in account. Group memberships and activity from the retired account, including discussions, comments, polls, and votes, are reassigned to the account you keep. Where both accounts already belong to the same group, the existing membership for the account you keep remains.
    translation: A megtartott fiók marad a Loomio-profilod és a bejelentkezéshez használt fiókod. A megszüntetett fiók csoporttagságai és tevékenységei – köztük a beszélgetések, hozzászólások, szavazások és leadott szavazatok – átkerülnek a megtartott fiókhoz. Ha mindkét fiók ugyanannak a csoportnak a tagja, a megtartott fiók meglévő tagsága marad érvényben.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  eb05b57367c0815c:
    english: The retired account is deleted and its email address can no longer be used to sign in. Loomio sends a confirmation email to the address of the account you kept when the merge is complete.
    translation: A megszüntetett fiók törlődik, és az e-mail-címével többé nem lehet bejelentkezni. Az egyesítés befejezésekor a Loomio megerősítő e-mailt küld a megtartott fiók címére.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
