  9cfb3b7835dc5cb0:
    english: If some members of your group should have voting rights while others should not, you can use the "Make delegate" feature to identify those people with voting rights. There is a corresponding "Revoke delegate" action too.
    translation: Se solo alcuni membri del tuo gruppo devono avere diritto di voto, usa l'azione "Rendi delegato" per identificarli. Per revocare il diritto di voto, usa "Revoca delegato".
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e017eafb51368777:
    english: Use delegates when people should share the same discussion space but only a defined set, such as directors or elected representatives, may vote. This is usually simpler than maintaining a second subgroup whose only purpose is to separate voters from non-voters.
    translation: Usa i delegati quando tutti devono condividere lo stesso spazio di discussione, ma solo un gruppo definito di persone, come i dirigenti o i rappresentanti eletti, può votare. Di solito è più semplice che mantenere un secondo sottogruppo solo per distinguere chi può votare da chi non può.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1942a47ae47ca813:
    english: Use a private subgroup instead when its members also need discussions, files, or membership information that other members must not see.
    translation: Usa invece un sottogruppo privato se i suoi membri hanno bisogno anche di discussioni, file o informazioni sui membri che gli altri non devono vedere.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
