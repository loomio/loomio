navigation_title: Assegnare
blocks:
  343675f0497d460a:
    english: "# Allocate"
    translation: "# Assegnare"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  46dd27ee2e2fb992:
    english: Allocate, sometimes known as a dot vote, reveals priorities when there are trade-offs. Each participant receives a fixed budget of points and distributes it across the options. Giving more to one option leaves fewer points for the others.
    translation: Assegnare, chiamato anche voto a punti, aiuta a individuare le priorità quando occorre fare delle scelte. Ogni partecipante riceve un numero fisso di punti e li distribuisce tra le opzioni. Assegnare più punti a un'opzione ne lascia meno per le altre.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c6d05c5ec2a695d2:
    english: "## When to use Allocate"
    translation: "## Quando usare Assegnare"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f5b2c4377aea5079:
    english: 'Use Allocate when time, money, attention, or another resource is limited. It works well for:'
    translation: 'Usa Assegnare quando il tempo, il denaro, l''attenzione o un''altra risorsa sono limitati. È utile per:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8e6525da99616946:
    english: |-
      - prioritizing work for the next planning period;
      - dividing a participatory budget between projects;
      - choosing how much agenda time to give several topics;
      - distributing a fixed number of volunteer hours; or
      - identifying which improvements matter most to members.
    translation: |-
      - stabilire le priorità di lavoro per il prossimo periodo di pianificazione;
      - suddividere un bilancio partecipativo tra progetti;
      - decidere quanto tempo dedicare a diversi argomenti nell'ordine del giorno;
      - distribuire un numero fisso di ore di volontariato; oppure
      - individuare i miglioramenti più importanti per i membri.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  66b0f13c4811ef63:
    english: The points express relative priority, not an amount that Loomio will automatically assign. Use [Score](/en/user_manual/polls/score/) when every option can receive a high rating without reducing support for another.
    translation: I punti esprimono una priorità relativa, non una quantità che Loomio assegnerà automaticamente. Usa [Valutazione](/en/user_manual/polls/score/) quando ogni opzione può ricevere un punteggio alto senza ridurre il sostegno alle altre.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '0409e08bd5e80f61':
    english: "## Example: set priorities for an annual strategy review"
    translation: "## Esempio: stabilire le priorità per la revisione annuale della strategia"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e274f6e40509e611:
    english: Oatmilk Cooperative is planning its annual strategy review. It asks members which areas should receive the most time and attention during the review. Each member receives ten points to allocate across five areas. This shows the group's relative priorities while requiring participants to make trade-offs.
    translation: La Cooperativa Oatmilk sta pianificando la revisione annuale della propria strategia. Chiede ai membri a quali ambiti dedicare più tempo e attenzione durante la revisione. Ogni membro riceve dieci punti da distribuire tra cinque ambiti. Il risultato mostra le priorità relative del gruppo e richiede ai partecipanti di fare delle scelte.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c74ebb16f872b3c6:
    english: "## Set up the poll"
    translation: "## Imposta il sondaggio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  906790609aa7eb30:
    english: Describe the decision and what the points represent. Add options at a similar level of scope, then set **Points per person**. In this example, each voter receives ten points to indicate how much review time each strategic area should receive.
    translation: Descrivi la decisione e spiega cosa rappresentano i punti. Aggiungi opzioni di portata simile, poi imposta **Punti per persona**. In questo esempio, ogni elettore riceve dieci punti per indicare quanto tempo dedicare alla revisione di ciascun ambito strategico.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  67ae025b83fb4781:
    english: A very large budget can create false precision. A useful budget is usually large enough to show differences but small enough to require choices. Make clear whether concentrating all points on one option is acceptable.
    translation: Un numero molto alto di punti può dare una falsa impressione di precisione. In genere, un numero utile permette di mostrare le differenze, ma resta abbastanza basso da richiedere delle scelte. Chiarisci se è possibile assegnare tutti i punti a una sola opzione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Vota"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d9a73b9d4e2f8927:
    english: Participants move the sliders to distribute their budget. Loomio shows how many points remain and prevents submission until the allocation is valid.
    translation: I partecipanti spostano i cursori per distribuire i punti a disposizione. Loomio mostra quanti punti restano e impedisce di inviare il voto finché la distribuzione non è valida.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7b3d616673a01fbb:
    english: In this example, the voter assigns three points each to **Member participation** and **Financial sustainability**, two each to **Environmental impact** and **Staff development**, and none to **Products and services**. A zero does not necessarily mean an area has no value; it means the voter used their limited points elsewhere.
    translation: 'In questo esempio, l''elettore assegna tre punti ciascuno a **Partecipazione dei membri** e **Sostenibilità finanziaria**, due ciascuno a **Impatto ambientale** e **Sviluppo del personale**, e nessuno a **Prodotti e servizi**. Zero punti non significa necessariamente che un ambito non abbia valore: significa che l''elettore ha usato altrove i punti a disposizione.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Leggi i risultati"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  97147f83eaf22313:
    english: 'The results order options by the total points received. They also show:'
    translation: 'I risultati ordinano le opzioni in base al totale dei punti ricevuti. Mostrano anche:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1d224c0c34145a7f:
    english: |-
      - **% of points**: the option's share of all allocated points;
      - **Points**: the total points allocated;
      - **Mean**: the average among voters who gave the option points; and
      - **Voters**: how many people gave the option at least one point.
    translation: |-
      - **% di punti**: la quota di tutti i punti assegnati ricevuta dall'opzione;
      - **Punti**: il totale dei punti assegnati;
      - **Significare**: la media tra gli elettori che hanno assegnato punti all'opzione; e
      - **Elettori**: quante persone hanno assegnato almeno un punto all'opzione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2901008fa326e4f5:
    english: In this example, **Financial sustainability** receives the most points, followed by **Staff development**. Financial sustainability receives points from every voter, suggesting broad agreement that it needs substantial review time. Read the totals alongside the number of voters to distinguish broad priorities from areas strongly supported by fewer people.
    translation: 'In questo esempio, **Sostenibilità finanziaria** riceve più punti, seguita da **Sviluppo del personale**. Ogni elettore assegna punti alla sostenibilità finanziaria: questo suggerisce un ampio accordo sulla necessità di dedicarle molto tempo durante la revisione. Confronta i totali con il numero di elettori per distinguere le priorità condivise da quelle sostenute con forza da meno persone.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f2c04fbdc54d23e8:
    english: Read the totals together with the number of voters and their reasons. Publish an outcome explaining how the strategy review will be structured; the poll does not assign time automatically.
    translation: Leggi i totali insieme al numero di elettori e alle loro motivazioni. Pubblica una conclusione che spieghi come sarà organizzata la revisione della strategia; il sondaggio non assegna automaticamente il tempo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
