  eecfb12ed1d28d50:
    english: Good governance exists where an organization has systems and processes in place that are appropriate to its circumstances, and which enable the organization to pursue its purpose effectively and meet its obligations under the law.
    translation: Goed bestuur betekent dat een organisatie systemen en processen heeft die passen bij haar omstandigheden. Daarmee kan de organisatie haar doel doeltreffend nastreven en aan haar wettelijke verplichtingen voldoen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e54f67d22cf67a93:
    english: "*“It is participatory, consensus-oriented, accountable, transparent, responsive, effective and efficient, equitable and inclusive and follows the rule of law.”* [United Nations Economic and Social Commission for Asia and the Pacific](https://www.unescap.org/sites/default/d8files/knowledge-products/good-governance.pdf)."
    translation: "*“Het is participatief, gericht op consensus, verantwoordingsplichtig, transparant, responsief, doeltreffend en efficiënt, rechtvaardig en inclusief, en volgt de rechtsstaat.”* [Economische en Sociale Commissie voor Azië en de Stille Oceaan van de Verenigde Naties](https://www.unescap.org/sites/default/d8files/knowledge-products/good-governance.pdf)."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1661a79cfda1a9df:
    english: Underpinning all of these principles is the need for good communication.
    translation: Goede communicatie ligt aan al deze principes ten grondslag.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2819f114c9d74160:
    english: 'Here are some or the challenges directors and boards experience:'
    translation: 'Bestuursleden en besturen lopen onder meer tegen deze uitdagingen aan:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ed750814c61b85fb:
    english: "* Getting directors together in person\n* Time available to consider important issues \n* Tracking communication\n* Urgency of critical issues\n* Online video meeting fatigue\n* Directors in multiple, remote locations, sometimes with poor internet connectivity\n* Mixed governance practice and experience\n* Dealing with high volumes of transactional business \n* Maintaining institutional memory"
    translation: "* Bestuursleden persoonlijk bij elkaar brengen\n* Tijd vinden om belangrijke kwesties te bespreken \n* Communicatie bijhouden\n* Dringende kwesties op tijd behandelen\n* Vermoeidheid door online videovergaderingen\n* Bestuursleden op verschillende, afgelegen locaties, soms met een slechte internetverbinding\n* Verschillen in bestuurservaring en werkwijzen\n* Grote hoeveelheden lopende zaken afhandelen \n* De kennis van de organisatie behouden"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b910c5253cf77950:
    english: Loomio offers an opportunity to strengthen governance, to extend collaboration beyond board meetings, to include everyone in open, honest and respectful discussion while documenting everything.
    translation: Met Loomio kun je het bestuur versterken en ook buiten bestuursvergaderingen samenwerken. Iedereen kan deelnemen aan open, eerlijke en respectvolle discussies, terwijl alles wordt vastgelegd.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
