  4318dab03fe217ad:
    english: Oatmilk Cooperative is deciding whether to approve the budget for its six-week returnable bottle trial. Five people are eligible to vote.
    translation: La coopérative Oatmilk doit décider si elle approuve le budget d’un essai de bouteilles consignées de six semaines. Cinq personnes peuvent voter.
    status: machine
