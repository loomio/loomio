    translated_on: '2026-09-29'
  ca5b9583bfe78b65:
    english: A proposal asks people to respond to a statement or course of action. Participants choose a defined response and can explain their vote. Use a proposal to gather feedback, seek advice, identify objections, or test for agreement.
    translation: Mit einem Vorschlag bittest du andere, zu einer Aussage oder einem Vorgehen Stellung zu nehmen. Die Teilnehmenden wählen eine der vorgegebenen Antworten und können ihre Stimme begründen. Nutze einen Vorschlag, um Rückmeldungen und Rat einzuholen, Einwände zu erkennen oder die Zustimmung zu prüfen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  143dc77c58a4c881:
    english: This section helps you choose and run Loomio's default proposal templates. For a complete sequence of discussion, proposals, amendments, and outcome, use the [decision-making guides](/en/guides/making_decisions/). To change the templates available to your group, see [Poll templates](../poll_templates/).
    translation: In diesem Abschnitt erfährst du, wie du Loomios Standardvorlagen für Vorschläge auswählst und nutzt. Wenn du den gesamten Ablauf von der Diskussion über Vorschläge und Änderungen bis zum Fazit durchlaufen möchtest, lies die [Anleitungen zur Entscheidungsfindung](/en/guides/making_decisions/). Unter [Umfragevorlagen](../poll_templates/) erfährst du, wie du die verfügbaren Vorlagen für deine Gruppe änderst.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e0f8614f95c9c5ff:
    english: "## Choose a proposal template"
    translation: "## Eine Vorlage für Vorschläge auswählen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  525699503edbe342:
    english: |-
      | Template | What it asks | Use it when… |
      |---|---|---|
      | [Sense check](sense_check/) | Is this on the right track? | An idea is still being developed |
      | [Advice](advice/) | What advice should the decision maker consider? | A person or team owns the decision |
      | [Consent](consent/) | Is this safe to try, or is there a meaningful objection? | The group uses consent decision-making |
      | [Consensus](consensus/) | What is your position on this proposal? | The group is seeking collective agreement |
    translation: |-
      | Vorlage | Frage | Geeignet, wenn … |
      |---|---|---|
      | [Sinnesprüfung](sense_check/) | Geht das in die richtige Richtung? | Eine Idee noch entwickelt wird |
      | [Beratung](advice/) | Welchen Rat sollte die entscheidende Person berücksichtigen? | Eine Person oder ein Team die Entscheidung trifft |
      | [Zustimmung](consent/) | Können wir das gefahrlos ausprobieren, oder gibt es einen wesentlichen Einwand? | Die Gruppe Entscheidungen nach dem Konsentprinzip trifft |
      | [Konsens](consensus/) | Wie stehst du zu diesem Vorschlag? | Die Gruppe eine gemeinsame Einigung anstrebt |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0cb03ac4a22f02b4:
    english: Choose the template whose response options match the question you need answered. Each template page explains its use cases, setup, voting form, and results.
    translation: Wähle die Vorlage, deren Antwortmöglichkeiten zu deiner Frage passen. Auf der Seite jeder Vorlage findest du Informationen zu Einsatz, Einrichtung, Stimmabgabe und Ergebnissen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d379b02c308b3b55:
    english: "## Other proposal templates"
    translation: "## Weitere Vorlagen für Vorschläge"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  44cdb16aebf757ca:
    english: Loomio also provides templates such as Proposal, Gradients of agreement, Question round, and Majority. Some are hidden initially. Group administrators can make them available or create a template for the group's own terminology and rules from [Poll templates](../poll_templates/).
    translation: Loomio bietet auch Vorlagen wie Vorschlag, Übereinstimmungsgradienten, Fragerunde und Mehrheitlich. Einige sind zunächst ausgeblendet. Gruppenadmins können sie unter [Umfragevorlagen](../poll_templates/) verfügbar machen oder eine Vorlage mit den eigenen Begriffen und Regeln der Gruppe erstellen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ca179ba4cb53c5e3:
    english: "## Proposal records"
    translation: "## Der Entscheidungsverlauf"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  460a90e796fc4dc0:
    english: Votes and reasons update while the proposal is open, and participants can change their response. After it closes, publish an [outcome](../outcomes/) that states the decision or next step. The discussion, proposal, votes, reasons, and outcome form a record of how the group reached its decision.
    translation: Solange der Vorschlag offen ist, werden Stimmen und Begründungen laufend aktualisiert. Teilnehmende können ihre Antwort ändern. Veröffentliche nach dem Schließen ein [Fazit](../outcomes/), das die Entscheidung oder den nächsten Schritt festhält. Diskussion, Vorschlag, Stimmen, Begründungen und Fazit dokumentieren, wie die Gruppe zu ihrer Entscheidung gelangt ist.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
