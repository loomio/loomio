---
navigation_title: Принятие решений
blocks:
  0a72d2c89c87c2a7:
    english: "# Making resolutions and online decisions"
    translation: "# Принятие решений и онлайн-голосование"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  50902da4933b32b7:
    english: Board and committee members frequently need to make 'out-of-session' decisions. These are governance decisions and discussion where either;
    translation: 'Членам совета и комитетов часто приходится принимать решения между заседаниями. Такие вопросы требуют обсуждения и решения, когда:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4355b569fb0f9ee4:
    english: |-
      - There was insufficient time to make a decision in the board meeting,
      - the decision does not require a lot of discussion (including administrative decisions),
      - something has happened (internally or externally) that requires the board to act before the next meeting,
      - a director has a particular interest to explore with the board.
    translation: |-
      - на заседании совета не хватило времени для принятия решения,
      - вопрос не требует длительного обсуждения, в том числе если он носит административный характер,
      - произошло событие внутри организации или вне её, на которое совет должен отреагировать до следующего заседания,
      - один из членов совета хочет обсудить с остальными вопрос, который его особенно интересует.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c46be74fd433f516:
    english: |-
      ## On Loomio
      Start a **thread** and open a discussion:
      - Introduce the topic or decision that you would like to make,
      - invite directors to comment with their thoughts, opinions and any information they have to help everyone understand their perspective about the 'out-of-session' topic or decision,
      - encourage members to participate by posting or reply to comments.
    translation: |-
      ## В Loomio
      Создайте **тему** и начните обсуждение:
      - Опишите вопрос или решение, которое хотите принять,
      - предложите членам совета поделиться мыслями, мнениями и известными им фактами, чтобы все могли понять их позицию,
      - предложите участникам присоединиться к обсуждению и отвечать на комментарии.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  337cfc1a7b434acd:
    english: "When ready, raise a **poll** and invite members to vote. \nIf the issue is straightforward use a **Proposal** or if the issue is more complex use a **Sense check** poll to clearly ask fellow members how they feel about the proposal.\n- State the decision and invite people to vote,\n- ask people to leave a reason for their vote, particularly if they want to qualify any points,\n- choose the decision options that work for your board's decision-making processes.\n- You can ratify and minute the 'out-of-session' decision at your next board meeting."
    translation: "Когда будете готовы, создайте **голосование** и пригласите участников проголосовать. \nДля простого вопроса используйте **Предложение**. Если вопрос сложнее, используйте голосование **Проверка чувств**, чтобы узнать отношение участников к предложению.\n- Сформулируйте решение и пригласите участников проголосовать,\n- попросите участников объяснить свой голос, особенно если у них есть оговорки,\n- выберите варианты ответа, соответствующие порядку принятия решений вашим советом.\n- На следующем заседании совета вы можете утвердить решение, принятое между заседаниями, и внести его в протокол."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  19a80c3ce7d106e0:
    english: It's not a failure if a decision does not get agreement. You can ask members what changes they would make to enable them to agree to a decision. This helps you build to a better decision. A new Proposal with amendments is then more likely to achieve agreement.
    translation: Если участники не пришли к согласию, это не означает, что процесс не удался. Спросите, какие изменения помогли бы им поддержать решение. Так вы сможете доработать его. У нового предложения с поправками будет больше шансов получить поддержку.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b06f2d2a0e68f99d:
    english: State an **outcome** when the proposal closes. Let everyone know the result of the decision and what will happen next.
    translation: Когда предложение закроется, опубликуйте **заключение**. Сообщите всем, какое решение принято и что будет дальше.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6a4d6a8c978bcb11:
    english: "## Examples of out-of-session decisions"
    translation: "## Примеры решений между заседаниями"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fff64b1ac620cc4a:
    english: |-
      ### Decision about property purchase
      At the last board meeting, a property purchase was discussed. A director required an independent engineering report before making the decision. At the board meeting, the board agreed to purchase the property subject to a satisfactory engineering report. However as the purchase must be made before the next board meeting, the board agreed to upload the engineering report to Loomio when ready, for discussion and to make the final decision for the property purchase on Loomio.
    translation: |-
      ### Решение о покупке недвижимости
      На последнем заседании совет обсудил покупку недвижимости. Один из членов совета запросил независимое техническое заключение перед принятием окончательного решения. Совет согласился купить объект при условии, что заключение будет положительным. Поскольку покупку нужно совершить до следующего заседания, совет договорился загрузить заключение в Loomio, когда оно будет готово, обсудить его и принять там окончательное решение.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b279ed6b1c5aadfa:
    english: |-
      ### Decision to accept Directors and Officers Liability insurance
      During the board meeting it was noted that the annual insurance renewal was coming up. As this was considered to be an administrative matter, the board agreed to use Loomio to discuss the renewal application, seek the required information from each director, submit the application and to accept the insurance renewal quote.
    translation: |-
      ### Решение о страховании ответственности членов совета и руководителей
      На заседании выяснилось, что приближается срок ежегодного продления страховки. Совет счёл этот вопрос административным и договорился обсудить в Loomio заявку на продление, собрать необходимые сведения от каждого члена совета, подать заявку и принять предложение страховщика.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ca3a40286ca25a9a:
    english: |-
      ### A security breach has occurred at one of our facilities
      A break-in and theft of property has occurred that has put the corporation and staff at risk. Directors must be made aware of the event and risks, and evaluate an appropriate response.
    translation: |-
      ### Нарушение безопасности на одном из объектов организации
      На объекте произошли взлом и кража имущества, из-за которых организация и сотрудники оказались под угрозой. Членов совета необходимо известить о происшествии и рисках, чтобы они оценили возможные меры.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c406842807e1091b:
    english: |-
      ### A director has challenged the board about gender and diversity of board membership
      The director has provided good reasons and evidence that the board should diversify membership to be more representative of the corporation. Directors need to digest the information, ask questions, discuss the issue and decide a response.
    translation: |-
      ### Член совета поднял вопрос о гендерном и ином разнообразии состава совета
      Член совета привёл аргументы и данные в пользу того, чтобы состав совета лучше отражал состав организации. Остальным членам совета нужно изучить информацию, задать вопросы, обсудить тему и решить, как действовать.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bf35cdb4a62a85f4:
    english: "## Keeping a record of decisions made and supporting discussion"
    translation: "## Хранение решений и связанных с ними обсуждений"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6231d476f6bddb27:
    english: Record keeping is a legal requirement for governance boards and good practice for committees.
    translation: Для руководящих советов хранение документов — требование закона, а для комитетов — полезная практика.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  511470c795509c7e:
    english: Today, many organizations record and store formal minutes, resolutions, policies and key decisions electronically. Document records are created and approved, distributed and used, retained and stored, and ultimately disposed of.
    translation: Сегодня многие организации ведут и хранят официальные протоколы, решения, положения и другие важные документы в электронном виде. Документы составляют и утверждают, распространяют и используют, сохраняют, а по истечении срока хранения удаляют.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  324fc531e7a78088:
    english: |-
      ### On Loomio
      Minutes, reports, resolutions and other documents can be attached to a meeting **thread**, in the thread context, within a poll or any to thread comment.  This means the documents are always associated with the relevant discussion.
    translation: |-
      ### В Loomio
      Протоколы, отчёты, решения и другие документы можно прикрепить к **теме** заседания: в её описании, в голосовании или в комментарии. Так документы остаются связаны с нужным обсуждением.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9be58ccab5189118:
    english: A list of files can also be found under the **Files** tab.
    translation: Список файлов также доступен на вкладке **Файлы**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  24bc6a0bf5139b23:
    english: You can also add a link within any thread or poll to a document stored in your preferred document management system.  Find the online shareable link to the document, copy and paste into your thread, poll or comment.
    translation: В любую тему или голосование можно добавить ссылку на документ в вашей системе хранения документов. Найдите ссылку, по которой можно открыть документ, скопируйте её и вставьте в тему, голосование или комментарий.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4fee216f27a3fdff:
    english: Anyone with permission can then click the link to open and read the document.
    translation: Каждый, у кого есть доступ к документу, сможет перейти по ссылке и прочитать его.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9f0e1cd18ae1a402:
    english: Because Loomio discussions and decisions are always already documented, it provides a robust way to verify all your board's decision-making. You can easily demonstrate what was decided, and when. If directors have discussed and commented, as well as voted on a resolution—you will also know how and why each decision was reached.
    translation: Обсуждения и решения в Loomio сохраняются, поэтому вы можете проверить, как совет принимал решения. Легко установить, что и когда было решено. Если члены совета обсуждали вопрос, комментировали его и голосовали, вы также сможете узнать, как и почему было принято решение.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  71071cda2f1c034e:
    english: Over time, you are creating a history for your organization where you can easily search and find past decisions and related discussion.
    translation: Со временем в Loomio накопится история работы вашей организации. В ней можно будет найти прошлые решения и связанные с ними обсуждения.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  629c2034788a9fd5:
    english: In Loomio all data is written and stored on multiple disks and multiple locations, *in the cloud*, backed up daily.  Files uploaded are stored on servers that use modern techniques to remove bottlenecks and points of failure.
    translation: В Loomio данные хранятся на нескольких дисках в разных местах, *в облаке*. Резервные копии создаются ежедневно. Загруженные файлы хранятся на серверах, где применяются современные методы устранения узких мест и единых точек отказа.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
