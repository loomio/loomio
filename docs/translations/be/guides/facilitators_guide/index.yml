  e19d687b56819302:
    english: Hi! I'm Alanna.
    translation: Вітаю! Я Аланна.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  10352ad196487ff3:
    english: I'm one of the founders of Loomio, and I've been thinking deeply about how it works from a facilitation perspective since the beginning. I am not a seminal facilitation expert; I consider myself only a beginner in this craft that one could spend a lifetime honing.
    translation: Я адна з заснавальніц Loomio. З самага пачатку я шмат разважала пра тое, як сэрвіс дапамагае весці групавыя абмеркаванні. Я не лічу сябе выбітнай эксперткай у гэтай справе. Я толькі пачынаю яе асвойваць, а ўдасканальвацца ў ёй можна ўсё жыццё.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c637c96f9723f02d:
    english: What I can offer is help translating between the offline and online spaces, as a practitioner in both. I've facilitated a lot of groups who use Loomio, and learned from their experiences.
    translation: Я маю досвед вядзення абмеркаванняў і пры асабістых сустрэчах, і ў інтэрнэце, таму магу дапамагчы перанесці падыходы з аднаго асяроддзя ў другое. Я дапамагала многім групам, якія карыстаюцца Loomio, і вучылася на іх досведзе.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c376e38821fb6c2f:
    english: You can find out [more about me on my website](http://alanna.space).
    translation: Вы можаце [даведацца больш пра мяне на маім сайце](http://alanna.space).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b893957534fa37e2:
    english: I'm only one person, with one perspective and approach to facilitation, when there are myriad approaches. I've tried to bring in a couple other facilitator's voices here, including [Rich](http://richdecibels.com/) from Loomio and Silvia from [EXP](http://exp.agency).
    translation: У мяне толькі адзін погляд на вядзенне групавых абмеркаванняў, а падыходаў да гэтай справы шмат. Таму я таксама дадала сюды меркаванні іншых людзей з такім досведам, у тым ліку [Рыча](http://richdecibels.com/) з Loomio і Сільвіі з [EXP](http://exp.agency).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
