name: Oatmilk Cooperative
description: |
  We make oat milk for local cafes and shops. This group shows how we discuss an idea, check what people think, and prepare for a meeting.
group_privacy: closed
membership_granted_upon: invitation
cover_photo: vue/tests/e2e/fixtures/avatars/oatmilk-cooperative-cover.jpg
logo: vue/tests/e2e/fixtures/avatars/oatmilk-cooperative-logo.png
tags: [Start here, Board meetings, Office planning]

facilitator: jamie
people:
  - key: jamie
    name: Jamie Chen
    email: jamie@oatmilk.example
    username: jamie_oatmilk
    avatar: vue/tests/e2e/fixtures/avatars/jamie-chen.png
  - key: samira
    name: Samira Patel
    email: samira@oatmilk.example
    username: samira_oatmilk
    avatar: vue/tests/e2e/fixtures/avatars/samira-patel.png
  - key: alex
    name: Alex Morgan
    email: alex@oatmilk.example
    username: alex_oatmilk
    avatar: vue/tests/e2e/fixtures/avatars/alex-morgan.png

discussions:
  - key: bottle_trial
    actor: samira
    title: Should we try returnable bottles?
    tags: [Start here]
    description: |
      Three cafes have asked whether we could deliver oat milk in returnable glass bottles. A small trial could help us learn whether customers want this and whether we can manage the washing and collection work.

      What would we need to know before trying it? Share your thoughts below. After the discussion, use the open sense check to say whether the idea looks ready to develop further.
  - key: board_meeting
    actor: jamie
    title: Prepare for our next board meeting
    tags: [Board meetings]
    description_format: html
    description: |
      <h2>Next board meeting</h2>
      <p>Let's choose a time, review the previous minutes, and collect agenda requests here. <mark data-color="yellow">Please mark your availability and review the minutes before voting.</mark></p>
      <h3>Draft agenda</h3>
      <table><thead><tr><th>Item</th><th>Purpose</th><th>Lead</th></tr></thead><tbody>
      <tr><td>Returnable bottles</td><td>Discuss the sense check and questions still open</td><td>Samira</td></tr>
      <tr><td>Previous minutes</td><td>Approve or suggest a correction</td><td>Jamie</td></tr>
      <tr><td>Cafe deliveries</td><td>Review the new dispatch update</td><td>Alex</td></tr>
      </tbody></table>
      <h3>Previous meeting minutes</h3>
      <blockquote><p>We agreed to ask three cafes whether they would take part in a returnable bottle trial.</p></blockquote>
      <ul><li><strong>Samira:</strong> Check washing capacity and food-safety steps.</li><li><strong>Alex:</strong> Ask the cafes about deposits and bottle returns.</li></ul>
      <p><mark data-color="green">If the minutes are accurate, vote to approve them.</mark> If something needs correcting, explain the change in your vote or in this thread.</p>
  - key: office_move
    actor: jamie
    title: Is it time to move offices?
    tags: [Office planning]
    description: |
      Our current office is cramped, the plumbing is unreliable, and the journey takes too long for some of us. Before choosing a place, let's compare what everyone needs: a quiet place to work, enough room, parking, access for deliveries, and an affordable rent. A pet-friendly space would be welcome too.

      This thread follows the office search from an initial sense check through a budget poll and a proposal. The final vote shows how a concern about private meeting space was addressed.

comments:
  - discussion: bottle_trial
    actor: alex
    body: The cafes are interested, but I would start with only three so we can learn without promising more than we can deliver.
    reactions:
      - {person: jamie, emoji: "👍"}
  - discussion: bottle_trial
    actor: samira
    body: We have space to wash a small number of bottles. I would like to check the food-safety steps before we commit.
  - discussion: bottle_trial
    key: bottle_question
    actor: jamie
    body: Could we make this a six-week trial with a spending limit and a short update each week? How would the cafes return the empty bottles?
  - discussion: bottle_trial
    actor: alex
    reply_to: bottle_question
    deferred: true
    body: That sounds manageable. I can ask the cafes about deposits and whether they can give the empty bottles back to the driver on the next delivery.
    reactions:
      - {person: samira, emoji: "👍"}
  - discussion: board_meeting
    key: agenda_question
    actor: samira
    body: Could we add ten minutes for the bottle trial to the agenda? I have a food-safety question to raise.
  - discussion: board_meeting
    actor: jamie
    reply_to: agenda_question
    body: Yes. I will set aside ten minutes after the minutes review and note the food-safety question in the agenda.
    reactions:
      - {person: samira, emoji: "👍"}
  - discussion: office_move
    actor: alex
    body: I would welcome a more central office. My journey to the current site takes three hours on some days.
    reactions:
      - {person: jamie, emoji: "❤️"}
  - discussion: office_move
    key: meeting_room_question
    actor: samira
    body: Could one of the options include a quiet room where we can meet delivery partners privately?
  - discussion: office_move
    actor: jamie
    reply_to: meeting_room_question
    body: Yes. I will include private meeting space in the requirements and bring the room layouts and costs back before anyone decides to move.
    reactions:
      - {person: alex, emoji: "💡"}
polls:
  - key: bottle_trial_sense_check
    discussion: bottle_trial
    actor: jamie
    poll_type: check
    title: Is the returnable bottle trial worth developing?
    details: |
      We are considering a six-week trial with three cafes. This is a sense check, not final approval. Share whether the idea looks promising and what you would change before we make a decision.
    options: [looks_good, not_sure, concerned]
    closing_in_days: 7
    votes:
      - person: jamie
        choice: looks_good
        reason: A small trial would give us useful evidence before making a larger commitment.
      - person: samira
        choice: not_sure
        reason: I want us to confirm the washing and food-safety plan first.
  - key: meeting_time
    discussion: board_meeting
    actor: jamie
    poll_type: meeting
    title: Find a time for the next board meeting
    details: Mark the times when you are available. Times are displayed in your local time zone.
    meeting_duration: 90
    meeting_times:
      - {day_offset: 0, hour: 10}
      - {day_offset: 0, hour: 14}
      - {day_offset: 1, hour: 10}
      - {day_offset: 2, hour: 14}
    closing_in_days: 4
    votes:
      - person: jamie
        scores: [2, 2, 1, 0]
        reason: I can chair either session on the first day.
      - person: samira
        scores: [1, 2, 2, 0]
        reason: The afternoon or following morning avoids the production handover.
  - key: approve_minutes
    discussion: board_meeting
    actor: jamie
    poll_type: proposal
    title: Approve the previous board meeting minutes
    details: Review the minutes in this thread and approve them before the next meeting. Please describe any correction you need in your vote.
    options: [agree, abstain, disagree, block]
    closing_in_days: 5
    votes:
      - person: jamie
        choice: agree
        reason: The minutes record the decisions and assigned actions accurately.
  - key: office_sense_check
    discussion: office_move
    actor: jamie
    poll_type: check
    title: Shall I come back with some options for a new office?
    details: I will collect our requirements, agree a budget range with the group, and return with possible offices. This only asks whether to explore options; it does not decide that we will move.
    options: [looks_good, abstain, concerned]
    closing_in_days: 5
    closed: true
    outcome: There is enough interest to explore. I will find possible offices and bring them back with their costs and room layouts.
    votes:
      - person: jamie
        choice: looks_good
        reason: I have time to lead the search and bring options back.
      - person: samira
        choice: abstain
        reason: I want to see whether the options include private meeting space.
      - person: alex
        choice: looks_good
        reason: Comparing offices would help us understand whether my commute can improve.
  - key: office_budget
    discussion: office_move
    actor: jamie
    poll_type: poll
    title: Maximum budget for a new office?
    details: We have looked at Butler's ward, The Orchard, and Gasworks. For a place that meets nearly all our needs, what is the most we should spend each month? This poll informs the proposal; it does not approve a move or spending.
    options: ["Under £2,750 per month", "Under £3,000 per month", "Under £3,250 per month"]
    closing_in_days: 5
    closed: true
    outcome: Most of us favour staying under £3,000 per month. We will use that limit as we compare the offices and keep money available for other work.
    votes:
      - person: jamie
        choice: "Under £3,000 per month"
        reason: I would like to keep funds for product work and marketing.
      - person: samira
        choice: "Under £2,750 per month"
        reason: The lower rent gives us more room for unexpected costs.
      - person: alex
        choice: "Under £3,000 per month"
        reason: The shorter journeys would be valuable, but we still need to watch the total cost.
  - key: office_consent
    discussion: office_move
    actor: alex
    poll_type: proposal
    title: Move to The Orchard, Chalk Farm
    details: |
      I propose moving to The Orchard on 21 December. We would have 12 days of overlap with our current office. The Orchard meets our budget, has room for the team, and offers a shorter journey for many of us. I will coordinate a moving plan and confirm the room layout before we sign.

      Please raise any concern that makes this plan unsafe to try. We can improve the plan together in the comments.
    options: [consent, objection]
    closing_in_days: 7
    votes:
      - person: jamie
        choice: consent
        reason: The cost and location fit the needs we discussed.
      - person: samira
        choice: objection
        reason: I cannot see a private room where I could meet delivery partners. We need to resolve that before moving.
      - person: alex
        choice: consent
        reason: I have compared the options and this is the best fit for our needs.
    vote_changes:
      - person: samira
        choice: consent
        reason: The room Jamie identified, with a permitted partition wall, gives me the private meeting space I need.

poll_comments:
  - key: clarification
    poll: office_consent
    parent_vote_by: samira
    actor: jamie
    body: Alex and I checked the room layout. Would the smaller room beside the entrance work for these meetings? The landlord confirmed that we can add a partition wall to make it private.
  - key: agreement
    poll: office_consent
    reply_to: clarification
    actor: samira
    body: Yes, that room would work if the partition is part of the moving plan. Thank you for checking with the landlord.
  - key: revised_proposal
    poll: office_consent
    parent_vote_by: samira
    actor: alex
    body: I have added the private room and partition to the moving plan. We will confirm the room is ready before the new office opens.

notifications:
  - kind: poll_reminder
    poll: bottle_trial_sense_check
    actor: jamie
  - kind: new_discussion
    discussion: board_meeting
    actor: jamie
  - kind: poll_reminder
    poll: approve_minutes
    actor: jamie
