  37e2be2c73fbb06d:
    english: "## Turn off external notifications"
    translation: "## Externe Benachrichtigungen ausschalten"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5e3d442fa885bcd4:
    english: To stop email and push messages for group and thread activity, open **Notification settings** from your user menu, set the catch-up to **Never**, and choose **No email updates** and **No push updates**. Notifications and activity remain available when you open Loomio.
    translation: Um E-Mail- und Push-Nachrichten zu Aktivitäten in Gruppen und Threads zu stoppen, öffne die **Benachrichtigungseinstellungen** über dein Benutzermenü. Stelle die Zusammenfassung auf **Niemals** und wähle **Keine E-Mail-Updates** und **Keine Push-Updates**. Benachrichtigungen und Aktivitäten sind weiterhin verfügbar, wenn du Loomio öffnest.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
