  0431c9fc46658338:
    english: 'The group participation report gives insights into the usage of your Loomio group. '
    translation: A csoport részvételi jelentése megmutatja, hogyan használják a Loomio-csoportodat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0d23c0831f1ea6ca:
    english: 'You''re able to choose which groups to include in the report, the start and end date for the report, and the interval (year, month, week or day) for grouping results. '
    translation: Kiválaszthatod, mely csoportok szerepeljenek a jelentésben, megadhatod a kezdő és záró dátumot, valamint azt, hogy az eredmények éves, havi, heti vagy napi bontásban jelenjenek meg.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  73c9822c08a37866:
    english: The report is available to everyone in your group, however users can only see results for groups that they belong to, this means that different users may see slightly different reports.
    translation: A jelentést a csoportod minden tagja elérheti, de mindenki csak azoknak a csoportoknak az adatait láthatja, amelyekhez tartozik. Ezért a különböző tagok kissé eltérő jelentéseket láthatnak.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c9402b4720639f86:
    english: 'You can find the report by clicking the group settings menu cog, as shown below. '
    translation: A jelentést a csoport beállításainak fogaskerék ikonjára kattintva találod meg, ahogy az alábbi képen látható.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
