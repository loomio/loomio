---
navigation_title: Receber envios privados
blocks:
  c4a53a596a037fc0:
    english: "# Collect private submissions"
    translation: "# Receber envios privados"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b24abc6bf93b1c0f:
    english: Use a Closed group to collect private submissions from people who are not members of the group. Each submission becomes a separate discussion that the submitter and the group's review team can use to exchange information, ask questions, and record a decision. Submitters cannot see other private discussions or submissions in the group.
    translation: Use um grupo Fechado para receber envios privados de pessoas que não são membros do grupo. Cada envio se torna uma discussão separada, na qual a pessoa que enviou e a equipe responsável pela análise podem trocar informações, fazer perguntas e registrar uma decisão. Quem envia não pode ver outras discussões privadas nem outros envios no grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  feb5105698bca188:
    english: Nominations are a clear use case when candidate details or the list of nominees must remain private during selection. A person can nominate themselves or someone else for an election, appointment, committee, board, or representative role, while a selection panel reviews each nomination in its own discussion.
    translation: Indicações são um exemplo de uso quando os dados das pessoas candidatas ou a lista de pessoas indicadas precisam permanecer privados durante a seleção. Uma pessoa pode indicar a si mesma ou outra pessoa para uma eleição, nomeação, comissão, conselho ou função de representação. Uma comissão de seleção analisa cada indicação em uma discussão própria.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a64597508a4f7f3d:
    english: 'Other suitable purposes where submissions should not be public include:'
    translation: 'Outros casos em que os envios não devem ser públicos incluem:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e4bd382899a8e7d9:
    english: |-
      - Complaints, safeguarding reports, safety concerns, and incident reports
      - Appeals and requests to reconsider a decision about an individual case
      - Requests for mediation, conflict resolution, or personal support
      - Applications containing personal, financial, or eligibility information, such as hardship grants or scholarships
      - Sealed bids or tender responses that must remain private during assessment
    translation: |-
      - Reclamações, relatos de situações de risco, preocupações com a segurança e relatórios de incidentes
      - Recursos e pedidos de reconsideração de uma decisão sobre um caso individual
      - Pedidos de mediação, resolução de conflitos ou apoio pessoal
      - Inscrições com informações pessoais, financeiras ou sobre critérios de elegibilidade, como pedidos de auxílio financeiro ou bolsas de estudo
      - Propostas em envelope fechado ou respostas a licitações que precisam permanecer privadas durante a avaliação
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bab86da011a22a2a:
    english: This workflow is private between submitters, but it is not anonymous. Submitters need a user account, and every member of the Closed group can see the submissions. Consider who belongs to the review group before using it for sensitive information.
    translation: Esse processo mantém os envios privados entre as pessoas que os fazem, mas não é anônimo. Cada pessoa precisa de uma conta de usuário, e todos os membros do grupo Fechado podem ver os envios. Antes de usar o grupo para informações confidenciais, considere quem faz parte da equipe responsável pela análise.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b82ae8f3f04d257f:
    english: "## Enable private submissions"
    translation: "## Habilitar envios privados"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0cebe3c5801844ce:
    english: You must be an admin of the group or subgroup where you want to collect submissions.
    translation: Você precisa ser administrador do grupo ou subgrupo em que deseja receber os envios.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  831d833d53a12ece:
    english: |-
      1. Open the group.
      2. Select **Settings** (or **More** and then **Edit group settings**).
      3. Open **Permissions**.
      4. Enable **Non-members can start discussions**.
      5. Save the group settings.
    translation: |-
      1. Abra o grupo.
      2. Selecione **Configurações** (ou **Mais** e depois **Editar configurações do grupo**).
      3. Abra **Permissões**.
      4. Habilite **Quem não é membro pode iniciar discussões.**
      5. Salve as configurações do grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f3962a27b1c4ffa8:
    english: "![The Permissions tab in group settings, with Non-members can start discussions highlighted](non_members_can_start_discussions.png)"
    translation: "![A aba Permissões nas configurações do grupo, com Quem não é membro pode iniciar discussões. em destaque](non_members_can_start_discussions.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  99ace15d10e78f33:
    english: This option is available only for **Open** and **Closed** groups. It is hidden for **Secret** groups. If you cannot see it, open **Privacy** in the group settings and change **Group privacy** to **Closed** (recommended for private submissions) or **Open**, then return to **Permissions**.
    translation: Esta opção está disponível apenas para grupos **Aberto** e **Encerrado**. Ela fica oculta para grupos **Secreto**. Se você não a encontrar, abra **Privacidade** nas configurações do grupo e altere **Privacidade do grupo** para **Encerrado** (recomendado para contribuições privadas) ou **Aberto**. Depois, volte a **Permissões**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  449517e6293a3acc:
    english: Enabling this permission does not make the group's discussions public. A non-member can start a new discussion and access that discussion as a guest, but cannot see the group's other private discussions.
    translation: Habilitar essa permissão não torna públicas as discussões do grupo. Quem não é membro pode iniciar uma discussão e acessá-la como convidado, mas não pode ver as outras discussões privadas do grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  151f68a3f638fb67:
    english: "## Set up a private submission process"
    translation: "## Configurar um processo de envios privados"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ae924433d81f5eac:
    english: |-
      1. Create a dedicated subgroup for the submission process and set its privacy to **Closed**. A subgroup keeps the submissions separate from the parent group's other work.
      2. Add the selection panel or other people responsible for reviewing submissions as members of the subgroup. Every subgroup member can see every submission, so add only people who should have that access.
      3. Create a [discussion template](/en/user_manual/discussions/templates) in the subgroup. Include the questions and information submitters should provide. You can create different discussion templates for different kinds of submissions.
      4. If submitters should not request subgroup membership, set membership to **Invitation only**.
      5. [Enable private submissions](#enable-private-submissions) in the subgroup's permissions.
      6. Test the process with an account that is not a member of the subgroup.
      7. Share the subgroup page with prospective submitters. They must sign in to their user account before making a submission.
    translation: |-
      1. Crie um subgrupo dedicado ao processo de envio e defina sua privacidade como **Fechado**. Assim, os envios ficam separados das outras atividades do grupo principal.
      2. Adicione ao subgrupo os membros da comissão de seleção ou outras pessoas responsáveis por analisar os envios. Todos os membros do subgrupo podem ver todos os envios. Adicione apenas quem deve ter esse acesso.
      3. Crie um [modelo de discussão](/en/user_manual/discussions/templates) no subgrupo. Inclua as perguntas e informações que as pessoas devem fornecer. Você pode criar modelos de discussão diferentes para cada tipo de envio.
      4. Se as pessoas que enviam não devem solicitar participação no subgrupo, defina a participação como **Somente por convite**.
      5. [Habilite os envios privados](#enable-private-submissions) nas permissões do subgrupo.
      6. Teste o processo com uma conta que não pertença ao subgrupo.
      7. Compartilhe a página do subgrupo com as pessoas que poderão enviar informações. Elas precisam entrar na conta de usuário antes de fazer um envio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3acec1b4a6724a65:
    english: "## Make a submission"
    translation: "## Fazer um envio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  58f96f48b6aacf65:
    english: The submitter opens the subgroup and selects **Start discussion**. Loomio shows the subgroup's available discussion templates. The submitter selects the relevant discussion template, completes its questions, and starts the discussion.
    translation: A pessoa abre o subgrupo e seleciona **Iniciar discussão**. O Loomio mostra os modelos de discussão disponíveis no subgrupo. A pessoa escolhe o modelo adequado, responde às perguntas e inicia a discussão.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5a65043771edeb44:
    english: The discussion belongs to the subgroup, but the submitter does not become a subgroup member. Loomio adds them as a guest of their discussion thread, enabling them to see and participate in the discussion with the panel or review team. They cannot see other private discussions or submissions in the subgroup.
    translation: A discussão pertence ao subgrupo, mas a pessoa que fez o envio não se torna membro dele. O Loomio a adiciona como convidada da discussão. Assim, ela pode ver a discussão e participar dela com a comissão ou a equipe responsável pela análise. Ela não pode ver outras discussões privadas nem outros envios no subgrupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9338fd073b26dafc:
    english: "## Review submissions"
    translation: "## Analisar os envios"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  50e33fa0f0868cf5:
    english: Subgroup members can see every submission discussion in the subgroup. They can ask follow-up questions and use comments, polls, or other discussion tools to complete their review.
    translation: Os membros do subgrupo podem ver todas as discussões iniciadas por envios. Eles podem fazer perguntas adicionais e usar comentários, enquetes ou outras ferramentas da discussão para concluir a análise.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  537b76c6f85cc575:
    english: If another person needs to provide information, a subgroup member with permission can invite them to the submission discussion. For example, when a nominator submits a nomination, the subgroup can invite the nominee to the thread if their participation is required. The invited person joins as a guest without gaining access to the subgroup's other private discussions.
    translation: Se outra pessoa precisar fornecer informações, um membro do subgrupo com permissão pode convidá-la para a discussão do envio. Por exemplo, quando alguém indica outra pessoa, o subgrupo pode convidar a pessoa indicada para a discussão caso sua participação seja necessária. Ela entra como convidada, sem acesso às outras discussões privadas do subgrupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1fb7da309186b19e:
    english: Each submitter can see their own submission but cannot see the subgroup's other private discussions or submissions. Disable **Non-members can start discussions** when submissions close. Existing discussions and guest access are unchanged.
    translation: Cada pessoa pode ver o próprio envio, mas não pode ver outras discussões privadas nem outros envios do subgrupo. Desabilite **Quem não é membro pode iniciar discussões.** quando o prazo para envios terminar. As discussões existentes e o acesso de convidados permanecem iguais.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
