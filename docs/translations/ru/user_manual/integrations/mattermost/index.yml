  3955d3033be2b126:
    english: 'Loomio can send notifications into your Mattermost channels when new discussions, proposals, comments, votes, and outcomes occur. '
    translation: Loomio может отправлять уведомления в каналы Mattermost о новых обсуждениях, предложениях, комментариях, голосах и заключениях.
