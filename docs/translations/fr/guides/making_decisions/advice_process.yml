  a0a3c706db8ca405:
    english: "| **Advice process** | **On Loomio** |\n|---|---|\n| You notice a problem or opportunity and take the initiative. |  |\n| Seek input to sound out perspectives before proposing action. | Start a Loomio **discussion** to provide context and open conversation. Run an **[Advice proposal](/en/user_manual/polls/proposals/advice/)** when you want a defined response period, vote reasons, and a clear record of who participated. |\n| Taking advice received into account, you make a decision and inform the people who have given advice. | Add an an **outcome** to the discussion thread.   <br /><br />State the decision made and thank people for their advice and feedback.  <br /><br />   Say what will happen next and notify people about the outcome.  <br /><br />The outcome statement is an important record of the decision for future reference. <br /> <br /> Either update the context to include this outcome, or state it in a comment you pin to the timeline to quickly find it in the future.<br /><br/> |        "
    translation: |-
      | **Processus de conseil** | **Sur Loomio** |
      |---|---|
      | Vous repérez un problème ou une occasion à saisir et prenez l’initiative. |  |
      | Demandez des avis pour explorer différents points de vue avant de proposer une action. | Lancez une **discussion** sur Loomio pour présenter le contexte et ouvrir l’échange. Lancez une **[proposition de conseil](/en/user_manual/polls/proposals/advice/)** si vous souhaitez fixer une période de réponse, recueillir les raisons des votes et garder une trace claire des personnes qui ont participé. |
      | Vous tenez compte des conseils reçus, prenez une décision et en informez les personnes qui vous ont conseillé. | Ajoutez une **conclusion** au fil de discussion.   <br /><br />Présentez la décision prise et remerciez les personnes pour leurs conseils et leurs retours.  <br /><br />   Indiquez ce qui se passera ensuite et informez les personnes de la conclusion.  <br /><br />La conclusion constitue une trace de la décision à consulter ultérieurement. <br /> <br /> Vous pouvez intégrer cette conclusion au contexte de la discussion ou l’écrire dans un commentaire épinglé au fil pour la retrouver rapidement.<br /><br/> |
    status: machine
