    english: Webhook payloads are presentation-oriented messages intended for chat services. They are not complete serialized Loomio records. Links in the message identify the affected Loomio content; an integration can follow up through the User API when it needs structured current state.
    translation: Los datos enviados por los webhooks son mensajes preparados para servicios de chat. No contienen registros completos de Loomio en formato serializado. Los enlaces del mensaje identifican el contenido de Loomio afectado; una integración puede consultar después la API de usuario si necesita datos estructurados y actualizados.
