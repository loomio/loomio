---
navigation_title: Recueillir des contributions privées
blocks:
  c4a53a596a037fc0:
    english: "# Collect private submissions"
    translation: "# Recueillir des contributions privées"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b24abc6bf93b1c0f:
    english: Use a Closed group to collect private submissions from people who are not members of the group. Each submission becomes a separate discussion that the submitter and the group's review team can use to exchange information, ask questions, and record a decision. Submitters cannot see other private discussions or submissions in the group.
    translation: Utilisez un groupe Fermé pour recueillir des contributions privées de personnes qui n’en sont pas membres. Chaque contribution devient une discussion distincte. Son auteur et l’équipe chargée de l’examiner peuvent y échanger des informations, poser des questions et consigner une décision. Les auteurs ne peuvent pas voir les autres discussions ou contributions privées du groupe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  feb5105698bca188:
    english: Nominations are a clear use case when candidate details or the list of nominees must remain private during selection. A person can nominate themselves or someone else for an election, appointment, committee, board, or representative role, while a selection panel reviews each nomination in its own discussion.
    translation: Ce fonctionnement convient aux candidatures lorsque les informations sur les candidats ou la liste des personnes proposées doivent rester privées pendant la sélection. Une personne peut proposer sa propre candidature ou celle de quelqu’un d’autre à une élection, une nomination, un comité, un conseil ou un poste de représentation. Le comité de sélection examine chaque candidature dans une discussion distincte.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a64597508a4f7f3d:
    english: 'Other suitable purposes where submissions should not be public include:'
    translation: 'Vous pouvez aussi l’utiliser pour d’autres contributions qui ne doivent pas être publiques :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e4bd382899a8e7d9:
    english: |-
      - Complaints, safeguarding reports, safety concerns, and incident reports
      - Appeals and requests to reconsider a decision about an individual case
      - Requests for mediation, conflict resolution, or personal support
      - Applications containing personal, financial, or eligibility information, such as hardship grants or scholarships
      - Sealed bids or tender responses that must remain private during assessment
    translation: |-
      - Plaintes, signalements liés à la protection des personnes, préoccupations concernant la sécurité et rapports d’incident
      - Recours et demandes de réexamen d’une décision concernant un cas individuel
      - Demandes de médiation, de résolution de conflit ou de soutien personnel
      - Candidatures contenant des informations personnelles, financières ou relatives aux critères d’admissibilité, comme des demandes d’aide financière ou de bourse
      - Offres sous pli fermé ou réponses à un appel d’offres qui doivent rester privées pendant leur évaluation
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bab86da011a22a2a:
    english: This workflow is private between submitters, but it is not anonymous. Submitters need a user account, and every member of the Closed group can see the submissions. Consider who belongs to the review group before using it for sensitive information.
    translation: Les contributions restent privées entre leurs auteurs, mais elles ne sont pas anonymes. Chaque auteur doit disposer d’un compte utilisateur, et tous les membres du groupe Fermé peuvent voir les contributions. Avant d’utiliser ce fonctionnement pour des informations sensibles, vérifiez qui fait partie du groupe chargé de les examiner.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b82ae8f3f04d257f:
    english: "## Enable private submissions"
    translation: "## Activer les contributions privées"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0cebe3c5801844ce:
    english: You must be an admin of the group or subgroup where you want to collect submissions.
    translation: Vous devez être administrateur du groupe ou du sous-groupe dans lequel vous souhaitez recueillir les contributions.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  831d833d53a12ece:
    english: |-
      1. Open the group.
      2. Select **Settings** (or **More** and then **Edit group settings**).
      3. Open **Permissions**.
      4. Enable **Non-members can start discussions**.
      5. Save the group settings.
    translation: |-
      1. Ouvrez le groupe.
      2. Sélectionnez **Paramètres** (ou **Plus**, puis **Modifier les paramètres du groupe**).
      3. Ouvrez **Permissions**.
      4. Activez **Les non-membres peuvent démarrer des discussions**.
      5. Enregistrez les paramètres du groupe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f3962a27b1c4ffa8:
    english: "![The Permissions tab in group settings, with Non-members can start discussions highlighted](non_members_can_start_discussions.png)"
    translation: "![L’onglet Permissions des paramètres du groupe, avec l’option Les non-membres peuvent démarrer des discussions mise en évidence](non_members_can_start_discussions.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  99ace15d10e78f33:
    english: This option is available only for **Open** and **Closed** groups. It is hidden for **Secret** groups. If you cannot see it, open **Privacy** in the group settings and change **Group privacy** to **Closed** (recommended for private submissions) or **Open**, then return to **Permissions**.
    translation: Cette option est disponible uniquement pour les groupes **Ouvert** et **Fermé**. Elle est masquée pour les groupes **Secret**. Si vous ne la voyez pas, ouvrez **Confidentialité** dans les paramètres du groupe et réglez **Confidentialité du groupe** sur **Fermé** (recommandé pour les contributions privées) ou **Ouvert**, puis revenez à **Permissions**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  449517e6293a3acc:
    english: Enabling this permission does not make the group's discussions public. A non-member can start a new discussion and access that discussion as a guest, but cannot see the group's other private discussions.
    translation: Activer cette permission ne rend pas publiques les discussions du groupe. Une personne qui n’est pas membre peut lancer une discussion et y accéder en tant qu’invitée, mais elle ne peut pas voir les autres discussions privées du groupe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  151f68a3f638fb67:
    english: "## Set up a private submission process"
    translation: "## Mettre en place un processus de contribution privée"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ae924433d81f5eac:
    english: |-
      1. Create a dedicated subgroup for the submission process and set its privacy to **Closed**. A subgroup keeps the submissions separate from the parent group's other work.
      2. Add the selection panel or other people responsible for reviewing submissions as members of the subgroup. Every subgroup member can see every submission, so add only people who should have that access.
      3. Create a [discussion template](/en/user_manual/discussions/templates) in the subgroup. Include the questions and information submitters should provide. You can create different discussion templates for different kinds of submissions.
      4. If submitters should not request subgroup membership, set membership to **Invitation only**.
      5. [Enable private submissions](#enable-private-submissions) in the subgroup's permissions.
      6. Test the process with an account that is not a member of the subgroup.
      7. Share the subgroup page with prospective submitters. They must sign in to their user account before making a submission.
    translation: |-
      1. Créez un sous-groupe consacré aux contributions et réglez sa confidentialité sur **Fermé**. Le sous-groupe permet de séparer les contributions des autres activités du groupe parent.
      2. Ajoutez au sous-groupe les membres du comité de sélection ou les autres personnes chargées d’examiner les contributions. Chaque membre du sous-groupe peut voir toutes les contributions. N’ajoutez donc que les personnes qui doivent y avoir accès.
      3. Créez un [modèle de discussion](/en/user_manual/discussions/templates) dans le sous-groupe. Précisez les questions auxquelles les auteurs doivent répondre et les informations à fournir. Vous pouvez créer différents modèles de discussion selon le type de contribution.
      4. Si les auteurs ne doivent pas pouvoir demander à rejoindre le sous-groupe, réglez l’adhésion sur **Sur invitation uniquement**.
      5. [Activez les contributions privées](#enable-private-submissions) dans les permissions du sous-groupe.
      6. Testez le processus avec un compte qui n’est pas membre du sous-groupe.
      7. Partagez la page du sous-groupe avec les personnes susceptibles de contribuer. Elles doivent se connecter à leur compte utilisateur avant de déposer une contribution.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3acec1b4a6724a65:
    english: "## Make a submission"
    translation: "## Déposer une contribution"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  58f96f48b6aacf65:
    english: The submitter opens the subgroup and selects **Start discussion**. Loomio shows the subgroup's available discussion templates. The submitter selects the relevant discussion template, completes its questions, and starts the discussion.
    translation: La personne qui souhaite contribuer ouvre le sous-groupe et sélectionne **Lancer une discussion**. Loomio affiche les modèles de discussion disponibles dans le sous-groupe. Elle choisit le modèle approprié, répond aux questions et lance la discussion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5a65043771edeb44:
    english: The discussion belongs to the subgroup, but the submitter does not become a subgroup member. Loomio adds them as a guest of their discussion thread, enabling them to see and participate in the discussion with the panel or review team. They cannot see other private discussions or submissions in the subgroup.
    translation: La discussion appartient au sous-groupe, mais son auteur n’en devient pas membre. Loomio l’ajoute comme invité de son fil de discussion. Il peut ainsi consulter la discussion et y participer avec le comité ou l’équipe chargée de l’examen. Il ne peut pas voir les autres discussions ou contributions privées du sous-groupe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9338fd073b26dafc:
    english: "## Review submissions"
    translation: "## Examiner les contributions"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  50e33fa0f0868cf5:
    english: Subgroup members can see every submission discussion in the subgroup. They can ask follow-up questions and use comments, polls, or other discussion tools to complete their review.
    translation: Les membres du sous-groupe peuvent voir toutes les discussions liées aux contributions. Ils peuvent poser des questions complémentaires et utiliser les commentaires, les sondages ou d’autres outils de discussion pour mener leur examen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  537b76c6f85cc575:
    english: If another person needs to provide information, a subgroup member with permission can invite them to the submission discussion. For example, when a nominator submits a nomination, the subgroup can invite the nominee to the thread if their participation is required. The invited person joins as a guest without gaining access to the subgroup's other private discussions.
    translation: Si une autre personne doit fournir des informations, un membre du sous-groupe qui en a la permission peut l’inviter à la discussion. Par exemple, lorsqu’une personne propose la candidature de quelqu’un d’autre, le sous-groupe peut inviter la personne proposée à rejoindre le fil si sa participation est nécessaire. La personne invitée devient une invitée de la discussion, sans accéder aux autres discussions privées du sous-groupe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1fb7da309186b19e:
    english: Each submitter can see their own submission but cannot see the subgroup's other private discussions or submissions. Disable **Non-members can start discussions** when submissions close. Existing discussions and guest access are unchanged.
    translation: Chaque auteur peut voir sa propre contribution, mais pas les autres discussions ou contributions privées du sous-groupe. Désactivez **Les non-membres peuvent démarrer des discussions** lorsque la période de dépôt prend fin. Les discussions existantes et l’accès des invités restent inchangés.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
