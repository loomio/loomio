  e19d687b56819302:
    english: Hi! I'm Alanna.
    translation: Hola, soy Alanna.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  10352ad196487ff3:
    english: I'm one of the founders of Loomio, and I've been thinking deeply about how it works from a facilitation perspective since the beginning. I am not a seminal facilitation expert; I consider myself only a beginner in this craft that one could spend a lifetime honing.
    translation: Soy una de las fundadoras de Loomio. Desde el principio he reflexionado sobre cómo funciona desde la perspectiva de la facilitación. No soy una gran experta en este campo; me considero una principiante en un oficio que podría perfeccionar durante toda una vida.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c637c96f9723f02d:
    english: What I can offer is help translating between the offline and online spaces, as a practitioner in both. I've facilitated a lot of groups who use Loomio, and learned from their experiences.
    translation: Puedo ayudar a conectar la facilitación presencial con la facilitación en línea porque tengo experiencia en ambas. He facilitado el trabajo de muchos grupos que usan Loomio y he aprendido de sus experiencias.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c376e38821fb6c2f:
    english: You can find out [more about me on my website](http://alanna.space).
    translation: Puedes saber [más sobre mí en mi sitio web](http://alanna.space).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b893957534fa37e2:
    english: I'm only one person, with one perspective and approach to facilitation, when there are myriad approaches. I've tried to bring in a couple other facilitator's voices here, including [Rich](http://richdecibels.com/) from Loomio and Silvia from [EXP](http://exp.agency).
    translation: Soy una sola persona, con una perspectiva y una forma de facilitar entre muchas posibles. Por eso he intentado incluir aquí las voces de otras personas facilitadoras, entre ellas [Rich](http://richdecibels.com/), de Loomio, y Silvia, de [EXP](http://exp.agency).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
