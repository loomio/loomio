  dcf90e79aba1a2f9:
    english: |-
      1. Select the text you want to link to - say the name of a document.
      2. Click the link icon.
      3. Paste the address into the **Insert link** field and select **Apply**.
    translation: |-
      1. Selecione o texto que receberá o link, como o nome de um documento.
      2. Clique no ícone de link.
      3. Cole o endereço no campo **Inserir link** e selecione **Aplicar**.
