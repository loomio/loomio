  a37f91309a44b472:
    english: Delete removes the user and records the user created. Comments are removed from threads, votes are removed from polls, and groups, discussions, polls, and other records created by the user may also be deleted through database associations.
    translation: A exclusão remove o usuário e os registros que ele criou. Os comentários são removidos dos tópicos, os votos são removidos das enquetes e grupos, discussões, enquetes e outros registros criados pelo usuário também podem ser excluídos por meio das associações do banco de dados.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  537bd891e445eb93:
