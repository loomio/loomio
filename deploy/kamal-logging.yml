# Merge into the current Kamal 2.12+ configuration; preserve unrelated options.
logging:
  driver: json-file
  options:
    max-size: 20m
    max-file: "3"

proxy:
  run:
    # The syslog driver accepts cache size options instead of max-size.
    log_max_size: null
    options:
      log-driver: syslog
      log-opt:
        - syslog-address=unixgram:///var/spool/rsyslog/loomio-access.sock
        - syslog-format=rfc5424micro
        - tag=loomio-access
        - cache-max-size=20m
        - cache-max-file=3

accessories:
  redis_cache:
    options:
      log-driver: json-file
      log-opt:
        - max-size=20m
        - max-file=3
