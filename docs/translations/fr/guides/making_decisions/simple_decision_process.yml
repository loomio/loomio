navigation_title: Processus de décision simple
blocks:
  84ddd86a61d09414:
    english: "# Simple decision process"
    translation: "# Processus de décision simple"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2e868ae6bc4a493b:
    english: This guide describes an end-to-end process using a discussion, Sense check, final proposal, and outcome. For help with the fields and response options of one proposal, see [Proposals](/en/user_manual/polls/proposals/).
    translation: Ce guide présente un processus complet, de la discussion à la conclusion, en passant par une vérification des sens et une proposition finale. Pour en savoir plus sur les champs et les options de réponse d’une proposition, consultez [Propositions](/en/user_manual/polls/proposals/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d9877680762afa22:
    english: Some organizations arrive at Loomio having already developed a deep culture and practice of collaborative decision making.  Such organizations have often written handbooks and codified their practices, however, most organizations are still on the journey and looking for some helpful first steps towards making better decisions together.  If the burning question in your organization is **how do we make decisions together?**, then this guide is for you.
    translation: Certaines organisations utilisent Loomio alors qu’elles ont déjà une solide pratique de la prise de décision collective. Elles ont souvent rédigé des guides et défini leurs méthodes. Mais beaucoup cherchent encore par où commencer pour prendre de meilleures décisions ensemble. Si votre organisation se demande **comment prendre des décisions ensemble ?**, ce guide peut vous aider.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6b321a0ba71f92b8:
    english: "***Here are three steps to help you co-create a better, more cohesive decision with less stress and anxiety.***"
    translation: "***Voici trois étapes pour élaborer ensemble une décision plus solide et plus cohérente, avec moins de stress.***"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c46b32b56b933b0a:
    english: "## Simple decision making - in 3 steps"
    translation: "## Prendre une décision en 3 étapes"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e3208a84f88ba36f:
    english: Good collaborative decisions rarely happen by themselves.  They almost always benefit from someone facilitating the discussion through to decision.  So when you launch a discussion thread, you take on a facilitation role (unless someone else is facilitating).
    translation: Une bonne décision collective demande généralement une personne pour animer la discussion jusqu’à la décision. Lorsque vous lancez une discussion, vous assumez ce rôle, à moins qu’une autre personne ne s’en charge.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1a1da8788ddb01c7:
    english: Follow these 3 steps as you facilitate your group to make a good decision.
    translation: Suivez ces trois étapes pour aider votre groupe à prendre une bonne décision.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5b83a53a3f4caad5:
    english: |-
      ### Step 1 - Introduce and discuss
      Start a Loomio **discussion** to introduce the topic, open conversation and invite people. Include all the context-setting information your group needs to meaningfully participate, along with relevant background so everyone understands the purpose.
    translation: |-
      ### Étape 1 - Présenter et discuter
      Lancez une **discussion** sur Loomio pour présenter le sujet, ouvrir l’échange et inviter les personnes concernées. Donnez à votre groupe les informations nécessaires pour participer et comprendre l’objectif.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8aab998cb04b8635:
    english: 'Be clear about your objective - what is the decision to be made or intended outcome of the discussion? '
    translation: 'Précisez votre objectif : quelle décision faut-il prendre, ou quelle conclusion attendez-vous de la discussion ?'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d8f53cbae173f5ac:
    english: As the discussion progresses, create space for diverse input - sometimes the best ideas and input come from outside the box.  Work together to explore and test ideas, encouraging a healthy and open discussion.
    translation: Au fil de la discussion, faites place à des points de vue variés. Les idées les plus utiles peuvent être inattendues. Explorez et examinez les idées ensemble, dans un échange ouvert.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7f447ab455f6cea4:
    english: 'Notice when the same voices are dominating and invite some of the quieter people to contribute by @mentioning them and asking them what they think. '
    translation: Si les mêmes personnes prennent souvent la parole, invitez celles qui s’expriment moins à contribuer en les mentionnant avec @ et en leur demandant leur avis.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d4bad2b5207ac1d8:
    english: You can make a complex discussion easier to engage with by updating the context section with a summary of the key points.
    translation: Pour faciliter la participation à une discussion complexe, ajoutez un résumé des points clés dans la section consacrée au contexte.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  daeddff561f62553:
    english: |-
      ### Step 2 - Sense check
      As your group begins to converge on path forwards, use a **Sense check** poll to survey opinions and test how the group feels.
    translation: |-
      ### Étape 2 - Vérification des sens
      Lorsque votre groupe commence à s’accorder sur la suite, utilisez un sondage **Vérification des sens** pour recueillir les avis.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c1d4e97ce180d85b:
    english: |-
      A ‘Sense check’ lets people know a proposal is forming and encourages them to engage.
      It can also be used to clarify an issue, even if the solution might not be apparent yet.
    translation: |-
      Une « vérification des sens » indique qu’une proposition prend forme et invite les personnes à participer.
      Elle peut aussi aider à clarifier une question, même si la solution n’est pas encore évidente.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5ff914227bb8706a:
    english: Sense check is a great way to surface concerns before moving to a formal agreement.  You can find out if people are happy with where this is going, if they have questions or need more time, or if they are concerned.
    translation: La vérification des sens permet de faire apparaître les préoccupations avant de chercher un accord formel. Vous pouvez savoir si la direction proposée convient, si des questions restent ouvertes, si davantage de temps est nécessaire ou si certaines personnes ont des réserves.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  01433544fefb70a5:
    english: 'Use feedback to improve and refine the proposal. If there’s still some work to do, you may need to go back to Step 1 and then run another Sense check round. '
    translation: Utilisez ces retours pour améliorer la proposition. S’il reste du travail à faire, revenez à l’étape 1, puis lancez une nouvelle vérification des sens.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  440474199fd76019:
    english: Good engagement will help you assess when you are ready to proceed to a proposal.
    translation: La participation du groupe vous aidera à déterminer quand passer à une proposition.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f3799fd76f9d9446:
    english: "### Step 3 - Proposal\nNow when you raise a formal **Proposal**, you do so with confidence that it will pass. "
    translation: |-
      ### Étape 3 - Proposition
      Vous pouvez maintenant soumettre une **Proposition** formelle avec de bonnes chances qu’elle soit acceptée.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a3e74110f5a3c7a2:
    english: There may have been a lot of discussion and variations suggested, so be specific about the decision being made, so that everyone knows what the voting options mean.
    translation: Après les échanges et les différentes versions envisagées, décrivez précisément la décision à prendre pour que chacun comprenne ce que signifient les options de vote.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b7581cfd1ecffd78:
    english: Set proposal deadlines consciously, so group members have time to consider and engage.  You can always extend the closing date if need be.
    translation: Fixez l’échéance de la proposition de façon à laisser aux membres du groupe le temps d’y réfléchir et de participer. Vous pourrez prolonger cette échéance si nécessaire.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b5bcc06f15cde560:
    english: This step is important to formalize agreement with people’s vote and to state an outcome - what just happened and what will happen next.
    translation: 'Cette étape permet de formaliser l’accord par un vote et d’énoncer une conclusion : ce qui a été décidé et ce qui va suivre.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c2f2bbcacfd77ab0:
    english: Proposal results are logged, along with a record of the discussion leading to the decision.
    translation: Les résultats de la proposition sont enregistrés avec la discussion qui a mené à la décision.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2d82209e751f2ffa:
    english: |-
      ### Outcome
      When a Loomio poll closes, you will be prompted to set an **outcome** to let everyone know what happened and what is going to happen next.
    translation: |-
      ### Conclusion
      À la clôture d’un sondage Loomio, vous serez invité à publier une **conclusion** pour expliquer à tous ce qui s’est passé et ce qui va suivre.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fb14b31115927d74:
    english: "## Proposals can help in many situations"
    translation: "## Les propositions sont utiles dans de nombreuses situations"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c1a27b25e2c01ff3:
    english: 'Don''t hesitate to start a proposal just because you''re not sure everyone will agree - proposals are not only for when you have consensus, they''re designed to surface issues that need resolving and are useful for clarifying disagreements. '
    translation: N’hésitez pas à lancer une proposition même si vous ignorez si tout le monde sera d’accord. Une proposition peut faire apparaître les questions à résoudre et aider à clarifier les désaccords.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6dbf0f3af984b8e8:
    english: The next pages show a few more complex processes for reaching decisions, through [advice](/en/guides/making_decisions/advice_process), [consent](/en/guides/making_decisions/consent_process ), or [consensus](/en/guides/making_decisions/consensus_process ).
    translation: Les pages suivantes présentent des processus de décision plus complexes, fondés sur la [consultation](/en/guides/making_decisions/advice_process), le [consentement](/en/guides/making_decisions/consent_process ) ou le [consensus](/en/guides/making_decisions/consensus_process ).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
