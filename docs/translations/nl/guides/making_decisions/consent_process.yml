  55ccc01c9b274a87:
    english: |-
      ## Key points
      - Aim for a ‘good enough’ decision.
      - Involve many voices to develop a workable proposal.
      - Ask if anyone has a valid objection.
      - Amend the proposal to resolve objections.
    translation: |-
      ## Belangrijkste punten
      - Streef naar een besluit dat ‘goed genoeg’ is.
      - Betrek veel mensen bij het ontwikkelen van een werkbaar voorstel.
      - Vraag of iemand een gegrond bezwaar heeft.
      - Pas het voorstel aan om bezwaren weg te nemen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7c2ef9fc3419f4b7:
    english: |-
      **Typical roles:**
      - Proposer: The person who raises a topic that requires a decision.
      - Facilitator: Someone who can help the proposer do their job efficiently.
    translation: |-
      **Gebruikelijke rollen:**
      - Voorsteller: degene die een onderwerp aankaart waarvoor een besluit nodig is.
      - Procesbegeleider: iemand die de voorsteller helpt om dit efficiënt te doen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c56d1ea7a5582723:
    english: |-
      ## Consent process steps
      You notice a problem or opportunity and take the initiative.
      1. Present a proposal - start a Loomio **discussion**.
      2. Facilitate a round of questions, reactions and any comments to improve the proposal - run a **Sense check proposal**.
      3. Amend the proposal with suggestions and comments.
      4. Ask if anyone has a meaningful objection to the amended proposal - run a **Consent proposal**.
      5. Integrate valid objections to create an amended version of the proposal that everyone consents is ‘safe to try’ - state the decision **outcome**.
    translation: |-
      ## Stappen van het toestemmingsproces
      Je ziet een probleem of kans en neemt het initiatief.
      1. Presenteer een voorstel: start een Loomio-**discussie**.
      2. Begeleid een ronde met vragen, reacties en opmerkingen om het voorstel te verbeteren: start een **voorstel voor een peiling van reacties**.
      3. Pas het voorstel aan op basis van suggesties en opmerkingen.
      4. Vraag of iemand een zwaarwegend bezwaar heeft tegen het aangepaste voorstel: start een **toestemmingsvoorstel**.
      5. Verwerk gegronde bezwaren in een nieuwe versie van het voorstel die volgens iedereen ‘veilig is om uit te proberen’: deel de **Conclusie** van het besluit.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  735e10dde58793f0:
    english: |-
      >[!Tip]
      >In more complex decisions you may also include a clarifying **Questions round** at step 2, to help people understand the proposal before inviting them to react and comment on the proposal.
    translation: |-
      >[!Tip]
      >Bij complexere besluiten kun je bij stap 2 ook een verhelderende **Vragen ronde** toevoegen. Zo kunnen mensen het voorstel begrijpen voordat je hen uitnodigt om erop te reageren.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9cf871a054d8e628:
    english: |-
      ## Benefits
      - Faster, efficient, clear and more adaptable decisions.
      - Diverse perspectives and empowered engagement builds trust.
      - A more agile, transparent and inclusive culture.
    translation: |-
      ## Voordelen
      - Snellere, efficiënte, duidelijke en beter aanpasbare besluiten.
      - Verschillende perspectieven en actieve betrokkenheid versterken het vertrouwen.
      - Een cultuur die flexibeler, transparanter en inclusiever is.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '09907f3ec328e9d2':
    english: "## Applying the Consent process on Loomio"
    translation: "## Het toestemmingsproces toepassen in Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d7c91a6160b45cf:
    english: |-
      | **Consent process** | **On Loomio** |
      |---|---|
      | You notice a problem or opportunity and take the initiative. |  |
      | **Present a proposal** <br /><br />Write a clear and concise proposal and share it with people impacted. Describe it in a way so that others will understand what you are proposing. | Start a Loomio **discussion**. <br /><br />Name the proposal in the discussion title, and describe it in the context. |
      | **Questions** (Optional) <br /><br />Invite clarifying questions to help people understand the proposal. <br /><br />*“A clarifying question round helps make sure everyone understands the proposal before they say what they think about it.”* | Run a **Question round**. If it is hidden, a group administrator can make it available from [Poll templates](/en/user_manual/polls/poll_templates/). <br /><br />Ask “what do you need to know so you understand the proposal?” |
      | **Reactions** <br /><br />Invite people to offer reactions and comments to improve the proposal. <br /><br />This is a sensing and responding round - *to actively sense and interpret information from the group and then respond or adapt accordingly.* | Run a **[Sense check](/en/user_manual/polls/proposals/sense_check/)** proposal. <br /><br />*In the title:* Name the proposal and say this is an opportunity to react and comment. <br /><br />*In the proposal details:* Clearly frame the proposal and say why it is important.  Include any background information necessary and a link to the current proposal version.  <br /><br />Invite everyone to respond, and to do so before the proposal closes.  |
      | **Amendment** <br /><br />Consider comments and suggestions from people and amend the proposal as appropriate for the good of your organization. <br /><br />Consider any amendments you want to make for the new proposal version. | Reply to comments and suggestions raised in the Sense check proposal. <br /><br />State an **outcome** to summarize the results of the proposal.  <br /><br />Note any concerns or new information discovered, and outline how the proposal will be amended. <br /><br />Say what will happen next and notify people about the outcome. |
      | **Objections** <br /><br />Present the amended proposal version and invite people to state valid objections - objections that might cause harm. <br /><br />Respond to and integrate each objection by amending the proposal. | Run a **[Consent proposal](/en/user_manual/polls/proposals/consent/)** with the amended proposal. <br /><br />*In the title:* Name the decision to be made. <br /><br />*In the proposal details:* Present the proposal and invite people to vote consent or to state a valid objection - an objection that might cause harm.  Remember we are seeking consent that the proposal is 'safe to try'. <br /><br />Respond to and integrate each objection, creating an amended version of the proposal. <br /><br />Notify everyone that there has been a further amendment, and invite them to reconsider their Consent and “change your vote”. <br /><br />Or run successive Consent proposals as necessary until objections are resolved. |
      | **Outcome** <br /><br />When there are no remaining objections and everyone has consented, the result of the decision is announced. | State an **outcome**. <br /><br />Close the proposal. State an outcome and notify everyone involved. <br /><br />State the decision made and thank people for participation in the process. <br /><br />Summarize results of the process and say what will happen next. <br /><br />If no valid objections remain, state that there is consent the proposal is 'safe to try'. <br /><br />The outcome statement is an important record of the decision for future reference. |
    translation: |-
      | **Toestemmingsproces** | **In Loomio** |
      |---|---|
      | Je ziet een probleem of kans en neemt het initiatief. |  |
      | **Presenteer een voorstel** <br /><br />Schrijf een duidelijk en beknopt voorstel en deel het met de mensen die ermee te maken krijgen. Beschrijf wat je voorstelt, zodat anderen het begrijpen. | Start een Loomio-**discussie**. <br /><br />Noem het voorstel in de titel van de discussie en beschrijf het in de context. |
      | **Vragen** (optioneel) <br /><br />Nodig mensen uit om verhelderende vragen te stellen, zodat ze het voorstel begrijpen. <br /><br />*“Een ronde met verhelderende vragen helpt ervoor te zorgen dat iedereen het voorstel begrijpt voordat ze zeggen wat ze ervan vinden.”* | Start een **Vragen ronde**. Als deze verborgen is, kan een groepsbeheerder deze beschikbaar maken via [Peilingssjablonen](/en/user_manual/polls/poll_templates/). <br /><br />Vraag: “Wat moet je weten om het voorstel te begrijpen?” |
      | **Reacties** <br /><br />Nodig mensen uit om te reageren en opmerkingen te geven die het voorstel kunnen verbeteren. <br /><br />In deze ronde verzamel en bespreek je reacties: *neem actief informatie uit de groep op, interpreteer die en reageer erop of pas het voorstel aan.* | Start een **[peiling van reacties](/en/user_manual/polls/proposals/sense_check/)** over het voorstel. <br /><br />*In de titel:* Noem het voorstel en geef aan dat mensen kunnen reageren en opmerkingen kunnen geven. <br /><br />*In de details van het voorstel:* Beschrijf het voorstel duidelijk en leg uit waarom het belangrijk is. Voeg de nodige achtergrondinformatie toe en een link naar de huidige versie van het voorstel. <br /><br />Nodig iedereen uit om te reageren voordat het voorstel sluit. |
      | **Aanpassing** <br /><br />Bekijk de opmerkingen en suggesties en pas het voorstel aan waar dat goed is voor je organisatie. <br /><br />Bepaal welke wijzigingen je in de nieuwe versie van het voorstel wilt opnemen. | Reageer op opmerkingen en suggesties bij de peiling van reacties. <br /><br />Deel een **Conclusie** om de resultaten van het voorstel samen te vatten. <br /><br />Noteer eventuele zorgen of nieuwe informatie en beschrijf hoe je het voorstel gaat aanpassen. <br /><br />Vertel wat er hierna gebeurt en breng mensen op de hoogte van de conclusie. |
      | **Bezwaren** <br /><br />Presenteer de aangepaste versie van het voorstel en nodig mensen uit om gegronde bezwaren te noemen: bezwaren over mogelijke schade. <br /><br />Reageer op elk bezwaar en verwerk het in een aanpassing van het voorstel. | Start een **[toestemmingsvoorstel](/en/user_manual/polls/proposals/consent/)** met het aangepaste voorstel. <br /><br />*In de titel:* Noem het besluit dat genomen moet worden. <br /><br />*In de details van het voorstel:* Presenteer het voorstel en nodig mensen uit om voor toestemming te stemmen of een gegrond bezwaar te noemen: een bezwaar over mogelijke schade. Het doel is instemming dat het voorstel ‘veilig is om uit te proberen’. <br /><br />Reageer op elk bezwaar en verwerk het in een aangepaste versie van het voorstel. <br /><br />Laat iedereen weten dat het voorstel opnieuw is aangepast en nodig hen uit om hun toestemming te heroverwegen en hun stem te wijzigen. <br /><br />Start zo nodig opeenvolgende toestemmingsvoorstellen totdat de bezwaren zijn weggenomen. |
      | **Conclusie** <br /><br />Als er geen bezwaren meer zijn en iedereen heeft ingestemd, maak je het besluit bekend. | Deel een **Conclusie**. <br /><br />Sluit het voorstel, deel een conclusie en breng alle betrokkenen op de hoogte. <br /><br />Noem het genomen besluit en bedank mensen voor hun deelname aan het proces. <br /><br />Vat de resultaten van het proces samen en vertel wat er hierna gebeurt. <br /><br />Als er geen gegronde bezwaren meer zijn, geef dan aan dat er instemming is dat het voorstel ‘veilig is om uit te proberen’. <br /><br />De conclusie legt het besluit vast, zodat je er later naar kunt verwijzen. |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
