---
navigation_title: Канфідэнцыяльнасць
blocks:
  946f29d3bdb2e2af:
    english: "# Group privacy"
    translation: "# Канфідэнцыяльнасць групы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6a2fbb3e7cecad6e:
    english: Privacy controls who can find a group and who can read its content. Open **Edit group settings** from the group page, then select **Privacy**.
    translation: Налады канфідэнцыяльнасці вызначаюць, хто можа знайсці групу і чытаць яе змесціва. На старонцы групы адкрыйце **Рэдагаваць налады групы**, затым выберыце **Канфідэнцыяльнасць**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bf79bc420fc36377:
    english: "![Group privacy settings](group_privacy_settings.png#width-90)"
    translation: "![Налады канфідэнцыяльнасці групы](group_privacy_settings.png#width-90)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4d275c75fe1a2c77:
    english: Changing privacy can expose or hide existing group content, not only content created afterward. Choose the most restrictive setting that still supports the group's purpose.
    translation: Змена налад канфідэнцыяльнасці можа адкрыць або схаваць ужо існае змесціва групы, а не толькі тое, што з'явіцца пазней. Выберыце найбольш строгую наладу, якая дазваляе групе дасягнуць сваёй мэты.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7510b0e8a0fcf7b3:
    english: "## Open"
    translation: "## Адкрыта"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f202c6fba754adaa:
    english: Open groups are public spaces. Anyone can find the group and read its discussions, polls, and files. The member list remains visible only to members.
    translation: Адкрытыя групы — публічныя прасторы. Любы чалавек можа знайсці такую групу і чытаць яе абмеркаванні, апытанні і файлы. Спіс удзельнікаў бачны толькі ўдзельнікам групы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c8d2b41a601ed65e:
    english: Open groups can allow people to join immediately, require approval, or remain invitation only.
    translation: У адкрытай групе можна дазволіць далучацца адразу, патрабаваць ухвалення запыту або прымаць людзей толькі па запрашэнні.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f07a1c59f30e5fea:
    english: "### Follow an Open group"
    translation: "### Сачыце за адкрытай групай"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d6f9ee2eb742720e:
    english: People can stay up to date with an Open group without joining. Following adds unread group activity to their catch-up email so they can review it in their own time. Followers do not become members, receive member voting rights, or receive immediate notifications just because they follow the group.
    translation: За навінамі адкрытай групы можна сачыць, не далучаючыся да яе. Непрачытаная актыўнасць групы дадаецца ў ліст з аглядам, каб людзі маглі праглядзець яе ў зручны час. Калі людзі сочаць за групай, яны не становяцца яе ўдзельнікамі, не атрымліваюць права голасу ў апытаннях для ўдзельнікаў і не пачынаюць атрымліваць імгненныя апавяшчэнні.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  17cb84d9141c9728:
    english: Turn on **Follow updates** on the group page to include its unread discussions, comments, polls, and other thread activity in your catch-up. Turn the setting off to stop including the group.
    translation: Уключыце **Сачыце за абнаўленнямі** на старонцы групы, каб непрачытаныя абмеркаванні, каментары, апытанні і іншая актыўнасць у тэмах траплялі ў ваш ліст з аглядам. Выключыце гэту наладу, каб больш не ўключаць групу ў агляд.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b0c06651e8c0df2b:
    english: "![Follow updates on an Open group](group_follow_updates.png)"
    translation: "![Сачэнне за абнаўленнямі адкрытай групы](group_follow_updates.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1c5becc4d01b10f3:
    english: "## Closed"
    translation: "## Закрыта"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  eaf6878c89438b53:
    english: Anyone can find a Closed group and read its name and description. Discussions, polls, files, and the member list are private to members and invited guests.
    translation: Любы чалавек можа знайсці закрытую групу і прачытаць яе назву і апісанне. Абмеркаванні, апытанні, файлы і спіс удзельнікаў бачныя толькі ўдзельнікам і запрошаным гасцям.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ab7851d3b88d4e27:
    english: Closed groups can let people request membership or remain invitation only. They cannot let people join immediately without approval.
    translation: У закрытай групе можна дазволіць падаваць запыты на ўдзел або прымаць людзей толькі па запрашэнні. Далучыцца адразу без ухвалення нельга.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e2f094fc6e490216:
    english: A Closed subgroup of a parent group can optionally allow members of the parent group to read its discussions without joining the subgroup.
    translation: У закрытай падгрупе можна дазволіць удзельнікам бацькоўскай групы чытаць абмеркаванні, не далучаючыся да падгрупы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9c21e144af9492a6:
    english: "## Secret"
    translation: "## Сакрэт"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6a9871bdd7fde747:
    english: Secret groups and their content are visible only to people who have been invited or added. Membership is invitation only. Secret groups do not appear in the public group directory.
    translation: Сакрэтныя групы і іх змесціва бачныя толькі запрошаным або дададзеным людзям. Далучыцца можна толькі па запрашэнні. Сакрэтныя групы не паказваюцца ў публічным каталогу груп.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  405ac2846a65b06c:
    english: "## How people join"
    translation: "## Як далучыцца да групы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1c7aebb687bbffbf:
    english: 'Privacy determines which joining options are available:'
    translation: 'Налады канфідэнцыяльнасці вызначаюць даступныя спосабы далучэння:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a6a7608fe4510b67:
    english: |-
      | Group privacy | Available joining options |
      | --- | --- |
      | **Open** | Anyone can join, request approval, or invitation only |
      | **Closed** | Request approval or invitation only |
      | **Secret** | Invitation only |
    translation: |-
      | Канфідэнцыяльнасць групы | Даступныя спосабы далучэння |
      | --- | --- |
      | **Адкрыта** | Любы чалавек можа далучыцца адразу, падаць запыт на ўхваленне або далучыцца па запрашэнні |
      | **Закрыта** | Падаць запыт на ўхваленне або далучыцца па запрашэнні |
      | **Сакрэт** | Толькі па запрашэнні |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  473a620db15dff75:
    english: When approval is required, people select **Join group**, answer the group's joining prompt, and send a request to join. See [Inviting people](/en/user_manual/groups/inviting_people#request-to-join-group) for instructions on configuring the prompt, reviewing requests, and inviting people directly.
    translation: Калі патрабуецца ўхваленне, людзі выбіраюць **Далучыцца да групы**, адказваюць на пытанне групы пры далучэнні і адпраўляюць запыт. У раздзеле [Запрашэнне людзей](/en/user_manual/groups/inviting_people#request-to-join-group) апісана, як наладзіць гэтае пытанне, разглядаць запыты і запрашаць людзей непасрэдна.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4c02de0d4580f7e6:
    english: "## Group directory"
    translation: "## Каталог груп"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2dc848ec1af0064e:
    english: Open and Closed parent groups can be listed in the public group directory so people can discover them. Directory listing does not change who can read group content or become a member. Subgroups and Secret groups cannot be listed.
    translation: Адкрытыя і закрытыя бацькоўскія групы можна дадаць у публічны каталог, каб людзі маглі іх знайсці. Наяўнасць у каталогу не змяняе таго, хто можа чытаць змесціва групы або стаць яе ўдзельнікам. Падгрупы і сакрэтныя групы нельга дадаць у каталог.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
