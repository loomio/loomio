  ca092d1c3fdb9f59:
    english: 'You probably don''t want to click any of the checkboxes for now. Just enter the name (such as "Discord #general") and the URL and click the save button at the bottom of the form.'
    translation: 'Lass die Kontrollkästchen vorerst frei. Gib einen Namen (zum Beispiel „Discord #general“) und die URL ein. Klicke dann unten im Formular auf „Speichern“.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a63a4be4a45bcfdb:
    english: If you decide later that you want the integration to receive automatic notifications, return to its settings and select the relevant events.
    translation: Wenn die Integration später automatische Benachrichtigungen erhalten soll, öffne erneut ihre Einstellungen und wähle die entsprechenden Ereignisse aus.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f1d9c09f9d3c2a82:
    english: "### Invite to poll"
    translation: "### Zur Abstimmung einladen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cbc7b5fd5afcc24c:
    english: |-
      This is how to send a notification to your chatroom inviting people to vote in a proposal.
      It's the same process for Share outcome, Invite to thread, Remind to vote, Poll edited etc.
    translation: |-
      So sendest du eine Benachrichtigung an deinen Chatraum und lädst Menschen ein, über einen Vorschlag abzustimmen.
      Für Fazit teilen, Zur Diskussion einladen, An Abstimmung erinnern, Abstimmung bearbeitet und ähnliche Aktionen gehst du genauso vor.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  290001bb97dee010:
    english: |-
      ### Automatic notifications
      To send a notification whenever a specific event happens, edit the chat integration and select that event.
    translation: |-
      ### Automatische Benachrichtigungen
      Damit bei einem bestimmten Ereignis eine Benachrichtigung gesendet wird, bearbeite die Chat-Integration und wähle das Ereignis aus.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
