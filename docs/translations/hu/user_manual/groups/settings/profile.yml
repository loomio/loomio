  0b903e1c3c7e1862:
    english: The profile tab controls how your group is identified and introduced. Open **Edit group settings** from the group page, then select **Profile**.
    translation: A Profil lapon adhatod meg, hogyan jelenjen meg és mutatkozzon be a csoportod. A csoport oldalán nyisd meg **A csoportbeállítások szerkesztése** menüpontot, majd válaszd a **Profil** lehetőséget.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
