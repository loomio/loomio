navigation_title: Практики врядування
blocks:
  be27d7d85647e400:
    english: "# Governance practices and approaches"
    translation: "# Практики та підходи до врядування"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3242767a5e393028:
    english: Good governance includes establishing, reviewing and challenging governance practices, policies and procedures to continously improve board effectiveness.
    translation: Належне врядування передбачає впровадження, перегляд і критичне оцінювання практик, політик і процедур, щоб постійно підвищувати ефективність роботи ради.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c4d8cb7f7eb901a6:
    english: However many boards are short on time and often weighed down by board papers, compliance and risk, without sufficient time to discuss and debate critical strategy and performance issues.
    translation: Однак багатьом радам бракує часу. Підготовка матеріалів до засідань, дотримання вимог і управління ризиками часто залишають замало часу для обговорення важливих питань стратегії та результатів роботи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  eb59655c49bf902d:
    english: "## On Loomio\nLoomio offers the opportunity to work online on a document, policy or procedure.  Discussion and decisions are contained in a thread that members can access when and wherever works for them.  "
    translation: |-
      ## У Loomio
      У Loomio можна спільно працювати над документом, політикою чи процедурою онлайн. Обговорення та рішення зберігаються в темі, до якої учасники можуть звертатися у зручний для них час із будь-якого місця.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a0d6426929e39b38:
    english: 'Use a **thread** for each document, policy or procedure. The thread is the container for discussion, and holds document drafts and subsequent versions of the document.  '
    translation: Створіть окрему **тему** для кожного документа, політики чи процедури. У темі відбувається обговорення та зберігаються чернетки й наступні версії документа.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  551c5aac67b42167:
    english: With a Loomio thread, you can organize so that the 2-3 people working on the document text are discussing particulars in the thread.  The thread could be private amongst just those 2-3 people, or run openly in the group so that the work is transparent to all members.
    translation: У темі Loomio двоє або троє людей, які працюють над текстом документа, можуть обговорювати його деталі. Тема може бути приватною для цих людей або відкритою для всієї групи, щоб усі учасники могли стежити за роботою.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1400a6d44d7d4e35:
    english: When the document reaches a draft version, use a **Sense check poll** to notify members that the draft document is ready for review, and invite members to read the document and respond with any comments or questions.  As well as letting everyone know that the work is progressing, the poll closing date encourages people to participate.
    translation: Коли чернетка документа буде готова, створіть опитування **Перевірка сенсу**. Повідомте учасникам, що документ можна переглянути, і запросіть їх залишити коментарі чи запитання. Так усі дізнаються про поступ роботи, а дата завершення опитування спонукатиме долучитися.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  44bcb71608c8f14a:
    english: The document may require several draft iterations.
    translation: Документ може потребувати кількох редакцій чернетки.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a5371854b689874a:
    english: When a 'final' draft is ready, raise a **Proposal** to approve the document.
    translation: Коли остаточна чернетка буде готова, створіть **Пропозиція** для затвердження документа.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5998c94bd5b640ab:
    english: Loomio enables a board to progress work on governance improvement between meetings without eating into precious time in meetings.
    translation: Loomio дає раді змогу вдосконалювати врядування між засіданнями, зберігаючи час засідань для інших питань.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
