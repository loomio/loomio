  eecfb12ed1d28d50:
    english: Good governance exists where an organization has systems and processes in place that are appropriate to its circumstances, and which enable the organization to pursue its purpose effectively and meet its obligations under the law.
    translation: A jó szervezeti irányításhoz a szervezet körülményeihez illő rendszerekre és folyamatokra van szükség. Ezek segítik a szervezetet céljai hatékony megvalósításában és jogi kötelezettségei teljesítésében.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e54f67d22cf67a93:
    english: "*“It is participatory, consensus-oriented, accountable, transparent, responsive, effective and efficient, equitable and inclusive and follows the rule of law.”* [United Nations Economic and Social Commission for Asia and the Pacific](https://www.unescap.org/sites/default/d8files/knowledge-products/good-governance.pdf)."
    translation: "*„Részvételen és konszenzuson alapul, elszámoltatható, átlátható, reagál az igényekre, eredményes és hatékony, méltányos és befogadó, valamint követi a jogállamiság elveit.”* [Az ENSZ Ázsiai és Csendes-óceáni Gazdasági és Szociális Bizottsága](https://www.unescap.org/sites/default/d8files/knowledge-products/good-governance.pdf)."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1661a79cfda1a9df:
    english: Underpinning all of these principles is the need for good communication.
    translation: Mindezekhez jó kommunikációra van szükség.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2819f114c9d74160:
    english: 'Here are some or the challenges directors and boards experience:'
    translation: 'A vezető testületek és tagjaik többek között ezekkel a kihívásokkal szembesülnek:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ed750814c61b85fb:
    english: "* Getting directors together in person\n* Time available to consider important issues \n* Tracking communication\n* Urgency of critical issues\n* Online video meeting fatigue\n* Directors in multiple, remote locations, sometimes with poor internet connectivity\n* Mixed governance practice and experience\n* Dealing with high volumes of transactional business \n* Maintaining institutional memory"
    translation: "* A testületi tagok személyes találkozóinak megszervezése\n* Elegendő idő biztosítása a fontos kérdések átgondolására \n* A kommunikáció nyomon követése\n* A kritikus ügyek sürgőssége\n* Az online videóértekezletek okozta fáradtság\n* A különböző, távoli helyszíneken élő testületi tagok bevonása, esetenként gyenge internetkapcsolat mellett\n* Eltérő szervezeti irányítási gyakorlatok és tapasztalatok\n* A sok rutinügy intézése \n* A szervezet tudásának megőrzése"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b910c5253cf77950:
    english: Loomio offers an opportunity to strengthen governance, to extend collaboration beyond board meetings, to include everyone in open, honest and respectful discussion while documenting everything.
    translation: A Loomio segíthet megerősíteni a szervezeti irányítást és az üléseken kívül is folytatni az együttműködést. Mindenki részt vehet a nyílt, őszinte és tiszteletteljes beszélgetésben, miközben a döntésekhez vezető munka dokumentálható.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
