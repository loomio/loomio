  50902da4933b32b7:
    english: Board and committee members frequently need to make 'out-of-session' decisions. These are governance decisions and discussion where either;
    translation: 'Membros de conselhos e comitês frequentemente precisam tomar decisões fora das reuniões. Essas decisões de governança precisam ser discutidas quando:'
    status: machine
