---
navigation_title: Збирайте приватні заявки
blocks:
  c4a53a596a037fc0:
    english: "# Collect private submissions"
    translation: "# Збирайте приватні заявки"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b24abc6bf93b1c0f:
    english: Use a Closed group to collect private submissions from people who are not members of the group. Each submission becomes a separate discussion that the submitter and the group's review team can use to exchange information, ask questions, and record a decision. Submitters cannot see other private discussions or submissions in the group.
    translation: Використовуйте закриту групу, щоб збирати приватні заявки від людей, які не є її учасниками. Кожна заявка стає окремим обговоренням. У ньому заявник і команда групи, яка розглядає заявки, можуть обмінюватися інформацією, ставити запитання й фіксувати рішення. Заявники не бачать інших приватних обговорень або заявок у групі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  feb5105698bca188:
    english: Nominations are a clear use case when candidate details or the list of nominees must remain private during selection. A person can nominate themselves or someone else for an election, appointment, committee, board, or representative role, while a selection panel reviews each nomination in its own discussion.
    translation: Так можна збирати номінації, коли відомості про кандидатів або список номінантів мають залишатися приватними під час відбору. Людина може висунути себе або когось іншого на виборну чи призначувану посаду, до комітету, правління або на роль представника. Відбіркова комісія розглядає кожну номінацію в окремому обговоренні.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a64597508a4f7f3d:
    english: 'Other suitable purposes where submissions should not be public include:'
    translation: 'Цей спосіб також підходить для інших заявок, які не мають бути публічними:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e4bd382899a8e7d9:
    english: |-
      - Complaints, safeguarding reports, safety concerns, and incident reports
      - Appeals and requests to reconsider a decision about an individual case
      - Requests for mediation, conflict resolution, or personal support
      - Applications containing personal, financial, or eligibility information, such as hardship grants or scholarships
      - Sealed bids or tender responses that must remain private during assessment
    translation: |-
      - Скарги, повідомлення про загрози людям, питання безпеки та повідомлення про інциденти
      - Апеляції та прохання переглянути рішення щодо окремої справи
      - Запити на посередництво, врегулювання конфліктів або особисту підтримку
      - Заявки з особистою чи фінансовою інформацією або відомостями про відповідність вимогам, наприклад на допомогу в скрутних обставинах чи стипендію
      - Закриті цінові пропозиції або відповіді на тендер, які мають залишатися приватними під час оцінювання
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bab86da011a22a2a:
    english: This workflow is private between submitters, but it is not anonymous. Submitters need a user account, and every member of the Closed group can see the submissions. Consider who belongs to the review group before using it for sensitive information.
    translation: Заявники не бачать заявок одне одного, але цей процес не є анонімним. Заявникам потрібен обліковий запис користувача, а кожен учасник закритої групи може бачити всі заявки. Перш ніж використовувати цей спосіб для конфіденційної інформації, перевірте склад групи, яка розглядатиме заявки.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b82ae8f3f04d257f:
    english: "## Enable private submissions"
    translation: "## Увімкніть приймання приватних заявок"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0cebe3c5801844ce:
    english: You must be an admin of the group or subgroup where you want to collect submissions.
    translation: Ви маєте бути адміністратором групи або підгрупи, у якій хочете збирати заявки.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  831d833d53a12ece:
    english: |-
      1. Open the group.
      2. Select **Settings** (or **More** and then **Edit group settings**).
      3. Open **Permissions**.
      4. Enable **Non-members can start discussions**.
      5. Save the group settings.
    translation: |-
      1. Відкрийте групу.
      2. Виберіть **Налаштування** (або **Більше**, а потім **Редагувати налаштування групи**).
      3. Відкрийте **Дозволи**.
      4. Увімкніть **Неучасники можуть розпочинати обговорення**.
      5. Збережіть налаштування групи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f3962a27b1c4ffa8:
    english: "![The Permissions tab in group settings, with Non-members can start discussions highlighted](non_members_can_start_discussions.png)"
    translation: "![Вкладка «Дозволи» в налаштуваннях групи, де виділено параметр «Неучасники можуть розпочинати обговорення»](non_members_can_start_discussions.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  99ace15d10e78f33:
    english: This option is available only for **Open** and **Closed** groups. It is hidden for **Secret** groups. If you cannot see it, open **Privacy** in the group settings and change **Group privacy** to **Closed** (recommended for private submissions) or **Open**, then return to **Permissions**.
    translation: Цей параметр доступний лише для груп із рівнем приватності **Відкрита** або **Закрита**. Для груп із рівнем **Таємна** його приховано. Якщо ви не бачите параметра, відкрийте **Конфіденційність** у налаштуваннях групи та змініть **Конфіденційність групи** на **Закрита** (рекомендовано для приватних заявок) або **Відкрита**. Потім поверніться до розділу **Дозволи**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  449517e6293a3acc:
    english: Enabling this permission does not make the group's discussions public. A non-member can start a new discussion and access that discussion as a guest, but cannot see the group's other private discussions.
    translation: Увімкнення цього дозволу не робить обговорення групи публічними. Людина, яка не є учасником групи, може розпочати нове обговорення й отримати до нього доступ як гість. Інші приватні обговорення групи їй недоступні.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  151f68a3f638fb67:
    english: "## Set up a private submission process"
    translation: "## Налаштуйте приймання приватних заявок"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ae924433d81f5eac:
    english: |-
      1. Create a dedicated subgroup for the submission process and set its privacy to **Closed**. A subgroup keeps the submissions separate from the parent group's other work.
      2. Add the selection panel or other people responsible for reviewing submissions as members of the subgroup. Every subgroup member can see every submission, so add only people who should have that access.
      3. Create a [discussion template](/en/user_manual/discussions/templates) in the subgroup. Include the questions and information submitters should provide. You can create different discussion templates for different kinds of submissions.
      4. If submitters should not request subgroup membership, set membership to **Invitation only**.
      5. [Enable private submissions](#enable-private-submissions) in the subgroup's permissions.
      6. Test the process with an account that is not a member of the subgroup.
      7. Share the subgroup page with prospective submitters. They must sign in to their user account before making a submission.
    translation: |-
      1. Створіть окрему підгрупу для приймання заявок і встановіть для неї рівень приватності **Закрита**. Так заявки будуть відокремлені від іншої роботи основної групи.
      2. Додайте до підгрупи учасників відбіркової комісії або інших людей, відповідальних за розгляд заявок. Кожен учасник підгрупи може бачити всі заявки, тому додавайте лише тих, кому потрібен такий доступ.
      3. Створіть у підгрупі [шаблон обговорення](/en/user_manual/discussions/templates). Додайте запитання та вкажіть, яку інформацію мають надати заявники. Для різних видів заявок можна створити окремі шаблони обговорень.
      4. Якщо заявники не повинні подавати запити на вступ до підгрупи, встановіть для членства параметр **Лише для запрошених**.
      5. [Увімкніть приймання приватних заявок](#enable-private-submissions) у дозволах підгрупи.
      6. Перевірте процес за допомогою облікового запису, який не належить учаснику підгрупи.
      7. Поділіться сторінкою підгрупи з людьми, які можуть подати заявки. Перед поданням заявки їм потрібно ввійти у свій обліковий запис користувача.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3acec1b4a6724a65:
    english: "## Make a submission"
    translation: "## Подайте заявку"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  58f96f48b6aacf65:
    english: The submitter opens the subgroup and selects **Start discussion**. Loomio shows the subgroup's available discussion templates. The submitter selects the relevant discussion template, completes its questions, and starts the discussion.
    translation: Заявник відкриває підгрупу й вибирає **Розпочати обговорення**. Loomio показує доступні в підгрупі шаблони обговорень. Заявник вибирає потрібний шаблон, відповідає на запитання та розпочинає обговорення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5a65043771edeb44:
    english: The discussion belongs to the subgroup, but the submitter does not become a subgroup member. Loomio adds them as a guest of their discussion thread, enabling them to see and participate in the discussion with the panel or review team. They cannot see other private discussions or submissions in the subgroup.
    translation: Обговорення належить підгрупі, але заявник не стає її учасником. Loomio додає заявника як гостя до теми обговорення. Завдяки цьому він може бачити обговорення й брати в ньому участь разом із комісією або командою, яка розглядає заявки. Інші приватні обговорення та заявки в підгрупі йому недоступні.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9338fd073b26dafc:
    english: "## Review submissions"
    translation: "## Розглядайте заявки"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  50e33fa0f0868cf5:
    english: Subgroup members can see every submission discussion in the subgroup. They can ask follow-up questions and use comments, polls, or other discussion tools to complete their review.
    translation: Учасники підгрупи можуть бачити всі обговорення заявок у ній. Для розгляду вони можуть ставити уточнювальні запитання та використовувати коментарі, опитування й інші інструменти обговорення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  537b76c6f85cc575:
    english: If another person needs to provide information, a subgroup member with permission can invite them to the submission discussion. For example, when a nominator submits a nomination, the subgroup can invite the nominee to the thread if their participation is required. The invited person joins as a guest without gaining access to the subgroup's other private discussions.
    translation: Якщо інформацію має надати інша людина, учасник підгрупи з відповідним дозволом може запросити її до обговорення заявки. Наприклад, коли хтось висуває кандидата, підгрупа може запросити цього кандидата до теми, якщо потрібна його участь. Запрошена людина приєднується як гість і не отримує доступу до інших приватних обговорень підгрупи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1fb7da309186b19e:
    english: Each submitter can see their own submission but cannot see the subgroup's other private discussions or submissions. Disable **Non-members can start discussions** when submissions close. Existing discussions and guest access are unchanged.
    translation: Кожен заявник може бачити власну заявку, але не бачить інших приватних обговорень або заявок у підгрупі. Коли приймання заявок завершиться, вимкніть **Неучасники можуть розпочинати обговорення**. Наявні обговорення та доступ гостей не зміняться.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
