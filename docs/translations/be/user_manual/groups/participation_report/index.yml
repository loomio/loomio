    translated_on: '2026-09-30'
  569d9a416d57c04f:
    english: Understand in which country users participate the most and least.
    translation: Паглядзіце, у якіх краінах карыстальнікі ўдзельнічаюць найбольш і найменш актыўна.
    status: machine
