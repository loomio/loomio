  f087c06a5f4ab2e6:
    english: "# Intro to Discussions"
    translation: "# Johdanto keskusteluihin"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f515c87a8d1d20c7:
    english: Loomio discussions are where you can share information, discuss topics, and make decisions with your group.  People participate by posting comments and replies.
    translation: Loomion keskusteluissa voit jakaa tietoa, käsitellä aiheita ja tehdä päätöksiä ryhmäsi kanssa. Ihmiset osallistuvat kirjoittamalla kommentteja ja vastauksia.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eede89b6ce4f357d:
    english: |-
      - All info about a topic is in one easily accessible place.
      - People can reply via email and their comments appear in the discussion.
      - You can see who has read the discussion and who needs a nudge.
      - There is a record of discussion you can easily find again.
    translation: |-
      - Kaikki aiheeseen liittyvä tieto on yhdessä paikassa, josta se on helppo löytää.
      - Ihmiset voivat vastata sähköpostitse, ja heidän kommenttinsa näkyvät keskustelussa.
      - Näet, ketkä ovat lukeneet keskustelun ja keitä kannattaa muistuttaa.
      - Keskustelusta jää tallenne, jonka löydät helposti myöhemmin.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9cb2eb404b59208b:
    english: Discussions have a wide range of uses - from a general discussion forum to running specific work-flow and decision-making processes.
    translation: 'Keskusteluja voi käyttää monin tavoin: yleisenä keskustelufoorumina tai tiettyjen työ- ja päätöksentekoprosessien tukena.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  87a95605052570ca:
    english: For example, you may frame a discussion on a particular topic, invite people to contribute their thoughts and share information, and facilitate progress towards an agreed outcome.
    translation: Voit esimerkiksi aloittaa keskustelun tietystä aiheesta, kutsua ihmisiä jakamaan ajatuksiaan ja tietoa sekä auttaa ryhmää etenemään kohti yhteistä päätöstä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ce6e6734c595d968:
    english: Or you may invite people to participate in a particular decision, using a consent or advice decision-making process.
    translation: Voit myös kutsua ihmisiä osallistumaan tiettyyn päätökseen esimerkiksi suostumukseen tai neuvojen pyytämiseen perustuvalla päätöksentekotavalla.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7fa58cb3ba95be0b:
    english: Discussions can also contain polls and proposals to help progress a discussion to an outcome. As people comment in the discussion and vote in polls, a discussion timeline builds so you can easily find key milestones.
    translation: Keskusteluun voi lisätä kyselyitä ja ehdotuksia, jotka auttavat etenemään kohti päätöstä. Kun ihmiset kommentoivat ja äänestävät kyselyissä, keskustelulle muodostuu aikajana, jolta löydät helposti tärkeät vaiheet.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
