  30163152525e029c:
    english: "# Underway"
    translation: "# En cours"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  02feef9bf78ef420:
    english: "## Where are we on the Map?"
    translation: "## Où en sommes-nous dans le processus ?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '083f066ff9a3cfde':
    english: People feel more confident and better held if they can orient themselves on a timeline or agenda. They want to know what they’re doing now, what’s coming up, and to be reminded of what they’ve already done. Understanding the overall shape of the process helps people understand how to contribute effectively.
    translation: Les personnes participent avec plus d’assurance lorsqu’elles peuvent se situer dans un calendrier ou un ordre du jour. Elles veulent savoir ce qu’elles font maintenant, ce qui vient ensuite et ce qu’elles ont déjà accompli. Une vue d’ensemble du processus les aide à comprendre comment contribuer efficacement.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ea2ef3e629108828:
    english: For example if they can see there’s a Q&A section later, they'll be more willing to hold their questions during a presentation. If it’s clear that there’s a divergent phase and then a convergent phase, people will hold back from jumping to solutions too soon. People need to know what kind of input they are being asked for, and when.
    translation: Par exemple, si une séance de questions-réponses est prévue plus tard, les personnes seront plus disposées à garder leurs questions pendant une présentation. Si une phase d’exploration précède clairement une phase de convergence, elles éviteront de proposer des solutions trop tôt. Chacun doit savoir quel type de contribution est attendu et à quel moment.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7a5d009dfc4e0f6b:
    english: Mapping the process well enough to communicate it also challenges facilitators to fully think through the journey, and helps them make sure each part of the process has a purpose that builds a cohesive whole. A well-facilitated experience follows a logical progression.
    translation: Définir assez précisément le processus pour pouvoir l’expliquer pousse aussi les personnes qui l’animent à réfléchir à l’ensemble du parcours. Cela les aide à vérifier que chaque étape a une raison d’être et contribue à un tout cohérent. Un processus bien animé suit une progression logique.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aabfa9d842af2688:
    english: On Loomio
    translation: Sur Loomio
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  af3599a59685a726:
    english: |-
      * A Loomio decision already follows a basic logical progression (which is why it works): Gather (open/invite), Discuss (divergent), Propose (convergent), Decide and Act (conclude).
      * Many Loomio users are employing the tool as part of explicitly mapped experiences, such as a multi-stage consultation process.
      * We offer some tools of facilitators to help “reveal the map” to users, such as the group description field, and proposal deadlines. These can be proactively leveraged to increase context for participants.
    translation: |-
      * Une décision sur Loomio suit déjà une progression logique simple : réunir les personnes (ouvrir et inviter), discuter (diverger), faire une proposition (converger), décider et agir (conclure).
      * Beaucoup de personnes utilisent Loomio dans le cadre d’un processus dont les étapes sont clairement définies, comme une consultation en plusieurs phases.
      * Certains outils aident à rendre ce parcours visible, notamment la description du groupe et les dates limites des propositions. Ils permettent de donner davantage de contexte aux personnes qui participent.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  228ae545a39cd553:
    english: "## The Art of Noticing"
    translation: "## L’art de l’observation"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  04155220f602a7e8:
    english: Noticing is probably the most critical facilitation skill of all. The facilitator uses noticing to figure out what interventions or responses are needed, how to invite the right contributions, and to help the group notice itself. The value of facilitation is having someone paying attention and acting on what they notice, while others may be focused on specific content or their own agendas.
    translation: Observer est sans doute la compétence la plus importante pour animer un groupe. L’observation aide à déterminer quand intervenir, comment répondre et quelles contributions solliciter. Elle aide aussi le groupe à prendre conscience de son propre fonctionnement. L’animation apporte une personne qui prête attention à ce qui se passe et agit en conséquence, pendant que les autres se concentrent sur le sujet ou sur leurs propres priorités.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  90a03fdb345369b7:
    english: 'Effective noticing is a combination of good informational inputs, and sensitivity and skill to interpret them. Many facilitators talk about “reading” a room: emotional reactions, tensions,  power dynamics. Facilitators need effective information signalling systems.'
    translation: 'Une observation efficace repose sur de bonnes informations et sur la capacité de les interpréter avec sensibilité. Les personnes qui animent un groupe parlent souvent de « lire » la salle : réactions émotionnelles, tensions et rapports de pouvoir. Elles ont besoin de moyens efficaces pour repérer ces signaux.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  49b0f2cc823e0384:
    english: |-
      * Many current features assist with noticing — the biggest one is probably watching how the pie is shaping up in a proposal.
      * The software notices some things: who has and has not yet participated, what topics are being raised, who has and has not accepted their group invitation, etc.
      * On Loomio, a single facilitator can read across dozens of discussions at the same time, see clearly what’s being shared, and act accordingly.
      * Talking online can make the implicit explicit, and therefore easier to notice.
      * Communicating in writing can be very good for naming what’s being noticed and why a certain action is being taken in response. For example, you can quote someone’s exact words and reflect back what’s revealed by them. Or you can do the same thing at the level of a whole discussion, picking out a range of quotes and noticing themes or emerging conflicts.
      * Noticing is much easier when you slow things down, which is one of Loomio’s great advantages — asynchronous communication you can read at any pace. It also makes it possible to notice across time, referring directly to past discussions.
      * Because you can have simultaneous discussions, it's possible to have a layer of “meta” discussion (aka “blue hat”, aka discussion about the discussion) at the same time as progressing the main discussions. So you can collectively have a space to practice noticing without slowing down the process.
    translation: |-
      * Plusieurs fonctionnalités facilitent l’observation. L’une des plus utiles consiste à suivre l’évolution du graphique des réponses à une proposition.
      * Le logiciel permet de voir qui a participé ou non, quels sujets sont soulevés et qui a accepté ou non son invitation à rejoindre le groupe.
      * Sur Loomio, une seule personne peut suivre des dizaines de discussions à la fois, voir clairement ce qui s’y dit et agir en conséquence.
      * Les échanges en ligne peuvent rendre explicite ce qui resterait implicite et donc plus difficile à remarquer.
      * L’écrit aide à nommer ce qui a été observé et à expliquer une intervention. Vous pouvez, par exemple, citer les mots exacts d’une personne et expliquer ce qu’ils révèlent. Vous pouvez aussi relever plusieurs citations dans une discussion pour faire ressortir des thèmes ou des désaccords naissants.
      * Il est plus facile d’observer quand le rythme ralentit. C’est l’un des avantages de Loomio : les échanges asynchrones peuvent être lus à votre rythme. Vous pouvez aussi suivre leur évolution dans le temps en revenant directement aux discussions précédentes.
      * Plusieurs discussions peuvent avancer en même temps. Vous pouvez donc ouvrir une discussion sur la manière dont les échanges se déroulent, parfois appelée « méta-discussion » ou « chapeau bleu », tout en poursuivant les discussions principales. Le groupe dispose ainsi d’un espace pour observer son fonctionnement sans ralentir le processus.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cdb52080510ddb69:
    english: "## Hearing Diverse Voices"
    translation: "## Faire entendre des voix diverses"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  150ff74c2805696b:
    english: In our society, multiple layers of history, power dynamics, culture, and psychology conspire to amplify certain voices and suppress others. This plays out at every level of experience, from our innermost subconscious beliefs to our political system and laws.
    translation: Dans notre société, l’histoire, les rapports de pouvoir, la culture et la psychologie se conjuguent pour donner plus de place à certaines voix qu’à d’autres. Cette dynamique agit à tous les niveaux, de nos croyances les plus profondes à notre système politique et à nos lois.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a3dccb91d161d18a:
    english: But the best ideas do not always come from the loudest voices, and the role of facilitation is to counteract these biases. It’s important to be aware of the dynamics we are collectively grappling with if our goals are social justice, group effectiveness, and high quality decision making.
    translation: Les meilleures idées ne viennent pourtant pas toujours des personnes qui parlent le plus fort. L’animation peut aider à réduire ces biais. Pour favoriser la justice sociale, l’efficacité du groupe et la qualité des décisions, il faut prendre conscience des dynamiques auxquelles nous sommes collectivement confrontés.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5e8160d5b0da948a:
    english: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../rich_200.png"> If you want to innovate, you have to make space for different points of view — luckily, this is also what you need to do if you want a team where everyone is empowered. All kinds of cultural and technical factors conspire to privilege some voices at the expense of others. There are many practices you can implement to systematically challenge that bias, but just being aware of it is a good starting point. — Richard Bartlett'
    translation: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../rich_200.png"> Si vous voulez innover, faites une place à différents points de vue. C’est aussi nécessaire pour que chaque membre d’une équipe puisse agir pleinement. De nombreux facteurs culturels et techniques favorisent certaines voix aux dépens d’autres. Vous pouvez adopter diverses pratiques pour contrer ce biais de manière systématique. En prendre conscience est déjà un bon point de départ. — Richard Bartlett'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  63e0bdf44ad2df5f:
    english: Our lived human experience is to inhabit a singular consciousness, so humans tend to forget that others experience the world differently. Even within a seemingly homogenous group, there is incredible diversity — perspectives, pace, preferences. Internalising this truth — that others are different from myself — is a central personal growth challenge.
    translation: Nous vivons chacun à travers notre propre conscience et avons tendance à oublier que les autres perçoivent le monde différemment. Même dans un groupe qui semble homogène, les perspectives, les rythmes et les préférences varient beaucoup. Reconnaître pleinement que les autres sont différents de soi est un enjeu majeur du développement personnel.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  62f6a86aa220b787:
    english: There is no such thing as one size fits all. Any mode of interacting enhances some voices and quiets others, or emphasises different tendencies within an individual. So, it’s necessary to employ a range of approaches to invite the best from multiple diverse voices.
    translation: Aucune méthode ne convient à tout le monde. Chaque mode d’échange donne plus de place à certaines voix et moins à d’autres, ou fait ressortir différents aspects d’une même personne. Il faut donc varier les approches pour permettre à des personnes diverses d’apporter le meilleur de leurs contributions.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8f9c1b2c0e40b1fc:
    english: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../silvia_200.png"> Check you’re catering to different learning styles. One simple way to check is with the Head, Heart, Hands metaphor. People who learn with their Head need facts and detailed information. A Heart learner thrives off stories. They need an emotional connection to the work. Learning with the Hands is all about doing stuff and getting active. — Silvia Zuur'
    translation: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../silvia_200.png"> Veillez à tenir compte de différentes façons d’apprendre. La métaphore de la tête, du cœur et des mains offre un repère simple. Les personnes qui apprennent par la tête ont besoin de faits et d’informations détaillées. Celles qui apprennent par le cœur sont sensibles aux récits et ont besoin d’un lien émotionnel avec le travail. Apprendre par les mains, c’est agir et faire des choses concrètes. — Silvia Zuur'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  04a3a7bc850913ab:
    english: One of the best approaches to bringing out and weaving together diverse voices is to invite diverse modes of interaction, which will serve different needs and preferences, and level the communication playing field.
    translation: Pour faire émerger des voix diverses et les relier entre elles, proposez plusieurs modes d’échange. Vous répondrez ainsi à différents besoins et préférences tout en donnant à chacun davantage de possibilités de s’exprimer.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ba31b7da59193745:
    english: 'Some classic design building blocks to address communication diversity in collaborative communication:'
    translation: 'Voici quelques éléments classiques pour tenir compte de la diversité des modes de communication dans un travail collectif :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fbcafe73c1d8720b:
    english: |-
      * **Group size** — individual reflection, pairs, small group, large group, one-to-one, one-to-many, many-to-many.
      * **Medium of expression** — writing, drawing, video, singing, dance, flowcharts, equations, symbols, stories, tears, laughter, debate, etc.
      * **Discussion protocols** — rounds (hear from each person once before moving on), rate limiting (you can only speak again after two others have spoken), talking stick (only speak when you have the stick — no interrupting), time-limited contributions (you can talk for 1 minute only), time-unlimited contributions (you can hold the floor indefinitely and everyone will deeply listen), tracking contributions (how much have women vs men spoken, etc), holding periods of silence between speakers (for processing and reflection).
      * **Embrace silence** *Silence is only awkward if you let it be awkward. Silence is a chance for people to think. — Silvia Zuur*
    translation: |-
      * **Taille du groupe** — réflexion individuelle, binômes, petits groupes, grands groupes, échanges entre deux personnes, d’une personne vers plusieurs ou de plusieurs personnes entre elles.
      * **Moyen d’expression** — écriture, dessin, vidéo, chant, danse, schémas, équations, symboles, récits, larmes, rires, débat, etc.
      * **Règles de discussion** — tours de parole (écouter chaque personne une fois avant de poursuivre), limitation des prises de parole (attendre que deux autres personnes aient parlé avant de reprendre la parole), bâton de parole (parler uniquement quand on le tient, sans interrompre), interventions limitées dans le temps (une minute par personne), interventions sans limite de temps (laisser une personne parler aussi longtemps qu’elle le souhaite et l’écouter attentivement), suivi de la participation (comparer, par exemple, le temps de parole des femmes et des hommes), moments de silence entre les interventions (pour réfléchir et prendre du recul).
      * **Accueillir le silence** *Le silence n’est gênant que si vous le laissez devenir gênant. Il donne aux personnes le temps de réfléchir. — Silvia Zuur*
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ff925b4be393907c:
    english: |-
      * The design of Loomio has always been about “hearing all voices”, including people who aren’t able to be there in person, are quieter, are busy, etc.
      * In text, every voice is more or less the same “volume” and “speed”. Written asynchronous communication offers a kind of leveling of the field.
      * The proposal feature is essentially a “round”, assisting groups to facilitate each individual person having their say (if they want to) on an equal basis.
      * Loomio enables multi-media (links, videos, images, diagrams, supporting evidence), which serve various communication styles.
      * Loomio itself is pretty basic, but with active facilitation and group maturity, it is possible to employ discussion protocols “manually” using cultural norms or agreed rules (eg, a discussion where everyone only posts once until everyone else has participated).
      * Loomio provides flexible tools for small and large group interaction, using parent groups and subgroups. Some large consultation processes have involved multiple smaller groups which are then synthesised into a larger outcome.
      * People who want time for individual reflection can take time out and process their thoughts, and then come back and share a longer comment or link to a document. This is a “self-selecting” example of creating interplay between individual and group communication.
      * Loomio accessibility features and multi-lingual translations make it possible for people with very different needs to participate as equals in one discussion. This is a key example of how technology can enable equitable participation in a way that’s nearly impossible in person.
      * If someone is contributing more than their share (talking too much), it’s technically possible to just scroll on by (whereas in person this behaviour can totally dominate the interaction). However, people posting “walls of text” can still be detrimental to a balanced Loomio discussion.
    translation: |-
      * Loomio a toujours été conçu pour « faire entendre toutes les voix », y compris celles des personnes qui ne peuvent pas être présentes, qui parlent moins ou qui manquent de temps.
      * À l’écrit, toutes les voix ont à peu près le même « volume » et le même « rythme ». Les échanges écrits et asynchrones réduisent ainsi certaines inégalités de prise de parole.
      * Une proposition fonctionne comme un tour de parole : elle aide chaque membre du groupe à donner son avis, s’il le souhaite, sur un pied d’égalité.
      * Loomio permet de partager plusieurs types de contenus (liens, vidéos, images, schémas et documents à l’appui), adaptés à différents modes de communication.
      * Les outils de Loomio sont simples, mais une animation active et un groupe habitué à travailler ensemble peuvent appliquer des règles de discussion convenues. Par exemple, chaque personne peut attendre que les autres aient participé avant de publier une deuxième fois.
      * Loomio offre des outils souples pour les échanges dans les petits et les grands groupes, grâce aux groupes principaux et aux sous-groupes. Certaines consultations de grande ampleur réunissent les contributions de plusieurs petits groupes dans une conclusion commune.
      * Les personnes qui ont besoin de réfléchir seules peuvent prendre du temps, puis revenir partager un commentaire plus long ou un lien vers un document. Elles choisissent ainsi elles-mêmes comment alterner réflexion individuelle et échanges collectifs.
      * Les fonctionnalités d’accessibilité et les traductions de Loomio permettent à des personnes aux besoins très différents de participer à une même discussion sur un pied d’égalité. La technologie peut ainsi rendre possible une participation équitable qu’il serait très difficile d’obtenir en personne.
      * Si une personne contribue beaucoup plus que les autres, il est techniquement possible de passer ses messages en faisant défiler la page. En personne, elle pourrait dominer l’échange. Toutefois, de très longs messages peuvent aussi nuire à l’équilibre d’une discussion sur Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bb74ebca94285a48:
    english: "## Counter Cognitive Bias"
    translation: "## Réduire les biais cognitifs"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c8d4a9a10da47a62:
    english: Human brains have evolved over millions of years to balance quick, efficient “good enough” thinking with slow, expensive, deep analysis. This allows us to use instincts, heuristics, and generalisations as cheap and fast solutions most of the time, and to engage deep analysis when needed.
    translation: Au fil de millions d’années, le cerveau humain a appris à combiner une réflexion rapide et suffisamment efficace avec une analyse plus lente et approfondie, qui demande davantage d’efforts. Nous pouvons ainsi nous appuyer la plupart du temps sur nos intuitions, nos raccourcis mentaux et nos généralisations, puis analyser plus en profondeur quand c’est nécessaire.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3a35775e59cdea17:
    english: But sometimes we get it wrong. In fact, there are well-known “bugs” in the human cognition program, which can keep people from making the best decisions. This is further complicated in group situations. We need to be aware of these dynamics.
    translation: Mais ces raccourcis nous induisent parfois en erreur. Certains biais connus de la pensée humaine peuvent empêcher de prendre les meilleures décisions. La situation se complique encore au sein d’un groupe. Il faut garder ces dynamiques à l’esprit.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e3d808eb17e1aa5a:
    english: There is a huge [range of cognitive biases](https://en.wikipedia.org/wiki/List_of_cognitive_biases) (this list is really worth a read), all of which have potential impacts on decision making and collaboration. Facilitation can be an important tool to deal with them, to raise awareness of their existence, encourage proactive choices about them. For example, asking when is it more important to move quickly and when is it more important to be accurate.
    translation: Il existe de nombreux [biais cognitifs](https://en.wikipedia.org/wiki/List_of_cognitive_biases), qui peuvent tous influencer les décisions et la collaboration. L’animation peut aider le groupe à les reconnaître et à choisir comment y répondre. Vous pouvez, par exemple, lui demander quand il vaut mieux aller vite et quand il vaut mieux privilégier la précision.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c4755a454121a7b6:
    english: One powerful tool to counter cognitive bias and increase quality of decisions is structured processes and communication. The challenge of following a process instead of the “path of least resistance” can help highlight thinking errors and bias. Facilitators sometimes push for things that feel challenging or trigger resistance, precisely because brains are being asked to step out of familiar patterns. Discipline in this area can help groups achieve their deeper goals, which can be worth some temporary discomfort.
    translation: Des processus et des échanges structurés peuvent réduire les biais cognitifs et améliorer la qualité des décisions. Suivre un processus plutôt que la voie la plus facile aide à repérer les erreurs de raisonnement. Il arrive que les personnes qui animent un groupe proposent une démarche exigeante, même si elle suscite des résistances, pour aider le groupe à sortir de ses habitudes. Cet effort peut lui permettre d’atteindre ses objectifs, malgré un inconfort passager.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  99caa45d2ab4ae8b:
    english: 'Some examples of processes that can help mitigate cognitive bias:'
    translation: 'Voici quelques méthodes qui peuvent atténuer les biais cognitifs :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ebd2c767ea8fae2e:
    english: |-
      * [De Bono’s Hats](http://www.debonoforschools.com/asp/six_hats.asp): different colored hats participants can wear (metaphorically) to step outside their own opinions and try on different modes of thinking.
      * Checklists: thinking “ruts” can cause us to miss even obvious things (especially in areas we're very familiar with), so a checklist can weed out errors.
      * The Five Why’s: only asking why once or twice can mislead you into thinking you’ve reached the conclusion before you get to the root level of the issue. Asking five times tends to get to the bottom of it.
      * Mental models: exercises like [SWOT analysis](https://en.wikipedia.org/wiki/SWOT_analysis), the [business model canvas](https://en.wikipedia.org/wiki/Business_Model_Canvas), or any number of countless other structured information gathering exercises can guide you to cleaner analysis and reveal assumptions.
    translation: |-
      * [Les chapeaux de De Bono](http://www.debonoforschools.com/asp/six_hats.asp) : les personnes portent symboliquement des chapeaux de couleurs différentes pour prendre du recul par rapport à leurs opinions et essayer d’autres modes de pensée.
      * Les listes de vérification : les habitudes de pensée peuvent nous faire manquer même des éléments évidents, surtout dans un domaine familier. Une liste aide à repérer ces oublis.
      * Les cinq pourquoi : demander « pourquoi » une ou deux fois peut donner l’impression d’avoir trouvé la réponse avant d’avoir atteint la cause profonde du problème. Répéter la question cinq fois aide à aller au fond des choses.
      * Les modèles d’analyse : des exercices comme [l’analyse SWOT](https://en.wikipedia.org/wiki/SWOT_analysis), le [canevas de modèle économique](https://en.wikipedia.org/wiki/Business_Model_Canvas) et d’autres méthodes structurées de collecte d’informations peuvent guider l’analyse et révéler des hypothèses implicites.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  073fb22a0e7cd744:
    english: |-
      * Diverse information and inputs can disrupt assumptions or bias. This is built into Loomio’s basic design: by enabling more voices to contribute to a discussion on a more equitable basis, you have a chance to escape “groupthink”.
      * Loomio gives participants the ability to dissent constructively. Safe and valued dissent is essential for a culture of critical thinking.
      * Communicating asynchronously in writing slows conversation down and lets it be more carefully considered, giving people a chance to think more carefully and avoid cognitive errors.
      * Loomio invites people into a semi-structured process that leads to more considered decision making. Loomio can be used for a huge range of different processes, but simply having *some* structure in a discussion enables other possibilities.
    translation: |-
      * Des informations et des contributions variées peuvent remettre en question les hypothèses et les biais. Ce principe fait partie de la conception de Loomio : en donnant à davantage de personnes la possibilité de contribuer à une discussion sur un pied d’égalité, le groupe peut échapper à la pensée de groupe.
      * Loomio permet aux personnes participantes d’exprimer un désaccord constructif. Pouvoir exprimer un désaccord sans crainte, et savoir qu’il sera pris en compte, est essentiel à une culture de l’esprit critique.
      * Les échanges écrits et asynchrones ralentissent la conversation. Chacun a ainsi plus de temps pour examiner ses idées et éviter certaines erreurs de raisonnement.
      * Loomio propose un processus en partie structuré qui favorise des décisions réfléchies. Il peut servir à de nombreux types de processus. Même une structure légère ouvre de nouvelles possibilités dans une discussion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4ae16a63e2dd047a:
    english: "## Balancing Divergent & Convergent"
    translation: "## Trouver l’équilibre entre divergence et convergence"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2983c2d32846ebd5:
    english: The “diamond” of divergence and convergence is a conversational shape. It expands outward at first — opening up space for ideas, information, and different perspectives — then begins to come to a point. The right timing for this shift is key for effective facilitation of action-oriented, productive, collaborative discussions.
    translation: Le « diamant » de la divergence et de la convergence représente la forme d’une conversation. Elle s’élargit d’abord pour accueillir des idées, des informations et des points de vue différents, puis se resserre progressivement. Choisir le bon moment pour passer d’une phase à l’autre est essentiel pour animer des discussions collectives productives qui débouchent sur une action.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bce4c52d377dbdbd:
    english: If divergence is missed out or cut off too early, there will be a lack of information to work with, people may not feel heard, and great ideas will be left unsaid. If convergence is missed out or left too late, discussion can continue indefinitely without reaching an actionable conclusion, burning participants energy and failing to achieve results.
    translation: Si la phase de divergence est omise ou interrompue trop tôt, le groupe manque d’informations, certaines personnes peuvent ne pas se sentir écoutées et de bonnes idées restent inexprimées. Si la convergence est omise ou arrive trop tard, la discussion peut se prolonger sans aboutir à une conclusion applicable. Les personnes participantes y consacrent alors de l’énergie sans obtenir de résultat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9f787be37e0492cc:
    english: Each sub-phase of the larger process also requires awareness of the right timing and intervention. Divergence consists of introduction, clarification, ideation. Convergence consists of analysis, conclusion, commitment. Some discussions succeed with only a vague nod toward the diamond, while others are served by a meticulous breakdown of each phase and sub-phase.
    translation: Chaque étape du processus demande aussi une intervention au bon moment. La divergence comprend la présentation du sujet, sa clarification et la recherche d’idées. La convergence comprend l’analyse, la conclusion et l’engagement. Pour certaines discussions, il suffit de suivre ces grandes phases. Pour d’autres, il est utile de définir précisément chaque étape.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d8c7970db55ea11:
    english: Within a group, different individuals will usually tend to prefer one mode or the other, and the group as a whole will have collective tendencies. Imbalance looks like too much blue sky thinking, or jumping to solutions. Facilitation can help each person and the group as a whole spend the right amount of energy on the different modes.
    translation: Dans un groupe, certaines personnes préfèrent généralement l’un de ces modes à l’autre. Le groupe a aussi ses propres tendances. Un déséquilibre peut se traduire par trop d’idées abstraites ou par une recherche de solutions trop rapide. L’animation aide chacun et le groupe entier à consacrer l’énergie nécessaire à chaque phase.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  36405c3bfcb951b6:
    english: |-
      * The core Loomio process does an excellent job of guiding groups to touch on each phase of the process, with the discussion being divergent and proposals being convergent. Awareness of the diamond was a big inspiration for the original design of the Loomio process.
      * Loomio helps groups to use the diamond in dynamic ways, such as when an attempt to converge (a proposal) ends up becoming a deeper level of divergence (disagreement), revealing or clarifying information to support an even better convergence (iterated proposal).
      * Some of Loomio’s basic features go a long way toward supporting each mode, such as notifications to group members when a new discussion is starting (prompting divergent contribution), and deadlines on proposals (prompting participation in convergence).
      * Loomio users are already able to use the existing feature set to facilitate convergence — namely starting a proposal. Good use of proposals is one of the most obvious symptoms of an effective Loomio group, and simply advising users to start more proposals unblocks many groups who are having issues.
    translation: |-
      * Le processus de base de Loomio guide les groupes à travers ces phases : la discussion favorise la divergence et les propositions favorisent la convergence. Le modèle du diamant a fortement inspiré la conception initiale de ce processus.
      * Loomio aide les groupes à suivre ce modèle avec souplesse. Une proposition destinée à faire converger les avis peut, par exemple, révéler un désaccord. Celui-ci apporte de nouvelles informations, qui permettent ensuite de formuler une meilleure proposition.
      * Des fonctionnalités simples soutiennent chaque phase. Les notifications envoyées aux membres du groupe au début d’une discussion encouragent l’exploration des idées. Les dates limites des propositions encouragent la participation à la convergence.
      * Pour faciliter la convergence, les personnes qui utilisent Loomio peuvent lancer une proposition. Un groupe qui utilise bien les propositions prend souvent des décisions plus efficacement. Conseiller à un groupe en difficulté de lancer davantage de propositions peut l’aider à avancer.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  af83d6e3b408e008:
    english: "## Working with Scope"
    translation: "## Définir la portée du travail"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  209f071ae0c7ae0f:
    english: Successful collaboration often depends on biting off the right size pieces in the right order.
    translation: Une collaboration réussie dépend souvent de la capacité du groupe à traiter des sujets de taille adaptée, dans le bon ordre.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  24658aca54702290:
    english: 'You can apply a “project management” mindset to facilitation, designing for questions like:'
    translation: 'Pour animer le groupe, vous pouvez adopter une approche de gestion de projet et vous poser les questions suivantes :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '09c7ee57551e1980':
    english: |-
      * What are the dependencies (what’s the critical path, which things need to be done first to enable other things)?
      * What are the most important bits to focus on? What can be left out?
      * What is an achievable scope to tackle at a given time to get to a useful place with the time, energy, and information available?
    translation: |-
      * Quelles sont les dépendances ? Quel est le chemin critique ? Que faut-il faire d’abord pour pouvoir avancer sur le reste ?
      * Quels sont les points les plus importants ? Que peut-on laisser de côté ?
      * Quelle portée est réaliste à ce stade pour obtenir un résultat utile avec le temps, l’énergie et les informations disponibles ?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bca4d47c3dc6f3cf:
    english: It’s important not to try to “boil the ocean”, and instead break things down into manageable chunks. You can build toward a bigger outcome in a series of smaller pieces. It’s often better to achieve something small but useful, than to fail to reach any conclusions. It’s also possible to get too bogged down in details and fail to hit the bigger issues.
    translation: Il est important de ne pas vouloir tout traiter à la fois. Découpez plutôt le travail en étapes gérables. Une série de petites avancées peut mener à une conclusion plus ambitieuse. Mieux vaut souvent accomplir quelque chose de modeste mais utile que ne parvenir à aucune conclusion. À l’inverse, s’attarder trop sur les détails peut faire perdre de vue les questions essentielles.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ce5ed5c5115c7b90:
    english: In a collaboration, no one knows exactly what will emerge, so scope must evolve with the discussion. Whether branching out at a given moment is a distraction or an evolution is a judgement call. Too much rigidity and too much flexibility can both be damaging. Often times it’s not about whether something is relevant or not, but a question of sequence and timing in terms of what will be most constructive.
    translation: Dans une collaboration, personne ne sait exactement ce qui va émerger. Le périmètre doit donc évoluer avec la discussion. Déterminer si une nouvelle piste est une distraction ou une évolution demande du discernement. Trop de rigidité comme trop de souplesse peuvent nuire au travail. Souvent, la question est moins de savoir si un sujet est pertinent que de choisir le bon moment et le bon ordre pour l’aborder.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3510d751f00b1ae6:
    english: "> If you plan a session with multiple, interlinked parts – each one building on the other, and all leading to a life-changing, mind-exploding conclusion – and you can pull it off, then that’s amazing. But more often than not, a complicated session will go over-time and may not hit the participant’s wants and needs. - Silvia Zuur"
    translation: "> Si vous prévoyez une séance composée de plusieurs parties liées entre elles, chacune s’appuyant sur la précédente et menant à une conclusion qui bouleverse les perspectives, et que vous y parvenez, c’est remarquable. Mais, le plus souvent, une séance compliquée dépasse le temps prévu et risque de ne pas répondre aux attentes et aux besoins des personnes qui y participent. - Silvia Zuur"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9204dd47d88ac308:
    english: |-
      ## A series of small yes's
      Lumping too many conversations together simply creates confusion. Frustrated groups are often helped by breaking things down. If an issue seems hopeless, complex or conflicted, it can be possible to separate out individual questions and reach consensus on them, starting with the easiest things to agree. Then when it comes to points of disagreement, you can pare it down to only the crux of the issues and work on them in a focused way.
    translation: |-
      ## Une série de petits accords
      Regrouper trop de conversations ne fait qu’ajouter de la confusion. Décomposer le travail aide souvent les groupes qui rencontrent des difficultés. Quand une question semble insoluble, complexe ou conflictuelle, vous pouvez parfois la diviser en questions distinctes et chercher un consensus sur chacune, en commençant par les points les plus faciles à approuver. Vous pourrez ensuite vous concentrer sur les principaux points de désaccord.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2d86c0488159e380:
    english: |-
      * Topic-based discussion threads are a powerful tool for effective scope — even more than face-to-face conversation, Loomio discussions can be usefully delineated to encourage focus on a specific question, while other aspects can be addressed simultaneously in other threads.
      * We often see users making facilitation interventions like “That’s out of the scope of this topic, but why don’t you start a new discussion about it?”
      * The act of creating a Loomio group helps define who are we and what are we here to discuss. This helps participants manage scope.
      * The sequential proposals design of Loomio is very good for a “series of small yess's” approach — you can build small agreements while maintaining context in a single discussion thread, and build on the history of previous proposals.
      * Asynchronous online communication can allow some people to go way out of scope without holding up others. They can simply start a new discussion or subgroup and go as deep and long as they want, while the main scope of the group is maintained.
      * The discussion context box and group description are spaces to define the scope of a conversation or group, respectively.
    translation: |-
      * Les fils de discussion centrés sur un sujet aident à définir un périmètre clair. Plus encore que dans une conversation en personne, les discussions sur Loomio peuvent rester centrées sur une question précise, tandis que d’autres aspects sont traités en parallèle dans d’autres fils.
      * Il arrive souvent qu’une personne intervienne pour faciliter la discussion en disant : « Cela sort du cadre de ce sujet. Pourquoi ne pas lancer une nouvelle discussion à ce propos ? »
      * Créer un groupe Loomio aide à définir qui en fait partie et ce dont ses membres souhaitent discuter. Cela aide les personnes participantes à délimiter les sujets.
      * La succession des propositions sur Loomio se prête à une série de petits accords. Vous pouvez progresser par étapes dans un même fil de discussion, tout en conservant le contexte et en vous appuyant sur les propositions précédentes.
      * La communication asynchrone permet à certaines personnes d’explorer un sujet annexe sans ralentir les autres. Elles peuvent ouvrir une nouvelle discussion ou créer un sous-groupe et approfondir ce sujet autant qu’elles le souhaitent, tandis que le groupe reste concentré sur son sujet principal.
      * Le contexte d’une discussion et la description d’un groupe permettent de définir le périmètre de leurs échanges respectifs.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0b70d200637c265f:
    english: "## Pacing & Timing"
    translation: "## Rythme et calendrier"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d2b056c4b3edb54a:
    english: A productive conversation has a rhythm. The right beat comes from a complex combination of factors and often feels intuitive, like a musician improvising. When is the moment to go deeper, or pull back? When is it right to bring in new information, or further delve into what’s already on the table? This is pacing.
    translation: Une conversation productive a son propre rythme. Ce rythme dépend de nombreux facteurs et se règle souvent à l’intuition, comme lorsqu’une personne improvise en musique. Quand faut-il approfondir un point ou prendre du recul ? Quand faut-il apporter de nouvelles informations ou examiner davantage celles dont on dispose déjà ? C’est tout l’enjeu du rythme.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d421940782402742:
    english: Different participants will have different needs and preferences — some will need reigning in, while others need pulling along. The right pace emerges when a creative tension between digging deeper and moving forward is found. When it’s off, people will feel frustrated — either impatient or left behind.
    translation: 'Les personnes participantes ont des besoins et des préférences différents : certaines ont besoin d’être freinées, d’autres d’être encouragées à avancer. Le bon rythme naît d’un équilibre entre approfondissement et progression. Sans cet équilibre, certaines personnes s’impatientent tandis que d’autres peinent à suivre.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7165c12910a2b3bb:
    english: |-
      * Because it’s asynchronous, people can read and respond at their own pace on Loomio, allowing a natural pace to emerge.
      * It’s possible to scroll right past people moving slowly and push for forward momentum, and simultaneously possible to continue digging into something slowly while others press forward. This is not possible in synchronous communication.
      * Proposal deadlines are a pace-setting tool. Topics that need to move quickly use shorter timeframes, and longer ones can have more time. Different decisions can go at different speeds.
      * It’s easy to modulate your own pace of engagement. If a conversation is moving too fast or slowly for you, you can drop your input and step back, and then return later when a proposal is raised.
      * It’s interesting to note how a “fast” decision on Loomio is 1 or 2 days, while a “fast” decision in person is more like 5 minutes. And yet, Loomio does not seem “slow”, the way taking 2 days to reach a decision in person would. Loomio runs decisions in parallel to other ongoing work, and it's much more efficient gathering everyone’s input on Loomio over 2 days versus having to schedule an in-person meeting.
      * Facilitation on Loomio could be likened to “bullet time” (when Neo can stop time and just walk around a bullet in the Matrix) — you can walk through a living conversation frame by frame. It’s like a superpower.
    translation: |-
      * Grâce aux échanges asynchrones sur Loomio, chacun peut lire et répondre à son rythme. Un rythme collectif peut ainsi se former naturellement.
      * Vous pouvez avancer sans attendre les personnes qui prennent plus de temps, tout en continuant à approfondir un point pendant que d’autres progressent. Une communication synchrone ne permet pas ces deux mouvements simultanés.
      * Les dates limites des propositions permettent de régler le rythme. Les sujets urgents peuvent avoir des délais courts, tandis que d’autres disposent de plus de temps. Chaque décision peut avancer à sa propre vitesse.
      * Vous pouvez facilement adapter votre niveau de participation. Si une conversation avance trop vite ou trop lentement pour vous, vous pouvez apporter votre contribution, prendre du recul, puis revenir lorsqu’une proposition est présentée.
      * Sur Loomio, une décision « rapide » prend un ou deux jours, contre environ cinq minutes en personne. Pourtant, Loomio ne paraît pas lent comme le serait une réunion en personne qui durerait deux jours pour prendre une décision. Les décisions avancent en parallèle des autres activités. Recueillir les avis de tout le monde sur Loomio pendant deux jours est bien plus efficace que d’organiser une réunion en personne.
      * Faciliter une discussion sur Loomio ressemble à l’effet « bullet time » de Matrix, lorsque Neo arrête le temps pour contourner une balle : vous pouvez parcourir une conversation vivante image par image. C’est presque un superpouvoir.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  79fbcf8bb8520bf1:
    english: "## Managing the Attention Economy"
    translation: "## Gérer l’attention"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c71302b08c3b6394:
    english: A facilitator is a curator of attention. The information available can be literally infinite. It becomes critical to filter it in order to avoid becoming overwhelmed. Managing the attention economy means balancing importance against time and capacity.
    translation: La personne qui facilite les échanges aide le groupe à orienter son attention. La quantité d’informations disponibles peut être presque infinie. Il faut donc les filtrer pour éviter la surcharge. Gérer l’attention consiste à tenir compte à la fois de l’importance des sujets, du temps disponible et des capacités du groupe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  865afb1b25257bbd:
    english: Facilitation can help the group agree what the purpose and scope of a given discussion or process is, so they can have a rubric for prioritising attention. Limiting distractions and steering the conversation back on track are common interventions.
    translation: La facilitation peut aider le groupe à s’accorder sur le but et le périmètre d’une discussion ou d’un processus. Il dispose ainsi de critères pour déterminer où porter son attention. Limiter les distractions et recentrer la conversation sont des interventions courantes.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3dd99b496718a570:
    english: Another important way facilitators work with attention is to insist on the group holding it long enough. When things get challenging, unclear, or uncomfortable, people to want to give up too soon, jump to another topic, or look away. A facilitator can help the group see things through, in service of their collective goals.
    translation: La personne qui facilite les échanges aide aussi le groupe à maintenir son attention assez longtemps. Quand un sujet devient difficile, flou ou inconfortable, certaines personnes veulent abandonner trop tôt, passer à autre chose ou détourner le regard. La facilitation peut aider le groupe à poursuivre son travail jusqu’au bout, au service de ses objectifs communs.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  811f79cee2eed8c1:
    english: 'Structured processes and information sorting exercises are important facilitation tools in this area. Some examples:'
    translation: 'Les processus structurés et les exercices de tri des informations sont utiles pour gérer l’attention. Par exemple :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1254ab2b182bbd46:
    english: |-
      * **Time-boxing** — specifying a period of brainstorming, or conversation on a given topic.
      * **Agenda prioritisation** — listing everything people want to talk about and then picking to top items to focus on, before jumping into content.
      * **Post-it cloud** — generating a bunch of ideas or questions and grouping them thematically and then condensing them into topics.
      * **Parking lot** — a space to stick ideas or questions that come up that are not immediately relevant, to be addressed later.
      * **What does success look like??** Defining success criteria and keeping the group focused on it until those criteria are achieved.
    translation: |-
      * **Limiter le temps** — fixer une durée pour la recherche d’idées ou la discussion d’un sujet.
      * **Définir les priorités de l’ordre du jour** — recenser tous les sujets que les personnes souhaitent aborder, puis choisir les principaux avant de commencer la discussion.
      * **Regrouper les notes adhésives** — recueillir des idées ou des questions, les classer par thème, puis les réunir en quelques sujets.
      * **Mettre des sujets de côté** — prévoir un espace pour noter les idées et les questions qui ne sont pas immédiatement pertinentes, afin d’y revenir plus tard.
      * **À quoi reconnaîtra-t-on la réussite ?** Définir des critères de réussite et aider le groupe à rester concentré jusqu’à ce qu’ils soient atteints.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  11cc1fd7daee10e8:
    english: |-
      * One of the most important attention management features in Loomio is topic-based discussion threading. There’s a reason why this format was one of the first to emerge in online communication decades ago, and continues to be used widely today: it’s a highly effective way to sort attention. Most Loomio users intuitively understand how to stay on topic when it’s listed in big letters at the top of the page.
      * Activity in Loomio is the currency of its attention economy, and everything that generates a notification spends that currency. The software has opinions about what should be considered “salient” activity that generates notifications (for example, comments, votes, and outcomes are, while a “like” on a comment is not), developed based on user feedback.
      * Users can exercise a lot of customised control over their Loomio attention economy through notification settings. Helping users set these preferences is an important tool to wisely using the attention economy of the group.
      * Subgroups can be a powerful tool to help people moderate their attention economy. If only some people need to pay attention, you can split it out.
      * The intentional but somewhat unpopular design decision to disallow concurrent proposals in Loomio is about the flow of attention — holding a group’s “feet to the fire” to fully process a proposal before moving on.
    translation: |-
      * Les fils de discussion centrés sur un sujet sont l’un des principaux moyens de gérer l’attention sur Loomio. Ce format est apparu très tôt dans les échanges en ligne et reste largement utilisé, car il aide à répartir l’attention. Quand le sujet est clairement indiqué en haut de la page, la plupart des utilisateurs de Loomio comprennent spontanément comment s’y tenir.
      * Sur Loomio, l’activité mobilise l’attention du groupe. Chaque notification sollicite une part de cette attention. À partir des retours des utilisateurs, le logiciel distingue les activités qui justifient une notification, comme les commentaires, les votes et les conclusions, de celles qui n’en justifient pas, comme une mention « J’aime » sur un commentaire.
      * Les paramètres de notification permettent aux utilisateurs de choisir ce qui sollicite leur attention sur Loomio. Les aider à régler ces préférences contribue à une bonne gestion de l’attention du groupe.
      * Les sous-groupes peuvent aider à limiter les sollicitations. Si un sujet ne concerne qu’une partie des personnes, vous pouvez le traiter dans un sous-groupe.
      * Sur Loomio, le choix de ne pas autoriser plusieurs propositions simultanées vise à concentrer l’attention du groupe sur une proposition jusqu’à son examen complet. Cette décision de conception est volontaire, même si elle ne plaît pas à tout le monde.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e522b56bbe8b16c9:
    english: "> Many designers of information systems incorrectly represented their design problem as information scarcity rather than attention scarcity, and as a result they built systems that excelled at providing more and more information to people, when what was really needed were systems that excelled at filtering out unimportant or irrelevant information. — **[Wikipedia](https://en.wikipedia.org/wiki/Attention_economy)**"
    translation: "> Beaucoup de personnes qui conçoivent des systèmes d’information ont cru, à tort, que le problème était le manque d’informations plutôt que le manque d’attention. Elles ont donc créé des systèmes capables de fournir toujours plus d’informations, alors qu’il fallait surtout des systèmes capables d’écarter les informations sans importance ou sans pertinence. — **[Wikipédia](https://en.wikipedia.org/wiki/Attention_economy)**"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  12f78aa04c29d66d:
    english: "## Facilitation Interventions"
    translation: "## Interventions de facilitation"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  51065e352a92bf84:
    english: There are as many facilitation techniques as there are facilitators in the world, and entire libraries of books have been written on the topic. It’s not possible to provide a comprehensive list of interventions.
    translation: Il existe autant de techniques de facilitation que de personnes qui les pratiquent, et des bibliothèques entières leur sont consacrées. Il est impossible d’en dresser une liste exhaustive.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1e23df53c3b816be:
    english: 'However, it might be useful to consider two categories of interventions:'
    translation: 'Il peut toutefois être utile de distinguer deux catégories d’interventions :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d5738a06518b45da:
    english: |-
      1. **Supportive interventions**: inviting contribution, going deeper, drawing out, coaxing, nurturing, protecting, creating space.
      2. **Assertive interventions**: pulling back, shutting down, drawing lines, interrupting, challenging, steering on course, excluding bad behaviour.
    translation: |-
      1. **Interventions de soutien** : inviter à contribuer, approfondir, faire émerger des idées, encourager, accompagner, protéger et faire de la place aux autres.
      2. **Interventions de cadrage** : prendre du recul, mettre fin à un échange, fixer des limites, interrompre, remettre en question, recentrer et écarter les comportements inappropriés.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9f30fd7cd75da986:
