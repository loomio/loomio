    translated_on: '2026-09-29'
  2df60ea964109f11:
    english: "## Group data is permanently deleted after 90 days"
    translation: "## I dati del gruppo vengono cancellati definitivamente dopo 90 giorni"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e09923078301b8d:
    english: After 90 days, all the threads, polls, files and other group content will be permanently deleted. ***This is non-reversible!***
    translation: Dopo 90 giorni, tutte le discussioni, i sondaggi, i file e gli altri contenuti del gruppo saranno cancellati definitivamente. ***La cancellazione è irreversibile.***
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8695a5ebfb09611d:
    english: We recommend that you [export the group data](/en/user_manual/groups/data_export/)and manually download any important files you have uploaded before you continue.
    translation: Ti consigliamo di [esportare i dati del gruppo](/en/user_manual/groups/data_export/)e di scaricare manualmente tutti i file importanti che hai caricato prima di continuare.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
