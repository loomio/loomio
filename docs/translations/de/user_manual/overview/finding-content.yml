  f268a5ae052b3df4:
    english: "# Finding content"
    translation: "# Inhalte finden"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2f06a9491227b073:
    english: Loomio provides several ways to find discussions and decisions across your groups.
    translation: Loomio bietet dir mehrere Möglichkeiten, Diskussionen und Entscheidungen in deinen Gruppen zu finden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  62c53ea4911e0c79:
    english: "## Search"
    translation: "## Suche"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  29cbb6f48ca978fa:
    english: The Search button in the top navigation bar opens global search from any page in Loomio.
    translation: Über die Schaltfläche „Suchen“ in der oberen Navigationsleiste kannst du von jeder Loomio-Seite aus die globale Suche öffnen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6286c9b6f2b16fc4:
    english: Search includes content you can access across all your groups and direct discussions. It can find discussion titles and context, comments, polls, votes, and outcomes.
    translation: Die Suche umfasst Inhalte, auf die du in deinen Gruppen und direkten Diskussionen zugreifen kannst. Sie findet Diskussionstitel und Beschreibungen, Kommentare, Abstimmungen, Stimmen und Fazits.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c5a77d75258a11e6:
    english: Enter a word or phrase, then press Enter or select the search icon. For example, searching for **bottle** finds Oatmilk Cooperative content containing that word.
    translation: Gib ein Wort oder eine Wortgruppe ein und drücke die Eingabetaste oder wähle das Suchsymbol. Wenn du zum Beispiel nach **bottle** suchst, findest du Inhalte der Oatmilk Cooperative mit diesem Wort.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1b93fd8aaf142d37:
    english: "### Search tips"
    translation: "### Tipps für die Suche"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  99f906ecbde3a538:
    english: "- Start with one or two distinctive words from the title or content you remember.\n- Search matches the beginning of a word, so a partial word such as **bott** can match **bottle**. \n- It will compensate for misspellings when results for the given query are very few.\n- Use the filters to limit results to an organization, subgroup, tag, or content type such as comments or polls.\n- Sort by **Best match** when relevance matters, or by newest or oldest when you know roughly when the content was posted."
    translation: "- Beginne mit einem oder zwei markanten Wörtern aus dem Titel oder Inhalt, an die du dich erinnerst.\n- Die Suche erkennt Wortanfänge. Ein Wortteil wie **bott** kann daher **bottle** finden. \n- Wenn es für deine Suchanfrage nur sehr wenige Ergebnisse gibt, berücksichtigt die Suche auch mögliche Tippfehler.\n- Nutze die Filter, um die Ergebnisse auf eine Organisation, Untergruppe, ein Schlagwort oder eine Inhaltsart wie Kommentare oder Abstimmungen einzugrenzen.\n- Sortiere nach **Bester Treffer**, wenn du die relevantesten Ergebnisse zuerst sehen möchtest. Wenn du ungefähr weißt, wann der Inhalt veröffentlicht wurde, sortiere nach den neuesten oder ältesten Einträgen."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e7c532f120c4807d:
    english: "## Filter discussions"
    translation: "## Diskussionen filtern"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  91bf7098343a1efa:
    english: Use the controls beside Search to filter discussions by open or closed status or by category tag. Combining a search term with a filter can narrow a long discussion list quickly.
    translation: Mit den Steuerelementen neben der Suche kannst du Diskussionen nach offenem oder geschlossenem Status oder nach Schlagwort filtern. Kombiniere einen Suchbegriff mit einem Filter, um eine lange Liste von Diskussionen schnell einzugrenzen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e3d2099d0e6fe6fa:
    english: "## Category tags"
    translation: "## Schlagwörter"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  932506e53b51fac1:
    english: Tags group related discussions and polls under names chosen by your group, such as a project, team, or area of work.
    translation: Schlagwörter fassen zusammengehörige Diskussionen und Abstimmungen unter Namen zusammen, die deine Gruppe festlegt, zum Beispiel für ein Projekt, ein Team oder einen Arbeitsbereich.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d761f1c7397d8e51:
    english: Select a tag on the **Discussions** tab to show matching discussions. People with permission to start or edit discussions can apply tags. See [Category tags](/en/user_manual/discussions/tags) for setup and permission details.
    translation: Wähle im Tab **Diskussionen** ein Schlagwort aus, um passende Diskussionen anzuzeigen. Personen, die Diskussionen starten oder bearbeiten dürfen, können Schlagwörter vergeben. Unter [Schlagwörter](/en/user_manual/discussions/tags) erfährst du mehr über die Einrichtung und Berechtigungen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b620c9f42e31a54f:
    english: "## Unread discussions"
    translation: "## Ungelesene Diskussionen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b2f3737cd46d903a:
    english: Select **Unread discussions** in the sidebar to see discussions with activity you have not read. Within a discussion, the timeline helps you move to unread items and important events.
    translation: Wähle in der Seitenleiste **Ungelesene Diskussionen**, um Diskussionen mit Aktivitäten zu sehen, die du noch nicht gelesen hast. In einer Diskussion hilft dir die Zeitleiste, ungelesene Beiträge und wichtige Ereignisse zu finden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e016a4cafcaee460:
    english: "## Polls awaiting your vote"
    translation: "## Abstimmungen, bei denen deine Stimme aussteht"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  873929c0f1d06567:
    english: Select **Polls to vote on** in the sidebar to see active polls where you have been invited but have not yet voted. You can also open a group's **Polls** tab to see its active and closed polls.
    translation: Wähle in der Seitenleiste **Umfragen zum Abstimmen**, um laufende Abstimmungen zu sehen, zu denen du eingeladen wurdest und bei denen du noch nicht abgestimmt hast. Im Tab **Abstimmungen** einer Gruppe findest du deren laufende und abgeschlossene Abstimmungen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3bb08c3343e3efd7:
    english: "## Bookmarks"
    translation: "## Lesezeichen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1bec2703cc5fe70a:
    english: Bookmark a discussion, comment, poll, vote, or outcome when you want to return to it. Open **Bookmarks** from your user menu to see everything you have saved. See [Bookmarks](/en/user_manual/users/bookmarks) for details.
    translation: Setze ein Lesezeichen für eine Diskussion, einen Kommentar, eine Abstimmung, eine Stimme oder ein Fazit, wenn du später darauf zurückkommen möchtest. Öffne **Lesezeichen** in deinem Benutzermenü, um alle gespeicherten Inhalte zu sehen. Weitere Informationen findest du unter [Lesezeichen](/en/user_manual/users/bookmarks).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
