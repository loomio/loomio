  bea1dad1b0b47107:
    english: Use tasks in threads and comments to name an action, assign it to someone, set a due date, and track whether it is complete.
    translation: A témákban és hozzászólásokban feladatokkal nevezheted meg a teendőket, hozzárendelheted őket valakihez, határidőt adhatsz meg, és követheted, hogy elkészültek-e.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2398b3493bad759e:
    english: "## Add a task"
    translation: "## Feladat hozzáadása"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c240866e019fab51:
    english: While writing a thread or comment, expand the formatting toolbar and click **Task list**. Type the action beside the checkbox.
    translation: Téma vagy hozzászólás írásakor nyisd meg a formázási eszköztárat, majd kattints a **Feladatlista** gombra. Írd a teendőt a jelölőnégyzet mellé.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f7d4f63b321e9af1:
    english: "## Name and assign the task to a person"
    translation: "## Feladat elnevezése és hozzárendelése valakihez"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5ea902e45aaf1f7a:
    english: Use an @mention in the task to assign it to a group member. An **Add due date** button appears once the task has an assignee.
    translation: A feladatban @megemlítéssel rendelheted hozzá a teendőt egy csoporttaghoz. Ha a feladatnak van felelőse, megjelenik az **Adj meg egy határidőt** gomb.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1134aedee6cafd8c:
    english: Tasks assigned to you appear on your **Tasks** page. Open **Tasks** from the sidebar to see them grouped by thread or poll.
    translation: 'A hozzád rendelt feladatok a **Feladatok** oldalon jelennek meg. Az oldalsávban nyisd meg a **Feladatok** oldalt: itt téma vagy szavazás szerint csoportosítva látod őket.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5eae519b81c94f7a:
    english: "## Set a reminder"
    translation: "## Emlékeztető beállítása"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  561597d43d716888:
    english: Click **Add due date** to choose a due date and when Loomio should email the assignee a reminder. You can also remove an existing due date from this dialog.
    translation: Kattints az **Adj meg egy határidőt** gombra, majd válaszd ki a határidőt és azt, hogy a Loomio mikor küldjön e-mailes emlékeztetőt a felelősnek. Ebben az ablakban egy meglévő határidőt is eltávolíthatsz.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bd36c23f297b0429:
    english: "## Mark it as done"
    translation: "## Feladat megjelölése elvégzettként"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  59b6138f35694902:
    english: Click the checkbox beside a task to mark it as done. You can do this while editing the text, while reading it if you are the assignee, or from the **Tasks** page. Click it again to reopen the task.
    translation: Kattints a feladat melletti jelölőnégyzetre, ha elvégezted. Ezt megteheted a szöveg szerkesztése közben, olvasáskor, ha te vagy a felelős, vagy a **Feladatok** oldalon. Kattints rá újra a feladat újbóli megnyitásához.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
