  a4f66c4c94afa135:
    english: The request timeout is five seconds. A `2xx` response, including `204 No Content`, is treated as successful. Webhook consumers should respond promptly, process longer work asynchronously, and tolerate duplicate or out-of-order deliveries.
    translation: Le délai d’expiration de la requête est de cinq secondes. Une réponse `2xx`, y compris `204 No Content`, est considérée comme une réussite. Les services qui reçoivent les webhooks doivent répondre rapidement, traiter les tâches longues de manière asynchrone et accepter les envois en double ou dans le désordre.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  84faa7dad6f34739:
    english: Loomio does not currently add a webhook signature, shared-secret header, event ID, or delivery ID. Treat the full destination URL as a credential, do not expose it publicly, and include an unguessable token in the URL when the receiving service supports one. If a stable machine-readable event schema or signed delivery is required, use the webhook as a change notification and retrieve the current records through the authenticated User API.
    translation: 'Actuellement, Loomio n’ajoute ni signature de webhook, ni en-tête contenant un secret partagé, ni identifiant d’événement ou d’envoi. Traitez l’URL de destination complète comme un secret : ne la rendez pas publique et ajoutez-y un jeton difficile à deviner si le service destinataire le permet. Si vous avez besoin d’un schéma d’événement stable et exploitable par machine ou d’envois signés, utilisez le webhook pour signaler un changement, puis récupérez les données à jour avec l’API utilisateur authentifiée.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
