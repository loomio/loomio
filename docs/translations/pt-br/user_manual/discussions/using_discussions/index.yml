  275f4d9025c017c4:
    english: The headings and labels use your selected language. Content written by participants remains in its original language.
    translation: Os títulos e rótulos aparecem no idioma que você selecionou. O conteúdo escrito pelos participantes permanece no idioma original.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dab18fdf3c56269d:
    english: "### Thread settings and display"
    translation: "### Configurações e exibição da conversa"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7bc55279f97c6d1b:
    english: Group admins can select **Thread settings** to change how replies are arranged and configure other discussion options.
    translation: Administradores do grupo podem selecionar **Configurações de thread** para mudar a organização das respostas e configurar outras opções da discussão.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  32b2640ba23524aa:
    english: Choose **Timeline** to list items in the order they were posted, or **Threaded** to group replies beneath the item they respond to. Thread settings also control whether multiple polls may run at once and can set a maximum comment length. These settings apply to everyone in the discussion.
    translation: Escolha **Linha do tempo** para listar os itens na ordem em que foram publicados ou **Em threads** para agrupar as respostas abaixo do item ao qual respondem. As configurações também controlam se várias enquetes podem ocorrer ao mesmo tempo e permitem definir um limite de caracteres por comentário. Elas se aplicam a todas as pessoas na discussão.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a520339278bcc2a:
    english: "### Pin or unpin a thread"
    translation: "### Afixar ou desafixar uma conversa"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0433e7a61db60003:
    english: Pinned threads appear above other threads on the group page. Welcome discussions, news items, and announcements are typical uses for pinned threads.
    translation: Conversas afixadas aparecem acima das demais na página do grupo. Isso costuma ser útil para discussões de boas-vindas, notícias e avisos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b2712588a5e0aab3:
    english: Open the three-dot menu (**⋯**) beside the thread on the group page and select **Pin thread**. Pinned threads are ordered by the time they were pinned. To change their order, unpin and pin them again.
    translation: Abra o menu de três pontos (**⋯**) ao lado da conversa na página do grupo e selecione **Afixar conversa**. As conversas afixadas são ordenadas pelo momento em que foram afixadas. Para mudar a ordem, desafixe-as e afixe-as novamente.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a0443f076d1b8ae5:
    english: Select **Unpin thread** to return a thread to the activity-based order.
    translation: Selecione **Desafixar conversa** para devolver a conversa à ordem baseada na atividade.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b90a469963b02ffc:
    english: "### Move a thread"
    translation: "### Mover uma conversa"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8b2071f4625705e5:
    english: Select **Move thread** to move a thread to another group, subgroup, or to a direct thread. It will be visible to members of the destination group and anyone specifically invited to it.
    translation: Selecione **Mover tópico** para mover uma conversa para outro grupo, um subgrupo ou uma conversa direta. Ela ficará visível para os membros do grupo de destino e para qualquer pessoa convidada especificamente para participar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f09d5f2afce03ee8:
    english: |-
      >[!Tip]
      >Start a draft as a direct discussion or in a private subgroup, then move it to the group when it is ready.
    translation: |-
      >[!Tip]
      >Comece um rascunho como discussão direta ou em um subgrupo privado. Quando estiver pronto, mova-o para o grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c82562b641053308:
    english: To move selected activity rather than the whole thread, see [Moving items between threads](/en/user_manual/discussions/moving_items/).
    translation: Para mover apenas algumas atividades, consulte [Mover itens entre conversas](/en/user_manual/discussions/moving_items/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  be22d2980075fdaa:
    english: "### Lock or unlock a thread"
    translation: "### Bloquear ou desbloquear uma conversa"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e7c24a610fd2bf8b:
    english: Lock a thread to prevent comments or further changes. A thread can only be locked after its active polls have closed.
    translation: Bloqueie uma conversa para impedir novos comentários ou outras alterações. Só é possível bloqueá-la depois que todas as enquetes ativas forem encerradas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  edb983bb6366aa6c:
    english: Select **Lock thread** under **Actions**. Locked threads are removed from the list of open discussions and marked with a **Locked** tag.
    translation: Selecione **Bloquear tópico** em **Ações**. Conversas bloqueadas saem da lista de discussões abertas e recebem a marca **Bloqueado**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ba2794349524cc33:
    english: To find a locked thread, open the discussion filter on the group page and select **Locked**. Open the thread and select **Unlock thread** to allow comments and changes again.
    translation: Para encontrar uma conversa bloqueada, abra o filtro de discussões na página do grupo e selecione **Bloqueado**. Abra a conversa e selecione **Desbloquear tópico** para permitir novamente comentários e alterações.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3a75fb1ad0ffab87:
    english: "### Delete a thread"
    translation: "### Apagar uma conversa"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0103a5729bd6a095:
    english: Deleting a thread removes it permanently and cannot be undone. Lock the thread instead if you may need it again.
    translation: Ao apagar uma conversa, você a remove permanentemente. Não é possível desfazer essa ação. Se você puder precisar dela novamente, bloqueie a conversa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  daf08ca8895b0fe2:
    english: Select **Delete thread** and confirm the deletion.
    translation: Selecione **Apagar conversa** e confirme a exclusão.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
