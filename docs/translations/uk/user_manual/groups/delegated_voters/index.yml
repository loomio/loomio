navigation_title: Делегати з правом голосу
blocks:
  cde9fe3639ac5e9e:
    english: "# Delegated voters"
    translation: "# Делегати з правом голосу"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9cfb3b7835dc5cb0:
    english: If some members of your group should have voting rights while others should not, you can use the "Make delegate" feature to identify those people with voting rights. There is a corresponding "Revoke delegate" action too.
    translation: Якщо право голосу мають лише деякі учасники вашої групи, позначте їх за допомогою дії «Делегувати». Щоб скасувати це право, скористайтеся дією «Відкликати делегата».
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e017eafb51368777:
    english: Use delegates when people should share the same discussion space but only a defined set, such as directors or elected representatives, may vote. This is usually simpler than maintaining a second subgroup whose only purpose is to separate voters from non-voters.
    translation: Використовуйте делегатів, коли всі мають брати участь у спільних обговореннях, але голосувати може лише визначене коло людей, наприклад члени правління або обрані представники. Зазвичай це простіше, ніж підтримувати окрему підгрупу лише для розмежування тих, хто може голосувати, і тих, хто не може.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1942a47ae47ca813:
    english: Use a private subgroup instead when its members also need discussions, files, or membership information that other members must not see.
    translation: Якщо цим людям також потрібні обговорення, файли або відомості про учасників, недоступні іншим, створіть приватну підгрупу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3346f757dc7bcd14:
    english: "![Make delegate action in a member's menu](member_make_delegate.png)"
    translation: "![Дія «Делегувати» в меню учасника](member_make_delegate.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0b8bb762e37fb8c3:
    english: |-
      To create a poll or proposal and only invite the delegates, use the "Selected people only" poll setting.
      ![Selected people only setting when starting a proposal](poll_invited_people_only.png)
      Then when inviting people to vote you will see the "Delegates of group-name" option.
      ![Delegates of Oatmilk Cooperative option in the invite-to-vote form](poll_invite_delegates_group.png)
    translation: |-
      Щоб створити опитування або пропозицію й запросити лише делегатів, виберіть налаштування «Тільки вибрані люди».
      ![Налаштування «Тільки вибрані люди» під час створення пропозиції](poll_invited_people_only.png)
      Коли запрошуватимете людей голосувати, ви побачите варіант «Делегати назва-групи».
      ![Варіант «Делегати кооперативу Oatmilk» у формі запрошення до голосування](poll_invite_delegates_group.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e895a07efeaf4dcf:
    english: |-
      You can see a list of who the delegates are from the members tab of your group page. Use the filter menu and select "Delegates".
      ![Delegates option in the members filter](members_list_delegates.png)
    translation: |-
      Список делегатів можна переглянути на вкладці учасників сторінки вашої групи. У меню фільтра виберіть «Делегати».
      ![Варіант «Делегати» у фільтрі учасників](members_list_delegates.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
