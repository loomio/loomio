  7fe42bee753b558d:
    english: "`/api/b3` is for server-level operations. Use `/api/b2` for user-oriented actions performed as a Loomio user account."
    translation: "`/api/b3` призначено для операцій на рівні сервера. Для дій від імені користувача Loomio використовуйте `/api/b2`."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
