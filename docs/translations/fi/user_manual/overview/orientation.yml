  cdd3c098983b6066:
    english: 'The tabs under the group description provide access to:'
    translation: 'Ryhmän kuvauksen alla olevilta välilehdiltä löydät:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  02760342b07f5ff4:
    english: "**Discussions** - The group's discussion threads and recent activity."
    translation: "**Keskustelut** - Ryhmän keskusteluketjut ja viimeaikaisen toiminnan."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e2c7a0c137330c27:
    english: "**Polls** - A list of polls active in your group."
