  eecfb12ed1d28d50:
    english: Good governance exists where an organization has systems and processes in place that are appropriate to its circumstances, and which enable the organization to pursue its purpose effectively and meet its obligations under the law.
    translation: Há boa governança quando uma organização tem sistemas e processos adequados à sua realidade, que permitem cumprir seu propósito de forma eficaz e atender às suas obrigações legais.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e54f67d22cf67a93:
    english: "*“It is participatory, consensus-oriented, accountable, transparent, responsive, effective and efficient, equitable and inclusive and follows the rule of law.”* [United Nations Economic and Social Commission for Asia and the Pacific](https://www.unescap.org/sites/default/d8files/knowledge-products/good-governance.pdf)."
    translation: "*“Ela é participativa, orientada para o consenso, responsável, transparente, receptiva, eficaz e eficiente, equitativa e inclusiva, e segue o Estado de Direito.”* [Comissão Econômica e Social das Nações Unidas para a Ásia e o Pacífico](https://www.unescap.org/sites/default/d8files/knowledge-products/good-governance.pdf)."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1661a79cfda1a9df:
    english: Underpinning all of these principles is the need for good communication.
    translation: A boa comunicação é a base de todos esses princípios.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2819f114c9d74160:
    english: 'Here are some or the challenges directors and boards experience:'
    translation: 'Estes são alguns dos desafios enfrentados por conselheiros e conselhos:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ed750814c61b85fb:
    english: "* Getting directors together in person\n* Time available to consider important issues \n* Tracking communication\n* Urgency of critical issues\n* Online video meeting fatigue\n* Directors in multiple, remote locations, sometimes with poor internet connectivity\n* Mixed governance practice and experience\n* Dealing with high volumes of transactional business \n* Maintaining institutional memory"
    translation: "* Reunir os conselheiros presencialmente\n* Dispor de tempo para considerar assuntos importantes \n* Acompanhar as comunicações\n* Tratar de assuntos críticos urgentes\n* Lidar com o cansaço causado por reuniões por vídeo\n* Conectar conselheiros em diferentes localidades, às vezes com acesso precário à internet\n* Conciliar diferentes práticas e níveis de experiência em governança\n* Lidar com um grande volume de assuntos rotineiros \n* Preservar a memória institucional"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b910c5253cf77950:
    english: Loomio offers an opportunity to strengthen governance, to extend collaboration beyond board meetings, to include everyone in open, honest and respectful discussion while documenting everything.
    translation: O Loomio ajuda a fortalecer a governança e a ampliar a colaboração para além das reuniões do conselho. Todas as pessoas podem participar de discussões abertas, francas e respeitosas, com tudo documentado.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
