  0431c9fc46658338:
    english: 'The group participation report gives insights into the usage of your Loomio group. '
    translation: El informe de participación muestra cómo se utiliza tu grupo de Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0d23c0831f1ea6ca:
    english: 'You''re able to choose which groups to include in the report, the start and end date for the report, and the interval (year, month, week or day) for grouping results. '
    translation: Puedes elegir qué grupos incluir en el informe, las fechas de inicio y fin, y el intervalo para agrupar los resultados (año, mes, semana o día).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  73c9822c08a37866:
    english: The report is available to everyone in your group, however users can only see results for groups that they belong to, this means that different users may see slightly different reports.
    translation: Todas las personas de tu grupo pueden acceder al informe, pero cada una solo puede ver los resultados de los grupos a los que pertenece. Por eso, los informes pueden variar ligeramente entre personas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c9402b4720639f86:
    english: 'You can find the report by clicking the group settings menu cog, as shown below. '
    translation: Para encontrar el informe, haz clic en el icono de engranaje del menú de configuración del grupo, como se muestra a continuación.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
