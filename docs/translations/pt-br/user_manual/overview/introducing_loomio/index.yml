---
navigation_title: Apresentando o Loomio ao seu grupo
blocks:
  6c777a62b2b77732:
    english: "# Introducing Loomio to your group"
    translation: "# Apresentando o Loomio ao seu grupo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  438cc622ae730bd8:
    english: Introduce Loomio through one useful piece of work. Prepare the group before inviting people, help everyone participate once, and complete the process through to an outcome.
    translation: Apresente o Loomio por meio de uma atividade útil. Prepare o grupo antes de convidar as pessoas, ajude cada uma a participar e conduza o processo até uma conclusão.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9c9fa4e8f6e208e4:
    english: "## Choose one useful starting point"
    translation: "## Escolha um ponto de partida útil"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3353fb04e83837e5:
    english: Start with a real process that your group already needs. A good first use is small enough to complete soon, but relevant enough that people have a reason to participate.
    translation: Comece com um processo real de que seu grupo já precisa. Para o primeiro uso, escolha algo que possa ser concluído em pouco tempo e seja relevante o bastante para motivar a participação.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  652744a2ab28954b:
    english: 'For example:'
    translation: 'Por exemplo:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  19bc6c09eeea816e:
    english: |-
      - prepare the agenda for an upcoming meeting;
      - review and approve meeting minutes;
      - gather feedback on a draft document;
      - decide a small operational question; or
      - identify priorities for the next month.
    translation: |-
      - preparar a pauta de uma próxima reunião;
      - revisar e aprovar a ata de uma reunião;
      - colher comentários sobre a versão preliminar de um documento;
      - decidir uma pequena questão operacional; ou
      - definir as prioridades para o próximo mês.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  68a0d6b76f36ebaf:
    english: Avoid moving every discussion and decision into Loomio at once. A repeatable process gives the group a clear reason to return and lets you improve the way you run it each time.
    translation: Evite transferir todas as discussões e decisões para o Loomio de uma vez. Um processo que pode ser repetido dá ao grupo um motivo claro para voltar e permite melhorar a forma de conduzi-lo a cada vez.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4b65243ef120921b:
    english: "## Prepare the group before inviting people"
    translation: "## Prepare o grupo antes de convidar as pessoas"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  305b29c1c832c246:
    english: 'Give people a useful and recognizable place to arrive in:'
    translation: 'Prepare um espaço útil e fácil de reconhecer para quem chegar:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  76d859d168805706:
    english: |-
      - add the group's name, logo, cover image, purpose, and important links;
      - check the group's privacy and permissions;
      - add any [category tags](/en/user_manual/discussions/tags) the group will use regularly;
      - create the first real discussion, with the background information people need; and
      - create a practice discussion if members would benefit from trying comments, reactions, and voting without consequences.
    translation: |-
      - adicione o nome, o logotipo, a imagem de capa, o propósito e os links importantes do grupo;
      - confira a privacidade e as permissões do grupo;
      - adicione as [tags de categoria](/en/user_manual/discussions/tags) que o grupo usará com frequência;
      - crie a primeira discussão real, com as informações necessárias para as pessoas participarem; e
      - crie uma discussão de teste se for útil para os membros experimentarem comentários, reações e votações sem consequências.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f1decb57ec9d48cb:
    english: Use your own photo in your profile and the organization's logo for the group. This helps people recognize who invited them and which organization an email is about.
    translation: Use sua própria foto no perfil e o logotipo da organização no grupo. Isso ajuda as pessoas a reconhecer quem as convidou e a identificar a organização mencionada nos e-mails.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '01965093f234bb36':
    english: "## Decide where work belongs"
    translation: "## Decida onde cada atividade acontece"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7fbd0d770cbed2bd:
    english: 'Loomio can sit alongside tools your group already uses:'
    translation: 'O Loomio pode ser usado junto com as ferramentas que seu grupo já utiliza:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '0168271b154f6931':
    english: |-
      | Use | Good place for it |
      |---|---|
      | Quick questions, social conversation, and timely updates | Chat, such as Slack, Teams, Matrix, or Discord |
      | Collaborative editing of a living document | A shared document tool |
      | Assigning work and tracking its completion | A task or project-management tool |
      | A focused discussion, broad participation, a decision, and its lasting record | Loomio |
    translation: |-
      | Uso | Onde fazer |
      |---|---|
      | Perguntas rápidas, conversas informais e atualizações oportunas | Um chat, como Slack, Teams, Matrix ou Discord |
      | Edição colaborativa de um documento em constante atualização | Uma ferramenta de documentos compartilhados |
      | Distribuição de tarefas e acompanhamento da sua conclusão | Uma ferramenta de gestão de tarefas ou projetos |
      | Uma discussão focada, ampla participação, uma decisão e seu registro permanente | Loomio |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  50fae2027411e538:
    english: Link to documents and other systems from the group description or discussion context. Use [chat integrations](/en/user_manual/integrations/chatbots) to bring important Loomio activity into a channel people already follow.
    translation: Inclua links para documentos e outros sistemas na descrição do grupo ou no contexto da discussão. Use as [integrações com chats](/en/user_manual/integrations/chatbots) para levar atividades importantes do Loomio a um canal que as pessoas já acompanham.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ed67af54bdf1c775:
    english: Tell members what you expect to happen in Loomio. A simple boundary such as “important discussions and decisions go in Loomio; quick coordination stays in chat” is easier to adopt than an unexplained new tool.
    translation: Diga aos membros o que você espera que aconteça no Loomio. Uma orientação simples, como “discussões e decisões importantes ficam no Loomio; a coordenação rápida fica no chat”, é mais fácil de seguir do que começar a usar uma nova ferramenta sem explicação.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0a799d7911a46f6f:
    english: "## Decide how your group decides"
    translation: "## Decida como seu grupo toma decisões"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e1c64de2dc68593:
    english: Loomio does not require every group, or every decision, to use the same process. Some groups arrive with established rules. Others use Loomio while they develop a clearer decision-making practice together.
    translation: O Loomio não exige que todos os grupos, ou todas as decisões, sigam o mesmo processo. Alguns grupos já têm regras definidas. Outros usam o Loomio enquanto desenvolvem juntos uma forma mais clara de tomar decisões.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6d0c0f50959ab9d6:
    english: "### If your process is already established"
    translation: "### Se o processo já está definido"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5fbfe86e935d5a8c:
    english: 'Translate the group''s existing requirements into Loomio. Before running a formal decision, make sure participants can tell:'
    translation: 'Adapte as regras existentes do grupo ao Loomio. Antes de conduzir uma decisão formal, garanta que os participantes saibam:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9a1b89bd4c5fe02c:
    english: |-
      - which kinds of decisions can be made in Loomio;
      - who provides input and who has authority to decide;
      - who is eligible to vote;
      - whether a [quorum](/en/user_manual/polls/quorum) is required;
      - whether the decision requires a majority, supermajority, unanimous agreement, consent, or another [vote share requirement](/en/user_manual/polls/vote_share_requirements);
      - whether the decision takes effect when its outcome is published or must be ratified elsewhere; and
      - who will record and carry out the outcome.
    translation: |-
      - que tipos de decisão podem ser tomados no Loomio;
      - quem contribui com opiniões e quem tem autoridade para decidir;
      - quem pode votar;
      - se é necessário atingir um [quórum](/en/user_manual/polls/quorum);
      - se a decisão exige maioria, maioria qualificada, unanimidade, consentimento ou outro [percentual de votos exigido](/en/user_manual/polls/vote_share_requirements);
      - se a decisão passa a valer quando sua conclusão é publicada ou se precisa ser ratificada em outro lugar; e
      - quem registrará e executará a conclusão.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4b48b6e0aff5cfc0:
    english: If your constitution, bylaws, policy, or local law governs electronic decisions, make sure the Loomio process follows those requirements. Configure [delegated voters](/en/user_manual/groups/delegated_voters), proposal settings, and [poll templates](/en/user_manual/polls/poll_templates) to make the agreed process easy to repeat.
    translation: Se o estatuto, o regimento, uma política ou a legislação local estabelece regras para decisões eletrônicas, garanta que o processo no Loomio as cumpra. Configure os [votantes delegados](/en/user_manual/groups/delegated_voters), as opções das propostas e os [modelos de enquete](/en/user_manual/polls/poll_templates) para facilitar a repetição do processo acordado.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b068624ed6c7c6b3:
    english: "### If your group is still deciding"
    translation: "### Se seu grupo ainda está decidindo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  14449de544d28a6b:
    english: 'Start a discussion about how decisions should be made. Instead of beginning with a voting tool, ask the group to consider:'
    translation: 'Inicie uma discussão sobre como as decisões devem ser tomadas. Antes de escolher uma ferramenta de votação, convide o grupo a considerar:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f65b39a74ae25ed7:
    english: |-
      - What kinds of decisions do we make?
      - Who is affected, who should be consulted, and who is responsible for deciding?
      - Which decisions need advice, consent, consensus, a vote, or delegated authority?
      - What level of participation or support makes a decision valid?
      - How will we respond to objections, tied results, or insufficient participation?
      - How will we communicate, record, review, and change a decision?
    translation: |-
      - Que tipos de decisão tomamos?
      - Quem é afetado, quem deve ser consultado e quem é responsável por decidir?
      - Quais decisões exigem aconselhamento, consentimento, consenso, votação ou autoridade delegada?
      - Que nível de participação ou apoio torna uma decisão válida?
      - Como responderemos a objeções, empates ou participação insuficiente?
      - Como comunicaremos, registraremos, revisaremos e alteraremos uma decisão?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ce7c0af2ad170b5c:
    english: The answers may be different for an operational decision, a policy, an election, and a constitutional change. See [Making decisions](/en/guides/making_decisions) to compare several complete processes.
    translation: As respostas podem variar entre uma decisão operacional, uma política, uma eleição e uma mudança no estatuto. Consulte [Tomando decisões](/en/guides/making_decisions) para comparar diferentes processos completos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  aac26fc96b90744d:
    english: If the group is not ready to settle every rule, agree on a provisional process for one low-risk decision. State what the result will mean before asking people to participate, publish an outcome, then review how the process worked. Record what the group learns in its description, governance documents, or reusable templates.
    translation: Se o grupo ainda não estiver pronto para definir todas as regras, combine um processo provisório para uma decisão de baixo risco. Explique o que o resultado significará antes de pedir a participação das pessoas. Depois, publique uma conclusão e avalie como o processo funcionou. Registre o que o grupo aprendeu na descrição, nos documentos de governança ou em modelos reutilizáveis.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  23ed8fb3e887afbc:
    english: "## Invite people"
    translation: "## Convide as pessoas"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a5d369ad9df691fe:
    english: "[Invite people](/en/user_manual/groups/inviting_people) with a short personal message that explains:"
    translation: "[Convide as pessoas](/en/user_manual/groups/inviting_people) com uma mensagem pessoal e breve que explique:"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3383207ff2fcc99b:
    english: |-
      - why the group is using Loomio;
      - what you are asking them to do first;
      - when you need their response; and
      - where they can get help.
    translation: |-
      - por que o grupo está usando o Loomio;
      - o que você está pedindo que façam primeiro;
      - até quando você precisa de uma resposta; e
      - onde podem obter ajuda.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  282ef8673815823e:
    english: You can begin with a small group of people who will actively test the process, or invite the whole group when everyone needs to participate from the start. In either case, have a discussion ready for them rather than inviting people into an empty group.
    translation: Você pode começar com um pequeno grupo de pessoas que testarão o processo ou convidar o grupo inteiro quando todos precisarem participar desde o início. Em qualquer caso, tenha uma discussão pronta para elas antes de enviar os convites.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cd6511a78ce7c9b7:
    english: "## Help everyone participate once"
    translation: "## Ajude cada pessoa a participar uma vez"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a37273687b4f4b0:
    english: The first objective is for each person to cross the threshold from receiving an invitation to contributing something.
    translation: O primeiro objetivo é ajudar cada pessoa a passar de receber um convite a fazer alguma contribuição.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ce285f27cca389c4:
    english: 'Ask people to:'
    translation: 'Peça às pessoas que:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d0b9e80af995edff:
    english: |-
      1. sign in and add a profile photo;
      2. open the welcome or practice discussion;
      3. post a short comment or reaction; and
      4. vote in a low-stakes proposal and, if useful, leave a reason.
    translation: |-
      1. entrem no Loomio e adicionem uma foto de perfil;
      2. abram a discussão de boas-vindas ou de teste;
      3. publiquem um comentário curto ou uma reação; e
      4. votem em uma proposta de baixo risco e, se for útil, expliquem o motivo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  919e32e7adb7c4c8:
    english: Members do not need to create a password. They can [sign in by email](/en/user_manual/users/signing_in), and they can reply to eligible discussion emails without first navigating back to the thread.
    translation: Os membros não precisam criar uma senha. Eles podem [entrar por e-mail](/en/user_manual/users/signing_in) e responder aos e-mails de discussões que permitem respostas, sem precisar voltar à conversa primeiro.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  22ceb7104d416acf:
    english: "## Use notifications deliberately"
    translation: "## Use as notificações de forma deliberada"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dd99e6dd5c93d9ee:
    english: Access to content and notification about it are separate. Group members can find discussions in their group even when they were not notified immediately.
    translation: O acesso ao conteúdo e as notificações sobre ele funcionam separadamente. Os membros podem encontrar as discussões do grupo mesmo quando não recebem uma notificação imediata.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0e20732d957eb282:
    english: When starting a discussion, notify the people whose input is needed at that stage. Use @mentions and replies when asking particular people to respond. When voting opens later, invite the eligible voters.
    translation: Ao iniciar uma discussão, notifique as pessoas cuja contribuição é necessária nessa etapa. Use @menções e respostas para pedir a participação de pessoas específicas. Quando a votação começar, convide quem pode votar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  43339ff0f3d30a50:
    english: If you create a discussion and poll together only to capture a vote, avoid sending a discussion invitation immediately followed by a poll invitation. Either start the discussion without notifying people and invite them through the poll, or run a [standalone poll](/en/user_manual/polls/intro_to_decisions#without-a-discussion).
    translation: Se você criar uma discussão e uma enquete juntas apenas para colher votos, evite enviar um convite para a discussão seguido imediatamente por outro para a enquete. Inicie a discussão sem notificar as pessoas e convide-as pela enquete, ou faça uma [enquete independente](/en/user_manual/polls/intro_to_decisions#without-a-discussion).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  467cf9d1e5bd2973:
    english: Show members the [Catch-up and notification settings](/en/user_manual/users/email_settings), especially if they do not expect to visit Loomio every day.
    translation: Mostre aos membros as [configurações de resumo e notificações](/en/user_manual/users/email_settings), especialmente se eles não pretendem acessar o Loomio todos os dias.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ebe7764d64b17823:
    english: "## Complete the first process"
    translation: "## Conclua o primeiro processo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9a165c59ba0aed5a:
    english: 'A first process should demonstrate the complete pattern:'
    translation: 'O primeiro processo deve mostrar todas as etapas:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8bc60d4319adf204:
    english: |-
      1. Introduce the topic and provide context.
      2. Invite discussion or questions when they are needed.
      3. Start the appropriate proposal or poll.
      4. Remind people who have not participated when necessary.
      5. Publish an [outcome](/en/user_manual/polls/outcomes) stating what was decided and what happens next.
    translation: |-
      1. Apresente o assunto e forneça o contexto.
      2. Convide as pessoas a discutir ou fazer perguntas quando necessário.
      3. Inicie a proposta ou enquete adequada.
      4. Lembre quem ainda não participou, se necessário.
      5. Publique uma [conclusão](/en/user_manual/polls/outcomes) que diga o que foi decidido e quais são os próximos passos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1235244007a8559b:
    english: The outcome closes the loop and creates a record that members can return to later. Afterward, ask what worked, adjust the process, and choose the next recurring piece of work to run in Loomio.
    translation: A conclusão encerra o processo e cria um registro que os membros podem consultar depois. Em seguida, pergunte o que funcionou, ajuste o processo e escolha a próxima atividade recorrente para realizar no Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c699f8804cdd41b1:
    english: For a facilitated sequence from discussion to decision, see [Making decisions](/en/guides/making_decisions). For board-specific practices, see [Introducing Loomio to your board](/en/guides/board_processes/introduce).
    translation: Para seguir um processo conduzido da discussão à decisão, consulte [Tomando decisões](/en/guides/making_decisions). Para práticas específicas de conselhos, consulte [Apresentando o Loomio ao seu conselho](/en/guides/board_processes/introduce).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
