  86490ad15147169e:
    english: Use a **Time poll** to find a time for a meeting or event. It serves the same purpose as scheduling tools such as Doodle, while keeping the scheduling process with the group's other Loomio work. Participants see the options in their own time zone.
    translation: Usa un **Sondaggio appuntamento** per trovare un orario per un incontro o un evento. Ha la stessa funzione di strumenti come Doodle, ma mantiene l'organizzazione dell'incontro insieme alle altre attività del gruppo su Loomio. I partecipanti vedono gli orari nel proprio fuso orario.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2e21bb1b54b6fcf9:
    english: "## Time poll"
    translation: "## Sondaggio appuntamento"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  27ba736f4b564fe3:
    english: _Find when people are available to meet_
    translation: _Trova quando le persone sono disponibili a incontrarsi_
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2f5455ba3b487407:
    english: Save time arranging a date for your meeting or event.
    translation: Risparmia tempo nell'organizzare la data del tuo incontro o evento.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  859c3efc07ce0b04:
    english: Time poll makes it easy to see everyone's availability and find the best time.
    translation: Il sondaggio appuntamento ti aiuta a vedere quando sono disponibili i partecipanti e a trovare l'orario migliore.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  12ae9e9d3bdb0a4e:
    english: Give your Time poll a title and details. Enter a list of date and time options in your time zone.
    translation: Dai un titolo al sondaggio appuntamento e aggiungi i dettagli. Inserisci un elenco di date e orari nel tuo fuso orario.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  548fb6cd6fcd9376:
    english: When setting timeslots, consider people in different time zones. Participants will see times localized in their time zone.
    translation: Quando imposti gli orari, considera chi si trova in altri fusi orari. I partecipanti vedranno gli orari nel proprio fuso orario.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3105405631b53c31:
    english: Set a meeting duration.
    translation: Imposta la durata dell'incontro.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8d56a5d9986286e9:
    english: "### Voting"
    translation: "### Votazione"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  41d1e6a3a6739d95:
    english: People mark each time with the green thumbs-up icon when they are available, the yellow sideways thumb when they can attend if needed, or the red thumbs-down icon when they are unavailable.
    translation: Per ogni orario, le persone selezionano il pollice verde rivolto verso l'alto se sono disponibili, il pollice giallo di lato se possono partecipare all'occorrenza o il pollice rosso rivolto verso il basso se non sono disponibili.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b4784042c82735af:
    english: Participants can leave a reason comment to help the organizer find a suitable time.
    translation: I partecipanti possono aggiungere un commento per spiegare la propria scelta e aiutare chi organizza a trovare un orario adatto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0165a90bc22b6f7f:
    english: If the times don't work, participants can suggest alternatives using the message field. You can then update the poll with new times.
    translation: Se gli orari proposti non vanno bene, i partecipanti possono suggerire alternative nel campo del messaggio. Puoi quindi aggiornare il sondaggio con nuovi orari.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6c7c09879e7d9bf8:
    english: The results update as voting proceeds in a table showing who is available when, so everyone can see which timeslots are popular.
    translation: I risultati si aggiornano man mano che le persone votano. Una tabella mostra chi è disponibile per ciascun orario, così tutti possono vedere quali sono i più scelti.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
