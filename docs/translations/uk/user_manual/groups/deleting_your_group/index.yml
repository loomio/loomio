---
navigation_title: Видалення вашої групи
blocks:
  6e0bf431fbefa0d3:
    english: "# Deleting your group"
    translation: "# Видалення вашої групи"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f8e8d1ee802cae90:
    english: 'Deleting your Loomio group initiates a process to permanently delete all group data. '
    translation: Коли ви видаляєте свою групу в Loomio, починається процес остаточного видалення всіх даних групи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  214aa96eca0b90ca:
    english: If there is any data you wish to retain, make sure you [export group data](/en/user_manual/groups/data_export/) and manually download any important files you have uploaded before you continue.
    translation: Якщо ви хочете зберегти якісь дані, спочатку [експортуйте дані групи](/en/user_manual/groups/data_export/) і вручну завантажте всі важливі файли, які ви додали.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  181fecc458dcc49d:
    english: Open the group drop down menu by clicking on the three dots, and select the **Delete group** option to remove access to the group and to initiate deletion of all group data from our records. You must be an admin to delete a group.
    translation: Натисніть три крапки, щоб відкрити меню групи, і виберіть **Видалити групу**. Це закриє доступ до групи та запустить видалення всіх її даних із наших записів. Видалити групу може лише адміністратор.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f5178957964c2bc0:
    english: When you delete a group, it is removed from view immediately and will be permanently deleted after 90 days. You and group members immediately lose access to the group. If a mistake was made, contact us within 90 days of deleting your group to request restoration.
    translation: Після видалення група відразу зникає з перегляду, а через 90 днів її буде видалено остаточно. Ви та учасники групи відразу втратите до неї доступ. Якщо ви видалили групу помилково, зв’яжіться з нами протягом 90 днів і попросіть її відновити.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c15f72841d15dc52:
    english: Groups awaiting deletion and their subgroups are unavailable to members and coordinators for viewing, participation, or export, including polls opened from saved links. Members cannot create or edit content, vote, send announcements or reminders, or accept invitations. Export the group and download important files before confirming deletion. Direct discussions and polls are unaffected.
    translation: Учасники та координатори не можуть переглядати групи, що очікують на видалення, і їхні підгрупи, брати в них участь або експортувати їхні дані. Це стосується й опитувань, відкритих за збереженими посиланнями. Учасники не можуть створювати чи редагувати вміст, голосувати, надсилати оголошення чи нагадування або приймати запрошення. Перш ніж підтвердити видалення, експортуйте дані групи та завантажте важливі файли. Прямі обговорення й опитування залишаться доступними.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5122280818cc30c7:
    english: Scheduling the group for deletion stops pending activity notifications and poll reminders for the group and its subgroups. Messages already being sent may still arrive.
    translation: Коли групу заплановано на видалення, сповіщення про її активність і нагадування про опитування в ній та її підгрупах, які ще очікують на надсилання, скасовуються. Повідомлення, які вже надсилаються, можуть надійти.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  953ebf00860389c1:
    english: The warning email includes counts for the group's subgroups, members, discussions, polls and comments. If you need to keep the group or [export its data](/en/user_manual/groups/data_export/), reply within 90 days so access can be restored before deletion.
    translation: У листі з попередженням зазначено кількість підгруп, учасників, обговорень, опитувань і коментарів у групі. Якщо ви хочете зберегти групу або [експортувати її дані](/en/user_manual/groups/data_export/), дайте відповідь протягом 90 днів, щоб доступ можна було відновити до остаточного видалення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  17dc58c271e429d5:
    english: Deleting your group will also cancel your Loomio subscription.
    translation: Видалення групи також скасує вашу підписку на Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fa7cec0f3ba570ef:
    english: "![Delete group action in the Oatmilk Cooperative menu](group_delete_group.png)"
    translation: "![Дія «Видалити групу» в меню Oatmilk Cooperative](group_delete_group.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cb0d8b2f2c8b9630:
    english: You will be invited to type the name of your group (*case sensitive*) to confirm you wish to delete your group.
    translation: Щоб підтвердити видалення групи, введіть її назву (*з урахуванням регістру*).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5430eb3885d98872:
    english: "![Confirmation form requiring the Oatmilk Cooperative handle](group_delete_group_confirm.png)"
    translation: "![Форма підтвердження, у якій потрібно ввести ідентифікатор Oatmilk Cooperative](group_delete_group_confirm.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2df60ea964109f11:
    english: "## Group data is permanently deleted after 90 days"
    translation: "## Дані групи остаточно видаляються через 90 днів"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e09923078301b8d:
    english: After 90 days, all the threads, polls, files and other group content will be permanently deleted. ***This is non-reversible!***
    translation: Через 90 днів усі теми, опитування, файли та інший вміст групи буде остаточно видалено. ***Відновити їх буде неможливо.***
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8695a5ebfb09611d:
    english: We recommend that you [export the group data](/en/user_manual/groups/data_export/)and manually download any important files you have uploaded before you continue.
    translation: Рекомендуємо спочатку [експортувати дані групи](/en/user_manual/groups/data_export/)і вручну завантажити всі важливі файли, які ви додали.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
