  0b8bb762e37fb8c3:
    english: |-
      To create a poll or proposal and only invite the delegates, use the "Selected people only" poll setting.
      ![Selected people only setting when starting a proposal](poll_invited_people_only.png)
      Then when inviting people to vote you will see the "Delegates of group-name" option.
      ![Delegates of Oatmilk Cooperative option in the invite-to-vote form](poll_invite_delegates_group.png)
    translation: |-
      Per creare un sondaggio o una proposta e invitare solo i delegati, usa l'impostazione "Solo persone selezionate".
      ![Impostazione Solo persone selezionate durante la creazione di una proposta](poll_invited_people_only.png)
      Quando inviti le persone a votare, vedrai l'opzione "Delegati di nome-gruppo".
      ![Opzione Delegati di Oatmilk Cooperative nel modulo di invito al voto](poll_invite_delegates_group.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e895a07efeaf4dcf:
    english: |-
      You can see a list of who the delegates are from the members tab of your group page. Use the filter menu and select "Delegates".
      ![Delegates option in the members filter](members_list_delegates.png)
    translation: |-
      Per vedere l'elenco dei delegati, apri la scheda dei membri nella pagina del tuo gruppo. Apri il menu dei filtri e seleziona "Delegati".
      ![Opzione Delegati nel filtro dei membri](members_list_delegates.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
