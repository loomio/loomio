---
navigation_title: Выбор
blocks:
  581de5d50d3dc442:
    english: "# Choose"
    translation: "# Выбор"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  733b320e0407fbdc:
    english: Choose is a simple poll for finding the most popular option or making a shortlist. Participants select one or more options, depending on the limits you set. This voting method is commonly known as multiple choice.
    translation: Выбор — простое голосование, которое помогает найти самый популярный вариант или составить короткий список. Участники выбирают один или несколько вариантов в пределах заданных вами ограничений. Такой способ голосования обычно называют выбором из нескольких вариантов.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '09aefb579b50874b':
    english: "## When to use Choose"
    translation: "## Когда использовать выбор"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  be35cf72fcaf9c4d:
    english: 'Use Choose when the options are distinct and you need to count how many people select each one. It works well for:'
    translation: 'Используйте выбор, когда варианты различаются и вам нужно узнать, сколько человек выбрали каждый из них. Он подходит, чтобы:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dcc6f6b9238155b2:
    english: |-
      - choosing one venue from a shortlist;
      - selecting up to three topics for an agenda;
      - deciding which design should proceed to the next round; or
      - checking which services members intend to use.
    translation: |-
      - выбрать одно место из короткого списка;
      - выбрать до трёх тем для повестки;
      - решить, какой дизайн пройдёт в следующий раунд; или
      - узнать, какими услугами собираются пользоваться участники группы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3770d0653b752de5:
    english: Choose records selections, not the strength or order of a person's preferences. Use [Score](/en/user_manual/polls/score/) to measure how strongly people support every option, [Allocate](/en/user_manual/polls/allocate/) when there is a limited budget, or [Rank](/en/user_manual/polls/rank/) when preference order matters.
    translation: Выбор показывает, какие варианты отметили участники, но не отражает силу или порядок их предпочтений. Используйте [Оценку](/en/user_manual/polls/score/), чтобы узнать, насколько участники поддерживают каждый вариант, [Распределение](/en/user_manual/polls/allocate/) — когда бюджет ограничен, или [Ранжирование](/en/user_manual/polls/rank/) — когда важен порядок предпочтений.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f15aca327e894f30:
    english: "## Example: set a planning-meeting agenda"
    translation: "## Пример: составление повестки встречи по планированию"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f51e09afa0ed1e53:
    english: Oatmilk Cooperative needs to decide which parts of a returnable-bottle trial need the most time at its next planning meeting. The poll asks each person to choose up to two topics. Its details explain how the result will be used, and each option includes enough information to distinguish it from the others.
    translation: Кооперативу Oatmilk нужно решить, каким частям испытания возвратных бутылок уделить больше всего времени на следующей встрече по планированию. В голосовании каждому предлагают выбрать до двух тем. В подробностях объясняется, как будут использовать результаты. Описание каждого варианта помогает отличить его от остальных.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c74ebb16f872b3c6:
    english: "## Set up the poll"
    translation: "## Настройка голосования"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  abc749fec8671661:
    english: Give the poll a specific question as its title. In **Details**, explain what participants should consider and what will happen with the result. Add each available option, then set the **Minimum choices** and **Maximum choices**.
    translation: Укажите в заголовке голосования конкретный вопрос. В разделе **Подробности** объясните, что участникам следует учесть и как будут использованы результаты. Добавьте все доступные варианты, затем задайте **Минимальный выбор** и **Максимальный выбор**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e878ddc9f61dd243:
    english: Set both limits to 1 when participants must choose exactly one option. Set a higher maximum when you want a shortlist. Avoid allowing so many choices that participants can select nearly every option, because that makes the result less useful.
    translation: 'Установите оба значения равными 1, если каждый участник должен выбрать ровно один вариант. Увеличьте максимальное значение, если хотите составить короткий список. Не разрешайте выбирать почти все варианты: так результат будет менее полезным.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  152fec5018fc232b:
    english: Use the pencil icon beside an option to add a meaning or further explanation. This is useful when a short option name could be interpreted in different ways.
    translation: Нажмите значок карандаша рядом с вариантом, чтобы пояснить его значение или добавить подробности. Это полезно, если краткое название можно понять по-разному.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  59e405cf9a028c8d:
    english: Under **More settings**, **Show options in random order** can reduce the effect of always presenting one option first.
    translation: В разделе **Дополнительные настройки** параметр **Показывать варианты в случайном порядке** помогает уменьшить влияние того, какой вариант показан первым.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Голосование"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7db2d0e58e5fb4e4:
    english: The vote form tells participants how many options they may select. In this example, the voter selects **Cafe collection schedule** and **Washing workflow**, then gives a reason connecting those choices to the trial.
    translation: В форме голосования указано, сколько вариантов можно выбрать. В этом примере участник выбирает **График сбора бутылок из кафе** и **Порядок мойки**, а затем объясняет, как эти темы связаны с испытанием.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e55e4b8950a5fd46:
    english: A reason can reveal why an option matters and what work participants expect it to cover. If reasons are important to the decision, configure the vote-reason setting before starting the poll.
    translation: Пояснение помогает понять, почему вариант важен и какую работу участники с ним связывают. Если пояснения важны для решения, настройте их до начала голосования.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Просмотр результатов"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c1ec47f66384e3bb:
    english: The results show the share of all selections received by each option, the number of voters who selected it, and who has not voted. Because each person could choose two options, the percentages describe selections rather than a percentage of people.
    translation: Результаты показывают долю каждого варианта среди всех сделанных выборов, число выбравших его участников и тех, кто ещё не проголосовал. Поскольку каждый участник мог выбрать два варианта, проценты относятся к сделанным выборам, а не к числу людей.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6cbc0f9d6fdf6727:
    english: In this example, **Cafe collection schedule** has three selections. **Washing workflow** and **Return-rate reporting** each have two. The result supports giving cafe collections the most agenda time, but the tied topics still require the organizer to decide how the remaining time is divided.
    translation: В этом примере **График сбора бутылок из кафе** выбрали три раза. **Порядок мойки** и **Отчёт о доле возвращённых бутылок** выбрали по два раза. Результат позволяет выделить больше всего времени в повестке на сбор бутылок из кафе. Организатору ещё нужно решить, как распределить оставшееся время между двумя темами с одинаковым числом голосов.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  adb7eb28e16616be:
    english: When the poll closes, publish an **Outcome** explaining what the group will do with the result.
    translation: Когда голосование завершится, опубликуйте **Исход** и объясните, что группа сделает с результатами.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
