    translation: "## Gebruiker verwijderen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a37f91309a44b472:
    english: Delete removes the user and records the user created. Comments are removed from threads, votes are removed from polls, and groups, discussions, polls, and other records created by the user may also be deleted through database associations.
    translation: Bij verwijderen worden de gebruiker en de door die gebruiker aangemaakte gegevens gewist. Reacties verdwijnen uit threads en stemmen uit peilingen. Ook groepen, discussies, peilingen en andere gegevens die de gebruiker heeft aangemaakt, kunnen via databasekoppelingen worden verwijderd.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  537bd891e445eb93:
    english: This is very destructive. Redaction is highly recommended instead.
    translation: Dit heeft ingrijpende gevolgen. Anonimiseren wordt sterk aanbevolen als alternatief.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
