  5363d74e43453a93:
    english: "## SSO Profile Sync Settings"
    translation: "## Impostazioni di sincronizzazione del profilo SSO"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5d1d8b72689c1c84:
    english: Use these settings when another system manages Loomio profile fields.
    translation: Usa queste impostazioni quando un altro sistema gestisce i campi del profilo Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  83b6503850a3581c:
    english: "`LOOMIO_DISABLE_EDIT_USER_PROFILE=1` prevents users from editing these fields themselves:"
    translation: "`LOOMIO_DISABLE_EDIT_USER_PROFILE=1` impedisce agli utenti di modificare direttamente questi campi:"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b40beb01122e6c22:
    english: |-
      | Field | Notes |
      | --- | --- |
      | `name` | Managed by external sync |
      | `username` | Managed by external sync |
      | `email` | Managed by external sync |
      | `avatar_kind` / `uploaded_avatar` | Managed by external sync |
    translation: |-
      | Campo | Note |
      | --- | --- |
      | `name` | Gestito dalla sincronizzazione esterna |
      | `username` | Gestito dalla sincronizzazione esterna |
      | `email` | Gestito dalla sincronizzazione esterna |
      | `avatar_kind` / `uploaded_avatar` | Gestito dalla sincronizzazione esterna |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d914243a6d80944b:
    english: Users can still edit Loomio-local fields such as `short_bio` and `location`.
    translation: Gli utenti possono comunque modificare i campi gestiti in Loomio, come `short_bio` e `location`.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d2d40191ec060f7e:
    english: "`LOOMIO_SSO_UPDATE_USER_PROFILE_ON_LOGIN=1` updates `name` and `email` from SSO login data. Leave it commented out or unset when an external sync script should be the only source of those updates."
    translation: "`LOOMIO_SSO_UPDATE_USER_PROFILE_ON_LOGIN=1` aggiorna `name` e `email` con i dati di accesso SSO. Lascialo commentato o non impostato se uno script di sincronizzazione esterno deve essere l'unica fonte di questi aggiornamenti."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f19f0588ef52b814:
    english: "`LOOMIO_SSO_FORCE_USER_ATTRS` still works for existing installs. It both disables user edits and updates `name` and `email` on SSO login."
    translation: "`LOOMIO_SSO_FORCE_USER_ATTRS` funziona ancora nelle installazioni esistenti. Impedisce agli utenti di modificare il profilo e aggiorna `name` e `email` all'accesso tramite SSO."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
