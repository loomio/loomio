    translated_on: '2026-09-29'
  d0335d202c5bbaa3:
    english: "![Seen by and Notified in the Thread members section](../notifying_people/thread_engagement.png)"
    translation: "![Angesehen von und benachrichtigt im Bereich für Thread-Mitglieder](../notifying_people/thread_engagement.png)"
    status: machine
