---
navigation_title: Кіраванне ўдзельнікамі
blocks:
  3d2d8d3f7d252651:
    english: "# Member management"
    translation: "# Кіраванне ўдзельнікамі"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f9901909d4cd86e0:
    english: If you are an admin, you can manage members from the **Members** tab on your group page.
    translation: Калі вы адміністратар групы, кіраваць яе ўдзельнікамі можна на ўкладцы **Удзельнікі** на старонцы групы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d25e71106f726cac:
    english: Click on the three dots (**⋮**) to the right of the group member to set their title, make them an admin, make them a delegate, or remove them from the group.
    translation: Націсніце на тры кропкі (**⋮**) справа ад імя ўдзельніка групы, каб устанавіць загаловак, зрабіць удзельніка адміністратарам або дэлегатам ці выдаліць з групы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  db5a08225152e80a:
    english: "![Member actions menu on the Oatmilk Cooperative members page](member_management.png)"
    translation: "![Меню дзеянняў з удзельнікамі на старонцы ўдзельнікаў кааператыва Oatmilk](member_management.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0f29eb85fabc200d:
    english: |-
      ## Administering your group
      There are only two user types in a Loomio group: **member** and **admin**.
    translation: |-
      ## Адміністраванне групы
      У групе Loomio ёсць толькі два тыпы карыстальнікаў: **удзельнікі** і **адміністратары**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4317e6fcbbedcdaa:
    english: 'Admins perform administrative tasks for your group, including: adding and removing members, managing member permissions, setting the group privacy levels, and managing the subscription plans.  In addition, admins are able to see the email addresses of members and export the group''s data.'
    translation: Адміністратары дадаюць і выдаляюць удзельнікаў, кіруюць іх правамі, узроўнем прыватнасці групы і тарыфным планам. Яны таксама могуць бачыць адрасы электроннай пошты ўдзельнікаў і экспартаваць даныя групы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7de2ea0e85a19d0a:
    english: The person creating a new Loomio group is made admin by default. We recommend to make at least one other trusted person in your group an admin, to insure someone can always administer your group. You can have as many admins in your group as you wish.
    translation: Пры стварэнні групы Loomio вы па змаўчанні становіцеся яе адміністратарам. Рэкамендуем зрабіць адміністратарам яшчэ кагосьці з удзельнікаў групы, каму вы давяраеце, каб кіраванне групай заўсёды было даступнае. Колькасць адміністратараў у групе не абмежаваная.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ac9e3bb2da56869e:
    english: To make a member **admin**, go to the Members tab, find the member and click on the three dots (**⋮**) next to their name. Choose **Make admin**. An `Admin` tag will appear beside their name.
    translation: Каб даць удзельніку правы **адміністратара**, адкрыйце ўкладку **Удзельнікі**, знайдзіце патрэбнага ўдзельніка і націсніце на тры кропкі (**⋮**) побач з імем. Выберыце **Зрабіць адміністратарам**. Побач з імем з’явіцца пазнака `Admin`.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b93c8eaf5367f572:
    english: "![Make admin action in a member's menu](member_make_admin.png)"
    translation: "![Дзеянне «Зрабіць адміністратарам» у меню ўдзельніка](member_make_admin.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f6d7a993e2d32771:
    english: |-
      ## Managing subgroups
      If you are the admin of a parent group, or organization, you have additional permissions with regards to any __closed__ subgroups.
    translation: |-
      ## Кіраванне падгрупамі
      Калі вы адміністратар бацькоўскай групы або арганізацыі, у вас ёсць дадатковыя правы ў дачыненні да __закрытых__ падгруп.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cd781594b26ae052:
    english: You will be able to join any closed subgroup by clicking the "Join Group" button on the left of the Subgroup page in question (just under the tabs).
    translation: Вы можаце далучыцца да любой закрытай падгрупы. Для гэтага націсніце кнопку «Далучыцца да групы» злева на старонцы падгрупы, адразу пад укладкамі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ba630e95409473a5:
    english: "![Join group button on a closed Oatmilk Cooperative subgroup](member_join_subgroup.png)"
    translation: "![Кнопка далучэння да закрытай падгрупы кааператыва Oatmilk](member_join_subgroup.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  87c2d0e0fa784cff:
    english: Once you have joined the subgroup, you will also be able to make yourself the admin of that subgroup, just as you would promote anyone to admin.
    translation: Далучыўшыся да падгрупы, вы можаце зрабіць сябе яе адміністратарам гэтак жа, як і любога іншага ўдзельніка.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e439992d86591319:
    english: |-
      >[!Note]
      >These permissions do not extend to [**secret** subgroups](/en/user_manual/groups/subgroups/?highlight=secret#permissions).
    translation: |-
      >[!Note]
      >Гэтыя правы не распаўсюджваюцца на [**сакрэтныя** падгрупы](/en/user_manual/groups/subgroups/?highlight=secret#permissions).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  31a8fbe10f50c1a0:
    english: |-
      ## Removing members
      When you click **Remove from group** you'll be asked to confirm the removal. Upon removal, this user will no longer have access to the group's pages, threads, polls, or proposals. They will receive no further emails or notifications of group activity. However, any comments and votes written by the user will remain untouched.
    translation: |-
      ## Выдаленне ўдзельнікаў
      Пасля націскання **Выдаліць з групы** вам трэба будзе пацвердзіць выдаленне. Выдаленыя ўдзельнікі страцяць доступ да старонак групы, абмеркаванняў, апытанняў і прапаноў. Яны больш не будуць атрымліваць лісты і апавяшчэнні пра дзейнасць групы. Іх каментары і галасы застануцца без змен.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8bf29fce0f0d8e9b:
    english: "![Remove from group action in a member's menu](member_remove.png)"
    translation: "![Дзеянне «Выдаліць з групы» ў меню ўдзельніка](member_remove.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aa3b173ffd048b99:
    english: You can add removed members back to the group later if you wish.
    translation: Пазней вы можаце зноў дадаць выдаленых удзельнікаў у групу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6ef7d0422c66d652:
    english: |-
      ## Leaving group
      To leave a group: go to the group page, open the 3 dot menu, and click **Leave group**.
    translation: |-
      ## Выхад з групы
      Каб выйсці з групы, адкрыйце яе старонку, націсніце на меню з трыма кропкамі і выберыце **Пакінуць групу**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5395b374b5814162:
    english: "![Leave group action in the Oatmilk Cooperative settings menu](member_leave_group.png)"
    translation: "![Дзеянне «Пакінуць групу» ў меню налад кааператыва Oatmilk](member_leave_group.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d926fc8d1e3cbac2:
    english: |-
      ## Set title
      Within the Members tab, you can also name your role within the group, or identify an organization you represent using **title**. You or a group admin can change your title with **Set title** from the 3 dot menu near your name.
    translation: |-
      ## Устанавіць загаловак
      На ўкладцы **Удзельнікі** вы можаце пазначыць сваю ролю ў групе або арганізацыю, якую прадстаўляеце, з дапамогай поля **тытул**. Змяніць ваш тытул можаце вы або адміністратар групы: для гэтага выберыце **Устанавіць загаловак** у меню з трыма кропкамі побач з вашым імем.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2425e4d5b1e8047d:
    english: "![Set title action in a member's menu](member_set_title.png)"
    translation: "![Дзеянне «Устанавіць загаловак» у меню ўдзельніка](member_set_title.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6af456317883a890:
    english: You can have different titles in different subgroups.
    translation: У розных падгрупах вы можаце мець розныя тытулы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2d59cb70493e06b1:
    english: "## Member email addresses"
    translation: "## Адрасы электроннай пошты ўдзельнікаў"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cee3a1e0e1031377:
    english: Only admins can see group member email addresses.  This is sometimes necessary to audit the members in a group.
    translation: Толькі адміністратары могуць бачыць адрасы электроннай пошты ўдзельнікаў групы. Часам гэта патрэбна для праверкі складу групы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4ff1112b058a3205:
    english: 'To see member email addresses: Use [data export](/en/user_manual/groups/data_export/) to download a CSV file, and open the file in Excel or Google sheets.'
    translation: 'Каб убачыць адрасы электроннай пошты ўдзельнікаў, скарыстайцеся [экспартам даных](/en/user_manual/groups/data_export/): спампуйце CSV-файл і адкрыйце яго ў Excel або Google Табліцах.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  105be57911f832fc:
    english: The export group data file shows every person and their email address in every subgroup.
    translation: Экспартаваны файл з данымі групы змяшчае імёны і адрасы электроннай пошты ўсіх удзельнікаў кожнай падгрупы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  20f87bcff4ec41e6:
    english: You can also search for members by email address in the members tab. So if you see someone you want to remove, you can search by email to remove them.
    translation: На ўкладцы **Удзельнікі** можна шукаць людзей па адрасе электроннай пошты. Калі трэба выдаліць каго-небудзь з групы, знайдзіце гэтага ўдзельніка па адрасе.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
