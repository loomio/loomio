  3cc3304a15bc3d2f:
    english: In the Consent process, an objection is defined as something that **might cause harm to the team or organization**.
    translation: En el proceso de consentimiento, una objeción señala algo que **podría causar daño al equipo o a la organización**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ab509ea088e16a0d:
    english: |-
      Objections should meet this criteria to be valid:
      - Explicit: *I can make a reasoned case*
      - Impersonal: *It's not just a personal preference*
      - Evidenced: *Not predictive, based on experience*
      - Not 'safe to fail': *It's not that I have a 'better idea'*
    translation: |-
      Para ser válidas, las objeciones deben cumplir estos criterios:
      - Explícitas: *Puedo presentar argumentos razonados*
      - Impersonales: *No se trata solo de una preferencia personal*
      - Basadas en pruebas: *Se basan en la experiencia, no en predicciones*
      - No «seguras si fallan»: *No se trata de que tenga una «idea mejor»*
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
