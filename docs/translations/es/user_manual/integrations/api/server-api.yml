  4a423dbb4fd59b45:
    english: Redaction keeps the user's comments and other user-generated content within their groups, but removes known personally identifying information such as name, bio, profile photo, email address, login credentials, identities, and active sessions.
    translation: Este proceso conserva los comentarios y otros contenidos creados por el usuario en sus grupos, pero elimina los datos personales conocidos que permiten identificarlo, como el nombre, la biografía, la foto de perfil, la dirección de correo electrónico, las credenciales de inicio de sesión, las identidades y las sesiones activas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9b472af7dbef98ac:
    english: This is the recommended way to remove a user from Loomio.
    translation: Este es el método recomendado para eliminar a un usuario de Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
