navigation_title: Справаздача аб удзеле
blocks:
  2f8bdb5ed7656e65:
    english: "# Participation report"
    translation: "# Справаздача аб удзеле"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0431c9fc46658338:
    english: 'The group participation report gives insights into the usage of your Loomio group. '
    translation: Справаздача аб удзеле паказвае, як выкарыстоўваецца ваша група ў Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0d23c0831f1ea6ca:
    english: 'You''re able to choose which groups to include in the report, the start and end date for the report, and the interval (year, month, week or day) for grouping results. '
    translation: 'Вы можаце выбраць групы для справаздачы, даты пачатку і заканчэння перыяду, а таксама інтэрвал для групавання вынікаў: год, месяц, тыдзень або дзень.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  73c9822c08a37866:
    english: The report is available to everyone in your group, however users can only see results for groups that they belong to, this means that different users may see slightly different reports.
    translation: Справаздача даступная ўсім у вашай групе. Але кожны бачыць вынікі толькі тых груп, да якіх належыць. Таму справаздачы ў розных людзей могуць крыху адрознівацца.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c9402b4720639f86:
    english: 'You can find the report by clicking the group settings menu cog, as shown below. '
    translation: Каб адкрыць справаздачу, націсніце значок шасцярні ў меню налад групы, як паказана ніжэй.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a8f7425ca00b558b:
    english: "![Participation report action in the Oatmilk Cooperative menu](group_participation_report.png)"
    translation: "![Пункт справаздачы аб удзеле ў меню Oatmilk Cooperative](group_participation_report.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  90b9c89c6933eeee:
    english: "## What's in the report?"
    translation: "## Што ёсць у справаздачы?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  06aabe2c1d6cd716:
    english: "### Actions per month"
    translation: "### Дзеянні па месяцах"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6772e16cee705fc1:
    english: 'Understand how much participation happens in your group over a given period of time. '
    translation: Паглядзіце, наколькі актыўна людзі ўдзельнічалі ў жыцці вашай групы за выбраны перыяд.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fe690a715f8a00b5:
    english: The report shows how many threads, comments, polls, votes and reactions have happened per month. This is graphed so you can see ebbs and flows of usage.
    translation: Справаздача паказвае колькасць абмеркаванняў, каментарыяў, апытанняў, галасоў і рэакцый за кожны месяц. Графік дапамагае ўбачыць, як змянялася актыўнасць.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  21bf7cb257f4bb03:
    english: Click specific labels on the graph to remove them from view.
    translation: Націсніце на назву паказчыка на графіку, каб схаваць яго.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  35ced3d9d51038aa:
    english: Click specific headings in the table to sort the table by that column.
    translation: Націсніце на загаловак слупка ў табліцы, каб адсартаваць даныя па гэтым слупку.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9d511b052ae56765:
    english: "![Participation report controls, totals, and activity graph for Oatmilk Cooperative](group_participation_report_graph.png)"
    translation: "![Налады справаздачы аб удзеле, агульныя паказчыкі і графік актыўнасці Oatmilk Cooperative](group_participation_report_graph.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aacb6b17aff5ac38:
    english: "### Tag usage"
    translation: "### Выкарыстанне тэгаў"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  05aecaed54955302:
    english: This shows how frequently various tags have been applied during the specified time frame.  For example, you can see the number of decisions using a particular decision process or template.
    translation: Гэты раздзел паказвае, як часта розныя тэгі выкарыстоўваліся за выбраны перыяд. Напрыклад, вы можаце ўбачыць колькасць рашэнняў, прынятых з дапамогай пэўнага працэсу або шаблону.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9c6a609ca4029056:
    english: "![Tag activity over time for Production, Cafe partnerships, and Operations](group_participation_report_tags.png)"
    translation: "![Выкарыстанне тэгаў Production, Cafe partnerships і Operations з цягам часу](group_participation_report_tags.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  519237662235d020:
    english: |-
      ### Actions per user
      Understand who are the most and least active contributors in your group.
    translation: |-
      ### Дзеянні па карыстальніках
      Паглядзіце, хто ў вашай групе ўдзельнічае найбольш і найменш актыўна.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b538bd1f65e69d28:
    english: This table shows how many threads, comments, polls, votes and reactions each user in the specified groups was responsible for during the time frame. Click specific headings in the table to sort the table by that column.
    translation: Табліца паказвае, колькі абмеркаванняў, каментарыяў, апытанняў, галасоў і рэакцый прыпадае на кожнага карыстальніка ў выбраных групах за выбраны перыяд. Націсніце на загаловак слупка, каб адсартаваць даныя па гэтым слупку.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7d416ad780b3ca85:
    english: Turn on **Delegates only** to show people who are currently delegates in any of the selected groups. Their activity and voting record are aggregated across all selected groups, and delegates with no activity during the selected period remain in the table. The CSV download uses the same filter.
    translation: Уключыце **Толькі для дэлегатаў**, каб паказаць людзей, якія цяпер з'яўляюцца дэлегатамі хаця б у адной з выбраных груп. Іх дзеянні і звесткі пра галасаванне падсумоўваюцца па ўсіх выбраных групах. Дэлегаты без дзеянняў за выбраны перыяд таксама застаюцца ў табліцы. Пры спампоўванні CSV дзейнічае той самы фільтр.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  12baf5af62638134:
    english: "![Actions per delegate showing three levels of participation](group_participation_report_actions_per_user.png)"
    translation: "![Дзеянні дэлегатаў з трыма ўзроўнямі ўдзелу](group_participation_report_actions_per_user.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1650f708482b4789:
    english: "### Voting record per user"
    translation: "### Звесткі пра галасаванне па карыстальніках"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e6670b54039f316a:
    english: Compare the number of votes issued to each person with the number they cast, see missed votes, and identify people who cast every vote issued to them. A person with no issued votes is not shown as having cast all votes. Anonymous polls are excluded because an anonymous ballot must not be associated with the person who cast it.
    translation: Параўнайце колькасць галасаванняў, у якіх кожны чалавек мог удзельнічаць, з колькасцю пададзеных галасоў. Так вы ўбачыце прапушчаныя галасаванні і людзей, якія прагаласавалі ва ўсіх даступных ім галасаваннях. Калі чалавеку не было даступна ніводнага галасавання, справаздача не паказвае, што ён прагаласаваў ва ўсіх. Ананімныя апытанні выключаны, бо ананімны бюлетэнь нельга звязваць з чалавекам, які яго падаў.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  252da2b72775c4f8:
    english: Use **Delegates only** to review the voting record of current delegates. The CSV download uses the same name and delegate filters.
    translation: Выкарыстоўвайце **Толькі для дэлегатаў**, каб праглядзець звесткі пра галасаванне цяперашніх дэлегатаў. Пры спампоўванні CSV дзейнічаюць тыя самыя фільтры па імёнах і дэлегатах.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d720230a7ca893dc:
    english: "![Voting record for delegates showing issued, cast, and missed votes](group_participation_report_voting_record.png)"
    translation: "![Звесткі пра галасаванне дэлегатаў: даступныя, пададзеныя і прапушчаныя галасы](group_participation_report_voting_record.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  27754d9b8ac66b4a:
    english: "### Users per country"
    translation: "### Карыстальнікі па краінах"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2fbdea8b174cff14:
    english: How many users are in each country for all users in your group, based on the current IP address of users.
    translation: Колькасць карыстальнікаў вашай групы ў кожнай краіне вызначаецца паводле іх бягучых IP-адрасоў.
    status: machine
