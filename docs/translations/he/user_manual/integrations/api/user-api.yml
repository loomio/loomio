    translated_on: '2026-09-30'
  3e67180e9dbafb27:
    english: |-
      | Name | Description |
      | --- | --- |
      | `group_id` | Integer, optional, default null. ID of group for poll. If `discussion_id` is passed, `group_id` is ignored |
      | `discussion_id` | Integer, optional, default null. ID of discussion thread to add this poll to |
      | `title` | String, required. Title of the poll |
      | `poll_type` | String, required. Values: `proposal`, `poll`, `count`, `score`, `ranked_choice`, `meeting`, `dot_vote` |
      | `details` | String, optional. The body text of the poll |
      | `details_format` | String, optional, default `md`. Values: `md` or `html` |
      | `options` | Array of strings. If `poll_type` is `proposal`, valid values are `agree`, `disagree`, `abstain`, `block`. If `poll_type` is `meeting`, provide ISO 8601 date or datetime strings. For all other poll types, any string is valid |
      | `closing_at` | ISO 8601 string or null, default null. Example: `2026-09-01T12:00:00Z`. If null, voting is disabled and poll is considered work in progress |
      | `specified_voters_only` | Boolean, optional, default false. If true, only specified people can vote. If false, everyone in the group will be invited to vote |
      | `hide_results` | String, optional, default `off`. Values: `off`, `until_vote`, `until_closed` |
      | `shuffle_options` | Boolean, default false. Display options to voters in random order |
      | `anonymous` | Boolean, optional, default false. Hide identities of voters |
      | `recipient_audience` | `group` or null, optional, default null. If `group`, the whole group will be notified |
      | `notify_on_closing_soon` | String, optional, default `nobody`. Values: `nobody`, `author`, `undecided_voters`, `voters` |
      | `recipient_user_ids` | Array of user IDs to notify or invite |
      | `recipient_emails` | Array of email addresses of people to invite to vote |
      | `recipient_message` | Message to include in the email invitation |
      | `notify_recipients` | Boolean, default false. If false, add people without sending notifications. If true, everyone invited in this request will get a notification email |
    translation: |-
      | שם | תיאור |
      | --- | --- |
      | `group_id` | מספר שלם, לא חובה, ברירת המחדל היא null. מזהה הקבוצה של המשאל. אם נשלח `discussion_id`, המערכת מתעלמת מ-`group_id` |
      | `discussion_id` | מספר שלם, לא חובה, ברירת המחדל היא null. מזהה שרשור הדיון שאליו יתווסף המשאל |
      | `title` | מחרוזת, חובה. כותרת המשאל |
      | `poll_type` | מחרוזת, חובה. ערכים: `proposal`, `poll`, `count`, `score`, `ranked_choice`, `meeting`, `dot_vote` |
      | `details` | מחרוזת, לא חובה. תוכן המשאל |
      | `details_format` | מחרוזת, לא חובה, ברירת המחדל היא `md`. ערכים: `md` או `html` |
      | `options` | מערך מחרוזות. אם `poll_type` הוא `proposal`, הערכים התקינים הם `agree`, `disagree`, `abstain`, `block`. אם `poll_type` הוא `meeting`, יש לספק תאריך או תאריך ושעה בפורמט ISO 8601. בכל סוגי המשאל האחרים, כל מחרוזת תקינה |
      | `closing_at` | מחרוזת בפורמט ISO 8601 או null, ברירת המחדל היא null. לדוגמה: `2026-09-01T12:00:00Z`. אם הערך הוא null, ההצבעה מושבתת והמשאל נחשב לטיוטה |
      | `specified_voters_only` | ערך בוליאני, לא חובה, ברירת המחדל היא false. אם הערך הוא true, רק אנשים שצוינו יכולים להצביע. אם הערך הוא false, כל חברי הקבוצה יוזמנו להצביע |
      | `hide_results` | מחרוזת, לא חובה, ברירת המחדל היא `off`. ערכים: `off`, `until_vote`, `until_closed` |
      | `shuffle_options` | ערך בוליאני, ברירת המחדל היא false. הצגת האפשרויות למצביעים בסדר אקראי |
      | `anonymous` | ערך בוליאני, לא חובה, ברירת המחדל היא false. הסתרת זהות המצביעים |
      | `recipient_audience` | `group` או null, לא חובה, ברירת המחדל היא null. אם הערך הוא `group`, כל הקבוצה תקבל הודעה |
      | `notify_on_closing_soon` | מחרוזת, לא חובה, ברירת המחדל היא `nobody`. ערכים: `nobody`, `author`, `undecided_voters`, `voters` |
      | `recipient_user_ids` | מערך מזהי משתמשים שיש להודיע להם או להזמין אותם |
      | `recipient_emails` | מערך כתובות דוא״ל של אנשים שיש להזמין להצביע |
      | `recipient_message` | הודעה שתיכלל בהזמנה בדוא״ל |
      | `notify_recipients` | ערך בוליאני, ברירת המחדל היא false. אם הערך הוא false, אנשים יתווספו בלי לשלוח הודעות. אם הערך הוא true, כל מי שיוזמן בבקשה זו יקבל הודעה בדוא״ל |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
