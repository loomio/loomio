navigation_title: Інтеграції чату
blocks:
  2e7de12fecf4173f:
    english: "# Chat integrations"
    translation: "# Інтеграції чату"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  195fe68dbcc6418f:
    english: Loomio can send notifications to your chatroom.
    translation: Loomio може надсилати сповіщення до вашого чату.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bf886ec0d398e8d7:
    english: Chat tools and Loomio work well together. Use chat for quick conversation and timely updates. Move important topics to Loomio when people need time to participate, when a decision must be made, or when the group will need a lasting record.
    translation: Чат і Loomio добре доповнюють одне одного. Використовуйте чат для коротких розмов і своєчасних оновлень. Переносьте важливі питання до Loomio, коли людям потрібен час для участі, необхідно ухвалити рішення або групі знадобиться зберегти історію обговорення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  db7d26a18ddc651d:
    english: Loomio supports Slack, Discord, Microsoft Teams, Matrix and Mattermost.
    translation: Loomio підтримує Slack, Discord, Microsoft Teams, Matrix і Mattermost.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  765fc0d609a0db99:
    english: You can send notifications to your chatroom any time you like, just the same way you would invite individual people to vote, or to join a thread.
    translation: Ви можете будь-коли надіслати сповіщення до свого чату так само, як запрошуєте окремих людей проголосувати або приєднатися до теми.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a89717f4f41f3212:
    english: You can also configure notifications to always happen when a specific event happens, like someone starting a thread.
    translation: Ви також можете налаштувати автоматичні сповіщення про певні події, наприклад коли хтось створює тему.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c425490496cb0ed2:
    english: |-
      ## What it looks like in chat
      ![](chatbot_in_slack.png)
    translation: |-
      ## Як це виглядає в чаті
      ![](chatbot_in_slack.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e21550bf41c185b9:
    english: |-
      ## Generate a Webhook URL
      We've prepared step by step walk-throughs for each service we support. Follow the right one for your service to obtain the webhook URL you'll need to add the chat integration in Loomio.
    translation: |-
      ## Отримайте URL-адресу вебхука
      Ми підготували покрокові інструкції для кожного підтримуваного сервісу. Дотримуйтесь інструкції для свого сервісу, щоб отримати URL-адресу вебхука. Вона знадобиться для додавання інтеграції чату в Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  84f03860780d02b8:
    english: |-
      - [Slack](../slack/)
      - [Microsoft Teams](../microsoft_teams/)
      - [Discord](../discord/)
      - [Matrix](../matrix/)
      - [Mattermost](../mattermost/)
    translation: |-
      - [Slack](../slack/)
      - [Microsoft Teams](../microsoft_teams/)
      - [Discord](../discord/)
      - [Matrix](../matrix/)
      - [Mattermost](../mattermost/)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  290b36f9178272e2:
    english: |-
      Our webhook based system can also be used to support other systems that support incoming webhooks with either HTML or Markdown formatting. This could be something like Zapier or Rocketchat.
      Just select the mattermost bot, but use a custom webhook URL.
    translation: |-
      Інтеграція через вебхуки також працює з іншими сервісами, які приймають вхідні вебхуки з форматуванням HTML або Markdown, наприклад Zapier чи Rocketchat.
      Виберіть бота Mattermost і вкажіть власну URL-адресу вебхука.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f76c44196c94dcef:
    english: "## Set up a chat integration"
    translation: "## Налаштуйте інтеграцію чату"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3c63f567f90fd1eb:
    english: |-
      After configuring your chosen service (see above), you'll have a webhook URL.
      Open **Chat integrations** from the group menu and add a new chat integration for your group.
    translation: |-
      Після налаштування вибраного сервісу (див. вище) ви отримаєте URL-адресу вебхука.
      Відкрийте **Інтеграції чату** в меню групи та додайте нову інтеграцію чату для своєї групи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a2e8e555406040a6:
    english: |-
      ![](loomio-group-settings.png)
      ![](loomio-settings-chatbots.png)
    translation: |-
      ![](loomio-group-settings.png)
      ![](loomio-settings-chatbots.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ca092d1c3fdb9f59:
    english: 'You probably don''t want to click any of the checkboxes for now. Just enter the name (such as "Discord #general") and the URL and click the save button at the bottom of the form.'
    translation: 'Поки що залиште всі прапорці порожніми. Введіть назву (наприклад, "Discord #general") і URL-адресу, а потім натисніть кнопку **Зберегти** внизу форми.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a63a4be4a45bcfdb:
    english: If you decide later that you want the integration to receive automatic notifications, return to its settings and select the relevant events.
    translation: Якщо згодом ви захочете отримувати автоматичні сповіщення через цю інтеграцію, поверніться до її налаштувань і виберіть відповідні події.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f1d9c09f9d3c2a82:
    english: "### Invite to poll"
    translation: "### Запросіть до голосування"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cbc7b5fd5afcc24c:
    english: |-
      This is how to send a notification to your chatroom inviting people to vote in a proposal.
      It's the same process for Share outcome, Invite to thread, Remind to vote, Poll edited etc.
    translation: |-
      Так можна надіслати до чату сповіщення із запрошенням проголосувати за пропозицію.
      Так само можна поширити висновок, запросити до теми, нагадати про голосування або повідомити про редагування опитування.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  290001bb97dee010:
    english: |-
      ### Automatic notifications
      To send a notification whenever a specific event happens, edit the chat integration and select that event.
    translation: |-
      ### Автоматичні сповіщення
      Щоб надсилати сповіщення щоразу, коли відбувається певна подія, відкрийте налаштування інтеграції чату та виберіть цю подію.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
