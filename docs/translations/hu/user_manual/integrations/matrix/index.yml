  f3106c22cd3d4059:
    english: 'Loomio can send notifications into your Matrix channels when new discussions, proposals, comments, votes, and outcomes occur. '
    translation: A Loomio értesítéseket küldhet a Matrix-csatornáidba, amikor új beszélgetés, javaslat, hozzászólás, szavazat vagy következtetés születik.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a20cf2be00dac0ce:
    english: Matrix is nice because it allows some HTML in the chatroom, and Loomio takes advantage of this.
    translation: A Matrix támogat bizonyos HTML-elemeket a csevegőszobákban, és a Loomio ezt kihasználja.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ffe12502f0030fec:
    english: Our Matrix integration is a little different to our other chat integrations - it does not use a webhook - we've built a custom bot client for this one.
    translation: 'A Matrix-integráció eltér a többi csevegőintegrációnktól: webhook helyett egy erre készített botklienssel működik.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  44db147f65127a55:
    english: You will need to create a matrix user for the bot to login as.
    translation: Hozz létre egy Matrix-felhasználót, amellyel a bot bejelentkezhet.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  98045e5bf1339543:
    english: Once you've created a user for the bot, sign in at that user to obtain the following information.
    translation: Miután létrehoztad a bot felhasználóját, jelentkezz be ezzel a fiókkal az alábbi adatok megszerzéséhez.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
