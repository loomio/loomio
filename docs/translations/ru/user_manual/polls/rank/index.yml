navigation_title: Классифицировать
blocks:
  92702560a3786c85:
    english: "# Rank"
    translation: "# Классифицировать"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7cf7aa3423ff6b9d:
    english: Rank finds the group's overall order of preference. Participants arrange options from most to least preferred, and Loomio assigns more points to higher-ranked options.
    translation: Классификация помогает определить общий порядок предпочтений группы. Участники располагают варианты от наиболее до наименее предпочтительного, а Loomio начисляет больше баллов вариантам, которые стоят выше.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72790fdf21d1f129:
    english: "## When to use Rank"
    translation: "## Когда использовать классификацию"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f9ce50752bf1c1e7:
    english: 'Use Rank when preference order matters and you want one overall ordering. It works well for:'
    translation: 'Используйте классификацию, когда важен порядок предпочтений и нужен общий список вариантов. Она подходит, чтобы:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a5c8ee257df4dc2:
    english: |-
      - selecting one candidate for a position;
      - ordering projects for a work plan;
      - prioritizing conference topics;
      - choosing backup options as well as a first choice; or
      - reducing a long list to an ordered shortlist.
    translation: |-
      - выбрать одного кандидата на должность;
      - расположить проекты по порядку для рабочего плана;
      - определить приоритет тем конференции;
      - выбрать запасные варианты наряду с основным; или
      - сократить длинный список до короткого списка с порядком предпочтения.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2549ddaa8a4a4fa8:
    english: Rank uses a points-based ordering. It is not a proportional election method. To elect several people while representing different groups of voters, use an [STV Election](/en/user_manual/polls/stv/).
    translation: Классификация упорядочивает варианты по баллам. Это не метод пропорциональных выборов. Если нужно избрать нескольких человек с учётом предпочтений разных групп избирателей, используйте [выборы по системе единого передаваемого голоса](/en/user_manual/polls/stv/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2a859bf73143ce12:
    english: "## Example: rank bottle designs"
    translation: "## Пример: выбор дизайна бутылки"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  46a7d343d3b48bea:
    english: Oatmilk Cooperative asks members to rank four bottle designs for its returnable-bottle trial. Participants consider handling, durability, customer needs, storage, and compatibility with the washing equipment.
    translation: Кооператив Oatmilk просит участников расположить четыре варианта дизайна бутылки по предпочтению для испытания возвратной тары. Участники учитывают удобство использования, прочность, потребности покупателей, хранение и совместимость с моечным оборудованием.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c74ebb16f872b3c6:
    english: "## Set up the poll"
    translation: "## Настройте голосование"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5975d0fd35ec0a7c:
    english: State what the ranking will determine and add the options. Set **Number of choices** to control how many options each person may rank. A first choice receives the most points, the next choice receives one fewer, and unranked options receive no points.
    translation: Укажите, что определит классификация, и добавьте варианты. Настройка **Количество вариантов выбора** определяет, сколько вариантов может расположить по предпочтению каждый участник. Первый вариант получает больше всего баллов, следующий — на один балл меньше. Варианты, которые участник не выбрал, не получают баллов.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  47f32c81e29fa3c6:
    english: Require all options to be ranked when you need a complete ordering. Allow fewer choices when participants may not know enough to rank everything. Showing options in random order can reduce the influence of their initial presentation.
    translation: Потребуйте расположить все варианты, если нужен полный порядок предпочтений. Разрешите выбрать меньше вариантов, если участники могут знать недостаточно, чтобы оценить каждый. Случайный порядок показа вариантов может уменьшить влияние их исходного расположения.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Проголосуйте"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  53946361c36775f0:
    english: Participants drag the options into their preferred order, with number 1 as the first choice. They can add a reason explaining the criteria behind their ranking.
    translation: Участники перетаскивают варианты в порядке своих предпочтений. Номер 1 означает первый выбор. Они могут добавить пояснение и указать, чем руководствовались при выборе.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eae63303cb9dced6:
    english: In this example, the voter puts the **500 ml amber bottle** first and the **500 ml clear bottle** second because both fit the existing cafe storage and washing equipment.
    translation: В этом примере участник ставит **янтарную бутылку объёмом 500 мл** на первое место, а **прозрачную бутылку объёмом 500 мл** — на второе. Обе подходят для существующего места хранения в кафе и моечного оборудования.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Изучите результаты"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6be27268f870dc3e:
    english: 'The results combine all ballots into an overall points-based ranking. For each option they show:'
    translation: 'Результаты объединяют все бюллетени в общий рейтинг по баллам. Для каждого варианта показаны:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  88b912ae1b9787bc:
    english: |-
      - **Rank**: its position in the combined result;
      - **% of points**: its share of all ranking points;
      - **Points**: the total points from all ballots;
      - **Mean**: its average points per voter; and
      - **Voters**: how many people ranked it.
    translation: |-
      - **Классифицировать**: место в общем рейтинге;
      - **% баллов**: доля от всех начисленных баллов;
      - **Точки**: сумма баллов по всем бюллетеням;
      - **Иметь в виду**: среднее число баллов на одного проголосовавшего;
      - **Избиратели**: сколько человек включили этот вариант в свой список.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2e0cda6f79f31a51:
    english: In this example, the **500 ml amber bottle** ranks first, followed by the **500 ml clear bottle** and the **750 ml amber bottle**. The group can investigate the preferred design first while retaining the remaining order as a sequence of alternatives.
    translation: В этом примере **янтарная бутылка объёмом 500 мл** занимает первое место, за ней следуют **прозрачная бутылка объёмом 500 мл** и **янтарная бутылка объёмом 750 мл**. Группа может сначала изучить предпочтительный дизайн, сохранив остальные варианты как последовательность альтернатив.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  22df687a6fa02ddb:
    english: A points-based result can conceal different preference patterns that produce the same total. Review individual ballots and vote reasons when options are close or the decision is consequential.
    translation: Одинаковая сумма баллов может скрывать разные предпочтения участников. Если результаты вариантов близки или решение имеет серьёзные последствия, изучите отдельные бюллетени и пояснения к голосам.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
