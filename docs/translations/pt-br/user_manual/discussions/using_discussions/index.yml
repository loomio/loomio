    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  347def7574cf5f1d:
    english: "## Actions"
    translation: "## Ações"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '08ff4ccd500c2a69':
    english: The right sidebar contains actions for the whole thread. Some actions are also available from the three-dot menu (**⋯**) beside a thread on the group page.
    translation: A barra lateral direita contém ações para a conversa inteira. Algumas também estão disponíveis no menu de três pontos (**⋯**) ao lado da conversa na página do grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e73701c7d36f95ef:
    english: The actions shown depend on your permissions. Group admins can manage threads, and group settings may allow members to perform some management actions. See [Group permissions](/en/user_manual/groups/settings/permissions).
    translation: As ações disponíveis dependem das suas permissões. Administradores do grupo podem gerenciar conversas, e as configurações do grupo podem permitir que membros realizem algumas ações de gerenciamento. Consulte [Permissões do grupo](/en/user_manual/groups/settings/permissions).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4fce317a163b0a40:
    english: "### Print"
    translation: "### Imprimir"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9317d4c7c5ef4764:
    english: Select **Print** to generate a page suitable for printing. Use your browser's print dialog to save it as a PDF.
    translation: Selecione **Imprimir** para gerar uma página adequada para impressão. Use a caixa de diálogo de impressão do navegador para salvá-la como PDF.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  443af0749df1db2a:
    english: "### Markdown"
    translation: "### Markdown"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eb0442148f7c042d:
    english: Select **Markdown** to save the complete thread as structured Markdown. Choose **Copy Markdown** to copy it to your clipboard, or **Download Markdown** to save it as a `.md` file. You can use it for meeting minutes, a document, an archive of decisions, an AI assistant, or another tool that supports Markdown.
    translation: Selecione **Markdown** para salvar a conversa inteira em Markdown estruturado. Escolha **Copiar Markdown** para copiá-la para a área de transferência ou **Baixar Markdown** para salvá-la como um arquivo `.md`. Você pode usá-la para atas de reunião, documentos, arquivos de decisões, assistentes de IA ou outras ferramentas compatíveis com Markdown.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  80e3f57638b53cb4:
    english: The document begins with YAML front matter containing the thread key, group, creation date, last activity date, and tags. It then includes the discussion context and every comment, poll, vote, and outcome in the same order and nesting as the threaded view.
    translation: O documento começa com metadados YAML que contêm a chave da conversa, o grupo, a data de criação, a data da última atividade e as tags. Depois, inclui o contexto da discussão e todos os comentários, enquetes, votos e conclusões, na mesma ordem e organização em níveis da visualização em threads.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f99823b7b44e2cdd:
    english: Each poll is a section. Comments, votes, and outcomes are quoted, and replies are quoted beneath the item they answer. This shows where each person's text begins and ends. Each quote starts with one line showing the person, when they posted, the item's number in the thread, and any reactions. Votes and outcomes also say what they are. The thread key and item number identify each item in Loomio.
    translation: Cada enquete ocupa uma seção. Comentários, votos e conclusões aparecem como citações, e as respostas são citadas abaixo do item ao qual respondem. Assim, fica claro onde começa e termina o texto de cada pessoa. Cada citação começa com uma linha que mostra quem publicou o item, quando o publicou, o número do item na conversa e as reações, se houver. Votos e conclusões também são identificados. A chave da conversa e o número do item identificam cada item no Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e5bdfbb4a0d7646f:
    english: Loomio applies the same visibility rules as the thread. Results and vote reasons you cannot see are not included, and voters are not identified in anonymous polls. If an open poll hides results until you vote, vote before exporting the thread. **Markdown** and **Print** are unavailable until you do.
    translation: O Loomio aplica as mesmas regras de visibilidade da conversa. Resultados e justificativas de votos que você não pode ver ficam de fora, e as pessoas que votaram em enquetes anônimas não são identificadas. Se uma enquete aberta ocultar os resultados até que você vote, vote antes de exportar a conversa. **Markdown** e **Imprimir** ficam indisponíveis até lá.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7989d3386a42f180:
    english: 'For example, a discussion containing a comment, reactions, a proposal, two votes, a reply, and an outcome produces this Markdown:'
