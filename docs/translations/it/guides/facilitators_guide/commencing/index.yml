---
navigation_title: Per iniziare
blocks:
  43e4cbf778263d11:
    english: "# Commencing"
    translation: "# Per iniziare"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0ce0604bb021d98f:
    english: "## Invitation"
    translation: "## L'invito"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d5fabca3934dafd:
    english: How participants are invited into a facilitated space is incredibly important. People understand huge amounts of information from the invitation, and use it to judge how a space will be held and if they belong there. The moment of invitation is in many ways the defining opportunity to set the tone and establish trust.
    translation: Il modo in cui inviti le persone a partecipare a uno spazio facilitato è molto importante. Dall'invito ricavano molte informazioni e valutano come sarà gestito lo spazio e se vi si sentiranno a proprio agio. L'invito è un'occasione decisiva per dare il tono all'incontro e creare fiducia.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a8d7e10a50432195:
    english: |-
      > <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../rich_200.png"> Decision making is all about communication: your group can only make good decisions together if there’s a foundation of good communication in place first. This means being clear about what the purpose of a discussion or meeting is, who needs to be involved, what the time-frame is, and what people can expect.
      >
      > — Richard Bartlett
    translation: |-
      > <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../rich_200.png"> Prendere decisioni significa comunicare: il tuo gruppo può prendere buone decisioni insieme solo se prima ha costruito una buona comunicazione. Occorre chiarire lo scopo della discussione o dell'incontro, chi deve partecipare, quali sono i tempi e cosa possono aspettarsi le persone.
      >
      > — Richard Bartlett
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ab260e60bf87a11d:
    english: 'Key aspects to an invitation:'
    translation: 'Aspetti essenziali di un invito:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ff258493e21d7f3a:
    english: |-
      * **Background.** What is this thing? What am I being asked to do? Who is behind this? Who else will be involved? What is the time commitment, topic focus, and protocol?
      * **Context.** What is the character of this specific engagement? Of all the possible formats and ways it could go, which one will it be? Why now, why this way?
      * **Belonging.** Am I welcome? Is this for me? Am I needed in this process? What is my unique value and contribution? Why should I specifically be compelled?
      * **Safety.** Does this invitation indicate thoughtfulness, trust, and understanding? Is the structure of the engagement up to handling the inherent power dynamics at play? What level of honesty or vulnerability will this require of me? Do I think the person inviting is going to hold me well?
      * **Accessibility.** Will my basic requirements for participation be accommodated? Language, assistive technology, unfamiliar jargon, etc. Will it be possible for me to engage?
    translation: |-
      * **Premesse.** Di cosa si tratta? Che cosa mi si chiede di fare? Chi organizza? Chi altro parteciperà? Quanto tempo dovrò dedicare, qual è l'argomento e quali sono le regole?
      * **Contesto.** Che caratteristiche ha questa attività? Tra i tanti modi in cui potrebbe svolgersi, quale è stato scelto? Perché ora e perché in questo modo?
      * **Appartenenza.** Sono benvenuto? È uno spazio adatto a me? La mia presenza è necessaria? Che cosa posso apportare di specifico? Perché dovrei partecipare?
      * **Sicurezza.** L'invito mostra attenzione, fiducia e comprensione? La struttura dell'attività tiene conto delle dinamiche di potere? Quanto dovrò espormi o mostrarmi vulnerabile? Penso che la persona che mi invita saprà sostenermi?
      * **Accessibilità.** Saranno soddisfatte le mie esigenze fondamentali per partecipare? Per esempio quelle legate alla lingua, alle tecnologie assistive o a termini che non conosco. Potrò prendere parte all'attività?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aabfa9d842af2688:
    english: On Loomio
    translation: Su Loomio
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8a87ed2ddb6c659f:
    english: |-
      * The tool has a built-in function to [invite users](/en/user_manual/groups/inviting_people/) by email or by sending them a special link. Users can also request to join your group if your settings allow.
      * The invitation tools built into the software are very basic, and getting an unexpected login request for new software without context isn't very inviting, so group creators often introduce people to the idea of Loomio through a separate process.
      * Many aspects of Loomio are already designed to create a safe and respectful space users would want to enter — such as thoughtful [privacy options](/en/user_manual/groups/starting_a_group/#privacy).
      * The design of the software itself is meant to be friendly, simple, and professional, hopefully putting out a trustworthy vibe.
      * Loomio has accessibility features, for people who use assistive technology like screen readers, and translation features for people who speak different languages. Emphasising these aspects in an invitation can make some people feel more welcome.
    translation: |-
      * Loomio permette di [invitare persone](/en/user_manual/groups/inviting_people/) via email o tramite un link dedicato. Le persone possono anche chiedere di entrare nel tuo gruppo, se le impostazioni lo consentono.
      * Gli strumenti di invito integrati sono essenziali. Ricevere senza contesto una richiesta di accesso a un software nuovo può disorientare. Per questo, chi crea un gruppo spesso presenta Loomio alle persone in un altro modo prima di invitarle.
      * Diversi aspetti di Loomio sono pensati per creare uno spazio sicuro e rispettoso, nel quale le persone desiderino entrare. Tra questi ci sono le [opzioni per la privacy](/en/user_manual/groups/starting_a_group/#privacy).
      * Anche l'interfaccia è pensata per essere semplice, accogliente e professionale, così da ispirare fiducia.
      * Loomio offre funzioni di accessibilità per chi usa tecnologie assistive, come i lettori di schermo, e funzioni di traduzione per chi parla lingue diverse. Menzionarle nell'invito può aiutare alcune persone a sentirsi più benvenute.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cb459c1230aaf54c:
    english: "## Arrival"
    translation: "## L'arrivo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ef55fa893f9e1034:
    english: The moment of arrival is the “first impression” of an engagement, and sets the trajectory from there on in. The person has accepted an invitation and decided to step in. They are open and expectant, and the impression they get will make a big impact on their experience.
    translation: 'L''arrivo è il momento della prima impressione e influenza ciò che seguirà. La persona ha accettato l''invito e ha deciso di partecipare. È pronta a scoprire lo spazio: l''impressione che ne ricava avrà un forte effetto sulla sua esperienza.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  66e7e79597f6a3d0:
    english: |-
      ### Welcoming
      To enable openness to engagement, participation, and receptivity, a person has to feel welcome. They need their existence acknowledged, and to feel a sense of hospitality.
    translation: |-
      ### Accoglienza
      Per sentirsi pronta a interagire e partecipare, una persona deve sentirsi benvenuta. Ha bisogno che la sua presenza sia riconosciuta e di essere accolta con ospitalità.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b3ce2bd5e2ea9acd:
    english: |-
      ### Settling
      When someone enters a physical room, they want to know where to sit, where the exit is, where to go to the bathroom, and if there is coffee available. They need a basic introduction to the space and their place in it.
    translation: |-
      ### Orientamento
      Quando entra in una stanza, una persona vuole sapere dove sedersi, dove si trova l'uscita, come raggiungere il bagno e se c'è del caffè. Ha bisogno di una breve introduzione allo spazio e al posto che può occupare.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d6fd9d29415a172:
    english: |-
      * The group description fields and discussion context box are the main space to put a “welcome message” for people arriving into the space.
      * Take a tour of the Loomio space, tweak things to make yourself comfortable (like [notification settings](/en/user_manual/users/email_settings/) and your [profile photo](/en/user_manual/users/user_profile/).
      * See information how you like using different thread views and options like Recent, Unread, Mute, and Star. Make yourself at home.
    translation: |-
      * La descrizione del gruppo e il riquadro del contesto della discussione sono i luoghi principali in cui inserire un messaggio di benvenuto per chi arriva.
      * Esplora lo spazio Loomio e personalizzalo secondo le tue preferenze, per esempio modificando le [impostazioni delle notifiche](/en/user_manual/users/email_settings/) e la tua [foto del profilo](/en/user_manual/users/user_profile/).
      * Scegli come visualizzare le informazioni usando le diverse viste delle discussioni e opzioni come Recenti, Non lette, Silenzia e Aggiungi ai preferiti. Prendi confidenza con lo spazio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8acf15fe96515738:
    english: "## Who’s in the Room"
    translation: "## Chi è presente"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  48c4449cd1d9b135:
    english: Introducing yourself and being introduced to others is one of the most basic and most important human social functions. From Māori *mihimihi* to British “how do you do” to Japanese business card exchanges, every culture places a lot of importance on this. It goes beyond practicalities and politeness and touches on a deep human need, which is a prerequisite for comfort, openness, and focus.
    translation: 'Presentarsi e conoscere le altre persone è una delle attività sociali più semplici e importanti. Dal *mihimihi* Māori al britannico «how do you do», fino allo scambio di biglietti da visita in Giappone, ogni cultura attribuisce importanza alle presentazioni. Non è solo una questione pratica o di cortesia: risponde a un bisogno umano profondo, necessario per sentirsi a proprio agio, aperti e concentrati.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a8eec818aeb74e64:
    english: As a facilitator, if you don’t give people a chance to introduce themselves and find out who is around them, they will generally subvert whatever else you’re trying to point their attention at until you allow this process to occur. Consciously design introductions as a feature, and use them as an opportunity to further the overall goals of the interaction.
    translation: Se faciliti un incontro senza dare alle persone la possibilità di presentarsi e conoscere chi è presente, in genere continueranno a cercare quelle informazioni, anche mentre provi a richiamare la loro attenzione su altro. Prevedi quindi un momento per le presentazioni e usalo per contribuire agli obiettivi dell'incontro.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ad3d2a31a23af036:
    english: "### Check in"
    translation: "### Giro iniziale"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  71d51a259d8b2c35:
    english: Even among groups who already know each other well, this introduction process continues with “checking in” – where everyone has a chance to speak at the beginning of a meeting (often to a question of "what is on top for you", "how are you", or "is there anything preventing you from being present") and other good practices for team cohesion. People have a multitude of identities, which change based on the context. People answer and re-answer “who am I for this moment” all the time, and that is what allows them to orient around one another.
    translation: 'Anche nei gruppi in cui le persone si conoscono bene, le presentazioni continuano sotto forma di un giro iniziale. All''inizio di un incontro, ciascuno ha la possibilità di parlare, spesso rispondendo a domande come «Che cosa ti occupa la mente?», «Come stai?» o «C''è qualcosa che ti impedisce di essere pienamente presente?». È una delle pratiche che aiutano il gruppo a restare unito. Ogni persona ha molte identità, che cambiano a seconda del contesto. Continuiamo a rispondere alla domanda «Chi sono in questo momento?»: è anche così che riusciamo a orientarci nelle relazioni con gli altri.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0573ae3aef6f1c6c:
    english: People's expression does not occur in a vaccuum, but in the context of who they are. A multi-faceted view of someone’s identity is an essential aspect of interpreting their contributions.
    translation: Ciò che una persona esprime non nasce nel vuoto, ma nel contesto della sua identità. Per comprendere i suoi contributi, è essenziale riconoscere le diverse sfaccettature di ciò che è.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  86eb005fd168a424:
    english: "> We start many of our meetings with everyone “checking in” before we get to the agenda. These check-ins are focused not on your work tasks, but on how you’re doing as a human being. If you’re going through a rough patch at home, or you’re sick, or you have exciting positive news, understanding your state of mind will help the entire group have the right context to interpret how you’re communicating. — Richard Bartlett"
    translation: "> Iniziamo molti dei nostri incontri con un giro in cui ciascuno racconta come sta, prima di passare all'ordine del giorno. Non parliamo delle attività di lavoro, ma di come stiamo come persone. Se stai attraversando un periodo difficile a casa, sei malato o hai una bella notizia, conoscere il tuo stato d'animo aiuta tutto il gruppo a interpretare ciò che comunichi nel giusto contesto. — Richard Bartlett"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d5aea1c0564ccff8:
    english: |-
      * Create a thread called "Introduce yourself" or "Check in". It provides a useful first _call to action_ everyone coming in will understand.
      * For “request to join” groups, we have a function that allows the requestor to introduce themselves to the coordinator, to get access to the group. Some groups have a process of re-posting this content in the intro thread to welcome people in.
      * Upload profile photos! Photos of faces are one of the most powerful ways of feeling like you know who is in the room with you online.
    translation: |-
      * Crea una discussione chiamata «Presentati» o «Come stai?». Offre a chi arriva una prima _azione da compiere_ facile da capire.
      * Nei gruppi che prevedono una richiesta di adesione, una funzione consente a chi fa richiesta di presentarsi alla persona che coordina il gruppo. Alcuni gruppi ripubblicano questa presentazione nella discussione dedicata per dare il benvenuto ai nuovi membri.
      * Carica una foto del profilo. Vedere i volti è uno dei modi più efficaci per riconoscere le persone con cui condividi uno spazio online.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d3b245589018cebf:
    english: "## Who’s NOT in the Room"
    translation: "## Chi non è presente"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5daf97a7cbbdd355:
    english: Diversity is critical for quality group decision making. The “wisdom of the crowd effect” (collective intelligence) only works by combining a variety of viewpoints. Outcomes of collaboration processes depend heavily on which voices are, and are not, represented. It’s impossible to have perfect representative inclusion, but you need to take into account who might be missing.
    translation: La diversità è fondamentale per prendere buone decisioni di gruppo. La «saggezza della folla», o intelligenza collettiva, nasce dall'unione di punti di vista diversi. L'esito di un processo collaborativo dipende molto dalle voci presenti e da quelle assenti. Non è possibile garantire una rappresentanza perfetta, ma è necessario considerare chi potrebbe mancare.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b16b07380f6bc37c:
    english: It’s extremely common for people to have blind spots around privilege. Humans are not great at intuiting bias, and are a lot better at noticing the presence of something, rather than the absence. Our minds trick us. For example, when women and men are deliberately given an equal amount of talking time there is often a perception that women are getting more than their fair share, due to different ideas about how much they “should” talk ([more details](https://www.quora.com/Do-women-tend-to-talk-more-than-men)). It can be necessary to actually measure or count to get an accurate picture, instead of relying on intuition.
    translation: È molto comune non accorgersi dei propri privilegi. Riconoscere i pregiudizi non è facile e tendiamo a notare ciò che è presente più di ciò che manca. La nostra percezione può ingannarci. Per esempio, anche quando a donne e uomini viene assegnato deliberatamente lo stesso tempo per parlare, spesso si ha l'impressione che le donne parlino più del dovuto. Questo dipende da idee diverse su quanto «dovrebbero» parlare ([maggiori dettagli](https://www.quora.com/Do-women-tend-to-talk-more-than-men)). Per avere un quadro preciso può essere necessario misurare o contare, anziché affidarsi all'intuito.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2b720395fe4e451f:
    english: Someone who does not have particular accessibility needs may not even notice that a venue isn’t wheelchair accessible, a document isn’t formatted for screen readers, or a situation is excluding someone with hearing loss. But the people with those challenges will notice. Someone without kids might not consider that a 7PM meeting time won't work for parents. These, and a thousand other practical, social, and cultural elements, could block someone from *being in the room*.
    translation: Chi non ha particolari esigenze di accessibilità potrebbe non accorgersi che un luogo non è accessibile in sedia a rotelle, che un documento non è adatto ai lettori di schermo o che una situazione esclude chi ha una perdita uditiva. Le persone interessate, invece, se ne accorgeranno. Chi non ha figli potrebbe non pensare che una riunione alle 19:00 sia difficile da seguire per i genitori. Questi e molti altri fattori pratici, sociali e culturali possono impedire a qualcuno di *essere presente*.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  25ac4ed8610c591c:
    english: 'It’s especially important to think about who is not in room when trying to solve problems for others: build with, not for; talk with people, not about them. If the people you are trying to serve are not in the room, it’s very unlikely you’ll have all the input you need to be effective. This is just as much about effectiveness for business outcomes as about social justice; it’s almost always better to design collaboration *with* the users or stakeholders.'
    translation: 'Pensare a chi non è presente è particolarmente importante quando cerchi di risolvere problemi che riguardano altre persone: costruisci le soluzioni con loro e parla con loro. Se le persone a cui vuoi rivolgerti non partecipano, è improbabile che tu abbia tutte le informazioni necessarie per agire con efficacia. È una questione di risultati concreti oltre che di giustizia sociale: quasi sempre è meglio progettare la collaborazione *con* gli utenti o le parti interessate.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6b44ef1725c36586:
    english: |-
      * Collaborating online can allow for whole other levels of inclusion. Instead of thinking about a “digital divide”, think about the “digital bridge” — how technology can include people who cannot attend in-person meetings or participate at a specific time, and enable whole new possibilities like multi-lingual discussions.
      * Loomio makes it very clear who is invited to a group and who has participated in a discussion, giving important information for thinking about inclusion. If people are missing, you can see that.
      * If inclusive decision making and diversity of thinking are important to you, periodically ask yourself, “Who’s not in the room? Why?”
    translation: |-
      * Collaborare online può aprire nuove possibilità di inclusione. Oltre al «divario digitale», considera il «ponte digitale»: la tecnologia può coinvolgere chi non può partecipare a incontri di persona o in un orario preciso e può rendere possibili, per esempio, discussioni in più lingue.
      * Loomio mostra chiaramente chi è stato invitato in un gruppo e chi ha partecipato a una discussione. Sono informazioni utili per valutare l'inclusione: puoi vedere se manca qualcuno.
      * Se per te sono importanti decisioni inclusive e punti di vista diversi, chiediti periodicamente: «Chi non è presente? Perché?»
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0a5324e7de64cdba:
    english: "## Culture, Protocol, Expectations"
    translation: "## Cultura, regole e aspettative"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  851a2601b835fbb1:
    english: Culture can be quite a nebulous concept, and operates at multiple levels. The culture of the wider society has a big influence, but you can think of every group, and every session or discussion, as having a culture of its own.
    translation: La cultura è un concetto difficile da definire e agisce a più livelli. La società nel suo insieme ha una grande influenza, ma anche ogni gruppo, incontro o discussione ha una propria cultura.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  27d3b10b80ade309:
    english: How do we roll? How do we talk to one another? What is and is not ok here? What are the rules of the game, of how we interact?
    translation: Come ci comportiamo? Come ci parliamo? Che cosa è accettabile qui e che cosa non lo è? Quali regole guidano le nostre interazioni?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  54d83e0b3e487190:
    english: The process of confronting cultural questions can be a powerful moment of self-awareness for a group. Not confronting them can harm ability to meet goals, or sometimes tear a group apart completely.
    translation: Affrontare queste domande può aiutare un gruppo a conoscere meglio se stesso. Evitarle può ostacolare il raggiungimento degli obiettivi e, a volte, dividere completamente il gruppo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f9918d7d61cef0c9:
    english: Culture, protocol, and expectations can be implicit or explicit, and by nature intersect in complex ways with power dynamics and social capital. It’s a challenging balance to keep things loose enough to allow emergence, evolution, creativity, and freedom, while being explicit enough about bottom lines and boundaries to ensure safety.
    translation: La cultura, le regole e le aspettative possono essere implicite o esplicite. Si intrecciano in modi complessi con le dinamiche di potere e le relazioni sociali. Occorre lasciare spazio a cambiamento, creatività e libertà, ma anche definire limiti abbastanza chiari da garantire la sicurezza delle persone.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3d484eafb8524354:
    english: Facilitators often guide the group to live up to the culture it has set, follow the protocols it has agreed, and hold expectations to account. If a facilitator is tasked with this role, they need to be backed by a certain level of explicitness about those agreements, and a certain mandate. Otherwise, it can get messy.
    translation: Chi facilita spesso aiuta il gruppo a rispettare la cultura che ha scelto, a seguire le regole concordate e a mantenere gli impegni presi. Per svolgere questo ruolo, ha bisogno che gli accordi siano sufficientemente espliciti e che il gruppo gli riconosca il mandato di intervenire. Altrimenti possono nascere difficoltà.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ba3ef231a647d607:
    english: People often want to leave things to “common sense” and avoid agreeing a code of conduct or explicit protocols. However, this can disproportionately affect the most vulnerable members of the group, since they will feel the negative impacts of bad behavior or culture first and strongest, and are least empowered to counteract it themselves. It's the responsibility of the more privileged or influential members of the group to think through these questions carefully.
    translation: Spesso si preferisce affidarsi al «buon senso» ed evitare di concordare un codice di condotta o regole esplicite. Questo però può danneggiare soprattutto i membri più vulnerabili del gruppo. Sono i primi a subire gli effetti di comportamenti o consuetudini dannosi e hanno meno possibilità di contrastarli. Spetta ai membri con più privilegi o influenza riflettere con attenzione su queste questioni.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d14bcec24555318c:
    english: Like a legal contract, you hope you never have to enforce a code of conduct, but if you need it you’re very glad it’s there. You want to agree *before* it becomes necessary. In order for a facilitator or any member of the group to effectively stand up and say, “that’s not OK here”, you need to have already invested in culture-building and expectation-setting.
    translation: Come per un contratto, speri di non dover mai far rispettare un codice di condotta, ma se serve è utile averlo. È meglio concordarlo *prima* che diventi necessario. Perché chi facilita o un altro membro possa dire con efficacia «Qui questo comportamento non è accettabile», il gruppo deve aver già dedicato tempo a costruire la propria cultura e a definire le aspettative.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dda14b86acbd8199:
    english: |-
      * Because Loomio is usually used as a space for constructive deliberation among groups with a specific purpose and set of members, for the most part people engage in good faith and behave respectfully.
      * Loomio is designed specifically to give voice to the individual, and let them communicate their needs and concerns. Even if a majority doesn’t see a problem, a single person can raise it and be heard.
      * Communicating online enables a certain level of physical safety, because people are not face to face.
      * Some groups already use the group description field to note a code of conduct or expectations for behavior. Others have collectively agreed a set of expectations that govern participation.
      * Many groups use Loomio itself to decide their group protocols, such as how to engage, what is allowed, what a decision means and what makes it valid, etc.
      * Some core protocol issues are answered simply by using Loomio: Who is allowed here? How do we communicate?
      * One of the most basic decisions Loomio users all encounter is about decision-making protocol — Consensus? Majority? Quorum? Unanimity? Bringing the question of decision-making protocol to the fore can be a very productive step in cultural development.
    translation: |-
      * Loomio viene usato soprattutto da gruppi con uno scopo e membri definiti, come spazio di confronto costruttivo. Nella maggior parte dei casi, le persone partecipano in buona fede e si comportano con rispetto.
      * Loomio è progettato per dare voce a ogni persona e permetterle di comunicare esigenze e preoccupazioni. Anche se la maggioranza non vede un problema, una sola persona può sollevarlo ed essere ascoltata.
      * La comunicazione online offre un certo grado di sicurezza fisica, perché le persone non sono faccia a faccia.
      * Alcuni gruppi usano la descrizione del gruppo per indicare un codice di condotta o le aspettative sui comportamenti. Altri concordano insieme le regole di partecipazione.
      * Molti gruppi usano Loomio per decidere le proprie regole: come partecipare, che cosa è consentito, che cosa significa prendere una decisione e che cosa la rende valida.
      * L'uso stesso di Loomio chiarisce alcune questioni fondamentali: chi può partecipare a questo spazio? Come comunichiamo?
      * Una delle decisioni fondamentali che tutti i gruppi su Loomio devono affrontare riguarda le regole per decidere: consenso? Maggioranza? Quorum? Unanimità? Discuterne apertamente può aiutare il gruppo a sviluppare la propria cultura.
