  1d390c0c4f4cea4a:
    english: Category tags make it easy to find threads and polls about a particular type of work or topic.
    translation: Met categorielabels vind je gemakkelijk discussies en peilingen over een bepaald soort werk of onderwerp.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  572adf8961fc1178:
    english: |-
      Tags belong to the whole organization. A tag used in a parent group is the
      same tag in its subgroups, making it possible to organize related work across
      the organization. Loomio displays tag names alphabetically and shows their
      colors as dots beside the names.
    translation: |-
      Labels gelden voor de hele organisatie. Een label in een hoofdgroep is
      hetzelfde label in de subgroepen. Zo kun je samenhangend werk in de hele
      organisatie ordenen. Loomio toont labelnamen in alfabetische volgorde, met
      hun kleuren als stippen naast de namen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b5340bcbf37095dc:
    english: |-
      On your group page, click **Tags** above the thread list to see the tags used in
      the current group. Select a tag to show only threads with that tag. Use the
      filter textbox to search a long list, or select **Show more** to include all
      tags in the organization. Select **Show fewer** to return to the current
      group's tags.
    translation: |-
      Klik op je groepspagina op **Labels** boven de lijst met discussies om de labels
      van de huidige groep te zien. Selecteer een label om alleen discussies met dat
      label te tonen. Gebruik het filterveld om in een lange lijst te zoeken, of kies
      **Laat meer zien** om alle labels in de organisatie te tonen. Kies **Toon minder**
      om terug te keren naar de labels van de huidige groep.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9de81b9a795d066d:
    english: "## Apply tags"
    translation: "## Labels toekennen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bf284f7568360b53:
    english: Members who can edit a thread or poll can apply tags to it.
    translation: Leden die een discussie of peiling kunnen bewerken, kunnen er labels aan toekennen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  58488fe368513138:
    english: When you start a thread or poll, click the **Tags** field and select one or more tags.
    translation: Klik bij het starten van een discussie of peiling op het veld **Labels** en selecteer een of meer labels.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e060934a2853a35a:
    english: Start typing to filter the list. Select a tag again, or click the × on its chip, to remove it.
    translation: Begin te typen om de lijst te filteren. Selecteer een label opnieuw of klik op de × in het label om het te verwijderen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9f5e48b7e520d1a0:
    english: "## Create tags"
    translation: "## Labels aanmaken"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  efa789e9365b2ab2:
    english: |-
      Parent-group admins can always create tags for the parent group and its
      subgroups. Subgroup admins can create tags while tagging content in their
      subgroup. The **Members can create tags** group permission, enabled by default,
      allows other members who can tag a thread or poll to create new tag names. If
      the permission is disabled, members can still apply existing tags.
    translation: |-
      Beheerders van de hoofdgroep kunnen altijd labels aanmaken voor de hoofdgroep
      en haar subgroepen. Beheerders van een subgroep kunnen labels aanmaken wanneer
      ze inhoud in hun subgroep labelen. De groepsmachtiging **Leden kunnen tags aanmaken.**
      staat standaard aan. Daarmee kunnen andere leden die een discussie of peiling
      kunnen labelen ook nieuwe labels aanmaken. Als de machtiging uitstaat, kunnen
      leden nog steeds bestaande labels toekennen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7e06376f3431ad2f:
    english: To create a tag while starting a thread or poll, type its name in the **Tags** field and press Enter.
    translation: Typ bij het starten van een discussie of peiling de naam van een nieuw label in het veld **Labels** en druk op Enter.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
