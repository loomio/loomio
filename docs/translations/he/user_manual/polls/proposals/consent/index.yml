  e16bed826124695f:
    english: A Consent proposal asks whether a course of action is safe to try. Participants either consent or raise an objection. An objection identifies a concrete risk or harm that the proposal should address.
    translation: הצעת הסכמה בוחנת אם בטוח לנסות דרך פעולה מסוימת. המשתתפים יכולים להסכים או להעלות התנגדות. התנגדות מצביעה על סיכון או נזק ממשי שיש לתת לו מענה בהצעה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d675dd47ae42c929:
    english: This page explains how to run one Consent proposal. See the [Consent process](/en/guides/making_decisions/consent_process) for the complete workflow, including questions, Sense check, amendments, objections, and outcome.
    translation: עמוד זה מסביר כיצד לנהל הצעת הסכמה אחת. לתהליך המלא, הכולל שאלות, בדיקת עמדות, תיקונים, התנגדויות ומסקנה, ניתן לעיין ב[תהליך ההסכמה](/en/guides/making_decisions/consent_process).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7c4c79526b1d437b:
    english: "## When to use Consent"
    translation: "## מתי להשתמש בהסכמה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1b99c0443bd1e4c8:
    english: Use Consent when the group needs a workable decision that can proceed unless there is a valid objection. It suits experiments, operational policies, role agreements, and other decisions the group can review after gaining experience.
    translation: הסכמה מתאימה כאשר הקבוצה זקוקה להחלטה מעשית שאפשר להתקדם איתה כל עוד אין התנגדות מוצדקת. היא מתאימה לניסויים, למדיניות תפעולית, להסכמות על תפקידים ולהחלטות אחרות שהקבוצה יכולה לבחון מחדש לאחר שתצבור ניסיון.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  966f3146dc9f61f1:
    english: Consent does not require everyone to prefer the proposal. Define what counts as an objection before voting, and explain how objections will be tested and resolved.
    translation: הסכמה אינה מחייבת את כולם להעדיף את ההצעה. לפני ההצבעה יש להגדיר מה נחשב להתנגדות ולהסביר כיצד ייבחנו התנגדויות וכיצד יטופלו.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e6cf2f0ebd4a7f58:
    english: "## Example: start a bottle trial"
    translation: "## דוגמה: התחלת ניסוי בבקבוקים"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ad7be5e188748cb3:
    english: Oatmilk Cooperative proposes starting a six-week returnable-bottle trial next month. The trial is limited in scope and includes a review, so the group asks whether it is safe to try.
    translation: קואופרטיב חלב השיבולת מציע להתחיל בחודש הבא ניסוי של שישה שבועות בבקבוקים להחזרה. היקף הניסוי מוגבל, והוא כולל בחינה מחדש. לכן הקבוצה בוחנת אם בטוח לנסות אותו.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9703f1f9474243af:
    english: "## Set up the proposal"
    translation: "## הגדרת ההצעה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6458750b94201df6:
    english: Describe the proposed action, its limits, safeguards, and review point. Keep **Consent** and **Objection** meanings precise, and require a reason for objections so the concern can be understood and addressed.
    translation: יש לתאר את הפעולה המוצעת, את מגבלותיה, את אמצעי ההגנה ואת המועד לבחינה מחדש. יש להגדיר במדויק את משמעותן של **הַסכָּמָה** ו**הִתנַגְדוּת**, ולדרוש נימוק להתנגדות כדי שאפשר יהיה להבין את החשש ולטפל בו.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## הצבעה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d98c0e71880c8828:
    english: Participants select **Consent** when the proposal is safe enough to try, even if it is not their preferred plan. They select **Objection** when they can describe a material risk or harm.
    translation: יש לבחור ב**הַסכָּמָה** כשההצעה בטוחה מספיק כדי לנסות אותה, גם אם אינה האפשרות המועדפת. יש לבחור ב**הִתנַגְדוּת** כשאפשר להצביע על סיכון או נזק משמעותי.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## קריאת התוצאות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b0265040032f48e5:
    english: The chart makes objections visible, but the group must examine the reasons. Resolve a valid objection by amending the proposal, adding a safeguard, changing its scope, or deciding not to proceed.
    translation: התרשים מציג את ההתנגדויות, אך על הקבוצה לבחון את הנימוקים להן. ניתן לטפל בהתנגדות מוצדקת באמצעות תיקון ההצעה, הוספת אמצעי הגנה, שינוי היקפה או החלטה שלא להתקדם.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a87df65569cb3a09:
    english: Publish an outcome that records the agreed action, any safeguards, who is responsible, and when the group will review it.
    translation: יש לפרסם מסקנה שמתעדת את הפעולה שהוסכמה, את אמצעי ההגנה, את האחראים לביצוע ואת המועד שבו הקבוצה תבחן אותה מחדש.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
