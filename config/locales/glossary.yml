  thread:
    means: "The page that holds one conversation in Loomio: its context, comments, polls and votes. A thread can be a discussion thread or a poll thread, so thread must stay distinct from discussion. Use the word popular apps use for a thread (Slack, Teams, Gmail and messaging apps). Not a strand of fibre."
