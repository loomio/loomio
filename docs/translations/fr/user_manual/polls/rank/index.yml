  92702560a3786c85:
    english: "# Rank"
    translation: "# Classer"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7cf7aa3423ff6b9d:
    english: Rank finds the group's overall order of preference. Participants arrange options from most to least preferred, and Loomio assigns more points to higher-ranked options.
    translation: Le classement établit l’ordre de préférence global du groupe. Les participants classent les options de la plus à la moins préférée. Loomio attribue davantage de points aux options placées en tête.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72790fdf21d1f129:
    english: "## When to use Rank"
    translation: "## Quand utiliser le classement"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f9ce50752bf1c1e7:
    english: 'Use Rank when preference order matters and you want one overall ordering. It works well for:'
    translation: 'Utilisez le classement lorsque l’ordre des préférences compte et que vous souhaitez obtenir un ordre global. Il convient notamment pour :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a5c8ee257df4dc2:
    english: |-
      - selecting one candidate for a position;
      - ordering projects for a work plan;
      - prioritizing conference topics;
      - choosing backup options as well as a first choice; or
      - reducing a long list to an ordered shortlist.
    translation: |-
      - sélectionner une personne pour un poste ;
      - classer des projets dans un plan de travail ;
      - définir les sujets prioritaires d’une conférence ;
      - choisir des options de rechange en plus d’un premier choix ; ou
      - réduire une longue liste à une sélection ordonnée.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2549ddaa8a4a4fa8:
    english: Rank uses a points-based ordering. It is not a proportional election method. To elect several people while representing different groups of voters, use an [STV Election](/en/user_manual/polls/stv/).
    translation: Le classement repose sur des points. Ce n’est pas un mode de scrutin proportionnel. Pour élire plusieurs personnes tout en représentant différents groupes de votants, utilisez une [élection à vote unique transférable](/en/user_manual/polls/stv/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2a859bf73143ce12:
    english: "## Example: rank bottle designs"
    translation: "## Exemple : classer des modèles de bouteilles"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  46a7d343d3b48bea:
    english: Oatmilk Cooperative asks members to rank four bottle designs for its returnable-bottle trial. Participants consider handling, durability, customer needs, storage, and compatibility with the washing equipment.
    translation: La coopérative Oatmilk demande à ses membres de classer quatre modèles de bouteilles pour tester un système de bouteilles consignées. Les participants tiennent compte de la prise en main, de la solidité, des besoins des clients, du stockage et de la compatibilité avec l’équipement de lavage.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c74ebb16f872b3c6:
    english: "## Set up the poll"
    translation: "## Configurer le sondage"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5975d0fd35ec0a7c:
    english: State what the ranking will determine and add the options. Set **Number of choices** to control how many options each person may rank. A first choice receives the most points, the next choice receives one fewer, and unranked options receive no points.
    translation: Indiquez ce que le classement permettra de déterminer et ajoutez les options. Réglez **Nombre de choix** pour définir combien d’options chaque personne peut classer. Le premier choix reçoit le plus de points, le suivant en reçoit un de moins et les options non classées ne reçoivent aucun point.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  47f32c81e29fa3c6:
    english: Require all options to be ranked when you need a complete ordering. Allow fewer choices when participants may not know enough to rank everything. Showing options in random order can reduce the influence of their initial presentation.
    translation: Demandez de classer toutes les options si vous avez besoin d’un ordre complet. Autorisez moins de choix si les participants ne disposent pas d’assez d’informations pour tout classer. Présenter les options dans un ordre aléatoire peut réduire l’influence de leur ordre initial.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Voter"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  53946361c36775f0:
    english: Participants drag the options into their preferred order, with number 1 as the first choice. They can add a reason explaining the criteria behind their ranking.
    translation: Les participants font glisser les options pour les placer dans l’ordre de leur préférence, le numéro 1 correspondant à leur premier choix. Ils peuvent ajouter une explication sur les critères de leur classement.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eae63303cb9dced6:
    english: In this example, the voter puts the **500 ml amber bottle** first and the **500 ml clear bottle** second because both fit the existing cafe storage and washing equipment.
    translation: Dans cet exemple, la personne place la **bouteille ambrée de 500 ml** en premier et la **bouteille transparente de 500 ml** en deuxième, car les deux conviennent au stockage et à l’équipement de lavage du café.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Lire les résultats"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6be27268f870dc3e:
    english: 'The results combine all ballots into an overall points-based ranking. For each option they show:'
    translation: 'Les résultats combinent tous les bulletins en un classement global fondé sur les points. Pour chaque option, ils indiquent :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  88b912ae1b9787bc:
    english: |-
      - **Rank**: its position in the combined result;
      - **% of points**: its share of all ranking points;
      - **Points**: the total points from all ballots;
      - **Mean**: its average points per voter; and
      - **Voters**: how many people ranked it.
    translation: |-
      - **Rang** : sa position dans le résultat global ;
      - **% de points** : sa part de l’ensemble des points attribués ;
      - **Points** : le total des points reçus sur tous les bulletins ;
      - **Moyenne** : son nombre moyen de points par votant ; et
      - **Votants** : le nombre de personnes qui l’ont classée.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2e0cda6f79f31a51:
    english: In this example, the **500 ml amber bottle** ranks first, followed by the **500 ml clear bottle** and the **750 ml amber bottle**. The group can investigate the preferred design first while retaining the remaining order as a sequence of alternatives.
    translation: Dans cet exemple, la **bouteille ambrée de 500 ml** arrive en tête, suivie de la **bouteille transparente de 500 ml** et de la **bouteille ambrée de 750 ml**. Le groupe peut examiner d’abord le modèle préféré et conserver le reste du classement comme liste de solutions de rechange.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  22df687a6fa02ddb:
    english: A points-based result can conceal different preference patterns that produce the same total. Review individual ballots and vote reasons when options are close or the decision is consequential.
    translation: Un résultat fondé sur les points peut masquer des préférences différentes qui aboutissent au même total. Consultez les bulletins individuels et les raisons données pour les votes lorsque les options sont proches ou que la décision a des conséquences importantes.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
