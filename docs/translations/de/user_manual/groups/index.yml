  cce1047bc62d8a5e:
    english: "# Intro to Groups"
    translation: "# Einführung in Gruppen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  91a303d3d1fb3894:
    english: 'A Loomio group is a safe place for people to meet, have discussions and make decisions. '
    translation: Eine Loomio-Gruppe ist ein geschützter Ort, an dem Menschen zusammenkommen, diskutieren und Entscheidungen treffen können.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ea5096230dfe16d4:
    english: 'It’s a container where group members can find and share information, participate in important discussions and decisions that affect their work.  '
    translation: Hier können Gruppenmitglieder Informationen finden und teilen. Sie können sich an wichtigen Diskussionen und Entscheidungen beteiligen, die ihre Arbeit betreffen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  47903117cdc64e73:
    english: A Loomio group looks like this.  At the top of the page you will see an image and logo that you can tailor to represent your organization.  This allows people arriving into your group to see they have joined a place they recognize and feel welcome - a safe space where people feel at home, amongst friends and can participate effectively.
    translation: So sieht eine Loomio-Gruppe aus. Oben auf der Seite siehst du ein Bild und ein Logo, die du an deine Organisation anpassen kannst. So erkennen Menschen beim Beitritt deine Gruppe wieder und fühlen sich willkommen. In diesem geschützten Raum können sie sich wohlfühlen und wirksam beteiligen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3d39462ab98c79e6:
    english: "![The Oatmilk Cooperative group page, with its description and discussion list](group_page.png)"
    translation: "![Die Gruppenseite der Oatmilk Cooperative mit Beschreibung und Diskussionsliste](group_page.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  59f3bebbce1676a6:
    english: |-
      Choose a representative name for your group and use the group description to outline;
      - **what** this group is used for,
      - **why** this is important,
      - **who** is involved, and
      - **how** members can participate.
    translation: |-
      Wähle einen passenden Namen für deine Gruppe. Beschreibe in der Gruppenbeschreibung:
      - **wofür** die Gruppe da ist,
      - **warum** das wichtig ist,
      - **wer** beteiligt ist und
      - **wie** Mitglieder mitmachen können.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  79ae54bca7eb1797:
    english: You may also include information like a code of conduct, terms of reference or other governing documents for the group.
    translation: Du kannst auch einen Verhaltenskodex, eine Geschäftsordnung oder andere Regelwerke der Gruppe aufnehmen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '018c400616dad5f4':
    english: If you are preparing a new group, see [Introducing Loomio to your group](/en/user_manual/overview/introducing_loomio) for a practical sequence from choosing the first piece of work through to recording an outcome.
    translation: 'Wenn du eine neue Gruppe vorbereitest, findest du unter [Loomio in deiner Gruppe einführen](/en/user_manual/overview/introducing_loomio) eine praktische Anleitung: von der Auswahl der ersten gemeinsamen Aufgabe bis zum Festhalten eines Fazits.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1bda53ca8e31780c:
    english: "## Administration, Facilitation and Moderation - Code of Conduct"
    translation: "## Verwaltung, Begleitung und Moderation – Verhaltenskodex"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1091f77d5ab879ed:
    english: 'Loomio is built to foster inclusive participation, diversity and trust - helping groups make better decisions together. '
    translation: Loomio fördert die Beteiligung aller, Vielfalt und Vertrauen. So können Gruppen gemeinsam bessere Entscheidungen treffen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1ac058350eea2c6d:
    english: 'Some topics bring tension in a group.  So it''s important to allow a robust discussion to take place, while ensuring it is also a safe place, particularly for vulnerable people in your group. '
    translation: Manche Themen führen in einer Gruppe zu Spannungen. Eine offene Diskussion soll trotzdem möglich sein. Zugleich muss die Gruppe ein geschützter Raum bleiben, besonders für verletzliche Menschen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  999bb2251bf623cd:
    english: 'We recommend establishing a code of conduct for your group, to help everyone be aware of their responsibility for appropriate behaviour and encourage self-regulation. '
    translation: Wir empfehlen einen Verhaltenskodex für deine Gruppe. Er macht deutlich, dass alle für einen angemessenen Umgang miteinander verantwortlich sind, und hilft den Mitgliedern, ihr Verhalten selbst zu reflektieren.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9a77fa2d5f4fdb01:
    english: See the [Facilitator's Guide](/en/guides/facilitators_guide/commencing#culture-protocol-expectations) to further explore the value of a code of conduct.
    translation: Im [Leitfaden für die Gesprächsleitung](/en/guides/facilitators_guide/commencing#culture-protocol-expectations) erfährst du mehr darüber, warum ein Verhaltenskodex hilfreich ist.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
