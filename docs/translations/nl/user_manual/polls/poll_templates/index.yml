---
navigation_title: Peilingsjablonen
blocks:
  6428da81fbbe11c6:
    english: "# Poll templates"
    translation: "# Peilingsjablonen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  208bc68b458895f1:
    english: Poll templates are reusable starting points shown when someone selects **Start a vote** or **New poll**. A template combines a voting method with preset guidance, response options, and settings.
    translation: Peilingsjablonen zijn herbruikbare uitgangspunten die verschijnen wanneer iemand **Start een stemming** of **Nieuwe peiling** selecteert. Een sjabloon combineert een stemmethode met vooraf ingestelde uitleg, antwoordopties en instellingen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f290b92adeb2a791:
    english: Use this page to configure which templates are available to a group or to create one for your own process. To choose a template for a particular vote, see [Proposals](../proposals/) or [Polls](../proposal_types/). To facilitate a complete decision process, see [Making decisions](/en/guides/making_decisions/).
    translation: Op deze pagina lees je hoe je bepaalt welke sjablonen beschikbaar zijn voor een groep en hoe je een sjabloon maakt voor je eigen werkwijze. Wil je een sjabloon kiezen voor een stemming? Bekijk dan [Voorstellen](../proposals/) of [Peilingen](../proposal_types/). Lees [Besluiten nemen](/en/guides/making_decisions/) voor hulp bij het begeleiden van een volledig besluitvormingsproces.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  658d10486cbee7dc:
    english: "## Voting methods and templates"
    translation: "## Stemmethode en sjablonen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d903d1a58aebf643:
    english: A voting method controls how participants respond and how Loomio calculates the result. Examples include Proposal, Choose, Score, Allocate, Rank, Time poll, and STV.
    translation: Een stemmethode bepaalt hoe deelnemers antwoorden en hoe Loomio het resultaat berekent. Voorbeelden zijn Voorstel, Kiezen, Score, Toewijzen, Volgorde, Moment bevragen en STV.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  21efff1a5c91ad29:
    english: A poll template uses one of those methods and adds reusable defaults. For example, Sense check, Advice, Consent, and Consensus are different templates built on the Proposal voting method. Their instructions and response options differ even though Loomio handles their ballots in the same way.
    translation: Een peilingssjabloon gebruikt een van deze methoden en voegt herbruikbare standaardinstellingen toe. Zo zijn Peiling van het draagvlak, Advies, Consent en Consensus verschillende sjablonen op basis van de stemmethode Voorstel. De uitleg en antwoordopties verschillen, maar Loomio verwerkt de stemmen op dezelfde manier.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f622951ffc7e1064:
    english: "## Use a template"
    translation: "## Een sjabloon gebruiken"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  865e825cc7d00cf2:
    english: When starting a vote, select the **Proposal** or **Poll** tab and choose one of the templates available to the group.
    translation: Selecteer bij het starten van een stemming het tabblad **Voorstel** of **Peiling** en kies een van de sjablonen die voor de groep beschikbaar zijn.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1598f1a55a6944e6:
    english: The template supplies an introduction, example content, options, and settings. Review and edit these for the particular decision before starting the vote. Editing the new vote does not change the reusable template.
    translation: Het sjabloon bevat een inleiding, voorbeeldinhoud, opties en instellingen. Controleer deze en pas ze aan voor het besluit voordat je de stemming start. Als je de nieuwe stemming bewerkt, verandert het herbruikbare sjabloon niet.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8212a94908338b22:
    english: "## Who can manage templates"
    translation: "## Wie sjablonen kan beheren"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  378caa9ba83ee0dc:
    english: Group administrators can create and manage every poll template in their group. They can enable **Members can create templates** under **Group settings** → **Permissions**. When enabled, members can create templates and manage templates they authored.
    translation: Groepsbeheerders kunnen alle peilingssjablonen in hun groep maken en beheren. Ze kunnen **Leden kunnen sjablonen maken.** inschakelen via **Groepsinstellingen** → **Toestemmingen**. Daarna kunnen leden sjablonen maken en hun eigen sjablonen beheren.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0fafc6275b6c9153:
    english: "## Create a poll template"
    translation: "## Een peilingssjabloon maken"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5fc696a1e924179c:
    english: Open the template list and select **New template**. Start with an example or a blank template, then choose the group that will use it.
    translation: Open de lijst met sjablonen en selecteer **Nieuwe sjabloon**. Begin met een voorbeeld of een leeg sjabloon. Kies daarna de groep die het sjabloon gaat gebruiken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  37b3658ec66eb8b7:
    english: The template form defines the guidance and defaults people receive when they start a vote.
    translation: In het sjabloonformulier stel je de uitleg en standaardwaarden in die mensen zien wanneer ze een stemming starten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fa0dab51a009bf90:
    english: "### Template title, subtitle, and help"
    translation: "### Sjabloontitel, ondertitel en hulp"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  965cde5e13952ade:
    english: |-
      - **Template title** is the short name shown in the template list.
      - **Template subtitle** explains when to use it in one sentence.
      - **Template help** appears in the information panel when someone uses the template. Explain its purpose, any rules participants should know, and links to relevant policies or guides.
    translation: |-
      - **Sjabloontitel** is de korte naam in de lijst met sjablonen.
      - **Sjabloon ondertitel** legt in één zin uit wanneer je het sjabloon gebruikt.
      - **Sjabloonhulp** verschijnt in het informatiepaneel wanneer iemand het sjabloon gebruikt. Leg uit waarvoor het dient, welke regels deelnemers moeten kennen en waar ze relevant beleid of handleidingen kunnen vinden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f3e51b30163d5b85:
    english: Use plain, specific names that distinguish the template from others in the group.
    translation: Gebruik duidelijke, specifieke namen waarmee je het sjabloon kunt onderscheiden van andere sjablonen in de groep.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e6b8a09191bb8c3f:
    english: "### Voting method"
    translation: "### Stemmethode"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ea4fef806c1cf060:
    english: Choose what participants need to express and how the result should be calculated.
    translation: Kies wat deelnemers moeten kunnen aangeven en hoe het resultaat berekend moet worden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f8c87a496921c710:
    english: |-
      - **Proposal**: respond to a statement using defined positions;
      - **Choose**: select one or more options;
      - **Score**: evaluate every option on a scale;
      - **Allocate**: distribute a limited budget of points;
      - **Rank**: arrange options in preference order;
      - **Time poll**: indicate availability; and
      - **STV**: rank candidates in a proportional, multi-winner election.
    translation: |-
      - **Voorstel**: reageren op een stelling met vaste standpunten;
      - **Kiezen**: een of meer opties selecteren;
      - **Score**: elke optie beoordelen op een schaal;
      - **Toewijzen**: een beperkt aantal punten verdelen;
      - **Volgorde**: opties rangschikken naar voorkeur;
      - **Moment bevragen**: aangeven wanneer je beschikbaar bent; en
      - **STV**: kandidaten rangschikken voor een evenredige verkiezing met meerdere winnaars.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9d589e44fa94c5e2:
    english: Changing the voting method changes the fields and result calculation available to the template.
    translation: Als je de stemmethode wijzigt, veranderen de velden en de berekening van het resultaat die voor het sjabloon beschikbaar zijn.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  230689f781e4cbc7:
    english: "### Example title, details, and tags"
    translation: "### Voorbeeldtitel, details en categorielabels"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6fa4b3625c6ec7ce:
    english: Provide example content that helps an author frame the vote. These values are copied into a new proposal or poll and can be edited before it starts.
    translation: Voeg voorbeeldinhoud toe die iemand helpt de stemming te formuleren. Deze waarden worden gekopieerd naar een nieuw voorstel of een nieuwe peiling en kunnen worden bewerkt voordat de stemming begint.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a093368b30ac3c9b:
    english: Use prompts rather than fixed content when each use needs a different title or details. Add default category tags only when they apply every time the template is used.
    translation: Gebruik aanwijzingen in plaats van vaste tekst als elke stemming een andere titel of andere details nodig heeft. Voeg standaard categorielabels alleen toe als ze bij elk gebruik van het sjabloon passen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  24c3fa4b7ef676fd:
    english: "### Response options"
    translation: "### Antwoordopties"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e7421caab9c47f5b:
    english: 'Methods such as Proposal and Choose let you configure response options. Select the pencil icon beside an option to edit:'
    translation: 'Bij methoden zoals Voorstel en Kiezen kun je antwoordopties instellen. Selecteer het potloodpictogram naast een optie om het volgende te bewerken:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  73a065ad5b861579:
    english: |-
      - **Option name**: the short response label;
      - **Icon**: its visual marker;
      - **Meaning**: what selecting the option communicates; and
      - **Reason prompt**: the question shown when someone explains their response.
    translation: |-
      - **Optie naam**: het korte label voor het antwoord;
      - **Icoon**: het visuele symbool;
      - **Betekenis**: wat iemand met deze keuze aangeeft; en
      - **Reden prompt**: de vraag die verschijnt wanneer iemand een toelichting op het antwoord geeft.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  38bc8cfc36aaea2e:
    english: Define options so participants can tell the difference between them without guessing. The meanings should match the decision rules your group actually uses.
    translation: Omschrijf de opties zo dat deelnemers het verschil begrijpen zonder te hoeven gissen. De betekenissen moeten passen bij de besluitvormingsregels die jouw groep gebruikt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cc4adba73670a75b:
    english: "### Duration and settings"
    translation: "### Duur en instellingen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6c63a57ab4cec442:
    english: Set a default duration that is suitable for most uses of the template. The author can change the closing time for an individual vote.
    translation: Stel een standaardduur in die voor de meeste stemmingen met dit sjabloon geschikt is. De auteur kan de sluitingstijd voor een afzonderlijke stemming wijzigen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  df14be8dbf80fa3c:
    english: Other defaults can control result visibility, anonymous voting, vote-reason requirements, reminders, quorum, and method-specific behaviour. See [Proposal and poll settings](../settings/) for their effects.
    translation: Andere standaardinstellingen bepalen onder meer de zichtbaarheid van resultaten, anoniem stemmen, de verplichting om een stem toe te lichten, herinneringen, het quorum en gedrag dat bij de stemmethode hoort. Lees [Instellingen voor voorstellen en peilingen](../settings/) voor meer informatie over hun werking.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  774ed7b91d33ab10:
    english: "### Save and test the template"
    translation: "### Het sjabloon opslaan en testen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1b26a723ab8a9811:
    english: After saving, start a draft vote from the template. Check that its introduction, prompts, options, and defaults make sense to someone who did not create it. Starting a draft is also a useful way to confirm that the chosen voting method produces the result the group expects.
    translation: Start na het opslaan een conceptstemming vanuit het sjabloon. Controleer of de inleiding, aanwijzingen, opties en standaardinstellingen duidelijk zijn voor iemand die het sjabloon niet heeft gemaakt. Met een conceptstemming kun je ook controleren of de gekozen stemmethode het resultaat oplevert dat de groep verwacht.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1f0dab3f50320e75:
    english: "## Manage the template list"
    translation: "## De lijst met sjablonen beheren"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e9748843a900273f:
    english: 'Use the action menu beside a template to:'
    translation: 'Gebruik het actiemenu naast een sjabloon om:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  646235094d051c83:
    english: |-
      - **Edit** its reusable content and defaults;
      - **Move** it to a different position in the list;
      - **Hide** it from people starting votes; or
      - **Delete** a custom template that is no longer needed.
    translation: |-
      - de herbruikbare inhoud en standaardinstellingen te **Bewerken**;
      - het sjabloon naar een andere plek in de lijst te **Verplaatsen**;
      - het sjabloon te **Verbergen** voor mensen die een stemming starten; of
      - een aangepast sjabloon dat niet meer nodig is te **Delete**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3f6dc06b1fd2bce8:
    english: Select **Show hidden templates** to review or restore hidden templates. Default templates can be hidden or adapted for the group, but cannot be deleted.
    translation: Selecteer **Verborgen sjablonen weergeven** om verborgen sjablonen te bekijken of terug te zetten. Je kunt standaardsjablonen verbergen of aanpassen voor de groep, maar niet verwijderen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  be3ee2d2721d3e2a:
    english: Changing a template does not alter proposals or polls that have already been started from it.
    translation: Als je een sjabloon wijzigt, veranderen voorstellen en peilingen die er al mee zijn gestart niet.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
