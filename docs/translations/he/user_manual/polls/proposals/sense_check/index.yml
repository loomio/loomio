  5c5bf2d96ddf4ca2:
    english: "# Sense check"
    translation: "# בדיקת כיוון"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4ec1b55b6ebaf563:
    english: Sense check gathers reactions while an idea is still being developed. Its options—**Looks good**, **Could be better**, and **Needs a rethink**—show whether the group is ready to proceed or should revise the idea first.
    translation: בדיקת כיוון אוספת תגובות בזמן שרעיון עדיין מתגבש. האפשרויות — **נראה טוב**, **יכול להיות טוב יותר** ו־**צריך חשיבה מחודשת** — מראות אם הקבוצה מוכנה להתקדם או שכדאי לשנות את הרעיון תחילה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  43573d5547783c67:
    english: This page explains how to run one Sense check. See the [Simple decision process](/en/guides/making_decisions/simple_decision_process), [Consent process](/en/guides/making_decisions/consent_process), or [Consensus process](/en/guides/making_decisions/consensus_process) for examples of using Sense check as one stage of a larger process.
    translation: בעמוד זה מוסבר כיצד לערוך בדיקת כיוון. דוגמאות לשימוש בה כשלב בתהליך רחב יותר מופיעות ב[תהליך החלטה פשוט](/en/guides/making_decisions/simple_decision_process), ב[תהליך הסכמה](/en/guides/making_decisions/consent_process) וב[תהליך קונצנזוס](/en/guides/making_decisions/consensus_process).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5ad4c12fda490468:
    english: "## When to use Sense check"
    translation: "## מתי להשתמש בבדיקת כיוון"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dc841c725ef4e519:
    english: 'Use Sense check to:'
    translation: 'ניתן להשתמש בבדיקת כיוון כדי:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8472db2ec587add8:
    english: |-
      - test an early draft before investing in a detailed proposal;
      - uncover questions and concerns before a formal decision;
      - check whether another round of discussion is needed; or
      - compare support before and after revising an idea.
    translation: |-
      - לבחון טיוטה ראשונית לפני השקעה בהצעה מפורטת;
      - להעלות שאלות וחששות לפני החלטה רשמית;
      - לבדוק אם נדרש סבב דיון נוסף; או
      - להשוות את מידת התמיכה לפני שינוי הרעיון ואחריו.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f411d599f7810e88:
    english: Do not treat **Looks good** as formal approval unless the group has explicitly agreed to do so. Use [Consent](../consent/) or [Consensus](../consensus/) when the response must authorize a decision.
    translation: אין לראות ב־**נראה טוב** אישור רשמי, אלא אם הקבוצה הסכימה לכך במפורש. כשהתגובה צריכה לאשר החלטה, יש להשתמש ב[הסכמה](../consent/) או ב[קונצנזוס](../consensus/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e504f1a6f38ec6ad:
    english: "## Example: check a trial plan"
    translation: "## דוגמה: בדיקת תוכנית לניסוי"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dd13b88fd1a52d50:
    english: Oatmilk Cooperative has drafted a returnable-bottle trial. It runs a Sense check to learn whether the collection schedule, washing checks, and reporting plan are ready for final review.
    translation: קואופרטיב חלב שיבולת השועל הכין טיוטה לניסוי בבקבוקים להחזרה. הקואופרטיב עורך בדיקת כיוון כדי לברר אם לוח הזמנים לאיסוף, בדיקות השטיפה ותוכנית הדיווח מוכנים לבדיקה סופית.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9703f1f9474243af:
    english: "## Set up the proposal"
    translation: "## הגדרת ההצעה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  48d89110b4c23c6f:
    english: State what stage the idea has reached and what will happen with the feedback. Keep the default response meanings or edit them to match the group's language. Set a closing time that leaves enough time to revise the plan.
    translation: יש לציין לאיזה שלב הגיע הרעיון ומה ייעשה עם המשוב. ניתן להשאיר את משמעות התגובות כפי שהיא או לערוך אותה כך שתתאים לשפה של הקבוצה. יש לקבוע מועד סיום שישאיר מספיק זמן לשינוי התוכנית.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## הצבעה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a0f4779c6103c9c:
    english: Participants choose the response that best represents their current view and explain what is ready or what should change. A useful reason gives the proposal author something specific to act on.
    translation: יש לבחור בתגובה שמשקפת בצורה הטובה ביותר את העמדה הנוכחית ולהסביר מה מוכן או מה צריך להשתנות. נימוק מועיל נותן למי שכתב את ההצעה דבר מסוים שאפשר לפעול לפיו.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## קריאת התוצאות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ddcd496a30ab97da:
    english: 'The chart shows the number and proportion of votes for each response. Read the reasons as well as the distribution: one well-founded concern may require attention even when most participants select **Looks good**.'
    translation: 'התרשים מציג את מספר ההצבעות ואת שיעורן לכל תגובה. יש לקרוא את הנימוקים לצד התפלגות ההצבעות: גם חשש מבוסס אחד עשוי לדרוש התייחסות, אפילו אם רוב המשתתפים בחרו ב־**נראה טוב**.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d9ac55d3e75e5484:
    english: Publish an outcome that summarizes the changes the group will make, or records that the idea is ready for the next decision stage.
    translation: יש לפרסם מסקנה שמסכמת את השינויים שהקבוצה תעשה, או מתעדת שהרעיון מוכן לשלב הבא בקבלת ההחלטה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
