    translation: Hallituksen tavallisia tunnisteita ovat esimerkiksi Hallinto, vuosikokous, hallituksen kokous, raportti, talous, lakiasiat, jäsenet, pöytäkirjat, suunnittelu, toimintaperiaatteet, päätökset, säännöt, yleiskokous ja strategia.
