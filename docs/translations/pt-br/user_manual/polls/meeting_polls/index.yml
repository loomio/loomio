  41d1e6a3a6739d95:
    english: People mark each time with the green thumbs-up icon when they are available, the yellow sideways thumb when they can attend if needed, or the red thumbs-down icon when they are unavailable.
    translation: Para cada horário, as pessoas usam o ícone verde de polegar para cima quando estão disponíveis, o ícone amarelo de polegar de lado quando podem participar se necessário ou o ícone vermelho de polegar para baixo quando não estão disponíveis.
    status: machine
