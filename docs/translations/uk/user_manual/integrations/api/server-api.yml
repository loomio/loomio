    translation: "`DELETE /api/b3/users/identity/:identity_type/:uid`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5363d74e43453a93:
    english: "## SSO Profile Sync Settings"
    translation: "## Налаштування синхронізації профілю через SSO"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5d1d8b72689c1c84:
    english: Use these settings when another system manages Loomio profile fields.
    translation: Використовуйте ці налаштування, якщо полями профілю Loomio керує інша система.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  83b6503850a3581c:
    english: "`LOOMIO_DISABLE_EDIT_USER_PROFILE=1` prevents users from editing these fields themselves:"
    translation: "`LOOMIO_DISABLE_EDIT_USER_PROFILE=1` забороняє користувачам самостійно редагувати такі поля:"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b40beb01122e6c22:
    english: |-
      | Field | Notes |
      | --- | --- |
      | `name` | Managed by external sync |
      | `username` | Managed by external sync |
      | `email` | Managed by external sync |
      | `avatar_kind` / `uploaded_avatar` | Managed by external sync |
    translation: |-
      | Поле | Примітки |
      | --- | --- |
      | `name` | Керується зовнішньою синхронізацією |
      | `username` | Керується зовнішньою синхронізацією |
      | `email` | Керується зовнішньою синхронізацією |
      | `avatar_kind` / `uploaded_avatar` | Керується зовнішньою синхронізацією |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d914243a6d80944b:
    english: Users can still edit Loomio-local fields such as `short_bio` and `location`.
    translation: Користувачі й далі можуть редагувати локальні поля Loomio, як-от `short_bio` і `location`.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d2d40191ec060f7e:
    english: "`LOOMIO_SSO_UPDATE_USER_PROFILE_ON_LOGIN=1` updates `name` and `email` from SSO login data. Leave it commented out or unset when an external sync script should be the only source of those updates."
    translation: "`LOOMIO_SSO_UPDATE_USER_PROFILE_ON_LOGIN=1` оновлює `name` і `email` за даними входу через SSO. Якщо ці поля має оновлювати лише зовнішній скрипт синхронізації, залиште цей параметр закоментованим або не задавайте його."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f19f0588ef52b814:
    english: "`LOOMIO_SSO_FORCE_USER_ATTRS` still works for existing installs. It both disables user edits and updates `name` and `email` on SSO login."
    translation: "`LOOMIO_SSO_FORCE_USER_ATTRS` і далі працює в наявних інсталяціях. Він забороняє користувачам редагувати ці поля та оновлює `name` і `email` під час входу через SSO."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
