---
navigation_title: Конфіденційність
blocks:
  946f29d3bdb2e2af:
    english: "# Group privacy"
    translation: "# Конфіденційність групи"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6a2fbb3e7cecad6e:
    english: Privacy controls who can find a group and who can read its content. Open **Edit group settings** from the group page, then select **Privacy**.
    translation: Налаштування конфіденційності визначають, хто може знайти групу й читати її вміст. На сторінці групи відкрийте **Редагувати налаштування групи**, а потім виберіть **Конфіденційність**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bf79bc420fc36377:
    english: "![Group privacy settings](group_privacy_settings.png#width-90)"
    translation: "![Налаштування конфіденційності групи](group_privacy_settings.png#width-90)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4d275c75fe1a2c77:
    english: Changing privacy can expose or hide existing group content, not only content created afterward. Choose the most restrictive setting that still supports the group's purpose.
    translation: Зміна конфіденційності може відкрити або приховати вже наявний вміст групи, а не лише той, що з’явиться згодом. Виберіть найсуворіше налаштування, яке відповідає меті групи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7510b0e8a0fcf7b3:
    english: "## Open"
    translation: "## Відкрита"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f202c6fba754adaa:
    english: Open groups are public spaces. Anyone can find the group and read its discussions, polls, and files. The member list remains visible only to members.
    translation: Відкриті групи є загальнодоступними. Будь-хто може знайти групу й читати її обговорення, опитування та файли. Список учасників бачать лише учасники.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c8d2b41a601ed65e:
    english: Open groups can allow people to join immediately, require approval, or remain invitation only.
    translation: До відкритої групи можна дозволити приєднуватися одразу або після схвалення заявки. Також можна залишити вступ лише за запрошенням.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f07a1c59f30e5fea:
    english: "### Follow an Open group"
    translation: "### Стежити за відкритою групою"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d6f9ee2eb742720e:
    english: People can stay up to date with an Open group without joining. Following adds unread group activity to their catch-up email so they can review it in their own time. Followers do not become members, receive member voting rights, or receive immediate notifications just because they follow the group.
    translation: Люди можуть стежити за подіями у відкритій групі, не приєднуючись до неї. Непрочитані події групи з’являтимуться в листі з підсумком активності, щоб їх можна було переглянути у зручний час. Саме стеження не робить людину учасником групи, не дає їй права голосувати як учаснику й не вмикає негайні сповіщення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  17cb84d9141c9728:
    english: Turn on **Follow updates** on the group page to include its unread discussions, comments, polls, and other thread activity in your catch-up. Turn the setting off to stop including the group.
    translation: Увімкніть **Слідкуйте за оновленнями** на сторінці групи, щоб її непрочитані обговорення, коментарі, опитування та інші події в темах з’являлися у вашому підсумку активності. Вимкніть це налаштування, щоб прибрати групу з підсумку.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b0c06651e8c0df2b:
    english: "![Follow updates on an Open group](group_follow_updates.png)"
    translation: "![Стеження за оновленнями відкритої групи](group_follow_updates.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c5becc4d01b10f3:
    english: "## Closed"
    translation: "## Закрита"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eaf6878c89438b53:
    english: Anyone can find a Closed group and read its name and description. Discussions, polls, files, and the member list are private to members and invited guests.
    translation: Будь-хто може знайти закриту групу й прочитати її назву та опис. Обговорення, опитування, файли й список учасників доступні лише учасникам і запрошеним гостям.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ab7851d3b88d4e27:
    english: Closed groups can let people request membership or remain invitation only. They cannot let people join immediately without approval.
    translation: Закрита група може приймати заявки на вступ або залишатися доступною лише за запрошенням. Приєднатися до неї одразу, без схвалення, не можна.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e2f094fc6e490216:
    english: A Closed subgroup of a parent group can optionally allow members of the parent group to read its discussions without joining the subgroup.
    translation: Закрита підгрупа може дозволити учасникам батьківської групи читати її обговорення без вступу до підгрупи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9c21e144af9492a6:
    english: "## Secret"
    translation: "## Таємна"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6a9871bdd7fde747:
    english: Secret groups and their content are visible only to people who have been invited or added. Membership is invitation only. Secret groups do not appear in the public group directory.
    translation: Таємні групи та їхній вміст бачать лише запрошені або додані люди. Вступити до такої групи можна лише за запрошенням. Таємні групи не з’являються в загальнодоступному каталозі груп.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  405ac2846a65b06c:
    english: "## How people join"
    translation: "## Як люди приєднуються до групи"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c7aebb687bbffbf:
    english: 'Privacy determines which joining options are available:'
    translation: 'Доступні способи вступу залежать від налаштувань конфіденційності:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a6a7608fe4510b67:
    english: |-
      | Group privacy | Available joining options |
      | --- | --- |
      | **Open** | Anyone can join, request approval, or invitation only |
      | **Closed** | Request approval or invitation only |
      | **Secret** | Invitation only |
    translation: |-
      | Конфіденційність групи | Доступні способи вступу |
      | --- | --- |
      | **Відкрита** | Будь-хто може приєднатися, подати заявку на схвалення або вступити лише за запрошенням |
      | **Закрита** | Подати заявку на схвалення або вступити лише за запрошенням |
      | **Таємна** | Лише за запрошенням |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  473a620db15dff75:
    english: When approval is required, people select **Join group**, answer the group's joining prompt, and send a request to join. See [Inviting people](/en/user_manual/groups/inviting_people#request-to-join-group) for instructions on configuring the prompt, reviewing requests, and inviting people directly.
    translation: Якщо вступ потребує схвалення, люди вибирають **Приєднатися до групи**, відповідають на запитання для вступу й надсилають заявку. У розділі [Запрошення людей](/en/user_manual/groups/inviting_people#request-to-join-group) описано, як налаштувати запитання, розглядати заявки та запрошувати людей безпосередньо.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4c02de0d4580f7e6:
    english: "## Group directory"
    translation: "## Каталог груп"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2dc848ec1af0064e:
    english: Open and Closed parent groups can be listed in the public group directory so people can discover them. Directory listing does not change who can read group content or become a member. Subgroups and Secret groups cannot be listed.
    translation: Відкриті й закриті батьківські групи можна додати до загальнодоступного каталогу, щоб люди могли їх знайти. Наявність групи в каталозі не змінює того, хто може читати її вміст або стати учасником. Підгрупи й таємні групи не можна додати до каталогу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
