  c93e5ec8b6f3ceb7:
    english: "### Privacy"
    translation: "### Confidentialité"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  92a47fe13740347a:
    english: The privacy settings for subgroups are similar to the parent group.
    translation: Les paramètres de confidentialité des sous-groupes sont semblables à ceux du groupe parent.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cee5963ea2acac16:
    english: "**Secret** subgroups are not visible to people not invited to the subgroup."
    translation: Les sous-groupes **Secret** ne sont pas visibles par les personnes qui n’y ont pas été invitées.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c8fb4caaa5a2cb9:
    english: "**Closed** subgroups are listed in the Subgroups tab of the parent group and user's sidebar menu. Members of the parent group can request to join the subgroup. Membership is approved by a subgroup admin."
    translation: Les sous-groupes **Fermé** figurent dans l’onglet Sous-groupes du groupe parent et dans le menu latéral des utilisateurs. Les membres du groupe parent peuvent demander à rejoindre le sous-groupe. Un administrateur du sous-groupe approuve leur adhésion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b35b1b3450b2d1e1:
    english: Closed subgroups have an additional setting that allow members of its parent group to see private threads.
    translation: Les sous-groupes fermés disposent d’un paramètre supplémentaire qui permet aux membres du groupe parent de voir les fils de discussion privés.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  933fe2f0cbdec143:
    english: "[Read about group privacy here](/en/user_manual/groups/settings/privacy)."
    translation: "[En savoir plus sur la confidentialité des groupes](/en/user_manual/groups/settings/privacy)."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d16c8b1258b67c9e:
    english: "### Permissions"
    translation: "### Autorisations"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eb5de97caadd5166:
    english: Subgroups operate independently of the main group. For example, if the subgroup privacy setting is set to **Secret**, then only invited members can find this subgroup, see who is in it, and see threads.
    translation: Les sous-groupes fonctionnent indépendamment du groupe principal. Par exemple, si la confidentialité d’un sous-groupe est réglée sur **Secret**, seuls les membres invités peuvent le trouver, voir qui en fait partie et consulter ses fils de discussion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e7897aa59ffe96a1:
    english: "**Closed** subgroups have an additional setting that allow members of its parent group to see private threads, enabling the subgroup to be transparent to members of the parent group."
    translation: Les sous-groupes **Fermé** disposent d’un paramètre supplémentaire qui permet aux membres du groupe parent de voir les fils de discussion privés du sous-groupe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8dd3770fefa7d7e6:
    english: "![Setting that lets parent group members see private subgroup threads](subgroups_private_threads_settings.png)"
    translation: "![Paramètre permettant aux membres du groupe parent de voir les fils de discussion privés du sous-groupe](subgroups_private_threads_settings.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
