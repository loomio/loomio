    translation: "![Opción Eliminar grupo en el menú de Oatmilk Cooperative](group_delete_group.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cb0d8b2f2c8b9630:
    english: You will be invited to type the name of your group (*case sensitive*) to confirm you wish to delete your group.
    translation: Para confirmar que quieres eliminar el grupo, tendrás que escribir su nombre (*respetando las mayúsculas y minúsculas*).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5430eb3885d98872:
