  e19d687b56819302:
    english: Hi! I'm Alanna.
    translation: Вітаю, я Аланна.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  10352ad196487ff3:
    english: I'm one of the founders of Loomio, and I've been thinking deeply about how it works from a facilitation perspective since the beginning. I am not a seminal facilitation expert; I consider myself only a beginner in this craft that one could spend a lifetime honing.
    translation: Я одна із засновниць Loomio. Від самого початку я багато розмірковувала про те, як він працює з погляду фасилітації. Я не вважаю себе провідною фахівчинею в цій галузі. Я лише починаю опановувати майстерність, яку можна вдосконалювати все життя.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c637c96f9723f02d:
    english: What I can offer is help translating between the offline and online spaces, as a practitioner in both. I've facilitated a lot of groups who use Loomio, and learned from their experiences.
    translation: Я можу допомогти перенести досвід фасилітації особистих зустрічей в онлайн-простір, адже працюю в обох форматах. Я допомагала багатьом групам, які використовують Loomio, і вчилася на їхньому досвіді.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c376e38821fb6c2f:
    english: You can find out [more about me on my website](http://alanna.space).
    translation: Ви можете [дізнатися більше про мене на моєму сайті](http://alanna.space).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b893957534fa37e2:
    english: I'm only one person, with one perspective and approach to facilitation, when there are myriad approaches. I've tried to bring in a couple other facilitator's voices here, including [Rich](http://richdecibels.com/) from Loomio and Silvia from [EXP](http://exp.agency).
    translation: Я лише одна людина зі своїм поглядом на фасилітацію, а підходів до неї безліч. Тому я також включила до посібника думки інших фасилітаторів, зокрема [Річа](http://richdecibels.com/) із Loomio та Сільвії з [EXP](http://exp.agency).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
