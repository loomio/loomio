  db5578da00c8e245:
    english: List the memberships visible to the API-key user. Group members can read member names, IDs, titles, and roles. Email addresses are included only for the API-key user's own account or when the API-key user is a group administrator.
    translation: Атрымайце спіс удзельнікаў груп, бачных карыстальніку, якому належыць ключ API. Удзельнікі групы могуць бачыць імёны, ідэнтыфікатары, пасады і ролі іншых удзельнікаў. Адрасы электроннай пошты даступныя толькі для ўласнага ўліковага запісу карыстальніка, якому належыць ключ API, або калі гэты карыстальнік мае правы адміністратара групы.
