  46dd27ee2e2fb992:
    english: Allocate, sometimes known as a dot vote, reveals priorities when there are trade-offs. Each participant receives a fixed budget of points and distributes it across the options. Giving more to one option leaves fewer points for the others.
    translation: A votação Alocar, também conhecida como votação por pontos, ajuda a identificar prioridades quando é preciso fazer escolhas. Cada participante recebe um número fixo de pontos e os distribui entre as opções. Dar mais pontos a uma opção deixa menos pontos para as outras.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c6d05c5ec2a695d2:
    english: "## When to use Allocate"
    translation: "## Quando usar Alocar"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f5b2c4377aea5079:
    english: 'Use Allocate when time, money, attention, or another resource is limited. It works well for:'
    translation: 'Use Alocar quando houver limites de tempo, dinheiro, atenção ou outro recurso. Ela funciona bem para:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8e6525da99616946:
    english: |-
      - prioritizing work for the next planning period;
      - dividing a participatory budget between projects;
      - choosing how much agenda time to give several topics;
      - distributing a fixed number of volunteer hours; or
      - identifying which improvements matter most to members.
    translation: |-
      - priorizar o trabalho para o próximo período de planejamento;
      - dividir um orçamento participativo entre projetos;
      - decidir quanto tempo da pauta dedicar a vários assuntos;
      - distribuir um número fixo de horas de trabalho voluntário; ou
      - identificar quais melhorias são mais importantes para os membros.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  66b0f13c4811ef63:
    english: The points express relative priority, not an amount that Loomio will automatically assign. Use [Score](/en/user_manual/polls/score/) when every option can receive a high rating without reducing support for another.
    translation: Os pontos indicam prioridades relativas, não uma quantidade que o Loomio atribuirá automaticamente. Use [Pontuação](/en/user_manual/polls/score/) quando todas as opções puderem receber uma nota alta sem reduzir o apoio às demais.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '0409e08bd5e80f61':
    english: "## Example: set priorities for an annual strategy review"
    translation: "## Exemplo: definir prioridades para uma revisão anual da estratégia"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e274f6e40509e611:
    english: Oatmilk Cooperative is planning its annual strategy review. It asks members which areas should receive the most time and attention during the review. Each member receives ten points to allocate across five areas. This shows the group's relative priorities while requiring participants to make trade-offs.
    translation: A Cooperativa Oatmilk está planejando sua revisão anual da estratégia. Ela pergunta aos membros quais áreas devem receber mais tempo e atenção durante a revisão. Cada membro recebe dez pontos para distribuir entre cinco áreas. Isso mostra as prioridades relativas do grupo e exige que os participantes façam escolhas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c74ebb16f872b3c6:
    english: "## Set up the poll"
    translation: "## Configurar a enquete"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  906790609aa7eb30:
    english: Describe the decision and what the points represent. Add options at a similar level of scope, then set **Points per person**. In this example, each voter receives ten points to indicate how much review time each strategic area should receive.
    translation: Descreva a decisão e o que os pontos representam. Adicione opções de abrangência semelhante e defina **Pontos por pessoa**. Neste exemplo, cada eleitor recebe dez pontos para indicar quanto tempo da revisão deve ser dedicado a cada área estratégica.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  67ae025b83fb4781:
    english: A very large budget can create false precision. A useful budget is usually large enough to show differences but small enough to require choices. Make clear whether concentrating all points on one option is acceptable.
    translation: Um número muito grande de pontos pode criar uma falsa impressão de precisão. Em geral, convém oferecer pontos suficientes para mostrar diferenças, mas poucos o bastante para exigir escolhas. Deixe claro se é aceitável concentrar todos os pontos em uma única opção.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Votar"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d9a73b9d4e2f8927:
    english: Participants move the sliders to distribute their budget. Loomio shows how many points remain and prevents submission until the allocation is valid.
    translation: Os participantes movem os controles deslizantes para distribuir seus pontos. O Loomio mostra quantos pontos restam e impede o envio até que a distribuição seja válida.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7b3d616673a01fbb:
    english: In this example, the voter assigns three points each to **Member participation** and **Financial sustainability**, two each to **Environmental impact** and **Staff development**, and none to **Products and services**. A zero does not necessarily mean an area has no value; it means the voter used their limited points elsewhere.
    translation: Neste exemplo, o eleitor atribui três pontos a **Participação dos membros** e três a **Sustentabilidade financeira**, dois a **Impacto ambiental** e dois a **Desenvolvimento da equipe**, e nenhum a **Produtos e serviços**. Zero não significa necessariamente que uma área não tenha valor; significa que o eleitor usou seus pontos limitados em outras áreas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Ler os resultados"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  97147f83eaf22313:
    english: 'The results order options by the total points received. They also show:'
    translation: 'Os resultados apresentam as opções em ordem decrescente do total de pontos recebidos. Eles também mostram:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1d224c0c34145a7f:
    english: |-
      - **% of points**: the option's share of all allocated points;
      - **Points**: the total points allocated;
      - **Mean**: the average among voters who gave the option points; and
      - **Voters**: how many people gave the option at least one point.
    translation: |-
      - **% de pontos**: a parcela de todos os pontos distribuídos que a opção recebeu;
      - **Pontos**: o total de pontos atribuídos;
      - **Significar**: a média entre os eleitores que deram pontos à opção; e
      - **Eleitores**: quantas pessoas deram pelo menos um ponto à opção.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2901008fa326e4f5:
    english: In this example, **Financial sustainability** receives the most points, followed by **Staff development**. Financial sustainability receives points from every voter, suggesting broad agreement that it needs substantial review time. Read the totals alongside the number of voters to distinguish broad priorities from areas strongly supported by fewer people.
    translation: Neste exemplo, **Sustentabilidade financeira** recebe mais pontos, seguida por **Desenvolvimento da equipe**. Todos os eleitores dão pontos a Sustentabilidade financeira, o que sugere amplo acordo de que ela precisa de bastante tempo na revisão. Compare os totais com o número de eleitores para distinguir prioridades amplamente compartilhadas de áreas que receberam forte apoio de menos pessoas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f2c04fbdc54d23e8:
    english: Read the totals together with the number of voters and their reasons. Publish an outcome explaining how the strategy review will be structured; the poll does not assign time automatically.
    translation: Analise os totais junto com o número de eleitores e suas justificativas. Publique uma conclusão explicando como a revisão da estratégia será organizada; a enquete não atribui tempo automaticamente.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
