  aadbf3844be4a95f:
    english: An Advice proposal gathers input for a decision that a person or team is responsible for making. Participants can offer advice or indicate that they have no advice to add.
    translation: Neuvoja-ehdotuksella kerätään näkemyksiä päätökseen, jonka tekemisestä vastaa henkilö tai tiimi. Osallistujat voivat antaa neuvoja tai ilmoittaa, ettei heillä ole neuvoja lisättäväksi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  769a2446fc3ec4a9:
    english: This page explains the Advice proposal form, voting, and results. See the [Advice process](/en/guides/making_decisions/advice_process) for the complete workflow from framing the decision to publishing an outcome.
    translation: Tällä sivulla kerrotaan Neuvoja-ehdotuksen lomakkeesta, äänestämisestä ja tuloksista. [Neuvontaprosessi](/en/guides/making_decisions/advice_process) kuvaa koko työnkulun päätöksen määrittelystä johtopäätöksen julkaisemiseen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f19e32088d70eec4:
    english: "## When to use Advice"
    translation: "## Milloin Neuvoja-ehdotusta kannattaa käyttää"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d4c7e7da6f2d5860:
    english: Use Advice when the decision maker wants input from people with relevant expertise or people affected by the decision. It works well for supplier choices, operational decisions, policy drafts, and decisions within a delegated role.
    translation: Käytä Neuvoja-ehdotusta, kun päätöksentekijä haluaa kuulla asiasta tietäviä tai päätöksen vaikutuspiirissä olevia ihmisiä. Se sopii esimerkiksi toimittajan valintaan, käytännön toimintaan liittyviin päätöksiin, toimintaperiaatteiden luonnoksiin ja päätöksiin, jotka kuuluvat henkilölle annettuun tehtävään.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a81e33e00080fbe4:
    english: Advice is not an approval vote. Say who will make the decision, what constraints apply, and how they will consider the responses.
    translation: Neuvoja-ehdotus ei ole hyväksymisäänestys. Kerro, kuka tekee päätöksen, mitä reunaehtoja siihen liittyy ja miten vastaukset otetaan huomioon.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4be7ef0783f6e444:
    english: "## Example: choose a washing supplier"
    translation: "## Esimerkki: pesupalvelun toimittajan valinta"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d8157e98107798c6:
    english: Oatmilk Cooperative's operations coordinator must select a washing supplier. They invite advice about capacity, food-safety records, water use, service response times, and support.
    translation: Oatmilk-osuuskunnan toiminnan koordinaattorin on valittava pesupalvelun toimittaja. Hän pyytää neuvoja kapasiteetista, elintarviketurvallisuustiedoista, vedenkulutuksesta, palvelun vasteajoista ja tuesta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9703f1f9474243af:
    english: "## Set up the proposal"
    translation: "## Määritä ehdotus"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6b9c305f0f4000d9:
    english: Describe the decision, name the decision maker, and include the information participants need. Invite people who are affected or have relevant knowledge. The default options let someone offer advice or abstain.
    translation: Kuvaa päätös, nimeä päätöksentekijä ja lisää osallistujien tarvitsemat tiedot. Kutsu mukaan ihmisiä, joihin päätös vaikuttaa tai joilla on aiheesta olennaista tietoa. Oletusvaihtoehdot antavat osallistujan joko tarjota neuvoja tai pidättäytyä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Äänestä"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0a259af7a59899b7:
    english: Participants select **Advice** and give a concrete recommendation, risk, question, or relevant experience. They can abstain when they have no useful input.
    translation: Osallistujat valitsevat **Neuvoja** ja kertovat konkreettisen suosituksen, riskin, kysymyksen tai aiheeseen liittyvän kokemuksen. He voivat pidättäytyä, jos heillä ei ole hyödyllistä lisättävää.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Lue tulokset"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1d4bf7b5d0079f87:
    english: The chart confirms who has responded, but the reasons contain the substance of an Advice proposal. Look for constraints, agreements, and conflicting recommendations rather than treating the most common response as the decision.
    translation: Kaaviosta näet, ketkä ovat vastanneet, mutta vastausten perustelut ovat Neuvoja-ehdotuksen tärkein sisältö. Etsi niistä reunaehtoja, yhteisymmärrystä ja ristiriitaisia suosituksia. Älä pidä yleisintä vastausta päätöksenä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e9fc01ce6c059f29:
    english: The decision maker publishes an outcome explaining what they decided and how the advice informed it.
    translation: Päätöksentekijä julkaisee johtopäätöksen, jossa hän kertoo, mitä päätti ja miten neuvot vaikuttivat päätökseen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
