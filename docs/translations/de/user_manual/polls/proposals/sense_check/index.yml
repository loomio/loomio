navigation_title: Stimmungsbild
blocks:
  5c5bf2d96ddf4ca2:
    english: "# Sense check"
    translation: "# Stimmungsbild"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4ec1b55b6ebaf563:
    english: Sense check gathers reactions while an idea is still being developed. Its options—**Looks good**, **Could be better**, and **Needs a rethink**—show whether the group is ready to proceed or should revise the idea first.
    translation: Mit einem Stimmungsbild holst du Rückmeldungen zu einer Idee ein, die noch entwickelt wird. Die Antworten **Sieht gut aus**, **Könnte besser sein** und **Ein Umdenken ist erforderlich** zeigen, ob die Gruppe weitermachen kann oder die Idee zuerst überarbeiten sollte.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  43573d5547783c67:
    english: This page explains how to run one Sense check. See the [Simple decision process](/en/guides/making_decisions/simple_decision_process), [Consent process](/en/guides/making_decisions/consent_process), or [Consensus process](/en/guides/making_decisions/consensus_process) for examples of using Sense check as one stage of a larger process.
    translation: Diese Seite erklärt, wie du ein Stimmungsbild durchführst. Beispiele dafür, wie du es in einen größeren Ablauf einbindest, findest du unter [Einfacher Entscheidungsprozess](/en/guides/making_decisions/simple_decision_process), [Konsentverfahren](/en/guides/making_decisions/consent_process) und [Konsensverfahren](/en/guides/making_decisions/consensus_process).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5ad4c12fda490468:
    english: "## When to use Sense check"
    translation: "## Wann du ein Stimmungsbild verwenden kannst"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dc841c725ef4e519:
    english: 'Use Sense check to:'
    translation: 'Mit einem Stimmungsbild kannst du:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8472db2ec587add8:
    english: |-
      - test an early draft before investing in a detailed proposal;
      - uncover questions and concerns before a formal decision;
      - check whether another round of discussion is needed; or
      - compare support before and after revising an idea.
    translation: |-
      - einen frühen Entwurf prüfen, bevor du einen detaillierten Vorschlag ausarbeitest;
      - vor einer formellen Entscheidung Fragen und Bedenken erkennen;
      - prüfen, ob eine weitere Diskussionsrunde nötig ist; oder
      - die Unterstützung vor und nach der Überarbeitung einer Idee vergleichen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f411d599f7810e88:
    english: Do not treat **Looks good** as formal approval unless the group has explicitly agreed to do so. Use [Consent](../consent/) or [Consensus](../consensus/) when the response must authorize a decision.
    translation: Betrachte **Sieht gut aus** nur dann als formelle Zustimmung, wenn die Gruppe das ausdrücklich vereinbart hat. Verwende [Konsent](../consent/) oder [Konsens](../consensus/), wenn die Antworten eine Entscheidung bestätigen sollen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e504f1a6f38ec6ad:
    english: "## Example: check a trial plan"
    translation: "## Beispiel: Einen Testlauf prüfen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dd13b88fd1a52d50:
    english: Oatmilk Cooperative has drafted a returnable-bottle trial. It runs a Sense check to learn whether the collection schedule, washing checks, and reporting plan are ready for final review.
    translation: Die Oatmilk Cooperative hat einen Testlauf mit Mehrwegflaschen geplant. Mit einem Stimmungsbild prüft sie, ob der Abholplan, die Kontrollen der Flaschenreinigung und der Plan für die Berichterstattung bereit für die abschließende Prüfung sind.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9703f1f9474243af:
    english: "## Set up the proposal"
    translation: "## Vorschlag einrichten"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  48d89110b4c23c6f:
    english: State what stage the idea has reached and what will happen with the feedback. Keep the default response meanings or edit them to match the group's language. Set a closing time that leaves enough time to revise the plan.
    translation: Beschreibe, wie weit die Idee entwickelt ist und was mit den Rückmeldungen geschieht. Behalte die vorgegebenen Bedeutungen der Antworten bei oder passe sie an die Sprache der Gruppe an. Lege einen Endzeitpunkt fest, der genug Zeit lässt, den Plan zu überarbeiten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Abstimmen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a0f4779c6103c9c:
    english: Participants choose the response that best represents their current view and explain what is ready or what should change. A useful reason gives the proposal author something specific to act on.
    translation: Die Teilnehmenden wählen die Antwort, die ihre aktuelle Sicht am besten wiedergibt. Sie erklären, was bereits passt oder was sich ändern sollte. Eine konkrete Begründung hilft der Person, die den Vorschlag erstellt hat, bei der Überarbeitung.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Ergebnisse lesen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ddcd496a30ab97da:
    english: 'The chart shows the number and proportion of votes for each response. Read the reasons as well as the distribution: one well-founded concern may require attention even when most participants select **Looks good**.'
    translation: 'Das Diagramm zeigt die Anzahl und den Anteil der Stimmen für jede Antwort. Lies auch die Begründungen: Ein gut begründetes Bedenken kann Aufmerksamkeit erfordern, selbst wenn die meisten Teilnehmenden **Sieht gut aus** wählen.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d9ac55d3e75e5484:
    english: Publish an outcome that summarizes the changes the group will make, or records that the idea is ready for the next decision stage.
    translation: Veröffentliche ein Fazit, das die geplanten Änderungen der Gruppe zusammenfasst oder festhält, dass die Idee für die nächste Entscheidungsphase bereit ist.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
