---
navigation_title: Закладки
blocks:
  4f81ad2ed2c971a4:
    english: "# Bookmarks"
    translation: "# Закладки"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5d590d1d8ab9b956:
    english: |-
      Bookmarks are a personal list of Loomio items you want to return to. Your
      bookmarks are visible only to you and saving an item does not notify anyone
      else.
    translation: |-
      Закладки — це ваш особистий список матеріалів Loomio, до яких ви хочете повернутися. Ваші
      закладки бачите лише ви. Коли ви зберігаєте закладку, інші не отримують
      сповіщень.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aac40737df991d52:
    english: 'You can bookmark:'
    translation: 'Ви можете зберігати закладки для:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0f6c7e4161c72c18:
    english: |-
      - discussions
      - comments
      - proposals and polls
      - votes
      - outcomes
    translation: |-
      - обговорень
      - коментарів
      - пропозицій та опитувань
      - голосів
      - висновків
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fc91d7d6d32e590b:
    english: "## Save a bookmark"
    translation: "## Збереження закладки"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  daec09886eecd058:
    english: |-
      Open the action menu for the item and select **Save bookmark**. The action menu
      is usually shown as three dots. For a discussion, use the action menu near the
      discussion title; for a comment, vote, proposal, poll, or outcome, use the menu
      on that item.
    translation: |-
      Відкрийте меню дій для потрібного матеріалу та виберіть **Зберегти закладку**. Меню дій
      зазвичай позначено трьома крапками. Для обговорення відкрийте меню біля його
      назви. Для коментаря, голосу, пропозиції, опитування або висновку відкрийте меню
      відповідного матеріалу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  395a4c119e77f34b:
    english: "## View your bookmarks"
    translation: "## Перегляд закладок"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a5e09c422c753df7:
    english: |-
      Open the sidebar and select **Bookmarks**. The number beside the link shows how
      many bookmarks you have saved.
    translation: |-
      Відкрийте бічну панель і виберіть **Закладки**. Число поруч із посиланням показує,
      скільки закладок ви зберегли.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7c21b03875c08b8e:
    english: |-
      The Bookmarks page lists your most recently saved items first. Each row shows
      the kind of item and its author. Select a row to return to the bookmarked item.
    translation: |-
      На сторінці закладок спочатку показано матеріали, які ви зберегли останніми. У кожному рядку зазначено
      тип матеріалу та його автора. Виберіть рядок, щоб перейти до збереженого матеріалу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  644d774a0d045214:
    english: "## Remove a bookmark"
    translation: "## Видалення закладки"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c2480aa6235675ba:
    english: |-
      On the Bookmarks page, select the remove-bookmark button at the end of a row.
      You can also open the bookmarked item's action menu and select **Remove
      bookmark**.
    translation: |-
      На сторінці закладок натисніть кнопку видалення закладки в кінці рядка.
      Також можна відкрити меню дій збереженого матеріалу та вибрати **Видалити
      закладку**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6c20d47950313409:
    english: |-
      Removing a bookmark affects only your personal list. You can save the item
      again later.
    translation: |-
      Видалення закладки впливає лише на ваш особистий список. Ви можете зберегти цей матеріал
      знову пізніше.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
