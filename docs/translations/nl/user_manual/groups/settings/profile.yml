  0b903e1c3c7e1862:
    english: The profile tab controls how your group is identified and introduced. Open **Edit group settings** from the group page, then select **Profile**.
    translation: Op het tabblad Profiel bepaal je hoe je groep wordt weergegeven en voorgesteld. Open **Bewerk groepsinstellingen** op de groepspagina en selecteer **Profiel**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
