  5f0a46926a0f7350:
    english: "### Groups"
    translation: "### Csoportok"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2060a64d0fabc6d7:
    english: A group is a place for an organization, team, or community to work together. Its home page explains the group's purpose and provides access to its discussions, polls, members, and files.
    translation: A csoportban egy szervezet, csapat vagy közösség együtt dolgozhat. A csoport kezdőlapja bemutatja a célját, és hozzáférést ad a beszélgetésekhez, szavazásokhoz, tagokhoz és fájlokhoz.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  311793a17709182c:
    english: "### Discussions"
    translation: "### Beszélgetések"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  05ecdffe6c18a1df:
    english: Discussions keep the information and conversation about a topic together. People can share context, comment, reply, react, and use polls to move the discussion towards an outcome.
    translation: A beszélgetések egy helyen tartják az adott témához tartozó információkat és hozzászólásokat. A résztvevők megoszthatnak háttérinformációkat, hozzászólhatnak, válaszolhatnak, reagálhatnak, és szavazásokkal segíthetik a következtetés kialakítását.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dc9a50d7f1f20c80:
    english: Over time, discussions create a searchable record of the information considered and the decisions made by your group.
    translation: Idővel a beszélgetések kereshető nyilvántartást alkotnak a mérlegelt információkról és a csoportod döntéseiről.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3448194e8a2ce09d:
    english: "### Polls and proposals"
    translation: "### Szavazások és javaslatok"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4ef7092f5f56e773:
    english: Polls help a group understand preferences, gather advice, and make decisions. Different poll templates support different processes. A proposal asks people to respond to a suggested course of action and explain the reason for their response.
    translation: A szavazások segítenek a csoportnak megismerni a tagok álláspontját, tanácsot gyűjteni és döntéseket hozni. A különböző szavazási sablonok különböző döntési folyamatokat támogatnak. A javaslat arra kéri a résztvevőket, hogy reagáljanak egy javasolt cselekvésre, és indokolják meg a válaszukat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  51ab039bc7c374bd:
    english: Polls can be part of a discussion or run independently from the **Polls** tab on a group page.
    translation: A szavazások kapcsolódhatnak egy beszélgetéshez, vagy önállóan is elindíthatók a csoport oldalán található **Szavazások** fülről.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  47500e7125fdedbc:
    english: To learn where these parts appear in the interface, see the [Quick tour](/en/user_manual/overview/orientation). To start contributing, see [How to participate](/en/user_manual/overview/how-to-participate).
    translation: Ha szeretnéd látni, hol találod ezeket a felületen, olvasd el a [Gyors áttekintést](/en/user_manual/overview/orientation). A részvételhez olvasd el a [Hogyan vehetsz részt](/en/user_manual/overview/how-to-participate) című útmutatót.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  57ed823687deabb5:
    english: "## Try it out"
