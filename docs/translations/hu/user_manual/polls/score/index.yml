    translated_on: '2026-09-29'
  517adc384b38d256:
    english: Score measures how participants evaluate each option on a shared numeric scale. Unlike Choose, it asks people to respond to every option, so the results show both what people prefer and how strongly they prefer it.
    translation: A pontszám felmérésben a résztvevők közös számskálán értékelnek minden lehetőséget. A kiválasztásos szavazással ellentétben minden lehetőségre választ adnak, így az eredményekből az is látszik, melyiket részesítik előnyben, és mennyire.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a678333f6d814e87:
    english: "## When to use Score"
    translation: "## Mikor használj pontszám felmérést"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c4ca19abb53e3ddc:
    english: 'Use Score when every option can be evaluated independently against the same question. It works well for:'
    translation: 'Akkor használj pontszám felmérést, ha minden lehetőséget külön is értékelni lehet ugyanazon kérdés alapján. Például:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c77c1ad6b2a9d697:
    english: |-
      - assessing how ready each part of a project is;
      - rating the importance of several principles;
      - measuring interest in possible meeting topics;
      - evaluating grant applications against a common criterion; or
      - comparing the suitability of several proposals.
    translation: |-
      - felmérheted, mennyire állnak készen egy projekt egyes részei;
      - értékelheted több alapelv fontosságát;
      - felmérheted az érdeklődést a lehetséges találkozótémák iránt;
      - közös szempont alapján értékelheted a támogatási kérelmeket; vagy
      - összehasonlíthatod több javaslat alkalmasságát.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d91459d96a31a671:
    english: Define what the bottom and top of the scale mean. A number without a shared definition can mean different things to different voters. Use [Choose](/en/user_manual/polls/choose/) when you only need selections, or [Allocate](/en/user_manual/polls/allocate/) when participants must make trade-offs within a limited budget.
    translation: Határozd meg, mit jelent a skála legalacsonyabb és legmagasabb értéke. Közös meghatározás nélkül ugyanaz a szám mást jelenthet a különböző szavazóknak. Ha csak azt kell megjelölni, mely lehetőségeket választják a résztvevők, használd a [Kiválasztás](/en/user_manual/polls/choose/) szavazást. Ha korlátozott kereten belül kell mérlegelniük a lehetőségeket, használd a [Kiosztás](/en/user_manual/polls/allocate/) szavazást.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6160518dc06b70a7:
    english: "## Example: score possible trial locations"
    translation: "## Példa: lehetséges próbahelyszínek pontozása"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a75c387743cad529:
    english: Oatmilk Cooperative is choosing locations for a returnable-bottle trial. It asks members to score four locations from 0 (**unsuitable**) to 10 (**ideal**), considering customer access, staff capacity, storage, and collection transport.
    translation: A Zabtej Szövetkezet helyszínt választ egy visszaváltható palackokkal végzett próbához. Arra kéri a tagokat, hogy négy helyszínt pontozzanak 0 (**alkalmatlan**) és 10 (**ideális**) között. Az értékelésnél vegyék figyelembe, mennyire könnyen jutnak el oda a vásárlók, mekkora a személyzet kapacitása, van-e elég tárolóhely, és hogyan oldható meg az üres palackok elszállítása.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c74ebb16f872b3c6:
    english: "## Set up the poll"
    translation: "## A szavazás beállítása"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b03122ee279f9c91:
    english: State one question that applies equally to every option. Add the items to be assessed, set the **Minimum score** and **Maximum score**, and explain the endpoints in the details. Option meanings can clarify the scope of each item.
    translation: Fogalmazz meg egy kérdést, amely minden lehetőségre egyformán vonatkozik. Add hozzá az értékelendő helyszíneket, állítsd be a **Minimális pontszám** és a **Maximális pontszám** értékét, és a részleteknél magyarázd el, mit jelentenek a skála végpontjai. A lehetőségek leírásában pontosíthatod, mire terjed ki az egyes helyszínek értékelése.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  85e66520acf78264:
    english: Choose a scale participants can apply consistently. A 0–5 scale is quick to use; a 0–10 scale allows finer distinctions. More precision does not necessarily produce better information, so use the shortest scale that fits the question.
    translation: Válassz olyan skálát, amelyet a résztvevők következetesen tudnak használni. A 0–5 skála gyorsan kitölthető; a 0–10 skála finomabb különbségeket is megmutat. A nagyobb pontosság nem feltétlenül ad jobb információt, ezért a kérdéshez illő legrövidebb skálát használd.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bb3998655598796f:
    english: Anonymous voting and showing options in random order can be useful when you want to reduce social or ordering effects.
    translation: A névtelen szavazás és a lehetőségek véletlenszerű sorrendje segíthet csökkenteni a társas hatásokat és a sorrend befolyását.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Szavazás"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  33199814c9ad8a64:
    english: Participants move a slider to score every option. In this example, the voter scores Central Station cafe at 8, Riverside market at 6, the University food court at 7, and Harbour offices at 5.
    translation: A résztvevők egy csúszkával pontoznak minden lehetőséget. Ebben a példában a szavazó a Főpályaudvar kávézójának 8, a Folyóparti piacnak 6, az Egyetemi ételudvarnak 7, a Kikötői irodáknak pedig 5 pontot ad.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fba3d21a09846414:
    english: The reason explains how the voter applied the scale. This helps the group distinguish a low score caused by missing information from one caused by substantive concern.
    translation: Az indoklásból kiderül, hogyan alkalmazta a szavazó a skálát. Ez segít a csoportnak megkülönböztetni, hogy egy alacsony pontszámot az információhiány vagy egy érdemi aggály okozott.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Az eredmények értelmezése"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  846b7759f9d54232:
    english: 'For each option, the results show:'
    translation: 'Az eredmények minden lehetőségnél megmutatják:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cac30fa54f0aeaf7:
    english: |-
      - **Points**: the sum of all scores;
      - **Mean**: the average score; and
      - **Voters**: how many people scored the option.
    translation: |-
      - **Pont**: az összes pontszám összege;
      - **Átlagos**: az átlagos pontszám; és
      - **Szavazók**: hányan pontozták a lehetőséget.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7e063d4b1babcb9e:
    english: In this example, **Central Station cafe** has the highest mean at 7.5. **Harbour offices** has the lowest mean at 5.25, while Riverside market and the University food court are tied at 7. Four of five invited people have voted, so the group can also see that one response is outstanding.
    translation: Ebben a példában a **Főpályaudvar kávézója** kapta a legmagasabb, 7,5-ös átlagot. A **Kikötői irodák** átlaga a legalacsonyabb, 5,25. A Folyóparti piac és az Egyetemi ételudvar átlaga egyaránt 7. Az öt meghívottból négyen szavaztak, így a csoport azt is látja, hogy egy válasz még hiányzik.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  147800d3643d9942:
    english: Compare means only when the options have a similar number of voters. Read the vote reasons before treating a small difference as meaningful, and publish an outcome explaining what action follows from the scores.
    translation: Csak akkor hasonlítsd össze az átlagokat, ha a lehetőségeket közel azonos számú szavazó pontozta. Olvasd el a szavazatok indoklását, mielőtt jelentőséget tulajdonítasz egy kis különbségnek. Ezután tegyél közzé egy következtetést arról, milyen lépés következik a pontszámokból.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
