        title: 제안 시작
        helptext: |
          <p>제안으로 실행할 일을 설명하고 투표로 의견을 받아 보세요.</p>
          <p>표가 모이면 지지와 우려를 확인하고 제안을 다듬을 수 있습니다.</p>
          <p>연습용 제안 템플릿으로 지금 제안을 만들어 보세요.</p>
        submit: 제안 템플릿 보기
      share_an_outcome:
        title: 제안 결론 공유
        helptext: |
          <p>제안의 마감 시간이 되면 투표가 마감되고 결론을 공유하라는 안내가 표시됩니다.</p>
          <p>결론에는 표와 댓글을 검토한 뒤 결정한 내용이나 다음에 할 일을 설명합니다.</p>
