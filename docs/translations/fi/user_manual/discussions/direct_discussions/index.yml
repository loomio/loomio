  5a0b9426a2d88e62:
    english: |-
      ## Contacting someone via a direct discussion
      A direct discussion can be used to contact one or more people privately without creating a subgroup.
    translation: |-
      ## Yhteyden ottaminen suoralla keskustelulla
      Voit ottaa yhteyttä yhteen tai useampaan ihmiseen yksityisesti suoran keskustelun kautta ilman alaryhmän luomista.
