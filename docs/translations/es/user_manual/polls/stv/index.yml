  cc37217cd681fabe:
    english: The green highlight shows when a candidate was elected, red shows when they were eliminated, and orange shows when they tied.
    translation: El color verde indica cuándo se eligió a un candidato; el rojo, cuándo se eliminó; y el naranja, cuándo hubo un empate.
    status: machine
