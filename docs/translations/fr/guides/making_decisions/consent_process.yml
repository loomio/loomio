  55ccc01c9b274a87:
    english: |-
      ## Key points
      - Aim for a ‘good enough’ decision.
      - Involve many voices to develop a workable proposal.
      - Ask if anyone has a valid objection.
      - Amend the proposal to resolve objections.
    translation: |-
      ## Points clés
      - Visez une décision « suffisamment bonne ».
      - Faites participer plusieurs personnes pour élaborer une proposition réalisable.
      - Demandez si quelqu’un a une objection valable.
      - Modifiez la proposition pour résoudre les objections.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7c2ef9fc3419f4b7:
    english: |-
      **Typical roles:**
      - Proposer: The person who raises a topic that requires a decision.
      - Facilitator: Someone who can help the proposer do their job efficiently.
    translation: |-
      **Rôles habituels :**
      - Personne à l’origine de la proposition : elle soulève un sujet qui nécessite une décision.
      - Personne chargée de la facilitation : elle aide la personne à l’origine de la proposition à mener son travail efficacement.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c56d1ea7a5582723:
    english: |-
      ## Consent process steps
      You notice a problem or opportunity and take the initiative.
      1. Present a proposal - start a Loomio **discussion**.
      2. Facilitate a round of questions, reactions and any comments to improve the proposal - run a **Sense check proposal**.
      3. Amend the proposal with suggestions and comments.
      4. Ask if anyone has a meaningful objection to the amended proposal - run a **Consent proposal**.
      5. Integrate valid objections to create an amended version of the proposal that everyone consents is ‘safe to try’ - state the decision **outcome**.
    translation: |-
      ## Étapes du processus de consentement
      Vous constatez un problème ou une occasion à saisir et prenez l’initiative.
      1. Présentez une proposition : lancez une **discussion** sur Loomio.
      2. Animez un tour de questions et de réactions, et recueillez les commentaires pour améliorer la proposition : lancez une **proposition de vérification du ressenti**.
      3. Modifiez la proposition en tenant compte des suggestions et des commentaires.
      4. Demandez si quelqu’un a une objection importante à la proposition modifiée : lancez une **proposition de consentement**.
      5. Intégrez les objections valables dans une nouvelle version de la proposition que tout le monde accepte d’essayer : annoncez la **conclusion** de la décision.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  735e10dde58793f0:
    english: |-
      >[!Tip]
      >In more complex decisions you may also include a clarifying **Questions round** at step 2, to help people understand the proposal before inviting them to react and comment on the proposal.
    translation: |-
      >[!Tip]
      >Pour les décisions plus complexes, vous pouvez aussi organiser un **Tour de questions** à l’étape 2. Les personnes pourront ainsi comprendre la proposition avant de réagir et de la commenter.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
