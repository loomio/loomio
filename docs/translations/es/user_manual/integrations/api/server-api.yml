  5d1d8b72689c1c84:
    english: Use these settings when another system manages Loomio profile fields.
    translation: Usa esta configuración cuando otro sistema gestione los campos del perfil de Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  83b6503850a3581c:
    english: "`LOOMIO_DISABLE_EDIT_USER_PROFILE=1` prevents users from editing these fields themselves:"
    translation: "`LOOMIO_DISABLE_EDIT_USER_PROFILE=1` impide que los usuarios editen estos campos por sí mismos:"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b40beb01122e6c22:
    english: |-
      | Field | Notes |
      | --- | --- |
      | `name` | Managed by external sync |
      | `username` | Managed by external sync |
      | `email` | Managed by external sync |
      | `avatar_kind` / `uploaded_avatar` | Managed by external sync |
    translation: |-
      | Campo | Notas |
      | --- | --- |
      | `name` | Gestionado mediante sincronización externa |
      | `username` | Gestionado mediante sincronización externa |
      | `email` | Gestionado mediante sincronización externa |
      | `avatar_kind` / `uploaded_avatar` | Gestionado mediante sincronización externa |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d914243a6d80944b:
    english: Users can still edit Loomio-local fields such as `short_bio` and `location`.
    translation: Los usuarios todavía pueden editar campos propios de Loomio, como `short_bio` y `location`.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d2d40191ec060f7e:
    english: "`LOOMIO_SSO_UPDATE_USER_PROFILE_ON_LOGIN=1` updates `name` and `email` from SSO login data. Leave it commented out or unset when an external sync script should be the only source of those updates."
    translation: "`LOOMIO_SSO_UPDATE_USER_PROFILE_ON_LOGIN=1` actualiza `name` y `email` con los datos de inicio de sesión mediante SSO. Deja la línea comentada o la variable sin definir si solo un script de sincronización externa debe actualizar esos campos."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f19f0588ef52b814:
    english: "`LOOMIO_SSO_FORCE_USER_ATTRS` still works for existing installs. It both disables user edits and updates `name` and `email` on SSO login."
    translation: "`LOOMIO_SSO_FORCE_USER_ATTRS` sigue funcionando en las instalaciones existentes. Impide que los usuarios editen el perfil y actualiza `name` y `email` al iniciar sesión mediante SSO."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
