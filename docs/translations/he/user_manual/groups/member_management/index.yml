blocks:
  3d2d8d3f7d252651:
    english: "# Member management"
    translation: "# ניהול חברים"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f9901909d4cd86e0:
    english: If you are an admin, you can manage members from the **Members** tab on your group page.
    translation: מנהלי קבוצה יכולים לנהל את החברים בלשונית **חברים** בדף הקבוצה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d25e71106f726cac:
    english: Click on the three dots (**⋮**) to the right of the group member to set their title, make them an admin, make them a delegate, or remove them from the group.
    translation: יש ללחוץ על שלוש הנקודות (**⋮**) לצד שם של חבר קבוצה כדי להגדיר כותרת, להעניק הרשאות ניהול או נציגות, או להסיר מהקבוצה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  db5a08225152e80a:
    english: "![Member actions menu on the Oatmilk Cooperative members page](member_management.png)"
    translation: "![תפריט הפעולות לחבר בדף החברים של קואופרטיב חלב שיבולת שועל](member_management.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0f29eb85fabc200d:
    english: |-
      ## Administering your group
      There are only two user types in a Loomio group: **member** and **admin**.
    translation: |-
      ## ניהול הקבוצה
      בקבוצת Loomio יש שני סוגי משתמשים בלבד: **חבר** ו**מנהל**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4317e6fcbbedcdaa:
    english: 'Admins perform administrative tasks for your group, including: adding and removing members, managing member permissions, setting the group privacy levels, and managing the subscription plans.  In addition, admins are able to see the email addresses of members and export the group''s data.'
    translation: מנהלי קבוצה יכולים להוסיף ולהסיר חברים, לנהל את הרשאותיהם, לקבוע את רמת הפרטיות של הקבוצה ולנהל את תוכניות המינוי. הם יכולים גם לראות את כתובות הדוא״ל של החברים ולייצא את נתוני הקבוצה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7de2ea0e85a19d0a:
    english: The person creating a new Loomio group is made admin by default. We recommend to make at least one other trusted person in your group an admin, to insure someone can always administer your group. You can have as many admins in your group as you wish.
    translation: מי שיוצרים קבוצה חדשה ב־Loomio מקבלים הרשאות ניהול כברירת מחדל. מומלץ להעניק הרשאות ניהול לפחות לאדם מהימן נוסף בקבוצה, כדי שתמיד יהיה מי שיוכל לנהל אותה. אין הגבלה על מספר מנהלי הקבוצה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ac9e3bb2da56869e:
    english: To make a member **admin**, go to the Members tab, find the member and click on the three dots (**⋮**) next to their name. Choose **Make admin**. An `Admin` tag will appear beside their name.
    translation: כדי להעניק לחבר הרשאות **מנהל**, יש לפתוח את הלשונית **חברים**, למצוא את החבר וללחוץ על שלוש הנקודות (**⋮**) לצד השם. יש לבחור **הפוך למנהל**. התג `Admin` יופיע לצד השם.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b93c8eaf5367f572:
    english: "![Make admin action in a member's menu](member_make_admin.png)"
    translation: "![הפעולה להפיכה למנהל בתפריט של חבר](member_make_admin.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f6d7a993e2d32771:
    english: |-
      ## Managing subgroups
      If you are the admin of a parent group, or organization, you have additional permissions with regards to any __closed__ subgroups.
    translation: |-
      ## ניהול תת־קבוצות
      למנהלי קבוצת אם או ארגון יש הרשאות נוספות ביחס לתת־קבוצות __סגורות__.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cd781594b26ae052:
    english: You will be able to join any closed subgroup by clicking the "Join Group" button on the left of the Subgroup page in question (just under the tabs).
    translation: אפשר להצטרף לכל תת־קבוצה סגורה באמצעות לחיצה על הכפתור "הצטרפות לקבוצה" בצד שמאל של דף תת־הקבוצה, מתחת ללשוניות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ba630e95409473a5:
    english: "![Join group button on a closed Oatmilk Cooperative subgroup](member_join_subgroup.png)"
    translation: "![כפתור ההצטרפות לקבוצה בתת־קבוצה סגורה של קואופרטיב חלב שיבולת שועל](member_join_subgroup.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  87c2d0e0fa784cff:
    english: Once you have joined the subgroup, you will also be able to make yourself the admin of that subgroup, just as you would promote anyone to admin.
    translation: לאחר ההצטרפות לתת־הקבוצה, אפשר גם להעניק לעצמכם הרשאות ניהול בה, באותו אופן שבו מעניקים אותן לכל חבר אחר.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e439992d86591319:
    english: |-
      >[!Note]
      >These permissions do not extend to [**secret** subgroups](/en/user_manual/groups/subgroups/?highlight=secret#permissions).
    translation: |-
      >[!Note]
      >הרשאות אלה אינן חלות על [תת־קבוצות **סודיות**](/en/user_manual/groups/subgroups/?highlight=secret#permissions).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  31a8fbe10f50c1a0:
    english: |-
      ## Removing members
      When you click **Remove from group** you'll be asked to confirm the removal. Upon removal, this user will no longer have access to the group's pages, threads, polls, or proposals. They will receive no further emails or notifications of group activity. However, any comments and votes written by the user will remain untouched.
    translation: |-
      ## הסרת חברים
      לאחר לחיצה על **הסר מהקבוצה**, תופיע בקשה לאישור ההסרה. לאחר ההסרה, לא תהיה לאותו אדם גישה לדפי הקבוצה, לשרשורים, למשאלים או להצעות שלה. הוא לא יקבל עוד הודעות דוא״ל או התראות על פעילות הקבוצה. תגובות והצבעות שכבר פרסם יישארו ללא שינוי.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8bf29fce0f0d8e9b:
    english: "![Remove from group action in a member's menu](member_remove.png)"
    translation: "![הפעולה להסרה מהקבוצה בתפריט של חבר](member_remove.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  aa3b173ffd048b99:
    english: You can add removed members back to the group later if you wish.
    translation: אפשר להוסיף חברים שהוסרו בחזרה לקבוצה בהמשך.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6ef7d0422c66d652:
    english: |-
      ## Leaving group
      To leave a group: go to the group page, open the 3 dot menu, and click **Leave group**.
    translation: |-
      ## עזיבת קבוצה
      כדי לעזוב קבוצה, יש לפתוח את דף הקבוצה, לפתוח את תפריט שלוש הנקודות ולבחור **עזוב את הקבוצה**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5395b374b5814162:
    english: "![Leave group action in the Oatmilk Cooperative settings menu](member_leave_group.png)"
    translation: "![הפעולה לעזיבת הקבוצה בתפריט ההגדרות של קואופרטיב חלב שיבולת שועל](member_leave_group.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d926fc8d1e3cbac2:
    english: |-
      ## Set title
      Within the Members tab, you can also name your role within the group, or identify an organization you represent using **title**. You or a group admin can change your title with **Set title** from the 3 dot menu near your name.
    translation: |-
      ## הגדרת כותרת
      בלשונית **חברים** אפשר להשתמש ב**כותרת** כדי לציין את התפקיד בקבוצה או את הארגון שמייצגים. אפשר לשנות את הכותרת באופן עצמאי, וגם מנהלי הקבוצה יכולים לשנות אותה. לשם כך יש לבחור **הגדר כותרת** בתפריט שלוש הנקודות לצד השם.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2425e4d5b1e8047d:
    english: "![Set title action in a member's menu](member_set_title.png)"
    translation: "![הפעולה להגדרת כותרת בתפריט של חבר](member_set_title.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6af456317883a890:
    english: You can have different titles in different subgroups.
    translation: אפשר להגדיר כותרת שונה בכל תת־קבוצה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2d59cb70493e06b1:
    english: "## Member email addresses"
    translation: "## כתובות הדוא״ל של חברי הקבוצה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cee3a1e0e1031377:
    english: Only admins can see group member email addresses.  This is sometimes necessary to audit the members in a group.
    translation: רק מנהלי קבוצה יכולים לראות את כתובות הדוא״ל של חבריה. לעיתים המידע הזה נחוץ לבדיקת רשימת החברים בקבוצה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4ff1112b058a3205:
    english: 'To see member email addresses: Use [data export](/en/user_manual/groups/data_export/) to download a CSV file, and open the file in Excel or Google sheets.'
    translation: כדי לראות את כתובות הדוא״ל של החברים, יש להשתמש ב[ייצוא נתונים](/en/user_manual/groups/data_export/) כדי להוריד קובץ CSV, ולפתוח אותו ב־Excel או ב־Google Sheets.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  105be57911f832fc:
    english: The export group data file shows every person and their email address in every subgroup.
    translation: קובץ ייצוא נתוני הקבוצה מציג את השמות ואת כתובות הדוא״ל של כל החברים בכל תת־הקבוצות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  20f87bcff4ec41e6:
    english: You can also search for members by email address in the members tab. So if you see someone you want to remove, you can search by email to remove them.
    translation: אפשר גם לחפש חברים לפי כתובת דוא״ל בלשונית החברים. כך אפשר למצוא לפי כתובת הדוא״ל אדם שרוצים להסיר מהקבוצה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
