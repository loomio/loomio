  0b8776f3657a1add:
    english: Group settings control how your group is presented, who can find and join it, and what members are allowed to do. Only group administrators can edit these settings.
    translation: A csoportbeállítások határozzák meg, hogyan jelenik meg a csoportod, kik találhatják meg és csatlakozhatnak hozzá, valamint mit tehetnek a tagok. Ezeket a beállításokat csak a csoport adminisztrátorai szerkeszthetik.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  306f2b79029e2196:
