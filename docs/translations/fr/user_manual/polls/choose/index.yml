navigation_title: Choix
blocks:
  581de5d50d3dc442:
    english: "# Choose"
    translation: "# Choix"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  733b320e0407fbdc:
    english: Choose is a simple poll for finding the most popular option or making a shortlist. Participants select one or more options, depending on the limits you set. This voting method is commonly known as multiple choice.
    translation: Le sondage Choix permet de trouver l’option la plus populaire ou d’établir une liste restreinte. Les personnes qui participent sélectionnent une ou plusieurs options, selon les limites que vous définissez. Cette méthode de vote est aussi appelée « choix multiple ».
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '09aefb579b50874b':
    english: "## When to use Choose"
    translation: "## Quand utiliser Choix"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  be35cf72fcaf9c4d:
    english: 'Use Choose when the options are distinct and you need to count how many people select each one. It works well for:'
    translation: 'Utilisez Choix lorsque les options sont distinctes et que vous devez compter combien de personnes sélectionnent chacune d’elles. Ce sondage convient notamment pour :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dcc6f6b9238155b2:
    english: |-
      - choosing one venue from a shortlist;
      - selecting up to three topics for an agenda;
      - deciding which design should proceed to the next round; or
      - checking which services members intend to use.
    translation: |-
      - choisir un lieu parmi une liste restreinte ;
      - sélectionner jusqu’à trois sujets pour un ordre du jour ;
      - décider quel projet passera à l’étape suivante ; ou
      - savoir quels services les membres comptent utiliser.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3770d0653b752de5:
    english: Choose records selections, not the strength or order of a person's preferences. Use [Score](/en/user_manual/polls/score/) to measure how strongly people support every option, [Allocate](/en/user_manual/polls/allocate/) when there is a limited budget, or [Rank](/en/user_manual/polls/rank/) when preference order matters.
    translation: Choix enregistre les options sélectionnées, mais pas l’intensité ni l’ordre des préférences. Utilisez [Sondage pondéré](/en/user_manual/polls/score/) pour mesurer le degré de soutien à chaque option, [Répartition](/en/user_manual/polls/allocate/) lorsque le budget est limité, ou [Classement par préférence](/en/user_manual/polls/rank/) lorsque l’ordre des préférences compte.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f15aca327e894f30:
    english: "## Example: set a planning-meeting agenda"
    translation: "## Exemple : établir l’ordre du jour d’une réunion de planification"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f51e09afa0ed1e53:
    english: Oatmilk Cooperative needs to decide which parts of a returnable-bottle trial need the most time at its next planning meeting. The poll asks each person to choose up to two topics. Its details explain how the result will be used, and each option includes enough information to distinguish it from the others.
    translation: La coopérative Oatmilk doit décider quelles parties d’un essai de bouteilles consignées nécessitent le plus de temps lors de sa prochaine réunion de planification. Le sondage demande à chaque personne de choisir jusqu’à deux sujets. Les détails expliquent comment le résultat sera utilisé, et chaque option contient assez d’informations pour être distinguée des autres.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c74ebb16f872b3c6:
    english: "## Set up the poll"
    translation: "## Configurer le sondage"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  abc749fec8671661:
    english: Give the poll a specific question as its title. In **Details**, explain what participants should consider and what will happen with the result. Add each available option, then set the **Minimum choices** and **Maximum choices**.
    translation: Donnez au sondage un titre sous forme de question précise. Dans **Détails**, expliquez ce que les personnes qui participent doivent prendre en compte et ce qui sera fait du résultat. Ajoutez chaque option proposée, puis définissez les **Choix minimum** et **Choix maximum**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e878ddc9f61dd243:
    english: Set both limits to 1 when participants must choose exactly one option. Set a higher maximum when you want a shortlist. Avoid allowing so many choices that participants can select nearly every option, because that makes the result less useful.
    translation: 'Fixez les deux limites à 1 si chaque personne doit choisir exactement une option. Fixez un maximum plus élevé si vous souhaitez établir une liste restreinte. Évitez de permettre la sélection de presque toutes les options : le résultat serait moins utile.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  152fec5018fc232b:
    english: Use the pencil icon beside an option to add a meaning or further explanation. This is useful when a short option name could be interpreted in different ways.
    translation: Utilisez l’icône en forme de crayon à côté d’une option pour en préciser le sens ou ajouter une explication. C’est utile si un nom court peut être interprété de plusieurs façons.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  59e405cf9a028c8d:
    english: Under **More settings**, **Show options in random order** can reduce the effect of always presenting one option first.
    translation: Dans **Plus de paramètres**, **Afficher les options dans un ordre aléatoire** peut réduire l’effet lié au fait de toujours présenter la même option en premier.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Voter"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7db2d0e58e5fb4e4:
    english: The vote form tells participants how many options they may select. In this example, the voter selects **Cafe collection schedule** and **Washing workflow**, then gives a reason connecting those choices to the trial.
    translation: Le formulaire de vote indique combien d’options chaque personne peut sélectionner. Dans cet exemple, la personne choisit **Calendrier de collecte dans les cafés** et **Processus de lavage**, puis explique le lien entre ses choix et l’essai.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e55e4b8950a5fd46:
    english: A reason can reveal why an option matters and what work participants expect it to cover. If reasons are important to the decision, configure the vote-reason setting before starting the poll.
    translation: Une explication peut montrer pourquoi une option compte et quel travail les personnes qui participent lui associent. Si ces explications sont importantes pour la décision, configurez le paramètre relatif aux motifs de vote avant de lancer le sondage.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Lire les résultats"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c1ec47f66384e3bb:
    english: The results show the share of all selections received by each option, the number of voters who selected it, and who has not voted. Because each person could choose two options, the percentages describe selections rather than a percentage of people.
    translation: Les résultats indiquent la part de l’ensemble des sélections reçue par chaque option, le nombre de personnes qui l’ont choisie et les personnes qui n’ont pas voté. Comme chacun pouvait choisir deux options, les pourcentages portent sur les sélections, et non sur les personnes.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6cbc0f9d6fdf6727:
    english: In this example, **Cafe collection schedule** has three selections. **Washing workflow** and **Return-rate reporting** each have two. The result supports giving cafe collections the most agenda time, but the tied topics still require the organizer to decide how the remaining time is divided.
    translation: Dans cet exemple, **Calendrier de collecte dans les cafés** a été sélectionné trois fois. **Processus de lavage** et **Suivi du taux de retour** ont chacun été sélectionnés deux fois. Le résultat suggère d’accorder le plus de temps aux collectes dans les cafés, mais la personne qui organise la réunion doit encore décider comment répartir le temps restant entre les sujets à égalité.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  adb7eb28e16616be:
    english: When the poll closes, publish an **Outcome** explaining what the group will do with the result.
    translation: À la clôture du sondage, publiez une **Conclusion** expliquant ce que le groupe fera du résultat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
