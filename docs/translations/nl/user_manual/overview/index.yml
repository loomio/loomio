  7c8501ecb12311af:
    english: "## How Loomio works"
    translation: "## Hoe Loomio werkt"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  74caca2261c15283:
    english: 'Loomio has three main parts: groups, discussions, and polls.'
    translation: 'Loomio heeft drie hoofdonderdelen: groepen, discussies en peilingen.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5f0a46926a0f7350:
    english: "### Groups"
    translation: "### Groepen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2060a64d0fabc6d7:
    english: A group is a place for an organization, team, or community to work together. Its home page explains the group's purpose and provides access to its discussions, polls, members, and files.
    translation: Een groep is een plek waar een organisatie, team of gemeenschap kan samenwerken. De startpagina legt uit wat het doel van de groep is en geeft toegang tot discussies, peilingen, leden en bestanden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  311793a17709182c:
    english: "### Discussions"
    translation: "### Discussies"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  05ecdffe6c18a1df:
    english: Discussions keep the information and conversation about a topic together. People can share context, comment, reply, react, and use polls to move the discussion towards an outcome.
    translation: In een discussie blijven de informatie en het gesprek over een onderwerp bij elkaar. Mensen kunnen achtergrondinformatie delen, reageren, antwoorden en reacties plaatsen. Met peilingen kunnen ze de discussie naar een conclusie brengen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dc9a50d7f1f20c80:
    english: Over time, discussions create a searchable record of the information considered and the decisions made by your group.
    translation: Na verloop van tijd vormen discussies een doorzoekbaar overzicht van de informatie die jouw groep heeft overwogen en de besluiten die zij heeft genomen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3448194e8a2ce09d:
    english: "### Polls and proposals"
    translation: "### Peilingen en voorstellen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4ef7092f5f56e773:
    english: Polls help a group understand preferences, gather advice, and make decisions. Different poll templates support different processes. A proposal asks people to respond to a suggested course of action and explain the reason for their response.
    translation: Peilingen helpen een groep voorkeuren te begrijpen, advies te verzamelen en besluiten te nemen. Verschillende peilingsjablonen ondersteunen verschillende processen. Met een voorstel vraag je mensen te reageren op een voorgestelde aanpak en hun reactie toe te lichten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  51ab039bc7c374bd:
    english: Polls can be part of a discussion or run independently from the **Polls** tab on a group page.
    translation: Peilingen kunnen deel uitmaken van een discussie. Je kunt ook een losse peiling starten via het tabblad **Peilingen** op een groepspagina.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  47500e7125fdedbc:
    english: To learn where these parts appear in the interface, see the [Quick tour](/en/user_manual/overview/orientation). To start contributing, see [How to participate](/en/user_manual/overview/how-to-participate).
    translation: Bekijk de [korte rondleiding](/en/user_manual/overview/orientation) om te zien waar je deze onderdelen vindt. Lees [Hoe je kunt deelnemen](/en/user_manual/overview/how-to-participate) om zelf aan de slag te gaan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  57ed823687deabb5:
    english: "## Try it out"
    translation: "## Probeer het uit"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b08a2d6a44f0d7ac:
    english: The best way to learn about Loomio is to [start a free trial](/try)
    translation: Je leert Loomio het beste kennen door [een gratis proefperiode te starten](/try)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ced10eda436a40ca:
    english: "## How people use Loomio"
    translation: "## Hoe mensen Loomio gebruiken"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4198817a2724ad0a:
    english: "**Member organizations** to involve members in decisions at scale. Political parties, consumer and worker co-operatives, and membership associations use Loomio to facilitate a safe, inclusive space for members to share information and raise topics, participate in important decisions and vote in General Assembly. Streamline decision processes, improve transparency and accountability, document discussions and record decisions, and include members' voices to organize for action."
    translation: "**Ledenorganisaties** gebruiken Loomio om veel leden bij besluiten te betrekken. Politieke partijen, consumenten- en werknemerscoöperaties en verenigingen bieden leden een veilige, toegankelijke plek om informatie te delen en onderwerpen aan te kaarten. Leden kunnen deelnemen aan belangrijke besluiten en stemmen tijdens de algemene vergadering. Organisaties kunnen besluitvorming stroomlijnen, transparantie en verantwoording verbeteren, discussies en besluiten vastleggen en leden betrekken bij gezamenlijke actie."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7b2fd1306e05f4e3:
    english: "**Self-managing organizations** to involve staff in decisions. Self-managing teams, worker co-operatives, and sociocratic organisations use Loomio to run consent, consensus, and advice-based decision processes across distributed teams and time zones. Tap into collective intelligence, distribute decision making, build governance and policy together, and document decisions and discussion."
    translation: "**Zelfsturende organisaties** gebruiken Loomio om medewerkers bij besluiten te betrekken. Zelfsturende teams, werknemerscoöperaties en sociocratische organisaties kunnen besluitvormingsprocessen op basis van consent, consensus en advies uitvoeren, ook als teams verspreid zijn over verschillende locaties en tijdzones. Ze kunnen kennis en inzichten bundelen, besluiten verdelen, samen beleid en bestuursafspraken opstellen en discussies en besluiten vastleggen."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  75d7266c562f65c2:
    english: "**Boards, councils, and distributed networks** to involve stakeholders in decisions. Create a safe space for discussion, keep track of communications, and coordinate across geographies and time zones. Structure decision making processes, improve agility and response times, and preserve organizational memory."
    translation: "**Besturen, raden en verspreide netwerken** gebruiken Loomio om betrokkenen bij besluiten te betrekken. Ze kunnen een veilige plek voor discussie bieden, communicatie bijhouden en samenwerken over verschillende locaties en tijdzones heen. Zo kunnen ze besluitvormingsprocessen vormgeven, sneller reageren en vastleggen hoe de organisatie tot besluiten is gekomen."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cbe5ae77738f2704:
    english: "**Residential communities and co-ops** to make decisions together as neighbours. Cohousing communities, ecovillages, coliving cooperatives, housing co-ops, and land trusts use Loomio to replace or augment traditional strata and property management with democratic governance. Residents shape decisions about shared land, common spaces, and community agreements, and asynchronous discussion means members can fully participate whether they're on-site or away travelling, keeping a clear record of how the community has chosen to live together."
    translation: "**Woongemeenschappen en wooncoöperaties** gebruiken Loomio om samen met buren besluiten te nemen. Collectieve woonprojecten, ecodorpen, samenwooncoöperaties, wooncoöperaties en organisaties voor gemeenschappelijk grondbezit gebruiken Loomio als aanvulling op of vervanging van traditioneel vastgoedbeheer. Bewoners beslissen samen over gedeelde grond, gemeenschappelijke ruimten en afspraken. Doordat discussies niet gelijktijdig hoeven plaats te vinden, kunnen leden ook deelnemen als ze op reis zijn. Zo blijft duidelijk vastgelegd hoe de gemeenschap ervoor kiest samen te leven."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb1039083c952286:
    english: Loomio builds a living record of your organization; the decisions made, who was involved and the discussion leading up to the decision.
    translation: 'Loomio bouwt een actueel overzicht op van jouw organisatie: welke besluiten zijn genomen, wie erbij betrokken waren en welke discussies eraan voorafgingen.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
