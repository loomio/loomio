  9e82eeed268ff95b:
    english: |-
      Visit [https://teams.microsoft.com](https://teams.microsoft.com) then click Apps
      ![](t1.png)
    translation: |-
      Перейдіть на [https://teams.microsoft.com](https://teams.microsoft.com) і натисніть «Програми»
      ![](t1.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4013a8134cd33c5e:
    english: |-
      Search for "webhook" in the search field, then click Incoming Webhook
      ![](t2.png)
    translation: |-
      Введіть «webhook» у полі пошуку та виберіть «Вхідний вебхук»
      ![](t2.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  27e11023c40ed56d:
    english: |-
      Click "Add to a team"
      ![](t3.png)
    translation: |-
      Натисніть «Додати до команди»
      ![](t3.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6d1831726b04a7f5:
    english: |-
      Type and select the channel you want Loomio notifications to appear within.
      ![](t4.png)
    translation: |-
      Введіть назву каналу, у якому мають з’являтися сповіщення Loomio, і виберіть його.
      ![](t4.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a046f5d6ec1f29bd:
