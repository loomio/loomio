navigation_title: Beszélgetések vezetése
blocks:
  c377321bc013336b:
    english: "# Facilitating discussions"
    translation: "# Beszélgetések vezetése"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b771c6c746b8dc40:
    english: 'At times topics arise that require the attention of board or committee members mid-cycle, between meetings. '
    translation: Néha két ülés között merül fel olyan téma, amely az igazgatóság vagy egy bizottság tagjainak figyelmét igényli.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b5fc5f12c8e44c40:
    english: And sometimes there is just not space during a meeting for discussion or to sufficiently deliberate on a decision.
    translation: Máskor az ülésen nincs elég idő egy téma megbeszélésére vagy egy döntés alapos mérlegelésére.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  79f2f83380e195c4:
    english: "## On Loomio"
    translation: "## A Loomióban"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  14d5e62d33996982:
    english: Use a Loomio **thread** to facilitate a discussion.  Give the thread a descriptive title that members will recognize and provide details in the thread context.  Add a relevant category tag to help members find the thread in future.
    translation: Beszélgetéshez használj Loomio-**témát**. Adj neki olyan címet, amelyből a tagok felismerik, miről szól, és írd le a részleteket a téma leírásában. Adj hozzá egy megfelelő kategóriacímkét, hogy a tagok később is könnyen megtalálják.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d35b4315f4e42cb:
    english: Notify members of the thread by inviting them, so they will receive a copy of the thread by email.  Members can participate in the discussion by clicking on the link to go to Loomio, or reply to the notification email and their comment will appear as a comment in the thread.
    translation: Hívd meg a tagokat a témába, hogy e-mailben is megkapják azt. A beszélgetéshez a hivatkozásra kattintva, a Loomióban szólhatnak hozzá. Az értesítő e-mailre is válaszolhatnak; válaszuk hozzászólásként jelenik meg a témában.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f7d839f27c1a6f72:
    english: A Loomio thread enables you to attach files or link to online resources to support the discussion.
    translation: A Loomio-témához fájlokat csatolhatsz, vagy online forrásokat hivatkozhatsz a beszélgetés alátámasztására.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e45d25d90798cf1e:
    english: "Common examples include:\n- review and develop a policy\n- seek advice from the board about a topic or issue\n- discuss strategy \n- explore an idea or opportunity\n- assess risk"
    translation: "Gyakori felhasználási módok:\n- egy szabályzat áttekintése és kidolgozása\n- az igazgatóság tanácsának kérése egy témában vagy kérdésben\n- stratégia megvitatása \n- egy ötlet vagy lehetőség feltárása\n- kockázatok felmérése"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  86ace2adbcf3df6f:
    english: "## Issues that arise between board meetings"
    translation: "## Az igazgatósági ülések között felmerülő kérdések"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  48f6023950ee0729:
    english: 'A lot can happen in an organization between meetings, and most people rely on email to alert board members.  Trying to keep track of a discussion on email is tricky, with replies often lost in in-boxes and people left out.  '
    translation: 'Két ülés között sok minden történhet egy szervezetben. Az igazgatósági tagokat gyakran e-mailben értesítik, de az e-mailes beszélgetéseket nehéz követni: a válaszok elveszhetnek a postafiókokban, és egyesek kimaradhatnak.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1cb0e78c848b9621:
    english: "*“You can’t do governance by email!”, Richard Westlake (Westlake Governance).*"
    translation: "*„E-mailben nem lehet irányítani egy szervezetet” – Richard Westlake (Westlake Governance).*"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  eddf348746c93b4c:
    english: 'When an issue arises requiring board attention, use a Loomio thread rather than email.  Members can reply via email and their comment will appear in the Loomio thread, keeping the discussion in one place. '
    translation: Ha egy kérdés az igazgatóság figyelmét igényli, indíts Loomio-témát. A tagok e-mailben is válaszolhatnak, és hozzászólásuk megjelenik a témában. Így a beszélgetés egy helyen marad.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2f7ad89003f79fb8:
    english: |-
      Here's how:
      - Make the email subject line the title of your thread,
      - write your email content in the thread context,
      - invite your team to the thread with their email address or Loomio user name.
    translation: |-
      Így csináld:
      - Az e-mail tárgyát használd a téma címeként,
      - az e-mail szövegét írd a téma leírásába,
      - hívd meg a csapatodat a témába e-mail-cím vagy Loomio-felhasználónév alapján.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9825cbb88dcedc3d:
    english: |-
      A Loomio thread means that:
      - All info about a topic is organized in one easily accessible place,
      - people can respond without generating reply/reply-all email chains that risk leaving people out,
      - you can see who has read the message and who needs a nudge,
      - you can progress actual work to an outcome, and cut down on the amount of email.
    translation: |-
      A Loomio-témában:
      - egy könnyen elérhető helyen található minden információ az adott kérdésről,
      - mindenki válaszolhat anélkül, hogy a válasz és válasz mindenkinek e-mailek láncolatában bárki kimaradna,
      - láthatod, ki olvasta az üzenetet, és kit érdemes emlékeztetni,
      - a közös munkát következtetésig viheted, miközben kevesebb e-mailre van szükség.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fb9adc7cb7922016:
    english: "## When there isn't space during meetings"
    translation: "## Ha az ülésen nincs elég idő"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6b1c61424aa7e74b:
    english: When an agenda item cannot be resolved within the time available in your board meeting, you can move this for further discussion to Loomio. Direct people to the relevant thread, or start a new one and notify your board members.
    translation: Ha egy napirendi pontot nem tudtok megtárgyalni az igazgatósági ülésen rendelkezésre álló időben, folytathatjátok a beszélgetést a Loomióban. Irányítsd a résztvevőket a megfelelő témához, vagy indíts újat, és értesítsd az igazgatóság tagjait.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ced9caddb281230f:
    english: This relieves pressure on your board, allows more time for information gathering, discussion and deeper reflection which often results in a better quality decision.
    translation: Így kevesebb időbeli nyomás nehezedik az igazgatóságra. Több idő jut az információgyűjtésre, a beszélgetésre és az alapos mérlegelésre, ami gyakran jobb döntéshez vezet.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
