  0431c9fc46658338:
    english: 'The group participation report gives insights into the usage of your Loomio group. '
    translation: Il rapporto sulla partecipazione mostra come viene usato il tuo gruppo Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0d23c0831f1ea6ca:
    english: 'You''re able to choose which groups to include in the report, the start and end date for the report, and the interval (year, month, week or day) for grouping results. '
    translation: Puoi scegliere quali gruppi includere, le date di inizio e fine e l'intervallo con cui raggruppare i risultati (anno, mese, settimana o giorno).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  73c9822c08a37866:
    english: The report is available to everyone in your group, however users can only see results for groups that they belong to, this means that different users may see slightly different reports.
    translation: Il rapporto è disponibile a tutti i membri del gruppo, ma ciascuno può vedere solo i risultati dei gruppi di cui fa parte. Per questo, persone diverse possono vedere rapporti leggermente diversi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c9402b4720639f86:
    english: 'You can find the report by clicking the group settings menu cog, as shown below. '
    translation: Per trovare il rapporto, clicca sull'icona a forma di ingranaggio del menu delle impostazioni del gruppo, come mostrato qui sotto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
