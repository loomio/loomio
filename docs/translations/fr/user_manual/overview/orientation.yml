    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0bd69f7ef1a85ec1:
    english: Use the sidebar to open your dashboard, polls awaiting your vote, unread and direct discussions, tasks, and groups. It also links to the user manual and support.
    translation: La barre latérale donne accès à votre tableau de bord, aux sondages en attente de votre vote, aux discussions non lues et directes, aux tâches et aux groupes. Elle contient aussi des liens vers le manuel d’utilisation et l’assistance.
    status: machine
