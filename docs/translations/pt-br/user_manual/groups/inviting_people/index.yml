---
navigation_title: Convidar pessoas
blocks:
  47820acef0cf3fe9:
    english: "# Inviting people"
    translation: "# Convidar pessoas"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6a2bc749ec2883c0:
    english: Go to your group page and click the **Members** tab to access member management.
    translation: Acesse a página do seu grupo e selecione a aba **Membros** para gerenciar os membros.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7fc9a792512e50bb:
    english: You can **Invite** particular people to your group with their email address or **Share** a link to your group via email, newsletter, chat or from your website.
    translation: Você pode **Convidar** pessoas para o grupo pelo endereço de e-mail ou **Compartilhar** um link para o grupo por e-mail, boletim informativo, chat ou pelo seu site.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3fc7875402babd63:
    english: "## Send invitations via email"
    translation: "## Enviar convites por e-mail"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4e91c3f036e94808:
    english: Click **Invite** on the **Members** tab to send an email containing a single-use invitation link. The recipient can create a Loomio user account and join your group.
    translation: Na aba **Membros**, selecione **Convidar** para enviar um e-mail com um link de convite de uso único. A pessoa pode criar uma conta no Loomio e entrar no seu grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  37a98960a11df300:
    english: If the recipient already has a Loomio user account they can still accept the invitation to join your group with their existing account.
    translation: Se a pessoa já tiver uma conta no Loomio, poderá aceitar o convite e entrar no grupo com essa conta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c40b8865bc90ab0b:
    english: "### Invite many at once"
    translation: "### Convidar várias pessoas de uma vez"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f92bf789ad23e4c3:
    english: You can send invitations by email to up to 100 people at a time by entering (or copy/pasting) multiple email addresses into the "Who would you like to invite" box. Separate email addresses by comma or space.
    translation: Você pode convidar até 100 pessoas por e-mail de uma vez. Digite ou cole vários endereços de e-mail no campo "Quem você gostaria de convidar?". Separe os endereços por vírgula ou espaço.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1e8ea8567d051081:
    english: When inviting people to a group within an organization, the parent group and related subgroups you belong to appear as audience suggestions. Select a group, then select its chip to expand the audience into individual people. You can remove anyone you do not want to invite before sending the invitations. People who already belong to the destination group are excluded.
    translation: Ao convidar pessoas para um grupo de uma organização, o grupo principal e os subgrupos relacionados dos quais você participa aparecem como sugestões de destinatários. Selecione um grupo e depois selecione o marcador correspondente para mostrar as pessoas individualmente. Antes de enviar os convites, você pode remover quem não quiser convidar. Pessoas que já pertencem ao grupo de destino são excluídas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  23c96c665ed9ad1c:
    english: |-
      >[!Tip]
      >Copy email addresses from a column in a Google or Excel spreadsheet, and paste into the invitation box.
    translation: |-
      >[!Tip]
      >Copie os endereços de e-mail de uma coluna de uma planilha do Google ou Excel e cole no campo de convites.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  697177b4211a5479:
    english: When you click **Invite** an email will be sent to each of the email addresses you supplied, containing a unique invitation link that can only be used once. This email will be sent in your current language.
    translation: Ao selecionar **Convidar**, cada endereço informado receberá um e-mail com um link de convite exclusivo, que só pode ser usado uma vez. O e-mail será enviado no idioma que você está usando.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bcce66d3fb6f6b8e:
    english: "### Invite people to Subgroups"
    translation: "### Convidar pessoas para subgrupos"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e422dfc71ef2fe0:
    english: Following the same process as above, you can invite people to a 'parent' group, and one or more subgroups simultaneously when you invite them with the **Invite people** button. Tick the boxes next to the subgroups you want them to immediately be a part of when they join the group.
    translation: Pelo mesmo processo, você pode convidar pessoas para um grupo principal e para um ou mais subgrupos ao mesmo tempo com o botão **Convidar pessoas**. Marque as caixas dos subgrupos dos quais elas devem fazer parte assim que entrarem no grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  87f0b0c3281b6228:
    english: "## Share a link to your group"
    translation: "## Compartilhar um link para seu grupo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2f014bdf9b719ec0:
    english: You can share a link to your group with the **Share** button. This is useful if you want to send a link via email, newsletter, chat or post on your website.
    translation: Use o botão **Compartilhar** para obter um link para seu grupo. Você pode enviá-lo por e-mail, boletim informativo ou chat, ou publicá-lo no seu site.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  18ff20426c02846e:
    english: Click on the "copy" icon to copy the link to your clipboard, then paste in your email, newsletter or chat channel.
    translation: Selecione o ícone "copiar" para copiar o link para a área de transferência. Depois, cole-o no e-mail, boletim informativo ou chat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c6506b3c529f683c:
    english: If you want to stop people from joining via this link, click "Reset this link". The existing link will no longer work and a new link will be created.
    translation: Para impedir que outras pessoas entrem por esse link, selecione "Redefinir este link". O link atual deixará de funcionar e um novo será criado.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6d57daddf1df6a2d:
    english: "## Request to join group"
    translation: "## Solicitar entrada no grupo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  70b9af34b3bc2a9e:
    english: People can request to join an Open or Closed group. Share the group URL, such as `https://www.loomio.com/group-name`. When people arrive at the group page, they can see the public group information and select **Join group** to answer the joining prompt and send their request.
    translation: As pessoas podem solicitar entrada em grupos abertos ou fechados. Compartilhe a URL do grupo, como `https://www.loomio.com/group-name`. Ao acessar a página, elas poderão ver as informações públicas do grupo, selecionar **Entrar no grupo**, responder à pergunta de apresentação e enviar a solicitação.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a5534ae2aba161ba:
    english: The joining prompt gives people a chance to introduce themselves and explain why they want to join.
    translation: A pergunta de apresentação permite que as pessoas se apresentem e expliquem por que querem entrar no grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bb13bbdbfd6da80b:
    english: Under [Group privacy](/en/user_manual/groups/settings/privacy#how-people-join), choose **Request approval** to require requests to be reviewed. You can also customize the joining prompt in the group settings.
    translation: Em [Privacidade do grupo](/en/user_manual/groups/settings/privacy#how-people-join), escolha **Solicitar aprovação** para exigir a análise das solicitações. Você também pode personalizar a pergunta de apresentação nas configurações do grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5b0e7c47a0518a3e:
    english: "### Review membership requests"
    translation: "### Analisar solicitações de entrada"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d4a03352457d41cb:
    english: 'Group administrators and members with permission to add members review requests from the **Membership requests** section of the **Members** tab. A reviewer can:'
    translation: 'Administradores do grupo e membros com permissão para adicionar membros analisam as solicitações na seção **Solicitações para inclusão de membros** da aba **Membros**. Quem analisa pode:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  84c6d641f9dba801:
    english: |-
      - **Approve** the request to add the applicant as a member and notify them.
      - **Ignore** the request to close it without notifying the applicant or allowing another request.
      - **Decline** the request with a message explaining the decision. Loomio sends the message to the applicant by email and notification, and they can submit a new request.
    translation: |-
      - **Aprovar** a solicitação para adicionar a pessoa ao grupo e notificá-la.
      - **Ignorar ** a solicitação para encerrá-la sem notificar a pessoa nem permitir que ela envie outra solicitação.
      - **Recusar** a solicitação com uma mensagem que explique a decisão. O Loomio envia a mensagem por e-mail e notificação, e a pessoa pode enviar uma nova solicitação.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b1de5132fa942ba8:
    english: Select the decline button to write a message or ignore the request.
    translation: Selecione o botão de recusa para escrever uma mensagem ou ignorar a solicitação.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a87e3fdd4ce43ee9:
    english: "## Managing invitations"
    translation: "## Gerenciar convites"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  84dc2f66c60f3237:
    english: To manage invitations, open the filter/ drop down from the Members tab of your Group page and select **Invitations**. You can manage individual invitations by clicking the three dot menu (**⋮**) to the right of the member.
    translation: Para gerenciar os convites, abra o menu de filtros na aba **Membros** da página do seu grupo e selecione **Convites**. Para gerenciar um convite individual, selecione o menu de três pontos (**⋮**) à direita do membro.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c8d12991b8edb22f:
    english: You can also make people administrators or set their title (e.g. "IT Support") within the group before they accept their invitation.
    translation: Você também pode tornar as pessoas administradoras ou definir um título para elas no grupo, como "Suporte de TI", antes que aceitem o convite.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e8aec784f84451cc:
    english: "### Re-send invitations"
    translation: "### Reenviar convites"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c201c2b360b1877:
    english: Follow up on people who don't make it into the group and give them a nudge. If someone has lost or forgotten about their invitation email, you can re-send it from the dropdown menu beside their name on the Members page.
    translation: Se alguém ainda não entrou no grupo, você pode lembrá-lo do convite. Caso a pessoa tenha perdido ou esquecido o e-mail, reenvie o convite pelo menu ao lado do nome dela na página **Membros**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8b4674400f9a3f09:
    english: Click on the three dots (**⋮**) next to the person you want to resend the invitation to, and then choose **Resend invitation**.
    translation: Selecione os três pontos (**⋮**) ao lado da pessoa e escolha **Re-enviar convite**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  abc5a934440fb8e1:
    english: |-
      ### Cancelling invitations
      If you entered the wrong email address, or have changed your mind about inviting someone, you can cancel an invitation from the Members tab on your Group page. Select **Cancel Invitation** from the drop down menu to the right of the member invitation (**⋮**).
    translation: |-
      ### Cancelar convites
      Se você informou o endereço de e-mail errado ou desistiu de convidar alguém, pode cancelar o convite na aba **Membros** da página do seu grupo. Selecione **Cancelar convite** no menu à direita do convite (**⋮**).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
