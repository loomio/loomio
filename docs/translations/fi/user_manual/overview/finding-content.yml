  d761f1c7397d8e51:
    english: Select a tag on the **Discussions** tab to show matching discussions. People with permission to start or edit discussions can apply tags. See [Category tags](/en/user_manual/discussions/tags) for setup and permission details.
    translation: Valitse tunniste **Keskustelut**-välilehdellä nähdäksesi siihen liittyvät keskustelut. Tunnisteita voivat lisätä henkilöt, joilla on oikeus aloittaa tai muokata keskusteluja. Ohjeet käyttöönottoon ja käyttöoikeuksiin löydät sivulta [Luokkatunnisteet](/en/user_manual/discussions/tags).
    status: machine
