---
navigation_title: Loomion käyttöönotto ryhmässäsi
blocks:
  6c777a62b2b77732:
    english: "# Introducing Loomio to your group"
    translation: "# Loomion käyttöönotto ryhmässäsi"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  438cc622ae730bd8:
    english: Introduce Loomio through one useful piece of work. Prepare the group before inviting people, help everyone participate once, and complete the process through to an outcome.
    translation: Ota Loomio käyttöön yhden hyödyllisen tehtävän kautta. Valmistele ryhmä ennen kuin kutsut ihmisiä mukaan, auta kaikkia osallistumaan kerran ja vie prosessi päätökseen asti.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9c9fa4e8f6e208e4:
    english: "## Choose one useful starting point"
    translation: "## Valitse yksi hyödyllinen aloituskohde"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3353fb04e83837e5:
    english: Start with a real process that your group already needs. A good first use is small enough to complete soon, but relevant enough that people have a reason to participate.
    translation: Aloita tehtävästä, joka ryhmänne on jo hoidettava. Hyvä ensimmäinen tehtävä on riittävän pieni, jotta sen voi saada pian valmiiksi, mutta riittävän tärkeä, jotta ihmisillä on syy osallistua.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  652744a2ab28954b:
    english: 'For example:'
    translation: 'Voitte esimerkiksi:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  19bc6c09eeea816e:
    english: |-
      - prepare the agenda for an upcoming meeting;
      - review and approve meeting minutes;
      - gather feedback on a draft document;
      - decide a small operational question; or
      - identify priorities for the next month.
    translation: |-
      - valmistella tulevan kokouksen esityslistan;
      - tarkistaa ja hyväksyä kokouksen pöytäkirjan;
      - kerätä palautetta asiakirjaluonnoksesta;
      - ratkaista pienen käytännön kysymyksen; tai
      - määrittää seuraavan kuukauden tärkeimmät tehtävät.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  68a0d6b76f36ebaf:
    english: Avoid moving every discussion and decision into Loomio at once. A repeatable process gives the group a clear reason to return and lets you improve the way you run it each time.
    translation: Älä siirrä kaikkia keskusteluja ja päätöksiä Loomioon kerralla. Toistuva prosessi antaa ryhmälle selkeän syyn palata Loomioon ja mahdollisuuden parantaa toimintatapaa joka kerta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4b65243ef120921b:
    english: "## Prepare the group before inviting people"
    translation: "## Valmistele ryhmä ennen kutsujen lähettämistä"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  305b29c1c832c246:
    english: 'Give people a useful and recognizable place to arrive in:'
    translation: 'Tee ryhmästä hyödyllinen ja tunnistettava paikka, johon kutsutut voivat saapua:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  76d859d168805706:
    english: |-
      - add the group's name, logo, cover image, purpose, and important links;
      - check the group's privacy and permissions;
      - add any [category tags](/en/user_manual/discussions/tags) the group will use regularly;
      - create the first real discussion, with the background information people need; and
      - create a practice discussion if members would benefit from trying comments, reactions, and voting without consequences.
    translation: |-
      - lisää ryhmän nimi, logo, kansikuva, tarkoitus ja tärkeät linkit;
      - tarkista ryhmän yksityisyysasetukset ja käyttöoikeudet;
      - lisää [luokkatunnisteet](/en/user_manual/discussions/tags), joita ryhmä käyttää säännöllisesti;
      - aloita ensimmäinen varsinainen keskustelu ja anna ihmisille tarvittavat taustatiedot; ja
      - aloita harjoituskeskustelu, jos jäsenille olisi hyötyä kommenttien, reaktioiden ja äänestämisen kokeilemisesta ilman, että se vaikuttaa oikeisiin päätöksiin.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f1decb57ec9d48cb:
    english: Use your own photo in your profile and the organization's logo for the group. This helps people recognize who invited them and which organization an email is about.
    translation: Käytä omaa kuvaasi profiilissasi ja organisaation logoa ryhmän kuvana. Näin ihmiset tunnistavat, kuka heidät kutsui ja mitä organisaatiota sähköposti koskee.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '01965093f234bb36':
    english: "## Decide where work belongs"
    translation: "## Päätä, missä työ tehdään"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7fbd0d770cbed2bd:
    english: 'Loomio can sit alongside tools your group already uses:'
    translation: 'Loomiota voi käyttää muiden ryhmänne työkalujen rinnalla:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '0168271b154f6931':
    english: |-
      | Use | Good place for it |
      |---|---|
      | Quick questions, social conversation, and timely updates | Chat, such as Slack, Teams, Matrix, or Discord |
      | Collaborative editing of a living document | A shared document tool |
      | Assigning work and tracking its completion | A task or project-management tool |
      | A focused discussion, broad participation, a decision, and its lasting record | Loomio |
    translation: |-
      | Käyttötarkoitus | Sopiva paikka |
      |---|---|
      | Nopeat kysymykset, vapaamuotoinen keskustelu ja ajankohtaiset päivitykset | Keskustelukanava, kuten Slack, Teams, Matrix tai Discord |
      | Yhteistyössä muokattava asiakirja | Jaettu asiakirjatyökalu |
      | Tehtävien jakaminen ja niiden valmistumisen seuraaminen | Tehtävien- tai projektinhallintatyökalu |
      | Rajattu keskustelu, laaja osallistuminen, päätös ja pysyvä merkintä siitä | Loomio |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  50fae2027411e538:
    english: Link to documents and other systems from the group description or discussion context. Use [chat integrations](/en/user_manual/integrations/chatbots) to bring important Loomio activity into a channel people already follow.
    translation: Lisää linkit asiakirjoihin ja muihin järjestelmiin ryhmän kuvaukseen tai keskustelun taustatietoihin. [Keskustelukanavien integraatioilla](/en/user_manual/integrations/chatbots) voit tuoda tärkeät Loomion tapahtumat kanavaan, jota ihmiset jo seuraavat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ed67af54bdf1c775:
    english: Tell members what you expect to happen in Loomio. A simple boundary such as “important discussions and decisions go in Loomio; quick coordination stays in chat” is easier to adopt than an unexplained new tool.
    translation: Kerro jäsenille, mitä Loomiossa on tarkoitus tehdä. Selkeä työnjako, kuten ”tärkeät keskustelut ja päätökset käydään Loomiossa, nopea koordinointi keskustelukanavassa”, on helpompi omaksua kuin uusi työkalu ilman selitystä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0a799d7911a46f6f:
    english: "## Decide how your group decides"
    translation: "## Päätä, miten ryhmänne tekee päätöksiä"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e1c64de2dc68593:
    english: Loomio does not require every group, or every decision, to use the same process. Some groups arrive with established rules. Others use Loomio while they develop a clearer decision-making practice together.
    translation: Loomio ei edellytä, että kaikki ryhmät tai päätökset noudattavat samaa prosessia. Joillakin ryhmillä on valmiit säännöt. Toiset käyttävät Loomiota samalla, kun ne kehittävät yhdessä selkeämpää päätöksentekotapaa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6d0c0f50959ab9d6:
    english: "### If your process is already established"
    translation: "### Jos päätöksentekotapanne on jo vakiintunut"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5fbfe86e935d5a8c:
    english: 'Translate the group''s existing requirements into Loomio. Before running a formal decision, make sure participants can tell:'
    translation: 'Sovita ryhmän nykyiset vaatimukset Loomioon. Varmista ennen muodollista päätöstä, että osallistujille on selvää:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9a1b89bd4c5fe02c:
    english: |-
      - which kinds of decisions can be made in Loomio;
      - who provides input and who has authority to decide;
      - who is eligible to vote;
      - whether a [quorum](/en/user_manual/polls/quorum) is required;
      - whether the decision requires a majority, supermajority, unanimous agreement, consent, or another [vote share requirement](/en/user_manual/polls/vote_share_requirements);
      - whether the decision takes effect when its outcome is published or must be ratified elsewhere; and
      - who will record and carry out the outcome.
    translation: |-
      - millaisia päätöksiä Loomiossa voi tehdä;
      - ketkä antavat näkemyksensä ja kenellä on päätösvalta;
      - ketkä saavat äänestää;
      - vaaditaanko [päätösvaltaisuutta](/en/user_manual/polls/quorum);
      - vaaditaanko päätökseen enemmistöä, määräenemmistöä, yksimielisyyttä, suostumusta tai muuta [ääniosuutta koskevaa vaatimusta](/en/user_manual/polls/vote_share_requirements);
      - tuleeko päätös voimaan, kun siitä julkaistaan yhteenveto, vai pitääkö se vahvistaa muualla; ja
      - kuka kirjaa päätöksen ja panee sen toimeen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4b48b6e0aff5cfc0:
    english: If your constitution, bylaws, policy, or local law governs electronic decisions, make sure the Loomio process follows those requirements. Configure [delegated voters](/en/user_manual/groups/delegated_voters), proposal settings, and [poll templates](/en/user_manual/polls/poll_templates) to make the agreed process easy to repeat.
    translation: Jos sähköistä päätöksentekoa säätelevät ryhmän säännöt, ohjeet tai paikallinen laki, varmista, että Loomiossa käytettävä prosessi täyttää niiden vaatimukset. Määritä [valtuutetut äänestäjät](/en/user_manual/groups/delegated_voters), ehdotusten asetukset ja [kyselymallit](/en/user_manual/polls/poll_templates) niin, että sovittu prosessi on helppo toistaa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b068624ed6c7c6b3:
    english: "### If your group is still deciding"
    translation: "### Jos ryhmänne päättää vielä toimintatavasta"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  14449de544d28a6b:
    english: 'Start a discussion about how decisions should be made. Instead of beginning with a voting tool, ask the group to consider:'
    translation: 'Aloita keskustelu siitä, miten päätökset pitäisi tehdä. Ennen kuin valitsette äänestystavan, pyydä ryhmää pohtimaan:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f65b39a74ae25ed7:
    english: |-
      - What kinds of decisions do we make?
      - Who is affected, who should be consulted, and who is responsible for deciding?
      - Which decisions need advice, consent, consensus, a vote, or delegated authority?
      - What level of participation or support makes a decision valid?
      - How will we respond to objections, tied results, or insufficient participation?
      - How will we communicate, record, review, and change a decision?
    translation: |-
      - Millaisia päätöksiä teemme?
      - Keihin päätökset vaikuttavat, keitä pitäisi kuulla ja kuka vastaa päätöksestä?
      - Mitkä päätökset edellyttävät neuvojen pyytämistä, suostumusta, yhteisymmärrystä, äänestystä tai siirrettyä päätösvaltaa?
      - Kuinka laaja osallistuminen tai kannatus tekee päätöksestä pätevän?
      - Miten käsittelemme vastalauseet, tasatulokset tai liian vähäisen osallistumisen?
      - Miten tiedotamme päätöksestä, kirjaamme sen, arvioimme sitä ja muutamme sitä?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ce7c0af2ad170b5c:
    english: The answers may be different for an operational decision, a policy, an election, and a constitutional change. See [Making decisions](/en/guides/making_decisions) to compare several complete processes.
    translation: Vastaukset voivat olla erilaisia käytännön päätöksessä, linjauksessa, vaalissa ja sääntömuutoksessa. [Päätöksenteko-oppaassa](/en/guides/making_decisions) voit vertailla useita kokonaisia prosesseja.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  aac26fc96b90744d:
    english: If the group is not ready to settle every rule, agree on a provisional process for one low-risk decision. State what the result will mean before asking people to participate, publish an outcome, then review how the process worked. Record what the group learns in its description, governance documents, or reusable templates.
    translation: Jos ryhmä ei ole valmis sopimaan kaikista säännöistä, sopikaa väliaikaisesta prosessista yhtä vähäriskistä päätöstä varten. Kerro ennen osallistumispyyntöä, mitä tulos tarkoittaa. Julkaise päätöksen yhteenveto ja arvioikaa sitten, miten prosessi toimi. Kirjaa ryhmän opit sen kuvaukseen, hallintoa koskeviin asiakirjoihin tai uudelleenkäytettäviin malleihin.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  23ed8fb3e887afbc:
    english: "## Invite people"
    translation: "## Kutsu ihmiset mukaan"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a5d369ad9df691fe:
    english: "[Invite people](/en/user_manual/groups/inviting_people) with a short personal message that explains:"
    translation: "[Kutsu ihmiset mukaan](/en/user_manual/groups/inviting_people) lyhyellä henkilökohtaisella viestillä, jossa kerrot:"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3383207ff2fcc99b:
    english: |-
      - why the group is using Loomio;
      - what you are asking them to do first;
      - when you need their response; and
      - where they can get help.
    translation: |-
      - miksi ryhmä käyttää Loomiota;
      - mitä pyydät heitä tekemään ensin;
      - milloin tarvitset heidän vastauksensa; ja
      - mistä he saavat apua.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  282ef8673815823e:
    english: You can begin with a small group of people who will actively test the process, or invite the whole group when everyone needs to participate from the start. In either case, have a discussion ready for them rather than inviting people into an empty group.
    translation: Voit aloittaa pienellä joukolla, joka kokeilee prosessia aktiivisesti, tai kutsua koko ryhmän, jos kaikkien pitää osallistua alusta asti. Valmistele kummassakin tapauksessa keskustelu kutsuttuja varten, jotta he eivät saavu tyhjään ryhmään.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cd6511a78ce7c9b7:
    english: "## Help everyone participate once"
    translation: "## Auta kaikkia osallistumaan kerran"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a37273687b4f4b0:
    english: The first objective is for each person to cross the threshold from receiving an invitation to contributing something.
    translation: Ensimmäinen tavoite on, että jokainen siirtyy kutsun vastaanottamisesta osallistumiseen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ce285f27cca389c4:
    english: 'Ask people to:'
    translation: 'Pyydä ihmisiä:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d0b9e80af995edff:
    english: |-
      1. sign in and add a profile photo;
      2. open the welcome or practice discussion;
      3. post a short comment or reaction; and
      4. vote in a low-stakes proposal and, if useful, leave a reason.
    translation: |-
      1. kirjautumaan sisään ja lisäämään profiilikuvan;
      2. avaamaan tervetulo- tai harjoituskeskustelun;
      3. kirjoittamaan lyhyen kommentin tai lisäämään reaktion; ja
      4. äänestämään ehdotuksessa, jolla ei ole suuria seurauksia, ja halutessaan kertomaan perustelunsa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  919e32e7adb7c4c8:
    english: Members do not need to create a password. They can [sign in by email](/en/user_manual/users/signing_in), and they can reply to eligible discussion emails without first navigating back to the thread.
    translation: Jäsenten ei tarvitse luoda salasanaa. He voivat [kirjautua sisään sähköpostilla](/en/user_manual/users/signing_in) ja vastata keskustelun sähköpostiviesteihin suoraan, kun vastaaminen on käytössä. Heidän ei tarvitse ensin palata keskusteluketjuun.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  22ceb7104d416acf:
    english: "## Use notifications deliberately"
    translation: "## Käytä ilmoituksia harkiten"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dd99e6dd5c93d9ee:
    english: Access to content and notification about it are separate. Group members can find discussions in their group even when they were not notified immediately.
    translation: Pääsy sisältöön ja ilmoitukset siitä ovat eri asioita. Ryhmän jäsenet löytävät ryhmänsä keskustelut, vaikka heille ei ilmoitettaisi niistä heti.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0e20732d957eb282:
    english: When starting a discussion, notify the people whose input is needed at that stage. Use @mentions and replies when asking particular people to respond. When voting opens later, invite the eligible voters.
    translation: Kun aloitat keskustelun, ilmoita siitä ihmisille, joiden näkemyksiä tarvitaan siinä vaiheessa. Käytä @mainintoja ja vastauksia, kun pyydät tiettyjä ihmisiä vastaamaan. Kun äänestys myöhemmin alkaa, kutsu äänioikeutetut mukaan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  43339ff0f3d30a50:
    english: If you create a discussion and poll together only to capture a vote, avoid sending a discussion invitation immediately followed by a poll invitation. Either start the discussion without notifying people and invite them through the poll, or run a [standalone poll](/en/user_manual/polls/intro_to_decisions#without-a-discussion).
    translation: Jos luot keskustelun ja kyselyn yhdessä vain äänestyksen järjestämistä varten, vältä lähettämästä keskustelukutsua ja heti sen perään kyselykutsua. Voit aloittaa keskustelun ilmoittamatta siitä ihmisille ja kutsua heidät kyselyn kautta tai järjestää [erillisen kyselyn](/en/user_manual/polls/intro_to_decisions#without-a-discussion).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  467cf9d1e5bd2973:
    english: Show members the [Catch-up and notification settings](/en/user_manual/users/email_settings), especially if they do not expect to visit Loomio every day.
    translation: Näytä jäsenille [yhteenvetosähköpostin ja ilmoitusten asetukset](/en/user_manual/users/email_settings), varsinkin jos he eivät aio käydä Loomiossa joka päivä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ebe7764d64b17823:
    english: "## Complete the first process"
    translation: "## Vie ensimmäinen prosessi päätökseen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9a165c59ba0aed5a:
    english: 'A first process should demonstrate the complete pattern:'
    translation: 'Ensimmäisessä prosessissa kannattaa käydä läpi kaikki vaiheet:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8bc60d4319adf204:
    english: |-
      1. Introduce the topic and provide context.
      2. Invite discussion or questions when they are needed.
      3. Start the appropriate proposal or poll.
      4. Remind people who have not participated when necessary.
      5. Publish an [outcome](/en/user_manual/polls/outcomes) stating what was decided and what happens next.
    translation: |-
      1. Esittele aihe ja anna tarvittavat taustatiedot.
      2. Kutsu jäsenet keskustelemaan tai esittämään kysymyksiä, kun siihen on tarvetta.
      3. Aloita sopiva ehdotus tai kysely.
      4. Muistuta tarvittaessa niitä, jotka eivät ole vielä osallistuneet.
      5. Julkaise [tulos](/en/user_manual/polls/outcomes), jossa kerrot, mitä päätettiin ja mitä tapahtuu seuraavaksi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1235244007a8559b:
    english: The outcome closes the loop and creates a record that members can return to later. Afterward, ask what worked, adjust the process, and choose the next recurring piece of work to run in Loomio.
    translation: Tulos päättää prosessin ja tallentaa päätöksen, johon jäsenet voivat palata myöhemmin. Kysy sen jälkeen, mikä toimi, kehitä prosessia ja valitse seuraava säännöllisesti toistuva tehtävä Loomiossa hoidettavaksi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c699f8804cdd41b1:
    english: For a facilitated sequence from discussion to decision, see [Making decisions](/en/guides/making_decisions). For board-specific practices, see [Introducing Loomio to your board](/en/guides/board_processes/introduce).
    translation: Ohjeita keskustelusta päätökseen etenevän prosessin ohjaamiseen löydät sivulta [Päätöksenteko](/en/guides/making_decisions). Hallituksen työskentelyyn liittyviä käytäntöjä käsitellään sivulla [Loomion käyttöönotto hallituksessa](/en/guides/board_processes/introduce).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
