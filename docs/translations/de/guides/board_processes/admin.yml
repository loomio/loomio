  00be127a2f453ab3:
    english: 'Admin and keeping good records for audit is an important, and often legal requirement for your board or committee. '
    translation: Für deinen Vorstand oder Ausschuss ist eine gute Dokumentation für Prüfungen wichtig und oft gesetzlich vorgeschrieben.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e4617bf502879b0d:
    english: 'Increasingly, electronic records are supplanting the requirement for paper.  '
    translation: Elektronische Aufzeichnungen ersetzen zunehmend Papierunterlagen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e1d587f71cdcc6c1:
    english: 'However digital tools enable your board to do much more than just file meeting minutes.  '
    translation: Mit digitalen Werkzeugen kann dein Vorstand jedoch mehr tun, als nur Sitzungsprotokolle abzulegen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f249e5f83d487c4b:
    english: 'Transform your board: '
    translation: 'So kann sich die Arbeit deines Vorstands verändern:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fd8154295c7350b7:
    english: |-
      *“Our board group has been particularly transformative, enabling continuous governance, improving response times and increasing our agility, resilience and sustainability… Loomio saves us thousands of pounds every year”*
      - Austen Cordasco Co-operative Assistance Network Limited (CAN) Business support services , United Kingdom
    translation: |-
