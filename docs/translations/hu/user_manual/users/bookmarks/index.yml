  5d590d1d8ab9b956:
    english: |-
      Bookmarks are a personal list of Loomio items you want to return to. Your
      bookmarks are visible only to you and saving an item does not notify anyone
      else.
    translation: |-
      A könyvjelzők a Loomio azon elemeinek személyes listája, amelyekhez vissza szeretnél térni.
      A könyvjelzőidet csak te láthatod. Ha elmentesz egy könyvjelzőt, arról senki más nem kap
      értesítést.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aac40737df991d52:
    english: 'You can bookmark:'
    translation: 'Könyvjelzővel láthatod el a következőket:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0f6c7e4161c72c18:
