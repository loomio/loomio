[reject]
; Record reverse-DNS results without rejecting at connection time. Legitimate
; relays are sometimes missing PTR records or use forward DNS that changes
; during delivery. Sender authorization is decided from SPF/DKIM/DMARC and
; Loomio's signed reply routes after the message is received.
; reject if the IP address has no PTR record
no_rdns=false

; reject if the FCrDNS test fails
no_fcrdns=false

; reject if the PTR points to a hostname without a valid TLD
invalid_tld=false

; Large legitimate providers, including Amazon SES, use names such as
; a14-82.smtp-out.amazonses.com that this heuristic classifies as generic.
; Examples of names classified as generic:
; 1.2.3.4.in.addr.arpa
; c-67-171-0-90.hsd1.wa.comcast.net
generic_rdns=false
