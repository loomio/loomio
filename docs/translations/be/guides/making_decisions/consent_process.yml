    translation: Гэтае кіраўніцтва апісвае ўвесь працэс атрымання згоды. Пра тое, як стварыць адну прапанову для атрымання згоды і зразумець яе вынікі, чытайце ў раздзеле [«Згода»](/en/user_manual/polls/proposals/consent/).
