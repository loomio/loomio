  9c3f3c8a80729fbf:
    english: "### Method and quota"
    translation: "### Menetelmä ja kiintiö"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  feee79b9f6e92de3:
    english: At the top, you'll see the counting method (Scottish STV or Meek STV) and quota type (Droop or Hare) along with the quota — the number of votes a candidate needed to win a seat.
    translation: Ylhäällä näet laskentamenetelmän (Scottish STV tai Meek STV), kiintiötyypin (Droop tai Hare) ja kiintiön eli äänimäärän, jonka ehdokas tarvitsi tullakseen valituksi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e180eb800c3435cd:
    english: "### Elected candidates"
    translation: "### Valitut ehdokkaat"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8db8b2466db56f2b:
    english: 'A summary table of the winners with five columns:'
    translation: 'Valitut ehdokkaat esitetään viis saraketta sisältävässä yhteenvetotaulukossa:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f998ffc721953501:
    english: |-
      | Column | Meaning |
      |--------|---------|
      | **Candidate** | The name of the elected candidate |
      | **Round elected** | Which counting round they reached the quota and won a seat. Round 1 means they won on first preferences alone; higher rounds mean they needed transferred votes from eliminated or surplus candidates. |
      | **First preferences** | How many voters ranked this candidate as their first choice. This shows a candidate's direct support before any vote transfers. |
      | **Final tally** | The candidate's vote tally at the moment they were elected. Due to vote transfers, this is often higher than their first preferences. |
      | **Surplus** | How much the candidate's final tally exceeded the quota (final tally minus quota). A larger surplus means stronger support beyond what was needed to win. In Scottish STV, this surplus is redistributed to voters' next preferences. |
    translation: |-
      | Sarake | Merkitys |
      |--------|---------|
      | **Ehdokas** | Valitun ehdokkaan nimi |
      | **Kierros valittu** | Laskentakierros, jolla ehdokas saavutti kiintiön ja sai paikan. Kierros 1 tarkoittaa, että ehdokas valittiin pelkillä ensimmäisillä mieltymyksillä. Myöhemmillä kierroksilla valittu tarvitsi pudonneilta ehdokkailta tai muiden ehdokkaiden ylijäämästä siirtyneitä ääniä. |
      | **Ensimmäiset mieltymykset** | Kuinka moni äänestäjä asetti ehdokkaan ensimmäiseksi. Luku kertoo ehdokkaan suoran kannatuksen ennen äänten siirtoja. |
      | **Loppusumma** | Ehdokkaan äänimäärä valintahetkellä. Äänten siirtojen vuoksi se on usein suurempi kuin ensimmäisten mieltymysten määrä. |
      | **Ylijäämä** | Kuinka paljon ehdokkaan loppusumma ylitti kiintiön (loppusumma miinus kiintiö). Suurempi ylijäämä kertoo vahvemmasta kannatuksesta kuin valintaan tarvittiin. Scottish STV -menetelmässä ylijäämä jaetaan äänestäjien seuraaville ehdokkaille. |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  efc41c326d955758:
    english: If the count results in a tie — where eliminating any of the remaining candidates would change the outcome — those candidates are shown in a separate table rather than arbitrarily choosing a winner.
    translation: Jos laskennassa syntyy tasatilanne, jossa kenen tahansa jäljellä olevan ehdokkaan pudottaminen muuttaisi tulosta, ehdokkaat näytetään erillisessä taulukossa. Voittajaa ei valita mielivaltaisesti.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8a6ae4ad28f0acf6:
    english: "### Round-by-round details"
    translation: "### Kierros kierrokselta yksityiskohdat"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3d907145fd075144:
    english: 'Expand **Round-by-round details** to see vote transfers and eliminations. Each row is a candidate and each column is a counting round:'
    translation: 'Avaa **Kierros kierrokselta yksityiskohdat**, niin näet äänten siirrot ja ehdokkaiden putoamiset. Kukin rivi kuvaa ehdokasta ja kukin sarake laskentakierrosta:'
    status: machine
