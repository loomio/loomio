---
navigation_title: Datenexport
blocks:
  '053719812e2be1ea':
    english: "# Group data backup or export"
    translation: "# Gruppendaten sichern oder exportieren"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  42721518a91907da:
    english: 'With the group data export feature you can:'
    translation: 'Mit der Funktion zum Exportieren von Gruppendaten kannst du:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f978c97e52e0b00a:
    english: |-
      - Download a file containing member data to audit group membership.
      - Download content of your group including text of threads and polls for archive or analysis.
      - Open poll results in a spreadsheet or scripting language.
      - [Print or save PDF's of a thread or poll for archival purposes.](#print-thread-to-pdf)
      - Move your group, including all users, threads, polls, and files to another Loomio server.
    translation: |-
      - Eine Datei mit Mitgliederdaten herunterladen, um die Mitgliedschaft in deiner Gruppe zu prüfen.
      - Die Inhalte deiner Gruppe einschließlich der Texte von Diskussionen und Abstimmungen zur Archivierung oder Analyse herunterladen.
      - Abstimmungsergebnisse in einem Tabellenprogramm oder einer Skriptsprache öffnen.
      - [Eine Diskussion oder Abstimmung zur Archivierung drucken oder als PDF speichern.](#print-thread-to-pdf)
      - Deine Gruppe einschließlich aller Benutzer, Diskussionen, Abstimmungen und Dateien auf einen anderen Loomio-Server übertragen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  94b3081b62cd0a45:
    english: If you ever want to move from Loomio managed servers [to your own](https://github.com/loomio/loomio), you can use this feature.
    translation: Wenn du von einem von Loomio betriebenen Server [auf einen eigenen Server](https://github.com/loomio/loomio) wechseln möchtest, kannst du diese Funktion nutzen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  223d5690921676c4:
    english: If you're running your own Loomio server, and would rather not anymore, Loomio offer managed hosting in USA, EU and Australia. If you'd like to migrate your group to one of these servers, please [contact us](/contact).
    translation: Wenn du deinen eigenen Loomio-Server nicht länger betreiben möchtest, bietet Loomio Hosting in den USA, der EU und Australien an. Möchtest du deine Gruppe auf einen dieser Server übertragen, [kontaktiere uns](/contact).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cabd4ab01146ea7c:
    english: "[Contact us](/contact) if you would like to transfer your Loomio group from Loomio's global hosted service at loomio.com to one of our regional services; loomio.eu for Europe or loomio.nz for Australia and New Zealand."
    translation: "[Kontaktiere uns](/contact), wenn du deine Loomio-Gruppe vom globalen Hostingdienst auf loomio.com auf einen unserer regionalen Dienste übertragen möchtest: loomio.eu für Europa oder loomio.nz für Australien und Neuseeland."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7f2ecd944aa32dbf:
    english: "## Export data"
    translation: "## Daten exportieren"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  84dc26a340a5515c:
    english: Open the group drop down menu by clicking on the three dots, and select **Export group data**.
    translation: Öffne das Gruppenmenü über die drei Punkte und wähle **Gruppendaten exportieren**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  aff0fe2a7c8a4387:
    english: "![Export group data action in the Oatmilk Cooperative menu](group_export_group_data.png)"
    translation: "![Aktion „Gruppendaten exportieren“ im Menü der Oatmilk Cooperative](group_export_group_data.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  89b404c37ca3eacb:
    english: "### Export group data as CSV"
    translation: "### Gruppendaten als CSV exportieren"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fe148be194ea7678:
    english: "*For working with the group data in a spreadsheet, such as with MS Excel or Google Sheets.*"
    translation: "*Wenn du die Gruppendaten in einem Tabellenprogramm wie MS Excel oder Google Sheets bearbeiten möchtest.*"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8f19e7d0c067abec:
    english: Loomio prepares the CSV file in the background and emails you a download link when it is ready. The link is available for one week.
    translation: Loomio erstellt die CSV-Datei im Hintergrund und sendet dir per E-Mail einen Downloadlink, sobald sie bereit ist. Der Link ist eine Woche lang verfügbar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4272b6e6d986f710:
    english: "### Export group data as HTML"
    translation: "### Gruppendaten als HTML exportieren"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e3076a79c179d09d:
    english: "*For when you want to save the data for archival purposes.*"
    translation: "*Wenn du die Daten archivieren möchtest.*"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5936d07e505560ae:
    english: Loomio prepares the HTML file in the background and emails you a download link when it is ready. The link is available for one week.
    translation: Loomio erstellt die HTML-Datei im Hintergrund und sendet dir per E-Mail einen Downloadlink, sobald sie bereit ist. Der Link ist eine Woche lang verfügbar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c81ccbae7a016e39:
    english: "### Export group data as JSON"
    translation: "### Gruppendaten als JSON exportieren"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  857b562cb95497c6:
    english: "*For when you want to move your group data to a self-hosted Loomio instance.*"
    translation: "*Wenn du deine Gruppendaten auf eine selbst gehostete Loomio-Instanz übertragen möchtest.*"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a1b7f7b282933a3c:
    english: 'You must be an admin of the group to export it. The JSON export includes:'
    translation: 'Du musst Administrator der Gruppe sein, um sie zu exportieren. Der JSON-Export enthält:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6a0b307d50fa35cf:
    english: |-
      - The group, its members and membership requests
      - Threads, comments, reactions, tags, templates, notifications and related records from the included groups
      - Polls, options, votes and outcomes; an anonymous poll is included only after it has closed
      - Subgroups you belong to
      - Open and closed subgroups when you export their parent group as a parent group admin, even if you do not belong to those subgroups
      - References to files and images attached to the included content
    translation: |-
      - Die Gruppe, ihre Mitglieder und Mitgliedschaftsanfragen
      - Diskussionen, Kommentare, Reaktionen, Schlagwörter, Vorlagen, Benachrichtigungen und zugehörige Datensätze aus den enthaltenen Gruppen
      - Abstimmungen, Optionen, Stimmen und Fazits; eine anonyme Abstimmung ist erst nach ihrem Abschluss enthalten
      - Untergruppen, denen du angehörst
      - Offene und geschlossene Untergruppen, wenn du ihre übergeordnete Gruppe als deren Administrator exportierst, auch wenn du diesen Untergruppen nicht angehörst
      - Verweise auf Dateien und Bilder, die an die enthaltenen Inhalte angehängt sind
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4dee92f966ec24c9:
    english: 'The JSON export does not include:'
    translation: 'Der JSON-Export enthält nicht:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a40deeed41d9937e:
    english: |-
      - Secret subgroups you do not belong to, including their membership and content
      - Subgroups awaiting deletion
      - Anonymous polls that have not closed
      - Direct threads and polls that do not belong to the group
    translation: |-
      - Geheime Untergruppen, denen du nicht angehörst, einschließlich ihrer Mitgliedschaften und Inhalte
      - Untergruppen, die zur Löschung vorgemerkt sind
      - Anonyme Abstimmungen, die noch nicht abgeschlossen sind
      - Direkte Diskussionen und Abstimmungen, die nicht zur Gruppe gehören
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d789fbf93f8cebeb:
    english: You'll shortly receive an email with a link to downloading the JSON file.
    translation: Du erhältst in Kürze eine E-Mail mit einem Link zum Herunterladen der JSON-Datei.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
