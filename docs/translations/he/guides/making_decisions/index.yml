  b27fab33a1dd5176:
    english: 'These guides explain complete decision processes: how to frame a decision, involve the right people, use discussion and proposals, respond to concerns, and record an outcome.'
    translation: 'המדריכים האלה מסבירים תהליכי קבלת החלטות מתחילתם ועד סופם: איך להגדיר את ההחלטה, לשתף את האנשים המתאימים, לקיים דיון ולהשתמש בהצעות, להתייחס לחששות ולתעד מסקנה.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bcbe5e3fd75700a6:
    english: They are different from the proposal-template pages. A [proposal template](/en/user_manual/polls/proposals/) explains one proposal and its response options. A decision process can use several proposals over time.
    translation: המדריכים האלה שונים מהעמודים על תבניות להצעות. [תבנית להצעה](/en/user_manual/polls/proposals/) מסבירה הצעה אחת ואת אפשרויות התגובה עליה. תהליך קבלת החלטות יכול לכלול כמה הצעות לאורך זמן.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  af00d65d38e41f8b:
    english: "## Choose a process"
    translation: "## בחירת תהליך"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f41e345421a1a1e8:
    english: |-
      | Process | Who decides? | Main question |
      |---|---|---|
      | [Simple decision process](simple_decision_process) | Defined by the group | How can we discuss, test, and decide? |
      | [Advice process](advice_process) | A person or delegated team | What advice should the decision maker consider? |
      | [Consent process](consent_process) | The group | Is the proposal safe to try without a meaningful objection? |
      | [Consensus process](consensus_process) | The group | Can we reach collective agreement? |
    translation: |-
      | תהליך | מי מקבל את ההחלטה? | השאלה המרכזית |
      |---|---|---|
      | [תהליך החלטה פשוט](simple_decision_process) | לפי הגדרת הקבוצה | איך לדון, לבחון ולקבל החלטה? |
      | [תהליך היוועצות](advice_process) | אדם אחד או צוות שקיבל סמכות | אילו עצות יש להביא בחשבון בעת קבלת ההחלטה? |
      | [תהליך הסכמה ללא התנגדות](consent_process) | הקבוצה | האם אפשר לנסות את ההצעה ללא התנגדות מהותית? |
      | [תהליך קונצנזוס](consensus_process) | הקבוצה | האם אפשר להגיע להסכמה משותפת? |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d2843889568043c0:
    english: Use the process required by your group's governing rules or decision policy. Different kinds of decisions may use different processes.
    translation: יש להשתמש בתהליך שנקבע בכללי הניהול של הקבוצה או במדיניות קבלת ההחלטות שלה. סוגים שונים של החלטות עשויים לדרוש תהליכים שונים.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bb120914edd79d13:
    english: If you only need help choosing a response format, compare [Proposals](/en/user_manual/polls/proposals/) and [Polls](/en/user_manual/polls/proposal_types/). If you administer the reusable choices shown when someone selects **Start a vote**, see [Poll templates](/en/user_manual/polls/poll_templates/).
    translation: אם צריך רק לבחור את סוג התגובות, ניתן להשוות בין [הצעות](/en/user_manual/polls/proposals/) לבין [משאלים](/en/user_manual/polls/proposal_types/). למידע על ניהול האפשרויות לשימוש חוזר שמופיעות בעת בחירת **התחל הצבעה**, ראו [תבניות למשאלים](/en/user_manual/polls/poll_templates/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
