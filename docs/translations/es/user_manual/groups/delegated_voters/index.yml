  9cfb3b7835dc5cb0:
    english: If some members of your group should have voting rights while others should not, you can use the "Make delegate" feature to identify those people with voting rights. There is a corresponding "Revoke delegate" action too.
    translation: Si algunas personas de tu grupo deben tener derecho a voto y otras no, puedes usar **Hacer delegado** para identificar a quienes pueden votar. También puedes usar **Revocar delegado** para retirar ese derecho.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e017eafb51368777:
    english: Use delegates when people should share the same discussion space but only a defined set, such as directors or elected representatives, may vote. This is usually simpler than maintaining a second subgroup whose only purpose is to separate voters from non-voters.
    translation: Usa delegados cuando todas las personas deban compartir el mismo espacio de discusión, pero solo un grupo definido, como la junta directiva o los representantes electos, pueda votar. Suele ser más sencillo que mantener un segundo subgrupo solo para separar a quienes pueden votar de quienes no.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1942a47ae47ca813:
    english: Use a private subgroup instead when its members also need discussions, files, or membership information that other members must not see.
    translation: Usa un subgrupo privado si sus integrantes también necesitan discusiones, archivos o información sobre sus miembros que los demás no deban ver.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
