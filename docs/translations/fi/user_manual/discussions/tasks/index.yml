  bea1dad1b0b47107:
    english: Use tasks in threads and comments to name an action, assign it to someone, set a due date, and track whether it is complete.
    translation: Tehtävillä voit kirjata toimenpiteitä keskusteluketjuihin ja kommentteihin, antaa niitä muille, asettaa eräpäiviä ja seurata niiden valmistumista.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2398b3493bad759e:
    english: "## Add a task"
    translation: "## Lisää tehtävä"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c240866e019fab51:
    english: While writing a thread or comment, expand the formatting toolbar and click **Task list**. Type the action beside the checkbox.
    translation: Kun kirjoitat keskusteluketjua tai kommenttia, laajenna muotoilutyökalurivi ja napsauta **Tehtävälista**. Kirjoita tehtävä valintaruudun viereen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f7d4f63b321e9af1:
    english: "## Name and assign the task to a person"
    translation: "## Nimeä tehtävä ja anna se toiselle"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5ea902e45aaf1f7a:
    english: Use an @mention in the task to assign it to a group member. An **Add due date** button appears once the task has an assignee.
    translation: Anna tehtävä ryhmän jäsenelle mainitsemalla hänet tehtävässä @-merkillä. **Lisää eräpäivä** -painike tulee näkyviin, kun tehtävälle on nimetty vastuuhenkilö.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1134aedee6cafd8c:
    english: Tasks assigned to you appear on your **Tasks** page. Open **Tasks** from the sidebar to see them grouped by thread or poll.
    translation: Sinulle annetut tehtävät näkyvät **Tehtävät**-sivulla. Avaa **Tehtävät** sivupalkista, niin näet ne keskusteluketjun tai kyselyn mukaan ryhmiteltyinä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5eae519b81c94f7a:
    english: "## Set a reminder"
    translation: "## Aseta muistutus"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  561597d43d716888:
    english: Click **Add due date** to choose a due date and when Loomio should email the assignee a reminder. You can also remove an existing due date from this dialog.
    translation: Napsauta **Lisää eräpäivä** ja valitse eräpäivä sekä ajankohta, jolloin Loomio lähettää vastuuhenkilölle muistutuksen sähköpostitse. Voit myös poistaa aiemmin asetetun eräpäivän tästä valintaikkunasta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bd36c23f297b0429:
    english: "## Mark it as done"
    translation: "## Merkitse tehtävä tehdyksi"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  59b6138f35694902:
    english: Click the checkbox beside a task to mark it as done. You can do this while editing the text, while reading it if you are the assignee, or from the **Tasks** page. Click it again to reopen the task.
    translation: Merkitse tehtävä tehdyksi napsauttamalla sen vieressä olevaa valintaruutua. Voit tehdä sen muokatessasi tekstiä, lukiessasi sitä, jos tehtävä on annettu sinulle, tai **Tehtävät**-sivulla. Avaa tehtävä uudelleen napsauttamalla valintaruutua toisen kerran.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
