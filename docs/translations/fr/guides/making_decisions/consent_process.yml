  '09907f3ec328e9d2':
    english: "## Applying the Consent process on Loomio"
    translation: "## Appliquer le processus de consentement sur Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d7c91a6160b45cf:
    english: |-
      | **Consent process** | **On Loomio** |
      |---|---|
      | You notice a problem or opportunity and take the initiative. |  |
      | **Present a proposal** <br /><br />Write a clear and concise proposal and share it with people impacted. Describe it in a way so that others will understand what you are proposing. | Start a Loomio **discussion**. <br /><br />Name the proposal in the discussion title, and describe it in the context. |
      | **Questions** (Optional) <br /><br />Invite clarifying questions to help people understand the proposal. <br /><br />*“A clarifying question round helps make sure everyone understands the proposal before they say what they think about it.”* | Run a **Question round**. If it is hidden, a group administrator can make it available from [Poll templates](/en/user_manual/polls/poll_templates/). <br /><br />Ask “what do you need to know so you understand the proposal?” |
      | **Reactions** <br /><br />Invite people to offer reactions and comments to improve the proposal. <br /><br />This is a sensing and responding round - *to actively sense and interpret information from the group and then respond or adapt accordingly.* | Run a **[Sense check](/en/user_manual/polls/proposals/sense_check/)** proposal. <br /><br />*In the title:* Name the proposal and say this is an opportunity to react and comment. <br /><br />*In the proposal details:* Clearly frame the proposal and say why it is important.  Include any background information necessary and a link to the current proposal version.  <br /><br />Invite everyone to respond, and to do so before the proposal closes.  |
      | **Amendment** <br /><br />Consider comments and suggestions from people and amend the proposal as appropriate for the good of your organization. <br /><br />Consider any amendments you want to make for the new proposal version. | Reply to comments and suggestions raised in the Sense check proposal. <br /><br />State an **outcome** to summarize the results of the proposal.  <br /><br />Note any concerns or new information discovered, and outline how the proposal will be amended. <br /><br />Say what will happen next and notify people about the outcome. |
      | **Objections** <br /><br />Present the amended proposal version and invite people to state valid objections - objections that might cause harm. <br /><br />Respond to and integrate each objection by amending the proposal. | Run a **[Consent proposal](/en/user_manual/polls/proposals/consent/)** with the amended proposal. <br /><br />*In the title:* Name the decision to be made. <br /><br />*In the proposal details:* Present the proposal and invite people to vote consent or to state a valid objection - an objection that might cause harm.  Remember we are seeking consent that the proposal is 'safe to try'. <br /><br />Respond to and integrate each objection, creating an amended version of the proposal. <br /><br />Notify everyone that there has been a further amendment, and invite them to reconsider their Consent and “change your vote”. <br /><br />Or run successive Consent proposals as necessary until objections are resolved. |
      | **Outcome** <br /><br />When there are no remaining objections and everyone has consented, the result of the decision is announced. | State an **outcome**. <br /><br />Close the proposal. State an outcome and notify everyone involved. <br /><br />State the decision made and thank people for participation in the process. <br /><br />Summarize results of the process and say what will happen next. <br /><br />If no valid objections remain, state that there is consent the proposal is 'safe to try'. <br /><br />The outcome statement is an important record of the decision for future reference. |
    translation: |-
      | **Processus de consentement** | **Sur Loomio** |
      |---|---|
      | Vous constatez un problème ou une occasion à saisir et prenez l’initiative. |  |
      | **Présenter une proposition** <br /><br />Rédigez une proposition claire et concise, puis partagez-la avec les personnes concernées. Décrivez-la de manière à ce que chacun comprenne ce que vous proposez. | Lancez une **discussion** sur Loomio. <br /><br />Indiquez le nom de la proposition dans le titre de la discussion et décrivez-la dans le contexte. |
      | **Questions** (facultatif) <br /><br />Invitez les personnes à poser des questions de clarification pour les aider à comprendre la proposition. <br /><br />*« Un tour de questions de clarification permet de s’assurer que tout le monde comprend la proposition avant de donner son avis. »* | Lancez un **Tour de questions**. S’il est masqué, une personne administratrice du groupe peut l’activer dans les [Modèles de sondage](/en/user_manual/polls/poll_templates/). <br /><br />Demandez : « De quoi avez-vous besoin pour comprendre la proposition ? » |
      | **Réactions** <br /><br />Invitez les personnes à réagir et à faire des commentaires pour améliorer la proposition. <br /><br />Ce tour sert à recueillir les avis et à y répondre : *écouter activement le groupe, interpréter ce qu’il exprime, puis répondre ou adapter la proposition en conséquence.* | Lancez une proposition de **[Vérification du ressenti](/en/user_manual/polls/proposals/sense_check/)**. <br /><br />*Dans le titre :* Nommez la proposition et indiquez que chacun peut réagir et la commenter. <br /><br />*Dans les détails de la proposition :* Présentez clairement la proposition et expliquez son importance. Ajoutez les informations utiles et un lien vers sa version actuelle. <br /><br />Invitez tout le monde à répondre avant la clôture de la proposition. |
      | **Modification** <br /><br />Examinez les commentaires et les suggestions, puis modifiez la proposition dans l’intérêt de votre organisation. <br /><br />Déterminez les changements à apporter à la nouvelle version. | Répondez aux commentaires et aux suggestions formulés dans la proposition de vérification du ressenti. <br /><br />Publiez une **conclusion** qui résume les résultats de la proposition. <br /><br />Notez les préoccupations et les nouvelles informations, puis expliquez comment vous allez modifier la proposition. <br /><br />Indiquez la suite et informez les personnes concernées de la conclusion. |
      | **Objections** <br /><br />Présentez la version modifiée de la proposition et invitez les personnes à formuler des objections valables, c’est-à-dire des objections qui signalent un risque de préjudice. <br /><br />Répondez à chaque objection et intégrez-la en modifiant la proposition. | Lancez une **[Proposition de consentement](/en/user_manual/polls/proposals/consent/)** avec la version modifiée. <br /><br />*Dans le titre :* Nommez la décision à prendre. <br /><br />*Dans les détails de la proposition :* Présentez la proposition et invitez les personnes à donner leur consentement ou à formuler une objection valable, qui signale un risque de préjudice. Le but est de déterminer si la proposition peut être essayée sans risque majeur. <br /><br />Répondez à chaque objection et intégrez-la dans une nouvelle version de la proposition. <br /><br />Informez tout le monde de cette nouvelle modification et invitez les personnes à reconsidérer leur consentement et à « modifier leur vote ». <br /><br />Si nécessaire, lancez d’autres propositions de consentement jusqu’à ce que les objections soient résolues. |
      | **Conclusion** <br /><br />Lorsqu’il ne reste aucune objection et que tout le monde a donné son consentement, annoncez la décision. | Publiez une **conclusion**. <br /><br />Clôturez la proposition. Publiez une conclusion et informez toutes les personnes concernées. <br /><br />Annoncez la décision prise et remerciez les personnes pour leur participation au processus. <br /><br />Résumez les résultats du processus et indiquez la suite. <br /><br />S’il ne reste aucune objection valable, indiquez que la proposition a reçu le consentement nécessaire pour être essayée sans risque majeur. <br /><br />La conclusion constitue une trace importante de la décision, à consulter ultérieurement. |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
