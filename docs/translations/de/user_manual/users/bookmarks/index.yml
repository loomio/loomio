---
navigation_title: Lesezeichen
blocks:
  4f81ad2ed2c971a4:
    english: "# Bookmarks"
    translation: "# Lesezeichen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5d590d1d8ab9b956:
    english: |-
      Bookmarks are a personal list of Loomio items you want to return to. Your
      bookmarks are visible only to you and saving an item does not notify anyone
      else.
    translation: |-
      Lesezeichen sind deine persönliche Liste mit Inhalten auf Loomio, zu denen du zurückkehren möchtest. Deine
      Lesezeichen sind nur für dich sichtbar. Wenn du ein Lesezeichen speicherst, wird niemand
      benachrichtigt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  aac40737df991d52:
    english: 'You can bookmark:'
    translation: 'Du kannst Lesezeichen speichern für:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0f6c7e4161c72c18:
    english: |-
      - discussions
      - comments
      - proposals and polls
      - votes
      - outcomes
    translation: |-
      - Diskussionen
      - Kommentare
      - Vorschläge und Abstimmungen
      - Stimmen
      - Fazits
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fc91d7d6d32e590b:
    english: "## Save a bookmark"
    translation: "## Lesezeichen speichern"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  daec09886eecd058:
    english: |-
      Open the action menu for the item and select **Save bookmark**. The action menu
      is usually shown as three dots. For a discussion, use the action menu near the
      discussion title; for a comment, vote, proposal, poll, or outcome, use the menu
      on that item.
    translation: |-
      Öffne das Aktionsmenü des Inhalts und wähle **Lesezeichen speichern**. Das Aktionsmenü
      wird meist als drei Punkte angezeigt. Bei einer Diskussion findest du es neben dem
      Diskussionstitel. Bei einem Kommentar, einer Stimme, einem Vorschlag, einer Abstimmung oder einem Fazit
      findest du es direkt am jeweiligen Inhalt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  395a4c119e77f34b:
    english: "## View your bookmarks"
    translation: "## Deine Lesezeichen ansehen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a5e09c422c753df7:
    english: |-
      Open the sidebar and select **Bookmarks**. The number beside the link shows how
      many bookmarks you have saved.
    translation: |-
      Öffne die Seitenleiste und wähle **Lesezeichen**. Die Zahl neben dem Link zeigt,
      wie viele Lesezeichen du gespeichert hast.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7c21b03875c08b8e:
    english: |-
      The Bookmarks page lists your most recently saved items first. Each row shows
      the kind of item and its author. Select a row to return to the bookmarked item.
    translation: |-
      Auf der Seite „Lesezeichen“ stehen die zuletzt gespeicherten Inhalte zuerst. Jede Zeile zeigt
      die Art des Inhalts und wer ihn verfasst hat. Wähle eine Zeile aus, um den gespeicherten Inhalt zu öffnen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  644d774a0d045214:
    english: "## Remove a bookmark"
    translation: "## Lesezeichen entfernen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c2480aa6235675ba:
    english: |-
      On the Bookmarks page, select the remove-bookmark button at the end of a row.
      You can also open the bookmarked item's action menu and select **Remove
      bookmark**.
    translation: |-
      Wähle auf der Seite „Lesezeichen“ die Schaltfläche zum Entfernen am Ende einer Zeile.
      Du kannst auch das Aktionsmenü des gespeicherten Inhalts öffnen und **Lesezeichen
      entfernen** wählen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6c20d47950313409:
    english: |-
      Removing a bookmark affects only your personal list. You can save the item
      again later.
    translation: |-
      Wenn du ein Lesezeichen entfernst, ändert sich nur deine persönliche Liste. Du kannst den Inhalt
      später erneut speichern.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
