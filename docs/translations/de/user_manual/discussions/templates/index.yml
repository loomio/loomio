---
navigation_title: Diskussionsvorlagen
blocks:
  80c5dfc46bb963d2:
    english: "# Discussion templates"
    translation: "# Diskussionsvorlagen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  488fbd5167707cba:
    english: Discussion templates help your group start discussions the same way each time. A template can supply a title, context, tags, and instructions for the person starting the discussion. It also sets defaults, such as whether to notify the whole group and which polls to suggest.
    translation: Diskussionsvorlagen helfen deiner Gruppe, wiederkehrende Diskussionen auf die gleiche Weise zu beginnen. Eine Vorlage kann einen Titel, einen Kontext, Schlagwörter und Hinweise für die Person enthalten, die die Diskussion startet. Sie legt auch Standardwerte fest, etwa ob die ganze Gruppe benachrichtigt wird und welche Abstimmungen vorgeschlagen werden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2571bc9cc405d927:
    english: Every new discussion in a group starts from a template. When someone selects **Start discussion**, Loomio shows the group's templates. Even **Blank template** is a template, so your group can change its defaults too.
    translation: Jede neue Diskussion in einer Gruppe beginnt mit einer Vorlage. Wenn jemand **Diskussion starten** auswählt, zeigt Loomio die Vorlagen der Gruppe an. Auch **Leere Vorlage** ist eine Vorlage. Deine Gruppe kann daher auch deren Standardwerte ändern.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  834ac31697ef254b:
    english: Templates work well for processes your group repeats, such as project reviews, advice processes, meeting preparation, funding decisions, or document approvals. The person starting the discussion can still edit everything before they start it.
    translation: Vorlagen eignen sich für wiederkehrende Abläufe in deiner Gruppe, etwa Projektbewertungen, Beratungsprozesse, die Vorbereitung von Treffen, Förderentscheidungen oder die Freigabe von Dokumenten. Wer die Diskussion startet, kann vorher alle Angaben bearbeiten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  74d1c850f63c0518:
    english: "## How templates are used"
    translation: "## So werden Vorlagen verwendet"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6e5927441d982c01:
    english: |-
      1. A member selects **Start discussion** on the group page.
      2. Loomio lists the group's visible templates. Each one shows its title and subtitle.
      3. The member selects a template. Loomio opens the new discussion form, filled in from the template.
      4. The template's help appears at the top of the form as guidance.
      5. The member edits the title, context, tags, and invite list, then selects **Start discussion**.
    translation: |-
      1. Ein Mitglied wählt auf der Gruppenseite **Diskussion starten** aus.
      2. Loomio zeigt die sichtbaren Vorlagen der Gruppe an. Jede Vorlage zeigt ihren Titel und Untertitel.
      3. Das Mitglied wählt eine Vorlage aus. Loomio öffnet das Formular für eine neue Diskussion und übernimmt die Angaben aus der Vorlage.
      4. Die Vorlagenhilfe erscheint als Anleitung oben im Formular.
      5. Das Mitglied bearbeitet Titel, Kontext, Schlagwörter und Einladungsliste und wählt dann **Diskussion starten** aus.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  464984a60c23366b:
    english: Changing a template affects only discussions started after the change. Discussions already started from it keep their content and settings.
    translation: Änderungen an einer Vorlage gelten nur für Diskussionen, die danach gestartet werden. Bereits gestartete Diskussionen behalten ihre Inhalte und Einstellungen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  70c22d24ec0d248b:
    english: "## Choose who is notified by default"
    translation: "## Wähle, wer standardmäßig benachrichtigt wird"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  77feebf56c2ee9a7:
    english: 'The **Invite** setting controls who the new discussion form invites by default. It has two options:'
    translation: 'Die Einstellung **Einladen** legt fest, wer im Formular für eine neue Diskussion standardmäßig eingeladen wird. Es gibt zwei Möglichkeiten:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6c93f4222436028f:
    english: |-
      - **Everyone in the group**: the group appears in the discussion form's **Invite** field, and every member is notified when the discussion starts.
      - **None**: the **Invite** field starts empty. Nobody is notified unless the author adds people.
    translation: |-
      - **Jeder in der Gruppe**: Die Gruppe erscheint im Feld **Einladen** des Diskussionsformulars. Beim Start der Diskussion werden alle Mitglieder benachrichtigt.
      - **Keine**: Das Feld **Einladen** ist zunächst leer. Niemand wird benachrichtigt, solange die Person, die die Diskussion startet, niemanden hinzufügt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  17cca49613fff23d:
    english: Loomio's built-in templates, including **Blank template**, use **Everyone in the group**. If your group does not want every new discussion to notify all members, edit the templates your group uses and set **Invite** to **None**.
    translation: Die integrierten Vorlagen von Loomio, einschließlich **Leere Vorlage**, verwenden **Jeder in der Gruppe**. Wenn deine Gruppe nicht bei jeder neuen Diskussion alle Mitglieder benachrichtigen möchte, bearbeite die verwendeten Vorlagen und setze **Einladen** auf **Keine**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5fd184e64e0605bc:
    english: The author can always change the invite list before starting the discussion. They can remove the group to notify nobody, or add specific people instead. This setting only affects notifications. Group members can still find and read the discussion in the group, whichever option you choose.
    translation: Wer die Diskussion startet, kann die Einladungsliste vorher jederzeit ändern. Die Person kann die Gruppe entfernen, damit niemand benachrichtigt wird, oder stattdessen einzelne Personen hinzufügen. Diese Einstellung betrifft nur Benachrichtigungen. Gruppenmitglieder können die Diskussion unabhängig von deiner Auswahl weiterhin in der Gruppe finden und lesen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  58f24313ca36c890:
    english: The group is added to the invite list only when the author is allowed to notify the whole group. Admins can always do this. Members can do it when **Members can notify everyone in the group** is enabled in the group's permissions.
    translation: Die Gruppe wird nur dann zur Einladungsliste hinzugefügt, wenn die Person, die die Diskussion startet, die ganze Gruppe benachrichtigen darf. Admins dürfen das immer. Mitglieder dürfen es, wenn in den Berechtigungen der Gruppe **Mitglieder können alle Mitglieder der Gruppe benachrichtigen** aktiviert ist.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  33afd174376e933b:
    english: "## Template settings"
    translation: "## Vorlageneinstellungen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b02be20543f228a7:
    english: 'Group admins can edit a template from the action menu beside it in the template list. The form has these settings:'
    translation: 'Gruppenadmins können eine Vorlage über das Aktionsmenü neben der Vorlage in der Liste bearbeiten. Das Formular enthält diese Einstellungen:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f2fc57fe20100911:
    english: |-
      - **Template title**: the short name shown in the template list.
      - **Template subtitle**: one line explaining when to use the template.
      - **Template help**: instructions shown at the top of the new discussion form. Use it to explain the process and link to resources. It is not part of the discussion.
      - **Group**: whether the template starts a discussion in the group or a direct discussion. A direct discussion is visible only to the people invited to it.
      - **Default title**: a title filled in for each new discussion. The author can edit it.
      - **Example title**: an example shown in an empty title field. Use it when a default title would not fit every discussion.
      - **Tags**: tags applied to each new discussion. The author can remove them.
      - **Context**: the starting text of the discussion. Use headings, questions, or links to guide what people write.
      - **Invite**: whether to invite everyone in the group by default. See [Choose who is notified by default](#choose-who-is-notified-by-default).
      - **Poll templates**: polls suggested for this process. They are listed on the new discussion form. They also appear first when someone starts a poll in the discussion. They do not start automatically.
      - **Allow concurrent polls**: whether more than one poll can be open in the discussion at the same time.
      - **Comment length limit**: an optional maximum length for comments.
    translation: |-
      - **Vorlagentitel**: der kurze Name in der Vorlagenliste.
      - **Vorlagenuntertitel**: eine Zeile, die erklärt, wann die Vorlage verwendet werden soll.
      - **Vorlagenhilfe**: Hinweise, die oben im Formular für eine neue Diskussion angezeigt werden. Erkläre damit den Ablauf und verlinke hilfreiche Materialien. Die Hinweise werden nicht Teil der Diskussion.
      - **Gruppe**: ob die Vorlage eine Diskussion in der Gruppe oder eine direkte Diskussion startet. Eine direkte Diskussion ist nur für die eingeladenen Personen sichtbar.
      - **Standardtitel**: ein Titel, der für jede neue Diskussion eingetragen wird. Die Person, die die Diskussion startet, kann ihn bearbeiten.
      - **Beispieltitel**: ein Beispiel, das in einem leeren Titelfeld angezeigt wird. Verwende ihn, wenn ein Standardtitel nicht zu jeder Diskussion passt.
      - **Schlagwörter**: Schlagwörter, die jeder neuen Diskussion hinzugefügt werden. Die Person, die die Diskussion startet, kann sie entfernen.
      - **Kontext**: der Anfangstext der Diskussion. Verwende Überschriften, Fragen oder Links, um den Beiträgen eine Richtung zu geben.
      - **Einladen**: ob standardmäßig alle Mitglieder der Gruppe eingeladen werden. Siehe [Wähle, wer standardmäßig benachrichtigt wird](#choose-who-is-notified-by-default).
      - **Umfragevorlagen**: für diesen Ablauf vorgeschlagene Abstimmungen. Sie werden im Formular für eine neue Diskussion angezeigt. Wenn jemand in der Diskussion eine Abstimmung startet, erscheinen sie ebenfalls zuerst. Sie starten nicht automatisch.
      - **Gleichzeitige Abstimmungen zulassen**: ob mehrere Abstimmungen gleichzeitig in der Diskussion geöffnet sein können.
      - **Kommentarlängenbegrenzung**: eine optionale maximale Länge für Kommentare.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a9e44919507a613:
    english: Use a default title only when it will stay accurate. Otherwise, write an example title that prompts the author to name the specific review, period, document, or decision.
    translation: Verwende einen Standardtitel nur, wenn er immer zutrifft. Andernfalls gib einen Beispieltitel an, der dazu anregt, die konkrete Bewertung, den Zeitraum, das Dokument oder die Entscheidung zu benennen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c5db289e27f54169:
    english: "## Example: bottle trial review"
    translation: "## Beispiel: Auswertung eines Flaschenversuchs"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  89e7b8f9b36a8ae7:
    english: Oatmilk Cooperative reviews its returnable-bottle trial after each cycle. Its template is titled "Bottle trial review" and has a default title. It adds the "Bottle trial" tag. Its context asks members to read the weekly report and consider return rates, washing records, cafe feedback, and transport costs. It recommends a Sense check followed by Consent.
    translation: Die Hafermilchgenossenschaft wertet nach jedem Durchlauf ihren Versuch mit Mehrwegflaschen aus. Ihre Vorlage heißt „Auswertung des Flaschenversuchs“ und enthält einen Standardtitel. Sie fügt das Schlagwort „Flaschenversuch“ hinzu. Der Kontext fordert die Mitglieder auf, den Wochenbericht zu lesen und Rückgabequoten, Reinigungsprotokolle, Rückmeldungen der Cafés und Transportkosten zu berücksichtigen. Die Vorlage empfiehlt zuerst einen Sense Check und danach Consent.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f896031f8dcc2f84:
    english: This works as a template because the purpose and evidence stay the same each cycle. Only the observations and decisions change.
    translation: Dafür eignet sich eine Vorlage, weil Zweck und Informationsgrundlage bei jedem Durchlauf gleich bleiben. Nur die Beobachtungen und Entscheidungen ändern sich.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7e5955c442f6c8ae:
    english: "## Create a template"
    translation: "## Eine Vorlage erstellen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c2b2bc41cbe6f6a:
    english: Group admins can select **New template** from the template list. Choose an example from Loomio's gallery or start with a blank template, then adapt it and save it.
    translation: Gruppenadmins können in der Vorlagenliste **Neue Vorlage** auswählen. Wähle ein Beispiel aus der Loomio-Galerie oder beginne mit einer leeren Vorlage. Passe sie anschließend an und speichere sie.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a9cb80d574e2d865:
    english: You can search or filter the gallery. An example is not added to your group until you save it.
    translation: Du kannst die Galerie durchsuchen oder filtern. Ein Beispiel wird deiner Gruppe erst hinzugefügt, wenn du es speicherst.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1f0dab3f50320e75:
    english: "## Manage the template list"
    translation: "## Die Vorlagenliste verwalten"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7462593f2f6d1614:
    english: When a group is created, Loomio adds a set of templates suited to the kind of group. Only **Blank template** and **Practice discussion** are visible at first. The others are hidden, and admins can unhide them.
    translation: Beim Erstellen einer Gruppe fügt Loomio Vorlagen hinzu, die zur Art der Gruppe passen. Anfangs sind nur **Leere Vorlage** und **Übungsdiskussion** sichtbar. Die anderen Vorlagen sind versteckt. Admins können sie einblenden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e6f7eaa63e353ef7:
    english: 'Group admins can use the action menu beside a template to:'
    translation: 'Über das Aktionsmenü neben einer Vorlage können Gruppenadmins:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e8767178e42cd4e0:
    english: |-
      - edit its content and settings;
      - hide it from the template list;
      - unhide it from **Hidden templates**;
      - rearrange the order of visible templates;
      - export it as a JSON file; or
      - delete it.
    translation: |-
      - ihre Inhalte und Einstellungen bearbeiten;
      - sie aus der Vorlagenliste ausblenden;
      - sie unter **Versteckte Vorlagen** wieder einblenden;
      - die Reihenfolge sichtbarer Vorlagen ändern;
      - sie als JSON-Datei exportieren; oder
      - sie löschen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5d4cbc918551c211:
    english: Hiding a template keeps it for later use. Deleting a template does not delete discussions started from it.
    translation: Eine ausgeblendete Vorlage bleibt für die spätere Verwendung erhalten. Wenn du eine Vorlage löschst, werden Diskussionen, die damit gestartet wurden, nicht gelöscht.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c0ae844752e20ef:
    english: "## Share templates between groups"
    translation: "## Vorlagen zwischen Gruppen teilen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  acf646688b9b79f4:
    english: Select **Export json** in a template's action menu to download it as a file. To use it in another group, select **New template**, then **Import json**. The form opens with the imported content so you can review it before saving.
    translation: Wähle im Aktionsmenü einer Vorlage **JSON exportieren**, um sie als Datei herunterzuladen. Um sie in einer anderen Gruppe zu verwenden, wähle **Neue Vorlage** und dann **JSON importieren**. Das Formular öffnet sich mit den importierten Inhalten. Du kannst sie vor dem Speichern prüfen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a168253bda3147e8:
    english: Links to custom poll templates are not included in the file. Export and import those poll templates separately.
    translation: Verknüpfungen zu selbst erstellten Umfragevorlagen sind nicht in der Datei enthalten. Exportiere und importiere diese Umfragevorlagen separat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4833d57d46ccb98e:
    english: "## Let members create templates"
    translation: "## Mitgliedern erlauben, Vorlagen zu erstellen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1ac138e713feea59:
    english: By default, only group admins can create and edit templates. An admin can enable **Members can create templates** under **Group settings** → **Permissions**.
    translation: Standardmäßig können nur Gruppenadmins Vorlagen erstellen und bearbeiten. Ein Admin kann unter **Gruppen-Einstellungen** → **Berechtigungen** die Option **Mitglieder können Vorlagen erstellen.** aktivieren.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  889e8792d7937424:
    english: When this is enabled, members can create discussion and poll templates and edit the templates they created. Admins can edit every template in the group. A member's template appears in the group's template list once it is saved, so agree on naming and review practices before enabling this permission.
    translation: Wenn diese Option aktiviert ist, können Mitglieder Diskussionsvorlagen und Umfragevorlagen erstellen und ihre eigenen Vorlagen bearbeiten. Admins können alle Vorlagen der Gruppe bearbeiten. Sobald ein Mitglied eine Vorlage speichert, erscheint sie in der Vorlagenliste der Gruppe. Vereinbart daher vor dem Aktivieren dieser Berechtigung, wie ihr Vorlagen benennt und prüft.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1284dfc3e68170d8:
    english: "## Templates for non-members"
    translation: "## Vorlagen für Nichtmitglieder"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5c701c3795724027:
    english: If **Non-members can start discussions** is enabled, people outside the group choose from the same template list. Their discussion form never invites the group by default. See [Collect private submissions](/en/user_manual/discussions/private_submissions).
    translation: Wenn **Nichtmitglieder können Diskussionen starten** aktiviert ist, wählen Personen außerhalb der Gruppe aus derselben Vorlagenliste. In ihrem Diskussionsformular wird die Gruppe nie standardmäßig eingeladen. Siehe [Private Beiträge sammeln](/en/user_manual/discussions/private_submissions).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  630a5d69a7093105:
    english: "## Related"
    translation: "## Verwandte Themen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
