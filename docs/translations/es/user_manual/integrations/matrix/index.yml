  f3106c22cd3d4059:
    english: 'Loomio can send notifications into your Matrix channels when new discussions, proposals, comments, votes, and outcomes occur. '
    translation: Loomio puede enviar notificaciones a tus canales de Matrix cuando hay nuevas discusiones, propuestas, comentarios, votos y conclusiones.
