  0b8bb762e37fb8c3:
    english: |-
      To create a poll or proposal and only invite the delegates, use the "Selected people only" poll setting.
      ![Selected people only setting when starting a proposal](poll_invited_people_only.png)
      Then when inviting people to vote you will see the "Delegates of group-name" option.
      ![Delegates of Oatmilk Cooperative option in the invite-to-vote form](poll_invite_delegates_group.png)
    translation: |-
      Wenn du eine Umfrage oder einen Vorschlag erstellst und nur Delegierte einladen möchtest, wähle die Umfrageeinstellung „Nur für ausgewählte Personen“.
      ![Einstellung „Nur für ausgewählte Personen“ beim Erstellen eines Vorschlags](poll_invited_people_only.png)
      Wenn du anschließend Personen zur Abstimmung einlädst, siehst du die Option „Delegierte von Gruppenname“.
      ![Option „Delegierte von Oatmilk Cooperative“ im Formular zum Einladen zur Abstimmung](poll_invite_delegates_group.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e895a07efeaf4dcf:
    english: |-
      You can see a list of who the delegates are from the members tab of your group page. Use the filter menu and select "Delegates".
      ![Delegates option in the members filter](members_list_delegates.png)
    translation: |-
      Eine Liste der Delegierten findest du auf der Registerkarte „Mitglieder“ deiner Gruppenseite. Öffne das Filtermenü und wähle „Delegierte“.
      ![Option „Delegierte“ im Mitgliederfilter](members_list_delegates.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
