  a29c1c76443ad97f:
    english: Good governance is more than a board meeting, it requires good communication before and after meetings.
    translation: 適切な組織運営には、理事会の会議だけでなく、会議の前後に十分なコミュニケーションを取ることが必要です。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9f05171a74ac30d0:
    english: |-
      This guide is intended to help you use Loomio in your board or committee, so you can stay connected between meetings, deal with urgent matters and reduce board admin.
      - Continue governance between meetings
      - Keep track of communications
      - Use board meetings for issues that matter
      - Preserve institutional memory with a detailed record
    translation: |-
      このガイドでは、理事会や委員会でLoomioを活用する方法を紹介します。会議の合間も連絡を取り合い、緊急の案件に対応し、運営事務を減らすために役立ててください。
      - 会議の合間も組織運営を進める
      - やり取りを記録する
      - 重要な議題に会議の時間を使う
      - 詳細な記録を残し、組織の知識を引き継ぐ
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
