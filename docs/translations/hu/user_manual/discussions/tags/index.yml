  7d3b350731e07a2c:
    english: Use short, familiar names that group members will recognize, such as Finance, Governance, Packaging, or Cafe partnerships.
    translation: Használj rövid, ismerős neveket, amelyeket a csoport tagjai felismernek, például Pénzügyek, Irányítás, Csomagolás vagy Kávézói partnerségek.
    status: machine
