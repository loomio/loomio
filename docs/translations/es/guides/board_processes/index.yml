  eecfb12ed1d28d50:
    english: Good governance exists where an organization has systems and processes in place that are appropriate to its circumstances, and which enable the organization to pursue its purpose effectively and meet its obligations under the law.
    translation: Hay buen gobierno cuando una organización cuenta con sistemas y procesos adecuados a sus circunstancias. Estos le permiten cumplir eficazmente su propósito y sus obligaciones legales.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e54f67d22cf67a93:
    english: "*“It is participatory, consensus-oriented, accountable, transparent, responsive, effective and efficient, equitable and inclusive and follows the rule of law.”* [United Nations Economic and Social Commission for Asia and the Pacific](https://www.unescap.org/sites/default/d8files/knowledge-products/good-governance.pdf)."
    translation: "*«Es participativo, busca el consenso, rinde cuentas, es transparente, receptivo, eficaz y eficiente, equitativo e inclusivo, y respeta el Estado de derecho».* [Comisión Económica y Social de las Naciones Unidas para Asia y el Pacífico](https://www.unescap.org/sites/default/d8files/knowledge-products/good-governance.pdf)."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1661a79cfda1a9df:
    english: Underpinning all of these principles is the need for good communication.
    translation: Todos estos principios dependen de una buena comunicación.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2819f114c9d74160:
    english: 'Here are some or the challenges directors and boards experience:'
    translation: 'Estas son algunas de las dificultades que afrontan quienes integran las juntas directivas:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ed750814c61b85fb:
    english: "* Getting directors together in person\n* Time available to consider important issues \n* Tracking communication\n* Urgency of critical issues\n* Online video meeting fatigue\n* Directors in multiple, remote locations, sometimes with poor internet connectivity\n* Mixed governance practice and experience\n* Dealing with high volumes of transactional business \n* Maintaining institutional memory"
    translation: "* Reunirse en persona\n* Disponer de tiempo para considerar los asuntos importantes \n* Llevar un registro de las comunicaciones\n* Atender asuntos críticos con urgencia\n* El cansancio causado por las videollamadas\n* Tener integrantes en distintos lugares, a veces con mala conexión a internet\n* Combinar distintas prácticas y niveles de experiencia en gobierno\n* Gestionar un gran volumen de asuntos administrativos \n* Mantener la memoria institucional"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b910c5253cf77950:
    english: Loomio offers an opportunity to strengthen governance, to extend collaboration beyond board meetings, to include everyone in open, honest and respectful discussion while documenting everything.
    translation: Loomio ayuda a fortalecer el gobierno y a colaborar entre reuniones de la junta directiva. Permite que todas las personas participen en discusiones abiertas, sinceras y respetuosas, y deja constancia de todo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
