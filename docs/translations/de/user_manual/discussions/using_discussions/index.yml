    translated_on: '2026-09-29'
  5602fbfa565eaf45:
    english: "### Seen by"
    translation: "### Angesehen von"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a929b22d02292573:
    english: "**Seen by** shows who has opened the thread and when. It can help you identify people who may not have seen important information yet."
    translation: "**Angesehen von** zeigt, wer den Thread wann geöffnet hat. So kannst du erkennen, wer wichtige Informationen möglicherweise noch nicht gesehen hat."
    status: machine
