  7c8501ecb12311af:
    english: "## How Loomio works"
    translation: "## Hogyan működik a Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  74caca2261c15283:
    english: 'Loomio has three main parts: groups, discussions, and polls.'
    translation: 'A Loomio három fő részből áll: csoportokból, beszélgetésekből és szavazásokból.'
    status: machine
    provider: codex/gpt-6-sol
