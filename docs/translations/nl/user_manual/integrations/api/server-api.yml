  4a423dbb4fd59b45:
    english: Redaction keeps the user's comments and other user-generated content within their groups, but removes known personally identifying information such as name, bio, profile photo, email address, login credentials, identities, and active sessions.
    translation: Bij anonimisering blijven de reacties van de gebruiker en andere inhoud die diegene heeft gemaakt binnen diens groepen behouden. Bekende persoonsgegevens worden verwijderd, waaronder naam, biografie, profielfoto, e-mailadres, inloggegevens, identiteiten en actieve sessies.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9b472af7dbef98ac:
    english: This is the recommended way to remove a user from Loomio.
    translation: Dit is de aanbevolen manier om een gebruiker uit Loomio te verwijderen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9839b052c7f487d6:
