  0ce0604bb021d98f:
    english: "## Invitation"
    translation: "## Meghívás"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d5fabca3934dafd:
    english: How participants are invited into a facilitated space is incredibly important. People understand huge amounts of information from the invitation, and use it to judge how a space will be held and if they belong there. The moment of invitation is in many ways the defining opportunity to set the tone and establish trust.
    translation: Nagyon fontos, hogyan hívod meg a résztvevőket egy vezetett közös térbe. A meghívásból sok mindent megtudnak, és ez alapján ítélik meg, hogyan működik majd a tér, és van-e ott helyük. A meghívás pillanata jó alkalom arra, hogy megadd az alaphangot és bizalmat építs.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a8d7e10a50432195:
    english: |-
      > <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../rich_200.png"> Decision making is all about communication: your group can only make good decisions together if there’s a foundation of good communication in place first. This means being clear about what the purpose of a discussion or meeting is, who needs to be involved, what the time-frame is, and what people can expect.
      >
      > — Richard Bartlett
    translation: |-
      > <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../rich_200.png"> A közös döntéshozatal alapja a kommunikáció: a csoportod csak akkor tud jó döntéseket hozni, ha előbb jól tudtok egymással kommunikálni. Ehhez világosan kell beszélni arról, mi a beszélgetés vagy találkozó célja, kinek kell részt vennie, mennyi idő áll rendelkezésre, és mire számíthatnak az emberek.
      >
      > — Richard Bartlett
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ab260e60bf87a11d:
    english: 'Key aspects to an invitation:'
    translation: 'A meghívás fő szempontjai:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ff258493e21d7f3a:
    english: |-
      * **Background.** What is this thing? What am I being asked to do? Who is behind this? Who else will be involved? What is the time commitment, topic focus, and protocol?
      * **Context.** What is the character of this specific engagement? Of all the possible formats and ways it could go, which one will it be? Why now, why this way?
      * **Belonging.** Am I welcome? Is this for me? Am I needed in this process? What is my unique value and contribution? Why should I specifically be compelled?
      * **Safety.** Does this invitation indicate thoughtfulness, trust, and understanding? Is the structure of the engagement up to handling the inherent power dynamics at play? What level of honesty or vulnerability will this require of me? Do I think the person inviting is going to hold me well?
      * **Accessibility.** Will my basic requirements for participation be accommodated? Language, assistive technology, unfamiliar jargon, etc. Will it be possible for me to engage?
    translation: |-
      * **Háttér.** Miről van szó? Mire kérnek? Ki áll mögötte? Kik vesznek még részt? Mennyi időt igényel, mi a téma, és milyen szabályok szerint zajlik?
      * **Környezet.** Milyen lesz ez a konkrét együttműködés? A lehetséges formák közül melyiket választották? Miért most, és miért így?
      * **Odatartozás.** Szívesen látnak? Nekem szól ez? Szükség van rám a folyamatban? Mivel tudok hozzájárulni? Miért érdemes részt vennem?
      * **Biztonság.** Átgondoltságot, bizalmat és megértést sugall a meghívás? A folyamat képes kezelni a résztvevők közötti hatalmi különbségeket? Mennyire kell őszintének lennem vagy megmutatnom a sebezhetőségemet? Bízhatok abban, hogy a meghívó figyel rám?
      * **Hozzáférhetőség.** Biztosítottak a részvételem alapfeltételei? Ilyen lehet a nyelv, a segítő technológia vagy az ismeretlen szakkifejezések kérdése. Részt tudok majd venni?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aabfa9d842af2688:
    english: On Loomio
    translation: A Loomióban
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8a87ed2ddb6c659f:
    english: |-
      * The tool has a built-in function to [invite users](/en/user_manual/groups/inviting_people/) by email or by sending them a special link. Users can also request to join your group if your settings allow.
      * The invitation tools built into the software are very basic, and getting an unexpected login request for new software without context isn't very inviting, so group creators often introduce people to the idea of Loomio through a separate process.
      * Many aspects of Loomio are already designed to create a safe and respectful space users would want to enter — such as thoughtful [privacy options](/en/user_manual/groups/starting_a_group/#privacy).
      * The design of the software itself is meant to be friendly, simple, and professional, hopefully putting out a trustworthy vibe.
      * Loomio has accessibility features, for people who use assistive technology like screen readers, and translation features for people who speak different languages. Emphasising these aspects in an invitation can make some people feel more welcome.
    translation: |-
      * A Loomióban e-mailben vagy különleges hivatkozással is [meghívhatsz felhasználókat](/en/user_manual/groups/inviting_people/). A felhasználók maguk is kérhetik a felvételüket a csoportodba, ha a beállítások ezt lehetővé teszik.
      * A beépített meghívási eszközök egyszerűek. Egy új szoftver váratlan bejelentkezési kérése előzetes tájékoztatás nélkül nem túl hívogató, ezért a csoport létrehozói gyakran külön mutatják be az embereknek a Loomiót.
      * A Loomio több funkciója is segít biztonságos, tiszteletteljes teret kialakítani, ahová az emberek szívesen lépnek be. Ilyenek például az átgondolt [adatvédelmi beállítások](/en/user_manual/groups/starting_a_group/#privacy).
      * A szoftver kialakítása barátságos, egyszerű és professzionális benyomást igyekszik kelteni.
      * A Loomio akadálymentességi funkciókat kínál a segítő technológiákat, például képernyőolvasót használóknak, és fordítási funkciókat a különböző nyelveken beszélőknek. Ha ezeket megemlíted a meghívásban, többen érezhetik úgy, hogy szívesen látják őket.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cb459c1230aaf54c:
    english: "## Arrival"
    translation: "## Megérkezés"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ef55fa893f9e1034:
    english: The moment of arrival is the “first impression” of an engagement, and sets the trajectory from there on in. The person has accepted an invitation and decided to step in. They are open and expectant, and the impression they get will make a big impact on their experience.
    translation: A megérkezés adja az első benyomást az együttműködésről, és hatással van arra, hogyan folytatódik. Az illető elfogadta a meghívást, és belépett a közös térbe. Nyitottan érkezik, várakozásokkal. Az első benyomás erősen befolyásolja a későbbi tapasztalatait.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  66e7e79597f6a3d0:
    english: |-
      ### Welcoming
      To enable openness to engagement, participation, and receptivity, a person has to feel welcome. They need their existence acknowledged, and to feel a sense of hospitality.
    translation: |-
      ### Fogadtatás
      Ahhoz, hogy valaki nyitott legyen az együttműködésre és a részvételre, éreznie kell, hogy szívesen látják. Fontos, hogy észrevegyék és vendégszeretettel fogadják.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b3ce2bd5e2ea9acd:
    english: |-
      ### Settling
      When someone enters a physical room, they want to know where to sit, where the exit is, where to go to the bathroom, and if there is coffee available. They need a basic introduction to the space and their place in it.
    translation: |-
      ### Tájékozódás
      Amikor valaki belép egy valódi helyiségbe, tudni szeretné, hová üljön, hol a kijárat és a mosdó, valamint van-e kávé. Szüksége van néhány alapvető tudnivalóra a helyről és arról, hogyan találja meg benne a helyét.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d6fd9d29415a172:
    english: |-
      * The group description fields and discussion context box are the main space to put a “welcome message” for people arriving into the space.
      * Take a tour of the Loomio space, tweak things to make yourself comfortable (like [notification settings](/en/user_manual/users/email_settings/) and your [profile photo](/en/user_manual/users/user_profile/).
      * See information how you like using different thread views and options like Recent, Unread, Mute, and Star. Make yourself at home.
    translation: |-
      * A csoport leírása és a beszélgetés kontextusát leíró mező a legjobb hely az érkezőknek szóló üdvözlő üzenethez.
      * Nézz körül a Loomióban, és állítsd be úgy, hogy kényelmes legyen számodra. Módosíthatod például az [értesítési beállításokat](/en/user_manual/users/email_settings/) és a [profilképedet](/en/user_manual/users/user_profile/).
      * Válaszd ki a neked megfelelő témamegjelenítést, és próbáld ki a Legutóbbiak, Olvasatlanok, Némítás és Csillagozás lehetőségeket. Rendezd be a saját teredet.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8acf15fe96515738:
    english: "## Who’s in the Room"
    translation: "## Kik vannak jelen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  48c4449cd1d9b135:
    english: Introducing yourself and being introduced to others is one of the most basic and most important human social functions. From Māori *mihimihi* to British “how do you do” to Japanese business card exchanges, every culture places a lot of importance on this. It goes beyond practicalities and politeness and touches on a deep human need, which is a prerequisite for comfort, openness, and focus.
    translation: 'Bemutatkozni és megismerni a többieket az emberi kapcsolatok egyik legalapvetőbb és legfontosabb része. A maori *mihimihi* szokástól a brit „how do you do” köszönésen át a japán névjegykártyacseréig minden kultúra nagy jelentőséget tulajdonít ennek. Többről van szó gyakorlati tudnivalóknál és udvariasságnál: alapvető emberi szükségletet elégít ki, amely segít abban, hogy kényelmesen, nyitottan és figyelmesen legyünk jelen.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a8eec818aeb74e64:
    english: As a facilitator, if you don’t give people a chance to introduce themselves and find out who is around them, they will generally subvert whatever else you’re trying to point their attention at until you allow this process to occur. Consciously design introductions as a feature, and use them as an opportunity to further the overall goals of the interaction.
    translation: Ha facilitátorként nem adsz lehetőséget a résztvevőknek a bemutatkozásra és egymás megismerésére, általában erre fordítják majd a figyelmüket, bármi mással is próbálsz foglalkozni. Tervezd meg tudatosan a bemutatkozást, és használd arra, hogy támogassa az együttműködés célját.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ad3d2a31a23af036:
    english: "### Check in"
    translation: "### Bejelentkezés"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  71d51a259d8b2c35:
    english: Even among groups who already know each other well, this introduction process continues with “checking in” – where everyone has a chance to speak at the beginning of a meeting (often to a question of "what is on top for you", "how are you", or "is there anything preventing you from being present") and other good practices for team cohesion. People have a multitude of identities, which change based on the context. People answer and re-answer “who am I for this moment” all the time, and that is what allows them to orient around one another.
    translation: A bemutatkozás folyamata a jól összeszokott csoportokban is folytatódik egy rövid bejelentkezéssel. A találkozó elején mindenki lehetőséget kap arra, hogy elmondja, mi foglalkoztatja, hogy van, vagy akadályozza-e valami abban, hogy teljes figyelemmel jelen legyen. Ez a csapat összetartását is segíti. Mindenkinek többféle szerepe és identitása van, amelyek a helyzettől függően változnak. Az emberek újra és újra megválaszolják maguknak, hogy „ki vagyok most ebben a helyzetben”, és ez segít nekik egymáshoz igazodni.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0573ae3aef6f1c6c:
    english: People's expression does not occur in a vaccuum, but in the context of who they are. A multi-faceted view of someone’s identity is an essential aspect of interpreting their contributions.
    translation: Amit valaki mond, nem független attól, hogy ki ő. Hozzászólásainak megértéséhez fontos, hogy identitásának több oldalát is lássuk.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  86eb005fd168a424:
    english: "> We start many of our meetings with everyone “checking in” before we get to the agenda. These check-ins are focused not on your work tasks, but on how you’re doing as a human being. If you’re going through a rough patch at home, or you’re sick, or you have exciting positive news, understanding your state of mind will help the entire group have the right context to interpret how you’re communicating. — Richard Bartlett"
    translation: "> Sok találkozónkat azzal kezdjük, hogy a napirend előtt mindenki röviden bejelentkezik. Ilyenkor nem a feladatokról beszélünk, hanem arról, hogy vagyunk emberként. Ha otthon nehéz időszakon mész át, beteg vagy, vagy jó hírt szeretnél megosztani, a lelkiállapotod ismerete segít a csoportnak megérteni, hogyan kommunikálsz. — Richard Bartlett"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d5aea1c0564ccff8:
    english: |-
      * Create a thread called "Introduce yourself" or "Check in". It provides a useful first _call to action_ everyone coming in will understand.
      * For “request to join” groups, we have a function that allows the requestor to introduce themselves to the coordinator, to get access to the group. Some groups have a process of re-posting this content in the intro thread to welcome people in.
      * Upload profile photos! Photos of faces are one of the most powerful ways of feeling like you know who is in the room with you online.
    translation: |-
      * Hozz létre egy „Mutatkozz be” vagy „Jelentkezz be” című témát. Ez egy könnyen érthető első _felhívás a részvételre_ az érkezők számára.
      * Azokban a csoportokban, amelyekhez csatlakozást kell kérni, a kérelmező bemutatkozhat a koordinátornak, mielőtt hozzáférést kap. Egyes csoportok ezt a bemutatkozást az üdvözlő témában is közzéteszik.
      * Tölts fel profilképet. Egy arckép sokat segít abban, hogy az online térben is tudd, kikkel vagy együtt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d3b245589018cebf:
    english: "## Who’s NOT in the Room"
    translation: "## Kik hiányoznak"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5daf97a7cbbdd355:
    english: Diversity is critical for quality group decision making. The “wisdom of the crowd effect” (collective intelligence) only works by combining a variety of viewpoints. Outcomes of collaboration processes depend heavily on which voices are, and are not, represented. It’s impossible to have perfect representative inclusion, but you need to take into account who might be missing.
    translation: A sokféle nézőpont elengedhetetlen a jó csoportos döntésekhez. A „tömegek bölcsessége”, vagyis a kollektív intelligencia csak akkor működik, ha különböző nézőpontok találkoznak. Az együttműködés eredménye nagyban függ attól, kiknek a hangja hallatszik, és kiké nem. Tökéletes képviseletet nem lehet elérni, de gondold át, ki hiányozhat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b16b07380f6bc37c:
    english: It’s extremely common for people to have blind spots around privilege. Humans are not great at intuiting bias, and are a lot better at noticing the presence of something, rather than the absence. Our minds trick us. For example, when women and men are deliberately given an equal amount of talking time there is often a perception that women are getting more than their fair share, due to different ideas about how much they “should” talk ([more details](https://www.quora.com/Do-women-tend-to-talk-more-than-men)). It can be necessary to actually measure or count to get an accurate picture, instead of relying on intuition.
    translation: Gyakori, hogy az emberek nem veszik észre a saját kiváltságaik hatását. Nehezen ismerjük fel az elfogultságot, és könnyebben vesszük észre azt, ami jelen van, mint azt, ami hiányzik. Az intuíciónk félrevezethet. Ha például a nők és a férfiak tudatosan ugyanannyi időt kapnak a megszólalásra, sokan mégis úgy érzik, hogy a nők túl sokat beszélnek. Ez összefügg azzal, ki mennyi beszédidőt tart számukra „megfelelőnek” ([további részletek](https://www.quora.com/Do-women-tend-to-talk-more-than-men)). A pontos képhez néha mérni vagy számolni kell, nem elég a megérzésre hagyatkozni.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2b720395fe4e451f:
    english: Someone who does not have particular accessibility needs may not even notice that a venue isn’t wheelchair accessible, a document isn’t formatted for screen readers, or a situation is excluding someone with hearing loss. But the people with those challenges will notice. Someone without kids might not consider that a 7PM meeting time won't work for parents. These, and a thousand other practical, social, and cultural elements, could block someone from *being in the room*.
    translation: Akinek nincsenek különleges hozzáférési igényei, talán észre sem veszi, ha egy helyszín nem közelíthető meg kerekesszékkel, egy dokumentum nem használható képernyőolvasóval, vagy egy helyzet kizárja a hallássérült embereket. Az érintettek azonban észreveszik. Akinek nincs gyereke, lehet, hogy nem gondol arra, hogy az este hétkor kezdődő találkozó nem megfelelő a szülőknek. Ezek és sok más gyakorlati, társadalmi vagy kulturális tényező akadályozhatja meg, hogy valaki *jelen legyen*.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  25ac4ed8610c591c:
    english: 'It’s especially important to think about who is not in room when trying to solve problems for others: build with, not for; talk with people, not about them. If the people you are trying to serve are not in the room, it’s very unlikely you’ll have all the input you need to be effective. This is just as much about effectiveness for business outcomes as about social justice; it’s almost always better to design collaboration *with* the users or stakeholders.'
    translation: 'Különösen fontos végiggondolni, ki nincs jelen, amikor mások problémáit próbáljátok megoldani: velük együtt alkossatok, ne helyettük; velük beszéljetek, ne róluk. Ha azok, akiknek segíteni szeretnétek, nincsenek jelen, valószínűleg nem kaptok meg minden szükséges információt. Ez a társadalmi igazságosság mellett az eredményesség szempontjából is fontos. Szinte mindig jobb a felhasználókkal vagy más érintettekkel *együtt* megtervezni az együttműködést.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6b44ef1725c36586:
    english: |-
      * Collaborating online can allow for whole other levels of inclusion. Instead of thinking about a “digital divide”, think about the “digital bridge” — how technology can include people who cannot attend in-person meetings or participate at a specific time, and enable whole new possibilities like multi-lingual discussions.
      * Loomio makes it very clear who is invited to a group and who has participated in a discussion, giving important information for thinking about inclusion. If people are missing, you can see that.
      * If inclusive decision making and diversity of thinking are important to you, periodically ask yourself, “Who’s not in the room? Why?”
    translation: |-
      * Az online együttműködés új lehetőségeket nyit a részvételre. A „digitális szakadék” mellett gondolj a „digitális hídra” is: a technológia bevonhatja azokat, akik nem tudnak személyesen vagy egy adott időpontban részt venni, és többnyelvű beszélgetéseket is lehetővé tesz.
      * A Loomióban jól látható, kit hívtak meg egy csoportba, és ki vett részt egy beszélgetésben. Ez segít felmérni, kik maradtak ki.
      * Ha fontos számodra a befogadó döntéshozatal és a nézőpontok sokfélesége, időnként kérdezd meg magadtól: „Ki hiányzik? Miért?”
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0a5324e7de64cdba:
    english: "## Culture, Protocol, Expectations"
    translation: "## Kultúra, szabályok, elvárások"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  851a2601b835fbb1:
    english: Culture can be quite a nebulous concept, and operates at multiple levels. The culture of the wider society has a big influence, but you can think of every group, and every session or discussion, as having a culture of its own.
    translation: A kultúra nehezen körülhatárolható fogalom, és több szinten működik. A tágabb társadalom kultúrája nagy hatással van ránk, de minden csoportnak, találkozónak és beszélgetésnek megvan a maga kultúrája is.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  27d3b10b80ade309:
    english: How do we roll? How do we talk to one another? What is and is not ok here? What are the rules of the game, of how we interact?
    translation: Hogyan működünk együtt? Hogyan beszélünk egymással? Mi elfogadható itt, és mi nem? Milyen szabályok szerint érintkezünk egymással?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  54d83e0b3e487190:
    english: The process of confronting cultural questions can be a powerful moment of self-awareness for a group. Not confronting them can harm ability to meet goals, or sometimes tear a group apart completely.
    translation: Amikor egy csoport szembenéz a kultúráját érintő kérdésekkel, jobban megértheti önmagát. Ha elkerüli őket, az akadályozhatja a céljai elérését, és akár szét is szakíthatja a csoportot.
    status: machine
    provider: codex/gpt-6-sol
