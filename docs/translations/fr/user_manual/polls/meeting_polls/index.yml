  86490ad15147169e:
    english: Use a **Time poll** to find a time for a meeting or event. It serves the same purpose as scheduling tools such as Doodle, while keeping the scheduling process with the group's other Loomio work. Participants see the options in their own time zone.
    translation: Utilisez un **Sondage horaire de réunion** pour trouver une date et une heure pour une réunion ou un événement. Il remplit le même rôle que des outils de planification comme Doodle, tout en gardant l'organisation de la réunion avec les autres activités du groupe sur Loomio. Les personnes participantes voient les créneaux dans leur propre fuseau horaire.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
