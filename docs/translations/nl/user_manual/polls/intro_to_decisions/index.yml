  ff07fce3bab705aa:
    english: Proposals and polls collect structured responses from a group. They can help test an idea, make a decision, identify priorities, schedule a meeting, or elect representatives.
    translation: Met voorstellen en peilingen verzamel je gestructureerde reacties van een groep. Je kunt er een idee mee toetsen, een beslissing nemen, prioriteiten bepalen, een vergadering plannen of vertegenwoordigers kiezen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f031d2644fee2a91:
    english: "## Find the right help"
    translation: "## Vind de juiste informatie"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  34039c79ea769793:
    english: 'These parts of the manual answer different questions:'
    translation: 'Deze onderdelen van de handleiding beantwoorden verschillende vragen:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  34ea9d58ccbf80fb:
    english: |-
      | If you want to… | Read… |
      |---|---|
      | Choose what participants should express | [Proposals](../proposals/) or [Polls](../proposal_types/) |
      | Run a specific proposal template | [Sense check](../proposals/sense_check/), [Advice](../proposals/advice/), [Consent](../proposals/consent/), or [Consensus](../proposals/consensus/) |
      | Configure the templates available to a group | [Poll templates](../poll_templates/) |
      | Facilitate a decision from discussion to outcome | [Making decisions](/en/guides/making_decisions/) |
    translation: |-
      | Als je wilt… | Lees dan… |
      |---|---|
      | Bepalen wat deelnemers kunnen aangeven | [Voorstellen](../proposals/) of [Peilingen](../proposal_types/) |
      | Een specifiek voorstelsjabloon gebruiken | [Peilen](../proposals/sense_check/), [Advies](../proposals/advice/), [Toestemming](../proposals/consent/) of [Consensus](../proposals/consensus/) |
      | De beschikbare sjablonen voor een groep instellen | [Peilingsjablonen](../poll_templates/) |
      | Een besluit begeleiden van discussie tot conclusie | [Beslissingen nemen](/en/guides/making_decisions/) |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7eddb057cca077f4:
    english: A **voting method** defines how people respond and how results are calculated. A **poll template** is a reusable configuration built on a voting method, with preset instructions, options, and settings. A **decision process** may use a discussion and several templates before the group reaches an outcome.
    translation: Een **stemmethode** bepaalt hoe mensen reageren en hoe de resultaten worden berekend. Een **peilingssjabloon** is een herbruikbare configuratie op basis van een stemmethode, met vooraf ingestelde instructies, opties en instellingen. Een **besluitvormingsproces** kan een discussie en meerdere sjablonen omvatten voordat de groep een conclusie bereikt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3cd46aa2f1240e88:
    english: "## Proposals"
    translation: "## Voorstellen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  85a55fccaf4e4032:
    english: 'A proposal asks people to respond to a statement or course of action. Loomio includes templates for common purposes:'
    translation: 'Met een voorstel vraag je mensen te reageren op een stelling of plan. Loomio heeft sjablonen voor veelvoorkomende doelen:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  51bf1ffa7d057d9e:
    english: |-
      - [Sense check](../proposals/sense_check/) gathers early reactions;
      - [Advice](../proposals/advice/) gathers input for a decision maker;
      - [Consent](../proposals/consent/) tests for meaningful objections; and
      - [Consensus](../proposals/consensus/) seeks collective agreement.
    translation: |-
      - [Peilen](../proposals/sense_check/) verzamelt eerste reacties;
      - [Advies](../proposals/advice/) verzamelt inbreng voor degene die de beslissing neemt;
      - [Toestemming](../proposals/consent/) toetst of er wezenlijke bezwaren zijn; en
      - [Consensus](../proposals/consensus/) zoekt naar gezamenlijke overeenstemming.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d01e9f85fcd2d9c2:
    english: See [Proposals](../proposals/) to compare them.
    translation: Vergelijk ze op de pagina [Voorstellen](../proposals/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  821dcd89b5460804:
    english: "## Polls"
    translation: "## Peilingen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ec746235c7fe89c4:
    english: 'Use a poll when participants need to select, score, allocate, rank, state their availability, or cast an election ballot:'
    translation: 'Gebruik een peiling als deelnemers opties moeten kiezen, beoordelen, punten verdelen of rangschikken, hun beschikbaarheid moeten aangeven of een stem moeten uitbrengen bij een verkiezing:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b93f9fe9611d9205:
    english: |-
      - [Choose](../choose/) finds popular options;
      - [Score](../score/) evaluates every option on a scale;
      - [Allocate](../allocate/) distributes a limited budget of points;
      - [Rank](../rank/) finds an overall order of preference;
      - [Time poll](../meeting_polls/) finds when people are available; and
      - [STV Election](../stv/) elects multiple winners proportionally.
    translation: |-
      - [Kiezen](../choose/) laat zien welke opties populair zijn;
      - [Beoordelen](../score/) beoordeelt elke optie op een schaal;
      - [Punten verdelen](../allocate/) verdeelt een beperkt aantal punten;
      - [Rangschikken](../rank/) bepaalt een algemene voorkeursvolgorde;
      - [Tijdpeiling](../meeting_polls/) laat zien wanneer mensen beschikbaar zijn; en
      - [STV-verkiezing](../stv/) kiest meerdere winnaars naar evenredigheid.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9972b34ccc3ea79b:
    english: See [Polls](../proposal_types/) to compare them.
    translation: Vergelijk ze op de pagina [Peilingen](../proposal_types/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5890626db6dcbb68:
    english: "## Start a proposal or poll"
    translation: "## Start een voorstel of peiling"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4b5338cae269fd32:
    english: "### Choose whether to use a discussion"
    translation: "### Kies of je een discussie gebruikt"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c45fe8ff31f71486:
    english: Start the proposal or poll inside a discussion when people need context, questions, or conversation before responding. A discussion can contain several proposals over time, keeping amendments and the eventual outcome together as one record of the topic.
    translation: Start het voorstel of de peiling in een discussie als mensen eerst context nodig hebben, vragen willen stellen of met elkaar willen praten. Een discussie kan in de loop van de tijd meerdere voorstellen bevatten. Zo blijven wijzigingen en de uiteindelijke conclusie samen bewaard bij het onderwerp.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0bb2a90f8f9dad0c:
    english: Run a standalone poll when the discussion has already happened elsewhere, such as at a meeting, or when the question is simple and you only need to collect responses. Include enough detail or a link to the relevant record so voters understand what they are responding to.
    translation: Start een zelfstandige peiling als de discussie al ergens anders heeft plaatsgevonden, bijvoorbeeld tijdens een vergadering. Dat kan ook als de vraag eenvoudig is en je alleen reacties wilt verzamelen. Geef voldoende uitleg of voeg een link naar het relevante verslag toe, zodat stemmers weten waarop ze reageren.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7d50445f0c54190d:
    english: "### In a discussion"
    translation: "### In een discussie"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  05e03f7ee0e1b4dc:
    english: Open the discussion, scroll to the reply area, select **Start a vote**, and choose a template.
    translation: Open de discussie, scrol naar het reactieveld, selecteer **Start een stemming** en kies een sjabloon.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  55dc0481a5c4ecb6:
    english: "### Without a discussion"
    translation: "### Zonder discussie"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  af5fd115de5f7aec:
    english: Open the **Polls** tab on the group page, select **New poll**, and choose a template.
    translation: Open het tabblad **Peilingen** op de groepspagina, selecteer **Nieuwe peiling** en kies een sjabloon.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  23479ea263004d4a:
    english: If you create a discussion and poll at the same time only to run a vote, avoid notifying people twice. Start the discussion without notifying them and use the poll invitation, or run the poll without a discussion.
    translation: Als je tegelijk een discussie en een peiling maakt om te stemmen, voorkom dan dat mensen twee meldingen krijgen. Start de discussie zonder hen op de hoogte te stellen en nodig hen uit via de peiling. Je kunt de peiling ook zonder discussie starten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  31f857d230319a3c:
    english: "## What happens next"
    translation: "## Wat gebeurt er daarna?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb709a76dfeabd4f:
    english: When starting a proposal or poll, you provide a title and details, review its response options and settings, set a closing time, and invite participants. While it is open, participants can vote, explain their response, and change their vote. Results update as votes are submitted, subject to the poll's result-visibility setting.
    translation: Wanneer je een voorstel of peiling start, geef je een titel en toelichting op, controleer je de antwoordopties en instellingen, stel je een sluitingstijd in en nodig je deelnemers uit. Zolang de stemming open is, kunnen deelnemers stemmen, hun reactie toelichten en hun stem wijzigen. De resultaten worden bijgewerkt zodra stemmen binnenkomen, afhankelijk van de instelling voor de zichtbaarheid van de resultaten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  acd2e813b56034a0:
    english: When it closes, publish an [outcome](../outcomes/) that records what the result means and what will happen next.
    translation: Publiceer na sluiting een [conclusie](../outcomes/) waarin je vastlegt wat het resultaat betekent en wat er daarna gebeurt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
