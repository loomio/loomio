  a29c1c76443ad97f:
    english: Good governance is more than a board meeting, it requires good communication before and after meetings.
    translation: 'La buona governance non si esaurisce nelle riunioni del consiglio: richiede una buona comunicazione prima e dopo ogni riunione.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9f05171a74ac30d0:
    english: |-
      This guide is intended to help you use Loomio in your board or committee, so you can stay connected between meetings, deal with urgent matters and reduce board admin.
      - Continue governance between meetings
      - Keep track of communications
      - Use board meetings for issues that matter
      - Preserve institutional memory with a detailed record
    translation: |-
      Questa guida ti aiuta a usare Loomio nel tuo consiglio o comitato per restare in contatto tra una riunione e l'altra, affrontare le questioni urgenti e ridurre il lavoro amministrativo.
      - Porta avanti il lavoro di governance tra una riunione e l'altra
      - Tieni traccia delle comunicazioni
      - Dedica le riunioni del consiglio alle questioni importanti
      - Conserva la memoria dell'organizzazione con una documentazione dettagliata
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
