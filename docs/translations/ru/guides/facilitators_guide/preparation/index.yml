---
navigation_title: Подготовка
blocks:
  4fdd26e2ff6dd9e5:
    english: "# Preparation"
    translation: "# Подготовка"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4fc02624e97369e9:
    english: |-
      > <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../silvia_200.png"> For every minute of time with the group, consider spending 3 minutes planning. That means spending three hours preparing for a one hour session. Only as you improve should you spend less time planning.
      >
      > — Silvia Zuur
    translation: |-
      > <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../silvia_200.png"> На каждую минуту работы с группой стоит отвести три минуты на планирование. Часовая встреча потребует трёх часов подготовки. Сокращайте время на планирование по мере роста опыта.
      >
      > — Сильвия Зур
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d18832ab8f94fa1b:
    english: "## Understand Purpose"
    translation: "## Определите цель"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  26d88950f0aac205:
    english: Clarification of purpose is one of the highest value offerings of a skilled facilitator — if they can help the group nail that, everything else is possible. Purpose operates at the level of a group as a whole, and at the level of individual discussions/decisions. Purpose is what enables judgment calls about what tools to deploy, what interventions to enact, and what outcomes to aim for. Lack of shared understanding about purpose can be fatal to a discussion, or to the group itself.
    translation: Помочь группе ясно сформулировать цель — одна из самых ценных задач ведущего. Когда цель понятна, проще двигаться дальше. Она нужна и группе в целом, и каждому отдельному обсуждению или решению. Цель помогает выбрать инструменты, понять, когда вмешаться в процесс, и определить желаемый итог. Без общего понимания цели обсуждение или работа группы могут зайти в тупик.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4276182ea8afaf36:
    english: "> Always refer back to your purpose-finding questions to check that you’re covering off what the participants want to learn or achieve. — Silvia Zuur"
    translation: "> Возвращайтесь к вопросам, с помощью которых вы определяли цель. Так вы сможете проверить, отвечаете ли вы на то, что участники хотят узнать или достичь. — Сильвия Зур"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aabfa9d842af2688:
    english: On Loomio
    translation: В Loomio
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ea5f19b8970e4db6:
    english: |-
      * The app offers space for explication of purpose, such as the [group description](/en/user_manual/groups/starting_a_group/#group-description) and [discussion context](/en/user_manual/discussions/using_discussions/#discussion-context) fields.
      * A Loomio discussion *about* purpose is a great place to start with your group, if it's not already clear.
      * Our analytics (stats about how people use the software) show that groups with a clear shared purpose are more successful.
      * [Customer stories and case studies](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help) we've collected emphasise the importance of setting a collective purpose.
    translation: |-
      * В приложении можно изложить цель в [описании группы](/en/user_manual/groups/starting_a_group/#group-description) и поле [контекста обсуждения](/en/user_manual/discussions/using_discussions/#discussion-context).
      * Если у группы ещё нет ясной цели, начните с обсуждения *самой цели* в Loomio.
      * Наша статистика использования показывает, что группы с ясной общей целью добиваются большего успеха.
      * Собранные нами [истории пользователей и примеры из практики](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help) подчёркивают важность общей цели.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e7d962ee3ac4e476:
    english: "## Rearrange the Furniture"
    translation: "## Подготовьте пространство"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bee66f99abaa8e2a:
    english: Desiging the space you invite people into greatly influences their experience. Every gathering is unique, and deserves a setup to suit. Familiarity signals safety, while changing the environment cues openness to new ideas.
    translation: То, как вы организуете пространство для участников, заметно влияет на их опыт. Каждая встреча требует подходящих условий. Знакомая обстановка помогает чувствовать себя увереннее, а перемены располагают к новым идеям.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b98fa9d3e5726891:
    english: In offline spaces, literally rearranging the furniture is a habit that helps facilitators get into the right zone to hold space, and prompts them to think about what’s unique in that session. Imagine the difference between everyone seated in rows versus everyone in a circle.
    translation: При очных встречах ведущие иногда буквально переставляют мебель. Это помогает подготовиться к работе и подумать об особенностях предстоящей встречи. Представьте, как по-разному пойдёт разговор, если все сидят рядами или в кругу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  546ba20d5778bb25:
    english: |-
      * Inviting people into a new digital space specifically for decision making is powerful — there’s a “threshold crossing” experience making it as distinct from other online spaces (which might be for socialising or other functions).
      * [Customising your group photo](/en/user_manual/groups/starting_a_group/#upload-a-group-photo) is a prime opportunity to craft the feeling of the space.
      * The group description is a main piece of “furniture” on the group page, and [you can customise it](/en/user_manual/groups/starting_a_group/#group-description) to suit.
    translation: |-
      * Приглашение в отдельное цифровое пространство для принятия решений помогает участникам переключиться на эту задачу. Оно отличается от других сетевых пространств, где люди могут общаться или заниматься другими делами.
      * [Настройте фотографию группы](/en/user_manual/groups/starting_a_group/#upload-a-group-photo), чтобы создать нужное впечатление от пространства.
      * Описание группы — заметная часть её страницы. [Настройте его](/en/user_manual/groups/starting_a_group/#group-description) под свои задачи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bb1d23808a93d41b:
    english: "## Supplies, Tools, Materials"
    translation: "## Принадлежности, инструменты и материалы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b5e22b09672c3587:
    english: When facilitation is running smoothly, all the supplies a group needs are right at hand. In offline spaces, this stuff includes post-its, pens, paper, name tags, printouts, and background material. Every step a facilitator takes to be well-prepared in this way allows more time and energy for the work.
    translation: Когда работа идёт гладко, всё необходимое группе находится под рукой. При очной встрече это могут быть стикеры, ручки, бумага, бейджи, распечатки и справочные материалы. Чем лучше ведущий подготовит их заранее, тем больше времени и сил останется на саму работу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7da21174f12dfb9e:
    english: |-
      * Many groups use the group description to link to a shared drive of collaborative documents, background information, the group's project management or task tracking system, a list of contacts, etc.
      * Each thread deserves consideration of what people might need to engage with it — putting all the information right at hand is essential (for example, if you reference something, linking directly to it is much more effective than expecting people to search for it).
    translation: |-
      * Многие группы размещают в описании группы ссылки на общее хранилище документов, справочные материалы, систему управления проектом или задачами, список контактов и другие ресурсы.
      * Для каждой темы подумайте, что понадобится участникам. Соберите нужную информацию в одном месте. Например, если вы ссылаетесь на материал, дайте прямую ссылку, чтобы людям не приходилось искать его самостоятельно.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  35dd82fcf7e543d8:
    english: "## Design the Experience"
    translation: "## Продумайте ход работы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fbc88dd9b9738343:
    english: 'Once they have the basic pieces in place (purpose, tools, background info), good facilitators take time to think through the design of the experience they are inviting: the situation, what success could look like, all the possible pathways and choices. They don’t jump in without a considered design.'
    translation: 'Когда цель, инструменты и справочные материалы определены, хороший ведущий продумывает предстоящую работу: исходную ситуацию, признаки успеха, возможные пути и решения. Он не начинает работу без такого плана.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a4dce16ca48a4324:
    english: Time and time again we have seen people drastically underestimate the need for prep and design. Stop and think about the experience you want to host, before jumping straight in. Investment in design is paid back many times over by success later.
    translation: Мы часто видим, что люди сильно недооценивают время на подготовку. Прежде чем начинать, подумайте, какой опыт вы хотите создать для участников. Время, вложенное в планирование, многократно окупается позднее.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e91f002ee6e53550:
    english: "* Loomio’s most basic functionality follows the structure of good facilitation by design: invite people, discuss a topic, gather divergent input, converge into a specific proposal, test for agreement, confirm outcome."
    translation: "* Основные возможности Loomio повторяют последовательность хорошо организованного обсуждения: пригласить людей, обсудить тему, собрать разные мнения, сформулировать конкретное предложение, проверить согласие и зафиксировать итог."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  211e08fc109e6449:
    english: |-
      * Skilled users are already adapting Loomio for various experience designs — such as a multi-step consultation processes, signing off documents, etc. Each job, when facilitated effectively, takes a certain repeatable shape.
      * Online collaboration design doesn't have to reinvent the wheel. Trust what you know works, and translate it. Many tried and tested offline processes can be adapted to the online space (ex: the [Advice Process](/en/guides/making_decisions/advice_process.html)).
      * [Case studies](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help) of thoughtfully designed processes could be used as “recipes” — if you're not sure what design to use, start by seeing what others have tried.
    translation: |-
      * Опытные пользователи уже приспосабливают Loomio для разных процессов: многоэтапных консультаций, согласования документов и других задач. Если процесс хорошо организован, его этапы можно повторять.
      * При планировании совместной работы онлайн можно опираться на знакомые методы. Многие проверенные процессы очной работы можно перенести в цифровое пространство, например [процесс получения советов](/en/guides/making_decisions/advice_process.html).
      * [Примеры из практики](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help) могут служить образцами. Если вы не знаете, как выстроить процесс, посмотрите, что уже пробовали другие.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7e99e2ddc63d7a98:
    english: "## Contextualise the Moment"
    translation: "## Учитывайте обстоятельства"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  427b66f23f4b3c09:
    english: Discussions do not occur in a vacuum, but in the larger context of the group’s history and practice. To be effective, facilitated experiences have to occur with the right timing, and fit in with the rest of the group’s process.
    translation: Обсуждения проходят в контексте истории и привычных способов работы группы. Чтобы процесс был полезным, важно выбрать подходящий момент и согласовать его с остальной работой группы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  48a889b09297e38b:
    english: 'Key Context Questions:'
    translation: 'Вопросы, которые помогут оценить ситуацию:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7eccc4a4e4a3b175:
    english: |-
      * Is this a moment of transition?
      * Is this an enhancement of existing practice?
      * Is this one of many concurrent processes, or a singular focus?
      * Are we here to solve a problem, or go deeper, wider, narrower?
    translation: |-
      * Находится ли группа на этапе перемен?
      * Хотим ли мы улучшить существующий порядок работы?
      * Это один из нескольких одновременных процессов или сейчас у группы одна главная задача?
      * Мы хотим решить проблему или глубже, шире либо точнее рассмотреть вопрос?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c7c8ce0838a076cd:
    english: |-
      * Loomio groups nearly always have a “champion”, who understands the group’s context and makes the call about whether introducing Loomio is right for them.
      * It's not wise to try to change everything at once. Any time Loomio fits nicely into existing workflows, groups will adopt it better.
      * Good timing is when the group is ready to incorporate online collaborative practice effectively. They have to feel the pain of not having the online decision-making space, and be motivated to solve that problem.
      * Consider the group’s attention economy to determine when the right time to raise a given topic might be. Collective attention is a limited resource.
      * Many groups are not even cognisant of their existing collaborative practice and habits, much less clear about how Loomio might fit in. Start with a discussion about the current way of doing things, and what's working or not working.
    translation: |-
      * Почти в каждой группе Loomio есть человек, который хорошо понимает её обстоятельства и решает, подходит ли ей Loomio.
      * Не пытайтесь изменить всё сразу. Группам проще освоить Loomio, когда он вписывается в привычный порядок работы.
      * Подходящий момент наступает, когда группа готова эффективно работать вместе онлайн. Участники должны видеть, что им не хватает пространства для принятия решений, и хотеть решить эту проблему.
      * Выбирая время для новой темы, учитывайте, сколько внимания группа может ей уделить. Общее внимание ограничено.
      * Многие группы ещё не осознают собственные привычки совместной работы и не понимают, как в них может вписаться Loomio. Начните с обсуждения того, как группа работает сейчас, что получается, а что нет.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7bc2616a0ec0b1dc:
    english: "## The Role of the Facilitator"
    translation: "## Роль ведущего"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c6d08854a875262a:
    english: Good facilitation requires self-awareness on an individual and collective level. Lack of understanding of the role can lead to misunderstandings, conflict, or unsafe situations.
    translation: Для успешного ведения процесса нужно понимать себя и группу. Если роль ведущего неясна, возможны недоразумения, конфликты и небезопасные ситуации.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aa59e3e4d08a95b7:
    english: "> Have the power handed over to you. When you’re invited into a new group or organization, everybody will be thinking: Who’s this joker? Why should we listen to them? Get somebody who the participants know and trust to introduce you. This builds you up in the participants' minds and helps to hand over the power over to you. — Silvia Zuur"
    translation: "> Позаботьтесь о том, чтобы вам передали полномочия. Когда вас приглашают в новую группу или организацию, участники могут думать: «Кто это? Почему мы должны его слушать?» Попросите человека, которого они знают и которому доверяют, представить вас. Это поможет участникам принять вас в роли ведущего и передать вам необходимые полномочия. — Сильвия Зур"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  02d38d1def45d150:
    english: |-
      ### Consent
      It’s critical that the group consents to be facilitated. Attempting to facilitate otherwise can be at worst coercive (unfair to the group) and dangerous (unfair to the facilitator) — and will face resistance and confusion. Facilitators put themselves in a vulnerable position; they must have mandate or they should not agree to engage. Consent is critical for both the facilitator and participants.
    translation: |-
      ### Согласие
      Важно, чтобы группа согласилась на участие ведущего. Без согласия попытка вести процесс может восприниматься как давление на группу и создавать риск для самого ведущего. Она также вызовет сопротивление и недоумение. Ведущий оказывается в уязвимом положении. Ему нужны полномочия от группы, иначе не стоит браться за эту работу. Согласие важно и для ведущего, и для участников.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a1a8c6ca89dad49a:
    english: |-
      ### Responsibility
      Once a facilitator takes up a mandate, they carry enhanced responsibilities. Facilitators have more claim to floor time, and directing the group’s attention. This has to be used in service to the whole, not for a personal agenda. The words and demeanor of the facilitator will also have a disproportionate effect, meaning they have to act with heightened consideration.
    translation: |-
      ### Ответственность
      Приняв полномочия, ведущий берёт на себя дополнительную ответственность. Он может чаще брать слово и направлять внимание группы. Эти возможности нужно использовать в интересах всей группы, а не ради личных целей. Слова и поведение ведущего особенно сильно влияют на участников, поэтому ему следует действовать осмотрительно.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b5f6b4ebd477c97c:
    english: |-
      ### Power
      Facilitation by nature introduces power differentials. If the facilitator cannot exercise power in certain ways, they cannot do their job. For example, to keep a discussion on topic the facilitator might interrupt someone, or say that a certain way of interacting is not OK. It’s not appropriate to expect a facilitator to shoulder responsibility for the experience without giving them the powers they need to deliver successfully. There is no one right answer about how much power, but it has to be balanced with the level of responsibility.
    translation: |-
      ### Полномочия
      Ведение процесса неизбежно даёт ведущему особые полномочия. Без них он не сможет выполнять свою работу. Например, чтобы удержать обсуждение в рамках темы, ведущему может понадобиться прервать участника или сказать, что определённый способ общения неприемлем. Нельзя возлагать на ведущего ответственность за процесс, не предоставив ему необходимых полномочий. Единого правила об их объёме нет, но он должен соответствовать уровню ответственности.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c82df3fe42db014a:
    english: |-
      ### Responsiveness
      Facilitators do their best work when they can adapt effectively to the emergent reality. Human beings are endlessly complex, and groups of them exponentially more so. Rigid adherence to a plan or protocol without flexibility can set the group up to fail. If a facilitator is not allowed or not willing to adapt to changing circumstance, they cannot effectively hold the space for dynamic humans.
    translation: |-
      ### Гибкость
      Ведущий работает лучше, когда может реагировать на происходящее и менять подход. Люди сложны, а взаимодействие в группе ещё сложнее. Если жёстко следовать плану или правилам, не учитывая ситуацию, группа может не достичь цели. Ведущий, который не может или не хочет приспосабливаться к переменам, не сможет эффективно поддерживать работу группы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aad36b296834ab22:
    english: "> Wear and un-wear the facilitation-hat. A challenge many people face is trying to facilitate meetings and workshops with their own team. As a facilitator, they need to be neutral. But as a team member, they have valuable insights to share. Make it really clear when you’re a facilitator and when you’re being a participant. — Silvia Zuur"
    translation: "> Чётко обозначайте, когда вы выступаете ведущим, а когда — участником. Многим приходится вести встречи и семинары в собственной команде. В роли ведущего им нужно сохранять нейтралитет. Но как участники команды они могут поделиться полезными наблюдениями. Дайте группе ясно понять, какую роль вы выполняете в каждый момент. — Сильвия Зур"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  85c4fcf7a6e72361:
    english: |-
      * Many groups using Loomio are experienced with facilitation and already have a shared understanding of the role. They already adapt the tool to meet these needs with some success.
      * Often the person who starts a discussion is assumed to be facilitating it, barring another agreed understanding in the group. Clarity about who is facilitating can greatly enhance mutual safety and success.
      * Loomio naturally creates a dynamic and open to distributed acts of facilitation, such as users tagging in others, requests to stay on topic, suggestions of the right timing for a proposal, etc — but this is often left implicit. Explicitly naming what acts of facilitation are and discussing whether this role is centralised or distributed can clarify the role.
      * Implicit distributed facilitation can be the default starting place for an online group (ie, no discussion of facilitation as a named role), but that setup is actually best for advanced groups prgressing past working with explicit facilitation.
    translation: |-
      * Многие группы в Loomio уже умеют организовывать обсуждения и одинаково понимают роль ведущего. Они приспосабливают инструмент к своим задачам.
      * Часто считается, что обсуждение ведёт тот, кто его начал, если группа не договорилась иначе. Когда всем ясно, кто ведёт обсуждение, участникам проще взаимодействовать и достигать результата.
      * Loomio позволяет распределять отдельные задачи ведущего между участниками: приглашать других в обсуждение, просить придерживаться темы, предлагать подходящий момент для внесения предложения. Но часто такое распределение остаётся неявным. Обсудите, какие действия относятся к ведению процесса и кто за них отвечает.
      * В онлайн-группе обязанности ведущего могут распределяться без специального обсуждения этой роли. Однако такой порядок лучше подходит опытным группам, которые уже поработали с явно назначенным ведущим.
