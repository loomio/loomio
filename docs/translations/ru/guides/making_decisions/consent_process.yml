  f3c6b8e6992d240a:
    english: Make a decision that is ‘safe to try’, without objections.
    translation: Примите решение, которое «можно попробовать», если против него нет возражений.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b11cbc132fe6b4d0:
    english: Seek consent on a decision you need to make, where there are no meaningful objections to your proposal, so you can make a fast decision that is 'safe to try' now.
    translation: Получите согласие на нужное решение. Если против вашего предложения нет существенных возражений, вы сможете быстро принять решение, которое уже сейчас «можно попробовать».
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  75e8b175ecfcd49a:
    english: "> *“Consent turns the question around: instead of asking for what we want, we ask whether there are reasons not to go ahead.” - Ted Rau, Sociocracy For All*"
    translation: "> *«Согласие меняет постановку вопроса: вместо того чтобы спрашивать, чего мы хотим, мы спрашиваем, есть ли причины не двигаться дальше». — Тед Рау, Sociocracy For All*"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  55ccc01c9b274a87:
    english: |-
      ## Key points
      - Aim for a ‘good enough’ decision.
      - Involve many voices to develop a workable proposal.
      - Ask if anyone has a valid objection.
      - Amend the proposal to resolve objections.
    translation: |-
      ## Основные принципы
      - Стремитесь принять решение, которое «достаточно хорошо».
      - Привлеките разных людей к разработке осуществимого предложения.
      - Спросите, есть ли у кого-либо обоснованные возражения.
      - Измените предложение, чтобы устранить возражения.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7c2ef9fc3419f4b7:
    english: |-
      **Typical roles:**
      - Proposer: The person who raises a topic that requires a decision.
      - Facilitator: Someone who can help the proposer do their job efficiently.
    translation: |-
      **Типичные роли:**
      - Автор предложения: человек, который поднимает вопрос, требующий решения.
      - Ведущий: человек, который помогает автору предложения эффективно провести процесс.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c56d1ea7a5582723:
    english: |-
      ## Consent process steps
      You notice a problem or opportunity and take the initiative.
      1. Present a proposal - start a Loomio **discussion**.
      2. Facilitate a round of questions, reactions and any comments to improve the proposal - run a **Sense check proposal**.
      3. Amend the proposal with suggestions and comments.
      4. Ask if anyone has a meaningful objection to the amended proposal - run a **Consent proposal**.
      5. Integrate valid objections to create an amended version of the proposal that everyone consents is ‘safe to try’ - state the decision **outcome**.
    translation: |-
      ## Этапы процесса согласия
      Вы заметили проблему или возможность и решили действовать.
      1. Представьте предложение — начните **Обсуждение** в Loomio.
      2. Проведите раунд вопросов, откликов и комментариев, чтобы улучшить предложение — запустите **предложение для проверки мнений**.
      3. Измените предложение с учётом предложений и комментариев.
      4. Спросите, есть ли у кого-либо существенные возражения против изменённого предложения — запустите **предложение с голосованием по согласию**.
      5. Учтите обоснованные возражения и подготовьте версию предложения, которую все согласны «попробовать», — опубликуйте **Исход** решения.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  735e10dde58793f0:
    english: |-
      >[!Tip]
      >In more complex decisions you may also include a clarifying **Questions round** at step 2, to help people understand the proposal before inviting them to react and comment on the proposal.
    translation: |-
      >[!Tip]
      >Если решение сложное, на этапе 2 можно также провести уточняющий **Раунд вопросов**. Это поможет людям понять предложение, прежде чем вы попросите их поделиться откликами и комментариями.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9cf871a054d8e628:
    english: |-
      ## Benefits
      - Faster, efficient, clear and more adaptable decisions.
      - Diverse perspectives and empowered engagement builds trust.
      - A more agile, transparent and inclusive culture.
    translation: |-
      ## Преимущества
      - Решения принимаются быстрее, становятся яснее и легче поддаются изменению.
      - Разные точки зрения и активное участие укрепляют доверие.
      - Работа становится более гибкой, прозрачной и открытой для участия.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '09907f3ec328e9d2':
    english: "## Applying the Consent process on Loomio"
    translation: "## Как провести процесс согласия в Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d7c91a6160b45cf:
    english: |-
      | **Consent process** | **On Loomio** |
      |---|---|
      | You notice a problem or opportunity and take the initiative. |  |
      | **Present a proposal** <br /><br />Write a clear and concise proposal and share it with people impacted. Describe it in a way so that others will understand what you are proposing. | Start a Loomio **discussion**. <br /><br />Name the proposal in the discussion title, and describe it in the context. |
      | **Questions** (Optional) <br /><br />Invite clarifying questions to help people understand the proposal. <br /><br />*“A clarifying question round helps make sure everyone understands the proposal before they say what they think about it.”* | Run a **Question round**. If it is hidden, a group administrator can make it available from [Poll templates](/en/user_manual/polls/poll_templates/). <br /><br />Ask “what do you need to know so you understand the proposal?” |
      | **Reactions** <br /><br />Invite people to offer reactions and comments to improve the proposal. <br /><br />This is a sensing and responding round - *to actively sense and interpret information from the group and then respond or adapt accordingly.* | Run a **[Sense check](/en/user_manual/polls/proposals/sense_check/)** proposal. <br /><br />*In the title:* Name the proposal and say this is an opportunity to react and comment. <br /><br />*In the proposal details:* Clearly frame the proposal and say why it is important.  Include any background information necessary and a link to the current proposal version.  <br /><br />Invite everyone to respond, and to do so before the proposal closes.  |
      | **Amendment** <br /><br />Consider comments and suggestions from people and amend the proposal as appropriate for the good of your organization. <br /><br />Consider any amendments you want to make for the new proposal version. | Reply to comments and suggestions raised in the Sense check proposal. <br /><br />State an **outcome** to summarize the results of the proposal.  <br /><br />Note any concerns or new information discovered, and outline how the proposal will be amended. <br /><br />Say what will happen next and notify people about the outcome. |
      | **Objections** <br /><br />Present the amended proposal version and invite people to state valid objections - objections that might cause harm. <br /><br />Respond to and integrate each objection by amending the proposal. | Run a **[Consent proposal](/en/user_manual/polls/proposals/consent/)** with the amended proposal. <br /><br />*In the title:* Name the decision to be made. <br /><br />*In the proposal details:* Present the proposal and invite people to vote consent or to state a valid objection - an objection that might cause harm.  Remember we are seeking consent that the proposal is 'safe to try'. <br /><br />Respond to and integrate each objection, creating an amended version of the proposal. <br /><br />Notify everyone that there has been a further amendment, and invite them to reconsider their Consent and “change your vote”. <br /><br />Or run successive Consent proposals as necessary until objections are resolved. |
      | **Outcome** <br /><br />When there are no remaining objections and everyone has consented, the result of the decision is announced. | State an **outcome**. <br /><br />Close the proposal. State an outcome and notify everyone involved. <br /><br />State the decision made and thank people for participation in the process. <br /><br />Summarize results of the process and say what will happen next. <br /><br />If no valid objections remain, state that there is consent the proposal is 'safe to try'. <br /><br />The outcome statement is an important record of the decision for future reference. |
    translation: |-
      | **Процесс согласия** | **В Loomio** |
      |---|---|
      | Вы заметили проблему или возможность и решили действовать. |  |
      | **Представьте предложение** <br /><br />Напишите ясное и краткое предложение и поделитесь им с теми, кого затронет решение. Объясните, что именно вы предлагаете. | Начните **Обсуждение** в Loomio. <br /><br />Укажите предложение в заголовке обсуждения и опишите его в контексте. |
      | **Вопросы** (необязательно) <br /><br />Предложите людям задать уточняющие вопросы, чтобы они могли понять предложение. <br /><br />*«Раунд уточняющих вопросов помогает убедиться, что все поняли предложение, прежде чем высказывать своё мнение о нём».* | Запустите **Раунд вопросов**. Если он скрыт, администратор группы может включить его в разделе [Шаблоны опросов](/en/user_manual/polls/poll_templates/). <br /><br />Спросите: «Что вам нужно узнать, чтобы понять предложение?» |
      | **Отклики** <br /><br />Предложите людям поделиться откликами и комментариями, которые помогут улучшить предложение. <br /><br />Это раунд сбора откликов и ответа на них: *вы изучаете мнения группы, а затем отвечаете или меняете предложение с их учётом.* | Запустите предложение **[Проверка мнений](/en/user_manual/polls/proposals/sense_check/)**. <br /><br />*В заголовке:* Назовите предложение и укажите, что здесь можно поделиться откликами и комментариями. <br /><br />*В описании предложения:* Ясно изложите предложение и объясните, почему оно важно. Добавьте необходимые сведения и ссылку на текущую версию предложения. <br /><br />Предложите всем ответить до закрытия предложения. |
      | **Изменение предложения** <br /><br />Рассмотрите комментарии и предложения людей. Внесите изменения, которые принесут пользу вашей организации. <br /><br />Решите, что нужно изменить в новой версии предложения. | Ответьте на комментарии и предложения, оставленные в предложении для проверки мнений. <br /><br />Опубликуйте **Исход**, чтобы подвести итоги предложения. <br /><br />Отметьте выявленные опасения и новые сведения. Объясните, как изменится предложение. <br /><br />Расскажите, что будет дальше, и уведомите людей об исходе. |
      | **Возражения** <br /><br />Представьте изменённую версию предложения и попросите людей высказать обоснованные возражения — указать, какой вред оно может причинить. <br /><br />Ответьте на каждое возражение и учтите его при изменении предложения. | Запустите **[предложение с голосованием по согласию](/en/user_manual/polls/proposals/consent/)** с изменённой версией. <br /><br />*В заголовке:* Укажите, какое решение нужно принять. <br /><br />*В описании предложения:* Представьте предложение и попросите людей выразить согласие голосом или высказать обоснованное возражение — указать, какой вред оно может причинить. Цель — получить согласие с тем, что предложение «можно попробовать». <br /><br />Ответьте на каждое возражение и учтите его в новой версии предложения. <br /><br />Уведомите всех об очередном изменении и предложите пересмотреть своё согласие и «изменить голос». <br /><br />При необходимости запускайте новые предложения с голосованием по согласию, пока возражения не будут устранены. |
      | **Исход** <br /><br />Когда возражений больше нет и все выразили согласие, объявите принятое решение. | Опубликуйте **Исход**. <br /><br />Закройте предложение. Опубликуйте исход и уведомите всех участников. <br /><br />Сообщите, какое решение принято, и поблагодарите людей за участие. <br /><br />Подведите итоги процесса и расскажите, что будет дальше. <br /><br />Если обоснованных возражений не осталось, укажите, что все согласны: предложение «можно попробовать». <br /><br />Текст исхода сохраняет решение, к которому можно будет обратиться позже. |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  525fe55f979f05e3:
    english: "### Objections"
    translation: "### Возражения"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3cc3304a15bc3d2f:
    english: In the Consent process, an objection is defined as something that **might cause harm to the team or organization**.
    translation: В процессе согласия возражение — это указание на то, что **может причинить вред команде или организации**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ab509ea088e16a0d:
    english: |-
      Objections should meet this criteria to be valid:
      - Explicit: *I can make a reasoned case*
      - Impersonal: *It's not just a personal preference*
      - Evidenced: *Not predictive, based on experience*
      - Not 'safe to fail': *It's not that I have a 'better idea'*
    translation: |-
      Обоснованное возражение должно соответствовать следующим критериям:
      - Чётко сформулировано: *Я могу привести доводы в его пользу*
      - Не сводится к личным предпочтениям: *Дело не только в том, что мне так больше нравится*
      - Основано на опыте: *Это не просто предположение о будущем*
      - Указывает на риск: *Дело не в том, что у меня есть «идея получше»*
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '08d3059af11ce88f':
    english: "## Example of a Consent process on Loomio"
    translation: "## Пример процесса согласия в Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ec691660458e426c:
    english: "### Step 0. You notice a problem or opportunity and take the initiative"
    translation: "### Этап 0. Вы замечаете проблему или возможность и решаете действовать"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7dd26502d162e33e:
    english: "*Is the problem or opportunity is worth pursuing?* Chloe noticed that new Health and Safety legislation is coming into effect soon, and has taken the lead to draft a policy for her organization."
    translation: "*Стоит ли заниматься этой проблемой или возможностью?* Хлоя узнала, что скоро вступят в силу новые требования по охране труда, и взялась подготовить политику для своей организации."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b6afe6516fd602d4:
    english: "*Is there a decision to be made?* The Health and Safety policy document will need to be approved as a formal policy."
    translation: "*Нужно ли принять решение?* Документ об охране труда потребуется официально утвердить."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5e80186b2ed95b37:
    english: "*Does it impact other people and your organization?* The policy impacts everyone in the organization.  Staff will need to comply with the policy, and it will become a legal obligation of the organization."
    translation: "*Затронет ли решение других людей и вашу организацию?* Политика касается всех сотрудников. Им нужно будет её соблюдать, а организация будет обязана выполнять её требования по закону."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bc0f7f13bdc1f533:
    english: "### Step 1. Present a proposal"
    translation: "### Этап 1. Представьте предложение"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  72e08141a5c023c5:
    english: Chloe starts a Loomio thread outlining the need to develop a Health and Safety policy, proposing to lead this work with a first draft, inviting contributions to develop the policy and that she is starting a Consent process to adopt the policy.
    translation: Хлоя начинает тему в Loomio. Она объясняет, почему нужна политика по охране труда, предлагает подготовить первый проект и приглашает других помочь с его разработкой. Она также сообщает, что начинает процесс согласия для принятия политики.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aedd5ec7bae09e0c:
    english: "### Step 2. Facilitate a clarifying question round"
    translation: "### Этап 2. Проведите раунд уточняющих вопросов"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  71ad95aa780b52f8:
    english: Chloe runs a Question proposal to open a question round, inviting people to ask clarifying questions about the Health and Safety policy within a set period.  Some further background information along with the draft document is provided for context.
    translation: Хлоя запускает предложение «Раунд вопросов» и приглашает людей в установленный срок задать уточняющие вопросы о политике по охране труда. Для контекста она добавляет проект документа и дополнительные сведения.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dcc6429fd48d9730:
    english: The aim at this stage is to help people understand the policy before they say what they think about it.
    translation: На этом этапе важно помочь людям понять политику, прежде чем они выскажут о ней своё мнение.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5ea5e1926f6c575b:
    english: People ask questions in the proposal 'Reason' text field and click 'Submit vote'.  Chloe replies to questions.
    translation: Люди задают вопросы в текстовом поле «Причина» и нажимают «Отправить голос». Хлоя отвечает на вопросы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  99a04622ca0997d0:
    english: "### Step 3. Facilitate a reactions round "
    translation: "### Этап 3. Проведите раунд откликов"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  97ed321f599305b8:
    english: 'Chloe now opens a Reactions round by running a Sense check proposal.  People are invited to offer reactions and comments to improve the policy.  '
    translation: Теперь Хлоя запускает предложение для проверки мнений и открывает раунд откликов. Людей приглашают поделиться мнениями и комментариями, которые помогут улучшить политику.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9a6fc43806e90356:
    english: This round is an opportunity to actively sense and interpret information from the group and then respond or adapt accordingly.
    translation: Этот раунд позволяет собрать и осмыслить мнения группы, а затем ответить на них или внести изменения.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d86e63424185ef5a:
    english: "### Step 4. Amend the proposal"
    translation: "### Этап 4. Измените предложение"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d7be57cd9ffe1142:
    english: When the Sense check proposal closes, Chloe notifies everyone and works to amend the policy appropriately.
    translation: Когда предложение для проверки мнений закрывается, Хлоя уведомляет всех и вносит необходимые изменения в политику.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c3584939cbfea28e:
    english: "### Step 5. Seek consent to adopt the policy"
    translation: "### Этап 5. Получите согласие на принятие политики"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0eb85e3f6caeb550:
    english: The Health and Safety policy is looking good.  People have had the opportunity to ask questions and to offer suggestions to improve the policy.
    translation: Проект политики по охране труда готов к следующему этапу. У людей была возможность задать вопросы и предложить, как его улучшить.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
