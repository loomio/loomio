  0431c9fc46658338:
    english: 'The group participation report gives insights into the usage of your Loomio group. '
    translation: O relatório de participação mostra como seu grupo usa o Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0d23c0831f1ea6ca:
    english: 'You''re able to choose which groups to include in the report, the start and end date for the report, and the interval (year, month, week or day) for grouping results. '
    translation: Você pode escolher os grupos incluídos no relatório, as datas de início e fim e o intervalo para agrupar os resultados (ano, mês, semana ou dia).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  73c9822c08a37866:
    english: The report is available to everyone in your group, however users can only see results for groups that they belong to, this means that different users may see slightly different reports.
    translation: O relatório está disponível para todos os membros do seu grupo. Cada pessoa vê apenas os resultados dos grupos dos quais participa. Por isso, os relatórios podem variar entre usuários.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c9402b4720639f86:
    english: 'You can find the report by clicking the group settings menu cog, as shown below. '
    translation: Para encontrar o relatório, clique no ícone de engrenagem do menu de configurações do grupo, como mostrado abaixo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
