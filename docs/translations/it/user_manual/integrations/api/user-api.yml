  a4f66c4c94afa135:
    english: The request timeout is five seconds. A `2xx` response, including `204 No Content`, is treated as successful. Webhook consumers should respond promptly, process longer work asynchronously, and tolerate duplicate or out-of-order deliveries.
    translation: Il timeout della richiesta è di cinque secondi. Una risposta `2xx`, incluso `204 No Content`, è considerata riuscita. Il servizio che riceve il webhook dovrebbe rispondere rapidamente, elaborare in modo asincrono le operazioni più lunghe e gestire invii duplicati o fuori ordine.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  84faa7dad6f34739:
    english: Loomio does not currently add a webhook signature, shared-secret header, event ID, or delivery ID. Treat the full destination URL as a credential, do not expose it publicly, and include an unguessable token in the URL when the receiving service supports one. If a stable machine-readable event schema or signed delivery is required, use the webhook as a change notification and retrieve the current records through the authenticated User API.
    translation: 'Attualmente Loomio non aggiunge una firma del webhook, un''intestazione con un segreto condiviso, un ID evento o un ID invio. Tratta l''URL completo di destinazione come una credenziale: non renderlo pubblico e includi nell''URL un token difficile da indovinare se il servizio ricevente lo supporta. Se ti serve uno schema degli eventi stabile e leggibile da software o un invio firmato, usa il webhook come notifica delle modifiche e recupera i dati aggiornati tramite l''API utente autenticata.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f3d956b4694f793c:
