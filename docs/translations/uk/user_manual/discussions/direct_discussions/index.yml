  5a0b9426a2d88e62:
    english: |-
      ## Contacting someone via a direct discussion
      A direct discussion can be used to contact one or more people privately without creating a subgroup.
    translation: |-
      ## Як зв’язатися з кимось через пряме обговорення
      Пряме обговорення дає змогу приватно зв’язатися з однією або кількома людьми без створення підгрупи.
