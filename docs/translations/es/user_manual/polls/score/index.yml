navigation_title: Encuesta de puntuación
blocks:
  c719d051fa2f700e:
    english: "# Score"
    translation: "# Encuesta de puntuación"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  517adc384b38d256:
    english: Score measures how participants evaluate each option on a shared numeric scale. Unlike Choose, it asks people to respond to every option, so the results show both what people prefer and how strongly they prefer it.
    translation: La encuesta de puntuación mide cómo evalúan los participantes cada opción en una misma escala numérica. A diferencia de Elegir, pide puntuar todas las opciones. Así, los resultados muestran cuáles prefieren y cuánto las prefieren.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a678333f6d814e87:
    english: "## When to use Score"
    translation: "## Cuándo usar una encuesta de puntuación"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c4ca19abb53e3ddc:
    english: 'Use Score when every option can be evaluated independently against the same question. It works well for:'
    translation: 'Usa una encuesta de puntuación cuando cada opción se pueda evaluar por separado con la misma pregunta. Sirve para:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c77c1ad6b2a9d697:
    english: |-
      - assessing how ready each part of a project is;
      - rating the importance of several principles;
      - measuring interest in possible meeting topics;
      - evaluating grant applications against a common criterion; or
      - comparing the suitability of several proposals.
    translation: |-
      - evaluar el grado de preparación de cada parte de un proyecto;
      - puntuar la importancia de varios principios;
      - medir el interés en posibles temas para una reunión;
      - evaluar solicitudes de subvención con un criterio común; o
      - comparar la idoneidad de varias propuestas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d91459d96a31a671:
    english: Define what the bottom and top of the scale mean. A number without a shared definition can mean different things to different voters. Use [Choose](/en/user_manual/polls/choose/) when you only need selections, or [Allocate](/en/user_manual/polls/allocate/) when participants must make trade-offs within a limited budget.
    translation: Define qué significan los extremos de la escala. Sin una definición compartida, cada votante puede interpretar un número de forma distinta. Usa [Elegir](/en/user_manual/polls/choose/) si solo necesitas que seleccionen opciones, o [Asignar](/en/user_manual/polls/allocate/) si los participantes deben distribuir un presupuesto limitado entre ellas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6160518dc06b70a7:
    english: "## Example: score possible trial locations"
    translation: "## Ejemplo: puntuar posibles lugares para una prueba"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a75c387743cad529:
    english: Oatmilk Cooperative is choosing locations for a returnable-bottle trial. It asks members to score four locations from 0 (**unsuitable**) to 10 (**ideal**), considering customer access, staff capacity, storage, and collection transport.
    translation: La cooperativa Oatmilk está eligiendo lugares para una prueba de botellas retornables. Pide a sus integrantes que puntúen cuatro lugares de 0 (**inadecuado**) a 10 (**ideal**), teniendo en cuenta el acceso de los clientes, la disponibilidad del personal, el almacenamiento y el transporte para la recogida.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c74ebb16f872b3c6:
    english: "## Set up the poll"
    translation: "## Configura la encuesta"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b03122ee279f9c91:
    english: State one question that applies equally to every option. Add the items to be assessed, set the **Minimum score** and **Maximum score**, and explain the endpoints in the details. Option meanings can clarify the scope of each item.
    translation: Plantea una pregunta que se aplique por igual a todas las opciones. Añade los elementos que se evaluarán, establece el **Mínimo Marcador** y el **Máximo marcador**, y explica qué significan los extremos de la escala en los detalles. El significado de cada opción puede aclarar qué abarca cada elemento.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  85e66520acf78264:
    english: Choose a scale participants can apply consistently. A 0–5 scale is quick to use; a 0–10 scale allows finer distinctions. More precision does not necessarily produce better information, so use the shortest scale that fits the question.
    translation: Elige una escala que los participantes puedan aplicar de forma coherente. Una escala de 0 a 5 es rápida de usar; una de 0 a 10 permite distinguir mejor entre opciones. Una mayor precisión no siempre aporta mejor información, así que usa la escala más corta que se ajuste a la pregunta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bb3998655598796f:
    english: Anonymous voting and showing options in random order can be useful when you want to reduce social or ordering effects.
    translation: El voto anónimo y la presentación de las opciones en orden aleatorio pueden ayudar a reducir la influencia social o del orden de las opciones.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Vota"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  33199814c9ad8a64:
    english: Participants move a slider to score every option. In this example, the voter scores Central Station cafe at 8, Riverside market at 6, the University food court at 7, and Harbour offices at 5.
    translation: Los participantes mueven un control deslizante para puntuar cada opción. En este ejemplo, una persona da 8 puntos a la cafetería de la Estación Central, 6 al mercado de Riverside, 7 al comedor de la Universidad y 5 a las oficinas del Puerto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fba3d21a09846414:
    english: The reason explains how the voter applied the scale. This helps the group distinguish a low score caused by missing information from one caused by substantive concern.
    translation: El motivo explica cómo aplicó la escala esa persona. Esto ayuda al grupo a distinguir si una puntuación baja se debe a la falta de información o a una preocupación de fondo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Lee los resultados"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  846b7759f9d54232:
    english: 'For each option, the results show:'
    translation: 'Para cada opción, los resultados muestran:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cac30fa54f0aeaf7:
    english: |-
      - **Points**: the sum of all scores;
      - **Mean**: the average score; and
      - **Voters**: how many people scored the option.
    translation: |-
      - **Puntos**: la suma de todas las puntuaciones;
      - **Principal**: la puntuación media; y
      - **Votantes**: cuántas personas puntuaron la opción.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7e063d4b1babcb9e:
    english: In this example, **Central Station cafe** has the highest mean at 7.5. **Harbour offices** has the lowest mean at 5.25, while Riverside market and the University food court are tied at 7. Four of five invited people have voted, so the group can also see that one response is outstanding.
    translation: En este ejemplo, **la cafetería de la Estación Central** tiene la media más alta, con 7,5. **Las oficinas del Puerto** tienen la media más baja, con 5,25, mientras que el mercado de Riverside y el comedor de la Universidad empatan con 7. Han votado cuatro de las cinco personas invitadas, así que el grupo también puede ver que falta una respuesta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  147800d3643d9942:
    english: Compare means only when the options have a similar number of voters. Read the vote reasons before treating a small difference as meaningful, and publish an outcome explaining what action follows from the scores.
    translation: Compara las medias solo si las opciones tienen un número similar de votantes. Lee los motivos de los votos antes de considerar significativa una diferencia pequeña y publica una conclusión que explique qué se hará a partir de las puntuaciones.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
