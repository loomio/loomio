  2072a463e55dfba1:
    english: "# Advice"
    translation: "# Consejo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  aadbf3844be4a95f:
    english: An Advice proposal gathers input for a decision that a person or team is responsible for making. Participants can offer advice or indicate that they have no advice to add.
    translation: Una propuesta de Consejo recoge aportaciones para una decisión que debe tomar una persona o un equipo. Quienes participan pueden dar consejos o indicar que no tienen nada que añadir.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  769a2446fc3ec4a9:
    english: This page explains the Advice proposal form, voting, and results. See the [Advice process](/en/guides/making_decisions/advice_process) for the complete workflow from framing the decision to publishing an outcome.
    translation: Esta página explica cómo se presenta una propuesta de Consejo, cómo se vota y cómo se muestran los resultados. Consulta el [proceso de Consejo](/en/guides/making_decisions/advice_process) para conocer el proceso completo, desde la definición de la decisión hasta la publicación de una conclusión.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f19e32088d70eec4:
    english: "## When to use Advice"
    translation: "## Cuándo usar Consejo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d4c7e7da6f2d5860:
    english: Use Advice when the decision maker wants input from people with relevant expertise or people affected by the decision. It works well for supplier choices, operational decisions, policy drafts, and decisions within a delegated role.
    translation: Usa Consejo cuando quien toma la decisión quiere escuchar a personas con experiencia relevante o afectadas por la decisión. Es útil para elegir proveedores, tomar decisiones operativas, preparar políticas y decidir sobre asuntos delegados.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a81e33e00080fbe4:
    english: Advice is not an approval vote. Say who will make the decision, what constraints apply, and how they will consider the responses.
    translation: Consejo no es una votación para aprobar una decisión. Indica quién tomará la decisión, qué límites deberá respetar y cómo tendrá en cuenta las respuestas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4be7ef0783f6e444:
    english: "## Example: choose a washing supplier"
    translation: "## Ejemplo: elegir un proveedor de lavado"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d8157e98107798c6:
    english: Oatmilk Cooperative's operations coordinator must select a washing supplier. They invite advice about capacity, food-safety records, water use, service response times, and support.
    translation: La persona que coordina las operaciones de la Cooperativa Oatmilk debe elegir un proveedor de lavado. Invita a dar consejos sobre la capacidad, los registros de seguridad alimentaria, el uso del agua, los tiempos de respuesta del servicio y la asistencia.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9703f1f9474243af:
    english: "## Set up the proposal"
    translation: "## Configurar la propuesta"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6b9c305f0f4000d9:
    english: Describe the decision, name the decision maker, and include the information participants need. Invite people who are affected or have relevant knowledge. The default options let someone offer advice or abstain.
    translation: Describe la decisión, indica quién la tomará e incluye la información que necesitan quienes participen. Invita a las personas afectadas o que tengan conocimientos relevantes. Las opciones predeterminadas permiten dar consejos o abstenerse.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Votar"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0a259af7a59899b7:
    english: Participants select **Advice** and give a concrete recommendation, risk, question, or relevant experience. They can abstain when they have no useful input.
    translation: Quienes participan seleccionan **Consejo** y aportan una recomendación concreta, un riesgo, una pregunta o una experiencia relevante. Pueden abstenerse si no tienen nada útil que aportar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Leer los resultados"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1d4bf7b5d0079f87:
    english: The chart confirms who has responded, but the reasons contain the substance of an Advice proposal. Look for constraints, agreements, and conflicting recommendations rather than treating the most common response as the decision.
    translation: El gráfico muestra quién ha respondido, pero los motivos contienen lo esencial de una propuesta de Consejo. Busca límites, puntos de acuerdo y recomendaciones contradictorias. No tomes la respuesta más frecuente como si fuera la decisión.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e9fc01ce6c059f29:
    english: The decision maker publishes an outcome explaining what they decided and how the advice informed it.
    translation: Quien toma la decisión publica una conclusión en la que explica qué decidió y cómo influyeron los consejos recibidos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
