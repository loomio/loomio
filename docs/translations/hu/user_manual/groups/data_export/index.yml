    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a40deeed41d9937e:
    english: |-
      - Secret subgroups you do not belong to, including their membership and content
      - Subgroups awaiting deletion
      - Anonymous polls that have not closed
      - Direct threads and polls that do not belong to the group
    translation: |-
      - Azokat a titkos alcsoportokat, amelyeknek nem vagy tagja, valamint ezek tagságát és tartalmát
      - A törlésre váró alcsoportokat
      - A még le nem zárt névtelen szavazásokat
      - A csoporthoz nem tartozó közvetlen témákat és szavazásokat
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
