---
navigation_title: Tu perfil
blocks:
  7ac59f9506d9a9e9:
    english: "# Your Profile\nYour Loomio user profile is how people recognize you.  "
    translation: |-
      # Tu perfil
      Tu perfil de usuario de Loomio permite que otras personas te reconozcan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f77b75330707f9a4:
    english: Being able to recognize people in Loomio helps build trust and authenticity, encouraging more genuine participation.  So wherever possible we encourage you to be you, and to add a photo or avatar.
    translation: Reconocer a las personas en Loomio ayuda a generar confianza y favorece una participación más auténtica. Por eso te animamos a usar tu identidad y añadir una foto o un avatar siempre que sea posible.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e902d9db69f3ccaa:
    english: "## Edit profile"
    translation: "## Editar perfil"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f48def44ceb36407:
    english: 'Your profile page lets you customize your Loomio identity. To visit your profile page select the **Edit profile** option in the user menu, which is found by clicking on your name at the top of the sidebar. '
    translation: En tu página de perfil puedes personalizar cómo apareces en Loomio. Para abrirla, selecciona **Editar perfil ** en el menú de usuario. Encontrarás ese menú al hacer clic en tu nombre, en la parte superior de la barra lateral.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  456daa472d672b1f:
    english: If the sidebar is closed, click on the menu icon (**☰**) to open it.
    translation: Si la barra lateral está cerrada, haz clic en el icono de menú (**☰**) para abrirla.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7b920b3794ac1be0:
    english: Click on the down arrow to the right of your name.
    translation: Haz clic en la flecha hacia abajo a la derecha de tu nombre.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9664aeb8784b2137:
    english: Click on **Edit profile**
    translation: Haz clic en **Editar perfil **
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e98e7384d147ec31:
    english: "## Update your personal info"
    translation: "## Actualizar tus datos personales"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9578a723a8d322cc:
    english: 'You can update your personal info by changing any of the following fields:'
    translation: 'Puedes actualizar tus datos personales cambiando cualquiera de estos campos:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cc28d4b1038e6fe5:
    english: |-
      * **Name**
      * **Email address** - this is the email address associated with your Loomio account, and where you will receive notifications from Loomio.
      * **Username** - your username is a name people can recognize and alert you using @mention. It can contain lower case letters, numbers, underscores, and internal hyphens.
      * **Introduction** - a few lines to tell others in your group something about you.
      * **Location** - useful for distributed or remote groups so people can get an idea of where you are located.
    translation: |-
      * **Nombre**
      * **Dirección de correo electrónico** - es la dirección asociada a tu cuenta de Loomio, donde recibirás las notificaciones.
      * **Nombre de usuario** - permite que otras personas te reconozcan y te avisen mediante una @mención. Puede contener letras minúsculas, números, guiones bajos y guiones entre caracteres.
      * **Introducción** - unas líneas para contarles a las personas de tu grupo algo sobre ti.
      * **Ubicación ** - ayuda a los grupos distribuidos o remotos a saber dónde te encuentras.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d64106bb76c8936e:
    english: "## Viewing another person's profile"
    translation: "## Ver el perfil de otra persona"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fa6b7c980bad9aeb:
    english: Select a person's name or avatar to open their profile. Their recent discussions, comments, and polls are listed alongside their profile details and groups. The list only includes activity you have permission to access; signed-out visitors see public activity only.
    translation: Selecciona el nombre o el avatar de una persona para abrir su perfil. Sus discusiones, comentarios y encuestas recientes aparecen junto a los datos de su perfil y sus grupos. La lista solo incluye la actividad a la que tienes acceso; quienes no han iniciado sesión solo ven la actividad pública.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ac9abf23a4881216:
    english: "## Uploading a profile photo\nWhen you first create a Loomio account, your initials will be the default image associated with your profile. You can upload a profile photo by clicking on your picture on the profile page. "
    translation: |-
      ## Subir una foto de perfil
      Cuando creas una cuenta de Loomio, tus iniciales aparecen como imagen predeterminada de tu perfil. Para subir una foto de perfil, haz clic en tu imagen en la página de perfil.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b011f45bc197558a:
    english: If you have a [Gravatar](https://en.gravatar.com/) you can set that as your profile picture by selecting **Use Gravatar**. You can also choose for Loomio to use the photo you use for other common platforms/tools.
    translation: Si tienes una cuenta de [Gravatar](https://en.gravatar.com/), puedes usar esa imagen en tu perfil seleccionando **Usar Gravatar**. También puedes elegir que Loomio use la foto que utilizas en otras plataformas o herramientas habituales.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  41f1c139f9a0822b:
    english: |-
      ## Language settings
      Loomio is developed in English, but [is translated by volunteers into many languages](https://www.loomio.com/g/cpaM3Hsv/loomio-community-translation).
    translation: |-
      ## Configuración de idioma
      Loomio se desarrolla en inglés, pero [personas voluntarias lo traducen a muchos idiomas](https://www.loomio.com/g/cpaM3Hsv/loomio-community-translation).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9faad78d2b46c546:
    english: Loomio will detect your browser’s language settings, but you can manually set your preferred language from the available options on the profile page.
    translation: Loomio detecta la configuración de idioma de tu navegador. También puedes elegir tu idioma entre las opciones disponibles en la página de perfil.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a224dd4aaaf81381:
    english: |-
      ## Resetting your password
      You can change your password by visiting your profile page and clicking **Reset Password**.
    translation: |-
      ## Restablecer tu contraseña
      Puedes cambiar tu contraseña desde la página de perfil haciendo clic en **Restablece contraseña**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
