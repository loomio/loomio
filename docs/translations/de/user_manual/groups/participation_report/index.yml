    english: "![Actions per delegate showing three levels of participation](group_participation_report_actions_per_user.png)"
    translation: "![Aktionen pro delegierter Person mit drei Beteiligungsstufen](group_participation_report_actions_per_user.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1650f708482b4789:
    english: "### Voting record per user"
    translation: "### Abstimmungsverhalten pro Person"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e6670b54039f316a:
    english: Compare the number of votes issued to each person with the number they cast, see missed votes, and identify people who cast every vote issued to them. A person with no issued votes is not shown as having cast all votes. Anonymous polls are excluded because an anonymous ballot must not be associated with the person who cast it.
    translation: Vergleiche, zu wie vielen Abstimmungen eine Person eingeladen wurde und bei wie vielen sie abgestimmt hat. So erkennst du verpasste Abstimmungen und Personen, die an allen Abstimmungen teilgenommen haben, zu denen sie eingeladen wurden. Personen ohne Einladung zu einer Abstimmung werden nicht als vollständig beteiligt angezeigt. Anonyme Umfragen sind ausgeschlossen, da eine anonyme Stimmabgabe nicht mit der abstimmenden Person verknüpft werden darf.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  252da2b72775c4f8:
    english: Use **Delegates only** to review the voting record of current delegates. The CSV download uses the same name and delegate filters.
    translation: Verwende **Nur Delegierte**, um das Abstimmungsverhalten der derzeit Delegierten zu prüfen. Für den CSV-Download gelten dieselben Namens- und Delegiertenfilter.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
