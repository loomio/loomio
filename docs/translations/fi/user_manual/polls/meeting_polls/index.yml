  0165a90bc22b6f7f:
    english: If the times don't work, participants can suggest alternatives using the message field. You can then update the poll with new times.
    translation: Jos ehdotetut ajat eivät sovi, osallistujat voivat ehdottaa muita aikoja viestikentässä. Voit sitten lisätä uudet ajat kyselyyn.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6c7c09879e7d9bf8:
    english: The results update as voting proceeds in a table showing who is available when, so everyone can see which timeslots are popular.
    translation: Tulokset päivittyvät äänestyksen aikana. Taulukosta kaikki näkevät, kenelle kukin ajankohta sopii ja mitkä ajat ovat suosituimpia.
