      | `section` | Report section: `base`, `users`, or `countries`. Use `users` for per-person activity |
      | `group_scope` | `custom` or `my`. The legacy `all` value is treated as `my` because User API keys never receive instance-wide access |
      | `group_ids` | Comma-separated group IDs when `group_scope=custom`. IDs outside the API user's memberships are ignored |
      | `start_month` | First month to include in `YYYY-MM` format; defaults to 12 months ago |
      | `end_month` | Last month to include in `YYYY-MM` format; defaults to the current month |
      | `interval` | Interval for the `base` section: `day`, `week`, `month`, or `year` |
      | `member_type` | Set to `delegate` with `section=users` to return only current delegates |
    translation: |-
      | Nome | Descrizione |
      | --- | --- |
      | `section` | Sezione del report: `base`, `users` o `countries`. Usa `users` per le attività delle singole persone |
      | `group_scope` | `custom` o `my`. Il valore precedente `all` è trattato come `my` perché le chiavi dell'API utente non danno accesso all'intera istanza |
      | `group_ids` | ID dei gruppi separati da virgole quando `group_scope=custom`. Gli ID dei gruppi di cui l'utente API non è membro vengono ignorati |
      | `start_month` | Primo mese da includere nel formato `YYYY-MM`; per impostazione predefinita è il mese di 12 mesi fa |
      | `end_month` | Ultimo mese da includere nel formato `YYYY-MM`; per impostazione predefinita è il mese corrente |
      | `interval` | Intervallo per la sezione `base`: `day`, `week`, `month` o `year` |
      | `member_type` | Imposta `delegate` con `section=users` per restituire solo i delegati attuali |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '09b3d2247802eae7':
    english: A person is a delegate when they have an active delegate membership in any selected group. Their counts are aggregated across all selected groups. Delegate rows are returned even when every activity count is zero. Counts cover threads, comments, polls, votes, outcomes, and reactions; they are not voting participation rates. User rows also include identified ballots issued, cast, and missed. Anonymous polls are excluded from all per-person voting counts. `all_votes_cast` is true only when at least one ballot was issued and every issued ballot was cast.
    translation: Una persona è delegata se ha un'adesione attiva come delegata in almeno uno dei gruppi selezionati. I suoi conteggi sono aggregati per tutti i gruppi selezionati. Le righe dei delegati vengono restituite anche quando tutti i conteggi delle attività sono pari a zero. I conteggi riguardano discussioni, commenti, sondaggi, voti, conclusioni e reazioni; non sono tassi di partecipazione al voto. Le righe degli utenti includono anche il numero di schede di voto nominative assegnate, compilate e non compilate. I sondaggi anonimi sono esclusi da tutti i conteggi dei voti per persona. `all_votes_cast` è true solo se è stata assegnata almeno una scheda di voto e tutte le schede assegnate sono state compilate.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  be9b5cd02a9b5930:
    english: The API applies the same group visibility rules as the in-product report. A user API key cannot expose report data from groups that user cannot access.
    translation: L'API applica le stesse regole di visibilità dei gruppi del report in Loomio. La chiave API di un utente non può esporre i dati dei report relativi a gruppi a cui quell'utente non ha accesso.
