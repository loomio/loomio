  2051086558658db2:
    english: Set a vote share requirement on an option when a proposal must receive a particular percentage of support, or remain below a particular percentage of opposition, to pass.
    translation: Defina um requisito de percentual de votos para uma opção quando uma proposta precisar receber uma porcentagem específica de apoio, ou ficar abaixo de uma porcentagem específica de oposição, para ser aprovada.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f00d3806d6b890ae:
    english: Vote share requirements can be combined with a [quorum](/en/user_manual/polls/quorum/) to require both sufficient participation and a particular distribution of votes.
    translation: Você pode combinar requisitos de percentual de votos com um [quórum](/en/user_manual/polls/quorum/) para exigir tanto uma participação suficiente quanto uma distribuição específica dos votos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0fc0acd12134f67e:
    english: When creating a proposal, select the edit icon beside an option.
    translation: Ao criar uma proposta, selecione o ícone de edição ao lado de uma opção.
    status: machine
