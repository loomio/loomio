  e21550bf41c185b9:
    english: |-
      ## Generate a Webhook URL
      We've prepared step by step walk-throughs for each service we support. Follow the right one for your service to obtain the webhook URL you'll need to add the chat integration in Loomio.
    translation: |-
      ## Eine Webhook-URL erstellen
      Für jeden unterstützten Dienst gibt es eine Schritt-für-Schritt-Anleitung. Folge der Anleitung für deinen Dienst, um die Webhook-URL zu erhalten, die du für die Chat-Integration in Loomio brauchst.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
