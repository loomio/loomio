  bdd96ea053e98eb3:
    english: |-
      1. Application translation - Change the language of the user interface, IE: the buttons and application text.
      2. Content translation - Translate comments, discussions and proposals into your preferred language.
    translation: |-
      1. Felületi fordítás – Beállíthatod a felhasználói felület nyelvét, például a gombok és az alkalmazás szövegének nyelvét.
      2. Tartalomfordítás – Lefordíthatod a hozzászólásokat, beszélgetéseket és javaslatokat az általad választott nyelvre.
