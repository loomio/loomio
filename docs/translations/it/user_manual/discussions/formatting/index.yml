navigation_title: Formattazione
blocks:
  0cff8e965b2d4bd5:
    english: "# Formatting"
    translation: "# Formattazione"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7bda51ac3285357f:
    english: When starting or editing a discussion or poll, or writing a comment, you will see a formatting bar below the text field. Select the arrow at the end of the bar to show or hide the full set of tools.
    translation: Quando avvii o modifichi una discussione o un sondaggio, oppure scrivi un commento, sotto il campo di testo trovi una barra di formattazione. Seleziona la freccia alla fine della barra per mostrare o nascondere tutti gli strumenti.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2f2944ad10684b7f:
    english: Hover the mouse or cursor over each item for the name of each tool.
    translation: Passa con il puntatore su ogni elemento per vedere il nome dello strumento.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5f45a085deb9eff1:
    english: Use formatting to add structure and emphasis so information is easier to scan.
    translation: Usa la formattazione per organizzare il testo e mettere in evidenza le informazioni, così sono più facili da leggere.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9b542fd6dda53639:
    english: "## Attach file"
    translation: "## Allega file"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d633f08de5eb744d:
    english: Use the paper clip icon, just below the text form, to add file attachments from your computer.
    translation: Usa l'icona della graffetta sotto il campo di testo per allegare file dal tuo computer.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1860ade9942c32a1:
