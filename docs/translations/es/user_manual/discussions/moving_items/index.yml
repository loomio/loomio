navigation_title: Mover elementos entre hilos
blocks:
  875a42e08000fffe:
    english: "# Moving items between threads"
    translation: "# Mover elementos entre hilos"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5c0fcd38f9276e8f:
    english: Move selected items when a conversation belongs in another thread, when one thread has split into separate topics, or when you want to combine related discussions. There is no separate **Merge discussions** command.
    translation: Mueve los elementos seleccionados cuando una conversación corresponda a otro hilo, un hilo se haya dividido en temas distintos o quieras reunir discusiones relacionadas. No hay un comando independiente para **Fusionar discusiones**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f43c7835d05a135e:
    english: The option is available to group admins and to members when **Members can manage discussions and comments** is enabled in [Group permissions](/en/user_manual/groups/settings/permissions).
    translation: Esta opción está disponible para los administradores del grupo y para los miembros cuando **Los miembros pueden gestionar discusiones y comentarios.** está activada en [Permisos del grupo](/en/user_manual/groups/settings/permissions).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  30a4e31dab983f89:
    english: Open the three-dot menu (**⋯**) on an item and select **Move item**.
    translation: Abre el menú de tres puntos (**⋯**) de un elemento y selecciona **Mover elemento**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  24fd0043effa14fb:
    english: Select the items you want to move.
    translation: Selecciona los elementos que quieras mover.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  81551cd5134f24c5:
    english: Select any additional items with the checkboxes, then click **Move** in the banner at the top of the discussion.
    translation: Selecciona otros elementos con las casillas y haz clic en **Mover** en la barra de la parte superior de la discusión.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f53055845c214b05:
    english: Choose the group or subgroup, then search for the destination discussion.
    translation: Elige el grupo o subgrupo y busca la discusión de destino.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  19bc2092ac28011b:
    english: To move the items into a new discussion, select **New discussion** and add its title and context.
    translation: Para mover los elementos a una discusión nueva, selecciona **Nueva discusión** y añade el título y el contexto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '092b56e69505636f':
    english: The items are moved from the original thread into the selected or newly created thread.
    translation: Los elementos se mueven del hilo original al hilo seleccionado o recién creado.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  162c0d0c47ca798f:
    english: If the original thread is no longer needed, you can [lock it](/en/user_manual/discussions/using_discussions/#lock-or-unlock-a-thread). Delete it only if you are certain it will not be needed again.
    translation: Si ya no necesitas el hilo original, puedes [bloquearlo](/en/user_manual/discussions/using_discussions/#lock-or-unlock-a-thread). Elimínalo solo si tienes la certeza de que no volverás a necesitarlo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
