  2e7de12fecf4173f:
    english: "# Chat integrations"
    translation: "# Інтэграцыі з чатам"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  195fe68dbcc6418f:
    english: Loomio can send notifications to your chatroom.
    translation: Loomio можа адпраўляць апавяшчэнні ў чат вашай групы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bf886ec0d398e8d7:
    english: Chat tools and Loomio work well together. Use chat for quick conversation and timely updates. Move important topics to Loomio when people need time to participate, when a decision must be made, or when the group will need a lasting record.
    translation: Чат і Loomio добра дапаўняюць адно аднаго. Выкарыстоўвайце чат для кароткіх размоў і хуткіх абнаўленняў. Пераносьце важныя тэмы ў Loomio, калі людзям патрэбны час для ўдзелу, групе трэба прыняць рашэнне або захаваць запіс абмеркавання.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  db7d26a18ddc651d:
    english: Loomio supports Slack, Discord, Microsoft Teams, Matrix and Mattermost.
    translation: Loomio падтрымлівае Slack, Discord, Microsoft Teams, Matrix і Mattermost.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  765fc0d609a0db99:
    english: You can send notifications to your chatroom any time you like, just the same way you would invite individual people to vote, or to join a thread.
    translation: Вы можаце ў любы час адправіць апавяшчэнне ў чат вашай групы, гэтак жа як запрашаеце асобных людзей прагаласаваць або далучыцца да тэмы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a89717f4f41f3212:
    english: You can also configure notifications to always happen when a specific event happens, like someone starting a thread.
    translation: Таксама можна наладзіць аўтаматычныя апавяшчэнні пра пэўныя падзеі, напрыклад пра пачатак новай тэмы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c425490496cb0ed2:
    english: |-
      ## What it looks like in chat
      ![](chatbot_in_slack.png)
    translation: |-
      ## Як гэта выглядае ў чаце
      ![](chatbot_in_slack.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e21550bf41c185b9:
    english: |-
      ## Generate a Webhook URL
      We've prepared step by step walk-throughs for each service we support. Follow the right one for your service to obtain the webhook URL you'll need to add the chat integration in Loomio.
    translation: |-
      ## Стварыце URL-адрас вэбхука
      Мы падрыхтавалі пакрокавыя інструкцыі для кожнага сэрвісу, які падтрымліваем. Выконвайце інструкцыю для свайго сэрвісу, каб атрымаць URL-адрас вэбхука. Ён спатрэбіцца для дадання інтэграцыі з чатам у Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  84f03860780d02b8:
    english: |-
      - [Slack](../slack/)
      - [Microsoft Teams](../microsoft_teams/)
      - [Discord](../discord/)
      - [Matrix](../matrix/)
      - [Mattermost](../mattermost/)
