    english: "> _I've taken on board everyone's input. As the project manager, this is my call to make and I've decided we are going to extend the timeline by 10 days._"
    translation: "> _Considerei as contribuições de todas as pessoas. Como gerente do projeto, cabe a mim tomar esta decisão, e decidi que vamos ampliar o prazo em 10 dias._"
