  90d8e915824db4db:
    english: "*Does it impact other people and your organization?* Brand impacts on the perception of the co-op and impacts everyone in the organization. "
    translation: "*Ці закранае гэта іншых людзей і вашу арганізацыю?* Брэнд уплывае на тое, як успрымаюць кааператыў, і закранае ўсіх у арганізацыі."
