  e21550bf41c185b9:
    english: |-
      ## Generate a Webhook URL
      We've prepared step by step walk-throughs for each service we support. Follow the right one for your service to obtain the webhook URL you'll need to add the chat integration in Loomio.
    translation: |-
      ## Webhook URL létrehozása
      Minden támogatott szolgáltatáshoz készítettünk részletes útmutatót. A szolgáltatásodhoz tartozó útmutatót követve szerezd be azt a webhook URL-t, amellyel hozzáadhatod a csevegési integrációt a Loomióban.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
