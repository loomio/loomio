  d370759001be4e21:
    english: Polls collect selections, scores, allocations, rankings, availability, or election ballots. Choose the voting method based on what participants need to express and how you intend to use the result. Use a [Proposal](/en/user_manual/polls/proposals/) when people need to respond to a statement or course of action.
    translation: Апытанні дапамагаюць сабраць выбар варыянтаў, ацэнкі, размеркаванне балаў, рэйтынгі, звесткі пра даступны час або галасы на выбарах. Выберыце спосаб галасавання з улікам таго, што ўдзельнікі хочуць выказаць і як вы плануеце выкарыстаць вынік. Калі людзям трэба выказаць стаўленне да сцвярджэння або плана дзеянняў, выкарыстоўвайце [прапанову](/en/user_manual/polls/proposals/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1132ff680c7b2562:
    english: "## Simple poll"
    translation: "## Простае апытанне"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6b957bf5630c1470:
    english: "[Choose](/en/user_manual/polls/choose/) lets participants select one or more options. Use it to find the most popular option or make a shortlist."
    translation: "[Выберыце](/en/user_manual/polls/choose/) дазваляе ўдзельнікам выбраць адзін або некалькі варыянтаў. Выкарыстоўвайце гэты спосаб, каб знайсці самы папулярны варыянт або скласці кароткі спіс."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c982974685e1b5d6:
    english: "## Score poll"
    translation: "## Апытанне аб ацэнцы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fbbfe14196388606:
    english: "[Score](/en/user_manual/polls/score/) lets participants rate every option on the same scale. Use it to compare the strength of support, readiness, suitability, or importance across options."
    translation: "[Ацэнка](/en/user_manual/polls/score/) дазваляе ўдзельнікам ацаніць кожны варыянт па адной шкале. Выкарыстоўвайце гэты спосаб, каб параўнаць падтрымку, гатоўнасць, прыдатнасць або важнасць варыянтаў."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0465fcb48a56ca78:
    english: "## Dot vote"
    translation: "## Галасаванне баламі"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ffb7d1711a5fca3b:
    english: "[Allocate](/en/user_manual/polls/allocate/) gives each participant a fixed budget of points to distribute. Use it to identify priorities when choosing one thing means giving less attention or resources to another."
    translation: "[Выдзеліць](/en/user_manual/polls/allocate/) дае кожнаму ўдзельніку фіксаваную колькасць балаў для размеркавання. Выкарыстоўвайце гэты спосаб, каб вызначыць прыярытэты, калі выбар аднаго варыянту азначае менш увагі або рэсурсаў для іншага."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a1b15c28fbe526f6:
    english: "## Ranked choice"
    translation: "## Рэйтынгавы выбар"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8811f455b7ab3821:
    english: "[Rank](/en/user_manual/polls/rank/) lets participants arrange options in order of preference. Use it to find the group's overall preferred order or select one leading option."
    translation: "[Ранг](/en/user_manual/polls/rank/) дазваляе ўдзельнікам размясціць варыянты ў парадку перавагі. Выкарыстоўвайце гэты спосаб, каб вызначыць агульны парадак пераваг групы або выбраць адзін найбольш пераважны варыянт."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2e21bb1b54b6fcf9:
    english: "## Time poll"
    translation: "## Апытанне часу"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fb768f07eb0d1971:
    english: "[Time poll](/en/user_manual/polls/meeting_polls/) lets participants indicate when they are available. Use it to schedule a meeting or event across time zones."
    translation: "[Апытанне часу](/en/user_manual/polls/meeting_polls/) дазваляе ўдзельнікам пазначыць, калі яны могуць сустрэцца. Выкарыстоўвайце гэты спосаб, каб запланаваць сустрэчу або мерапрыемства для людзей у розных часавых паясах."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6333ad0ee6d54609:
    english: "## STV Election"
    translation: "## Выбары на СТВ"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6f93c6ad598d809c:
    english: "[STV Elections](/en/user_manual/polls/stv/) let participants rank candidates in a proportional, multi-winner election. Use STV to elect a committee, board, or group of delegates."
    translation: "[Выбары на СТВ](/en/user_manual/polls/stv/) дазваляюць удзельнікам размясціць кандыдатуры ў парадку перавагі на прапарцыйных выбарах з некалькімі пераможцамі. Выкарыстоўвайце СТВ, каб абраць склад камітэта, рады або групы дэлегатаў."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6752a750a7703b58:
