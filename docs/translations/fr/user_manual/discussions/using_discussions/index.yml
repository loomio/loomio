  4790c088af5fc09f:
    english: |-
      - **Start** goes to the discussion context
      - **New to you** appears when the thread contains activity you have not read
      - **Latest** appears when newer activity is available beyond the items currently loaded
      - milestone links go directly to important comments, polls, and outcomes
      - **End** goes to the latest item in the thread
    translation: |-
      - **Démarrer** mène au contexte de la discussion
      - **Nouveau pour toi** apparaît lorsque le fil contient des activités que vous n’avez pas lues
      - **Dernier** apparaît lorsque des activités plus récentes existent au-delà des éléments actuellement chargés
      - les liens vers les étapes importantes mènent directement aux commentaires, sondages et conclusions concernés
      - **Fin** mène au dernier élément du fil de discussion
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  941ea9900465724a:
    english: Comments that include an H2 or H3 heading, polls, and proposals are automatically included as milestone links. Select any milestone to go directly to it.
    translation: Les commentaires qui comportent un titre H2 ou H3, les sondages et les propositions sont automatiquement ajoutés aux liens vers les étapes importantes. Sélectionnez une étape pour y accéder directement.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e94ea6f4b9dae8d4:
    english: When you add a comment, poll, vote, or outcome, Loomio marks your own new item as read. It will not appear as something new for you to review.
    translation: Lorsque vous ajoutez un commentaire, un sondage, un vote ou une conclusion, Loomio marque ce nouvel élément comme lu pour vous. Il n’apparaîtra donc pas parmi les nouveautés à consulter.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
