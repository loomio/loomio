    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  feb488e50bdd3834:
    english: This template includes a Block option by default. Block isn't suitable for every group — it can be controversial or misused. If you don't use block in your decision-making process, we recommend editing the template to remove it.
    translation: 'Dit sjabloon bevat standaard de optie Blokkeer. Die optie past niet bij elke groep: ze kan omstreden zijn of verkeerd worden gebruikt. Als je Blokkeer niet gebruikt in je besluitvorming, raden we aan de optie uit het sjabloon te verwijderen.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
