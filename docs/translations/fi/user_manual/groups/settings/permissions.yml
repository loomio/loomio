  712830f14602c6c7:
    english: The permissions tab controls which group operations are available to ordinary members and, for non-secret groups, to non-members. Open **Edit group settings** from the group page, then select **Permissions**.
    translation: Käyttöoikeudet-välilehdellä määrität, mitä tavalliset jäsenet voivat tehdä ryhmässä. Jos ryhmä ei ole salainen, voit määrittää myös ryhmään kuulumattomien henkilöiden oikeuksia. Avaa ryhmän sivulta **Muokkaa ryhmän asetuksia** ja valitse **Käyttöoikeudet**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b71bf8cce1cb369c:
    english: "![Group permission settings](group_group_settings_permissions.png)"
    translation: "![Ryhmän käyttöoikeusasetukset](group_group_settings_permissions.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  88e5fcd302a53620:
    english: Administrators retain the ability to manage the group. Enabling a member permission extends that particular action to ordinary members; it does not make them administrators.
    translation: Järjestelmänvalvojat voivat edelleen hallinnoida ryhmää. Kun annat jäsenille oikeuden tehdä tietyn toiminnon, tavalliset jäsenet voivat tehdä sen. Heistä ei kuitenkaan tule järjestelmänvalvojia.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5b2b9af0f68b7a57:
    english: 'Permissions include whether members can:'
    translation: 'Käyttöoikeuksilla määrität, voivatko jäsenet:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8377b499d13690c0:
    english: |-
      - add members or invite guests;
      - send announcements;
      - create subgroups;
      - start and manage discussions;
      - create and manage tags;
      - edit or delete comments where the setting permits;
      - start proposals and polls; and
      - create discussion and poll templates.
    translation: |-
      - lisätä jäseniä tai kutsua vieraita;
      - lähettää ilmoituksia;
      - luoda alaryhmiä;
      - aloittaa ja hallinnoida keskusteluja;
      - luoda ja hallinnoida tunnisteita;
      - muokata tai poistaa kommentteja, jos asetus sallii sen;
      - aloittaa ehdotuksia ja kyselyjä; sekä
      - luoda keskustelu- ja kyselymalleja.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  87166abe7eea1ab3:
    english: For groups that are not secret, administrators can separately allow non-members to start discussions. A non-member who starts a discussion becomes a guest of that discussion but does not gain access to other private discussions or become a group member.
    translation: Jos ryhmä ei ole salainen, järjestelmänvalvojat voivat erikseen sallia ryhmään kuulumattomien henkilöiden aloittaa keskusteluja. Keskustelun aloittaneesta henkilöstä tulee kyseisen keskustelun vieras. Hän ei saa pääsyä muihin yksityisiin keskusteluihin eikä hänestä tule ryhmän jäsentä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3d01d10a97636b1e:
    english: The **Admins can edit members' comments** setting gives administrators an exceptional moderation capability. Enable it only when the group has agreed that administrators should be able to alter member-authored content.
    translation: "**Järjestelmänvalvojat voivat muokata jäsenten kommentteja** -asetus antaa järjestelmänvalvojille poikkeuksellisen oikeuden muokata jäsenten kirjoittamia kommentteja. Ota se käyttöön vain, jos ryhmä on sopinut tästä oikeudesta."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b0af0135752a461f:
    english: Review permissions when the group's purpose, membership, or moderation responsibilities change. Give each role only the capabilities it needs.
    translation: Tarkista käyttöoikeudet, kun ryhmän tarkoitus, jäsenistö tai moderointivastuut muuttuvat. Anna kullekin roolille vain sen tarvitsemat oikeudet.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
