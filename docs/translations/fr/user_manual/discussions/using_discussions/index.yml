  031f9244f107aba8:
    english: A discussion keeps its context, comments, decisions, and outcomes together in one thread. This page explains how to participate in a thread and use its navigation and actions.
    translation: Une discussion rassemble son contexte, ses commentaires, ses décisions et ses conclusions dans un même fil. Cette page explique comment y participer, s’y déplacer et utiliser les actions disponibles.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  479a1564b496bfed:
    english: "## Thread anatomy"
    translation: "## Les éléments d’un fil de discussion"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb745de96e6a612d:
    english: 'A typical thread looks like this:'
    translation: 'Voici à quoi ressemble un fil de discussion :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e69f7f0b13fd9f9:
    english: 'From the top of the page, a thread contains:'
    translation: 'De haut en bas, un fil de discussion contient les éléments suivants :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5b47d6434aa50e94:
    english: "**Group name** - At the top left of the discussion page is the name of the group or subgroup that the discussion belongs to.  Click on this name to go back to the group page."
    translation: "**Nom du groupe** - En haut à gauche de la page de discussion figure le nom du groupe ou du sous-groupe auquel elle appartient. Cliquez sur ce nom pour revenir à la page du groupe."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0dab4c46c2bee003:
    english: "**Discussion access** - The access icon at the top right opens the discussion's access settings. A group discussion is available to group members and anyone specifically invited to it, subject to the group's privacy settings."
    translation: "**Accès à la discussion** - L’icône d’accès en haut à droite ouvre les paramètres d’accès à la discussion. Une discussion de groupe est accessible aux membres du groupe et aux personnes qui y ont été invitées, selon les paramètres de confidentialité du groupe."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e20178954e6d3ce0:
    english: "**Discussion title** - The name of the discussion."
    translation: "**Titre de la discussion** - Le nom de la discussion."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  47687209ed924849:
    english: "**Category tags** - The discussion may have one or more category tags. Using simple tags helps people more easily find discussions of a similar type."
    translation: "**Classement par tags** - Une discussion peut avoir un ou plusieurs tags de catégorie. Des tags simples aident à retrouver les discussions du même type."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b817649f985f51de:
    english: "**Discussion author** - The name and avatar of the person who started the discussion, shown beneath the title."
    translation: "**Auteur de la discussion** - Le nom et l’avatar de la personne qui a lancé la discussion, affichés sous le titre."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c44d5a833b4ec9ff:
    english: "**Date** - Hover over the date to see the full date and time of discussion start."
    translation: "**Date** - Passez la souris sur la date pour voir la date et l’heure exactes du début de la discussion."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b8062113f1078acb:
    english: "**Seen by** - In the right sidebar, shows who has read the discussion and when."
    translation: "**Vu par** - Dans la barre latérale de droite, indique qui a lu la discussion et quand."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  133d0c2e469e9683:
    english: "**Notified** - In the right sidebar, shows who has been notified about the discussion and whether each notification has been read or its email opened."
    translation: "**Notifié⋅e(s)** - Dans la barre latérale de droite, indique qui a reçu une notification concernant la discussion et si chaque notification a été lue ou son courriel ouvert."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9f788adb4eab80cc:
    english: "**Discussion context** - Content to frame the discussion."
    translation: "**Contexte de la discussion** - Le contenu qui présente le cadre de la discussion."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e8c5ae76dfb5b89b:
    english: "**Discussion interaction and administration tools** - The discussion context has controls to react to and edit it. The right sidebar contains notification, membership and administration actions."
    translation: "**Outils d’interaction et d’administration de la discussion** - Le contexte de la discussion comporte des commandes pour y réagir et le modifier. La barre latérale de droite contient les actions liées aux notifications, aux membres et à l’administration."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8f6eac4359c2b9f6:
    english: "**Comments** - Comments are displayed under the discussion context. The author's name, avatar and posting time show who wrote each comment and when. Interaction and administration tools are available on each comment."
    translation: "**Commentaires** - Les commentaires s’affichent sous le contexte de la discussion. Le nom et l’avatar de leur auteur, ainsi que l’heure de publication, indiquent qui a écrit chaque commentaire et quand. Chaque commentaire comporte des outils d’interaction et d’administration."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f978af6c9af4afe5:
    english: |-
      **Navigation, notifications and actions** - The right sidebar contains
      shortcuts to activity and milestones, notification and membership information,
      and the thread actions available to you.
    translation: |-
      **Navigation, notifications et actions** - La barre latérale de droite contient
      des raccourcis vers les activités et les étapes importantes, des informations sur les notifications et les membres,
      ainsi que les actions que vous pouvez effectuer sur le fil de discussion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f8c4084e9e8a2b27:
    english: "## Discussion context"
    translation: "## Contexte de la discussion"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5940bad6cb1cb49f:
    english: The discussion **context** is always found at the top of the discussion. Use the context to frame the discussion or decision.
    translation: Le **contexte** se trouve toujours en haut de la discussion. Utilisez-le pour présenter le cadre de la discussion ou de la décision.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  415dd2d0f1eacc9f:
    english: Think of your group as you write content in the discussion context.  Your aim is to get a discussion going, so consider how you can motivate people to participate.  In general, keep the discussion context simple and clear.
    translation: Pensez aux membres de votre groupe lorsque vous rédigez le contexte. Pour lancer la discussion, donnez-leur des raisons de participer. En général, un contexte simple et clair suffit.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a1fcece28d8fb61d:
    english: Write the discussion context when starting or editing a discussion. **Edit** a discussion with the pencil icon.
    translation: Rédigez le contexte lorsque vous lancez ou modifiez une discussion. Pour modifier une discussion, cliquez sur l’icône en forme de crayon (**Modifier**).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2f47adddef6b31d9:
    english: As the discussion progresses, update discussion context.  Think of the context like a whiteboard in your meeting room, where you can write the agenda, the outcomes intended and how you plan to get there.
    translation: 'Mettez le contexte à jour au fil de la discussion. Vous pouvez l’utiliser comme le tableau blanc d’une salle de réunion : inscrivez-y l’ordre du jour, les conclusions attendues et la façon dont vous comptez y parvenir.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c82ec20629208982:
    english: At the bottom of the context panel is a formatting bar, where you can format text, attach files, images and embed a video.
    translation: Au bas du panneau de contexte, une barre de mise en forme vous permet de formater le texte, de joindre des fichiers et des images, et d’intégrer une vidéo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e606d83ae0fb2178:
    english: "### Notify people about context changes"
    translation: "### Informer les personnes des changements apportés au contexte"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d188326a58b28d96:
