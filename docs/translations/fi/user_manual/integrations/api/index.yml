  3be363e1618c6924:
    english: Use the Loomio API to connect Loomio with other software and automated workflows.
    translation: Loomion API:n avulla voit yhdistää Loomion muihin ohjelmistoihin ja automatisoituihin työnkulkuihin.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3a0a3a45b68cea23:
    english: The [OpenAPI 3.1 contract](openapi.yaml) describes every public User API and Server API operation in a machine-readable format. Import it into an API client or use it to generate typed client code. The guides below explain workflows, permissions, and behavior that are not fully expressed by the contract.
    translation: "[OpenAPI 3.1 -määrittely](openapi.yaml) kuvaa kaikki julkiset käyttäjä-API:n ja palvelin-API:n toiminnot koneluettavassa muodossa. Tuo se API-asiakasohjelmaan tai käytä sitä tyypitetyn asiakaskoodin luomiseen. Alla olevat oppaat selittävät työnkulkuja, käyttöoikeuksia ja toimintaa, joita määrittely ei kuvaa kokonaan."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  19fe420b8b57b3a3:
    english: "## User API"
    translation: "## Käyttäjä-API"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e08b0799f5a9b271:
    english: The [User API](/en/user_manual/integrations/api/user-api) performs actions as a Loomio user. It can list groups and create or manage threads, comments, polls, and group memberships according to that user's permissions.
    translation: "[Käyttäjä-API](/en/user_manual/integrations/api/user-api) tekee toimintoja Loomion käyttäjänä. Sen avulla voit luetella ryhmiä sekä luoda ja hallita keskusteluketjuja, kommentteja, kyselyjä ja ryhmien jäsenyyksiä käyttäjän käyttöoikeuksien mukaan."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d212aebc3b500643:
    english: For push-based integrations, [group webhooks](/en/user_manual/integrations/api/user-api#webhooks) send selected Loomio events to a web endpoint as JSON. Use the REST endpoints to read or change Loomio data and a webhook when an integration should receive events without polling.
    translation: Tapahtumia vastaanottavissa integraatioissa [ryhmän webhookit](/en/user_manual/integrations/api/user-api#webhooks) lähettävät valitut Loomion tapahtumat verkkopäätepisteeseen JSON-muodossa. Käytä REST-päätepisteitä Loomion tietojen lukemiseen tai muuttamiseen. Käytä webhookia, kun integraation pitää vastaanottaa tapahtumia ilman jatkuvia kyselyjä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d6536c749fb8a984:
    english: "## Server API"
    translation: "## Palvelin-API"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  76fbf0c8fa91eeb8:
    english: The [Server API](/en/user_manual/integrations/api/server-api) lets operators of self-hosted Loomio installations manage user accounts. It is authenticated with a server-wide secret.
    translation: "[Palvelin-API:n](/en/user_manual/integrations/api/server-api) avulla itse ylläpidettyjen Loomio-asennusten ylläpitäjät voivat hallita käyttäjätilejä. Tunnistautuminen tapahtuu koko palvelimen yhteisellä salaisella avaimella."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
