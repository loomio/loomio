  73449e09f559b4bd:
    english: Loomio is a discussion and decision making tool for collaborative organizations.
    translation: Loomio — інструмент для абмеркаванняў і прыняцця рашэнняў у арганізацыях, дзе людзі працуюць разам.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c6d663f00c64f35d:
    english: It enables you to bring people together to discuss topics, explore proposals and make decisions.
    translation: Ён дапамагае вам сабраць людзей, каб абмяркоўваць тэмы, разглядаць прапановы і прымаць рашэнні.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
