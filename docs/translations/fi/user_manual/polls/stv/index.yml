  85590745d00e23c1:
    english: "# STV Elections"
    translation: "# STV-vaalit"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  366f56443108e10f:
    english: "**Single Transferable Vote (STV)** is a proportional representation voting method for electing multiple winners from a field of candidates. It ensures that elected candidates proportionally represent the diversity of views among voters."
    translation: "**Siirtoäänivaali (STV)** on suhteellinen vaalitapa, jolla valitaan useita ehdokkaita. Sen avulla valitut ehdokkaat edustavat äänestäjien erilaisia näkemyksiä suhteellisesti."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  61dee55b45038f56:
    english: "## When to use STV"
    translation: "## Milloin käyttää STV-vaaleja"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8311dca26cec6519:
    english: 'Use an STV Election when you need to:'
    translation: 'Käytä STV-vaaleja, kun haluat:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1d4338734ec6e113:
    english: |-
      - Elect a **committee, board, or slate of delegates** from a pool of nominees
      - Ensure **proportional representation**, where minority factions can win seats proportional to their support
      - Run elections where voters rank candidates by preference
    translation: |-
      - Valita ehdokkaiden joukosta **toimikunnan, hallituksen tai edustajaryhmän**
      - Varmistaa **suhteellisen edustuksen**, jossa myös vähemmistöt voivat saada kannatustaan vastaavan määrän paikkoja
      - Järjestää vaalit, joissa äänestäjät asettavat ehdokkaat mieluisuusjärjestykseen
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e6e1ae026f65a715:
    english: |-
      >[!NOTE]
      >STV is **not** the same as Loomio's [Rank poll](/en/user_manual/polls/rank/), which is a simpler score-based ranking for choosing a single best option. STV handles multi-winner elections with vote transfers and elimination rounds.
    translation: |-
      >[!NOTE]
      >STV **eroaa** Loomion [järjestyskyselystä](/en/user_manual/polls/rank/), jossa vaihtoehdot pisteytetään yhden parhaan vaihtoehdon valitsemiseksi. STV-vaaleissa valitaan useita ehdokkaita siirtämällä ääniä ja pudottamalla ehdokkaita laskentakierroksilla.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  62af8f95f18dbafe:
    english: "## Creating an STV Election"
    translation: "## STV-vaalien luominen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  edf2f36e75c81665:
    english: When starting a poll, select **STV Election** as the poll type, then add the candidates as the poll options. You can customize the poll by setting the **number of seats**, the **counting method**, and the **quota type**.
    translation: Kun aloitat kyselyn, valitse kyselyn tyypiksi **STV-vaalit** ja lisää ehdokkaat vaihtoehdoiksi. Voit määrittää **täytettävien paikkojen määrän**, **laskentamenetelmän** ja **kiintiötyypin**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b40ddcfb8cdc44fd:
    english: In this example, Oatmilk Cooperative is electing three people to oversee its returnable packaging trial. The form explains the role, lists five candidates, and uses Scottish STV with the Droop quota.
    translation: Tässä esimerkissä Oatmilk Cooperative valitsee kolme henkilöä valvomaan palautettavien pakkausten kokeilua. Lomakkeessa kuvataan tehtävä, luetellaan viisi ehdokasta ja käytetään Scottish STV -laskentamenetelmää sekä Droop-kiintiötä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a34592929349d06:
    english: "### Number of seats"
    translation: "### Täytettävien paikkojen määrä"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c09f5f51333612dc:
    english: How many winners should be elected. Must be less than the number of candidates.
    translation: Valittavien henkilöiden määrä. Sen on oltava pienempi kuin ehdokkaiden määrä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ddceec01d910b152:
    english: "### Counting method"
    translation: "### Laskentamenetelmä"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  39e9e81a89272771:
    english: 'There are two available methods for counting the votes:'
    translation: 'Äänten laskentaan on kaksi menetelmää:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a7031d1180e95273:
    english: |-
      Scottish STV
        : Recommended. The Weighted Inclusive Gregory Method (WIGM) used in Scottish local elections since 2007. Well-defined, straightforward rules. Best for most organizations.
    translation: |-
      Scottish STV
        : Suositeltu. Weighted Inclusive Gregory Method (WIGM) -menetelmää on käytetty Skotlannin paikallisvaaleissa vuodesta 2007. Sen säännöt ovat selkeät ja tarkasti määritellyt. Se sopii useimmille organisaatioille.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1507e4fde88848dd:
    english: |-
      Meek STV
        : A more mathematically precise iterative method. When a candidate is eliminated, votes are recounted as if that candidate was never in the race.
    translation: |-
      Meek STV
        : Matemaattisesti tarkempi, toistuvaan laskentaan perustuva menetelmä. Kun ehdokas putoaa, äänet lasketaan uudelleen ikään kuin hän ei olisi ollut mukana vaalissa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b9abcd12eef5f629:
    english: "### Quota type"
    translation: "### Kiintiötyyppi"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6dc3aea49266d40d:
    english: 'The quota is the minimum number of votes a candidate needs to win a seat. It can be either:'
    translation: 'Kiintiö on äänimäärä, jonka ehdokas vähintään tarvitsee tullakseen valituksi. Vaihtoehtoja on kaksi:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  88f62f286d8c550f:
    english: |-
      Droop
        : Recommended. The standard quota type for most STV elections, and used by Ireland, Australia, and Scotland. Droop guarantees a majority coalition wins a majority of seats. It is calculated as:
      \\[ floor(\frac{votes}{(seats + 1)}) + 1 \\]
    translation: |-
      Droop
        : Suositeltu. Droop on useimpien STV-vaalien vakiokiintiö, ja sitä käytetään Irlannissa, Australiassa ja Skotlannissa. Se takaa, että enemmistön muodostava ryhmittymä saa enemmistön paikoista. Kiintiö lasketaan näin:
      \\[ floor(\frac{votes}{(seats + 1)}) + 1 \\]
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  817b3994e92898e8:
    english: |-
      Hare
        : A higher minimum threshold, and more proportional for smaller factions.
          Hare is preferred by DSA chapters to protect minority representation.
         It is calculated as:
          \\[ \frac{votes}{seats}\\]
    translation: |-
      Hare
        : Korkeampi vähimmäisraja, joka antaa pienemmille ryhmittymille suhteellisemman edustuksen.
          DSA:n paikallisosastot suosivat Hare-kiintiötä vähemmistöjen edustuksen turvaamiseksi.
         Kiintiö lasketaan näin:
          \\[ \frac{votes}{seats}\\]
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f12065bdf5d3678e:
    english: |2-
        >[!TIP]
        > Droop will always compute to a smaller number of votes than Hare. For example, in an election with 100 votes and four seats, the Droop quota would be 21 and the Hare quota 25.
    translation: |-
      >[!TIP]
        > Droop-kiintiö on aina pienempi kuin Hare-kiintiö. Esimerkiksi vaalissa, jossa on 100 ääntä ja neljä paikkaa, Droop-kiintiö on 21 ääntä ja Hare-kiintiö 25 ääntä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  984516abc3cfd89b:
    english: "## How voting works"
    translation: "## Näin äänestäminen toimii"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  40e98247d87cdf27:
    english: 'In this example, Oatmilk Cooperative is electing three people to oversee the reusable packaging trial. Voters drag candidates above the line and rank them in order of preference:'
    translation: 'Tässä esimerkissä Oatmilk Cooperative valitsee kolme henkilöä valvomaan uudelleenkäytettävien pakkausten kokeilua. Äänestäjät vetävät ehdokkaat viivan yläpuolelle ja asettavat heidät mieluisuusjärjestykseen:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f8aaa5391f05117f:
    english: |-
      - **Rank 1** = most preferred candidate
      - **Rank 2** = second choice
      - Continue ranking as many candidates as desired
    translation: |-
      - **Sija 1** = mieluisin ehdokas
      - **Sija 2** = toiseksi mieluisin ehdokas
      - Jatka ehdokkaiden järjestämistä niin pitkälle kuin haluat
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  70bd790faf93c916:
    english: Voters are not required to rank every candidate. Unranked candidates will not receive any of that voter's support.
    translation: Kaikkia ehdokkaita ei tarvitse järjestää. Äänestäjän ääni ei siirry ehdokkaille, joita hän ei ole järjestänyt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d82e369c7c293a0c:
    english: |-
      ## How counting works
      The count is performed as follows:
    translation: |-
      ## Näin ääntenlaskenta toimii
      Äänet lasketaan seuraavasti:
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0ea01b5d531abc06:
    english: |-
      1. A **quota** is calculated (minimum votes needed to win a seat).
      2. **First preferences** are counted for each candidate.
      3. If a candidate meets the quota, they are **elected**. Their surplus votes (above the quota) are **transferred** to voters' next preferences at a fractional value.
      4. If no candidate meets the quota, the candidate with the **fewest votes is eliminated**. Their votes transfer to voters' next preferences at full value.
      5. This process repeats until all seats are filled.
    translation: |-
      1. Lasketaan **kiintiö** eli vähimmäisäänimäärä, jolla ehdokas saa paikan.
      2. Lasketaan kunkin ehdokkaan **Ensimmäiset mieltymykset**.
      3. Jos ehdokas saavuttaa kiintiön, hänet **valitaan**. Kiintiön ylittävät äänet **siirretään** murto-osaisina äänestäjien seuraaville ehdokkaille.
      4. Jos kukaan ei saavuta kiintiötä, **vähiten ääniä saanut ehdokas putoaa**. Hänen äänensä siirtyvät täysimääräisinä äänestäjien seuraaville ehdokkaille.
      5. Tätä jatketaan, kunnes kaikki paikat on täytetty.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c6f397233ad479e5:
    english: |-
      >[!TIP]
      >If a voter has ranked no remaining candidates, their ballot is "exhausted" and that vote is lost. This is why ranking more candidates is generally better.
    translation: |-
      >[!TIP]
      >Jos äänestäjän järjestämistä ehdokkaista ei ole enää ketään mukana, hänen äänestyslippunsa ääntä ei voida enää siirtää. Siksi useamman ehdokkaan järjestäminen kannattaa yleensä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  acba228efb586cca:
    english: "## Understanding results"
    translation: "## Tulosten tarkastelu"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3b584c17ac358371:
    english: 'After the poll closes, results are displayed in several sections. In this election, Samira Patel, Alex Morgan, and Morgan Price fill the three committee seats:'
    translation: 'Kyselyn sulkeuduttua tulokset näkyvät useassa osiossa. Tässä vaalissa Samira Patel, Alex Morgan ja Morgan Price saavat toimikunnan kolme paikkaa:'
    status: machine
