  2df60ea964109f11:
    english: "## Group data is permanently deleted after 90 days"
    translation: "## Gruppendaten werden nach 90 Tagen dauerhaft gelöscht"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e09923078301b8d:
    english: After 90 days, all the threads, polls, files and other group content will be permanently deleted. ***This is non-reversible!***
    translation: Nach 90 Tagen werden alle Diskussionen, Abstimmungen, Dateien und anderen Gruppeninhalte dauerhaft gelöscht. ***Das kann nicht rückgängig gemacht werden.***
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8695a5ebfb09611d:
    english: We recommend that you [export the group data](/en/user_manual/groups/data_export/)and manually download any important files you have uploaded before you continue.
    translation: Wir empfehlen dir, [die Gruppendaten zu exportieren](/en/user_manual/groups/data_export/)und wichtige Dateien, die du hochgeladen hast, vor dem Fortfahren selbst herunterzuladen.
    status: machine
