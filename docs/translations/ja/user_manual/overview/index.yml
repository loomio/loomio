  73449e09f559b4bd:
    english: Loomio is a discussion and decision making tool for collaborative organizations.
    translation: Loomioは、組織が協力して議論し、意思決定するためのツールです。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c6d663f00c64f35d:
    english: It enables you to bring people together to discuss topics, explore proposals and make decisions.
    translation: 人々が集まって議題を話し合い、提案を検討し、意思決定できます。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
