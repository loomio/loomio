---
navigation_title: Розподіл балів
blocks:
  343675f0497d460a:
    english: "# Allocate"
    translation: "# Розподіл балів"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  46dd27ee2e2fb992:
    english: Allocate, sometimes known as a dot vote, reveals priorities when there are trade-offs. Each participant receives a fixed budget of points and distributes it across the options. Giving more to one option leaves fewer points for the others.
    translation: Розподіл балів, який іноді називають голосуванням крапками, допомагає визначити пріоритети, коли доводиться робити вибір. Кожен учасник отримує фіксовану кількість балів і розподіляє їх між варіантами. Що більше балів отримує один варіант, то менше залишається для інших.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c6d05c5ec2a695d2:
    english: "## When to use Allocate"
    translation: "## Коли використовувати розподіл балів"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f5b2c4377aea5079:
    english: 'Use Allocate when time, money, attention, or another resource is limited. It works well for:'
    translation: 'Використовуйте розподіл балів, коли час, гроші, увага чи інший ресурс обмежені. Він підходить, щоб:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8e6525da99616946:
    english: |-
      - prioritizing work for the next planning period;
      - dividing a participatory budget between projects;
      - choosing how much agenda time to give several topics;
      - distributing a fixed number of volunteer hours; or
      - identifying which improvements matter most to members.
    translation: |-
      - визначити пріоритети роботи на наступний період планування;
      - розподілити бюджет участі між проєктами;
      - вирішити, скільки часу в порядку денному приділити кільком темам;
      - розподілити фіксовану кількість годин волонтерської роботи; або
      - з’ясувати, які поліпшення найважливіші для учасників.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  66b0f13c4811ef63:
    english: The points express relative priority, not an amount that Loomio will automatically assign. Use [Score](/en/user_manual/polls/score/) when every option can receive a high rating without reducing support for another.
    translation: Бали показують відносну важливість варіантів, а не обсяг ресурсу, який Loomio розподілить автоматично. Використовуйте [Оціночне опитування](/en/user_manual/polls/score/), коли кожен варіант може отримати високу оцінку без зменшення підтримки інших.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '0409e08bd5e80f61':
    english: "## Example: set priorities for an annual strategy review"
    translation: "## Приклад: визначення пріоритетів для щорічного перегляду стратегії"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e274f6e40509e611:
    english: Oatmilk Cooperative is planning its annual strategy review. It asks members which areas should receive the most time and attention during the review. Each member receives ten points to allocate across five areas. This shows the group's relative priorities while requiring participants to make trade-offs.
    translation: Кооператив Oatmilk планує щорічний перегляд стратегії. Він запитує учасників, яким напрямам варто приділити найбільше часу й уваги під час перегляду. Кожен учасник отримує десять балів, які може розподілити між п’ятьма напрямами. Так група бачить відносні пріоритети, а учасники мають визначити, що для них важливіше.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c74ebb16f872b3c6:
    english: "## Set up the poll"
    translation: "## Налаштуйте опитування"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  906790609aa7eb30:
    english: Describe the decision and what the points represent. Add options at a similar level of scope, then set **Points per person**. In this example, each voter receives ten points to indicate how much review time each strategic area should receive.
    translation: Опишіть рішення та поясніть, що означають бали. Додайте варіанти схожого масштабу, а потім установіть значення **Балів на людину**. У цьому прикладі кожен виборець отримує десять балів, щоб показати, скільки часу варто приділити кожному стратегічному напряму.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  67ae025b83fb4781:
    english: A very large budget can create false precision. A useful budget is usually large enough to show differences but small enough to require choices. Make clear whether concentrating all points on one option is acceptable.
    translation: Завелика кількість балів може створити хибне враження точності. Зазвичай балів має вистачати, щоб показати відмінності між варіантами, але їхня кількість має спонукати до вибору. Поясніть, чи можна віддати всі бали одному варіанту.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Голосуйте"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d9a73b9d4e2f8927:
    english: Participants move the sliders to distribute their budget. Loomio shows how many points remain and prevents submission until the allocation is valid.
    translation: Учасники пересувають повзунки, щоб розподілити свої бали. Loomio показує, скільки балів залишилося, і не дозволяє надіслати голос, доки розподіл не стане допустимим.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7b3d616673a01fbb:
    english: In this example, the voter assigns three points each to **Member participation** and **Financial sustainability**, two each to **Environmental impact** and **Staff development**, and none to **Products and services**. A zero does not necessarily mean an area has no value; it means the voter used their limited points elsewhere.
    translation: 'У цьому прикладі виборець дає по три бали напрямам **Участь учасників** і **Фінансова стійкість**, по два — напрямам **Вплив на довкілля** і **Розвиток працівників**, а напряму **Продукти та послуги** не дає жодного бала. Нуль балів не обов’язково означає, що напрям не має цінності: виборець використав обмежену кількість балів для інших напрямів.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Перегляньте результати"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  97147f83eaf22313:
    english: 'The results order options by the total points received. They also show:'
    translation: 'У результатах варіанти впорядковано за загальною кількістю отриманих балів. Також показано:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1d224c0c34145a7f:
    english: |-
      - **% of points**: the option's share of all allocated points;
      - **Points**: the total points allocated;
      - **Mean**: the average among voters who gave the option points; and
      - **Voters**: how many people gave the option at least one point.
    translation: |-
      - **% балів**: частку варіанта серед усіх розподілених балів;
      - **Бали**: загальну кількість отриманих балів;
      - **Середній**: середню кількість балів серед виборців, які дали бали цьому варіанту; і
      - **Виборці**: кількість людей, які дали варіанту принаймні один бал.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2901008fa326e4f5:
    english: In this example, **Financial sustainability** receives the most points, followed by **Staff development**. Financial sustainability receives points from every voter, suggesting broad agreement that it needs substantial review time. Read the totals alongside the number of voters to distinguish broad priorities from areas strongly supported by fewer people.
    translation: У цьому прикладі **Фінансова стійкість** отримує найбільше балів, а наступним іде **Розвиток працівників**. Фінансова стійкість отримує бали від кожного виборця. Це свідчить про широку згоду щодо того, що цьому напряму потрібно приділити багато часу під час перегляду. Порівнюйте загальну кількість балів із кількістю виборців, щоб відрізнити пріоритети, які підтримують багато людей, від напрямів, які особливо підтримує менша кількість людей.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f2c04fbdc54d23e8:
    english: Read the totals together with the number of voters and their reasons. Publish an outcome explaining how the strategy review will be structured; the poll does not assign time automatically.
    translation: Розглядайте загальну кількість балів разом із кількістю виборців та їхніми поясненнями. Опублікуйте висновок про те, як буде організовано перегляд стратегії. Опитування не розподіляє час автоматично.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
