  223c90e3fe5b24d7:
    english: "> *“Consensus is the process – a participatory process by which a group thinks and feels together, en route to their decision.” - Sam Kaner, Community at Work*"
    translation: "> *«Il consenso è il processo: un processo partecipativo in cui un gruppo pensa e sente insieme mentre arriva a una decisione.» - Sam Kaner, Community at Work*"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9872b82ded022524:
    english: |-
      ## Key points
      - Discuss and develop a proposal together
      - Include and respect everyone involved
      - Seek agreement from most people
    translation: |-
      ## Punti chiave
      - Discuti e sviluppa una proposta insieme alle altre persone
      - Includi e rispetta tutte le persone coinvolte
      - Cerca l'accordo della maggior parte delle persone
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a1cd3fa440013e0c:
    english: "**Consensus is typically used in:**\n- Working teams building shared understanding of an issue or opportunity, collaborating on a proposal and deciding course of action. \n- Governance board decisions where the board shows it is acting jointly, such as decisions on vision, policy, strategic planning and budget.\n- AGMs and General Assemblies where members and stakeholders seek general agreement for major decisions, such as revisions to statutes, major transactions and the elections of directors or council members."
    translation: "**Il processo di consenso si usa di solito in:**\n- Gruppi di lavoro che costruiscono una comprensione condivisa di un problema o di un'opportunità, collaborano a una proposta e decidono come agire. \n- Decisioni di un consiglio direttivo che agisce collegialmente, per esempio su visione, politiche, pianificazione strategica e bilancio.\n- Assemblee annuali e assemblee generali in cui membri e altre persone interessate cercano un accordo generale su decisioni importanti, come modifiche allo statuto, operazioni rilevanti ed elezione di amministratori o consiglieri."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7c5d3122a1333ba5:
    english: |-
      **Typical roles:**
      - Appoint a facilitator.  In board meetings this is usually the Chairperson.
      - A quorum or supermajority of members to participate, as specified in the organization's statutes.
    translation: |-
      **Ruoli tipici:**
      - Nomina una persona che faciliti il processo.  Nelle riunioni del consiglio, di solito è chi lo presiede.
      - È richiesta la partecipazione di un numero minimo o di una maggioranza qualificata dei membri, secondo quanto previsto dallo statuto dell'organizzazione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1d8ee54aa5e87423:
    english: |-
      ## Consensus process steps
      1. State the issue to be decided - start a Loomio **discussion**.
      2. Present a proposal to test for consensus - start a **Sense check proposal**.
      3. Clarify any points, invite constructive modifications and amend the proposal.
      4. Test for agreement - start a **Consensus proposal**.
      5. Outcome - state the decision **outcome**.
    translation: |-
      ## Fasi del processo di consenso
      1. Presenta la questione da decidere: avvia una **discussione** su Loomio.
      2. Presenta una proposta per verificare il consenso: avvia una **proposta di verifica degli orientamenti**.
      3. Chiarisci i punti in sospeso, invita a proporre modifiche costruttive e modifica la proposta.
      4. Verifica se c'è accordo: avvia una **proposta di consenso**.
      5. Conclusione: comunica la **conclusione** della decisione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0b5249cfd4c92c35:
    english: |-
      ## Benefits
      - Grow shared understanding.
      - Decisions for the collective will of the group.
      - Encourage people to value the group over their personal preferences.
    translation: |-
      ## Vantaggi
      - Sviluppa una comprensione condivisa.
      - Permette di prendere decisioni che esprimono la volontà collettiva del gruppo.
      - Incoraggia le persone a tenere conto del gruppo oltre che delle proprie preferenze.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  55d7d6c48f056550:
    english: "## Applying the Consensus process on Loomio"
    translation: "## Applicare il processo di consenso su Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e50b473237140170:
    english: |-
      | **Consensus process** | **On Loomio** |
      |---|---|
      | You notice a problem or opportunity and take the initiative. |  |
      | **State the issue to be decided**  <br /><br />Provide background information and open a broad ranging discussion to build shared understanding. Look for emerging proposals. | Start a Loomio discussion <br /><br />Name the topic of discussion in the discussion title, and what you hope to achieve. <br /><br />Attach or link to background information. Invite people to ask questions, contribute information and write comments. |
      | **Present a proposal** <br /><br />Test for consensus. | Run a [Sense check proposal](/en/user_manual/polls/proposals/sense_check/). <br /><br />*In the title:* Name the proposal. <br /><br />*In the proposal details:* Clearly frame the proposal and say why it is important.  Include any background information necessary and a link to the proposal.  <br /><br />Invite everyone to respond, and to do so before the proposal closes.  |
      | **Amendment** <br /><br />Discuss, clarify and amend the proposal. <br /><br />Seek to understand and resolve any objections. <br /><br />Invite people objecting to to propose a constructive and practical modification to the proposed decision or course of action. | Facilitate discussion in the thread to address concerns and modify the proposal. |
      | **Agreement** <br /><br />Do you have an agreement?  Check for: <br /><br />Agreement: I support the proposal. <br /><br />Abstain: This decision does not affect me and I am happy with whatever the group decides. <br /><br />Disagreement: Something in the proposal needs to be changed before I can support it. <br /><br />Block: I have a fundamental disagreement with the proposal that cannot be resolved. | Run a [Consensus proposal](/en/user_manual/polls/proposals/consensus/) with the current proposal version. <br /><br />*In the title:* Name the decision to be made. <br /><br />*In the proposal details:* Present the proposal and invite people to vote. <br /><br />Include a clear statement of what agreement means, say 'for this proposal to pass, we need everyone to vote agree' or 'for this proposal to pass, we need 75% of members to agree'.  <br /><br />Ask participants to leave a vote 'Reason' - and if they do not agree to say why, and what needs to change for them to agree. <br /><br />Some organizations also use the Block (or veto) voting option. <br /><br />As voting progresses, respond to comments, post updates, close early, or let the proposal run to conclusion. <br /><br />Participants can *“change vote”* up to proposal close time, say in response to new information that arrives during voting. |
      | **Outcome** <br /><br />State if agreement was reached and the decision that has been made. <br /><br />Implement the decision and plan actions to be taken. | Consider voting results and state the decision made. <br /><br />Summarize results of the process and say what will happen next. <br /><br />If results are inconclusive, you may choose to re-open the discussion and run a new proposal. <br /><br />The outcome statement is an important record of the decision for future reference. |
    translation: |-
      | **Processo di consenso** | **Su Loomio** |
      |---|---|
      | Individui un problema o un'opportunità e prendi l'iniziativa. |  |
      | **Presenta la questione da decidere**  <br /><br />Fornisci le informazioni di contesto e apri una discussione ampia per costruire una comprensione condivisa. Presta attenzione alle proposte che emergono. | Avvia una discussione su Loomio <br /><br />Indica nel titolo l'argomento della discussione e ciò che speri di ottenere. <br /><br />Allega le informazioni di contesto o inserisci un link. Invita le persone a fare domande, condividere informazioni e scrivere commenti. |
      | **Presenta una proposta** <br /><br />Verifica se c'è consenso. | Avvia una [proposta di verifica degli orientamenti](/en/user_manual/polls/proposals/sense_check/). <br /><br />*Nel titolo:* Dai un nome alla proposta. <br /><br />*Nei dettagli della proposta:* Descrivi chiaramente la proposta e spiega perché è importante. Includi le informazioni di contesto necessarie e un link alla proposta. <br /><br />Invita tutte le persone a rispondere prima della chiusura della proposta. |
      | **Modifica** <br /><br />Discuti, chiarisci e modifica la proposta. <br /><br />Cerca di comprendere e risolvere le obiezioni. <br /><br />Invita chi solleva obiezioni a proporre modifiche costruttive e praticabili alla decisione o al corso d'azione proposto. | Facilita la discussione nel thread per affrontare le preoccupazioni e modificare la proposta. |
      | **Accordo** <br /><br />C'è un accordo? Verifica le posizioni: <br /><br />D'accordo: sostengo la proposta. <br /><br />Mi astengo: questa decisione non mi riguarda e accetto qualunque scelta del gruppo. <br /><br />Non d'accordo: qualcosa nella proposta deve cambiare prima che io possa sostenerla. <br /><br />Blocco: ho un disaccordo fondamentale con la proposta che non può essere risolto. | Avvia una [proposta di consenso](/en/user_manual/polls/proposals/consensus/) con la versione attuale della proposta. <br /><br />*Nel titolo:* Indica la decisione da prendere. <br /><br />*Nei dettagli della proposta:* Presenta la proposta e invita le persone a votare. <br /><br />Spiega chiaramente che cosa serve per raggiungere un accordo, per esempio «per approvare questa proposta, tutte le persone devono votare D'accordo» oppure «per approvare questa proposta, il 75% dei membri deve votare D'accordo». <br /><br />Chiedi a chi partecipa di indicare la «Motivazione» del voto e, se non è d'accordo, di spiegare perché e che cosa dovrebbe cambiare. <br /><br />Alcune organizzazioni usano anche l'opzione di voto Blocco, o veto. <br /><br />Mentre arrivano i voti, rispondi ai commenti, pubblica aggiornamenti, chiudi la proposta in anticipo oppure lascia che arrivi alla scadenza. <br /><br />Le persone partecipanti possono *«cambiare voto»* fino alla chiusura della proposta, per esempio se durante la votazione emergono nuove informazioni. |
      | **Conclusione** <br /><br />Indica se è stato raggiunto un accordo e quale decisione è stata presa. <br /><br />Attua la decisione e pianifica le azioni necessarie. | Valuta i risultati della votazione e comunica la decisione presa. <br /><br />Riassumi i risultati del processo e spiega che cosa succederà dopo. <br /><br />Se i risultati non sono conclusivi, puoi riaprire la discussione e avviare una nuova proposta. <br /><br />La conclusione è un documento importante da consultare in futuro per conoscere la decisione. |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
