  5a0b9426a2d88e62:
    english: |-
      ## Contacting someone via a direct discussion
      A direct discussion can be used to contact one or more people privately without creating a subgroup.
    translation: |-
      ## Как связаться с кем-то через прямое обсуждение
      Прямое обсуждение позволяет связаться с одним или несколькими людьми без создания подгруппы.
    status: machine
