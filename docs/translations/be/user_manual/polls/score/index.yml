navigation_title: Ацэнка
blocks:
  c719d051fa2f700e:
    english: "# Score"
    translation: "# Ацэнка"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  517adc384b38d256:
    english: Score measures how participants evaluate each option on a shared numeric scale. Unlike Choose, it asks people to respond to every option, so the results show both what people prefer and how strongly they prefer it.
    translation: Ацэнка паказвае, як удзельнікі ацэньваюць кожны варыянт паводле агульнай лікавай шкалы. У адрозненне ад «Выберыце», тут людзі ацэньваюць кожны варыянт. Вынікі паказваюць, якія варыянты ім падабаюцца і наколькі моцна.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a678333f6d814e87:
    english: "## When to use Score"
    translation: "## Калі выкарыстоўваць ацэнку"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c4ca19abb53e3ddc:
    english: 'Use Score when every option can be evaluated independently against the same question. It works well for:'
    translation: 'Выкарыстоўвайце ацэнку, калі кожны варыянт можна асобна ацаніць паводле аднаго і таго ж пытання. Яна падыходзіць, каб:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c77c1ad6b2a9d697:
    english: |-
      - assessing how ready each part of a project is;
      - rating the importance of several principles;
      - measuring interest in possible meeting topics;
      - evaluating grant applications against a common criterion; or
      - comparing the suitability of several proposals.
    translation: |-
      - ацаніць гатоўнасць кожнай часткі праекта;
      - ацаніць важнасць некалькіх прынцыпаў;
      - высветліць цікавасць да магчымых тэм сустрэчы;
      - ацаніць заяўкі на грант паводле агульнага крытэрыю; або
      - параўнаць, наколькі падыходзяць некалькі прапаноў.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d91459d96a31a671:
    english: Define what the bottom and top of the scale mean. A number without a shared definition can mean different things to different voters. Use [Choose](/en/user_manual/polls/choose/) when you only need selections, or [Allocate](/en/user_manual/polls/allocate/) when participants must make trade-offs within a limited budget.
    translation: Вызначце значэнне ніжняй і верхняй межаў шкалы. Без агульнага тлумачэння выбаршчыкі могуць па-рознаму разумець адны і тыя ж лічбы. Выкарыстоўвайце [«Выберыце»](/en/user_manual/polls/choose/), калі трэба толькі выбраць варыянты, або [«Выдзеліць»](/en/user_manual/polls/allocate/), калі ўдзельнікам трэба размеркаваць абмежаваную колькасць балаў паміж варыянтамі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6160518dc06b70a7:
    english: "## Example: score possible trial locations"
    translation: "## Прыклад: ацэнка магчымых месцаў для выпрабавання"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a75c387743cad529:
    english: Oatmilk Cooperative is choosing locations for a returnable-bottle trial. It asks members to score four locations from 0 (**unsuitable**) to 10 (**ideal**), considering customer access, staff capacity, storage, and collection transport.
    translation: Кааператыў «Аўсянае малако» выбірае месцы для выпрабавання сістэмы зваротных бутэлек. Ён просіць удзельнікаў ацаніць чатыры месцы ад 0 (**не падыходзіць**) да 10 (**ідэальна**), улічваючы даступнасць для пакупнікоў, магчымасці супрацоўнікаў, месца для захоўвання і транспарт для збору бутэлек.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c74ebb16f872b3c6:
    english: "## Set up the poll"
    translation: "## Наладзьце апытанне"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b03122ee279f9c91:
    english: State one question that applies equally to every option. Add the items to be assessed, set the **Minimum score** and **Maximum score**, and explain the endpoints in the details. Option meanings can clarify the scope of each item.
    translation: Сфармулюйце адно пытанне, якое аднолькава падыходзіць для кожнага варыянта. Дадайце аб’екты ацэнкі, задайце **Мінімальны бал** і **Максімальны бал** і растлумачце значэнне межаў шкалы ў падрабязнасцях. Апісанне варыянтаў дапаможа ўдакладніць, што ўваходзіць у кожны з іх.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  85e66520acf78264:
    english: Choose a scale participants can apply consistently. A 0–5 scale is quick to use; a 0–10 scale allows finer distinctions. More precision does not necessarily produce better information, so use the shortest scale that fits the question.
    translation: Выберыце шкалу, якую ўдзельнікі змогуць ужываць паслядоўна. Шкалай ад 0 да 5 карыстацца хутка; шкала ад 0 да 10 дазваляе дакладней адрозніваць ацэнкі. Большая дакладнасць не заўсёды дае больш карыснай інфармацыі, таму выбірайце найкарацейшую шкалу, якая падыходзіць для пытання.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bb3998655598796f:
    english: Anonymous voting and showing options in random order can be useful when you want to reduce social or ordering effects.
    translation: Ананімнае галасаванне і выпадковы парадак варыянтаў могуць дапамагчы зменшыць уплыў іншых людзей і парадку паказу на ацэнкі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Прагаласуйце"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  33199814c9ad8a64:
    english: Participants move a slider to score every option. In this example, the voter scores Central Station cafe at 8, Riverside market at 6, the University food court at 7, and Harbour offices at 5.
    translation: Удзельнікі перасоўваюць паўзунок, каб ацаніць кожны варыянт. У гэтым прыкладзе кавярня каля Цэнтральнага вакзала атрымлівае 8 балаў, рынак на набярэжнай — 6, сталовая ва ўніверсітэце — 7, а офісы ў порце — 5.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fba3d21a09846414:
    english: The reason explains how the voter applied the scale. This helps the group distinguish a low score caused by missing information from one caused by substantive concern.
    translation: У тлумачэнні галасавання можна расказаць, як была выкарыстана шкала. Гэта дапамагае групе зразумець, ці звязаны нізкі бал з недахопам інфармацыі або з істотнымі сумневамі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Праглядзіце вынікі"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  846b7759f9d54232:
    english: 'For each option, the results show:'
    translation: 'Для кожнага варыянта вынікі паказваюць:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cac30fa54f0aeaf7:
    english: |-
      - **Points**: the sum of all scores;
      - **Mean**: the average score; and
      - **Voters**: how many people scored the option.
    translation: |-
      - **Ачкі**: суму ўсіх балаў;
      - **Сярэдняе**: сярэдні бал; і
      - **Выбаршчыкі**: колькі людзей ацанілі варыянт.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7e063d4b1babcb9e:
    english: In this example, **Central Station cafe** has the highest mean at 7.5. **Harbour offices** has the lowest mean at 5.25, while Riverside market and the University food court are tied at 7. Four of five invited people have voted, so the group can also see that one response is outstanding.
    translation: У гэтым прыкладзе **кавярня каля Цэнтральнага вакзала** мае найвышэйшы сярэдні бал — 7,5. **Офісы ў порце** маюць найніжэйшы сярэдні бал — 5,25, а рынак на набярэжнай і сталовая ва ўніверсітэце набралі па 7. З пяці запрошаных людзей прагаласавалі чацвёра, таму група таксама бачыць, што адзін адказ яшчэ не атрыманы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  147800d3643d9942:
    english: Compare means only when the options have a similar number of voters. Read the vote reasons before treating a small difference as meaningful, and publish an outcome explaining what action follows from the scores.
    translation: Параўноўвайце сярэднія балы, толькі калі колькасць выбаршчыкаў для варыянтаў прыкладна аднолькавая. Перш чым лічыць невялікую розніцу істотнай, прачытайце тлумачэнні галасоў. Затым апублікуйце выснову і растлумачце, якія дзеянні вынікаюць з ацэнак.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
