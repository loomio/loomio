  faecc8a35e23054a:
    english: |-
      # Mattermost integration
      _Connecting your Loomio group notifications to your Mattermost team chat._
    translation: |-
      # Інтеграція з Mattermost
      _Підключення сповіщень групи Loomio до командного чату Mattermost._
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3955d3033be2b126:
    english: 'Loomio can send notifications into your Mattermost channels when new discussions, proposals, comments, votes, and outcomes occur. '
    translation: Loomio може надсилати сповіщення в канали Mattermost про нові обговорення, пропозиції, коментарі, голоси та висновки.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
