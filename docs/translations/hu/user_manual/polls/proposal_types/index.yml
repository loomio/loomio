  6f93c6ad598d809c:
    english: "[STV Elections](/en/user_manual/polls/stv/) let participants rank candidates in a proportional, multi-winner election. Use STV to elect a committee, board, or group of delegates."
    translation: Az [STV-választásban](/en/user_manual/polls/stv/) a résztvevők rangsorolhatják a jelölteket egy arányos, több győztest választó szavazáson. Ezzel a módszerrel bizottságot, vezető testületet vagy küldötteket választhattok.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
