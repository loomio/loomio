  6e6785b547007644:
    english: "## Meeting focus and review actions"
    translation: "## מיקוד הפגישה ומעקב אחר משימות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  26bf98782eb61549:
    english: 'Establish a focus for the meeting, so you spend your precious time together talking about the most important topics.  '
    translation: כדאי להגדיר את מוקד הפגישה כדי להקדיש את הזמן המשותף לנושאים החשובים ביותר.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c23fdd52f0a29b2c:
    english: Inviting members to contribute to the agenda helps everyone align, think about topics and energize for the meeting.
    translation: הזמנת חברות וחברי הקבוצה לתרום לסדר היום מסייעת לגבש הבנה משותפת, לחשוב על הנושאים ולהתכונן לפגישה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  52409f3ffabfb7d1:
    english: |-
      Actions:
      - focus the meeting on the most important things,
      - follow up and talk to members about actions from previous meetings.
    translation: |-
      פעולות:
      - למקד את הפגישה בדברים החשובים ביותר,
      - לעקוב אחר משימות מפגישות קודמות ולדון בהן עם חברות וחברי הקבוצה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a52dd7ebb4619e46:
    english: |-
      ### On Loomio
      Use a Loomio **Discussion** to prepare for your meeting:
      * remind members about the meeting coming up,
      * invite comment about the most important things to focus on,
      * summarize actions from the previous meeting and ask for an update.
    translation: |-
      ### ב־Loomio
      ניתן להשתמש ב־**דִיוּן** ב־Loomio כדי להתכונן לפגישה:
      * להזכיר לחברות ולחברי הקבוצה שהפגישה מתקרבת,
      * להזמין תגובות על הנושאים החשובים ביותר להתמקד בהם,
      * לסכם משימות מהפגישה הקודמת ולבקש עדכון.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5bcd10bb61edcc35:
    english: "## Agenda and notify"
    translation: "## סדר היום ושליחת הודעה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d9431846021bb8f3:
    english: Announce the meeting with a clear agenda. Attach papers, link to key documents and notify members.
    translation: יש להודיע על הפגישה ולצרף סדר יום ברור. ניתן לצרף חומרי רקע, לקשר למסמכים חשובים ולשלוח הודעה לחברות ולחברי הקבוצה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  41e84b882fa9bab1:
    english: This helps everyone prepare for the meeting, by reading the materials and thinking about topics of discussion and the decisions to be made.  Members are then more likely to arrive in context and ready for the meeting.
    translation: 'כך ניתן להתכונן לפגישה: לקרוא את החומרים ולחשוב על הנושאים לדיון ועל ההחלטות שיידרשו. ההכנה מסייעת להגיע לפגישה עם ההקשר הדרוש.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b6b0e7ed67711d5b:
    english: |-
      Actions:
      - prepare agenda, documents, materials and board papers,
      - notify members of meeting and send materials.
    translation: |-
      פעולות:
      - להכין סדר יום, מסמכים, חומרים וניירות רקע לישיבה,
      - להודיע לחברות ולחברי הקבוצה על הפגישה ולשלוח את החומרים.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5b6d4a5158e41747:
    english: |-
      ### On Loomio
      Use a Loomio **Discussion** to prepare for your board meeting:
      * state details of meeting,
      * attach or link agenda, documents and other meeting materials,
      * invite members with a notification,
      * monitor 'Seen by' to see who has read the thread.
    translation: |-
      ### ב־Loomio
      ניתן להשתמש ב־**דִיוּן** ב־Loomio כדי להתכונן לישיבת ההנהלה:
      * לציין את פרטי הפגישה,
      * לצרף או לקשר את סדר היום, המסמכים וחומרי הפגישה האחרים,
      * להזמין חברות וחברי קבוצה באמצעות הודעה,
      * לעקוב אחר 'נראה ע"י' כדי לראות מי קראו את השרשור.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f2c8f10394bf10c8:
    english: |-
      While similar to sending an email, a Loomio thread has advantages:
      - you can see who has read the thread, and remind those who haven't,
      - member replies or comments are visible to everyone who has permission to view the thread,
      - any discussion or questions about the agenda or meeting materials is held in a single place.
    translation: |-
      שרשור ב־Loomio דומה לשליחת הודעת דוא״ל, ויש לו כמה יתרונות:
      - ניתן לראות מי קראו את השרשור ולהזכיר למי שעדיין לא קראו,
      - תשובות ותגובות של חברות וחברי הקבוצה גלויות לכל מי שמורשים לצפות בשרשור,
      - הדיון והשאלות על סדר היום או על חומרי הפגישה מרוכזים במקום אחד.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dd6d8cabe5f1810d:
    english: Members can find all the information about the meeting readily available in one place, thereby avoiding confusing email chains and losing important info in their email inbox.
    translation: כל המידע על הפגישה זמין לחברות ולחברי הקבוצה במקום אחד. כך קל יותר למצוא מידע חשוב ואין צורך לעקוב אחר רצפים מבלבלים של הודעות דוא״ל.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6a57d003a0bd5f07:
    english: |-
      ### Confirm
      Ask members to leave a comment confirming they have read the agenda and meeting papers and are prepared for the meeting. Use **Seen by** to identify anyone who may need a reminder.
    translation: |-
      ### אישור היערכות
      יש לבקש מחברות ומחברי הקבוצה להשאיר תגובה המאשרת שקראו את סדר היום ואת חומרי הפגישה ושהם ערוכים לפגישה. ניתן להיעזר ב־**נראה ע"י** כדי לזהות למי כדאי לשלוח תזכורת.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d08b0ae5712ef2d:
    english: "## Find a time for meeting\nFinding a time to meet can be a frequent headache for many administrators. "
    translation: |-
      ## מציאת מועד לפגישה
      מציאת מועד שמתאים לכולם עשויה לגזול זמן רב ממנהלי הקבוצה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1da8fdf943571a19:
    english: |-
      ### On Loomio
      If you have not yet set a date and time for the meeting or you need to find a time for a future meeting, you can use **Time poll**.
    translation: |-
      ### ב־Loomio
      אם טרם נקבעו תאריך ושעה לפגישה, או אם צריך למצוא מועד לפגישה עתידית, ניתן להשתמש ב־**סקר זמן**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f1c92e27dfd63153:
    english: Time poll makes it easy to see everyone's availability and find the best time, reducing time and energy needed for this common admin task.
    translation: סקר זמן מאפשר לראות מתי כולם פנויים ולמצוא את המועד המתאים ביותר. כך נחסכים זמן ומאמץ בתיאום הפגישה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  45b90fd46cce4976:
    english: Members in different time zones will see dates and times localized in their time zone.
    translation: חברות וחברי קבוצה באזורי זמן שונים יראו את התאריכים והשעות לפי אזור הזמן שלהם.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dc159c751f73d5d1:
    english: 'When the Time poll closes, choose the best time and send an outcome notification with a calendar invitation, so members can add the meeting to their calendar. '
    translation: כאשר סקר הזמן נסגר, יש לבחור את המועד המתאים ביותר ולשלוח הודעה על המסקנה עם הזמנה ליומן, כדי שיהיה אפשר להוסיף את הפגישה ליומן.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4bafee41dd5f774c:
    english: "## Sign off minutes\nApproving or ratifying minutes is standard practice for formal meetings and good practice for all meetings.  "
    translation: |-
      ## אישור פרוטוקול הפגישה
      אישור פרוטוקול הוא נוהג מקובל בפגישות רשמיות, ומועיל גם בפגישות אחרות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d9795ed92dabff7:
    english: 'Minutes provide a record of the meeting, key points raised during discussion, results of decisions and how people voted. They include the actions agreed and the person(s) responsible, and are often the starting point for the next meeting.  '
    translation: הפרוטוקול מתעד את הפגישה, את הנקודות המרכזיות שעלו בדיון, את ההחלטות ואת אופן ההצבעה. הוא כולל את המשימות שסוכמו ואת האחראים להן, ולעיתים משמש נקודת פתיחה לפגישה הבאה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1fd0d860cba070db:
    english: Minutes are valuable as a reminder for people present, helpful for those absent and a record to consult in case of conflict.
    translation: הפרוטוקול מזכיר למשתתפים את מה שסוכם, מסייע למי שנעדרו ומשמש תיעוד שאפשר לעיין בו במקרה של מחלוקת.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  166796d872f35962:
    english: "### On Loomio"
    translation: "### ב־Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ef51b49480cb721a:
    english: Post the minutes in the Loomio meeting thread within a few days of the meeting and invite participants to approve.  This keeps the minutes relevant and fresh in member's minds and is a great way to remind members of their actions.  It also saves some time during your meeting.
    translation: יש לפרסם את הפרוטוקול בשרשור הפגישה ב־Loomio בתוך כמה ימים מהפגישה ולהזמין את המשתתפים לאשר אותו.  כך הפרוטוקול נשאר רלוונטי, מזכיר את המשימות שסוכמו וחוסך זמן בפגישה הבאה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ea02d6cf3ede73dc:
    english: The example above uses a **Choose** poll with two options 'Accept' or 'Review'.
    translation: 'בדוגמה שלמעלה נעשה שימוש בסקר **לִבחוֹר** עם שתי אפשרויות: ''אישור'' או ''בדיקה מחדש''.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  56c55da82e5ddeb7:
    english: 'When everyone has voted and the poll closes, state an outcome so everyone knows what has happened.  '
    translation: לאחר שכולם הצביעו והסקר נסגר, יש לפרסם מסקנה כדי שכולם ידעו מה הוחלט.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e8b710a05eb113dc:
    english: 'If your meeting practice requires formal acceptance at the next meeting, schedule an agenda item to acknowledge and confirm polls and decisions made on Loomio, and record this in the meeting minutes.  '
    translation: אם נהוג אצלכם לתת אישור רשמי בפגישה הבאה, יש להוסיף לסדר היום סעיף לאישור הסקרים וההחלטות שהתקבלו ב־Loomio ולתעד את האישור בפרוטוקול.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '06339a98b65ccc2c':
    english: For example; *"Does anyone wish to change their votes in Loomio?  If no, then let's resolve to formally approve polls made in Loomio during the last period."*
    translation: 'לדוגמה: *"האם יש בקשה לשנות הצבעה ב־Loomio?  אם לא, אפשר לקבל החלטה על אישור רשמי של הסקרים שנערכו ב־Loomio מאז הפגישה הקודמת."*'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f460b4ae218b375a:
    english: |-
      ## Approve reports
      Most meeting agendas include time for reports to be presented, discussed and approved; for example reports from the CEO, Financial, Operations, Health & Safety, and project reports.
    translation: |-
      ## אישור דוחות
      ברוב סדרי היום מוקצה זמן להצגת דוחות, לדיון בהם ולאישורם. למשל, דוחות הנהלה, כספים, תפעול, בריאות ובטיחות ודוחות על פרויקטים.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  00abfe283956509a:
    english: Reports are very important to help everyone get on the same page, however they can absorb valuable time in a meeting that may be used more effectively.
    translation: דוחות מסייעים לכולם להבין את המצב, אך העיסוק בהם במהלך הפגישה עשוי לתפוס זמן שאפשר לנצל ביעילות רבה יותר.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  861200207a1e1dfb:
    english: Attach or link reports to your meeting **thread** and invite questions about the reports in advance of the meeting.
    translation: יש לצרף את הדוחות ל־**שרשור** הפגישה או לקשר אליהם, ולהזמין שאלות עליהם לפני הפגישה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  11f124875e8a5945:
    english: Members receive and read the reports at a time and place that works for them.  As members read and think about the reports, they can comment, ask questions and see responses in Loomio.
    translation: חברות וחברי הקבוצה יכולים לקבל את הדוחות ולקרוא אותם בזמן ובמקום שנוחים להם.  בזמן הקריאה אפשר להגיב, לשאול שאלות ולראות את התשובות ב־Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2871f1673d36999a:
    english: A question asked by one member is likely of interest to other members, so when someone replies to the question, their response  is visible to everyone in the Loomio group.
    translation: שאלה של אחת מחברות הקבוצה או אחד מחבריה עשויה לעניין גם אחרים. לכן, כאשר נשלחת תשובה, היא גלויה לכל הקבוצה ב־Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  851a2a86a1047697:
    english: As members become familiar with discussing reports in Loomio, save a little more time by taking it a step further - seek approval of reports ahead of the meeting.
    translation: לאחר שהדיון בדוחות ב־Loomio נעשה מוכר לחברות ולחברי הקבוצה, אפשר לחסוך עוד זמן ולבקש לאשר את הדוחות לפני הפגישה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
