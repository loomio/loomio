    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d5b0be3db0bc6202:
    english: Your group home page introduces the group and provides access to its work.
    translation: La page d’accueil de votre groupe présente le groupe et donne accès à ses activités.
    status: machine
    provider: codex/gpt-6-sol
