  9f4683cb4db90895:
    english: Loomio can send notifications into your Discord channels when new discussions, proposals, comments, votes, and outcomes occur. You can also manually notify the chatroom when you need to remind people about a decision.
    translation: A Loomio értesítéseket küldhet a Discord-csatornáidba az új beszélgetésekről, javaslatokról, hozzászólásokról, szavazatokról és következtetésekről. Kézzel is küldhetsz értesítést a csevegésbe, ha emlékeztetni szeretnéd a többieket egy döntésre.
    status: machine
    provider: codex/gpt-6-sol
