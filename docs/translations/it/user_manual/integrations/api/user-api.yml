      | `query` | Search text. Exact and fuzzy matches are supported |
      | `group_id` | Restrict results to one visible group |
      | `org_id` | Restrict results to a visible parent group and its visible subgroups. Use `0` for direct discussions |
      | `type` | Restrict results to one type: `Discussion`, `Comment`, `Poll`, `Stance`, or `Outcome` |
      | `types` | Comma-separated list of result types |
      | `tag` | Restrict results to topics with this tag |
      | `author_id` | Restrict results to content by one author. Without `query`, returns that author's recent visible activity |
      | `order` | Set to `authored_at_desc` to order matching content by authoring time |
    translation: |-
      | Nome | Descrizione |
      | --- | --- |
      | `query` | Testo da cercare. Sono supportate corrispondenze esatte e approssimative |
      | `group_id` | Limita i risultati a un gruppo visibile |
      | `org_id` | Limita i risultati a un gruppo principale visibile e ai suoi sottogruppi visibili. Usa `0` per le discussioni dirette |
      | `type` | Limita i risultati a un tipo: `Discussion`, `Comment`, `Poll`, `Stance` o `Outcome` |
      | `types` | Elenco dei tipi di risultato separati da virgole |
      | `tag` | Limita i risultati agli argomenti con questa etichetta |
      | `author_id` | Limita i risultati ai contenuti di un autore. Senza `query`, restituisce le attività recenti e visibili di quell'autore |
      | `order` | Imposta `authored_at_desc` per ordinare i contenuti corrispondenti in base alla data di creazione |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  00e046b622446633:
    english: The response contains a `search_results` array. Each result identifies the matched record and its visible context with fields including `searchable_type`, `searchable_id`, `highlight`, `group_id`, `group_name`, `discussion_key`, `poll_key`, `author_id`, `author_name`, `authored_at`, and `tags`. Fields that do not apply to a result are `null`.
    translation: La risposta contiene un array `search_results`. Ogni risultato identifica il record trovato e il suo contesto visibile tramite campi tra cui `searchable_type`, `searchable_id`, `highlight`, `group_id`, `group_name`, `discussion_key`, `poll_key`, `author_id`, `author_name`, `authored_at` e `tags`. I campi non pertinenti a un risultato hanno valore `null`.
