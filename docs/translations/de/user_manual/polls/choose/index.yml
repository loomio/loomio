---
navigation_title: Wählen
blocks:
  581de5d50d3dc442:
    english: "# Choose"
    translation: "# Wählen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  733b320e0407fbdc:
    english: Choose is a simple poll for finding the most popular option or making a shortlist. Participants select one or more options, depending on the limits you set. This voting method is commonly known as multiple choice.
    translation: Wählen ist eine einfache Abstimmung, mit der du die beliebteste Option ermitteln oder eine Vorauswahl treffen kannst. Teilnehmende wählen eine oder mehrere Optionen aus, je nachdem, welche Grenzen du festlegst. Dieses Abstimmungsverfahren ist auch als Mehrfachauswahl bekannt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '09aefb579b50874b':
    english: "## When to use Choose"
    translation: "## Wann du Wählen verwenden solltest"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  be35cf72fcaf9c4d:
    english: 'Use Choose when the options are distinct and you need to count how many people select each one. It works well for:'
    translation: 'Verwende Wählen, wenn die Optionen klar voneinander abgegrenzt sind und du zählen möchtest, wie viele Personen jede Option auswählen. Das eignet sich zum Beispiel, um:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dcc6f6b9238155b2:
    english: |-
      - choosing one venue from a shortlist;
      - selecting up to three topics for an agenda;
      - deciding which design should proceed to the next round; or
      - checking which services members intend to use.
    translation: |-
      - einen Veranstaltungsort aus einer Vorauswahl zu wählen;
      - bis zu drei Themen für eine Tagesordnung auszuwählen;
      - zu entscheiden, welcher Entwurf in die nächste Runde kommt; oder
      - zu prüfen, welche Angebote die Mitglieder nutzen möchten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3770d0653b752de5:
    english: Choose records selections, not the strength or order of a person's preferences. Use [Score](/en/user_manual/polls/score/) to measure how strongly people support every option, [Allocate](/en/user_manual/polls/allocate/) when there is a limited budget, or [Rank](/en/user_manual/polls/rank/) when preference order matters.
    translation: Wählen erfasst, welche Optionen eine Person auswählt, aber nicht, wie stark sie diese bevorzugt oder in welcher Reihenfolge. Verwende [Punktzahl](/en/user_manual/polls/score/), um die Unterstützung für jede Option zu messen, [Zuweisen](/en/user_manual/polls/allocate/) bei einem begrenzten Budget oder [Rang](/en/user_manual/polls/rank/), wenn die Reihenfolge der Präferenzen wichtig ist.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f15aca327e894f30:
    english: "## Example: set a planning-meeting agenda"
    translation: "## Beispiel: Tagesordnung für eine Planungssitzung festlegen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f51e09afa0ed1e53:
    english: Oatmilk Cooperative needs to decide which parts of a returnable-bottle trial need the most time at its next planning meeting. The poll asks each person to choose up to two topics. Its details explain how the result will be used, and each option includes enough information to distinguish it from the others.
    translation: Die Hafermilch-Genossenschaft muss entscheiden, welche Teile eines Versuchs mit Mehrwegflaschen bei ihrer nächsten Planungssitzung die meiste Zeit brauchen. In der Abstimmung kann jede Person bis zu zwei Themen auswählen. Die Details erklären, wie das Ergebnis verwendet wird. Jede Option enthält genügend Informationen, um sie von den anderen zu unterscheiden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c74ebb16f872b3c6:
    english: "## Set up the poll"
    translation: "## Abstimmung einrichten"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  abc749fec8671661:
    english: Give the poll a specific question as its title. In **Details**, explain what participants should consider and what will happen with the result. Add each available option, then set the **Minimum choices** and **Maximum choices**.
    translation: Formuliere als Titel eine konkrete Frage. Erkläre unter **Details**, was die Teilnehmenden berücksichtigen sollen und was mit dem Ergebnis geschieht. Füge alle verfügbaren Optionen hinzu und lege dann die **Mindestauswahl** und die **Maximale Auswahl** fest.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e878ddc9f61dd243:
    english: Set both limits to 1 when participants must choose exactly one option. Set a higher maximum when you want a shortlist. Avoid allowing so many choices that participants can select nearly every option, because that makes the result less useful.
    translation: Setze beide Grenzen auf 1, wenn die Teilnehmenden genau eine Option wählen müssen. Lege eine höhere Obergrenze fest, wenn du eine Vorauswahl treffen möchtest. Erlaube nicht so viele Stimmen, dass Teilnehmende fast alle Optionen auswählen können. Das macht das Ergebnis weniger aussagekräftig.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  152fec5018fc232b:
    english: Use the pencil icon beside an option to add a meaning or further explanation. This is useful when a short option name could be interpreted in different ways.
    translation: Mit dem Stiftsymbol neben einer Option kannst du ihre Bedeutung erläutern oder weitere Informationen hinzufügen. Das ist hilfreich, wenn ein kurzer Optionsname unterschiedlich verstanden werden könnte.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  59e405cf9a028c8d:
    english: Under **More settings**, **Show options in random order** can reduce the effect of always presenting one option first.
    translation: Unter **Weitere Einstellungen** kann **Optionen in zufälliger Reihenfolge anzeigen** den Einfluss der Reihenfolge verringern, wenn sonst immer dieselbe Option zuerst erscheint.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Abstimmen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7db2d0e58e5fb4e4:
    english: The vote form tells participants how many options they may select. In this example, the voter selects **Cafe collection schedule** and **Washing workflow**, then gives a reason connecting those choices to the trial.
    translation: Das Abstimmungsformular zeigt den Teilnehmenden, wie viele Optionen sie auswählen dürfen. In diesem Beispiel wählt eine Person **Zeitplan für die Abholung bei Cafés** und **Ablauf der Reinigung** aus. Anschließend begründet sie, wie diese Entscheidungen mit dem Versuch zusammenhängen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e55e4b8950a5fd46:
    english: A reason can reveal why an option matters and what work participants expect it to cover. If reasons are important to the decision, configure the vote-reason setting before starting the poll.
    translation: Eine Begründung kann zeigen, warum eine Option wichtig ist und welche Aufgaben die Teilnehmenden damit verbinden. Wenn Begründungen für die Entscheidung wichtig sind, lege die entsprechende Einstellung vor Beginn der Abstimmung fest.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Ergebnisse lesen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c1ec47f66384e3bb:
    english: The results show the share of all selections received by each option, the number of voters who selected it, and who has not voted. Because each person could choose two options, the percentages describe selections rather than a percentage of people.
    translation: Die Ergebnisse zeigen, welchen Anteil aller Stimmen jede Option erhalten hat, wie viele Personen sie gewählt haben und wer noch nicht abgestimmt hat. Da jede Person zwei Optionen wählen konnte, beziehen sich die Prozentwerte auf die abgegebenen Stimmen und nicht auf den Anteil der Personen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6cbc0f9d6fdf6727:
    english: In this example, **Cafe collection schedule** has three selections. **Washing workflow** and **Return-rate reporting** each have two. The result supports giving cafe collections the most agenda time, but the tied topics still require the organizer to decide how the remaining time is divided.
    translation: In diesem Beispiel hat **Zeitplan für die Abholung bei Cafés** drei Stimmen erhalten. **Ablauf der Reinigung** und **Erfassung der Rückgabequote** haben jeweils zwei Stimmen. Das Ergebnis spricht dafür, der Abholung bei Cafés die meiste Zeit auf der Tagesordnung zu geben. Wie die übrige Zeit auf die beiden gleichauf liegenden Themen verteilt wird, muss die organisierende Person noch entscheiden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  adb7eb28e16616be:
    english: When the poll closes, publish an **Outcome** explaining what the group will do with the result.
    translation: Wenn die Abstimmung endet, veröffentliche ein **Fazit**, das erklärt, was die Gruppe mit dem Ergebnis macht.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
