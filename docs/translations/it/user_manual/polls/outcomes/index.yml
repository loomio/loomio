    english: "> _I've taken on board everyone's input. As the project manager, this is my call to make and I've decided we are going to extend the timeline by 10 days._"
    translation: "> _Ho tenuto conto dei contributi di tutte le persone. Come responsabile del progetto, spetta a me prendere questa decisione e ho deciso di prorogare i tempi di 10 giorni._"
