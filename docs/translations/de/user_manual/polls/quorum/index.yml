  7ba26dd025983d8d:
    english: Jamie limits the vote to the five people responsible for the trial budget.
    translation: Jamie beschränkt die Abstimmung auf die fünf Personen, die für das Budget des Tests verantwortlich sind.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ef25fbaed498cfbe:
    english: The cooperative requires 60 percent participation for significant decisions, so Jamie enters **60** in the participation quorum field and starts the proposal.
    translation: Die Genossenschaft verlangt bei wichtigen Entscheidungen eine Beteiligung von 60 Prozent. Deshalb gibt Jamie **60** in das Feld für das Teilnahmequorum ein und startet den Vorschlag.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
