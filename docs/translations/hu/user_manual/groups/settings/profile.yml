  a1c12efad8cb82f5:
    english: "## Name and handle"
    translation: "## Név és azonosító"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3643c2e2ffd5db73:
    english: Choose a concise group name, particularly if the group will contain subgroups. Loomio uses the handle in the group's web address and group email address, such as `loomio.com/your-group-handle` and `your-group-handle@loomio.com`.
    translation: Válassz rövid csoportnevet, különösen akkor, ha a csoportnak alcsoportjai is lesznek. A Loomio az azonosítót használja a csoport webcímében és e-mail-címében, például `loomio.com/your-group-handle` és `your-group-handle@loomio.com`.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5a6e298a019f6a15:
    english: When you change the handle, links using the previous handle redirect to the new address, and email sent to the previous group address continues to reach the group. Loomio retains up to three previous handles; changing the handle again after that causes the oldest one to expire.
    translation: Ha megváltoztatod az azonosítót, a régi azonosítót használó linkek az új címre irányítanak át, és a korábbi csoportcímre küldött e-mailek továbbra is megérkeznek a csoporthoz. A Loomio legfeljebb három korábbi azonosítót őriz meg. Ha ezután újra megváltoztatod az azonosítót, a legrégebbi érvényét veszti.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2b45dd41be9c3d1d:
    english: "## Description"
    translation: "## Leírás"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7b707620077d9d19:
    english: Use the description to explain what the group is for, who participates, and how people are expected to use it. You can format the description and include links, documents, and videos.
    translation: A leírásban írd le, mire való a csoport, kik vesznek részt benne, és hogyan használják. Formázhatod a leírást, és linkeket, dokumentumokat vagy videókat is hozzáadhatsz.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  93a11a5e2927833e:
    english: The name and description may be visible to non-members depending on the group's [privacy settings](/en/user_manual/groups/settings/privacy).
    translation: A csoport [adatvédelmi beállításaitól](/en/user_manual/groups/settings/privacy) függően a név és a leírás azok számára is látható lehet, akik nem tagok.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0dff03268238aa26:
    english: "## Cover image and logo"
    translation: "## Borítókép és logó"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9d08dda635bd5ce6:
    english: The cover image appears across the top of the group page. A wide image works best; the recommended size is 2048 × 512 pixels.
    translation: A borítókép a csoport oldalának tetején jelenik meg. Széles képet érdemes választani; az ajánlott méret 2048 × 512 képpont.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cc04654d8d08da59:
    english: The group logo identifies the group in navigation and other compact contexts. Upload the cover image and logo separately so each can be cropped for its intended shape.
    translation: A csoport logója a navigációban és más, kisebb helyeken azonosítja a csoportot. A borítóképet és a logót külön töltsd fel, hogy mindkettőt a megfelelő alakra lehessen vágni.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
