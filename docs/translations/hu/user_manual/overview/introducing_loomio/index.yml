---
navigation_title: A Loomio bevezetése a csoportodban
blocks:
  6c777a62b2b77732:
    english: "# Introducing Loomio to your group"
    translation: "# A Loomio bevezetése a csoportodban"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  438cc622ae730bd8:
    english: Introduce Loomio through one useful piece of work. Prepare the group before inviting people, help everyone participate once, and complete the process through to an outcome.
    translation: Egy hasznos közös feladattal vezesd be a Loomiót. Készítsd elő a csoportot, mielőtt meghívod az embereket, segíts mindenkinek legalább egyszer hozzájárulni, és vidd végig a folyamatot a következtetésig.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9c9fa4e8f6e208e4:
    english: "## Choose one useful starting point"
    translation: "## Válassz egy hasznos kiindulópontot"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3353fb04e83837e5:
    english: Start with a real process that your group already needs. A good first use is small enough to complete soon, but relevant enough that people have a reason to participate.
    translation: Kezdj egy olyan valódi folyamattal, amelyre a csoportodnak már szüksége van. Az első feladat legyen elég kicsi ahhoz, hogy hamar lezárhassátok, de elég fontos ahhoz, hogy az emberek részt akarjanak venni benne.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  652744a2ab28954b:
    english: 'For example:'
    translation: 'Például:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  19bc6c09eeea816e:
    english: |-
      - prepare the agenda for an upcoming meeting;
      - review and approve meeting minutes;
      - gather feedback on a draft document;
      - decide a small operational question; or
      - identify priorities for the next month.
    translation: |-
      - állítsátok össze egy közelgő találkozó napirendjét;
      - nézzétek át és hagyjátok jóvá egy találkozó jegyzőkönyvét;
      - kérjetek visszajelzést egy dokumentum tervezetéről;
      - döntsetek egy kisebb működési kérdésben; vagy
      - határozzátok meg a következő hónap prioritásait.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  68a0d6b76f36ebaf:
    english: Avoid moving every discussion and decision into Loomio at once. A repeatable process gives the group a clear reason to return and lets you improve the way you run it each time.
    translation: Ne vigyetek át egyszerre minden beszélgetést és döntést a Loomióba. Egy ismétlődő folyamat világos okot ad a csoportnak a visszatérésre, és minden alkalommal javíthattok a lebonyolításán.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4b65243ef120921b:
    english: "## Prepare the group before inviting people"
    translation: "## Készítsd elő a csoportot, mielőtt meghívod az embereket"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  305b29c1c832c246:
    english: 'Give people a useful and recognizable place to arrive in:'
    translation: 'Készíts elő egy hasznos, könnyen felismerhető helyet az érkezőknek:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  76d859d168805706:
    english: |-
      - add the group's name, logo, cover image, purpose, and important links;
      - check the group's privacy and permissions;
      - add any [category tags](/en/user_manual/discussions/tags) the group will use regularly;
      - create the first real discussion, with the background information people need; and
      - create a practice discussion if members would benefit from trying comments, reactions, and voting without consequences.
    translation: |-
      - add meg a csoport nevét, logóját, borítóképét, célját és fontos hivatkozásait;
      - ellenőrizd a csoport adatvédelmi és jogosultsági beállításait;
      - add hozzá a rendszeresen használt [kategóriacímkéket](/en/user_manual/discussions/tags);
      - indítsd el az első valódi beszélgetést, és add meg a résztvevőknek szükséges háttérinformációkat; és
      - indíts gyakorlóbeszélgetést, ha a tagoknak segítene következmények nélkül kipróbálni a hozzászólásokat, reakciókat és szavazást.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f1decb57ec9d48cb:
    english: Use your own photo in your profile and the organization's logo for the group. This helps people recognize who invited them and which organization an email is about.
    translation: A profilodban a saját fényképedet, a csoportnál pedig a szervezet logóját használd. Így az emberek felismerhetik, ki hívta meg őket, és melyik szervezetről szól az e-mail.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '01965093f234bb36':
    english: "## Decide where work belongs"
    translation: "## Döntsd el, melyik munka hová tartozik"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7fbd0d770cbed2bd:
    english: 'Loomio can sit alongside tools your group already uses:'
    translation: 'A Loomiót a csoportod által már használt eszközök mellett is használhatjátok:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '0168271b154f6931':
    english: |-
      | Use | Good place for it |
      |---|---|
      | Quick questions, social conversation, and timely updates | Chat, such as Slack, Teams, Matrix, or Discord |
      | Collaborative editing of a living document | A shared document tool |
      | Assigning work and tracking its completion | A task or project-management tool |
      | A focused discussion, broad participation, a decision, and its lasting record | Loomio |
    translation: |-
      | Feladat | Megfelelő hely |
      |---|---|
      | Gyors kérdések, kötetlen beszélgetés és időszerű hírek | Csevegő, például Slack, Teams, Matrix vagy Discord |
      | Folyamatosan változó dokumentum közös szerkesztése | Közös dokumentumszerkesztő |
      | Feladatok kiosztása és teljesítésük követése | Feladat- vagy projektkezelő eszköz |
      | Egy adott kérdés megvitatása, széles körű részvétel, döntés és annak tartós dokumentálása | Loomio |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  50fae2027411e538:
    english: Link to documents and other systems from the group description or discussion context. Use [chat integrations](/en/user_manual/integrations/chatbots) to bring important Loomio activity into a channel people already follow.
    translation: A dokumentumokra és más rendszerekre mutató hivatkozásokat a csoport leírásában vagy a beszélgetés háttérinformációi között helyezd el. A [csevegőintegrációkkal](/en/user_manual/integrations/chatbots) a fontos Loomio-tevékenységeket olyan csatornába továbbíthatod, amelyet az emberek már követnek.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ed67af54bdf1c775:
    english: Tell members what you expect to happen in Loomio. A simple boundary such as “important discussions and decisions go in Loomio; quick coordination stays in chat” is easier to adopt than an unexplained new tool.
    translation: Mondd el a tagoknak, milyen tevékenységekre használjátok a Loomiót. Egy egyszerű szabályt, például azt, hogy „a fontos beszélgetések és döntések a Loomióba kerülnek; a gyors egyeztetés a csevegőben marad”, könnyebb követni, mint egy új eszközt magyarázat nélkül használatba venni.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0a799d7911a46f6f:
    english: "## Decide how your group decides"
    translation: "## Döntsd el, hogyan hozzon döntéseket a csoportod"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e1c64de2dc68593:
    english: Loomio does not require every group, or every decision, to use the same process. Some groups arrive with established rules. Others use Loomio while they develop a clearer decision-making practice together.
    translation: A Loomio nem ír elő minden csoportnak vagy minden döntéshez azonos folyamatot. Egyes csoportoknak már vannak kialakult szabályaik. Mások a Loomio használata közben alakítanak ki közösen egy világosabb döntéshozatali gyakorlatot.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6d0c0f50959ab9d6:
    english: "### If your process is already established"
    translation: "### Ha már kialakult a döntési folyamatotok"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5fbfe86e935d5a8c:
    english: 'Translate the group''s existing requirements into Loomio. Before running a formal decision, make sure participants can tell:'
    translation: 'Ültesd át a csoport meglévő szabályait a Loomio használatába. Egy hivatalos döntés előtt gondoskodj róla, hogy a résztvevők tudják:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9a1b89bd4c5fe02c:
    english: |-
      - which kinds of decisions can be made in Loomio;
      - who provides input and who has authority to decide;
      - who is eligible to vote;
      - whether a [quorum](/en/user_manual/polls/quorum) is required;
      - whether the decision requires a majority, supermajority, unanimous agreement, consent, or another [vote share requirement](/en/user_manual/polls/vote_share_requirements);
      - whether the decision takes effect when its outcome is published or must be ratified elsewhere; and
      - who will record and carry out the outcome.
    translation: |-
      - milyen döntéseket lehet a Loomióban meghozni;
      - ki adhat véleményt, és kinek van döntési jogköre;
      - ki jogosult szavazni;
      - szükséges-e [határozatképesség](/en/user_manual/polls/quorum);
      - a döntéshez egyszerű többség, minősített többség, egyhangú egyetértés, beleegyezés vagy más [szavazati arányra vonatkozó követelmény](/en/user_manual/polls/vote_share_requirements) szükséges-e;
      - a döntés a következtetés közzétételekor lép-e érvénybe, vagy máshol is jóvá kell hagyni; és
      - ki rögzíti és hajtja végre a következtetést.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4b48b6e0aff5cfc0:
    english: If your constitution, bylaws, policy, or local law governs electronic decisions, make sure the Loomio process follows those requirements. Configure [delegated voters](/en/user_manual/groups/delegated_voters), proposal settings, and [poll templates](/en/user_manual/polls/poll_templates) to make the agreed process easy to repeat.
    translation: Ha az alapszabály, a belső szabályzat vagy a helyi jog szabályozza az elektronikus döntéshozatalt, ügyelj rá, hogy a Loomióban követett folyamat megfeleljen ezeknek az előírásoknak. Állítsd be a [meghatalmazott szavazókat](/en/user_manual/groups/delegated_voters), a javaslatok beállításait és a [szavazási sablonokat](/en/user_manual/polls/poll_templates), hogy a megállapodott folyamat könnyen megismételhető legyen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b068624ed6c7c6b3:
    english: "### If your group is still deciding"
    translation: "### Ha a csoportod még alakítja a döntési folyamatát"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  14449de544d28a6b:
    english: 'Start a discussion about how decisions should be made. Instead of beginning with a voting tool, ask the group to consider:'
    translation: 'Indíts beszélgetést arról, hogyan hozzatok döntéseket. Mielőtt szavazást indítanátok, kérd meg a csoportot, hogy gondolja át:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f65b39a74ae25ed7:
    english: |-
      - What kinds of decisions do we make?
      - Who is affected, who should be consulted, and who is responsible for deciding?
      - Which decisions need advice, consent, consensus, a vote, or delegated authority?
      - What level of participation or support makes a decision valid?
      - How will we respond to objections, tied results, or insufficient participation?
      - How will we communicate, record, review, and change a decision?
    translation: |-
      - Milyen döntéseket hozunk?
      - Kit érintenek ezek, kinek a véleményét kell kikérni, és ki felel a döntésért?
      - Mely döntésekhez kell tanácsot kérni, beleegyezést szerezni, konszenzusra jutni, szavazni vagy döntési jogkört átruházni?
      - Mekkora részvétel vagy támogatás szükséges egy érvényes döntéshez?
      - Hogyan kezeljük az ellenvetéseket, a szavazategyenlőséget vagy az alacsony részvételt?
      - Hogyan közöljük, rögzítjük, vizsgáljuk felül és módosítjuk a döntéseket?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ce7c0af2ad170b5c:
    english: The answers may be different for an operational decision, a policy, an election, and a constitutional change. See [Making decisions](/en/guides/making_decisions) to compare several complete processes.
    translation: Más válaszok lehetnek megfelelőek egy működési kérdésben, egy szabályzat elfogadásakor, egy választáson vagy az alapszabály módosításakor. Több teljes folyamat összehasonlításához olvasd el a [Döntéshozatal](/en/guides/making_decisions) című útmutatót.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  aac26fc96b90744d:
    english: If the group is not ready to settle every rule, agree on a provisional process for one low-risk decision. State what the result will mean before asking people to participate, publish an outcome, then review how the process worked. Record what the group learns in its description, governance documents, or reusable templates.
    translation: Ha a csoport még nem áll készen minden szabály véglegesítésére, egyezzetek meg egy ideiglenes folyamatban egy kis kockázatú döntéshez. Mielőtt részvételre kéred az embereket, mondd el, mit fog jelenteni az eredmény. Ezután tedd közzé a következtetést, és vizsgáljátok meg, hogyan működött a folyamat. A tanulságokat rögzítsétek a csoport leírásában, az irányítási dokumentumokban vagy újrahasználható sablonokban.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  23ed8fb3e887afbc:
    english: "## Invite people"
    translation: "## Hívd meg az embereket"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a5d369ad9df691fe:
    english: "[Invite people](/en/user_manual/groups/inviting_people) with a short personal message that explains:"
    translation: "[Hívd meg az embereket](/en/user_manual/groups/inviting_people) egy rövid, személyes üzenettel, amelyből kiderül:"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3383207ff2fcc99b:
    english: |-
      - why the group is using Loomio;
      - what you are asking them to do first;
      - when you need their response; and
      - where they can get help.
    translation: |-
      - miért használja a csoport a Loomiót;
      - mit kérsz tőlük elsőként;
      - mikorra várod a válaszukat; és
      - hol kaphatnak segítséget.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  282ef8673815823e:
    english: You can begin with a small group of people who will actively test the process, or invite the whole group when everyone needs to participate from the start. In either case, have a discussion ready for them rather than inviting people into an empty group.
    translation: Kezdhetsz néhány emberrel, akik aktívan kipróbálják a folyamatot, vagy meghívhatod az egész csoportot, ha kezdettől mindenkinek részt kell vennie. Mindkét esetben készíts elő nekik egy beszélgetést, mielőtt meghívod őket.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cd6511a78ce7c9b7:
    english: "## Help everyone participate once"
    translation: "## Segíts mindenkinek egyszer részt venni"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a37273687b4f4b0:
    english: The first objective is for each person to cross the threshold from receiving an invitation to contributing something.
    translation: Az első cél az, hogy mindenki az első meghívástól eljusson valamilyen hozzájárulásig.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ce285f27cca389c4:
    english: 'Ask people to:'
    translation: 'Kérd meg az embereket, hogy:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d0b9e80af995edff:
    english: |-
      1. sign in and add a profile photo;
      2. open the welcome or practice discussion;
      3. post a short comment or reaction; and
      4. vote in a low-stakes proposal and, if useful, leave a reason.
    translation: |-
      1. jelentkezzenek be, és adjanak hozzá profilképet;
      2. nyissák meg az üdvözlő vagy gyakorlóbeszélgetést;
      3. írjanak egy rövid hozzászólást, vagy adjanak egy reakciót; és
      4. szavazzanak egy kisebb jelentőségű javaslatról, és ha hasznos, indokolják meg a szavazatukat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  919e32e7adb7c4c8:
    english: Members do not need to create a password. They can [sign in by email](/en/user_manual/users/signing_in), and they can reply to eligible discussion emails without first navigating back to the thread.
    translation: A tagoknak nem kell jelszót létrehozniuk. [E-mailben is bejelentkezhetnek](/en/user_manual/users/signing_in), és a megfelelő beszélgetési e-mailekre közvetlenül is válaszolhatnak, anélkül hogy vissza kellene lépniük a témába.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  22ceb7104d416acf:
    english: "## Use notifications deliberately"
    translation: "## Tudatosan használd az értesítéseket"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dd99e6dd5c93d9ee:
    english: Access to content and notification about it are separate. Group members can find discussions in their group even when they were not notified immediately.
    translation: A tartalomhoz való hozzáférés és az arról szóló értesítés külön dolog. A csoporttagok akkor is megtalálhatják a csoport beszélgetéseit, ha nem kaptak róluk azonnal értesítést.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0e20732d957eb282:
    english: When starting a discussion, notify the people whose input is needed at that stage. Use @mentions and replies when asking particular people to respond. When voting opens later, invite the eligible voters.
    translation: Amikor beszélgetést indítasz, értesítsd azokat, akiknek abban a szakaszban szükség van a véleményére. Ha konkrét emberektől vársz választ, használd a @megemlítéseket és a válaszokat. Amikor később megnyílik a szavazás, hívd meg a szavazásra jogosultakat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  43339ff0f3d30a50:
    english: If you create a discussion and poll together only to capture a vote, avoid sending a discussion invitation immediately followed by a poll invitation. Either start the discussion without notifying people and invite them through the poll, or run a [standalone poll](/en/user_manual/polls/intro_to_decisions#without-a-discussion).
    translation: Ha csak a szavazatok összegyűjtésére hozol létre egyszerre beszélgetést és szavazást, ne küldj egymás után meghívót a beszélgetéshez és a szavazáshoz. Indítsd el a beszélgetést értesítés nélkül, és a szavazáson keresztül hívd meg az embereket, vagy indíts [önálló szavazást](/en/user_manual/polls/intro_to_decisions#without-a-discussion).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  467cf9d1e5bd2973:
    english: Show members the [Catch-up and notification settings](/en/user_manual/users/email_settings), especially if they do not expect to visit Loomio every day.
    translation: Mutasd meg a tagoknak a [napi összefoglaló és értesítési beállításokat](/en/user_manual/users/email_settings), különösen akkor, ha nem terveznek mindennap belépni a Loomióba.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ebe7764d64b17823:
    english: "## Complete the first process"
    translation: "## Vidd végig az első folyamatot"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9a165c59ba0aed5a:
    english: 'A first process should demonstrate the complete pattern:'
    translation: 'Az első folyamatban érdemes végigmenni minden lépésen:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8bc60d4319adf204:
    english: |-
      1. Introduce the topic and provide context.
      2. Invite discussion or questions when they are needed.
      3. Start the appropriate proposal or poll.
      4. Remind people who have not participated when necessary.
      5. Publish an [outcome](/en/user_manual/polls/outcomes) stating what was decided and what happens next.
    translation: |-
      1. Mutasd be a témát, és add meg a szükséges háttérinformációkat.
      2. Kérj hozzászólásokat vagy kérdéseket, amikor szükség van rájuk.
      3. Indítsd el a megfelelő javaslatot vagy szavazást.
      4. Szükség esetén emlékeztesd azokat, akik még nem vettek részt.
      5. Tedd közzé a [következtetést](/en/user_manual/polls/outcomes), amelyből kiderül, mi lett a döntés, és mi történik ezután.
