---
navigation_title: Шаблоны обсуждений
blocks:
  80c5dfc46bb963d2:
    english: "# Discussion templates"
    translation: "# Шаблоны обсуждений"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  488fbd5167707cba:
    english: Discussion templates help your group start discussions the same way each time. A template can supply a title, context, tags, and instructions for the person starting the discussion. It also sets defaults, such as whether to notify the whole group and which polls to suggest.
    translation: 'Шаблоны помогают группе каждый раз начинать обсуждения по одному порядку. В шаблоне можно задать заголовок, описание, метки и инструкции для автора обсуждения. Он также задаёт настройки по умолчанию: например, уведомлять ли всю группу и какие опросы предлагать.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2571bc9cc405d927:
    english: Every new discussion in a group starts from a template. When someone selects **Start discussion**, Loomio shows the group's templates. Even **Blank template** is a template, so your group can change its defaults too.
    translation: Каждое новое обсуждение в группе начинается с шаблона. Когда кто-то выбирает **Начать обсуждение**, Loomio показывает шаблоны группы. **Пустой шаблон** тоже можно настроить, в том числе изменить его настройки по умолчанию.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  834ac31697ef254b:
    english: Templates work well for processes your group repeats, such as project reviews, advice processes, meeting preparation, funding decisions, or document approvals. The person starting the discussion can still edit everything before they start it.
    translation: 'Шаблоны подходят для процессов, которые группа повторяет: рассмотрения проектов, сбора рекомендаций, подготовки встреч, решений о финансировании или утверждения документов. Автор может изменить все поля до начала обсуждения.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  74d1c850f63c0518:
    english: "## How templates are used"
    translation: "## Как используются шаблоны"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6e5927441d982c01:
    english: |-
      1. A member selects **Start discussion** on the group page.
      2. Loomio lists the group's visible templates. Each one shows its title and subtitle.
      3. The member selects a template. Loomio opens the new discussion form, filled in from the template.
      4. The template's help appears at the top of the form as guidance.
      5. The member edits the title, context, tags, and invite list, then selects **Start discussion**.
    translation: |-
      1. Участник выбирает **Начать обсуждение** на странице группы.
      2. Loomio показывает видимые шаблоны группы. У каждого есть название и подзаголовок.
      3. Участник выбирает шаблон. Loomio открывает форму нового обсуждения с данными из шаблона.
      4. В верхней части формы появляются инструкции из шаблона.
      5. Участник редактирует заголовок, описание, метки и список приглашённых, затем выбирает **Начать обсуждение**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  464984a60c23366b:
    english: Changing a template affects only discussions started after the change. Discussions already started from it keep their content and settings.
    translation: Изменения шаблона действуют только для обсуждений, начатых после этих изменений. Уже начатые обсуждения сохраняют своё содержимое и настройки.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  70c22d24ec0d248b:
    english: "## Choose who is notified by default"
    translation: "## Выберите, кого уведомлять по умолчанию"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  77feebf56c2ee9a7:
    english: 'The **Invite** setting controls who the new discussion form invites by default. It has two options:'
    translation: 'Настройка **Приглашать** определяет, кто будет приглашён в форме нового обсуждения по умолчанию. Есть два варианта:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6c93f4222436028f:
    english: |-
      - **Everyone in the group**: the group appears in the discussion form's **Invite** field, and every member is notified when the discussion starts.
      - **None**: the **Invite** field starts empty. Nobody is notified unless the author adds people.
    translation: |-
      - **Все в группе**: группа появляется в поле **Приглашать**, и каждый участник получает уведомление о начале обсуждения.
      - **Никто**: поле **Приглашать** изначально пустое. Уведомления никто не получит, пока автор не добавит людей.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  17cca49613fff23d:
    english: Loomio's built-in templates, including **Blank template**, use **Everyone in the group**. If your group does not want every new discussion to notify all members, edit the templates your group uses and set **Invite** to **None**.
    translation: Во встроенных шаблонах Loomio, включая **Пустой шаблон**, выбран вариант **Все в группе**. Если группа не хочет уведомлять всех участников о каждом новом обсуждении, измените используемые шаблоны и выберите **Никто** в настройке **Приглашать**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5fd184e64e0605bc:
    english: The author can always change the invite list before starting the discussion. They can remove the group to notify nobody, or add specific people instead. This setting only affects notifications. Group members can still find and read the discussion in the group, whichever option you choose.
    translation: Автор всегда может изменить список приглашённых до начала обсуждения. Можно удалить группу, чтобы никого не уведомлять, или добавить отдельных людей. Эта настройка влияет только на уведомления. При любом варианте участники группы смогут найти и прочитать обсуждение в группе.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  58f24313ca36c890:
    english: The group is added to the invite list only when the author is allowed to notify the whole group. Admins can always do this. Members can do it when **Members can notify everyone in the group** is enabled in the group's permissions.
    translation: Группа добавляется в список приглашённых, только если автору разрешено уведомлять всю группу. Администраторы могут делать это всегда. Участники могут делать это, если в разрешениях группы включена настройка **Участники могут уведомлять всех в группе**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  33afd174376e933b:
    english: "## Template settings"
    translation: "## Настройки шаблона"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b02be20543f228a7:
    english: 'Group admins can edit a template from the action menu beside it in the template list. The form has these settings:'
    translation: 'Администраторы группы могут изменить шаблон через меню действий рядом с ним в списке шаблонов. В форме доступны следующие настройки:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f2fc57fe20100911:
    english: |-
      - **Template title**: the short name shown in the template list.
      - **Template subtitle**: one line explaining when to use the template.
      - **Template help**: instructions shown at the top of the new discussion form. Use it to explain the process and link to resources. It is not part of the discussion.
      - **Group**: whether the template starts a discussion in the group or a direct discussion. A direct discussion is visible only to the people invited to it.
      - **Default title**: a title filled in for each new discussion. The author can edit it.
      - **Example title**: an example shown in an empty title field. Use it when a default title would not fit every discussion.
      - **Tags**: tags applied to each new discussion. The author can remove them.
      - **Context**: the starting text of the discussion. Use headings, questions, or links to guide what people write.
      - **Invite**: whether to invite everyone in the group by default. See [Choose who is notified by default](#choose-who-is-notified-by-default).
      - **Poll templates**: polls suggested for this process. They are listed on the new discussion form. They also appear first when someone starts a poll in the discussion. They do not start automatically.
      - **Allow concurrent polls**: whether more than one poll can be open in the discussion at the same time.
      - **Comment length limit**: an optional maximum length for comments.
    translation: |-
      - **Название шаблона**: краткое название в списке шаблонов.
      - **Шаблон подзаголовка**: строка с пояснением, когда использовать шаблон.
      - **Помощь с шаблонами**: инструкции в верхней части формы нового обсуждения. Здесь можно объяснить порядок действий и дать ссылки на материалы. Эти инструкции не становятся частью обсуждения.
      - **Группа**: начнётся ли обсуждение в группе или будет прямым. Прямое обсуждение видно только приглашённым людям.
      - **Заголовок по умолчанию**: заголовок, который подставляется в каждое новое обсуждение. Автор может его изменить.
      - **Пример заголовка**: пример, который показывается в пустом поле заголовка. Используйте его, если один заголовок по умолчанию не подходит для всех обсуждений.
      - **Метки**: метки, которые добавляются к каждому новому обсуждению. Автор может их удалить.
      - **Описание**: начальный текст обсуждения. Используйте заголовки, вопросы или ссылки, чтобы подсказать участникам, о чём писать.
      - **Приглашать**: приглашать ли по умолчанию всех участников группы. См. [Выберите, кого уведомлять по умолчанию](#choose-who-is-notified-by-default).
      - **Шаблоны опросов**: опросы, предлагаемые для этого процесса. Они перечислены в форме нового обсуждения и показываются первыми, когда кто-то начинает опрос в обсуждении. Автоматически они не запускаются.
      - **Разрешить одновременное проведение опросов.**: можно ли одновременно держать открытыми несколько опросов в обсуждении.
      - **Ограничение на длину комментария**: необязательное ограничение максимальной длины комментариев.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a9e44919507a613:
    english: Use a default title only when it will stay accurate. Otherwise, write an example title that prompts the author to name the specific review, period, document, or decision.
    translation: Используйте заголовок по умолчанию, только если он всегда будет точным. Иначе добавьте пример, который подскажет автору указать конкретный проект, период, документ или решение.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c5db289e27f54169:
    english: "## Example: bottle trial review"
    translation: "## Пример: оценка испытания возвратных бутылок"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  89e7b8f9b36a8ae7:
    english: Oatmilk Cooperative reviews its returnable-bottle trial after each cycle. Its template is titled "Bottle trial review" and has a default title. It adds the "Bottle trial" tag. Its context asks members to read the weekly report and consider return rates, washing records, cafe feedback, and transport costs. It recommends a Sense check followed by Consent.
    translation: Кооператив Oatmilk Cooperative оценивает испытание возвратных бутылок после каждого цикла. Его шаблон называется «Оценка испытания бутылок» и содержит заголовок по умолчанию. Шаблон добавляет метку «Испытание бутылок». В описании участникам предлагается прочитать еженедельный отчёт и рассмотреть долю возвращённых бутылок, записи о мойке, отзывы кафе и транспортные расходы. Затем предлагается провести проверку понимания и опрос на согласие.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f896031f8dcc2f84:
    english: This works as a template because the purpose and evidence stay the same each cycle. Only the observations and decisions change.
    translation: 'Такой шаблон подходит для повторного использования: цель и источники данных остаются прежними в каждом цикле. Меняются только наблюдения и решения.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7e5955c442f6c8ae:
    english: "## Create a template"
    translation: "## Создайте шаблон"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c2b2bc41cbe6f6a:
    english: Group admins can select **New template** from the template list. Choose an example from Loomio's gallery or start with a blank template, then adapt it and save it.
    translation: Администраторы группы могут выбрать **Новый шаблон** в списке шаблонов. Выберите пример из галереи Loomio или начните с пустого шаблона, затем настройте и сохраните его.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a9cb80d574e2d865:
    english: You can search or filter the gallery. An example is not added to your group until you save it.
    translation: В галерее можно искать примеры и применять фильтры. Пример добавится в вашу группу только после сохранения.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1f0dab3f50320e75:
    english: "## Manage the template list"
    translation: "## Управляйте списком шаблонов"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7462593f2f6d1614:
    english: When a group is created, Loomio adds a set of templates suited to the kind of group. Only **Blank template** and **Practice discussion** are visible at first. The others are hidden, and admins can unhide them.
    translation: При создании группы Loomio добавляет набор шаблонов, подходящих для её типа. Сначала видны только **Пустой шаблон** и **Практическое обсуждение**. Остальные скрыты, но администраторы могут их показать.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e6f7eaa63e353ef7:
    english: 'Group admins can use the action menu beside a template to:'
    translation: 'Через меню действий рядом с шаблоном администраторы группы могут:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e8767178e42cd4e0:
    english: |-
      - edit its content and settings;
      - hide it from the template list;
      - unhide it from **Hidden templates**;
      - rearrange the order of visible templates;
      - export it as a JSON file; or
      - delete it.
    translation: |-
      - изменить его содержимое и настройки;
      - скрыть его из списка шаблонов;
      - показать его снова через **Скрытые шаблоны**;
      - изменить порядок видимых шаблонов;
      - экспортировать его в файл JSON; или
      - удалить его.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5d4cbc918551c211:
    english: Hiding a template keeps it for later use. Deleting a template does not delete discussions started from it.
    translation: Скрытый шаблон можно использовать позже. При удалении шаблона обсуждения, начатые с его помощью, сохраняются.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c0ae844752e20ef:
    english: "## Share templates between groups"
    translation: "## Передавайте шаблоны между группами"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  acf646688b9b79f4:
    english: Select **Export json** in a template's action menu to download it as a file. To use it in another group, select **New template**, then **Import json**. The form opens with the imported content so you can review it before saving.
    translation: Чтобы скачать шаблон как файл, выберите **Экспорт в формате JSON** в его меню действий. Чтобы использовать его в другой группе, выберите **Новый шаблон**, затем **Импортировать json**. Откроется форма с импортированным содержимым, которое можно проверить перед сохранением.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a168253bda3147e8:
    english: Links to custom poll templates are not included in the file. Export and import those poll templates separately.
    translation: Ссылки на пользовательские шаблоны опросов не включаются в файл. Экспортируйте и импортируйте эти шаблоны опросов отдельно.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4833d57d46ccb98e:
    english: "## Let members create templates"
    translation: "## Разрешите участникам создавать шаблоны"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1ac138e713feea59:
    english: By default, only group admins can create and edit templates. An admin can enable **Members can create templates** under **Group settings** → **Permissions**.
    translation: По умолчанию создавать и изменять шаблоны могут только администраторы группы. Администратор может включить настройку **Участники могут создавать шаблоны.** в разделе **Настройки группы** → **Разрешения**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  889e8792d7937424:
    english: When this is enabled, members can create discussion and poll templates and edit the templates they created. Admins can edit every template in the group. A member's template appears in the group's template list once it is saved, so agree on naming and review practices before enabling this permission.
    translation: После включения настройки участники смогут создавать шаблоны обсуждений и опросов и изменять созданные ими шаблоны. Администраторы смогут изменять любой шаблон группы. Сохранённый участником шаблон появляется в общем списке, поэтому заранее договоритесь о названиях шаблонов и порядке их проверки.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1284dfc3e68170d8:
    english: "## Templates for non-members"
    translation: "## Шаблоны для людей вне группы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5c701c3795724027:
    english: If **Non-members can start discussions** is enabled, people outside the group choose from the same template list. Their discussion form never invites the group by default. See [Collect private submissions](/en/user_manual/discussions/private_submissions).
    translation: Если включена настройка **Участники, не являющиеся членами организации, могут начать обсуждения.**, люди вне группы выбирают шаблон из того же списка. В их форме обсуждения группа никогда не приглашается по умолчанию. См. [Сбор частных обращений](/en/user_manual/discussions/private_submissions).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  630a5d69a7093105:
    english: "## Related"
    translation: "## См. также"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  32717eb37456dbfd:
    english: "- [Poll templates](/en/user_manual/polls/poll_templates)"
    translation: "- [Шаблоны опросов](/en/user_manual/polls/poll_templates)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
