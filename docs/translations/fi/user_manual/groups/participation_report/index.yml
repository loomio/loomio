  7d416ad780b3ca85:
    english: Turn on **Delegates only** to show people who are currently delegates in any of the selected groups. Their activity and voting record are aggregated across all selected groups, and delegates with no activity during the selected period remain in the table. The CSV download uses the same filter.
    translation: Ota **Vain edustajat** käyttöön, niin näet henkilöt, jotka ovat tällä hetkellä edustajia jossakin valituista ryhmistä. Heidän toimintansa ja äänestystietonsa lasketaan yhteen kaikista valituista ryhmistä. Taulukossa näkyvät myös edustajat, jotka eivät olleet aktiivisia valitulla ajanjaksolla. CSV-latauksessa käytetään samaa suodatinta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
