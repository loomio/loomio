---
navigation_title: Privacy
blocks:
  946f29d3bdb2e2af:
    english: "# Group privacy"
    translation: "# Privacy del gruppo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6a2fbb3e7cecad6e:
    english: Privacy controls who can find a group and who can read its content. Open **Edit group settings** from the group page, then select **Privacy**.
    translation: La privacy determina chi può trovare un gruppo e leggere i suoi contenuti. Nella pagina del gruppo, apri **Modifica le impostazioni del gruppo** e seleziona **Privacy**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bf79bc420fc36377:
    english: "![Group privacy settings](group_privacy_settings.png#width-90)"
    translation: "![Impostazioni della privacy del gruppo](group_privacy_settings.png#width-90)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4d275c75fe1a2c77:
    english: Changing privacy can expose or hide existing group content, not only content created afterward. Choose the most restrictive setting that still supports the group's purpose.
    translation: Cambiare la privacy può rendere visibili o nascondere anche i contenuti già presenti nel gruppo. Scegli l'impostazione più restrittiva che consenta comunque al gruppo di raggiungere il suo scopo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7510b0e8a0fcf7b3:
    english: "## Open"
    translation: "## Aperto"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f202c6fba754adaa:
    english: Open groups are public spaces. Anyone can find the group and read its discussions, polls, and files. The member list remains visible only to members.
    translation: I gruppi aperti sono spazi pubblici. Chiunque può trovare il gruppo e leggere le discussioni, i sondaggi e i file. L'elenco dei membri resta visibile solo ai membri.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c8d2b41a601ed65e:
    english: Open groups can allow people to join immediately, require approval, or remain invitation only.
    translation: I gruppi aperti possono consentire l'iscrizione immediata, richiedere un'approvazione oppure accettare nuovi membri solo su invito.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f07a1c59f30e5fea:
    english: "### Follow an Open group"
    translation: "### Seguire un gruppo aperto"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d6f9ee2eb742720e:
    english: People can stay up to date with an Open group without joining. Following adds unread group activity to their catch-up email so they can review it in their own time. Followers do not become members, receive member voting rights, or receive immediate notifications just because they follow the group.
    translation: Puoi seguire le attività di un gruppo aperto senza iscriverti. Le attività non lette del gruppo vengono aggiunte alla tua email di riepilogo, così puoi consultarle quando vuoi. Seguire un gruppo non ti rende membro, non ti dà diritto di voto come membro e non attiva le notifiche immediate.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  17cb84d9141c9728:
    english: Turn on **Follow updates** on the group page to include its unread discussions, comments, polls, and other thread activity in your catch-up. Turn the setting off to stop including the group.
    translation: Attiva **Segui gli aggiornamenti** nella pagina del gruppo per includere nel tuo riepilogo le discussioni, i commenti, i sondaggi e le altre attività delle discussioni che non hai ancora letto. Disattiva l'impostazione per escludere il gruppo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b0c06651e8c0df2b:
    english: "![Follow updates on an Open group](group_follow_updates.png)"
    translation: "![Segui gli aggiornamenti in un gruppo aperto](group_follow_updates.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c5becc4d01b10f3:
    english: "## Closed"
    translation: "## Chiuso"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eaf6878c89438b53:
    english: Anyone can find a Closed group and read its name and description. Discussions, polls, files, and the member list are private to members and invited guests.
    translation: Chiunque può trovare un gruppo chiuso e leggerne il nome e la descrizione. Le discussioni, i sondaggi, i file e l'elenco dei membri sono visibili solo ai membri e agli ospiti invitati.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ab7851d3b88d4e27:
    english: Closed groups can let people request membership or remain invitation only. They cannot let people join immediately without approval.
    translation: I gruppi chiusi possono consentire di richiedere l'iscrizione oppure accettare nuovi membri solo su invito. Non possono consentire l'iscrizione immediata senza approvazione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e2f094fc6e490216:
    english: A Closed subgroup of a parent group can optionally allow members of the parent group to read its discussions without joining the subgroup.
    translation: Un sottogruppo chiuso può consentire ai membri del gruppo principale di leggere le sue discussioni senza iscriversi al sottogruppo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9c21e144af9492a6:
    english: "## Secret"
    translation: "## Segreto"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6a9871bdd7fde747:
    english: Secret groups and their content are visible only to people who have been invited or added. Membership is invitation only. Secret groups do not appear in the public group directory.
    translation: I gruppi segreti e i loro contenuti sono visibili solo alle persone invitate o aggiunte. L'iscrizione avviene solo su invito. I gruppi segreti non compaiono nell'elenco pubblico dei gruppi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  405ac2846a65b06c:
    english: "## How people join"
    translation: "## Come ci si iscrive"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c7aebb687bbffbf:
    english: 'Privacy determines which joining options are available:'
    translation: 'La privacy determina le opzioni disponibili per iscriversi:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a6a7608fe4510b67:
    english: |-
      | Group privacy | Available joining options |
      | --- | --- |
      | **Open** | Anyone can join, request approval, or invitation only |
      | **Closed** | Request approval or invitation only |
      | **Secret** | Invitation only |
    translation: |-
      | Privacy del gruppo | Opzioni disponibili per iscriversi |
      | --- | --- |
      | **Aperto** | Iscrizione libera, richiesta di approvazione o solo su invito |
      | **Chiuso** | Richiesta di approvazione o solo su invito |
      | **Segreto** | Solo su invito |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  473a620db15dff75:
    english: When approval is required, people select **Join group**, answer the group's joining prompt, and send a request to join. See [Inviting people](/en/user_manual/groups/inviting_people#request-to-join-group) for instructions on configuring the prompt, reviewing requests, and inviting people directly.
    translation: Quando è richiesta l'approvazione, le persone selezionano **Iscriviti al gruppo**, rispondono alla domanda per l'iscrizione e inviano una richiesta. Consulta [Invitare persone](/en/user_manual/groups/inviting_people#request-to-join-group) per sapere come configurare la domanda, esaminare le richieste e invitare direttamente le persone.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4c02de0d4580f7e6:
    english: "## Group directory"
    translation: "## Elenco dei gruppi"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2dc848ec1af0064e:
    english: Open and Closed parent groups can be listed in the public group directory so people can discover them. Directory listing does not change who can read group content or become a member. Subgroups and Secret groups cannot be listed.
    translation: I gruppi principali aperti e chiusi possono comparire nell'elenco pubblico dei gruppi, dove le persone possono trovarli. La presenza nell'elenco non cambia chi può leggere i contenuti del gruppo o diventarne membro. I sottogruppi e i gruppi segreti non possono comparire nell'elenco.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
