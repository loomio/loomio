---
navigation_title: הזמנת אנשים
blocks:
  47820acef0cf3fe9:
    english: "# Inviting people"
    translation: "# הזמנת אנשים"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6a2bc749ec2883c0:
    english: Go to your group page and click the **Members** tab to access member management.
    translation: כדי לנהל את חברי הקבוצה, יש לעבור לדף הקבוצה ולבחור בלשונית **חברים**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7fc9a792512e50bb:
    english: You can **Invite** particular people to your group with their email address or **Share** a link to your group via email, newsletter, chat or from your website.
    translation: ניתן להשתמש ב־**הזמן** כדי להזמין אנשים מסוימים לקבוצה באמצעות כתובת הדוא״ל שלהם, או ב־**שיתוף** כדי לשתף קישור לקבוצה בדוא״ל, בניוזלטר, בצ׳אט או באתר האינטרנט.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3fc7875402babd63:
    english: "## Send invitations via email"
    translation: "## שליחת הזמנות בדוא״ל"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4e91c3f036e94808:
    english: Click **Invite** on the **Members** tab to send an email containing a single-use invitation link. The recipient can create a Loomio user account and join your group.
    translation: בלשונית **חברים**, יש לבחור ב־**הזמן** כדי לשלוח הודעת דוא״ל עם קישור הזמנה לשימוש חד־פעמי. מי שמקבלים את ההזמנה יכולים ליצור חשבון ב־Loomio ולהצטרף לקבוצה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  37a98960a11df300:
    english: If the recipient already has a Loomio user account they can still accept the invitation to join your group with their existing account.
    translation: מי שכבר יש להם חשבון ב־Loomio יכולים לקבל את ההזמנה ולהצטרף לקבוצה באמצעות החשבון הקיים.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c40b8865bc90ab0b:
    english: "### Invite many at once"
    translation: "### הזמנת אנשים רבים בבת אחת"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f92bf789ad23e4c3:
    english: You can send invitations by email to up to 100 people at a time by entering (or copy/pasting) multiple email addresses into the "Who would you like to invite" box. Separate email addresses by comma or space.
    translation: ניתן לשלוח הזמנות בדוא״ל לעד 100 אנשים בכל פעם. יש להזין או להדביק כמה כתובות דוא״ל בתיבה "את מי ברצונך להזמין" ולהפריד ביניהן בפסיק או ברווח.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1e8ea8567d051081:
    english: When inviting people to a group within an organization, the parent group and related subgroups you belong to appear as audience suggestions. Select a group, then select its chip to expand the audience into individual people. You can remove anyone you do not want to invite before sending the invitations. People who already belong to the destination group are excluded.
    translation: בעת הזמנת אנשים לקבוצה בארגון, קבוצת האב ותת־קבוצות קשורות שחברים בהן מופיעות כהצעות לנמענים. יש לבחור קבוצה, ואז לבחור בתג שלה כדי להציג את האנשים בקבוצה בנפרד. לפני שליחת ההזמנות ניתן להסיר אנשים שאין צורך להזמין. אנשים שכבר חברים בקבוצת היעד אינם נכללים בהזמנה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  23c96c665ed9ad1c:
    english: |-
      >[!Tip]
      >Copy email addresses from a column in a Google or Excel spreadsheet, and paste into the invitation box.
    translation: |-
      >[!Tip]
      >ניתן להעתיק כתובות דוא״ל מעמודה בגיליון Google או Excel ולהדביק אותן בתיבת ההזמנה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  697177b4211a5479:
    english: When you click **Invite** an email will be sent to each of the email addresses you supplied, containing a unique invitation link that can only be used once. This email will be sent in your current language.
    translation: לאחר בחירה ב־**הזמן**, תישלח לכל אחת מכתובות הדוא״ל שהוזנו הודעה עם קישור הזמנה ייחודי לשימוש חד־פעמי. ההודעה תישלח בשפה שמוגדרת כעת.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bcce66d3fb6f6b8e:
    english: "### Invite people to Subgroups"
    translation: "### הזמנת אנשים לתת־קבוצות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e422dfc71ef2fe0:
    english: Following the same process as above, you can invite people to a 'parent' group, and one or more subgroups simultaneously when you invite them with the **Invite people** button. Tick the boxes next to the subgroups you want them to immediately be a part of when they join the group.
    translation: באותו אופן, ניתן להשתמש בכפתור **הזמינו אנשים** כדי להזמין אנשים לקבוצת אב ולתת־קבוצה אחת או יותר בו־זמנית. יש לסמן את התיבות לצד תת־הקבוצות שאליהן יצטרפו מיד עם הצטרפותם לקבוצה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  87f0b0c3281b6228:
    english: "## Share a link to your group"
    translation: "## שיתוף קישור לקבוצה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2f014bdf9b719ec0:
    english: You can share a link to your group with the **Share** button. This is useful if you want to send a link via email, newsletter, chat or post on your website.
    translation: ניתן לשתף קישור לקבוצה באמצעות הכפתור **שיתוף**. כך אפשר לשלוח את הקישור בדוא״ל, בניוזלטר או בצ׳אט, או לפרסם אותו באתר האינטרנט.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  18ff20426c02846e:
    english: Click on the "copy" icon to copy the link to your clipboard, then paste in your email, newsletter or chat channel.
    translation: יש לבחור בסמל "העתקה" כדי להעתיק את הקישור ללוח, ואז להדביק אותו בהודעת דוא״ל, בניוזלטר או בערוץ צ׳אט.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c6506b3c529f683c:
    english: If you want to stop people from joining via this link, click "Reset this link". The existing link will no longer work and a new link will be created.
    translation: כדי למנוע הצטרפות באמצעות הקישור, יש לבחור ב"איפוס הקישור הזה". הקישור הקיים יפסיק לפעול וייווצר קישור חדש.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6d57daddf1df6a2d:
    english: "## Request to join group"
    translation: "## בקשת הצטרפות לקבוצה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  70b9af34b3bc2a9e:
    english: People can request to join an Open or Closed group. Share the group URL, such as `https://www.loomio.com/group-name`. When people arrive at the group page, they can see the public group information and select **Join group** to answer the joining prompt and send their request.
    translation: ניתן לבקש להצטרף לקבוצה פתוחה או סגורה. יש לשתף את כתובת הקבוצה, למשל `https://www.loomio.com/group-name`. בדף הקבוצה ניתן לראות את המידע הציבורי עליה ולבחור ב־**הצטרפו לקבוצה** כדי לענות לשאלת ההצטרפות ולשלוח בקשה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a5534ae2aba161ba:
    english: The joining prompt gives people a chance to introduce themselves and explain why they want to join.
    translation: שאלת ההצטרפות מאפשרת למבקשי ההצטרפות להציג את עצמם ולהסביר מדוע ברצונם להצטרף.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bb13bbdbfd6da80b:
    english: Under [Group privacy](/en/user_manual/groups/settings/privacy#how-people-join), choose **Request approval** to require requests to be reviewed. You can also customize the joining prompt in the group settings.
    translation: תחת [פרטיות הקבוצה](/en/user_manual/groups/settings/privacy#how-people-join), יש לבחור ב־**בקשת אישור** כדי לחייב בדיקה של בקשות ההצטרפות. ניתן גם להתאים את שאלת ההצטרפות בהגדרות הקבוצה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5b0e7c47a0518a3e:
    english: "### Review membership requests"
    translation: "### בדיקת בקשות הצטרפות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d4a03352457d41cb:
    english: 'Group administrators and members with permission to add members review requests from the **Membership requests** section of the **Members** tab. A reviewer can:'
    translation: 'מנהלי הקבוצה וחברים שיש להם הרשאה להוסיף חברים בודקים בקשות באזור **בקשות הצטרפות** שבלשונית **חברים**. ניתן:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  84c6d641f9dba801:
    english: |-
      - **Approve** the request to add the applicant as a member and notify them.
      - **Ignore** the request to close it without notifying the applicant or allowing another request.
      - **Decline** the request with a message explaining the decision. Loomio sends the message to the applicant by email and notification, and they can submit a new request.
    translation: |-
      - לבחור ב־**אישור** כדי להוסיף את מבקשי ההצטרפות כחברים ולהודיע להם על כך.
      - לבחור ב־**התעלמ/י** כדי לסגור את הבקשה בלי להודיע למבקשי ההצטרפות ובלי לאפשר הגשת בקשה נוספת.
      - לבחור ב־**יְרִידָה** כדי לדחות את הבקשה ולצרף הודעה שמסבירה את ההחלטה. Loomio שולחת את ההודעה למבקשי ההצטרפות בדוא״ל ובהתראה, והם יכולים להגיש בקשה חדשה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b1de5132fa942ba8:
    english: Select the decline button to write a message or ignore the request.
    translation: כדי לכתוב הודעת דחייה, יש לבחור בכפתור הדחייה. ניתן גם להתעלם מהבקשה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a87e3fdd4ce43ee9:
    english: "## Managing invitations"
    translation: "## ניהול הזמנות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  84dc2f66c60f3237:
    english: To manage invitations, open the filter/ drop down from the Members tab of your Group page and select **Invitations**. You can manage individual invitations by clicking the three dot menu (**⋮**) to the right of the member.
    translation: כדי לנהל הזמנות, יש לפתוח את תפריט הסינון בלשונית חברים בדף הקבוצה ולבחור ב־**הזמנה**. לניהול הזמנה מסוימת יש לבחור בתפריט שלוש הנקודות (**⋮**) שמשמאל לשם החבר.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c8d12991b8edb22f:
    english: You can also make people administrators or set their title (e.g. "IT Support") within the group before they accept their invitation.
    translation: אפשר גם להעניק למוזמנים הרשאת ניהול או להגדיר להם תפקיד בקבוצה, למשל "תמיכה טכנית", לפני שיקבלו את ההזמנה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e8aec784f84451cc:
    english: "### Re-send invitations"
    translation: "### שליחה חוזרת של הזמנות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c201c2b360b1877:
    english: Follow up on people who don't make it into the group and give them a nudge. If someone has lost or forgotten about their invitation email, you can re-send it from the dropdown menu beside their name on the Members page.
    translation: אם אנשים שהוזמנו עדיין לא הצטרפו לקבוצה, אפשר לפנות אליהם שוב. אם הודעת ההזמנה אבדה או נשכחה, ניתן לשלוח אותה שוב מהתפריט שליד שמם בדף חברים.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8b4674400f9a3f09:
    english: Click on the three dots (**⋮**) next to the person you want to resend the invitation to, and then choose **Resend invitation**.
    translation: יש לבחור בשלוש הנקודות (**⋮**) לצד האדם שאליו רוצים לשלוח את ההזמנה שוב, ואז לבחור ב־**שלח הזמנה שוב**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  abc5a934440fb8e1:
    english: |-
      ### Cancelling invitations
      If you entered the wrong email address, or have changed your mind about inviting someone, you can cancel an invitation from the Members tab on your Group page. Select **Cancel Invitation** from the drop down menu to the right of the member invitation (**⋮**).
    translation: |-
      ### ביטול הזמנות
      אם הוזנה כתובת דוא״ל שגויה, או אם כבר אין רצון להזמין אדם מסוים, ניתן לבטל את ההזמנה בלשונית חברים בדף הקבוצה. יש לבחור ב־**ביטול הזמנה** בתפריט שמשמאל להזמנת החבר (**⋮**).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
