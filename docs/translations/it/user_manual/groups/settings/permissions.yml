  d661e5fc8cc1b460:
    english: "# Group permissions"
    translation: "# Permessi del gruppo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  712830f14602c6c7:
    english: The permissions tab controls which group operations are available to ordinary members and, for non-secret groups, to non-members. Open **Edit group settings** from the group page, then select **Permissions**.
    translation: La scheda dei permessi stabilisce quali operazioni possono svolgere i membri ordinari e, nei gruppi non segreti, le persone che non ne fanno parte. Dalla pagina del gruppo, apri **Modifica le impostazioni del gruppo**, poi seleziona **Permessi**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b71bf8cce1cb369c:
    english: "![Group permission settings](group_group_settings_permissions.png)"
    translation: "![Impostazioni dei permessi del gruppo](group_group_settings_permissions.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  88e5fcd302a53620:
    english: Administrators retain the ability to manage the group. Enabling a member permission extends that particular action to ordinary members; it does not make them administrators.
    translation: Gli amministratori mantengono la possibilità di gestire il gruppo. Attivare un permesso per i membri consente loro di svolgere quella specifica azione, ma non li rende amministratori.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5b2b9af0f68b7a57:
    english: 'Permissions include whether members can:'
    translation: 'I permessi stabiliscono se i membri possono:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8377b499d13690c0:
    english: |-
      - add members or invite guests;
      - send announcements;
      - create subgroups;
      - start and manage discussions;
      - create and manage tags;
      - edit or delete comments where the setting permits;
      - start proposals and polls; and
      - create discussion and poll templates.
    translation: |-
      - aggiungere membri o invitare ospiti;
      - inviare annunci;
      - creare sottogruppi;
      - avviare e gestire discussioni;
      - creare e gestire tag;
      - modificare o eliminare commenti, se l'impostazione lo consente;
      - avviare proposte e sondaggi; e
      - creare modelli per discussioni e sondaggi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  87166abe7eea1ab3:
    english: For groups that are not secret, administrators can separately allow non-members to start discussions. A non-member who starts a discussion becomes a guest of that discussion but does not gain access to other private discussions or become a group member.
    translation: Nei gruppi non segreti, gli amministratori possono consentire separatamente a chi non è membro di avviare discussioni. Chi avvia una discussione diventa ospite di quella discussione, ma non ottiene accesso alle altre discussioni private né diventa membro del gruppo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3d01d10a97636b1e:
    english: The **Admins can edit members' comments** setting gives administrators an exceptional moderation capability. Enable it only when the group has agreed that administrators should be able to alter member-authored content.
    translation: L'impostazione **Gli amministratori possono modificare i commenti dei membri** dà agli amministratori una facoltà di moderazione eccezionale. Attivala solo se il gruppo ha concordato che gli amministratori possano modificare i contenuti scritti dai membri.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b0af0135752a461f:
    english: Review permissions when the group's purpose, membership, or moderation responsibilities change. Give each role only the capabilities it needs.
    translation: Rivedi i permessi quando cambiano lo scopo del gruppo, i suoi membri o le responsabilità di moderazione. Assegna a ogni ruolo solo le facoltà di cui ha bisogno.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
