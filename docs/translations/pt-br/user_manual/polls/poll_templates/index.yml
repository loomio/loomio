---
navigation_title: Modelos de enquetes
blocks:
  6428da81fbbe11c6:
    english: "# Poll templates"
    translation: "# Modelos de enquetes"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  208bc68b458895f1:
    english: Poll templates are reusable starting points shown when someone selects **Start a vote** or **New poll**. A template combines a voting method with preset guidance, response options, and settings.
    translation: Os modelos de enquetes são pontos de partida reutilizáveis exibidos quando alguém seleciona **Iniciar uma votação** ou **Nova enquete**. Um modelo combina um método de votação com orientações, opções de resposta e configurações predefinidas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f290b92adeb2a791:
    english: Use this page to configure which templates are available to a group or to create one for your own process. To choose a template for a particular vote, see [Proposals](../proposals/) or [Polls](../proposal_types/). To facilitate a complete decision process, see [Making decisions](/en/guides/making_decisions/).
    translation: Use esta página para definir quais modelos estão disponíveis para um grupo ou criar um modelo para seu próprio processo. Para escolher um modelo para uma votação específica, consulte [Propostas](../proposals/) ou [Enquetes](../proposal_types/). Para facilitar um processo completo de decisão, consulte [Tomada de decisões](/en/guides/making_decisions/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  658d10486cbee7dc:
    english: "## Voting methods and templates"
    translation: "## Métodos de votação e modelos"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d903d1a58aebf643:
    english: A voting method controls how participants respond and how Loomio calculates the result. Examples include Proposal, Choose, Score, Allocate, Rank, Time poll, and STV.
    translation: O método de votação determina como os participantes respondem e como o Loomio calcula o resultado. Alguns exemplos são Proposta, Escolher, Pontuação, Alocar, Classificação, Enquete de tempo e STV.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  21efff1a5c91ad29:
    english: A poll template uses one of those methods and adds reusable defaults. For example, Sense check, Advice, Consent, and Consensus are different templates built on the Proposal voting method. Their instructions and response options differ even though Loomio handles their ballots in the same way.
    translation: Um modelo de enquete usa um desses métodos e acrescenta configurações padrão reutilizáveis. Por exemplo, Verificação de sentido, Conselho, Consentimento e Consenso são modelos diferentes baseados no método de votação Proposta. Suas instruções e opções de resposta variam, embora o Loomio processe os votos da mesma forma.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f622951ffc7e1064:
    english: "## Use a template"
    translation: "## Usar um modelo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  865e825cc7d00cf2:
    english: When starting a vote, select the **Proposal** or **Poll** tab and choose one of the templates available to the group.
    translation: Ao iniciar uma votação, selecione a aba **Proposta** ou **Enquete** e escolha um dos modelos disponíveis para o grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1598f1a55a6944e6:
    english: The template supplies an introduction, example content, options, and settings. Review and edit these for the particular decision before starting the vote. Editing the new vote does not change the reusable template.
    translation: O modelo fornece uma introdução, conteúdo de exemplo, opções e configurações. Revise e edite esses elementos para a decisão em questão antes de iniciar a votação. A edição da nova votação não altera o modelo reutilizável.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8212a94908338b22:
    english: "## Who can manage templates"
    translation: "## Quem pode gerenciar modelos"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  378caa9ba83ee0dc:
    english: Group administrators can create and manage every poll template in their group. They can enable **Members can create templates** under **Group settings** → **Permissions**. When enabled, members can create templates and manage templates they authored.
    translation: Os administradores de um grupo podem criar e gerenciar todos os modelos de enquetes do grupo. Eles podem ativar **Os membros podem criar modelos.** em **Configurações do grupo** → **Permissões**. Com essa opção ativada, os membros podem criar modelos e gerenciar os modelos que criaram.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0fafc6275b6c9153:
    english: "## Create a poll template"
    translation: "## Criar um modelo de enquete"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5fc696a1e924179c:
    english: Open the template list and select **New template**. Start with an example or a blank template, then choose the group that will use it.
    translation: Abra a lista de modelos e selecione **Novo modelo**. Comece com um exemplo ou um modelo em branco. Depois, escolha o grupo que vai usá-lo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  37b3658ec66eb8b7:
    english: The template form defines the guidance and defaults people receive when they start a vote.
    translation: O formulário do modelo define as orientações e configurações padrão que as pessoas recebem ao iniciar uma votação.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fa0dab51a009bf90:
    english: "### Template title, subtitle, and help"
    translation: "### Título, legenda e ajuda do modelo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  965cde5e13952ade:
    english: |-
      - **Template title** is the short name shown in the template list.
      - **Template subtitle** explains when to use it in one sentence.
      - **Template help** appears in the information panel when someone uses the template. Explain its purpose, any rules participants should know, and links to relevant policies or guides.
    translation: |-
      - **Título do modelo** é o nome curto exibido na lista de modelos.
      - **Modelo de legenda** explica em uma frase quando usar o modelo.
      - **Ajuda de modelo** aparece no painel de informações quando alguém usa o modelo. Explique a finalidade do modelo, as regras que os participantes precisam conhecer e inclua links para políticas ou guias relevantes.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f3e51b30163d5b85:
    english: Use plain, specific names that distinguish the template from others in the group.
    translation: Use nomes claros e específicos que diferenciem o modelo dos demais modelos do grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e6b8a09191bb8c3f:
    english: "### Voting method"
    translation: "### Método de votação"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ea4fef806c1cf060:
    english: Choose what participants need to express and how the result should be calculated.
    translation: Escolha o que os participantes precisam expressar e como o resultado deve ser calculado.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f8c87a496921c710:
    english: |-
      - **Proposal**: respond to a statement using defined positions;
      - **Choose**: select one or more options;
      - **Score**: evaluate every option on a scale;
      - **Allocate**: distribute a limited budget of points;
      - **Rank**: arrange options in preference order;
      - **Time poll**: indicate availability; and
      - **STV**: rank candidates in a proportional, multi-winner election.
    translation: |-
      - **Proposta**: responder a uma afirmação usando posições definidas;
      - **Escolher**: selecionar uma ou mais opções;
      - **Pontuação**: avaliar cada opção em uma escala;
      - **Alocar**: distribuir uma quantidade limitada de pontos;
      - **Classificação**: ordenar as opções por preferência;
      - **Enquete de tempo**: indicar disponibilidade; e
      - **STV**: classificar candidatos em uma eleição proporcional com vários vencedores.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9d589e44fa94c5e2:
    english: Changing the voting method changes the fields and result calculation available to the template.
    translation: Alterar o método de votação muda os campos e o cálculo do resultado disponíveis para o modelo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  230689f781e4cbc7:
    english: "### Example title, details, and tags"
    translation: "### Exemplo de título, detalhes e tags"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6fa4b3625c6ec7ce:
    english: Provide example content that helps an author frame the vote. These values are copied into a new proposal or poll and can be edited before it starts.
    translation: Forneça um conteúdo de exemplo que ajude a pessoa a formular a votação. Esses valores são copiados para uma nova proposta ou enquete e podem ser editados antes de seu início.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a093368b30ac3c9b:
    english: Use prompts rather than fixed content when each use needs a different title or details. Add default category tags only when they apply every time the template is used.
    translation: Use sugestões em vez de conteúdo fixo quando cada uso exigir um título ou detalhes diferentes. Adicione tags de categoria padrão apenas quando elas se aplicarem a todos os usos do modelo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  24c3fa4b7ef676fd:
    english: "### Response options"
    translation: "### Opções de resposta"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e7421caab9c47f5b:
    english: 'Methods such as Proposal and Choose let you configure response options. Select the pencil icon beside an option to edit:'
    translation: 'Métodos como Proposta e Escolher permitem configurar as opções de resposta. Selecione o ícone de lápis ao lado de uma opção para editar:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  73a065ad5b861579:
    english: |-
      - **Option name**: the short response label;
      - **Icon**: its visual marker;
      - **Meaning**: what selecting the option communicates; and
      - **Reason prompt**: the question shown when someone explains their response.
    translation: |-
      - **Nome da opção**: o rótulo curto da resposta;
      - **Ícone**: o marcador visual da opção;
      - **Significado**: o que a escolha da opção comunica; e
      - **Motivo do prompt**: a pergunta exibida quando alguém explica sua resposta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  38bc8cfc36aaea2e:
    english: Define options so participants can tell the difference between them without guessing. The meanings should match the decision rules your group actually uses.
    translation: Defina as opções de modo que os participantes consigam diferenciá-las com clareza. Os significados devem corresponder às regras de decisão que seu grupo usa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cc4adba73670a75b:
    english: "### Duration and settings"
    translation: "### Duração e configurações"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6c63a57ab4cec442:
    english: Set a default duration that is suitable for most uses of the template. The author can change the closing time for an individual vote.
    translation: Defina uma duração padrão adequada para a maioria dos usos do modelo. A pessoa que cria a votação pode alterar o horário de encerramento de uma votação específica.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  df14be8dbf80fa3c:
    english: Other defaults can control result visibility, anonymous voting, vote-reason requirements, reminders, quorum, and method-specific behaviour. See [Proposal and poll settings](../settings/) for their effects.
    translation: Outras configurações padrão podem controlar a visibilidade dos resultados, o voto anônimo, a exigência de justificativa para o voto, os lembretes, o quórum e o comportamento específico de cada método. Consulte [Configurações de propostas e enquetes](../settings/) para entender seus efeitos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  774ed7b91d33ab10:
    english: "### Save and test the template"
    translation: "### Salvar e testar o modelo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1b26a723ab8a9811:
    english: After saving, start a draft vote from the template. Check that its introduction, prompts, options, and defaults make sense to someone who did not create it. Starting a draft is also a useful way to confirm that the chosen voting method produces the result the group expects.
    translation: Depois de salvar, crie um rascunho de votação a partir do modelo. Verifique se a introdução, as perguntas, as opções e as configurações padrão fazem sentido para quem não criou o modelo. O rascunho também ajuda a confirmar se o método de votação escolhido produz o resultado esperado pelo grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1f0dab3f50320e75:
    english: "## Manage the template list"
    translation: "## Gerenciar a lista de modelos"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e9748843a900273f:
    english: 'Use the action menu beside a template to:'
    translation: 'Use o menu de ações ao lado de um modelo para:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  646235094d051c83:
    english: |-
      - **Edit** its reusable content and defaults;
      - **Move** it to a different position in the list;
      - **Hide** it from people starting votes; or
      - **Delete** a custom template that is no longer needed.
    translation: |-
      - **Editar** o conteúdo reutilizável e as configurações padrão;
      - **Mover** o modelo para outra posição na lista;
      - **Esconder** o modelo das pessoas que iniciam votações; ou
      - **Deletar** um modelo personalizado que não é mais necessário.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3f6dc06b1fd2bce8:
    english: Select **Show hidden templates** to review or restore hidden templates. Default templates can be hidden or adapted for the group, but cannot be deleted.
    translation: Selecione **Mostrar modelos ocultos** para revisar ou restaurar modelos ocultos. Os modelos padrão podem ser ocultados ou adaptados para o grupo, mas não podem ser excluídos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  be3ee2d2721d3e2a:
    english: Changing a template does not alter proposals or polls that have already been started from it.
    translation: Alterar um modelo não modifica propostas ou enquetes já iniciadas a partir dele.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
