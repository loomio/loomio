---
navigation_title: Threads gebruiken
blocks:
  d6fe7310d19b1141:
    english: "# Using threads"
    translation: "# Threads gebruiken"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  031f9244f107aba8:
    english: A discussion keeps its context, comments, decisions, and outcomes together in one thread. This page explains how to participate in a thread and use its navigation and actions.
    translation: In een thread staan de context, reacties, besluiten en conclusies van een discussie bij elkaar. Op deze pagina lees je hoe je aan een thread deelneemt en de navigatie en acties gebruikt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  479a1564b496bfed:
    english: "## Thread anatomy"
    translation: "## Onderdelen van een thread"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb745de96e6a612d:
    english: 'A typical thread looks like this:'
    translation: 'Een thread ziet er meestal zo uit:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e69f7f0b13fd9f9:
    english: 'From the top of the page, a thread contains:'
    translation: 'Van boven naar beneden bevat een thread:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5b47d6434aa50e94:
    english: "**Group name** - At the top left of the discussion page is the name of the group or subgroup that the discussion belongs to.  Click on this name to go back to the group page."
    translation: "**Groepsnaam** - Linksboven op de discussiepagina staat de naam van de groep of subgroep waar de discussie bij hoort. Klik op de naam om terug te gaan naar de groepspagina."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0dab4c46c2bee003:
    english: "**Discussion access** - The access icon at the top right opens the discussion's access settings. A group discussion is available to group members and anyone specifically invited to it, subject to the group's privacy settings."
    translation: "**Toegang tot de discussie** - Het toegangspictogram rechtsboven opent de toegangsinstellingen van de discussie. Groepsleden en mensen die specifiek zijn uitgenodigd, hebben toegang tot een groepsdiscussie. Daarbij gelden de privacyinstellingen van de groep."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e20178954e6d3ce0:
    english: "**Discussion title** - The name of the discussion."
    translation: "**Discussietitel** - De naam van de discussie."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  47687209ed924849:
    english: "**Category tags** - The discussion may have one or more category tags. Using simple tags helps people more easily find discussions of a similar type."
    translation: "**Categorie labels** - Een discussie kan een of meer categorie labels hebben. Met eenvoudige labels kunnen mensen vergelijkbare discussies makkelijker vinden."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b817649f985f51de:
    english: "**Discussion author** - The name and avatar of the person who started the discussion, shown beneath the title."
    translation: "**Auteur van de discussie** - Onder de titel staan de naam en avatar van degene die de discussie is gestart."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c44d5a833b4ec9ff:
    english: "**Date** - Hover over the date to see the full date and time of discussion start."
    translation: "**Datum** - Houd de aanwijzer boven de datum om de volledige datum en tijd te zien waarop de discussie is gestart."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b8062113f1078acb:
    english: "**Seen by** - In the right sidebar, shows who has read the discussion and when."
    translation: "**Gezien door** - Toont in de rechterzijbalk wie de discussie heeft gelezen en wanneer."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  133d0c2e469e9683:
    english: "**Notified** - In the right sidebar, shows who has been notified about the discussion and whether each notification has been read or its email opened."
    translation: "**Gemeld** - Toont in de rechterzijbalk wie een melding over de discussie heeft gekregen en of de melding is gelezen of de e-mail is geopend."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9f788adb4eab80cc:
    english: "**Discussion context** - Content to frame the discussion."
    translation: "**Discussiecontext** - Inhoud die de discussie kadert."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e8c5ae76dfb5b89b:
    english: "**Discussion interaction and administration tools** - The discussion context has controls to react to and edit it. The right sidebar contains notification, membership and administration actions."
    translation: "**Hulpmiddelen voor interactie en beheer** - Bij de discussiecontext kun je reageren en de context bewerken. In de rechterzijbalk vind je acties voor meldingen, leden en beheer."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8f6eac4359c2b9f6:
    english: "**Comments** - Comments are displayed under the discussion context. The author's name, avatar and posting time show who wrote each comment and when. Interaction and administration tools are available on each comment."
    translation: "**Reacties** - Reacties staan onder de discussiecontext. De naam, avatar en plaatsingstijd laten zien wie elke reactie heeft geschreven en wanneer. Bij elke reactie zijn hulpmiddelen voor interactie en beheer beschikbaar."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f978af6c9af4afe5:
    english: |-
      **Navigation, notifications and actions** - The right sidebar contains
      shortcuts to activity and milestones, notification and membership information,
      and the thread actions available to you.
    translation: |-
      **Navigatie, meldingen en acties** - De rechterzijbalk bevat
      snelkoppelingen naar activiteit en mijlpalen, informatie over meldingen en leden,
      en de acties die je voor de thread kunt gebruiken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f8c4084e9e8a2b27:
    english: "## Discussion context"
    translation: "## Discussiecontext"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5940bad6cb1cb49f:
    english: The discussion **context** is always found at the top of the discussion. Use the context to frame the discussion or decision.
    translation: De **context** staat altijd bovenaan de discussie. Gebruik die om aan te geven waar de discussie of het besluit over gaat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  415dd2d0f1eacc9f:
    english: Think of your group as you write content in the discussion context.  Your aim is to get a discussion going, so consider how you can motivate people to participate.  In general, keep the discussion context simple and clear.
    translation: Houd je groep voor ogen wanneer je de discussiecontext schrijft. Je wilt een gesprek op gang brengen, dus bedenk wat mensen helpt om mee te doen. Houd de context eenvoudig en duidelijk.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a1fcece28d8fb61d:
    english: Write the discussion context when starting or editing a discussion. **Edit** a discussion with the pencil icon.
    translation: Schrijf de discussiecontext wanneer je een discussie start of bewerkt. Gebruik het potloodpictogram om een discussie te **Bewerken**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2f47adddef6b31d9:
    english: As the discussion progresses, update discussion context.  Think of the context like a whiteboard in your meeting room, where you can write the agenda, the outcomes intended and how you plan to get there.
    translation: Werk de discussiecontext bij terwijl het gesprek vordert. Zie de context als een whiteboard in je vergaderruimte. Daarop kun je de agenda, de beoogde conclusies en de aanpak zetten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c82ec20629208982:
    english: At the bottom of the context panel is a formatting bar, where you can format text, attach files, images and embed a video.
    translation: Onderaan het contextvenster staat een opmaakbalk. Daarmee kun je tekst opmaken, bestanden en afbeeldingen toevoegen en een video insluiten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e606d83ae0fb2178:
    english: "### Notify people about context changes"
    translation: "### Mensen melden dat de context is gewijzigd"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d188326a58b28d96:
    english: When you edit the discussion context, use **What's changed?** to summarize the update and choose who should be notified.
    translation: Gebruik **Wat is er veranderd?** wanneer je de discussiecontext bewerkt. Vat de wijziging samen en kies wie een melding krijgt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  842091a987742d6d:
    english: "![Editing a discussion context with a change summary and notification recipients](../notifying_people/thread_editcontext.png)"
    translation: "![Een discussiecontext bewerken met een samenvatting van de wijziging en ontvangers van meldingen](../notifying_people/thread_editcontext.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b885359dd7e83428:
    english: The summary appears as an item in the thread so participants can see what changed.
    translation: De samenvatting verschijnt als een item in de thread, zodat deelnemers kunnen zien wat er is veranderd.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c899c47e98f79a23:
    english: "![A timeline item describing a discussion context change](../notifying_people/thread_edit_comment.png)"
    translation: "![Een item op de tijdlijn dat een wijziging in de discussiecontext beschrijft](../notifying_people/thread_edit_comment.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  44ffd1d0a732b897:
    english: "## Navigation"
    translation: "## Navigatie"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e96aef7a28a85001:
    english: 'The **Jump to** section of the right sidebar helps you move through a thread:'
    translation: 'Met **Spring naar** in de rechterzijbalk kun je door een thread navigeren:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4790c088af5fc09f:
    english: |-
      - **Start** goes to the discussion context
      - **New to you** appears when the thread contains activity you have not read
      - **Latest** appears when newer activity is available beyond the items currently loaded
      - milestone links go directly to important comments, polls, and outcomes
      - **End** goes to the latest item in the thread
    translation: |-
      - **Start** brengt je naar de discussiecontext
      - **Nieuw voor jou** verschijnt wanneer de thread activiteit bevat die je nog niet hebt gelezen
      - **Laatste** verschijnt wanneer er nieuwere activiteit is dan de items die momenteel zijn geladen
      - koppelingen naar mijlpalen brengen je direct naar belangrijke reacties, peilingen en conclusies
      - **Einde** brengt je naar het laatste item in de thread
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  941ea9900465724a:
    english: Comments that include an H2 or H3 heading, polls, and proposals are automatically included as milestone links. Select any milestone to go directly to it.
    translation: Reacties met een H2- of H3-kop, peilingen en voorstellen verschijnen automatisch als koppelingen naar mijlpalen. Selecteer een mijlpaal om er direct naartoe te gaan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e94ea6f4b9dae8d4:
    english: When you add a comment, poll, vote, or outcome, Loomio marks your own new item as read. It will not appear as something new for you to review.
    translation: Wanneer je een reactie, peiling, stem of conclusie toevoegt, markeert Loomio je nieuwe item als gelezen. Het verschijnt voor jou niet als iets nieuws om te bekijken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  34251ada1ba3e50b:
    english: "## Notifications and members"
    translation: "## Meldingen en leden"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  36a20a0e10208c7c:
    english: The right sidebar controls your email notifications and shows who has been invited, who has seen the thread, and who has been notified.
    translation: In de rechterzijbalk stel je je e-mailmeldingen in. Je ziet er ook wie is uitgenodigd, wie de thread heeft gezien en wie een melding heeft gekregen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f2a437ac1169c882:
    english: "### Email notifications for this thread"
    translation: "### E-mailmeldingen voor deze thread"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9bd7269489ed048e:
    english: Select the current notification setting to choose whether Loomio emails you about all activity, only activity that specifically notifies you, or no activity. Receiving email for all activity can produce many messages in an active thread.
    translation: Selecteer de huidige meldingsinstelling. Kies of Loomio je e-mailt over alle activiteit, alleen over activiteit waarvoor je specifiek een melding krijgt, of helemaal niet. Bij een actieve thread kunnen e-mails over alle activiteit veel berichten opleveren.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0d64de2345c8eba9:
    english: "![Email when notified selected in the discussion sidebar](../notifying_people/thread_interact.png)"
    translation: "![E-mail bij een melding geselecteerd in de zijbalk van de discussie](../notifying_people/thread_interact.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7bdbdaa98e89d1c3:
    english: "### Invite people"
    translation: "### Mensen uitnodigen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e81f85e723885264:
    english: Select **Invite people** to add people after the thread has started.
    translation: Selecteer **Mensen uitnodigen** om mensen toe te voegen nadat de thread is gestart.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e38a572cdffad5cb:
    english: "![Invite people in the thread sidebar](../notifying_people/thread_invite_icon.png)"
    translation: "![Mensen uitnodigen in de zijbalk van de thread](../notifying_people/thread_invite_icon.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7e4e643fb327aa06:
    english: Select a group or subgroup, enter the names of individual members, or enter an email address to invite a guest.
    translation: Selecteer een groep of subgroep, voer de namen van afzonderlijke leden in of voer een e-mailadres in om een gast uit te nodigen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  03c1d74b4a8bc31d:
    english: "![Invite people window with a field for names and email addresses](../notifying_people/thread_invite.png)"
    translation: "![Venster Mensen uitnodigen met een veld voor namen en e-mailadressen](../notifying_people/thread_invite.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  85fc948a4e849ba8:
    english: A guest can see and participate in this thread but cannot see other discussions in the group unless separately invited.
    translation: Een gast kan deze thread bekijken en eraan deelnemen, maar kan andere discussies in de groep alleen zien als die daarvoor apart is uitgenodigd.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9f1010b58cc5439f:
    english: "![Inviting a guest by email address](../notifying_people/invite_guest.png)"
    translation: "![Een gast uitnodigen via e-mail](../notifying_people/invite_guest.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e688189fa93b1e49:
    english: To remove someone, open the three-dot menu (**⋯**) beside their name and select **Remove from discussion**.
    translation: Open het menu met drie puntjes (**⋯**) naast de naam van de persoon en selecteer **Verwijderen uit discussie** om die te verwijderen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5602fbfa565eaf45:
    english: "### Seen by"
    translation: "### Gezien door"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a929b22d02292573:
    english: "**Seen by** shows who has opened the thread and when. It can help you identify people who may not have seen important information yet."
    translation: "**Gezien door** laat zien wie de thread heeft geopend en wanneer. Zo kun je zien wie belangrijke informatie mogelijk nog niet heeft gelezen."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d0335d202c5bbaa3:
    english: "![Seen by and Notified in the Thread members section](../notifying_people/thread_engagement.png)"
    translation: "![Gezien door en Gemeld in het gedeelte Discussieleden](../notifying_people/thread_engagement.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb77150441a43f5c:
    english: "![Seen by window listing thread members](../notifying_people/thread_seenby.png)"
    translation: "![Venster Gezien door met een lijst van discussieleden](../notifying_people/thread_seenby.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  185f80d66c2091d8:
    english: "### Notified"
    translation: "### Gemeld"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  885a21cbc1a44f7d:
    english: "**Notified** opens the discussion notification history. It includes invitations, mentions, and replies, showing who was notified and whether each notification has been read when that information is available."
    translation: "**Gemeld** opent de meldingsgeschiedenis van de discussie. Daarin staan uitnodigingen, vermeldingen en antwoorden. Je ziet wie een melding heeft gekregen en, als die informatie beschikbaar is, of de melding is gelezen."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e73fae9309f626e2:
    english: "![Discussion notification history](../notifying_people/thread_notified.png)"
    translation: "![Meldingsgeschiedenis van de discussie](../notifying_people/thread_notified.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  347def7574cf5f1d:
    english: "## Actions"
    translation: "## Acties"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '08ff4ccd500c2a69':
    english: The right sidebar contains actions for the whole thread. Some actions are also available from the three-dot menu (**⋯**) beside a thread on the group page.
    translation: De rechterzijbalk bevat acties voor de hele thread. Sommige acties staan ook in het menu met drie puntjes (**⋯**) naast een thread op de groepspagina.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e73701c7d36f95ef:
    english: The actions shown depend on your permissions. Group admins can manage threads, and group settings may allow members to perform some management actions. See [Group permissions](/en/user_manual/groups/settings/permissions).
    translation: Welke acties je ziet, hangt af van jouw rechten. Groepsbeheerders kunnen threads beheren. De groepsinstellingen kunnen leden ook toestaan bepaalde beheeracties uit te voeren. Zie [Groepsrechten](/en/user_manual/groups/settings/permissions).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4fce317a163b0a40:
    english: "### Print"
    translation: "### Afdrukken"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9317d4c7c5ef4764:
    english: Select **Print** to generate a page suitable for printing. Use your browser's print dialog to save it as a PDF.
    translation: Selecteer **Afdrukken** om een afdrukbare pagina te maken. Gebruik het afdrukvenster van je browser om die als PDF op te slaan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  443af0749df1db2a:
    english: "### Markdown"
    translation: "### Markdown"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eb0442148f7c042d:
    english: Select **Markdown** to save the complete thread as structured Markdown. Choose **Copy Markdown** to copy it to your clipboard, or **Download Markdown** to save it as a `.md` file. You can use it for meeting minutes, a document, an archive of decisions, an AI assistant, or another tool that supports Markdown.
    translation: Selecteer **Markdown** om de volledige thread als gestructureerde Markdown op te slaan. Kies **Markdown kopiëren** om de tekst naar je klembord te kopiëren, of **Markdown downloaden** om die als `.md`-bestand op te slaan. Je kunt de tekst gebruiken voor notulen, een document, een archief van besluiten, een AI-assistent of een ander hulpmiddel dat Markdown ondersteunt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  80e3f57638b53cb4:
    english: The document begins with YAML front matter containing the thread key, group, creation date, last activity date, and tags. It then includes the discussion context and every comment, poll, vote, and outcome in the same order and nesting as the threaded view.
    translation: Het document begint met YAML-frontmatter met de threadcode, de groep, de aanmaakdatum, de datum van de laatste activiteit en de labels. Daarna volgen de context van de discussie en alle reacties, peilingen, stemmen en conclusies, in dezelfde volgorde en structuur als in de weergave met threads.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f99823b7b44e2cdd:
    english: Each poll is a section. Comments, votes, and outcomes are quoted, and replies are quoted beneath the item they answer. This shows where each person's text begins and ends. Each quote starts with one line showing the person, when they posted, the item's number in the thread, and any reactions. Votes and outcomes also say what they are. The thread key and item number identify each item in Loomio.
    translation: Elke peiling vormt een sectie. Reacties, stemmen en conclusies staan als citaten in het document. Antwoorden staan als citaten onder het item waarop ze reageren. Zo is duidelijk waar ieders tekst begint en eindigt. Elk citaat begint met een regel met de naam van de persoon, het tijdstip van plaatsing, het nummer van het item in de thread en eventuele reacties. Bij stemmen en conclusies staat ook vermeld wat voor item het is. Met de threadcode en het itemnummer kun je elk item in Loomio terugvinden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e5bdfbb4a0d7646f:
    english: Loomio applies the same visibility rules as the thread. Results and vote reasons you cannot see are not included, and voters are not identified in anonymous polls. If an open poll hides results until you vote, vote before exporting the thread. **Markdown** and **Print** are unavailable until you do.
    translation: Loomio past dezelfde zichtbaarheidsregels toe als in de thread. Resultaten en stemredenen die je niet mag zien, worden weggelaten. Bij anonieme peilingen worden stemmers niet bij naam genoemd. Als de resultaten van een open peiling verborgen blijven totdat je stemt, stem dan voordat je de thread exporteert. **Markdown** en **Afdrukken** zijn tot die tijd niet beschikbaar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7989d3386a42f180:
    english: 'For example, a discussion containing a comment, reactions, a proposal, two votes, a reply, and an outcome produces this Markdown:'
    translation: 'Een discussie met een reactie, reacties daarop, een voorstel, twee stemmen, een antwoord en een conclusie levert bijvoorbeeld deze Markdown op:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  275f4d9025c017c4:
    english: The headings and labels use your selected language. Content written by participants remains in its original language.
    translation: De koppen en labels staan in de taal die je hebt gekozen. Tekst van deelnemers blijft in de oorspronkelijke taal staan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dab18fdf3c56269d:
    english: "### Thread settings and display"
    translation: "### Draadinstellingen en weergave"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7bc55279f97c6d1b:
    english: Group admins can select **Thread settings** to change how replies are arranged and configure other discussion options.
    translation: Groepsbeheerders kunnen **Draadinstellingen** selecteren om de indeling van antwoorden te wijzigen en andere discussieopties in te stellen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  32b2640ba23524aa:
    english: Choose **Timeline** to list items in the order they were posted, or **Threaded** to group replies beneath the item they respond to. Thread settings also control whether multiple polls may run at once and can set a maximum comment length. These settings apply to everyone in the discussion.
    translation: Kies **Tijdlijn** om items in de volgorde van plaatsing te tonen, of **Met threads** om antwoorden onder het item te plaatsen waarop ze reageren. In de draadinstellingen kun je ook instellen of meerdere peilingen tegelijk mogen lopen en een maximale reactielengte opgeven. Deze instellingen gelden voor iedereen in de discussie.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a520339278bcc2a:
    english: "### Pin or unpin a thread"
    translation: "### Een thread vastprikken of losmaken"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0433e7a61db60003:
    english: Pinned threads appear above other threads on the group page. Welcome discussions, news items, and announcements are typical uses for pinned threads.
    translation: Vastgeprikte threads staan boven andere threads op de groepspagina. Je kunt bijvoorbeeld een welkomstdiscussie, nieuwsbericht of aankondiging vastprikken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b2712588a5e0aab3:
    english: Open the three-dot menu (**⋯**) beside the thread on the group page and select **Pin thread**. Pinned threads are ordered by the time they were pinned. To change their order, unpin and pin them again.
    translation: Open het menu met drie puntjes (**⋯**) naast de thread op de groepspagina en selecteer **Bord vastprikken**. Vastgeprikte threads staan in de volgorde waarin ze zijn vastgeprikt. Wil je die volgorde wijzigen, maak ze dan los en prik ze opnieuw vast.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a0443f076d1b8ae5:
    english: Select **Unpin thread** to return a thread to the activity-based order.
    translation: Selecteer **Bord losmaken** om een thread weer op basis van activiteit te sorteren.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b90a469963b02ffc:
    english: "### Move a thread"
    translation: "### Een thread verplaatsen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8b2071f4625705e5:
    english: Select **Move thread** to move a thread to another group, subgroup, or to a direct thread. It will be visible to members of the destination group and anyone specifically invited to it.
    translation: Selecteer **Verplaats discussie** om een thread naar een andere groep, een subgroep of een directe thread te verplaatsen. Leden van de bestemmingsgroep en mensen die specifiek voor de thread zijn uitgenodigd, kunnen de thread dan zien.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f09d5f2afce03ee8:
    english: |-
      >[!Tip]
      >Start a draft as a direct discussion or in a private subgroup, then move it to the group when it is ready.
    translation: |-
      >[!Tip]
      >Begin een concept als directe discussie of in een besloten subgroep. Verplaats het naar de groep zodra het klaar is.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c82562b641053308:
    english: To move selected activity rather than the whole thread, see [Moving items between threads](/en/user_manual/discussions/moving_items/).
    translation: Zie [Items tussen threads verplaatsen](/en/user_manual/discussions/moving_items/) als je alleen bepaalde activiteiten wilt verplaatsen en niet de hele thread.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  be22d2980075fdaa:
    english: "### Lock or unlock a thread"
    translation: "### Een thread vergrendelen of ontgrendelen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e7c24a610fd2bf8b:
    english: Lock a thread to prevent comments or further changes. A thread can only be locked after its active polls have closed.
    translation: Vergrendel een thread om reacties en verdere wijzigingen te voorkomen. Je kunt een thread pas vergrendelen nadat alle actieve peilingen zijn gesloten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  edb983bb6366aa6c:
    english: Select **Lock thread** under **Actions**. Locked threads are removed from the list of open discussions and marked with a **Locked** tag.
    translation: Selecteer **Discussie vergrendelen** onder **Acties**. Vergrendelde threads verdwijnen uit de lijst met open discussies en krijgen het label **Vergrendeld**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ba2794349524cc33:
    english: To find a locked thread, open the discussion filter on the group page and select **Locked**. Open the thread and select **Unlock thread** to allow comments and changes again.
    translation: Open het discussiefilter op de groepspagina en selecteer **Vergrendeld** om een vergrendelde thread te vinden. Open de thread en selecteer **Discussie ontgrendelen** om reacties en wijzigingen weer toe te staan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3a75fb1ad0ffab87:
    english: "### Delete a thread"
    translation: "### Een thread verwijderen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0103a5729bd6a095:
    english: Deleting a thread removes it permanently and cannot be undone. Lock the thread instead if you may need it again.
    translation: Als je een thread verwijdert, is die definitief weg. Je kunt dit niet ongedaan maken. Vergrendel de thread als je die later misschien nog nodig hebt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  daf08ca8895b0fe2:
    english: Select **Delete thread** and confirm the deletion.
    translation: Selecteer **Bord verwijderen** en bevestig dat je de thread wilt verwijderen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
