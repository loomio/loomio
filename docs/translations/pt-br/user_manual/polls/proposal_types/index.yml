    english: "[STV Elections](/en/user_manual/polls/stv/) let participants rank candidates in a proportional, multi-winner election. Use STV to elect a committee, board, or group of delegates."
    translation: As [Eleições STV](/en/user_manual/polls/stv/) permitem que os participantes classifiquem candidatos em uma eleição proporcional com várias vagas. Use STV para eleger um comitê, conselho ou grupo de representantes.
