  e0bdfaac5741d310:
    english: Merge two Loomio accounts when each account uses a different email address and you want to continue with one account.
    translation: Mescle duas contas do Loomio quando elas usam endereços de e-mail diferentes e você quer continuar com uma só conta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '08d4fcba2e0a2b3b':
    english: 'Before you begin, decide which account you want to keep:'
    translation: 'Antes de começar, decida qual conta você quer manter:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6f7efc1ebdc680c7:
    english: |-
      - The **account to keep** is the account whose email address and profile you will use after the merge
      - The **account to retire** is the account you sign in to first. Its email address will no longer work for signing in after the merge
    translation: |-
      - A **conta que você quer manter** é aquela cujo endereço de e-mail e perfil você usará após a mesclagem
      - A **conta que você quer desativar** é aquela em que você entra primeiro. Após a mesclagem, não será mais possível entrar com o endereço de e-mail dela
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  060fb4b1c12c153a:
    english: You need access to both accounts and to the email address of the account you want to keep.
    translation: Você precisa ter acesso às duas contas e ao endereço de e-mail da conta que quer manter.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9c9a7e082a3b67ae:
    english: |-
      > [!WARNING]
      > Merging accounts is irreversible. Check the source and target email addresses carefully before the final confirmation.
    translation: |-
      > [!WARNING]
      > A mesclagem de contas é irreversível. Confira com atenção os endereços de e-mail das duas contas antes da confirmação final.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4d6defccb0f2a2ec:
    english: "## Start the merge"
    translation: "## Inicie a mesclagem"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0c49f5d2284571d3:
    english: |-
      1. Sign in to the **account you want to retire**.
      2. Open the sidebar, select your name, and select **Edit profile**.
      3. Select **Merge accounts**.
    translation: |-
      1. Entre na **conta que você quer desativar**.
      2. Abra a barra lateral, selecione seu nome e depois **Editar perfil**.
      3. Selecione **Mesclar contas**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a05689d18f3c3337:
    english: "![The profile actions with Merge accounts highlighted](merge_accounts_profile.png)"
    translation: "![As ações do perfil, com Mesclar contas em destaque](merge_accounts_profile.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  29656e0572127b88:
    english: 4. Enter the destination account's email address—the address belonging to the **account you want to keep**—and select **Send verification email**. Loomio always shows the same confirmation and signs you out. If an account uses that address, Loomio sends it the verification email.
    translation: 4. Digite o endereço de e-mail da conta de destino, ou seja, da **conta que você quer manter**, e selecione **Enviar e-mail de verificação**. O Loomio sempre mostra a mesma confirmação e desconecta você. Se houver uma conta com esse endereço, o Loomio enviará o e-mail de verificação para ele.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d045b6c7e8a5b853:
    english: "## Verify the account you want to keep"
    translation: "## Verifique a conta que você quer manter"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  57255cdb29b384d7:
    english: 5. Open the verification email sent to the address of the account you want to keep and select **Verify email and proceed**.
    translation: 5. Abra o e-mail de verificação enviado ao endereço da conta que você quer manter e selecione **Verificar o email e seguir**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5e496b2d8f551efa:
    english: "![The merge verification email with the Verify email and proceed button highlighted](merge_accounts_email.png)"
    translation: "![O e-mail de verificação da mesclagem, com o botão Verificar o email e seguir em destaque](merge_accounts_email.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ad19dc0399f9d446:
    english: |-
      6. Sign in as the account you want to keep if Loomio asks you to sign in.
      7. On the **Confirm merge** page, check both email addresses again. Select **Merge accounts** to complete the merge.
    translation: |-
      6. Se o Loomio solicitar, entre na conta que você quer manter.
      7. Na página **Confirmar a mescla**, confira novamente os dois endereços de e-mail. Selecione **Mesclar contas** para concluir a mesclagem.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a575e2cd16aa66b4:
    english: "![The final confirmation page with the Merge accounts button highlighted](merge_accounts_confirm.png)"
    translation: "![A página de confirmação final, com o botão Mesclar contas em destaque](merge_accounts_confirm.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cf8eba685cfdbf04:
    english: "## What happens after the merge"
    translation: "## O que acontece após a mesclagem"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6ae4c6c893430735:
    english: The account you keep remains your Loomio identity and sign-in account. Group memberships and activity from the retired account, including discussions, comments, polls, and votes, are reassigned to the account you keep. Where both accounts already belong to the same group, the existing membership for the account you keep remains.
    translation: A conta que você mantém continua sendo sua identidade no Loomio e a conta usada para entrar. A participação em grupos e as atividades da conta desativada, incluindo discussões, comentários, enquetes e votos, são transferidas para a conta que você mantém. Se as duas contas já participavam do mesmo grupo, a participação da conta que você mantém permanece.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  eb05b57367c0815c:
    english: The retired account is deleted and its email address can no longer be used to sign in. Loomio sends a confirmation email to the address of the account you kept when the merge is complete.
    translation: A conta desativada é excluída e seu endereço de e-mail não pode mais ser usado para entrar. Quando a mesclagem é concluída, o Loomio envia um e-mail de confirmação ao endereço da conta que você manteve.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
