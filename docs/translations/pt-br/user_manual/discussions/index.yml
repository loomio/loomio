  f087c06a5f4ab2e6:
    english: "# Intro to Discussions"
    translation: "# Introdução às discussões"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f515c87a8d1d20c7:
    english: Loomio discussions are where you can share information, discuss topics, and make decisions with your group.  People participate by posting comments and replies.
    translation: Nas discussões do Loomio, você pode compartilhar informações, debater assuntos e tomar decisões com seu grupo. As pessoas participam publicando comentários e respostas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eede89b6ce4f357d:
    english: |-
      - All info about a topic is in one easily accessible place.
      - People can reply via email and their comments appear in the discussion.
      - You can see who has read the discussion and who needs a nudge.
      - There is a record of discussion you can easily find again.
    translation: |-
      - Todas as informações sobre um assunto ficam em um só lugar, fácil de acessar.
      - As pessoas podem responder por e-mail, e os comentários aparecem na discussão.
      - Você pode ver quem leu a discussão e quem precisa de um lembrete.
      - O registro da discussão fica disponível para você consultar depois.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9cb2eb404b59208b:
    english: Discussions have a wide range of uses - from a general discussion forum to running specific work-flow and decision-making processes.
    translation: As discussões servem para muitos fins, desde um fórum geral até processos de trabalho e tomada de decisão.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  87a95605052570ca:
    english: For example, you may frame a discussion on a particular topic, invite people to contribute their thoughts and share information, and facilitate progress towards an agreed outcome.
    translation: Por exemplo, você pode iniciar uma discussão sobre um assunto, convidar as pessoas a compartilhar ideias e informações e ajudar o grupo a chegar a uma conclusão em comum.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ce6e6734c595d968:
    english: Or you may invite people to participate in a particular decision, using a consent or advice decision-making process.
    translation: Você também pode convidar as pessoas a participar de uma decisão por meio de um processo baseado em consentimento ou aconselhamento.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7fa58cb3ba95be0b:
    english: Discussions can also contain polls and proposals to help progress a discussion to an outcome. As people comment in the discussion and vote in polls, a discussion timeline builds so you can easily find key milestones.
    translation: As discussões também podem incluir enquetes e propostas para ajudar o grupo a chegar a uma conclusão. À medida que as pessoas comentam e votam, forma-se uma linha do tempo da discussão, na qual você pode encontrar os principais marcos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
