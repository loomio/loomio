  55ccc01c9b274a87:
    english: |-
      ## Key points
      - Aim for a ‘good enough’ decision.
      - Involve many voices to develop a workable proposal.
      - Ask if anyone has a valid objection.
      - Amend the proposal to resolve objections.
    translation: |-
      ## Pääkohdat
      - Pyri riittävän hyvään päätökseen.
      - Ota monta näkökulmaa mukaan toimivan ehdotuksen laatimiseen.
      - Kysy, onko kenelläkään perusteltua vastalausetta.
      - Muokkaa ehdotusta vastalauseiden ratkaisemiseksi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7c2ef9fc3419f4b7:
    english: |-
      **Typical roles:**
      - Proposer: The person who raises a topic that requires a decision.
      - Facilitator: Someone who can help the proposer do their job efficiently.
    translation: |-
      **Tavalliset roolit:**
      - Ehdotuksen tekijä: Henkilö, joka nostaa esiin päätöstä vaativan aiheen.
      - Fasilitaattori: Henkilö, joka auttaa ehdotuksen tekijää viemään työn sujuvasti eteenpäin.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c56d1ea7a5582723:
    english: |-
      ## Consent process steps
      You notice a problem or opportunity and take the initiative.
      1. Present a proposal - start a Loomio **discussion**.
      2. Facilitate a round of questions, reactions and any comments to improve the proposal - run a **Sense check proposal**.
      3. Amend the proposal with suggestions and comments.
      4. Ask if anyone has a meaningful objection to the amended proposal - run a **Consent proposal**.
      5. Integrate valid objections to create an amended version of the proposal that everyone consents is ‘safe to try’ - state the decision **outcome**.
    translation: |-
      ## Suostumusprosessin vaiheet
      Huomaat ongelman tai mahdollisuuden ja teet aloitteen.
      1. Esittele ehdotus – aloita Loomiossa **keskustelu**.
      2. Järjestä kysymyksille, reaktioille ja kommenteille tilaa ehdotuksen parantamiseksi – aloita **Aistitarkistus**-ehdotus.
      3. Muokkaa ehdotusta saamiesi ehdotusten ja kommenttien perusteella.
      4. Kysy, onko kenelläkään merkittävää vastalausetta muokattuun ehdotukseen – aloita **Suostumus**-ehdotus.
      5. Ota perustellut vastalauseet huomioon ja muokkaa ehdotusta, kunnes kaikki pitävät sen kokeilemista turvallisena – kirjaa päätöksen **johtopäätös**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  735e10dde58793f0:
    english: |-
      >[!Tip]
      >In more complex decisions you may also include a clarifying **Questions round** at step 2, to help people understand the proposal before inviting them to react and comment on the proposal.
    translation: |-
      >[!Tip]
      >Monimutkaisemmissa päätöksissä voit lisätä vaiheeseen 2 selventävän **Kysymyskierroksen**. Se auttaa ihmisiä ymmärtämään ehdotuksen ennen kuin pyydät heiltä reaktioita ja kommentteja.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9cf871a054d8e628:
    english: |-
      ## Benefits
      - Faster, efficient, clear and more adaptable decisions.
      - Diverse perspectives and empowered engagement builds trust.
