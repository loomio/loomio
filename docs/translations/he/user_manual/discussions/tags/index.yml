  67bc6cfdb2afad04:
    english: |-
      Only parent-group admins can rename, recolor, merge, or delete tags. These
      changes apply throughout the organization, including its subgroups.
    translation: |-
      רק מנהלי קבוצת האם יכולים לשנות שמות של תגיות, לשנות את צבען, למזג אותן או למחוק אותן. השינויים
      חלים בכל הארגון, כולל בתת־הקבוצות שלו.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b4ca99a5204d8526:
    english: On the group page, open **Tags** and select **Edit tags**.
    translation: בדף הקבוצה, יש לפתוח את **תגיות** ולבחור **עריכת תגיות**.
