  eecfb12ed1d28d50:
    english: Good governance exists where an organization has systems and processes in place that are appropriate to its circumstances, and which enable the organization to pursue its purpose effectively and meet its obligations under the law.
    translation: Належнае кіраванне магчымае, калі ў арганізацыі ёсць сістэмы і працэсы, якія адпавядаюць яе абставінам і дапамагаюць эфектыўна дасягаць яе мэты і выконваць абавязкі паводле закону.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e54f67d22cf67a93:
    english: "*“It is participatory, consensus-oriented, accountable, transparent, responsive, effective and efficient, equitable and inclusive and follows the rule of law.”* [United Nations Economic and Social Commission for Asia and the Pacific](https://www.unescap.org/sites/default/d8files/knowledge-products/good-governance.pdf)."
    translation: "*«Яно прадугледжвае ўдзел, імкненне да кансенсусу, падсправаздачнасць, празрыстасць, гатоўнасць рэагаваць, выніковасць і эфектыўнасць, справядлівасць і інклюзіўнасць, а таксама вяршэнства права».* [Эканамічная і сацыяльная камісія Арганізацыі Аб’яднаных Нацый для Азіі і Ціхага акіяна](https://www.unescap.org/sites/default/d8files/knowledge-products/good-governance.pdf)."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1661a79cfda1a9df:
    english: Underpinning all of these principles is the need for good communication.
    translation: У аснове ўсіх гэтых прынцыпаў — патрэба ў добрай камунікацыі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2819f114c9d74160:
    english: 'Here are some or the challenges directors and boards experience:'
    translation: 'Рады і іх члены сутыкаюцца з такімі цяжкасцямі:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ed750814c61b85fb:
    english: "* Getting directors together in person\n* Time available to consider important issues \n* Tracking communication\n* Urgency of critical issues\n* Online video meeting fatigue\n* Directors in multiple, remote locations, sometimes with poor internet connectivity\n* Mixed governance practice and experience\n* Dealing with high volumes of transactional business \n* Maintaining institutional memory"
    translation: "* Складана сабраць усіх членаў рады асабіста\n* Не хапае часу на разгляд важных пытанняў \n* Складана адсочваць абмеркаванні\n* Важныя пытанні патрабуюць тэрміновага вырашэння\n* Відэасустрэчы стамляюць\n* Члены рады знаходзяцца ў розных аддаленых месцах, часам з дрэнным інтэрнэт-злучэннем\n* Падыходы да кіравання і досвед удзельнікаў адрозніваюцца\n* Даводзіцца выконваць вялікі аб’ём бягучай працы \n* Патрэбна захоўваць гісторыю працы арганізацыі"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b910c5253cf77950:
    english: Loomio offers an opportunity to strengthen governance, to extend collaboration beyond board meetings, to include everyone in open, honest and respectful discussion while documenting everything.
    translation: Loomio дапамагае палепшыць кіраванне і працягваць сумесную працу паміж пасяджэннямі рады. Усе могуць удзельнічаць у адкрытых, шчырых і паважлівых абмеркаваннях, а іх ход застаецца задокументаваным.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
