  857b562cb95497c6:
    english: "*For when you want to move your group data to a self-hosted Loomio instance.*"
    translation: "*Per trasferire i dati del gruppo su un'istanza Loomio ospitata da te.*"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a1b7f7b282933a3c:
    english: 'You must be an admin of the group to export it. The JSON export includes:'
    translation: 'Per esportare un gruppo devi esserne un amministratore. L''esportazione JSON include:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6a0b307d50fa35cf:
    english: |-
      - The group, its members and membership requests
      - Threads, comments, reactions, tags, templates, notifications and related records from the included groups
      - Polls, options, votes and outcomes; an anonymous poll is included only after it has closed
      - Subgroups you belong to
      - Open and closed subgroups when you export their parent group as a parent group admin, even if you do not belong to those subgroups
      - References to files and images attached to the included content
    translation: |-
      - Il gruppo, i suoi membri e le richieste di adesione
      - Discussioni, commenti, reazioni, tag, modelli, notifiche e record correlati dei gruppi inclusi
      - Sondaggi, opzioni, voti e conclusioni; un sondaggio anonimo viene incluso solo dopo la chiusura
      - I sottogruppi di cui fai parte
      - I sottogruppi aperti e chiusi quando esporti il gruppo principale come suo amministratore, anche se non fai parte di quei sottogruppi
      - I riferimenti ai file e alle immagini allegati ai contenuti inclusi
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4dee92f966ec24c9:
    english: 'The JSON export does not include:'
    translation: 'L''esportazione JSON non include:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a40deeed41d9937e:
    english: |-
      - Secret subgroups you do not belong to, including their membership and content
      - Subgroups awaiting deletion
      - Anonymous polls that have not closed
      - Direct threads and polls that do not belong to the group
    translation: |-
      - I sottogruppi segreti di cui non fai parte, compresi i loro membri e contenuti
      - I sottogruppi in attesa di eliminazione
      - I sondaggi anonimi non ancora chiusi
      - Le discussioni dirette e i sondaggi che non appartengono al gruppo
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d789fbf93f8cebeb:
    english: You'll shortly receive an email with a link to downloading the JSON file.
    translation: Riceverai a breve un'email con un link per scaricare il file JSON.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
