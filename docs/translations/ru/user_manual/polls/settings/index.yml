---
navigation_title: Настройки
blocks:
  145c23b2412eff98:
    english: "# Proposal and poll settings"
    translation: "# Настройки предложений и опросов"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e0347d976f79179:
    english: "## Setting up a proposal or poll"
    translation: "## Создание предложения или опроса"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e5d6f17041c19d41:
    english: "### Proposal and poll templates"
    translation: "### Шаблоны предложений и опросов"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8913cabb2f1f8227:
    english: 'Choose the proposal template you want to use. '
    translation: Выберите шаблон предложения, который хотите использовать.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3620f6321777ca50:
    english: "### Add content"
    translation: "### Добавление содержимого"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bc7ebb222e9ff4d1:
    english: "**Group:** Check that the correct group is selected for your proposal or poll."
    translation: "**Группа:** Убедитесь, что для предложения или опроса выбрана нужная группа."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3a1d375da02f3a49:
    english: "**Title:** Give your proposal or poll a short, relevant title."
    translation: "**Заголовок:** Дайте предложению или опросу короткий заголовок по теме."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a62a7e63f9db295c:
    english: "**Details:** Explain what you are asking of people and include enough details so everyone knows what it means to vote.  "
    translation: "**Подробности:** Объясните, о чём вы просите участников, и добавьте достаточно сведений, чтобы всем было понятно, за что они голосуют."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e17c2ab4878716f2:
    english: The predefined templates include some prompts to help you write a good proposal - use these or add your own details.
    translation: Готовые шаблоны содержат подсказки, которые помогут вам составить предложение. Используйте их или добавьте свои пояснения.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  74daa7f0cc476971:
    english: Avoid combining a range of ideas in one proposal, because people might agree to some aspects but not others and be unsure how to respond. You can break complex decisions down into multiple proposals.
    translation: Не объединяйте в одном предложении несколько разных идей. Участники могут согласиться с одними пунктами, но не с другими, и не понять, как голосовать. Сложное решение можно разделить на несколько предложений.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0da6e449688940bb:
    english: When making a proposal, state your expectations and describe the impact the proposal will have if adopted. If it's a formal or binding proposal it's often worth describing what it means if the proposal is not adopted.
    translation: В предложении изложите свои ожидания и опишите, что изменится, если его примут. Если предложение формальное или обязательное к исполнению, часто полезно объяснить и последствия его отклонения.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a6db66b75f495e21:
    english: Use the formatting tools to support your poll.  For example, attach a document file with the paperclip icon, insert an image, link to a website or online document, or even embed a video.
    translation: Используйте инструменты форматирования, чтобы дополнить опрос. Например, прикрепите документ с помощью значка скрепки, вставьте изображение, добавьте ссылку на сайт или онлайн-документ либо встроите видео.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f4f85f131878c36d:
    english: "### Voting options"
    translation: "### Варианты голосования"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  616aab74af2072ba:
    english: Each proposal and poll template provides options for voting.
    translation: Каждый шаблон предложения и опроса содержит варианты голосования.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7a85de7eefe74178:
    english: Depending on the template, you can edit, remove, reorder, or add voting options to suit the decision process you are running.
    translation: В зависимости от шаблона вы можете изменять, удалять, переставлять и добавлять варианты голосования в соответствии с вашим порядком принятия решений.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9bc44bf4b28ac5d8:
    english: "- Use the pencil icon to edit voting option \n- Use the trash can icon to remove unwanted voting options\n- Use the handle to move the order of voting options\n- Add voting options with **Add option** when the template allows custom options"
    translation: |-
      - Чтобы изменить вариант голосования, нажмите значок карандаша
      - Чтобы удалить ненужный вариант голосования, нажмите значок корзины
      - Чтобы изменить порядок вариантов голосования, перетащите их за маркер
      - Если шаблон допускает собственные варианты, добавьте их с помощью кнопки **Добавить вариант**
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2062f39334fbd629:
    english: |-
      ### Edit voting options
      There is a lot of flexibility to configure voting options to suit the way your organization makes decisions.
    translation: |-
      ### Изменение вариантов голосования
      Варианты голосования можно настроить в соответствии с тем, как ваша организация принимает решения.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5ac5b47c81fe187b:
    english: 'Use the pencil icon alongside the voting option to open the edit modal:'
    translation: 'Чтобы открыть окно редактирования, нажмите значок карандаша рядом с вариантом голосования:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3c791f8140ad3b39:
    english: "**Option name:** A short name for the option."
    translation: "**Название варианта:** Короткое название варианта."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  77a0fb7409cf1711:
    english: "**Icon:** Select an icon for the option, such as thumbs up, thumbs down, abstain, or block."
    translation: "**Значок:** Выберите значок для варианта, например палец вверх, палец вниз, воздержание или блокировку."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9126ee91e5d1cb95:
    english: "**Meaning:** A sentence that explains what choosing this options means."
    translation: "**Значение:** Одно предложение о том, что означает выбор этого варианта."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e88d83b93ba47666:
    english: "**Reason prompt:** A question to prompt voters to provide their reasoning or reconsider their position. "
    translation: "**Подсказка для обоснования:** Вопрос, который побуждает участников объяснить свой выбор или пересмотреть свою позицию."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d05197892ea46087:
    english: "### Opening time"
    translation: "### Время начала голосования"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1b56f0ad52a3aed8:
    english: By default, voting opens immediately when you create the poll. If you want to schedule voting to open at a later time, uncheck **Voting opens immediately** and select an opening date and time.
    translation: По умолчанию голосование начинается сразу после создания опроса. Чтобы назначить более позднее время, снимите флажок **Голосование открывается немедленно.** и выберите дату и время начала.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  48ccc43734b062eb:
    english: This is useful to give time for discussion before voting opens, or to ensure a poll or proposal is correctly set up and scheduled to happen at the right time.
    translation: Это даёт время на обсуждение перед голосованием. Вы также можете заранее проверить настройки опроса или предложения и назначить нужное время начала.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b68fccc3132988ff:
    english: When a poll has a scheduled opening time, you can add voters before voting opens. Voters will be notified when voting opens, rather than when they are added.
    translation: Если для опроса назначено время начала, вы можете добавить участников голосования заранее. Они получат уведомление при открытии голосования, а не при добавлении.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  82d4cacfa780dd98:
    english: "**Notify voters when poll opens:** When checked (default), all voters will receive a notification when voting opens. Uncheck this if you want to open voting without sending notifications."
    translation: "**Уведомить участников при открытии опроса:** По умолчанию этот флажок установлен, и все участники получают уведомление при открытии голосования. Снимите флажок, чтобы открыть голосование без уведомлений."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d084620657803f93:
    english: "**Closing date and time:** Select the closing date and time for your poll."
    translation: "**Дата и время закрытия:** Выберите дату и время закрытия опроса."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c0472419a2671222:
    english: Give sufficient time for people to vote. You could time the proposal so it closes before a meeting, or avoid closing over a weekend, so that people will receive a timely reminder. If necessary, you can close the poll early or extend the closing time.
    translation: Оставьте людям достаточно времени для голосования. Можно закрыть предложение перед встречей или выбрать дату закрытия вне выходных, чтобы участники вовремя получили напоминание. При необходимости вы можете закрыть опрос досрочно или продлить его.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c87f87e6cbc1a4d7:
    english: "**Who can vote?** Invite everyone in the group or only specific people that you invite."
    translation: "**Кто может голосовать?** Пригласите всех участников группы или только выбранных вами людей."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e02a9cefc3082334:
    english: |-
      You can later add people to an 'Invite people only' poll. For identified polls,
      you can also remove people who should no longer be eligible to vote. People
      cannot be removed from an anonymous poll.
    translation: |-
      Позже вы можете добавить людей в опрос с участием только по приглашению. В неанонимном опросе
      вы также можете удалить тех, кто больше не должен голосовать. Из анонимного опроса
      удалять участников нельзя.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2e959157d75ed7bd:
    english: "## More settings"
    translation: "## Дополнительные настройки"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3d4443d3e6d3b13d:
    english: |-
      ### Reminder
      Send a 'Closing soon' notification 24 hours before the poll closes. This can be an opportunity for people to see how others have voted and reconsider their own vote, or just a way to increase participation in the poll.
    translation: |-
      ### Напоминание
      Отправьте уведомление «Скоро закрытие» за 24 часа до закрытия опроса. Оно позволит участникам посмотреть, как проголосовали другие, и при желании пересмотреть свой голос. Напоминание также может повысить участие в опросе.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  62067c0573d7a64e:
    english: |-
      Setting options:
      - Nobody
      - Author
      - Undecided voters (default)
      - All voters
    translation: |-
      Варианты настройки:
      - Никому
      - Автору
      - Тем, кто ещё не определился (по умолчанию)
      - Всем участникам голосования
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6cd67c3f92302551:
    english: |-
      For an anonymous poll lasting at least 24 hours, Loomio automatically reminds
      eligible people who have not voted during the final 24 hours. This reminder
      cannot be changed in the poll settings.
    translation: |-
      Если анонимный опрос длится не менее 24 часов, Loomio автоматически напоминает
      имеющим право голоса людям, которые ещё не проголосовали, в последние 24 часа. Это напоминание
      нельзя изменить в настройках опроса.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72f172271e2a636a:
    english: |-
      ### Anonymous voting
      If enabled, votes are stored separately from voter identities. Results appear after voting closes, and voters cannot add reasons, review their submitted vote, or change it.
    translation: |-
      ### Анонимное голосование
      Если включить эту настройку, голоса будут храниться отдельно от данных об участниках. Результаты появятся после закрытия голосования. Участники не смогут добавлять обоснования, просматривать свой отправленный голос или менять его.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3393027493510f2f:
    english: See [Anonymous voting](/en/user_manual/polls/anonymous_voting) for details about how voter identities are separated from submitted votes, what information is retained, and the limits of the protection.
    translation: Подробнее о разделении данных об участниках и их голосов, сохраняемой информации и пределах защиты читайте в разделе [Анонимное голосование](/en/user_manual/polls/anonymous_voting).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b731b9118e48dee5:
    english: |-
      > [!WARNING]
      > Once a poll has started you cannot edit the poll to make it anonymous or to undo the anonymous setting.
    translation: |-
      > [!WARNING]
      > После начала опроса вы не сможете включить или отключить анонимное голосование.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e8660d089a3c07bb:
    english: |-
      > [!WARNING]
      > You cannot re-open an anonymous poll after it has closed. Submitted votes are not linked to the participation records that show who has voted.
    translation: |-
      > [!WARNING]
      > После закрытия анонимного опроса его нельзя открыть повторно. Поданные голоса не связаны с записями об участии, которые показывают, кто проголосовал.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  aaaaa28a4b435835:
    english: |-
      ### Vote reason
      It can be helpful to understand why people voted the way they did. With this setting, you can prompt people to share their thoughts when they vote.
    translation: |-
      ### Обоснование голоса
      Полезно знать, почему люди голосуют определённым образом. Эта настройка позволяет предложить участникам поделиться своими соображениями при голосовании.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  309645182b157738:
    english: 'Available settings depend on the template:'
    translation: 'Доступные настройки зависят от шаблона:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d67e2c2914e91a6f:
    english: |-
      - **Optional** lets voters choose whether to give a reason
      - **Required for disagree or block** requires a reason when the selected option
        uses the Disagree or Block voting icon
      - **Required for block** requires a reason when the selected option uses the
        Block voting icon
      - **Required** requires every voter to give a reason
      - **Disabled** removes the vote-reason field
    translation: |-
      - **Необязательный** — голосующие могут сами решить, указывать ли причину
      - **Обязательно для выражения несогласия или блокировки** — причину нужно указать, если выбран вариант
        со значком несогласия или блокировки
      - **Требуется при блокировке** — причину нужно указать, если выбран вариант со значком
        блокировки
      - **Необходимый** — каждый голосующий должен указать причину
      - **Неполноценный** — поле для указания причины не отображается
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  af5e7c0557aec611:
    english: |-
      The conditional settings follow the voting icon rather than the option name.
      They still apply if you rename Disagree to a term such as Objection. The
      Consent template defaults to **Required for disagree or block**, while the
      Consensus template defaults to **Required for block**. Other templates default
      to **Optional**, except Question rounds where the response itself is required.
      The poll author can change the setting for an individual poll.
    translation: |-
      Условия зависят от значка голосования, а не от названия варианта.
      Они продолжают действовать, если переименовать вариант «Не согласен», например, в «Возражаю». В
      шаблоне согласия по умолчанию выбрано **Обязательно для выражения несогласия или блокировки**, а в
      шаблоне консенсуса — **Требуется при блокировке**. В остальных шаблонах по умолчанию выбрано
      **Необязательный**, кроме раундов вопросов, где ответ обязателен.
      Автор опроса может изменить эту настройку для отдельного опроса.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ecb0d89c623db459:
    english: "**Limit reason to maximum 500 characters:** Keeping vote reasons short makes them easier to understand. A collection of concise reasons is a great resource for making a decision.  This setting is ticked by default. Untick to allow for longer reasons."
    translation: "**Ограничить причину 500 символами:** Короткие объяснения голосов легче понять. Они помогают принять решение. Эта настройка включена по умолчанию. Снимите флажок, чтобы разрешить более длинные объяснения."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  35bd4f116b9ff26a:
    english: |-
      ### Hide results
      If you want people to vote without knowing how others have voted, you can hide the results of the poll.  Useful if you do not want people to be affected by how other people have voted.
    translation: |-
      ### Скрыть результаты
      Вы можете скрыть результаты опроса, чтобы люди голосовали, не зная, как проголосовали другие. Это помогает избежать влияния чужих голосов на выбор.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8cc5b82f4cc5e94e:
    english: |-
      Setting options:
      - Do not hide results
      - Hide results until a vote is cast
      - Hide results until voting closes
    translation: |-
      Варианты настройки:
      - Не скрывать результаты
      - Скрывать результаты до подачи голоса
      - Скрывать результаты до завершения голосования
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4be103ffd97e7e8f:
    english: While results are hidden, nobody can reply to votes. Replies to votes open when voting closes.
    translation: Пока результаты скрыты, никто не может отвечать на голоса. Ответы станут доступны после завершения голосования.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a488ebe6712a5e1d:
    english: If results are hidden until a vote is cast, vote before you print or export the thread as Markdown.
    translation: Если результаты скрыты до подачи голоса, проголосуйте перед печатью или экспортом темы в формате Markdown.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1e5a1eb47ee3d99d:
    english: |-
      Anonymous polls always hide results until voting closes. The STV Election
      template enables anonymous voting by default.
    translation: |-
      В анонимных опросах результаты всегда скрыты до завершения голосования. В шаблоне выборов STV
      анонимное голосование включено по умолчанию.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8e7d8e81db57f4f8:
    english: |-
      ### Start the poll
      Select the **Start proposal** or **Start poll** button.
    translation: |-
      ### Начать опрос
      Нажмите **Начать предложение** или **Начать опрос**.
    status: machine
    provider: codex/gpt-6-sol
