---
navigation_title: Выберыце
blocks:
  581de5d50d3dc442:
    english: "# Choose"
    translation: "# Выберыце"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  733b320e0407fbdc:
    english: Choose is a simple poll for finding the most popular option or making a shortlist. Participants select one or more options, depending on the limits you set. This voting method is commonly known as multiple choice.
    translation: "«Выберыце» — простае апытанне, якое дапамагае знайсці найбольш папулярны варыянт або скласці кароткі спіс. Удзельнікі выбіраюць адзін ці некалькі варыянтаў у межах зададзеных вамі абмежаванняў. Такі спосаб галасавання звычайна называюць множным выбарам."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '09aefb579b50874b':
    english: "## When to use Choose"
    translation: "## Калі выкарыстоўваць «Выберыце»"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  be35cf72fcaf9c4d:
    english: 'Use Choose when the options are distinct and you need to count how many people select each one. It works well for:'
    translation: 'Выкарыстоўвайце «Выберыце», калі варыянты выразна адрозніваюцца і трэба падлічыць, колькі людзей выбрала кожны з іх. Напрыклад, каб:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dcc6f6b9238155b2:
    english: |-
      - choosing one venue from a shortlist;
      - selecting up to three topics for an agenda;
      - deciding which design should proceed to the next round; or
      - checking which services members intend to use.
    translation: |-
      - выбраць адно месца з кароткага спіса;
      - выбраць да трох тэм для парадку дня;
      - вызначыць, які дызайн пройдзе ў наступны раўнд; або
      - даведацца, якімі паслугамі збіраюцца карыстацца члены групы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3770d0653b752de5:
    english: Choose records selections, not the strength or order of a person's preferences. Use [Score](/en/user_manual/polls/score/) to measure how strongly people support every option, [Allocate](/en/user_manual/polls/allocate/) when there is a limited budget, or [Rank](/en/user_manual/polls/rank/) when preference order matters.
    translation: "«Выберыце» фіксуе выбраныя варыянты, але не паказвае сілу пераваг людзей або іх парадак. Выкарыстоўвайце [Ацэнку](/en/user_manual/polls/score/), каб вызначыць узровень падтрымкі кожнага варыянта, [Размеркаванне](/en/user_manual/polls/allocate/), калі бюджэт абмежаваны, або [Рэйтынгавы выбар](/en/user_manual/polls/rank/), калі важны парадак пераваг."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f15aca327e894f30:
    english: "## Example: set a planning-meeting agenda"
    translation: "## Прыклад: складанне парадку дня сустрэчы па планаванні"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f51e09afa0ed1e53:
    english: Oatmilk Cooperative needs to decide which parts of a returnable-bottle trial need the most time at its next planning meeting. The poll asks each person to choose up to two topics. Its details explain how the result will be used, and each option includes enough information to distinguish it from the others.
    translation: Кааператыву Oatmilk трэба вырашыць, якім часткам выпрабавання зваротных бутэлек прысвяціць найбольш часу на наступнай сустрэчы па планаванні. У апытанні кожны чалавек можа выбраць да дзвюх тэм. У падрабязнасцях тлумачыцца, як будуць выкарыстаныя вынікі, а апісанні варыянтаў дапамагаюць адрозніць іх адзін ад аднаго.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c74ebb16f872b3c6:
    english: "## Set up the poll"
    translation: "## Наладзьце апытанне"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  abc749fec8671661:
    english: Give the poll a specific question as its title. In **Details**, explain what participants should consider and what will happen with the result. Add each available option, then set the **Minimum choices** and **Maximum choices**.
    translation: У назве апытання сфармулюйце канкрэтнае пытанне. У полі **Падрабязнасці** растлумачце, што варта ўлічыць удзельнікам і як будуць выкарыстаныя вынікі. Дадайце ўсе даступныя варыянты, затым задайце **Мінімальны выбар** і **Максімальны выбар**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e878ddc9f61dd243:
    english: Set both limits to 1 when participants must choose exactly one option. Set a higher maximum when you want a shortlist. Avoid allowing so many choices that participants can select nearly every option, because that makes the result less useful.
    translation: 'Калі ўдзельнікі павінны выбраць роўна адзін варыянт, задайце для абодвух абмежаванняў значэнне 1. Каб скласці кароткі спіс, павялічце максімальнае значэнне. Не дазваляйце выбіраць амаль усе варыянты: тады вынікі будуць менш карыснымі.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  152fec5018fc232b:
    english: Use the pencil icon beside an option to add a meaning or further explanation. This is useful when a short option name could be interpreted in different ways.
    translation: Каб удакладніць сэнс варыянта або дадаць тлумачэнне, націсніце на значок алоўка побач з ім. Гэта карысна, калі кароткую назву варыянта можна зразумець па-рознаму.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  59e405cf9a028c8d:
    english: Under **More settings**, **Show options in random order** can reduce the effect of always presenting one option first.
    translation: У раздзеле **Больш налад** параметр **Паказаць параметры ў выпадковым парадку** можа зменшыць уплыў таго, што адзін і той жа варыянт заўсёды паказваецца першым.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Прагаласуйце"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7db2d0e58e5fb4e4:
    english: The vote form tells participants how many options they may select. In this example, the voter selects **Cafe collection schedule** and **Washing workflow**, then gives a reason connecting those choices to the trial.
    translation: Форма галасавання паказвае ўдзельнікам, колькі варыянтаў можна выбраць. У гэтым прыкладзе выбраны **Графік збору бутэлек у кавярнях** і **Працэс мыцця**. Затым удзельнікі тлумачаць, як гэты выбар звязаны з выпрабаваннем.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e55e4b8950a5fd46:
    english: A reason can reveal why an option matters and what work participants expect it to cover. If reasons are important to the decision, configure the vote-reason setting before starting the poll.
    translation: Тлумачэнне дапамагае зразумець, чаму варыянт важны і якую працу, на думку ўдзельнікаў, ён ахоплівае. Калі тлумачэнні важныя для рашэння, наладзьце іх перад пачаткам апытання.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Праглядзіце вынікі"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c1ec47f66384e3bb:
    english: The results show the share of all selections received by each option, the number of voters who selected it, and who has not voted. Because each person could choose two options, the percentages describe selections rather than a percentage of people.
    translation: Вынікі паказваюць долю кожнага варыянта сярод усіх выбараў, колькасць людзей, якія яго выбралі, і тых, хто яшчэ не прагаласаваў. Паколькі кожны чалавек мог выбраць два варыянты, працэнты адлюстроўваюць долю выбараў, а не долю людзей.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6cbc0f9d6fdf6727:
    english: In this example, **Cafe collection schedule** has three selections. **Washing workflow** and **Return-rate reporting** each have two. The result supports giving cafe collections the most agenda time, but the tied topics still require the organizer to decide how the remaining time is divided.
    translation: У гэтым прыкладзе **Графік збору бутэлек у кавярнях** выбралі тры разы. **Працэс мыцця** і **Справаздача аб долі вяртанняў** атрымалі па два выбары. Паводле вынікаў, збору бутэлек у кавярнях варта прысвяціць найбольш часу. Тэмы з аднолькавай колькасцю выбараў усё яшчэ патрабуюць рашэння арганізатараў аб тым, як размеркаваць астатні час.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  adb7eb28e16616be:
    english: When the poll closes, publish an **Outcome** explaining what the group will do with the result.
    translation: Калі апытанне завершыцца, апублікуйце **Выснову** і растлумачце, як група выкарыстае яго вынікі.
    status: needs_review
    note: use the interface label "**Выснова**" for "**Outcome**"
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
