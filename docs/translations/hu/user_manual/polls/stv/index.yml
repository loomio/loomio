  366f56443108e10f:
    english: "**Single Transferable Vote (STV)** is a proportional representation voting method for electing multiple winners from a field of candidates. It ensures that elected candidates proportionally represent the diversity of views among voters."
    translation: Az **átruházható szavazat (STV)** arányos képviseletet biztosító szavazási módszer, amellyel több jelöltet lehet megválasztani. A megválasztott jelöltek így a szavazók eltérő nézeteit is arányosan képviselhetik.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  61dee55b45038f56:
    english: "## When to use STV"
    translation: "## Mikor használj STV-t?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8311dca26cec6519:
    english: 'Use an STV Election when you need to:'
    translation: 'Akkor használj STV-választást, ha:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1d4338734ec6e113:
    english: |-
      - Elect a **committee, board, or slate of delegates** from a pool of nominees
      - Ensure **proportional representation**, where minority factions can win seats proportional to their support
      - Run elections where voters rank candidates by preference
    translation: |-
      - Több jelölt közül szeretnél **bizottságot, vezető testületet vagy küldötteket** választani
      - **Arányos képviseletet** szeretnél biztosítani, hogy a kisebbségben lévő csoportok is a támogatottságuknak megfelelő számú helyet szerezhessenek
      - Olyan választást tartasz, ahol a szavazók rangsorolják a jelölteket
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e6e1ae026f65a715:
    english: |-
      >[!NOTE]
      >STV is **not** the same as Loomio's [Rank poll](/en/user_manual/polls/rank/), which is a simpler score-based ranking for choosing a single best option. STV handles multi-winner elections with vote transfers and elimination rounds.
    translation: |-
      >[!NOTE]
      >Az STV **nem** azonos a Loomio [rangsoroló szavazásával](/en/user_manual/polls/rank/), amely pontszámok alapján segít kiválasztani egyetlen legjobb lehetőséget. Az STV több jelölt megválasztására szolgál, a szavazatok átruházásával és kieséses fordulókkal.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  62af8f95f18dbafe:
    english: "## Creating an STV Election"
    translation: "## STV-választás létrehozása"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  edf2f36e75c81665:
    english: When starting a poll, select **STV Election** as the poll type, then add the candidates as the poll options. You can customize the poll by setting the **number of seats**, the **counting method**, and the **quota type**.
    translation: Szavazás indításakor válaszd a **STV választás** típust, majd add hozzá a jelölteket szavazási lehetőségként. Beállíthatod a **helyek számát**, a **számlálási módszert** és a **kvóta típusát**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b40ddcfb8cdc44fd:
    english: In this example, Oatmilk Cooperative is electing three people to oversee its returnable packaging trial. The form explains the role, lists five candidates, and uses Scottish STV with the Droop quota.
    translation: Ebben a példában az Oatmilk Cooperative három embert választ a visszaváltható csomagolás kipróbálásának felügyeletére. Az űrlap ismerteti a feladatot, felsorol öt jelöltet, és skót STV-t használ Droop-kvótával.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a34592929349d06:
    english: "### Number of seats"
    translation: "### Helyek száma"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c09f5f51333612dc:
    english: How many winners should be elected. Must be less than the number of candidates.
    translation: Ennyi jelöltet választanak meg. A helyek számának kisebbnek kell lennie a jelöltek számánál.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ddceec01d910b152:
    english: "### Counting method"
    translation: "### Számlálási módszer"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  39e9e81a89272771:
    english: 'There are two available methods for counting the votes:'
    translation: 'A szavazatok kétféle módszerrel számolhatók meg:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a7031d1180e95273:
    english: |-
      Scottish STV
        : Recommended. The Weighted Inclusive Gregory Method (WIGM) used in Scottish local elections since 2007. Well-defined, straightforward rules. Best for most organizations.
    translation: |-
      Skót STV
        : Ajánlott. A súlyozott inkluzív Gregory-módszer (WIGM), amelyet 2007 óta használnak a skót helyhatósági választásokon. Szabályai egyértelműek és könnyen követhetők. A legtöbb szervezet számára megfelelő.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1507e4fde88848dd:
    english: |-
      Meek STV
        : A more mathematically precise iterative method. When a candidate is eliminated, votes are recounted as if that candidate was never in the race.
    translation: |-
      Meek STV
        : Matematikailag pontosabb, ismételt számításon alapuló módszer. Ha egy jelölt kiesik, a szavazatokat úgy számolják újra, mintha a jelölt soha nem indult volna.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b9abcd12eef5f629:
    english: "### Quota type"
    translation: "### Kvóta típusa"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6dc3aea49266d40d:
    english: 'The quota is the minimum number of votes a candidate needs to win a seat. It can be either:'
    translation: 'A kvóta az a legkevesebb szavazat, amelyre egy jelöltnek szüksége van egy hely megszerzéséhez. Két típusa választható:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  88f62f286d8c550f:
    english: |-
      Droop
        : Recommended. The standard quota type for most STV elections, and used by Ireland, Australia, and Scotland. Droop guarantees a majority coalition wins a majority of seats. It is calculated as:
      \\[ floor(\frac{votes}{(seats + 1)}) + 1 \\]
    translation: |-
      Droop
        : Ajánlott. A legtöbb STV-választáson ezt a kvótát használják, többek között Írországban, Ausztráliában és Skóciában. A Droop-kvóta biztosítja, hogy a szavazók többsége a helyek többségét szerezze meg. Így számítható ki:
      \\[ floor(\frac{votes}{(seats + 1)}) + 1 \\]
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  817b3994e92898e8:
    english: |-
      Hare
        : A higher minimum threshold, and more proportional for smaller factions.
          Hare is preferred by DSA chapters to protect minority representation.
         It is calculated as:
          \\[ \frac{votes}{seats}\\]
    translation: |-
      Hare
        : Magasabb küszöb, amely arányosabb képviseletet ad a kisebb csoportoknak.
          A DSA helyi szervezetei a kisebbségi képviselet védelme érdekében ezt részesítik előnyben.
         Így számítható ki:
          \\[ \frac{votes}{seats}\\]
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f12065bdf5d3678e:
    english: |2-
        >[!TIP]
        > Droop will always compute to a smaller number of votes than Hare. For example, in an election with 100 votes and four seats, the Droop quota would be 21 and the Hare quota 25.
    translation: |-
      >[!TIP]
        > A Droop-kvóta mindig kevesebb szavazatot jelent, mint a Hare-kvóta. Ha például 100 szavazat érkezik négy helyre, a Droop-kvóta 21, a Hare-kvóta pedig 25.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  984516abc3cfd89b:
    english: "## How voting works"
    translation: "## Hogyan működik a szavazás?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  40e98247d87cdf27:
    english: 'In this example, Oatmilk Cooperative is electing three people to oversee the reusable packaging trial. Voters drag candidates above the line and rank them in order of preference:'
    translation: 'Ebben a példában az Oatmilk Cooperative három embert választ az újrahasználható csomagolás kipróbálásának felügyeletére. A szavazók a vonal fölé húzzák a jelölteket, majd a kívánt sorrendbe rendezik őket:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f8aaa5391f05117f:
    english: |-
      - **Rank 1** = most preferred candidate
      - **Rank 2** = second choice
      - Continue ranking as many candidates as desired
    translation: |-
      - **1. hely** = a leginkább támogatott jelölt
      - **2. hely** = a második választás
      - Annyi jelöltet rangsorolj, amennyit szeretnél
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  70bd790faf93c916:
    english: Voters are not required to rank every candidate. Unranked candidates will not receive any of that voter's support.
    translation: Nem kell minden jelöltet rangsorolni. A rangsorba nem tett jelöltek nem részesülnek az adott szavazó támogatásából.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d82e369c7c293a0c:
    english: |-
      ## How counting works
      The count is performed as follows:
    translation: |-
      ## Hogyan működik a számlálás?
      A számlálás menete:
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0ea01b5d531abc06:
    english: |-
      1. A **quota** is calculated (minimum votes needed to win a seat).
      2. **First preferences** are counted for each candidate.
      3. If a candidate meets the quota, they are **elected**. Their surplus votes (above the quota) are **transferred** to voters' next preferences at a fractional value.
      4. If no candidate meets the quota, the candidate with the **fewest votes is eliminated**. Their votes transfer to voters' next preferences at full value.
      5. This process repeats until all seats are filled.
    translation: |-
      1. Kiszámítják a **kvótát** (a mandátum megszerzéséhez szükséges legkevesebb szavazatot).
      2. Minden jelöltnél összeszámolják az **Elsődleges beállítások** szerinti szavazatokat.
      3. Ha egy jelölt eléri a kvótát, **megválasztják**. A kvótán felüli szavazatait tört értékkel **átruházzák** a szavazók következőként rangsorolt jelöltjeire.
      4. Ha senki sem éri el a kvótát, a **legkevesebb szavazatot kapott jelölt kiesik**. Szavazatait teljes értékkel átruházzák a szavazók következőként rangsorolt jelöltjeire.
      5. A folyamat addig ismétlődik, amíg minden mandátumot be nem töltenek.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c6f397233ad479e5:
    english: |-
      >[!TIP]
      >If a voter has ranked no remaining candidates, their ballot is "exhausted" and that vote is lost. This is why ranking more candidates is generally better.
    translation: |-
      >[!TIP]
      >Ha egy szavazó egyetlen versenyben maradt jelöltet sem rangsorolt, a szavazólapja „kimerül”, és a szavazata már nem számít bele az eredménybe. Ezért általában érdemes több jelöltet rangsorolni.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  acba228efb586cca:
    english: "## Understanding results"
    translation: "## Az eredmények értelmezése"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3b584c17ac358371:
    english: 'After the poll closes, results are displayed in several sections. In this election, Samira Patel, Alex Morgan, and Morgan Price fill the three committee seats:'
    translation: 'A szavazás lezárása után az eredmények több szakaszban jelennek meg. Ezen a választáson Samira Patel, Alex Morgan és Morgan Price szerzi meg a bizottság három helyét:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9c3f3c8a80729fbf:
    english: "### Method and quota"
    translation: "### Módszer és kvóta"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  feee79b9f6e92de3:
    english: At the top, you'll see the counting method (Scottish STV or Meek STV) and quota type (Droop or Hare) along with the quota — the number of votes a candidate needed to win a seat.
    translation: 'Felül láthatod a számlálási módszert (skót STV vagy Meek STV), a kvóta típusát (Droop vagy Hare), valamint a kvótát: ennyi szavazatra volt szüksége egy jelöltnek egy hely megszerzéséhez.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e180eb800c3435cd:
    english: "### Elected candidates"
    translation: "### Megválasztott jelöltek"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8db8b2466db56f2b:
    english: 'A summary table of the winners with five columns:'
    translation: 'A megválasztott jelölteket öt oszlopból álló összefoglaló táblázat mutatja:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f998ffc721953501:
    english: |-
      | Column | Meaning |
      |--------|---------|
      | **Candidate** | The name of the elected candidate |
      | **Round elected** | Which counting round they reached the quota and won a seat. Round 1 means they won on first preferences alone; higher rounds mean they needed transferred votes from eliminated or surplus candidates. |
      | **First preferences** | How many voters ranked this candidate as their first choice. This shows a candidate's direct support before any vote transfers. |
      | **Final tally** | The candidate's vote tally at the moment they were elected. Due to vote transfers, this is often higher than their first preferences. |
      | **Surplus** | How much the candidate's final tally exceeded the quota (final tally minus quota). A larger surplus means stronger support beyond what was needed to win. In Scottish STV, this surplus is redistributed to voters' next preferences. |
    translation: |-
      | Oszlop | Jelentés |
      |--------|---------|
      | **Jelölt** | A megválasztott jelölt neve |
      | **Megválasztott forduló** | Az a számlálási forduló, amelyben a jelölt elérte a kvótát és helyet szerzett. Az 1. forduló azt jelenti, hogy ehhez elegendők voltak az első helyre sorolások; a későbbi fordulókban kiesett vagy többletszavazattal rendelkező jelöltektől átruházott szavazatokra is szükség volt. |
      | **Elsődleges beállítások** | Hány szavazó sorolta a jelöltet az első helyre. Ez a jelölt közvetlen támogatottságát mutatja a szavazatok átruházása előtt. |
      | **Végső összesítés** | A jelölt szavazatainak száma a megválasztása pillanatában. Az átruházott szavazatok miatt ez gyakran magasabb, mint az első helyre sorolások száma. |
      | **Többlet** | Ennyivel haladta meg a jelölt végső szavazatszáma a kvótát (végső összesítés mínusz kvóta). A nagyobb többlet azt jelzi, hogy a jelölt a megválasztásához szükségesnél több támogatást kapott. A skót STV-ben ezt a többletet továbbosztják a szavazók következő választásai között. |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  efc41c326d955758:
    english: If the count results in a tie — where eliminating any of the remaining candidates would change the outcome — those candidates are shown in a separate table rather than arbitrarily choosing a winner.
    translation: Ha a számlálás döntetlent eredményez, és bármelyik versenyben maradt jelölt kiejtése megváltoztatná a végeredményt, ezeket a jelölteket külön táblázat mutatja. Ilyenkor nem választanak önkényesen győztest.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8a6ae4ad28f0acf6:
    english: "### Round-by-round details"
    translation: "### Körről körre részletek"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3d907145fd075144:
    english: 'Expand **Round-by-round details** to see vote transfers and eliminations. Each row is a candidate and each column is a counting round:'
    translation: 'Nyisd meg a **Körről körre részletek** szakaszt a szavazatok átruházásának és a jelöltek kiesésének megtekintéséhez. Minden sor egy jelöltet, minden oszlop egy számlálási fordulót jelöl:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cc37217cd681fabe:
    english: The green highlight shows when a candidate was elected, red shows when they were eliminated, and orange shows when they tied.
    translation: A zöld kiemelés a jelölt megválasztását, a piros a kiesését, a narancssárga pedig a döntetlent jelzi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ed4aaa0a898906fd:
    english: "## Exporting ballots"
    translation: "## Szavazólapok exportálása"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c96d54ebfbedae32:
    english: After the election closes, people who can view the results can export the ballots in BLT format for an independent recount or audit. The export contains candidate rankings and combines identical rankings into a single row with a ballot count. For anonymous elections it does not contain voter identities, ballot identifiers, submission times, or submission order.
    translation: A választás lezárása után az eredmények megtekintésére jogosultak BLT-formátumban exportálhatják a szavazólapokat független újraszámláláshoz vagy ellenőrzéshez. Az export tartalmazza a jelöltek rangsorolását, az azonos rangsorokat pedig egyetlen sorba vonja össze a hozzájuk tartozó szavazólapok számával. Névtelen választás esetén nem tartalmazza a szavazók személyazonosságát, a szavazólapok azonosítóit, a beküldés időpontját vagy sorrendjét.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
