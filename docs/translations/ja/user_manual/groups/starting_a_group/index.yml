  e8632dbb628c7c7d:
    english: "# Starting a new group"
    translation: "# 新しいグループを始める"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2a4a6907d4e2049d:
    english: If you are new to Loomio, you can start a group on a free trial at any time from the [Loomio website](https://www.loomio.com/). If you already use Loomio and would like to start a new group for another organization or purpose, you can do this from the sidebar menu - click on **New group**.
    translation: Loomioを初めて使う場合は、[Loomioのウェブサイト](https://www.loomio.com/)からいつでも無料トライアルでグループを始められます。すでにLoomioを使っていて、別の組織や目的のために新しいグループを作る場合は、サイドバーメニューの**新しいグループ**をクリックします。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  10e8756c96038e58:
    english: For many organizations, a single Loomio group is sufficient. You can start as many subgroups as you need within the group. See [Subgroups](/en/user_manual/groups/subgroups/) for more info.
    translation: 多くの組織では、Loomioのグループは1つで十分です。その中に必要な数のサブグループを作れます。詳しくは[サブグループ](/en/user_manual/groups/subgroups/)をご覧ください。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
