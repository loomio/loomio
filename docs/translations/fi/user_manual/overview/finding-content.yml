  29cbb6f48ca978fa:
    english: The Search button in the top navigation bar opens global search from any page in Loomio.
    translation: Yläreunan navigointipalkin Hakupainikkeella voit hakea sisältöä miltä tahansa Loomion sivulta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6286c9b6f2b16fc4:
    english: Search includes content you can access across all your groups and direct discussions. It can find discussion titles and context, comments, polls, votes, and outcomes.
    translation: Haku kattaa sisällön, johon sinulla on pääsy kaikissa ryhmissäsi ja suorissa keskusteluissasi. Voit hakea keskustelujen otsikoita ja kuvauksia, kommentteja, kyselyitä, ääniä ja tuloksia.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c5a77d75258a11e6:
    english: Enter a word or phrase, then press Enter or select the search icon. For example, searching for **bottle** finds Oatmilk Cooperative content containing that word.
    translation: Kirjoita sana tai ilmaus ja paina Enter-näppäintä tai valitse hakukuvake. Esimerkiksi haku sanalla **bottle** löytää Oatmilk Cooperativen sisältöä, jossa sana esiintyy.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1b93fd8aaf142d37:
    english: "### Search tips"
    translation: "### Hakuvinkkejä"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  99f906ecbde3a538:
    english: "- Start with one or two distinctive words from the title or content you remember.\n- Search matches the beginning of a word, so a partial word such as **bott** can match **bottle**. \n- It will compensate for misspellings when results for the given query are very few.\n- Use the filters to limit results to an organization, subgroup, tag, or content type such as comments or polls.\n- Sort by **Best match** when relevance matters, or by newest or oldest when you know roughly when the content was posted."
    translation: "- Aloita yhdellä tai kahdella erottuvalla sanalla muistamastasi otsikosta tai sisällöstä.\n- Haku tunnistaa sanan alun, joten esimerkiksi **bott** voi löytää sanan **bottle**. \n- Jos hakutuloksia on hyvin vähän, haku ottaa huomioon myös kirjoitusvirheet.\n- Rajaa tuloksia suodattimilla organisaation, alaryhmän, tunnisteen tai sisältötyypin, kuten kommenttien tai kyselyiden, mukaan.\n- Järjestä tulokset valinnalla **Paras ottelu**, kun haluat osuvimmat tulokset ensin. Jos tiedät suunnilleen, milloin sisältö julkaistiin, järjestä tulokset uusimmasta tai vanhimmasta alkaen."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e7c532f120c4807d:
