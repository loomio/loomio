---
navigation_title: Підбиття підсумків
blocks:
  b2d8fb17fce5a4a3:
    english: "# Concluding"
    translation: "# Підбиття підсумків"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4e03229937f959ed:
    english: "## Outcomes & Next Steps"
    translation: "## Висновки та наступні кроки"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  eaf0fe98db301c7f:
    english: 'Confirming the outcome can be critical to feel like the goals of a collaborative discussion have been achieved. A facilitator can pull together what’s been decided and reflect it back, to help the group walk away with the answers to some key questions:'
    translation: 'Підтвердження висновку допомагає зрозуміти, чи досягло спільне обговорення своєї мети. Фасилітатор може узагальнити ухвалені рішення та представити їх групі, щоб кожен отримав відповіді на важливі запитання:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  00ed94f662c9643a:
    english: |-
      * What did we do?
      * What does it mean?
      * What will happen now?
      * What is my responsibility?
      * What will be different because we went through this experience?
    translation: |-
      * Що ми зробили?
      * Що це означає?
      * Що відбудеться далі?
      * За що я відповідаю?
      * Що зміниться завдяки цьому досвіду?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0f9ecf512b4990b7:
    english: Sometimes the answers to these questions are very concrete, such as action points, while other times they are more abstract, such as deepening shared understanding.
    translation: Іноді відповіді цілком конкретні, наприклад перелік завдань. Інколи вони стосуються менш відчутних змін, як-от глибшого спільного розуміння.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aabfa9d842af2688:
    english: On Loomio
    translation: У Loomio
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a63bbb12b1a1e04c:
    english: |-
      * [Outcomes](/en/user_manual/polls/outcomes/) are a very important tool. A proposal ending is not quite the end: there’s a need to sum up conclusively. That's what the outcome feature is for.
      * Many Loomio discussions come to a natural end without even using proposals or publishing outcomes. These discussions still provide a lot of value, and it can be helpful to update the context box with an outcome summary for later reference.
      * If specific people have action points, you can @mention their names and they will be notified.
    translation: |-
      * [Висновки](/en/user_manual/polls/outcomes/) — важливий інструмент. Завершення пропозиції ще не означає завершення роботи: потрібно підбити підсумок. Для цього й призначена функція висновку.
      * Багато обговорень у Loomio природно завершуються без пропозицій чи опублікованих висновків. Вони також мають цінність. Щоб до них було зручно повертатися, можна додати стислий висновок у поле контексту.
      * Якщо певні люди відповідають за наступні кроки, ви можете згадати їх через @, і вони отримають сповіщення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  55a9b345194f80d6:
    english: "## Reporting & Harvesting"
    translation: "## Звітування та збереження напрацювань"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fc6ee28887dd5ab1:
    english: To understand the meaning of an experience, you have to inquire into how it fits into the bigger context. What was this moment, in the bigger rhythm of our progress? What form will our understanding from this experience take — a story, a report, a change, a call to action?
    translation: Щоб зрозуміти значення досвіду, погляньте на нього в ширшому контексті. Яке місце він посідає в поступі групи? Як зберегти здобуте розуміння — у вигляді історії, звіту, зміни чи заклику до дії?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  eb2cdc1c6526e053:
    english: The experience happens in the moment, but its impact often comes from putting handles on it, giving it a name, and being able to use it and refer to it. Otherwise you risk forgetting, leaving people out who weren't there, or having to repeat it later. Productive collaboration is often helped by tangible documentation or reporting.
    translation: Досвід виникає в певний момент, але його вплив часто залежить від того, чи можете ви його описати, назвати й використати надалі. Інакше можна забути важливе, не залучити тих, хто не був присутній, або згодом повторювати ту саму роботу. Документація та звіти допомагають зберегти результати спільної роботи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4104d8b917a87b0e:
    english: |-
      * Loomio is self-documenting — notes write themselves as an integrated part of the process. This creates a gold-mine of archival content for groups, without any extra effort.
      * We have some features to support harvesting and archiving: the search function, the “previous decisions” list, and the print discussion option.
      * Premium plans offer the option to export all your group's Loomio data.
      * Many groups use Loomio to integrate content from various channels. For example, posting a meeting announcement and building the agenda on Loomio, having the meeting in person, posting the notes back on Loomio, and making related decisions in the same thread. This expands the “self-harvesting” ability of Loomio beyond the online space.
    translation: |-
      * У Loomio записи створюються під час самої роботи. Так група без додаткових зусиль накопичує архів матеріалів.
      * Знаходити й зберігати напрацювання допомагають пошук, список попередніх рішень і можливість роздрукувати обговорення.
      * Платні плани дають змогу експортувати всі дані вашої групи з Loomio.
      * Багато груп використовують Loomio, щоб зібрати матеріали з різних каналів. Наприклад, можна оголосити про зустріч і скласти порядок денний у Loomio, провести зустріч особисто, опублікувати там нотатки й ухвалити пов’язані рішення в тій самій темі. Так у Loomio зберігаються напрацювання не лише з онлайн-спілкування.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dae98cfd5f14b034:
    english: "## Turning Discussion into Action"
    translation: "## Від обговорення до дії"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a39a66938d6cadb0:
    english: There comes a moment when you have to re-engage with the reality outside the room. Occasionally, the need is simply to work with ideas and feelings, without worrying about implementation. But usually a group will not reach its goals without applying its conclusions to real-world action. This transition is part of the total facilitated experience.
    translation: Настає момент повернутися до справ поза обговоренням. Іноді достатньо попрацювати з ідеями та почуттями, не думаючи про їх втілення. Але зазвичай група досягає мети, коли втілює свої висновки в діях. Цей перехід також потребує уваги фасилітатора.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3e26f1939ffe69fe:
    english: 'It’s at this point that a collaborative process intersects with other organizational systems, and the facilitator has to help figure out how it will work. These other systems might include:'
    translation: 'На цьому етапі спільна робота перетинається з іншими процесами організації. Фасилітатор допомагає з’ясувати, як вони поєднуватимуться. Варто розглянути такі питання:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cb030c5876714643:
    english: |-
      * **Power** — Who actually makes decisions? What has to happen for ideas to turn into reality here?
      * **Management** — How does this fit into other priorities? What dependencies might exist?
      * **Delegation** — Who will take responsibility for next steps? Will they be held accountable?
      * **Communication** — How will this process or discussion be relayed to others? What do they need to know?
      * **Administration** — How will information from one system be input into another, such as a task tracking or communications tool? Where will information be stored?
    translation: |-
      * **Повноваження** — Хто насправді ухвалює рішення? Що потрібно, аби втілити ідеї?
      * **Управління** — Як це узгоджується з іншими пріоритетами? Від чого залежить виконання?
      * **Розподіл обов’язків** — Хто відповідатиме за наступні кроки? Як перевірятимуть їх виконання?
      * **Комунікація** — Як розповісти іншим про цей процес або обговорення? Що їм потрібно знати?
      * **Адміністрування** — Як перенести інформацію до інших систем, наприклад інструмента для відстеження завдань чи комунікації? Де вона зберігатиметься?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5fd6382726e6e5c0:
    english: If there are any blocks around these issues, it can be damaging to leave this realisation until the moment of conclusion. For example, if the participants don’t actually have the power to make a change they have decided, they will feel defeated.Think ahead toward confronting reality when setting up the process, and scope the collaboration accordingly.
    translation: Якщо на шляху виникнуть перешкоди, краще дізнатися про них до завершення процесу. Наприклад, учасники можуть розчаруватися, якщо не мають повноважень здійснити погоджену зміну. Врахуйте такі обмеження, коли плануєте процес, і відповідно визначте межі спільної роботи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c3f96d2ea17ab236:
    english: |-
      * You can @mention the names of people who will take actions out of a decision.
      * Many users accomplish integrating Loomio content into other organizational systems through other channels like reviewing Loomio decisions in regular offline meetings, or transferring outcomes to their task tracking process.
      * Making an explicit decision naturally leads people to ask, “OK, but how are we going to take this forward?”
      * Forming a Loomio group often surfaces important questions like, “Who needs to participate here to turn these decisions into action?” If you're missing key stakeholders, leaders, or administrators, you'll get stuck.
    translation: |-
      * Ви можете згадати через @ людей, які виконуватимуть дії за підсумками рішення.
      * Багато користувачів пов’язують роботу в Loomio з іншими процесами організації: наприклад, переглядають рішення Loomio на регулярних особистих зустрічах або переносять висновки до системи відстеження завдань.
      * Чітко сформульоване рішення природно викликає запитання: «Гаразд, як ми будемо діяти далі?»
      * Створення групи в Loomio часто допомагає поставити важливе запитання: «Хто має долучитися, щоб утілити ці рішення?» Без ключових зацікавлених осіб, керівників або адміністраторів робота може зупинитися.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  60bb517775f11e5d:
    english: "## It Ain’t Over Til It’s Over"
    translation: "## Доведіть процес до завершення"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '079da8800a401a45':
    english: Ending well is important. There’s a ritual to closing a process, and if it’s missed people will feel unsettled. Sometimes the end is determined by running out of time, and sometimes it’s when certain goals are achieved. Recognize implicit and explicit cues indicating if the individuals, and the group as a whole, can feel completion of a process or phase.
    translation: Важливо належно завершити процес. Якщо не позначити його завершення, в учасників може залишитися відчуття незавершеності. Іноді процес закінчується, коли спливає час, а іноді — коли досягнуто певної мети. Звертайте увагу на прямі й непрямі ознаки того, що окремі учасники та вся група готові завершити процес або його етап.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  280969e6212842cc:
    english: Participants often look to the leader or facilitator for confirmation of when it’s actually over, and it usually pays to be explicit. Sometimes the signal is a clear statement that the session is wrapping up, a recap of decisions or next steps, and bidding everyone goodbye. Other times groups have established practices like a check-out. Letting a session vaguely trail off will leave a bad taste.
    translation: Учасники часто чекають від керівника чи фасилітатора підтвердження, що роботу завершено. Зазвичай краще сказати про це прямо. Можна оголосити про завершення зустрічі, коротко повторити рішення й наступні кроки та попрощатися. Деякі групи мають власний спосіб завершення, наприклад заключне коло. Якщо зустріч закінчиться без чіткого підсумку, може залишитися відчуття незавершеності.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e15896aadc163225:
    english: |-
      * The clearest indication of conclusion on Loomio is publishing a decision outcome.
      * Some groups use the [lock thread](/en/user_manual/discussions/using_discussions/#lock-or-unlock-a-thread) feature to prevent further changes and reduce clutter.
      * Deactivating a group is the strongest possible “closure” move. No one can say anything else after that.
      * Since Loomio groups can remain while group activity goes up and down, it can be useful to recognize milestones like the conclusion of a particular phase, even if the group will reactivate in the future.
    translation: |-
      * Найчіткіша ознака завершення в Loomio — опублікований висновок щодо рішення.
      * Деякі групи використовують функцію [блокування теми](/en/user_manual/discussions/using_discussions/#lock-or-unlock-a-thread), щоб запобігти подальшим змінам і зменшити кількість зайвих повідомлень.
      * Деактивація групи остаточно закриває її: після цього ніхто не зможе додати нові повідомлення.
      * Група Loomio може існувати й тоді, коли її активність то зростає, то спадає. Тому корисно позначати важливі віхи, зокрема завершення певного етапу, навіть якщо згодом група відновить роботу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
