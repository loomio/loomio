    translated_on: '2026-09-30'
  828de256c39d112c:
    english: Loomio complements chat, shared documents, and task-management tools rather than replacing every kind of work.
    translation: Loomio vult chat, gedeelde documenten en tools voor taakbeheer aan. Je hoeft niet al het werk in Loomio te doen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ad42655c9ef79337:
    english: |-
      | Work | Suggested tool |
      |---|---|
      | Quick questions, social conversation, and timely updates | Chat |
      | Collaborative editing of a living document | Shared document |
      | Assigning and tracking tasks | Project or task-management tool |
      | Important topic-based discussion, broad participation, decisions, and outcomes | Loomio |
    translation: |-
      | Werk | Aanbevolen tool |
      |---|---|
      | Korte vragen, informele gesprekken en actuele updates | Chat |
      | Samen een document bewerken dat steeds wordt bijgewerkt | Gedeeld document |
      | Taken toewijzen en bijhouden | Tool voor project- of taakbeheer |
      | Belangrijke discussies over een onderwerp, brede deelname, besluiten en conclusies | Loomio |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  40e853f5116f28eb:
    english: Put work in Loomio when people need time to consider a topic, when everyone affected should have a meaningful opportunity to participate, or when the group will need to find the discussion and decision later. Link to the relevant document or task from the Loomio discussion so its context remains easy to find.
    translation: Gebruik Loomio wanneer mensen tijd nodig hebben om over een onderwerp na te denken, wanneer iedereen die erbij betrokken is de kans moet krijgen om mee te doen, of wanneer de groep de discussie en het besluit later moet kunnen terugvinden. Voeg in de Loomio-discussie een link toe naar het relevante document of de taak, zodat de context makkelijk te vinden blijft.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
