name: manual screenshots

on:
  workflow_dispatch:
    inputs:
      locales:
        description: Published languages, comma-separated, or all
        default: all
        required: true
        type: string
      path:
        description: Image or manual directory to regenerate (blank for all)
        required: false
        type: string

permissions:
  contents: read

jobs:
  languages:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      locales: ${{ steps.locales.outputs.locales }}
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.5'
      - id: locales
        env:
          SCREENSHOT_LOCALES: ${{ inputs.locales }}
        run: |
          ruby -rjson -ryaml -e '
            published = YAML.safe_load_file("docs/locales.yml").select { |_, locale| locale.fetch("published") }.keys
            selected = ENV.fetch("SCREENSHOT_LOCALES")
            locales = selected == "all" ? published : selected.split(",").map(&:strip).uniq
            abort "Select published languages: #{published.join(",")}" if locales.empty? || (locales - published).any?
            puts "locales=#{locales.to_json}"
          ' >> "$GITHUB_OUTPUT"

  screenshots:
    needs: languages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        locale: ${{ fromJSON(needs.languages.outputs.locales) }}
    concurrency:
      group: manual-screenshots-${{ matrix.locale }}
      cancel-in-progress: false
    env:
      PGDATABASE: loomio_test
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      RAILS_ENV: test
      E2E_PORT: 3001
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: nanasess/setup-chromedriver@v2
      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick libvips
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.5'
          bundler-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Install npm
        run: npm install --global "npm@$(cat .npm-version)" --no-audit --no-fund
      - name: Install client dependencies
        working-directory: vue
        run: npm ci --no-audit --no-fund
      - name: Install realtime server dependencies
        working-directory: hocuspocus
        run: npm ci --no-audit --no-fund
      - name: Configure the isolated test database
        run: cp config/database.yml.postgresql config/database.yml
      - name: Generate selected screenshots and publish to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MANUAL_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MANUAL_R2_SECRET_ACCESS_KEY }}
          SCREENSHOT_LOCALE: ${{ matrix.locale }}
          SCREENSHOT_PATH: ${{ inputs.path }}
        run: bash script/ci_manual_screenshots "$SCREENSHOT_LOCALE" "$SCREENSHOT_PATH"
      - name: Save failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: manual-screenshot-failure-${{ matrix.locale }}
          path: |
            vue/tests/reports/
            vue/tests/screenshots/
            log/test.log
