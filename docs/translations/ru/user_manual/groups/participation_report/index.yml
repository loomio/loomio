  519237662235d020:
    english: |-
      ### Actions per user
      Understand who are the most and least active contributors in your group.
    translation: |-
      ### Действия по пользователям
      Посмотрите, кто в вашей группе участвует наиболее и наименее активно.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b538bd1f65e69d28:
    english: This table shows how many threads, comments, polls, votes and reactions each user in the specified groups was responsible for during the time frame. Click specific headings in the table to sort the table by that column.
    translation: Таблица показывает, сколько обсуждений, комментариев, опросов, поданных голосов и реакций приходится на каждого пользователя выбранных групп за указанный период. Нажмите заголовок столбца, чтобы отсортировать таблицу по нему.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7d416ad780b3ca85:
    english: Turn on **Delegates only** to show people who are currently delegates in any of the selected groups. Their activity and voting record are aggregated across all selected groups, and delegates with no activity during the selected period remain in the table. The CSV download uses the same filter.
    translation: Включите **Только для делегатов**, чтобы показать тех, кто сейчас является делегатом хотя бы в одной из выбранных групп. Их действия и сведения о голосовании суммируются по всем выбранным группам. Делегаты, которые не проявляли активности за выбранный период, также остаются в таблице. При скачивании CSV применяется тот же фильтр.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  12baf5af62638134:
    english: "![Actions per delegate showing three levels of participation](group_participation_report_actions_per_user.png)"
    translation: "![Действия делегатов с тремя уровнями участия](group_participation_report_actions_per_user.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1650f708482b4789:
    english: "### Voting record per user"
    translation: "### Сведения о голосовании по пользователям"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e6670b54039f316a:
    english: Compare the number of votes issued to each person with the number they cast, see missed votes, and identify people who cast every vote issued to them. A person with no issued votes is not shown as having cast all votes. Anonymous polls are excluded because an anonymous ballot must not be associated with the person who cast it.
    translation: 'Сравните количество голосов, предоставленных каждому человеку, с количеством поданных им голосов. Посмотрите, какие голосования он пропустил и кто проголосовал во всех доступных ему опросах. Если человеку не предоставляли право голоса, отчёт не показывает, что он проголосовал во всех опросах. Анонимные опросы исключены: анонимный бюллетень нельзя связывать с человеком, который его подал.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  252da2b72775c4f8:
    english: Use **Delegates only** to review the voting record of current delegates. The CSV download uses the same name and delegate filters.
    translation: Используйте **Только для делегатов**, чтобы просмотреть сведения о голосовании действующих делегатов. При скачивании CSV применяются те же фильтры по имени и статусу делегата.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
