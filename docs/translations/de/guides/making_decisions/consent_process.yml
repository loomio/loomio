  3cc3304a15bc3d2f:
    english: In the Consent process, an objection is defined as something that **might cause harm to the team or organization**.
    translation: Im Einwilligungsprozess ist ein Einwand ein Hinweis darauf, dass etwas **dem Team oder der Organisation schaden könnte**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ab509ea088e16a0d:
    english: |-
      Objections should meet this criteria to be valid:
      - Explicit: *I can make a reasoned case*
      - Impersonal: *It's not just a personal preference*
      - Evidenced: *Not predictive, based on experience*
      - Not 'safe to fail': *It's not that I have a 'better idea'*
    translation: |-
      Ein begründeter Einwand sollte diese Kriterien erfüllen:
      - Konkret: *Ich kann ihn nachvollziehbar begründen*
      - Sachlich: *Es geht nicht nur um eine persönliche Vorliebe*
      - Auf Erfahrung gestützt: *Er beruht nicht bloß auf einer Vermutung*
      - Nicht gefahrlos auszuprobieren: *Es geht nicht darum, dass ich eine „bessere Idee“ habe*
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
