  a29c1c76443ad97f:
    english: Good governance is more than a board meeting, it requires good communication before and after meetings.
    translation: Належнае кіраванне не абмяжоўваецца пасяджэннем рады. Яно патрабуе добрай камунікацыі да і пасля пасяджэнняў.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9f05171a74ac30d0:
    english: |-
      This guide is intended to help you use Loomio in your board or committee, so you can stay connected between meetings, deal with urgent matters and reduce board admin.
      - Continue governance between meetings
      - Keep track of communications
      - Use board meetings for issues that matter
      - Preserve institutional memory with a detailed record
    translation: |-
      Гэты дапаможнік пакажа, як выкарыстоўваць Loomio ў радзе або камітэце, каб падтрымліваць сувязь паміж пасяджэннямі, вырашаць тэрміновыя пытанні і скараціць адміністрацыйную працу.
      - Працягвайце працу рады паміж пасяджэннямі
      - Захоўвайце гісторыю абмеркаванняў
      - Прысвячайце пасяджэнні важным пытанням
      - Захоўвайце гісторыю працы арганізацыі ў падрабязных запісах
