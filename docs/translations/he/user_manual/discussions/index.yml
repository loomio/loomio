navigation_title: דיונים
blocks:
  f087c06a5f4ab2e6:
    english: "# Intro to Discussions"
    translation: "# מבוא לדיונים"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f515c87a8d1d20c7:
    english: Loomio discussions are where you can share information, discuss topics, and make decisions with your group.  People participate by posting comments and replies.
    translation: בדיונים בלומיו ניתן לשתף מידע, לדון בנושאים ולקבל החלטות בקבוצה. המשתתפים מוסיפים הערות ותגובות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eede89b6ce4f357d:
    english: |-
      - All info about a topic is in one easily accessible place.
      - People can reply via email and their comments appear in the discussion.
      - You can see who has read the discussion and who needs a nudge.
      - There is a record of discussion you can easily find again.
    translation: |-
      - כל המידע על נושא מרוכז במקום אחד ונגיש בקלות.
      - ניתן להשיב בדוא״ל, והתגובות מופיעות בדיון.
      - ניתן לראות מי קרא את הדיון ולמי כדאי לשלוח תזכורת.
      - תיעוד הדיון נשמר ואפשר למצוא אותו שוב בקלות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9cb2eb404b59208b:
    english: Discussions have a wide range of uses - from a general discussion forum to running specific work-flow and decision-making processes.
    translation: אפשר להשתמש בדיונים למטרות רבות, מפורום כללי ועד לניהול תהליכי עבודה וקבלת החלטות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  87a95605052570ca:
    english: For example, you may frame a discussion on a particular topic, invite people to contribute their thoughts and share information, and facilitate progress towards an agreed outcome.
    translation: לדוגמה, ניתן לפתוח דיון בנושא מסוים, להזמין אנשים לשתף מחשבות ומידע ולקדם הסכמה על מסקנה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ce6e6734c595d968:
    english: Or you may invite people to participate in a particular decision, using a consent or advice decision-making process.
    translation: אפשר גם להזמין אנשים להשתתף בהחלטה מסוימת באמצעות תהליך קבלת החלטות המבוסס על הסכמה או על התייעצות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7fa58cb3ba95be0b:
    english: Discussions can also contain polls and proposals to help progress a discussion to an outcome. As people comment in the discussion and vote in polls, a discussion timeline builds so you can easily find key milestones.
    translation: דיונים יכולים לכלול גם משאלים והצעות, שמסייעים לקדם את הדיון למסקנה. ככל שאנשים מוסיפים תגובות ומצביעים במשאלים, נבנה ציר זמן של הדיון שבו קל למצוא אבני דרך מרכזיות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  388e829e86a99bd8:
    english: "![The Returnable bottles for cafe customers discussion, with a comment and a proposal](discussion-example.png)"
    translation: "![הדיון על בקבוקים להחזרה ללקוחות בית הקפה, עם תגובה והצעה](discussion-example.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6b0556376d31b63e:
    english: "## Common uses"
    translation: "## שימושים נפוצים"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cf4344b3f2a3b7e9:
    english: 'Here are some common uses of discussions:'
    translation: 'אלה כמה שימושים נפוצים בדיונים:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '0479bd2337b02443':
    english: "### Boards and Governance"
    translation: "### ועדות מנהלות וממשל ארגוני"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5b0a3e2c653d47f8:
    english: "**Prepare for a meeting** - Build an agenda, post board papers and organize administrative matters so everyone is up to date, in context and prepared. "
    translation: "**תתכוננו לפגישה** - להכין סדר יום, לפרסם מסמכים לוועדה המנהלת ולארגן עניינים מנהליים, כדי שכל המשתתפים יכירו את הרקע ויגיעו מוכנים."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5c1c6aa79c3556dc:
    english: "**Pass a resolution** - Post context and background information, respond to questions and raise a proposal to pass a resolution. "
    translation: "**להעביר החלטה** - לפרסם הקשר ומידע רקע, להשיב לשאלות ולהעלות הצעה להעברת החלטה."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  07ae9c6a1f0a32d0:
    english: "**Discuss an agenda item on Loomio** - Start discussion about an agenda item prior to your meeting. Or, if you run out of time in the meeting, move the discussion on to Loomio."
    translation: "**דיון בסעיף מסדר היום בלומיו** - להתחיל לדון בסעיף מסדר היום לפני הפגישה. אם לא נותר זמן במהלך הפגישה, אפשר להמשיך את הדיון בלומיו."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f0b0de7094b1cfc9:
    english: "**Approve minutes and track actions** - Post minutes and assign actions. Use a poll to approve minutes. "
    translation: "**אישור פרוטוקול ומעקב אחר משימות** - לפרסם פרוטוקול ולהקצות משימות. אפשר להשתמש במשאל כדי לאשר את הפרוטוקול."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ba7cf177191baadb:
    english: "### Member participation"
    translation: "### השתתפות חברי הקבוצה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3cf51f837c0a3e9f:
    english: "**Share news (replace mailing list)** - Post information for members, invite comments."
    translation: "**שיתוף עדכונים (במקום רשימת תפוצה)** - לפרסם מידע לחברי הקבוצה ולהזמין תגובות."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d2cd391b61042129:
    english: "**Organize an event** - Work with your organizing team on details. Keep all discussion and info within the thread. Then announce the event to wider membership."
    translation: "**ארגון אירוע** - לתאם את הפרטים עם צוות הארגון. לשמור את כל הדיון והמידע בשרשור. לאחר מכן להודיע על האירוע לכלל חברי הקבוצה."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cf59a44a8643cc96:
    english: "**Develop a policy** - Post a policy draft, seek member feedback and input, finalize and ratify the policy."
    translation: "**גיבוש מדיניות** - לפרסם טיוטת מדיניות, לבקש משוב והצעות מחברי הקבוצה, להשלים את הנוסח ולאשר את המדיניות."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6ddec467576426ca:
    english: "**General Assembly** - Organize, prepare and run a formal meeting including all members, to deliberate and make decisions on strategic matters."
    translation: "**אספה כללית** - לארגן, להכין ולקיים פגישה רשמית של כל חברי הקבוצה, כדי לדון בעניינים אסטרטגיים ולקבל החלטות."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8d32bb446c4ca025:
    english: "### Self-organizing working teams"
    translation: "### צוותי עבודה בניהול עצמי"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  87ab6b2d51a7c1b6:
    english: "**Share information** - Post information and reports of interest to your team, invite comment and discussion."
    translation: "**שיתוף מידע** - לפרסם מידע ודוחות שמעניינים את הצוות ולהזמין תגובות ודיון."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e93205aa183cd1e0:
    english: "**Progress work** - Outline a work task and seek advice, input and feedback from team members through to completion."
    translation: "**קידום העבודה** - לתאר משימה ולבקש עצות, רעיונות ומשוב מחברי הצוות עד להשלמתה."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1ddaef5d44653691:
    english: "**Meeting notes and actions** - Post meeting notes as a record of discussion, and follow up on tasks. "
    translation: "**סיכומי פגישות ומשימות** - לפרסם סיכומי פגישות כתיעוד של הדיון ולעקוב אחר המשימות."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8ce9169d72c90788:
    english: "**Explore ideas** - Share thoughts and invite discussion about a concern you notice, or an improvement that can be made."
    translation: "**בחינת רעיונות** - לשתף מחשבות ולהזמין דיון על בעיה שזוהתה או על שיפור אפשרי."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a06e734e86f07828:
    english: "**Advice, Consent and Generative decision making** - Prepare, propose, clarify, respond to reactions and objections, agree and implement - all within a Loomio discussion."
    translation: "**קבלת החלטות בהתייעצות, בהסכמה ובפיתוח משותף** - להכין, להציע, להבהיר, להשיב לתגובות ולהתנגדויות, להגיע להסכמה וליישם, הכול במסגרת דיון בלומיו."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
