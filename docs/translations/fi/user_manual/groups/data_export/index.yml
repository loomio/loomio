  a1b7f7b282933a3c:
    english: 'You must be an admin of the group to export it. The JSON export includes:'
    translation: 'Sinun on oltava ryhmän ylläpitäjä, jotta voit viedä sen tiedot. JSON-vienti sisältää:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6a0b307d50fa35cf:
    english: |-
      - The group, its members and membership requests
      - Threads, comments, reactions, tags, templates, notifications and related records from the included groups
      - Polls, options, votes and outcomes; an anonymous poll is included only after it has closed
      - Subgroups you belong to
      - Open and closed subgroups when you export their parent group as a parent group admin, even if you do not belong to those subgroups
      - References to files and images attached to the included content
    translation: |-
      - Ryhmän, sen jäsenet ja liittymispyynnöt
      - Mukaan sisältyvien ryhmien keskustelut, kommentit, reaktiot, tunnisteet, mallipohjat, ilmoitukset ja niihin liittyvät tiedot
      - Kyselyt, vastausvaihtoehdot, äänet ja johtopäätökset; nimetön kysely sisältyy vientiin vasta sen sulkeuduttua
      - Alaryhmät, joihin kuulut
      - Avoimet ja suljetut alaryhmät, kun viet emoryhmän tiedot sen ylläpitäjänä, vaikka et kuuluisi näihin alaryhmiin
      - Viittaukset mukaan sisältyvään sisältöön liitettyihin tiedostoihin ja kuviin
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4dee92f966ec24c9:
    english: 'The JSON export does not include:'
    translation: 'JSON-vienti ei sisällä:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a40deeed41d9937e:
    english: |-
      - Secret subgroups you do not belong to, including their membership and content
      - Subgroups awaiting deletion
      - Anonymous polls that have not closed
      - Direct threads and polls that do not belong to the group
    translation: |-
      - Salaisia alaryhmiä, joihin et kuulu, eikä niiden jäsenyyksiä tai sisältöä
      - Poistoa odottavia alaryhmiä
      - Nimettömiä kyselyjä, jotka eivät ole sulkeutuneet
      - Suoria keskusteluja ja kyselyjä, jotka eivät kuulu ryhmään
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d789fbf93f8cebeb:
