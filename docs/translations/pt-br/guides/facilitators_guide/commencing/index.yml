    translated_on: '2026-09-30'
  0ce0604bb021d98f:
    english: "## Invitation"
    translation: "## Convite"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d5fabca3934dafd:
    english: How participants are invited into a facilitated space is incredibly important. People understand huge amounts of information from the invitation, and use it to judge how a space will be held and if they belong there. The moment of invitation is in many ways the defining opportunity to set the tone and establish trust.
    translation: A forma de convidar participantes para um espaço de diálogo facilitado é muito importante. O convite transmite muitas informações. Com base nele, as pessoas avaliam como o espaço será conduzido e se há lugar para elas. O momento do convite é uma oportunidade decisiva para definir o tom e estabelecer confiança.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a8d7e10a50432195:
    english: |-
      > <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../rich_200.png"> Decision making is all about communication: your group can only make good decisions together if there’s a foundation of good communication in place first. This means being clear about what the purpose of a discussion or meeting is, who needs to be involved, what the time-frame is, and what people can expect.
      >
      > — Richard Bartlett
    translation: |-
      > <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../rich_200.png"> Tomar decisões depende de comunicação. Seu grupo só consegue tomar boas decisões em conjunto quando existe uma boa base de comunicação. Isso significa deixar claro o propósito da discussão ou reunião, quem precisa participar, qual é o prazo e o que as pessoas podem esperar.
      >
      > — Richard Bartlett
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ab260e60bf87a11d:
    english: 'Key aspects to an invitation:'
    translation: 'Aspectos importantes de um convite:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ff258493e21d7f3a:
    english: |-
      * **Background.** What is this thing? What am I being asked to do? Who is behind this? Who else will be involved? What is the time commitment, topic focus, and protocol?
      * **Context.** What is the character of this specific engagement? Of all the possible formats and ways it could go, which one will it be? Why now, why this way?
      * **Belonging.** Am I welcome? Is this for me? Am I needed in this process? What is my unique value and contribution? Why should I specifically be compelled?
      * **Safety.** Does this invitation indicate thoughtfulness, trust, and understanding? Is the structure of the engagement up to handling the inherent power dynamics at play? What level of honesty or vulnerability will this require of me? Do I think the person inviting is going to hold me well?
      * **Accessibility.** Will my basic requirements for participation be accommodated? Language, assistive technology, unfamiliar jargon, etc. Will it be possible for me to engage?
    translation: |-
      * **Informações básicas.** Do que se trata? O que estão me pedindo para fazer? Quem está por trás da iniciativa? Quem mais vai participar? Quanto tempo precisarei dedicar? Qual é o tema e como será o processo?
      * **Contexto.** Como será esta participação específica? Entre os formatos e caminhos possíveis, qual foi escolhido? Por que agora e por que dessa forma?
      * **Pertencimento.** Sou bem-vindo? Este espaço é para mim? Minha participação é necessária? Que contribuição posso oferecer? Por que vale a pena participar?
      * **Segurança.** O convite demonstra cuidado, confiança e compreensão? A estrutura do processo consegue lidar com as relações de poder envolvidas? Quanto de honestidade ou vulnerabilidade será exigido de mim? Confio que a pessoa que convida vai cuidar bem desse espaço?
      * **Acessibilidade.** Minhas necessidades básicas para participar serão atendidas? Isso inclui idioma, tecnologia assistiva e explicações para termos desconhecidos. Conseguirei participar?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aabfa9d842af2688:
    english: On Loomio
    translation: No Loomio
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8a87ed2ddb6c659f:
    english: |-
      * The tool has a built-in function to [invite users](/en/user_manual/groups/inviting_people/) by email or by sending them a special link. Users can also request to join your group if your settings allow.
      * The invitation tools built into the software are very basic, and getting an unexpected login request for new software without context isn't very inviting, so group creators often introduce people to the idea of Loomio through a separate process.
      * Many aspects of Loomio are already designed to create a safe and respectful space users would want to enter — such as thoughtful [privacy options](/en/user_manual/groups/starting_a_group/#privacy).
      * The design of the software itself is meant to be friendly, simple, and professional, hopefully putting out a trustworthy vibe.
      * Loomio has accessibility features, for people who use assistive technology like screen readers, and translation features for people who speak different languages. Emphasising these aspects in an invitation can make some people feel more welcome.
    translation: |-
      * O Loomio permite [convidar usuários](/en/user_manual/groups/inviting_people/) por e-mail ou por um link especial. As pessoas também podem solicitar entrada no seu grupo, se as configurações permitirem.
      * Os recursos de convite do software são básicos. Receber sem contexto um pedido inesperado para entrar em um software novo pode causar estranhamento. Por isso, quem cria grupos costuma apresentar o Loomio às pessoas por outros meios antes de enviar o convite.
      * Vários recursos do Loomio ajudam a criar um espaço seguro e respeitoso, no qual as pessoas queiram participar. Entre eles estão as [opções de privacidade](/en/user_manual/groups/starting_a_group/#privacy).
      * O próprio software foi projetado para ser simples, acolhedor e profissional, de modo a transmitir confiança.
      * O Loomio oferece recursos de acessibilidade para quem usa tecnologias assistivas, como leitores de tela, e recursos de tradução para quem fala outros idiomas. Mencionar esses recursos no convite pode ajudar algumas pessoas a se sentirem mais bem-vindas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cb459c1230aaf54c:
    english: "## Arrival"
    translation: "## Chegada"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ef55fa893f9e1034:
    english: The moment of arrival is the “first impression” of an engagement, and sets the trajectory from there on in. The person has accepted an invitation and decided to step in. They are open and expectant, and the impression they get will make a big impact on their experience.
    translation: A chegada é a primeira impressão que a pessoa tem do processo e influencia o que acontece depois. Ela aceitou o convite e decidiu participar. Está aberta à experiência e tem expectativas. A impressão que tiver nesse momento terá grande impacto em sua participação.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  66e7e79597f6a3d0:
    english: |-
      ### Welcoming
      To enable openness to engagement, participation, and receptivity, a person has to feel welcome. They need their existence acknowledged, and to feel a sense of hospitality.
    translation: |-
      ### Acolhimento
      Para se sentir à vontade para participar, se envolver e ouvir, a pessoa precisa se sentir bem-vinda. Ela precisa perceber que sua presença foi reconhecida e que foi recebida com atenção.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b3ce2bd5e2ea9acd:
    english: |-
      ### Settling
      When someone enters a physical room, they want to know where to sit, where the exit is, where to go to the bathroom, and if there is coffee available. They need a basic introduction to the space and their place in it.
    translation: |-
      ### Familiarização
      Ao entrar em uma sala, uma pessoa quer saber onde pode sentar, onde fica a saída, como chegar ao banheiro e se há café. Ela precisa conhecer o espaço e entender seu lugar nele.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d6fd9d29415a172:
    english: |-
      * The group description fields and discussion context box are the main space to put a “welcome message” for people arriving into the space.
      * Take a tour of the Loomio space, tweak things to make yourself comfortable (like [notification settings](/en/user_manual/users/email_settings/) and your [profile photo](/en/user_manual/users/user_profile/).
      * See information how you like using different thread views and options like Recent, Unread, Mute, and Star. Make yourself at home.
    translation: |-
      * Os campos de descrição do grupo e de contexto da discussão são os principais lugares para deixar uma mensagem de boas-vindas a quem chega.
      * Explore o espaço no Loomio e ajuste o que for necessário para se sentir à vontade, como as [configurações de notificação](/en/user_manual/users/email_settings/) e sua [foto de perfil](/en/user_manual/users/user_profile/).
      * Veja as informações da forma que preferir. Experimente diferentes visualizações das conversas e opções como Recentes, Não lidas, Silenciar e Favoritos. Familiarize-se com o espaço.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8acf15fe96515738:
    english: "## Who’s in the Room"
    translation: "## Quem está presente"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  48c4449cd1d9b135:
    english: Introducing yourself and being introduced to others is one of the most basic and most important human social functions. From Māori *mihimihi* to British “how do you do” to Japanese business card exchanges, every culture places a lot of importance on this. It goes beyond practicalities and politeness and touches on a deep human need, which is a prerequisite for comfort, openness, and focus.
    translation: 'Apresentar-se e conhecer outras pessoas é uma das funções sociais humanas mais básicas e importantes. Do *mihimihi* maori ao cumprimento britânico “how do you do” e à troca de cartões de visita no Japão, todas as culturas dão importância a esse momento. Ele vai além das questões práticas e da cortesia: atende a uma necessidade humana profunda, essencial para que as pessoas se sintam à vontade, abertas e concentradas.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a8eec818aeb74e64:
    english: As a facilitator, if you don’t give people a chance to introduce themselves and find out who is around them, they will generally subvert whatever else you’re trying to point their attention at until you allow this process to occur. Consciously design introductions as a feature, and use them as an opportunity to further the overall goals of the interaction.
    translation: Se você facilita um encontro e não dá às pessoas a oportunidade de se apresentar e conhecer quem está por perto, elas geralmente voltam sua atenção a isso, mesmo quando você tenta conduzi-las a outra atividade. Inclua as apresentações no planejamento e use esse momento para contribuir com os objetivos do encontro.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ad3d2a31a23af036:
    english: "### Check in"
    translation: "### Rodada de abertura"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  71d51a259d8b2c35:
    english: Even among groups who already know each other well, this introduction process continues with “checking in” – where everyone has a chance to speak at the beginning of a meeting (often to a question of "what is on top for you", "how are you", or "is there anything preventing you from being present") and other good practices for team cohesion. People have a multitude of identities, which change based on the context. People answer and re-answer “who am I for this moment” all the time, and that is what allows them to orient around one another.
    translation: Mesmo em grupos nos quais as pessoas já se conhecem bem, as apresentações continuam em rodadas de abertura. No início de uma reunião, todos têm a oportunidade de falar, muitas vezes em resposta a perguntas como “O que está ocupando sua atenção?”, “Como você está?” ou “Há algo que dificulte sua presença aqui?”. Essa e outras práticas ajudam a fortalecer os vínculos da equipe. As pessoas têm muitas identidades, que mudam conforme o contexto. Elas respondem repetidamente à pergunta “Quem sou eu neste momento?”, e isso as ajuda a se situarem umas em relação às outras.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0573ae3aef6f1c6c:
    english: People's expression does not occur in a vaccuum, but in the context of who they are. A multi-faceted view of someone’s identity is an essential aspect of interpreting their contributions.
    translation: 'O que uma pessoa expressa não existe isoladamente: está ligado a quem ela é. Conhecer as diferentes dimensões da identidade de alguém é essencial para interpretar suas contribuições.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  86eb005fd168a424:
    english: "> We start many of our meetings with everyone “checking in” before we get to the agenda. These check-ins are focused not on your work tasks, but on how you’re doing as a human being. If you’re going through a rough patch at home, or you’re sick, or you have exciting positive news, understanding your state of mind will help the entire group have the right context to interpret how you’re communicating. — Richard Bartlett"
    translation: "> Começamos muitas de nossas reuniões com uma rodada em que todos dizem como estão, antes de entrar na pauta. O foco não são as tarefas de trabalho, mas como cada pessoa está. Se você está passando por dificuldades em casa, está doente ou tem uma boa notícia para compartilhar, conhecer seu estado de espírito ajuda todo o grupo a entender o contexto em que você se comunica. — Richard Bartlett"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d5aea1c0564ccff8:
    english: |-
      * Create a thread called "Introduce yourself" or "Check in". It provides a useful first _call to action_ everyone coming in will understand.
      * For “request to join” groups, we have a function that allows the requestor to introduce themselves to the coordinator, to get access to the group. Some groups have a process of re-posting this content in the intro thread to welcome people in.
      * Upload profile photos! Photos of faces are one of the most powerful ways of feeling like you know who is in the room with you online.
    translation: |-
      * Crie uma conversa chamada “Apresente-se” ou “Como você está?”. Ela oferece uma primeira _ação_ clara para quem chega.
      * Em grupos nos quais é possível solicitar entrada, um recurso permite que a pessoa se apresente à coordenação ao fazer a solicitação. Alguns grupos publicam essa apresentação novamente na conversa de apresentações para dar as boas-vindas à pessoa.
      * Adicione fotos de perfil. Ver os rostos das pessoas é uma das formas mais eficazes de reconhecer quem participa com você de um espaço online.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d3b245589018cebf:
    english: "## Who’s NOT in the Room"
    translation: "## Quem não está presente"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5daf97a7cbbdd355:
    english: Diversity is critical for quality group decision making. The “wisdom of the crowd effect” (collective intelligence) only works by combining a variety of viewpoints. Outcomes of collaboration processes depend heavily on which voices are, and are not, represented. It’s impossible to have perfect representative inclusion, but you need to take into account who might be missing.
    translation: A diversidade é essencial para a qualidade das decisões em grupo. A chamada “sabedoria das multidões” (inteligência coletiva) depende da combinação de diferentes pontos de vista. As conclusões de processos colaborativos dependem muito de quais vozes estão representadas e quais não estão. É impossível incluir todo mundo de forma perfeitamente representativa, mas você precisa considerar quem pode estar faltando.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b16b07380f6bc37c:
    english: It’s extremely common for people to have blind spots around privilege. Humans are not great at intuiting bias, and are a lot better at noticing the presence of something, rather than the absence. Our minds trick us. For example, when women and men are deliberately given an equal amount of talking time there is often a perception that women are getting more than their fair share, due to different ideas about how much they “should” talk ([more details](https://www.quora.com/Do-women-tend-to-talk-more-than-men)). It can be necessary to actually measure or count to get an accurate picture, instead of relying on intuition.
    translation: É muito comum não perceber os efeitos dos próprios privilégios. As pessoas nem sempre reconhecem seus vieses e costumam notar melhor a presença de algo do que sua ausência. Nossa percepção pode nos enganar. Por exemplo, quando mulheres e homens recebem deliberadamente o mesmo tempo de fala, muitas vezes surge a impressão de que as mulheres falaram mais do que deveriam. Isso ocorre por causa de diferentes expectativas sobre quanto elas “deveriam” falar ([mais detalhes](https://www.quora.com/Do-women-tend-to-talk-more-than-men)). Para ter uma visão precisa, às vezes é necessário medir ou contar, em vez de confiar apenas na intuição.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2b720395fe4e451f:
    english: Someone who does not have particular accessibility needs may not even notice that a venue isn’t wheelchair accessible, a document isn’t formatted for screen readers, or a situation is excluding someone with hearing loss. But the people with those challenges will notice. Someone without kids might not consider that a 7PM meeting time won't work for parents. These, and a thousand other practical, social, and cultural elements, could block someone from *being in the room*.
    translation: Uma pessoa sem necessidades específicas de acessibilidade talvez nem perceba que um local não permite o acesso de cadeiras de rodas, que um documento não funciona com leitores de tela ou que uma situação exclui pessoas com perda auditiva. Mas quem enfrenta essas barreiras percebe. Quem não tem filhos talvez não considere que uma reunião às 19h pode ser inviável para mães, pais ou responsáveis. Esses e muitos outros fatores práticos, sociais e culturais podem impedir alguém de *estar presente*.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  25ac4ed8610c591c:
    english: 'It’s especially important to think about who is not in room when trying to solve problems for others: build with, not for; talk with people, not about them. If the people you are trying to serve are not in the room, it’s very unlikely you’ll have all the input you need to be effective. This is just as much about effectiveness for business outcomes as about social justice; it’s almost always better to design collaboration *with* the users or stakeholders.'
    translation: 'Pensar em quem não está presente é especialmente importante quando você tenta resolver problemas de outras pessoas: construa com elas, não para elas; converse com elas, não apenas sobre elas. Se as pessoas que você quer atender não participam, é muito improvável que você tenha todas as informações necessárias para agir de forma eficaz. Isso diz respeito tanto à eficácia dos resultados de uma organização quanto à justiça social. Quase sempre é melhor planejar a colaboração *com* usuários ou outras pessoas envolvidas.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6b44ef1725c36586:
    english: |-
      * Collaborating online can allow for whole other levels of inclusion. Instead of thinking about a “digital divide”, think about the “digital bridge” — how technology can include people who cannot attend in-person meetings or participate at a specific time, and enable whole new possibilities like multi-lingual discussions.
      * Loomio makes it very clear who is invited to a group and who has participated in a discussion, giving important information for thinking about inclusion. If people are missing, you can see that.
      * If inclusive decision making and diversity of thinking are important to you, periodically ask yourself, “Who’s not in the room? Why?”
    translation: |-
      * A colaboração online pode ampliar muito a inclusão. Em vez de pensar apenas na “exclusão digital”, pense em como a tecnologia pode criar uma “ponte digital”. Ela pode incluir pessoas que não conseguem comparecer a reuniões presenciais ou participar em um horário específico, além de abrir possibilidades como discussões em vários idiomas.
      * O Loomio mostra claramente quem foi convidado para um grupo e quem participou de uma discussão. Essas informações ajudam a avaliar a inclusão. Se alguém estiver ausente, você poderá perceber.
      * Se decisões inclusivas e a diversidade de perspectivas são importantes para você, pergunte-se de tempos em tempos: “Quem não está presente? Por quê?”
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0a5324e7de64cdba:
    english: "## Culture, Protocol, Expectations"
    translation: "## Cultura, protocolos e expectativas"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  851a2601b835fbb1:
    english: Culture can be quite a nebulous concept, and operates at multiple levels. The culture of the wider society has a big influence, but you can think of every group, and every session or discussion, as having a culture of its own.
    translation: Cultura pode ser um conceito difícil de definir e atua em vários níveis. A cultura da sociedade tem grande influência, mas cada grupo, encontro ou discussão também tem sua própria cultura.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  27d3b10b80ade309:
    english: How do we roll? How do we talk to one another? What is and is not ok here? What are the rules of the game, of how we interact?
    translation: Como agimos? Como conversamos uns com os outros? O que é aceitável aqui e o que não é? Quais são as regras da nossa convivência?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  54d83e0b3e487190:
    english: The process of confronting cultural questions can be a powerful moment of self-awareness for a group. Not confronting them can harm ability to meet goals, or sometimes tear a group apart completely.
    translation: Enfrentar essas questões culturais pode ser um momento importante de reflexão para o grupo. Evitá-las pode dificultar o alcance dos objetivos e, em alguns casos, até desintegrar o grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f9918d7d61cef0c9:
    english: Culture, protocol, and expectations can be implicit or explicit, and by nature intersect in complex ways with power dynamics and social capital. It’s a challenging balance to keep things loose enough to allow emergence, evolution, creativity, and freedom, while being explicit enough about bottom lines and boundaries to ensure safety.
    translation: A cultura, os protocolos e as expectativas podem ser implícitos ou explícitos. Por sua natureza, eles se relacionam de maneiras complexas com as relações de poder e o capital social. É difícil manter abertura suficiente para permitir mudanças, criatividade e liberdade e, ao mesmo tempo, definir limites claros que garantam a segurança.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3d484eafb8524354:
    english: Facilitators often guide the group to live up to the culture it has set, follow the protocols it has agreed, and hold expectations to account. If a facilitator is tasked with this role, they need to be backed by a certain level of explicitness about those agreements, and a certain mandate. Otherwise, it can get messy.
    translation: Quem facilita um grupo muitas vezes ajuda as pessoas a respeitar a cultura que estabeleceram, seguir os protocolos acordados e cumprir as expectativas. Para exercer esse papel, a pessoa precisa de acordos suficientemente claros e de respaldo do grupo. Sem isso, surgem dificuldades.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ba3ef231a647d607:
    english: People often want to leave things to “common sense” and avoid agreeing a code of conduct or explicit protocols. However, this can disproportionately affect the most vulnerable members of the group, since they will feel the negative impacts of bad behavior or culture first and strongest, and are least empowered to counteract it themselves. It's the responsibility of the more privileged or influential members of the group to think through these questions carefully.
    translation: Muitas pessoas preferem deixar as coisas a cargo do “bom senso” e evitar um código de conduta ou protocolos explícitos. Isso, porém, pode prejudicar de forma desproporcional os membros mais vulneráveis do grupo. Eles costumam sentir primeiro e com mais intensidade os efeitos de comportamentos ou práticas prejudiciais e têm menos condições de enfrentá-los sozinhos. Cabe aos membros com mais privilégios ou influência considerar essas questões com cuidado.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d14bcec24555318c:
    english: Like a legal contract, you hope you never have to enforce a code of conduct, but if you need it you’re very glad it’s there. You want to agree *before* it becomes necessary. In order for a facilitator or any member of the group to effectively stand up and say, “that’s not OK here”, you need to have already invested in culture-building and expectation-setting.
    translation: Como acontece com um contrato, você espera nunca precisar aplicar um código de conduta, mas fica satisfeito por ele existir quando é necessário. O ideal é chegar a um acordo *antes* de precisar dele. Para que quem facilita ou qualquer membro do grupo possa dizer com firmeza “isso não é aceitável aqui”, o grupo precisa ter dedicado tempo à construção de sua cultura e à definição de expectativas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dda14b86acbd8199:
    english: |-
      * Because Loomio is usually used as a space for constructive deliberation among groups with a specific purpose and set of members, for the most part people engage in good faith and behave respectfully.
      * Loomio is designed specifically to give voice to the individual, and let them communicate their needs and concerns. Even if a majority doesn’t see a problem, a single person can raise it and be heard.
      * Communicating online enables a certain level of physical safety, because people are not face to face.
      * Some groups already use the group description field to note a code of conduct or expectations for behavior. Others have collectively agreed a set of expectations that govern participation.
      * Many groups use Loomio itself to decide their group protocols, such as how to engage, what is allowed, what a decision means and what makes it valid, etc.
      * Some core protocol issues are answered simply by using Loomio: Who is allowed here? How do we communicate?
      * One of the most basic decisions Loomio users all encounter is about decision-making protocol — Consensus? Majority? Quorum? Unanimity? Bringing the question of decision-making protocol to the fore can be a very productive step in cultural development.
    translation: |-
      * Como o Loomio costuma ser usado para deliberações construtivas em grupos com objetivos e membros definidos, as pessoas geralmente participam de boa-fé e agem com respeito.
      * O Loomio foi projetado para dar voz a cada pessoa e permitir que ela comunique suas necessidades e preocupações. Mesmo que a maioria não veja um problema, uma única pessoa pode levantá-lo e ser ouvida.
      * A comunicação online oferece certo grau de segurança física, pois as pessoas não estão frente a frente.
      * Alguns grupos usam o campo de descrição para registrar um código de conduta ou expectativas de comportamento. Outros definem coletivamente as expectativas que orientam a participação.
      * Muitos grupos usam o próprio Loomio para decidir seus protocolos: como participar, o que é permitido, o que significa uma decisão e o que a torna válida, entre outras questões.
      * O uso do Loomio ajuda a responder a algumas questões básicas de protocolo: quem pode estar aqui? Como nos comunicamos?
      * Uma das decisões mais básicas que os usuários do Loomio enfrentam diz respeito às regras para tomar decisões: consenso? Maioria? Quórum? Unanimidade? Discutir essas regras abertamente pode ser um passo produtivo para desenvolver a cultura do grupo.
