  d370759001be4e21:
    english: Polls collect selections, scores, allocations, rankings, availability, or election ballots. Choose the voting method based on what participants need to express and how you intend to use the result. Use a [Proposal](/en/user_manual/polls/proposals/) when people need to respond to a statement or course of action.
    translation: I sondaggi raccolgono scelte, valutazioni, distribuzioni di punti, classifiche, disponibilità o voti elettorali. Scegli il metodo di voto in base a ciò che i partecipanti devono esprimere e a come intendi usare il risultato. Usa una [Proposta](/en/user_manual/polls/proposals/) quando le persone devono rispondere a un'affermazione o a una linea d'azione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1132ff680c7b2562:
    english: "## Simple poll"
    translation: "## Sondaggio semplice"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6b957bf5630c1470:
    english: "[Choose](/en/user_manual/polls/choose/) lets participants select one or more options. Use it to find the most popular option or make a shortlist."
    translation: "[Scelta](/en/user_manual/polls/choose/) permette ai partecipanti di selezionare una o più opzioni. Usalo per individuare l'opzione più popolare o creare una rosa di opzioni."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c982974685e1b5d6:
    english: "## Score poll"
    translation: "## Sondaggio di valutazione"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fbbfe14196388606:
    english: "[Score](/en/user_manual/polls/score/) lets participants rate every option on the same scale. Use it to compare the strength of support, readiness, suitability, or importance across options."
    translation: "[Valutazione](/en/user_manual/polls/score/) permette ai partecipanti di valutare ogni opzione sulla stessa scala. Usalo per confrontare il grado di sostegno, preparazione, idoneità o importanza delle opzioni."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0465fcb48a56ca78:
    english: "## Dot vote"
    translation: "## Voto a punti"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ffb7d1711a5fca3b:
    english: "[Allocate](/en/user_manual/polls/allocate/) gives each participant a fixed budget of points to distribute. Use it to identify priorities when choosing one thing means giving less attention or resources to another."
    translation: "[Distribuzione dei punti](/en/user_manual/polls/allocate/) assegna a ogni partecipante un numero fisso di punti da distribuire. Usala per individuare le priorità quando scegliere una cosa significa dedicare meno attenzione o risorse a un'altra."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a1b15c28fbe526f6:
    english: "## Ranked choice"
    translation: "## Scelta per preferenza"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8811f455b7ab3821:
    english: "[Rank](/en/user_manual/polls/rank/) lets participants arrange options in order of preference. Use it to find the group's overall preferred order or select one leading option."
    translation: "[Classifica](/en/user_manual/polls/rank/) permette ai partecipanti di ordinare le opzioni secondo le proprie preferenze. Usala per trovare l'ordine di preferenza complessivo del gruppo o scegliere l'opzione preferita."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2e21bb1b54b6fcf9:
    english: "## Time poll"
    translation: "## Sondaggio sugli orari"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb768f07eb0d1971:
    english: "[Time poll](/en/user_manual/polls/meeting_polls/) lets participants indicate when they are available. Use it to schedule a meeting or event across time zones."
    translation: "[Sondaggio sugli orari](/en/user_manual/polls/meeting_polls/) permette ai partecipanti di indicare quando sono disponibili. Usalo per fissare una riunione o un evento tra diversi fusi orari."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6333ad0ee6d54609:
    english: "## STV Election"
    translation: "## Elezioni STV"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6f93c6ad598d809c:
    english: "[STV Elections](/en/user_manual/polls/stv/) let participants rank candidates in a proportional, multi-winner election. Use STV to elect a committee, board, or group of delegates."
    translation: Le [elezioni STV](/en/user_manual/polls/stv/) permettono ai partecipanti di ordinare i candidati secondo le proprie preferenze in un'elezione proporzionale con più vincitori. Usa STV per eleggere un comitato, un consiglio o un gruppo di delegati.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
