  ef25fbaed498cfbe:
    english: The cooperative requires 60 percent participation for significant decisions, so Jamie enters **60** in the participation quorum field and starts the proposal.
    translation: La cooperativa richiede una partecipazione del 60 percento per le decisioni importanti. Jamie inserisce quindi **60** nel campo del quorum di partecipazione e avvia la proposta.
