  66f32f2b3cf56e0d:
    english: |-
      ## Key points
      - Freedom to make a decision.
      - Invite people to offer their advice.
      - Take into account other people’s voices.
    translation: |-
      ## Főbb tudnivalók
      - Szabadon hozhatsz döntést.
      - Hívj meg másokat, hogy osszák meg a tanácsaikat.
      - Vedd figyelembe mások véleményét.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  54d4f1ac3c2bd91f:
    english: |-
      ## Steps in the Advice process
      You notice a problem or opportunity and take the initiative.
      1. Frame the decision, identify who owns it, and invite the affected people and relevant experts.
      2. Start a Loomio **discussion** and, when a structured response or deadline is useful, run an **Advice proposal**.
      3. Clarify and build on the advice through vote reasons and discussion comments.
      4. Make the decision, then publish an **outcome** explaining what was decided and how the advice informed it.
    translation: |-
      ## A tanácsadási folyamat lépései
      Észreveszel egy problémát vagy lehetőséget, és kezdeményezel.
      1. Határozd meg, miről kell dönteni és ki hozza meg a döntést, majd hívd meg az érintetteket és a megfelelő szakértőket.
      2. Indíts egy Loomio-**beszélgetést**, és ha hasznos a strukturált válaszadás vagy a határidő, indíts egy **tanácsadási javaslatot**.
      3. A szavazatok indoklásai és a beszélgetés hozzászólásai alapján tisztázd és egészítsd ki a kapott tanácsokat.
      4. Hozd meg a döntést, majd tedd közzé a **következtetést**. Írd le, miről döntöttél, és hogyan segítettek ebben a tanácsok.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6088bbd1e12e8920:
    english: "## Benefits\n- Advice helps you make a better decision for your organization. \n- Foster relationships, learning opportunities and diverse input.\n- Stimulate initiative and creativity, and more enjoyable work."
    translation: "## Előnyök\n- A tanácsok segítenek jobb döntést hozni a szervezeted számára. \n- Erősödnek a kapcsolatok, lehetőség nyílik a tanulásra, és többféle nézőpont jelenik meg.\n- Több teret kap a kezdeményezés és a kreativitás, a munka pedig élvezetesebbé válhat."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0b6fc6b802feebda:
    english: "## Applying the Advice process on Loomio"
    translation: "## A tanácsadási folyamat alkalmazása a Loomióban"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a0a3c706db8ca405:
    english: "| **Advice process** | **On Loomio** |\n|---|---|\n| You notice a problem or opportunity and take the initiative. |  |\n| Seek input to sound out perspectives before proposing action. | Start a Loomio **discussion** to provide context and open conversation. Run an **[Advice proposal](/en/user_manual/polls/proposals/advice/)** when you want a defined response period, vote reasons, and a clear record of who participated. |\n| Taking advice received into account, you make a decision and inform the people who have given advice. | Add an an **outcome** to the discussion thread.   <br /><br />State the decision made and thank people for their advice and feedback.  <br /><br />   Say what will happen next and notify people about the outcome.  <br /><br />The outcome statement is an important record of the decision for future reference. <br /> <br /> Either update the context to include this outcome, or state it in a comment you pin to the timeline to quickly find it in the future.<br /><br/> |        "
    translation: |-
      | **Tanácsadási folyamat** | **A Loomióban** |
      |---|---|
      | Észreveszel egy problémát vagy lehetőséget, és kezdeményezel. |  |
      | Mielőtt cselekvést javasolnál, kérj visszajelzést a különböző nézőpontok megismeréséhez. | Indíts egy Loomio-**beszélgetést**, amelyben bemutatod a helyzetet, és teret adsz a véleményeknek. Indíts egy **[tanácsadási javaslatot](/en/user_manual/polls/proposals/advice/)**, ha meghatározott válaszadási időszakot, a szavazatok indoklását és egyértelmű nyilvántartást szeretnél a résztvevőkről. |
      | A kapott tanácsok figyelembevételével hozd meg a döntést, és tájékoztasd azokat, akik tanácsot adtak. | Adj hozzá egy **következtetést** a beszélgetéshez.   <br /><br />Írd le a döntést, és köszönd meg a tanácsokat és a visszajelzéseket.  <br /><br />   Mondd el, mi történik ezután, és értesítsd a résztvevőket a következtetésről.  <br /><br />A következtetés később is fontos feljegyzése lesz a döntésnek. <br /> <br /> Frissítsd a beszélgetés leírását a következtetéssel, vagy írd meg egy hozzászólásban, amelyet kitűzöl az idővonalra, hogy később könnyen megtaláld.<br /><br/> |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
