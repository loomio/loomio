    english: |-
      - [Slack](../slack/)
      - [Microsoft Teams](../microsoft_teams/)
      - [Discord](../discord/)
      - [Matrix](../matrix/)
      - [Mattermost](../mattermost/)
    translation: |-
      - [Slack](../slack/)
