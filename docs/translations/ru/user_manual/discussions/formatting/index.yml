  7bda51ac3285357f:
    english: When starting or editing a discussion or poll, or writing a comment, you will see a formatting bar below the text field. Select the arrow at the end of the bar to show or hide the full set of tools.
    translation: Когда вы создаёте или редактируете обсуждение или опрос либо пишете комментарий, под текстовым полем появляется панель форматирования. Нажмите стрелку в конце панели, чтобы показать или скрыть все инструменты.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2f2944ad10684b7f:
    english: Hover the mouse or cursor over each item for the name of each tool.
    translation: Наведите указатель на инструмент, чтобы увидеть его название.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5f45a085deb9eff1:
    english: Use formatting to add structure and emphasis so information is easier to scan.
    translation: Используйте форматирование, чтобы выделить главное и сделать текст удобнее для просмотра.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
