---
navigation_title: Configuración
blocks:
  145c23b2412eff98:
    english: "# Proposal and poll settings"
    translation: "# Configuración de propuestas y encuestas"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e0347d976f79179:
    english: "## Setting up a proposal or poll"
    translation: "## Configurar una propuesta o encuesta"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e5d6f17041c19d41:
    english: "### Proposal and poll templates"
    translation: "### Plantillas de propuestas y encuestas"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8913cabb2f1f8227:
    english: 'Choose the proposal template you want to use. '
    translation: Elige la plantilla de propuesta que quieras usar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3620f6321777ca50:
    english: "### Add content"
    translation: "### Agregar contenido"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bc7ebb222e9ff4d1:
    english: "**Group:** Check that the correct group is selected for your proposal or poll."
    translation: "**Grupo:** Comprueba que hayas seleccionado el grupo correcto para tu propuesta o encuesta."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3a1d375da02f3a49:
    english: "**Title:** Give your proposal or poll a short, relevant title."
    translation: "**Título:** Ponle a tu propuesta o encuesta un título breve y pertinente."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a62a7e63f9db295c:
    english: "**Details:** Explain what you are asking of people and include enough details so everyone knows what it means to vote.  "
    translation: "**Detalles:** Explica qué les pides a las personas e incluye suficiente información para que todas sepan qué implica votar."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e17c2ab4878716f2:
    english: The predefined templates include some prompts to help you write a good proposal - use these or add your own details.
    translation: Las plantillas predefinidas incluyen algunas preguntas para ayudarte a redactar una buena propuesta. Úsalas o agrega tus propios detalles.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  74daa7f0cc476971:
    english: Avoid combining a range of ideas in one proposal, because people might agree to some aspects but not others and be unsure how to respond. You can break complex decisions down into multiple proposals.
    translation: Evita reunir varias ideas en una sola propuesta. Las personas pueden estar de acuerdo con algunos aspectos, pero no con otros, y no saber cómo responder. Puedes dividir las decisiones complejas en varias propuestas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0da6e449688940bb:
    english: When making a proposal, state your expectations and describe the impact the proposal will have if adopted. If it's a formal or binding proposal it's often worth describing what it means if the proposal is not adopted.
    translation: Al crear una propuesta, explica qué esperas y qué efecto tendrá si se aprueba. Si es formal o vinculante, conviene explicar también qué ocurrirá si no se aprueba.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a6db66b75f495e21:
    english: Use the formatting tools to support your poll.  For example, attach a document file with the paperclip icon, insert an image, link to a website or online document, or even embed a video.
    translation: Usa las herramientas de formato para complementar tu encuesta. Por ejemplo, adjunta un documento con el icono del clip, inserta una imagen, agrega un enlace a un sitio web o documento en línea, o inserta un video.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f4f85f131878c36d:
    english: "### Voting options"
    translation: "### Opciones de voto"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  616aab74af2072ba:
    english: Each proposal and poll template provides options for voting.
    translation: Cada plantilla de propuesta o encuesta incluye opciones de voto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7a85de7eefe74178:
    english: Depending on the template, you can edit, remove, reorder, or add voting options to suit the decision process you are running.
    translation: Según la plantilla, puedes editar, eliminar, reordenar o agregar opciones de voto para adaptarlas a tu proceso de decisión.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9bc44bf4b28ac5d8:
    english: "- Use the pencil icon to edit voting option \n- Use the trash can icon to remove unwanted voting options\n- Use the handle to move the order of voting options\n- Add voting options with **Add option** when the template allows custom options"
    translation: |-
      - Usa el icono del lápiz para editar una opción de voto
      - Usa el icono de la papelera para eliminar las opciones de voto que no necesites
      - Arrastra el controlador para cambiar el orden de las opciones de voto
      - Agrega opciones de voto con **Agregar opción** cuando la plantilla permita opciones personalizadas
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2062f39334fbd629:
    english: |-
      ### Edit voting options
      There is a lot of flexibility to configure voting options to suit the way your organization makes decisions.
    translation: |-
      ### Editar opciones de voto
      Puedes configurar las opciones de voto según la forma en que tu organización toma decisiones.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5ac5b47c81fe187b:
    english: 'Use the pencil icon alongside the voting option to open the edit modal:'
    translation: 'Usa el icono del lápiz junto a la opción de voto para abrir la ventana de edición:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3c791f8140ad3b39:
    english: "**Option name:** A short name for the option."
    translation: "**Nombre de la opción:** Un nombre breve para la opción."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  77a0fb7409cf1711:
    english: "**Icon:** Select an icon for the option, such as thumbs up, thumbs down, abstain, or block."
    translation: "**Icono:** Selecciona un icono para la opción, como pulgar arriba, pulgar abajo, abstención o bloqueo."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9126ee91e5d1cb95:
    english: "**Meaning:** A sentence that explains what choosing this options means."
    translation: "**Significado:** Una frase que explique qué significa elegir esta opción."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e88d83b93ba47666:
    english: "**Reason prompt:** A question to prompt voters to provide their reasoning or reconsider their position. "
    translation: "**Pregunta sobre el motivo:** Una pregunta que invite a quienes votan a explicar sus motivos o reconsiderar su postura."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d05197892ea46087:
    english: "### Opening time"
    translation: "### Hora de apertura"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1b56f0ad52a3aed8:
    english: By default, voting opens immediately when you create the poll. If you want to schedule voting to open at a later time, uncheck **Voting opens immediately** and select an opening date and time.
    translation: De forma predeterminada, la votación se abre en cuanto creas la encuesta. Si quieres que se abra más tarde, desmarca **La votación se abre inmediatamente** y selecciona la fecha y hora de apertura.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  48ccc43734b062eb:
    english: This is useful to give time for discussion before voting opens, or to ensure a poll or proposal is correctly set up and scheduled to happen at the right time.
    translation: Esto permite dejar tiempo para debatir antes de votar o preparar la encuesta o propuesta para que se abra en el momento previsto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b68fccc3132988ff:
    english: When a poll has a scheduled opening time, you can add voters before voting opens. Voters will be notified when voting opens, rather than when they are added.
    translation: Si programas la apertura de una encuesta, puedes agregar votantes antes de que se abra. Recibirán una notificación cuando se abra la votación, en lugar de recibirla cuando los agregues.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  82d4cacfa780dd98:
    english: "**Notify voters when poll opens:** When checked (default), all voters will receive a notification when voting opens. Uncheck this if you want to open voting without sending notifications."
    translation: "**Notificar a los votantes cuando se abra la encuesta:** Si esta opción está marcada, como ocurre de forma predeterminada, todos los votantes recibirán una notificación cuando se abra la votación. Desmárcala si quieres abrir la votación sin enviar notificaciones."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d084620657803f93:
    english: "**Closing date and time:** Select the closing date and time for your poll."
    translation: "**Fecha y hora de cierre:** Selecciona la fecha y hora de cierre de tu encuesta."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c0472419a2671222:
    english: Give sufficient time for people to vote. You could time the proposal so it closes before a meeting, or avoid closing over a weekend, so that people will receive a timely reminder. If necessary, you can close the poll early or extend the closing time.
    translation: Deja tiempo suficiente para que las personas voten. Puedes programar el cierre de la propuesta antes de una reunión o evitar que cierre durante un fin de semana, para que las personas reciban el recordatorio a tiempo. Si hace falta, puedes cerrar la encuesta antes o ampliar el plazo de votación.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c87f87e6cbc1a4d7:
    english: "**Who can vote?** Invite everyone in the group or only specific people that you invite."
    translation: "**¿Quién puede votar?** Invita a todo el grupo o solo a las personas que elijas."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e02a9cefc3082334:
    english: |-
      You can later add people to an 'Invite people only' poll. For identified polls,
      you can also remove people who should no longer be eligible to vote. People
      cannot be removed from an anonymous poll.
    translation: |-
      Puedes agregar personas más adelante a una encuesta «Solo personas invitadas». En las encuestas con votos identificados,
      también puedes quitar a quienes ya no deban tener derecho a votar. No se puede
      quitar a nadie de una encuesta anónima.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2e959157d75ed7bd:
    english: "## More settings"
    translation: "## Más ajustes"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3d4443d3e6d3b13d:
    english: |-
      ### Reminder
      Send a 'Closing soon' notification 24 hours before the poll closes. This can be an opportunity for people to see how others have voted and reconsider their own vote, or just a way to increase participation in the poll.
    translation: |-
      ### Recordatorio
      Envía una notificación de «Cierre próximo» 24 horas antes de que cierre la encuesta. Esto permite que las personas vean cómo han votado otras y reconsideren su voto, o simplemente ayuda a aumentar la participación.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  62067c0573d7a64e:
    english: |-
      Setting options:
      - Nobody
      - Author
      - Undecided voters (default)
      - All voters
    translation: |-
      Opciones de configuración:
      - Nadie
      - Autor
      - Votantes indecisos (predeterminado)
      - Todos los votantes
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6cd67c3f92302551:
    english: |-
      For an anonymous poll lasting at least 24 hours, Loomio automatically reminds
      eligible people who have not voted during the final 24 hours. This reminder
      cannot be changed in the poll settings.
    translation: |-
      En una encuesta anónima que dure al menos 24 horas, Loomio envía automáticamente un recordatorio
      a las personas con derecho a voto que aún no hayan votado durante las últimas 24 horas. Este recordatorio
      no se puede cambiar en la configuración de la encuesta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72f172271e2a636a:
    english: |-
      ### Anonymous voting
      If enabled, votes are stored separately from voter identities. Results appear after voting closes, and voters cannot add reasons, review their submitted vote, or change it.
    translation: |-
      ### Votación anónima
      Si activas esta opción, los votos se almacenan por separado de las identidades de quienes votan. Los resultados aparecen cuando cierra la votación. Quienes votan no pueden agregar motivos, revisar el voto que enviaron ni cambiarlo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3393027493510f2f:
    english: See [Anonymous voting](/en/user_manual/polls/anonymous_voting) for details about how voter identities are separated from submitted votes, what information is retained, and the limits of the protection.
    translation: Consulta [Votación anónima](/en/user_manual/polls/anonymous_voting) para saber cómo se separan las identidades de los votos enviados, qué información se conserva y cuáles son los límites de esta protección.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b731b9118e48dee5:
    english: |-
      > [!WARNING]
      > Once a poll has started you cannot edit the poll to make it anonymous or to undo the anonymous setting.
    translation: |-
      > [!WARNING]
      > Una vez iniciada la encuesta, no puedes editarla para hacerla anónima ni desactivar la votación anónima.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e8660d089a3c07bb:
    english: |-
      > [!WARNING]
      > You cannot re-open an anonymous poll after it has closed. Submitted votes are not linked to the participation records that show who has voted.
    translation: |-
      > [!WARNING]
      > No puedes volver a abrir una encuesta anónima después de que haya cerrado. Los votos enviados no están vinculados a los registros de participación que muestran quién ha votado.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  aaaaa28a4b435835:
    english: |-
      ### Vote reason
      It can be helpful to understand why people voted the way they did. With this setting, you can prompt people to share their thoughts when they vote.
    translation: |-
      ### Motivo del voto
      Puede ser útil saber por qué las personas votaron de cierta manera. Con esta opción, puedes invitarlas a compartir sus motivos al votar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  309645182b157738:
    english: 'Available settings depend on the template:'
    translation: 'Las opciones disponibles dependen de la plantilla:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d67e2c2914e91a6f:
    english: |-
      - **Optional** lets voters choose whether to give a reason
      - **Required for disagree or block** requires a reason when the selected option
        uses the Disagree or Block voting icon
      - **Required for block** requires a reason when the selected option uses the
        Block voting icon
      - **Required** requires every voter to give a reason
      - **Disabled** removes the vote-reason field
    translation: |-
      - **Opcional** permite a quienes votan decidir si dan una razón
      - **Requerido para estar en desacuerdo o bloquear** exige una razón cuando la opción elegida
        usa el icono de voto En desacuerdo o Bloquear
      - **Requerido para bloquear** exige una razón cuando la opción elegida usa el
        icono de voto Bloquear
      - **Requerido** exige que todas las personas que votan den una razón
      - **Desactivado** elimina el campo para explicar el voto
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  af5e7c0557aec611:
    english: |-
      The conditional settings follow the voting icon rather than the option name.
      They still apply if you rename Disagree to a term such as Objection. The
      Consent template defaults to **Required for disagree or block**, while the
      Consensus template defaults to **Required for block**. Other templates default
      to **Optional**, except Question rounds where the response itself is required.
      The poll author can change the setting for an individual poll.
    translation: |-
      Las opciones condicionales dependen del icono de voto, no del nombre de la opción.
      Siguen aplicándose si cambias el nombre de En desacuerdo por otro, como Objeción. La
      plantilla de Consentimiento usa por defecto **Requerido para estar en desacuerdo o bloquear**, mientras que la
      plantilla de Consenso usa **Requerido para bloquear**. Las demás plantillas usan por defecto
      **Opcional**, excepto las rondas de preguntas, en las que la respuesta es obligatoria.
      Quien crea la encuesta puede cambiar esta opción para una encuesta concreta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ecb0d89c623db459:
    english: "**Limit reason to maximum 500 characters:** Keeping vote reasons short makes them easier to understand. A collection of concise reasons is a great resource for making a decision.  This setting is ticked by default. Untick to allow for longer reasons."
    translation: "**Limitar la razón a un máximo de 500 caracteres:** Las razones breves son más fáciles de entender. Un conjunto de razones concisas ayuda a tomar una decisión. Esta opción está marcada por defecto. Desmárcala para permitir razones más largas."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  35bd4f116b9ff26a:
    english: |-
      ### Hide results
      If you want people to vote without knowing how others have voted, you can hide the results of the poll.  Useful if you do not want people to be affected by how other people have voted.
    translation: |-
      ### Ocultar resultados
      Puedes ocultar los resultados de la encuesta para que las personas voten sin saber cómo han votado las demás. Así, los votos de otras personas no influirán en su decisión.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8cc5b82f4cc5e94e:
    english: |-
      Setting options:
      - Do not hide results
      - Hide results until a vote is cast
      - Hide results until voting closes
    translation: |-
      Opciones de configuración:
      - No ocultar los resultados
      - Ocultar los resultados hasta que se emita un voto
      - Ocultar los resultados hasta que se cierre la votación
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4be103ffd97e7e8f:
    english: While results are hidden, nobody can reply to votes. Replies to votes open when voting closes.
    translation: Mientras los resultados estén ocultos, nadie puede responder a los votos. Las respuestas a los votos se habilitan cuando se cierra la votación.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a488ebe6712a5e1d:
    english: If results are hidden until a vote is cast, vote before you print or export the thread as Markdown.
    translation: Si los resultados están ocultos hasta que emitas un voto, vota antes de imprimir o exportar el hilo como Markdown.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1e5a1eb47ee3d99d:
    english: |-
      Anonymous polls always hide results until voting closes. The STV Election
      template enables anonymous voting by default.
    translation: |-
      Las encuestas anónimas siempre ocultan los resultados hasta que se cierra la votación. La plantilla de Elección STV
      activa la votación anónima por defecto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8e7d8e81db57f4f8:
    english: |-
      ### Start the poll
      Select the **Start proposal** or **Start poll** button.
    translation: |-
      ### Iniciar la encuesta
      Selecciona el botón **Inicia una propuesta** o **Iniciar encuesta**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b1ee90012c240ef5:
    english: "## Managing polls"
    translation: "## Gestionar encuestas"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0b5f754660efb4da:
    english: Open the three-dot menu at the bottom right of the poll.
    translation: Abre el menú de tres puntos en la parte inferior derecha de la encuesta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cc2325791d155b04:
    english: "### Edit poll"
    translation: "### Editar encuesta"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8d5ecd0352b5caf8:
    english: Use **Edit poll** to edit poll content or settings.   You can not change voting options once voting commences.
    translation: Usa **Editar encuesta** para modificar el contenido o la configuración de la encuesta. No puedes cambiar las opciones de voto una vez que comienza la votación.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  84d18e91493020d4:
    english: "### Make a copy"
    translation: "### Haz una copia"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  071c2438f8e5315f:
    english: Use **Make a copy** to create a new poll using the current poll and settings as a starting point.
    translation: Usa **Haz una copia** para crear una encuesta nueva a partir de la encuesta actual y su configuración.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3c42dde555e8a245:
    english: "### Notification history"
    translation: "### Historial de notificaciones"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3e750b3f37e8ddf1:
    english: "**Notification history** shows who was notified and whether each notification has been read."
    translation: "**Historial de notificaciones** muestra quién recibió una notificación y si la ha leído."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d78b253bae2aecc7:
    english: "### Export poll"
    translation: "### Exportar encuesta"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  17e6fd426afa3b4d:
    english: "**Export** poll status and results to a spreadsheet (.csv) file, to download unformatted poll data for analysis or archive."
    translation: Usa **Exportar** para descargar el estado y los resultados de la encuesta en un archivo de hoja de cálculo (.csv) con los datos sin formato, para analizarlos o archivarlos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4fce317a163b0a40:
    english: "### Print"
    translation: "### Imprimir"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d698be92962e2cd7:
    english: Use **Print** in the thread actions to open a printable HTML document. You can print it or save it as a PDF for publishing and archiving.
    translation: Usa **Imprimir ** en las acciones del hilo para abrir un documento HTML listo para imprimir. Puedes imprimirlo o guardarlo como PDF para publicarlo y archivarlo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
