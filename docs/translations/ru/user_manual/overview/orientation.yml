  63c602fdeb39caf8:
    english: This page introduces the main parts of the Loomio interface and where to find the work that involves you.
    translation: На этой странице описаны основные части интерфейса Loomio и где найти обсуждения и решения, которые вас касаются.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7d5f837af9189e74:
    english: "## Group page"
    translation: "## Страница группы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d5b0be3db0bc6202:
    english: Your group home page introduces the group and provides access to its work.
    translation: На главной странице группы можно узнать о ней и перейти к её работе.
    status: machine
    provider: codex/gpt-6-sol
