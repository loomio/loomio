  7c8501ecb12311af:
    english: "## How Loomio works"
    translation: "## Come funziona Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  74caca2261c15283:
    english: 'Loomio has three main parts: groups, discussions, and polls.'
    translation: 'Loomio ha tre elementi principali: gruppi, discussioni e votazioni.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5f0a46926a0f7350:
    english: "### Groups"
    translation: "### Gruppi"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2060a64d0fabc6d7:
    english: A group is a place for an organization, team, or community to work together. Its home page explains the group's purpose and provides access to its discussions, polls, members, and files.
    translation: Un gruppo è uno spazio in cui un'organizzazione, una squadra o una comunità può lavorare insieme. La sua pagina iniziale ne spiega lo scopo e dà accesso a discussioni, votazioni, membri e file.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  311793a17709182c:
    english: "### Discussions"
    translation: "### Discussioni"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  05ecdffe6c18a1df:
    english: Discussions keep the information and conversation about a topic together. People can share context, comment, reply, react, and use polls to move the discussion towards an outcome.
    translation: Le discussioni raccolgono informazioni e conversazioni su un argomento. Le persone possono condividere il contesto, commentare, rispondere, reagire e usare le votazioni per arrivare a una conclusione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dc9a50d7f1f20c80:
    english: Over time, discussions create a searchable record of the information considered and the decisions made by your group.
    translation: Nel tempo, le discussioni creano un archivio consultabile delle informazioni esaminate e delle decisioni prese dal tuo gruppo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3448194e8a2ce09d:
    english: "### Polls and proposals"
    translation: "### Votazioni e proposte"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4ef7092f5f56e773:
    english: Polls help a group understand preferences, gather advice, and make decisions. Different poll templates support different processes. A proposal asks people to respond to a suggested course of action and explain the reason for their response.
    translation: Le votazioni aiutano un gruppo a capire le preferenze, raccogliere pareri e prendere decisioni. Modelli diversi di votazione supportano processi diversi. Una proposta invita le persone a esprimersi su una linea d'azione suggerita e a spiegare il motivo della loro risposta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  51ab039bc7c374bd:
    english: Polls can be part of a discussion or run independently from the **Polls** tab on a group page.
    translation: Le votazioni possono far parte di una discussione oppure svolgersi separatamente dalla scheda **Votazioni** nella pagina di un gruppo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
