---
navigation_title: Управление участниками
blocks:
  3d2d8d3f7d252651:
    english: "# Member management"
    translation: "# Управление участниками"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f9901909d4cd86e0:
    english: If you are an admin, you can manage members from the **Members** tab on your group page.
    translation: Если вы администратор, управлять участниками можно на вкладке **Участники** на странице группы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d25e71106f726cac:
    english: Click on the three dots (**⋮**) to the right of the group member to set their title, make them an admin, make them a delegate, or remove them from the group.
    translation: Нажмите на три точки (**⋮**) справа от имени участника, чтобы установить заголовок, сделать его администратором или делегатом либо удалить из группы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  db5a08225152e80a:
    english: "![Member actions menu on the Oatmilk Cooperative members page](member_management.png)"
    translation: "![Меню действий с участником на странице участников Oatmilk Cooperative](member_management.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0f29eb85fabc200d:
    english: |-
      ## Administering your group
      There are only two user types in a Loomio group: **member** and **admin**.
    translation: |-
      ## Администрирование группы
      В группе Loomio есть только два типа пользователей: **участник** и **администратор**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4317e6fcbbedcdaa:
    english: 'Admins perform administrative tasks for your group, including: adding and removing members, managing member permissions, setting the group privacy levels, and managing the subscription plans.  In addition, admins are able to see the email addresses of members and export the group''s data.'
    translation: Администраторы добавляют и удаляют участников, управляют их правами, настройками конфиденциальности группы и подпиской. Они также могут видеть адреса электронной почты участников и экспортировать данные группы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7de2ea0e85a19d0a:
    english: The person creating a new Loomio group is made admin by default. We recommend to make at least one other trusted person in your group an admin, to insure someone can always administer your group. You can have as many admins in your group as you wish.
    translation: Создатель группы Loomio становится администратором по умолчанию. Рекомендуем назначить администратором ещё одного человека, которому вы доверяете, чтобы управление группой всегда было доступно. Число администраторов не ограничено.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ac9e3bb2da56869e:
    english: To make a member **admin**, go to the Members tab, find the member and click on the three dots (**⋮**) next to their name. Choose **Make admin**. An `Admin` tag will appear beside their name.
    translation: Чтобы сделать участника **администратором**, откройте вкладку **Участники**, найдите его и нажмите на три точки (**⋮**) рядом с именем. Выберите **Сделать администратором**. Рядом с именем появится метка `Admin`.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b93c8eaf5367f572:
    english: "![Make admin action in a member's menu](member_make_admin.png)"
    translation: "![Действие «Сделать администратором» в меню участника](member_make_admin.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f6d7a993e2d32771:
    english: |-
      ## Managing subgroups
      If you are the admin of a parent group, or organization, you have additional permissions with regards to any __closed__ subgroups.
    translation: |-
      ## Управление подгруппами
      Если вы администратор родительской группы или организации, у вас есть дополнительные права в __закрытых__ подгруппах.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cd781594b26ae052:
    english: You will be able to join any closed subgroup by clicking the "Join Group" button on the left of the Subgroup page in question (just under the tabs).
    translation: Вы можете вступить в любую закрытую подгруппу. Для этого нажмите кнопку «Присоединиться к группе» слева на странице подгруппы, под вкладками.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ba630e95409473a5:
    english: "![Join group button on a closed Oatmilk Cooperative subgroup](member_join_subgroup.png)"
    translation: "![Кнопка вступления в закрытую подгруппу Oatmilk Cooperative](member_join_subgroup.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  87c2d0e0fa784cff:
    english: Once you have joined the subgroup, you will also be able to make yourself the admin of that subgroup, just as you would promote anyone to admin.
    translation: После вступления в подгруппу вы сможете назначить себя её администратором так же, как и любого другого участника.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e439992d86591319:
    english: |-
      >[!Note]
      >These permissions do not extend to [**secret** subgroups](/en/user_manual/groups/subgroups/?highlight=secret#permissions).
    translation: |-
      >[!Note]
      >Эти права не распространяются на [**секретные** подгруппы](/en/user_manual/groups/subgroups/?highlight=secret#permissions).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  31a8fbe10f50c1a0:
    english: |-
      ## Removing members
      When you click **Remove from group** you'll be asked to confirm the removal. Upon removal, this user will no longer have access to the group's pages, threads, polls, or proposals. They will receive no further emails or notifications of group activity. However, any comments and votes written by the user will remain untouched.
    translation: |-
      ## Удаление участников
      После нажатия **Удалить из группы** потребуется подтвердить удаление. Удалённый участник потеряет доступ к страницам группы, темам, голосованиям и предложениям. Он больше не будет получать письма и уведомления о действиях в группе. Его комментарии и голоса сохранятся.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8bf29fce0f0d8e9b:
    english: "![Remove from group action in a member's menu](member_remove.png)"
    translation: "![Действие «Удалить из группы» в меню участника](member_remove.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  aa3b173ffd048b99:
    english: You can add removed members back to the group later if you wish.
    translation: Позже вы сможете снова добавить удалённого участника в группу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6ef7d0422c66d652:
    english: |-
      ## Leaving group
      To leave a group: go to the group page, open the 3 dot menu, and click **Leave group**.
    translation: |-
      ## Выход из группы
      Чтобы выйти из группы, откройте её страницу, нажмите на меню с тремя точками и выберите **Покинуть группу**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5395b374b5814162:
    english: "![Leave group action in the Oatmilk Cooperative settings menu](member_leave_group.png)"
    translation: "![Действие «Покинуть группу» в меню настроек Oatmilk Cooperative](member_leave_group.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d926fc8d1e3cbac2:
    english: |-
      ## Set title
      Within the Members tab, you can also name your role within the group, or identify an organization you represent using **title**. You or a group admin can change your title with **Set title** from the 3 dot menu near your name.
    translation: |-
      ## Установка заголовка
      На вкладке **Участники** можно указать свою роль в группе или организацию, которую вы представляете, с помощью поля **заголовок**. Вы или администратор группы можете изменить его через пункт **Установить заголовок** в меню с тремя точками рядом с вашим именем.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2425e4d5b1e8047d:
    english: "![Set title action in a member's menu](member_set_title.png)"
    translation: "![Действие «Установить заголовок» в меню участника](member_set_title.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6af456317883a890:
    english: You can have different titles in different subgroups.
    translation: В разных подгруппах у вас могут быть разные заголовки.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2d59cb70493e06b1:
    english: "## Member email addresses"
    translation: "## Адреса электронной почты участников"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cee3a1e0e1031377:
    english: Only admins can see group member email addresses.  This is sometimes necessary to audit the members in a group.
    translation: Адреса электронной почты участников группы видны только администраторам. Иногда они нужны для проверки состава группы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4ff1112b058a3205:
    english: 'To see member email addresses: Use [data export](/en/user_manual/groups/data_export/) to download a CSV file, and open the file in Excel or Google sheets.'
    translation: Чтобы посмотреть адреса электронной почты участников, [экспортируйте данные](/en/user_manual/groups/data_export/) в CSV-файл и откройте его в Excel или Google Таблицах.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  105be57911f832fc:
    english: The export group data file shows every person and their email address in every subgroup.
    translation: В файле экспорта указаны все участники каждой подгруппы и их адреса электронной почты.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  20f87bcff4ec41e6:
    english: You can also search for members by email address in the members tab. So if you see someone you want to remove, you can search by email to remove them.
    translation: На вкладке **Участники** также можно искать людей по адресу электронной почты. Если вы хотите удалить участника, найдите его по адресу и удалите из группы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
