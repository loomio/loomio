  ef25fbaed498cfbe:
    english: The cooperative requires 60 percent participation for significant decisions, so Jamie enters **60** in the participation quorum field and starts the proposal.
    translation: La cooperativa exige una participación del 60 por ciento para las decisiones importantes. Por eso, Jamie introduce **60** en el campo de cuórum de participación e inicia la propuesta.
