    translated_on: '2026-09-29'
  347def7574cf5f1d:
    english: "## Actions"
    translation: "## Aktionen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '08ff4ccd500c2a69':
    english: The right sidebar contains actions for the whole thread. Some actions are also available from the three-dot menu (**⋯**) beside a thread on the group page.
    translation: Die rechte Seitenleiste enthält Aktionen für den gesamten Thread. Einige Aktionen findest du auch im Drei-Punkte-Menü (**⋯**) neben dem Thread auf der Gruppenseite.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e73701c7d36f95ef:
    english: The actions shown depend on your permissions. Group admins can manage threads, and group settings may allow members to perform some management actions. See [Group permissions](/en/user_manual/groups/settings/permissions).
    translation: Welche Aktionen angezeigt werden, hängt von deinen Berechtigungen ab. Gruppenadministratoren können Threads verwalten. Je nach Gruppeneinstellungen dürfen Mitglieder einige Verwaltungsaktionen ausführen. Siehe [Gruppenberechtigungen](/en/user_manual/groups/settings/permissions).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4fce317a163b0a40:
    english: "### Print"
    translation: "### Drucken"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9317d4c7c5ef4764:
    english: Select **Print** to generate a page suitable for printing. Use your browser's print dialog to save it as a PDF.
    translation: Wähle **Drucken**, um eine druckbare Seite zu erstellen. Über den Druckdialog deines Browsers kannst du sie als PDF speichern.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  443af0749df1db2a:
    english: "### Markdown"
    translation: "### Markdown"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eb0442148f7c042d:
    english: Select **Markdown** to save the complete thread as structured Markdown. Choose **Copy Markdown** to copy it to your clipboard, or **Download Markdown** to save it as a `.md` file. You can use it for meeting minutes, a document, an archive of decisions, an AI assistant, or another tool that supports Markdown.
    translation: Wähle **Markdown**, um den vollständigen Thread als strukturiertes Markdown zu speichern. Mit **Markdown kopieren** kopierst du ihn in die Zwischenablage. Mit **Markdown herunterladen** speicherst du ihn als `.md`-Datei. Du kannst ihn für ein Sitzungsprotokoll, ein Dokument, ein Archiv von Entscheidungen, einen KI-Assistenten oder ein anderes Werkzeug verwenden, das Markdown unterstützt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  80e3f57638b53cb4:
    english: The document begins with YAML front matter containing the thread key, group, creation date, last activity date, and tags. It then includes the discussion context and every comment, poll, vote, and outcome in the same order and nesting as the threaded view.
    translation: Das Dokument beginnt mit YAML-Kopfdaten. Sie enthalten den Thread-Schlüssel, die Gruppe, das Erstellungsdatum, das Datum der letzten Aktivität und die Schlagwörter. Danach folgen der Diskussionskontext und alle Kommentare, Abstimmungen, Stimmen und Fazits in derselben Reihenfolge und Verschachtelung wie in der Thread-Ansicht.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f99823b7b44e2cdd:
    english: Each poll is a section. Comments, votes, and outcomes are quoted, and replies are quoted beneath the item they answer. This shows where each person's text begins and ends. Each quote starts with one line showing the person, when they posted, the item's number in the thread, and any reactions. Votes and outcomes also say what they are. The thread key and item number identify each item in Loomio.
    translation: Jede Abstimmung bildet einen Abschnitt. Kommentare, Stimmen und Fazits werden als Zitate dargestellt. Antworten stehen als Zitate unter dem jeweiligen Beitrag. So ist erkennbar, wo der Text einer Person beginnt und endet. Jedes Zitat beginnt mit einer Zeile, die die Person, den Zeitpunkt des Beitrags, die Nummer des Beitrags im Thread und etwaige Reaktionen zeigt. Bei Stimmen und Fazits wird außerdem angegeben, worum es sich handelt. Der Thread-Schlüssel und die Beitragsnummer kennzeichnen jeden Beitrag in Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e5bdfbb4a0d7646f:
    english: Loomio applies the same visibility rules as the thread. Results and vote reasons you cannot see are not included, and voters are not identified in anonymous polls. If an open poll hides results until you vote, vote before exporting the thread. **Markdown** and **Print** are unavailable until you do.
    translation: Loomio wendet dieselben Sichtbarkeitsregeln wie im Thread an. Ergebnisse und Begründungen für Stimmen, die du nicht sehen darfst, werden nicht übernommen. Bei anonymen Abstimmungen werden die Abstimmenden nicht genannt. Wenn die Ergebnisse einer offenen Abstimmung bis zu deiner Stimmabgabe verborgen sind, stimme vor dem Export des Threads ab. Bis dahin sind **Markdown** und **Drucken** nicht verfügbar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7989d3386a42f180:
    english: 'For example, a discussion containing a comment, reactions, a proposal, two votes, a reply, and an outcome produces this Markdown:'
    translation: 'Eine Diskussion mit einem Kommentar, Reaktionen, einem Vorschlag, zwei Stimmen, einer Antwort und einem Fazit erzeugt beispielsweise dieses Markdown:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  275f4d9025c017c4:
    english: The headings and labels use your selected language. Content written by participants remains in its original language.
    translation: Überschriften und Bezeichnungen erscheinen in der von dir gewählten Sprache. Von Teilnehmenden verfasste Inhalte bleiben in ihrer ursprünglichen Sprache.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dab18fdf3c56269d:
    english: "### Thread settings and display"
    translation: "### Thread-Einstellungen und Anzeige"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7bc55279f97c6d1b:
    english: Group admins can select **Thread settings** to change how replies are arranged and configure other discussion options.
    translation: Gruppenadministratoren können unter **Thread-Einstellungen** festlegen, wie Antworten angeordnet werden, und weitere Optionen für die Diskussion einstellen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  32b2640ba23524aa:
    english: Choose **Timeline** to list items in the order they were posted, or **Threaded** to group replies beneath the item they respond to. Thread settings also control whether multiple polls may run at once and can set a maximum comment length. These settings apply to everyone in the discussion.
    translation: Wähle **Zeitleiste**, um Beiträge in der Reihenfolge ihrer Veröffentlichung anzuzeigen, oder **Als Thread**, um Antworten unter dem Beitrag anzuordnen, auf den sie sich beziehen. In den Thread-Einstellungen kannst du auch festlegen, ob mehrere Abstimmungen gleichzeitig laufen dürfen, und eine maximale Kommentarlänge einstellen. Diese Einstellungen gelten für alle in der Diskussion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a520339278bcc2a:
    english: "### Pin or unpin a thread"
    translation: "### Einen Thread anheften oder lösen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0433e7a61db60003:
    english: Pinned threads appear above other threads on the group page. Welcome discussions, news items, and announcements are typical uses for pinned threads.
    translation: Angeheftete Threads erscheinen auf der Gruppenseite über den anderen Threads. Häufig werden Begrüßungsdiskussionen, Neuigkeiten und Ankündigungen angeheftet.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b2712588a5e0aab3:
    english: Open the three-dot menu (**⋯**) beside the thread on the group page and select **Pin thread**. Pinned threads are ordered by the time they were pinned. To change their order, unpin and pin them again.
    translation: Öffne auf der Gruppenseite das Drei-Punkte-Menü (**⋯**) neben dem Thread und wähle **Diskussion anheften**. Angeheftete Threads werden nach dem Zeitpunkt des Anheftens sortiert. Um ihre Reihenfolge zu ändern, löse sie und hefte sie erneut an.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a0443f076d1b8ae5:
    english: Select **Unpin thread** to return a thread to the activity-based order.
    translation: Wähle **Anheftung lösen**, damit der Thread wieder nach Aktivität einsortiert wird.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b90a469963b02ffc:
    english: "### Move a thread"
    translation: "### Einen Thread verschieben"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8b2071f4625705e5:
    english: Select **Move thread** to move a thread to another group, subgroup, or to a direct thread. It will be visible to members of the destination group and anyone specifically invited to it.
    translation: Wähle **Thema verschieben**, um einen Thread in eine andere Gruppe oder Untergruppe zu verschieben oder daraus einen direkten Thread zu machen. Er ist dann für die Mitglieder der Zielgruppe und für alle Personen sichtbar, die eigens dazu eingeladen wurden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f09d5f2afce03ee8:
    english: |-
      >[!Tip]
      >Start a draft as a direct discussion or in a private subgroup, then move it to the group when it is ready.
    translation: |-
      >[!Tip]
      >Beginne einen Entwurf als direkte Diskussion oder in einer privaten Untergruppe. Wenn er fertig ist, verschiebe ihn in die Gruppe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c82562b641053308:
    english: To move selected activity rather than the whole thread, see [Moving items between threads](/en/user_manual/discussions/moving_items/).
    translation: Wenn du nur ausgewählte Aktivitäten statt des ganzen Threads verschieben möchtest, lies [Beiträge zwischen Threads verschieben](/en/user_manual/discussions/moving_items/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  be22d2980075fdaa:
    english: "### Lock or unlock a thread"
    translation: "### Einen Thread sperren oder entsperren"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e7c24a610fd2bf8b:
    english: Lock a thread to prevent comments or further changes. A thread can only be locked after its active polls have closed.
    translation: Sperre einen Thread, um Kommentare und weitere Änderungen zu verhindern. Du kannst ihn erst sperren, wenn alle laufenden Abstimmungen geschlossen sind.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  edb983bb6366aa6c:
    english: Select **Lock thread** under **Actions**. Locked threads are removed from the list of open discussions and marked with a **Locked** tag.
    translation: Wähle unter **Aktionen ** die Option **Thread sperren**. Gesperrte Threads werden aus der Liste offener Diskussionen entfernt und mit **Gesperrt** gekennzeichnet.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ba2794349524cc33:
    english: To find a locked thread, open the discussion filter on the group page and select **Locked**. Open the thread and select **Unlock thread** to allow comments and changes again.
    translation: Um einen gesperrten Thread zu finden, öffne den Diskussionsfilter auf der Gruppenseite und wähle **Gesperrt**. Öffne den Thread und wähle **Thread entsperren**, um Kommentare und Änderungen wieder zuzulassen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3a75fb1ad0ffab87:
    english: "### Delete a thread"
    translation: "### Eine Diskussion löschen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0103a5729bd6a095:
    english: Deleting a thread removes it permanently and cannot be undone. Lock the thread instead if you may need it again.
    translation: Wenn du eine Diskussion löschst, wird sie dauerhaft entfernt. Das lässt sich nicht rückgängig machen. Sperre den Thread stattdessen, wenn du ihn später noch brauchen könntest.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  daf08ca8895b0fe2:
    english: Select **Delete thread** and confirm the deletion.
    translation: Wähle **Diskussion löschen** und bestätige das Löschen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
