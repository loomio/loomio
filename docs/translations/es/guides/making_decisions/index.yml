  b27fab33a1dd5176:
    english: 'These guides explain complete decision processes: how to frame a decision, involve the right people, use discussion and proposals, respond to concerns, and record an outcome.'
    translation: 'Estas guías explican procesos de decisión completos: cómo plantear una decisión, incluir a las personas adecuadas, usar discusiones y propuestas, responder a las inquietudes y registrar una conclusión.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bcbe5e3fd75700a6:
    english: They are different from the proposal-template pages. A [proposal template](/en/user_manual/polls/proposals/) explains one proposal and its response options. A decision process can use several proposals over time.
    translation: Estas guías son distintas de las páginas sobre plantillas de propuestas. Una [plantilla de propuesta](/en/user_manual/polls/proposals/) explica una propuesta y sus opciones de respuesta. Un proceso de decisión puede incluir varias propuestas a lo largo del tiempo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  af00d65d38e41f8b:
    english: "## Choose a process"
    translation: "## Elige un proceso"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f41e345421a1a1e8:
    english: |-
      | Process | Who decides? | Main question |
      |---|---|---|
      | [Simple decision process](simple_decision_process) | Defined by the group | How can we discuss, test, and decide? |
      | [Advice process](advice_process) | A person or delegated team | What advice should the decision maker consider? |
      | [Consent process](consent_process) | The group | Is the proposal safe to try without a meaningful objection? |
      | [Consensus process](consensus_process) | The group | Can we reach collective agreement? |
    translation: |-
      | Proceso | ¿Quién decide? | Pregunta principal |
      |---|---|---|
      | [Proceso de decisión sencillo](simple_decision_process) | Según lo establecido por el grupo | ¿Cómo podemos debatir, poner a prueba una propuesta y decidir? |
      | [Proceso de asesoramiento](advice_process) | Una persona o un equipo delegado | ¿Qué consejos debe tener en cuenta quien toma la decisión? |
      | [Proceso de consentimiento](consent_process) | El grupo | ¿Podemos probar la propuesta sin que haya objeciones de peso? |
      | [Proceso de consenso](consensus_process) | El grupo | ¿Podemos llegar a un acuerdo colectivo? |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d2843889568043c0:
    english: Use the process required by your group's governing rules or decision policy. Different kinds of decisions may use different processes.
    translation: Usa el proceso que exijan las normas de funcionamiento o la política de decisiones de tu grupo. Para distintos tipos de decisiones pueden usarse distintos procesos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bb120914edd79d13:
    english: If you only need help choosing a response format, compare [Proposals](/en/user_manual/polls/proposals/) and [Polls](/en/user_manual/polls/proposal_types/). If you administer the reusable choices shown when someone selects **Start a vote**, see [Poll templates](/en/user_manual/polls/poll_templates/).
    translation: Si solo necesitas ayuda para elegir un formato de respuesta, compara [Propuestas](/en/user_manual/polls/proposals/) y [Sondeos](/en/user_manual/polls/proposal_types/). Si administras las opciones reutilizables que aparecen cuando alguien selecciona **Iniciar una votación**, consulta [Plantillas de sondeos](/en/user_manual/polls/poll_templates/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
