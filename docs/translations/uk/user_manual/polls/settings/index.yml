---
navigation_title: Налаштування
blocks:
  145c23b2412eff98:
    english: "# Proposal and poll settings"
    translation: "# Налаштування пропозицій та опитувань"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e0347d976f79179:
    english: "## Setting up a proposal or poll"
    translation: "## Налаштування пропозиції або опитування"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e5d6f17041c19d41:
    english: "### Proposal and poll templates"
    translation: "### Шаблони пропозицій та опитувань"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8913cabb2f1f8227:
    english: 'Choose the proposal template you want to use. '
    translation: Виберіть шаблон пропозиції, який хочете використати.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3620f6321777ca50:
    english: "### Add content"
    translation: "### Додайте вміст"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bc7ebb222e9ff4d1:
    english: "**Group:** Check that the correct group is selected for your proposal or poll."
    translation: "**Група:** Перевірте, чи для вашої пропозиції або опитування вибрано потрібну групу."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3a1d375da02f3a49:
    english: "**Title:** Give your proposal or poll a short, relevant title."
    translation: "**Назва:** Дайте пропозиції або опитуванню коротку назву, що відповідає темі."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a62a7e63f9db295c:
    english: "**Details:** Explain what you are asking of people and include enough details so everyone knows what it means to vote.  "
    translation: "**Деталі:** Поясніть, про що ви запитуєте людей. Додайте достатньо відомостей, щоб усі розуміли, що означає їхній голос."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e17c2ab4878716f2:
    english: The predefined templates include some prompts to help you write a good proposal - use these or add your own details.
    translation: У готових шаблонах є підказки, які допоможуть вам написати пропозицію. Скористайтеся ними або додайте власні відомості.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  74daa7f0cc476971:
    english: Avoid combining a range of ideas in one proposal, because people might agree to some aspects but not others and be unsure how to respond. You can break complex decisions down into multiple proposals.
    translation: Не поєднуйте різні ідеї в одній пропозиції. Люди можуть погоджуватися з одними частинами й не погоджуватися з іншими, тому їм буде складно визначитися з відповіддю. Складне рішення можна розділити на кілька пропозицій.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0da6e449688940bb:
    english: When making a proposal, state your expectations and describe the impact the proposal will have if adopted. If it's a formal or binding proposal it's often worth describing what it means if the proposal is not adopted.
    translation: Коли вносите пропозицію, зазначте свої очікування та опишіть, що зміниться, якщо її ухвалять. Якщо пропозиція має формальну або обов’язкову силу, варто також пояснити, що означатиме її відхилення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a6db66b75f495e21:
    english: Use the formatting tools to support your poll.  For example, attach a document file with the paperclip icon, insert an image, link to a website or online document, or even embed a video.
    translation: Використовуйте засоби форматування, щоб доповнити опитування. Наприклад, прикріпіть документ за допомогою значка скріпки, вставте зображення, додайте посилання на вебсайт чи онлайн-документ або вбудуйте відео.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f4f85f131878c36d:
    english: "### Voting options"
    translation: "### Варіанти голосування"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  616aab74af2072ba:
    english: Each proposal and poll template provides options for voting.
    translation: Кожен шаблон пропозиції та опитування містить варіанти голосування.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7a85de7eefe74178:
    english: Depending on the template, you can edit, remove, reorder, or add voting options to suit the decision process you are running.
    translation: Залежно від шаблону ви можете редагувати, видаляти, змінювати порядок або додавати варіанти голосування відповідно до вашого способу ухвалення рішень.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9bc44bf4b28ac5d8:
    english: "- Use the pencil icon to edit voting option \n- Use the trash can icon to remove unwanted voting options\n- Use the handle to move the order of voting options\n- Add voting options with **Add option** when the template allows custom options"
    translation: "- Натисніть значок олівця, щоб відредагувати варіант голосування \n- Натисніть значок кошика, щоб видалити непотрібний варіант голосування\n- Перетягніть варіант за маркер, щоб змінити його місце в списку\n- Додайте варіанти голосування за допомогою кнопки **Додати варіант відповіді**, якщо шаблон це дозволяє"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2062f39334fbd629:
    english: |-
      ### Edit voting options
      There is a lot of flexibility to configure voting options to suit the way your organization makes decisions.
    translation: |-
      ### Редагування варіантів голосування
      Ви можете налаштувати варіанти голосування відповідно до того, як ваша організація ухвалює рішення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5ac5b47c81fe187b:
    english: 'Use the pencil icon alongside the voting option to open the edit modal:'
    translation: 'Натисніть значок олівця поруч із варіантом голосування, щоб відкрити вікно редагування:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3c791f8140ad3b39:
    english: "**Option name:** A short name for the option."
    translation: "**Назва варіанта:** Коротка назва варіанта."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  77a0fb7409cf1711:
    english: "**Icon:** Select an icon for the option, such as thumbs up, thumbs down, abstain, or block."
    translation: "**Значок:** Виберіть значок для варіанта, наприклад піднятий або опущений великий палець, утримання чи блокування."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9126ee91e5d1cb95:
    english: "**Meaning:** A sentence that explains what choosing this options means."
    translation: "**Значення:** Речення, яке пояснює, що означає вибір цього варіанта."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e88d83b93ba47666:
    english: "**Reason prompt:** A question to prompt voters to provide their reasoning or reconsider their position. "
    translation: "**Підказка щодо причини:** Запитання, яке спонукає людей пояснити свій вибір або переглянути свою позицію."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d05197892ea46087:
    english: "### Opening time"
    translation: "### Час початку голосування"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1b56f0ad52a3aed8:
    english: By default, voting opens immediately when you create the poll. If you want to schedule voting to open at a later time, uncheck **Voting opens immediately** and select an opening date and time.
    translation: За замовчуванням голосування відкривається відразу після створення опитування. Щоб відкрити його пізніше, зніміть позначку **Голосування відкривається негайно** та виберіть дату й час початку.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  48ccc43734b062eb:
    english: This is useful to give time for discussion before voting opens, or to ensure a poll or proposal is correctly set up and scheduled to happen at the right time.
    translation: Так ви можете залишити час для обговорення перед голосуванням або підготувати опитування чи пропозицію заздалегідь і відкрити голосування в потрібний час.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b68fccc3132988ff:
    english: When a poll has a scheduled opening time, you can add voters before voting opens. Voters will be notified when voting opens, rather than when they are added.
    translation: Якщо для опитування заплановано час початку, ви можете додати виборців до відкриття голосування. Вони отримають сповіщення, коли голосування відкриється, а не коли ви їх додасте.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  82d4cacfa780dd98:
    english: "**Notify voters when poll opens:** When checked (default), all voters will receive a notification when voting opens. Uncheck this if you want to open voting without sending notifications."
    translation: "**Сповістити виборців про початок опитування:** Якщо цей параметр увімкнено (за замовчуванням), усі виборці отримають сповіщення про початок голосування. Зніміть позначку, щоб відкрити голосування без сповіщень."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d084620657803f93:
    english: "**Closing date and time:** Select the closing date and time for your poll."
    translation: "**Дата й час завершення:** Виберіть дату й час завершення опитування."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c0472419a2671222:
    english: Give sufficient time for people to vote. You could time the proposal so it closes before a meeting, or avoid closing over a weekend, so that people will receive a timely reminder. If necessary, you can close the poll early or extend the closing time.
    translation: Залиште людям достатньо часу для голосування. Ви можете завершити голосування за пропозицією до початку зустрічі або не планувати його завершення на вихідні, щоб люди вчасно отримали нагадування. За потреби опитування можна завершити раніше або продовжити термін голосування.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c87f87e6cbc1a4d7:
    english: "**Who can vote?** Invite everyone in the group or only specific people that you invite."
    translation: "**Хто може голосувати?** Запросіть усіх учасників групи або лише вибраних вами людей."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e02a9cefc3082334:
    english: |-
      You can later add people to an 'Invite people only' poll. For identified polls,
      you can also remove people who should no longer be eligible to vote. People
      cannot be removed from an anonymous poll.
    translation: |-
      Ви можете пізніше додати людей до опитування з голосуванням лише за запрошенням. В опитуванні з відкритими іменами
      ви також можете вилучити людей, які більше не мають права голосу. Вилучити людей
      з анонімного опитування не можна.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2e959157d75ed7bd:
    english: "## More settings"
    translation: "## Додаткові налаштування"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3d4443d3e6d3b13d:
    english: |-
      ### Reminder
      Send a 'Closing soon' notification 24 hours before the poll closes. This can be an opportunity for people to see how others have voted and reconsider their own vote, or just a way to increase participation in the poll.
    translation: |-
      ### Нагадування
      Надішліть сповіщення про наближення завершення за 24 години до кінця опитування. Це дасть людям змогу побачити, як проголосували інші, і переглянути свій голос або просто допоможе залучити більше людей до голосування.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  62067c0573d7a64e:
    english: |-
      Setting options:
      - Nobody
      - Author
      - Undecided voters (default)
      - All voters
    translation: |-
      Варіанти налаштування:
      - Нікому
      - Автору
      - Тим, хто ще не визначився (за замовчуванням)
      - Усім виборцям
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6cd67c3f92302551:
    english: |-
      For an anonymous poll lasting at least 24 hours, Loomio automatically reminds
      eligible people who have not voted during the final 24 hours. This reminder
      cannot be changed in the poll settings.
    translation: |-
      Якщо анонімне опитування триває щонайменше 24 години, Loomio автоматично нагадує
      людям, які мають право голосу, але ще не проголосували, протягом останніх 24 годин. Це нагадування
      не можна змінити в налаштуваннях опитування.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72f172271e2a636a:
    english: |-
      ### Anonymous voting
      If enabled, votes are stored separately from voter identities. Results appear after voting closes, and voters cannot add reasons, review their submitted vote, or change it.
    translation: |-
      ### Анонімне голосування
      Якщо цей параметр увімкнено, голоси зберігаються окремо від даних про виборців. Результати з’являються після завершення голосування. Виборці не можуть додавати пояснення, переглядати поданий голос або змінювати його.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3393027493510f2f:
    english: See [Anonymous voting](/en/user_manual/polls/anonymous_voting) for details about how voter identities are separated from submitted votes, what information is retained, and the limits of the protection.
    translation: Докладніше про відокремлення даних виборців від поданих голосів, збережені відомості та межі цього захисту читайте на сторінці [Анонімне голосування](/en/user_manual/polls/anonymous_voting).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b731b9118e48dee5:
    english: |-
      > [!WARNING]
      > Once a poll has started you cannot edit the poll to make it anonymous or to undo the anonymous setting.
    translation: |-
      > [!WARNING]
      > Після початку опитування ви не зможете змінити його на анонімне або вимкнути анонімність.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e8660d089a3c07bb:
    english: |-
      > [!WARNING]
      > You cannot re-open an anonymous poll after it has closed. Submitted votes are not linked to the participation records that show who has voted.
    translation: |-
      > [!WARNING]
      > Після завершення анонімного опитування ви не зможете відкрити його знову. Подані голоси не пов’язані із записами про участь, які показують, хто проголосував.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  aaaaa28a4b435835:
    english: |-
      ### Vote reason
      It can be helpful to understand why people voted the way they did. With this setting, you can prompt people to share their thoughts when they vote.
    translation: |-
      ### Причина голосування
      Розуміння причин вибору може допомогти ухвалити рішення. За допомогою цього налаштування ви можете запропонувати людям пояснити свій голос під час голосування.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  309645182b157738:
    english: 'Available settings depend on the template:'
    translation: 'Доступні налаштування залежать від шаблону:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d67e2c2914e91a6f:
    english: |-
      - **Optional** lets voters choose whether to give a reason
      - **Required for disagree or block** requires a reason when the selected option
        uses the Disagree or Block voting icon
      - **Required for block** requires a reason when the selected option uses the
        Block voting icon
      - **Required** requires every voter to give a reason
      - **Disabled** removes the vote-reason field
    translation: |-
      - **Необов'язково** — виборці самі вирішують, чи вказувати причину
      - **Обов'язково для незгоди або блокування** — причину потрібно вказати, якщо вибраний варіант
        має значок голосування «Не згоден» або «Блокувати»
      - **Обов'язково для блокування** — причину потрібно вказати, якщо вибраний варіант має
        значок голосування «Блокувати»
      - **Обов'язково** — кожен виборець має вказати причину
      - **Інвалід** — поле для причини голосування не відображається
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  af5e7c0557aec611:
    english: |-
      The conditional settings follow the voting icon rather than the option name.
      They still apply if you rename Disagree to a term such as Objection. The
      Consent template defaults to **Required for disagree or block**, while the
      Consensus template defaults to **Required for block**. Other templates default
      to **Optional**, except Question rounds where the response itself is required.
      The poll author can change the setting for an individual poll.
    translation: |-
      Умовні налаштування залежать від значка голосування, а не від назви варіанта.
      Вони діють, навіть якщо ви перейменуєте «Не згоден», наприклад, на «Заперечення». У
      шаблоні «Згода» за замовчуванням вибрано **Обов'язково для незгоди або блокування**, а в
      шаблоні «Консенсус» — **Обов'язково для блокування**. В інших шаблонах за замовчуванням
      вибрано **Необов'язково**, крім раундів запитань, де сама відповідь є обов'язковою.
      Автор опитування може змінити це налаштування для окремого опитування.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ecb0d89c623db459:
    english: "**Limit reason to maximum 500 characters:** Keeping vote reasons short makes them easier to understand. A collection of concise reasons is a great resource for making a decision.  This setting is ticked by default. Untick to allow for longer reasons."
    translation: "**Обмежити причину до 500 символів:** Короткі пояснення голосів легше зрозуміти. Добірка лаконічних пояснень допомагає ухвалити рішення. За замовчуванням це налаштування ввімкнено. Зніміть позначку, щоб дозволити довші пояснення."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  35bd4f116b9ff26a:
    english: |-
      ### Hide results
      If you want people to vote without knowing how others have voted, you can hide the results of the poll.  Useful if you do not want people to be affected by how other people have voted.
    translation: |-
      ### Приховати результати
      Ви можете приховати результати опитування, щоб люди голосували, не знаючи, як проголосували інші. Це допомагає уникнути впливу чужих голосів на їхній вибір.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8cc5b82f4cc5e94e:
    english: |-
      Setting options:
      - Do not hide results
      - Hide results until a vote is cast
