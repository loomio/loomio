    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d633f08de5eb744d:
    english: Use the paper clip icon, just below the text form, to add file attachments from your computer.
    translation: Щоб додати файл із комп’ютера, натисніть значок скріпки під текстовим полем.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
