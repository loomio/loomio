  cb0d8b2f2c8b9630:
    english: You will be invited to type the name of your group (*case sensitive*) to confirm you wish to delete your group.
    translation: Zur Bestätigung musst du den Namen deiner Gruppe eingeben (*Groß- und Kleinschreibung beachten*).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
