---
navigation_title: Discussiesjablonen
blocks:
  80c5dfc46bb963d2:
    english: "# Discussion templates"
    translation: "# Discussiesjablonen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  488fbd5167707cba:
    english: Discussion templates help your group start discussions the same way each time. A template can supply a title, context, tags, and instructions for the person starting the discussion. It also sets defaults, such as whether to notify the whole group and which polls to suggest.
    translation: Met discussiesjablonen kan jouw groep discussies telkens op dezelfde manier starten. Een sjabloon kan een titel, beschrijving, labels en instructies bevatten voor degene die de discussie start. Het legt ook standaardinstellingen vast, zoals wie een melding krijgt en welke peilingen worden voorgesteld.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2571bc9cc405d927:
    english: Every new discussion in a group starts from a template. When someone selects **Start discussion**, Loomio shows the group's templates. Even **Blank template** is a template, so your group can change its defaults too.
    translation: Elke nieuwe discussie in een groep begint met een sjabloon. Als iemand **Start discussie** selecteert, toont Loomio de sjablonen van de groep. Ook **Lege sjabloon** is een sjabloon, dus jouw groep kan de standaardinstellingen ervan aanpassen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  834ac31697ef254b:
    english: Templates work well for processes your group repeats, such as project reviews, advice processes, meeting preparation, funding decisions, or document approvals. The person starting the discussion can still edit everything before they start it.
    translation: Sjablonen zijn handig voor processen die jouw groep herhaalt, zoals projectevaluaties, adviestrajecten, vergadervoorbereiding, financieringsbesluiten en goedkeuring van documenten. Degene die de discussie start, kan alles nog aanpassen voordat de discussie begint.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  74d1c850f63c0518:
    english: "## How templates are used"
    translation: "## Hoe sjablonen worden gebruikt"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6e5927441d982c01:
    english: |-
      1. A member selects **Start discussion** on the group page.
      2. Loomio lists the group's visible templates. Each one shows its title and subtitle.
      3. The member selects a template. Loomio opens the new discussion form, filled in from the template.
      4. The template's help appears at the top of the form as guidance.
      5. The member edits the title, context, tags, and invite list, then selects **Start discussion**.
    translation: |-
      1. Een lid selecteert **Start discussie** op de groepspagina.
      2. Loomio toont de zichtbare sjablonen van de groep. Bij elk sjabloon staan de titel en ondertitel.
      3. Het lid selecteert een sjabloon. Loomio opent het formulier voor een nieuwe discussie, ingevuld met de gegevens uit het sjabloon.
      4. De sjabloonhulp verschijnt bovenaan het formulier.
      5. Het lid past de titel, beschrijving, labels en uitnodigingslijst aan en selecteert **Start discussie**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  464984a60c23366b:
    english: Changing a template affects only discussions started after the change. Discussions already started from it keep their content and settings.
    translation: Een wijziging aan een sjabloon geldt alleen voor discussies die daarna worden gestart. Eerder gestarte discussies behouden hun inhoud en instellingen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  70c22d24ec0d248b:
    english: "## Choose who is notified by default"
    translation: "## Kies wie standaard een melding krijgt"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  77feebf56c2ee9a7:
    english: 'The **Invite** setting controls who the new discussion form invites by default. It has two options:'
    translation: 'De instelling **Uitnodigen** bepaalt wie standaard wordt uitgenodigd in het formulier voor een nieuwe discussie. Er zijn twee opties:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6c93f4222436028f:
    english: |-
      - **Everyone in the group**: the group appears in the discussion form's **Invite** field, and every member is notified when the discussion starts.
      - **None**: the **Invite** field starts empty. Nobody is notified unless the author adds people.
    translation: |-
      - **Iedereen in de groep**: de groep staat in het veld **Uitnodigen** van het discussieformulier. Elk lid krijgt een melding wanneer de discussie start.
      - **Geen**: het veld **Uitnodigen** is aanvankelijk leeg. Niemand krijgt een melding, tenzij de auteur mensen toevoegt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  17cca49613fff23d:
    english: Loomio's built-in templates, including **Blank template**, use **Everyone in the group**. If your group does not want every new discussion to notify all members, edit the templates your group uses and set **Invite** to **None**.
    translation: De ingebouwde sjablonen van Loomio, waaronder **Lege sjabloon**, gebruiken **Iedereen in de groep**. Wil jouw groep niet dat alle leden bij elke nieuwe discussie een melding krijgen? Bewerk dan de sjablonen die de groep gebruikt en stel **Uitnodigen** in op **Geen**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5fd184e64e0605bc:
    english: The author can always change the invite list before starting the discussion. They can remove the group to notify nobody, or add specific people instead. This setting only affects notifications. Group members can still find and read the discussion in the group, whichever option you choose.
    translation: De auteur kan de uitnodigingslijst altijd aanpassen voordat de discussie start. Die kan de groep verwijderen zodat niemand een melding krijgt, of specifieke mensen toevoegen. Deze instelling heeft alleen invloed op meldingen. Groepsleden kunnen de discussie in de groep nog steeds vinden en lezen, welke optie je ook kiest.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  58f24313ca36c890:
    english: The group is added to the invite list only when the author is allowed to notify the whole group. Admins can always do this. Members can do it when **Members can notify everyone in the group** is enabled in the group's permissions.
    translation: De groep wordt alleen aan de uitnodigingslijst toegevoegd als de auteur de hele groep een melding mag sturen. Beheerders kunnen dit altijd. Leden kunnen dit wanneer **Leden kunnen iedereen in de groep op de hoogte stellen** is ingeschakeld bij de groepsrechten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  33afd174376e933b:
    english: "## Template settings"
    translation: "## Sjablooninstellingen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b02be20543f228a7:
    english: 'Group admins can edit a template from the action menu beside it in the template list. The form has these settings:'
    translation: 'Groepsbeheerders kunnen een sjabloon bewerken via het actiemenu ernaast in de sjablonenlijst. Het formulier heeft deze instellingen:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f2fc57fe20100911:
    english: |-
      - **Template title**: the short name shown in the template list.
      - **Template subtitle**: one line explaining when to use the template.
      - **Template help**: instructions shown at the top of the new discussion form. Use it to explain the process and link to resources. It is not part of the discussion.
      - **Group**: whether the template starts a discussion in the group or a direct discussion. A direct discussion is visible only to the people invited to it.
      - **Default title**: a title filled in for each new discussion. The author can edit it.
      - **Example title**: an example shown in an empty title field. Use it when a default title would not fit every discussion.
      - **Tags**: tags applied to each new discussion. The author can remove them.
      - **Context**: the starting text of the discussion. Use headings, questions, or links to guide what people write.
      - **Invite**: whether to invite everyone in the group by default. See [Choose who is notified by default](#choose-who-is-notified-by-default).
      - **Poll templates**: polls suggested for this process. They are listed on the new discussion form. They also appear first when someone starts a poll in the discussion. They do not start automatically.
      - **Allow concurrent polls**: whether more than one poll can be open in the discussion at the same time.
      - **Comment length limit**: an optional maximum length for comments.
    translation: |-
      - **Sjabloontitel**: de korte naam in de sjablonenlijst.
      - **Sjabloon ondertitel**: één regel die uitlegt wanneer je het sjabloon gebruikt.
      - **Sjabloonhulp**: instructies bovenaan het formulier voor een nieuwe discussie. Gebruik deze om het proces uit te leggen en naar bronnen te linken. Ze worden geen onderdeel van de discussie.
      - **Groep**: of het sjabloon een discussie in de groep of een directe discussie start. Een directe discussie is alleen zichtbaar voor de mensen die ervoor zijn uitgenodigd.
      - **Standaardtitel**: een titel die voor elke nieuwe discussie wordt ingevuld. De auteur kan deze aanpassen.
      - **Voorbeeldtitel**: een voorbeeld in een leeg titelveld. Gebruik dit als één standaardtitel niet bij elke discussie past.
      - **Labels**: labels die op elke nieuwe discussie worden toegepast. De auteur kan ze verwijderen.
      - **Beschrijving**: de begintekst van de discussie. Gebruik koppen, vragen of links om richting te geven aan wat mensen schrijven.
      - **Uitnodigen**: of iedereen in de groep standaard wordt uitgenodigd. Zie [Kies wie standaard een melding krijgt](#choose-who-is-notified-by-default).
      - **Enquêtesjablonen**: peilingen die voor dit proces worden voorgesteld. Ze staan op het formulier voor een nieuwe discussie. Ze verschijnen ook als eerste wanneer iemand een peiling in de discussie start. Ze starten niet automatisch.
      - **Gelijktijdige peilingen toestaan**: of er meer dan één peiling tegelijk open mag zijn in de discussie.
      - **Maximale lengte van reacties**: een optionele maximumlengte voor reacties.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a9e44919507a613:
    english: Use a default title only when it will stay accurate. Otherwise, write an example title that prompts the author to name the specific review, period, document, or decision.
    translation: Gebruik alleen een standaardtitel als die steeds klopt. Schrijf anders een voorbeeldtitel die de auteur helpt de specifieke evaluatie, periode, het document of het besluit te benoemen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c5db289e27f54169:
    english: "## Example: bottle trial review"
    translation: "## Voorbeeld: evaluatie van een proef met herbruikbare flessen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  89e7b8f9b36a8ae7:
    english: Oatmilk Cooperative reviews its returnable-bottle trial after each cycle. Its template is titled "Bottle trial review" and has a default title. It adds the "Bottle trial" tag. Its context asks members to read the weekly report and consider return rates, washing records, cafe feedback, and transport costs. It recommends a Sense check followed by Consent.
    translation: Oatmilk Cooperative evalueert haar proef met herbruikbare flessen na elke cyclus. Het sjabloon heet "Evaluatie flessenproef" en heeft een standaardtitel. Het voegt het label "Flessenproef" toe. De beschrijving vraagt leden het weekrapport te lezen en te kijken naar retourpercentages, wasregistraties, reacties van cafés en transportkosten. Het sjabloon stelt eerst een Sense check en daarna Consent voor.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f896031f8dcc2f84:
    english: This works as a template because the purpose and evidence stay the same each cycle. Only the observations and decisions change.
    translation: Dit werkt als sjabloon omdat het doel en de informatie waarop de evaluatie berust elke cyclus hetzelfde blijven. Alleen de waarnemingen en besluiten veranderen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7e5955c442f6c8ae:
    english: "## Create a template"
    translation: "## Een sjabloon maken"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c2b2bc41cbe6f6a:
    english: Group admins can select **New template** from the template list. Choose an example from Loomio's gallery or start with a blank template, then adapt it and save it.
    translation: Groepsbeheerders kunnen **Nieuwe sjabloon** selecteren in de sjablonenlijst. Kies een voorbeeld uit de galerij van Loomio of begin met een leeg sjabloon. Pas het aan en sla het op.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a9cb80d574e2d865:
    english: You can search or filter the gallery. An example is not added to your group until you save it.
    translation: Je kunt de galerij doorzoeken of filteren. Een voorbeeld wordt pas aan jouw groep toegevoegd wanneer je het opslaat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1f0dab3f50320e75:
    english: "## Manage the template list"
    translation: "## De sjablonenlijst beheren"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7462593f2f6d1614:
    english: When a group is created, Loomio adds a set of templates suited to the kind of group. Only **Blank template** and **Practice discussion** are visible at first. The others are hidden, and admins can unhide them.
    translation: Wanneer een groep wordt gemaakt, voegt Loomio sjablonen toe die passen bij het soort groep. In het begin zijn alleen **Lege sjabloon** en **Praktijkbespreking** zichtbaar. De andere zijn verborgen. Beheerders kunnen ze zichtbaar maken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e6f7eaa63e353ef7:
    english: 'Group admins can use the action menu beside a template to:'
    translation: 'Groepsbeheerders kunnen het actiemenu naast een sjabloon gebruiken om:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e8767178e42cd4e0:
    english: |-
      - edit its content and settings;
      - hide it from the template list;
      - unhide it from **Hidden templates**;
      - rearrange the order of visible templates;
      - export it as a JSON file; or
      - delete it.
    translation: |-
      - de inhoud en instellingen te bewerken;
      - het te verbergen uit de sjablonenlijst;
      - het weer zichtbaar te maken via **Verborgen sjablonen**;
      - de volgorde van zichtbare sjablonen te wijzigen;
      - het als JSON-bestand te exporteren; of
      - het te verwijderen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5d4cbc918551c211:
    english: Hiding a template keeps it for later use. Deleting a template does not delete discussions started from it.
    translation: Een verborgen sjabloon blijft beschikbaar voor later gebruik. Als je een sjabloon verwijdert, blijven de discussies die ermee zijn gestart bestaan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c0ae844752e20ef:
    english: "## Share templates between groups"
    translation: "## Sjablonen delen tussen groepen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  acf646688b9b79f4:
    english: Select **Export json** in a template's action menu to download it as a file. To use it in another group, select **New template**, then **Import json**. The form opens with the imported content so you can review it before saving.
    translation: Selecteer **Exporteer JSON** in het actiemenu van een sjabloon om het als bestand te downloaden. Wil je het in een andere groep gebruiken? Selecteer daar **Nieuwe sjabloon** en vervolgens **Importeer json**. Het formulier opent met de geïmporteerde inhoud, zodat je die kunt controleren voordat je het sjabloon opslaat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a168253bda3147e8:
    english: Links to custom poll templates are not included in the file. Export and import those poll templates separately.
    translation: Links naar aangepaste enquêtesjablonen staan niet in het bestand. Exporteer en importeer die enquêtesjablonen apart.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4833d57d46ccb98e:
    english: "## Let members create templates"
    translation: "## Leden sjablonen laten maken"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1ac138e713feea59:
    english: By default, only group admins can create and edit templates. An admin can enable **Members can create templates** under **Group settings** → **Permissions**.
    translation: Standaard kunnen alleen groepsbeheerders sjablonen maken en bewerken. Een beheerder kan **Leden kunnen sjablonen maken.** inschakelen onder **Groepsinstellingen** → **Toestemmingen**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  889e8792d7937424:
    english: When this is enabled, members can create discussion and poll templates and edit the templates they created. Admins can edit every template in the group. A member's template appears in the group's template list once it is saved, so agree on naming and review practices before enabling this permission.
    translation: Als deze instelling is ingeschakeld, kunnen leden discussie- en enquêtesjablonen maken en hun eigen sjablonen bewerken. Beheerders kunnen elk sjabloon in de groep bewerken. Zodra een lid een sjabloon opslaat, verschijnt het in de sjablonenlijst van de groep. Spreek daarom vooraf af hoe je sjablonen benoemt en controleert.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1284dfc3e68170d8:
    english: "## Templates for non-members"
    translation: "## Sjablonen voor niet-leden"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5c701c3795724027:
    english: If **Non-members can start discussions** is enabled, people outside the group choose from the same template list. Their discussion form never invites the group by default. See [Collect private submissions](/en/user_manual/discussions/private_submissions).
    translation: Als **Niet-leden kunnen discussies starten** is ingeschakeld, kiezen mensen buiten de groep uit dezelfde sjablonenlijst. In hun discussieformulier wordt de groep nooit standaard uitgenodigd. Zie [Privé-inzendingen verzamelen](/en/user_manual/discussions/private_submissions).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  630a5d69a7093105:
    english: "## Related"
    translation: "## Gerelateerd"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  32717eb37456dbfd:
    english: "- [Poll templates](/en/user_manual/polls/poll_templates)"
    translation: "- [Enquêtesjablonen](/en/user_manual/polls/poll_templates)"
    status: machine
