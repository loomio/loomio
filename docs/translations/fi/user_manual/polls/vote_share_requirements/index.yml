  842038ffbd273e57:
    english: The cooperative's process requires at least 75 percent of eligible voters to support the proposal. Jamie sets the requirement to **At least 75% of Eligible voters**.
    translation: Osuuskunnan prosessi edellyttää, että vähintään 75 prosenttia äänestäjäoikeutetuista kannattaa ehdotusta. Jamie asettaa vaatimukseksi **Vähintään 75% Äänestäjäoikeutetut**.
    status: machine
