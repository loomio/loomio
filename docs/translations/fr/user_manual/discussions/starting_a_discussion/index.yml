---
navigation_title: Démarrer une discussion
blocks:
  8fae4100a4f3548b:
    english: "# Start a discussion"
    translation: "# Démarrer une discussion"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4ba984e9573c27ff:
    english: Starting a Loomio discussion is like writing an email. The subject line of an email is like the discussion title, and the text you write in an email is like the context of a discussion.
    translation: Démarrer une discussion sur Loomio ressemble à la rédaction d’un courriel. L’objet du courriel correspond au titre de la discussion, et son texte au contexte de la discussion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4f81447c072f5dfe:
    english: As you add people in the send list of your email, in Loomio you can invite people individually or as a group to the discussion - they will receive an email notification with the content of your discussion.
    translation: Comme lorsque vous ajoutez des destinataires à un courriel, vous pouvez inviter des personnes à une discussion sur Loomio, individuellement ou en groupe. Elles recevront une notification par courriel contenant votre discussion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2408b54e3b78a282:
    english: People can reply to your discussion via email and their comments will appear in the discussion.
    translation: Les personnes peuvent répondre à votre discussion par courriel. Leurs commentaires apparaîtront dans la discussion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  24ced64c5c4cf853:
    english: As with an email, a discussion may be a simple question, or a more detailed introduction to a topic with links or files attached for background information.
    translation: Comme un courriel, une discussion peut contenir une simple question ou présenter un sujet plus en détail, avec des liens ou des fichiers joints pour donner du contexte.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ec39413fa07094c8:
    english: "## New discussion"
    translation: "## Nouvelle discussion"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  92b37b2e208bfd57:
    english: Find the **New discussion** button on your Loomio group page to start a new discussion.
    translation: Sur la page de votre groupe Loomio, cliquez sur **Nouvelle discussion** pour démarrer une discussion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  515ac46bdfccb401:
    english: You can start a discussion within your Loomio group or any subgroup.
    translation: Vous pouvez démarrer une discussion dans votre groupe Loomio ou dans l’un de ses sous-groupes.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ef9721ba6b69b86b:
    english: "![New discussion button on the Oatmilk Cooperative page](new-discussion-button.png)"
    translation: "![Bouton Nouvelle discussion sur la page de la coopérative Oatmilk](new-discussion-button.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1cf9e569475cd2cc:
    english: "![New discussion form for planning the returnable bottle trial](new-discussion-example.png)"
    translation: "![Formulaire de nouvelle discussion pour planifier un essai de bouteilles consignées](new-discussion-example.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f973f5b9f1c4b1dd:
    english: |-
      ### Group
      Check the name of the group or subgroup is correct for your discussion.  Anyone in this group will be able to see the discussion. You can also start the discussion in another group or as a 'direct' discussion (no group).
    translation: |-
      ### Groupe
      Vérifiez que le groupe ou le sous-groupe choisi pour votre discussion est le bon. Toutes les personnes de ce groupe pourront voir la discussion. Vous pouvez aussi démarrer la discussion dans un autre groupe ou sous forme de discussion « directe » (sans groupe).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f0b0bda9877ce0ed:
    english: |-
      >[!Tip]
      >If you are not ready to make the discussion visible in your group, start the discussion as 'direct'.  You can move the discussion to your Loomio group when ready.
    translation: |-
      >[!Tip]
      >Si vous ne souhaitez pas encore rendre la discussion visible dans votre groupe, démarrez une discussion « directe ». Vous pourrez la déplacer vers votre groupe Loomio quand vous serez prêt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cd1b45c3cb71503b:
    english: "### Invite and notify"
    translation: "### Inviter et notifier"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f3f388d23b06b25c:
    english: The **Invite** field controls who receives the new discussion immediately.
    translation: Le champ **Inviter** détermine qui reçoit immédiatement une notification de la nouvelle discussion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c1b5c23770d3692:
    english: Group members can see a discussion in their group even if you do not notify them. Adding a group member to **Invite** sends them an email notification and a notification in Loomio.
    translation: Les membres du groupe peuvent voir une discussion dans leur groupe même si vous ne leur envoyez pas de notification. Ajouter un membre du groupe dans **Inviter** lui envoie une notification par courriel et dans Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e2e5906a39131506:
    english: Select a group to notify everyone in it, or expand the group to choose individual members. Select the × beside a name to remove that person from the notification.
    translation: Sélectionnez un groupe pour notifier tous ses membres, ou développez-le pour choisir des membres individuellement. Sélectionnez le × à côté d’un nom pour retirer cette personne des destinataires de la notification.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  81b57efbb3c428b7:
    english: "![Invite field expanded to show individual recipients](../notifying_people/thread_notification.png)"
    translation: "![Champ Inviter développé pour afficher les destinataires individuels](../notifying_people/thread_notification.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5cbd2b7b0bcc486f:
    english: Start typing a member's name and select it from the list.
    translation: Commencez à saisir le nom d’un membre, puis sélectionnez-le dans la liste.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dc128abbc65cb0c8:
    english: "![Searching for Samira Patel in the Invite field](../notifying_people/thread_notify_user.png)"
    translation: "![Recherche de Samira Patel dans le champ Inviter](../notifying_people/thread_notify_user.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3274fe93fcf29b29:
    english: Enter an email address to invite a guest. A guest can see and participate in this thread but cannot see other discussions in the group unless separately invited.
    translation: Saisissez une adresse courriel pour inviter une personne extérieure au groupe. Elle pourra voir ce fil de discussion et y participer, mais ne pourra pas voir les autres discussions du groupe sans y être invitée séparément.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ab3214ccf77143e3:
    english: "![Adding a guest email address to the Invite field](../notifying_people/thread_notify_email.png)"
    translation: "![Ajout de l’adresse courriel d’une personne extérieure au groupe dans le champ Inviter](../notifying_people/thread_notify_email.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cba9346e727b829a:
    english: You can also start the discussion without notifying anyone. Group members can still find it in Loomio and may see it in their catch-up email, depending on their notification settings.
    translation: Vous pouvez aussi démarrer la discussion sans notifier personne. Les membres du groupe pourront toujours la trouver dans Loomio et pourront la voir dans leur courriel récapitulatif, selon leurs paramètres de notification.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6518afe373ff1959:
    english: "### Tags"
    translation: "### Mots-clés"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ff67c09f89479873:
    english: Add tag(s) to help people find your discussion when searching by tag. Admins can create new tags.
    translation: Ajoutez des mots-clés pour aider les personnes à trouver votre discussion lorsqu’elles effectuent une recherche par mot-clé. Les administrateurs peuvent créer de nouveaux mots-clés.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ba80a903c4ecc7d1:
    english: |-
      ### Title
      Give your discussion a relevant title.  A discussion title is similar to an email subject line.
    translation: |-
      ### Titre
      Donnez à votre discussion un titre pertinent. Le titre d’une discussion joue le même rôle que l’objet d’un courriel.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a91cf4b0b1b2ad5e:
    english: |-
      ### Context
      Use discussion context to introduce the topic and frame the conversation or decision to make. Use the formatting tools to emphasize key points. Include background information, attach files, link to online documents and embed a video.
    translation: |-
      ### Contexte
      Utilisez le contexte de la discussion pour présenter le sujet et préciser l’objet de l’échange ou de la décision à prendre. Servez-vous des outils de mise en forme pour mettre en évidence les points clés. Ajoutez des informations utiles, joignez des fichiers, insérez des liens vers des documents en ligne et intégrez une vidéo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1bf690aa841299cd:
    english: The context will always stay at the top of the discussion and you can update it at any time as the discussion progresses.  When the discussion ends, update the context with the outcome.
    translation: Le contexte reste toujours en haut de la discussion. Vous pouvez le mettre à jour à mesure que la discussion avance. Quand la discussion se termine, ajoutez-y la conclusion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
