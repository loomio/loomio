    translated_on: '2026-09-30'
  a20cf2be00dac0ce:
    english: Matrix is nice because it allows some HTML in the chatroom, and Loomio takes advantage of this.
    translation: Matrix permite usar algo de HTML en las salas de chat, y Loomio aprovecha esa función.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ffe12502f0030fec:
    english: Our Matrix integration is a little different to our other chat integrations - it does not use a webhook - we've built a custom bot client for this one.
    translation: 'La integración con Matrix funciona de otra manera que las demás integraciones de chat de Loomio: no usa un webhook. Hemos creado un bot para esta integración.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  44db147f65127a55:
    english: You will need to create a matrix user for the bot to login as.
    translation: Necesitas crear una cuenta de Matrix para que el bot inicie sesión.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
