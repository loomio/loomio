  29a00cacbd5bd549:
    english: "# Category tags"
    translation: "# Тэгі катэгорый"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1d390c0c4f4cea4a:
    english: Category tags make it easy to find threads and polls about a particular type of work or topic.
    translation: Тэгі катэгорый дапамагаюць знаходзіць тэмы і апытанні, якія тычацца пэўнай працы або пытання.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  572adf8961fc1178:
    english: |-
      Tags belong to the whole organization. A tag used in a parent group is the
      same tag in its subgroups, making it possible to organize related work across
      the organization. Loomio displays tag names alphabetically and shows their
      colors as dots beside the names.
    translation: |-
      Тэгі належаць усёй арганізацыі. Тэг, які выкарыстоўваецца ў асноўнай групе, —
      той самы тэг і ў яе падгрупах. Гэта дапамагае ўпарадкаваць звязаную працу ва
      ўсёй арганізацыі. Loomio паказвае назвы тэгаў у алфавітным парадку, а іх
      колеры — кропкамі побач з назвамі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b5340bcbf37095dc:
    english: |-
      On your group page, click **Tags** above the thread list to see the tags used in
      the current group. Select a tag to show only threads with that tag. Use the
      filter textbox to search a long list, or select **Show more** to include all
      tags in the organization. Select **Show fewer** to return to the current
      group's tags.
    translation: |-
      На старонцы вашай групы націсніце **Тэгі** над спісам тэм, каб убачыць тэгі,
      якія выкарыстоўваюцца ў гэтай групе. Выберыце тэг, каб паказаць толькі тэмы
      з ім. Каб знайсці тэг у доўгім спісе, скарыстайцеся полем фільтра. Каб убачыць
      усе тэгі арганізацыі, выберыце **Паказаць больш**. Каб вярнуцца да тэгаў
      бягучай групы, выберыце **Паказаць менш**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9de81b9a795d066d:
    english: "## Apply tags"
    translation: "## Ужыць тэгі"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bf284f7568360b53:
    english: Members who can edit a thread or poll can apply tags to it.
    translation: Удзельнікі, якія могуць рэдагаваць тэму або апытанне, могуць дадаваць да іх тэгі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  58488fe368513138:
    english: When you start a thread or poll, click the **Tags** field and select one or more tags.
    translation: Калі вы пачынаеце тэму або апытанне, націсніце поле **Тэгі** і выберыце адзін ці некалькі тэгаў.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e060934a2853a35a:
    english: Start typing to filter the list. Select a tag again, or click the × on its chip, to remove it.
    translation: Пачніце ўводзіць тэкст, каб адфільтраваць спіс. Каб прыбраць тэг, выберыце яго яшчэ раз або націсніце × на яго пазнацы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9f5e48b7e520d1a0:
    english: "## Create tags"
    translation: "## Стварыць тэгі"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  efa789e9365b2ab2:
    english: |-
      Parent-group admins can always create tags for the parent group and its
      subgroups. Subgroup admins can create tags while tagging content in their
      subgroup. The **Members can create tags** group permission, enabled by default,
      allows other members who can tag a thread or poll to create new tag names. If
      the permission is disabled, members can still apply existing tags.
    translation: |-
      Адміністратары асноўнай групы заўсёды могуць ствараць тэгі для яе і яе
      падгруп. Адміністратары падгруп могуць ствараць тэгі, калі дадаюць іх да
      матэрыялаў сваёй падгрупы. Дазвол групы **Удзельнікі могуць ствараць тэгі**,
      уключаны па змаўчанні, дазваляе іншым удзельнікам, якія могуць дадаваць тэгі
      да тэм або апытанняў, ствараць новыя назвы тэгаў. Калі дазвол выключаны,
      удзельнікі ўсё роўна могуць выкарыстоўваць існыя тэгі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7e06376f3431ad2f:
    english: To create a tag while starting a thread or poll, type its name in the **Tags** field and press Enter.
    translation: Каб стварыць тэг падчас стварэння тэмы або апытання, увядзіце яго назву ў поле **Тэгі** і націсніце Enter.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  44cd1f0281bb8116:
    english: "![create new tag](tags_create_new.png)"
    translation: "![стварэнне новага тэга](tags_create_new.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  25943c6357948b42:
    english: "![new tag created](tags_created_new.png)"
    translation: "![новы тэг створаны](tags_created_new.png)"
    status: machine
