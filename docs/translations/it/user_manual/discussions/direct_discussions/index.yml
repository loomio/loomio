  b3ed13f5612f4ff9:
    english: A direct discussion is a private discussion for a specific set of people.
    translation: Una discussione diretta è una discussione privata tra persone specifiche.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  479f7faed056ab51:
    english: A direct discussion does not belong to a group. Invited people do not need to be a member of your Loomio group.
    translation: Una discussione diretta non appartiene a un gruppo. Le persone invitate non devono essere membri del tuo gruppo Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2f5362faecc07fa0:
    english: You control who can see and participate by adding people or email addresses to the **Invite** field.
    translation: Puoi decidere chi può vedere la discussione e partecipare aggiungendo persone o indirizzi email nel campo **Invita**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f31343ea54b4f899:
    english: Direct discussions support the same comments, polls and other tools as group discussions. They can be useful when creating a subgroup is unnecessary.
    translation: Le discussioni dirette offrono gli stessi commenti, sondaggi e altri strumenti delle discussioni di gruppo. Sono utili quando non serve creare un sottogruppo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
