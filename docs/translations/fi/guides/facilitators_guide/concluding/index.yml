  4e03229937f959ed:
    english: "## Outcomes & Next Steps"
    translation: "## Lopputulokset ja seuraavat vaiheet"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  eaf0fe98db301c7f:
    english: 'Confirming the outcome can be critical to feel like the goals of a collaborative discussion have been achieved. A facilitator can pull together what’s been decided and reflect it back, to help the group walk away with the answers to some key questions:'
    translation: 'Lopputuloksen vahvistaminen auttaa ryhmää näkemään, että yhteisen keskustelun tavoitteet on saavutettu. Keskustelun ohjaaja voi koota tehdyt päätökset ja esittää ne ryhmälle. Näin osallistujat saavat vastaukset keskeisiin kysymyksiin:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  00ed94f662c9643a:
    english: |-
      * What did we do?
      * What does it mean?
      * What will happen now?
      * What is my responsibility?
      * What will be different because we went through this experience?
    translation: |-
      * Mitä teimme?
      * Mitä se tarkoittaa?
      * Mitä tapahtuu seuraavaksi?
      * Mistä minä vastaan?
      * Mikä muuttuu tämän kokemuksen myötä?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0f9ecf512b4990b7:
    english: Sometimes the answers to these questions are very concrete, such as action points, while other times they are more abstract, such as deepening shared understanding.
    translation: Joskus vastaukset ovat konkreettisia tehtäviä. Joskus ne ovat yleisempiä, kuten yhteisen ymmärryksen syventyminen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aabfa9d842af2688:
    english: On Loomio
    translation: Loomiossa
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a63bbb12b1a1e04c:
    english: |-
      * [Outcomes](/en/user_manual/polls/outcomes/) are a very important tool. A proposal ending is not quite the end: there’s a need to sum up conclusively. That's what the outcome feature is for.
      * Many Loomio discussions come to a natural end without even using proposals or publishing outcomes. These discussions still provide a lot of value, and it can be helpful to update the context box with an outcome summary for later reference.
      * If specific people have action points, you can @mention their names and they will be notified.
    translation: |-
      * [Lopputulokset](/en/user_manual/polls/outcomes/) ovat tärkeä työkalu. Ehdotuksen päättyminen ei vielä päätä käsittelyä: sen jälkeen tarvitaan selkeä yhteenveto. Lopputulos on sitä varten.
      * Monet Loomio-keskustelut päättyvät luontevasti ilman ehdotuksia tai julkaistuja lopputuloksia. Nekin voivat olla arvokkaita. Voit lisätä lopputuloksen yhteenvedon keskustelun taustatietoihin myöhempää käyttöä varten.
      * Jos tietyille henkilöille sovitaan tehtäviä, voit mainita heidät @-merkillä. He saavat siitä ilmoituksen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  55a9b345194f80d6:
    english: "## Reporting & Harvesting"
    translation: "## Raportointi ja opit"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fc6ee28887dd5ab1:
    english: To understand the meaning of an experience, you have to inquire into how it fits into the bigger context. What was this moment, in the bigger rhythm of our progress? What form will our understanding from this experience take — a story, a report, a change, a call to action?
    translation: Ymmärtääksesi kokemuksen merkityksen mieti, miten se liittyy laajempaan kokonaisuuteen. Mikä tämän vaiheen merkitys oli edistymisen kannalta? Missä muodossa kokemuksesta syntynyt ymmärrys kannattaa tallentaa — kertomuksena, raporttina, muutoksena vai toimintakehotuksena?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  eb2cdc1c6526e053:
    english: The experience happens in the moment, but its impact often comes from putting handles on it, giving it a name, and being able to use it and refer to it. Otherwise you risk forgetting, leaving people out who weren't there, or having to repeat it later. Productive collaboration is often helped by tangible documentation or reporting.
    translation: Kokemus tapahtuu hetkessä, mutta sen vaikutus syntyy usein siitä, että sille annetaan nimi ja siihen voidaan palata. Muuten se voi unohtua, poissa olleet voivat jäädä tiedon ulkopuolelle tai sama työ täytyy tehdä uudelleen. Kirjallinen kooste tai raportti tukee yhteistyötä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4104d8b917a87b0e:
    english: |-
      * Loomio is self-documenting — notes write themselves as an integrated part of the process. This creates a gold-mine of archival content for groups, without any extra effort.
      * We have some features to support harvesting and archiving: the search function, the “previous decisions” list, and the print discussion option.
      * Premium plans offer the option to export all your group's Loomio data.
      * Many groups use Loomio to integrate content from various channels. For example, posting a meeting announcement and building the agenda on Loomio, having the meeting in person, posting the notes back on Loomio, and making related decisions in the same thread. This expands the “self-harvesting” ability of Loomio beyond the online space.
    translation: |-
      * Loomiossa työ dokumentoituu osana keskustelua. Ryhmälle kertyy tallennettua aineistoa ilman erillistä kirjaamistyötä.
      * Tiedon kokoamista ja arkistointia tukevat haku, aiempien päätösten luettelo ja keskustelun tulostaminen.
      * Maksullisissa tilauksissa voit viedä ryhmäsi kaikki Loomio-tiedot.
      * Monet ryhmät kokoavat Loomioon eri kanavista tulevaa sisältöä. Voit esimerkiksi ilmoittaa tapaamisesta ja laatia esityslistan Loomiossa, pitää tapaamisen kasvokkain, lisätä muistiinpanot Loomioon ja tehdä siihen liittyvät päätökset samassa keskusteluketjussa. Näin Loomioon tallentuu tietoa myös verkon ulkopuolisesta toiminnasta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dae98cfd5f14b034:
    english: "## Turning Discussion into Action"
    translation: "## Keskustelusta toimintaan"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a39a66938d6cadb0:
    english: There comes a moment when you have to re-engage with the reality outside the room. Occasionally, the need is simply to work with ideas and feelings, without worrying about implementation. But usually a group will not reach its goals without applying its conclusions to real-world action. This transition is part of the total facilitated experience.
    translation: Jossain vaiheessa on palattava siihen, mitä keskustelun ulkopuolella tapahtuu. Joskus riittää, että käsitellään ajatuksia ja tunteita miettimättä toteutusta. Useimmiten ryhmä kuitenkin saavuttaa tavoitteensa vasta, kun johtopäätökset näkyvät käytännön toiminnassa. Tämä siirtymä kuuluu ohjattuun prosessiin.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3e26f1939ffe69fe:
    english: 'It’s at this point that a collaborative process intersects with other organizational systems, and the facilitator has to help figure out how it will work. These other systems might include:'
    translation: 'Tässä vaiheessa yhteinen työ kohtaa organisaation muut toimintatavat. Keskustelun ohjaajan on autettava selvittämään, miten ne sovitetaan yhteen. Huomioon otettavia asioita voivat olla:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cb030c5876714643:
    english: |-
      * **Power** — Who actually makes decisions? What has to happen for ideas to turn into reality here?
      * **Management** — How does this fit into other priorities? What dependencies might exist?
      * **Delegation** — Who will take responsibility for next steps? Will they be held accountable?
      * **Communication** — How will this process or discussion be relayed to others? What do they need to know?
      * **Administration** — How will information from one system be input into another, such as a task tracking or communications tool? Where will information be stored?
    translation: |-
      * **Päätösvalta** — Kuka tekee päätökset? Mitä tarvitaan, jotta ideat toteutuvat?
      * **Johtaminen** — Miten tämä sopii muihin tavoitteisiin? Mistä muista asioista toteutus riippuu?
      * **Vastuunjako** — Kuka vastaa seuraavista vaiheista? Miten vastuun toteutumista seurataan?
      * **Viestintä** — Miten prosessista tai keskustelusta kerrotaan muille? Mitä heidän tarvitsee tietää?
      * **Hallinto** — Miten tieto siirretään järjestelmästä toiseen, esimerkiksi tehtävien seurantaan tai viestintätyökaluun? Mihin tieto tallennetaan?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5fd6382726e6e5c0:
    english: If there are any blocks around these issues, it can be damaging to leave this realisation until the moment of conclusion. For example, if the participants don’t actually have the power to make a change they have decided, they will feel defeated.Think ahead toward confronting reality when setting up the process, and scope the collaboration accordingly.
    translation: Jos näihin asioihin liittyy esteitä, niitä ei kannata jättää päätösvaiheeseen. Jos osallistujilla ei esimerkiksi ole valtaa toteuttaa päättämäänsä muutosta, työ voi tuntua turhalta. Mieti käytännön edellytyksiä jo prosessia suunnitellessasi ja rajaa yhteinen työ niiden mukaan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c3f96d2ea17ab236:
    english: |-
      * You can @mention the names of people who will take actions out of a decision.
      * Many users accomplish integrating Loomio content into other organizational systems through other channels like reviewing Loomio decisions in regular offline meetings, or transferring outcomes to their task tracking process.
      * Making an explicit decision naturally leads people to ask, “OK, but how are we going to take this forward?”
      * Forming a Loomio group often surfaces important questions like, “Who needs to participate here to turn these decisions into action?” If you're missing key stakeholders, leaders, or administrators, you'll get stuck.
    translation: |-
      * Voit mainita @-merkillä henkilöt, jotka vastaavat päätöksestä seuraavista toimista.
      * Monet käyttäjät vievät Loomion sisältöä organisaation muihin toimintatapoihin esimerkiksi käsittelemällä päätöksiä säännöllisissä tapaamisissa tai siirtämällä lopputulokset tehtävien seurantaan.
      * Selkeä päätös herättää luontevasti kysymyksen: ”Miten viemme tämän eteenpäin?”
      * Loomio-ryhmän perustaminen nostaa usein esiin kysymyksen: ”Keiden pitää osallistua, jotta nämä päätökset voidaan toteuttaa?” Työ voi pysähtyä, jos mukana ei ole keskeisiä osapuolia, johtajia tai ylläpitäjiä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  60bb517775f11e5d:
    english: "## It Ain’t Over Til It’s Over"
    translation: "## Päätä prosessi selkeästi"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '079da8800a401a45':
    english: Ending well is important. There’s a ritual to closing a process, and if it’s missed people will feel unsettled. Sometimes the end is determined by running out of time, and sometimes it’s when certain goals are achieved. Recognize implicit and explicit cues indicating if the individuals, and the group as a whole, can feel completion of a process or phase.
    translation: Prosessin selkeä päättäminen on tärkeää. Jos lopetus jää epäselväksi, osallistujille voi jäädä tunne keskeneräisyydestä. Joskus prosessi päättyy ajan loppumiseen, joskus tavoitteiden saavuttamiseen. Huomaa sekä suorat että epäsuorat merkit siitä, milloin yksittäiset osallistujat ja koko ryhmä kokevat prosessin tai vaiheen päättyneeksi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  280969e6212842cc:
    english: Participants often look to the leader or facilitator for confirmation of when it’s actually over, and it usually pays to be explicit. Sometimes the signal is a clear statement that the session is wrapping up, a recap of decisions or next steps, and bidding everyone goodbye. Other times groups have established practices like a check-out. Letting a session vaguely trail off will leave a bad taste.
    translation: Osallistujat odottavat usein johtajalta tai keskustelun ohjaajalta vahvistusta siitä, milloin työ on päättynyt. Kerro se selvästi. Voit esimerkiksi ilmoittaa tapaamisen päättyvän, kerrata päätökset ja seuraavat vaiheet sekä hyvästellä osallistujat. Joillakin ryhmillä on oma tapa päättää tapaaminen, kuten lopetuskierros. Epämääräisesti hiipuva lopetus jättää helposti keskeneräisen vaikutelman.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e15896aadc163225:
    english: |-
      * The clearest indication of conclusion on Loomio is publishing a decision outcome.
      * Some groups use the [lock thread](/en/user_manual/discussions/using_discussions/#lock-or-unlock-a-thread) feature to prevent further changes and reduce clutter.
      * Deactivating a group is the strongest possible “closure” move. No one can say anything else after that.
      * Since Loomio groups can remain while group activity goes up and down, it can be useful to recognize milestones like the conclusion of a particular phase, even if the group will reactivate in the future.
    translation: |-
      * Loomiossa selkein merkki päätöksen valmistumisesta on sen lopputuloksen julkaiseminen.
      * Jotkin ryhmät käyttävät [keskusteluketjun lukitsemista](/en/user_manual/discussions/using_discussions/#lock-or-unlock-a-thread) estääkseen uudet muutokset ja pitääkseen sisällön selkeänä.
      * Ryhmän poistaminen käytöstä päättää sen toiminnan kokonaan. Sen jälkeen kukaan ei voi enää kirjoittaa ryhmään.
      * Loomio-ryhmä voi pysyä olemassa, vaikka sen aktiivisuus vaihtelee. Siksi esimerkiksi tietyn vaiheen päättyminen kannattaa huomioida, vaikka ryhmä jatkaisi toimintaansa myöhemmin.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
