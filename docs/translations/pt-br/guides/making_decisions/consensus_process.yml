  7069de909d719ef2:
    english: Build consensus for a decision you need to make together, to reach an agreement that satisfies the needs and concerns of all participants.
    translation: Construa consenso sobre uma decisão que vocês precisam tomar juntos, buscando um acordo que atenda às necessidades e preocupações de todos os participantes.
