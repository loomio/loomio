  a29c1c76443ad97f:
    english: Good governance is more than a board meeting, it requires good communication before and after meetings.
    translation: A jó szervezeti irányításhoz nem elég megtartani a vezető testület üléseit. Az ülések előtt és után is jó kommunikációra van szükség.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9f05171a74ac30d0:
    english: |-
      This guide is intended to help you use Loomio in your board or committee, so you can stay connected between meetings, deal with urgent matters and reduce board admin.
      - Continue governance between meetings
      - Keep track of communications
      - Use board meetings for issues that matter
      - Preserve institutional memory with a detailed record
    translation: |-
      Ez az útmutató segít használni a Loomiót a vezető testületedben vagy bizottságodban, hogy az ülések között is kapcsolatban maradjatok, intézni tudjátok a sürgős ügyeket, és kevesebb időt tölts adminisztrációval.
      - Folytassátok a közös munkát az ülések között
      - Kövessétek nyomon a kommunikációt
      - Az üléseken a fontos kérdésekre fordítsatok időt
      - Részletes dokumentációval őrizzétek meg a szervezet tudását
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bce24543243c913b:
