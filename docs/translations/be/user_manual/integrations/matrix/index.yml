  90c643b33736cf22:
    english: "# Matrix integration"
    translation: "# Інтэграцыя з Matrix"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f3106c22cd3d4059:
    english: 'Loomio can send notifications into your Matrix channels when new discussions, proposals, comments, votes, and outcomes occur. '
    translation: Loomio можа адпраўляць у вашы каналы Matrix апавяшчэнні пра новыя абмеркаванні, прапановы, каментары, галасы і высновы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a20cf2be00dac0ce:
    english: Matrix is nice because it allows some HTML in the chatroom, and Loomio takes advantage of this.
    translation: Matrix дазваляе выкарыстоўваць частку HTML у чатах, і Loomio карыстаецца гэтай магчымасцю.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ffe12502f0030fec:
    english: Our Matrix integration is a little different to our other chat integrations - it does not use a webhook - we've built a custom bot client for this one.
    translation: 'Інтэграцыя з Matrix працуе інакш, чым іншыя інтэграцыі з чатамі. Яна не выкарыстоўвае вэбхук: для яе створаны асобны кліент-бот.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  44db147f65127a55:
    english: You will need to create a matrix user for the bot to login as.
    translation: Стварыце ў Matrix уліковы запіс, праз які бот будзе ўваходзіць у сістэму.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  98045e5bf1339543:
    english: Once you've created a user for the bot, sign in at that user to obtain the following information.
    translation: Пасля стварэння ўліковага запісу ўвайдзіце праз яго, каб атрымаць звесткі, патрэбныя для наладжвання.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '059df9c4b4ebf0d0':
    english: We're using Element for this guide.
    translation: У гэтым кіраўніцтве выкарыстоўваецца Element.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
