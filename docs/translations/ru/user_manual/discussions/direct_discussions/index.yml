  b3ed13f5612f4ff9:
    english: A direct discussion is a private discussion for a specific set of people.
    translation: Прямое обсуждение — это закрытое обсуждение для определённого круга людей.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  479f7faed056ab51:
    english: A direct discussion does not belong to a group. Invited people do not need to be a member of your Loomio group.
    translation: Прямое обсуждение не относится к группе. Приглашённым людям не нужно быть участниками вашей группы в Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2f5362faecc07fa0:
    english: You control who can see and participate by adding people or email addresses to the **Invite** field.
    translation: Чтобы выбрать, кто может видеть обсуждение и участвовать в нём, добавьте людей или адреса электронной почты в поле **Приглашать**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f31343ea54b4f899:
    english: Direct discussions support the same comments, polls and other tools as group discussions. They can be useful when creating a subgroup is unnecessary.
    translation: В прямых обсуждениях доступны те же комментарии, опросы и другие инструменты, что и в обсуждениях группы. Это удобно, когда создавать подгруппу не нужно.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
