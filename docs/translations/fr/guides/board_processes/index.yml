  eecfb12ed1d28d50:
    english: Good governance exists where an organization has systems and processes in place that are appropriate to its circumstances, and which enable the organization to pursue its purpose effectively and meet its obligations under the law.
    translation: Une organisation bénéficie d’une bonne gouvernance lorsqu’elle dispose de systèmes et de processus adaptés à sa situation. Ceux-ci lui permettent de poursuivre efficacement sa mission et de respecter ses obligations légales.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e54f67d22cf67a93:
    english: "*“It is participatory, consensus-oriented, accountable, transparent, responsive, effective and efficient, equitable and inclusive and follows the rule of law.”* [United Nations Economic and Social Commission for Asia and the Pacific](https://www.unescap.org/sites/default/d8files/knowledge-products/good-governance.pdf)."
    translation: "*« Elle est participative, axée sur le consensus, responsable, transparente, réactive, efficace et efficiente, équitable et inclusive, et respecte l’état de droit. »* [Commission économique et sociale des Nations Unies pour l’Asie et le Pacifique](https://www.unescap.org/sites/default/d8files/knowledge-products/good-governance.pdf)."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1661a79cfda1a9df:
    english: Underpinning all of these principles is the need for good communication.
    translation: Tous ces principes reposent sur une bonne communication.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2819f114c9d74160:
    english: 'Here are some or the challenges directors and boards experience:'
    translation: 'Voici quelques difficultés rencontrées par les membres des conseils d’administration :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ed750814c61b85fb:
    english: "* Getting directors together in person\n* Time available to consider important issues \n* Tracking communication\n* Urgency of critical issues\n* Online video meeting fatigue\n* Directors in multiple, remote locations, sometimes with poor internet connectivity\n* Mixed governance practice and experience\n* Dealing with high volumes of transactional business \n* Maintaining institutional memory"
    translation: "* Réunir les membres du conseil en personne\n* Trouver le temps d’examiner les questions importantes \n* Garder une trace des échanges\n* Traiter rapidement les questions critiques\n* Faire face à la fatigue liée aux visioconférences\n* Collaborer avec des membres répartis dans plusieurs lieux éloignés, parfois avec une mauvaise connexion Internet\n* Composer avec des pratiques et des niveaux d’expérience variés en matière de gouvernance\n* Gérer un grand volume d’affaires courantes \n* Préserver la mémoire de l’organisation"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b910c5253cf77950:
    english: Loomio offers an opportunity to strengthen governance, to extend collaboration beyond board meetings, to include everyone in open, honest and respectful discussion while documenting everything.
    translation: Loomio peut renforcer la gouvernance en prolongeant la collaboration au-delà des réunions du conseil d’administration. Il permet à chacun de participer à des discussions ouvertes, franches et respectueuses, tout en conservant une trace des échanges.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
