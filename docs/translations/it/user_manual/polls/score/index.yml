navigation_title: Punteggio
blocks:
  c719d051fa2f700e:
    english: "# Score"
    translation: "# Punteggio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  517adc384b38d256:
    english: Score measures how participants evaluate each option on a shared numeric scale. Unlike Choose, it asks people to respond to every option, so the results show both what people prefer and how strongly they prefer it.
    translation: Il sondaggio a punteggio misura come i partecipanti valutano ogni opzione su una scala numerica comune. A differenza di Scegli, chiede di valutare tutte le opzioni. I risultati mostrano quali opzioni le persone preferiscono e quanto le preferiscono.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a678333f6d814e87:
    english: "## When to use Score"
    translation: "## Quando usare il sondaggio a punteggio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c4ca19abb53e3ddc:
    english: 'Use Score when every option can be evaluated independently against the same question. It works well for:'
    translation: 'Usa il sondaggio a punteggio quando puoi valutare ogni opzione in modo indipendente rispetto alla stessa domanda. È utile per:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c77c1ad6b2a9d697:
    english: |-
      - assessing how ready each part of a project is;
      - rating the importance of several principles;
      - measuring interest in possible meeting topics;
      - evaluating grant applications against a common criterion; or
      - comparing the suitability of several proposals.
    translation: |-
      - valutare a che punto è ciascuna parte di un progetto;
      - assegnare un punteggio all'importanza di diversi principi;
      - misurare l'interesse per possibili temi di una riunione;
      - valutare le richieste di finanziamento secondo un criterio comune; oppure
      - confrontare l'adeguatezza di diverse proposte.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d91459d96a31a671:
    english: Define what the bottom and top of the scale mean. A number without a shared definition can mean different things to different voters. Use [Choose](/en/user_manual/polls/choose/) when you only need selections, or [Allocate](/en/user_manual/polls/allocate/) when participants must make trade-offs within a limited budget.
    translation: Definisci il significato del valore più basso e di quello più alto della scala. Senza una definizione comune, lo stesso numero può avere significati diversi per chi vota. Usa [Scegli](/en/user_manual/polls/choose/) se ti serve solo selezionare le opzioni, oppure [Assegna](/en/user_manual/polls/allocate/) se i partecipanti devono distribuire un budget limitato.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6160518dc06b70a7:
    english: "## Example: score possible trial locations"
    translation: "## Esempio: valutare le possibili sedi di una sperimentazione"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a75c387743cad529:
    english: Oatmilk Cooperative is choosing locations for a returnable-bottle trial. It asks members to score four locations from 0 (**unsuitable**) to 10 (**ideal**), considering customer access, staff capacity, storage, and collection transport.
    translation: La cooperativa Oatmilk sta scegliendo dove sperimentare un sistema di bottiglie a rendere. Chiede ai membri di assegnare un punteggio a quattro sedi, da 0 (**non adatta**) a 10 (**ideale**), considerando l'accessibilità per i clienti, la disponibilità del personale, lo spazio di stoccaggio e il trasporto per la raccolta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c74ebb16f872b3c6:
    english: "## Set up the poll"
    translation: "## Configura il sondaggio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b03122ee279f9c91:
    english: State one question that applies equally to every option. Add the items to be assessed, set the **Minimum score** and **Maximum score**, and explain the endpoints in the details. Option meanings can clarify the scope of each item.
    translation: Formula una domanda che si applichi allo stesso modo a ogni opzione. Aggiungi gli elementi da valutare, imposta **Punteggio minimo** e **Punteggio massimo** e spiega il significato dei due estremi nei dettagli. Puoi usare le descrizioni delle opzioni per chiarire che cosa comprende ciascun elemento.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  85e66520acf78264:
    english: Choose a scale participants can apply consistently. A 0–5 scale is quick to use; a 0–10 scale allows finer distinctions. More precision does not necessarily produce better information, so use the shortest scale that fits the question.
    translation: 'Scegli una scala che i partecipanti possano usare in modo coerente. Una scala da 0 a 5 è rapida da usare; una da 0 a 10 permette distinzioni più fini. Una maggiore precisione non produce necessariamente informazioni migliori: usa la scala più breve adatta alla domanda.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bb3998655598796f:
    english: Anonymous voting and showing options in random order can be useful when you want to reduce social or ordering effects.
    translation: Il voto anonimo e la visualizzazione delle opzioni in ordine casuale possono aiutare a ridurre l'influenza degli altri e dell'ordine delle opzioni.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Vota"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  33199814c9ad8a64:
    english: Participants move a slider to score every option. In this example, the voter scores Central Station cafe at 8, Riverside market at 6, the University food court at 7, and Harbour offices at 5.
    translation: I partecipanti spostano un cursore per assegnare un punteggio a ogni opzione. In questo esempio, una persona assegna 8 al bar della Stazione Centrale, 6 al mercato sul fiume, 7 alla mensa universitaria e 5 agli uffici del porto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fba3d21a09846414:
    english: The reason explains how the voter applied the scale. This helps the group distinguish a low score caused by missing information from one caused by substantive concern.
    translation: La motivazione spiega come la persona ha usato la scala. Aiuta il gruppo a capire se un punteggio basso dipende dalla mancanza di informazioni o da una preoccupazione concreta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Leggi i risultati"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  846b7759f9d54232:
    english: 'For each option, the results show:'
    translation: 'Per ogni opzione, i risultati mostrano:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cac30fa54f0aeaf7:
    english: |-
      - **Points**: the sum of all scores;
      - **Mean**: the average score; and
      - **Voters**: how many people scored the option.
    translation: |-
      - **Punti**: la somma di tutti i punteggi;
      - **Significare**: il punteggio medio; e
      - **Elettori**: quante persone hanno valutato l'opzione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7e063d4b1babcb9e:
    english: In this example, **Central Station cafe** has the highest mean at 7.5. **Harbour offices** has the lowest mean at 5.25, while Riverside market and the University food court are tied at 7. Four of five invited people have voted, so the group can also see that one response is outstanding.
    translation: In questo esempio, **il bar della Stazione Centrale** ha la media più alta, pari a 7,5. **Gli uffici del porto** hanno la media più bassa, pari a 5,25, mentre il mercato sul fiume e la mensa universitaria sono a pari merito con 7. Hanno votato quattro delle cinque persone invitate, quindi il gruppo può vedere che manca ancora una risposta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  147800d3643d9942:
    english: Compare means only when the options have a similar number of voters. Read the vote reasons before treating a small difference as meaningful, and publish an outcome explaining what action follows from the scores.
    translation: Confronta le medie solo quando le opzioni hanno un numero simile di elettori. Leggi le motivazioni dei voti prima di considerare significativa una piccola differenza e pubblica una conclusione che spieghi quali azioni seguiranno in base ai punteggi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
