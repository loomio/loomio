navigation_title: Inviter au vote
blocks:
  0635cf23fcaaa95b:
    english: "# Invite to vote"
    translation: "# Inviter au vote"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2ae3991d9865a2bb:
    english: "## Invite people to vote in a poll"
    translation: "## Inviter des personnes à voter dans un sondage"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  56d96764605291b4:
    english: Invite people to your poll by sending them a notification.
    translation: Envoyez une notification pour inviter des personnes à voter dans votre sondage.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3632ef534c8c03f7:
    english: After you start a poll, the **Invite to vote** box appears. Select an audience such as **Everyone in the thread** or your group, or enter individual names and email addresses.
    translation: Une fois le sondage lancé, la fenêtre **Inviter au vote** apparaît. Choisissez un public, comme **Participants à la discussion** ou votre groupe, ou saisissez des noms et des adresses e-mail.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  835f178f0b52f3b6:
    english: You can include an optional message with the invitation.
    translation: Vous pouvez ajouter un message à l’invitation.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  78da00061d5815a4:
    english: Select a group chip to expand it into the people you are inviting. Select the x beside a name to remove that person from the invitation.
    translation: Sélectionnez la pastille d’un groupe pour afficher les personnes que vous invitez. Sélectionnez le x à côté d’un nom pour retirer cette personne de l’invitation.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e6969f4c4b62b6ff:
    english: "### Invite guests or experts"
    translation: "### Inviter des personnes extérieures ou expertes"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9bb72d11863e1f46:
    english: You can also invite a guest to the poll by entering their email address. They will be given permission to participate in only this poll.
    translation: Vous pouvez aussi inviter une personne extérieure au sondage en saisissant son adresse e-mail. Elle pourra participer uniquement à ce sondage.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dd20b166a40eb798:
    english: If the poll is within a thread, they will also be able to see that thread and its comments. They will not be able to comment, participate in other polls in the thread, or see other threads in the group.
    translation: Si le sondage se trouve dans une discussion, elle pourra aussi voir cette discussion et ses commentaires. Elle ne pourra pas commenter, participer aux autres sondages de la discussion ni voir les autres discussions du groupe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  84cc8773a5337094:
    english: "### Invite a subgroup to vote"
    translation: "### Inviter un sous-groupe à voter"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  80ca3c8c753b0ebb:
    english: To limit voting to invited people, select **Selected people only** when you create the poll. You can then invite a subgroup from the parent group. See also [Delegated voters](/en/user_manual/groups/delegated_voters/).
    translation: Pour réserver le vote aux personnes invitées, sélectionnez **Personnes sélectionnées uniquement** lors de la création du sondage. Vous pouvez ensuite inviter un sous-groupe du groupe parent. Consultez aussi [Électeurs délégués](/en/user_manual/groups/delegated_voters/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2074aff770fa7610:
    english: |-
      ![Selecting invited people only](invited-people-only.png)
      ![Inviting a subgroup to vote](invite-voters-subgroup.png)
    translation: |-
      ![Sélection des personnes invitées uniquement](invited-people-only.png)
      ![Invitation d’un sous-groupe à voter](invite-voters-subgroup.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  29103b18580994a1:
    english: "## Engage people while a poll is running"
    translation: "## Encourager la participation pendant le sondage"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1ce57a2542eebaab:
    english: At the bottom of the poll are several features to help you engage with people once the poll is running.
    translation: Plusieurs fonctions au bas du sondage vous aident à encourager la participation pendant le vote.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  45090f8260d19a47:
    english: "### Add voters to the poll"
    translation: "### Ajouter des électeurs au sondage"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3116212829910b50:
    english: You can add new people to the poll at any time, including before voting opens on a scheduled poll.
    translation: Vous pouvez ajouter des personnes au sondage à tout moment, y compris avant l’ouverture du vote pour un sondage programmé.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5e851e072e9dc1de:
    english: Select **Add voters**, then enter the names or email addresses of the people you want to add.
    translation: Sélectionnez **Ajouter des électeurs**, puis saisissez les noms ou les adresses e-mail des personnes à ajouter.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  be5aceb4caf93c11:
    english: If the poll has a scheduled opening time and voting has not yet opened, voters will not receive an immediate notification. Instead, they will be notified when voting opens.
    translation: Si l’ouverture du vote est programmée et n’a pas encore eu lieu, les électeurs ne recevront pas de notification immédiate. Ils seront avertis à l’ouverture du vote.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b9a08269e3e252ce:
    english: "### Remove people from the poll"
    translation: "### Retirer des personnes du sondage"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ce37b0af98854c79:
    english: Select **Add voters**, find the person's name, open the three-dot menu beside it, and select **Remove from proposal**.
    translation: Sélectionnez **Ajouter des électeurs**, trouvez le nom de la personne, ouvrez le menu à trois points à côté de son nom, puis sélectionnez **Retirer de la proposition**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '08df94a4269ad100':
    english: People cannot be removed from an anonymous poll.
    translation: Il n’est pas possible de retirer des personnes d’un sondage anonyme.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3d13453394c79f30:
    english: For example, an administrator who creates a poll on behalf of board members can remove themself if they are not authorised to vote.
    translation: Par exemple, une personne administrant le groupe qui crée un sondage pour les membres d’un conseil peut se retirer si elle n’est pas autorisée à voter.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2a354792a1f1f517:
    english: "### Remind people to vote"
    translation: "### Rappeler aux personnes de voter"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  501e7846380326fd:
    english: Select **Remind** to send a notification to people who have not voted. **Everyone invited to vote** is selected by default. Select the chip to see or change the recipients.
    translation: Sélectionnez **Rappel** pour envoyer une notification aux personnes qui n’ont pas voté. **Participants invités à voter** est sélectionné par défaut. Sélectionnez la pastille pour consulter ou modifier les destinataires.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  04e4537024da788c:
    english: "### View notification history"
    translation: "### Consulter l’historique des notifications"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  46145a9dd950c8eb:
    english: Open the three-dot menu (**⋯**) at the bottom of the poll and select **Notification history**.
    translation: Ouvrez le menu à trois points (**⋯**) au bas du sondage, puis sélectionnez **Historique des notifications**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e74eafb1566d5dea:
    english: "![Notification history in a poll's actions menu](../../discussions/notifying_people/poll_notification_history.png)"
    translation: "![Historique des notifications dans le menu des actions d’un sondage](../../discussions/notifying_people/poll_notification_history.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1a96cd0121fe58ec:
    english: The history shows who has been invited to vote, when each invitation was sent, and whether it has been read when that information is available.
    translation: L’historique indique qui a été invité à voter, quand chaque invitation a été envoyée et, lorsque cette information est disponible, si elle a été lue.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3bd9a11263e1c8f4:
    english: "![Notification history for a poll](../../discussions/notifying_people/poll_notification_example.png)"
    translation: "![Historique des notifications d’un sondage](../../discussions/notifying_people/poll_notification_example.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f3bbc883f6429276:
    english: "### Close early"
    translation: "### Clore avant la date prévue"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  af6a9acaafaaa96a:
    english: Select **Close early** to close a poll before its scheduled closing time.
    translation: Sélectionnez **Clôture anticipée** pour clore un sondage avant la date de clôture prévue.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3cdbb11687fa03c0:
    english: You might do this when everyone has voted or the poll no longer needs to remain open.
    translation: Vous pouvez le faire lorsque tout le monde a voté ou que le sondage n’a plus besoin de rester ouvert.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  46f3a0ec8da6dba1:
    english: "### Reopen"
    translation: "### Relancer"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '0821c04199937236':
    english: Select **Reopen** on a closed poll, then set a new closing date and time.
    translation: Sélectionnez **Relancer** sur un sondage clos, puis définissez une nouvelle date et une nouvelle heure de clôture.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  53079cadd493f27c:
    english: Anonymous polls cannot be reopened.
    translation: Les sondages anonymes ne peuvent pas être relancés.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
