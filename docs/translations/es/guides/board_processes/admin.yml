  79ad157a95adc8ef:
    english: Subgroups help you organize your communications and members so that the right people are engaged in their work together.  For example, you can use a subgroup for a subcommittee or working group.
    translation: Los subgrupos te ayudan a organizar las comunicaciones y los miembros para que las personas adecuadas colaboren en cada tarea. Por ejemplo, puedes crear un subgrupo para un subcomité o un grupo de trabajo.
