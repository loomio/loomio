  55ccc01c9b274a87:
    english: |-
      ## Key points
      - Aim for a ‘good enough’ decision.
      - Involve many voices to develop a workable proposal.
      - Ask if anyone has a valid objection.
      - Amend the proposal to resolve objections.
    translation: |-
      ## Főbb pontok
      - Törekedj egy „elég jó” döntésre.
      - Vonj be sokféle véleményt egy megvalósítható javaslat kidolgozásába.
      - Kérdezd meg, van-e bárkinek megalapozott kifogása.
      - Módosítsd a javaslatot a kifogások feloldásához.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7c2ef9fc3419f4b7:
    english: |-
      **Typical roles:**
      - Proposer: The person who raises a topic that requires a decision.
      - Facilitator: Someone who can help the proposer do their job efficiently.
    translation: |-
      **Jellemző szerepek:**
      - Javaslattevő: Aki felvet egy döntést igénylő témát.
      - Folyamatsegítő: Aki segít a javaslattevőnek hatékonyan elvégezni a feladatát.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c56d1ea7a5582723:
    english: |-
      ## Consent process steps
      You notice a problem or opportunity and take the initiative.
      1. Present a proposal - start a Loomio **discussion**.
      2. Facilitate a round of questions, reactions and any comments to improve the proposal - run a **Sense check proposal**.
      3. Amend the proposal with suggestions and comments.
      4. Ask if anyone has a meaningful objection to the amended proposal - run a **Consent proposal**.
      5. Integrate valid objections to create an amended version of the proposal that everyone consents is ‘safe to try’ - state the decision **outcome**.
    translation: |-
      ## A hozzájárulási folyamat lépései
      Észreveszel egy problémát vagy lehetőséget, és kezdeményezel.
      1. Mutass be egy javaslatot – indíts egy Loomio-**beszélgetést**.
      2. Vezess le egy kört, amelyben a résztvevők kérdezhetnek, reagálhatnak és hozzászólhatnak a javaslat javításához – indíts egy **Véleményfelmérés javaslatot**.
      3. Módosítsd a javaslatot a felvetések és hozzászólások alapján.
      4. Kérdezd meg, van-e bárkinek érdemi kifogása a módosított javaslattal szemben – indíts egy **Hozzájárulási javaslatot**.
      5. Építsd be a megalapozott kifogásokat, hogy a javaslat módosított változatát mindenki „kipróbálhatónak” tartsa – fogalmazd meg a döntés **következtetését**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  735e10dde58793f0:
    english: |-
      >[!Tip]
      >In more complex decisions you may also include a clarifying **Questions round** at step 2, to help people understand the proposal before inviting them to react and comment on the proposal.
    translation: |-
      >[!Tip]
      >Összetettebb döntéseknél a 2. lépésbe egy tisztázó **Kérdés kört** is beilleszthetsz. Ez segít megérteni a javaslatot, mielőtt reakciókat és hozzászólásokat kérsz.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9cf871a054d8e628:
    english: |-
      ## Benefits
      - Faster, efficient, clear and more adaptable decisions.
      - Diverse perspectives and empowered engagement builds trust.
      - A more agile, transparent and inclusive culture.
    translation: |-
      ## Előnyök
      - Gyorsabb, hatékonyabb, egyértelműbb és könnyebben módosítható döntések.
      - A különböző nézőpontok és az érdemi részvétel bizalmat építenek.
      - Rugalmasabb, átláthatóbb és befogadóbb működés.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '09907f3ec328e9d2':
    english: "## Applying the Consent process on Loomio"
    translation: "## A hozzájárulási folyamat alkalmazása a Loomióban"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d7c91a6160b45cf:
    english: |-
      | **Consent process** | **On Loomio** |
      |---|---|
      | You notice a problem or opportunity and take the initiative. |  |
      | **Present a proposal** <br /><br />Write a clear and concise proposal and share it with people impacted. Describe it in a way so that others will understand what you are proposing. | Start a Loomio **discussion**. <br /><br />Name the proposal in the discussion title, and describe it in the context. |
      | **Questions** (Optional) <br /><br />Invite clarifying questions to help people understand the proposal. <br /><br />*“A clarifying question round helps make sure everyone understands the proposal before they say what they think about it.”* | Run a **Question round**. If it is hidden, a group administrator can make it available from [Poll templates](/en/user_manual/polls/poll_templates/). <br /><br />Ask “what do you need to know so you understand the proposal?” |
      | **Reactions** <br /><br />Invite people to offer reactions and comments to improve the proposal. <br /><br />This is a sensing and responding round - *to actively sense and interpret information from the group and then respond or adapt accordingly.* | Run a **[Sense check](/en/user_manual/polls/proposals/sense_check/)** proposal. <br /><br />*In the title:* Name the proposal and say this is an opportunity to react and comment. <br /><br />*In the proposal details:* Clearly frame the proposal and say why it is important.  Include any background information necessary and a link to the current proposal version.  <br /><br />Invite everyone to respond, and to do so before the proposal closes.  |
      | **Amendment** <br /><br />Consider comments and suggestions from people and amend the proposal as appropriate for the good of your organization. <br /><br />Consider any amendments you want to make for the new proposal version. | Reply to comments and suggestions raised in the Sense check proposal. <br /><br />State an **outcome** to summarize the results of the proposal.  <br /><br />Note any concerns or new information discovered, and outline how the proposal will be amended. <br /><br />Say what will happen next and notify people about the outcome. |
      | **Objections** <br /><br />Present the amended proposal version and invite people to state valid objections - objections that might cause harm. <br /><br />Respond to and integrate each objection by amending the proposal. | Run a **[Consent proposal](/en/user_manual/polls/proposals/consent/)** with the amended proposal. <br /><br />*In the title:* Name the decision to be made. <br /><br />*In the proposal details:* Present the proposal and invite people to vote consent or to state a valid objection - an objection that might cause harm.  Remember we are seeking consent that the proposal is 'safe to try'. <br /><br />Respond to and integrate each objection, creating an amended version of the proposal. <br /><br />Notify everyone that there has been a further amendment, and invite them to reconsider their Consent and “change your vote”. <br /><br />Or run successive Consent proposals as necessary until objections are resolved. |
      | **Outcome** <br /><br />When there are no remaining objections and everyone has consented, the result of the decision is announced. | State an **outcome**. <br /><br />Close the proposal. State an outcome and notify everyone involved. <br /><br />State the decision made and thank people for participation in the process. <br /><br />Summarize results of the process and say what will happen next. <br /><br />If no valid objections remain, state that there is consent the proposal is 'safe to try'. <br /><br />The outcome statement is an important record of the decision for future reference. |
    translation: |-
      | **Hozzájárulási folyamat** | **A Loomióban** |
      |---|---|
      | Észreveszel egy problémát vagy lehetőséget, és kezdeményezel. |  |
      | **Javaslat bemutatása** <br /><br />Írj világos, tömör javaslatot, és oszd meg az érintettekkel. Úgy fogalmazz, hogy mások is megértsék, mit javasolsz. | Indíts egy Loomio-**beszélgetést**. <br /><br />A beszélgetés címében nevezd meg a javaslatot, a leírásban pedig ismertesd a hátterét. |
      | **Kérdések** (nem kötelező) <br /><br />Kérj tisztázó kérdéseket, hogy mindenki megérthesse a javaslatot. <br /><br />*„A tisztázó kérdések köre segít abban, hogy mindenki megértse a javaslatot, mielőtt elmondja róla a véleményét.”* | Indíts egy **Kérdés kört**. Ha nem látható, egy csoportadminisztrátor elérhetővé teheti a [Szavazási sablonok](/en/user_manual/polls/poll_templates/) között. <br /><br />Kérdezd meg: „Mit kell még tudnod ahhoz, hogy megértsd a javaslatot?” |
      | **Reakciók** <br /><br />Kérj reakciókat és hozzászólásokat a javaslat javításához. <br /><br />Ebben a körben a csoporttól érkező információkat figyelitek és értelmezitek, majd ezek alapján reagáltok vagy változtattok. | Indíts egy **[Véleményfelmérés](/en/user_manual/polls/proposals/sense_check/)** javaslatot. <br /><br />*A címben:* Nevezd meg a javaslatot, és jelezd, hogy itt lehet reagálni és hozzászólni. <br /><br />*A javaslat részleteiben:* Világosan mutasd be a javaslatot és annak jelentőségét. Adj meg minden szükséges háttérinformációt és a javaslat aktuális változatára mutató hivatkozást. <br /><br />Kérj mindenkitől választ a javaslat lezárása előtt. |
      | **Módosítás** <br /><br />Mérlegeld a hozzászólásokat és javaslatokat, majd szükség szerint módosítsd a javaslatot a szervezeted érdekében. <br /><br />Gondold át, milyen változtatásokat szeretnél beépíteni az új változatba. | Válaszolj a Véleményfelmérés javaslatban felvetett hozzászólásokra és javaslatokra. <br /><br />Fogalmazz meg egy **következtetést**, amely összefoglalja a javaslat eredményét. <br /><br />Rögzítsd a felmerült aggályokat és új információkat, és írd le, hogyan módosítod a javaslatot. <br /><br />Mondd el, mi történik ezután, és értesítsd a résztvevőket a következtetésről. |
      | **Kifogások** <br /><br />Mutasd be a javaslat módosított változatát, és kérj megalapozott kifogásokat, vagyis olyanokat, amelyek lehetséges káros következményre mutatnak rá. <br /><br />Válaszolj minden kifogásra, és építsd be őket a javaslat módosításával. | Indíts egy **[Hozzájárulási javaslatot](/en/user_manual/polls/proposals/consent/)** a módosított javaslattal. <br /><br />*A címben:* Nevezd meg a meghozandó döntést. <br /><br />*A javaslat részleteiben:* Mutasd be a javaslatot, és kérd meg a résztvevőket, hogy szavazzanak a hozzájárulásukról, vagy jelezzenek egy megalapozott kifogást, amely lehetséges káros következményre mutat rá. A cél annak megállapítása, hogy a javaslat „kipróbálható-e”. <br /><br />Válaszolj minden kifogásra, és építsd be őket a javaslat új változatába. <br /><br />Értesíts mindenkit az újabb módosításról, és kérd meg őket, hogy gondolják át újra a hozzájárulásukat, és „módosítsák a szavazatukat”. <br /><br />Szükség esetén indíts további hozzájárulási javaslatokat, amíg a kifogások meg nem oldódnak. |
      | **Következtetés** <br /><br />Ha nem maradt kifogás, és mindenki hozzájárult, kihirdetitek a döntést. | Fogalmazz meg egy **következtetést**. <br /><br />Zárd le a javaslatot. Fogalmazd meg a következtetést, és értesíts minden érintettet. <br /><br />Írd le a meghozott döntést, és köszönd meg a részvételt. <br /><br />Foglald össze a folyamat eredményeit, és mondd el, mi történik ezután. <br /><br />Ha nem maradt megalapozott kifogás, rögzítsd, hogy a résztvevők egyetértenek abban: a javaslat „kipróbálható”. <br /><br />A következtetés később is visszakereshetővé teszi a döntést. |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  525fe55f979f05e3:
    english: "### Objections"
    translation: "### Kifogások"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3cc3304a15bc3d2f:
    english: In the Consent process, an objection is defined as something that **might cause harm to the team or organization**.
    translation: A hozzájárulási folyamatban a kifogás olyan körülményre mutat rá, amely **kárt okozhat a csapatnak vagy a szervezetnek**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ab509ea088e16a0d:
    english: |-
      Objections should meet this criteria to be valid:
      - Explicit: *I can make a reasoned case*
      - Impersonal: *It's not just a personal preference*
      - Evidenced: *Not predictive, based on experience*
      - Not 'safe to fail': *It's not that I have a 'better idea'*
    translation: |-
      Egy megalapozott kifogásnak meg kell felelnie ezeknek a feltételeknek:
      - Konkrét: *Érvekkel tudom alátámasztani*
      - Nem személyes: *Nem pusztán személyes preferencia*
      - Tapasztalaton alapul: *Nem jóslat, hanem tapasztalat támasztja alá*
      - Nem „biztonságosan elbukhat”: *Nem csupán arról van szó, hogy van egy „jobb ötletem”*
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
