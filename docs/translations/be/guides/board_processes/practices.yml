  be27d7d85647e400:
    english: "# Governance practices and approaches"
    translation: "# Практыкі і падыходы да кіравання"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3242767a5e393028:
    english: Good governance includes establishing, reviewing and challenging governance practices, policies and procedures to continously improve board effectiveness.
    translation: Эфектыўнае кіраванне прадугледжвае распрацоўку, перагляд і крытычную ацэнку практык, палітык і працэдур. Гэта дапамагае пастаянна паляпшаць працу рады.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c4d8cb7f7eb901a6:
    english: However many boards are short on time and often weighed down by board papers, compliance and risk, without sufficient time to discuss and debate critical strategy and performance issues.
    translation: Аднак многім радам бракуе часу. Дакументы да пасяджэнняў, выкананне патрабаванняў і кіраванне рызыкамі часта займаюць столькі ўвагі, што на абмеркаванне важных пытанняў стратэгіі і вынікаў працы часу не застаецца.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  eb59655c49bf902d:
    english: "## On Loomio\nLoomio offers the opportunity to work online on a document, policy or procedure.  Discussion and decisions are contained in a thread that members can access when and wherever works for them.  "
    translation: |-
      ## У Loomio
      У Loomio можна сумесна працаваць над дакументам, палітыкай або працэдурай анлайн. Абмеркаванне і рашэнні захоўваюцца ў тэме, да якой удзельнікі могуць звяртацца ў зручны для іх час і зручным месцы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a0d6426929e39b38:
    english: 'Use a **thread** for each document, policy or procedure. The thread is the container for discussion, and holds document drafts and subsequent versions of the document.  '
    translation: Стварыце асобную **тэму** для кожнага дакумента, палітыкі або працэдуры. У ёй адбываецца абмеркаванне і захоўваюцца чарнавікі ды наступныя версіі дакумента.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  551c5aac67b42167:
    english: With a Loomio thread, you can organize so that the 2-3 people working on the document text are discussing particulars in the thread.  The thread could be private amongst just those 2-3 people, or run openly in the group so that the work is transparent to all members.
    translation: У тэме Loomio 2–3 чалавекі, якія працуюць над тэкстам дакумента, могуць абмяркоўваць яго дэталі. Доступ да тэмы можна абмежаваць гэтымі людзьмі або адкрыць яе для ўсёй групы, каб усе ўдзельнікі бачылі ход працы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1400a6d44d7d4e35:
    english: When the document reaches a draft version, use a **Sense check poll** to notify members that the draft document is ready for review, and invite members to read the document and respond with any comments or questions.  As well as letting everyone know that the work is progressing, the poll closing date encourages people to participate.
    translation: Калі чарнавік дакумента гатовы, стварыце апытанне **Праверка сэнсу**. Так вы паведаміце ўдзельнікам, што дакумент можна разгледзець, і запросіце іх прачытаць яго ды пакінуць заўвагі або пытанні. Апытанне паведамляе ўсім пра ход працы, а дата яго закрыцця заахвочвае да ўдзелу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  44bcb71608c8f14a:
    english: The document may require several draft iterations.
    translation: Дакумент можа прайсці некалькі этапаў дапрацоўкі чарнавіка.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a5371854b689874a:
    english: When a 'final' draft is ready, raise a **Proposal** to approve the document.
    translation: Калі «канчатковы» чарнавік гатовы, стварыце **Прапанова**, каб зацвердзіць дакумент.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5998c94bd5b640ab:
    english: Loomio enables a board to progress work on governance improvement between meetings without eating into precious time in meetings.
    translation: Loomio дапамагае радзе паляпшаць практыкі кіравання паміж пасяджэннямі, не займаючы гэтым час на саміх пасяджэннях.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
