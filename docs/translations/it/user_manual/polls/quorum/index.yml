  a79abb23e8e1c82f:
    english: A quorum is the minimum percentage of eligible voters who must participate for a poll to be valid. Use it when your governance process requires a particular level of participation.
    translation: Il quorum è la percentuale minima di persone aventi diritto al voto che devono partecipare perché un sondaggio sia valido. Usalo quando il processo decisionale del tuo gruppo richiede un determinato livello di partecipazione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d83e75068f697f6f:
    english: When creating a poll, open **More settings** and enter the required percentage in **Participation quorum**. Leave the field blank when no quorum is required.
    translation: Quando crei un sondaggio, apri **Altre impostazioni** e inserisci la percentuale richiesta in **Quorum di partecipazione**. Lascia il campo vuoto se non è richiesto un quorum.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a04b99724fe62a56:
    english: "![The Quorum setting with a 60 percent participation quorum](./quorum-section.png)"
    translation: "![L'impostazione Quorum con un quorum di partecipazione del 60 percento](./quorum-section.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  432f570094ad5b24:
    english: You can also set a quorum in a [poll template](/en/user_manual/polls/poll_templates/) so that polls created from that template use it by default.
    translation: Puoi anche impostare un quorum in un [modello di sondaggio](/en/user_manual/polls/poll_templates/), così i sondaggi creati da quel modello lo useranno per impostazione predefinita.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  52841ec4c6253973:
