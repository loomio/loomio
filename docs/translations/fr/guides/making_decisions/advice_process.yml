  66f32f2b3cf56e0d:
    english: |-
      ## Key points
      - Freedom to make a decision.
      - Invite people to offer their advice.
      - Take into account other people’s voices.
    translation: |-
      ## Points clés
      - La liberté de prendre une décision.
      - Inviter les personnes à donner leur avis.
      - Tenir compte du point de vue des autres.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  54d4f1ac3c2bd91f:
    english: |-
      ## Steps in the Advice process
      You notice a problem or opportunity and take the initiative.
      1. Frame the decision, identify who owns it, and invite the affected people and relevant experts.
      2. Start a Loomio **discussion** and, when a structured response or deadline is useful, run an **Advice proposal**.
      3. Clarify and build on the advice through vote reasons and discussion comments.
      4. Make the decision, then publish an **outcome** explaining what was decided and how the advice informed it.
    translation: |-
      ## Étapes du processus de conseil
      Vous repérez un problème ou une occasion à saisir et prenez l’initiative.
      1. Définissez la décision à prendre, désignez la personne qui en est responsable et invitez les personnes concernées ainsi que les spécialistes du sujet.
      2. Lancez une **discussion** sur Loomio et, si une réponse structurée ou une échéance est utile, lancez une **proposition de conseil**.
      3. Clarifiez les conseils reçus et approfondissez-les à partir des raisons données lors du vote et des commentaires dans la discussion.
      4. Prenez la décision, puis publiez une **conclusion** qui explique ce que vous avez décidé et comment les conseils ont éclairé votre choix.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6088bbd1e12e8920:
    english: "## Benefits\n- Advice helps you make a better decision for your organization. \n- Foster relationships, learning opportunities and diverse input.\n- Stimulate initiative and creativity, and more enjoyable work."
    translation: "## Avantages\n- Les conseils vous aident à prendre une meilleure décision pour votre organisation. \n- Le processus renforce les relations, favorise l’apprentissage et permet de recueillir des points de vue variés.\n- Il encourage l’initiative et la créativité, et peut rendre le travail plus agréable."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
