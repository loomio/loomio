---
navigation_title: Выбары на СТВ
blocks:
  85590745d00e23c1:
    english: "# STV Elections"
    translation: "# Выбары на СТВ"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  366f56443108e10f:
    english: "**Single Transferable Vote (STV)** is a proportional representation voting method for electing multiple winners from a field of candidates. It ensures that elected candidates proportionally represent the diversity of views among voters."
    translation: "**Адзіны перадавальны голас (СТВ)** — метад прапарцыйнага галасавання для абрання некалькіх людзей з ліку кандыдатаў. Ён дапамагае прапарцыйна прадставіць розныя погляды выбаршчыкаў сярод абраных."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  61dee55b45038f56:
    english: "## When to use STV"
    translation: "## Калі выкарыстоўваць СТВ"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8311dca26cec6519:
    english: 'Use an STV Election when you need to:'
    translation: 'Выкарыстоўвайце выбары на СТВ, калі трэба:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1d4338734ec6e113:
    english: |-
      - Elect a **committee, board, or slate of delegates** from a pool of nominees
      - Ensure **proportional representation**, where minority factions can win seats proportional to their support
      - Run elections where voters rank candidates by preference
    translation: |-
      - Абраць **камітэт, праўленне або групу дэлегатаў** з ліку вылучаных кандыдатаў
      - Забяспечыць **прапарцыйнае прадстаўніцтва**, каб групы меншасці маглі атрымаць месцы адпаведна сваёй падтрымцы
      - Правесці выбары, на якіх выбаршчыкі размяшчаюць кандыдатаў у парадку перавагі
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e6e1ae026f65a715:
    english: |-
      >[!NOTE]
      >STV is **not** the same as Loomio's [Rank poll](/en/user_manual/polls/rank/), which is a simpler score-based ranking for choosing a single best option. STV handles multi-winner elections with vote transfers and elimination rounds.
    translation: |-
      >[!NOTE]
      >СТВ **адрозніваецца** ад [рэйтынгавага апытання](/en/user_manual/polls/rank/) у Loomio, дзе варыянты ацэньваюць баламі, каб выбраць адзін найлепшы. На выбарах па СТВ абіраюць некалькіх людзей, перадаючы галасы і выключаючы кандыдатаў у наступных раўндах.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  62af8f95f18dbafe:
    english: "## Creating an STV Election"
    translation: "## Як стварыць выбары на СТВ"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  edf2f36e75c81665:
    english: When starting a poll, select **STV Election** as the poll type, then add the candidates as the poll options. You can customize the poll by setting the **number of seats**, the **counting method**, and the **quota type**.
    translation: Калі пачынаеце апытанне, выберыце тып **Выбары на СТВ**, а затым дадайце кандыдатаў як варыянты адказу. Вы можаце задаць **колькасць месцаў для запаўнення**, **метад падліку** і **тып квоты**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b40ddcfb8cdc44fd:
    english: In this example, Oatmilk Cooperative is electing three people to oversee its returnable packaging trial. The form explains the role, lists five candidates, and uses Scottish STV with the Droop quota.
    translation: У гэтым прыкладзе кааператыў Oatmilk абірае трох чалавек, якія будуць наглядаць за выпрабаваннем зваротнай упакоўкі. У форме апісана іх роля, пералічаны пяць кандыдатаў і выбраны шатландскі метад СТВ з квотай Droop.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4a34592929349d06:
    english: "### Number of seats"
    translation: "### Колькасць месцаў для запаўнення"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c09f5f51333612dc:
    english: How many winners should be elected. Must be less than the number of candidates.
    translation: Колькасць людзей, якіх трэба абраць. Яна павінна быць меншай за колькасць кандыдатаў.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ddceec01d910b152:
    english: "### Counting method"
    translation: "### Метад падліку"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  39e9e81a89272771:
    english: 'There are two available methods for counting the votes:'
    translation: 'Даступныя два метады падліку галасоў:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a7031d1180e95273:
    english: |-
      Scottish STV
        : Recommended. The Weighted Inclusive Gregory Method (WIGM) used in Scottish local elections since 2007. Well-defined, straightforward rules. Best for most organizations.
    translation: |-
      Шатландскае СТВ
        : Рэкамендуецца. Узважаны інклюзіўны метад Грэгары (WIGM), які выкарыстоўваецца на мясцовых выбарах у Шатландыі з 2007 года. Яго правілы дакладна вызначаны і простыя. Падыходзіць большасці арганізацый.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1507e4fde88848dd:
    english: |-
      Meek STV
        : A more mathematically precise iterative method. When a candidate is eliminated, votes are recounted as if that candidate was never in the race.
    translation: |-
      Meek STV
        : Ітэрацыйны метад з больш дакладнымі матэматычнымі разлікамі. Калі кандыдат выбывае, галасы пералічваюцца так, быццам гэты кандыдат не ўдзельнічаў у выбарах.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b9abcd12eef5f629:
    english: "### Quota type"
    translation: "### Тып квоты"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6dc3aea49266d40d:
    english: 'The quota is the minimum number of votes a candidate needs to win a seat. It can be either:'
    translation: 'Квота — мінімальная колькасць галасоў, патрэбная кандыдату для атрымання месца. Даступныя два тыпы:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  88f62f286d8c550f:
    english: |-
      Droop
        : Recommended. The standard quota type for most STV elections, and used by Ireland, Australia, and Scotland. Droop guarantees a majority coalition wins a majority of seats. It is calculated as:
      \\[ floor(\frac{votes}{(seats + 1)}) + 1 \\]
    translation: |-
      Droop
        : Рэкамендуецца. Стандартны тып квоты для большасці выбараў па СТВ. Выкарыстоўваецца ў Ірландыі, Аўстраліі і Шатландыі. Квота Droop гарантуе, што кааліцыя з большасцю галасоў атрымае большасць месцаў. Яна разлічваецца так:
      \\[ floor(\frac{votes}{(seats + 1)}) + 1 \\]
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  817b3994e92898e8:
    english: |-
      Hare
        : A higher minimum threshold, and more proportional for smaller factions.
          Hare is preferred by DSA chapters to protect minority representation.
         It is calculated as:
          \\[ \frac{votes}{seats}\\]
    translation: |-
      Hare
        : Вышэйшая мінімальная мяжа, якая забяспечвае больш прапарцыйнае прадстаўніцтва меншых груп.
          Аддзяленні DSA аддаюць перавагу квоце Hare, каб абараніць прадстаўніцтва меншасці.
         Яна разлічваецца так:
          \\[ \frac{votes}{seats}\\]
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f12065bdf5d3678e:
    english: |2-
        >[!TIP]
        > Droop will always compute to a smaller number of votes than Hare. For example, in an election with 100 votes and four seats, the Droop quota would be 21 and the Hare quota 25.
    translation: |-
      >[!TIP]
        > Квота Droop заўсёды патрабуе менш галасоў, чым квота Hare. Напрыклад, калі на выбарах пададзена 100 галасоў і трэба запоўніць чатыры месцы, квота Droop складзе 21 голас, а квота Hare — 25.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  984516abc3cfd89b:
    english: "## How voting works"
    translation: "## Як праходзіць галасаванне"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  40e98247d87cdf27:
    english: 'In this example, Oatmilk Cooperative is electing three people to oversee the reusable packaging trial. Voters drag candidates above the line and rank them in order of preference:'
    translation: 'У гэтым прыкладзе кааператыў Oatmilk абірае трох чалавек, якія будуць наглядаць за выпрабаваннем шматразовай упакоўкі. Выбаршчыкі перацягваюць кандыдатаў вышэй за лінію і размяшчаюць іх у парадку перавагі:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f8aaa5391f05117f:
    english: |-
      - **Rank 1** = most preferred candidate
      - **Rank 2** = second choice
      - Continue ranking as many candidates as desired
    translation: |-
      - **Ранг 1** = кандыдат, якому аддаюць найбольшую перавагу
      - **Ранг 2** = другі выбар
      - Можна ранжыраваць столькі кандыдатаў, колькі хочаце
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  70bd790faf93c916:
    english: Voters are not required to rank every candidate. Unranked candidates will not receive any of that voter's support.
    translation: Ранжыраваць усіх кандыдатаў неабавязкова. Кандыдаты без рангу не атрымаюць падтрымкі з гэтага бюлетэня.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d82e369c7c293a0c:
    english: |-
      ## How counting works
      The count is performed as follows:
    translation: |-
      ## Як падлічваюцца галасы
      Падлік праходзіць так:
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0ea01b5d531abc06:
    english: |-
      1. A **quota** is calculated (minimum votes needed to win a seat).
      2. **First preferences** are counted for each candidate.
      3. If a candidate meets the quota, they are **elected**. Their surplus votes (above the quota) are **transferred** to voters' next preferences at a fractional value.
      4. If no candidate meets the quota, the candidate with the **fewest votes is eliminated**. Their votes transfer to voters' next preferences at full value.
      5. This process repeats until all seats are filled.
    translation: |-
      1. Разлічваецца **квота** — мінімальная колькасць галасоў, патрэбная для атрымання месца.
      2. Для кожнага кандыдата падлічваюцца **Першыя перавагі**.
      3. Калі кандыдат дасягае квоты, яго **абіраюць**. Галасы звыш квоты **перадаюцца** наступным кандыдатам у бюлетэнях з дробавай вагой.
      4. Калі ніхто не дасягае квоты, кандыдат з **найменшай колькасцю галасоў выбывае**. Яго галасы перадаюцца наступным кандыдатам у бюлетэнях з поўнай вагой.
      5. Працэс паўтараецца, пакуль не будуць запоўнены ўсе месцы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c6f397233ad479e5:
    english: |-
      >[!TIP]
      >If a voter has ranked no remaining candidates, their ballot is "exhausted" and that vote is lost. This is why ranking more candidates is generally better.
    translation: |-
      >[!TIP]
      >Калі ў бюлетэні не засталося кандыдатаў, якім дадзены ранг, бюлетэнь лічыцца «вычарпаным» і яго голас больш не ўлічваецца. Таму звычайна карысна ранжыраваць больш кандыдатаў.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  acba228efb586cca:
    english: "## Understanding results"
    translation: "## Як разумець вынікі"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3b584c17ac358371:
    english: 'After the poll closes, results are displayed in several sections. In this election, Samira Patel, Alex Morgan, and Morgan Price fill the three committee seats:'
    translation: 'Пасля закрыцця апытання вынікі паказваюцца ў некалькіх раздзелах. На гэтых выбарах тры месцы ў камітэце атрымалі Саміра Патэль, Алекс Морган і Морган Прайс:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9c3f3c8a80729fbf:
    english: "### Method and quota"
    translation: "### Метад і квота"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  feee79b9f6e92de3:
    english: At the top, you'll see the counting method (Scottish STV or Meek STV) and quota type (Droop or Hare) along with the quota — the number of votes a candidate needed to win a seat.
    translation: Уверсе паказаны метад падліку (шатландскае СТВ або Meek STV), тып квоты (Droop або Hare) і сама квота — колькасць галасоў, патрэбная кандыдату для атрымання месца.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e180eb800c3435cd:
    english: "### Elected candidates"
    translation: "### Абраныя кандыдаты"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8db8b2466db56f2b:
    english: 'A summary table of the winners with five columns:'
    translation: 'Зводная табліца абраных кандыдатаў мае пяць слупкоў:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f998ffc721953501:
    english: |-
      | Column | Meaning |
      |--------|---------|
      | **Candidate** | The name of the elected candidate |
      | **Round elected** | Which counting round they reached the quota and won a seat. Round 1 means they won on first preferences alone; higher rounds mean they needed transferred votes from eliminated or surplus candidates. |
      | **First preferences** | How many voters ranked this candidate as their first choice. This shows a candidate's direct support before any vote transfers. |
      | **Final tally** | The candidate's vote tally at the moment they were elected. Due to vote transfers, this is often higher than their first preferences. |
      | **Surplus** | How much the candidate's final tally exceeded the quota (final tally minus quota). A larger surplus means stronger support beyond what was needed to win. In Scottish STV, this surplus is redistributed to voters' next preferences. |
    translation: |-
      | Слупок | Значэнне |
      |--------|---------|
      | **Кандыдат** | Імя абранага кандыдата |
      | **абраны ў раўндзе** | Раўнд падліку, у якім кандыдат дасягнуў квоты і атрымаў месца. Калі гэта раўнд 1, хапіла толькі першых пераваг. У наступных раўндах спатрэбіліся галасы, перададзеныя ад кандыдатаў, якія выбылі або атрымалі галасы звыш квоты. |
      | **Першыя перавагі** | Колькасць выбаршчыкаў, якія паставілі гэтага кандыдата на першае месца. Яна паказвае непасрэдную падтрымку да перадачы галасоў. |
      | **Канчатковы падлік** | Колькасць галасоў у кандыдата на момант абрання. Праз перадачу галасоў яна часта вышэйшая за колькасць першых пераваг. |
      | **Лішак** | Колькасць галасоў звыш квоты на момант абрання: канчатковы падлік мінус квота. Большы лішак азначае мацнейшую падтрымку звыш патрэбнай для абрання. У шатландскім СТВ гэты лішак размяркоўваецца паміж наступнымі кандыдатамі ў бюлетэнях. |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  efc41c326d955758:
    english: If the count results in a tie — where eliminating any of the remaining candidates would change the outcome — those candidates are shown in a separate table rather than arbitrarily choosing a winner.
    translation: Калі ўзнікае роўнасць галасоў і выключэнне любога з кандыдатаў, якія засталіся, змяніла б вынік, гэтых кандыдатаў паказваюць у асобнай табліцы. Сістэма не выбірае абранага кандыдата адвольна.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8a6ae4ad28f0acf6:
    english: "### Round-by-round details"
    translation: "### Падрабязнасці па кожным раўндзе"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3d907145fd075144:
    english: 'Expand **Round-by-round details** to see vote transfers and eliminations. Each row is a candidate and each column is a counting round:'
    translation: 'Разгарніце **Падрабязнасці па кожным раўндзе**, каб убачыць перадачу галасоў і выключэнне кандыдатаў. Кожны радок адпавядае кандыдату, а кожны слупок — раўнду падліку:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cc37217cd681fabe:
    english: The green highlight shows when a candidate was elected, red shows when they were eliminated, and orange shows when they tied.
    translation: Зялёным колерам адзначана абранне кандыдата, чырвоным — выключэнне, а аранжавым — роўнасць галасоў.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ed4aaa0a898906fd:
    english: "## Exporting ballots"
    translation: "## Экспарт бюлетэняў"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c96d54ebfbedae32:
    english: After the election closes, people who can view the results can export the ballots in BLT format for an independent recount or audit. The export contains candidate rankings and combines identical rankings into a single row with a ballot count. For anonymous elections it does not contain voter identities, ballot identifiers, submission times, or submission order.
    translation: Пасля закрыцця выбараў людзі, якія маюць доступ да вынікаў, могуць экспартаваць бюлетэні ў фармаце BLT для незалежнага пераліку або праверкі. Экспарт змяшчае парадак пераваг кандыдатаў і аб’ядноўвае аднолькавыя парадкі ў адзін радок з колькасцю бюлетэняў. Для ананімных выбараў ён не змяшчае імёнаў выбаршчыкаў, ідэнтыфікатараў бюлетэняў, часу падачы або парадку падачы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
