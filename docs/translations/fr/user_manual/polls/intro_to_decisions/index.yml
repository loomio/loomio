  ff07fce3bab705aa:
    english: Proposals and polls collect structured responses from a group. They can help test an idea, make a decision, identify priorities, schedule a meeting, or elect representatives.
    translation: Les propositions et les sondages recueillent les réponses structurées d’un groupe. Ils permettent de tester une idée, de prendre une décision, de définir des priorités, de planifier une réunion ou d’élire des représentants.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
