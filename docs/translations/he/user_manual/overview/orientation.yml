  e671b5bc0a63ce1d:
    english: Use this menu to edit your profile, change notification settings, choose a theme, manage account settings, and sign out.
    translation: בתפריט זה אפשר לערוך את הפרופיל, לשנות את הגדרות ההתראות, לבחור ערכת נושא, לנהל את הגדרות החשבון ולהתנתק.
