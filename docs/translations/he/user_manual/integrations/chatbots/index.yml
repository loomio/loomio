    translated_on: '2026-09-30'
  e21550bf41c185b9:
    english: |-
      ## Generate a Webhook URL
      We've prepared step by step walk-throughs for each service we support. Follow the right one for your service to obtain the webhook URL you'll need to add the chat integration in Loomio.
    translation: |-
      ## יצירת כתובת URL של Webhook
      יש הוראות מפורטות לכל שירות נתמך. יש לפעול לפי ההוראות לשירות הרצוי כדי לקבל את כתובת ה־Webhook הדרושה להוספת אינטגרציית הצ'אט ב־Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
