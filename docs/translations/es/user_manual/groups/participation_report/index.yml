    translated_on: '2026-09-29'
  7d416ad780b3ca85:
    english: Turn on **Delegates only** to show people who are currently delegates in any of the selected groups. Their activity and voting record are aggregated across all selected groups, and delegates with no activity during the selected period remain in the table. The CSV download uses the same filter.
    translation: Activa **Solo delegados** para mostrar a las personas que actualmente son delegadas en cualquiera de los grupos seleccionados. Sus actividades y votos se suman entre todos los grupos seleccionados. Quienes no tuvieron actividad durante el período también aparecen en la tabla. La descarga CSV utiliza el mismo filtro.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
