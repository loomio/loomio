  eecfb12ed1d28d50:
    english: Good governance exists where an organization has systems and processes in place that are appropriate to its circumstances, and which enable the organization to pursue its purpose effectively and meet its obligations under the law.
    translation: Gute Gremienarbeit setzt voraus, dass eine Organisation über Strukturen und Abläufe verfügt, die zu ihrer Situation passen. Sie helfen ihr, ihren Zweck wirksam zu erfüllen und ihren gesetzlichen Pflichten nachzukommen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e54f67d22cf67a93:
    english: "*“It is participatory, consensus-oriented, accountable, transparent, responsive, effective and efficient, equitable and inclusive and follows the rule of law.”* [United Nations Economic and Social Commission for Asia and the Pacific](https://www.unescap.org/sites/default/d8files/knowledge-products/good-governance.pdf)."
    translation: "*„Sie ist partizipativ, konsensorientiert, rechenschaftspflichtig, transparent, reaktionsfähig, wirksam und effizient, gerecht und inklusiv und folgt dem Rechtsstaatsprinzip.“* [Wirtschafts- und Sozialkommission der Vereinten Nationen für Asien und den Pazifik](https://www.unescap.org/sites/default/d8files/knowledge-products/good-governance.pdf)."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1661a79cfda1a9df:
    english: Underpinning all of these principles is the need for good communication.
    translation: Alle diese Grundsätze beruhen auf guter Kommunikation.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2819f114c9d74160:
    english: 'Here are some or the challenges directors and boards experience:'
    translation: 'Vorstände und ihre Mitglieder stehen unter anderem vor diesen Herausforderungen:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ed750814c61b85fb:
    english: "* Getting directors together in person\n* Time available to consider important issues \n* Tracking communication\n* Urgency of critical issues\n* Online video meeting fatigue\n* Directors in multiple, remote locations, sometimes with poor internet connectivity\n* Mixed governance practice and experience\n* Dealing with high volumes of transactional business \n* Maintaining institutional memory"
    translation: "* Alle Vorstandsmitglieder persönlich zusammenzubringen\n* Genügend Zeit für wichtige Fragen zu finden \n* Die Kommunikation nachzuvollziehen\n* Dringende Fragen rechtzeitig zu klären\n* Ermüdung durch Online-Videokonferenzen\n* Vorstandsmitglieder an verschiedenen, abgelegenen Orten, teils mit schlechter Internetverbindung\n* Unterschiedliche Arbeitsweisen und Erfahrungen in der Gremienarbeit\n* Viele laufende Verwaltungsangelegenheiten zu bearbeiten \n* Wissen und Erfahrungen der Organisation zu bewahren"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b910c5253cf77950:
    english: Loomio offers an opportunity to strengthen governance, to extend collaboration beyond board meetings, to include everyone in open, honest and respectful discussion while documenting everything.
    translation: Mit Loomio kannst du die Gremienarbeit stärken und die Zusammenarbeit über Sitzungen hinaus fortsetzen. Alle können offen, ehrlich und respektvoll mitdiskutieren, und die Gespräche bleiben dokumentiert.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
