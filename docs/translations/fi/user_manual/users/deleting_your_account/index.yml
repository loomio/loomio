  941f0addde6f7326:
    english: "## What does delete account mean?"
    translation: "## Mitä tilin poistaminen tarkoittaa?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dab05d98ad64604f:
    english: |-
      When you delete your account:
      - Your user account including your name, email address and other personally identifying data will be deleted from our systems. You will not be able to sign in to Loomio with this account.
      - Comments, proposal and discussions you have made will remain but your name will be removed from them. We do this because we have an obligation to groups to keep threads and proposals coherent.
      - You will no longer be listed as a member of any groups.
      - You will no longer receive notification emails.
    translation: |-
      Kun poistat tilisi:
      - Käyttäjätilisi sekä nimesi, sähköpostiosoitteesi ja muut henkilötietosi poistetaan järjestelmistämme. Et voi enää kirjautua Loomioon tällä tilillä.
      - Kirjoittamasi kommentit sekä tekemäsi ehdotukset ja keskustelut säilyvät, mutta nimesi poistetaan niistä. Näin ryhmien keskusteluketjut ja ehdotukset pysyvät ymmärrettävinä.
      - Et enää näy minkään ryhmän jäsenenä.
      - Et enää saa ilmoituksia sähköpostitse.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dbeaf194bb8bd9e8:
    english: It is important to understand that copies of the data you have generated on Loomio have likely been emailed to everyone in the group - Loomio has no ability to delete those.
    translation: Loomiossa tuottamaasi sisältöä on todennäköisesti lähetetty sähköpostitse kaikille ryhmän jäsenille. Loomio ei voi poistaa näitä kopioita.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fa98dfeef486cf05:
    english: Deleting your account will _not_ cancel your subscription; to stop your payments see [Subscriptions](/en/policy/subscriptions/management#cancel-your-plan).
    translation: Tilisi poistaminen _ei_ peruuta tilaustasi. Jos haluat lopettaa maksut, katso [Tilaukset](/en/policy/subscriptions/management#cancel-your-plan).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c1ceda8f829133c7:
    english: Loomio has made fundamental decisions about its ownership, business model and software to protect users' rights. Loomio is an independent, worker-owned cooperative, the software is open source, you can [export your data](/en/user_manual/groups/data_export), and Loomio never sells your data or uses it for advertising. These commitments are set out in our [privacy policy](/en/policy/privacy) and grounded in the purpose and values in our [constitution](https://www.loomio.coop/constitution.html) and [cooperative handbook](https://www.loomio.coop/purpose_and_vision.html). If you have any questions, [contact us](/contact).
    translation: Loomio on tehnyt omistustaan, liiketoimintamalliaan ja ohjelmistoaan koskevia ratkaisuja käyttäjien oikeuksien suojaamiseksi. Loomio on itsenäinen, työntekijöiden omistama osuuskunta. Ohjelmisto on avointa lähdekoodia, voit [viedä tietosi](/en/user_manual/groups/data_export), eikä Loomio koskaan myy tietojasi tai käytä niitä mainontaan. Nämä sitoumukset on kirjattu [tietosuojakäytäntöömme](/en/policy/privacy), ja ne perustuvat [säännöissämme](https://www.loomio.coop/constitution.html) ja [osuuskunnan käsikirjassa](https://www.loomio.coop/purpose_and_vision.html) kuvattuihin tarkoitukseen ja arvoihin. Jos sinulla on kysyttävää, [ota meihin yhteyttä](/contact).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d8cc22d615b8f5d9:
