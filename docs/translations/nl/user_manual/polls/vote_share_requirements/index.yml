    translation: Daarna stemmen Alex en Morgan voor, terwijl Taylor tegenstemt. Alle vijf mensen hebben gestemd, dus het quorum is bereikt. Vier van de vijf kiesgerechtigde kiezers stemmen voor. Die 80 procent is meer dan de vereiste 75 procent. Bij beide vereisten staat daarom een groen vinkje.
