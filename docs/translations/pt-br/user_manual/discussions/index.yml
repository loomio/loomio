  '0479bd2337b02443':
    english: "### Boards and Governance"
    translation: "### Conselhos e governança"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5b0a3e2c653d47f8:
    english: "**Prepare for a meeting** - Build an agenda, post board papers and organize administrative matters so everyone is up to date, in context and prepared. "
    translation: "**Prepare-se para uma reunião** - Monte a pauta, publique os documentos do conselho e organize as questões administrativas para que todos tenham as informações e o contexto necessários para se preparar."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5c1c6aa79c3556dc:
    english: "**Pass a resolution** - Post context and background information, respond to questions and raise a proposal to pass a resolution. "
    translation: "**Aprovar uma resolução** - Publique o contexto e as informações relevantes, responda a perguntas e apresente uma proposta para aprovar a resolução."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  07ae9c6a1f0a32d0:
    english: "**Discuss an agenda item on Loomio** - Start discussion about an agenda item prior to your meeting. Or, if you run out of time in the meeting, move the discussion on to Loomio."
    translation: "**Discutir um item da pauta no Loomio** - Inicie a discussão sobre um item da pauta antes da reunião. Se faltar tempo durante a reunião, continue a discussão no Loomio."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f0b0de7094b1cfc9:
    english: "**Approve minutes and track actions** - Post minutes and assign actions. Use a poll to approve minutes. "
    translation: "**Aprovar atas e acompanhar tarefas** - Publique as atas e atribua tarefas. Use uma enquete para aprovar as atas."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ba7cf177191baadb:
    english: "### Member participation"
    translation: "### Participação dos membros"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3cf51f837c0a3e9f:
    english: "**Share news (replace mailing list)** - Post information for members, invite comments."
    translation: "**Compartilhar notícias (substituir a lista de e-mails)** - Publique informações para os membros e convide-os a comentar."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d2cd391b61042129:
    english: "**Organize an event** - Work with your organizing team on details. Keep all discussion and info within the thread. Then announce the event to wider membership."
    translation: "**Organizar um evento** - Defina os detalhes com a equipe organizadora. Mantenha a discussão e as informações na conversa. Depois, anuncie o evento aos demais membros."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cf59a44a8643cc96:
    english: "**Develop a policy** - Post a policy draft, seek member feedback and input, finalize and ratify the policy."
    translation: "**Desenvolver uma política** - Publique uma minuta, peça opiniões e contribuições dos membros, finalize o texto e aprove a política."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6ddec467576426ca:
    english: "**General Assembly** - Organize, prepare and run a formal meeting including all members, to deliberate and make decisions on strategic matters."
    translation: "**Assembleia geral** - Organize, prepare e conduza uma reunião formal com todos os membros para debater e decidir questões estratégicas."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8d32bb446c4ca025:
    english: "### Self-organizing working teams"
    translation: "### Equipes de trabalho auto-organizadas"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  87ab6b2d51a7c1b6:
    english: "**Share information** - Post information and reports of interest to your team, invite comment and discussion."
    translation: "**Compartilhar informações** - Publique informações e relatórios de interesse da equipe e convide as pessoas a comentar e discutir."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e93205aa183cd1e0:
    english: "**Progress work** - Outline a work task and seek advice, input and feedback from team members through to completion."
    translation: "**Dar andamento ao trabalho** - Descreva uma tarefa e peça conselhos, contribuições e opiniões aos membros da equipe até sua conclusão."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1ddaef5d44653691:
    english: "**Meeting notes and actions** - Post meeting notes as a record of discussion, and follow up on tasks. "
    translation: "**Notas de reunião e tarefas** - Publique as notas da reunião para registrar a discussão e acompanhe as tarefas."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8ce9169d72c90788:
    english: "**Explore ideas** - Share thoughts and invite discussion about a concern you notice, or an improvement that can be made."
    translation: "**Explorar ideias** - Compartilhe suas ideias e convide as pessoas a discutir uma questão que você identificou ou uma possível melhoria."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a06e734e86f07828:
    english: "**Advice, Consent and Generative decision making** - Prepare, propose, clarify, respond to reactions and objections, agree and implement - all within a Loomio discussion."
    translation: "**Tomada de decisão por aconselhamento, consentimento e criação conjunta** - Prepare, proponha, esclareça, responda a reações e objeções, chegue a um acordo e coloque a decisão em prática, tudo em uma discussão no Loomio."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
