    english: "<!-- seo-description: Use the Loomio Server API to manage user accounts on a self-hosted Loomio installation. -->"
    translation: "<!-- seo-description: Використовуйте серверний API Loomio, щоб керувати обліковими записами користувачів у власному розгортанні Loomio. -->"
