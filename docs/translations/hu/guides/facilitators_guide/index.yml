  e19d687b56819302:
    english: Hi! I'm Alanna.
    translation: Szia! Alanna vagyok.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  10352ad196487ff3:
    english: I'm one of the founders of Loomio, and I've been thinking deeply about how it works from a facilitation perspective since the beginning. I am not a seminal facilitation expert; I consider myself only a beginner in this craft that one could spend a lifetime honing.
    translation: A Loomio egyik alapítója vagyok. A kezdetektől foglalkoztat, hogyan működik a facilitálás szempontjából. Nem vagyok a terület meghatározó szakértője; kezdőnek tartom magam ebben a mesterségben, amelyet egy életen át lehet csiszolni.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c637c96f9723f02d:
    english: What I can offer is help translating between the offline and online spaces, as a practitioner in both. I've facilitated a lot of groups who use Loomio, and learned from their experiences.
    translation: Abban tudok segíteni, hogy összekapcsoljam a személyes és az online facilitálás tapasztalatait, mert mindkettőt gyakorlom. Sok Loomiót használó csoport munkáját segítettem, és tanultam a tapasztalataikból.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c376e38821fb6c2f:
    english: You can find out [more about me on my website](http://alanna.space).
    translation: "[A weboldalamon többet megtudhatsz rólam](http://alanna.space)."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b893957534fa37e2:
    english: I'm only one person, with one perspective and approach to facilitation, when there are myriad approaches. I've tried to bring in a couple other facilitator's voices here, including [Rich](http://richdecibels.com/) from Loomio and Silvia from [EXP](http://exp.agency).
    translation: Csak egy vagyok a sok facilitátor közül, saját nézőponttal és módszerekkel. Ezért más facilitátorok gondolatait is igyekeztem bevonni az útmutatóba, köztük a Loomiónál dolgozó [Rich](http://richdecibels.com/) és az [EXP](http://exp.agency) munkatársa, Silvia gondolatait.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
