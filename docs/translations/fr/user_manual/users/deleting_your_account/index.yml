  b69fb514fd196dd7:
    english: "# Deleting your Loomio account"
    translation: "# Supprimer votre compte Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  941f0addde6f7326:
    english: "## What does delete account mean?"
    translation: "## Que se passe-t-il lorsque vous supprimez votre compte ?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dab05d98ad64604f:
    english: |-
      When you delete your account:
      - Your user account including your name, email address and other personally identifying data will be deleted from our systems. You will not be able to sign in to Loomio with this account.
      - Comments, proposal and discussions you have made will remain but your name will be removed from them. We do this because we have an obligation to groups to keep threads and proposals coherent.
      - You will no longer be listed as a member of any groups.
      - You will no longer receive notification emails.
    translation: |-
      Lorsque vous supprimez votre compte :
      - Votre compte utilisateur, notamment votre nom, votre adresse e-mail et vos autres données personnelles permettant de vous identifier, est supprimé de nos systèmes. Vous ne pouvez plus vous connecter à Loomio avec ce compte.
      - Vos commentaires, propositions et discussions restent visibles, mais votre nom en est retiré. Cela permet aux groupes de conserver des fils de discussion et des propositions compréhensibles.
      - Vous ne figurez plus parmi les membres des groupes.
      - Vous ne recevez plus d’e-mails de notification.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dbeaf194bb8bd9e8:
    english: It is important to understand that copies of the data you have generated on Loomio have likely been emailed to everyone in the group - Loomio has no ability to delete those.
    translation: Des copies des données que vous avez publiées sur Loomio ont probablement été envoyées par e-mail aux membres du groupe. Loomio ne peut pas supprimer ces copies.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fa98dfeef486cf05:
    english: Deleting your account will _not_ cancel your subscription; to stop your payments see [Subscriptions](/en/policy/subscriptions/management#cancel-your-plan).
    translation: La suppression de votre compte _n’annule pas_ votre abonnement. Pour arrêter vos paiements, consultez la page [Abonnements](/en/policy/subscriptions/management#cancel-your-plan).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c1ceda8f829133c7:
    english: Loomio has made fundamental decisions about its ownership, business model and software to protect users' rights. Loomio is an independent, worker-owned cooperative, the software is open source, you can [export your data](/en/user_manual/groups/data_export), and Loomio never sells your data or uses it for advertising. These commitments are set out in our [privacy policy](/en/policy/privacy) and grounded in the purpose and values in our [constitution](https://www.loomio.coop/constitution.html) and [cooperative handbook](https://www.loomio.coop/purpose_and_vision.html). If you have any questions, [contact us](/contact).
    translation: Loomio a fait des choix concernant sa propriété, son modèle économique et son logiciel afin de protéger les droits des utilisateurs. Loomio est une coopérative indépendante détenue par ses travailleurs, son logiciel est open source, vous pouvez [exporter vos données](/en/user_manual/groups/data_export) et Loomio ne vend jamais vos données ni ne les utilise à des fins publicitaires. Ces engagements figurent dans notre [politique de confidentialité](/en/policy/privacy) et reposent sur l’objet et les valeurs définis dans nos [statuts](https://www.loomio.coop/constitution.html) et notre [manuel coopératif](https://www.loomio.coop/purpose_and_vision.html). Si vous avez des questions, [contactez-nous](/contact).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d8cc22d615b8f5d9:
    english: "## To delete your account entirely"
    translation: "## Supprimer définitivement votre compte"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  77235d504409d763:
    english: Sign in to Loomio.  Go to the sidebar from the (☰) menu icon at screen top left Click on your account avatar or initials, at the top right of your screen.
    translation: Connectez-vous à Loomio. Ouvrez la barre latérale à l’aide de l’icône de menu (☰) en haut à gauche de l’écran. Cliquez sur votre avatar ou vos initiales en haut à droite de l’écran.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  04127f38282f6bd2:
    english: Click the down arrow ( ∨ ) alongside your name to open user settings. Select **Edit profile**.
    translation: Cliquez sur la flèche vers le bas ( ∨ ) à côté de votre nom pour ouvrir les paramètres utilisateur. Sélectionnez **Modifier mon profil**.
    status: machine
