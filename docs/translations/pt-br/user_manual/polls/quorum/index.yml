  a79abb23e8e1c82f:
    english: A quorum is the minimum percentage of eligible voters who must participate for a poll to be valid. Use it when your governance process requires a particular level of participation.
    translation: O quórum é a porcentagem mínima de pessoas aptas a votar que precisam participar para que uma votação seja válida. Use-o quando o processo de decisão do seu grupo exigir um nível específico de participação.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d83e75068f697f6f:
    english: When creating a poll, open **More settings** and enter the required percentage in **Participation quorum**. Leave the field blank when no quorum is required.
    translation: Ao criar uma votação, abra **Mais configurações** e informe a porcentagem exigida em **Quórum de participação**. Deixe o campo em branco se não houver quórum obrigatório.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a04b99724fe62a56:
    english: "![The Quorum setting with a 60 percent participation quorum](./quorum-section.png)"
    translation: "![A configuração de quórum com 60% de participação exigida](./quorum-section.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  432f570094ad5b24:
    english: You can also set a quorum in a [poll template](/en/user_manual/polls/poll_templates/) so that polls created from that template use it by default.
    translation: Você também pode definir um quórum em um [modelo de votação](/en/user_manual/polls/poll_templates/) para que as votações criadas a partir dele usem esse valor por padrão.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
