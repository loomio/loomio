  85fc948a4e849ba8:
    english: A guest can see and participate in this thread but cannot see other discussions in the group unless separately invited.
    translation: Ein Gast kann diesen Thread sehen und daran teilnehmen. Andere Diskussionen der Gruppe kann er nur sehen, wenn er dazu gesondert eingeladen wurde.
