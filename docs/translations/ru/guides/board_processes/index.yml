  eecfb12ed1d28d50:
    english: Good governance exists where an organization has systems and processes in place that are appropriate to its circumstances, and which enable the organization to pursue its purpose effectively and meet its obligations under the law.
    translation: Эффективное управление возможно, когда в организации действуют системы и процессы, отвечающие её обстоятельствам. Они помогают организации достигать своих целей и выполнять требования закона.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e54f67d22cf67a93:
    english: "*“It is participatory, consensus-oriented, accountable, transparent, responsive, effective and efficient, equitable and inclusive and follows the rule of law.”* [United Nations Economic and Social Commission for Asia and the Pacific](https://www.unescap.org/sites/default/d8files/knowledge-products/good-governance.pdf)."
    translation: "*«Оно предполагает участие, стремление к консенсусу, подотчётность, прозрачность, отзывчивость, результативность и эффективность, равенство и инклюзивность, а также соблюдение верховенства закона».* [Экономическая и социальная комиссия ООН для Азии и Тихого океана](https://www.unescap.org/sites/default/d8files/knowledge-products/good-governance.pdf)."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1661a79cfda1a9df:
    english: Underpinning all of these principles is the need for good communication.
    translation: Все эти принципы опираются на хорошее общение.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2819f114c9d74160:
    english: 'Here are some or the challenges directors and boards experience:'
    translation: 'Советы и их члены сталкиваются со следующими трудностями:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ed750814c61b85fb:
    english: "* Getting directors together in person\n* Time available to consider important issues \n* Tracking communication\n* Urgency of critical issues\n* Online video meeting fatigue\n* Directors in multiple, remote locations, sometimes with poor internet connectivity\n* Mixed governance practice and experience\n* Dealing with high volumes of transactional business \n* Maintaining institutional memory"
    translation: "* Сложно собрать членов совета лично\n* Не хватает времени на рассмотрение важных вопросов \n* Сложно отслеживать переписку и обсуждения\n* Важные вопросы требуют срочного решения\n* Участники устают от видеозвонков\n* Члены совета находятся в разных, иногда удалённых местах, где связь с интернетом может быть плохой\n* У членов совета разный опыт и разные подходы к управлению\n* Приходится обрабатывать большой объём текущих вопросов \n* Сложно сохранять историю работы организации"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b910c5253cf77950:
    english: Loomio offers an opportunity to strengthen governance, to extend collaboration beyond board meetings, to include everyone in open, honest and respectful discussion while documenting everything.
    translation: 'Loomio помогает улучшить управление: продолжать совместную работу между заседаниями, вовлекать всех в открытые и уважительные обсуждения и сохранять записи обо всех решениях.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
