---
navigation_title: פתיחת דיון
blocks:
  8fae4100a4f3548b:
    english: "# Start a discussion"
    translation: "# פתיחת דיון"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4ba984e9573c27ff:
    english: Starting a Loomio discussion is like writing an email. The subject line of an email is like the discussion title, and the text you write in an email is like the context of a discussion.
    translation: פתיחת דיון ב-Loomio דומה לכתיבת אימייל. שורת הנושא של האימייל דומה לכותרת הדיון, ותוכן האימייל דומה להקשר של הדיון.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4f81447c072f5dfe:
    english: As you add people in the send list of your email, in Loomio you can invite people individually or as a group to the discussion - they will receive an email notification with the content of your discussion.
    translation: כמו שמוסיפים נמענים לאימייל, ב-Loomio ניתן להזמין לדיון אנשים בנפרד או קבוצה שלמה. הם יקבלו התראה באימייל עם תוכן הדיון.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2408b54e3b78a282:
    english: People can reply to your discussion via email and their comments will appear in the discussion.
    translation: ניתן להשיב לדיון באימייל, והתגובות יופיעו בדיון.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  24ced64c5c4cf853:
    english: As with an email, a discussion may be a simple question, or a more detailed introduction to a topic with links or files attached for background information.
    translation: כמו אימייל, דיון יכול להיות שאלה פשוטה או הצגה מפורטת יותר של נושא, עם קישורים או קבצים מצורפים כרקע.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ec39413fa07094c8:
    english: "## New discussion"
    translation: "## דיון חדש"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  92b37b2e208bfd57:
    english: Find the **New discussion** button on your Loomio group page to start a new discussion.
    translation: כדי לפתוח דיון, יש לבחור בכפתור **דיון חדש** בדף הקבוצה ב-Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  515ac46bdfccb401:
    english: You can start a discussion within your Loomio group or any subgroup.
    translation: ניתן לפתוח דיון בקבוצה ב-Loomio או בכל אחת מתת-הקבוצות שלה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ef9721ba6b69b86b:
    english: "![New discussion button on the Oatmilk Cooperative page](new-discussion-button.png)"
    translation: "![כפתור דיון חדש בדף של קואופרטיב חלב שיבולת השועל](new-discussion-button.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1cf9e569475cd2cc:
    english: "![New discussion form for planning the returnable bottle trial](new-discussion-example.png)"
    translation: "![טופס דיון חדש לתכנון ניסוי בבקבוקים להחזרה](new-discussion-example.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f973f5b9f1c4b1dd:
    english: |-
      ### Group
      Check the name of the group or subgroup is correct for your discussion.  Anyone in this group will be able to see the discussion. You can also start the discussion in another group or as a 'direct' discussion (no group).
    translation: |-
      ### קבוצה
      יש לוודא ששם הקבוצה או תת-הקבוצה מתאים לדיון. כל חברי הקבוצה הזו יוכלו לראות את הדיון. ניתן גם לפתוח את הדיון בקבוצה אחרת או כדיון 'ישיר' (ללא קבוצה).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f0b0bda9877ce0ed:
    english: |-
      >[!Tip]
      >If you are not ready to make the discussion visible in your group, start the discussion as 'direct'.  You can move the discussion to your Loomio group when ready.
    translation: |-
      >[!Tip]
      >אם עדיין לא רוצים שהדיון יהיה גלוי לקבוצה, ניתן לפתוח אותו כדיון 'ישיר'. כשהדיון מוכן, ניתן להעביר אותו לקבוצה ב-Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cd1b45c3cb71503b:
    english: "### Invite and notify"
    translation: "### הזמנה והתראות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f3f388d23b06b25c:
    english: The **Invite** field controls who receives the new discussion immediately.
    translation: השדה **הזמן** קובע מי יקבלו התראה מיד עם פתיחת הדיון.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c1b5c23770d3692:
    english: Group members can see a discussion in their group even if you do not notify them. Adding a group member to **Invite** sends them an email notification and a notification in Loomio.
    translation: חברי הקבוצה יכולים לראות דיון בקבוצה גם אם לא נשלחה להם התראה. הוספת חבר או חברת קבוצה לשדה **הזמן** שולחת להם התראה באימייל והתראה ב-Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e2e5906a39131506:
    english: Select a group to notify everyone in it, or expand the group to choose individual members. Select the × beside a name to remove that person from the notification.
    translation: כדי לשלוח התראה לכל חברי הקבוצה, יש לבחור את הקבוצה. כדי לבחור חברים מסוימים, יש להרחיב את רשימת הקבוצה. להסרת אדם מרשימת מקבלי ההתראה, יש לבחור ב-× לצד השם.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  81b57efbb3c428b7:
    english: "![Invite field expanded to show individual recipients](../notifying_people/thread_notification.png)"
    translation: "![השדה הזמן מורחב ומציג נמענים בנפרד](../notifying_people/thread_notification.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5cbd2b7b0bcc486f:
    english: Start typing a member's name and select it from the list.
    translation: יש להתחיל להקליד שם של חבר או חברת קבוצה ולבחור אותו מהרשימה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dc128abbc65cb0c8:
    english: "![Searching for Samira Patel in the Invite field](../notifying_people/thread_notify_user.png)"
    translation: "![חיפוש אחר סאמירה פאטל בשדה הזמן](../notifying_people/thread_notify_user.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3274fe93fcf29b29:
    english: Enter an email address to invite a guest. A guest can see and participate in this thread but cannot see other discussions in the group unless separately invited.
    translation: כדי להזמין אורחים, יש להזין כתובת אימייל. אורחים יכולים לראות את השרשור ולהשתתף בו, אך אינם יכולים לראות דיונים אחרים בקבוצה ללא הזמנה נפרדת.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ab3214ccf77143e3:
    english: "![Adding a guest email address to the Invite field](../notifying_people/thread_notify_email.png)"
    translation: "![הוספת כתובת אימייל של אורחים לשדה הזמן](../notifying_people/thread_notify_email.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cba9346e727b829a:
    english: You can also start the discussion without notifying anyone. Group members can still find it in Loomio and may see it in their catch-up email, depending on their notification settings.
    translation: ניתן גם לפתוח דיון בלי לשלוח התראה לאף אחד. חברי הקבוצה עדיין יכולים למצוא אותו ב-Loomio, וייתכן שיופיע באימייל סיכום הפעילות שלהם, בהתאם להגדרות ההתראות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6518afe373ff1959:
    english: "### Tags"
    translation: "### תגיות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ff67c09f89479873:
    english: Add tag(s) to help people find your discussion when searching by tag. Admins can create new tags.
    translation: ניתן להוסיף תגיות כדי לעזור לאנשים למצוא את הדיון בחיפוש לפי תגית. מנהלי הקבוצה יכולים ליצור תגיות חדשות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ba80a903c4ecc7d1:
    english: |-
      ### Title
      Give your discussion a relevant title.  A discussion title is similar to an email subject line.
    translation: |-
      ### כותרת
      יש לתת לדיון כותרת מתאימה. כותרת הדיון דומה לשורת הנושא של אימייל.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a91cf4b0b1b2ad5e:
    english: |-
      ### Context
      Use discussion context to introduce the topic and frame the conversation or decision to make. Use the formatting tools to emphasize key points. Include background information, attach files, link to online documents and embed a video.
    translation: |-
      ### הקשר
      יש להשתמש בהקשר הדיון כדי להציג את הנושא ולהבהיר על מה משוחחים או איזו החלטה יש לקבל. ניתן להדגיש נקודות מרכזיות באמצעות כלי העיצוב, להוסיף מידע רקע, לצרף קבצים, לקשר למסמכים מקוונים ולהטמיע סרטון.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1bf690aa841299cd:
    english: The context will always stay at the top of the discussion and you can update it at any time as the discussion progresses.  When the discussion ends, update the context with the outcome.
    translation: ההקשר נשאר תמיד בראש הדיון, וניתן לעדכן אותו בכל שלב עם התקדמות הדיון. בסיום הדיון, יש לעדכן את ההקשר במסקנה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
