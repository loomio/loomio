  0a72d2c89c87c2a7:
    english: "# Making resolutions and online decisions"
    translation: "# Prendre des résolutions et des décisions en ligne"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  50902da4933b32b7:
    english: Board and committee members frequently need to make 'out-of-session' decisions. These are governance decisions and discussion where either;
    translation: 'Les membres des conseils d’administration et des comités doivent souvent prendre des décisions entre deux réunions. Ces décisions et discussions peuvent être nécessaires dans les cas suivants :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4355b569fb0f9ee4:
    english: |-
      - There was insufficient time to make a decision in the board meeting,
      - the decision does not require a lot of discussion (including administrative decisions),
      - something has happened (internally or externally) that requires the board to act before the next meeting,
      - a director has a particular interest to explore with the board.
    translation: |-
      - La réunion du conseil n’a pas laissé assez de temps pour prendre une décision,
      - la décision demande peu de discussion, notamment s’il s’agit d’une question administrative,
      - un événement interne ou externe exige que le conseil agisse avant sa prochaine réunion,
      - un membre du conseil souhaite examiner un sujet particulier avec les autres membres.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c46be74fd433f516:
    english: |-
      ## On Loomio
      Start a **thread** and open a discussion:
      - Introduce the topic or decision that you would like to make,
      - invite directors to comment with their thoughts, opinions and any information they have to help everyone understand their perspective about the 'out-of-session' topic or decision,
      - encourage members to participate by posting or reply to comments.
    translation: |-
      ## Sur Loomio
      Lancez une **discussion** :
      - Présentez le sujet ou la décision à prendre,
      - invitez les membres du conseil à donner leur avis et à partager les informations dont ils disposent, afin que chacun puisse comprendre leur point de vue sur le sujet ou la décision à traiter entre deux réunions,
      - encouragez les membres à participer en publiant des commentaires ou en y répondant.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  337cfc1a7b434acd:
    english: "When ready, raise a **poll** and invite members to vote. \nIf the issue is straightforward use a **Proposal** or if the issue is more complex use a **Sense check** poll to clearly ask fellow members how they feel about the proposal.\n- State the decision and invite people to vote,\n- ask people to leave a reason for their vote, particularly if they want to qualify any points,\n- choose the decision options that work for your board's decision-making processes.\n- You can ratify and minute the 'out-of-session' decision at your next board meeting."
    translation: "Quand vous êtes prêts, lancez un **Sondage** et invitez les membres à voter. \nSi la question est simple, utilisez une **Proposition**. Si elle est plus complexe, utilisez un sondage **Vérification des sens** pour demander clairement aux autres membres ce qu’ils pensent de la proposition.\n- Énoncez la décision à prendre et invitez les personnes à voter,\n- demandez-leur d’expliquer leur vote, surtout si elles souhaitent apporter des précisions,\n- choisissez les options de vote adaptées aux procédures de décision de votre conseil.\n- Vous pourrez ratifier la décision prise entre deux réunions et la consigner dans le procès-verbal de la prochaine réunion du conseil."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  19a80c3ce7d106e0:
    english: It's not a failure if a decision does not get agreement. You can ask members what changes they would make to enable them to agree to a decision. This helps you build to a better decision. A new Proposal with amendments is then more likely to achieve agreement.
    translation: L’absence d’accord n’est pas un échec. Vous pouvez demander aux membres quels changements leur permettraient d’approuver la décision. Leurs réponses peuvent aider à améliorer la proposition. Une nouvelle proposition intégrant ces modifications aura davantage de chances de recueillir un accord.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b06f2d2a0e68f99d:
    english: State an **outcome** when the proposal closes. Let everyone know the result of the decision and what will happen next.
    translation: Publiez une **conclusion** à la clôture de la proposition. Indiquez à tout le monde quelle décision a été prise et quelles seront les prochaines étapes.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6a4d6a8c978bcb11:
    english: "## Examples of out-of-session decisions"
    translation: "## Exemples de décisions prises entre deux réunions"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fff64b1ac620cc4a:
    english: |-
      ### Decision about property purchase
      At the last board meeting, a property purchase was discussed. A director required an independent engineering report before making the decision. At the board meeting, the board agreed to purchase the property subject to a satisfactory engineering report. However as the purchase must be made before the next board meeting, the board agreed to upload the engineering report to Loomio when ready, for discussion and to make the final decision for the property purchase on Loomio.
    translation: |-
      ### Décision concernant l’achat d’un bien immobilier
      Lors de sa dernière réunion, le conseil a discuté de l’achat d’un bien immobilier. Un membre a demandé un rapport d’expertise indépendant avant de prendre une décision. Le conseil a accepté l’achat sous réserve d’un rapport satisfaisant. Comme l’achat doit avoir lieu avant la prochaine réunion, le conseil a convenu de déposer le rapport sur Loomio dès qu’il serait disponible. Les membres pourront alors en discuter et prendre la décision définitive sur Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b279ed6b1c5aadfa:
    english: |-
      ### Decision to accept Directors and Officers Liability insurance
      During the board meeting it was noted that the annual insurance renewal was coming up. As this was considered to be an administrative matter, the board agreed to use Loomio to discuss the renewal application, seek the required information from each director, submit the application and to accept the insurance renewal quote.
    translation: |-
      ### Décision d’accepter le renouvellement de l’assurance responsabilité civile des administrateurs et dirigeants
      Lors d’une réunion, le conseil a constaté que le renouvellement annuel de cette assurance approchait. Considérant qu’il s’agissait d’une question administrative, il a convenu d’utiliser Loomio pour discuter de la demande de renouvellement, recueillir les informations nécessaires auprès de chaque membre, déposer la demande et accepter le devis.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ca3a40286ca25a9a:
    english: |-
      ### A security breach has occurred at one of our facilities
      A break-in and theft of property has occurred that has put the corporation and staff at risk. Directors must be made aware of the event and risks, and evaluate an appropriate response.
    translation: |-
      ### Une atteinte à la sécurité s’est produite dans l’un de nos établissements
      Une intrusion et un vol de biens ont mis l’organisation et son personnel en danger. Les membres du conseil doivent être informés de l’événement et des risques, puis évaluer la réponse à apporter.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c406842807e1091b:
    english: |-
      ### A director has challenged the board about gender and diversity of board membership
      The director has provided good reasons and evidence that the board should diversify membership to be more representative of the corporation. Directors need to digest the information, ask questions, discuss the issue and decide a response.
    translation: |-
      ### Un membre du conseil soulève la question de la diversité des genres et des profils au sein du conseil
      Ce membre a présenté des arguments et des éléments montrant que le conseil devrait diversifier sa composition pour mieux représenter l’organisation. Les autres membres doivent examiner ces informations, poser des questions, discuter du sujet et décider comment y répondre.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bf35cdb4a62a85f4:
    english: "## Keeping a record of decisions made and supporting discussion"
    translation: "## Conserver une trace des décisions et des discussions qui les étayent"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6231d476f6bddb27:
    english: Record keeping is a legal requirement for governance boards and good practice for committees.
    translation: La tenue de registres est une obligation légale pour les conseils d’administration et une bonne pratique pour les comités.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  511470c795509c7e:
    english: Today, many organizations record and store formal minutes, resolutions, policies and key decisions electronically. Document records are created and approved, distributed and used, retained and stored, and ultimately disposed of.
    translation: Aujourd’hui, de nombreuses organisations conservent sous forme électronique leurs procès-verbaux officiels, résolutions, politiques et décisions importantes. Ces documents sont créés et approuvés, diffusés et utilisés, puis conservés et archivés avant d’être finalement supprimés.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  324fc531e7a78088:
    english: |-
      ### On Loomio
      Minutes, reports, resolutions and other documents can be attached to a meeting **thread**, in the thread context, within a poll or any to thread comment.  This means the documents are always associated with the relevant discussion.
    translation: |-
      ### Sur Loomio
      Vous pouvez joindre des procès-verbaux, rapports, résolutions et autres documents à une **discussion** de réunion, dans son contexte, dans un sondage ou dans un commentaire. Les documents restent ainsi associés à la discussion concernée.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9be58ccab5189118:
    english: A list of files can also be found under the **Files** tab.
    translation: Vous trouverez également la liste des fichiers dans l’onglet **Fichiers**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  24bc6a0bf5139b23:
    english: You can also add a link within any thread or poll to a document stored in your preferred document management system.  Find the online shareable link to the document, copy and paste into your thread, poll or comment.
    translation: Vous pouvez aussi ajouter, dans une discussion ou un sondage, un lien vers un document conservé dans votre système de gestion documentaire. Trouvez le lien de partage du document, puis copiez-le et collez-le dans la discussion, le sondage ou un commentaire.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4fee216f27a3fdff:
    english: Anyone with permission can then click the link to open and read the document.
    translation: Toute personne autorisée peut alors cliquer sur le lien pour ouvrir et lire le document.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9f0e1cd18ae1a402:
    english: Because Loomio discussions and decisions are always already documented, it provides a robust way to verify all your board's decision-making. You can easily demonstrate what was decided, and when. If directors have discussed and commented, as well as voted on a resolution—you will also know how and why each decision was reached.
    translation: Les discussions et les décisions étant consignées dans Loomio, vous pouvez vérifier les décisions de votre conseil. Vous pouvez retrouver ce qui a été décidé et à quelle date. Si les membres du conseil ont discuté, laissé des commentaires et voté sur une résolution, vous pouvez également comprendre comment et pourquoi la décision a été prise.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  71071cda2f1c034e:
    english: Over time, you are creating a history for your organization where you can easily search and find past decisions and related discussion.
    translation: Au fil du temps, vous constituez pour votre organisation un historique dans lequel vous pouvez facilement rechercher les décisions passées et les discussions associées.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  629c2034788a9fd5:
    english: In Loomio all data is written and stored on multiple disks and multiple locations, *in the cloud*, backed up daily.  Files uploaded are stored on servers that use modern techniques to remove bottlenecks and points of failure.
    translation: Dans Loomio, toutes les données sont enregistrées sur plusieurs disques et à plusieurs endroits, *dans le cloud*, avec une sauvegarde quotidienne. Les fichiers déposés sont conservés sur des serveurs conçus pour limiter les goulets d’étranglement et les points de défaillance.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
