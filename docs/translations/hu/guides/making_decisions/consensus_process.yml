    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  39e0039c195ae5f3:
    english: Having completed the latest version of the Brand Concept document, Vivien is now ready to seek approval from the governance board by running a Consensus proposal.
    translation: Miután elkészült az Arculati koncepció dokumentum legújabb változata, Vivien Konszenzus típusú javaslatot indít, hogy jóváhagyást kérjen a vezető testülettől.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4bf082d10976bc31:
    english: 'Governance board members are invited to vote and approve the Brand Concept.  The board has previously agreed that proposals like this require >75% of members to vote Agree for it to pass. '
    translation: A vezető testület tagjai meghívást kapnak, hogy szavazzanak az Arculati koncepció jóváhagyásáról. A testület korábban megállapodott abban, hogy az ilyen javaslatok elfogadásához a tagok >75%-ának az Egyetért lehetőségre kell szavaznia.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  feb488e50bdd3834:
    english: This template includes a Block option by default. Block isn't suitable for every group — it can be controversial or misused. If you don't use block in your decision-making process, we recommend editing the template to remove it.
    translation: 'Ez a sablon alapértelmezés szerint tartalmazza a Tiltakozás lehetőséget. A Tiltakozás nem minden csoportnak megfelelő: vitát válthat ki, vagy visszaélhetnek vele. Ha a döntéshozatali folyamatotokban nem használjátok, szerkeszd a sablont, és távolítsd el ezt a lehetőséget.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
