---
navigation_title: Usare le discussioni
blocks:
  d6fe7310d19b1141:
    english: "# Using threads"
    translation: "# Usare le discussioni"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  031f9244f107aba8:
    english: A discussion keeps its context, comments, decisions, and outcomes together in one thread. This page explains how to participate in a thread and use its navigation and actions.
    translation: Una discussione raccoglie in un unico thread il contesto, i commenti, le decisioni e le conclusioni. Questa pagina spiega come partecipare e usare gli strumenti di navigazione e le azioni del thread.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  479a1564b496bfed:
    english: "## Thread anatomy"
    translation: "## Com'è fatto un thread"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb745de96e6a612d:
    english: 'A typical thread looks like this:'
    translation: 'Ecco come appare un thread:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e69f7f0b13fd9f9:
    english: 'From the top of the page, a thread contains:'
    translation: 'Partendo dall''alto della pagina, un thread contiene:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5b47d6434aa50e94:
    english: "**Group name** - At the top left of the discussion page is the name of the group or subgroup that the discussion belongs to.  Click on this name to go back to the group page."
    translation: "**Nome del gruppo** - In alto a sinistra nella pagina della discussione trovi il nome del gruppo o sottogruppo a cui appartiene. Seleziona il nome per tornare alla pagina del gruppo."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0dab4c46c2bee003:
    english: "**Discussion access** - The access icon at the top right opens the discussion's access settings. A group discussion is available to group members and anyone specifically invited to it, subject to the group's privacy settings."
    translation: "**Accesso alla discussione** - L'icona in alto a destra apre le impostazioni di accesso alla discussione. Una discussione di gruppo è accessibile ai membri del gruppo e alle persone invitate direttamente, secondo le impostazioni di privacy del gruppo."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e20178954e6d3ce0:
    english: "**Discussion title** - The name of the discussion."
    translation: "**Titolo della discussione** - Il nome della discussione."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  47687209ed924849:
    english: "**Category tags** - The discussion may have one or more category tags. Using simple tags helps people more easily find discussions of a similar type."
    translation: "**Etichette di categorizzazione** - La discussione può avere una o più etichette di categorizzazione. Etichette semplici aiutano le persone a trovare discussioni simili."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b817649f985f51de:
    english: "**Discussion author** - The name and avatar of the person who started the discussion, shown beneath the title."
    translation: "**Autore della discussione** - Il nome e l'avatar della persona che ha avviato la discussione, mostrati sotto il titolo."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c44d5a833b4ec9ff:
    english: "**Date** - Hover over the date to see the full date and time of discussion start."
    translation: "**Data** - Passa il puntatore sulla data per vedere la data e l'ora complete di avvio della discussione."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b8062113f1078acb:
    english: "**Seen by** - In the right sidebar, shows who has read the discussion and when."
    translation: "**Visto da** - Nella barra laterale destra, mostra chi ha letto la discussione e quando."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  133d0c2e469e9683:
    english: "**Notified** - In the right sidebar, shows who has been notified about the discussion and whether each notification has been read or its email opened."
    translation: "**Notificato** - Nella barra laterale destra, mostra chi ha ricevuto una notifica sulla discussione e se ha letto la notifica o aperto la relativa email."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9f788adb4eab80cc:
    english: "**Discussion context** - Content to frame the discussion."
    translation: "**Contesto della discussione** - Il contenuto che introduce la discussione."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e8c5ae76dfb5b89b:
    english: "**Discussion interaction and administration tools** - The discussion context has controls to react to and edit it. The right sidebar contains notification, membership and administration actions."
    translation: "**Strumenti di interazione e gestione della discussione** - Il contesto della discussione include comandi per reagire e modificarlo. La barra laterale destra contiene azioni per le notifiche, i partecipanti e la gestione."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8f6eac4359c2b9f6:
    english: "**Comments** - Comments are displayed under the discussion context. The author's name, avatar and posting time show who wrote each comment and when. Interaction and administration tools are available on each comment."
    translation: "**Commenti** - I commenti compaiono sotto il contesto della discussione. Il nome, l'avatar e l'ora di pubblicazione indicano chi ha scritto ogni commento e quando. Ogni commento dispone di strumenti di interazione e gestione."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f978af6c9af4afe5:
    english: |-
      **Navigation, notifications and actions** - The right sidebar contains
      shortcuts to activity and milestones, notification and membership information,
      and the thread actions available to you.
    translation: |-
      **Navigazione, notifiche e azioni** - La barra laterale destra contiene
      collegamenti rapidi alle attività e alle tappe importanti, informazioni su notifiche e partecipanti,
      e le azioni del thread a tua disposizione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f8c4084e9e8a2b27:
    english: "## Discussion context"
    translation: "## Contesto della discussione"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5940bad6cb1cb49f:
    english: The discussion **context** is always found at the top of the discussion. Use the context to frame the discussion or decision.
    translation: Il **contesto** si trova sempre all'inizio della discussione. Usalo per introdurre la discussione o la decisione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  415dd2d0f1eacc9f:
    english: Think of your group as you write content in the discussion context.  Your aim is to get a discussion going, so consider how you can motivate people to participate.  In general, keep the discussion context simple and clear.
    translation: Quando scrivi il contesto della discussione, pensa al tuo gruppo. Cerca di avviare il confronto e di incoraggiare le persone a partecipare. In generale, mantieni il contesto semplice e chiaro.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a1fcece28d8fb61d:
    english: Write the discussion context when starting or editing a discussion. **Edit** a discussion with the pencil icon.
    translation: Scrivi il contesto quando avvii o modifichi una discussione. Usa l'icona della matita per scegliere **Modifica**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2f47adddef6b31d9:
    english: As the discussion progresses, update discussion context.  Think of the context like a whiteboard in your meeting room, where you can write the agenda, the outcomes intended and how you plan to get there.
    translation: 'Aggiorna il contesto man mano che la discussione procede. Puoi usarlo come una lavagna nella sala riunioni: scrivi l''ordine del giorno, le conclusioni a cui vuoi arrivare e come pensi di procedere.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c82ec20629208982:
    english: At the bottom of the context panel is a formatting bar, where you can format text, attach files, images and embed a video.
    translation: In fondo al riquadro del contesto trovi una barra per formattare il testo, allegare file e immagini e incorporare un video.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e606d83ae0fb2178:
    english: "### Notify people about context changes"
    translation: "### Avvisa le persone delle modifiche al contesto"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d188326a58b28d96:
    english: When you edit the discussion context, use **What's changed?** to summarize the update and choose who should be notified.
    translation: Quando modifichi il contesto della discussione, usa **Che cosa ha cambiato?** per riassumere l'aggiornamento e scegliere chi avvisare.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  842091a987742d6d:
    english: "![Editing a discussion context with a change summary and notification recipients](../notifying_people/thread_editcontext.png)"
    translation: "![Modifica del contesto di una discussione con un riepilogo delle modifiche e i destinatari della notifica](../notifying_people/thread_editcontext.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b885359dd7e83428:
    english: The summary appears as an item in the thread so participants can see what changed.
    translation: Il riepilogo compare come elemento del thread, così i partecipanti possono vedere che cosa è cambiato.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c899c47e98f79a23:
    english: "![A timeline item describing a discussion context change](../notifying_people/thread_edit_comment.png)"
    translation: "![Elemento della cronologia che descrive una modifica al contesto della discussione](../notifying_people/thread_edit_comment.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  44ffd1d0a732b897:
    english: "## Navigation"
    translation: "## Navigazione"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e96aef7a28a85001:
    english: 'The **Jump to** section of the right sidebar helps you move through a thread:'
    translation: 'La sezione **Vai a** nella barra laterale destra ti aiuta a spostarti nel thread:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4790c088af5fc09f:
    english: |-
      - **Start** goes to the discussion context
      - **New to you** appears when the thread contains activity you have not read
      - **Latest** appears when newer activity is available beyond the items currently loaded
      - milestone links go directly to important comments, polls, and outcomes
      - **End** goes to the latest item in the thread
    translation: |-
      - **Inizio** porta al contesto della discussione
      - **Nuovo per te** compare quando il thread contiene attività che non hai ancora letto
      - **Più recente** compare quando sono disponibili attività più recenti degli elementi attualmente caricati
      - i collegamenti alle tappe importanti portano direttamente a commenti, sondaggi e conclusioni importanti
      - **Fine** porta all'ultimo elemento del thread
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  941ea9900465724a:
    english: Comments that include an H2 or H3 heading, polls, and proposals are automatically included as milestone links. Select any milestone to go directly to it.
    translation: I commenti che contengono un'intestazione H2 o H3, i sondaggi e le proposte vengono inclusi automaticamente tra i collegamenti alle tappe importanti. Selezionane uno per raggiungerlo direttamente.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e94ea6f4b9dae8d4:
    english: When you add a comment, poll, vote, or outcome, Loomio marks your own new item as read. It will not appear as something new for you to review.
    translation: Quando aggiungi un commento, un sondaggio, un voto o una conclusione, Loomio contrassegna il tuo nuovo elemento come letto. Non ti verrà mostrato come attività da leggere.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  34251ada1ba3e50b:
    english: "## Notifications and members"
    translation: "## Notifiche e partecipanti"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  36a20a0e10208c7c:
    english: The right sidebar controls your email notifications and shows who has been invited, who has seen the thread, and who has been notified.
    translation: La barra laterale destra ti permette di gestire le notifiche email e mostra chi è stato invitato, chi ha visto il thread e chi ha ricevuto una notifica.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f2a437ac1169c882:
    english: "### Email notifications for this thread"
    translation: "### Notifiche email per questo thread"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9bd7269489ed048e:
    english: Select the current notification setting to choose whether Loomio emails you about all activity, only activity that specifically notifies you, or no activity. Receiving email for all activity can produce many messages in an active thread.
    translation: Seleziona l'impostazione di notifica corrente per scegliere se ricevere email da Loomio per tutte le attività, solo per quelle che ti notificano direttamente o per nessuna attività. In un thread molto attivo, le email per tutte le attività possono essere numerose.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0d64de2345c8eba9:
    english: "![Email when notified selected in the discussion sidebar](../notifying_people/thread_interact.png)"
    translation: "![Opzione Email quando ricevi una notifica selezionata nella barra laterale della discussione](../notifying_people/thread_interact.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7bdbdaa98e89d1c3:
    english: "### Invite people"
    translation: "### Invitare persone"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e81f85e723885264:
    english: Select **Invite people** to add people after the thread has started.
    translation: Seleziona **Invita persone** per aggiungere partecipanti dopo l'avvio del thread.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e38a572cdffad5cb:
    english: "![Invite people in the thread sidebar](../notifying_people/thread_invite_icon.png)"
    translation: "![Invita persone nella barra laterale della discussione](../notifying_people/thread_invite_icon.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7e4e643fb327aa06:
    english: Select a group or subgroup, enter the names of individual members, or enter an email address to invite a guest.
    translation: Seleziona un gruppo o sottogruppo, inserisci i nomi dei singoli membri oppure un indirizzo email per invitare un ospite.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  03c1d74b4a8bc31d:
    english: "![Invite people window with a field for names and email addresses](../notifying_people/thread_invite.png)"
    translation: "![Finestra Invita persone con un campo per nomi e indirizzi email](../notifying_people/thread_invite.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  85fc948a4e849ba8:
    english: A guest can see and participate in this thread but cannot see other discussions in the group unless separately invited.
    translation: Un ospite può vedere questa discussione e parteciparvi, ma non può vedere le altre discussioni del gruppo a meno che non venga invitato anche a quelle.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9f1010b58cc5439f:
    english: "![Inviting a guest by email address](../notifying_people/invite_guest.png)"
    translation: "![Invito di un ospite tramite indirizzo email](../notifying_people/invite_guest.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e688189fa93b1e49:
    english: To remove someone, open the three-dot menu (**⋯**) beside their name and select **Remove from discussion**.
    translation: Per rimuovere una persona, apri il menu con i tre puntini (**⋯**) accanto al suo nome e seleziona **Rimuovi dalla discussione**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5602fbfa565eaf45:
    english: "### Seen by"
    translation: "### Visto da"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a929b22d02292573:
    english: "**Seen by** shows who has opened the thread and when. It can help you identify people who may not have seen important information yet."
    translation: "**Visto da** mostra chi ha aperto la discussione e quando. Può aiutarti a individuare le persone che potrebbero non aver ancora visto informazioni importanti."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d0335d202c5bbaa3:
    english: "![Seen by and Notified in the Thread members section](../notifying_people/thread_engagement.png)"
    translation: "![Visto da e Notificato nella sezione Membri della discussione](../notifying_people/thread_engagement.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb77150441a43f5c:
    english: "![Seen by window listing thread members](../notifying_people/thread_seenby.png)"
    translation: "![Finestra Visto da con l'elenco dei membri della discussione](../notifying_people/thread_seenby.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  185f80d66c2091d8:
    english: "### Notified"
    translation: "### Notificato"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  885a21cbc1a44f7d:
    english: "**Notified** opens the discussion notification history. It includes invitations, mentions, and replies, showing who was notified and whether each notification has been read when that information is available."
    translation: "**Notificato** apre la cronologia delle notifiche della discussione. Include inviti, menzioni e risposte e mostra chi ha ricevuto una notifica e, quando l'informazione è disponibile, se l'ha letta."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e73fae9309f626e2:
    english: "![Discussion notification history](../notifying_people/thread_notified.png)"
    translation: "![Cronologia delle notifiche della discussione](../notifying_people/thread_notified.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  347def7574cf5f1d:
    english: "## Actions"
    translation: "## Azioni"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '08ff4ccd500c2a69':
    english: The right sidebar contains actions for the whole thread. Some actions are also available from the three-dot menu (**⋯**) beside a thread on the group page.
    translation: La barra laterale destra contiene le azioni per l'intera discussione. Alcune sono disponibili anche nel menu con i tre puntini (**⋯**) accanto alla discussione nella pagina del gruppo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e73701c7d36f95ef:
    english: The actions shown depend on your permissions. Group admins can manage threads, and group settings may allow members to perform some management actions. See [Group permissions](/en/user_manual/groups/settings/permissions).
    translation: Le azioni disponibili dipendono dai tuoi permessi. Gli amministratori del gruppo possono gestire le discussioni e le impostazioni del gruppo possono consentire ai membri di eseguire alcune azioni di gestione. Vedi [Permessi del gruppo](/en/user_manual/groups/settings/permissions).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4fce317a163b0a40:
    english: "### Print"
    translation: "### Stampa"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9317d4c7c5ef4764:
    english: Select **Print** to generate a page suitable for printing. Use your browser's print dialog to save it as a PDF.
    translation: Seleziona **Stampa** per generare una pagina adatta alla stampa. Usa la finestra di stampa del browser per salvarla come PDF.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  443af0749df1db2a:
    english: "### Markdown"
    translation: "### Markdown"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eb0442148f7c042d:
    english: Select **Markdown** to save the complete thread as structured Markdown. Choose **Copy Markdown** to copy it to your clipboard, or **Download Markdown** to save it as a `.md` file. You can use it for meeting minutes, a document, an archive of decisions, an AI assistant, or another tool that supports Markdown.
    translation: Seleziona **Markdown** per salvare l'intera discussione come Markdown strutturato. Scegli **Copia Markdown** per copiarla negli appunti oppure **Scarica Markdown** per salvarla come file `.md`. Puoi usarla per un verbale, un documento, un archivio delle decisioni, un assistente AI o un altro strumento che supporta Markdown.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  80e3f57638b53cb4:
    english: The document begins with YAML front matter containing the thread key, group, creation date, last activity date, and tags. It then includes the discussion context and every comment, poll, vote, and outcome in the same order and nesting as the threaded view.
    translation: Il documento inizia con una sezione YAML che contiene la chiave della discussione, il gruppo, la data di creazione, la data dell'ultima attività e le etichette. Seguono il contesto della discussione e ogni commento, sondaggio, voto e conclusione, nello stesso ordine e con la stessa struttura della vista in thread.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f99823b7b44e2cdd:
    english: Each poll is a section. Comments, votes, and outcomes are quoted, and replies are quoted beneath the item they answer. This shows where each person's text begins and ends. Each quote starts with one line showing the person, when they posted, the item's number in the thread, and any reactions. Votes and outcomes also say what they are. The thread key and item number identify each item in Loomio.
    translation: Ogni sondaggio occupa una sezione. Commenti, voti e conclusioni sono riportati come citazioni, con le risposte sotto l'elemento a cui si riferiscono. Così puoi vedere dove inizia e finisce il testo di ogni persona. Ogni citazione inizia con una riga che indica la persona, la data e l'ora di pubblicazione, il numero dell'elemento nella discussione e le eventuali reazioni. Per voti e conclusioni viene indicato anche il tipo di elemento. La chiave della discussione e il numero dell'elemento identificano ciascun elemento in Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e5bdfbb4a0d7646f:
    english: Loomio applies the same visibility rules as the thread. Results and vote reasons you cannot see are not included, and voters are not identified in anonymous polls. If an open poll hides results until you vote, vote before exporting the thread. **Markdown** and **Print** are unavailable until you do.
    translation: Loomio applica le stesse regole di visibilità della discussione. I risultati e le motivazioni di voto che non puoi vedere non sono inclusi e nei sondaggi anonimi non viene indicata l'identità di chi vota. Se un sondaggio aperto nasconde i risultati finché non voti, vota prima di esportare la discussione. Fino ad allora, **Markdown** e **Stampa** non sono disponibili.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7989d3386a42f180:
    english: 'For example, a discussion containing a comment, reactions, a proposal, two votes, a reply, and an outcome produces this Markdown:'
    translation: 'Per esempio, una discussione con un commento, delle reazioni, una proposta, due voti, una risposta e una conclusione produce questo Markdown:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  275f4d9025c017c4:
    english: The headings and labels use your selected language. Content written by participants remains in its original language.
    translation: I titoli e le etichette sono nella lingua che hai selezionato. I contenuti scritti dai partecipanti restano nella lingua originale.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dab18fdf3c56269d:
    english: "### Thread settings and display"
    translation: "### Impostazioni e visualizzazione della discussione"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7bc55279f97c6d1b:
    english: Group admins can select **Thread settings** to change how replies are arranged and configure other discussion options.
    translation: Gli amministratori del gruppo possono selezionare **Impostazioni del thread** per cambiare la disposizione delle risposte e configurare altre opzioni della discussione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  32b2640ba23524aa:
    english: Choose **Timeline** to list items in the order they were posted, or **Threaded** to group replies beneath the item they respond to. Thread settings also control whether multiple polls may run at once and can set a maximum comment length. These settings apply to everyone in the discussion.
    translation: Scegli **Cronologia** per elencare gli elementi nell'ordine di pubblicazione oppure **In thread** per raggruppare le risposte sotto l'elemento a cui si riferiscono. Le impostazioni del thread controllano anche se possono essere attivi più sondaggi contemporaneamente e possono fissare una lunghezza massima per i commenti. Queste impostazioni si applicano a tutte le persone nella discussione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a520339278bcc2a:
    english: "### Pin or unpin a thread"
    translation: "### Fissare o rimuovere una discussione dall'alto"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0433e7a61db60003:
    english: Pinned threads appear above other threads on the group page. Welcome discussions, news items, and announcements are typical uses for pinned threads.
    translation: Le discussioni fissate in alto compaiono sopra le altre nella pagina del gruppo. Questa funzione viene spesso usata per discussioni di benvenuto, notizie e annunci.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b2712588a5e0aab3:
    english: Open the three-dot menu (**⋯**) beside the thread on the group page and select **Pin thread**. Pinned threads are ordered by the time they were pinned. To change their order, unpin and pin them again.
    translation: Apri il menu con i tre puntini (**⋯**) accanto alla discussione nella pagina del gruppo e seleziona **Fissa in alto la discussione**. Le discussioni fissate sono ordinate in base al momento in cui sono state fissate. Per cambiarne l'ordine, rimuovile dall'alto e fissale di nuovo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a0443f076d1b8ae5:
    english: Select **Unpin thread** to return a thread to the activity-based order.
    translation: Seleziona **Rimuovi la discussione dall'alto** per riportarla nell'ordine basato sull'attività.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b90a469963b02ffc:
    english: "### Move a thread"
    translation: "### Spostare una discussione"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8b2071f4625705e5:
    english: Select **Move thread** to move a thread to another group, subgroup, or to a direct thread. It will be visible to members of the destination group and anyone specifically invited to it.
    translation: Seleziona **Sposta discussione** per spostarla in un altro gruppo, in un sottogruppo o in una discussione diretta. Sarà visibile ai membri del gruppo di destinazione e a chiunque venga invitato direttamente.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f09d5f2afce03ee8:
    english: |-
      >[!Tip]
      >Start a draft as a direct discussion or in a private subgroup, then move it to the group when it is ready.
    translation: |-
      >[!Tip]
      >Inizia una bozza come discussione diretta o in un sottogruppo privato, poi spostala nel gruppo quando è pronta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c82562b641053308:
    english: To move selected activity rather than the whole thread, see [Moving items between threads](/en/user_manual/discussions/moving_items/).
    translation: Per spostare solo alcune attività anziché l'intera discussione, vedi [Spostare elementi tra discussioni](/en/user_manual/discussions/moving_items/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  be22d2980075fdaa:
    english: "### Lock or unlock a thread"
    translation: "### Bloccare o sbloccare una discussione"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e7c24a610fd2bf8b:
    english: Lock a thread to prevent comments or further changes. A thread can only be locked after its active polls have closed.
    translation: Blocca una discussione per impedire nuovi commenti o altre modifiche. Puoi bloccarla solo dopo la chiusura dei sondaggi attivi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  edb983bb6366aa6c:
    english: Select **Lock thread** under **Actions**. Locked threads are removed from the list of open discussions and marked with a **Locked** tag.
    translation: Seleziona **Blocca discussione** sotto **Azioni**. Le discussioni bloccate vengono rimosse dall'elenco delle discussioni aperte e contrassegnate con l'etichetta **Bloccate**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ba2794349524cc33:
    english: To find a locked thread, open the discussion filter on the group page and select **Locked**. Open the thread and select **Unlock thread** to allow comments and changes again.
    translation: Per trovare una discussione bloccata, apri il filtro delle discussioni nella pagina del gruppo e seleziona **Bloccate**. Apri la discussione e seleziona **Sblocca la discussione** per consentire di nuovo commenti e modifiche.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3a75fb1ad0ffab87:
    english: "### Delete a thread"
    translation: "### Cancellare una discussione"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0103a5729bd6a095:
    english: Deleting a thread removes it permanently and cannot be undone. Lock the thread instead if you may need it again.
    translation: La cancellazione di una discussione è definitiva e non può essere annullata. Se potresti averne ancora bisogno, bloccala.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  daf08ca8895b0fe2:
    english: Select **Delete thread** and confirm the deletion.
    translation: Seleziona **Cancella discussione** e conferma la cancellazione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
