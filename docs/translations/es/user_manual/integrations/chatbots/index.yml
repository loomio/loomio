  ca092d1c3fdb9f59:
    english: 'You probably don''t want to click any of the checkboxes for now. Just enter the name (such as "Discord #general") and the URL and click the save button at the bottom of the form.'
    translation: 'Por ahora, deja las casillas sin marcar. Escribe un nombre (por ejemplo, «Discord #general») y la URL. Después, haz clic en el botón para guardar al final del formulario.'
