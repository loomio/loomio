  4318dab03fe217ad:
    english: Oatmilk Cooperative is deciding whether to approve the budget for its six-week returnable bottle trial. Five people are eligible to vote.
    translation: A Cooperativa Oatmilk está decidindo se aprova o orçamento de um teste de seis semanas com garrafas retornáveis. Cinco pessoas podem votar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8f5779f2f1bb9ec3:
    english: Jamie uses the **Consent** proposal template, edits the Consent option, and enables its vote share requirement.
    translation: Jamie usa o modelo de proposta **Consentimento**, edita a opção Consentimento e ativa o requisito de percentual de votos dessa opção.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  842038ffbd273e57:
    english: The cooperative's process requires at least 75 percent of eligible voters to support the proposal. Jamie sets the requirement to **At least 75% of Eligible voters**.
    translation: O processo da cooperativa exige o apoio de pelo menos 75% dos eleitores elegíveis para aprovar a proposta. Jamie define o requisito como **Pelo menos 75% dos Eleitores elegíveis**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5b852b2e7a9b3034:
    english: "![The Consent option requiring at least 75 percent of eligible voters](./consent-vote-option.png)"
    translation: "![A opção Consentimento exige o apoio de pelo menos 75% dos eleitores elegíveis](./consent-vote-option.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8a42a135c0c11c98:
    english: Jamie also sets a 60 percent quorum. Jamie and Samira vote in agreement. All submitted votes support the proposal, but they represent only 40 percent of eligible voters, so neither requirement has been reached.
    translation: Jamie também define um quórum de 60%. Jamie e Samira votam a favor. Todos os votos enviados apoiam a proposta, mas representam apenas 40% dos eleitores elegíveis. Portanto, nenhum dos dois requisitos foi atendido.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
