    translated_on: '2026-09-29'
  603cb0b8f1627160:
    english: |-
      | Name | Description |
      | --- | --- |
      | `group_id` | Integer, required. ID of the group to list polls from |
      | `status` | String, optional, default `active`. Values: `active`, `closed`, `all` |
      | `limit` | Integer, optional, default 50. Page size |
      | `offset` | Integer, optional, default 0. Offset for pagination |
    translation: |-
      | 名前 | 説明 |
      | --- | --- |
      | `group_id` | 整数。必須。投票を一覧表示するグループの ID です |
      | `status` | 文字列。省略可能。既定値は `active`。値は `active`、`closed`、`all` です |
      | `limit` | 整数。省略可能。既定値は 50。1 ページあたりの件数です |
      | `offset` | 整数。省略可能。既定値は 0。ページ送りの開始位置です |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
