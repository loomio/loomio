    english: In the thread menu click on the 3 dots menu (⋯) and choose **Print**. Loomio will generate an HTML page that you can then print or "save to pdf" using the print tool in your browser.
    translation: В меню обсуждения нажмите на три точки (⋯) и выберите **Печать**. Loomio создаст страницу HTML. Затем вы сможете распечатать её или сохранить в PDF с помощью функции печати браузера.
    status: machine
