  eecfb12ed1d28d50:
    english: Good governance exists where an organization has systems and processes in place that are appropriate to its circumstances, and which enable the organization to pursue its purpose effectively and meet its obligations under the law.
    translation: La buona governance si basa su sistemi e processi adatti alle circostanze di un'organizzazione. Questi le permettono di perseguire efficacemente i propri scopi e adempiere ai propri obblighi di legge.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e54f67d22cf67a93:
    english: "*“It is participatory, consensus-oriented, accountable, transparent, responsive, effective and efficient, equitable and inclusive and follows the rule of law.”* [United Nations Economic and Social Commission for Asia and the Pacific](https://www.unescap.org/sites/default/d8files/knowledge-products/good-governance.pdf)."
    translation: "*«È partecipativa, orientata al consenso, responsabile, trasparente, attenta alle esigenze, efficace ed efficiente, equa e inclusiva e rispetta lo stato di diritto.»* [Commissione economica e sociale delle Nazioni Unite per l'Asia e il Pacifico](https://www.unescap.org/sites/default/d8files/knowledge-products/good-governance.pdf)."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1661a79cfda1a9df:
    english: Underpinning all of these principles is the need for good communication.
    translation: Una buona comunicazione è alla base di tutti questi principi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2819f114c9d74160:
    english: 'Here are some or the challenges directors and boards experience:'
    translation: 'Ecco alcune difficoltà che i consiglieri e i consigli devono affrontare:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ed750814c61b85fb:
    english: "* Getting directors together in person\n* Time available to consider important issues \n* Tracking communication\n* Urgency of critical issues\n* Online video meeting fatigue\n* Directors in multiple, remote locations, sometimes with poor internet connectivity\n* Mixed governance practice and experience\n* Dealing with high volumes of transactional business \n* Maintaining institutional memory"
    translation: "* Riunire i consiglieri di persona\n* Trovare il tempo per esaminare le questioni importanti \n* Tenere traccia delle comunicazioni\n* Affrontare le questioni urgenti\n* Gestire la stanchezza dovuta alle videoriunioni\n* Coinvolgere consiglieri che si trovano in luoghi diversi e lontani, talvolta con una connessione Internet scadente\n* Conciliare esperienze e pratiche di governance diverse\n* Gestire un elevato volume di attività amministrative ordinarie \n* Conservare la memoria dell'organizzazione"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b910c5253cf77950:
    english: Loomio offers an opportunity to strengthen governance, to extend collaboration beyond board meetings, to include everyone in open, honest and respectful discussion while documenting everything.
    translation: Loomio aiuta a rafforzare la governance, a collaborare anche tra una riunione del consiglio e l'altra e a coinvolgere tutte le persone in discussioni aperte, sincere e rispettose, documentando ogni passaggio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
