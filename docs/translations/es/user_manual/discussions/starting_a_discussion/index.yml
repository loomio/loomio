---
navigation_title: Iniciar una discusión
blocks:
  8fae4100a4f3548b:
    english: "# Start a discussion"
    translation: "# Iniciar una discusión"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4ba984e9573c27ff:
    english: Starting a Loomio discussion is like writing an email. The subject line of an email is like the discussion title, and the text you write in an email is like the context of a discussion.
    translation: Iniciar una discusión en Loomio es parecido a escribir un correo electrónico. El asunto del correo equivale al título de la discusión, y el texto del mensaje, al contexto de la discusión.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4f81447c072f5dfe:
    english: As you add people in the send list of your email, in Loomio you can invite people individually or as a group to the discussion - they will receive an email notification with the content of your discussion.
    translation: Al igual que añades destinatarios a un correo electrónico, en Loomio puedes invitar a personas a la discusión, individualmente o como grupo. Recibirán una notificación por correo electrónico con el contenido de la discusión.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2408b54e3b78a282:
    english: People can reply to your discussion via email and their comments will appear in the discussion.
    translation: Las personas pueden responder a la discusión por correo electrónico. Sus comentarios aparecerán en la discusión.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  24ced64c5c4cf853:
    english: As with an email, a discussion may be a simple question, or a more detailed introduction to a topic with links or files attached for background information.
    translation: Como un correo electrónico, una discusión puede contener una pregunta sencilla o una introducción más detallada a un tema, con enlaces o archivos adjuntos que aporten contexto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ec39413fa07094c8:
    english: "## New discussion"
    translation: "## Nueva discusión"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  92b37b2e208bfd57:
    english: Find the **New discussion** button on your Loomio group page to start a new discussion.
    translation: Para iniciar una discusión, busca el botón **Nueva discusión** en la página de tu grupo de Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  515ac46bdfccb401:
    english: You can start a discussion within your Loomio group or any subgroup.
    translation: Puedes iniciar una discusión en tu grupo de Loomio o en cualquiera de sus subgrupos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ef9721ba6b69b86b:
    english: "![New discussion button on the Oatmilk Cooperative page](new-discussion-button.png)"
    translation: "![Botón Nueva discusión en la página de la Cooperativa Oatmilk](new-discussion-button.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1cf9e569475cd2cc:
    english: "![New discussion form for planning the returnable bottle trial](new-discussion-example.png)"
    translation: "![Formulario Nueva discusión para planificar la prueba de botellas retornables](new-discussion-example.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f973f5b9f1c4b1dd:
    english: |-
      ### Group
      Check the name of the group or subgroup is correct for your discussion.  Anyone in this group will be able to see the discussion. You can also start the discussion in another group or as a 'direct' discussion (no group).
    translation: |-
      ### Grupo
      Comprueba que el grupo o subgrupo seleccionado sea el adecuado para tu discusión. Cualquier persona de ese grupo podrá verla. También puedes iniciar la discusión en otro grupo o como una discusión «directa» (sin grupo).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f0b0bda9877ce0ed:
    english: |-
      >[!Tip]
      >If you are not ready to make the discussion visible in your group, start the discussion as 'direct'.  You can move the discussion to your Loomio group when ready.
    translation: |-
      >[!Tip]
      >Si todavía no quieres que la discusión sea visible para tu grupo, iníciala como una discusión «directa». Cuando quieras, podrás moverla a tu grupo de Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cd1b45c3cb71503b:
    english: "### Invite and notify"
    translation: "### Invitar y notificar"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f3f388d23b06b25c:
    english: The **Invite** field controls who receives the new discussion immediately.
    translation: El campo **Invitar** determina quién recibe la nueva discusión de inmediato.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c1b5c23770d3692:
    english: Group members can see a discussion in their group even if you do not notify them. Adding a group member to **Invite** sends them an email notification and a notification in Loomio.
    translation: Los miembros de un grupo pueden ver las discusiones de ese grupo aunque no les envíes una notificación. Si añades a un miembro al campo **Invitar**, recibirá una notificación por correo electrónico y otra en Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e2e5906a39131506:
    english: Select a group to notify everyone in it, or expand the group to choose individual members. Select the × beside a name to remove that person from the notification.
    translation: Selecciona un grupo para notificar a todos sus miembros, o despliega el grupo para elegir a miembros concretos. Selecciona la × junto a un nombre para quitar a esa persona de la notificación.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  81b57efbb3c428b7:
    english: "![Invite field expanded to show individual recipients](../notifying_people/thread_notification.png)"
    translation: "![Campo Invitar desplegado para mostrar destinatarios individuales](../notifying_people/thread_notification.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5cbd2b7b0bcc486f:
    english: Start typing a member's name and select it from the list.
    translation: Empieza a escribir el nombre de un miembro y selecciónalo en la lista.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dc128abbc65cb0c8:
    english: "![Searching for Samira Patel in the Invite field](../notifying_people/thread_notify_user.png)"
    translation: "![Búsqueda de Samira Patel en el campo Invitar](../notifying_people/thread_notify_user.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3274fe93fcf29b29:
    english: Enter an email address to invite a guest. A guest can see and participate in this thread but cannot see other discussions in the group unless separately invited.
    translation: Introduce una dirección de correo electrónico para invitar a una persona como invitada. Podrá ver y participar en este hilo, pero no podrá ver otras discusiones del grupo a menos que también reciba una invitación para ellas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ab3214ccf77143e3:
    english: "![Adding a guest email address to the Invite field](../notifying_people/thread_notify_email.png)"
    translation: "![Añadir la dirección de correo electrónico de una persona invitada al campo Invitar](../notifying_people/thread_notify_email.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cba9346e727b829a:
    english: You can also start the discussion without notifying anyone. Group members can still find it in Loomio and may see it in their catch-up email, depending on their notification settings.
    translation: También puedes iniciar la discusión sin notificar a nadie. Los miembros del grupo podrán encontrarla en Loomio y quizá verla en su correo de resumen, según sus ajustes de notificaciones.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6518afe373ff1959:
    english: "### Tags"
    translation: "### Etiquetas"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ff67c09f89479873:
    english: Add tag(s) to help people find your discussion when searching by tag. Admins can create new tags.
    translation: Añade etiquetas para que otras personas puedan encontrar tu discusión al buscar por etiqueta. Los administradores pueden crear etiquetas nuevas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ba80a903c4ecc7d1:
    english: |-
      ### Title
      Give your discussion a relevant title.  A discussion title is similar to an email subject line.
    translation: |-
      ### Título
      Ponle a tu discusión un título que describa el tema. El título de una discusión cumple la misma función que el asunto de un correo electrónico.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a91cf4b0b1b2ad5e:
    english: |-
      ### Context
      Use discussion context to introduce the topic and frame the conversation or decision to make. Use the formatting tools to emphasize key points. Include background information, attach files, link to online documents and embed a video.
    translation: |-
      ### Contexto
      Usa el contexto de la discusión para presentar el tema y orientar la conversación o la decisión que se va a tomar. Usa las herramientas de formato para destacar los puntos clave. Incluye información de contexto, adjunta archivos, añade enlaces a documentos en línea e inserta un vídeo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1bf690aa841299cd:
    english: The context will always stay at the top of the discussion and you can update it at any time as the discussion progresses.  When the discussion ends, update the context with the outcome.
    translation: El contexto permanece al principio de la discusión y puedes actualizarlo en cualquier momento a medida que avance. Cuando termine la discusión, actualiza el contexto con la conclusión.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
