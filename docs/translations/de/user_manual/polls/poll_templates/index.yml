---
navigation_title: Umfragevorlagen
blocks:
  6428da81fbbe11c6:
    english: "# Poll templates"
    translation: "# Umfragevorlagen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  208bc68b458895f1:
    english: Poll templates are reusable starting points shown when someone selects **Start a vote** or **New poll**. A template combines a voting method with preset guidance, response options, and settings.
    translation: Umfragevorlagen sind wiederverwendbare Ausgangspunkte, die angezeigt werden, wenn jemand **Jetzt abstimmen** oder **Neue Umfrage** auswählt. Eine Vorlage verbindet eine Abstimmungsmethode mit vorbereiteten Hinweisen, Antwortoptionen und Einstellungen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f290b92adeb2a791:
    english: Use this page to configure which templates are available to a group or to create one for your own process. To choose a template for a particular vote, see [Proposals](../proposals/) or [Polls](../proposal_types/). To facilitate a complete decision process, see [Making decisions](/en/guides/making_decisions/).
    translation: Auf dieser Seite erfährst du, welche Vorlagen du für eine Gruppe verfügbar machen und wie du eine Vorlage für deinen eigenen Ablauf erstellen kannst. Wie du eine Vorlage für eine bestimmte Abstimmung auswählst, erfährst du unter [Vorschläge](../proposals/) und [Umfragen](../proposal_types/). Wie du einen vollständigen Entscheidungsprozess begleitest, erfährst du unter [Entscheidungen treffen](/en/guides/making_decisions/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  658d10486cbee7dc:
    english: "## Voting methods and templates"
    translation: "## Abstimmungsmethoden und Vorlagen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d903d1a58aebf643:
    english: A voting method controls how participants respond and how Loomio calculates the result. Examples include Proposal, Choose, Score, Allocate, Rank, Time poll, and STV.
    translation: Die Abstimmungsmethode bestimmt, wie Teilnehmende antworten und wie Loomio das Ergebnis berechnet. Dazu gehören Vorschlag, Wählen, Ergebnis, Zuweisen, Rang, Zeitumfrage und STV.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  21efff1a5c91ad29:
    english: A poll template uses one of those methods and adds reusable defaults. For example, Sense check, Advice, Consent, and Consensus are different templates built on the Proposal voting method. Their instructions and response options differ even though Loomio handles their ballots in the same way.
    translation: Eine Umfragevorlage verwendet eine dieser Methoden und ergänzt sie um wiederverwendbare Voreinstellungen. Zum Beispiel sind Stimmungsbild, Rat, Zustimmung und Konsens verschiedene Vorlagen auf Grundlage der Abstimmungsmethode Vorschlag. Ihre Anleitungen und Antwortoptionen unterscheiden sich, auch wenn Loomio die Stimmen auf dieselbe Weise verarbeitet.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f622951ffc7e1064:
    english: "## Use a template"
    translation: "## Eine Vorlage verwenden"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  865e825cc7d00cf2:
    english: When starting a vote, select the **Proposal** or **Poll** tab and choose one of the templates available to the group.
    translation: Wenn du eine Abstimmung startest, wähle den Reiter **Vorschlag** oder **Umfrage** und dann eine der Vorlagen, die für die Gruppe verfügbar sind.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1598f1a55a6944e6:
    english: The template supplies an introduction, example content, options, and settings. Review and edit these for the particular decision before starting the vote. Editing the new vote does not change the reusable template.
    translation: Die Vorlage enthält eine Einführung, Beispielinhalte, Optionen und Einstellungen. Prüfe und bearbeite sie für die jeweilige Entscheidung, bevor du die Abstimmung startest. Änderungen an der neuen Abstimmung ändern die wiederverwendbare Vorlage nicht.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8212a94908338b22:
    english: "## Who can manage templates"
    translation: "## Wer Vorlagen verwalten kann"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  378caa9ba83ee0dc:
    english: Group administrators can create and manage every poll template in their group. They can enable **Members can create templates** under **Group settings** → **Permissions**. When enabled, members can create templates and manage templates they authored.
    translation: Gruppenadministratoren können alle Umfragevorlagen ihrer Gruppe erstellen und verwalten. Unter **Gruppen-Einstellungen** → **Berechtigungen** können sie **Mitglieder können Vorlagen erstellen.** aktivieren. Danach können Mitglieder Vorlagen erstellen und die von ihnen erstellten Vorlagen verwalten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0fafc6275b6c9153:
    english: "## Create a poll template"
    translation: "## Eine Umfragevorlage erstellen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5fc696a1e924179c:
    english: Open the template list and select **New template**. Start with an example or a blank template, then choose the group that will use it.
    translation: Öffne die Vorlagenliste und wähle **Neue Vorlage**. Beginne mit einem Beispiel oder einer leeren Vorlage. Wähle dann die Gruppe aus, die sie verwenden soll.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  37b3658ec66eb8b7:
    english: The template form defines the guidance and defaults people receive when they start a vote.
    translation: Im Vorlagenformular legst du fest, welche Hinweise und Voreinstellungen Menschen erhalten, wenn sie eine Abstimmung starten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fa0dab51a009bf90:
    english: "### Template title, subtitle, and help"
    translation: "### Vorlagentitel, Vorlagenuntertitel und Vorlagenhilfe"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  965cde5e13952ade:
    english: |-
      - **Template title** is the short name shown in the template list.
      - **Template subtitle** explains when to use it in one sentence.
      - **Template help** appears in the information panel when someone uses the template. Explain its purpose, any rules participants should know, and links to relevant policies or guides.
    translation: |-
      - **Vorlagentitel** ist der kurze Name in der Vorlagenliste.
      - **Vorlagenuntertitel** erklärt in einem Satz, wann die Vorlage verwendet werden sollte.
      - **Vorlagenhilfe** erscheint im Informationsbereich, wenn jemand die Vorlage verwendet. Erkläre dort ihren Zweck, wichtige Regeln für Teilnehmende und verlinke relevante Richtlinien oder Anleitungen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f3e51b30163d5b85:
    english: Use plain, specific names that distinguish the template from others in the group.
    translation: Verwende klare, konkrete Namen, an denen sich die Vorlage von anderen Vorlagen der Gruppe unterscheiden lässt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e6b8a09191bb8c3f:
    english: "### Voting method"
    translation: "### Abstimmungsmethode"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ea4fef806c1cf060:
    english: Choose what participants need to express and how the result should be calculated.
    translation: Überlege, was die Teilnehmenden ausdrücken sollen und wie das Ergebnis berechnet werden soll.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f8c87a496921c710:
    english: |-
      - **Proposal**: respond to a statement using defined positions;
      - **Choose**: select one or more options;
      - **Score**: evaluate every option on a scale;
      - **Allocate**: distribute a limited budget of points;
      - **Rank**: arrange options in preference order;
      - **Time poll**: indicate availability; and
      - **STV**: rank candidates in a proportional, multi-winner election.
    translation: |-
      - **Vorschlag**: mit festgelegten Positionen auf eine Aussage antworten;
      - **Wählen**: eine oder mehrere Optionen auswählen;
      - **Ergebnis**: jede Option auf einer Skala bewerten;
      - **Zuweisen**: eine begrenzte Anzahl von Punkten verteilen;
      - **Rang**: Optionen nach Präferenz ordnen;
      - **Zeitumfrage**: Verfügbarkeit angeben; und
      - **STV**: Kandidierende bei einer Verhältniswahl mit mehreren zu vergebenden Sitzen nach Präferenz ordnen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9d589e44fa94c5e2:
    english: Changing the voting method changes the fields and result calculation available to the template.
    translation: Wenn du die Abstimmungsmethode änderst, ändern sich die verfügbaren Felder und die Berechnung des Ergebnisses.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  230689f781e4cbc7:
    english: "### Example title, details, and tags"
    translation: "### Beispieltitel, Details und Tags"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6fa4b3625c6ec7ce:
    english: Provide example content that helps an author frame the vote. These values are copied into a new proposal or poll and can be edited before it starts.
    translation: Gib Beispielinhalte an, die beim Formulieren der Abstimmung helfen. Diese Werte werden in einen neuen Vorschlag oder eine neue Umfrage übernommen und können vor dem Start bearbeitet werden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a093368b30ac3c9b:
    english: Use prompts rather than fixed content when each use needs a different title or details. Add default category tags only when they apply every time the template is used.
    translation: Verwende Leitfragen statt fester Inhalte, wenn bei jeder Verwendung ein anderer Titel oder andere Details nötig sind. Füge standardmäßige Kategorie-Tags nur hinzu, wenn sie bei jeder Verwendung der Vorlage passen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  24c3fa4b7ef676fd:
    english: "### Response options"
    translation: "### Antwortoptionen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e7421caab9c47f5b:
    english: 'Methods such as Proposal and Choose let you configure response options. Select the pencil icon beside an option to edit:'
    translation: 'Bei Methoden wie Vorschlag und Wählen kannst du Antwortoptionen konfigurieren. Wähle das Stiftsymbol neben einer Option, um Folgendes zu bearbeiten:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  73a065ad5b861579:
    english: |-
      - **Option name**: the short response label;
      - **Icon**: its visual marker;
      - **Meaning**: what selecting the option communicates; and
      - **Reason prompt**: the question shown when someone explains their response.
    translation: |-
      - **Optionsname**: die kurze Bezeichnung der Antwort;
      - **Symbol**: die grafische Kennzeichnung;
      - **Bedeutung**: was die Auswahl der Option ausdrückt; und
      - **Grundaufforderung**: die Frage, die angezeigt wird, wenn jemand seine Antwort begründet.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  38bc8cfc36aaea2e:
    english: Define options so participants can tell the difference between them without guessing. The meanings should match the decision rules your group actually uses.
    translation: Definiere die Optionen so, dass Teilnehmende den Unterschied zwischen ihnen erkennen können. Ihre Bedeutungen sollten zu den Entscheidungsregeln passen, die deine Gruppe tatsächlich verwendet.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cc4adba73670a75b:
    english: "### Duration and settings"
    translation: "### Dauer und Einstellungen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6c63a57ab4cec442:
    english: Set a default duration that is suitable for most uses of the template. The author can change the closing time for an individual vote.
    translation: Lege eine Standarddauer fest, die für die meisten Anwendungen der Vorlage passt. Wer eine Abstimmung erstellt, kann ihre Schlusszeit ändern.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  df14be8dbf80fa3c:
    english: Other defaults can control result visibility, anonymous voting, vote-reason requirements, reminders, quorum, and method-specific behaviour. See [Proposal and poll settings](../settings/) for their effects.
    translation: Weitere Voreinstellungen regeln, wer Ergebnisse sehen kann, anonymes Abstimmen, die Pflicht zur Begründung einer Stimme, Erinnerungen, das Quorum und methodenspezifisches Verhalten. Die Auswirkungen werden unter [Einstellungen für Vorschläge und Umfragen](../settings/) erklärt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  774ed7b91d33ab10:
    english: "### Save and test the template"
    translation: "### Vorlage speichern und testen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1b26a723ab8a9811:
    english: After saving, start a draft vote from the template. Check that its introduction, prompts, options, and defaults make sense to someone who did not create it. Starting a draft is also a useful way to confirm that the chosen voting method produces the result the group expects.
    translation: Starte nach dem Speichern einen Abstimmungsentwurf mit der Vorlage. Prüfe, ob die Einführung, Leitfragen, Optionen und Voreinstellungen auch für jemanden verständlich sind, der die Vorlage nicht erstellt hat. Mit einem Entwurf kannst du außerdem prüfen, ob die gewählte Abstimmungsmethode das von der Gruppe erwartete Ergebnis liefert.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1f0dab3f50320e75:
    english: "## Manage the template list"
    translation: "## Vorlagenliste verwalten"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e9748843a900273f:
    english: 'Use the action menu beside a template to:'
    translation: 'Im Aktionsmenü neben einer Vorlage kannst du:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  646235094d051c83:
    english: |-
      - **Edit** its reusable content and defaults;
      - **Move** it to a different position in the list;
      - **Hide** it from people starting votes; or
      - **Delete** a custom template that is no longer needed.
    translation: |-
      - **Bearbeiten** wählen, um ihre wiederverwendbaren Inhalte und Voreinstellungen zu ändern;
      - **Verschieben** wählen, um ihre Position in der Liste zu ändern;
      - **Verstecken** wählen, damit sie beim Starten einer Abstimmung nicht angezeigt wird; oder
      - **Löschen** wählen, um eine nicht mehr benötigte eigene Vorlage zu entfernen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3f6dc06b1fd2bce8:
    english: Select **Show hidden templates** to review or restore hidden templates. Default templates can be hidden or adapted for the group, but cannot be deleted.
    translation: Wähle **Ausgeblendete Vorlagen anzeigen**, um ausgeblendete Vorlagen zu prüfen oder wiederherzustellen. Standardvorlagen können für die Gruppe ausgeblendet oder angepasst, aber nicht gelöscht werden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  be3ee2d2721d3e2a:
    english: Changing a template does not alter proposals or polls that have already been started from it.
    translation: Änderungen an einer Vorlage wirken sich nicht auf Vorschläge oder Umfragen aus, die bereits damit gestartet wurden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
