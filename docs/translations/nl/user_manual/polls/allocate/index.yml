navigation_title: Toewijzen
blocks:
  343675f0497d460a:
    english: "# Allocate"
    translation: "# Toewijzen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  46dd27ee2e2fb992:
    english: Allocate, sometimes known as a dot vote, reveals priorities when there are trade-offs. Each participant receives a fixed budget of points and distributes it across the options. Giving more to one option leaves fewer points for the others.
    translation: Met Toewijzen, ook wel een puntenstemming genoemd, maak je prioriteiten zichtbaar wanneer je keuzes moet afwegen. Elke deelnemer krijgt een vast aantal punten en verdeelt die over de opties. Meer punten voor één optie betekent minder punten voor de andere opties.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c6d05c5ec2a695d2:
    english: "## When to use Allocate"
    translation: "## Wanneer gebruik je Toewijzen?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f5b2c4377aea5079:
    english: 'Use Allocate when time, money, attention, or another resource is limited. It works well for:'
    translation: 'Gebruik Toewijzen als tijd, geld, aandacht of een andere hulpbron beperkt is. Het werkt goed om:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8e6525da99616946:
    english: |-
      - prioritizing work for the next planning period;
      - dividing a participatory budget between projects;
      - choosing how much agenda time to give several topics;
      - distributing a fixed number of volunteer hours; or
      - identifying which improvements matter most to members.
    translation: |-
      - werk voor de volgende planningsperiode te prioriteren;
      - een participatief budget over projecten te verdelen;
      - te bepalen hoeveel agendatijd verschillende onderwerpen krijgen;
      - een vast aantal vrijwilligersuren te verdelen; of
      - te bepalen welke verbeteringen leden het belangrijkst vinden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  66b0f13c4811ef63:
    english: The points express relative priority, not an amount that Loomio will automatically assign. Use [Score](/en/user_manual/polls/score/) when every option can receive a high rating without reducing support for another.
    translation: De punten geven relatieve prioriteit aan. Loomio wijst de hulpbron niet automatisch toe. Gebruik [Score](/en/user_manual/polls/score/) als elke optie een hoge waardering kan krijgen zonder dat dit ten koste gaat van een andere optie.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '0409e08bd5e80f61':
    english: "## Example: set priorities for an annual strategy review"
    translation: "## Voorbeeld: prioriteiten bepalen voor een jaarlijkse strategieevaluatie"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e274f6e40509e611:
    english: Oatmilk Cooperative is planning its annual strategy review. It asks members which areas should receive the most time and attention during the review. Each member receives ten points to allocate across five areas. This shows the group's relative priorities while requiring participants to make trade-offs.
    translation: De Havermelkcoöperatie bereidt haar jaarlijkse strategieevaluatie voor. Ze vraagt leden welke gebieden tijdens de evaluatie de meeste tijd en aandacht moeten krijgen. Elk lid krijgt tien punten om over vijf gebieden te verdelen. Zo worden de relatieve prioriteiten van de groep zichtbaar en moeten deelnemers keuzes afwegen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c74ebb16f872b3c6:
    english: "## Set up the poll"
    translation: "## De peiling instellen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  906790609aa7eb30:
    english: Describe the decision and what the points represent. Add options at a similar level of scope, then set **Points per person**. In this example, each voter receives ten points to indicate how much review time each strategic area should receive.
    translation: Beschrijf de beslissing en wat de punten betekenen. Voeg opties toe die ongeveer even breed zijn en stel daarna **Punten per persoon** in. In dit voorbeeld krijgt elke stemmer tien punten om aan te geven hoeveel tijd elk strategisch gebied tijdens de evaluatie moet krijgen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  67ae025b83fb4781:
    english: A very large budget can create false precision. A useful budget is usually large enough to show differences but small enough to require choices. Make clear whether concentrating all points on one option is acceptable.
    translation: Een erg groot aantal punten kan een schijn van precisie wekken. Kies genoeg punten om verschillen zichtbaar te maken, maar weinig genoeg om keuzes nodig te maken. Maak duidelijk of deelnemers al hun punten aan één optie mogen geven.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Stemmen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d9a73b9d4e2f8927:
    english: Participants move the sliders to distribute their budget. Loomio shows how many points remain and prevents submission until the allocation is valid.
    translation: Deelnemers verdelen hun punten met de schuifregelaars. Loomio laat zien hoeveel punten er over zijn en staat indienen pas toe als de verdeling geldig is.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7b3d616673a01fbb:
    english: In this example, the voter assigns three points each to **Member participation** and **Financial sustainability**, two each to **Environmental impact** and **Staff development**, and none to **Products and services**. A zero does not necessarily mean an area has no value; it means the voter used their limited points elsewhere.
    translation: In dit voorbeeld geeft de stemmer drie punten aan zowel **Ledenparticipatie** als **Financiële duurzaamheid**, twee punten aan zowel **Milieu-impact** als **Personeelsontwikkeling**, en geen punten aan **Producten en diensten**. Nul punten betekent niet noodzakelijk dat een gebied geen waarde heeft. De stemmer heeft de beperkte punten ergens anders ingezet.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## De resultaten bekijken"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  97147f83eaf22313:
    english: 'The results order options by the total points received. They also show:'
    translation: 'De resultaten rangschikken de opties op basis van het totale aantal ontvangen punten. Ze tonen ook:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1d224c0c34145a7f:
    english: |-
      - **% of points**: the option's share of all allocated points;
      - **Points**: the total points allocated;
      - **Mean**: the average among voters who gave the option points; and
      - **Voters**: how many people gave the option at least one point.
    translation: |-
      - **% van de punten**: het aandeel van de optie in alle toegekende punten;
      - **Punten**: het totale aantal toegekende punten;
      - **Gemeen**: het gemiddelde van de stemmers die de optie punten gaven; en
      - **Stemmers**: het aantal mensen dat de optie minstens één punt gaf.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2901008fa326e4f5:
    english: In this example, **Financial sustainability** receives the most points, followed by **Staff development**. Financial sustainability receives points from every voter, suggesting broad agreement that it needs substantial review time. Read the totals alongside the number of voters to distinguish broad priorities from areas strongly supported by fewer people.
    translation: In dit voorbeeld krijgt **Financiële duurzaamheid** de meeste punten, gevolgd door **Personeelsontwikkeling**. Financiële duurzaamheid krijgt van elke stemmer punten. Dat wijst op brede overeenstemming dat dit gebied veel tijd nodig heeft tijdens de evaluatie. Bekijk de totalen samen met het aantal stemmers om brede prioriteiten te onderscheiden van gebieden die sterk worden gesteund door minder mensen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f2c04fbdc54d23e8:
    english: Read the totals together with the number of voters and their reasons. Publish an outcome explaining how the strategy review will be structured; the poll does not assign time automatically.
    translation: Bekijk de totalen samen met het aantal stemmers en hun redenen. Publiceer een conclusie waarin je uitlegt hoe de strategieevaluatie wordt ingericht. De peiling wijst geen tijd automatisch toe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
