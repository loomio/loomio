navigation_title: E-mail-cím
blocks:
  14280ff177b248ab:
    english: "# Send an email to start a thread in your group"
    translation: "# Indíts témát e-mailben a csoportodban"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e3de5524e10b9928:
    english: Your Loomio group has an email address! You can send or forward email to this address to start a thread in the group.
    translation: A Loomio-csoportodnak van e-mail-címe. Küldhetsz vagy továbbíthatsz e-mailt erre a címre, hogy témát indíts a csoportban.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  85a7436d4a1b4396:
    english: |-
      You can see your group's email address on the group page:
      ![location of the email address on the group page](email_email_button.png)
    translation: |-
      A csoportod e-mail-címét a csoport oldalán találod:
      ![A csoport e-mail-címének helye a csoport oldalán](email_email_button.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e34019bbcf3b319f:
    english: When you send an email to this address, a new thread will be started. The email subject becomes the thread title, the body of the email becomes the description, and any attached files will be attached to the thread.
    translation: Ha e-mailt küldesz erre a címre, új téma indul. Az e-mail tárgya lesz a téma címe, az üzenet szövege pedig a leírása. A csatolt fájlok a témához kerülnek.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  46a53b8267a61c2f:
    english: The email "From" address is used to find the group member who will be the author of the thread.
    translation: Az e-mail „Feladó” címéből állapítja meg a Loomio, hogy a csoport melyik tagja legyen a téma szerzője.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bd7df6f632af8db1:
    english: "## Preventing unauthorized emails"
    translation: "## Illetéktelen e-mailek megakadályozása"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a5118468df167ba0:
    english: To ensure that this feature cannot be used by people who are not members of your group, Loomio will require that the "From" address of an incoming email matches the address of someone in the group.
    translation: Hogy csak a csoportod tagjai használhassák ezt a funkciót, a beérkező e-mail „Feladó” címének egyeznie kell egy csoporttag e-mail-címével.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f11910ae643c5b47:
    english: If you use multiple email addresses, you can add an alias so Loomio knows about your other email addresses.
    translation: Ha több e-mail-címet használsz, adj hozzá egy másodlagos címet, hogy a Loomio felismerje a többi címedet is.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e3d88a25128322b5:
    english: When the "from" address does not match a member of the group, you will receive a notification asking you to add an alias or reject all further emails from that address.
    translation: Ha a feladó címe nem egyezik egy csoporttag címével, értesítést kapsz. Ebben hozzáadhatod a címet másodlagos címként, vagy elutasíthatod az erről a címről érkező további e-maileket.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  890546269cfa56b6:
    english: This means that the first time you send email from an unrecognised address, you will need to add an alias. After that, emails will be accepted immediately.
    translation: Amikor először küldesz e-mailt egy ismeretlen címről, hozzá kell adnod azt másodlagos címként. Ezután az erről a címről küldött e-maileket a Loomio azonnal elfogadja.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e778a27d6b286135:
    english: "![Location of the approve and reject buttons for an unrecognised email](email_unreleased_emails.png)"
    translation: "![Az ismeretlen címről érkezett e-mail jóváhagyási és elutasítási gombjainak helye](email_unreleased_emails.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
