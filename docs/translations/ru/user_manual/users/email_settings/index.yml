---
navigation_title: Уведомления
blocks:
  3a65b66c581936a1:
    english: "# Notifications"
    translation: "# Уведомления"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c343eb5a1db968d8:
    english: Notifications help groups maintain momentum by drawing your attention to discussions and decisions that need a response.
    translation: 'Уведомления помогают группе продолжать работу: они обращают ваше внимание на обсуждения и решения, которые требуют ответа.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3d7b27f3b9880973:
    english: 'Notifications are often the starting point when you return to Loomio. They let you know when:'
    translation: 'Когда вы возвращаетесь в Loomio, часто сначала просматриваете уведомления. Они сообщают, когда:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c4aec8fcb9fbc0de:
    english: |-
      - someone mentions you or replies to something you wrote
      - a new discussion is shared with you
      - you are invited or reminded to vote
      - a poll is closing soon
      - an outcome is announced
    translation: |-
      - кто-то упомянул вас или ответил на ваше сообщение
      - с вами поделились новым обсуждением
      - вас пригласили проголосовать или напомнили о голосовании
      - голосование скоро закроется
      - опубликовано заключение по голосованию
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  792dcad0f81e8cc5:
    english: Loomio's notification settings let you choose how closely you want to follow each group or thread. Notifications remain available in Loomio, so you can review what needs your attention when you are ready.
    translation: В настройках уведомлений Loomio вы можете выбрать, насколько внимательно следить за каждой группой или темой. Уведомления остаются в Loomio, поэтому вы можете просмотреть их, когда будете готовы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '082fae961275aaaf':
    english: "## Two ways to begin"
    translation: "## С чего начать"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cbea008bb7c0ee02:
    english: 'Most people can start with one of two approaches:'
    translation: 'Обычно удобно начать с одного из двух вариантов:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3349bdb53fc33195:
    english: |-
      - **When notified** — receive an email when someone asks for your attention, and include everything else in your daily catch-up. Start here if you are still learning how your group uses Loomio.
      - **Once per day** — set Email to **Catch-up only** and keep your catch-up set to **Every day**. Your notifications and other unread activity will be delivered together in one email.
    translation: |-
      - **При получении уведомления** — получайте письмо, когда ваше внимание необходимо, а остальные события просматривайте в ежедневной сводке. Этот вариант подходит, если вы ещё знакомитесь с тем, как ваша группа использует Loomio.
      - **Один раз в день** — выберите для электронной почты **Только для просмотра пропущенных материалов.** и оставьте расписание сводки **Каждый день**. Уведомления и другие непрочитанные события придут в одном письме.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  74e84c4946aa3713:
    english: New accounts start with **When notified** and a daily catch-up. This brings mentions, replies, discussions shared with you, invitations and reminders to vote, polls closing soon, and outcomes to your attention as they happen without sending an immediate update about every comment or vote.
    translation: Для новых учётных записей установлен режим **При получении уведомления** и ежедневная сводка. Вы узнаёте об упоминаниях, ответах, обсуждениях, которыми с вами поделились, приглашениях и напоминаниях проголосовать, скором закрытии голосований и опубликованных заключениях по мере их появления. При этом отдельное письмо о каждом комментарии или голосе не приходит.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  896722cbb87e98be:
    english: If you would rather receive your Loomio notifications all at once, move to the once-per-day approach. You can change this later as your pattern of work changes.
    translation: Если вам удобнее получать все уведомления Loomio вместе, выберите вариант с одним письмом в день. Позже вы сможете изменить его.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e2c60724226ad68a:
    english: For a group or thread that you want to follow more closely, choose **All activity** to receive every update as it happens.
    translation: Для группы или темы, за которой вы хотите следить внимательнее, выберите **Вся активность**, чтобы получать каждое обновление сразу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  91fd24c60a6a84ee:
    english: These defaults apply when you join a group. Threads initially inherit the settings of their group, but you can follow an important thread more closely or reduce its notifications without changing the rest of the group.
    translation: Эти настройки по умолчанию применяются, когда вы вступаете в группу. Темы сначала наследуют настройки группы, но для отдельной важной темы вы можете включить больше уведомлений или сократить их число, не меняя настройки остальных тем группы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a75df26cfc4e6614:
    english: "## Notifications in Loomio"
    translation: "## Уведомления в Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9286edc0ac459625:
    english: The bell icon in the top-right is where notifications are accessed within the app; a number shows how many notifications you have yet to read.
    translation: Уведомления в приложении открываются через значок колокольчика в правом верхнем углу. Число рядом с ним показывает количество непрочитанных уведомлений.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bfacf52b815e1252:
    english: Select a notification to open the related discussion or poll.
    translation: Выберите уведомление, чтобы открыть связанное с ним обсуждение или голосование.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b7ed6a5c5c661d60:
    english: "## Catch-up"
    translation: "## Сводка"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fc61461d684c5b47:
    english: The catch-up provides a regular overview of activity without requiring you to follow each group throughout the day.
    translation: Сводка регулярно знакомит вас с событиями без необходимости следить за каждой группой в течение дня.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9e519b17a3847cee:
    english: It shows your unseen notifications first, followed by unread discussions and standalone polls grouped by group. Notifications provide linked summaries of activity that needs your attention, while the unread section includes the discussion, poll, comment, vote, and edit details. Direct discussions and threads you have joined as a guest are included when they contain unread activity.
    translation: Сначала в ней показаны непросмотренные уведомления, затем — непрочитанные обсуждения и отдельные голосования, сгруппированные по группам. Уведомления содержат ссылки и краткие сведения о событиях, требующих вашего внимания. В разделе непрочитанного доступны сведения об обсуждениях, голосованиях, комментариях, голосах и правках. Прямые обсуждения и темы, к которым вы присоединились как гость, также включаются, если в них есть непрочитанные события.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  00703333f277e3c0:
    english: You can turn on **Follow updates** on an open Group that you have not joined. Unread discussions and polls from that Group are then included in your catch-up at your existing schedule. Reading the threads or marking the catch-up as read updates their read status in the same way as threads from Groups you belong to. Turn off **Follow updates** on the Group page to stop including them.
    translation: В открытой группе, в которую вы не вступили, можно включить **Следите за обновлениями**. Тогда непрочитанные обсуждения и голосования этой группы будут попадать в вашу сводку по действующему расписанию. Если вы прочитаете темы или отметите сводку как прочитанную, их статус обновится так же, как у тем групп, в которых вы состоите. Чтобы исключить их из сводки, отключите **Следите за обновлениями** на странице группы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fcac102a70f7ee7f:
    english: Loomio does not send a catch-up when there are no unseen notifications or unread threads from the relevant period.
    translation: Loomio не отправляет сводку, если за соответствующий период нет непросмотренных уведомлений или непрочитанных тем.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  888011209ac583be:
    english: "![A catch-up with unseen notifications and unread thread activity from one group](digest_email_example.png)"
    translation: "![Сводка с непросмотренными уведомлениями и непрочитанными событиями в теме одной группы](digest_email_example.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7d80cf08a383f6bd:
    english: "### Choose your catch-up schedule"
    translation: "### Выберите расписание сводки"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  677863d68136156b:
    english: Open **Notification settings** from your user menu to choose how often you receive a catch-up.
    translation: Откройте **Настройки уведомлений** в меню пользователя, чтобы выбрать частоту получения сводки.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7c0dece94210f807:
    english: The **Unsubscribe** link in a catch-up email opens a catch-up schedule form. The email link authorizes that form, so you can change or stop catch-up emails without signing in. The full **Notification settings** page in Loomio remains available when you sign in.
    translation: Ссылка **Отписаться** в письме со сводкой открывает форму настройки её расписания. Ссылка из письма даёт доступ к этой форме, поэтому вы можете изменить расписание или отключить письма со сводкой без входа в аккаунт. Полная страница **Настройки уведомлений** в Loomio доступна после входа.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  da5740fd6dbd5737:
    english: "![Notification settings in the user menu](sidebar_notification_settings.png)"
    translation: "![Настройки уведомлений в меню пользователя](sidebar_notification_settings.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  58af77d870a877e2:
    english: 'New accounts start with a daily catch-up. The available schedules are:'
    translation: 'Для новых учётных записей установлена ежедневная сводка. Доступные варианты расписания:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b0fe04b2b5284253:
    english: |-
      - **Never** to turn off the catch-up
      - **Every day** for activity from approximately the previous 24 hours
      - **Every second day** for activity from approximately the previous two days
      - a weekday to receive a weekly catch-up on that day
    translation: |-
      - **Никогда** — отключить сводку
      - **Каждый день** — получать сведения о событиях примерно за предыдущие 24 часа
      - **Через день** — получать сведения о событиях примерно за предыдущие два дня
      - день недели — получать еженедельную сводку в этот день
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a23935f518dd15cb:
    english: The catch-up is sent in the morning according to the time zone in your Loomio profile.
    translation: Сводка отправляется утром по часовому поясу, указанному в вашем профиле Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b214c0634763fb51:
    english: "![Catch-up schedule setting](digest_email_setting.png)"
    translation: "![Настройка расписания сводки](digest_email_setting.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  efbcecfe827438a5:
    english: "### Mark a catch-up as read"
    translation: "### Отметьте сводку как прочитанную"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2b764b73f48d3185:
    english: Select **Mark catch-up as read** to mark its notifications and topic activity as read in Loomio. Opening or previewing the catch-up does not mark anything as read.
    translation: Выберите **Отметьте прочитанное как наверставшее упущенное.**, чтобы отметить уведомления и события в темах из сводки как прочитанные в Loomio. Открытие или предварительный просмотр сводки не меняет их статус.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  81ffa4a869f82451:
    english: A catch-up is not specific to one discussion, so do not reply to it. Open a discussion or poll from the catch-up before commenting or replying.
    translation: Сводка не относится к одному обсуждению, поэтому не отвечайте на письмо с ней. Прежде чем оставить комментарий или ответить, откройте обсуждение или голосование из сводки.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f7dfee93901e5eea:
    english: "## Group and thread notification settings"
    translation: "## Настройки уведомлений для групп и тем"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  31be594005b6bcfc:
    english: You can choose how closely to follow each group and thread. These settings belong to you; group administrators cannot change them.
    translation: Вы можете выбрать, насколько внимательно следить за каждой группой и темой. Эти настройки принадлежат вам; администраторы группы не могут их изменить.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6c9a762b18c9f92d:
    english: Change your defaults for groups you join from **Notification settings** in your user menu. You can then override the default for a particular group or thread. A thread override changes only that thread and does not affect the rest of its group.
    translation: Измените настройки по умолчанию для групп, в которые вы вступаете, через **Настройки уведомлений** в меню пользователя. Затем вы можете задать отдельные настройки для конкретной группы или темы. Настройка отдельной темы не влияет на остальные темы группы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f4b6aa6eab1beb2b:
    english: "### Group notification settings"
    translation: "### Настройки уведомлений для группы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  977289761daba9db:
    english: 'To change the notification setting for a group:'
    translation: 'Чтобы изменить настройки уведомлений для группы:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d78d13409c481c71:
    english: |-
      1. Open the group page.
      2. Open the notification settings for the group.
    translation: |-
      1. Откройте страницу группы.
      2. Откройте настройки уведомлений для группы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  02116f695da0a946:
    english: "![Notification settings on a group page](group_notifications.png)"
    translation: "![Настройки уведомлений на странице группы](group_notifications.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8ce50d3418e2d9fa:
    english: The form asks **How do you want to stay updated?** Choose **Catch-up only**, **When notified**, or **All activity**. If your catch-up is set to **Never**, **Catch-up only** is replaced by **No email updates** or **No push updates**.
    translation: В форме появится вопрос **Как вы предпочитаете оставаться в курсе событий?** Выберите **Только для просмотра пропущенных материалов.**, **При получении уведомления** или **Вся активность**. Если для сводки выбрано **Никогда**, вместо **Только для просмотра пропущенных материалов.** будет доступно **Нет обновлений по электронной почте.** или **Нет push-уведомлений об обновлениях**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  24db74c2c82737eb:
    english: Select **Apply to all groups** to use the same setting for all of your groups.
    translation: Выберите **Применить ко всем группам**, чтобы использовать одинаковые настройки для всех ваших групп.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  54cd6a8eac96e073:
    english: "![Group notification settings](group_notification_settings.png)"
    translation: "![Настройки уведомлений группы](group_notification_settings.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d0ab43e865282241:
    english: "### Thread notification settings"
    translation: "### Настройки уведомлений в ветке обсуждения"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f61284373b7afc42:
    english: To change notification settings for an individual thread, open the notification control in the thread sidebar.
    translation: Чтобы изменить настройки уведомлений для отдельной ветки обсуждения, откройте управление уведомлениями на боковой панели ветки.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b329b8421ab5d4f8:
    english: "![The notification control in a thread](thread_subscribe.png)"
    translation: "![Управление уведомлениями в ветке обсуждения](thread_subscribe.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  226c5e321d735005:
    english: "![Thread notification settings](thread_notifications.png)"
    translation: "![Настройки уведомлений в ветке обсуждения](thread_notifications.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3178b3b456acd783:
    english: Thread notification settings use the same **Catch-up only**, **When notified**, and **All activity** choices. A thread setting overrides the group setting for that thread.
    translation: 'Для ветки обсуждения доступны те же варианты: **Только для просмотра пропущенных материалов.**, **При получении уведомления** и **Вся деятельность**. Настройка ветки заменяет для неё настройку группы.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f53fa37c98c9b747:
    english: |-
      >[!Note]
      >The changes in **Thread notification settings** apply only to the thread you have open. Select **Change notifications for group** to change the setting inherited by the group's other threads.
    translation: |-
      >[!Note]
      >Изменения в **Настройки уведомлений в ветке обсуждения** относятся только к открытой ветке обсуждения. Выберите **Изменение уведомлений для группы**, чтобы изменить настройку, которую наследуют остальные ветки обсуждения этой группы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  99a0923cdcdc1cdf:
    english: "## Email delivery"
    translation: "## Доставка по электронной почте"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6cf70b2dc7cdbf83:
    english: By default, Loomio sends an email when you are notified. Depending on your group and thread notification settings, this can include mentions, replies, discussions shared with you, invitations and reminders to vote, outcomes, and polls closing soon. Choose **All activity** to also receive emails about every new comment, vote, thread, poll, and outcome.
    translation: По умолчанию Loomio отправляет вам письмо, когда вы получаете уведомление. В зависимости от настроек группы и ветки обсуждения письма могут приходить при упоминаниях, ответах, публикации обсуждений для вас, приглашениях и напоминаниях о голосовании, объявлении итогов и скором закрытии голосований. Выберите **Вся деятельность**, чтобы также получать письма о каждом новом комментарии, голосе, обсуждении, голосовании и итоге.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ce2919b895be45b3:
    english: The **Unsubscribe** link in a notification email opens settings for that thread or group, including emails sent because someone mentioned you or replied to you. That form shows your current catch-up schedule for all groups and links to the catch-up email settings. These email links authorize only their own settings forms; they do not sign you in to Loomio.
    translation: Ссылка **Отписаться** в письме с уведомлением открывает настройки соответствующей ветки обсуждения или группы. Это относится и к письмам об упоминаниях и ответах на ваши сообщения. В форме показано текущее расписание писем со сводкой для всех групп и есть ссылка на настройки этих писем. Ссылки из писем дают доступ только к соответствующим формам настроек и не выполняют вход в Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d615e84f882a2728:
    english: When a discussion email says that replies are accepted, you can reply directly from your email and your message will be posted into the Loomio discussion.
    translation: Если в письме об обсуждении указано, что на него можно ответить, отправьте ответ прямо из почты. Ваше сообщение появится в обсуждении Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5b4ce168b24bc44a:
    english: Poll invitation emails show the poll and its response options, but selecting an option opens Loomio in your browser to complete the vote. You may need to sign in or confirm your account. The catch-up cannot accept replies; open the linked discussion or poll first.
    translation: 'В письмах с приглашением к голосованию показаны само голосование и варианты ответа. При выборе варианта Loomio откроется в браузере, где вы сможете завершить голосование. Возможно, потребуется войти или подтвердить свою учётную запись. На письмо со сводкой ответить нельзя: сначала откройте обсуждение или голосование по ссылке.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0c2b2867a1ace598:
    english: "![A proposal invitation email with response options and the related thread](proposal_invitation_email.png)"
    translation: "![Письмо с приглашением проголосовать за предложение, вариантами ответа и связанной веткой обсуждения](proposal_invitation_email.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a73508aa897d96cf:
    english: "## Enable mobile notifications with web push"
    translation: "## Включение мобильных уведомлений через web push"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f4b14a4ba068b670:
    english: Web push is how Loomio delivers mobile notifications today. It can notify you about Loomio activity on your phone when Loomio is not open.
    translation: Сейчас Loomio доставляет мобильные уведомления через web push. Вы можете получать уведомления о событиях в Loomio на телефоне, даже когда приложение закрыто.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  811ee794dea12cd3:
    english: On Android, open **Notification settings** in a supported browser and enable push. On an iPhone or iPad, first open Loomio in Safari, use **Share** then **Add to Home Screen**, open Loomio from the new Home Screen icon, and enable push from there. Select **Test connection** to verify delivery to every browser listed under **Enabled browsers**.
    translation: На Android откройте **Настройки уведомлений** в поддерживаемом браузере и включите push-уведомления. На iPhone или iPad сначала откройте Loomio в Safari, выберите **Поделиться**, затем **Добавить на экран «Домой»**. Откройте Loomio с нового значка на главном экране и включите push-уведомления. Выберите **Тестовое соединение**, чтобы проверить доставку в каждый браузер из списка **Включенные браузеры**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  72f0707b2d67bf0e:
    english: Web push also works in supported desktop browsers. Enable it there if you want Loomio notifications on your computer.
    translation: Web push также работает в поддерживаемых браузерах на компьютере. Включите его там, если хотите получать уведомления Loomio на компьютере.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fea7dbef040ae7f5:
    english: Once push is enabled in at least one browser, group and thread notification forms let you choose **Email**, **Push**, or **Email and push**. Email and push can use different notification settings. Push delivery can be delayed by the browser, operating system, or network connection.
    translation: Когда push-уведомления включены хотя бы в одном браузере, в настройках уведомлений группы и ветки можно выбрать **Электронная почта**, **Push** или **Электронная почта и push-уведомления**. Для писем и push-уведомлений можно задать разные настройки. Браузер, операционная система или сетевое соединение могут задерживать доставку push-уведомлений.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  210e15dcdff781ce:
    english: "![Push notification settings and enabled browsers](push_notification_settings.png)"
    translation: "![Настройки push-уведомлений и включённые браузеры](push_notification_settings.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  37e2be2c73fbb06d:
    english: "## Turn off external notifications"
    translation: "## Отключение внешних уведомлений"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5e3d442fa885bcd4:
    english: To stop email and push messages for group and thread activity, open **Notification settings** from your user menu, set the catch-up to **Never**, and choose **No email updates** and **No push updates**. Notifications and activity remain available when you open Loomio.
    translation: Чтобы перестать получать письма и push-уведомления о событиях в группах и ветках обсуждений, откройте **Настройки уведомлений** в меню пользователя, установите для писем со сводкой значение **Никогда** и выберите **Нет обновлений по электронной почте.** и **Нет push-уведомлений об обновлениях**. Уведомления и сведения о событиях останутся доступны в Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
