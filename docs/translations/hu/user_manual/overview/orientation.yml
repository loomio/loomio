    english: Use the sidebar to open your dashboard, polls awaiting your vote, unread and direct discussions, tasks, and groups. It also links to the user manual and support.
    translation: Az oldalsávból elérheted az irányítópultodat, a szavazásodra váró szavazásokat, az olvasatlan és közvetlen beszélgetéseket, a feladatokat és a csoportokat. Itt találod a felhasználói kézikönyv és a támogatás hivatkozását is.
