  55ccc01c9b274a87:
    english: |-
      ## Key points
      - Aim for a ‘good enough’ decision.
      - Involve many voices to develop a workable proposal.
      - Ask if anyone has a valid objection.
      - Amend the proposal to resolve objections.
    translation: |-
      ## Das Wichtigste
      - Strebe eine Entscheidung an, die gut genug ist.
      - Beziehe viele Stimmen ein, um einen umsetzbaren Vorschlag zu entwickeln.
      - Frage, ob jemand einen begründeten Einwand hat.
      - Überarbeite den Vorschlag, um Einwände auszuräumen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7c2ef9fc3419f4b7:
    english: |-
      **Typical roles:**
      - Proposer: The person who raises a topic that requires a decision.
      - Facilitator: Someone who can help the proposer do their job efficiently.
    translation: |-
      **Typische Rollen:**
      - Vorschlagende Person: Bringt ein Thema ein, zu dem eine Entscheidung nötig ist.
      - Moderierende Person: Hilft der vorschlagenden Person, ihre Aufgabe gut zu erfüllen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c56d1ea7a5582723:
    english: |-
      ## Consent process steps
      You notice a problem or opportunity and take the initiative.
      1. Present a proposal - start a Loomio **discussion**.
      2. Facilitate a round of questions, reactions and any comments to improve the proposal - run a **Sense check proposal**.
      3. Amend the proposal with suggestions and comments.
      4. Ask if anyone has a meaningful objection to the amended proposal - run a **Consent proposal**.
      5. Integrate valid objections to create an amended version of the proposal that everyone consents is ‘safe to try’ - state the decision **outcome**.
    translation: |-
      ## Schritte des Einwilligungsprozesses
      Du bemerkst ein Problem oder eine Gelegenheit und ergreifst die Initiative.
      1. Stelle einen Vorschlag vor – starte eine Loomio-**Diskussion**.
      2. Moderiere eine Runde für Fragen, Reaktionen und Kommentare, um den Vorschlag zu verbessern – starte einen **Vorschlag zur Meinungsabfrage**.
      3. Überarbeite den Vorschlag anhand der Anregungen und Kommentare.
      4. Frage, ob jemand einen wesentlichen Einwand gegen den überarbeiteten Vorschlag hat – starte einen **Zustimmungsvorschlag**.
      5. Berücksichtige begründete Einwände und überarbeite den Vorschlag, bis alle zustimmen, dass er sich ausprobieren lässt – halte die Entscheidung im **Fazit** fest.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  735e10dde58793f0:
    english: |-
      >[!Tip]
      >In more complex decisions you may also include a clarifying **Questions round** at step 2, to help people understand the proposal before inviting them to react and comment on the proposal.
    translation: |-
      >[!Tip]
      >Bei komplexeren Entscheidungen kannst du in Schritt 2 auch eine klärende **Fragerunde** einplanen. So können alle den Vorschlag verstehen, bevor du sie um Reaktionen und Kommentare bittest.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9cf871a054d8e628:
    english: |-
      ## Benefits
      - Faster, efficient, clear and more adaptable decisions.
      - Diverse perspectives and empowered engagement builds trust.
      - A more agile, transparent and inclusive culture.
    translation: |-
      ## Vorteile
      - Entscheidungen werden schneller, klarer und anpassungsfähiger.
      - Unterschiedliche Perspektiven und aktive Beteiligung schaffen Vertrauen.
