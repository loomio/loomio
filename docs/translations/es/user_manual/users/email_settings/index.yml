---
navigation_title: Notificaciones
blocks:
  3a65b66c581936a1:
    english: "# Notifications"
    translation: "# Notificaciones"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c343eb5a1db968d8:
    english: Notifications help groups maintain momentum by drawing your attention to discussions and decisions that need a response.
    translation: Las notificaciones ayudan a los grupos a mantener el ritmo al señalarte las discusiones y decisiones que requieren una respuesta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3d7b27f3b9880973:
    english: 'Notifications are often the starting point when you return to Loomio. They let you know when:'
    translation: 'Cuando vuelves a Loomio, las notificaciones suelen ser el punto de partida. Te avisan cuando:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c4aec8fcb9fbc0de:
    english: |-
      - someone mentions you or replies to something you wrote
      - a new discussion is shared with you
      - you are invited or reminded to vote
      - a poll is closing soon
      - an outcome is announced
    translation: |-
      - alguien te menciona o responde a algo que escribiste
      - alguien comparte contigo una nueva discusión
      - te invitan o te recuerdan que votes
      - un sondeo está a punto de cerrarse
      - se anuncia una conclusión
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  792dcad0f81e8cc5:
    english: Loomio's notification settings let you choose how closely you want to follow each group or thread. Notifications remain available in Loomio, so you can review what needs your attention when you are ready.
    translation: Los ajustes de notificación de Loomio te permiten elegir cuánto quieres seguir la actividad de cada grupo o hilo. Las notificaciones siguen disponibles en Loomio para que puedas revisar lo que requiere tu atención cuando quieras.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '082fae961275aaaf':
    english: "## Two ways to begin"
    translation: "## Dos formas de empezar"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cbea008bb7c0ee02:
    english: 'Most people can start with one of two approaches:'
    translation: 'La mayoría de las personas pueden empezar con una de estas dos opciones:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3349bdb53fc33195:
    english: |-
      - **When notified** — receive an email when someone asks for your attention, and include everything else in your daily catch-up. Start here if you are still learning how your group uses Loomio.
      - **Once per day** — set Email to **Catch-up only** and keep your catch-up set to **Every day**. Your notifications and other unread activity will be delivered together in one email.
    translation: |-
      - **Cuando te notifiquen** — recibe un correo electrónico cuando alguien solicite tu atención e incluye el resto en tu resumen diario. Empieza por aquí si todavía estás aprendiendo cómo usa Loomio tu grupo.
      - **Una vez al día** — configura el correo electrónico como **Solo para ponerse al día** y mantén el resumen en **Todos los días**. Recibirás tus notificaciones y el resto de la actividad no leída en un solo correo electrónico.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  74e84c4946aa3713:
    english: New accounts start with **When notified** and a daily catch-up. This brings mentions, replies, discussions shared with you, invitations and reminders to vote, polls closing soon, and outcomes to your attention as they happen without sending an immediate update about every comment or vote.
    translation: Las cuentas nuevas comienzan con **Cuando te notifiquen** y un resumen diario. Así recibes avisos de menciones, respuestas, discusiones compartidas contigo, invitaciones y recordatorios para votar, sondeos que están por cerrarse y conclusiones cuando ocurren, sin recibir un aviso inmediato por cada comentario o voto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  896722cbb87e98be:
    english: If you would rather receive your Loomio notifications all at once, move to the once-per-day approach. You can change this later as your pattern of work changes.
    translation: Si prefieres recibir todas tus notificaciones de Loomio a la vez, elige la opción de una vez al día. Puedes cambiarla más adelante si cambia tu forma de trabajar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e2c60724226ad68a:
    english: For a group or thread that you want to follow more closely, choose **All activity** to receive every update as it happens.
    translation: Si quieres seguir más de cerca un grupo o hilo, elige **Toda la actividad** para recibir cada actualización cuando ocurra.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  91fd24c60a6a84ee:
    english: These defaults apply when you join a group. Threads initially inherit the settings of their group, but you can follow an important thread more closely or reduce its notifications without changing the rest of the group.
    translation: Estos ajustes predeterminados se aplican cuando te unes a un grupo. Al principio, los hilos heredan los ajustes del grupo, pero puedes seguir más de cerca un hilo importante o reducir sus notificaciones sin cambiar los ajustes del resto del grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a75df26cfc4e6614:
    english: "## Notifications in Loomio"
    translation: "## Notificaciones en Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9286edc0ac459625:
    english: The bell icon in the top-right is where notifications are accessed within the app; a number shows how many notifications you have yet to read.
    translation: Puedes acceder a las notificaciones desde el icono de campana en la esquina superior derecha de la aplicación. El número indica cuántas tienes sin leer.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bfacf52b815e1252:
    english: Select a notification to open the related discussion or poll.
    translation: Selecciona una notificación para abrir la discusión o el sondeo correspondiente.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b7ed6a5c5c661d60:
    english: "## Catch-up"
    translation: "## Resumen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fc61461d684c5b47:
    english: The catch-up provides a regular overview of activity without requiring you to follow each group throughout the day.
    translation: El resumen te ofrece una visión periódica de la actividad sin que tengas que seguir cada grupo durante el día.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e519b17a3847cee:
    english: It shows your unseen notifications first, followed by unread discussions and standalone polls grouped by group. Notifications provide linked summaries of activity that needs your attention, while the unread section includes the discussion, poll, comment, vote, and edit details. Direct discussions and threads you have joined as a guest are included when they contain unread activity.
    translation: Primero muestra tus notificaciones no vistas y después las discusiones y los sondeos independientes sin leer, agrupados por grupo. Las notificaciones contienen resúmenes con enlaces a la actividad que requiere tu atención. La sección de actividad no leída incluye detalles de discusiones, sondeos, comentarios, votos y ediciones. También se incluyen las discusiones directas y los hilos a los que te hayas unido como invitado cuando tienen actividad sin leer.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  00703333f277e3c0:
    english: You can turn on **Follow updates** on an open Group that you have not joined. Unread discussions and polls from that Group are then included in your catch-up at your existing schedule. Reading the threads or marking the catch-up as read updates their read status in the same way as threads from Groups you belong to. Turn off **Follow updates** on the Group page to stop including them.
    translation: Puedes activar **Sigue las actualizaciones** en un grupo abierto al que no te hayas unido. Sus discusiones y sondeos sin leer aparecerán en tu resumen según la frecuencia que ya tengas configurada. Al leer los hilos o marcar el resumen como leído, se actualiza su estado de lectura igual que en los hilos de los grupos a los que perteneces. Desactiva **Sigue las actualizaciones** en la página del grupo para dejar de incluirlos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fcac102a70f7ee7f:
    english: Loomio does not send a catch-up when there are no unseen notifications or unread threads from the relevant period.
    translation: Loomio no envía un resumen si no tienes notificaciones no vistas ni hilos sin leer del período correspondiente.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  888011209ac583be:
    english: "![A catch-up with unseen notifications and unread thread activity from one group](digest_email_example.png)"
    translation: "![Un resumen con notificaciones no vistas y actividad sin leer en los hilos de un grupo](digest_email_example.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7d80cf08a383f6bd:
    english: "### Choose your catch-up schedule"
    translation: "### Elige la frecuencia del resumen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  677863d68136156b:
    english: Open **Notification settings** from your user menu to choose how often you receive a catch-up.
    translation: Abre **Ajustes de notificación** desde tu menú de usuario para elegir con qué frecuencia recibes un resumen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7c0dece94210f807:
    english: The **Unsubscribe** link in a catch-up email opens a catch-up schedule form. The email link authorizes that form, so you can change or stop catch-up emails without signing in. The full **Notification settings** page in Loomio remains available when you sign in.
    translation: El enlace **Cancelar suscripción** de un correo de resumen abre un formulario para configurar su frecuencia. El enlace del correo autoriza el uso de ese formulario, por lo que puedes cambiar o detener los correos de resumen sin iniciar sesión. Si inicias sesión en Loomio, también puedes acceder a la página completa de **Ajustes de notificación**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  da5740fd6dbd5737:
    english: "![Notification settings in the user menu](sidebar_notification_settings.png)"
    translation: "![Ajustes de notificación en el menú de usuario](sidebar_notification_settings.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  58af77d870a877e2:
    english: 'New accounts start with a daily catch-up. The available schedules are:'
    translation: 'Las cuentas nuevas comienzan con un resumen diario. Las frecuencias disponibles son:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b0fe04b2b5284253:
    english: |-
      - **Never** to turn off the catch-up
      - **Every day** for activity from approximately the previous 24 hours
      - **Every second day** for activity from approximately the previous two days
      - a weekday to receive a weekly catch-up on that day
    translation: |-
      - **Nunca** para desactivar el resumen
      - **Todos los días** para recibir la actividad de aproximadamente las últimas 24 horas
      - **Cada dos días** para recibir la actividad de aproximadamente los dos días anteriores
      - un día de la semana para recibir un resumen semanal ese día
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a23935f518dd15cb:
    english: The catch-up is sent in the morning according to the time zone in your Loomio profile.
    translation: El resumen se envía por la mañana según la zona horaria de tu perfil de Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b214c0634763fb51:
    english: "![Catch-up schedule setting](digest_email_setting.png)"
    translation: "![Ajuste de frecuencia del resumen](digest_email_setting.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  efbcecfe827438a5:
    english: "### Mark a catch-up as read"
    translation: "### Marca un resumen como leído"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2b764b73f48d3185:
    english: Select **Mark catch-up as read** to mark its notifications and topic activity as read in Loomio. Opening or previewing the catch-up does not mark anything as read.
    translation: Selecciona **Marcar el resumen como leído** para marcar como leídas en Loomio sus notificaciones y la actividad de los temas. Abrir o previsualizar el resumen no marca nada como leído.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  81ffa4a869f82451:
    english: A catch-up is not specific to one discussion, so do not reply to it. Open a discussion or poll from the catch-up before commenting or replying.
    translation: El resumen no corresponde a una sola discusión, así que no respondas al correo. Abre una discusión o un sondeo desde el resumen antes de comentar o responder.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f7dfee93901e5eea:
    english: "## Group and thread notification settings"
    translation: "## Ajustes de notificación de grupos e hilos"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  31be594005b6bcfc:
    english: You can choose how closely to follow each group and thread. These settings belong to you; group administrators cannot change them.
    translation: Puedes elegir cuánto quieres seguir la actividad de cada grupo e hilo. Estos ajustes son tuyos; los administradores del grupo no pueden cambiarlos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6c9a762b18c9f92d:
    english: Change your defaults for groups you join from **Notification settings** in your user menu. You can then override the default for a particular group or thread. A thread override changes only that thread and does not affect the rest of its group.
    translation: Cambia los ajustes predeterminados para los grupos a los que te unas desde **Ajustes de notificación** en tu menú de usuario. Después puedes elegir otros ajustes para un grupo o hilo concreto. Si cambias los ajustes de un hilo, el resto del grupo no se ve afectado.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f4b6aa6eab1beb2b:
    english: "### Group notification settings"
    translation: "### Ajustes de notificación de un grupo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  977289761daba9db:
    english: 'To change the notification setting for a group:'
    translation: 'Para cambiar los ajustes de notificación de un grupo:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d78d13409c481c71:
    english: |-
      1. Open the group page.
      2. Open the notification settings for the group.
    translation: |-
      1. Abre la página del grupo.
      2. Abre los ajustes de notificación del grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  02116f695da0a946:
    english: "![Notification settings on a group page](group_notifications.png)"
    translation: "![Ajustes de notificación en la página de un grupo](group_notifications.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8ce50d3418e2d9fa:
    english: The form asks **How do you want to stay updated?** Choose **Catch-up only**, **When notified**, or **All activity**. If your catch-up is set to **Never**, **Catch-up only** is replaced by **No email updates** or **No push updates**.
    translation: El formulario pregunta **¿Cómo quieres mantenerte al día?** Elige **Solo para ponerse al día**, **Cuando te notifiquen** o **Toda la actividad**. Si el resumen está configurado como **Nunca**, **Solo para ponerse al día** se sustituye por **No hay actualizaciones por correo electrónico** o **Sin actualizaciones push**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  24db74c2c82737eb:
    english: Select **Apply to all groups** to use the same setting for all of your groups.
    translation: Selecciona **Aplicar a todos los grupos** para usar la misma configuración en todos tus grupos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  54cd6a8eac96e073:
    english: "![Group notification settings](group_notification_settings.png)"
    translation: "![Configuración de notificaciones del grupo](group_notification_settings.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d0ab43e865282241:
    english: "### Thread notification settings"
    translation: "### Configuración de notificaciones del hilo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f61284373b7afc42:
    english: To change notification settings for an individual thread, open the notification control in the thread sidebar.
    translation: Para cambiar las notificaciones de un hilo, abre el control de notificaciones en la barra lateral del hilo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b329b8421ab5d4f8:
    english: "![The notification control in a thread](thread_subscribe.png)"
    translation: "![El control de notificaciones de un hilo](thread_subscribe.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  226c5e321d735005:
    english: "![Thread notification settings](thread_notifications.png)"
    translation: "![Configuración de notificaciones del hilo](thread_notifications.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3178b3b456acd783:
    english: Thread notification settings use the same **Catch-up only**, **When notified**, and **All activity** choices. A thread setting overrides the group setting for that thread.
    translation: 'Las notificaciones del hilo ofrecen las mismas opciones: **Solo para ponerse al día**, **Cuando te notifiquen** y **Toda la actividad**. La configuración del hilo prevalece sobre la del grupo para ese hilo.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f53fa37c98c9b747:
    english: |-
      >[!Note]
      >The changes in **Thread notification settings** apply only to the thread you have open. Select **Change notifications for group** to change the setting inherited by the group's other threads.
    translation: |-
      >[!Note]
      >Los cambios en **Configuración de notificaciones de subprocesos** se aplican solo al hilo que tienes abierto. Selecciona **Cambiar notificaciones del grupo** para cambiar la configuración que heredan los demás hilos del grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  99a0923cdcdc1cdf:
    english: "## Email delivery"
    translation: "## Envío de correos electrónicos"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6cf70b2dc7cdbf83:
    english: By default, Loomio sends an email when you are notified. Depending on your group and thread notification settings, this can include mentions, replies, discussions shared with you, invitations and reminders to vote, outcomes, and polls closing soon. Choose **All activity** to also receive emails about every new comment, vote, thread, poll, and outcome.
    translation: De forma predeterminada, Loomio te envía un correo electrónico cuando recibes una notificación. Según la configuración de notificaciones del grupo y del hilo, estos correos pueden avisarte de menciones, respuestas, discusiones compartidas contigo, invitaciones y recordatorios para votar, conclusiones y sondeos que están por cerrarse. Elige **Toda la actividad** para recibir también correos sobre cada comentario, voto, hilo, sondeo y conclusión nuevos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ce2919b895be45b3:
    english: The **Unsubscribe** link in a notification email opens settings for that thread or group, including emails sent because someone mentioned you or replied to you. That form shows your current catch-up schedule for all groups and links to the catch-up email settings. These email links authorize only their own settings forms; they do not sign you in to Loomio.
    translation: El enlace **Cancelar suscripción** de un correo de notificación abre la configuración del hilo o grupo correspondiente. También aparece en los correos que recibes cuando alguien te menciona o te responde. El formulario muestra la frecuencia actual de tus correos de resumen para todos los grupos y enlaza a su configuración. Estos enlaces solo autorizan el acceso a sus respectivos formularios; no inician sesión en Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d615e84f882a2728:
    english: When a discussion email says that replies are accepted, you can reply directly from your email and your message will be posted into the Loomio discussion.
    translation: Si un correo de una discusión indica que acepta respuestas, puedes responder directamente al correo. Tu mensaje se publicará en la discusión de Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5b4ce168b24bc44a:
    english: Poll invitation emails show the poll and its response options, but selecting an option opens Loomio in your browser to complete the vote. You may need to sign in or confirm your account. The catch-up cannot accept replies; open the linked discussion or poll first.
    translation: Los correos de invitación a un sondeo muestran el sondeo y sus opciones de respuesta, pero al seleccionar una opción se abre Loomio en tu navegador para completar el voto. Puede que tengas que iniciar sesión o confirmar tu cuenta. Los correos de resumen no aceptan respuestas; abre primero la discusión o el sondeo enlazado.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0c2b2867a1ace598:
    english: "![A proposal invitation email with response options and the related thread](proposal_invitation_email.png)"
    translation: "![Correo de invitación a una propuesta con opciones de respuesta y el hilo relacionado](proposal_invitation_email.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a73508aa897d96cf:
    english: "## Enable mobile notifications with web push"
    translation: "## Activar las notificaciones móviles con web push"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f4b14a4ba068b670:
    english: Web push is how Loomio delivers mobile notifications today. It can notify you about Loomio activity on your phone when Loomio is not open.
    translation: Loomio utiliza web push para enviar notificaciones móviles. Así puedes recibir avisos sobre la actividad de Loomio en tu teléfono aunque la aplicación no esté abierta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  811ee794dea12cd3:
    english: On Android, open **Notification settings** in a supported browser and enable push. On an iPhone or iPad, first open Loomio in Safari, use **Share** then **Add to Home Screen**, open Loomio from the new Home Screen icon, and enable push from there. Select **Test connection** to verify delivery to every browser listed under **Enabled browsers**.
    translation: En Android, abre **Ajustes de notificación** en un navegador compatible y activa las notificaciones push. En un iPhone o iPad, abre primero Loomio en Safari, selecciona **Compartir** y luego **Añadir a pantalla de inicio**. Abre Loomio desde el nuevo icono de la pantalla de inicio y activa las notificaciones push allí. Selecciona **Conexión de prueba** para comprobar que lleguen a todos los navegadores de **Navegadores habilitados**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72f0707b2d67bf0e:
    english: Web push also works in supported desktop browsers. Enable it there if you want Loomio notifications on your computer.
    translation: Web push también funciona en navegadores de escritorio compatibles. Actívalo allí si quieres recibir notificaciones de Loomio en tu ordenador.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fea7dbef040ae7f5:
    english: Once push is enabled in at least one browser, group and thread notification forms let you choose **Email**, **Push**, or **Email and push**. Email and push can use different notification settings. Push delivery can be delayed by the browser, operating system, or network connection.
    translation: Cuando hayas activado las notificaciones push en al menos un navegador, los formularios de notificaciones de grupos e hilos te permitirán elegir **Correo electrónico**, **Push** o **Correo electrónico y push**. Puedes configurar de forma distinta las notificaciones por correo electrónico y por push. El navegador, el sistema operativo o la conexión de red pueden retrasar la entrega de las notificaciones push.
