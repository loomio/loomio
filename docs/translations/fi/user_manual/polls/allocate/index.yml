navigation_title: Jaa pisteet
blocks:
  343675f0497d460a:
    english: "# Allocate"
    translation: "# Jaa pisteet"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  46dd27ee2e2fb992:
    english: Allocate, sometimes known as a dot vote, reveals priorities when there are trade-offs. Each participant receives a fixed budget of points and distributes it across the options. Giving more to one option leaves fewer points for the others.
    translation: Pisteiden jakaminen eli pisteäänestys auttaa selvittämään tärkeysjärjestyksen, kun valinnat edellyttävät kompromisseja. Jokainen osallistuja saa tietyn määrän pisteitä ja jakaa ne vaihtoehtojen kesken. Jos annat yhdelle vaihtoehdolle enemmän pisteitä, muille jää vähemmän.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c6d05c5ec2a695d2:
    english: "## When to use Allocate"
    translation: "## Milloin pisteiden jakamista kannattaa käyttää"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f5b2c4377aea5079:
    english: 'Use Allocate when time, money, attention, or another resource is limited. It works well for:'
    translation: 'Käytä pisteiden jakamista, kun aikaa, rahaa, huomiota tai muuta resurssia on rajallisesti. Se sopii esimerkiksi:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8e6525da99616946:
    english: |-
      - prioritizing work for the next planning period;
      - dividing a participatory budget between projects;
      - choosing how much agenda time to give several topics;
      - distributing a fixed number of volunteer hours; or
      - identifying which improvements matter most to members.
    translation: |-
      - seuraavan suunnittelujakson töiden asettamiseen tärkeysjärjestykseen;
      - osallistuvan budjetin jakamiseen hankkeiden kesken;
      - esityslistan ajan jakamiseen usean aiheen kesken;
      - tietyn vapaaehtoistuntimäärän jakamiseen; tai
      - jäsenille tärkeimpien parannusten tunnistamiseen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  66b0f13c4811ef63:
    english: The points express relative priority, not an amount that Loomio will automatically assign. Use [Score](/en/user_manual/polls/score/) when every option can receive a high rating without reducing support for another.
    translation: Pisteet ilmaisevat suhteellista tärkeyttä. Loomio ei jaa niiden perusteella resursseja automaattisesti. Käytä [pisteytyskyselyä](/en/user_manual/polls/score/), kun jokainen vaihtoehto voi saada korkean arvion ilman, että se vähentää muiden vaihtoehtojen kannatusta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '0409e08bd5e80f61':
    english: "## Example: set priorities for an annual strategy review"
    translation: "## Esimerkki: aseta vuosittaisen strategiatarkastelun painopisteet"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e274f6e40509e611:
    english: Oatmilk Cooperative is planning its annual strategy review. It asks members which areas should receive the most time and attention during the review. Each member receives ten points to allocate across five areas. This shows the group's relative priorities while requiring participants to make trade-offs.
    translation: Kauramaito-osuuskunta suunnittelee vuosittaista strategiatarkasteluaan. Se kysyy jäseniltä, mihin osa-alueisiin tarkastelussa pitäisi käyttää eniten aikaa ja huomiota. Jokainen jäsen saa kymmenen pistettä jaettavaksi viiden osa-alueen kesken. Näin ryhmän suhteelliset painopisteet tulevat näkyviin, ja osallistujien on tehtävä valintoja.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c74ebb16f872b3c6:
    english: "## Set up the poll"
    translation: "## Luo kysely"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  906790609aa7eb30:
    english: Describe the decision and what the points represent. Add options at a similar level of scope, then set **Points per person**. In this example, each voter receives ten points to indicate how much review time each strategic area should receive.
    translation: Kuvaile päätös ja kerro, mitä pisteet tarkoittavat. Lisää laajuudeltaan vertailukelpoiset vaihtoehdot ja määritä sitten **Pisteet per henkilö**. Tässä esimerkissä jokainen äänestäjä saa kymmenen pistettä osoittaakseen, kuinka paljon tarkasteluaikaa kullekin strategiselle osa-alueelle pitäisi antaa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  67ae025b83fb4781:
    english: A very large budget can create false precision. A useful budget is usually large enough to show differences but small enough to require choices. Make clear whether concentrating all points on one option is acceptable.
    translation: Hyvin suuri pistemäärä voi antaa harhaanjohtavan vaikutelman tarkkuudesta. Sopiva pistemäärä on yleensä riittävän suuri erojen ilmaisemiseen mutta riittävän pieni pakottamaan valintoihin. Kerro selvästi, saako kaikki pisteet antaa yhdelle vaihtoehdolle.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Äänestä"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d9a73b9d4e2f8927:
    english: Participants move the sliders to distribute their budget. Loomio shows how many points remain and prevents submission until the allocation is valid.
    translation: Osallistujat jakavat pisteensä liukusäätimillä. Loomio näyttää jäljellä olevien pisteiden määrän ja estää äänen lähettämisen, kunnes kaikki pisteet on jaettu oikein.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7b3d616673a01fbb:
    english: In this example, the voter assigns three points each to **Member participation** and **Financial sustainability**, two each to **Environmental impact** and **Staff development**, and none to **Products and services**. A zero does not necessarily mean an area has no value; it means the voter used their limited points elsewhere.
    translation: Tässä esimerkissä äänestäjä antaa kolme pistettä sekä **Jäsenten osallistumiselle** että **Taloudelliselle kestävyydelle**, kaksi pistettä sekä **Ympäristövaikutuksille** että **Henkilöstön kehittämiselle** ja nolla pistettä **Tuotteille ja palveluille**. Nolla ei välttämättä tarkoita, ettei osa-alueella olisi arvoa. Äänestäjä käytti rajalliset pisteensä muualla.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Tarkastele tuloksia"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  97147f83eaf22313:
    english: 'The results order options by the total points received. They also show:'
    translation: 'Tuloksissa vaihtoehdot järjestetään saatujen pisteiden kokonaismäärän mukaan. Niissä näytetään myös:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1d224c0c34145a7f:
    english: |-
      - **% of points**: the option's share of all allocated points;
      - **Points**: the total points allocated;
      - **Mean**: the average among voters who gave the option points; and
      - **Voters**: how many people gave the option at least one point.
    translation: |-
      - **% pisteistä**: vaihtoehdon osuus kaikista jaetuista pisteistä;
      - **Pisteet**: vaihtoehdolle annettujen pisteiden kokonaismäärä;
      - **Tarkoittaa**: niiden äänestäjien antamien pisteiden keskiarvo, jotka antoivat vaihtoehdolle pisteitä; ja
      - **Äänestäjät**: kuinka moni antoi vaihtoehdolle vähintään yhden pisteen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2901008fa326e4f5:
    english: In this example, **Financial sustainability** receives the most points, followed by **Staff development**. Financial sustainability receives points from every voter, suggesting broad agreement that it needs substantial review time. Read the totals alongside the number of voters to distinguish broad priorities from areas strongly supported by fewer people.
    translation: Tässä esimerkissä **Taloudellinen kestävyys** saa eniten pisteitä ja **Henkilöstön kehittäminen** toiseksi eniten. Jokainen äänestäjä antaa pisteitä taloudelliselle kestävyydelle, mikä viittaa laajaan yksimielisyyteen siitä, että se tarvitsee paljon tarkasteluaikaa. Vertaa kokonaispisteitä äänestäjien määrään, jotta erotat laajasti tärkeinä pidetyt osa-alueet niistä, joita harvemmat kannattavat voimakkaasti.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f2c04fbdc54d23e8:
    english: Read the totals together with the number of voters and their reasons. Publish an outcome explaining how the strategy review will be structured; the poll does not assign time automatically.
    translation: Tarkastele kokonaispisteitä yhdessä äänestäjien määrän ja heidän perustelujensa kanssa. Julkaise päätelmä, jossa kerrot, miten strategiatarkastelu järjestetään. Kysely ei jaa aikaa automaattisesti.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
