  bea1dad1b0b47107:
    english: Use tasks in threads and comments to name an action, assign it to someone, set a due date, and track whether it is complete.
    translation: Usa las tareas en hilos y comentarios para indicar qué hay que hacer, asignarlo a alguien, fijar una fecha de vencimiento y seguir su progreso.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2398b3493bad759e:
    english: "## Add a task"
    translation: "## Añadir una tarea"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c240866e019fab51:
    english: While writing a thread or comment, expand the formatting toolbar and click **Task list**. Type the action beside the checkbox.
    translation: Mientras escribes un hilo o comentario, despliega la barra de herramientas de formato y haz clic en **Lista de tareas**. Escribe la acción junto a la casilla.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f7d4f63b321e9af1:
    english: "## Name and assign the task to a person"
    translation: "## Describir la tarea y asignarla a una persona"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5ea902e45aaf1f7a:
    english: Use an @mention in the task to assign it to a group member. An **Add due date** button appears once the task has an assignee.
    translation: Menciona con @ a un miembro del grupo en la tarea para asignársela. Cuando la tarea tenga una persona asignada, aparecerá el botón **Añadir fecha de vencimiento**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1134aedee6cafd8c:
    english: Tasks assigned to you appear on your **Tasks** page. Open **Tasks** from the sidebar to see them grouped by thread or poll.
    translation: Las tareas que tienes asignadas aparecen en tu página **Tareas**. Ábrela desde la barra lateral para verlas agrupadas por hilo o encuesta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5eae519b81c94f7a:
    english: "## Set a reminder"
    translation: "## Configurar un recordatorio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  561597d43d716888:
    english: Click **Add due date** to choose a due date and when Loomio should email the assignee a reminder. You can also remove an existing due date from this dialog.
    translation: Haz clic en **Añadir fecha de vencimiento** para elegir la fecha y cuándo debe Loomio enviar un recordatorio por correo a la persona asignada. También puedes quitar una fecha de vencimiento desde este cuadro de diálogo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bd36c23f297b0429:
    english: "## Mark it as done"
    translation: "## Marcar una tarea como completada"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  59b6138f35694902:
    english: Click the checkbox beside a task to mark it as done. You can do this while editing the text, while reading it if you are the assignee, or from the **Tasks** page. Click it again to reopen the task.
    translation: Haz clic en la casilla junto a una tarea para marcarla como completada. Puedes hacerlo mientras editas el texto, mientras lo lees si tienes la tarea asignada o desde la página **Tareas**. Vuelve a hacer clic para reabrirla.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
