  1d390c0c4f4cea4a:
    english: Category tags make it easy to find threads and polls about a particular type of work or topic.
    translation: Les mots-clés de catégorie vous aident à trouver les discussions et les sondages liés à un type de travail ou à un sujet précis.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  572adf8961fc1178:
    english: |-
      Tags belong to the whole organization. A tag used in a parent group is the
      same tag in its subgroups, making it possible to organize related work across
      the organization. Loomio displays tag names alphabetically and shows their
      colors as dots beside the names.
    translation: |-
      Les mots-clés appartiennent à l’ensemble de l’organisation. Un mot-clé utilisé dans un groupe parent est le
      même dans ses sous-groupes. Vous pouvez ainsi organiser les travaux liés dans
      toute l’organisation. Loomio affiche les noms des mots-clés par ordre alphabétique et indique
      leur couleur par un point à côté de chaque nom.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b5340bcbf37095dc:
    english: |-
      On your group page, click **Tags** above the thread list to see the tags used in
      the current group. Select a tag to show only threads with that tag. Use the
      filter textbox to search a long list, or select **Show more** to include all
      tags in the organization. Select **Show fewer** to return to the current
      group's tags.
    translation: |-
      Sur la page de votre groupe, cliquez sur **Mots-clés** au-dessus de la liste des discussions pour voir les mots-clés utilisés dans
      le groupe actuel. Sélectionnez un mot-clé pour n’afficher que les discussions qui le portent. Utilisez le
      champ de filtre pour parcourir une longue liste, ou sélectionnez **Afficher davantage** pour inclure tous les
      mots-clés de l’organisation. Sélectionnez **Montrer moins** pour revenir aux mots-clés du
      groupe actuel.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9de81b9a795d066d:
    english: "## Apply tags"
    translation: "## Appliquer des mots-clés"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bf284f7568360b53:
    english: Members who can edit a thread or poll can apply tags to it.
    translation: Les membres qui peuvent modifier une discussion ou un sondage peuvent y appliquer des mots-clés.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  58488fe368513138:
    english: When you start a thread or poll, click the **Tags** field and select one or more tags.
    translation: Lorsque vous créez une discussion ou un sondage, cliquez sur le champ **Mots-clés** et sélectionnez un ou plusieurs mots-clés.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e060934a2853a35a:
    english: Start typing to filter the list. Select a tag again, or click the × on its chip, to remove it.
    translation: Commencez à saisir du texte pour filtrer la liste. Pour retirer un mot-clé, sélectionnez-le à nouveau ou cliquez sur le × de son étiquette.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9f5e48b7e520d1a0:
    english: "## Create tags"
    translation: "## Créer des mots-clés"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  efa789e9365b2ab2:
    english: |-
      Parent-group admins can always create tags for the parent group and its
      subgroups. Subgroup admins can create tags while tagging content in their
      subgroup. The **Members can create tags** group permission, enabled by default,
      allows other members who can tag a thread or poll to create new tag names. If
      the permission is disabled, members can still apply existing tags.
    translation: |-
      Les administrateurs du groupe parent peuvent toujours créer des mots-clés pour ce groupe et ses
      sous-groupes. Les administrateurs de sous-groupes peuvent créer des mots-clés lorsqu’ils en ajoutent à du contenu dans leur
      sous-groupe. L’autorisation **Les membres peuvent créer des tags**, activée par défaut,
      permet aux autres membres qui peuvent ajouter des mots-clés à une discussion ou à un sondage de créer de nouveaux mots-clés. Si
      cette autorisation est désactivée, les membres peuvent toujours appliquer les mots-clés existants.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7e06376f3431ad2f:
    english: To create a tag while starting a thread or poll, type its name in the **Tags** field and press Enter.
    translation: Pour créer un mot-clé pendant la création d’une discussion ou d’un sondage, saisissez son nom dans le champ **Mots-clés** et appuyez sur Entrée.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
