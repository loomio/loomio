  b27fab33a1dd5176:
    english: 'These guides explain complete decision processes: how to frame a decision, involve the right people, use discussion and proposals, respond to concerns, and record an outcome.'
    translation: 'Гэтыя кіраўніцтвы тлумачаць увесь працэс прыняцця рашэння: як сфармуляваць пытанне, далучыць патрэбных людзей, абмеркаваць прапановы, адказаць на заўвагі і запісаць выснову.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bcbe5e3fd75700a6:
    english: They are different from the proposal-template pages. A [proposal template](/en/user_manual/polls/proposals/) explains one proposal and its response options. A decision process can use several proposals over time.
    translation: Гэтыя кіраўніцтвы адрозніваюцца ад старонак пра шаблоны прапаноў. [Шаблон прапановы](/en/user_manual/polls/proposals/) апісвае адну прапанову і варыянты адказу на яе. У працэсе прыняцця рашэння можна паслядоўна выкарыстоўваць некалькі прапаноў.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  af00d65d38e41f8b:
    english: "## Choose a process"
    translation: "## Выберыце працэс"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f41e345421a1a1e8:
    english: |-
      | Process | Who decides? | Main question |
      |---|---|---|
      | [Simple decision process](simple_decision_process) | Defined by the group | How can we discuss, test, and decide? |
      | [Advice process](advice_process) | A person or delegated team | What advice should the decision maker consider? |
      | [Consent process](consent_process) | The group | Is the proposal safe to try without a meaningful objection? |
      | [Consensus process](consensus_process) | The group | Can we reach collective agreement? |
    translation: |-
      | Працэс | Хто прымае рашэнне? | Галоўнае пытанне |
      |---|---|---|
      | [Просты працэс прыняцця рашэння](simple_decision_process) | Вызначае група | Як абмеркаваць, праверыць і прыняць рашэнне? |
      | [Працэс кансультавання](advice_process) | Адна асоба або каманда, якой дэлегавалі паўнамоцтвы | Якія парады варта ўлічыць пры прыняцці рашэння? |
      | [Працэс прыняцця рашэння без пярэчанняў](consent_process) | Група | Ці можна паспрабаваць ажыццявіць прапанову без істотных пярэчанняў? |
      | [Працэс дасягнення кансэнсусу](consensus_process) | Група | Ці можам мы дасягнуць супольнай згоды? |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d2843889568043c0:
    english: Use the process required by your group's governing rules or decision policy. Different kinds of decisions may use different processes.
    translation: Выкарыстоўвайце працэс, прадугледжаны правіламі кіравання або палітыкай прыняцця рашэнняў вашай групы. Для розных відаў рашэнняў могуць падыходзіць розныя працэсы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bb120914edd79d13:
    english: If you only need help choosing a response format, compare [Proposals](/en/user_manual/polls/proposals/) and [Polls](/en/user_manual/polls/proposal_types/). If you administer the reusable choices shown when someone selects **Start a vote**, see [Poll templates](/en/user_manual/polls/poll_templates/).
    translation: Калі вам трэба толькі выбраць фармат адказаў, параўнайце [Прапановы](/en/user_manual/polls/proposals/) і [Апытанні](/en/user_manual/polls/proposal_types/). Калі вы наладжваеце варыянты для паўторнага выкарыстання, якія з’яўляюцца пасля выбару **Пачаць галасаванне**, глядзіце [Шаблоны апытанняў](/en/user_manual/polls/poll_templates/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
