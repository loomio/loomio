---
navigation_title: Створення групи
blocks:
  e8632dbb628c7c7d:
    english: "# Starting a new group"
    translation: "# Створення нової групи"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2a4a6907d4e2049d:
    english: If you are new to Loomio, you can start a group on a free trial at any time from the [Loomio website](https://www.loomio.com/). If you already use Loomio and would like to start a new group for another organization or purpose, you can do this from the sidebar menu - click on **New group**.
    translation: Якщо ви щойно почали користуватися Loomio, можете будь-коли створити групу з безплатним пробним періодом на [сайті Loomio](https://www.loomio.com/). Якщо ви вже користуєтеся Loomio й хочете створити групу для іншої організації чи мети, відкрийте бічне меню та натисніть **Нова група**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  10e8756c96038e58:
    english: For many organizations, a single Loomio group is sufficient. You can start as many subgroups as you need within the group. See [Subgroups](/en/user_manual/groups/subgroups/) for more info.
    translation: Багатьом організаціям достатньо однієї групи Loomio. У ній можна створити стільки підгруп, скільки потрібно. Докладніше читайте на сторінці [Підгрупи](/en/user_manual/groups/subgroups/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ed00dbe94cd53435:
    english: "## Group details"
    translation: "## Відомості про групу"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0bb201e3a09fe99d:
    english: "### Group name"
    translation: "### Назва групи"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '019cdfc169ea858a':
    english: Type your group name. It's best to keep your group name short and concise.
    translation: Введіть назву вашої групи. Краще, щоб вона була короткою та зрозумілою.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6ae6b08ae7fbe257:
    english: "### Group handle"
    translation: "### Ідентифікатор групи"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b054d0f760888add:
    english: Your group is automatically assigned a handle. The handle is used in the group's URL and email address, such as **loomio.com/your-group-handle** and **your-group-handle@loomio.com**.
    translation: Вашій групі автоматично призначається ідентифікатор. Він використовується в URL-адресі групи та її адресі електронної пошти, наприклад **loomio.com/your-group-handle** і **your-group-handle@loomio.com**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1dee654ba628ba95:
    english: You can edit the handle when you create the group and change it later in group settings. When you change it, links and email addresses that use the old handle continue to work. Loomio keeps up to three old handles; after that, the oldest handle expires.
    translation: Ви можете змінити ідентифікатор під час створення групи або пізніше в її налаштуваннях. Після зміни посилання й адреси електронної пошти зі старим ідентифікатором продовжують працювати. Loomio зберігає до трьох попередніх ідентифікаторів. Коли їх стає більше, найстаріший перестає діяти.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
