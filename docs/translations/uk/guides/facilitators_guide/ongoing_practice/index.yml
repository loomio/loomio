blocks:
  508e19e18ba4a97e:
    english: "# Ongoing Practice"
    translation: "# Постійна практика"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fba51c92285b31c7:
    english: "## Continuous Improvement"
    translation: "## Постійне вдосконалення"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  121b4afb86de3c31:
    english: No matter how amazing a group or facilitator is, they can always improve. If they incrementally head in a good direction they will get to a better place. Incremental improvement requires an effective protocol for meta-conversation (talking about how you collaborate). With it, anything is possible. Without it, you stagnate.
    translation: Якими б досвідченими не були група чи фасилітатор, вони завжди можуть удосконалюватися. Невеликі кроки в правильному напрямку з часом дають результат. Для цього потрібен дієвий спосіб обговорювати, як ви співпрацюєте. Такі розмови допомагають змінювати майже все. Без них розвиток зупиняється.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  331d258dee610e96:
    english: There are many approaches to continuous improvement, but they all create space for reflection and feedback, and a way to make changes in response. For teams that work together on an ongoing basis, they might employ a methodology like <a href="https://en.wikipedia.org/wiki/Scrum_(software_development)" target="_blank">scrum</a>, including retrospectives and regular process improvements. For a one-off session, a facilitator might simply follow up with a request for feedback.
    translation: Є багато підходів до постійного вдосконалення. Усі вони дають змогу осмислити досвід, отримати відгуки й внести зміни. Команди, які працюють разом постійно, можуть використовувати методологію на кшталт <a href="https://en.wikipedia.org/wiki/Scrum_(software_development)" target="_blank">скраму</a> з ретроспективами та регулярним поліпшенням процесів. Після разової зустрічі фасилітатор може просто попросити учасників поділитися відгуками.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aabfa9d842af2688:
    english: On Loomio
    translation: У Loomio
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ac2f489368566562:
    english: |-
      * People use Loomio itself to talk about how they use Loomio. It provides an obvious platform to “talk about the talking”.
      * The process of joining Loomio causes groups to reflect on many aspects of their collaboration and decision-making process, which creates the opportunity to improve.
    translation: |-
      * Люди використовують Loomio, щоб обговорювати, як вони користуються Loomio. Це зручне місце для розмови про сам процес обговорення.
      * Починаючи користуватися Loomio, групи замислюються над різними сторонами своєї співпраці й ухвалення рішень. Це створює можливості для вдосконалення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7b11f212a312312e:
    english: "## Distributed Facilitation / Self-facilitation"
    translation: "## Розподілена фасилітація та самофасилітація"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1e385970a624bf63:
    english: As a group becomes more experienced, more individuals build capacity for facilitation. Facilitation can cease to be a role held by a specific person, and become more of a function that can be distributed. Anyone can take acts of facilitation, and a dance of give and take, leading and following, can emerge among participants. For groups with aspirations toward shared leadership and non-hierarchy, this is a very important thing to encourage.
    translation: Коли група набуває досвіду, дедалі більше її учасників опановують фасилітацію. Вона може перестати бути роллю однієї людини й стати функцією, яку поділяють між собою. Кожен може допомагати вести процес. Учасники можуть по черзі брати ініціативу й підтримувати одне одного. Це особливо важливо для груп, які прагнуть спільного лідерства та рівності.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fa78b242f7390326:
    english: 'People who are less used to taking acts of facilitation can be supported with education, invitations, and suggestions of first steps. Some examples of acts of facilitation almost anyone can be encouraged to try:'
    translation: 'Людям, які ще не звикли фасилітувати, допоможуть навчання, запрошення долучитися й підказки щодо перших кроків. Майже кожному можна запропонувати спробувати такі дії:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1f490f466a1893ed:
    english: |-
      * reflecting back what you’re hearing or summarising
      * inviting others to contribute
      * asking questions to enhance collective understanding
      * noticing who is and is not participating
      * appreciating contributions explicitly
    translation: |-
      * переказати почуте своїми словами або підсумувати розмову
      * запросити інших висловитися
      * поставити запитання, щоб група краще розібралася в темі
      * звернути увагу на те, хто бере участь, а хто ні
      * прямо подякувати людям за їхній внесок
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e2eed897e0f564d2:
    english: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../silvia_200.png"> You don’t need an agenda to be a facilitator. Facilitating is just about making a group situation easy. Next time you’re at a family gathering, party or morning tea: approach it like a facilitator and make sure everybody in the group feels included and able to participate. — Silvia Zuur'
    translation: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../silvia_200.png"> Щоб бути фасилітатором, вам не потрібен порядок денний. Фасилітація означає допомагати групі легко взаємодіяти. Наступного разу на сімейній зустрічі, вечірці чи ранковому чаюванні спробуйте діяти як фасилітатор: подбайте, щоб усі почувалися залученими й могли брати участь. — Сільвія Зуур'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  180b1232871c44c4:
    english: Distributed facilitation can work beautifully, but it can also cause people to step all over each other. At first, it’s awkward as people learn the dance. It’s important to differentiate between distributed facilitation (peers helping the collective), “facipulation” (manipulating the group toward your own agenda), and backseat facilitation (taking acts of facilitation when you do not have the mandate).
    translation: Розподілена фасилітація може працювати дуже добре, але люди також можуть почати заважати одне одному. Спочатку узгоджувати дії буває незручно. Важливо розрізняти розподілену фасилітацію, коли учасники допомагають усій групі, маніпуляцію групою заради власних цілей і втручання в процес без відповідних повноважень.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ea5faa685be1ceae:
    english: Consciously decide when peer facilitation is a good choice, and when a specific facilitator is called for. In certain situations, such as a high-conflict discussion where a specified neutral party is needed, or there is a lack of trust, distributed facilitation might not work.
    translation: Свідомо вирішуйте, коли групі підходить фасилітація силами учасників, а коли потрібен окремий фасилітатор. Наприклад, розподілена фасилітація може не спрацювати під час гострого конфлікту, коли потрібна визначена нейтральна сторона, або коли бракує довіри.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d6df5458ecb8e45:
    english: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../rich_200.png"> Acts of facilitation are not just for the manager, or the person who called the meeting — they are for everyone. — Richard Bartlett'
    translation: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../rich_200.png"> Допомагати вести процес може не лише керівник чи людина, яка скликала зустріч. Це може робити кожен. — Річард Бартлетт'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c3215e63fca09b79:
    english: "## Translating this into Loomio"
    translation: "## Як це працює в Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  35ce75e6810e0611:
    english: |-
      * The online space is uniquely suited to distributed facilitation. Different people can come along at different points depending on what they notice and their skill set.
      * An online discussion is by default a distributed collaboration among peers. Any other setup requires explicit design. This is the opposite of offline spaces where the default is that someone called a meeting and distributing the role requires proactivity.
      * Loomio is designed with a group of equals in mind. In many ways, a distributed facilitation approach is the best fit for the tool.
      * Current Loomio users do peer facilitation all the time, whether they realize that’s what they are doing or not. Simple things like suggesting someone raise a proposal, tagging people, summarising the process so far, etc, are all acts of facilitation.
    translation: |-
      * Онлайн-простір добре підходить для розподіленої фасилітації. Різні люди можуть долучатися на різних етапах залежно від того, що вони помічають і що вміють.
      * Онлайн-обговорення зазвичай є спільною роботою рівних учасників. Інший порядок потрібно встановлювати свідомо. Під час очних зустрічей зазвичай є людина, яка їх скликала, і для розподілу її ролі потрібні додаткові зусилля.
      * Loomio створено для груп, у яких учасники рівні між собою. Тому розподілена фасилітація добре відповідає тому, як працює цей інструмент.
      * Користувачі Loomio постійно допомагають одне одному вести процес, навіть якщо не називають це фасилітацією. Запропонувати комусь створити пропозицію, згадати учасників або підсумувати перебіг обговорення — усе це приклади фасилітації.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  efde81539c545bae:
    english: "## The Art of Being Facilitated"
    translation: "## Мистецтво брати участь у фасилітованому процесі"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  93ed1980d0cc95b4:
    english: Like the skill of being the follow in a ballroom dance pair, being facilitated is an art itself. People with experience facilitating themselves, or who have participated in a lot of well-facilitated processes, will receive facilitation differently than those who haven't.
    translation: Уміння брати участь у фасилітованому процесі схоже на вміння вестися за партнером у парному танці. Це теж потребує практики. Люди, які самі фасилітували або часто брали участь у добре організованих процесах, сприймають фасилітацію інакше, ніж ті, хто такого досвіду не має.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d2bcd9f07f5bd25b:
    english: On the positive side, skillful receptivity to facilitation is a capacoty that can be grown, and it can have a big impact on group success. This ranges from things as simple as showing up on time, to following instructions, to being willing to try a new style of thinking or communicating. Sometimes people have a good experience and they don’t quite know why — pointing out that facilitation is the reason for the smoothness or depth can help them understand what it is they valued about the process.
    translation: 'Уміння приймати фасилітацію можна розвивати, і воно може суттєво допомогти групі. Це стосується простих речей: приходити вчасно, дотримуватися вказівок і бути готовими спробувати новий спосіб мислення чи спілкування. Іноді людям сподобався процес, але вони не знають чому. Якщо пояснити, що саме фасилітація допомогла розмові пройти легко або глибше розкрити тему, їм буде простіше зрозуміти, що вони цінують у цьому процесі.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  87345b383ccba81d:
    english: On the negative side, people who can’t or won’t be facilitated can be detrimental to group collaboration. No matter how skilled a facilitator is, if they encounter a certain level of resistance they won’t be able to do their job. Common problems include dominating the discussion, playing devil’s advocate, disrupting the process, disrespecting the facilitator or participants, or being disengaged. At some level individuals must take responsibility for their willingness to be facilitated.
    translation: Водночас люди, які не можуть або не хочуть брати участь у фасилітованому процесі, можуть заважати співпраці. Навіть досвідчений фасилітатор не зможе виконати свою роботу, якщо зіткнеться з надто сильним опором. Поширені проблеми — домінування в обговоренні, заперечення заради суперечки, зрив процесу, неповага до фасилітатора чи учасників і відстороненість. Кожна людина має певною мірою відповідати за свою готовність брати участь у такому процесі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c096fd0a7e12ddd4:
    english: |-
      * With a little practice, most users quickly upskill on being responsive to acts of facilitation on Loomio, such as replying when @mentioned.
      * Taking acts of facilitation on Loomio helps people become more responsive to facilitation themselves.
      * Because everything is archived, users can see past acts of facilitation “frozen in time”, gaining the benefits of observing them without having been there.
    translation: |-
      * Трохи попрактикувавшись, більшість користувачів швидко вчаться відгукуватися на дії фасилітаторів у Loomio, наприклад відповідати, коли їх згадують через @.
      * Допомагаючи вести процес у Loomio, люди самі стають більш відкритими до фасилітації.
      * Оскільки все зберігається в архіві, користувачі можуть переглядати давні приклади фасилітації та вчитися на них, навіть якщо не брали участі в тих обговореннях.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f930b325aaedb19a:
    english: "## Culture Change"
    translation: "## Зміна культури"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  82936abec2b50e3f:
    english: A collaborative, participatory culture is something that emerges over time, with lots of practice and trial and error. Understanding, valuing, and inviting facilitation can play a pivotal role in this cultural emergence. Facilitation can evolve from a role, to a function, to a mindset. A truly collaborative culture is one where everyone is facilitating everyone in myriad different ways.
    translation: Культура співпраці та участі формується з часом, завдяки практиці, спробам і помилкам. Розуміння й підтримка фасилітації можуть відіграти в цьому важливу роль. Фасилітація може перетворитися з окремої ролі на спільну функцію, а згодом — на звичний спосіб мислення. У культурі справжньої співпраці кожен по-різному допомагає іншим брати участь.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  898bf6557380a042:
    english: Is the company party participatory? Does the office potluck just happen like magic? Are ideas able to emerge from anywhere, evolve through many brains and hands, and get implemented in a way better than anyone first imagined?
    translation: Чи беруть усі участь в організації корпоративного свята? Чи спільний обід в офісі нібито влаштовується сам собою? Чи можуть ідеї виникати будь-де, розвиватися завдяки багатьом людям і втілюватися краще, ніж хтось спочатку уявляв?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f4964381b3c6dc7b:
    english: Deep culture change is when the culture of collaboration starts to leak out of specific “collaboration” spaces and shows up in every aspect of the organization. Collaboration is not about post-it notes and check-ins, but the very timbre of organizational life.
    translation: Глибока зміна культури відбувається тоді, коли співпраця виходить за межі спеціально відведених для неї просторів і стає частиною всіх аспектів життя організації. Вона проявляється не лише у стікерах чи коротких зустрічах, а й у тому, як організація працює щодня.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6962aa4815c01b0f:
    english: |-
      * The [theory of change of Loomio](http://www.loomio.com/about) is that more groups practicing effective, inclusive decision making can change organizational dynamics at a global scale. This shows up in everything about how the tool is designed and [how we run as a co-op](http://loomio.coop). Ultimately, it’s about culture change through collaborative practice.
      * Loomio groups have experienced evolving culture through the tool. Like groups that already has a collaborative culture scale while holding onto that, or a participatory group continuing to exists instead of imploding due to challanges around inclusive decicion-making.
      * Loomio makes a certain kind of “new normal” of collaborative practice possible, through making collaborative practice more accessible and achievable.
    translation: |-
      * [Теорія змін Loomio](http://www.loomio.com/about) полягає в тому, що дедалі більше груп, які ухвалюють рішення ефективно й за участю всіх, можуть змінити роботу організацій у світовому масштабі. Це впливає на те, як створено інструмент і [як ми працюємо як кооператив](http://loomio.coop). Зрештою йдеться про зміну культури через практику співпраці.
      * Групи Loomio спостерігали, як змінюється їхня культура під час роботи з інструментом. Одні змогли вирости, зберігши культуру співпраці. Інші продовжили працювати разом попри труднощі з ухваленням рішень за участю всіх.
      * Loomio допомагає зробити співпрацю звичною практикою, адже вона стає доступнішою та простішою для втілення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3f2cee633e8b83c2:
    english: For inspiration about Ongoing Practice, check out [stories of Loomio groups](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help).
    translation: Щоб знайти ідеї для постійної практики, прочитайте [історії груп Loomio](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
