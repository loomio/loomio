  29a00cacbd5bd549:
    english: "# Category tags"
    translation: "# תגיות קטגוריה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1d390c0c4f4cea4a:
    english: Category tags make it easy to find threads and polls about a particular type of work or topic.
    translation: תגיות קטגוריה מקלות על מציאת שרשורים וסקרים העוסקים בסוג מסוים של עבודה או בנושא מסוים.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  572adf8961fc1178:
    english: |-
      Tags belong to the whole organization. A tag used in a parent group is the
      same tag in its subgroups, making it possible to organize related work across
      the organization. Loomio displays tag names alphabetically and shows their
      colors as dots beside the names.
    translation: |-
      התגיות משותפות לכל הארגון. תגית המשמשת בקבוצת אם היא
      אותה תגית גם בתת־הקבוצות שלה. כך ניתן לארגן עבודה קשורה ברחבי
      הארגון. Loomio מציגה את שמות התגיות לפי סדר אלפביתי ואת
      הצבעים שלהן כנקודות לצד השמות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b5340bcbf37095dc:
    english: |-
      On your group page, click **Tags** above the thread list to see the tags used in
      the current group. Select a tag to show only threads with that tag. Use the
      filter textbox to search a long list, or select **Show more** to include all
      tags in the organization. Select **Show fewer** to return to the current
      group's tags.
    translation: |-
      בדף הקבוצה, יש ללחוץ על **תגיות** מעל רשימת השרשורים כדי לראות את התגיות המשמשות
      בקבוצה הנוכחית. בחירת תגית תציג רק שרשורים עם התגית הזו. ניתן להשתמש
      בתיבת הסינון כדי לחפש ברשימה ארוכה, או לבחור **הראה עוד** כדי לכלול את כל
      התגיות בארגון. כדי לחזור לתגיות של הקבוצה הנוכחית, יש לבחור **הצג פחות**
      .
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9de81b9a795d066d:
    english: "## Apply tags"
    translation: "## הוספת תגיות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bf284f7568360b53:
    english: Members who can edit a thread or poll can apply tags to it.
    translation: חברי קבוצה שיכולים לערוך שרשור או סקר יכולים להוסיף להם תגיות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  58488fe368513138:
    english: When you start a thread or poll, click the **Tags** field and select one or more tags.
    translation: בעת פתיחת שרשור או סקר, יש ללחוץ על השדה **תגיות** ולבחור תגית אחת או יותר.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e060934a2853a35a:
    english: Start typing to filter the list. Select a tag again, or click the × on its chip, to remove it.
    translation: ניתן להתחיל להקליד כדי לסנן את הרשימה. כדי להסיר תגית, יש לבחור בה שוב או ללחוץ על × בתווית שלה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9f5e48b7e520d1a0:
    english: "## Create tags"
    translation: "## יצירת תגיות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  efa789e9365b2ab2:
    english: |-
      Parent-group admins can always create tags for the parent group and its
      subgroups. Subgroup admins can create tags while tagging content in their
      subgroup. The **Members can create tags** group permission, enabled by default,
      allows other members who can tag a thread or poll to create new tag names. If
      the permission is disabled, members can still apply existing tags.
    translation: |-
      מנהלי קבוצת אם יכולים תמיד ליצור תגיות לקבוצת האם ולתת־הקבוצות
      שלה. מנהלי תת־קבוצה יכולים ליצור תגיות בעת תיוג תוכן בתת־הקבוצה
      שלהם. ההרשאה הקבוצתית **חברים יכולים ליצור תגיות**, שמופעלת כברירת מחדל,
      מאפשרת גם לחברים אחרים שיכולים לתייג שרשור או סקר ליצור שמות חדשים לתגיות. אם
      ההרשאה מושבתת, חברים עדיין יכולים להוסיף תגיות קיימות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7e06376f3431ad2f:
    english: To create a tag while starting a thread or poll, type its name in the **Tags** field and press Enter.
    translation: כדי ליצור תגית בעת פתיחת שרשור או סקר, יש להקליד את שמה בשדה **תגיות** וללחוץ על Enter.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
