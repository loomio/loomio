    translated_on: '2026-09-29'
  2f06a9491227b073:
    english: Loomio provides several ways to find discussions and decisions across your groups.
    translation: Loomio biedt verschillende manieren om discussies en besluiten in je groepen te vinden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  62c53ea4911e0c79:
    english: "## Search"
    translation: "## Zoeken"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  29cbb6f48ca978fa:
    english: The Search button in the top navigation bar opens global search from any page in Loomio.
    translation: Met de knop Zoeken in de bovenste navigatiebalk kun je vanaf elke pagina in Loomio zoeken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6286c9b6f2b16fc4:
    english: Search includes content you can access across all your groups and direct discussions. It can find discussion titles and context, comments, polls, votes, and outcomes.
    translation: Je kunt zoeken in inhoud waartoe je toegang hebt in al je groepen en directe discussies. Zoeken vindt titels en context van discussies, reacties, peilingen, stemmen en conclusies.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c5a77d75258a11e6:
    english: Enter a word or phrase, then press Enter or select the search icon. For example, searching for **bottle** finds Oatmilk Cooperative content containing that word.
    translation: Voer een woord of woordgroep in en druk op Enter of selecteer het zoekpictogram. Als je bijvoorbeeld zoekt naar **bottle**, vind je inhoud van Oatmilk Cooperative waarin dat woord voorkomt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1b93fd8aaf142d37:
    english: "### Search tips"
    translation: "### Zoektips"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  99f906ecbde3a538:
    english: "- Start with one or two distinctive words from the title or content you remember.\n- Search matches the beginning of a word, so a partial word such as **bott** can match **bottle**. \n- It will compensate for misspellings when results for the given query are very few.\n- Use the filters to limit results to an organization, subgroup, tag, or content type such as comments or polls.\n- Sort by **Best match** when relevance matters, or by newest or oldest when you know roughly when the content was posted."
    translation: "- Begin met een of twee opvallende woorden uit de titel of inhoud die je je herinnert.\n- De zoekfunctie herkent het begin van een woord. Een deel van een woord, zoals **bott**, kan dus **bottle** vinden. \n- Als je zoekopdracht weinig resultaten oplevert, houdt de zoekfunctie rekening met spelfouten.\n- Gebruik de filters om resultaten te beperken tot een organisatie, subgroep, label of inhoudstype, zoals reacties of peilingen.\n- Sorteer op **Beste overeenkomst** als relevantie belangrijk is, of op nieuwste of oudste als je ongeveer weet wanneer de inhoud is geplaatst."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e7c532f120c4807d:
    english: "## Filter discussions"
    translation: "## Discussies filteren"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  91bf7098343a1efa:
    english: Use the controls beside Search to filter discussions by open or closed status or by category tag. Combining a search term with a filter can narrow a long discussion list quickly.
    translation: Gebruik de opties naast Zoeken om discussies te filteren op open of gesloten status of op categorielabel. Combineer een zoekterm met een filter om een lange lijst met discussies snel te verkleinen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e3d2099d0e6fe6fa:
    english: "## Category tags"
    translation: "## Categorielabels"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  932506e53b51fac1:
    english: Tags group related discussions and polls under names chosen by your group, such as a project, team, or area of work.
    translation: Met labels groepeert je groep verwante discussies en peilingen, bijvoorbeeld per project, team of werkgebied.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d761f1c7397d8e51:
    english: Select a tag on the **Discussions** tab to show matching discussions. People with permission to start or edit discussions can apply tags. See [Category tags](/en/user_manual/discussions/tags) for setup and permission details.
    translation: Selecteer een label op het tabblad **Discussies** om bijbehorende discussies te tonen. Mensen die discussies mogen starten of bewerken, kunnen labels toevoegen. Zie [Categorielabels](/en/user_manual/discussions/tags) voor informatie over het instellen van labels en de bijbehorende rechten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b620c9f42e31a54f:
    english: "## Unread discussions"
    translation: "## Ongelezen discussies"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b2f3737cd46d903a:
    english: Select **Unread discussions** in the sidebar to see discussions with activity you have not read. Within a discussion, the timeline helps you move to unread items and important events.
    translation: Selecteer **Ongelezen discussies** in de zijbalk om discussies te zien met activiteit die je nog niet hebt gelezen. Binnen een discussie helpt de tijdlijn je om naar ongelezen onderdelen en belangrijke gebeurtenissen te gaan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e016a4cafcaee460:
    english: "## Polls awaiting your vote"
    translation: "## Peilingen waarop je nog kunt stemmen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  873929c0f1d06567:
    english: Select **Polls to vote on** in the sidebar to see active polls where you have been invited but have not yet voted. You can also open a group's **Polls** tab to see its active and closed polls.
    translation: Selecteer **Polls om op te stemmen** in de zijbalk om actieve peilingen te zien waarvoor je bent uitgenodigd, maar waarop je nog niet hebt gestemd. Je kunt ook het tabblad **Peilingen** van een groep openen om de actieve en gesloten peilingen van die groep te zien.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3bb08c3343e3efd7:
    english: "## Bookmarks"
    translation: "## Bladwijzers"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1bec2703cc5fe70a:
    english: Bookmark a discussion, comment, poll, vote, or outcome when you want to return to it. Open **Bookmarks** from your user menu to see everything you have saved. See [Bookmarks](/en/user_manual/users/bookmarks) for details.
    translation: Voeg een bladwijzer toe aan een discussie, reactie, peiling, stem of conclusie als je die later wilt terugvinden. Open **Bladwijzers** via je gebruikersmenu om alles te zien wat je hebt opgeslagen. Zie [Bladwijzers](/en/user_manual/users/bookmarks) voor meer informatie.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
