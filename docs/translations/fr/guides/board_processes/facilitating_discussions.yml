navigation_title: Animer les discussions
blocks:
  c377321bc013336b:
    english: "# Facilitating discussions"
    translation: "# Animer les discussions"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b771c6c746b8dc40:
    english: 'At times topics arise that require the attention of board or committee members mid-cycle, between meetings. '
    translation: Certains sujets demandent l’attention des membres du conseil d’administration ou d’un comité entre deux réunions.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b5fc5f12c8e44c40:
    english: And sometimes there is just not space during a meeting for discussion or to sufficiently deliberate on a decision.
    translation: Parfois, le temps manque en réunion pour discuter d’un sujet ou examiner suffisamment une décision.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  79f2f83380e195c4:
    english: "## On Loomio"
    translation: "## Sur Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  14d5e62d33996982:
    english: Use a Loomio **thread** to facilitate a discussion.  Give the thread a descriptive title that members will recognize and provide details in the thread context.  Add a relevant category tag to help members find the thread in future.
    translation: Utilisez une **discussion** Loomio pour faciliter les échanges. Donnez-lui un titre descriptif que les membres reconnaîtront et ajoutez les informations utiles dans son contexte. Ajoutez un mot-clé pertinent pour aider les membres à retrouver la discussion plus tard.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d35b4315f4e42cb:
    english: Notify members of the thread by inviting them, so they will receive a copy of the thread by email.  Members can participate in the discussion by clicking on the link to go to Loomio, or reply to the notification email and their comment will appear as a comment in the thread.
    translation: Invitez les membres à la discussion pour qu’ils en reçoivent une copie par e-mail. Ils peuvent participer en suivant le lien vers Loomio ou en répondant à l’e-mail de notification. Leur réponse apparaîtra alors comme un commentaire dans la discussion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f7d839f27c1a6f72:
    english: A Loomio thread enables you to attach files or link to online resources to support the discussion.
    translation: Dans une discussion Loomio, vous pouvez joindre des fichiers ou ajouter des liens vers des ressources en ligne pour étayer les échanges.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e45d25d90798cf1e:
    english: "Common examples include:\n- review and develop a policy\n- seek advice from the board about a topic or issue\n- discuss strategy \n- explore an idea or opportunity\n- assess risk"
    translation: |-
      Voici quelques exemples courants :
      - examiner et élaborer une politique
      - demander l’avis du conseil d’administration sur un sujet ou un problème
      - discuter de la stratégie
      - explorer une idée ou une possibilité
      - évaluer les risques
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  86ace2adbcf3df6f:
    english: "## Issues that arise between board meetings"
    translation: "## Sujets qui surviennent entre les réunions du conseil d’administration"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  48f6023950ee0729:
    english: 'A lot can happen in an organization between meetings, and most people rely on email to alert board members.  Trying to keep track of a discussion on email is tricky, with replies often lost in in-boxes and people left out.  '
    translation: 'Beaucoup de choses peuvent se produire dans une organisation entre deux réunions. La plupart des gens utilisent l’e-mail pour prévenir les membres du conseil d’administration. Il est difficile de suivre une discussion par e-mail : des réponses se perdent dans les boîtes de réception et certaines personnes sont oubliées.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1cb0e78c848b9621:
    english: "*“You can’t do governance by email!”, Richard Westlake (Westlake Governance).*"
    translation: "*« On ne peut pas assurer la gouvernance par e-mail ! », Richard Westlake (Westlake Governance).*"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  eddf348746c93b4c:
    english: 'When an issue arises requiring board attention, use a Loomio thread rather than email.  Members can reply via email and their comment will appear in the Loomio thread, keeping the discussion in one place. '
    translation: 'Lorsqu’un sujet demande l’attention du conseil d’administration, utilisez une discussion Loomio plutôt qu’un échange d’e-mails. Les membres peuvent répondre par e-mail : leurs commentaires apparaîtront dans la discussion Loomio, qui rassemble ainsi tous les échanges.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2f7ad89003f79fb8:
    english: |-
      Here's how:
      - Make the email subject line the title of your thread,
      - write your email content in the thread context,
      - invite your team to the thread with their email address or Loomio user name.
    translation: |-
      Voici comment faire :
      - Donnez à votre discussion le titre que vous auriez mis dans l’objet de l’e-mail,
      - placez le contenu de votre e-mail dans le contexte de la discussion,
      - invitez votre équipe à la discussion à l’aide de ses adresses e-mail ou de ses noms d’utilisateur Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9825cbb88dcedc3d:
    english: |-
      A Loomio thread means that:
      - All info about a topic is organized in one easily accessible place,
      - people can respond without generating reply/reply-all email chains that risk leaving people out,
      - you can see who has read the message and who needs a nudge,
      - you can progress actual work to an outcome, and cut down on the amount of email.
    translation: |-
      Avec une discussion Loomio :
      - toutes les informations sur un sujet sont rassemblées dans un lieu facile d’accès,
      - chacun peut répondre sans créer de chaînes d’e-mails qui risquent d’exclure certaines personnes,
      - vous pouvez voir qui a lu le message et qui a besoin d’un rappel,
      - vous pouvez faire avancer le travail jusqu’à une conclusion, tout en réduisant le nombre d’e-mails.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fb9adc7cb7922016:
    english: "## When there isn't space during meetings"
    translation: "## Quand le temps manque en réunion"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6b1c61424aa7e74b:
    english: When an agenda item cannot be resolved within the time available in your board meeting, you can move this for further discussion to Loomio. Direct people to the relevant thread, or start a new one and notify your board members.
    translation: Si le temps prévu en réunion ne suffit pas pour traiter un point de l’ordre du jour, poursuivez la discussion sur Loomio. Orientez les personnes vers la discussion concernée ou créez-en une et prévenez les membres du conseil d’administration.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ced9caddb281230f:
    english: This relieves pressure on your board, allows more time for information gathering, discussion and deeper reflection which often results in a better quality decision.
    translation: Cela réduit la pression sur le conseil d’administration et laisse davantage de temps pour recueillir des informations, discuter et réfléchir en profondeur. La décision peut ainsi être mieux éclairée.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
