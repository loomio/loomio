  b3a4dee73762bea4:
    english: "## Eligible voters and votes cast"
    translation: "## Eleitores elegíveis e votos lançados"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1d04d75fa16a2a18:
    english: The percentage can be based on either **Votes cast** or **Eligible voters**.
    translation: A porcentagem pode ser calculada com base em **Votos lançados** ou **Eleitores elegíveis**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  590e1a316f9ad174:
    english: "![Choosing whether a vote share requirement uses votes cast or eligible voters](./eligible-vs-cast.png)"
    translation: "![Escolha entre votos lançados e eleitores elegíveis para calcular o requisito de percentual de votos](./eligible-vs-cast.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d4c72d50982e071d:
    english: "**Eligible voters** means everyone who is able to vote in the proposal. **Votes cast** means only the votes that have been submitted."
    translation: "**Eleitores elegíveis** são todas as pessoas que podem votar na proposta. **Votos lançados** são apenas os votos enviados."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  24945a1a4f0d08e3:
    english: A requirement of 75 percent agreement from eligible voters can pass only when at least 75 percent of all eligible voters vote for that option.
    translation: Um requisito de apoio de 75% dos eleitores elegíveis só é atendido quando pelo menos 75% de todas as pessoas aptas a votar escolhem essa opção.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  14e4ff7cd000c7af:
    english: A requirement of 60 percent agreement from votes cast can pass when 60 percent of submitted votes support the option, regardless of overall turnout. Add a quorum when your process also requires a minimum level of participation.
    translation: Um requisito de apoio de 60% dos votos lançados pode ser atendido quando 60% dos votos enviados apoiam a opção, independentemente da participação total. Adicione um quórum se o seu processo também exigir um nível mínimo de participação.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a8f235434b40ecd9:
    english: "## Different vote share requirements"
    translation: "## Requisitos diferentes de percentual de votos"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6682c9656815bdbc:
    english: 'A proposal can have requirements on more than one option. For example:'
    translation: 'Uma proposta pode ter requisitos para mais de uma opção. Por exemplo:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dac1980305bef52d:
    english: |-
      - Agreement must be at least 75 percent of eligible voters
      - Abstention must be no more than 30 percent of votes cast
      - Block must be no more than 0 percent of votes cast
    translation: |-
      - A concordância deve alcançar pelo menos 75% dos eleitores elegíveis
      - A abstenção não deve ultrapassar 30% dos votos lançados
      - O bloqueio não deve ultrapassar 0% dos votos lançados
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  11325e607f603eb7:
    english: You can also add requirements to a [poll template](/en/user_manual/polls/poll_templates/) so that new proposals created from the template use them by default.
    translation: Você também pode adicionar requisitos a um [modelo de enquete](/en/user_manual/polls/poll_templates/) para que novas propostas criadas a partir dele usem esses requisitos por padrão.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
