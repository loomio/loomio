---
navigation_title: Einstellungen
blocks:
  145c23b2412eff98:
    english: "# Proposal and poll settings"
    translation: "# Einstellungen für Vorschläge und Abstimmungen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e0347d976f79179:
    english: "## Setting up a proposal or poll"
    translation: "## Einen Vorschlag oder eine Abstimmung einrichten"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e5d6f17041c19d41:
    english: "### Proposal and poll templates"
    translation: "### Vorlagen für Vorschläge und Abstimmungen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8913cabb2f1f8227:
    english: 'Choose the proposal template you want to use. '
    translation: Wähle die Vorlage für deinen Vorschlag aus.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3620f6321777ca50:
    english: "### Add content"
    translation: "### Inhalt hinzufügen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bc7ebb222e9ff4d1:
    english: "**Group:** Check that the correct group is selected for your proposal or poll."
    translation: "**Gruppe:** Prüfe, ob für deinen Vorschlag oder deine Abstimmung die richtige Gruppe ausgewählt ist."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3a1d375da02f3a49:
    english: "**Title:** Give your proposal or poll a short, relevant title."
    translation: "**Titel:** Gib deinem Vorschlag oder deiner Abstimmung einen kurzen, passenden Titel."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a62a7e63f9db295c:
    english: "**Details:** Explain what you are asking of people and include enough details so everyone knows what it means to vote.  "
    translation: "**Details:** Erkläre, worüber die Menschen abstimmen sollen. Gib genügend Informationen an, damit alle verstehen, was ihre Stimme bedeutet."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e17c2ab4878716f2:
    english: The predefined templates include some prompts to help you write a good proposal - use these or add your own details.
    translation: Die vordefinierten Vorlagen enthalten Anregungen für einen guten Vorschlag. Nutze sie oder ergänze eigene Details.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  74daa7f0cc476971:
    english: Avoid combining a range of ideas in one proposal, because people might agree to some aspects but not others and be unsure how to respond. You can break complex decisions down into multiple proposals.
    translation: Fasse möglichst nicht mehrere Ideen in einem Vorschlag zusammen. Menschen könnten einigen Punkten zustimmen und anderen nicht und deshalb unsicher sein, wie sie abstimmen sollen. Teile komplexe Entscheidungen bei Bedarf in mehrere Vorschläge auf.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0da6e449688940bb:
    english: When making a proposal, state your expectations and describe the impact the proposal will have if adopted. If it's a formal or binding proposal it's often worth describing what it means if the proposal is not adopted.
    translation: Beschreibe in deinem Vorschlag, was du erwartest und welche Auswirkungen die Annahme hätte. Bei einem formellen oder verbindlichen Vorschlag ist es oft sinnvoll, auch die Folgen einer Ablehnung zu beschreiben.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a6db66b75f495e21:
    english: Use the formatting tools to support your poll.  For example, attach a document file with the paperclip icon, insert an image, link to a website or online document, or even embed a video.
    translation: Nutze die Formatierungswerkzeuge, um deine Abstimmung zu ergänzen. Du kannst zum Beispiel über das Büroklammersymbol ein Dokument anhängen, ein Bild einfügen, auf eine Website oder ein Onlinedokument verlinken oder ein Video einbetten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f4f85f131878c36d:
    english: "### Voting options"
    translation: "### Abstimmungsoptionen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  616aab74af2072ba:
    english: Each proposal and poll template provides options for voting.
    translation: Jede Vorlage für Vorschläge und Abstimmungen enthält Abstimmungsoptionen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7a85de7eefe74178:
    english: Depending on the template, you can edit, remove, reorder, or add voting options to suit the decision process you are running.
    translation: Je nach Vorlage kannst du Abstimmungsoptionen bearbeiten, entfernen, neu anordnen oder hinzufügen, damit sie zu deinem Entscheidungsprozess passen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9bc44bf4b28ac5d8:
    english: "- Use the pencil icon to edit voting option \n- Use the trash can icon to remove unwanted voting options\n- Use the handle to move the order of voting options\n- Add voting options with **Add option** when the template allows custom options"
    translation: |-
      - Bearbeite eine Abstimmungsoption mit dem Stiftsymbol
      - Entferne unerwünschte Abstimmungsoptionen mit dem Papierkorbsymbol
      - Ändere die Reihenfolge der Abstimmungsoptionen über den Ziehgriff
      - Füge mit **Option hinzufügen** weitere Abstimmungsoptionen hinzu, wenn die Vorlage eigene Optionen erlaubt
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2062f39334fbd629:
    english: |-
      ### Edit voting options
      There is a lot of flexibility to configure voting options to suit the way your organization makes decisions.
    translation: |-
      ### Abstimmungsoptionen bearbeiten
      Du kannst Abstimmungsoptionen so einstellen, dass sie zur Entscheidungsfindung in deiner Organisation passen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5ac5b47c81fe187b:
    english: 'Use the pencil icon alongside the voting option to open the edit modal:'
    translation: 'Klicke neben einer Abstimmungsoption auf das Stiftsymbol, um das Bearbeitungsfenster zu öffnen:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3c791f8140ad3b39:
    english: "**Option name:** A short name for the option."
    translation: "**Optionsname:** Ein kurzer Name für die Option."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  77a0fb7409cf1711:
    english: "**Icon:** Select an icon for the option, such as thumbs up, thumbs down, abstain, or block."
    translation: "**Symbol:** Wähle ein Symbol für die Option, etwa Daumen hoch, Daumen runter, Enthaltung oder Veto."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9126ee91e5d1cb95:
    english: "**Meaning:** A sentence that explains what choosing this options means."
    translation: "**Bedeutung:** Ein Satz, der erklärt, was die Wahl dieser Option bedeutet."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e88d83b93ba47666:
    english: "**Reason prompt:** A question to prompt voters to provide their reasoning or reconsider their position. "
    translation: "**Begründungsfrage:** Eine Frage, die Abstimmende dazu anregt, ihre Entscheidung zu begründen oder ihre Position zu überdenken."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d05197892ea46087:
    english: "### Opening time"
    translation: "### Beginn der Abstimmung"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1b56f0ad52a3aed8:
    english: By default, voting opens immediately when you create the poll. If you want to schedule voting to open at a later time, uncheck **Voting opens immediately** and select an opening date and time.
    translation: Standardmäßig beginnt die Abstimmung sofort, wenn du sie erstellst. Soll sie später beginnen, deaktiviere **Die Abstimmung beginnt sofort.** und wähle ein Datum und eine Uhrzeit für den Beginn aus.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  48ccc43734b062eb:
    english: This is useful to give time for discussion before voting opens, or to ensure a poll or proposal is correctly set up and scheduled to happen at the right time.
    translation: So bleibt vor Beginn der Abstimmung Zeit für die Diskussion. Du kannst auch sicherstellen, dass der Vorschlag oder die Abstimmung richtig eingerichtet ist und zum gewünschten Zeitpunkt beginnt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b68fccc3132988ff:
    english: When a poll has a scheduled opening time, you can add voters before voting opens. Voters will be notified when voting opens, rather than when they are added.
    translation: Wenn du einen Beginn festgelegt hast, kannst du schon vorher Abstimmende hinzufügen. Sie werden benachrichtigt, wenn die Abstimmung beginnt, nicht wenn du sie hinzufügst.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  82d4cacfa780dd98:
    english: "**Notify voters when poll opens:** When checked (default), all voters will receive a notification when voting opens. Uncheck this if you want to open voting without sending notifications."
    translation: "**Abstimmende benachrichtigen, wenn die Abstimmung beginnt:** Ist diese Option aktiviert (Standardeinstellung), erhalten alle Abstimmenden zum Beginn eine Benachrichtigung. Deaktiviere sie, wenn die Abstimmung ohne Benachrichtigungen beginnen soll."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d084620657803f93:
    english: "**Closing date and time:** Select the closing date and time for your poll."
    translation: "**Enddatum und -uhrzeit:** Wähle aus, wann deine Abstimmung endet."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c0472419a2671222:
    english: Give sufficient time for people to vote. You could time the proposal so it closes before a meeting, or avoid closing over a weekend, so that people will receive a timely reminder. If necessary, you can close the poll early or extend the closing time.
    translation: Gib den Menschen genügend Zeit zum Abstimmen. Du kannst einen Vorschlag vor einem Treffen enden lassen oder vermeiden, dass die Abstimmung am Wochenende endet. So erhalten die Menschen rechtzeitig eine Erinnerung. Bei Bedarf kannst du die Abstimmung früher schließen oder die Frist verlängern.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c87f87e6cbc1a4d7:
    english: "**Who can vote?** Invite everyone in the group or only specific people that you invite."
    translation: "**Wer darf wählen?** Lade alle Mitglieder der Gruppe oder nur bestimmte Personen ein."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e02a9cefc3082334:
    english: |-
      You can later add people to an 'Invite people only' poll. For identified polls,
      you can also remove people who should no longer be eligible to vote. People
      cannot be removed from an anonymous poll.
    translation: |-
      Du kannst später weitere Personen zu einer Abstimmung hinzufügen, an der nur Eingeladene teilnehmen dürfen. Bei nicht anonymen Abstimmungen
      kannst du auch Personen entfernen, die nicht mehr abstimmen dürfen. Aus einer anonymen Abstimmung
      können Personen nicht entfernt werden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2e959157d75ed7bd:
    english: "## More settings"
    translation: "## Weitere Einstellungen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3d4443d3e6d3b13d:
    english: |-
      ### Reminder
      Send a 'Closing soon' notification 24 hours before the poll closes. This can be an opportunity for people to see how others have voted and reconsider their own vote, or just a way to increase participation in the poll.
    translation: |-
      ### Erinnerung
      Sende 24 Stunden vor dem Ende der Abstimmung eine Benachrichtigung, dass sie bald schließt. So können die Menschen sehen, wie andere abgestimmt haben, und ihre eigene Stimme überdenken. Eine Erinnerung kann auch die Beteiligung erhöhen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  62067c0573d7a64e:
    english: |-
      Setting options:
      - Nobody
      - Author
      - Undecided voters (default)
      - All voters
    translation: |-
      Einstellungsoptionen:
      - Niemand
      - Autor
      - Abstimmende, die noch nicht gewählt haben (Standardeinstellung)
      - Alle Abstimmenden
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6cd67c3f92302551:
    english: |-
      For an anonymous poll lasting at least 24 hours, Loomio automatically reminds
      eligible people who have not voted during the final 24 hours. This reminder
      cannot be changed in the poll settings.
    translation: |-
      Bei einer anonymen Abstimmung, die mindestens 24 Stunden dauert, erinnert Loomio
      stimmberechtigte Personen, die noch nicht abgestimmt haben, automatisch in den letzten 24 Stunden. Diese Erinnerung
      kannst du in den Abstimmungseinstellungen nicht ändern.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72f172271e2a636a:
    english: |-
      ### Anonymous voting
      If enabled, votes are stored separately from voter identities. Results appear after voting closes, and voters cannot add reasons, review their submitted vote, or change it.
    translation: |-
      ### Anonyme Abstimmung
      Wenn diese Einstellung aktiviert ist, werden Stimmen getrennt von den Identitäten der Abstimmenden gespeichert. Die Ergebnisse erscheinen nach Ende der Abstimmung. Abstimmende können keine Begründung hinzufügen und ihre abgegebene Stimme weder einsehen noch ändern.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3393027493510f2f:
    english: See [Anonymous voting](/en/user_manual/polls/anonymous_voting) for details about how voter identities are separated from submitted votes, what information is retained, and the limits of the protection.
    translation: Unter [Anonyme Abstimmung](/en/user_manual/polls/anonymous_voting) erfährst du, wie die Identitäten der Abstimmenden von ihren Stimmen getrennt werden, welche Informationen gespeichert bleiben und wo die Grenzen dieses Schutzes liegen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b731b9118e48dee5:
    english: |-
      > [!WARNING]
      > Once a poll has started you cannot edit the poll to make it anonymous or to undo the anonymous setting.
    translation: |-
      > [!WARNING]
      > Sobald eine Abstimmung begonnen hat, kannst du die Anonymität weder nachträglich aktivieren noch deaktivieren.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e8660d089a3c07bb:
    english: |-
      > [!WARNING]
      > You cannot re-open an anonymous poll after it has closed. Submitted votes are not linked to the participation records that show who has voted.
    translation: |-
      > [!WARNING]
      > Eine geschlossene anonyme Abstimmung kannst du nicht erneut öffnen. Abgegebene Stimmen sind nicht mit den Teilnahmeaufzeichnungen verknüpft, aus denen hervorgeht, wer abgestimmt hat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  aaaaa28a4b435835:
    english: |-
      ### Vote reason
      It can be helpful to understand why people voted the way they did. With this setting, you can prompt people to share their thoughts when they vote.
    translation: |-
      ### Begründung der Stimmabgabe
      Es kann hilfreich sein zu verstehen, warum Menschen so abgestimmt haben. Mit dieser Einstellung kannst du sie beim Abstimmen um ihre Gedanken bitten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  309645182b157738:
    english: 'Available settings depend on the template:'
    translation: 'Die verfügbaren Einstellungen hängen von der Vorlage ab:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d67e2c2914e91a6f:
    english: |-
      - **Optional** lets voters choose whether to give a reason
      - **Required for disagree or block** requires a reason when the selected option
        uses the Disagree or Block voting icon
      - **Required for block** requires a reason when the selected option uses the
        Block voting icon
      - **Required** requires every voter to give a reason
      - **Disabled** removes the vote-reason field
    translation: |-
      - **Optional** lässt Abstimmende entscheiden, ob sie eine Begründung angeben
      - **Erforderlich, um abzulehnen oder zu blockieren** verlangt eine Begründung, wenn die gewählte Option
        das Abstimmungssymbol für Ablehnung oder Veto verwendet
      - **Erforderlich bei einem Veto** verlangt eine Begründung, wenn die gewählte Option
        das Abstimmungssymbol für ein Veto verwendet
      - **Erforderlich** verlangt von allen Abstimmenden eine Begründung
      - **Deaktiviert** entfernt das Feld für die Begründung
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  af5e7c0557aec611:
    english: |-
      The conditional settings follow the voting icon rather than the option name.
      They still apply if you rename Disagree to a term such as Objection. The
      Consent template defaults to **Required for disagree or block**, while the
      Consensus template defaults to **Required for block**. Other templates default
      to **Optional**, except Question rounds where the response itself is required.
      The poll author can change the setting for an individual poll.
    translation: |-
      Die bedingten Einstellungen richten sich nach dem Abstimmungssymbol, nicht nach dem Namen der Option.
      Sie gelten auch, wenn du „Ablehnen“ beispielsweise in „Einwand“ umbenennst. Bei der
      Vorlage „Consent“ ist **Erforderlich, um abzulehnen oder zu blockieren** voreingestellt, bei der
      Vorlage „Consensus“ **Erforderlich bei einem Veto**. Für andere Vorlagen ist standardmäßig
      **Optional** eingestellt, außer bei Fragerunden, in denen die Antwort selbst erforderlich ist.
      Wer die Umfrage erstellt hat, kann die Einstellung für jede Umfrage ändern.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ecb0d89c623db459:
    english: "**Limit reason to maximum 500 characters:** Keeping vote reasons short makes them easier to understand. A collection of concise reasons is a great resource for making a decision.  This setting is ticked by default. Untick to allow for longer reasons."
    translation: "**Begründung auf maximal 500 Zeichen begrenzen:** Kurze Begründungen sind leichter zu verstehen. Eine Sammlung knapper Begründungen hilft bei der Entscheidung. Diese Einstellung ist standardmäßig aktiviert. Deaktiviere sie, um längere Begründungen zuzulassen."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  35bd4f116b9ff26a:
    english: |-
      ### Hide results
      If you want people to vote without knowing how others have voted, you can hide the results of the poll.  Useful if you do not want people to be affected by how other people have voted.
    translation: |-
      ### Ergebnisse verbergen
      Du kannst die Ergebnisse der Umfrage verbergen, damit Menschen abstimmen können, ohne die Stimmen anderer zu kennen. So werden sie bei ihrer Entscheidung nicht von anderen Stimmen beeinflusst.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8cc5b82f4cc5e94e:
    english: |-
      Setting options:
      - Do not hide results
      - Hide results until a vote is cast
      - Hide results until voting closes
    translation: |-
      Einstellungsoptionen:
      - Ergebnisse nicht verbergen
      - Ergebnisse verbergen, bis eine Stimme abgegeben wurde
      - Ergebnisse verbergen, bis die Abstimmung endet
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4be103ffd97e7e8f:
    english: While results are hidden, nobody can reply to votes. Replies to votes open when voting closes.
    translation: Solange die Ergebnisse verborgen sind, kann niemand auf Stimmen antworten. Antworten auf Stimmen sind möglich, sobald die Abstimmung endet.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a488ebe6712a5e1d:
    english: If results are hidden until a vote is cast, vote before you print or export the thread as Markdown.
    translation: Wenn die Ergebnisse bis zur Stimmabgabe verborgen sind, stimme ab, bevor du den Thread druckst oder als Markdown exportierst.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1e5a1eb47ee3d99d:
    english: |-
      Anonymous polls always hide results until voting closes. The STV Election
      template enables anonymous voting by default.
    translation: |-
      Bei anonymen Umfragen bleiben die Ergebnisse immer bis zum Ende der Abstimmung verborgen. Die Vorlage für
      STV-Wahlen aktiviert anonyme Abstimmungen standardmäßig.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8e7d8e81db57f4f8:
    english: |-
      ### Start the poll
      Select the **Start proposal** or **Start poll** button.
    translation: |-
      ### Umfrage starten
      Wähle **Abstimmung starten** oder **Umfrage starten**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b1ee90012c240ef5:
    english: "## Managing polls"
    translation: "## Umfragen verwalten"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0b5f754660efb4da:
    english: Open the three-dot menu at the bottom right of the poll.
    translation: Öffne das Menü mit den drei Punkten unten rechts an der Umfrage.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cc2325791d155b04:
    english: "### Edit poll"
    translation: "### Umfrage bearbeiten"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8d5ecd0352b5caf8:
    english: Use **Edit poll** to edit poll content or settings.   You can not change voting options once voting commences.
    translation: Mit **Umfrage bearbeiten** kannst du den Inhalt oder die Einstellungen der Umfrage ändern. Sobald die Abstimmung begonnen hat, kannst du die Abstimmungsoptionen nicht mehr ändern.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  84d18e91493020d4:
    english: "### Make a copy"
    translation: "### Eine Kopie machen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  071c2438f8e5315f:
    english: Use **Make a copy** to create a new poll using the current poll and settings as a starting point.
    translation: Mit **Eine Kopie machen** erstellst du eine neue Umfrage auf Grundlage der aktuellen Umfrage und ihrer Einstellungen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3c42dde555e8a245:
    english: "### Notification history"
    translation: "### Benachrichtigungsverlauf"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3e750b3f37e8ddf1:
    english: "**Notification history** shows who was notified and whether each notification has been read."
    translation: Der **Benachrichtigungsverlauf** zeigt, wer benachrichtigt wurde und ob die jeweilige Benachrichtigung gelesen wurde.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d78b253bae2aecc7:
    english: "### Export poll"
    translation: "### Umfrage exportieren"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  17e6fd426afa3b4d:
