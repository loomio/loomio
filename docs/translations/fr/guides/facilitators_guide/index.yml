  980342866ab7bee6:
    english: An in-depth guide to applying key facilitation concepts in the online space.
    translation: Un guide approfondi pour appliquer les principes de la facilitation en ligne.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ac8728f5ce2ea8ce:
    english: Loomio is made by facilitators, and that plays a huge role in how it has been designed. This guide is about revealing more of that context, and translating facilitation concepts from the offline space to the online space.
    translation: Loomio a été créé par des personnes qui pratiquent la facilitation, et cette expérience a largement influencé sa conception. Ce guide présente ce contexte et montre comment appliquer en ligne des principes de facilitation utilisés en présentiel.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e802660a44da1775:
    english: "## More about this guide"
    translation: "## À propos de ce guide"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5cbd64dba51ca485:
    english: Whether employed by a professional facilitator, people peer-facilitating each other, or a group that has no awareness of facilitation at all, Loomio’s essential function is to mediate and support group communication toward a desired outcome. In other words, facilitation.
    translation: Qu’il soit utilisé par une personne dont la facilitation est le métier, par des personnes qui s’entraident dans ce rôle ou par un groupe sans expérience de la facilitation, Loomio aide les groupes à communiquer et à avancer vers un objectif commun. C’est le rôle de la facilitation.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  25a956280b647fa6:
    english: 'Loomio is *groupware*:'
    translation: 'Loomio est un *logiciel collaboratif* :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  33e304be58a0a55b:
    english: "> Collaborative software, or groupware, is designed to help people involved in a common task achieve their goals. One of the earliest definitions of collaborative software is “intentional group processes plus software to support them.” -- Wikipedia"
    translation: "> Un logiciel collaboratif aide les personnes qui travaillent sur une tâche commune à atteindre leurs objectifs. Selon l’une des premières définitions, il associe « des processus de groupe intentionnels et des logiciels qui les soutiennent ». -- Wikipédia"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  170a0b463e1ad8ca:
    english: There is a huge body of knowledge, best practice, and tradition in both in-person facilitation and online moderation, but the art and science of their intersection is only just emerging. This is the specific space where Loomio strives to excel.
    translation: La facilitation en présentiel et la modération en ligne s’appuient chacune sur de nombreux savoirs, pratiques et traditions. Leur rencontre reste un domaine en développement. C’est dans ce domaine que Loomio cherche à être utile.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
