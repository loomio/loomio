  5cf665a54aa4a09d:
    english: "### Tabs"
    translation: "### Onglets"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cdd3c098983b6066:
    english: 'The tabs under the group description provide access to:'
    translation: 'Les onglets sous la description du groupe donnent accès aux éléments suivants :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  02760342b07f5ff4:
    english: "**Discussions** - The group's discussion threads and recent activity."
    translation: "**Discussions** - Les fils de discussion du groupe et son activité récente."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e2c7a0c137330c27:
    english: "**Polls** - A list of polls active in your group."
    translation: "**Sondages** - La liste des sondages en cours dans votre groupe."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '085bd9dfce8144dc':
    english: "**Members** - The people who belong to the group."
    translation: "**Membres** - Les personnes qui font partie du groupe."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cfdb369a7fd6e14f:
    english: "**Files** - Documents and other files attached throughout the group. The tab collects files from discussion contexts, comments, proposals, and polls, so you can find a document without remembering where it was attached."
    translation: "**Fichiers** - Les documents et autres fichiers joints dans le groupe. Cet onglet rassemble les fichiers joints aux contextes des discussions, aux commentaires, aux propositions et aux sondages. Vous pouvez ainsi retrouver un document sans vous souvenir de l’endroit où il a été joint."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6483153cbc12b458:
    english: See [Finding content](/en/user_manual/overview/finding-content) for help with search, filters, tags, bookmarks, and unread discussions.
    translation: Consultez [Trouver du contenu](/en/user_manual/overview/finding-content) pour en savoir plus sur la recherche, les filtres, les étiquettes, les favoris et les discussions non lues.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
