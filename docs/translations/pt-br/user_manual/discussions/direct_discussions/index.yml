  b3ed13f5612f4ff9:
    english: A direct discussion is a private discussion for a specific set of people.
    translation: Uma discussão direta é uma discussão privada entre pessoas específicas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  479f7faed056ab51:
    english: A direct discussion does not belong to a group. Invited people do not need to be a member of your Loomio group.
    translation: Uma discussão direta não pertence a um grupo. As pessoas convidadas não precisam ser membros do seu grupo no Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2f5362faecc07fa0:
    english: You control who can see and participate by adding people or email addresses to the **Invite** field.
    translation: Você controla quem pode ver e participar da discussão ao adicionar pessoas ou endereços de e-mail ao campo **Convidar**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f31343ea54b4f899:
    english: Direct discussions support the same comments, polls and other tools as group discussions. They can be useful when creating a subgroup is unnecessary.
    translation: As discussões diretas oferecem os mesmos comentários, enquetes e outros recursos das discussões em grupo. Elas são úteis quando não é necessário criar um subgrupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
