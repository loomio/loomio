  '099449b0e1fe4f85':
    english: Loomio also includes a Question round for collecting questions without voting. Group administrators can make it available from [Poll templates](/en/user_manual/polls/poll_templates/).
    translation: A Loomióban kérdéskört is indíthatsz, amelyben szavazás nélkül gyűjthetsz kérdéseket. A csoportadminisztrátorok a [szavazási sablonoknál](/en/user_manual/polls/poll_templates/) tehetik elérhetővé.
