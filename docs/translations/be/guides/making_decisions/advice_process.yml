    english: This guide describes the complete Advice process. For help setting up and interpreting one Advice proposal, see [Advice](/en/user_manual/polls/proposals/advice/).
    translation: Гэта кіраўніцтва апісвае ўвесь працэс кансультавання. Пра тое, як стварыць асобную прапанову для кансультавання і зразумець яе вынікі, чытайце ў раздзеле [Кансультаванне](/en/user_manual/polls/proposals/advice/).
    status: machine
