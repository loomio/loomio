  580a24a283790875:
    english: This guide describes the complete Advice process. For help setting up and interpreting one Advice proposal, see [Advice](/en/user_manual/polls/proposals/advice/).
    translation: Цей посібник описує весь процес консультування. Якщо вам потрібна допомога зі створенням окремої пропозиції для консультування та тлумаченням її результатів, дивіться [Консультування](/en/user_manual/polls/proposals/advice/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b625cc22d87fc038:
    english: "![Photo of yoda implying sage advice - *Photo by Nadir sYzYgY on Unsplash*](nadir-syzygy-den6gTowZKs-unsplash.jpg)"
    translation: "![Фото Йоди, який дає мудру пораду — *Фото Nadir sYzYgY на Unsplash*](nadir-syzygy-den6gTowZKs-unsplash.jpg)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aa1feddec315ed04:
    english: Seek advice on a decision you need to make.
    translation: Попросіть поради щодо рішення, яке вам потрібно ухвалити.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  abd59b5e28c00123:
    english: Make a decision with the advice of people impacted or who have expertise, so you can make a better decision for your organization.
    translation: Врахуйте поради людей, яких стосується рішення, і тих, хто має відповідний досвід. Це допоможе вам ухвалити краще рішення для своєї організації.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fce0c96bcc92d0aa:
    english: "> *“With the advice process, any person can make any decision but must seek advice from affected parties and people with expertise.” - Frederick Laloux, Reinventing Organizations.*"
    translation: "> *«У процесі консультування кожна людина може ухвалити будь-яке рішення, але має попросити поради в тих, кого воно стосується, і в людей із відповідним досвідом». — Фредерік Лалу, «Організації майбутнього».*"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  66f32f2b3cf56e0d:
    english: |-
      ## Key points
      - Freedom to make a decision.
      - Invite people to offer their advice.
      - Take into account other people’s voices.
    translation: |-
      ## Основні принципи
      - Свобода ухвалювати рішення.
      - Запрошення інших людей поділитися порадами.
      - Врахування думок інших людей.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  54d4f1ac3c2bd91f:
    english: |-
      ## Steps in the Advice process
      You notice a problem or opportunity and take the initiative.
      1. Frame the decision, identify who owns it, and invite the affected people and relevant experts.
      2. Start a Loomio **discussion** and, when a structured response or deadline is useful, run an **Advice proposal**.
      3. Clarify and build on the advice through vote reasons and discussion comments.
      4. Make the decision, then publish an **outcome** explaining what was decided and how the advice informed it.
    translation: |-
      ## Кроки процесу консультування
      Ви помічаєте проблему або можливість і берете ініціативу на себе.
      1. Сформулюйте рішення, визначте, хто його ухвалюватиме, і запросіть людей, яких воно стосується, та фахівців із відповідним досвідом.
      2. Розпочніть **обговорення** в Loomio. Якщо потрібні структуровані відповіді або кінцевий термін, створіть **пропозицію для консультування**.
      3. Уточнюйте поради й розвивайте їх, обговорюючи причини голосів і коментарі.
      4. Ухваліть рішення, а потім опублікуйте **висновок**: поясніть, що вирішили та як поради вплинули на рішення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6088bbd1e12e8920:
    english: "## Benefits\n- Advice helps you make a better decision for your organization. \n- Foster relationships, learning opportunities and diverse input.\n- Stimulate initiative and creativity, and more enjoyable work."
    translation: "## Переваги\n- Поради допомагають ухвалити краще рішення для вашої організації. \n- Процес зміцнює стосунки, дає змогу вчитися одне в одного та почути різні думки.\n- Він заохочує ініціативу й творчість і робить роботу приємнішою."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0b6fc6b802feebda:
    english: "## Applying the Advice process on Loomio"
    translation: "## Як застосувати процес консультування в Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a0a3c706db8ca405:
    english: "| **Advice process** | **On Loomio** |\n|---|---|\n| You notice a problem or opportunity and take the initiative. |  |\n| Seek input to sound out perspectives before proposing action. | Start a Loomio **discussion** to provide context and open conversation. Run an **[Advice proposal](/en/user_manual/polls/proposals/advice/)** when you want a defined response period, vote reasons, and a clear record of who participated. |\n| Taking advice received into account, you make a decision and inform the people who have given advice. | Add an an **outcome** to the discussion thread.   <br /><br />State the decision made and thank people for their advice and feedback.  <br /><br />   Say what will happen next and notify people about the outcome.  <br /><br />The outcome statement is an important record of the decision for future reference. <br /> <br /> Either update the context to include this outcome, or state it in a comment you pin to the timeline to quickly find it in the future.<br /><br/> |        "
    translation: |-
      | **Процес консультування** | **У Loomio** |
      |---|---|
      | Ви помічаєте проблему або можливість і берете ініціативу на себе. |  |
      | Попросіть інших поділитися думками, перш ніж пропонувати дію. | Розпочніть **обговорення** в Loomio, щоб надати контекст і відкрити розмову. Створіть **[пропозицію для консультування](/en/user_manual/polls/proposals/advice/)**, якщо потрібні визначений період для відповідей, пояснення голосів і чіткий запис про те, хто взяв участь. |
      | Врахуйте отримані поради, ухваліть рішення та повідомте про нього людей, які дали поради. | Додайте **висновок** до теми обговорення.   <br /><br />Опишіть ухвалене рішення та подякуйте людям за поради й відгуки.  <br /><br />   Розкажіть, що відбудеться далі, і повідомте людей про висновок.  <br /><br />Висновок зберігає рішення, щоб до нього можна було повернутися згодом. <br /> <br /> Додайте висновок до контексту або викладіть його в коментарі, який закріпите на часовій шкалі для швидкого пошуку.<br /><br/> |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f303a5de08c09a87:
    english: "## Example of an Advice process on Loomio"
    translation: "## Приклад процесу консультування в Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  12055e74d3733a99:
    english: "### Step 0 - You notice a problem or opportunity and take the initiative."
    translation: "### Крок 0 — Ви помічаєте проблему або можливість і берете ініціативу на себе."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  77f49576383e36ca:
    english: Is the problem or opportunity is worth pursuing?  Takashi is experiencing problems with his old computer, and it crashed during a recent presentation.
    translation: Чи варто зайнятися цією проблемою або можливістю?  У Такаші виникають проблеми зі старим комп’ютером. Під час нещодавньої презентації він перестав працювати.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  997d519afbb87519:
    english: Is there a decision to be made?  It's time to replace the computer.
    translation: Чи потрібно ухвалити рішення?  Настав час замінити комп’ютер.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fea51a2c49fc3f27:
    english: Does it impact other people and your organization?  Takashi's colleagues want him to perform his role effectively, not waste time in meetings, and so appreciate he needs a working computer.  Purchase of a piece of equipment also impacts on the organization budget, purchasing policies and may need to be aligned with other team members.
    translation: Чи впливає це на інших людей і вашу організацію?  Колеги Такаші хочуть, щоб він міг ефективно виконувати свою роботу й не втрачав час під час зустрічей. Вони розуміють, що йому потрібен справний комп’ютер.  Купівля обладнання також впливає на бюджет організації та її правила закупівель. Можливо, її потрібно узгодити з іншими членами команди.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  93da70b78b1d57ff:
    english: "### Step 1. Seek input to sound out perspectives before proposing action"
    translation: "### Крок 1. Попросіть інших поділитися думками, перш ніж пропонувати дію"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  105886bcb6f7807b:
    english: Takashi starts a Loomio discussion with a clear statement of the decision he needs to make.  He provides some context to open a discussion, that he is starting an advice process.
    translation: Такаші починає обговорення в Loomio й чітко описує рішення, яке йому потрібно ухвалити.  Щоб розпочати розмову, він надає контекст і повідомляє, що починає процес консультування.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5dbbbc9ad1569679:
    english: He can also run an [Advice proposal](/en/user_manual/polls/proposals/advice/) in the discussion to request structured responses by a closing date.
    translation: Він також може створити в обговоренні [пропозицію для консультування](/en/user_manual/polls/proposals/advice/), щоб отримати структуровані відповіді до дати завершення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1c0ef4c1e9221705:
    english: "### Step 2.  Clarify and strengthen the advice through discussion"
    translation: "### Крок 2.  Уточніть і доповніть поради під час обговорення"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ed50411e67d1df0a:
    english: Takashi replies to advice given in comments in the discussion thread, clarifying his situation and asking questions to expand on the advice given.
    translation: Такаші відповідає на поради в коментарях до теми обговорення. Він уточнює свою ситуацію та ставить запитання, щоб дізнатися більше.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b27279b9ea3b1f0a:
    english: As people offer advice and comments, Takashi grows resolved in his decision.
    translation: Коли люди діляться порадами й коментарями, Такаші поступово визначається з рішенням.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f3a820171554b2c9:
    english: "### Step 3. Make a decision with advice and inform people"
    translation: "### Крок 3. Ухваліть рішення з урахуванням порад і повідомте людей"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8a0d4bfcbc87c5bb:
    english: When everyone has offered advice, or the proposal closes, Takashi makes a decision and states the **[outcome](/en/user_manual/polls/outcomes/)**.
    translation: Коли всі охочі поділилися порадами або пропозиція завершилася, Такаші ухвалює рішення й публікує **[висновок](/en/user_manual/polls/outcomes/)**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e638fad69da59644:
    english: The outcome is a clear statement of the decision made and what will happen next. It  becomes an important record for the organization.
    translation: Висновок чітко описує ухвалене рішення та подальші дії. Він стає важливим записом для організації.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  05eae3956cc1a84d:
    english: Takashi edits the discussion context to include this outcome.
    translation: Такаші редагує контекст обговорення й додає до нього висновок.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5289a72f0eed9bd9:
    english: Alternatively, he could state it in a comment that he pins to the thread, so the outcome appears prominently in the discussion timeline.
    translation: Також він міг би викласти висновок у коментарі й закріпити його в темі, щоб він був помітним на часовій шкалі обговорення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
