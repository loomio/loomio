navigation_title: מחיקת הקבוצה
blocks:
  6e0bf431fbefa0d3:
    english: "# Deleting your group"
    translation: "# מחיקת הקבוצה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f8e8d1ee802cae90:
    english: 'Deleting your Loomio group initiates a process to permanently delete all group data. '
    translation: מחיקת קבוצה ב-Loomio מתחילה תהליך למחיקה לצמיתות של כל נתוני הקבוצה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  214aa96eca0b90ca:
    english: If there is any data you wish to retain, make sure you [export group data](/en/user_manual/groups/data_export/) and manually download any important files you have uploaded before you continue.
    translation: כדי לשמור נתונים כלשהם, יש [לייצא את נתוני הקבוצה](/en/user_manual/groups/data_export/) ולהוריד ידנית קבצים חשובים שהועלו לפני שממשיכים.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  181fecc458dcc49d:
    english: Open the group drop down menu by clicking on the three dots, and select the **Delete group** option to remove access to the group and to initiate deletion of all group data from our records. You must be an admin to delete a group.
    translation: כדי לפתוח את התפריט הנפתח של הקבוצה, יש ללחוץ על שלוש הנקודות ולבחור באפשרות **מחק קבוצה**. הבחירה מסירה את הגישה לקבוצה ומתחילה את מחיקת כל נתוניה מהרשומות שלנו. רק מנהלי קבוצה יכולים למחוק קבוצה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f5178957964c2bc0:
    english: When you delete a group, it is removed from view immediately and will be permanently deleted after 90 days. You and group members immediately lose access to the group. If a mistake was made, contact us within 90 days of deleting your group to request restoration.
    translation: לאחר מחיקת קבוצה, היא נעלמת מהתצוגה מיד ונמחקת לצמיתות כעבור 90 יום. הגישה לקבוצה נשללת מיד מכל חברי הקבוצה, כולל מי שביצעו את המחיקה. אם המחיקה נעשתה בטעות, יש לפנות אלינו בתוך 90 יום ממועד המחיקה כדי לבקש שחזור.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c15f72841d15dc52:
    english: Groups awaiting deletion and their subgroups are unavailable to members and coordinators for viewing, participation, or export, including polls opened from saved links. Members cannot create or edit content, vote, send announcements or reminders, or accept invitations. Export the group and download important files before confirming deletion. Direct discussions and polls are unaffected.
    translation: קבוצות הממתינות למחיקה ותת-הקבוצות שלהן אינן זמינות לחברים ולמנהלים לצפייה, להשתתפות או לייצוא. הדבר חל גם על סקרים שנפתחים מקישורים שמורים. אי אפשר ליצור או לערוך תוכן, להצביע, לשלוח הודעות או תזכורות, או לקבל הזמנות. לפני אישור המחיקה, יש לייצא את נתוני הקבוצה ולהוריד קבצים חשובים. דיונים ישירים וסקרים ישירים אינם מושפעים.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5122280818cc30c7:
    english: Scheduling the group for deletion stops pending activity notifications and poll reminders for the group and its subgroups. Messages already being sent may still arrive.
    translation: תזמון הקבוצה למחיקה מפסיק הודעות על פעילות ותזכורות לסקרים שטרם נשלחו עבור הקבוצה ותת-הקבוצות שלה. הודעות שכבר נשלחות עדיין עשויות להגיע.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  953ebf00860389c1:
    english: The warning email includes counts for the group's subgroups, members, discussions, polls and comments. If you need to keep the group or [export its data](/en/user_manual/groups/data_export/), reply within 90 days so access can be restored before deletion.
    translation: הודעת האזהרה בדוא״ל כוללת את מספר תת-הקבוצות, החברים, הדיונים, הסקרים והתגובות בקבוצה. אם יש צורך לשמור את הקבוצה או [לייצא את נתוניה](/en/user_manual/groups/data_export/), יש להשיב בתוך 90 יום כדי שניתן יהיה לשחזר את הגישה לפני המחיקה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  17dc58c271e429d5:
    english: Deleting your group will also cancel your Loomio subscription.
    translation: מחיקת הקבוצה תבטל גם את המינוי ל-Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fa7cec0f3ba570ef:
    english: "![Delete group action in the Oatmilk Cooperative menu](group_delete_group.png)"
    translation: "![האפשרות למחיקת הקבוצה בתפריט של קואופרטיב חלב שיבולת השועל](group_delete_group.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cb0d8b2f2c8b9630:
    english: You will be invited to type the name of your group (*case sensitive*) to confirm you wish to delete your group.
    translation: כדי לאשר את מחיקת הקבוצה, תופיע בקשה להקליד את שם הקבוצה (*תוך הבחנה בין אותיות גדולות לקטנות*).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5430eb3885d98872:
    english: "![Confirmation form requiring the Oatmilk Cooperative handle](group_delete_group_confirm.png)"
    translation: "![טופס אישור המחייב להזין את המזהה של קואופרטיב חלב שיבולת השועל](group_delete_group_confirm.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2df60ea964109f11:
    english: "## Group data is permanently deleted after 90 days"
    translation: "## נתוני הקבוצה נמחקים לצמיתות כעבור 90 יום"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e09923078301b8d:
    english: After 90 days, all the threads, polls, files and other group content will be permanently deleted. ***This is non-reversible!***
    translation: כעבור 90 יום, כל השרשורים, הסקרים, הקבצים ושאר תוכני הקבוצה יימחקו לצמיתות. ***לא ניתן לבטל את המחיקה***
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8695a5ebfb09611d:
    english: We recommend that you [export the group data](/en/user_manual/groups/data_export/)and manually download any important files you have uploaded before you continue.
    translation: מומלץ [לייצא את נתוני הקבוצה](/en/user_manual/groups/data_export/)ולהוריד ידנית קבצים חשובים שהועלו לפני שממשיכים.
    status: machine
