  290b36f9178272e2:
    english: |-
      Our webhook based system can also be used to support other systems that support incoming webhooks with either HTML or Markdown formatting. This could be something like Zapier or Rocketchat.
      Just select the mattermost bot, but use a custom webhook URL.
    translation: |-
      Il sistema basato sui webhook può funzionare anche con altri servizi che accettano webhook in ingresso formattati in HTML o Markdown, come Zapier o Rocketchat.
      Seleziona il bot Mattermost e usa un URL webhook personalizzato.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f76c44196c94dcef:
    english: "## Set up a chat integration"
    translation: "## Configura un'integrazione di chat"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3c63f567f90fd1eb:
    english: |-
      After configuring your chosen service (see above), you'll have a webhook URL.
      Open **Chat integrations** from the group menu and add a new chat integration for your group.
    translation: |-
      Dopo aver configurato il servizio scelto (vedi sopra), avrai un URL webhook.
      Apri **Integrazioni di chat** dal menu del gruppo e aggiungi una nuova integrazione di chat per il tuo gruppo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
