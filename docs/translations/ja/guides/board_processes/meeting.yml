      - [会議の焦点を定め、前回の対応事項を確認する](#meeting-focus-and-review-actions)
      - [議題を知らせ、通知する](#agenda-and-notify)
      - [会議の日時を決める](#find-a-time-for-meeting)
      - [議事録を承認する](#sign-off-minutes)
      - [報告書を承認する](#approve-reports)
    status: machine
