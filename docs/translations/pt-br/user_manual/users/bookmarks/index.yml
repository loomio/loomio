  5d590d1d8ab9b956:
    english: |-
      Bookmarks are a personal list of Loomio items you want to return to. Your
      bookmarks are visible only to you and saving an item does not notify anyone
      else.
    translation: |-
      Os favoritos são uma lista pessoal de itens do Loomio aos quais você deseja voltar.
      Só você pode ver seus favoritos. Ao salvar um item, ninguém mais recebe uma
      notificação.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
