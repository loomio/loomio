  e034be8c0fbe76db:
    english: 'To add a link:'
    translation: 'Zo voeg je een link toe:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dcf90e79aba1a2f9:
    english: |-
      1. Select the text you want to link to - say the name of a document.
      2. Click the link icon.
      3. Paste the address into the **Insert link** field and select **Apply**.
    translation: |-
      1. Selecteer de tekst waarvan je een link wilt maken, bijvoorbeeld de naam van een document.
      2. Klik op het linkpictogram.
      3. Plak het adres in het veld **Link invoegen** en selecteer **Toepassen**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  40ecf7d0c79432b2:
    english: For a document hosted elsewhere, check its sharing permissions so discussion participants can open it.
    translation: Controleer bij een document dat elders is opgeslagen de deelrechten, zodat deelnemers aan de discussie het kunnen openen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3f1824fc07dded13:
    english: A preview of the doc will appear under the text space. You can remove this if you want.
    translation: Onder het tekstveld verschijnt een voorbeeld van het document. Je kunt dit verwijderen als je wilt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c6061aa7deff27ac:
    english: Now, anyone with access to your Loomio discussion and permission to view the doc can open and read it.
    translation: Iedereen die toegang heeft tot jouw Loomio-discussie en het document mag bekijken, kan het nu openen en lezen.
    status: machine
