  e19d687b56819302:
    english: Hi! I'm Alanna.
    translation: Hallo, ich bin Alanna.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  10352ad196487ff3:
    english: I'm one of the founders of Loomio, and I've been thinking deeply about how it works from a facilitation perspective since the beginning. I am not a seminal facilitation expert; I consider myself only a beginner in this craft that one could spend a lifetime honing.
    translation: Ich habe Loomio mitgegründet und beschäftige mich seit Anfang an damit, wie es aus Sicht der Moderation funktioniert. Ich bin keine führende Expertin auf diesem Gebiet. Ich sehe mich als Anfängerin in einer Praxis, die man ein Leben lang weiterentwickeln kann.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c637c96f9723f02d:
    english: What I can offer is help translating between the offline and online spaces, as a practitioner in both. I've facilitated a lot of groups who use Loomio, and learned from their experiences.
    translation: Ich kann dabei helfen, Erfahrungen aus der Moderation persönlicher Treffen auf die Online-Zusammenarbeit zu übertragen und umgekehrt. Ich habe viele Gruppen moderiert, die Loomio nutzen, und aus ihren Erfahrungen gelernt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c376e38821fb6c2f:
    english: You can find out [more about me on my website](http://alanna.space).
    translation: "[Mehr über mich erfährst du auf meiner Website](http://alanna.space)."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b893957534fa37e2:
    english: I'm only one person, with one perspective and approach to facilitation, when there are myriad approaches. I've tried to bring in a couple other facilitator's voices here, including [Rich](http://richdecibels.com/) from Loomio and Silvia from [EXP](http://exp.agency).
    translation: Ich bin nur eine Person mit einer bestimmten Sichtweise und einem eigenen Ansatz zur Moderation. Es gibt viele andere Ansätze. Deshalb habe ich versucht, hier auch andere Stimmen aus der Moderation einzubeziehen, darunter [Rich](http://richdecibels.com/) von Loomio und Silvia von [EXP](http://exp.agency).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
