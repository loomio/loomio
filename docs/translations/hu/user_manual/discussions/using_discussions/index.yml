    translated_on: '2026-09-29'
  031f9244f107aba8:
    english: A discussion keeps its context, comments, decisions, and outcomes together in one thread. This page explains how to participate in a thread and use its navigation and actions.
    translation: Egy beszélgetés egy témában tartja együtt a leírást, a hozzászólásokat, a döntéseket és a döntések összegzését. Ez az oldal bemutatja, hogyan vehetsz részt egy témában, és hogyan használhatod a navigációs és műveleti eszközöket.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  479a1564b496bfed:
    english: "## Thread anatomy"
    translation: "## A téma részei"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb745de96e6a612d:
    english: 'A typical thread looks like this:'
    translation: 'Egy jellemző téma így néz ki:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e69f7f0b13fd9f9:
    english: 'From the top of the page, a thread contains:'
    translation: 'Az oldal tetejétől lefelé haladva a téma részei:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5b47d6434aa50e94:
    english: "**Group name** - At the top left of the discussion page is the name of the group or subgroup that the discussion belongs to.  Click on this name to go back to the group page."
    translation: "**Csoport neve** - A beszélgetés oldalának bal felső sarkában annak a csoportnak vagy alcsoportnak a neve látható, amelyhez a beszélgetés tartozik. Kattints a névre a csoport oldalának megnyitásához."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0dab4c46c2bee003:
    english: "**Discussion access** - The access icon at the top right opens the discussion's access settings. A group discussion is available to group members and anyone specifically invited to it, subject to the group's privacy settings."
    translation: "**Hozzáférés a beszélgetéshez** - A jobb felső sarokban lévő ikon megnyitja a beszélgetés hozzáférési beállításait. A csoportos beszélgetést a csoport tagjai és a külön meghívott személyek érhetik el, a csoport adatvédelmi beállításaitól függően."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e20178954e6d3ce0:
    english: "**Discussion title** - The name of the discussion."
    translation: "**Beszélgetés címe** - A beszélgetés neve."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  47687209ed924849:
    english: "**Category tags** - The discussion may have one or more category tags. Using simple tags helps people more easily find discussions of a similar type."
    translation: "**Kategóriacímkék** - Egy beszélgetéshez egy vagy több kategóriacímke tartozhat. Az egyszerű címkék megkönnyítik a hasonló beszélgetések megtalálását."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b817649f985f51de:
    english: "**Discussion author** - The name and avatar of the person who started the discussion, shown beneath the title."
    translation: "**A beszélgetés indítója** - A címsor alatt a beszélgetést indító személy neve és profilképe látható."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c44d5a833b4ec9ff:
    english: "**Date** - Hover over the date to see the full date and time of discussion start."
    translation: "**Dátum** - Vidd a mutatót a dátum fölé a beszélgetés kezdésének teljes dátumáért és időpontjáért."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b8062113f1078acb:
    english: "**Seen by** - In the right sidebar, shows who has read the discussion and when."
    translation: "**Látta** - A jobb oldalsávban láthatod, ki és mikor olvasta el a beszélgetést."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  133d0c2e469e9683:
    english: "**Notified** - In the right sidebar, shows who has been notified about the discussion and whether each notification has been read or its email opened."
    translation: "**Értesített** - A jobb oldalsávban láthatod, ki kapott értesítést a beszélgetésről, valamint hogy elolvasta-e az értesítést vagy megnyitotta-e az e-mailt."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9f788adb4eab80cc:
    english: "**Discussion context** - Content to frame the discussion."
    translation: "**Beszélgetés leírása** - A beszélgetés kereteit meghatározó tartalom."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e8c5ae76dfb5b89b:
    english: "**Discussion interaction and administration tools** - The discussion context has controls to react to and edit it. The right sidebar contains notification, membership and administration actions."
    translation: "**Részvételi és kezelési eszközök** - A beszélgetés leírásánál reagálhatsz a tartalomra és szerkesztheted azt. A jobb oldalsávban az értesítésekkel, a résztvevőkkel és a kezelésükkel kapcsolatos műveletek találhatók."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8f6eac4359c2b9f6:
    english: "**Comments** - Comments are displayed under the discussion context. The author's name, avatar and posting time show who wrote each comment and when. Interaction and administration tools are available on each comment."
    translation: "**Hozzászólások** - A hozzászólások a beszélgetés leírása alatt jelennek meg. A szerző neve, profilképe és a közzététel időpontja mutatja, ki és mikor írta az egyes hozzászólásokat. Minden hozzászólásnál elérhetők részvételi és kezelési eszközök."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f978af6c9af4afe5:
    english: |-
      **Navigation, notifications and actions** - The right sidebar contains
      shortcuts to activity and milestones, notification and membership information,
      and the thread actions available to you.
    translation: |-
      **Navigáció, értesítések és műveletek** - A jobb oldalsávban
      az eseményekhez és a fontos pontokhoz vezető hivatkozások, az értesítésekkel és a résztvevőkkel kapcsolatos adatok,
      valamint a számodra elérhető témaműveletek találhatók.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f8c4084e9e8a2b27:
    english: "## Discussion context"
    translation: "## A beszélgetés leírása"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5940bad6cb1cb49f:
    english: The discussion **context** is always found at the top of the discussion. Use the context to frame the discussion or decision.
    translation: A beszélgetés **leírása** mindig a beszélgetés tetején található. Ezzel adhatod meg a beszélgetés vagy a döntés kereteit.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  415dd2d0f1eacc9f:
    english: Think of your group as you write content in the discussion context.  Your aim is to get a discussion going, so consider how you can motivate people to participate.  In general, keep the discussion context simple and clear.
    translation: A beszélgetés leírását a csoportodnak írd. Gondold át, mi segíti a tagokat a részvételben. Általában érdemes egyszerűen és világosan fogalmazni.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a1fcece28d8fb61d:
    english: Write the discussion context when starting or editing a discussion. **Edit** a discussion with the pencil icon.
    translation: A beszélgetés indításakor vagy szerkesztésekor írd meg a leírást. A ceruza ikonnal **Szerkesztés** műveletet indíthatsz.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2f47adddef6b31d9:
    english: As the discussion progresses, update discussion context.  Think of the context like a whiteboard in your meeting room, where you can write the agenda, the outcomes intended and how you plan to get there.
    translation: 'A beszélgetés előrehaladtával frissítsd a leírást. Használd úgy, mint egy tárgyalótermi táblát: felírhatod rá a napirendet, a kívánt eredményeket és az elérésükhöz tervezett lépéseket.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c82ec20629208982:
    english: At the bottom of the context panel is a formatting bar, where you can format text, attach files, images and embed a video.
    translation: A leíráspanel alján formázási eszköztár található. Itt formázhatod a szöveget, fájlokat és képeket csatolhatsz, valamint videót ágyazhatsz be.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e606d83ae0fb2178:
    english: "### Notify people about context changes"
    translation: "### Értesítés a leírás változásairól"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d188326a58b28d96:
    english: When you edit the discussion context, use **What's changed?** to summarize the update and choose who should be notified.
    translation: Amikor szerkeszted a beszélgetés leírását, a **Mi változott?** mezőben foglald össze a módosítást, és válaszd ki, kik kapjanak értesítést.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  842091a987742d6d:
    english: "![Editing a discussion context with a change summary and notification recipients](../notifying_people/thread_editcontext.png)"
    translation: "![Beszélgetés leírásának szerkesztése a változás összefoglalásával és az értesítendők kiválasztásával](../notifying_people/thread_editcontext.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b885359dd7e83428:
    english: The summary appears as an item in the thread so participants can see what changed.
    translation: Az összefoglaló külön elemként jelenik meg a témában, így a résztvevők láthatják, mi változott.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c899c47e98f79a23:
    english: "![A timeline item describing a discussion context change](../notifying_people/thread_edit_comment.png)"
    translation: "![A beszélgetés leírásának változását ismertető elem az idővonalon](../notifying_people/thread_edit_comment.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  44ffd1d0a732b897:
    english: "## Navigation"
    translation: "## Navigáció"
    status: machine
