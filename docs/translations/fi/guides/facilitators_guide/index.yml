  980342866ab7bee6:
    english: An in-depth guide to applying key facilitation concepts in the online space.
    translation: Perusteellinen opas fasilitoinnin keskeisten periaatteiden soveltamiseen verkossa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ac8728f5ce2ea8ce:
    english: Loomio is made by facilitators, and that plays a huge role in how it has been designed. This guide is about revealing more of that context, and translating facilitation concepts from the offline space to the online space.
    translation: Loomion ovat tehneet fasilitaattorit, ja heidän kokemuksensa on vaikuttanut merkittävästi sen suunnitteluun. Tämä opas avaa suunnittelun taustaa ja näyttää, miten kasvokkaisen fasilitoinnin periaatteita voi soveltaa verkossa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e802660a44da1775:
    english: "## More about this guide"
    translation: "## Lisää tästä oppaasta"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5cbd64dba51ca485:
    english: Whether employed by a professional facilitator, people peer-facilitating each other, or a group that has no awareness of facilitation at all, Loomio’s essential function is to mediate and support group communication toward a desired outcome. In other words, facilitation.
    translation: Loomion perustehtävä on tukea ryhmän viestintää ja auttaa sitä pääsemään haluttuun lopputulokseen. Näin on riippumatta siitä, johtaako keskustelua ammattifasilitaattori, fasilitoivatko osallistujat toistensa työskentelyä vai onko fasilitointi ryhmälle vieras käsite. Toisin sanoen Loomio tukee fasilitointia.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  25a956280b647fa6:
    english: 'Loomio is *groupware*:'
    translation: 'Loomio on *ryhmätyöohjelmisto*:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  33e304be58a0a55b:
    english: "> Collaborative software, or groupware, is designed to help people involved in a common task achieve their goals. One of the earliest definitions of collaborative software is “intentional group processes plus software to support them.” -- Wikipedia"
    translation: "> Yhteistyöohjelmisto eli ryhmätyöohjelmisto on suunniteltu auttamaan yhteisen tehtävän parissa työskenteleviä ihmisiä saavuttamaan tavoitteensa. Yksi varhaisimmista määritelmistä kuvaa sitä tarkoituksellisiksi ryhmäprosesseiksi ja niitä tukevaksi ohjelmistoksi. -- Wikipedia"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  170a0b463e1ad8ca:
    english: There is a huge body of knowledge, best practice, and tradition in both in-person facilitation and online moderation, but the art and science of their intersection is only just emerging. This is the specific space where Loomio strives to excel.
    translation: Kasvokkaisesta fasilitoinnista ja verkkokeskustelujen moderoinnista on kertynyt paljon tietoa, hyviä käytäntöjä ja perinteitä. Niiden yhdistäminen on kuitenkin vasta kehittymässä. Juuri siinä Loomio pyrkii olemaan hyödyksi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
