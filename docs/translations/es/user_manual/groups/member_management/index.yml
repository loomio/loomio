  f9901909d4cd86e0:
    english: If you are an admin, you can manage members from the **Members** tab on your group page.
    translation: Si eres admin, puedes gestionar a los integrantes desde la pestaña **Integrantes** de la página de tu grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d25e71106f726cac:
    english: Click on the three dots (**⋮**) to the right of the group member to set their title, make them an admin, make them a delegate, or remove them from the group.
    translation: Haz clic en los tres puntos (**⋮**) a la derecha de un integrante para asignarle un título, convertirlo en admin o delegado, o eliminarlo del grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  db5a08225152e80a:
    english: "![Member actions menu on the Oatmilk Cooperative members page](member_management.png)"
    translation: "![Menú de acciones de un integrante en la página de integrantes de Oatmilk Cooperative](member_management.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0f29eb85fabc200d:
    english: |-
      ## Administering your group
      There are only two user types in a Loomio group: **member** and **admin**.
    translation: |-
      ## Administrar tu grupo
      En un grupo de Loomio solo hay dos tipos de usuarios: **integrante** y **admin**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4317e6fcbbedcdaa:
    english: 'Admins perform administrative tasks for your group, including: adding and removing members, managing member permissions, setting the group privacy levels, and managing the subscription plans.  In addition, admins are able to see the email addresses of members and export the group''s data.'
    translation: Los admins se encargan de añadir y eliminar integrantes, gestionar sus permisos, establecer los niveles de privacidad del grupo y administrar los planes de suscripción. También pueden ver las direcciones de correo electrónico de los integrantes y exportar los datos del grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7de2ea0e85a19d0a:
    english: The person creating a new Loomio group is made admin by default. We recommend to make at least one other trusted person in your group an admin, to insure someone can always administer your group. You can have as many admins in your group as you wish.
    translation: Quien crea un grupo de Loomio se convierte en admin de forma predeterminada. Te recomendamos nombrar admin al menos a otra persona de confianza del grupo para que siempre haya alguien que pueda administrarlo. Puedes tener tantos admins como quieras.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ac9e3bb2da56869e:
    english: To make a member **admin**, go to the Members tab, find the member and click on the three dots (**⋮**) next to their name. Choose **Make admin**. An `Admin` tag will appear beside their name.
    translation: Para convertir a un integrante en **admin**, ve a la pestaña Integrantes, búscalo y haz clic en los tres puntos (**⋮**) junto a su nombre. Selecciona **Convertir en admin**. Aparecerá una etiqueta `Admin` junto a su nombre.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b93c8eaf5367f572:
    english: "![Make admin action in a member's menu](member_make_admin.png)"
    translation: "![Opción Convertir en admin en el menú de un integrante](member_make_admin.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f6d7a993e2d32771:
    english: |-
      ## Managing subgroups
      If you are the admin of a parent group, or organization, you have additional permissions with regards to any __closed__ subgroups.
    translation: |-
      ## Gestionar subgrupos
      Si eres admin de un grupo principal u organización, tienes permisos adicionales en los subgrupos __cerrados__.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cd781594b26ae052:
    english: You will be able to join any closed subgroup by clicking the "Join Group" button on the left of the Subgroup page in question (just under the tabs).
    translation: Puedes unirte a cualquier subgrupo cerrado haciendo clic en el botón «Unirse al grupo», situado a la izquierda de la página del subgrupo, justo debajo de las pestañas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ba630e95409473a5:
    english: "![Join group button on a closed Oatmilk Cooperative subgroup](member_join_subgroup.png)"
    translation: "![Botón Unirse al grupo en un subgrupo cerrado de Oatmilk Cooperative](member_join_subgroup.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  87c2d0e0fa784cff:
    english: Once you have joined the subgroup, you will also be able to make yourself the admin of that subgroup, just as you would promote anyone to admin.
    translation: Una vez que te unas al subgrupo, también podrás convertirte en su admin, igual que puedes nombrar admin a cualquier otra persona.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e439992d86591319:
    english: |-
      >[!Note]
      >These permissions do not extend to [**secret** subgroups](/en/user_manual/groups/subgroups/?highlight=secret#permissions).
    translation: |-
      >[!Note]
      >Estos permisos no se aplican a los [subgrupos **secretos**](/en/user_manual/groups/subgroups/?highlight=secret#permissions).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  31a8fbe10f50c1a0:
    english: |-
      ## Removing members
      When you click **Remove from group** you'll be asked to confirm the removal. Upon removal, this user will no longer have access to the group's pages, threads, polls, or proposals. They will receive no further emails or notifications of group activity. However, any comments and votes written by the user will remain untouched.
    translation: |-
      ## Eliminar integrantes
      Al hacer clic en **Eliminar del grupo**, se te pedirá que confirmes la eliminación. Esa persona dejará de tener acceso a las páginas, los hilos, los sondeos y las propuestas del grupo. Tampoco recibirá más correos electrónicos ni notificaciones sobre la actividad del grupo. Sus comentarios y votos permanecerán intactos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8bf29fce0f0d8e9b:
    english: "![Remove from group action in a member's menu](member_remove.png)"
    translation: "![Opción Eliminar del grupo en el menú de un integrante](member_remove.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  aa3b173ffd048b99:
    english: You can add removed members back to the group later if you wish.
    translation: Si quieres, puedes volver a añadir al grupo a los integrantes que hayas eliminado.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6ef7d0422c66d652:
    english: |-
      ## Leaving group
      To leave a group: go to the group page, open the 3 dot menu, and click **Leave group**.
    translation: |-
      ## Salir de un grupo
      Para salir de un grupo, ve a su página, abre el menú de los tres puntos y haz clic en **Salir del grupo**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5395b374b5814162:
    english: "![Leave group action in the Oatmilk Cooperative settings menu](member_leave_group.png)"
    translation: "![Opción Salir del grupo en el menú de configuración de Oatmilk Cooperative](member_leave_group.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d926fc8d1e3cbac2:
    english: |-
      ## Set title
      Within the Members tab, you can also name your role within the group, or identify an organization you represent using **title**. You or a group admin can change your title with **Set title** from the 3 dot menu near your name.
    translation: |-
      ## Añadir un título
      En la pestaña Integrantes, puedes usar **Título** para indicar tu función en el grupo o la organización a la que representas. Tú o un admin del grupo podéis cambiar tu título desde **Añada un título**, en el menú de los tres puntos junto a tu nombre.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2425e4d5b1e8047d:
    english: "![Set title action in a member's menu](member_set_title.png)"
    translation: "![Opción Añada un título en el menú de un integrante](member_set_title.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6af456317883a890:
    english: You can have different titles in different subgroups.
    translation: Puedes tener un título distinto en cada subgrupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2d59cb70493e06b1:
    english: "## Member email addresses"
    translation: "## Direcciones de correo electrónico de los integrantes"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cee3a1e0e1031377:
    english: Only admins can see group member email addresses.  This is sometimes necessary to audit the members in a group.
    translation: Solo los admins pueden ver las direcciones de correo electrónico de los integrantes del grupo. A veces es necesario para revisar quiénes pertenecen al grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4ff1112b058a3205:
    english: 'To see member email addresses: Use [data export](/en/user_manual/groups/data_export/) to download a CSV file, and open the file in Excel or Google sheets.'
    translation: Para ver las direcciones de correo electrónico de los integrantes, usa la [exportación de datos](/en/user_manual/groups/data_export/) para descargar un archivo CSV y ábrelo en Excel o Google Sheets.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  105be57911f832fc:
    english: The export group data file shows every person and their email address in every subgroup.
    translation: El archivo de exportación de datos del grupo muestra a todas las personas de cada subgrupo y sus direcciones de correo electrónico.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  20f87bcff4ec41e6:
    english: You can also search for members by email address in the members tab. So if you see someone you want to remove, you can search by email to remove them.
    translation: También puedes buscar integrantes por dirección de correo electrónico en la pestaña Integrantes. Si quieres eliminar a alguien, puedes buscarlo por correo electrónico y eliminarlo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
