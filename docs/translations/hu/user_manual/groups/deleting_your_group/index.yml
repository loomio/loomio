navigation_title: Csoportod törlése
blocks:
  6e0bf431fbefa0d3:
    english: "# Deleting your group"
    translation: "# Csoportod törlése"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f8e8d1ee802cae90:
    english: 'Deleting your Loomio group initiates a process to permanently delete all group data. '
    translation: Loomio-csoportod törlése elindítja a csoport összes adatának végleges törlését.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  214aa96eca0b90ca:
    english: If there is any data you wish to retain, make sure you [export group data](/en/user_manual/groups/data_export/) and manually download any important files you have uploaded before you continue.
    translation: Ha szeretnél megőrizni bármilyen adatot, előbb [exportáld a csoport adatait](/en/user_manual/groups/data_export/), és töltsd le a feltöltött fontos fájlokat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  181fecc458dcc49d:
    english: Open the group drop down menu by clicking on the three dots, and select the **Delete group** option to remove access to the group and to initiate deletion of all group data from our records. You must be an admin to delete a group.
    translation: A három pontra kattintva nyisd meg a csoport legördülő menüjét, majd válaszd a **Csoport törlése** lehetőséget. Ezzel megszűnik a hozzáférés a csoporthoz, és elindul a csoport összes adatának törlése a nyilvántartásunkból. Csoportot csak adminisztrátorként törölhetsz.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f5178957964c2bc0:
    english: When you delete a group, it is removed from view immediately and will be permanently deleted after 90 days. You and group members immediately lose access to the group. If a mistake was made, contact us within 90 days of deleting your group to request restoration.
    translation: Ha törölsz egy csoportot, az azonnal eltűnik, az adatait pedig 90 nap után véglegesen töröljük. Te és a csoport tagjai azonnal elveszítitek a hozzáférést. Ha véletlenül törölted a csoportot, 90 napon belül vedd fel velünk a kapcsolatot a visszaállításhoz.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c15f72841d15dc52:
    english: Groups awaiting deletion and their subgroups are unavailable to members and coordinators for viewing, participation, or export, including polls opened from saved links. Members cannot create or edit content, vote, send announcements or reminders, or accept invitations. Export the group and download important files before confirming deletion. Direct discussions and polls are unaffected.
    translation: 'A törlésre váró csoportokhoz és alcsoportjaikhoz a tagok és a koordinátorok nem férhetnek hozzá: nem tekinthetik meg őket, nem vehetnek részt bennük, és nem exportálhatják az adataikat. Ez a mentett hivatkozásokról megnyitott szavazásokra is vonatkozik. A tagok nem hozhatnak létre vagy szerkeszthetnek tartalmat, nem szavazhatnak, nem küldhetnek közleményeket vagy emlékeztetőket, és nem fogadhatnak el meghívásokat. A törlés megerősítése előtt exportáld a csoport adatait, és töltsd le a fontos fájlokat. A közvetlen beszélgetéseket és szavazásokat a törlés nem érinti.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5122280818cc30c7:
    english: Scheduling the group for deletion stops pending activity notifications and poll reminders for the group and its subgroups. Messages already being sent may still arrive.
    translation: A csoport törlésének ütemezése leállítja a csoporthoz és alcsoportjaihoz tartozó, még függőben lévő tevékenységi értesítéseket és szavazási emlékeztetőket. A már küldés alatt álló üzenetek még megérkezhetnek.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  953ebf00860389c1:
    english: The warning email includes counts for the group's subgroups, members, discussions, polls and comments. If you need to keep the group or [export its data](/en/user_manual/groups/data_export/), reply within 90 days so access can be restored before deletion.
    translation: A figyelmeztető e-mail tartalmazza a csoport alcsoportjainak, tagjainak, beszélgetéseinek, szavazásainak és hozzászólásainak számát. Ha szeretnéd megtartani a csoportot vagy [exportálni az adatait](/en/user_manual/groups/data_export/), válaszolj 90 napon belül, hogy a törlés előtt visszaállíthassuk a hozzáférést.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  17dc58c271e429d5:
    english: Deleting your group will also cancel your Loomio subscription.
    translation: A csoport törlése a Loomio-előfizetésedet is megszünteti.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fa7cec0f3ba570ef:
    english: "![Delete group action in the Oatmilk Cooperative menu](group_delete_group.png)"
    translation: "![Csoport törlése az Oatmilk Cooperative menüjében](group_delete_group.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cb0d8b2f2c8b9630:
    english: You will be invited to type the name of your group (*case sensitive*) to confirm you wish to delete your group.
    translation: A törlés megerősítéséhez be kell írnod a csoport nevét (*a kis- és nagybetűk számítanak*).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5430eb3885d98872:
    english: "![Confirmation form requiring the Oatmilk Cooperative handle](group_delete_group_confirm.png)"
    translation: "![Megerősítő űrlap, amely az Oatmilk Cooperative azonosítóját kéri](group_delete_group_confirm.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2df60ea964109f11:
    english: "## Group data is permanently deleted after 90 days"
    translation: "## A csoport adatait 90 nap után véglegesen töröljük"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e09923078301b8d:
    english: After 90 days, all the threads, polls, files and other group content will be permanently deleted. ***This is non-reversible!***
    translation: 90 nap után minden téma, szavazás, fájl és egyéb csoporttartalom véglegesen törlődik. ***Ez nem vonható vissza.***
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8695a5ebfb09611d:
    english: We recommend that you [export the group data](/en/user_manual/groups/data_export/)and manually download any important files you have uploaded before you continue.
    translation: Javasoljuk, hogy mielőtt folytatod, [exportáld a csoport adatait](/en/user_manual/groups/data_export/), és töltsd le a feltöltött fontos fájlokat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
