  2cb3890f4ef20320:
    english: Alex and Morgan then agree, while Taylor disagrees. All five people have voted, reaching the quorum, and four of five eligible voters agree. The 80 percent agreement exceeds the 75 percent vote share requirement, so both requirements show green check marks.
    translation: Sen jälkeen Alex ja Morgan äänestävät ehdotuksen puolesta ja Taylor sitä vastaan. Kaikki viisi ovat nyt äänestäneet, joten päätösvaltaisuusvaatimus täyttyy. Neljä viidestä äänestäjäoikeutetusta kannattaa ehdotusta. Kannatus on 80 prosenttia, mikä ylittää 75 prosentin ääniosuusvaatimuksen. Molempien vaatimusten kohdalla näkyy vihreä valintamerkki.
