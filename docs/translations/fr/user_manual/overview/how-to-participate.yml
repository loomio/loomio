navigation_title: Comment participer
blocks:
  b07064bf98055393:
    english: "# How to participate"
    translation: "# Comment participer"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c121de54fbe72331:
    english: 'Once signed in to a Loomio group you have been invited to, you can participate in a Loomio discussion or decision.  '
    translation: Une fois connecté à un groupe Loomio auquel vous avez été invité, vous pouvez participer aux discussions et aux décisions.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9bb48e2f2f1858af:
    english: Read on to see  how to write a comment in a thread and how to vote in a poll.
    translation: Voici comment écrire un commentaire dans un fil de discussion et voter dans un sondage.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '095ec081a6f1d74e':
    english: "## Comment"
    translation: "## Commenter"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d5dadbc416d8603a:
    english: You can write a comment in a thread, and people can reply, react or post their own comment to continue the discussion.
    translation: Vous pouvez écrire un commentaire dans un fil de discussion. Les autres personnes peuvent y répondre, réagir ou ajouter leur propre commentaire pour poursuivre la discussion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  250f7bc0e6e6c93c:
    english: 'When you have written your text, use **Post Comment** to instantly publish the comment. Your comment will be visible to anyone who has permission to see the thread. '
    translation: Une fois votre texte rédigé, cliquez sur **Publier le commentaire** pour le publier immédiatement. Toute personne autorisée à voir le fil de discussion pourra voir votre commentaire.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  76a3378441f45ebf:
    english: "### Reply to a comment"
    translation: "### Répondre à un commentaire"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c3495aed9ac78348:
    english: You can reply to someone's comment by clicking on the reply icon beneath the comment.
    translation: Pour répondre à un commentaire, cliquez sur l’icône de réponse située sous celui-ci.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b2698ab73e65442c:
    english: Your reply is published in the thread and an email notification is sent to the author of the comment.
    translation: Votre réponse est publiée dans le fil de discussion et l’auteur du commentaire reçoit une notification par e-mail.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  04743dedbee0de5c:
    english: "### Get someone's attention"
    translation: "### Attirer l’attention d’une personne"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  455fea8aa593dad4:
    english: You can notify people when you write a comment.
    translation: Vous pouvez notifier des personnes lorsque vous écrivez un commentaire.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  316ef3257eaebd54:
    english: "### Reactions"
    translation: "### Réactions"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4b68204cf35c85f1:
    english: Reacting to a comment is a great way to encourage and acknowledge a comment by letting the comment author know how you feel.  It is a quick and light-weight way to participate that does not require any text, nor send an email. Click the smile emoji icon beneath a comment to leave an emoji reaction.
    translation: Une réaction permet de montrer à l’auteur d’un commentaire ce que vous en pensez. C’est un moyen rapide de participer, sans écrire de texte ni envoyer d’e-mail. Cliquez sur l’icône représentant un visage souriant sous un commentaire pour ajouter une réaction emoji.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Voter"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4432b9c5b263014a:
    english: You may receive an invitation to vote in a poll via email or by notification in Loomio. Click on the link in the email to vote.
    translation: Vous pouvez recevoir une invitation à voter dans un sondage par e-mail ou par notification dans Loomio. Pour voter, cliquez sur le lien dans l’e-mail.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2a8641a22cf13597:
    english: Voting is easy, just click or tap on the icon of your choice.
    translation: Pour voter, cliquez ou appuyez sur l’icône de votre choix.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  00d6e2698ade53cc:
    english: There are many types of polls. The example below shows a typical proposal with voting options of **Agree**, **Abstain** or **Disagree**. Other options may be available.
    translation: Il existe plusieurs types de sondages. L’exemple ci-dessous montre une proposition avec les options de vote **D’accord**, **S’abstenir** et **Désaccord**. D’autres options peuvent être proposées.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4f327c4a766af0ab:
    english: Read the poll, and any attached files, then cast your vote by selecting one of the options.
    translation: Lisez le sondage et les fichiers joints, puis sélectionnez une option pour voter.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2cf633f37997e8b8:
    english: "### State a reason"
    translation: "### Indiquer une raison"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c976385dcb75f67b:
    english: When voting, you can also leave a **Reason** to say why you have voted this way. This is optional.
    translation: Lorsque vous votez, vous pouvez aussi indiquer une **Raison** pour expliquer votre choix. Cette étape est facultative.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6d0d884b0832dda9:
    english: "### Change your vote"
    translation: "### Modifier votre vote"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  84629138984e43d0:
    english: You can **change your vote**, up until the proposal closes.
    translation: Vous pouvez **modifier votre vote** jusqu’à la clôture de la proposition.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8fcddbe7856e926b:
    english: There are many reasons why you might want to change your vote. For example if new information emerges it may cause you to rethink your decision, and change your vote.
    translation: Vous pouvez souhaiter modifier votre vote pour plusieurs raisons. Par exemple, de nouvelles informations peuvent vous amener à revoir votre décision.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f7078b517c8bfed8:
    english: Once again, you can leave a reason to say why you have changed your vote.
    translation: Vous pouvez également indiquer pourquoi vous avez modifié votre vote.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8e1b2953471f22ba:
    english: "### Results"
    translation: "### Résultats"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2153df12cd2b4fe2:
    english: Results of the proposal are updated as people vote, so you can see how a proposal is trending.
    translation: Les résultats de la proposition sont mis à jour à mesure que les personnes votent. Vous pouvez ainsi suivre l’évolution du vote.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  229571fe36c571b0:
    english: 'In a controversial proposal it is common to see mixed results, however this does not mean the proposal has failed.  '
    translation: Une proposition qui suscite des avis divergents peut donner des résultats partagés. Cela ne signifie pas qu’elle a échoué.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c3d5e53684bf3e88:
    english: Often the new information revealed during the proposal helps form a better proposal that is more likely to pass.
    translation: Les nouvelles informations apportées pendant le vote aident souvent à formuler une meilleure proposition, qui a plus de chances d’être acceptée.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b4783489f09ccf19:
    english: "### Outcome"
    translation: "### Conclusion"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  592f419764241ef6:
    english: When the proposal closes, the author is prompted to state the **Outcome**.
    translation: Lorsque la proposition est close, son auteur est invité à rédiger la **Conclusion**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0fae106181bbc6ac:
    english: This is an important final step to record the result of the decision and let everyone know what will happen next.
    translation: Cette dernière étape permet de consigner le résultat de la décision et d’informer tout le monde de la suite.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
