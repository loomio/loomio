  8a42a135c0c11c98:
    english: Jamie also sets a 60 percent quorum. Jamie and Samira vote in agreement. All submitted votes support the proposal, but they represent only 40 percent of eligible voters, so neither requirement has been reached.
    translation: Jamie asettaa myös 60 prosentin päätösvaltaisuusvaatimuksen. Jamie ja Samira äänestävät ehdotuksen puolesta. Kaikki annetut äänet kannattavat ehdotusta, mutta ne edustavat vain 40 prosenttia äänestäjäoikeutetuista. Kumpikaan vaatimus ei siis täyty.
