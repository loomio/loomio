# Loomio terminology, shared by the app strings (config/locales/*.yml) and the
# user manual (docs/<locale>/).
#
# Each term is an English word or phrase as it appears in Loomio's interface.
# `means` explains the Loomio sense, which is what translators need when the
# English is ambiguous. Each locale gives the preferred translation as a
# string, or as a hash with:
#
#   use:   the preferred translation
#   avoid: renderings that are wrong in Loomio's sense, such as a literal
#          translation or a word that collides with another term
#   note:  guidance on inflection or usage
#
# Use the preferred translation, inflected as the grammar requires, wherever
# the term carries its Loomio meaning. Locales are app locale codes.
#
# Choosing a preferred translation, in order of priority:
# 1. It must carry the Loomio meaning in `means` and stay distinct from the
#    other terms. Correctness always beats brevity.
# 2. Keep it about as short as the English: interface space is tight, so
#    avoid needlessly long words, but a translation may take as much space as
#    the English does.
# 3. Prefer the everyday words people expect when discussing and deciding
#    things with their peers, especially the words well-known apps already use
#    for the same feature (a poll in a chat app, a tag, an admin).
# `locales` gives each app locale's language name and style: the register and
# conventions both translators follow. The user manual's languages in
# docs/locales.yml take their style from here.
locales:
  be:
    name: Belarusian
    style: Write Belarusian, not Russian, in the official Cyrillic orthography used by the app. Address the reader with lowercase вы (ваш, ваша) and вы imperatives (Выберыце, Націсніце). Never ты. Keep references to people gender-inclusive - use plural forms, present tense, impersonal constructions or group nouns instead of masculine singular past-tense verbs and masculine person nouns (prefer удзельнікі прагаласавалі, or каб прагаласаваць, over ён прагаласаваў or удзельнік прагаласаваў).
  ca:
    name: Catalan
    style: Address the reader informally with tu (el teu, la teva) and informal imperatives (Tria, Desa, Vota), as people do with peers in everyday apps. Never vostè.
  da:
    name: Danish
    style: Address the reader informally with du and imperatives (Rediger, Gem, Stem).
  de:
    name: German
    style: Address the reader informally with du (dein, deine) and informal imperatives (Wähle, Klicke). Never Sie or Ihr for the reader. Prefer gender-neutral person nouns (Teilnehmende, Abstimmende).
  el:
    name: Greek
    style: Address the reader with the polite plural (εσείς) and plural imperatives (Ψηφίστε, Επιλέξτε). Use correct accents, including on capitalised words in sentences.
  es:
    name: Spanish
    style: Address the reader informally with tú (tu, tus) and informal imperatives (Selecciona, Elige). Never usted or su for the reader.
  fi:
    name: Finnish
    style: Address the reader informally with sinä forms and informal imperatives (Valitse, Napsauta), as Finnish software does.
  fr:
    name: French
    style: "Address the reader with neutral formal vous (vous, votre, vos) and vous imperatives (Cliquez, Choisissez). Use infinitives for short button and menu labels (Enregistrer). Use French typography, with a narrow no-break space before ? ! : and ; as the app already does."
  he:
    name: Hebrew
    style: Write gender-neutral Hebrew. Address the reader with infinitives and impersonal forms (יש לבחור, ניתן לשנות) rather than masculine or feminine singular.
  hr:
    name: Croatian
    style: Address the reader with the polite plural vi (vaš, vaša) and plural imperatives (Uredite, Glasajte, Spremite), as most of the app does.
  hu:
    name: Hungarian
    style: Address the reader informally with te forms and informal imperatives (Válaszd ki, Kattints). Never Ön or formal verb forms.
  it:
    name: Italian
    style: Address the reader informally with tu (tuo, tua) and informal imperatives (Seleziona, Scegli). Never Lei for the reader.
  ja:
    name: Japanese
    style: Use polite です/ます style. Avoid addressing the reader with あなた; describe actions directly.
  nl_NL:
    name: Dutch
    style: Address the reader informally with je and jouw and informal imperatives (Selecteer, Kies). Never u or uw.
  pl:
    name: Polish
    style: Address the reader informally with ty forms and imperatives (Edytuj, Zapisz, Głosuj). Prefer gender-neutral constructions over masculine past-tense forms.
  pt_BR:
    name: Brazilian Portuguese
    style: Write Brazilian Portuguese. Address the reader with você (seu, sua) and imperatives in the você form (Selecione, Escolha). Never tu.
  ro:
    name: Romanian
    style: Address the reader informally with tu (tău, ta) and informal imperatives (Alege, Salvează, Votează), as people do with peers in everyday apps. Never dumneavoastră. Always write full diacritics, with comma-below ș and ț, never cedilla ş or ţ.
  ru:
    name: Russian
    style: Address the reader with lowercase вы (ваш, ваша) and вы imperatives (Выберите, Нажмите). Never ты.
  sl:
    name: Slovenian
    style: Address the reader with the polite plural vi and plural imperatives (Glasujte, Izberite), as the app does.
  sv:
    name: Swedish
    style: Address the reader informally with du and imperatives (Redigera, Spara, Rösta).
  tr:
    name: Turkish
    style: Address the reader with polite imperatives in button and menu labels kept short (Kaydet, Oy ver) and siz forms in sentences.
  uk:
    name: Ukrainian
    style: Address the reader with lowercase ви (ваш, ваша) and ви imperatives (Виберіть, Натисніть). Never ти.
  zh_CN:
    name: Simplified Chinese
    style: Write Simplified Chinese as used in mainland China. Address the reader as 您 where needed, as most of the app does, but prefer direct action phrasing without a pronoun.
  zh_TW:
    name: Traditional Chinese
    style: Write Traditional Chinese as used in Taiwan, with Taiwan software terms (儲存, 範本, 設定). Address the reader as 您 where needed, as most of the app does, but prefer direct action phrasing without a pronoun.

