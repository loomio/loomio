  55ccc01c9b274a87:
    english: |-
      ## Key points
      - Aim for a ‘good enough’ decision.
      - Involve many voices to develop a workable proposal.
      - Ask if anyone has a valid objection.
      - Amend the proposal to resolve objections.
    translation: |-
      ## Puntos clave
      - Busca una decisión «suficientemente buena».
      - Escucha distintas voces para elaborar una propuesta viable.
      - Pregunta si alguien tiene una objeción válida.
      - Modifica la propuesta para resolver las objeciones.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7c2ef9fc3419f4b7:
    english: |-
      **Typical roles:**
      - Proposer: The person who raises a topic that requires a decision.
      - Facilitator: Someone who can help the proposer do their job efficiently.
    translation: |-
      **Funciones habituales:**
      - Proponente: la persona que plantea un tema sobre el que hay que decidir.
      - Facilitador: alguien que ayuda al proponente a realizar su tarea de manera eficiente.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c56d1ea7a5582723:
    english: |-
      ## Consent process steps
      You notice a problem or opportunity and take the initiative.
      1. Present a proposal - start a Loomio **discussion**.
      2. Facilitate a round of questions, reactions and any comments to improve the proposal - run a **Sense check proposal**.
      3. Amend the proposal with suggestions and comments.
      4. Ask if anyone has a meaningful objection to the amended proposal - run a **Consent proposal**.
      5. Integrate valid objections to create an amended version of the proposal that everyone consents is ‘safe to try’ - state the decision **outcome**.
    translation: |-
      ## Pasos del proceso de consentimiento
      Detectas un problema o una oportunidad y tomas la iniciativa.
      1. Presenta una propuesta: inicia una **discusión** en Loomio.
      2. Facilita una ronda de preguntas, reacciones y comentarios para mejorar la propuesta: inicia una **propuesta de consulta**.
      3. Modifica la propuesta a partir de las sugerencias y los comentarios.
      4. Pregunta si alguien tiene una objeción importante a la propuesta modificada: inicia una **propuesta de consentimiento**.
      5. Integra las objeciones válidas para crear una versión que todas las personas consideren «segura para probar»: comunica la **conclusión** de la decisión.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  735e10dde58793f0:
    english: |-
      >[!Tip]
      >In more complex decisions you may also include a clarifying **Questions round** at step 2, to help people understand the proposal before inviting them to react and comment on the proposal.
    translation: |-
      >[!Tip]
      >En decisiones más complejas, también puedes incluir una **ronda de preguntas** aclaratorias en el paso 2. Así ayudarás a las personas a entender la propuesta antes de pedirles reacciones y comentarios.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
