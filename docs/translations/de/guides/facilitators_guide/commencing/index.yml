navigation_title: Beginn
blocks:
  43e4cbf778263d11:
    english: "# Commencing"
    translation: "# Beginn"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0ce0604bb021d98f:
    english: "## Invitation"
    translation: "## Einladung"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d5fabca3934dafd:
    english: How participants are invited into a facilitated space is incredibly important. People understand huge amounts of information from the invitation, and use it to judge how a space will be held and if they belong there. The moment of invitation is in many ways the defining opportunity to set the tone and establish trust.
    translation: Wie Menschen zur Teilnahme an einem moderierten Raum eingeladen werden, ist sehr wichtig. Aus einer Einladung entnehmen sie viele Informationen. Daran beurteilen sie, wie der Raum gestaltet wird und ob sie dazugehören. Die Einladung ist eine wichtige Gelegenheit, den Ton zu setzen und Vertrauen aufzubauen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a8d7e10a50432195:
    english: |-
      > <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../rich_200.png"> Decision making is all about communication: your group can only make good decisions together if there’s a foundation of good communication in place first. This means being clear about what the purpose of a discussion or meeting is, who needs to be involved, what the time-frame is, and what people can expect.
      >
      > — Richard Bartlett
    translation: |-
      > <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../rich_200.png"> Bei Entscheidungen geht es um Kommunikation: Deine Gruppe kann nur dann gemeinsam gute Entscheidungen treffen, wenn die Kommunikation auf einer guten Grundlage steht. Dazu gehört Klarheit über den Zweck einer Diskussion oder eines Treffens, darüber, wer beteiligt sein sollte, wie viel Zeit vorgesehen ist und was die Beteiligten erwarten können.
      >
      > — Richard Bartlett
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ab260e60bf87a11d:
    english: 'Key aspects to an invitation:'
    translation: 'Wichtige Aspekte einer Einladung:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ff258493e21d7f3a:
    english: |-
      * **Background.** What is this thing? What am I being asked to do? Who is behind this? Who else will be involved? What is the time commitment, topic focus, and protocol?
      * **Context.** What is the character of this specific engagement? Of all the possible formats and ways it could go, which one will it be? Why now, why this way?
      * **Belonging.** Am I welcome? Is this for me? Am I needed in this process? What is my unique value and contribution? Why should I specifically be compelled?
      * **Safety.** Does this invitation indicate thoughtfulness, trust, and understanding? Is the structure of the engagement up to handling the inherent power dynamics at play? What level of honesty or vulnerability will this require of me? Do I think the person inviting is going to hold me well?
      * **Accessibility.** Will my basic requirements for participation be accommodated? Language, assistive technology, unfamiliar jargon, etc. Will it be possible for me to engage?
    translation: |-
      * **Hintergrund.** Worum geht es? Was soll ich tun? Wer steht dahinter? Wer ist noch beteiligt? Wie viel Zeit muss ich einplanen, welches Thema steht im Mittelpunkt und nach welchen Regeln läuft es ab?
      * **Kontext.** Was zeichnet diese konkrete Beteiligung aus? Welches der möglichen Formate wird gewählt und wie wird der Ablauf aussehen? Warum findet sie jetzt und auf diese Weise statt?
      * **Zugehörigkeit.** Bin ich willkommen? Ist das etwas für mich? Werde ich in diesem Prozess gebraucht? Was kann gerade ich beitragen? Warum sollte ich mich beteiligen?
      * **Sicherheit.** Zeigt die Einladung, dass sich jemand Gedanken gemacht hat und Vertrauen und Verständnis mitbringt? Kann der geplante Ablauf mit den bestehenden Machtverhältnissen umgehen? Wie offen oder verletzlich muss ich mich zeigen? Traue ich der einladenden Person zu, gut mit mir umzugehen?
      * **Barrierefreiheit.** Werden meine grundlegenden Voraussetzungen für die Teilnahme berücksichtigt? Dazu gehören etwa Sprache, unterstützende Technik und unbekannte Fachbegriffe. Kann ich mich beteiligen?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aabfa9d842af2688:
    english: On Loomio
    translation: Auf Loomio
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8a87ed2ddb6c659f:
    english: |-
      * The tool has a built-in function to [invite users](/en/user_manual/groups/inviting_people/) by email or by sending them a special link. Users can also request to join your group if your settings allow.
      * The invitation tools built into the software are very basic, and getting an unexpected login request for new software without context isn't very inviting, so group creators often introduce people to the idea of Loomio through a separate process.
      * Many aspects of Loomio are already designed to create a safe and respectful space users would want to enter — such as thoughtful [privacy options](/en/user_manual/groups/starting_a_group/#privacy).
      * The design of the software itself is meant to be friendly, simple, and professional, hopefully putting out a trustworthy vibe.
      * Loomio has accessibility features, for people who use assistive technology like screen readers, and translation features for people who speak different languages. Emphasising these aspects in an invitation can make some people feel more welcome.
    translation: |-
      * Mit der integrierten Funktion kannst du [Personen einladen](/en/user_manual/groups/inviting_people/): per E-Mail oder über einen besonderen Link. Wenn deine Einstellungen es erlauben, können Personen auch beantragen, deiner Gruppe beizutreten.
      * Die Einladungsfunktionen der Software sind schlicht. Eine unerwartete Aufforderung, sich bei einer unbekannten Software anzumelden, kann ohne Erklärung abschreckend wirken. Deshalb stellen Menschen, die eine Gruppe gründen, Loomio oft zuerst auf anderem Weg vor.
      * Viele Funktionen von Loomio sollen einen sicheren und respektvollen Raum schaffen, dem Menschen gern beitreten. Dazu gehören durchdachte [Privatsphäre-Einstellungen](/en/user_manual/groups/starting_a_group/#privacy).
      * Die Software ist so gestaltet, dass sie freundlich, einfach und professionell wirkt und Vertrauen schafft.
      * Loomio bietet Funktionen für Menschen, die unterstützende Technik wie Screenreader verwenden, sowie Übersetzungen für Menschen mit unterschiedlichen Sprachen. Wenn du diese Möglichkeiten in der Einladung erwähnst, fühlen sich manche Menschen eher willkommen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cb459c1230aaf54c:
    english: "## Arrival"
    translation: "## Ankommen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ef55fa893f9e1034:
    english: The moment of arrival is the “first impression” of an engagement, and sets the trajectory from there on in. The person has accepted an invitation and decided to step in. They are open and expectant, and the impression they get will make a big impact on their experience.
    translation: Die Ankunft prägt den ersten Eindruck und damit den weiteren Verlauf. Eine Person hat die Einladung angenommen und sich entschieden, teilzunehmen. Sie ist offen und gespannt. Ihr erster Eindruck wird ihre Erfahrung stark beeinflussen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  66e7e79597f6a3d0:
    english: |-
      ### Welcoming
      To enable openness to engagement, participation, and receptivity, a person has to feel welcome. They need their existence acknowledged, and to feel a sense of hospitality.
    translation: |-
      ### Willkommen heißen
      Damit sich Menschen offen beteiligen können, müssen sie sich willkommen fühlen. Sie möchten wahrgenommen und freundlich aufgenommen werden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b3ce2bd5e2ea9acd:
    english: |-
      ### Settling
      When someone enters a physical room, they want to know where to sit, where the exit is, where to go to the bathroom, and if there is coffee available. They need a basic introduction to the space and their place in it.
    translation: |-
      ### Sich zurechtfinden
      Wer einen Raum betritt, möchte wissen, wo man sitzen kann, wo der Ausgang und die Toilette sind und ob es Kaffee gibt. Menschen brauchen eine grundlegende Orientierung im Raum und müssen wissen, welchen Platz sie darin haben.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d6fd9d29415a172:
    english: |-
      * The group description fields and discussion context box are the main space to put a “welcome message” for people arriving into the space.
      * Take a tour of the Loomio space, tweak things to make yourself comfortable (like [notification settings](/en/user_manual/users/email_settings/) and your [profile photo](/en/user_manual/users/user_profile/).
      * See information how you like using different thread views and options like Recent, Unread, Mute, and Star. Make yourself at home.
    translation: |-
      * Die Gruppenbeschreibung und das Kontextfeld einer Diskussion sind die wichtigsten Orte für eine Willkommensnachricht an neu Angekommene.
      * Sieh dich auf Loomio um und passe die Einstellungen an deine Bedürfnisse an, zum Beispiel die [Benachrichtigungseinstellungen](/en/user_manual/users/email_settings/) und dein [Profilfoto](/en/user_manual/users/user_profile/).
      * Wähle die Ansicht für Diskussionen, die dir am besten liegt, und nutze Optionen wie „Zuletzt“, „Ungelesen“, „Stummschalten“ und „Markieren“. Mach dich mit dem Raum vertraut.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8acf15fe96515738:
    english: "## Who’s in the Room"
    translation: "## Wer ist dabei?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  48c4449cd1d9b135:
    english: Introducing yourself and being introduced to others is one of the most basic and most important human social functions. From Māori *mihimihi* to British “how do you do” to Japanese business card exchanges, every culture places a lot of importance on this. It goes beyond practicalities and politeness and touches on a deep human need, which is a prerequisite for comfort, openness, and focus.
    translation: 'Sich selbst vorzustellen und andere kennenzulernen gehört zu den grundlegendsten und wichtigsten Formen menschlichen Miteinanders. Vom Māori-*mihimihi* über das britische „How do you do?“ bis zum Austausch von Visitenkarten in Japan: Jede Kultur misst dem große Bedeutung bei. Es geht um mehr als praktische Fragen und Höflichkeit. Dahinter steht ein menschliches Grundbedürfnis, das Vertrauen, Offenheit und Konzentration ermöglicht.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a8eec818aeb74e64:
    english: As a facilitator, if you don’t give people a chance to introduce themselves and find out who is around them, they will generally subvert whatever else you’re trying to point their attention at until you allow this process to occur. Consciously design introductions as a feature, and use them as an opportunity to further the overall goals of the interaction.
    translation: Wenn du eine Gruppe moderierst, gib den Beteiligten Gelegenheit, sich vorzustellen und zu erfahren, wer sonst dabei ist. Andernfalls werden sie sich meist damit beschäftigen, selbst wenn du ihre Aufmerksamkeit auf etwas anderes lenken möchtest. Plane Vorstellungsrunden bewusst ein und nutze sie, um die gemeinsamen Ziele zu unterstützen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ad3d2a31a23af036:
    english: "### Check in"
    translation: "### Check-in"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  71d51a259d8b2c35:
    english: Even among groups who already know each other well, this introduction process continues with “checking in” – where everyone has a chance to speak at the beginning of a meeting (often to a question of "what is on top for you", "how are you", or "is there anything preventing you from being present") and other good practices for team cohesion. People have a multitude of identities, which change based on the context. People answer and re-answer “who am I for this moment” all the time, and that is what allows them to orient around one another.
    translation: Auch in Gruppen, deren Mitglieder einander gut kennen, setzt sich das Kennenlernen durch Check-ins fort. Zu Beginn eines Treffens können alle kurz zu Wort kommen, etwa zu Fragen wie „Was beschäftigt dich gerade?“, „Wie geht es dir?“ oder „Hindert dich etwas daran, heute ganz dabei zu sein?“. Auch andere Gewohnheiten können den Zusammenhalt stärken. Menschen haben viele Seiten, die je nach Situation unterschiedlich hervortreten. Sie beantworten die Frage „Wer bin ich in diesem Moment?“ immer wieder neu und können sich dadurch aufeinander einstellen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0573ae3aef6f1c6c:
    english: People's expression does not occur in a vaccuum, but in the context of who they are. A multi-faceted view of someone’s identity is an essential aspect of interpreting their contributions.
    translation: Was Menschen sagen, steht immer im Zusammenhang damit, wer sie sind. Um ihre Beiträge zu verstehen, hilft ein vielschichtiger Blick auf ihre Identität.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  86eb005fd168a424:
    english: "> We start many of our meetings with everyone “checking in” before we get to the agenda. These check-ins are focused not on your work tasks, but on how you’re doing as a human being. If you’re going through a rough patch at home, or you’re sick, or you have exciting positive news, understanding your state of mind will help the entire group have the right context to interpret how you’re communicating. — Richard Bartlett"
    translation: "> Viele unserer Treffen beginnen mit einem Check-in aller Beteiligten, bevor wir zur Tagesordnung kommen. Dabei geht es nicht um deine Aufgaben, sondern darum, wie es dir als Mensch geht. Vielleicht hast du zu Hause eine schwierige Zeit, bist krank oder hast erfreuliche Neuigkeiten. Wenn die Gruppe weiß, wie es dir geht, kann sie besser einordnen, wie du dich ausdrückst. — Richard Bartlett"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d5aea1c0564ccff8:
    english: |-
      * Create a thread called "Introduce yourself" or "Check in". It provides a useful first _call to action_ everyone coming in will understand.
      * For “request to join” groups, we have a function that allows the requestor to introduce themselves to the coordinator, to get access to the group. Some groups have a process of re-posting this content in the intro thread to welcome people in.
      * Upload profile photos! Photos of faces are one of the most powerful ways of feeling like you know who is in the room with you online.
    translation: |-
      * Erstelle eine Diskussion mit dem Titel „Stell dich vor“ oder „Check-in“. Das ist eine erste _Aufforderung zur Beteiligung_, die alle neu Hinzukommenden verstehen.
      * In Gruppen mit Beitrittsanfragen können sich anfragende Personen bei der koordinierenden Person vorstellen, bevor sie Zugang zur Gruppe erhalten. Manche Gruppen veröffentlichen diese Vorstellung anschließend erneut in einer Vorstellungsdiskussion, um die Person willkommen zu heißen.
      * Lade ein Profilfoto hoch. Fotos von Gesichtern helfen besonders dabei, online ein Gefühl dafür zu bekommen, wer mit dir im Raum ist.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d3b245589018cebf:
    english: "## Who’s NOT in the Room"
    translation: "## Wer fehlt?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5daf97a7cbbdd355:
    english: Diversity is critical for quality group decision making. The “wisdom of the crowd effect” (collective intelligence) only works by combining a variety of viewpoints. Outcomes of collaboration processes depend heavily on which voices are, and are not, represented. It’s impossible to have perfect representative inclusion, but you need to take into account who might be missing.
    translation: Vielfalt ist wichtig für gute Gruppenentscheidungen. Die „Weisheit der Vielen“ entsteht nur, wenn unterschiedliche Sichtweisen zusammenkommen. Die Ergebnisse gemeinsamer Prozesse hängen stark davon ab, wessen Stimmen vertreten sind und wessen nicht. Eine vollkommen repräsentative Beteiligung ist unmöglich. Trotzdem solltest du überlegen, wer fehlen könnte.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b16b07380f6bc37c:
    english: It’s extremely common for people to have blind spots around privilege. Humans are not great at intuiting bias, and are a lot better at noticing the presence of something, rather than the absence. Our minds trick us. For example, when women and men are deliberately given an equal amount of talking time there is often a perception that women are getting more than their fair share, due to different ideas about how much they “should” talk ([more details](https://www.quora.com/Do-women-tend-to-talk-more-than-men)). It can be necessary to actually measure or count to get an accurate picture, instead of relying on intuition.
    translation: Viele Menschen übersehen, welche Vorteile sie gegenüber anderen haben. Wir erkennen Verzerrungen nur schwer und bemerken eher, was vorhanden ist, als was fehlt. Unsere Wahrnehmung kann uns täuschen. Wenn Frauen und Männer bewusst gleich viel Redezeit erhalten, entsteht zum Beispiel oft der Eindruck, Frauen sprächen mehr als ihnen zusteht. Das hängt mit unterschiedlichen Vorstellungen darüber zusammen, wie viel sie sprechen „sollten“ ([mehr dazu](https://www.quora.com/Do-women-tend-to-talk-more-than-men)). Um ein zutreffendes Bild zu erhalten, kann es nötig sein, tatsächlich zu messen oder zu zählen, statt sich auf das eigene Gefühl zu verlassen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2b720395fe4e451f:
    english: Someone who does not have particular accessibility needs may not even notice that a venue isn’t wheelchair accessible, a document isn’t formatted for screen readers, or a situation is excluding someone with hearing loss. But the people with those challenges will notice. Someone without kids might not consider that a 7PM meeting time won't work for parents. These, and a thousand other practical, social, and cultural elements, could block someone from *being in the room*.
    translation: Wer selbst keine besonderen Anforderungen an Barrierefreiheit hat, bemerkt vielleicht nicht, dass ein Veranstaltungsort nicht mit dem Rollstuhl zugänglich ist, ein Dokument nicht für Screenreader aufbereitet wurde oder Menschen mit Hörverlust ausgeschlossen werden. Die Betroffenen bemerken es jedoch. Wer keine Kinder hat, denkt möglicherweise nicht daran, dass ein Treffen um 19 Uhr für Eltern ungünstig ist. Diese und viele weitere praktische, soziale und kulturelle Umstände können Menschen daran hindern, *dabei zu sein*.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  25ac4ed8610c591c:
    english: 'It’s especially important to think about who is not in room when trying to solve problems for others: build with, not for; talk with people, not about them. If the people you are trying to serve are not in the room, it’s very unlikely you’ll have all the input you need to be effective. This is just as much about effectiveness for business outcomes as about social justice; it’s almost always better to design collaboration *with* the users or stakeholders.'
    translation: 'Wenn du Probleme für andere lösen möchtest, ist die Frage, wer fehlt, besonders wichtig: Entwickle Lösungen mit den Betroffenen und sprich mit ihnen. Sind die Menschen, für die du etwas erreichen möchtest, nicht beteiligt, fehlen dir wahrscheinlich wichtige Informationen. Das betrifft den Erfolg eines Unternehmens ebenso wie soziale Gerechtigkeit. Zusammenarbeit lässt sich fast immer besser *mit* den Nutzenden oder anderen Beteiligten gestalten.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6b44ef1725c36586:
    english: |-
      * Collaborating online can allow for whole other levels of inclusion. Instead of thinking about a “digital divide”, think about the “digital bridge” — how technology can include people who cannot attend in-person meetings or participate at a specific time, and enable whole new possibilities like multi-lingual discussions.
      * Loomio makes it very clear who is invited to a group and who has participated in a discussion, giving important information for thinking about inclusion. If people are missing, you can see that.
      * If inclusive decision making and diversity of thinking are important to you, periodically ask yourself, “Who’s not in the room? Why?”
    translation: |-
      * Online-Zusammenarbeit kann neue Möglichkeiten der Beteiligung eröffnen. Denk neben der „digitalen Kluft“ auch an digitale Brücken: Technik kann Menschen einbeziehen, die nicht persönlich zu einem Treffen kommen oder zu einer bestimmten Zeit teilnehmen können. Sie ermöglicht auch mehrsprachige Diskussionen.
      * Auf Loomio ist erkennbar, wer zu einer Gruppe eingeladen wurde und wer sich an einer Diskussion beteiligt hat. Das sind wichtige Informationen, wenn du über Beteiligung nachdenkst. Du kannst sehen, wer fehlt.
      * Wenn dir inklusive Entscheidungen und unterschiedliche Sichtweisen wichtig sind, frag dich regelmäßig: „Wer fehlt? Warum?“
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0a5324e7de64cdba:
    english: "## Culture, Protocol, Expectations"
    translation: "## Kultur, Regeln und Erwartungen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  851a2601b835fbb1:
    english: Culture can be quite a nebulous concept, and operates at multiple levels. The culture of the wider society has a big influence, but you can think of every group, and every session or discussion, as having a culture of its own.
    translation: Kultur ist schwer zu fassen und zeigt sich auf mehreren Ebenen. Die Kultur der Gesellschaft hat großen Einfluss. Zugleich kannst du jede Gruppe und jedes Treffen oder jede Diskussion als Raum mit einer eigenen Kultur betrachten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  27d3b10b80ade309:
    english: How do we roll? How do we talk to one another? What is and is not ok here? What are the rules of the game, of how we interact?
    translation: Wie gehen wir miteinander um? Wie sprechen wir miteinander? Was ist hier in Ordnung und was nicht? Welche Regeln gelten für unsere Zusammenarbeit?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  54d83e0b3e487190:
    english: The process of confronting cultural questions can be a powerful moment of self-awareness for a group. Not confronting them can harm ability to meet goals, or sometimes tear a group apart completely.
    translation: Wenn sich eine Gruppe mit solchen Fragen beschäftigt, kann sie viel über sich selbst lernen. Werden die Fragen übergangen, kann das die gemeinsamen Ziele gefährden oder eine Gruppe sogar auseinanderbringen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f9918d7d61cef0c9:
    english: Culture, protocol, and expectations can be implicit or explicit, and by nature intersect in complex ways with power dynamics and social capital. It’s a challenging balance to keep things loose enough to allow emergence, evolution, creativity, and freedom, while being explicit enough about bottom lines and boundaries to ensure safety.
    translation: Kultur, Regeln und Erwartungen können ausgesprochen oder unausgesprochen sein. Sie hängen oft auf komplexe Weise mit Machtverhältnissen und sozialem Ansehen zusammen. Die Herausforderung besteht darin, Raum für Entwicklung, Kreativität und Freiheit zu lassen und zugleich Grenzen klar genug zu benennen, damit sich alle sicher fühlen können.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3d484eafb8524354:
    english: Facilitators often guide the group to live up to the culture it has set, follow the protocols it has agreed, and hold expectations to account. If a facilitator is tasked with this role, they need to be backed by a certain level of explicitness about those agreements, and a certain mandate. Otherwise, it can get messy.
    translation: Moderierende Personen helfen einer Gruppe oft dabei, ihre vereinbarte Kultur zu leben, ihre Regeln einzuhalten und Erwartungen ernst zu nehmen. Dafür brauchen sie klare Vereinbarungen und den Auftrag, darauf zu achten. Fehlt beides, kann diese Aufgabe schwierig werden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ba3ef231a647d607:
    english: People often want to leave things to “common sense” and avoid agreeing a code of conduct or explicit protocols. However, this can disproportionately affect the most vulnerable members of the group, since they will feel the negative impacts of bad behavior or culture first and strongest, and are least empowered to counteract it themselves. It's the responsibility of the more privileged or influential members of the group to think through these questions carefully.
    translation: Oft möchten Menschen sich auf den „gesunden Menschenverstand“ verlassen und keine Verhaltensregeln ausdrücklich vereinbaren. Das kann besonders verletzliche Gruppenmitglieder treffen. Sie spüren die Folgen von schlechtem Verhalten oder einer problematischen Gruppenkultur meist zuerst und am stärksten und können sich oft am schwersten dagegen wehren. Mitglieder mit mehr Einfluss oder Vorteilen tragen Verantwortung dafür, diese Fragen sorgfältig zu bedenken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d14bcec24555318c:
    english: Like a legal contract, you hope you never have to enforce a code of conduct, but if you need it you’re very glad it’s there. You want to agree *before* it becomes necessary. In order for a facilitator or any member of the group to effectively stand up and say, “that’s not OK here”, you need to have already invested in culture-building and expectation-setting.
    translation: Wie bei einem Vertrag hoffst du, Verhaltensregeln nie durchsetzen zu müssen. Wenn es nötig wird, bist du froh, dass es sie gibt. Vereinbare sie, *bevor* du sie brauchst. Damit eine moderierende Person oder ein anderes Gruppenmitglied wirksam sagen kann „Das ist hier nicht in Ordnung“, muss die Gruppe ihre Kultur und Erwartungen zuvor gemeinsam geklärt haben.
