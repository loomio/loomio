  4fc02624e97369e9:
    english: |-
      > <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../silvia_200.png"> For every minute of time with the group, consider spending 3 minutes planning. That means spending three hours preparing for a one hour session. Only as you improve should you spend less time planning.
      >
      > — Silvia Zuur
    translation: |-
      > <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../silvia_200.png"> Harkitse kolmen minuutin suunnittelua jokaista ryhmän kanssa viettämääsi minuuttia kohti. Tunnin tapaamiseen valmistautuminen veisi silloin kolme tuntia. Vähennä suunnitteluun käyttämääsi aikaa vasta kokemuksen karttuessa.
      >
      > — Silvia Zuur
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d18832ab8f94fa1b:
    english: "## Understand Purpose"
    translation: "## Ymmärrä tarkoitus"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  26d88950f0aac205:
    english: Clarification of purpose is one of the highest value offerings of a skilled facilitator — if they can help the group nail that, everything else is possible. Purpose operates at the level of a group as a whole, and at the level of individual discussions/decisions. Purpose is what enables judgment calls about what tools to deploy, what interventions to enact, and what outcomes to aim for. Lack of shared understanding about purpose can be fatal to a discussion, or to the group itself.
    translation: Tarkoituksen selventäminen on yksi tärkeimmistä asioista, joissa taitava fasilitaattori voi auttaa ryhmää. Kun tarkoitus on selvä, myös muu työ on mahdollista. Tarkoitus koskee sekä koko ryhmää että yksittäisiä keskusteluja ja päätöksiä. Sen avulla voi arvioida, mitä työkaluja kannattaa käyttää, milloin keskusteluun pitää puuttua ja mihin tuloksiin pyritään. Jos ryhmällä ei ole yhteistä käsitystä tarkoituksesta, keskustelu tai jopa koko ryhmän toiminta voi kariutua.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4276182ea8afaf36:
    english: "> Always refer back to your purpose-finding questions to check that you’re covering off what the participants want to learn or achieve. — Silvia Zuur"
    translation: "> Palaa aina kysymyksiin, joilla selvitit tarkoitusta. Tarkista niiden avulla, että käsittelette asioita, joita osallistujat haluavat oppia tai saavuttaa. — Silvia Zuur"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aabfa9d842af2688:
    english: On Loomio
    translation: Loomiossa
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ea5f19b8970e4db6:
    english: |-
      * The app offers space for explication of purpose, such as the [group description](/en/user_manual/groups/starting_a_group/#group-description) and [discussion context](/en/user_manual/discussions/using_discussions/#discussion-context) fields.
      * A Loomio discussion *about* purpose is a great place to start with your group, if it's not already clear.
      * Our analytics (stats about how people use the software) show that groups with a clear shared purpose are more successful.
      * [Customer stories and case studies](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help) we've collected emphasise the importance of setting a collective purpose.
    translation: |-
      * Sovelluksessa tarkoituksen voi kuvata esimerkiksi [ryhmän kuvauksessa](/en/user_manual/groups/starting_a_group/#group-description) ja [keskustelun taustatiedoissa](/en/user_manual/discussions/using_discussions/#discussion-context).
      * Jos ryhmän tarkoitus ei ole vielä selvä, aloita siitä *keskustelu* Loomiossa.
      * Käyttötilastojemme mukaan ryhmät, joilla on selkeä yhteinen tarkoitus, onnistuvat paremmin.
      * Keräämämme [asiakastarinat ja tapausesimerkit](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help) korostavat yhteisen tarkoituksen määrittelyn merkitystä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e7d962ee3ac4e476:
    english: "## Rearrange the Furniture"
    translation: "## Järjestä tila tarkoitukseen sopivaksi"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bee66f99abaa8e2a:
    english: Desiging the space you invite people into greatly influences their experience. Every gathering is unique, and deserves a setup to suit. Familiarity signals safety, while changing the environment cues openness to new ideas.
    translation: Tapa, jolla järjestät osallistujille yhteisen tilan, vaikuttaa paljon heidän kokemukseensa. Jokainen kokoontuminen on erilainen ja tarvitsee siihen sopivat puitteet. Tuttu ympäristö luo turvallisuuden tunnetta, kun taas ympäristön muuttaminen voi avata tilaa uusille ajatuksille.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b98fa9d3e5726891:
    english: In offline spaces, literally rearranging the furniture is a habit that helps facilitators get into the right zone to hold space, and prompts them to think about what’s unique in that session. Imagine the difference between everyone seated in rows versus everyone in a circle.
    translation: Kasvokkaisissa tapaamisissa huonekalujen järjestäminen uudelleen auttaa fasilitaattoria valmistautumaan tilanteeseen ja pohtimaan, mikä juuri tässä tapaamisessa on olennaista. Ajattele, miten erilaiselta tuntuu istua riveissä kuin piirissä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  546ba20d5778bb25:
    english: |-
      * Inviting people into a new digital space specifically for decision making is powerful — there’s a “threshold crossing” experience making it as distinct from other online spaces (which might be for socialising or other functions).
      * [Customising your group photo](/en/user_manual/groups/starting_a_group/#upload-a-group-photo) is a prime opportunity to craft the feeling of the space.
      * The group description is a main piece of “furniture” on the group page, and [you can customise it](/en/user_manual/groups/starting_a_group/#group-description) to suit.
    translation: |-
      * Kun kutsut ihmiset uuteen digitaaliseen tilaan nimenomaan päätöksentekoa varten, he siirtyvät selvästi erilaiseen ympäristöön kuin esimerkiksi yhdessäoloon käytetyissä verkkotiloissa.
      * [Ryhmän kuvan muokkaaminen](/en/user_manual/groups/starting_a_group/#upload-a-group-photo) auttaa luomaan tilaan sopivan tunnelman.
      * Ryhmän kuvaus on keskeinen osa ryhmäsivua, ja [voit muokata sitä](/en/user_manual/groups/starting_a_group/#group-description) tarpeen mukaan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bb1d23808a93d41b:
    english: "## Supplies, Tools, Materials"
    translation: "## Tarvikkeet, työkalut ja aineistot"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b5e22b09672c3587:
    english: When facilitation is running smoothly, all the supplies a group needs are right at hand. In offline spaces, this stuff includes post-its, pens, paper, name tags, printouts, and background material. Every step a facilitator takes to be well-prepared in this way allows more time and energy for the work.
    translation: Kun fasilitointi sujuu hyvin, kaikki ryhmän tarvitsemat tarvikkeet ovat käden ulottuvilla. Kasvokkaisissa tapaamisissa niitä voivat olla muistilaput, kynät, paperi, nimilaput, tulosteet ja tausta-aineistot. Hyvä valmistautuminen jättää enemmän aikaa ja energiaa itse työhön.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7da21174f12dfb9e:
    english: |-
      * Many groups use the group description to link to a shared drive of collaborative documents, background information, the group's project management or task tracking system, a list of contacts, etc.
      * Each thread deserves consideration of what people might need to engage with it — putting all the information right at hand is essential (for example, if you reference something, linking directly to it is much more effective than expecting people to search for it).
    translation: |-
      * Monet ryhmät lisäävät ryhmän kuvaukseen linkkejä yhteiseen dokumenttikansioon, taustatietoihin, projektinhallinta- tai tehtäväjärjestelmään ja yhteystietoihin.
      * Mieti jokaisen keskusteluketjun kohdalla, mitä osallistujat tarvitsevat voidakseen osallistua. Tuo tiedot helposti saataville. Jos esimerkiksi viittaat johonkin aineistoon, lisää siihen suora linkki sen sijaan, että osallistujien pitäisi etsiä se itse.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  35dd82fcf7e543d8:
    english: "## Design the Experience"
    translation: "## Suunnittele osallistumiskokemus"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fbc88dd9b9738343:
    english: 'Once they have the basic pieces in place (purpose, tools, background info), good facilitators take time to think through the design of the experience they are inviting: the situation, what success could look like, all the possible pathways and choices. They don’t jump in without a considered design.'
    translation: Kun tarkoitus, työkalut ja taustatiedot ovat selvillä, hyvä fasilitaattori miettii, millaiseen tilanteeseen hän kutsuu osallistujat. Hän pohtii, miltä onnistuminen voisi näyttää ja mitä eri etenemistapoja ja valintoja on tarjolla. Hän ei aloita ilman harkittua suunnitelmaa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a4dce16ca48a4324:
    english: Time and time again we have seen people drastically underestimate the need for prep and design. Stop and think about the experience you want to host, before jumping straight in. Investment in design is paid back many times over by success later.
    translation: Olemme nähneet yhä uudelleen, että valmisteluun ja suunnitteluun tarvittava aika aliarvioidaan selvästi. Pysähdy miettimään, millaisen kokemuksen haluat järjestää, ennen kuin aloitat. Suunnitteluun käytetty aika maksaa itsensä takaisin myöhemmin.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e91f002ee6e53550:
    english: "* Loomio’s most basic functionality follows the structure of good facilitation by design: invite people, discuss a topic, gather divergent input, converge into a specific proposal, test for agreement, confirm outcome."
    translation: "* Loomion perustoiminnot noudattavat hyvän fasilitoinnin rakennetta: kutsu ihmiset mukaan, keskustele aiheesta, kerää erilaisia näkemyksiä, muotoile niistä ehdotus, selvitä kannatus ja vahvista lopputulos."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  211e08fc109e6449:
    english: |-
      * Skilled users are already adapting Loomio for various experience designs — such as a multi-step consultation processes, signing off documents, etc. Each job, when facilitated effectively, takes a certain repeatable shape.
      * Online collaboration design doesn't have to reinvent the wheel. Trust what you know works, and translate it. Many tried and tested offline processes can be adapted to the online space (ex: the [Advice Process](/en/guides/making_decisions/advice_process.html)).
      * [Case studies](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help) of thoughtfully designed processes could be used as “recipes” — if you're not sure what design to use, start by seeing what others have tried.
    translation: |-
      * Kokeneet käyttäjät sovittavat Loomiota jo erilaisiin prosesseihin, kuten monivaiheisiin kuulemisiin ja asiakirjojen hyväksymiseen. Hyvin fasilitoituna kullakin tehtävällä on oma toistettava rakenteensa.
      * Verkkoyhteistyötä ei tarvitse suunnitella alusta asti uudelleen. Hyödynnä toimiviksi havaitsemiasi käytäntöjä. Monet kasvokkaisissa tapaamisissa käytetyt menetelmät voi sovittaa verkkoon, esimerkiksi [neuvonpyyntöprosessin](/en/guides/making_decisions/advice_process.html).
      * Huolellisesti suunniteltujen prosessien [tapausesimerkit](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help) voivat toimia malleina. Jos et ole varma, miten prosessi kannattaa suunnitella, katso ensin, mitä muut ovat kokeilleet.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7e99e2ddc63d7a98:
    english: "## Contextualise the Moment"
    translation: "## Huomioi tilanne"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  427b66f23f4b3c09:
    english: Discussions do not occur in a vacuum, but in the larger context of the group’s history and practice. To be effective, facilitated experiences have to occur with the right timing, and fit in with the rest of the group’s process.
    translation: Keskustelut ovat osa ryhmän historiaa ja toimintatapoja. Jotta fasilitointi toimisi, sen ajoituksen on oltava sopiva ja sen on sovittava ryhmän muuhun toimintaan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  48a889b09297e38b:
    english: 'Key Context Questions:'
    translation: 'Keskeisiä kysymyksiä tilanteesta:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7eccc4a4e4a3b175:
    english: |-
      * Is this a moment of transition?
      * Is this an enhancement of existing practice?
      * Is this one of many concurrent processes, or a singular focus?
      * Are we here to solve a problem, or go deeper, wider, narrower?
    translation: |-
      * Onko ryhmä muutoksen keskellä?
      * Kehittääkö tämä nykyistä toimintatapaa?
      * Onko tämä yksi monista samanaikaisista prosesseista vai ryhmän ainoa painopiste?
      * Haluammeko ratkaista ongelman vai tarkastella asiaa syvemmin, laajemmin tai rajatummin?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c7c8ce0838a076cd:
    english: |-
      * Loomio groups nearly always have a “champion”, who understands the group’s context and makes the call about whether introducing Loomio is right for them.
      * It's not wise to try to change everything at once. Any time Loomio fits nicely into existing workflows, groups will adopt it better.
      * Good timing is when the group is ready to incorporate online collaborative practice effectively. They have to feel the pain of not having the online decision-making space, and be motivated to solve that problem.
      * Consider the group’s attention economy to determine when the right time to raise a given topic might be. Collective attention is a limited resource.
      * Many groups are not even cognisant of their existing collaborative practice and habits, much less clear about how Loomio might fit in. Start with a discussion about the current way of doing things, and what's working or not working.
    translation: |-
      * Loomio-ryhmissä on lähes aina joku, joka tuntee ryhmän tilanteen ja arvioi, kannattaako Loomio ottaa käyttöön.
      * Älä yritä muuttaa kaikkea kerralla. Ryhmät ottavat Loomion helpommin käyttöön, kun se sopii nykyisiin työnkulkuihin.
      * Oikea hetki on silloin, kun ryhmä on valmis hyödyntämään verkkoyhteistyötä. Ryhmän on tunnistettava, että siltä puuttuu yhteinen tila päätöksentekoon verkossa, ja haluttava ratkaista tämä ongelma.
      * Mieti, milloin ryhmällä on aikaa ja huomiota käsitellä tiettyä aihetta. Yhteinen huomio on rajallinen voimavara.
      * Monet ryhmät eivät ole edes tietoisia nykyisistä yhteistyötavoistaan, saati siitä, miten Loomio voisi sopia niihin. Aloita keskustelemalla siitä, miten ryhmä nyt toimii ja mikä toimii tai ei toimi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7bc2616a0ec0b1dc:
    english: "## The Role of the Facilitator"
    translation: "## Fasilitaattorin rooli"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c6d08854a875262a:
    english: Good facilitation requires self-awareness on an individual and collective level. Lack of understanding of the role can lead to misunderstandings, conflict, or unsafe situations.
    translation: Hyvä fasilitointi edellyttää tietoisuutta omasta ja ryhmän toiminnasta. Jos roolia ei ymmärretä, seurauksena voi olla väärinkäsityksiä, ristiriitoja tai turvattomia tilanteita.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aa59e3e4d08a95b7:
    english: "> Have the power handed over to you. When you’re invited into a new group or organization, everybody will be thinking: Who’s this joker? Why should we listen to them? Get somebody who the participants know and trust to introduce you. This builds you up in the participants' minds and helps to hand over the power over to you. — Silvia Zuur"
    translation: "> Pyydä, että sinulle annetaan selkeästi valtuudet toimia. Kun sinut kutsutaan uuteen ryhmään tai organisaatioon, osallistujat voivat miettiä: Kuka tämä on? Miksi kuuntelisimme häntä? Pyydä jotakuta osallistujien tuntemaa ja luottamaa henkilöä esittelemään sinut. Se auttaa osallistujia hyväksymään roolisi ja siirtämään sinulle tarvittavat valtuudet. — Silvia Zuur"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  02d38d1def45d150:
    english: |-
      ### Consent
      It’s critical that the group consents to be facilitated. Attempting to facilitate otherwise can be at worst coercive (unfair to the group) and dangerous (unfair to the facilitator) — and will face resistance and confusion. Facilitators put themselves in a vulnerable position; they must have mandate or they should not agree to engage. Consent is critical for both the facilitator and participants.
    translation: |-
      ### Suostumus
      On tärkeää, että ryhmä suostuu fasilitointiin. Ilman suostumusta fasilitointi voi pahimmillaan painostaa ryhmää ja asettaa fasilitaattorin vaaralliseen asemaan. Se herättää myös vastustusta ja hämmennystä. Fasilitaattori asettaa itsensä haavoittuvaan asemaan, joten hän tarvitsee ryhmän valtuutuksen ennen tehtävän vastaanottamista. Suostumus on tärkeä sekä fasilitaattorille että osallistujille.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a1a8c6ca89dad49a:
    english: |-
      ### Responsibility
      Once a facilitator takes up a mandate, they carry enhanced responsibilities. Facilitators have more claim to floor time, and directing the group’s attention. This has to be used in service to the whole, not for a personal agenda. The words and demeanor of the facilitator will also have a disproportionate effect, meaning they have to act with heightened consideration.
    translation: |-
      ### Vastuu
      Kun fasilitaattori ottaa tehtävän vastaan, hänen vastuunsa kasvaa. Hän voi käyttää muita enemmän puheenvuoroja ja ohjata ryhmän huomiota. Tätä asemaa on käytettävä koko ryhmän hyväksi, ei oman tavoitteen ajamiseen. Fasilitaattorin sanoilla ja käytöksellä on tavallista suurempi vaikutus, joten hänen on toimittava erityisen harkiten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b5f6b4ebd477c97c:
    english: |-
      ### Power
      Facilitation by nature introduces power differentials. If the facilitator cannot exercise power in certain ways, they cannot do their job. For example, to keep a discussion on topic the facilitator might interrupt someone, or say that a certain way of interacting is not OK. It’s not appropriate to expect a facilitator to shoulder responsibility for the experience without giving them the powers they need to deliver successfully. There is no one right answer about how much power, but it has to be balanced with the level of responsibility.
    translation: |-
      ### Valta
      Fasilitointi tuo väistämättä mukanaan eroja vallankäytössä. Fasilitaattori ei voi hoitaa tehtäväänsä, ellei hänellä ole tarvittavia valtuuksia. Hän voi esimerkiksi keskeyttää puhujan pitääkseen keskustelun aiheessa tai puuttua sopimattomaan vuorovaikutukseen. Fasilitaattorilta ei voi odottaa vastuuta prosessista antamatta hänelle valtaa onnistua tehtävässään. Sopivalle vallan määrälle ei ole yhtä vastausta, mutta sen on oltava tasapainossa vastuun kanssa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c82df3fe42db014a:
    english: |-
      ### Responsiveness
      Facilitators do their best work when they can adapt effectively to the emergent reality. Human beings are endlessly complex, and groups of them exponentially more so. Rigid adherence to a plan or protocol without flexibility can set the group up to fail. If a facilitator is not allowed or not willing to adapt to changing circumstance, they cannot effectively hold the space for dynamic humans.
    translation: |-
      ### Mukautuminen
      Fasilitaattori onnistuu parhaiten, kun hän pystyy mukautumaan tilanteen muuttuessa. Ihmiset ovat monimutkaisia, ja ryhmien toiminta on vielä monimutkaisempaa. Joustamaton pitäytyminen suunnitelmassa tai toimintamallissa voi johtaa epäonnistumiseen. Jos fasilitaattori ei saa tai halua mukautua muuttuviin olosuhteisiin, hän ei voi tukea ryhmän toimintaa tehokkaasti.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aad36b296834ab22:
    english: "> Wear and un-wear the facilitation-hat. A challenge many people face is trying to facilitate meetings and workshops with their own team. As a facilitator, they need to be neutral. But as a team member, they have valuable insights to share. Make it really clear when you’re a facilitator and when you’re being a participant. — Silvia Zuur"
    translation: "> Siirry tietoisesti fasilitaattorin ja osallistujan roolien välillä. Monen on vaikea fasilitoida oman tiiminsä kokouksia ja työpajoja. Fasilitaattorin on oltava puolueeton, mutta tiimin jäsenellä on myös arvokkaita näkemyksiä jaettavana. Tee selväksi, milloin toimit fasilitaattorina ja milloin osallistujana. — Silvia Zuur"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  85c4fcf7a6e72361:
    english: |-
      * Many groups using Loomio are experienced with facilitation and already have a shared understanding of the role. They already adapt the tool to meet these needs with some success.
      * Often the person who starts a discussion is assumed to be facilitating it, barring another agreed understanding in the group. Clarity about who is facilitating can greatly enhance mutual safety and success.
      * Loomio naturally creates a dynamic and open to distributed acts of facilitation, such as users tagging in others, requests to stay on topic, suggestions of the right timing for a proposal, etc — but this is often left implicit. Explicitly naming what acts of facilitation are and discussing whether this role is centralised or distributed can clarify the role.
      * Implicit distributed facilitation can be the default starting place for an online group (ie, no discussion of facilitation as a named role), but that setup is actually best for advanced groups prgressing past working with explicit facilitation.
    translation: |-
      * Monet Loomiota käyttävät ryhmät tuntevat fasilitoinnin ja jakavat käsityksen fasilitaattorin roolista. Ne osaavat jo sovittaa työkalua tarpeisiinsa.
      * Usein keskustelun aloittajan oletetaan myös fasilitoivan sitä, ellei ryhmä ole sopinut muuta. Kun fasilitaattorin rooli on selvä, osallistujien on helpompi toimia turvallisesti ja saavuttaa tavoitteensa yhdessä.
      * Loomio mahdollistaa sen, että useat osallistujat tekevät fasilitointiin kuuluvia asioita: kutsuvat muita mukaan mainitsemalla heidät, pyytävät pysymään aiheessa tai ehdottavat sopivaa hetkeä ehdotukselle. Tätä ei kuitenkaan usein sanota ääneen. Roolia selventää, kun ryhmä nimeää nämä tehtävät ja keskustelee siitä, kuuluvatko ne yhdelle henkilölle vai jakautuvatko ne osallistujien kesken.
      * Verkossa toimiva ryhmä voi aloittaa ilman nimettyä fasilitaattoria ja jakaa tehtävät hiljaisesti osallistujien kesken. Tämä tapa sopii kuitenkin parhaiten kokeneille ryhmille, jotka ovat jo harjoitelleet selkeästi määriteltyä fasilitointia.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
