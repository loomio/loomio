  195fe68dbcc6418f:
    english: Loomio can send notifications to your chatroom.
    translation: O Loomio pode enviar notificações para sua sala de bate-papo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bf886ec0d398e8d7:
    english: Chat tools and Loomio work well together. Use chat for quick conversation and timely updates. Move important topics to Loomio when people need time to participate, when a decision must be made, or when the group will need a lasting record.
    translation: As ferramentas de bate-papo e o Loomio funcionam bem juntos. Use o bate-papo para conversas rápidas e atualizações oportunas. Leve os assuntos importantes para o Loomio quando as pessoas precisarem de tempo para participar, quando for necessário tomar uma decisão ou quando o grupo precisar de um registro permanente.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  db7d26a18ddc651d:
    english: Loomio supports Slack, Discord, Microsoft Teams, Matrix and Mattermost.
    translation: O Loomio oferece suporte ao Slack, Discord, Microsoft Teams, Matrix e Mattermost.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  765fc0d609a0db99:
    english: You can send notifications to your chatroom any time you like, just the same way you would invite individual people to vote, or to join a thread.
    translation: Você pode enviar notificações para sua sala de bate-papo quando quiser, assim como convida pessoas para votar ou participar de uma discussão.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a89717f4f41f3212:
    english: You can also configure notifications to always happen when a specific event happens, like someone starting a thread.
    translation: Você também pode configurar notificações automáticas para eventos específicos, como o início de uma discussão.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
