    translation: Em seguida, Alex e Morgan votam a favor, enquanto Taylor vota contra. As cinco pessoas votaram, atingindo o quórum, e quatro dos cinco eleitores elegíveis apoiam a proposta. Esse apoio de 80% supera o requisito de 75%, então os dois requisitos exibem marcas de verificação verdes.
