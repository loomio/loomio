  031f9244f107aba8:
    english: A discussion keeps its context, comments, decisions, and outcomes together in one thread. This page explains how to participate in a thread and use its navigation and actions.
    translation: Keskustelun konteksti, kommentit, päätökset ja johtopäätökset pysyvät yhdessä keskusteluketjussa. Tällä sivulla kerrotaan, miten osallistut keskusteluketjuun ja käytät sen siirtymislinkkejä ja toimintoja.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  479a1564b496bfed:
    english: "## Thread anatomy"
    translation: "## Keskusteluketjun osat"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb745de96e6a612d:
    english: 'A typical thread looks like this:'
    translation: 'Tavallinen keskusteluketju näyttää tältä:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e69f7f0b13fd9f9:
    english: 'From the top of the page, a thread contains:'
    translation: 'Sivun yläosasta alkaen keskusteluketjussa on seuraavat osat:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5b47d6434aa50e94:
    english: "**Group name** - At the top left of the discussion page is the name of the group or subgroup that the discussion belongs to.  Click on this name to go back to the group page."
    translation: "**Ryhmän nimi** - Keskustelusivun vasemmassa yläkulmassa näkyy sen ryhmän tai alaryhmän nimi, johon keskustelu kuuluu.  Palaa ryhmän sivulle napsauttamalla nimeä."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0dab4c46c2bee003:
    english: "**Discussion access** - The access icon at the top right opens the discussion's access settings. A group discussion is available to group members and anyone specifically invited to it, subject to the group's privacy settings."
    translation: "**Keskustelun käyttöoikeudet** - Oikeassa yläkulmassa oleva käyttöoikeuskuvake avaa keskustelun käyttöoikeusasetukset. Ryhmäkeskustelu on ryhmän jäsenten ja siihen erikseen kutsuttujen käytettävissä ryhmän yksityisyysasetusten mukaisesti."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e20178954e6d3ce0:
    english: "**Discussion title** - The name of the discussion."
    translation: "**Keskustelun otsikko** - Keskustelun nimi."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  47687209ed924849:
    english: "**Category tags** - The discussion may have one or more category tags. Using simple tags helps people more easily find discussions of a similar type."
    translation: "**Luokkatunnisteet** - Keskustelulla voi olla yksi tai useampi luokkatunniste. Selkeät tunnisteet auttavat löytämään samankaltaisia keskusteluja."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b817649f985f51de:
    english: "**Discussion author** - The name and avatar of the person who started the discussion, shown beneath the title."
    translation: "**Keskustelun aloittaja** - Keskustelun aloittaneen henkilön nimi ja profiilikuva näkyvät otsikon alla."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c44d5a833b4ec9ff:
    english: "**Date** - Hover over the date to see the full date and time of discussion start."
    translation: "**Päivämäärä** - Näet keskustelun aloituksen tarkan päivämäärän ja kellonajan viemällä osoittimen päivämäärän päälle."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b8062113f1078acb:
    english: "**Seen by** - In the right sidebar, shows who has read the discussion and when."
    translation: "**Nähnyt** - Oikeassa sivupalkissa näkyy, kuka on lukenut keskustelun ja milloin."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  133d0c2e469e9683:
    english: "**Notified** - In the right sidebar, shows who has been notified about the discussion and whether each notification has been read or its email opened."
    translation: "**Ilmoitettu** - Oikeassa sivupalkissa näkyy, kenelle keskustelusta on ilmoitettu ja onko kukin ilmoitus luettu tai sitä koskeva sähköposti avattu."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9f788adb4eab80cc:
    english: "**Discussion context** - Content to frame the discussion."
    translation: "**Keskustelun konteksti** - Teksti, joka antaa keskustelulle taustan."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e8c5ae76dfb5b89b:
    english: "**Discussion interaction and administration tools** - The discussion context has controls to react to and edit it. The right sidebar contains notification, membership and administration actions."
    translation: "**Keskustelun vuorovaikutus- ja hallintatyökalut** - Keskustelun kontekstissa on toimintoja siihen reagoimista ja sen muokkaamista varten. Oikeassa sivupalkissa on ilmoituksiin, jäsenyyteen ja hallintaan liittyviä toimintoja."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8f6eac4359c2b9f6:
    english: "**Comments** - Comments are displayed under the discussion context. The author's name, avatar and posting time show who wrote each comment and when. Interaction and administration tools are available on each comment."
    translation: "**Kommentit** - Kommentit näkyvät keskustelun kontekstin alla. Kirjoittajan nimi, profiilikuva ja julkaisuajankohta kertovat, kuka kirjoitti kommentin ja milloin. Jokaisella kommentilla on omat vuorovaikutus- ja hallintatyökalunsa."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f978af6c9af4afe5:
    english: |-
      **Navigation, notifications and actions** - The right sidebar contains
      shortcuts to activity and milestones, notification and membership information,
      and the thread actions available to you.
    translation: |-
      **Siirtyminen, ilmoitukset ja toiminnot** - Oikeassa sivupalkissa on
      pikavalintoja tapahtumiin ja merkkipaaluihin, tietoja ilmoituksista ja jäsenistä
      sekä käytettävissäsi olevat keskusteluketjun toiminnot.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f8c4084e9e8a2b27:
    english: "## Discussion context"
    translation: "## Keskustelun konteksti"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5940bad6cb1cb49f:
    english: The discussion **context** is always found at the top of the discussion. Use the context to frame the discussion or decision.
    translation: Keskustelun **konteksti** on aina keskustelun alussa. Sen avulla voit antaa taustan keskustelulle tai päätökselle.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  415dd2d0f1eacc9f:
    english: Think of your group as you write content in the discussion context.  Your aim is to get a discussion going, so consider how you can motivate people to participate.  In general, keep the discussion context simple and clear.
    translation: Ajattele ryhmääsi, kun kirjoitat keskustelun kontekstia.  Tarkoitus on saada keskustelu käyntiin, joten mieti, miten kannustat ihmisiä osallistumaan.  Pidä konteksti yleensä yksinkertaisena ja selkeänä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a1fcece28d8fb61d:
    english: Write the discussion context when starting or editing a discussion. **Edit** a discussion with the pencil icon.
    translation: Kirjoita keskustelun konteksti, kun aloitat keskustelun tai muokkaat sitä. Muokkaa keskustelua kynäkuvakkeesta valitsemalla **Muokkaa**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2f47adddef6b31d9:
    english: As the discussion progresses, update discussion context.  Think of the context like a whiteboard in your meeting room, where you can write the agenda, the outcomes intended and how you plan to get there.
    translation: Päivitä keskustelun kontekstia keskustelun edetessä.  Voit ajatella sitä kokoushuoneen valkotauluna, johon kirjaat esityslistan, tavoitellut johtopäätökset ja suunnitelman niiden saavuttamiseksi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c82ec20629208982:
    english: At the bottom of the context panel is a formatting bar, where you can format text, attach files, images and embed a video.
    translation: Kontekstipaneelin alareunassa on muotoilupalkki. Sen avulla voit muotoilla tekstiä, liittää tiedostoja ja kuvia sekä upottaa videon.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e606d83ae0fb2178:
    english: "### Notify people about context changes"
    translation: "### Ilmoita ihmisille kontekstin muutoksista"
    status: machine
