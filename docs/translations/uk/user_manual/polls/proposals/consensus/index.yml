navigation_title: Консенсус
blocks:
  9f617c478e625137:
    english: "# Consensus"
    translation: "# Консенсус"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7fdabc28ebd47ad3:
    english: A Consensus proposal seeks collective agreement from everyone involved. The default responses let participants agree, abstain, disagree, or block.
    translation: Пропозиція «Консенсус» спрямована на досягнення спільної згоди всіх залучених. Стандартні варіанти відповіді дають учасникам змогу погодитися, утриматися, не погодитися або заблокувати пропозицію.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  82dbfd2dd1160c29:
    english: This page explains how to run one Consensus proposal. See the [Consensus process](/en/guides/making_decisions/consensus_process) for the complete workflow from discussion and Sense check through amendment and outcome.
    translation: На цій сторінці описано, як провести одну пропозицію «Консенсус». Повний порядок роботи — від обговорення й перевірки сенсу до внесення змін і висновку — дивіться в розділі [Процес консенсусу](/en/guides/making_decisions/consensus_process).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  12074389ed4de458:
    english: "## When to use Consensus"
    translation: "## Коли використовувати консенсус"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e1e89b6df3a1dbe1:
    english: Use Consensus for decisions where broad ownership matters and the group is prepared to work through concerns together. It suits shared standards, governance agreements, strategic commitments, and decisions that affect the whole group.
    translation: Використовуйте консенсус для рішень, за які важливо нести спільну відповідальність і щодо яких група готова разом опрацювати зауваження. Він підходить для спільних стандартів, домовленостей про управління, стратегічних зобов’язань і рішень, що стосуються всієї групи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a28ea900326c3254:
    english: Consensus usually requires discussion and proposal development before voting. Define the meaning and consequences of **Block** for your group. If your process does not use blocks, edit the template to remove that option.
    translation: Консенсус зазвичай потребує обговорення та доопрацювання пропозиції до голосування. Визначте для своєї групи значення та наслідки відповіді **Блокувати**. Якщо у вашому процесі блокування не застосовують, відредагуйте шаблон і вилучіть цей варіант.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f795d33e2be59883:
    english: "## Example: adopt a bottle return standard"
    translation: "## Приклад: ухвалення стандарту повернення пляшок"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dda29f07ddb547f7:
    english: Oatmilk Cooperative has developed a standard covering deposits, collection, washing, food-safety records, and reporting. Because every team will use it, the cooperative seeks consensus before adopting it.
    translation: Кооператив «Вівсяне молоко» розробив стандарт щодо застави за пляшки, їх збирання та миття, обліку безпечності харчових продуктів і звітності. Оскільки стандарт застосовуватиме кожна команда, кооператив прагне досягти консенсусу перед його ухваленням.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9703f1f9474243af:
    english: "## Set up the proposal"
    translation: "## Підготуйте пропозицію"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e63b2959e1f6553:
    english: State the complete agreement being considered and link to supporting information. Explain each response, particularly the distinction between disagreeing and blocking. Allow enough time for questions and amendments.
    translation: Викладіть повний текст угоди, яку розглядають, і додайте посилання на супровідні матеріали. Поясніть кожен варіант відповіді, особливо різницю між незгодою та блокуванням. Залиште достатньо часу для запитань і внесення змін.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Голосуйте"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  955925e0c6998049:
    english: Participants choose the response that matches their position and explain the interests or concerns behind it. A block reason should identify why adopting the proposal would violate a fundamental need or agreed principle.
    translation: Учасники вибирають відповідь, що відповідає їхній позиції, і пояснюють свої інтереси або зауваження. Причина блокування має пояснювати, чому ухвалення пропозиції порушить основоположну потребу або узгоджений принцип.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Ознайомтеся з результатами"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d5d9f0dbb463bed7:
    english: The chart shows the balance of responses. Review every disagreement and block reason; consensus is a process of resolving concerns, not only counting agreement votes.
    translation: Діаграма показує співвідношення відповідей. Розгляньте кожну незгоду та причину блокування. Досягнення консенсусу потребує опрацювання зауважень, а не лише підрахунку голосів за пропозицію.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f7318776f4a978fc:
    english: If the group reaches agreement, publish an outcome recording the final standard and responsibilities. Otherwise, record what will be revised and when the group will return to the proposal.
    translation: Якщо група досягне згоди, опублікуйте висновок із остаточним стандартом і розподілом обов’язків. Інакше зафіксуйте, що буде переглянуто і коли група повернеться до пропозиції.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
