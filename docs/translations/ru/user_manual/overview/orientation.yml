    english: "### Tabs"
    translation: "### Вкладки"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cdd3c098983b6066:
    english: 'The tabs under the group description provide access to:'
    translation: 'Вкладки под описанием группы открывают:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  02760342b07f5ff4:
    english: "**Discussions** - The group's discussion threads and recent activity."
    translation: "**Обсуждения** — темы обсуждений группы и последние действия."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e2c7a0c137330c27:
    english: "**Polls** - A list of polls active in your group."
    translation: "**Опросы** — список активных опросов в вашей группе."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '085bd9dfce8144dc':
    english: "**Members** - The people who belong to the group."
    translation: "**Участники** — люди, входящие в группу."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cfdb369a7fd6e14f:
    english: "**Files** - Documents and other files attached throughout the group. The tab collects files from discussion contexts, comments, proposals, and polls, so you can find a document without remembering where it was attached."
    translation: "**Файлы** — документы и другие файлы, прикреплённые в группе. Здесь собраны файлы из описаний обсуждений, комментариев, предложений и опросов. Вы можете найти документ, даже если не помните, где его прикрепили."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6483153cbc12b458:
    english: See [Finding content](/en/user_manual/overview/finding-content) for help with search, filters, tags, bookmarks, and unread discussions.
    translation: О поиске, фильтрах, тегах, закладках и непрочитанных обсуждениях читайте в разделе [Как найти материалы](/en/user_manual/overview/finding-content).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4d65c4ebdb266f6b:
    english: "## Sidebar"
    translation: "## Боковая панель"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  017aecc27a4746ca:
    english: Open the sidebar with the menu button (**☰**) at the top left.
    translation: Чтобы открыть боковую панель, нажмите кнопку меню (**☰**) в левом верхнем углу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0bd69f7ef1a85ec1:
    english: Use the sidebar to open your dashboard, polls awaiting your vote, unread and direct discussions, tasks, and groups. It also links to the user manual and support.
    translation: На боковой панели можно перейти к вашей главной странице, опросам, в которых ожидается ваш голос, непрочитанным и личным обсуждениям, задачам и группам. Там также есть ссылки на руководство пользователя и поддержку.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  45a5b7ceb512d86c:
    english: "### User settings"
    translation: "### Настройки пользователя"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e6c693b0bbf41324:
    english: Select your name in the sidebar to open your user menu.
    translation: Нажмите на своё имя на боковой панели, чтобы открыть меню пользователя.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e671b5bc0a63ce1d:
    english: Use this menu to edit your profile, change notification settings, choose a theme, manage account settings, and sign out.
    translation: В этом меню можно изменить профиль и настройки уведомлений, выбрать тему оформления, управлять настройками учётной записи и выйти из системы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c005f6296b6fdf2d:
    english: "## Notifications"
    translation: "## Уведомления"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  59121c87e06e34d0:
    english: The bell button at the top right opens your in-app notifications. A badge appears when you have notifications you have not viewed.
    translation: Кнопка с колокольчиком в правом верхнем углу открывает уведомления в Loomio. Если у вас есть непросмотренные уведомления, на кнопке появляется значок с их числом.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d128ccedfd3f1379:
    english: See [Notifications](/en/user_manual/users/email_settings) to learn about in-app notifications, email preferences, and notification settings for groups and discussions.
    translation: О том, как работают уведомления в Loomio, настройки электронной почты и уведомления для групп и обсуждений, читайте в разделе [Уведомления](/en/user_manual/users/email_settings).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e4a4ca9c3ed52509:
