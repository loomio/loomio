    english: "## STV Election"
    translation: "## STV-Wahl"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6f93c6ad598d809c:
    english: "[STV Elections](/en/user_manual/polls/stv/) let participants rank candidates in a proportional, multi-winner election. Use STV to elect a committee, board, or group of delegates."
    translation: Bei [STV-Wahlen](/en/user_manual/polls/stv/) ordnen Teilnehmende Kandidierende nach ihren Präferenzen. Das Verfahren ermöglicht eine Verhältniswahl mit mehreren Gewählten. Verwende STV, um ein Komitee, einen Vorstand oder eine Gruppe von Delegierten zu wählen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
