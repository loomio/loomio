  7c8501ecb12311af:
    english: "## How Loomio works"
    translation: "## איך Loomio פועל"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  74caca2261c15283:
    english: 'Loomio has three main parts: groups, discussions, and polls.'
    translation: 'ל־Loomio שלושה חלקים עיקריים: קבוצות, דיונים וסקרים.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5f0a46926a0f7350:
    english: "### Groups"
    translation: "### קבוצות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2060a64d0fabc6d7:
    english: A group is a place for an organization, team, or community to work together. Its home page explains the group's purpose and provides access to its discussions, polls, members, and files.
    translation: קבוצה היא מקום שבו ארגון, צוות או קהילה יכולים לעבוד יחד. דף הבית שלה מסביר את מטרת הקבוצה ומאפשר גישה לדיונים, לסקרים, לחברי הקבוצה ולקבצים שלה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  311793a17709182c:
    english: "### Discussions"
    translation: "### דיונים"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  05ecdffe6c18a1df:
    english: Discussions keep the information and conversation about a topic together. People can share context, comment, reply, react, and use polls to move the discussion towards an outcome.
    translation: דיונים מרכזים את המידע והשיחה בנושא מסוים. אפשר לשתף רקע, לכתוב תגובות, להשיב, להגיב בסימונים ולהשתמש בסקרים כדי לקדם את הדיון לקראת מסקנה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dc9a50d7f1f20c80:
    english: Over time, discussions create a searchable record of the information considered and the decisions made by your group.
    translation: עם הזמן, הדיונים יוצרים תיעוד שאפשר לחפש בו את המידע שנבחן ואת ההחלטות שהקבוצה קיבלה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3448194e8a2ce09d:
    english: "### Polls and proposals"
    translation: "### סקרים והצעות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4ef7092f5f56e773:
    english: Polls help a group understand preferences, gather advice, and make decisions. Different poll templates support different processes. A proposal asks people to respond to a suggested course of action and explain the reason for their response.
    translation: סקרים עוזרים לקבוצה להבין העדפות, לקבל עצות ולקבל החלטות. תבניות סקר שונות מתאימות לתהליכים שונים. הצעה מבקשת מאנשים להגיב לדרך פעולה מוצעת ולהסביר את הסיבה לתשובתם.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  51ab039bc7c374bd:
    english: Polls can be part of a discussion or run independently from the **Polls** tab on a group page.
    translation: סקרים יכולים להיות חלק מדיון או להתנהל בנפרד דרך הלשונית **סקרים** בדף הקבוצה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  47500e7125fdedbc:
    english: To learn where these parts appear in the interface, see the [Quick tour](/en/user_manual/overview/orientation). To start contributing, see [How to participate](/en/user_manual/overview/how-to-participate).
    translation: כדי לראות היכן החלקים האלה מופיעים בממשק, אפשר לעיין ב[סיור קצר](/en/user_manual/overview/orientation). כדי להתחיל להשתתף, אפשר לעיין ב[איך להשתתף](/en/user_manual/overview/how-to-participate).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  57ed823687deabb5:
    english: "## Try it out"
    translation: "## להתנסות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b08a2d6a44f0d7ac:
    english: The best way to learn about Loomio is to [start a free trial](/try)
    translation: הדרך הטובה ביותר להכיר את Loomio היא [להתחיל תקופת ניסיון ללא תשלום](/try)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ced10eda436a40ca:
    english: "## How people use Loomio"
    translation: "## איך משתמשים ב־Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4198817a2724ad0a:
    english: "**Member organizations** to involve members in decisions at scale. Political parties, consumer and worker co-operatives, and membership associations use Loomio to facilitate a safe, inclusive space for members to share information and raise topics, participate in important decisions and vote in General Assembly. Streamline decision processes, improve transparency and accountability, document discussions and record decisions, and include members' voices to organize for action."
    translation: "**ארגוני חברים** משתמשים ב־Loomio כדי לשתף חברים בהחלטות בקנה מידה רחב. מפלגות פוליטיות, קואופרטיבים של צרכנים ועובדים וארגוני חברים משתמשים בכלי כדי ליצור מרחב בטוח ומכיל לשיתוף מידע ולהעלאת נושאים, להשתתפות בהחלטות חשובות ולהצבעה באספה כללית. כך אפשר לייעל תהליכי קבלת החלטות, לשפר שקיפות ואחריותיות, לתעד דיונים והחלטות ולכלול את קולות החברים בתכנון פעולה משותפת."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7b2fd1306e05f4e3:
    english: "**Self-managing organizations** to involve staff in decisions. Self-managing teams, worker co-operatives, and sociocratic organisations use Loomio to run consent, consensus, and advice-based decision processes across distributed teams and time zones. Tap into collective intelligence, distribute decision making, build governance and policy together, and document decisions and discussion."
    translation: "**ארגונים בניהול עצמי** משתמשים ב־Loomio כדי לשתף את הצוות בהחלטות. צוותים בניהול עצמי, קואופרטיבים של עובדים וארגונים סוציוקרטיים משתמשים בכלי לניהול תהליכי החלטה המבוססים על הסכמה, קונצנזוס וקבלת עצות, גם כשהצוותים פועלים במקומות ובאזורי זמן שונים. כך אפשר להיעזר בידע הקבוצתי, לחלק את האחריות לקבלת החלטות, לבנות יחד כללי ממשל ומדיניות ולתעד החלטות ודיונים."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  75d7266c562f65c2:
    english: "**Boards, councils, and distributed networks** to involve stakeholders in decisions. Create a safe space for discussion, keep track of communications, and coordinate across geographies and time zones. Structure decision making processes, improve agility and response times, and preserve organizational memory."
    translation: "**ועדים, מועצות ורשתות מבוזרות** משתמשים ב־Loomio כדי לשתף בעלי עניין בהחלטות. אפשר ליצור מרחב בטוח לדיון, לעקוב אחר התקשורת ולתאם עבודה בין מקומות ואזורי זמן. הכלי מסייע לארגן תהליכי קבלת החלטות, לקצר זמני תגובה ולשמר את הידע הארגוני."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cbe5ae77738f2704:
    english: "**Residential communities and co-ops** to make decisions together as neighbours. Cohousing communities, ecovillages, coliving cooperatives, housing co-ops, and land trusts use Loomio to replace or augment traditional strata and property management with democratic governance. Residents shape decisions about shared land, common spaces, and community agreements, and asynchronous discussion means members can fully participate whether they're on-site or away travelling, keeping a clear record of how the community has chosen to live together."
    translation: "**קהילות מגורים וקואופרטיבים** משתמשים ב־Loomio כדי לקבל החלטות יחד כשכנים. קהילות של דיור שיתופי, כפרים אקולוגיים, קואופרטיבים למגורים, אגודות דיור ונאמנויות קרקע משתמשים בכלי כדי להחליף או להשלים ניהול מסורתי של בתים משותפים ונכסים בממשל דמוקרטי. התושבים מעצבים החלטות על קרקע משותפת, מרחבים משותפים והסכמות קהילתיות. הדיון שאינו דורש השתתפות בו־זמנית מאפשר לחברי הקהילה להשתתף באופן מלא גם כשהם במקום וגם כשהם בנסיעה, ושומר תיעוד ברור של האופן שבו הקהילה בחרה לחיות יחד."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb1039083c952286:
    english: Loomio builds a living record of your organization; the decisions made, who was involved and the discussion leading up to the decision.
    translation: 'Loomio יוצר תיעוד מתמשך של הארגון: ההחלטות שהתקבלו, האנשים שהשתתפו והדיונים שהובילו להחלטות.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
