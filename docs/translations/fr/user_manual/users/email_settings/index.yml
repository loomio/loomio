  fea7dbef040ae7f5:
    english: Once push is enabled in at least one browser, group and thread notification forms let you choose **Email**, **Push**, or **Email and push**. Email and push can use different notification settings. Push delivery can be delayed by the browser, operating system, or network connection.
    translation: Dès que les notifications push sont activées dans au moins un navigateur, les formulaires de notification des groupes et des fils de discussion vous permettent de choisir **E-mail**, **Push** ou **E-mail et push**. Vous pouvez définir des paramètres de notification différents pour les e-mails et les notifications push. Le navigateur, le système d’exploitation ou la connexion réseau peuvent retarder la réception des notifications push.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
