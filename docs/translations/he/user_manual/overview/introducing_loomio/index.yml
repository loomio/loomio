---
navigation_title: היכרות הקבוצה עם Loomio
blocks:
  6c777a62b2b77732:
    english: "# Introducing Loomio to your group"
    translation: "# היכרות הקבוצה עם Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  438cc622ae730bd8:
    english: Introduce Loomio through one useful piece of work. Prepare the group before inviting people, help everyone participate once, and complete the process through to an outcome.
    translation: כדאי להכיר לקבוצה את Loomio דרך משימה מועילה אחת. יש להכין את הקבוצה לפני שליחת ההזמנות, לעזור לכולם להשתתף לפחות פעם אחת ולהשלים את התהליך עד לפרסום מסקנה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9c9fa4e8f6e208e4:
    english: "## Choose one useful starting point"
    translation: "## בחירת נקודת פתיחה מועילה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3353fb04e83837e5:
    english: Start with a real process that your group already needs. A good first use is small enough to complete soon, but relevant enough that people have a reason to participate.
    translation: כדאי להתחיל בתהליך אמיתי שהקבוצה כבר זקוקה לו. שימוש ראשון מתאים הוא תהליך קטן שאפשר להשלים בקרוב, אך חשוב מספיק כדי שתהיה סיבה להשתתף בו.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  652744a2ab28954b:
    english: 'For example:'
    translation: 'לדוגמה:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  19bc6c09eeea816e:
    english: |-
      - prepare the agenda for an upcoming meeting;
      - review and approve meeting minutes;
      - gather feedback on a draft document;
      - decide a small operational question; or
      - identify priorities for the next month.
    translation: |-
      - להכין סדר יום לפגישה קרובה;
      - לעיין בפרוטוקול פגישה ולאשר אותו;
      - לאסוף משוב על טיוטת מסמך;
      - להכריע בשאלה תפעולית קטנה; או
      - לקבוע סדרי עדיפויות לחודש הבא.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  68a0d6b76f36ebaf:
    english: Avoid moving every discussion and decision into Loomio at once. A repeatable process gives the group a clear reason to return and lets you improve the way you run it each time.
    translation: כדאי להימנע מהעברת כל הדיונים וההחלטות ל-Loomio בבת אחת. תהליך שאפשר לחזור עליו נותן לקבוצה סיבה ברורה לחזור, ומאפשר לשפר את אופן ניהולו בכל פעם.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4b65243ef120921b:
    english: "## Prepare the group before inviting people"
    translation: "## הכנת הקבוצה לפני שליחת הזמנות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  305b29c1c832c246:
    english: 'Give people a useful and recognizable place to arrive in:'
    translation: 'יש להכין מקום שימושי ומוכר שיקבל את פני המוזמנים:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  76d859d168805706:
    english: |-
      - add the group's name, logo, cover image, purpose, and important links;
      - check the group's privacy and permissions;
      - add any [category tags](/en/user_manual/discussions/tags) the group will use regularly;
      - create the first real discussion, with the background information people need; and
      - create a practice discussion if members would benefit from trying comments, reactions, and voting without consequences.
    translation: |-
      - להוסיף את שם הקבוצה, הסמל, תמונת הנושא, המטרה וקישורים חשובים;
      - לבדוק את הגדרות הפרטיות וההרשאות של הקבוצה;
      - להוסיף [תגי קטגוריה](/en/user_manual/discussions/tags) שהקבוצה תשתמש בהם בקביעות;
      - לפתוח את הדיון האמיתי הראשון, עם מידע הרקע הדרוש להשתתפות; וכן
      - לפתוח דיון לתרגול, אם כדאי לחברי הקבוצה להתנסות בתגובות, בהבעת רגשות ובהצבעה ללא השלכות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f1decb57ec9d48cb:
    english: Use your own photo in your profile and the organization's logo for the group. This helps people recognize who invited them and which organization an email is about.
    translation: כדאי להוסיף תמונה אישית לפרופיל ואת סמל הארגון לקבוצה. כך קל יותר לזהות ממי הגיעה ההזמנה ולאיזה ארגון קשור האימייל.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '01965093f234bb36':
    english: "## Decide where work belongs"
    translation: "## החלטה היכן לנהל את העבודה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7fbd0d770cbed2bd:
    english: 'Loomio can sit alongside tools your group already uses:'
    translation: 'אפשר להשתמש ב-Loomio לצד הכלים שהקבוצה כבר משתמשת בהם:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '0168271b154f6931':
    english: |-
      | Use | Good place for it |
      |---|---|
      | Quick questions, social conversation, and timely updates | Chat, such as Slack, Teams, Matrix, or Discord |
      | Collaborative editing of a living document | A shared document tool |
      | Assigning work and tracking its completion | A task or project-management tool |
      | A focused discussion, broad participation, a decision, and its lasting record | Loomio |
    translation: |-
      | שימוש | מקום מתאים |
      |---|---|
      | שאלות קצרות, שיחה חברתית ועדכונים שוטפים | צ׳אט, כגון Slack, Teams, Matrix או Discord |
      | עריכה משותפת של מסמך שמתעדכן לאורך זמן | כלי לשיתוף מסמכים |
      | הקצאת משימות ומעקב אחר השלמתן | כלי לניהול משימות או פרויקטים |
      | דיון ממוקד, השתתפות רחבה, החלטה ותיעוד מתמשך שלה | Loomio |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  50fae2027411e538:
    english: Link to documents and other systems from the group description or discussion context. Use [chat integrations](/en/user_manual/integrations/chatbots) to bring important Loomio activity into a channel people already follow.
    translation: אפשר לקשר למסמכים ולמערכות אחרות מתוך תיאור הקבוצה או מתוך הרקע לדיון. באמצעות [שילובים עם צ׳אט](/en/user_manual/integrations/chatbots) ניתן להביא פעילות חשובה ב-Loomio לערוץ שאנשים כבר עוקבים אחריו.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ed67af54bdf1c775:
    english: Tell members what you expect to happen in Loomio. A simple boundary such as “important discussions and decisions go in Loomio; quick coordination stays in chat” is easier to adopt than an unexplained new tool.
    translation: יש להסביר לחברי הקבוצה איזו פעילות צפויה להתקיים ב-Loomio. כלל פשוט, כגון ״דיונים והחלטות חשובים מתקיימים ב-Loomio; תיאום מהיר נשאר בצ׳אט״, קל יותר לאמץ מכלי חדש שמטרתו לא הוסברה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0a799d7911a46f6f:
    english: "## Decide how your group decides"
    translation: "## החלטה כיצד הקבוצה מקבלת החלטות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e1c64de2dc68593:
    english: Loomio does not require every group, or every decision, to use the same process. Some groups arrive with established rules. Others use Loomio while they develop a clearer decision-making practice together.
    translation: Loomio אינה מחייבת את כל הקבוצות, או את כל ההחלטות, להשתמש באותו תהליך. לחלק מהקבוצות כבר יש כללים. אחרות משתמשות ב-Loomio בזמן שהן מפתחות יחד דרך ברורה יותר לקבלת החלטות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6d0c0f50959ab9d6:
    english: "### If your process is already established"
    translation: "### אם לקבוצה כבר יש תהליך מוגדר"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5fbfe86e935d5a8c:
    english: 'Translate the group''s existing requirements into Loomio. Before running a formal decision, make sure participants can tell:'
    translation: 'יש להתאים את הדרישות הקיימות של הקבוצה לעבודה ב-Loomio. לפני קבלת החלטה רשמית, יש לוודא שהמשתתפים יודעים:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9a1b89bd4c5fe02c:
    english: |-
      - which kinds of decisions can be made in Loomio;
      - who provides input and who has authority to decide;
      - who is eligible to vote;
      - whether a [quorum](/en/user_manual/polls/quorum) is required;
      - whether the decision requires a majority, supermajority, unanimous agreement, consent, or another [vote share requirement](/en/user_manual/polls/vote_share_requirements);
      - whether the decision takes effect when its outcome is published or must be ratified elsewhere; and
      - who will record and carry out the outcome.
    translation: |-
      - אילו סוגי החלטות אפשר לקבל ב-Loomio;
      - מי מוסרים מידע או עמדה ומי מוסמכים להחליט;
      - מי זכאים להצביע;
      - האם נדרש [מניין חוקי](/en/user_manual/polls/quorum);
      - האם ההחלטה דורשת רוב, רוב מיוחס, הסכמה פה אחד, הסכמה ללא התנגדות או [שיעור קולות נדרש](/en/user_manual/polls/vote_share_requirements) אחר;
      - האם ההחלטה נכנסת לתוקף עם פרסום המסקנה, או שנדרש אישור נוסף במקום אחר; וכן
      - מי יתעדו את המסקנה ויוציאו אותה לפועל.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4b48b6e0aff5cfc0:
    english: If your constitution, bylaws, policy, or local law governs electronic decisions, make sure the Loomio process follows those requirements. Configure [delegated voters](/en/user_manual/groups/delegated_voters), proposal settings, and [poll templates](/en/user_manual/polls/poll_templates) to make the agreed process easy to repeat.
    translation: אם תקנון, חוקי עזר, מדיניות או חוק מקומי מסדירים קבלת החלטות באמצעים אלקטרוניים, יש לוודא שהתהליך ב-Loomio עומד בדרישות האלה. אפשר להגדיר [מצביעים מיופי כוח](/en/user_manual/groups/delegated_voters), הגדרות להצעות ו[תבניות למשאלים](/en/user_manual/polls/poll_templates) כדי שיהיה קל לחזור על התהליך המוסכם.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b068624ed6c7c6b3:
    english: "### If your group is still deciding"
    translation: "### אם הקבוצה עדיין מגבשת את התהליך"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  14449de544d28a6b:
    english: 'Start a discussion about how decisions should be made. Instead of beginning with a voting tool, ask the group to consider:'
    translation: 'כדאי לפתוח דיון על אופן קבלת ההחלטות. לפני בחירת כלי הצבעה, כדאי לבקש מהקבוצה לשקול:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f65b39a74ae25ed7:
    english: |-
      - What kinds of decisions do we make?
      - Who is affected, who should be consulted, and who is responsible for deciding?
      - Which decisions need advice, consent, consensus, a vote, or delegated authority?
      - What level of participation or support makes a decision valid?
      - How will we respond to objections, tied results, or insufficient participation?
      - How will we communicate, record, review, and change a decision?
    translation: |-
      - אילו סוגי החלטות מתקבלות בקבוצה?
      - על מי ההחלטות משפיעות, עם מי יש להתייעץ ומי אחראים להחליט?
      - אילו החלטות דורשות התייעצות, הסכמה ללא התנגדות, קונצנזוס, הצבעה או סמכות שהוענקה לאחרים?
      - איזו רמת השתתפות או תמיכה נדרשת כדי שהחלטה תהיה תקפה?
      - כיצד נתמודד עם התנגדויות, עם שוויון בתוצאות או עם השתתפות לא מספקת?
      - כיצד נמסור החלטות, נתעד אותן, נבחן אותן מחדש ונשנה אותן?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ce7c0af2ad170b5c:
    english: The answers may be different for an operational decision, a policy, an election, and a constitutional change. See [Making decisions](/en/guides/making_decisions) to compare several complete processes.
    translation: התשובות עשויות להשתנות בין החלטה תפעולית, מדיניות, בחירות ושינוי תקנון. ב[קבלת החלטות](/en/guides/making_decisions) אפשר להשוות בין כמה תהליכים מלאים.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  aac26fc96b90744d:
    english: If the group is not ready to settle every rule, agree on a provisional process for one low-risk decision. State what the result will mean before asking people to participate, publish an outcome, then review how the process worked. Record what the group learns in its description, governance documents, or reusable templates.
    translation: אם הקבוצה עדיין אינה מוכנה לקבוע את כל הכללים, אפשר להסכים על תהליך זמני להחלטה אחת בעלת סיכון נמוך. יש להסביר מראש מה תהיה משמעות התוצאה, לפרסם מסקנה לאחר ההשתתפות ואז לבחון כיצד התהליך עבד. כדאי לתעד את מה שהקבוצה למדה בתיאור שלה, במסמכי הממשל שלה או בתבניות לשימוש חוזר.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  23ed8fb3e887afbc:
    english: "## Invite people"
    translation: "## הזמנת אנשים"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a5d369ad9df691fe:
    english: "[Invite people](/en/user_manual/groups/inviting_people) with a short personal message that explains:"
    translation: 'יש [להזמין אנשים](/en/user_manual/groups/inviting_people) עם הודעה אישית קצרה שמסבירה:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3383207ff2fcc99b:
    english: |-
      - why the group is using Loomio;
      - what you are asking them to do first;
      - when you need their response; and
      - where they can get help.
    translation: |-
      - מדוע הקבוצה משתמשת ב-Loomio;
      - מה מתבקשים המוזמנים לעשות תחילה;
      - מתי נחוצה תשובתם; וכן
      - היכן אפשר לקבל עזרה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  282ef8673815823e:
    english: You can begin with a small group of people who will actively test the process, or invite the whole group when everyone needs to participate from the start. In either case, have a discussion ready for them rather than inviting people into an empty group.
    translation: אפשר להתחיל בקבוצה קטנה שתבדוק את התהליך באופן פעיל, או להזמין את כל הקבוצה אם נדרשת השתתפות של כולם מההתחלה. בכל מקרה, כדאי להכין דיון לקראת הגעתם במקום להזמין אנשים לקבוצה ריקה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cd6511a78ce7c9b7:
    english: "## Help everyone participate once"
    translation: "## סיוע לכולם להשתתף פעם אחת"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a37273687b4f4b0:
    english: The first objective is for each person to cross the threshold from receiving an invitation to contributing something.
    translation: המטרה הראשונה היא שכל אדם יעבור מקבלת הזמנה לתרומה כלשהי לדיון.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ce285f27cca389c4:
    english: 'Ask people to:'
    translation: 'יש לבקש מהמשתתפים:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d0b9e80af995edff:
    english: |-
      1. sign in and add a profile photo;
      2. open the welcome or practice discussion;
      3. post a short comment or reaction; and
      4. vote in a low-stakes proposal and, if useful, leave a reason.
    translation: |-
      1. להיכנס לחשבון ולהוסיף תמונת פרופיל;
      2. לפתוח את דיון קבלת הפנים או דיון התרגול;
      3. לפרסם תגובה קצרה או הבעת רגש; וכן
      4. להצביע בהצעה בעלת השלכות מצומצמות, ואם מתאים, להוסיף נימוק.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  919e32e7adb7c4c8:
    english: Members do not need to create a password. They can [sign in by email](/en/user_manual/users/signing_in), and they can reply to eligible discussion emails without first navigating back to the thread.
    translation: חברי הקבוצה אינם צריכים ליצור סיסמה. אפשר [להיכנס לחשבון באמצעות אימייל](/en/user_manual/users/signing_in), ואפשר להשיב לאימיילים מדיונים שמאפשרים זאת בלי לחזור תחילה לשרשור.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  22ceb7104d416acf:
    english: "## Use notifications deliberately"
    translation: "## שימוש מכוון בהתראות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dd99e6dd5c93d9ee:
    english: Access to content and notification about it are separate. Group members can find discussions in their group even when they were not notified immediately.
    translation: גישה לתוכן וקבלת התראה עליו הן שני דברים נפרדים. חברי קבוצה יכולים למצוא דיונים בקבוצה גם אם לא קיבלו עליהם התראה מיד.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0e20732d957eb282:
    english: When starting a discussion, notify the people whose input is needed at that stage. Use @mentions and replies when asking particular people to respond. When voting opens later, invite the eligible voters.
    translation: בעת פתיחת דיון, יש לשלוח התראה לאנשים שנדרשת השתתפותם בשלב הזה. כדי לבקש תגובה מאנשים מסוימים, אפשר להשתמש באזכורי @ ובתשובות. כשההצבעה נפתחת בהמשך, יש להזמין את בעלי זכות ההצבעה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  43339ff0f3d30a50:
    english: If you create a discussion and poll together only to capture a vote, avoid sending a discussion invitation immediately followed by a poll invitation. Either start the discussion without notifying people and invite them through the poll, or run a [standalone poll](/en/user_manual/polls/intro_to_decisions#without-a-discussion).
    translation: אם יוצרים יחד דיון ומשאל רק כדי לאסוף קולות, כדאי להימנע משליחת הזמנה לדיון ומיד אחריה הזמנה למשאל. אפשר לפתוח את הדיון בלי לשלוח התראות ולהזמין אנשים דרך המשאל, או לערוך [משאל עצמאי](/en/user_manual/polls/intro_to_decisions#without-a-discussion).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  467cf9d1e5bd2973:
    english: Show members the [Catch-up and notification settings](/en/user_manual/users/email_settings), especially if they do not expect to visit Loomio every day.
    translation: כדאי להציג לחברי הקבוצה את [הגדרות העדכון וההתראות](/en/user_manual/users/email_settings), במיוחד אם הם אינם מתכוונים להיכנס ל-Loomio מדי יום.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ebe7764d64b17823:
    english: "## Complete the first process"
    translation: "## השלמת התהליך הראשון"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9a165c59ba0aed5a:
    english: 'A first process should demonstrate the complete pattern:'
    translation: 'התהליך הראשון צריך להדגים את כל השלבים:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8bc60d4319adf204:
    english: |-
      1. Introduce the topic and provide context.
      2. Invite discussion or questions when they are needed.
      3. Start the appropriate proposal or poll.
      4. Remind people who have not participated when necessary.
      5. Publish an [outcome](/en/user_manual/polls/outcomes) stating what was decided and what happens next.
    translation: |-
      1. להציג את הנושא ולספק רקע.
      2. להזמין דיון או שאלות כשיש בהם צורך.
      3. לפתוח את ההצעה או המִשׁאָל המתאימים.
      4. להזכיר למי שעדיין לא השתתפו, לפי הצורך.
      5. לפרסם [מסקנה](/en/user_manual/polls/outcomes) שמציינת מה הוחלט ומה יקרה בהמשך.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1235244007a8559b:
    english: The outcome closes the loop and creates a record that members can return to later. Afterward, ask what worked, adjust the process, and choose the next recurring piece of work to run in Loomio.
    translation: המסקנה מסיימת את התהליך ויוצרת תיעוד שחברי הקבוצה יוכלו לחזור אליו בהמשך. לאחר מכן, כדאי לברר מה עבד היטב, לשפר את התהליך ולבחור את המשימה החוזרת הבאה שתתנהל ב-Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c699f8804cdd41b1:
    english: For a facilitated sequence from discussion to decision, see [Making decisions](/en/guides/making_decisions). For board-specific practices, see [Introducing Loomio to your board](/en/guides/board_processes/introduce).
    translation: לתהליך מונחה מדיון ועד להחלטה, ראו [קבלת החלטות](/en/guides/making_decisions). להנחיות המיועדות לוועד המנהל, ראו [הצגת Loomio לוועד המנהל](/en/guides/board_processes/introduce).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
