navigation_title: Abschluss
blocks:
  b2d8fb17fce5a4a3:
    english: "# Concluding"
    translation: "# Abschluss"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4e03229937f959ed:
    english: "## Outcomes & Next Steps"
    translation: "## Fazit und nächste Schritte"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  eaf0fe98db301c7f:
    english: 'Confirming the outcome can be critical to feel like the goals of a collaborative discussion have been achieved. A facilitator can pull together what’s been decided and reflect it back, to help the group walk away with the answers to some key questions:'
    translation: 'Ein Fazit hilft der Gruppe zu erkennen, ob sie die Ziele einer gemeinsamen Diskussion erreicht hat. Die moderierende Person kann die Entscheidungen zusammenfassen und der Gruppe zurückmelden. So lassen sich wichtige Fragen klären:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  00ed94f662c9643a:
    english: |-
      * What did we do?
      * What does it mean?
      * What will happen now?
      * What is my responsibility?
      * What will be different because we went through this experience?
    translation: |-
      * Was haben wir getan?
      * Was bedeutet das?
      * Was passiert als Nächstes?
      * Wofür bin ich verantwortlich?
      * Was wird sich durch diese Erfahrung ändern?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0f9ecf512b4990b7:
    english: Sometimes the answers to these questions are very concrete, such as action points, while other times they are more abstract, such as deepening shared understanding.
    translation: Manchmal sind die Antworten ganz konkret, etwa Aufgaben für die nächsten Schritte. Manchmal sind sie weniger greifbar, etwa ein besseres gemeinsames Verständnis.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aabfa9d842af2688:
    english: On Loomio
    translation: Auf Loomio
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a63bbb12b1a1e04c:
    english: |-
      * [Outcomes](/en/user_manual/polls/outcomes/) are a very important tool. A proposal ending is not quite the end: there’s a need to sum up conclusively. That's what the outcome feature is for.
      * Many Loomio discussions come to a natural end without even using proposals or publishing outcomes. These discussions still provide a lot of value, and it can be helpful to update the context box with an outcome summary for later reference.
      * If specific people have action points, you can @mention their names and they will be notified.
    translation: |-
      * [Fazits](/en/user_manual/polls/outcomes/) sind ein wichtiges Werkzeug. Wenn ein Vorschlag endet, fehlt noch ein abschließender Überblick. Dafür gibt es die Fazit-Funktion.
      * Viele Diskussionen auf Loomio enden ganz natürlich, ohne Vorschläge oder veröffentlichte Fazits. Auch sie sind wertvoll. Du kannst das Kontextfeld um eine Zusammenfassung ergänzen, damit die Gruppe später darauf zurückgreifen kann.
      * Wenn bestimmte Personen Aufgaben übernehmen, kannst du ihre Namen mit @ erwähnen. Sie werden dann benachrichtigt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  55a9b345194f80d6:
    english: "## Reporting & Harvesting"
    translation: "## Dokumentieren und Erkenntnisse festhalten"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fc6ee28887dd5ab1:
    english: To understand the meaning of an experience, you have to inquire into how it fits into the bigger context. What was this moment, in the bigger rhythm of our progress? What form will our understanding from this experience take — a story, a report, a change, a call to action?
    translation: Um eine Erfahrung einzuordnen, betrachte sie im größeren Zusammenhang. Welche Rolle spielte dieser Moment für den Fortschritt der Gruppe? In welcher Form soll das Gelernte festgehalten werden – als Geschichte, Bericht, Veränderung oder Aufruf zum Handeln?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  eb2cdc1c6526e053:
    english: The experience happens in the moment, but its impact often comes from putting handles on it, giving it a name, and being able to use it and refer to it. Otherwise you risk forgetting, leaving people out who weren't there, or having to repeat it later. Productive collaboration is often helped by tangible documentation or reporting.
    translation: Eine Erfahrung findet in einem bestimmten Moment statt. Ihre Wirkung entsteht oft erst, wenn die Gruppe sie benennt, festhält und später darauf zurückgreifen kann. Sonst gerät sie in Vergessenheit, Menschen ohne Beteiligung bleiben außen vor oder die Arbeit muss wiederholt werden. Eine konkrete Dokumentation oder ein Bericht kann die Zusammenarbeit erleichtern.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4104d8b917a87b0e:
    english: |-
      * Loomio is self-documenting — notes write themselves as an integrated part of the process. This creates a gold-mine of archival content for groups, without any extra effort.
      * We have some features to support harvesting and archiving: the search function, the “previous decisions” list, and the print discussion option.
      * Premium plans offer the option to export all your group's Loomio data.
      * Many groups use Loomio to integrate content from various channels. For example, posting a meeting announcement and building the agenda on Loomio, having the meeting in person, posting the notes back on Loomio, and making related decisions in the same thread. This expands the “self-harvesting” ability of Loomio beyond the online space.
    translation: |-
      * Loomio dokumentiert den Prozess fortlaufend: Notizen entstehen als Teil der Zusammenarbeit. So erhalten Gruppen ohne zusätzlichen Aufwand ein umfangreiches Archiv.
      * Für das Sammeln und Archivieren gibt es die Suche, die Liste früherer Entscheidungen und die Möglichkeit, eine Diskussion zu drucken.
      * Mit einem Premium-Tarif kannst du alle Loomio-Daten deiner Gruppe exportieren.
      * Viele Gruppen führen auf Loomio Inhalte aus verschiedenen Kanälen zusammen. Sie kündigen zum Beispiel ein Treffen an und erstellen dort die Tagesordnung. Nach dem Treffen vor Ort veröffentlichen sie die Notizen auf Loomio und treffen zugehörige Entscheidungen in derselben Diskussion. So wird auch die Arbeit außerhalb von Loomio Teil der gemeinsamen Dokumentation.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dae98cfd5f14b034:
    english: "## Turning Discussion into Action"
    translation: "## Aus Diskussionen wird Handeln"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a39a66938d6cadb0:
    english: There comes a moment when you have to re-engage with the reality outside the room. Occasionally, the need is simply to work with ideas and feelings, without worrying about implementation. But usually a group will not reach its goals without applying its conclusions to real-world action. This transition is part of the total facilitated experience.
    translation: Irgendwann muss die Gruppe ihre Überlegungen mit der Wirklichkeit außerhalb der Diskussion verbinden. Manchmal geht es nur darum, Ideen und Gefühle zu besprechen, ohne an die Umsetzung zu denken. Meist erreicht eine Gruppe ihre Ziele aber erst, wenn sie ihre Schlussfolgerungen in die Tat umsetzt. Dieser Übergang gehört zum begleiteten Prozess.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3e26f1939ffe69fe:
    english: 'It’s at this point that a collaborative process intersects with other organizational systems, and the facilitator has to help figure out how it will work. These other systems might include:'
    translation: 'An diesem Punkt trifft der gemeinsame Prozess auf andere Abläufe in der Organisation. Die moderierende Person hilft zu klären, wie beides zusammenwirkt. Dazu gehören möglicherweise:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cb030c5876714643:
    english: |-
      * **Power** — Who actually makes decisions? What has to happen for ideas to turn into reality here?
      * **Management** — How does this fit into other priorities? What dependencies might exist?
      * **Delegation** — Who will take responsibility for next steps? Will they be held accountable?
      * **Communication** — How will this process or discussion be relayed to others? What do they need to know?
      * **Administration** — How will information from one system be input into another, such as a task tracking or communications tool? Where will information be stored?
    translation: |-
      * **Entscheidungsbefugnis** — Wer trifft tatsächlich Entscheidungen? Was muss geschehen, damit Ideen umgesetzt werden?
      * **Koordination** — Wie passt das zu anderen Prioritäten? Welche Abhängigkeiten gibt es?
      * **Aufgabenverteilung** — Wer übernimmt die nächsten Schritte? Wie wird die Verantwortung nachgehalten?
      * **Kommunikation** — Wie erfahren andere von diesem Prozess oder dieser Diskussion? Was müssen sie wissen?
      * **Verwaltung** — Wie gelangen Informationen in andere Systeme, etwa eine Aufgabenverwaltung oder ein Kommunikationstool? Wo werden sie gespeichert?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5fd6382726e6e5c0:
    english: If there are any blocks around these issues, it can be damaging to leave this realisation until the moment of conclusion. For example, if the participants don’t actually have the power to make a change they have decided, they will feel defeated.Think ahead toward confronting reality when setting up the process, and scope the collaboration accordingly.
    translation: Wenn es hier Hindernisse gibt, ist es problematisch, sie erst am Ende zu erkennen. Haben die Beteiligten zum Beispiel keine Befugnis, eine beschlossene Änderung umzusetzen, kann das entmutigend sein. Bedenke diese praktischen Fragen schon bei der Planung und richte die Zusammenarbeit danach aus.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c3f96d2ea17ab236:
    english: |-
      * You can @mention the names of people who will take actions out of a decision.
      * Many users accomplish integrating Loomio content into other organizational systems through other channels like reviewing Loomio decisions in regular offline meetings, or transferring outcomes to their task tracking process.
      * Making an explicit decision naturally leads people to ask, “OK, but how are we going to take this forward?”
      * Forming a Loomio group often surfaces important questions like, “Who needs to participate here to turn these decisions into action?” If you're missing key stakeholders, leaders, or administrators, you'll get stuck.
    translation: |-
      * Du kannst die Personen, die nach einer Entscheidung Aufgaben übernehmen, mit @ erwähnen.
      * Viele Nutzer übertragen Inhalte von Loomio auf anderen Wegen in die Abläufe ihrer Organisation. Sie besprechen zum Beispiel Loomio-Entscheidungen bei regelmäßigen Treffen oder übernehmen Fazits in ihre Aufgabenverwaltung.
      * Eine ausdrückliche Entscheidung führt oft zur Frage: „Gut, wie setzen wir das jetzt um?“
      * Beim Gründen einer Loomio-Gruppe stellt sich oft eine wichtige Frage: „Wer muss hier mitwirken, damit aus diesen Entscheidungen Taten werden?“ Fehlen wichtige Beteiligte, Führungspersonen oder Verantwortliche für die Verwaltung, kann der Prozess ins Stocken geraten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  60bb517775f11e5d:
    english: "## It Ain’t Over Til It’s Over"
    translation: "## Ein Prozess braucht einen Abschluss"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '079da8800a401a45':
    english: Ending well is important. There’s a ritual to closing a process, and if it’s missed people will feel unsettled. Sometimes the end is determined by running out of time, and sometimes it’s when certain goals are achieved. Recognize implicit and explicit cues indicating if the individuals, and the group as a whole, can feel completion of a process or phase.
    translation: Ein guter Abschluss ist wichtig. Fehlt ein erkennbarer Schlusspunkt, bleibt für Beteiligte oft etwas offen. Manchmal endet ein Prozess, weil die Zeit abläuft, manchmal weil bestimmte Ziele erreicht sind. Achte auf ausgesprochene und unausgesprochene Hinweise, ob einzelne Personen und die Gruppe insgesamt eine Phase oder den ganzen Prozess als abgeschlossen empfinden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  280969e6212842cc:
    english: Participants often look to the leader or facilitator for confirmation of when it’s actually over, and it usually pays to be explicit. Sometimes the signal is a clear statement that the session is wrapping up, a recap of decisions or next steps, and bidding everyone goodbye. Other times groups have established practices like a check-out. Letting a session vaguely trail off will leave a bad taste.
    translation: Beteiligte erwarten oft von der leitenden oder moderierenden Person ein klares Zeichen, wann der Prozess zu Ende ist. Das kann eine Ankündigung des Abschlusses sein, gefolgt von einer Zusammenfassung der Entscheidungen und nächsten Schritte sowie einer Verabschiedung. Andere Gruppen haben dafür feste Abläufe, etwa eine Abschlussrunde. Ein Treffen ohne erkennbaren Abschluss auslaufen zu lassen, hinterlässt oft ein ungutes Gefühl.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e15896aadc163225:
    english: |-
      * The clearest indication of conclusion on Loomio is publishing a decision outcome.
      * Some groups use the [lock thread](/en/user_manual/discussions/using_discussions/#lock-or-unlock-a-thread) feature to prevent further changes and reduce clutter.
      * Deactivating a group is the strongest possible “closure” move. No one can say anything else after that.
      * Since Loomio groups can remain while group activity goes up and down, it can be useful to recognize milestones like the conclusion of a particular phase, even if the group will reactivate in the future.
    translation: |-
      * Auf Loomio ist ein veröffentlichtes Entscheidungsfazit das deutlichste Zeichen für einen Abschluss.
      * Manche Gruppen nutzen die Funktion [Diskussion sperren](/en/user_manual/discussions/using_discussions/#lock-or-unlock-a-thread), um weitere Änderungen zu verhindern und die Übersicht zu wahren.
      * Die Deaktivierung einer Gruppe ist der endgültigste Abschluss. Danach kann niemand mehr etwas hinzufügen.
      * Eine Loomio-Gruppe kann auch dann bestehen bleiben, wenn ihre Aktivität schwankt. Deshalb kann es hilfreich sein, den Abschluss einer bestimmten Phase festzuhalten, selbst wenn die Gruppe später wieder aktiv wird.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
