  6c0cb92cca53d36a:
    english: Loomio includes the selected time, meeting name, duration, location, and statement in the outcome notification and calendar invitation.
    translation: A Loomio a kiválasztott időpontot, a találkozó nevét, időtartamát, helyszínét és a nyilatkozatot is feltünteti a következtetésről szóló értesítésben és a naptármeghívóban.
