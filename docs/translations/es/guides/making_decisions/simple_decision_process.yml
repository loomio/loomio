---
navigation_title: Proceso sencillo para tomar decisiones
blocks:
  84ddd86a61d09414:
    english: "# Simple decision process"
    translation: "# Proceso sencillo para tomar decisiones"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2e868ae6bc4a493b:
    english: This guide describes an end-to-end process using a discussion, Sense check, final proposal, and outcome. For help with the fields and response options of one proposal, see [Proposals](/en/user_manual/polls/proposals/).
    translation: Esta guía describe un proceso completo que incluye una discusión, una comprobación de sentido, una propuesta final y una conclusión. Si necesitas ayuda con los campos y las opciones de respuesta de una propuesta, consulta [Propuestas](/en/user_manual/polls/proposals/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d9877680762afa22:
    english: Some organizations arrive at Loomio having already developed a deep culture and practice of collaborative decision making.  Such organizations have often written handbooks and codified their practices, however, most organizations are still on the journey and looking for some helpful first steps towards making better decisions together.  If the burning question in your organization is **how do we make decisions together?**, then this guide is for you.
    translation: Algunas organizaciones llegan a Loomio con una práctica consolidada de toma de decisiones colaborativa. A menudo han documentado sus métodos en manuales. Sin embargo, muchas otras buscan primeros pasos para tomar mejores decisiones en conjunto. Si en tu organización os preguntáis **¿cómo tomamos decisiones en conjunto?**, esta guía puede ayudarte.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6b321a0ba71f92b8:
    english: "***Here are three steps to help you co-create a better, more cohesive decision with less stress and anxiety.***"
    translation: "***Estos tres pasos te ayudarán a crear con tu grupo una decisión mejor y más compartida, con menos estrés e incertidumbre.***"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c46b32b56b933b0a:
    english: "## Simple decision making - in 3 steps"
    translation: "## Tomar decisiones en 3 pasos sencillos"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e3208a84f88ba36f:
    english: Good collaborative decisions rarely happen by themselves.  They almost always benefit from someone facilitating the discussion through to decision.  So when you launch a discussion thread, you take on a facilitation role (unless someone else is facilitating).
    translation: Las buenas decisiones colaborativas rara vez surgen por sí solas. Casi siempre ayuda que alguien facilite la discusión hasta llegar a una decisión. Cuando inicias un hilo de discusión, asumes esa función, a menos que otra persona se encargue de facilitarlo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1a1da8788ddb01c7:
    english: Follow these 3 steps as you facilitate your group to make a good decision.
    translation: Sigue estos 3 pasos para ayudar a tu grupo a tomar una buena decisión.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5b83a53a3f4caad5:
    english: |-
      ### Step 1 - Introduce and discuss
      Start a Loomio **discussion** to introduce the topic, open conversation and invite people. Include all the context-setting information your group needs to meaningfully participate, along with relevant background so everyone understands the purpose.
    translation: |-
      ### Paso 1 - Presenta el tema y debatidlo
      Inicia una **discusión** en Loomio para presentar el tema, abrir la conversación e invitar a otras personas. Incluye la información que tu grupo necesita para participar, así como los antecedentes necesarios para que todos entiendan el propósito.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8aab998cb04b8635:
    english: 'Be clear about your objective - what is the decision to be made or intended outcome of the discussion? '
    translation: 'Deja claro el objetivo: ¿qué decisión hay que tomar o qué se espera lograr con la discusión?'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d8f53cbae173f5ac:
    english: As the discussion progresses, create space for diverse input - sometimes the best ideas and input come from outside the box.  Work together to explore and test ideas, encouraging a healthy and open discussion.
    translation: A medida que avance la discusión, deja espacio para distintas aportaciones. A veces las mejores ideas vienen de perspectivas inesperadas. Explorad y poned a prueba las ideas en conjunto, y mantened una conversación abierta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7f447ab455f6cea4:
    english: 'Notice when the same voices are dominating and invite some of the quieter people to contribute by @mentioning them and asking them what they think. '
    translation: 'Observa si siempre hablan las mismas personas. Invita a participar a quienes hablan menos: menciónalas con @ y pregúntales qué piensan.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d4bad2b5207ac1d8:
    english: You can make a complex discussion easier to engage with by updating the context section with a summary of the key points.
    translation: Si la discusión es compleja, puedes facilitar la participación actualizando la sección de contexto con un resumen de los puntos principales.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  daeddff561f62553:
    english: |-
      ### Step 2 - Sense check
      As your group begins to converge on path forwards, use a **Sense check** poll to survey opinions and test how the group feels.
    translation: |-
      ### Paso 2 - Comprobación de sentido
      Cuando tu grupo empiece a encontrar un camino a seguir, usa un sondeo de **Comprobación de sentido** para conocer las opiniones y ver qué piensa el grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c1d4e97ce180d85b:
    english: |-
      A ‘Sense check’ lets people know a proposal is forming and encourages them to engage.
      It can also be used to clarify an issue, even if the solution might not be apparent yet.
    translation: |-
      Una «Comprobación de sentido» indica que se está formando una propuesta y anima a las personas a participar.
      También sirve para aclarar una cuestión, aunque todavía no haya una solución clara.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5ff914227bb8706a:
    english: Sense check is a great way to surface concerns before moving to a formal agreement.  You can find out if people are happy with where this is going, if they have questions or need more time, or if they are concerned.
    translation: La comprobación de sentido ayuda a identificar inquietudes antes de llegar a un acuerdo formal. Puedes saber si las personas están de acuerdo con el rumbo, si tienen preguntas, si necesitan más tiempo o si les preocupa algo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  01433544fefb70a5:
    english: 'Use feedback to improve and refine the proposal. If there’s still some work to do, you may need to go back to Step 1 and then run another Sense check round. '
    translation: Usa los comentarios para mejorar y precisar la propuesta. Si aún queda trabajo por hacer, quizá tengas que volver al paso 1 y realizar otra ronda de comprobación de sentido.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  440474199fd76019:
    english: Good engagement will help you assess when you are ready to proceed to a proposal.
    translation: La participación del grupo te ayudará a determinar cuándo es momento de presentar una propuesta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f3799fd76f9d9446:
    english: "### Step 3 - Proposal\nNow when you raise a formal **Proposal**, you do so with confidence that it will pass. "
    translation: |-
      ### Paso 3 - Propuesta
      Cuando presentes una **Propuesta** formal, podrás hacerlo con confianza en que será aprobada.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a3e74110f5a3c7a2:
    english: There may have been a lot of discussion and variations suggested, so be specific about the decision being made, so that everyone knows what the voting options mean.
    translation: Es posible que se hayan debatido muchas variantes. Explica con precisión qué decisión se va a tomar para que todas las personas entiendan qué significa cada opción de voto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b7581cfd1ecffd78:
    english: Set proposal deadlines consciously, so group members have time to consider and engage.  You can always extend the closing date if need be.
    translation: Elige el plazo de la propuesta de modo que los miembros del grupo tengan tiempo para considerarla y participar. Si hace falta, siempre puedes ampliar la fecha de cierre.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b5bcc06f15cde560:
    english: This step is important to formalize agreement with people’s vote and to state an outcome - what just happened and what will happen next.
    translation: 'Este paso permite formalizar el acuerdo mediante los votos y comunicar una conclusión: qué se ha decidido y qué ocurrirá después.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c2f2bbcacfd77ab0:
    english: Proposal results are logged, along with a record of the discussion leading to the decision.
    translation: Los resultados de la propuesta quedan registrados junto con la discusión que llevó a la decisión.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2d82209e751f2ffa:
    english: |-
      ### Outcome
      When a Loomio poll closes, you will be prompted to set an **outcome** to let everyone know what happened and what is going to happen next.
    translation: |-
      ### Conclusión
      Cuando se cierre un sondeo de Loomio, se te pedirá que publiques una **conclusión** para comunicar a todos qué ha ocurrido y qué pasará después.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fb14b31115927d74:
    english: "## Proposals can help in many situations"
    translation: "## Las propuestas pueden ayudar en muchas situaciones"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c1a27b25e2c01ff3:
    english: 'Don''t hesitate to start a proposal just because you''re not sure everyone will agree - proposals are not only for when you have consensus, they''re designed to surface issues that need resolving and are useful for clarifying disagreements. '
    translation: No dudes en iniciar una propuesta aunque no tengas la certeza de que todos estén de acuerdo. Las propuestas también sirven para identificar cuestiones pendientes y aclarar los desacuerdos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6dbf0f3af984b8e8:
    english: The next pages show a few more complex processes for reaching decisions, through [advice](/en/guides/making_decisions/advice_process), [consent](/en/guides/making_decisions/consent_process ), or [consensus](/en/guides/making_decisions/consensus_process ).
    translation: Las páginas siguientes muestran procesos algo más complejos para tomar decisiones mediante [asesoramiento](/en/guides/making_decisions/advice_process), [consentimiento](/en/guides/making_decisions/consent_process ) o [consenso](/en/guides/making_decisions/consensus_process ).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
