  a79abb23e8e1c82f:
    english: A quorum is the minimum percentage of eligible voters who must participate for a poll to be valid. Use it when your governance process requires a particular level of participation.
    translation: El cuórum es el porcentaje mínimo de personas con derecho a voto que deben participar para que una votación sea válida. Úsalo cuando el proceso de toma de decisiones de tu grupo requiera un nivel determinado de participación.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d83e75068f697f6f:
    english: When creating a poll, open **More settings** and enter the required percentage in **Participation quorum**. Leave the field blank when no quorum is required.
    translation: Al crear una votación, abre **Más configuraciones** e introduce el porcentaje requerido en **Cuórum de participación**. Deja el campo en blanco si no se requiere un cuórum.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a04b99724fe62a56:
    english: "![The Quorum setting with a 60 percent participation quorum](./quorum-section.png)"
    translation: "![La configuración del cuórum con un cuórum de participación del 60 por ciento](./quorum-section.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  432f570094ad5b24:
    english: You can also set a quorum in a [poll template](/en/user_manual/polls/poll_templates/) so that polls created from that template use it by default.
    translation: También puedes establecer un cuórum en una [plantilla de votación](/en/user_manual/polls/poll_templates/) para que las votaciones creadas con esa plantilla lo incluyan de forma predeterminada.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  52841ec4c6253973:
