  63c602fdeb39caf8:
    english: This page introduces the main parts of the Loomio interface and where to find the work that involves you.
    translation: На гэтай старонцы апісаны асноўныя часткі інтэрфейсу Loomio і паказана, дзе знайсці працу, якая вас датычыцца.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7d5f837af9189e74:
    english: "## Group page"
    translation: "## Старонка групы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d5b0be3db0bc6202:
    english: Your group home page introduces the group and provides access to its work.
    translation: Галоўная старонка вашай групы знаёміць з ёй і дае доступ да яе працы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5cf665a54aa4a09d:
    english: "### Tabs"
    translation: "### Укладкі"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cdd3c098983b6066:
    english: 'The tabs under the group description provide access to:'
    translation: 'Пад апісаннем групы ёсць укладкі:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  02760342b07f5ff4:
    english: "**Discussions** - The group's discussion threads and recent activity."
    translation: "**Абмеркаванні** - Абмеркаванні групы і нядаўняя актыўнасць."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e2c7a0c137330c27:
    english: "**Polls** - A list of polls active in your group."
    translation: "**Апытанні** - Спіс актыўных апытанняў у вашай групе."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '085bd9dfce8144dc':
    english: "**Members** - The people who belong to the group."
    translation: "**Удзельнікі** - Людзі, якія ўваходзяць у групу."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cfdb369a7fd6e14f:
    english: "**Files** - Documents and other files attached throughout the group. The tab collects files from discussion contexts, comments, proposals, and polls, so you can find a document without remembering where it was attached."
    translation: "**Файлы** - Дакументы і іншыя файлы, далучаныя ў групе. На гэтай укладцы сабраны файлы з апісанняў абмеркаванняў, каментарыяў, прапаноў і апытанняў. Так вы можаце знайсці дакумент, нават калі не памятаеце, дзе яго далучылі."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6483153cbc12b458:
    english: See [Finding content](/en/user_manual/overview/finding-content) for help with search, filters, tags, bookmarks, and unread discussions.
    translation: Пра пошук, фільтры, тэгі, закладкі і непрачытаныя абмеркаванні чытайце ў раздзеле [Пошук змесціва](/en/user_manual/overview/finding-content).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4d65c4ebdb266f6b:
    english: "## Sidebar"
    translation: "## Бакавая панэль"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  017aecc27a4746ca:
    english: Open the sidebar with the menu button (**☰**) at the top left.
    translation: Каб адкрыць бакавую панэль, націсніце кнопку меню (**☰**) уверсе злева.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0bd69f7ef1a85ec1:
    english: Use the sidebar to open your dashboard, polls awaiting your vote, unread and direct discussions, tasks, and groups. It also links to the user manual and support.
    translation: На бакавой панэлі можна адкрыць вашу галоўную панэль, апытанні, у якіх чакаюць вашага голасу, непрачытаныя і прамыя абмеркаванні, задачы і групы. Там таксама ёсць спасылкі на дапаможнік карыстальніка і службу падтрымкі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  45a5b7ceb512d86c:
    english: "### User settings"
    translation: "### Налады карыстальніка"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e6c693b0bbf41324:
    english: Select your name in the sidebar to open your user menu.
    translation: Націсніце на сваё імя на бакавой панэлі, каб адкрыць меню карыстальніка.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e671b5bc0a63ce1d:
    english: Use this menu to edit your profile, change notification settings, choose a theme, manage account settings, and sign out.
    translation: У гэтым меню можна рэдагаваць профіль, змяняць налады апавяшчэнняў, выбіраць тэму, кіраваць наладамі ўліковага запісу і выходзіць з сістэмы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c005f6296b6fdf2d:
    english: "## Notifications"
    translation: "## Апавяшчэнні"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  59121c87e06e34d0:
    english: The bell button at the top right opens your in-app notifications. A badge appears when you have notifications you have not viewed.
    translation: Кнопка са званочкам уверсе справа адкрывае апавяшчэнні ў праграме. Калі ў вас ёсць непрагледжаныя апавяшчэнні, на кнопцы з'яўляецца значок з іх колькасцю.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d128ccedfd3f1379:
    english: See [Notifications](/en/user_manual/users/email_settings) to learn about in-app notifications, email preferences, and notification settings for groups and discussions.
    translation: Пра апавяшчэнні ў праграме, налады электроннай пошты і апавяшчэнні для груп і абмеркаванняў чытайце ў раздзеле [Апавяшчэнні](/en/user_manual/users/email_settings).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e4a4ca9c3ed52509:
    english: "## What to do next"
    translation: "## Што рабіць далей"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b7b09881cc3060b1:
    english: |-
      - Read [How to participate](/en/user_manual/overview/how-to-participate) to learn how to comment, reply, react, and vote.
      - Read [Finding content](/en/user_manual/overview/finding-content) to learn how to locate discussions and decisions.
      - Visit [Discussions](/en/user_manual/discussions) or [Proposals and polls](/en/user_manual/polls/intro_to_decisions) for detailed guidance.
    translation: |-
      - Прачытайце [Як удзельнічаць](/en/user_manual/overview/how-to-participate), каб даведацца, як каментаваць, адказваць, ставіць рэакцыі і галасаваць.
      - Прачытайце [Пошук змесціва](/en/user_manual/overview/finding-content), каб даведацца, як знаходзіць абмеркаванні і рашэнні.
      - Падрабязныя інструкцыі ёсць у раздзелах [Абмеркаванні](/en/user_manual/discussions) і [Прапановы і апытанні](/en/user_manual/polls/intro_to_decisions).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
