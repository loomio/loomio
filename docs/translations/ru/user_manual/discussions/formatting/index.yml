    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dcf90e79aba1a2f9:
    english: |-
      1. Select the text you want to link to - say the name of a document.
      2. Click the link icon.
      3. Paste the address into the **Insert link** field and select **Apply**.
    translation: |-
      1. Выделите текст, который станет ссылкой, например название документа.
      2. Нажмите значок ссылки.
      3. Вставьте адрес в поле **Вставить ссылку** и нажмите **Применять**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  40ecf7d0c79432b2:
