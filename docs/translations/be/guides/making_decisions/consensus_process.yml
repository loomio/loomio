  fda82a609f8773ed:
    english: "### Step 1. State the problem or issue"
    translation: "### Крок 1. Сфармулюйце праблему або пытанне"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c98dda573e480da3:
    english: Vivien starts a Loomio discussion outlining the need to review the organization's brand, inviting participation to develop a new brand concept, and that the approval decision is to be made by the governance board using the consensus process.
    translation: Вівіен пачынае абмеркаванне ў Loomio і тлумачыць неабходнасць перагледзець брэнд арганізацыі. Удзельнікаў запрашаюць распрацаваць новую канцэпцыю брэнда. Рашэнне аб яе ўхваленні прыме кіроўная рада праз працэс дасягнення кансенсусу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  37d6cf6c0162e6bb:
    english: "### Step 2. Present a proposal "
    translation: "### Крок 2. Прадстаўце прапанову"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c090241da7a91eb9:
    english: Vivien runs a Sense check proposal to survey opinions to see how people feel about key elements of the brand concept, and test for consensus.   The Sense check proposal lets people know a proposal is forming and encourages them to engage.  It's a good way to surface concerns.
    translation: Вівіен стварае прапанову для папярэдняй праверкі меркаванняў, каб даведацца, што людзі думаюць пра асноўныя элементы канцэпцыі брэнда і ці ёсць кансенсус. Так людзі даведваюцца, што прапанова фарміруецца, і могуць далучыцца да яе абмеркавання. Гэта дапамагае выявіць занепакоенасць.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cc4caeb72841fee5:
    english: "### Step 3. Amendment"
    translation: "### Крок 3. Дапрацоўка"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  db11954b34a1697d:
    english: |-
      When the Sense check proposal closes, Vivien states an outcome and notifies everyone about the results and what will happen next.
      Vivien facilitates a discussion to address concerns and modify the Brand Concept document.
    translation: |-
      Пасля закрыцця прапановы для папярэдняй праверкі меркаванняў Вівіен публікуе выснову і паведамляе ўсім пра вынікі і наступныя крокі.
      Затым Вівіен вядзе абмеркаванне, каб разгледзець занепакоенасць і дапрацаваць дакумент «Канцэпцыя брэнда».
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c31d7c71eb3c735c:
    english: "### Step 4. Agreement"
    translation: "### Крок 4. Згода"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  39e0039c195ae5f3:
    english: Having completed the latest version of the Brand Concept document, Vivien is now ready to seek approval from the governance board by running a Consensus proposal.
    translation: Калі апошняя версія дакумента «Канцэпцыя брэнда» гатовая, Вівіен стварае прапанову для дасягнення кансенсусу, каб атрымаць ухваленне кіроўнай рады.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4bf082d10976bc31:
    english: 'Governance board members are invited to vote and approve the Brand Concept.  The board has previously agreed that proposals like this require >75% of members to vote Agree for it to pass. '
    translation: Удзельнікаў кіроўнай рады запрашаюць прагаласаваць за ўхваленне канцэпцыі брэнда. Рада раней дамовілася, што для прыняцця такіх прапаноў больш за 75% удзельнікаў павінны выбраць «Згодзен».
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  feb488e50bdd3834:
    english: This template includes a Block option by default. Block isn't suitable for every group — it can be controversial or misused. If you don't use block in your decision-making process, we recommend editing the template to remove it.
    translation: 'Гэты шаблон па змаўчанні ўключае варыянт «Блок». Ён падыходзіць не кожнай групе: можа выклікаць спрэчкі або выкарыстоўвацца не па прызначэнні. Калі ў вашым працэсе прыняцця рашэнняў блакіроўка не выкарыстоўваецца, раім выдаліць гэты варыянт з шаблону.'
