  a79abb23e8e1c82f:
    english: A quorum is the minimum percentage of eligible voters who must participate for a poll to be valid. Use it when your governance process requires a particular level of participation.
    translation: Ein Quorum ist der Mindestanteil der Stimmberechtigten, der teilnehmen muss, damit eine Abstimmung gültig ist. Lege es fest, wenn für Entscheidungen eine bestimmte Beteiligung erforderlich ist.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d83e75068f697f6f:
    english: When creating a poll, open **More settings** and enter the required percentage in **Participation quorum**. Leave the field blank when no quorum is required.
    translation: Öffne beim Erstellen einer Abstimmung **Weitere Einstellungen** und gib unter **Teilnahmequorum** den erforderlichen Prozentsatz ein. Lass das Feld leer, wenn kein Quorum erforderlich ist.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a04b99724fe62a56:
    english: "![The Quorum setting with a 60 percent participation quorum](./quorum-section.png)"
    translation: "![Die Quorumseinstellung mit einem Teilnahmequorum von 60 Prozent](./quorum-section.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  432f570094ad5b24:
    english: You can also set a quorum in a [poll template](/en/user_manual/polls/poll_templates/) so that polls created from that template use it by default.
    translation: Du kannst ein Quorum auch in einer [Abstimmungsvorlage](/en/user_manual/polls/poll_templates/) festlegen. Abstimmungen, die du mit dieser Vorlage erstellst, übernehmen es dann standardmäßig.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  52841ec4c6253973:
    english: "## Example scenario"
    translation: "## Beispiel"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  96ded9027f394b57:
    english: Oatmilk Cooperative is discussing a six-week returnable bottle trial. The discussion has reached the point where the cooperative needs to approve the trial budget.
    translation: Die Hafermilch-Genossenschaft bespricht einen sechswöchigen Test mit Mehrwegflaschen. Nun muss sie das Budget für den Test genehmigen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7acd5f99c209cec0:
    english: Jamie selects **Start a vote**, chooses the **Consent** proposal template, and completes the title, details, options, duration, and voter settings.
    translation: Jamie wählt **Jetzt abstimmen** und dann die Vorschlagsvorlage **Zustimmung**. Anschließend füllt Jamie Titel, Details, Optionen, Laufzeit und Einstellungen für die Stimmberechtigten aus.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c5bd111a40bc588f:
    english: "![The proposal title, details, options, duration, and voter settings](proposal-options.png)"
