  195fe68dbcc6418f:
    english: Loomio can send notifications to your chatroom.
    translation: Loomio puede enviar notificaciones a tu sala de chat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bf886ec0d398e8d7:
    english: Chat tools and Loomio work well together. Use chat for quick conversation and timely updates. Move important topics to Loomio when people need time to participate, when a decision must be made, or when the group will need a lasting record.
    translation: Las herramientas de chat y Loomio se complementan. Usa el chat para conversar rápidamente y recibir novedades a tiempo. Lleva los temas importantes a Loomio cuando las personas necesiten tiempo para participar, haya que tomar una decisión o el grupo necesite conservar un registro.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  db7d26a18ddc651d:
    english: Loomio supports Slack, Discord, Microsoft Teams, Matrix and Mattermost.
    translation: Loomio es compatible con Slack, Discord, Microsoft Teams, Matrix y Mattermost.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  765fc0d609a0db99:
    english: You can send notifications to your chatroom any time you like, just the same way you would invite individual people to vote, or to join a thread.
    translation: Puedes enviar notificaciones a tu sala de chat cuando quieras, igual que invitas a personas a votar o a unirse a un hilo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a89717f4f41f3212:
    english: You can also configure notifications to always happen when a specific event happens, like someone starting a thread.
    translation: También puedes configurar notificaciones automáticas para eventos concretos, como el inicio de un hilo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
