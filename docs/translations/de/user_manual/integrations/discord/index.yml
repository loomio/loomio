  9f4683cb4db90895:
    english: Loomio can send notifications into your Discord channels when new discussions, proposals, comments, votes, and outcomes occur. You can also manually notify the chatroom when you need to remind people about a decision.
    translation: Loomio kann Benachrichtigungen an deine Discord-Kanäle senden, wenn neue Diskussionen, Vorschläge, Kommentare, Stimmen oder Fazits hinzukommen. Du kannst den Chat auch selbst benachrichtigen, um an eine Entscheidung zu erinnern.
