  ff07fce3bab705aa:
    english: Proposals and polls collect structured responses from a group. They can help test an idea, make a decision, identify priorities, schedule a meeting, or elect representatives.
    translation: Le proposte e le votazioni raccolgono risposte strutturate da un gruppo. Possono aiutare a valutare un'idea, prendere una decisione, individuare le priorità, fissare una riunione o eleggere rappresentanti.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f031d2644fee2a91:
    english: "## Find the right help"
    translation: "## Trova la guida giusta"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  34039c79ea769793:
    english: 'These parts of the manual answer different questions:'
    translation: 'Queste sezioni del manuale rispondono a domande diverse:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  34ea9d58ccbf80fb:
    english: |-
      | If you want to… | Read… |
      |---|---|
      | Choose what participants should express | [Proposals](../proposals/) or [Polls](../proposal_types/) |
      | Run a specific proposal template | [Sense check](../proposals/sense_check/), [Advice](../proposals/advice/), [Consent](../proposals/consent/), or [Consensus](../proposals/consensus/) |
      | Configure the templates available to a group | [Poll templates](../poll_templates/) |
      | Facilitate a decision from discussion to outcome | [Making decisions](/en/guides/making_decisions/) |
    translation: |-
      | Se vuoi… | Leggi… |
      |---|---|
      | Scegliere che cosa devono esprimere i partecipanti | [Proposte](../proposals/) o [Votazioni](../proposal_types/) |
      | Usare un modello di proposta specifico | [Verifica delle opinioni](../proposals/sense_check/), [Consiglio](../proposals/advice/), [Consenso](../proposals/consent/) o [Consenso](../proposals/consensus/) |
      | Configurare i modelli disponibili per un gruppo | [Modelli di votazione](../poll_templates/) |
      | Facilitare una decisione dalla discussione alla conclusione | [Prendere decisioni](/en/guides/making_decisions/) |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7eddb057cca077f4:
    english: A **voting method** defines how people respond and how results are calculated. A **poll template** is a reusable configuration built on a voting method, with preset instructions, options, and settings. A **decision process** may use a discussion and several templates before the group reaches an outcome.
    translation: Un **metodo di votazione** definisce come rispondono le persone e come vengono calcolati i risultati. Un **modello di votazione** è una configurazione riutilizzabile basata su un metodo di votazione, con istruzioni, opzioni e impostazioni predefinite. Un **processo decisionale** può comprendere una discussione e diversi modelli prima che il gruppo arrivi a una conclusione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3cd46aa2f1240e88:
    english: "## Proposals"
    translation: "## Proposte"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  85a55fccaf4e4032:
    english: 'A proposal asks people to respond to a statement or course of action. Loomio includes templates for common purposes:'
    translation: 'Una proposta chiede alle persone di esprimersi su un''affermazione o una linea d''azione. Loomio include modelli per scopi comuni:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  51bf1ffa7d057d9e:
    english: |-
      - [Sense check](../proposals/sense_check/) gathers early reactions;
      - [Advice](../proposals/advice/) gathers input for a decision maker;
      - [Consent](../proposals/consent/) tests for meaningful objections; and
      - [Consensus](../proposals/consensus/) seeks collective agreement.
    translation: |-
      - [Verifica delle opinioni](../proposals/sense_check/) raccoglie le prime reazioni;
      - [Consiglio](../proposals/advice/) raccoglie contributi per chi deve prendere una decisione;
      - [Consenso](../proposals/consent/) verifica se ci sono obiezioni rilevanti; e
      - [Consenso](../proposals/consensus/) cerca un accordo collettivo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d01e9f85fcd2d9c2:
    english: See [Proposals](../proposals/) to compare them.
    translation: Consulta [Proposte](../proposals/) per confrontarli.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  821dcd89b5460804:
    english: "## Polls"
    translation: "## Votazioni"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ec746235c7fe89c4:
    english: 'Use a poll when participants need to select, score, allocate, rank, state their availability, or cast an election ballot:'
    translation: 'Usa una votazione quando i partecipanti devono scegliere, assegnare punteggi, distribuire punti, ordinare le opzioni per preferenza, indicare la propria disponibilità o votare in un''elezione:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b93f9fe9611d9205:
    english: |-
      - [Choose](../choose/) finds popular options;
      - [Score](../score/) evaluates every option on a scale;
      - [Allocate](../allocate/) distributes a limited budget of points;
      - [Rank](../rank/) finds an overall order of preference;
      - [Time poll](../meeting_polls/) finds when people are available; and
      - [STV Election](../stv/) elects multiple winners proportionally.
    translation: |-
      - [Scegli](../choose/) individua le opzioni più popolari;
      - [Assegna un punteggio](../score/) valuta ogni opzione su una scala;
      - [Distribuisci](../allocate/) ripartisce un numero limitato di punti;
      - [Ordina per preferenza](../rank/) determina un ordine complessivo delle preferenze;
      - [Sondaggio sugli orari](../meeting_polls/) individua quando le persone sono disponibili; e
      - [Elezione STV](../stv/) elegge più persone in modo proporzionale.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9972b34ccc3ea79b:
    english: See [Polls](../proposal_types/) to compare them.
    translation: Consulta [Votazioni](../proposal_types/) per confrontarle.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5890626db6dcbb68:
    english: "## Start a proposal or poll"
    translation: "## Avvia una proposta o una votazione"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4b5338cae269fd32:
    english: "### Choose whether to use a discussion"
    translation: "### Scegli se usare una discussione"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c45fe8ff31f71486:
    english: Start the proposal or poll inside a discussion when people need context, questions, or conversation before responding. A discussion can contain several proposals over time, keeping amendments and the eventual outcome together as one record of the topic.
    translation: Avvia la proposta o la votazione in una discussione quando le persone hanno bisogno di contesto, chiarimenti o confronto prima di rispondere. Una discussione può contenere più proposte nel tempo e conservare modifiche e conclusione finale in un unico resoconto dell'argomento.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0bb2a90f8f9dad0c:
    english: Run a standalone poll when the discussion has already happened elsewhere, such as at a meeting, or when the question is simple and you only need to collect responses. Include enough detail or a link to the relevant record so voters understand what they are responding to.
    translation: Avvia una votazione senza discussione quando il confronto si è già svolto altrove, per esempio durante una riunione, oppure quando la domanda è semplice e devi solo raccogliere le risposte. Aggiungi dettagli sufficienti o un link al resoconto pertinente, così chi vota capisce a cosa sta rispondendo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7d50445f0c54190d:
    english: "### In a discussion"
    translation: "### In una discussione"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  05e03f7ee0e1b4dc:
    english: Open the discussion, scroll to the reply area, select **Start a vote**, and choose a template.
    translation: Apri la discussione, scorri fino all'area delle risposte, seleziona **Inizia una votazione** e scegli un modello.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  55dc0481a5c4ecb6:
    english: "### Without a discussion"
    translation: "### Senza una discussione"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  af5fd115de5f7aec:
    english: Open the **Polls** tab on the group page, select **New poll**, and choose a template.
    translation: Apri la scheda **Votazioni** nella pagina del gruppo, seleziona **Nuova votazione** e scegli un modello.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  23479ea263004d4a:
    english: If you create a discussion and poll at the same time only to run a vote, avoid notifying people twice. Start the discussion without notifying them and use the poll invitation, or run the poll without a discussion.
    translation: Se crei una discussione e una votazione nello stesso momento solo per raccogliere voti, evita di inviare due notifiche alle persone. Avvia la discussione senza inviare notifiche e usa l'invito alla votazione, oppure avvia la votazione senza discussione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  31f857d230319a3c:
    english: "## What happens next"
    translation: "## Cosa succede dopo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb709a76dfeabd4f:
    english: When starting a proposal or poll, you provide a title and details, review its response options and settings, set a closing time, and invite participants. While it is open, participants can vote, explain their response, and change their vote. Results update as votes are submitted, subject to the poll's result-visibility setting.
    translation: Quando avvii una proposta o una votazione, inserisci un titolo e i dettagli, controlli le opzioni di risposta e le impostazioni, fissi una scadenza e inviti i partecipanti. Finché è aperta, i partecipanti possono votare, spiegare la propria risposta e modificare il proprio voto. I risultati si aggiornano man mano che arrivano i voti, secondo l'impostazione di visibilità dei risultati.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  acd2e813b56034a0:
    english: When it closes, publish an [outcome](../outcomes/) that records what the result means and what will happen next.
    translation: Alla chiusura, pubblica una [conclusione](../outcomes/) che spieghi che cosa significa il risultato e che cosa succederà dopo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
