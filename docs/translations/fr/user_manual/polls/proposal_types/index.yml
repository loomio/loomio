    translation: "## Sondage horaire"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb768f07eb0d1971:
    english: "[Time poll](/en/user_manual/polls/meeting_polls/) lets participants indicate when they are available. Use it to schedule a meeting or event across time zones."
    translation: "[Sondage horaire](/en/user_manual/polls/meeting_polls/) permet aux participants d’indiquer leurs disponibilités. Utilisez cette méthode pour planifier une réunion ou un événement entre plusieurs fuseaux horaires."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
