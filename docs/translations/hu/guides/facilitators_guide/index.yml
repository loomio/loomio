  ac8728f5ce2ea8ce:
    english: Loomio is made by facilitators, and that plays a huge role in how it has been designed. This guide is about revealing more of that context, and translating facilitation concepts from the offline space to the online space.
    translation: A Loomiót facilitátorok készítik, és ez meghatározza a tervezését. Ez az útmutató bemutatja ezt a hátteret, és segít átültetni a személyes facilitálás módszereit az online térbe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e802660a44da1775:
    english: "## More about this guide"
    translation: "## Az útmutatóról bővebben"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5cbd64dba51ca485:
    english: Whether employed by a professional facilitator, people peer-facilitating each other, or a group that has no awareness of facilitation at all, Loomio’s essential function is to mediate and support group communication toward a desired outcome. In other words, facilitation.
    translation: 'Akár hivatásos facilitátor vezeti a folyamatot, akár a résztvevők segítik egymást, akár a csoport nem ismeri a facilitálás fogalmát, a Loomio alapvető feladata ugyanaz: segíteni a csoport kommunikációját a kívánt eredmény elérése érdekében. Más szóval: facilitálni.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  25a956280b647fa6:
    english: 'Loomio is *groupware*:'
    translation: 'A Loomio *csoportmunkát támogató szoftver*:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  33e304be58a0a55b:
    english: "> Collaborative software, or groupware, is designed to help people involved in a common task achieve their goals. One of the earliest definitions of collaborative software is “intentional group processes plus software to support them.” -- Wikipedia"
    translation: "> A kollaboratív szoftver, más néven csoportmunkát támogató szoftver, abban segít, hogy a közös feladaton dolgozó emberek elérjék céljaikat. Egy korai meghatározás szerint a kollaboratív szoftver „tudatosan szervezett csoportfolyamatokból és az ezeket támogató szoftverből” áll. -- Wikipédia"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  170a0b463e1ad8ca:
    english: There is a huge body of knowledge, best practice, and tradition in both in-person facilitation and online moderation, but the art and science of their intersection is only just emerging. This is the specific space where Loomio strives to excel.
    translation: A személyes facilitálásnak és az online moderálásnak egyaránt gazdag tudásanyaga, bevált gyakorlatai és hagyományai vannak. A kettő ötvözésének módszerei azonban még kialakulóban vannak. A Loomio ezen a területen szeretne jól működni.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
