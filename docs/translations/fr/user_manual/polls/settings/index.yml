    english: "## Setting up a proposal or poll"
    translation: "## Configurer une proposition ou un sondage"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e5d6f17041c19d41:
    english: "### Proposal and poll templates"
    translation: "### Modèles de proposition et de sondage"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8913cabb2f1f8227:
    english: 'Choose the proposal template you want to use. '
    translation: Choisissez le modèle de proposition que vous souhaitez utiliser.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3620f6321777ca50:
    english: "### Add content"
    translation: "### Ajouter du contenu"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bc7ebb222e9ff4d1:
    english: "**Group:** Check that the correct group is selected for your proposal or poll."
    translation: "**Groupe :** Vérifiez que le bon groupe est sélectionné pour votre proposition ou votre sondage."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3a1d375da02f3a49:
    english: "**Title:** Give your proposal or poll a short, relevant title."
    translation: "**Titre :** Donnez à votre proposition ou à votre sondage un titre court et pertinent."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a62a7e63f9db295c:
    english: "**Details:** Explain what you are asking of people and include enough details so everyone knows what it means to vote.  "
    translation: "**Détails :** Expliquez ce que vous demandez aux personnes et donnez assez de précisions pour que chacun comprenne ce que signifie voter."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e17c2ab4878716f2:
    english: The predefined templates include some prompts to help you write a good proposal - use these or add your own details.
    translation: Les modèles prédéfinis proposent des indications pour vous aider à rédiger une proposition. Utilisez-les ou ajoutez vos propres précisions.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  74daa7f0cc476971:
    english: Avoid combining a range of ideas in one proposal, because people might agree to some aspects but not others and be unsure how to respond. You can break complex decisions down into multiple proposals.
    translation: Évitez de réunir plusieurs idées dans une seule proposition. Certaines personnes pourraient être d’accord avec certains points, mais pas avec d’autres, et ne pas savoir comment répondre. Vous pouvez répartir les décisions complexes entre plusieurs propositions.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0da6e449688940bb:
    english: When making a proposal, state your expectations and describe the impact the proposal will have if adopted. If it's a formal or binding proposal it's often worth describing what it means if the proposal is not adopted.
    translation: Lorsque vous faites une proposition, précisez vos attentes et décrivez ses effets si elle est adoptée. Si la proposition est formelle ou contraignante, il est souvent utile de préciser aussi ce qui se passera si elle n’est pas adoptée.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a6db66b75f495e21:
    english: Use the formatting tools to support your poll.  For example, attach a document file with the paperclip icon, insert an image, link to a website or online document, or even embed a video.
    translation: Utilisez les outils de mise en forme pour accompagner votre sondage. Vous pouvez, par exemple, joindre un document avec l’icône en forme de trombone, insérer une image, ajouter un lien vers un site ou un document en ligne, ou intégrer une vidéo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f4f85f131878c36d:
    english: "### Voting options"
    translation: "### Options de vote"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  616aab74af2072ba:
    english: Each proposal and poll template provides options for voting.
    translation: Chaque modèle de proposition ou de sondage comporte des options de vote.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7a85de7eefe74178:
    english: Depending on the template, you can edit, remove, reorder, or add voting options to suit the decision process you are running.
    translation: Selon le modèle, vous pouvez modifier, supprimer, réorganiser ou ajouter des options de vote pour les adapter à votre processus de décision.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9bc44bf4b28ac5d8:
    english: "- Use the pencil icon to edit voting option \n- Use the trash can icon to remove unwanted voting options\n- Use the handle to move the order of voting options\n- Add voting options with **Add option** when the template allows custom options"
    translation: |-
      - Utilisez l’icône en forme de crayon pour modifier une option de vote
      - Utilisez l’icône en forme de corbeille pour supprimer une option de vote inutile
      - Utilisez la poignée pour modifier l’ordre des options de vote
      - Ajoutez des options de vote avec **Ajouter une option** si le modèle autorise les options personnalisées
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2062f39334fbd629:
    english: |-
      ### Edit voting options
      There is a lot of flexibility to configure voting options to suit the way your organization makes decisions.
    translation: |-
      ### Modifier les options de vote
      Vous pouvez configurer les options de vote selon la manière dont votre organisation prend ses décisions.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5ac5b47c81fe187b:
    english: 'Use the pencil icon alongside the voting option to open the edit modal:'
    translation: 'Utilisez l’icône en forme de crayon à côté d’une option de vote pour ouvrir la fenêtre de modification :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3c791f8140ad3b39:
    english: "**Option name:** A short name for the option."
    translation: "**Nom de l’option :** Un nom court pour l’option."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  77a0fb7409cf1711:
    english: "**Icon:** Select an icon for the option, such as thumbs up, thumbs down, abstain, or block."
    translation: "**Icône :** Choisissez une icône pour l’option, par exemple un pouce levé, un pouce baissé, l’abstention ou le veto."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9126ee91e5d1cb95:
    english: "**Meaning:** A sentence that explains what choosing this options means."
    translation: "**Signification :** Une phrase qui explique ce que signifie le choix de cette option."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e88d83b93ba47666:
    english: "**Reason prompt:** A question to prompt voters to provide their reasoning or reconsider their position. "
    translation: "**Question sur la raison du vote :** Une question qui invite les personnes à expliquer leur vote ou à reconsidérer leur position."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d05197892ea46087:
    english: "### Opening time"
    translation: "### Heure d’ouverture"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1b56f0ad52a3aed8:
    english: By default, voting opens immediately when you create the poll. If you want to schedule voting to open at a later time, uncheck **Voting opens immediately** and select an opening date and time.
    translation: Par défaut, le vote s’ouvre dès que vous créez le sondage. Pour l’ouvrir plus tard, décochez **Le vote est ouvert immédiatement**, puis choisissez une date et une heure d’ouverture.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  48ccc43734b062eb:
    english: This is useful to give time for discussion before voting opens, or to ensure a poll or proposal is correctly set up and scheduled to happen at the right time.
    translation: Vous pouvez ainsi laisser du temps pour la discussion avant l’ouverture du vote, ou vérifier que le sondage ou la proposition est correctement configuré et s’ouvrira au bon moment.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b68fccc3132988ff:
    english: When a poll has a scheduled opening time, you can add voters before voting opens. Voters will be notified when voting opens, rather than when they are added.
    translation: Si une heure d’ouverture est programmée, vous pouvez ajouter des personnes au sondage avant l’ouverture du vote. Elles recevront une notification à l’ouverture du vote, et non au moment où vous les ajoutez.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  82d4cacfa780dd98:
    english: "**Notify voters when poll opens:** When checked (default), all voters will receive a notification when voting opens. Uncheck this if you want to open voting without sending notifications."
    translation: "**Notifier les personnes à l’ouverture du sondage :** Lorsque cette case est cochée (par défaut), toutes les personnes invitées à voter reçoivent une notification à l’ouverture du vote. Décochez-la pour ouvrir le vote sans envoyer de notifications."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d084620657803f93:
    english: "**Closing date and time:** Select the closing date and time for your poll."
    translation: "**Date et heure de clôture :** Choisissez la date et l’heure de clôture de votre sondage."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c0472419a2671222:
    english: Give sufficient time for people to vote. You could time the proposal so it closes before a meeting, or avoid closing over a weekend, so that people will receive a timely reminder. If necessary, you can close the poll early or extend the closing time.
    translation: Laissez suffisamment de temps pour voter. Vous pouvez prévoir la clôture de la proposition avant une réunion ou éviter une clôture pendant le week-end, afin que les personnes reçoivent un rappel au bon moment. Si nécessaire, vous pouvez clore le sondage plus tôt ou prolonger la période de vote.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c87f87e6cbc1a4d7:
    english: "**Who can vote?** Invite everyone in the group or only specific people that you invite."
    translation: "**Qui peut voter ?** Invitez toutes les personnes du groupe ou seulement celles de votre choix."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e02a9cefc3082334:
    english: |-
      You can later add people to an 'Invite people only' poll. For identified polls,
      you can also remove people who should no longer be eligible to vote. People
      cannot be removed from an anonymous poll.
    translation: |-
      Vous pourrez ajouter d’autres personnes à un sondage réservé aux personnes invitées. Pour les sondages où les votes sont identifiés,
      vous pouvez aussi retirer les personnes qui ne doivent plus pouvoir voter. Vous ne
      pouvez pas retirer de personnes d’un sondage anonyme.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2e959157d75ed7bd:
    english: "## More settings"
    translation: "## Autres paramètres"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3d4443d3e6d3b13d:
    english: |-
      ### Reminder
      Send a 'Closing soon' notification 24 hours before the poll closes. This can be an opportunity for people to see how others have voted and reconsider their own vote, or just a way to increase participation in the poll.
    translation: |-
      ### Rappel
      Envoyez une notification « Clôture prochaine » 24 heures avant la clôture du sondage. Les personnes pourront voir comment les autres ont voté et reconsidérer leur propre vote. Ce rappel peut aussi encourager la participation.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  62067c0573d7a64e:
    english: |-
      Setting options:
      - Nobody
      - Author
      - Undecided voters (default)
      - All voters
    translation: |-
      Options disponibles :
      - Personne
      - Auteur
      - Personnes n’ayant pas encore voté (par défaut)
      - Toutes les personnes invitées à voter
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6cd67c3f92302551:
    english: |-
      For an anonymous poll lasting at least 24 hours, Loomio automatically reminds
      eligible people who have not voted during the final 24 hours. This reminder
      cannot be changed in the poll settings.
    translation: |-
      Pour un sondage anonyme qui dure au moins 24 heures, Loomio envoie automatiquement un rappel
      aux personnes autorisées à voter qui n’ont pas encore voté pendant les dernières 24 heures. Ce rappel
      ne peut pas être modifié dans les paramètres du sondage.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72f172271e2a636a:
    english: |-
      ### Anonymous voting
      If enabled, votes are stored separately from voter identities. Results appear after voting closes, and voters cannot add reasons, review their submitted vote, or change it.
    translation: |-
      ### Vote anonyme
      Si cette option est activée, les votes sont stockés séparément de l’identité des personnes qui votent. Les résultats apparaissent après la clôture du vote. Les personnes ne peuvent pas ajouter de raison, consulter le vote qu’elles ont soumis ni le modifier.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3393027493510f2f:
    english: See [Anonymous voting](/en/user_manual/polls/anonymous_voting) for details about how voter identities are separated from submitted votes, what information is retained, and the limits of the protection.
    translation: Consultez [Vote anonyme](/en/user_manual/polls/anonymous_voting) pour savoir comment l’identité des personnes est séparée des votes soumis, quelles informations sont conservées et quelles sont les limites de cette protection.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b731b9118e48dee5:
    english: |-
      > [!WARNING]
      > Once a poll has started you cannot edit the poll to make it anonymous or to undo the anonymous setting.
    translation: |-
      > [!WARNING]
      > Une fois le sondage commencé, vous ne pouvez plus le modifier pour rendre le vote anonyme ou désactiver le vote anonyme.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e8660d089a3c07bb:
    english: |-
      > [!WARNING]
      > You cannot re-open an anonymous poll after it has closed. Submitted votes are not linked to the participation records that show who has voted.
    translation: |-
      > [!WARNING]
      > Vous ne pouvez pas rouvrir un sondage anonyme après sa clôture. Les votes soumis ne sont pas liés aux enregistrements de participation qui indiquent qui a voté.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  aaaaa28a4b435835:
    english: |-
      ### Vote reason
      It can be helpful to understand why people voted the way they did. With this setting, you can prompt people to share their thoughts when they vote.
    translation: |-
      ### Raison du vote
      Comprendre les raisons des votes peut être utile. Ce paramètre vous permet d’inviter les personnes à expliquer leur choix lorsqu’elles votent.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  309645182b157738:
    english: 'Available settings depend on the template:'
    translation: 'Les paramètres disponibles dépendent du modèle :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d67e2c2914e91a6f:
    english: |-
      - **Optional** lets voters choose whether to give a reason
      - **Required for disagree or block** requires a reason when the selected option
        uses the Disagree or Block voting icon
      - **Required for block** requires a reason when the selected option uses the
        Block voting icon
      - **Required** requires every voter to give a reason
      - **Disabled** removes the vote-reason field
    translation: |-
      - **Facultatif** permet aux personnes qui votent de choisir si elles donnent une raison
      - **Nécessaire pour être en désaccord ou bloquer** exige une raison lorsque l’option choisie
        utilise l’icône de vote Désaccord ou Veto
      - **Requis en cas de veto** exige une raison lorsque l’option choisie utilise
        l’icône de vote Veto
      - **Requis** exige une raison de chaque personne qui vote
      - **Désactivé** supprime le champ de justification du vote
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  af5e7c0557aec611:
    english: |-
      The conditional settings follow the voting icon rather than the option name.
      They still apply if you rename Disagree to a term such as Objection. The
      Consent template defaults to **Required for disagree or block**, while the
      Consensus template defaults to **Required for block**. Other templates default
      to **Optional**, except Question rounds where the response itself is required.
      The poll author can change the setting for an individual poll.
    translation: |-
      Les paramètres conditionnels dépendent de l’icône de vote, et non du nom de l’option.
      Ils restent applicables si vous renommez Désaccord, par exemple en Objection. Le
      modèle Consentement utilise par défaut **Nécessaire pour être en désaccord ou bloquer**, tandis que le
      modèle Consensus utilise **Requis en cas de veto**. Les autres modèles utilisent par défaut
      **Facultatif**, sauf les tours de questions, où une réponse est requise.
      La personne qui crée le sondage peut modifier ce paramètre pour chaque sondage.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ecb0d89c623db459:
    english: "**Limit reason to maximum 500 characters:** Keeping vote reasons short makes them easier to understand. A collection of concise reasons is a great resource for making a decision.  This setting is ticked by default. Untick to allow for longer reasons."
    translation: "**Limiter les raisons à 500 caractères :** Des raisons courtes sont plus faciles à comprendre. Un ensemble de raisons concises aide à prendre une décision. Ce paramètre est activé par défaut. Décochez-le pour autoriser des raisons plus longues."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  35bd4f116b9ff26a:
    english: |-
      ### Hide results
      If you want people to vote without knowing how others have voted, you can hide the results of the poll.  Useful if you do not want people to be affected by how other people have voted.
    translation: |-
      ### Masquer les résultats
      Vous pouvez masquer les résultats du sondage pour que les personnes votent sans connaître les votes des autres. Cela évite que ces votes influencent leur choix.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8cc5b82f4cc5e94e:
    english: |-
      Setting options:
      - Do not hide results
      - Hide results until a vote is cast
      - Hide results until voting closes
    translation: |-
      Options disponibles :
      - Ne pas masquer les résultats
      - Masquer les résultats jusqu’à ce qu’un vote soit exprimé
      - Masquer les résultats jusqu’à la clôture du vote
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4be103ffd97e7e8f:
    english: While results are hidden, nobody can reply to votes. Replies to votes open when voting closes.
    translation: Tant que les résultats sont masqués, personne ne peut répondre aux votes. Les réponses aux votes sont possibles après la clôture du vote.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a488ebe6712a5e1d:
    english: If results are hidden until a vote is cast, vote before you print or export the thread as Markdown.
    translation: Si les résultats sont masqués jusqu’à ce qu’un vote soit exprimé, votez avant d’imprimer ou d’exporter le fil de discussion au format Markdown.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1e5a1eb47ee3d99d:
    english: |-
      Anonymous polls always hide results until voting closes. The STV Election
      template enables anonymous voting by default.
    translation: |-
      Dans les sondages anonymes, les résultats restent toujours masqués jusqu’à la clôture du vote. Le modèle Élection STV
      active le vote anonyme par défaut.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8e7d8e81db57f4f8:
    english: |-
      ### Start the poll
      Select the **Start proposal** or **Start poll** button.
    translation: |-
      ### Démarrer le sondage
      Cliquez sur **Faire une proposition** ou **Démarrer le sondage**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b1ee90012c240ef5:
    english: "## Managing polls"
    translation: "## Gérer les sondages"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0b5f754660efb4da:
    english: Open the three-dot menu at the bottom right of the poll.
    translation: Ouvrez le menu à trois points en bas à droite du sondage.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cc2325791d155b04:
    english: "### Edit poll"
    translation: "### Modifier le sondage"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8d5ecd0352b5caf8:
    english: Use **Edit poll** to edit poll content or settings.   You can not change voting options once voting commences.
    translation: Utilisez **Modifier le sondage** pour modifier son contenu ou ses paramètres. Vous ne pouvez plus modifier les options de vote une fois le vote commencé.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  84d18e91493020d4:
    english: "### Make a copy"
    translation: "### Faire une copie"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  071c2438f8e5315f:
    english: Use **Make a copy** to create a new poll using the current poll and settings as a starting point.
    translation: Utilisez **Faire une copie** pour créer un nouveau sondage à partir du sondage actuel et de ses paramètres.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3c42dde555e8a245:
    english: "### Notification history"
    translation: "### Historique des notifications"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3e750b3f37e8ddf1:
    english: "**Notification history** shows who was notified and whether each notification has been read."
    translation: "**Historique des notifications** indique qui a reçu une notification et si chaque notification a été lue."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d78b253bae2aecc7:
    english: "### Export poll"
    translation: "### Exporter le sondage"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  17e6fd426afa3b4d:
    english: "**Export** poll status and results to a spreadsheet (.csv) file, to download unformatted poll data for analysis or archive."
    translation: Utilisez **Exporter** pour télécharger l’état et les résultats du sondage dans un fichier de tableur (.csv), afin d’analyser ou d’archiver les données brutes.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4fce317a163b0a40:
    english: "### Print"
    translation: "### Imprimer"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d698be92962e2cd7:
    english: Use **Print** in the thread actions to open a printable HTML document. You can print it or save it as a PDF for publishing and archiving.
