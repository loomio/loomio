  fba51c92285b31c7:
    english: "## Continuous Improvement"
    translation: "## Jatkuva parantaminen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  121b4afb86de3c31:
    english: No matter how amazing a group or facilitator is, they can always improve. If they incrementally head in a good direction they will get to a better place. Incremental improvement requires an effective protocol for meta-conversation (talking about how you collaborate). With it, anything is possible. Without it, you stagnate.
    translation: Ryhmä ja sen ohjaaja voivat aina kehittyä, vaikka he toimisivat jo hyvin. Pienet askeleet oikeaan suuntaan vievät eteenpäin. Jatkuva parantaminen edellyttää toimivaa tapaa keskustella siitä, miten teette yhteistyötä. Sen avulla voitte muuttaa toimintaanne. Ilman sitä kehitys pysähtyy.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  331d258dee610e96:
    english: There are many approaches to continuous improvement, but they all create space for reflection and feedback, and a way to make changes in response. For teams that work together on an ongoing basis, they might employ a methodology like <a href="https://en.wikipedia.org/wiki/Scrum_(software_development)" target="_blank">scrum</a>, including retrospectives and regular process improvements. For a one-off session, a facilitator might simply follow up with a request for feedback.
    translation: Jatkuvaa parantamista voi tehdä monella tavalla. Kaikissa tavoissa varataan aikaa toiminnan arvioinnille ja palautteelle sekä muutetaan toimintaa niiden pohjalta. Säännöllisesti yhdessä työskentelevä tiimi voi käyttää esimerkiksi <a href="https://en.wikipedia.org/wiki/Scrum_(software_development)" target="_blank">scrumia</a>, johon kuuluu jälkiarviointeja ja työtapojen säännöllistä kehittämistä. Yksittäisen tapaamisen jälkeen ohjaaja voi pyytää osallistujilta palautetta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aabfa9d842af2688:
    english: On Loomio
    translation: Loomiossa
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ac2f489368566562:
    english: |-
      * People use Loomio itself to talk about how they use Loomio. It provides an obvious platform to “talk about the talking”.
      * The process of joining Loomio causes groups to reflect on many aspects of their collaboration and decision-making process, which creates the opportunity to improve.
    translation: |-
      * Loomion käyttäjät keskustelevat myös siitä, miten he käyttävät Loomiota. Se tarjoaa paikan keskustella keskustelutavoista.
      * Loomioon liittyminen saa ryhmät pohtimaan yhteistyötään ja päätöksentekoaan. Samalla syntyy tilaisuus parantaa niitä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7b11f212a312312e:
    english: "## Distributed Facilitation / Self-facilitation"
    translation: "## Jaettu ohjaaminen ja itseohjautuvuus"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1e385970a624bf63:
    english: As a group becomes more experienced, more individuals build capacity for facilitation. Facilitation can cease to be a role held by a specific person, and become more of a function that can be distributed. Anyone can take acts of facilitation, and a dance of give and take, leading and following, can emerge among participants. For groups with aspirations toward shared leadership and non-hierarchy, this is a very important thing to encourage.
    translation: Kun ryhmälle kertyy kokemusta, yhä useampi jäsen oppii ohjaamaan yhteistä työskentelyä. Ohjaamisen ei tarvitse olla yhden henkilön pysyvä tehtävä, vaan sitä voidaan jakaa. Kuka tahansa voi tehdä ohjaavia tekoja. Osallistujat voivat vuorotellen ottaa aloitteen ja antaa tilaa toisilleen. Tätä kannattaa tukea etenkin ryhmissä, jotka tavoittelevat jaettua johtajuutta ja tasavertaisuutta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fa78b242f7390326:
    english: 'People who are less used to taking acts of facilitation can be supported with education, invitations, and suggestions of first steps. Some examples of acts of facilitation almost anyone can be encouraged to try:'
    translation: 'Jos ohjaavat teot eivät ole jollekulle tuttuja, häntä voi tukea opastuksella, kutsumalla mukaan ja ehdottamalla helppoja ensimmäisiä askelia. Lähes ketä tahansa voi kannustaa kokeilemaan esimerkiksi seuraavia tekoja:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1f490f466a1893ed:
    english: |-
      * reflecting back what you’re hearing or summarising
      * inviting others to contribute
      * asking questions to enhance collective understanding
      * noticing who is and is not participating
      * appreciating contributions explicitly
    translation: |-
      * kerro omin sanoin, mitä kuulit, tai tee yhteenveto
      * kutsu muita osallistumaan
      * esitä kysymyksiä, jotka lisäävät yhteistä ymmärrystä
      * huomaa, ketkä osallistuvat ja ketkä eivät
      * osoita arvostusta muiden panokselle
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e2eed897e0f564d2:
    english: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../silvia_200.png"> You don’t need an agenda to be a facilitator. Facilitating is just about making a group situation easy. Next time you’re at a family gathering, party or morning tea: approach it like a facilitator and make sure everybody in the group feels included and able to participate. — Silvia Zuur'
    translation: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../silvia_200.png"> Et tarvitse esityslistaa voidaksesi ohjata ryhmää. Ohjaaminen tarkoittaa sitä, että autat ryhmää toimimaan yhdessä. Kun olet seuraavan kerran perhejuhlassa, kutsuilla tai kahvitilaisuudessa, lähesty tilannetta ohjaajana. Huolehdi siitä, että jokainen tuntee kuuluvansa joukkoon ja voi osallistua. — Silvia Zuur'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  180b1232871c44c4:
    english: Distributed facilitation can work beautifully, but it can also cause people to step all over each other. At first, it’s awkward as people learn the dance. It’s important to differentiate between distributed facilitation (peers helping the collective), “facipulation” (manipulating the group toward your own agenda), and backseat facilitation (taking acts of facilitation when you do not have the mandate).
    translation: Jaettu ohjaaminen voi toimia hyvin, mutta osallistujat voivat myös toimia toistensa päälle. Aluksi yhteisen rytmin löytäminen voi olla hankalaa. On tärkeää erottaa toisistaan jaettu ohjaaminen (vertaiset auttavat ryhmää), ryhmän ohjailu oman tavoitteen hyväksi sekä ohjaamiseen puuttuminen ilman siihen annettua valtuutusta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ea5faa685be1ceae:
    english: Consciously decide when peer facilitation is a good choice, and when a specific facilitator is called for. In certain situations, such as a high-conflict discussion where a specified neutral party is needed, or there is a lack of trust, distributed facilitation might not work.
    translation: Harkitse, milloin vertaisten jakama ohjaaminen sopii tilanteeseen ja milloin tarvitaan nimetty ohjaaja. Jaettu ohjaaminen ei välttämättä toimi esimerkiksi silloin, kun kiistanalaiseen keskusteluun tarvitaan puolueeton ohjaaja tai osallistujien välillä ei ole luottamusta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d6df5458ecb8e45:
    english: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../rich_200.png"> Acts of facilitation are not just for the manager, or the person who called the meeting — they are for everyone. — Richard Bartlett'
    translation: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../rich_200.png"> Ohjaavat teot eivät kuulu vain johtajalle tai kokouksen koolle kutsuneelle. Ne kuuluvat kaikille. — Richard Bartlett'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c3215e63fca09b79:
    english: "## Translating this into Loomio"
    translation: "## Miten tämä näkyy Loomiossa"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  35ce75e6810e0611:
    english: |-
      * The online space is uniquely suited to distributed facilitation. Different people can come along at different points depending on what they notice and their skill set.
      * An online discussion is by default a distributed collaboration among peers. Any other setup requires explicit design. This is the opposite of offline spaces where the default is that someone called a meeting and distributing the role requires proactivity.
      * Loomio is designed with a group of equals in mind. In many ways, a distributed facilitation approach is the best fit for the tool.
      * Current Loomio users do peer facilitation all the time, whether they realize that’s what they are doing or not. Simple things like suggesting someone raise a proposal, tagging people, summarising the process so far, etc, are all acts of facilitation.
    translation: |-
      * Verkkotila sopii erityisen hyvin jaettuun ohjaamiseen. Eri ihmiset voivat osallistua eri vaiheissa sen mukaan, mitä he huomaavat ja mitä he osaavat.
      * Verkkokeskustelu on lähtökohtaisesti vertaisten yhteistä toimintaa. Muunlainen työnjako täytyy suunnitella erikseen. Kasvokkaisessa tapaamisessa taas joku yleensä kutsuu kokouksen koolle, ja ohjaamisen jakaminen vaatii omaa aloitetta.
      * Loomio on suunniteltu tasavertaiselle ryhmälle. Jaettu ohjaaminen sopii siksi monella tavalla sen käyttöön.
      * Loomion käyttäjät ohjaavat toisiaan jatkuvasti, vaikka eivät aina ajattele tekevänsä niin. Ehdotuksen tekemisen ehdottaminen, ihmisten merkitseminen ja tähänastisen keskustelun tiivistäminen ovat kaikki ohjaavia tekoja.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  efde81539c545bae:
    english: "## The Art of Being Facilitated"
    translation: "## Ohjattavana olemisen taito"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  93ed1980d0cc95b4:
    english: Like the skill of being the follow in a ballroom dance pair, being facilitated is an art itself. People with experience facilitating themselves, or who have participated in a lot of well-facilitated processes, will receive facilitation differently than those who haven't.
    translation: Kuten paritanssissa seuraaminen, myös ohjattavana oleminen on taito. Ihmiset, jotka ovat itse ohjanneet ryhmiä tai osallistuneet hyvin ohjattuun työskentelyyn, voivat suhtautua ohjaukseen eri tavalla kuin ne, joille se ei ole tuttua.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d2bcd9f07f5bd25b:
    english: On the positive side, skillful receptivity to facilitation is a capacoty that can be grown, and it can have a big impact on group success. This ranges from things as simple as showing up on time, to following instructions, to being willing to try a new style of thinking or communicating. Sometimes people have a good experience and they don’t quite know why — pointing out that facilitation is the reason for the smoothness or depth can help them understand what it is they valued about the process.
    translation: Kyky ottaa ohjausta vastaan kehittyy harjoittelemalla, ja sillä voi olla suuri vaikutus ryhmän onnistumiseen. Kyse voi olla niinkin yksinkertaisista asioista kuin ajoissa saapumisesta ja ohjeiden seuraamisesta. Se voi myös tarkoittaa valmiutta kokeilla uutta tapaa ajatella tai viestiä. Joskus osallistujilla on hyvä kokemus, mutta he eivät tiedä tarkalleen miksi. Kun kerrot, miten ohjaaminen auttoi työskentelyä sujumaan tai syvensi keskustelua, he voivat ymmärtää paremmin, mitä arvostivat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  87345b383ccba81d:
    english: On the negative side, people who can’t or won’t be facilitated can be detrimental to group collaboration. No matter how skilled a facilitator is, if they encounter a certain level of resistance they won’t be able to do their job. Common problems include dominating the discussion, playing devil’s advocate, disrupting the process, disrespecting the facilitator or participants, or being disengaged. At some level individuals must take responsibility for their willingness to be facilitated.
    translation: Jos osallistujat eivät pysty tai halua ottaa ohjausta vastaan, ryhmän yhteistyö voi vaikeutua. Taitavakaan ohjaaja ei voi tehdä työtään, jos vastustus on liian suurta. Tavallisia ongelmia ovat keskustelun hallitseminen, jatkuva vastaan väittäminen, työskentelyn häiritseminen, ohjaajan tai muiden osallistujien epäkunnioittava kohtelu sekä vetäytyminen. Jokaisen on osaltaan otettava vastuuta siitä, että on valmis ottamaan ohjausta vastaan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c096fd0a7e12ddd4:
    english: |-
      * With a little practice, most users quickly upskill on being responsive to acts of facilitation on Loomio, such as replying when @mentioned.
      * Taking acts of facilitation on Loomio helps people become more responsive to facilitation themselves.
      * Because everything is archived, users can see past acts of facilitation “frozen in time”, gaining the benefits of observing them without having been there.
    translation: |-
      * Pienellä harjoittelulla useimmat käyttäjät oppivat nopeasti vastaamaan ohjaaviin tekoihin Loomiossa, esimerkiksi silloin, kun heidät mainitaan @-merkillä.
      * Kun ohjaat muita Loomiossa, opit myös itse ottamaan ohjausta paremmin vastaan.
      * Koska kaikki säilyy arkistossa, käyttäjät voivat nähdä aiempia ohjaavia tekoja jälkikäteen ja oppia niistä, vaikka eivät olisi olleet paikalla.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f930b325aaedb19a:
    english: "## Culture Change"
    translation: "## Kulttuurin muutos"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  82936abec2b50e3f:
    english: A collaborative, participatory culture is something that emerges over time, with lots of practice and trial and error. Understanding, valuing, and inviting facilitation can play a pivotal role in this cultural emergence. Facilitation can evolve from a role, to a function, to a mindset. A truly collaborative culture is one where everyone is facilitating everyone in myriad different ways.
    translation: Yhteistyöhön ja osallistumiseen perustuva kulttuuri syntyy ajan myötä harjoittelemalla sekä kokeilemalla, mikä toimii. Ohjaamisen ymmärtäminen, arvostaminen ja siihen kannustaminen voivat olla tärkeä osa tätä kehitystä. Ohjaaminen voi muuttua yksittäisen henkilön tehtävästä yhteiseksi toiminnaksi ja lopulta ajattelutavaksi. Aidosti yhteistyöhön perustuvassa kulttuurissa kaikki auttavat toisiaan osallistumaan monin tavoin.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  898bf6557380a042:
    english: Is the company party participatory? Does the office potluck just happen like magic? Are ideas able to emerge from anywhere, evolve through many brains and hands, and get implemented in a way better than anyone first imagined?
    translation: Voivatko kaikki osallistua yrityksen juhlaan? Syntyvätkö toimiston yhteiset nyyttikestit itsestään? Voivatko ideat tulla keneltä tahansa, kehittyä monen ihmisen käsissä ja toteutua paremmin kuin kukaan aluksi kuvitteli?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f4964381b3c6dc7b:
    english: Deep culture change is when the culture of collaboration starts to leak out of specific “collaboration” spaces and shows up in every aspect of the organization. Collaboration is not about post-it notes and check-ins, but the very timbre of organizational life.
    translation: 'Syvällinen kulttuurin muutos näkyy siinä, että yhteistyö ulottuu sille varattujen tilanteiden ulkopuolelle organisaation kaikkeen toimintaan. Yhteistyö on muutakin kuin muistilappuja ja kuulumiskierroksia: se näkyy siinä, miten organisaatiossa eletään ja työskennellään.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6962aa4815c01b0f:
    english: |-
      * The [theory of change of Loomio](http://www.loomio.com/about) is that more groups practicing effective, inclusive decision making can change organizational dynamics at a global scale. This shows up in everything about how the tool is designed and [how we run as a co-op](http://loomio.coop). Ultimately, it’s about culture change through collaborative practice.
      * Loomio groups have experienced evolving culture through the tool. Like groups that already has a collaborative culture scale while holding onto that, or a participatory group continuing to exists instead of imploding due to challanges around inclusive decicion-making.
      * Loomio makes a certain kind of “new normal” of collaborative practice possible, through making collaborative practice more accessible and achievable.
    translation: |-
      * [Loomion muutosteorian](http://www.loomio.com/about) mukaan tehokasta ja kaikki mukaan ottavaa päätöksentekoa harjoittavat ryhmät voivat muuttaa organisaatioiden toimintaa maailmanlaajuisesti. Tämä ajatus näkyy Loomion suunnittelussa ja siinä, [miten toimimme osuuskuntana](http://loomio.coop). Tavoitteena on muuttaa kulttuuria tekemällä yhteistyötä käytännössä.
      * Loomio-ryhmät ovat kokeneet kulttuurinsa kehittyvän työkalun avulla. Yhteistyöhön perustuva ryhmä on voinut kasvaa ja säilyttää toimintatapansa. Osallistava ryhmä on voinut jatkaa toimintaansa, vaikka kaikkien mukaan ottava päätöksenteko on ollut haastavaa.
      * Loomio auttaa tekemään yhteistyöhön perustuvista toimintatavoista tavallisia, koska niiden käyttäminen on helpompaa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3f2cee633e8b83c2:
    english: For inspiration about Ongoing Practice, check out [stories of Loomio groups](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help).
    translation: Jos haluat lisää esimerkkejä jatkuvasta toiminnasta, lue [Loomio-ryhmien tarinoita](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
