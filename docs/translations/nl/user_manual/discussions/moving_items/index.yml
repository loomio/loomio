---
navigation_title: Items tussen discussies verplaatsen
blocks:
  875a42e08000fffe:
    english: "# Moving items between threads"
    translation: "# Items tussen discussies verplaatsen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5c0fcd38f9276e8f:
    english: Move selected items when a conversation belongs in another thread, when one thread has split into separate topics, or when you want to combine related discussions. There is no separate **Merge discussions** command.
    translation: Verplaats geselecteerde items als een gesprek in een andere discussie thuishoort, als een discussie zich in meerdere onderwerpen heeft opgesplitst of als je verwante discussies wilt samenbrengen. Er is geen aparte opdracht **Discussies samenvoegen**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f43c7835d05a135e:
    english: The option is available to group admins and to members when **Members can manage discussions and comments** is enabled in [Group permissions](/en/user_manual/groups/settings/permissions).
    translation: Groepsbeheerders kunnen dit doen. Leden kunnen dit ook als **Leden kunnen discussies en reacties beheren.** is ingeschakeld bij [Groepsrechten](/en/user_manual/groups/settings/permissions).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  30a4e31dab983f89:
    english: Open the three-dot menu (**⋯**) on an item and select **Move item**.
    translation: Open het menu met de drie puntjes (**⋯**) bij een item en kies **Verplaats item**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  24fd0043effa14fb:
    english: Select the items you want to move.
    translation: Selecteer de items die je wilt verplaatsen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  81551cd5134f24c5:
    english: Select any additional items with the checkboxes, then click **Move** in the banner at the top of the discussion.
    translation: Selecteer eventuele extra items met de selectievakjes en klik daarna op **Verplaatsen** in de balk bovenaan de discussie.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f53055845c214b05:
    english: Choose the group or subgroup, then search for the destination discussion.
    translation: Kies de groep of subgroep en zoek daarna de discussie waarnaar je de items wilt verplaatsen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  19bc2092ac28011b:
    english: To move the items into a new discussion, select **New discussion** and add its title and context.
    translation: Wil je de items naar een nieuwe discussie verplaatsen, kies dan **Nieuwe discussie** en voeg een titel en context toe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '092b56e69505636f':
    english: The items are moved from the original thread into the selected or newly created thread.
    translation: De items worden van de oorspronkelijke discussie naar de gekozen of nieuw aangemaakte discussie verplaatst.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  162c0d0c47ca798f:
    english: If the original thread is no longer needed, you can [lock it](/en/user_manual/discussions/using_discussions/#lock-or-unlock-a-thread). Delete it only if you are certain it will not be needed again.
    translation: Als je de oorspronkelijke discussie niet meer nodig hebt, kun je [deze vergrendelen](/en/user_manual/discussions/using_discussions/#lock-or-unlock-a-thread). Verwijder de discussie alleen als je zeker weet dat je deze niet meer nodig hebt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
