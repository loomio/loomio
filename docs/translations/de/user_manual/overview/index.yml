  73449e09f559b4bd:
    english: Loomio is a discussion and decision making tool for collaborative organizations.
    translation: Loomio ist ein Werkzeug für Diskussionen und Entscheidungen in Organisationen, die zusammenarbeiten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c6d663f00c64f35d:
    english: It enables you to bring people together to discuss topics, explore proposals and make decisions.
    translation: Damit kannst du Menschen zusammenbringen, um Themen zu besprechen, Vorschläge zu prüfen und Entscheidungen zu treffen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
