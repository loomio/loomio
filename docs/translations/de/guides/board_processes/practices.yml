  be27d7d85647e400:
    english: "# Governance practices and approaches"
    translation: "# Praktiken und Ansätze der Gremienarbeit"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3242767a5e393028:
    english: Good governance includes establishing, reviewing and challenging governance practices, policies and procedures to continously improve board effectiveness.
    translation: Zu guter Gremienarbeit gehört es, Arbeitsweisen, Richtlinien und Verfahren festzulegen, zu überprüfen und zu hinterfragen. So kann das Gremium seine Arbeit laufend verbessern.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c4d8cb7f7eb901a6:
    english: However many boards are short on time and often weighed down by board papers, compliance and risk, without sufficient time to discuss and debate critical strategy and performance issues.
    translation: Vielen Gremien fehlt jedoch die Zeit. Sitzungsunterlagen, Compliance und Risiken beanspruchen viel Aufmerksamkeit. Für die Diskussion wichtiger Fragen zu Strategie und Leistung bleibt oft zu wenig Raum.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  eb59655c49bf902d:
    english: "## On Loomio\nLoomio offers the opportunity to work online on a document, policy or procedure.  Discussion and decisions are contained in a thread that members can access when and wherever works for them.  "
    translation: |-
      ## Auf Loomio
      Auf Loomio kannst du gemeinsam mit anderen an einem Dokument, einer Richtlinie oder einem Verfahren arbeiten. Diskussionen und Entscheidungen bleiben in einer Diskussion zusammengefasst, auf die Mitglieder zugreifen können, wann und wo es für sie passt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a0d6426929e39b38:
    english: 'Use a **thread** for each document, policy or procedure. The thread is the container for discussion, and holds document drafts and subsequent versions of the document.  '
    translation: Nutze für jedes Dokument, jede Richtlinie und jedes Verfahren eine **Diskussion**. Dort finden die Gespräche statt und dort liegen die Entwürfe und späteren Fassungen des Dokuments.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  551c5aac67b42167:
    english: With a Loomio thread, you can organize so that the 2-3 people working on the document text are discussing particulars in the thread.  The thread could be private amongst just those 2-3 people, or run openly in the group so that the work is transparent to all members.
    translation: In einer Loomio-Diskussion können die zwei bis drei Personen, die am Text arbeiten, Einzelheiten besprechen. Die Diskussion kann nur für diese Personen zugänglich sein oder offen in der Gruppe stattfinden, damit alle Mitglieder die Arbeit verfolgen können.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1400a6d44d7d4e35:
    english: When the document reaches a draft version, use a **Sense check poll** to notify members that the draft document is ready for review, and invite members to read the document and respond with any comments or questions.  As well as letting everyone know that the work is progressing, the poll closing date encourages people to participate.
    translation: Sobald ein Entwurf vorliegt, nutze eine **Stimmungsbild-Abstimmung**, um die Mitglieder darüber zu informieren, dass sie ihn prüfen können. Lade sie ein, das Dokument zu lesen und Kommentare oder Fragen zu hinterlassen. So erfahren alle, dass die Arbeit vorangeht. Der Schlusstermin der Abstimmung gibt ihnen einen Anlass, sich zu beteiligen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  44bcb71608c8f14a:
    english: The document may require several draft iterations.
    translation: Bis zur fertigen Fassung können mehrere Entwürfe nötig sein.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a5371854b689874a:
    english: When a 'final' draft is ready, raise a **Proposal** to approve the document.
    translation: Wenn ein abschließender Entwurf vorliegt, starte einen **Vorschlag**, um das Dokument zu beschließen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5998c94bd5b640ab:
    english: Loomio enables a board to progress work on governance improvement between meetings without eating into precious time in meetings.
    translation: Mit Loomio kann ein Gremium die Arbeit an seinen Verfahren zwischen den Sitzungen voranbringen, ohne dafür wertvolle Sitzungszeit zu benötigen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
