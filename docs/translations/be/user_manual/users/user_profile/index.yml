    translated_on: '2026-09-30'
  a12633b5bfa58576:
    english: "## Deleting your account"
    translation: "## Выдаленне ўліковага запісу"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  544b974bf2c6bdfa:
    english: If you wish to delete your Loomio user account and leave any Loomio groups you are a member of, see [Deleting Your Loomio Account](../deleting_your_account).
    translation: Калі вы хочаце выдаліць свой уліковы запіс Loomio і выйсці з усіх груп Loomio, у якіх удзельнічаеце, глядзіце [Выдаленне ўліковага запісу Loomio](../deleting_your_account).
