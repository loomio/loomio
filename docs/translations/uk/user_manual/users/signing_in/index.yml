---
navigation_title: Вхід
blocks:
  7d0aa091e06fa112:
    english: "# Signing in"
    translation: "# Вхід"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3bede807c136909b:
    english: On Loomio.com, you can sign in with a passkey, your email and password, an emailed sign-in code, or Google. You can choose whichever available method is most convenient for you.
    translation: На Loomio.com ви можете увійти за допомогою ключа доступу, електронної адреси й пароля, коду з електронного листа або облікового запису Google. Виберіть найзручніший із доступних способів.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2bc2277a8ee0508d:
    english: "![The Loomio sign-in form with passkey, email, password, and emailed-code options](sign_in_email.png)"
    translation: "![Форма входу в Loomio з варіантами входу за допомогою ключа доступу, електронної адреси, пароля та коду з листа](sign_in_email.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e3daf63d410d5513:
    english: "## Sign in with a passkey"
    translation: "## Вхід за допомогою ключа доступу"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5c82bc1e8baa9f0b:
    english: Select **Use a passkey**. Your browser or device shows the Loomio passkeys available to you and asks you to unlock the selected passkey with its normal screen lock, fingerprint, face recognition, PIN, or security key. You do not enter an email address first.
    translation: 'Виберіть **Використовуйте ключ доступу**. Браузер або пристрій покаже доступні вам ключі доступу для Loomio й запропонує розблокувати вибраний ключ звичайним способом: блокуванням екрана, відбитком пальця, розпізнаванням обличчя, PIN-кодом або ключем безпеки. Спочатку вводити електронну адресу не потрібно.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9386303ee98cb592:
    english: You can add, name, and remove passkeys from your profile. For security, Loomio may ask you to sign in again before changing them. Give each passkey a recognizable name such as “Work laptop” or “Phone”. Passkeys are tied to the Loomio site where they were created and may be synchronized by your device or password manager.
    translation: У своєму профілі ви можете додавати, називати й видаляти ключі доступу. З міркувань безпеки Loomio може попросити вас увійти повторно перед їх зміною. Дайте кожному ключу впізнавану назву, наприклад «Робочий ноутбук» або «Телефон». Ключі доступу прив’язані до сайту Loomio, на якому їх створено. Ваш пристрій або менеджер паролів може їх синхронізувати.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5f10999e671f9b56:
    english: "## Sign in with email and password"
    translation: "## Вхід за допомогою електронної адреси й пароля"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5c8a380df0b08c86:
    english: Enter your email address and password, then select **Sign in**. For account privacy, Loomio uses the same error when the email or password cannot be used to sign in.
    translation: Введіть свою електронну адресу й пароль, а потім виберіть **Увійти**. Для захисту приватності облікових записів Loomio показує однакову помилку, коли для входу не можна використати електронну адресу або пароль.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  63c19e6f58a1de53:
    english: If you have not added a passkey, Loomio offers to add one after you sign in with a password. You can dismiss the offer, and Loomio will remember your choice.
    translation: Якщо ви ще не додали ключ доступу, після входу з паролем Loomio запропонує вам це зробити. Ви можете відхилити пропозицію, і Loomio запам’ятає ваш вибір.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dde79982546607b4:
    english: If you do not have a password or cannot remember it, select **Send me a code** instead.
    translation: Якщо у вас немає пароля або ви його не пам’ятаєте, натомість виберіть **Надіслати мені код**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5f3c6f8eca20d49c:
    english: "## Get a sign-in code"
    translation: "## Отримання коду для входу"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9713c017e247d8e2:
    english: Select **Send me a code**, enter your email address, and submit the form. Loomio displays the same confirmation whether or not the address belongs to an account, so another person cannot use the form to discover who uses Loomio.
    translation: Виберіть **Надіслати мені код**, введіть свою електронну адресу й надішліть форму. Loomio показує однакове підтвердження незалежно від того, чи пов’язана адреса з обліковим записом. Так інша людина не зможе дізнатися через цю форму, хто користується Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  546aaa95b133da11:
    english: If the address belongs to your account, Loomio sends a six-digit code. Return to the sign-in form, enter the code, and select **Sign in**. Sign-in codes normally expire after 24 hours and cannot be reused. Check your spam folder if the message does not arrive, and make sure you entered the address associated with your account.
    translation: Якщо адреса пов’язана з вашим обліковим записом, Loomio надішле шестизначний код. Поверніться до форми входу, введіть код і виберіть **Увійти**. Коди для входу зазвичай діють 24 години, і їх не можна використовувати повторно. Якщо лист не надійшов, перевірте папку зі спамом і переконайтеся, що ви ввели адресу, пов’язану з вашим обліковим записом.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  26171d5996050130:
    english: "![The Loomio form for entering a six-digit sign-in code](sign_in_code.png)"
    translation: "![Форма Loomio для введення шестизначного коду для входу](sign_in_code.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '087809317d00494a':
    english: After each sign-in with a code, Loomio offers to set or replace your password. If your browser supports passkeys, you can also add one, even if you have already added a passkey on another device. A passkey lets you sign in quickly with your device’s fingerprint, face, or screen lock. You can skip the offer and continue using emailed codes.
    translation: Після кожного входу за допомогою коду Loomio пропонує встановити або замінити пароль. Якщо ваш браузер підтримує ключі доступу, ви також можете додати ключ, навіть якщо вже додали його на іншому пристрої. Ключ доступу дає змогу швидко входити за допомогою відбитка пальця, розпізнавання обличчя або блокування екрана вашого пристрою. Ви можете пропустити пропозицію й надалі користуватися кодами з електронних листів.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fa960675e8369daf:
    english: "## Create an account"
    translation: "## Створення облікового запису"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  75fc0885f772c8cf:
    english: Select **Create account** and follow the email-verification steps.
    translation: Виберіть **Створити обліковий запис** і виконайте кроки для підтвердження електронної адреси.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aa461253943b989a:
    english: For privacy, use the same email address that received your group invitation. If you have accounts under more than one address, you can [merge your accounts](/en/user_manual/users/merge_accounts).
    translation: Для збереження приватності використовуйте ту саму електронну адресу, на яку ви отримали запрошення до групи. Якщо у вас є облікові записи з різними адресами, ви можете [об’єднати свої облікові записи](/en/user_manual/users/merge_accounts).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d9844ac27d806c35:
    english: "## Sign in with Google"
    translation: "## Вхід за допомогою Google"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8445cfcb9e9ecef5:
    english: Select **Sign in with Google** and authenticate with your Google account. If an existing Loomio account has the same email address, Loomio links the Google identity to that account.
    translation: Виберіть **Увійти через Google** й увійдіть у свій обліковий запис Google. Якщо наявний обліковий запис Loomio має ту саму електронну адресу, Loomio пов’яже його з обліковим записом Google.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  46281cafc4a889bf:
    english: "## Other Loomio sites"
    translation: "## Інші сайти Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  23c2dffa5d5056e2:
    english: Organizations that host their own Loomio site can configure different sign-in methods. A site may offer passwords, emailed codes, passkeys, Google, SAML, or another OAuth provider alongside each other.
    translation: Організації, які розміщують власний сайт Loomio, можуть налаштовувати різні способи входу. Сайт може одночасно підтримувати паролі, коди з електронних листів, ключі доступу, Google, SAML або іншого постачальника OAuth.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3de129c7bac50409:
    english: Some sites require an invitation before you can create an account. On these sites, **Create account** appears only when you follow an invitation link.
    translation: На деяких сайтах для створення облікового запису потрібне запрошення. На таких сайтах кнопка **Створити обліковий запис** з’являється лише після переходу за посиланням із запрошення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  16004d08bcad640b:
    english: An SSO-only private site shows only its organization sign-in option. It does not offer Loomio-managed passwords, emailed sign-in codes, native account creation, or Loomio-managed passkeys. If the organization uses passkeys, its identity provider asks for them during SSO.
    translation: На приватному сайті, де використовується лише SSO, показано тільки спосіб входу через організацію. Такий сайт не пропонує паролів, кодів для входу з електронних листів, створення облікових записів або ключів доступу, якими керує Loomio. Якщо організація використовує ключі доступу, її постачальник ідентифікації попросить застосувати їх під час входу через SSO.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  148bcb52b49eb179:
    english: "## Sign out"
    translation: "## Вихід з облікового запису"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dc9ad2d75eb9da48:
    english: Open the sidebar, select your name, then select **Sign out**. On a shared computer, sign out when you finish rather than closing only the browser tab.
    translation: Відкрийте бічну панель, виберіть своє ім’я, а потім **Вийти**. Якщо ви користуєтеся спільним комп’ютером, після завершення роботи вийдіть з облікового запису, а не просто закрийте вкладку браузера.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
