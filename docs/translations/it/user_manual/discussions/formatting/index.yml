    translated_on: '2026-09-29'
  e23dd94c965ae06c:
    english: Select an image file from your computer. The image is inserted into the editor after it uploads.
    translation: Seleziona un file immagine dal tuo computer. Al termine del caricamento, l'immagine viene inserita nell'editor.
    status: machine
