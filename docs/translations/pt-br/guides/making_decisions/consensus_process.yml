  223c90e3fe5b24d7:
    english: "> *“Consensus is the process – a participatory process by which a group thinks and feels together, en route to their decision.” - Sam Kaner, Community at Work*"
    translation: "> *“O consenso é o processo — um processo participativo no qual um grupo pensa e sente em conjunto enquanto caminha para uma decisão.” — Sam Kaner, Community at Work*"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9872b82ded022524:
    english: |-
      ## Key points
      - Discuss and develop a proposal together
      - Include and respect everyone involved
      - Seek agreement from most people
    translation: |-
      ## Pontos principais
      - Discuta e desenvolva uma proposta em conjunto
      - Inclua e respeite todas as pessoas envolvidas
      - Busque o acordo da maioria das pessoas
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a1cd3fa440013e0c:
    english: "**Consensus is typically used in:**\n- Working teams building shared understanding of an issue or opportunity, collaborating on a proposal and deciding course of action. \n- Governance board decisions where the board shows it is acting jointly, such as decisions on vision, policy, strategic planning and budget.\n- AGMs and General Assemblies where members and stakeholders seek general agreement for major decisions, such as revisions to statutes, major transactions and the elections of directors or council members."
    translation: |-
      **O consenso costuma ser usado em:**
      - Equipes de trabalho que constroem uma compreensão comum de um problema ou oportunidade, colaboram em uma proposta e decidem o que fazer.
      - Decisões de conselhos de governança que demonstram atuação conjunta, como decisões sobre visão, políticas, planejamento estratégico e orçamento.
      - Assembleias gerais, nas quais membros e outras partes interessadas buscam um acordo amplo sobre decisões importantes, como alterações no estatuto, grandes transações e eleições de diretores ou conselheiros.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7c5d3122a1333ba5:
    english: |-
      **Typical roles:**
      - Appoint a facilitator.  In board meetings this is usually the Chairperson.
      - A quorum or supermajority of members to participate, as specified in the organization's statutes.
    translation: |-
      **Papéis típicos:**
      - Designe uma pessoa para facilitar o processo.  Nas reuniões do conselho, essa pessoa geralmente é quem preside a reunião.
      - Um quórum ou uma maioria qualificada de membros deve participar, conforme definido no estatuto da organização.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1d8ee54aa5e87423:
    english: |-
      ## Consensus process steps
      1. State the issue to be decided - start a Loomio **discussion**.
      2. Present a proposal to test for consensus - start a **Sense check proposal**.
      3. Clarify any points, invite constructive modifications and amend the proposal.
      4. Test for agreement - start a **Consensus proposal**.
      5. Outcome - state the decision **outcome**.
    translation: |-
      ## Etapas do processo de consenso
      1. Apresente a questão a ser decidida — inicie uma **discussão** no Loomio.
      2. Apresente uma proposta para verificar se há consenso — inicie uma **proposta de verificação de sentido**.
      3. Esclareça os pontos necessários, convide as pessoas a sugerir mudanças construtivas e ajuste a proposta.
      4. Verifique se há acordo — inicie uma **proposta de consenso**.
      5. Conclusão — registre a **conclusão** da decisão.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0b5249cfd4c92c35:
    english: |-
      ## Benefits
      - Grow shared understanding.
      - Decisions for the collective will of the group.
      - Encourage people to value the group over their personal preferences.
    translation: |-
      ## Benefícios
      - Amplia a compreensão comum.
      - Produz decisões que expressam a vontade coletiva do grupo.
      - Incentiva as pessoas a considerar as necessidades do grupo além de suas preferências pessoais.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  55d7d6c48f056550:
    english: "## Applying the Consensus process on Loomio"
    translation: "## Como aplicar o processo de consenso no Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e50b473237140170:
    english: |-
      | **Consensus process** | **On Loomio** |
      |---|---|
      | You notice a problem or opportunity and take the initiative. |  |
      | **State the issue to be decided**  <br /><br />Provide background information and open a broad ranging discussion to build shared understanding. Look for emerging proposals. | Start a Loomio discussion <br /><br />Name the topic of discussion in the discussion title, and what you hope to achieve. <br /><br />Attach or link to background information. Invite people to ask questions, contribute information and write comments. |
      | **Present a proposal** <br /><br />Test for consensus. | Run a [Sense check proposal](/en/user_manual/polls/proposals/sense_check/). <br /><br />*In the title:* Name the proposal. <br /><br />*In the proposal details:* Clearly frame the proposal and say why it is important.  Include any background information necessary and a link to the proposal.  <br /><br />Invite everyone to respond, and to do so before the proposal closes.  |
      | **Amendment** <br /><br />Discuss, clarify and amend the proposal. <br /><br />Seek to understand and resolve any objections. <br /><br />Invite people objecting to to propose a constructive and practical modification to the proposed decision or course of action. | Facilitate discussion in the thread to address concerns and modify the proposal. |
      | **Agreement** <br /><br />Do you have an agreement?  Check for: <br /><br />Agreement: I support the proposal. <br /><br />Abstain: This decision does not affect me and I am happy with whatever the group decides. <br /><br />Disagreement: Something in the proposal needs to be changed before I can support it. <br /><br />Block: I have a fundamental disagreement with the proposal that cannot be resolved. | Run a [Consensus proposal](/en/user_manual/polls/proposals/consensus/) with the current proposal version. <br /><br />*In the title:* Name the decision to be made. <br /><br />*In the proposal details:* Present the proposal and invite people to vote. <br /><br />Include a clear statement of what agreement means, say 'for this proposal to pass, we need everyone to vote agree' or 'for this proposal to pass, we need 75% of members to agree'.  <br /><br />Ask participants to leave a vote 'Reason' - and if they do not agree to say why, and what needs to change for them to agree. <br /><br />Some organizations also use the Block (or veto) voting option. <br /><br />As voting progresses, respond to comments, post updates, close early, or let the proposal run to conclusion. <br /><br />Participants can *“change vote”* up to proposal close time, say in response to new information that arrives during voting. |
      | **Outcome** <br /><br />State if agreement was reached and the decision that has been made. <br /><br />Implement the decision and plan actions to be taken. | Consider voting results and state the decision made. <br /><br />Summarize results of the process and say what will happen next. <br /><br />If results are inconclusive, you may choose to re-open the discussion and run a new proposal. <br /><br />The outcome statement is an important record of the decision for future reference. |
    translation: |-
      | **processo de consenso** | **No Loomio** |
      |---|---|
      | Você identifica um problema ou uma oportunidade e toma a iniciativa. |  |
      | **Apresente a questão a ser decidida**  <br /><br />Forneça informações de contexto e abra uma discussão ampla para construir um entendimento comum. Observe as propostas que surgirem. | Inicie uma discussão no Loomio <br /><br />Use o título da discussão para indicar o assunto e o que você espera alcançar. <br /><br />Anexe informações de contexto ou inclua links para elas. Convide as pessoas a fazer perguntas, compartilhar informações e escrever comentários. |
      | **Apresente uma proposta** <br /><br />Verifique se há consenso. | Inicie uma [proposta de verificação de sentido](/en/user_manual/polls/proposals/sense_check/). <br /><br />*No título:* Dê um nome à proposta. <br /><br />*Nos detalhes da proposta:* Descreva a proposta com clareza e explique por que ela é importante. Inclua as informações de contexto necessárias e um link para a proposta. <br /><br />Convide todas as pessoas a responder antes do encerramento da proposta. |
      | **Alteração** <br /><br />Discuta, esclareça e altere a proposta. <br /><br />Procure entender e resolver as objeções. <br /><br />Convide quem apresentar objeções a sugerir uma alteração construtiva e viável para a decisão ou o plano de ação proposto. | Conduza a discussão no tópico para tratar das preocupações e modificar a proposta. |
      | **Acordo** <br /><br />Há acordo? Considere estas respostas: <br /><br />Concordo: Apoio a proposta. <br /><br />Abstenção: Esta decisão não me afeta, e aceito o que o grupo decidir. <br /><br />Discordo: Algo na proposta precisa mudar para que eu possa apoiá-la. <br /><br />Bloqueio: Tenho uma discordância fundamental em relação à proposta que não pode ser resolvida. | Inicie uma [proposta de consenso](/en/user_manual/polls/proposals/consensus/) com a versão atual da proposta. <br /><br />*No título:* Dê um nome à decisão a ser tomada. <br /><br />*Nos detalhes da proposta:* Apresente a proposta e convide as pessoas a votar. <br /><br />Explique claramente o que constitui um acordo. Por exemplo: 'para esta proposta ser aprovada, todas as pessoas precisam votar Concordo' ou 'para esta proposta ser aprovada, 75% dos membros precisam concordar'. <br /><br />Peça aos participantes que informem um 'Motivo' ao votar. Se não concordarem, peça que expliquem por quê e o que precisaria mudar para que concordassem. <br /><br />Algumas organizações também usam a opção de voto Bloquear (ou veto). <br /><br />Durante a votação, responda aos comentários, publique atualizações, encerre a proposta antecipadamente ou deixe que ela siga até o fim. <br /><br />Os participantes podem *“mudar o voto”* até o encerramento da proposta, por exemplo, diante de novas informações durante a votação. |
      | **Conclusão** <br /><br />Informe se houve acordo e qual decisão foi tomada. <br /><br />Implemente a decisão e planeje as ações necessárias. | Considere os resultados da votação e informe a decisão tomada. <br /><br />Resuma os resultados do processo e explique o que acontecerá em seguida. <br /><br />Se os resultados forem inconclusivos, você pode reabrir a discussão e iniciar uma nova proposta. <br /><br />O texto da conclusão é um registro importante da decisão para consultas futuras. |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
