    english: |-
      ## Generate a Webhook URL
      We've prepared step by step walk-throughs for each service we support. Follow the right one for your service to obtain the webhook URL you'll need to add the chat integration in Loomio.
    translation: |-
      ## Gere uma URL de webhook
      Preparamos instruções passo a passo para cada serviço compatível. Siga as instruções do seu serviço para obter a URL de webhook necessária para adicionar a integração de bate-papo no Loomio.
    status: machine
