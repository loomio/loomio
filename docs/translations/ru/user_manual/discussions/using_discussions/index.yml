---
navigation_title: Работа с темами
blocks:
  d6fe7310d19b1141:
    english: "# Using threads"
    translation: "# Работа с темами"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  031f9244f107aba8:
    english: A discussion keeps its context, comments, decisions, and outcomes together in one thread. This page explains how to participate in a thread and use its navigation and actions.
    translation: Обсуждение объединяет контекст, комментарии, решения и итоги в одной теме. На этой странице рассказано, как участвовать в теме и пользоваться навигацией и действиями.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  479a1564b496bfed:
    english: "## Thread anatomy"
    translation: "## Структура темы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb745de96e6a612d:
    english: 'A typical thread looks like this:'
    translation: 'Обычная тема выглядит так:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e69f7f0b13fd9f9:
    english: 'From the top of the page, a thread contains:'
    translation: 'Сверху вниз на странице темы расположены:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5b47d6434aa50e94:
    english: "**Group name** - At the top left of the discussion page is the name of the group or subgroup that the discussion belongs to.  Click on this name to go back to the group page."
    translation: "**Название группы** - В левом верхнем углу страницы обсуждения указано название группы или подгруппы, к которой оно относится. Нажмите на название, чтобы вернуться на страницу группы."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0dab4c46c2bee003:
    english: "**Discussion access** - The access icon at the top right opens the discussion's access settings. A group discussion is available to group members and anyone specifically invited to it, subject to the group's privacy settings."
    translation: "**Доступ к обсуждению** - Значок доступа в правом верхнем углу открывает настройки доступа к обсуждению. Обсуждение в группе доступно участникам группы и тем, кого пригласили лично, с учётом настроек приватности группы."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e20178954e6d3ce0:
    english: "**Discussion title** - The name of the discussion."
    translation: "**Название обсуждения** - Название обсуждения."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  47687209ed924849:
    english: "**Category tags** - The discussion may have one or more category tags. Using simple tags helps people more easily find discussions of a similar type."
    translation: "**Теги категорий** - У обсуждения может быть один или несколько тегов категорий. Простые теги помогают находить похожие обсуждения."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b817649f985f51de:
    english: "**Discussion author** - The name and avatar of the person who started the discussion, shown beneath the title."
    translation: "**Автор обсуждения** - Имя и аватар человека, начавшего обсуждение, показаны под названием."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c44d5a833b4ec9ff:
    english: "**Date** - Hover over the date to see the full date and time of discussion start."
    translation: "**Дата** - Наведите указатель на дату, чтобы увидеть точные дату и время начала обсуждения."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b8062113f1078acb:
    english: "**Seen by** - In the right sidebar, shows who has read the discussion and when."
    translation: "**Виденный** - В правой боковой панели показано, кто и когда прочитал обсуждение."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  133d0c2e469e9683:
    english: "**Notified** - In the right sidebar, shows who has been notified about the discussion and whether each notification has been read or its email opened."
    translation: "**Уведомлено** - В правой боковой панели показано, кто получил уведомление об обсуждении, а также прочитано ли уведомление или открыто ли письмо."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9f788adb4eab80cc:
    english: "**Discussion context** - Content to frame the discussion."
    translation: "**Контекст обсуждения** - Текст, который задаёт основу для обсуждения."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e8c5ae76dfb5b89b:
    english: "**Discussion interaction and administration tools** - The discussion context has controls to react to and edit it. The right sidebar contains notification, membership and administration actions."
    translation: "**Инструменты взаимодействия и управления обсуждением** - Рядом с контекстом обсуждения можно поставить реакцию или изменить его. В правой боковой панели доступны действия с уведомлениями, участниками и настройками управления."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8f6eac4359c2b9f6:
    english: "**Comments** - Comments are displayed under the discussion context. The author's name, avatar and posting time show who wrote each comment and when. Interaction and administration tools are available on each comment."
    translation: "**Комментарии** - Комментарии расположены под контекстом обсуждения. Имя, аватар и время публикации показывают, кто и когда написал каждый комментарий. Для каждого комментария доступны инструменты взаимодействия и управления."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f978af6c9af4afe5:
    english: |-
      **Navigation, notifications and actions** - The right sidebar contains
      shortcuts to activity and milestones, notification and membership information,
      and the thread actions available to you.
    translation: |-
      **Навигация, уведомления и действия** - В правой боковой панели находятся
      ссылки на события и важные этапы, сведения об уведомлениях и участниках,
      а также доступные вам действия с темой.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f8c4084e9e8a2b27:
    english: "## Discussion context"
    translation: "## Контекст обсуждения"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5940bad6cb1cb49f:
    english: The discussion **context** is always found at the top of the discussion. Use the context to frame the discussion or decision.
    translation: "**Контекст** всегда находится в начале обсуждения. Используйте его, чтобы обозначить тему обсуждения или решения."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  415dd2d0f1eacc9f:
    english: Think of your group as you write content in the discussion context.  Your aim is to get a discussion going, so consider how you can motivate people to participate.  In general, keep the discussion context simple and clear.
    translation: Когда пишете контекст обсуждения, учитывайте интересы вашей группы. Подумайте, какая информация поможет людям присоединиться к обсуждению. Старайтесь писать просто и ясно.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a1fcece28d8fb61d:
    english: Write the discussion context when starting or editing a discussion. **Edit** a discussion with the pencil icon.
    translation: Добавьте контекст при создании обсуждения или позже. Чтобы изменить его, нажмите значок карандаша **Редактировать**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2f47adddef6b31d9:
    english: As the discussion progresses, update discussion context.  Think of the context like a whiteboard in your meeting room, where you can write the agenda, the outcomes intended and how you plan to get there.
    translation: 'Обновляйте контекст по мере развития обсуждения. Он похож на доску в комнате для встреч: здесь можно записать повестку, ожидаемые итоги и план их достижения.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c82ec20629208982:
    english: At the bottom of the context panel is a formatting bar, where you can format text, attach files, images and embed a video.
    translation: Внизу панели контекста находится панель форматирования. С её помощью можно оформить текст, прикрепить файлы и изображения или встроить видео.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e606d83ae0fb2178:
    english: "### Notify people about context changes"
    translation: "### Уведомления об изменениях контекста"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d188326a58b28d96:
    english: When you edit the discussion context, use **What's changed?** to summarize the update and choose who should be notified.
    translation: Когда редактируете контекст обсуждения, используйте поле **Что изменилось?**, чтобы кратко описать обновление и выбрать, кого уведомить.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  842091a987742d6d:
    english: "![Editing a discussion context with a change summary and notification recipients](../notifying_people/thread_editcontext.png)"
    translation: "![Редактирование контекста обсуждения с описанием изменений и выбором получателей уведомления](../notifying_people/thread_editcontext.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b885359dd7e83428:
    english: The summary appears as an item in the thread so participants can see what changed.
    translation: Описание появится в теме отдельной записью, чтобы участники могли увидеть, что изменилось.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c899c47e98f79a23:
    english: "![A timeline item describing a discussion context change](../notifying_people/thread_edit_comment.png)"
    translation: "![Запись в хронологии об изменении контекста обсуждения](../notifying_people/thread_edit_comment.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  44ffd1d0a732b897:
    english: "## Navigation"
    translation: "## Навигация"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e96aef7a28a85001:
    english: 'The **Jump to** section of the right sidebar helps you move through a thread:'
    translation: 'Раздел **Перейти к** в правой боковой панели помогает перемещаться по теме:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4790c088af5fc09f:
    english: |-
      - **Start** goes to the discussion context
      - **New to you** appears when the thread contains activity you have not read
      - **Latest** appears when newer activity is available beyond the items currently loaded
      - milestone links go directly to important comments, polls, and outcomes
      - **End** goes to the latest item in the thread
    translation: |-
      - **Начать** открывает контекст обсуждения
      - **Новое для вас** появляется, если в теме есть непрочитанные вами события
      - **Последний** появляется, если после загруженных записей есть более новые
      - ссылки на важные этапы ведут прямо к важным комментариям, голосованиям и итогам
      - **Конец** открывает последнюю запись в теме
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  941ea9900465724a:
    english: Comments that include an H2 or H3 heading, polls, and proposals are automatically included as milestone links. Select any milestone to go directly to it.
    translation: Комментарии с заголовком H2 или H3, голосования и предложения автоматически появляются в списке важных этапов. Выберите этап, чтобы сразу перейти к нему.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e94ea6f4b9dae8d4:
    english: When you add a comment, poll, vote, or outcome, Loomio marks your own new item as read. It will not appear as something new for you to review.
    translation: Когда вы добавляете комментарий, голосование, голос или итог, Loomio отмечает вашу новую запись как прочитанную. Она не появится среди новых записей, которые вам нужно просмотреть.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  34251ada1ba3e50b:
    english: "## Notifications and members"
    translation: "## Уведомления и участники"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  36a20a0e10208c7c:
    english: The right sidebar controls your email notifications and shows who has been invited, who has seen the thread, and who has been notified.
    translation: В правой боковой панели можно настроить уведомления по электронной почте и посмотреть, кого пригласили, кто просмотрел тему и кто получил уведомление.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f2a437ac1169c882:
    english: "### Email notifications for this thread"
    translation: "### Уведомления по электронной почте для этой темы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9bd7269489ed048e:
    english: Select the current notification setting to choose whether Loomio emails you about all activity, only activity that specifically notifies you, or no activity. Receiving email for all activity can produce many messages in an active thread.
    translation: 'Нажмите на текущую настройку уведомлений и выберите, когда Loomio будет отправлять вам письма: обо всех событиях, только о событиях с уведомлением лично для вас или ни о каких. В активной теме письма обо всех событиях могут приходить часто.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0d64de2345c8eba9:
    english: "![Email when notified selected in the discussion sidebar](../notifying_people/thread_interact.png)"
    translation: "![В боковой панели обсуждения выбрана отправка письма при уведомлении](../notifying_people/thread_interact.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7bdbdaa98e89d1c3:
    english: "### Invite people"
    translation: "### Пригласить людей"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e81f85e723885264:
    english: Select **Invite people** to add people after the thread has started.
    translation: Чтобы добавить людей после начала темы, выберите **Пригласите людей**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e38a572cdffad5cb:
    english: "![Invite people in the thread sidebar](../notifying_people/thread_invite_icon.png)"
    translation: "![Пригласите людей на боковой панели темы](../notifying_people/thread_invite_icon.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7e4e643fb327aa06:
    english: Select a group or subgroup, enter the names of individual members, or enter an email address to invite a guest.
    translation: Выберите группу или подгруппу, введите имена участников или адрес электронной почты, чтобы пригласить гостя.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  03c1d74b4a8bc31d:
    english: "![Invite people window with a field for names and email addresses](../notifying_people/thread_invite.png)"
    translation: "![Окно приглашения с полем для имён и адресов электронной почты](../notifying_people/thread_invite.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  85fc948a4e849ba8:
    english: A guest can see and participate in this thread but cannot see other discussions in the group unless separately invited.
    translation: Гость может просматривать эту тему и участвовать в ней. Другие обсуждения группы ему доступны, только если его пригласили в них отдельно.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9f1010b58cc5439f:
    english: "![Inviting a guest by email address](../notifying_people/invite_guest.png)"
    translation: "![Приглашение гостя по электронной почте](../notifying_people/invite_guest.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e688189fa93b1e49:
    english: To remove someone, open the three-dot menu (**⋯**) beside their name and select **Remove from discussion**.
    translation: Чтобы удалить человека из обсуждения, откройте меню с тремя точками (**⋯**) рядом с его именем и выберите **Удалить из обсуждения**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5602fbfa565eaf45:
    english: "### Seen by"
    translation: "### Виденo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a929b22d02292573:
    english: "**Seen by** shows who has opened the thread and when. It can help you identify people who may not have seen important information yet."
    translation: Раздел **Виденный** показывает, кто и когда открыл тему. Это поможет узнать, кто ещё не видел важную информацию.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d0335d202c5bbaa3:
    english: "![Seen by and Notified in the Thread members section](../notifying_people/thread_engagement.png)"
    translation: "![Разделы «Виденный» и «Уведомлено» среди участников темы](../notifying_people/thread_engagement.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb77150441a43f5c:
    english: "![Seen by window listing thread members](../notifying_people/thread_seenby.png)"
    translation: "![Окно со списком участников, открывших тему](../notifying_people/thread_seenby.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  185f80d66c2091d8:
    english: "### Notified"
    translation: "### Уведомлено"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  885a21cbc1a44f7d:
    english: "**Notified** opens the discussion notification history. It includes invitations, mentions, and replies, showing who was notified and whether each notification has been read when that information is available."
    translation: Раздел **Уведомлено** открывает историю уведомлений об обсуждении. В ней показаны приглашения, упоминания и ответы, а также кому отправлено уведомление и прочитано ли оно, если эта информация доступна.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e73fae9309f626e2:
    english: "![Discussion notification history](../notifying_people/thread_notified.png)"
    translation: "![История уведомлений об обсуждении](../notifying_people/thread_notified.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  347def7574cf5f1d:
    english: "## Actions"
    translation: "## Действия"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '08ff4ccd500c2a69':
    english: The right sidebar contains actions for the whole thread. Some actions are also available from the three-dot menu (**⋯**) beside a thread on the group page.
    translation: На правой боковой панели находятся действия для всей темы. Некоторые из них также доступны в меню с тремя точками (**⋯**) рядом с темой на странице группы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e73701c7d36f95ef:
    english: The actions shown depend on your permissions. Group admins can manage threads, and group settings may allow members to perform some management actions. See [Group permissions](/en/user_manual/groups/settings/permissions).
    translation: Доступные действия зависят от ваших прав. Администраторы группы могут управлять темами. Настройки группы могут разрешать некоторые действия по управлению и другим участникам. См. [Права доступа в группе](/en/user_manual/groups/settings/permissions).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4fce317a163b0a40:
    english: "### Print"
    translation: "### Печать"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9317d4c7c5ef4764:
    english: Select **Print** to generate a page suitable for printing. Use your browser's print dialog to save it as a PDF.
    translation: Выберите **Печать**, чтобы создать страницу для печати. В окне печати браузера её можно сохранить в формате PDF.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  443af0749df1db2a:
    english: "### Markdown"
    translation: "### Markdown"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eb0442148f7c042d:
    english: Select **Markdown** to save the complete thread as structured Markdown. Choose **Copy Markdown** to copy it to your clipboard, or **Download Markdown** to save it as a `.md` file. You can use it for meeting minutes, a document, an archive of decisions, an AI assistant, or another tool that supports Markdown.
    translation: Выберите **Markdown**, чтобы сохранить всю тему в структурированном формате Markdown. Выберите **Скопировать Markdown**, чтобы скопировать текст в буфер обмена, или **Скачать Markdown**, чтобы сохранить его в файле `.md`. Этот файл можно использовать для протокола встречи, документа, архива решений, работы с ИИ-помощником или другим инструментом, поддерживающим Markdown.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  80e3f57638b53cb4:
    english: The document begins with YAML front matter containing the thread key, group, creation date, last activity date, and tags. It then includes the discussion context and every comment, poll, vote, and outcome in the same order and nesting as the threaded view.
    translation: 'Документ начинается с блока метаданных YAML: ключа темы, группы, даты создания, даты последней активности и тегов. Затем идут описание обсуждения и все комментарии, голосования, голоса и результаты. Их порядок и вложенность соответствуют представлению **Threaded**.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f99823b7b44e2cdd:
    english: Each poll is a section. Comments, votes, and outcomes are quoted, and replies are quoted beneath the item they answer. This shows where each person's text begins and ends. Each quote starts with one line showing the person, when they posted, the item's number in the thread, and any reactions. Votes and outcomes also say what they are. The thread key and item number identify each item in Loomio.
    translation: Каждое голосование выделено в отдельный раздел. Комментарии, голоса и результаты оформлены как цитаты. Ответы помещены под сообщениями, на которые они отвечают. Так видно, где начинается и заканчивается текст каждого человека. Первая строка каждой цитаты содержит имя автора, время публикации, номер записи в теме и реакции, если они есть. Для голосов и результатов также указан тип записи. Ключ темы и номер записи позволяют найти её в Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e5bdfbb4a0d7646f:
    english: Loomio applies the same visibility rules as the thread. Results and vote reasons you cannot see are not included, and voters are not identified in anonymous polls. If an open poll hides results until you vote, vote before exporting the thread. **Markdown** and **Print** are unavailable until you do.
    translation: При экспорте Loomio соблюдает те же правила видимости, что и в теме. Результаты и причины голосования, к которым у вас нет доступа, не включаются. В анонимных голосованиях имена голосовавших не раскрываются. Если результаты открытого голосования скрыты до подачи голоса, проголосуйте перед экспортом темы. До этого действия **Markdown** и **Печать** недоступны.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7989d3386a42f180:
    english: 'For example, a discussion containing a comment, reactions, a proposal, two votes, a reply, and an outcome produces this Markdown:'
    translation: 'Например, обсуждение с комментарием, реакциями, предложением, двумя голосами, ответом и результатом будет выглядеть в Markdown так:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  275f4d9025c017c4:
    english: The headings and labels use your selected language. Content written by participants remains in its original language.
    translation: Заголовки и метки отображаются на выбранном вами языке. Текст участников остаётся на языке оригинала.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dab18fdf3c56269d:
    english: "### Thread settings and display"
    translation: "### Настройки и отображение темы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7bc55279f97c6d1b:
    english: Group admins can select **Thread settings** to change how replies are arranged and configure other discussion options.
    translation: Администраторы группы могут открыть **Настройки темы**, чтобы изменить расположение ответов и другие параметры обсуждения.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  32b2640ba23524aa:
    english: Choose **Timeline** to list items in the order they were posted, or **Threaded** to group replies beneath the item they respond to. Thread settings also control whether multiple polls may run at once and can set a maximum comment length. These settings apply to everyone in the discussion.
    translation: Выберите **Хронология**, чтобы показать записи в порядке публикации, или **Threaded**, чтобы разместить ответы под записями, на которые они отвечают. В настройках темы также можно разрешить несколько одновременных голосований и установить максимальную длину комментария. Эти настройки действуют для всех участников обсуждения.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a520339278bcc2a:
    english: "### Pin or unpin a thread"
    translation: "### Как закрепить или открепить тему"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0433e7a61db60003:
    english: Pinned threads appear above other threads on the group page. Welcome discussions, news items, and announcements are typical uses for pinned threads.
    translation: Закреплённые темы отображаются выше остальных на странице группы. Так можно выделить приветственное обсуждение, новости или объявления.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b2712588a5e0aab3:
    english: Open the three-dot menu (**⋯**) beside the thread on the group page and select **Pin thread**. Pinned threads are ordered by the time they were pinned. To change their order, unpin and pin them again.
    translation: Откройте меню с тремя точками (**⋯**) рядом с темой на странице группы и выберите **Закрепить тему**. Закреплённые темы расположены в порядке закрепления. Чтобы изменить порядок, открепите их и закрепите снова.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a0443f076d1b8ae5:
    english: Select **Unpin thread** to return a thread to the activity-based order.
    translation: Выберите **Открепить тему**, чтобы вернуть её в порядок по активности.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b90a469963b02ffc:
    english: "### Move a thread"
    translation: "### Перемещение темы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8b2071f4625705e5:
    english: Select **Move thread** to move a thread to another group, subgroup, or to a direct thread. It will be visible to members of the destination group and anyone specifically invited to it.
    translation: Выберите **Переместить тему**, чтобы перенести её в другую группу, подгруппу или сделать прямой темой. Тема будет видна участникам группы назначения и всем, кто получил отдельное приглашение.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f09d5f2afce03ee8:
    english: |-
      >[!Tip]
      >Start a draft as a direct discussion or in a private subgroup, then move it to the group when it is ready.
    translation: |-
      >[!Tip]
      >Создайте черновик как прямое обсуждение или в закрытой подгруппе, а когда он будет готов, переместите его в группу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c82562b641053308:
    english: To move selected activity rather than the whole thread, see [Moving items between threads](/en/user_manual/discussions/moving_items/).
    translation: Чтобы перенести отдельные записи, а не всю тему, см. [Перемещение записей между темами](/en/user_manual/discussions/moving_items/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  be22d2980075fdaa:
    english: "### Lock or unlock a thread"
    translation: "### Блокировка и разблокировка темы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e7c24a610fd2bf8b:
    english: Lock a thread to prevent comments or further changes. A thread can only be locked after its active polls have closed.
    translation: Заблокируйте тему, чтобы запретить новые комментарии и дальнейшие изменения. Заблокировать тему можно только после завершения всех активных голосований.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  edb983bb6366aa6c:
    english: Select **Lock thread** under **Actions**. Locked threads are removed from the list of open discussions and marked with a **Locked** tag.
    translation: В разделе **Действия** выберите **Заблокировать тему**. Заблокированные темы исчезают из списка открытых обсуждений и получают метку **Заблокировано**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ba2794349524cc33:
    english: To find a locked thread, open the discussion filter on the group page and select **Locked**. Open the thread and select **Unlock thread** to allow comments and changes again.
    translation: Чтобы найти заблокированную тему, откройте фильтр обсуждений на странице группы и выберите **Заблокировано**. Откройте тему и выберите **Разблокировать тему**, чтобы снова разрешить комментарии и изменения.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3a75fb1ad0ffab87:
    english: "### Delete a thread"
    translation: "### Удаление темы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0103a5729bd6a095:
    english: Deleting a thread removes it permanently and cannot be undone. Lock the thread instead if you may need it again.
    translation: Удаление темы необратимо. Если она может понадобиться вам позже, заблокируйте её.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  daf08ca8895b0fe2:
    english: Select **Delete thread** and confirm the deletion.
    translation: Выберите **Удалить тему** и подтвердите удаление.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
