    translated_on: '2026-09-30'
  290b36f9178272e2:
    english: |-
      Our webhook based system can also be used to support other systems that support incoming webhooks with either HTML or Markdown formatting. This could be something like Zapier or Rocketchat.
      Just select the mattermost bot, but use a custom webhook URL.
    translation: |-
      Праз вэбхук можна падключыць і іншыя сэрвісы, якія прымаюць уваходныя вэбхукі з фарматаваннем HTML або Markdown, напрыклад Zapier ці Rocketchat.
      Выберыце бота Mattermost і ўкажыце ўласны URL-адрас вэбхука.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f76c44196c94dcef:
    english: "## Set up a chat integration"
    translation: "## Наладзьце інтэграцыю з чатам"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3c63f567f90fd1eb:
    english: |-
      After configuring your chosen service (see above), you'll have a webhook URL.
      Open **Chat integrations** from the group menu and add a new chat integration for your group.
    translation: |-
      Пасля наладкі выбранага сэрвісу (гл. вышэй) у вас будзе URL-адрас вэбхука.
      Адкрыйце **Інтэграцыі з чатам** у меню групы і дадайце новую інтэграцыю з чатам для сваёй групы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a2e8e555406040a6:
    english: |-
      ![](loomio-group-settings.png)
      ![](loomio-settings-chatbots.png)
    translation: |-
      ![](loomio-group-settings.png)
      ![](loomio-settings-chatbots.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ca092d1c3fdb9f59:
    english: 'You probably don''t want to click any of the checkboxes for now. Just enter the name (such as "Discord #general") and the URL and click the save button at the bottom of the form.'
    translation: 'Пакуль можна не адзначаць сцяжкі. Увядзіце назву (напрыклад, «Discord #general») і URL-адрас, затым націсніце кнопку захавання ўнізе формы.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a63a4be4a45bcfdb:
    english: If you decide later that you want the integration to receive automatic notifications, return to its settings and select the relevant events.
    translation: Калі пазней вы захочаце атрымліваць аўтаматычныя апавяшчэнні праз гэтую інтэграцыю, вярніцеся да яе налад і выберыце патрэбныя падзеі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f1d9c09f9d3c2a82:
    english: "### Invite to poll"
    translation: "### Запрасіце прагаласаваць у апытанні"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cbc7b5fd5afcc24c:
    english: |-
      This is how to send a notification to your chatroom inviting people to vote in a proposal.
      It's the same process for Share outcome, Invite to thread, Remind to vote, Poll edited etc.
    translation: |-
      Так можна адправіць у чат запрашэнне прагаласаваць па прапанове.
      Такім жа чынам можна падзяліцца высновай, запрасіць да тэмы, нагадаць пра галасаванне, паведаміць пра змяненне апытання і іншыя падзеі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  290001bb97dee010:
    english: |-
      ### Automatic notifications
      To send a notification whenever a specific event happens, edit the chat integration and select that event.
    translation: |-
      ### Аўтаматычныя апавяшчэнні
      Каб адпраўляць апавяшчэнне кожны раз, калі адбываецца пэўная падзея, адрэдагуйце інтэграцыю з чатам і выберыце гэтую падзею.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
