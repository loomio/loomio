  b3ed13f5612f4ff9:
    english: A direct discussion is a private discussion for a specific set of people.
    translation: Пряме обговорення — це приватне обговорення для визначеного кола людей.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  479f7faed056ab51:
    english: A direct discussion does not belong to a group. Invited people do not need to be a member of your Loomio group.
    translation: Пряме обговорення не належить до групи. Запрошеним людям не потрібно бути учасниками вашої групи в Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2f5362faecc07fa0:
    english: You control who can see and participate by adding people or email addresses to the **Invite** field.
    translation: Ви визначаєте, хто може бачити обговорення та брати в ньому участь, додаючи людей або адреси електронної пошти в поле **Запросити**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f31343ea54b4f899:
    english: Direct discussions support the same comments, polls and other tools as group discussions. They can be useful when creating a subgroup is unnecessary.
    translation: У прямих обговореннях доступні ті самі коментарі, опитування та інші інструменти, що й в обговореннях групи. Вони стануть у пригоді, коли створювати підгрупу немає потреби.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
