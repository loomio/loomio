---
navigation_title: Ваш профіль
blocks:
  7ac59f9506d9a9e9:
    english: "# Your Profile\nYour Loomio user profile is how people recognize you.  "
    translation: |-
      # Ваш профіль
      За вашим профілем у Loomio інші люди впізнають вас.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f77b75330707f9a4:
    english: Being able to recognize people in Loomio helps build trust and authenticity, encouraging more genuine participation.  So wherever possible we encourage you to be you, and to add a photo or avatar.
    translation: Коли люди впізнають одне одного в Loomio, їм легше довіряти одне одному й брати участь в обговореннях. Тому, якщо можете, додайте своє фото або аватар.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e902d9db69f3ccaa:
    english: "## Edit profile"
    translation: "## Редагування профілю"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f48def44ceb36407:
    english: 'Your profile page lets you customize your Loomio identity. To visit your profile page select the **Edit profile** option in the user menu, which is found by clicking on your name at the top of the sidebar. '
    translation: На сторінці профілю ви можете налаштувати, як вас представлено в Loomio. Щоб відкрити її, натисніть своє ім’я вгорі бічної панелі та виберіть **Редагувати профіль** у меню користувача.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  456daa472d672b1f:
    english: If the sidebar is closed, click on the menu icon (**☰**) to open it.
    translation: Якщо бічну панель закрито, натисніть значок меню (**☰**), щоб відкрити її.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7b920b3794ac1be0:
    english: Click on the down arrow to the right of your name.
    translation: Натисніть стрілку вниз праворуч від свого імені.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9664aeb8784b2137:
    english: Click on **Edit profile**
    translation: Натисніть **Редагувати профіль**
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e98e7384d147ec31:
    english: "## Update your personal info"
    translation: "## Оновлення особистої інформації"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9578a723a8d322cc:
    english: 'You can update your personal info by changing any of the following fields:'
    translation: 'Ви можете оновити особисту інформацію, змінивши будь-яке з цих полів:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cc28d4b1038e6fe5:
    english: |-
      * **Name**
      * **Email address** - this is the email address associated with your Loomio account, and where you will receive notifications from Loomio.
      * **Username** - your username is a name people can recognize and alert you using @mention. It can contain lower case letters, numbers, underscores, and internal hyphens.
      * **Introduction** - a few lines to tell others in your group something about you.
      * **Location** - useful for distributed or remote groups so people can get an idea of where you are located.
    translation: |-
      * **Ім’я**
      * **Адреса електроної пошти** — адреса, пов’язана з вашим обліковим записом Loomio. На неї надходитимуть сповіщення від Loomio.
      * **Ім’я користувача** — ім’я, за яким люди можуть упізнати вас і звернутися до вас через @згадку. Воно може містити малі літери, цифри, підкреслення та дефіси всередині імені.
      * **Введення** — кілька рядків, щоб розповісти іншим учасникам групи про себе.
      * **Місцезнаходження** — допомагає учасникам розподілених або віддалених груп зрозуміти, де ви перебуваєте.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d64106bb76c8936e:
    english: "## Viewing another person's profile"
    translation: "## Перегляд профілю іншої людини"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fa6b7c980bad9aeb:
    english: Select a person's name or avatar to open their profile. Their recent discussions, comments, and polls are listed alongside their profile details and groups. The list only includes activity you have permission to access; signed-out visitors see public activity only.
    translation: Виберіть ім’я або аватар людини, щоб відкрити її профіль. Поруч із даними профілю та групами наведено її останні обговорення, коментарі й опитування. Список містить лише дії, до яких ви маєте доступ. Відвідувачі, які не ввійшли в обліковий запис, бачать лише загальнодоступні дії.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ac9abf23a4881216:
    english: "## Uploading a profile photo\nWhen you first create a Loomio account, your initials will be the default image associated with your profile. You can upload a profile photo by clicking on your picture on the profile page. "
    translation: |-
      ## Завантаження фото профілю
      Коли ви створюєте обліковий запис Loomio, зображенням профілю за замовчуванням стають ваші ініціали. Щоб завантажити фото профілю, натисніть своє зображення на сторінці профілю.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b011f45bc197558a:
    english: If you have a [Gravatar](https://en.gravatar.com/) you can set that as your profile picture by selecting **Use Gravatar**. You can also choose for Loomio to use the photo you use for other common platforms/tools.
    translation: Якщо у вас є [Gravatar](https://en.gravatar.com/), виберіть **Використати Gravatar**, щоб установити його як зображення профілю. Ви також можете дозволити Loomio використовувати ваше фото з інших поширених платформ чи інструментів.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  41f1c139f9a0822b:
    english: |-
      ## Language settings
      Loomio is developed in English, but [is translated by volunteers into many languages](https://www.loomio.com/g/cpaM3Hsv/loomio-community-translation).
    translation: |-
      ## Налаштування мови
      Loomio розробляють англійською мовою, але [волонтери перекладають його багатьма мовами](https://www.loomio.com/g/cpaM3Hsv/loomio-community-translation).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9faad78d2b46c546:
    english: Loomio will detect your browser’s language settings, but you can manually set your preferred language from the available options on the profile page.
    translation: Loomio визначає мовні налаштування вашого браузера. Ви також можете вручну вибрати бажану мову серед доступних варіантів на сторінці профілю.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a224dd4aaaf81381:
    english: |-
      ## Resetting your password
      You can change your password by visiting your profile page and clicking **Reset Password**.
    translation: |-
      ## Скидання пароля
      Щоб змінити пароль, відкрийте сторінку профілю та натисніть **Скинути пароль**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5bfa3cd39abcafba:
