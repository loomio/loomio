"/user_manual/threads/notifying_people/index.html" = "/en/user_manual/discussions/notifying_people/index.html"
"/user_manual/threads/navigating_threads/index.html" = "/en/user_manual/discussions/using_discussions/index.html"
"/user_manual/threads/thread_admin/index.html" = "/en/user_manual/discussions/formatting/index.html"
