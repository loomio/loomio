  cce1047bc62d8a5e:
    english: "# Intro to Groups"
    translation: "# Знакомство с группами"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  91a303d3d1fb3894:
    english: 'A Loomio group is a safe place for people to meet, have discussions and make decisions. '
    translation: Группа в Loomio — безопасное место, где люди могут встречаться, обсуждать вопросы и принимать решения.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ea5096230dfe16d4:
    english: 'It’s a container where group members can find and share information, participate in important discussions and decisions that affect their work.  '
    translation: Участники группы могут находить здесь информацию и делиться ею, участвовать в важных обсуждениях и решениях, которые влияют на их работу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  47903117cdc64e73:
    english: A Loomio group looks like this.  At the top of the page you will see an image and logo that you can tailor to represent your organization.  This allows people arriving into your group to see they have joined a place they recognize and feel welcome - a safe space where people feel at home, amongst friends and can participate effectively.
    translation: Так выглядит группа в Loomio. Вверху страницы можно разместить изображение и логотип вашей организации. По ним люди поймут, что попали в знакомое сообщество, где они могут свободно участвовать в работе группы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3d39462ab98c79e6:
    english: "![The Oatmilk Cooperative group page, with its description and discussion list](group_page.png)"
    translation: "![Страница группы «Овсяный кооператив» с описанием и списком обсуждений](group_page.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  59f3bebbce1676a6:
    english: |-
      Choose a representative name for your group and use the group description to outline;
      - **what** this group is used for,
      - **why** this is important,
      - **who** is involved, and
      - **how** members can participate.
    translation: |-
      Выберите название, которое отражает назначение вашей группы. В описании укажите:
      - **для чего** нужна группа,
      - **почему** это важно,
      - **кто** участвует в группе и
      - **как** участники могут присоединиться к работе.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  79ae54bca7eb1797:
    english: You may also include information like a code of conduct, terms of reference or other governing documents for the group.
    translation: Вы также можете добавить правила поведения, положение о группе и другие документы, определяющие её работу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '018c400616dad5f4':
    english: If you are preparing a new group, see [Introducing Loomio to your group](/en/user_manual/overview/introducing_loomio) for a practical sequence from choosing the first piece of work through to recording an outcome.
    translation: Если вы создаёте новую группу, прочитайте [как познакомить группу с Loomio](/en/user_manual/overview/introducing_loomio). Там описаны шаги от выбора первой задачи до записи итогового решения.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1bda53ca8e31780c:
    english: "## Administration, Facilitation and Moderation - Code of Conduct"
    translation: "## Администрирование, организация обсуждений и модерация — правила поведения"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1091f77d5ab879ed:
    english: 'Loomio is built to foster inclusive participation, diversity and trust - helping groups make better decisions together. '
    translation: Loomio помогает людям с разным опытом участвовать в работе группы и вместе принимать решения.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1ac058350eea2c6d:
    english: 'Some topics bring tension in a group.  So it''s important to allow a robust discussion to take place, while ensuring it is also a safe place, particularly for vulnerable people in your group. '
    translation: Некоторые темы вызывают напряжение в группе. Важно дать участникам возможность открыто обсуждать их и при этом сохранять безопасную обстановку, особенно для уязвимых участников.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  999bb2251bf623cd:
    english: 'We recommend establishing a code of conduct for your group, to help everyone be aware of their responsibility for appropriate behaviour and encourage self-regulation. '
    translation: Рекомендуем установить правила поведения в группе. Они помогут каждому понять свою ответственность и следить за собственным поведением.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9a77fa2d5f4fdb01:
    english: See the [Facilitator's Guide](/en/guides/facilitators_guide/commencing#culture-protocol-expectations) to further explore the value of a code of conduct.
    translation: Подробнее о пользе правил поведения читайте в [руководстве для ведущих обсуждений](/en/guides/facilitators_guide/commencing#culture-protocol-expectations).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
