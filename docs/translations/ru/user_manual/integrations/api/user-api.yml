---
navigation_title: Пользовательский API
blocks:
  0217b93dddc627ac:
    english: "# Loomio User API documentation"
    translation: "# Документация пользовательского API Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bc6fcbf5f783fd29:
    english: "<!-- seo-description: Use the Loomio User API to create and manage discussions, comments, polls, threads, and group memberships from other software. -->"
    translation: "<!-- seo-description: Пользовательский API Loomio позволяет создавать обсуждения, комментарии, голосования и темы, а также управлять участием в группах из других приложений. -->"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cc2da08540808ada:
    english: "`/api/b2` is the user-oriented API for integrations with Loomio. It uses the API key of a user account, and every action is performed as that user."
    translation: "`/api/b2` — пользовательский API для интеграций с Loomio. Он использует API-ключ учётной записи, и каждое действие выполняется от имени этого пользователя."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7036a6661aac00f2:
    english: Group operations use the memberships and group permissions of the API-key user. Instance-administrator status does not expand an API key's access to groups or content; use the Server API for instance-level administration.
    translation: При работе с группами действуют права и членство пользователя, которому принадлежит API-ключ. Статус администратора экземпляра не расширяет доступ API-ключа к группам и их содержимому. Для управления экземпляром используйте серверный API.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c4436493b062b9f1:
    english: Use the API key from the Loomio user account that will perform the actions. A dedicated bot account is useful when an integration should not be invited to polls or receive notifications.
    translation: Используйте API-ключ учётной записи Loomio, от имени которой будут выполняться действия. Отдельная учётная запись бота удобна, если интеграция не должна получать приглашения к голосованиям и уведомления.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ade21c593f08100c:
    english: Signed-in users can find their API key and group IDs on the [API access page](/profile/api_access).
    translation: Пользователи, вошедшие в систему, могут найти свой API-ключ и идентификаторы групп на [странице доступа к API](/profile/api_access).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  15160edafaf441c1:
    english: 'Send the API key in an `Authorization: Bearer` header. API keys in query strings are rejected because URLs can be recorded by proxies and access logs.'
    translation: 'Передавайте API-ключ в заголовке `Authorization: Bearer`. API-ключи в строке запроса отклоняются, поскольку URL могут сохраняться в журналах прокси-серверов и доступа.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2215e57186277325:
    english: "### Authentication change"
    translation: "### Изменение способа аутентификации"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ff5f4c1055e80fb6:
    english: 'The API key was previously accepted as an `api_key` URL parameter. Requests using `?api_key=YOUR_API_KEY` no longer work. Use the HTTP `Authorization` header instead:'
    translation: 'Раньше API-ключ можно было передать в параметре URL `api_key`. Запросы с `?api_key=YOUR_API_KEY` больше не работают. Используйте заголовок HTTP `Authorization`:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  65574ba500243c80:
    english: The examples use `YOUR_API_KEY`, group ID `123`, and `https://www.loomio.com/`. Replace these with your API key, group ID, and Loomio installation URL.
    translation: В примерах используются `YOUR_API_KEY`, идентификатор группы `123` и `https://www.loomio.com/`. Замените их своим API-ключом, идентификатором группы и URL вашей установки Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bec1e4f30aeef4ce:
    english: "## Response size and related records"
    translation: "## Размер ответа и связанные записи"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  da004eb4e005fae1:
    english: 'User API responses use a compound format: the primary records are accompanied by related records such as topics, groups, users, polls, and reactions. This lets a client populate a local record store from one request, but can include more data than a simple integration needs.'
    translation: 'Ответы пользовательского API имеют составной формат: вместе с основными записями возвращаются связанные записи, например темы, группы, пользователи, голосования и реакции. Это позволяет клиенту заполнить локальное хранилище записей одним запросом, но объём данных может быть больше, чем требуется простой интеграции.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  64d9a631b54cbaba:
    english: Pass `compact=1` to omit bulky related topics, groups, parent groups, memberships, reactions, tags, and translations. Primary records and the related records needed to interpret their content remain present.
    translation: Передайте `compact=1`, чтобы исключить объёмные связанные записи о темах, группах, родительских группах, участии в группах, реакциях, тегах и переводах. Основные записи и связанные записи, необходимые для понимания их содержимого, останутся в ответе.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e4e671db39dbe6f1:
    english: For direct control, pass `exclude_types` with space-separated singular record types. For example, `exclude_types=group reaction` omits related groups and reactions. Common values are `topic`, `group`, `parent`, `membership`, `reaction`, `tag`, `translation`, `user`, `discussion`, `poll`, `poll_option`, `stance`, `stance_choice`, `outcome`, and `topic_item`. Exclusions apply to related records, not the primary resource requested by the endpoint.
    translation: 'Для точного выбора исключений передайте в `exclude_types` типы записей в единственном числе, разделённые пробелами. Например, `exclude_types=group reaction` исключает связанные группы и реакции. Распространённые значения: `topic`, `group`, `parent`, `membership`, `reaction`, `tag`, `translation`, `user`, `discussion`, `poll`, `poll_option`, `stance`, `stance_choice`, `outcome` и `topic_item`. Исключения относятся к связанным записям, а не к основному ресурсу, запрошенному через конечную точку.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ded075da3c2aa815:
    english: Collection responses include `meta.total` when an exact collection size is defined. The total is calculated before `limit` and `offset` are applied. Endpoints such as search that intentionally return a bounded result set omit `meta.total` rather than returning `null`.
    translation: Ответы с коллекциями содержат `meta.total`, когда определён точный размер коллекции. Общее число рассчитывается до применения `limit` и `offset`. Конечные точки, которые намеренно возвращают ограниченный набор результатов, например поиск, не включают `meta.total` вместо значения `null`.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  17cb8ef90a2acdb3:
    english: "## Endpoint summary"
    translation: "## Обзор конечных точек"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  608edb13080e57c2:
    english: |-
      | Method | Endpoint | Purpose |
      | --- | --- | --- |
      | `GET` | `/api/b2/groups` | List the API-key user's groups |
      | `GET` | `/api/b2/groups/:id_or_key_or_handle` | Get a visible group |
      | `GET` | `/api/b2/reports` | Generate a participation report |
      | `GET` | `/api/b2/search` | Search visible discussions, comments, polls, votes, and outcomes |
      | `POST` | `/api/b2/discussions` | Create a discussion |
      | `GET` | `/api/b2/discussions/:id` | Get a discussion |
      | `GET` | `/api/b2/discussions` | List discussions in a group |
      | `PATCH` | `/api/b2/discussions/:id` | Edit a discussion |
      | `DELETE` | `/api/b2/discussions/:id` | Soft-delete a discussion |
      | `GET` | `/api/b2/threads` | List visible discussion and standalone-poll threads |
      | `GET` | `/api/b2/threads/:topic_id` | Get a thread |
      | `GET` | `/api/b2/threads/:topic_id/items` | Get the ordered items in a thread |
      | `GET` | `/api/b2/threads/:topic_id/markdown` | Get a complete thread as Markdown |
      | `POST` | `/api/b2/comments` | Create a comment or reply |
      | `PATCH` | `/api/b2/comments/:id` | Edit a comment |
      | `DELETE` | `/api/b2/comments/:id` | Soft-delete a comment |
      | `POST` | `/api/b2/polls` | Create a poll |
      | `GET` | `/api/b2/polls/:id` | Get a poll |
      | `GET` | `/api/b2/polls` | List polls in a group |
      | `PATCH` | `/api/b2/polls/:id` | Edit a poll |
      | `DELETE` | `/api/b2/polls/:id` | Soft-delete a poll |
      | `GET` | `/api/b2/memberships` | List a group's memberships |
      | `POST` | `/api/b2/memberships` | Add members and optionally remove absent members |
      | `GET` | `/api/b2/chatbots` | List a group's chat integrations and webhooks |
      | `POST` | `/api/b2/chatbots` | Create a chat integration or webhook |
      | `PATCH` | `/api/b2/chatbots/:id` | Update a chat integration or webhook |
      | `DELETE` | `/api/b2/chatbots/:id` | Delete a chat integration or webhook |
      | `POST` | `/api/b2/chatbots/check` | Send a webhook connection test |
    translation: |-
      | Метод | Конечная точка | Назначение |
      | --- | --- | --- |
      | `GET` | `/api/b2/groups` | Получить список групп пользователя, которому принадлежит API-ключ |
      | `GET` | `/api/b2/groups/:id_or_key_or_handle` | Получить доступную группу |
      | `GET` | `/api/b2/reports` | Сформировать отчёт об участии |
      | `GET` | `/api/b2/search` | Найти доступные обсуждения, комментарии, голосования, голоса и заключения |
      | `POST` | `/api/b2/discussions` | Создать обсуждение |
      | `GET` | `/api/b2/discussions/:id` | Получить обсуждение |
      | `GET` | `/api/b2/discussions` | Получить список обсуждений в группе |
      | `PATCH` | `/api/b2/discussions/:id` | Изменить обсуждение |
      | `DELETE` | `/api/b2/discussions/:id` | Пометить обсуждение как удалённое |
      | `GET` | `/api/b2/threads` | Получить список доступных тем обсуждений и отдельных голосований |
      | `GET` | `/api/b2/threads/:topic_id` | Получить тему |
      | `GET` | `/api/b2/threads/:topic_id/items` | Получить элементы темы по порядку |
      | `GET` | `/api/b2/threads/:topic_id/markdown` | Получить всю тему в формате Markdown |
      | `POST` | `/api/b2/comments` | Создать комментарий или ответ |
      | `PATCH` | `/api/b2/comments/:id` | Изменить комментарий |
      | `DELETE` | `/api/b2/comments/:id` | Пометить комментарий как удалённый |
      | `POST` | `/api/b2/polls` | Создать голосование |
      | `GET` | `/api/b2/polls/:id` | Получить голосование |
      | `GET` | `/api/b2/polls` | Получить список голосований в группе |
      | `PATCH` | `/api/b2/polls/:id` | Изменить голосование |
      | `DELETE` | `/api/b2/polls/:id` | Пометить голосование как удалённое |
      | `GET` | `/api/b2/memberships` | Получить список участников группы |
      | `POST` | `/api/b2/memberships` | Добавить участников и при необходимости удалить тех, кого нет в списке |
      | `GET` | `/api/b2/chatbots` | Получить список интеграций чата и вебхуков группы |
      | `POST` | `/api/b2/chatbots` | Создать интеграцию чата или вебхук |
      | `PATCH` | `/api/b2/chatbots/:id` | Обновить интеграцию чата или вебхук |
      | `DELETE` | `/api/b2/chatbots/:id` | Удалить интеграцию чата или вебхук |
      | `POST` | `/api/b2/chatbots/check` | Отправить тестовое сообщение для проверки соединения с вебхуком |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0473f1f7fb78f074:
    english: "## Groups"
    translation: "## Группы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dc819221f371c435:
    english: "### List groups"
    translation: "### Список групп"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  964f575e90aa9cde:
    english: Return the groups in which the API-key user has an active membership.
    translation: Возвращает группы, в которых пользователь, которому принадлежит API-ключ, является действующим участником.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3835e6e77bc0ad10:
    english: "`GET /api/b2/groups`"
    translation: "`GET /api/b2/groups`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4f588e981afc3069:
    english: The response contains all matching records in a non-paginated `groups` array. It includes parent groups and subgroups, including groups whose subscription is not currently active. Check the `enabled` field when an integration should operate only on enabled groups.
    translation: Ответ содержит все подходящие записи в массиве `groups` без разбивки на страницы. В него входят родительские группы и подгруппы, в том числе группы, чья подписка сейчас неактивна. Если интеграция должна работать только с активными группами, проверяйте поле `enabled`.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  213de8ce539a42c3:
    english: 'Important group fields include:'
    translation: 'Важные поля группы:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d377f7c9b224a6d7:
    english: |-
      | Field | Description |
      | --- | --- |
      | `id` | Numeric group ID used by other User API endpoints |
      | `key` | Stable short key used in Loomio URLs |
      | `handle` | Human-readable group handle |
      | `name` | Group name |
      | `full_name` | Group name including its parent-group context |
      | `parent_id` | Numeric parent-group ID for a subgroup, otherwise `null` |
      | `enabled` | Whether the group and its subscription are active |
      | `memberships_count` | Number of active and pending memberships |
      | `accepted_memberships_count` | Number of accepted memberships |
      | `pending_memberships_count` | Number of pending invitations |
      | `admin_memberships_count` | Number of group administrators |
      | `delegates_count` | Number of delegates |
      | `discussions_count` | Number of discussions directly in the group |
      | `polls_count` | Number of polls directly in the group |
      | `subgroups_count` | Number of subgroups |
    translation: |-
      | Поле | Описание |
      | --- | --- |
      | `id` | Числовой идентификатор группы, используемый другими конечными точками пользовательского API |
      | `key` | Постоянный короткий ключ, используемый в URL Loomio |
      | `handle` | Читаемый идентификатор группы |
      | `name` | Название группы |
      | `full_name` | Название группы с указанием родительской группы |
      | `parent_id` | Числовой идентификатор родительской группы для подгруппы, иначе `null` |
      | `enabled` | Активны ли группа и её подписка |
      | `memberships_count` | Число действующих участников и ожидающих вступления |
      | `accepted_memberships_count` | Число подтверждённых участников |
      | `pending_memberships_count` | Число приглашений, ожидающих ответа |
      | `admin_memberships_count` | Число администраторов группы |
      | `delegates_count` | Число делегатов |
      | `discussions_count` | Число обсуждений непосредственно в группе |
      | `polls_count` | Число голосований непосредственно в группе |
      | `subgroups_count` | Число подгрупп |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  34f1693ba28fcb80:
    english: The response may include additional group settings, related parent-group records and the API user's memberships. Clients should ignore fields they do not use.
    translation: Ответ также может содержать дополнительные настройки группы, связанные записи родительской группы и сведения об участии пользователя API в группах. Клиентам следует игнорировать поля, которые они не используют.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d7c327b8ed7f7bf2:
    english: "### Get a group"
    translation: "### Получение группы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  15ab63bc2d396657:
    english: Return one group visible to the API-key user.
    translation: Возвращает одну группу, доступную пользователю, которому принадлежит API-ключ.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8ba2cc9e3c67b1dd:
    english: "`GET /api/b2/groups/:id_or_key_or_handle`"
    translation: "`GET /api/b2/groups/:id_or_key_or_handle`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  71e5812ff9890c9b:
    english: The identifier can be the group's numeric ID, key or handle.
    translation: В качестве идентификатора можно указать числовой ID, ключ или читаемый идентификатор группы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8ba79a283b7b77d5:
    english: The response contains the group in the `groups` array and uses the same fields as the list endpoint. A request for a group the API-key user cannot access returns a permission error.
    translation: Ответ содержит группу в массиве `groups` с теми же полями, что и конечная точка для получения списка. Если у пользователя, которому принадлежит API-ключ, нет доступа к группе, запрос вернёт ошибку доступа.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  18d823df4d7f8fac:
    english: "## Webhooks"
    translation: "## Вебхуки"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f33d58fc1f2fd84c:
    english: 'The User API is request-based: an integration calls Loomio when it wants to read or change data. A group webhook provides the push direction. Loomio sends selected group events to your endpoint as they happen, so an integration does not need to poll the REST API for changes.'
    translation: 'Пользовательский API работает по запросу: интеграция обращается к Loomio, когда ей нужно прочитать или изменить данные. Вебхук группы работает в обратном направлении. Loomio отправляет выбранные события группы на вашу конечную точку по мере их возникновения, поэтому интеграции не нужно регулярно опрашивать REST API.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3b5b4b0ac52b9010:
    english: 'Webhooks are configured per group and require group-administrator permission. They can be managed through the Loomio interface:'
    translation: 'Вебхуки настраиваются отдельно для каждой группы. Для этого нужны права администратора группы. Управлять ими можно через интерфейс Loomio:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  318710be7b3aae7d:
    english: |-
      1. Open the group.
      2. Open the group menu and select **Chat integrations**.
      3. Add the integration matching the payload format your endpoint accepts. For a general-purpose endpoint, use the Mattermost/Markdown format.
      4. Enter a name and the destination URL.
      5. Select the events that Loomio should send automatically.
      6. Save the integration and use **Test connection** to send a test message.
    translation: |-
      1. Откройте группу.
      2. Откройте меню группы и выберите **Интеграция чата**.
      3. Добавьте интеграцию с форматом данных, который принимает ваша конечная точка. Для конечной точки общего назначения используйте формат Mattermost/Markdown.
      4. Введите название и URL назначения.
      5. Выберите события, которые Loomio должна отправлять автоматически.
      6. Сохраните интеграцию и нажмите **Тестовое соединение**, чтобы отправить тестовое сообщение.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  43fb95cf304fced6:
    english: Use an HTTPS destination with an unguessable URL. Loomio requires the destination to resolve to a public address and blocks requests to local or private network addresses.
    translation: Используйте HTTPS-адрес назначения с URL, который трудно угадать. Loomio требует, чтобы адрес назначения был публичным, и блокирует запросы к локальным или частным сетевым адресам.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d8d5abffe6425bea:
    english: Agents and other integrations can instead manage webhooks through the Bearer-authenticated chatbot endpoints described below. The resource is named `chatbots` for compatibility with Loomio's chat integrations, but it also represents general outgoing webhooks.
    translation: Агенты и другие интеграции также могут управлять вебхуками через описанные ниже эндпоинты чат-интеграций с авторизацией Bearer. Ресурс называется `chatbots` для совместимости с чат-интеграциями Loomio, но также используется для обычных исходящих вебхуков.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  28fb6371af33b66f:
    english: "### List webhooks"
    translation: "### Список вебхуков"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7187e5a26c3ec864:
    english: Return the chat integrations configured for a group. The API-key user must be an administrator of that group. The response includes destination URLs, so it must not be exposed to ordinary group members.
    translation: Возвращает интеграции чата, настроенные для группы. Пользователь, которому принадлежит API-ключ, должен быть администратором этой группы. Ответ содержит URL назначения, поэтому его нельзя показывать обычным участникам группы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  788d370538bdda46:
    english: "`GET /api/b2/chatbots?group_id=123`"
    translation: "`GET /api/b2/chatbots?group_id=123`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d676ca45c3e1074a:
    english: 'The response contains a `chatbots` array with these fields:'
    translation: 'Ответ содержит массив `chatbots` со следующими полями:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ca00f7d0a52ce803:
    english: |-
      | Field | Description |
      | --- | --- |
      | `id` | Integration ID used for updates and deletion |
      | `group_id` | Group receiving the events |
      | `name` | Administrative name for the integration |
      | `kind` | `webhook` for an outgoing webhook or `matrix` for a Matrix integration |
      | `webhook_kind` | Payload format: `markdown`, `slack`, `discord`, `microsoft`, or `webex` |
      | `server` | Destination URL |
      | `event_kinds` | Events sent automatically |
      | `notification_only` | Whether messages contain only the notification headline |
    translation: |-
      | Поле | Описание |
      | --- | --- |
      | `id` | ID интеграции для обновления и удаления |
      | `group_id` | Группа, в которой происходят события |
      | `name` | Название интеграции для администраторов |
      | `kind` | `webhook` для исходящего вебхука или `matrix` для интеграции с Matrix |
      | `webhook_kind` | Формат данных: `markdown`, `slack`, `discord`, `microsoft` или `webex` |
      | `server` | URL назначения |
      | `event_kinds` | События, отправляемые автоматически |
      | `notification_only` | Содержат ли сообщения только заголовок уведомления |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d72d8237eded6fdd:
    english: "### Create a webhook"
    translation: "### Создать вебхук"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e33c05cb2770fe21:
    english: "`POST /api/b2/chatbots`"
    translation: "`POST /api/b2/chatbots`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  acee55f2470a1eef:
    english: The API-key user must be an administrator of `group_id`. The destination is validated as a public URL before it is saved.
    translation: Владелец ключа API должен быть администратором группы `group_id`. Перед сохранением проверяется, что URL назначения общедоступен.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  05d9e1cdc6185f85:
    english: "### Update a webhook"
    translation: "### Обновить вебхук"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  eb7a96b45abe57c2:
    english: "`PATCH /api/b2/chatbots/:id`"
    translation: "`PATCH /api/b2/chatbots/:id`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2696d4fd91cd5f6f:
    english: Send any fields that should change. The webhook cannot be transferred to another group by changing `group_id`.
    translation: Передайте поля, которые нужно изменить. Изменение `group_id` не позволяет перенести вебхук в другую группу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e56bb884ce5ef3c5:
    english: "### Test a webhook destination"
    translation: "### Проверить адрес назначения вебхука"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  10c1e636b20121c2:
    english: Send a Markdown-compatible test message to a destination before or after saving its configuration.
    translation: Отправьте тестовое сообщение в формате Markdown на адрес назначения до или после сохранения настроек.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cf0e0fae3c68178d:
    english: "`POST /api/b2/chatbots/check`"
    translation: "`POST /api/b2/chatbots/check`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fcb55f73325b9f2a:
    english: "### Delete a webhook"
    translation: "### Удалить вебхук"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f7e12256467f6c49:
    english: "`DELETE /api/b2/chatbots/:id`"
    translation: "`DELETE /api/b2/chatbots/:id`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f158f3939e36074c:
    english: Deleting the configuration stops future deliveries. It does not delete any Loomio group content.
    translation: После удаления настроек новые сообщения доставляться не будут. Содержимое группы Loomio сохранится.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f0fe37689a7c3646:
    english: "### Event types"
    translation: "### Типы событий"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  066ca1423e999efa:
    english: 'A webhook can subscribe to these event types:'
    translation: 'Вебхук может получать события следующих типов:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  82962625b0583140:
    english: |-
      | Event | When it is sent |
      | --- | --- |
      | `new_discussion` | A discussion is started |
      | `discussion_edited` | A discussion is edited |
      | `new_comment` | A comment is created |
      | `poll_created` | A poll is started |
      | `poll_edited` | A poll is edited |
      | `poll_closing_soon` | A poll is approaching its closing time |
      | `poll_expired` | A poll reaches its closing time |
      | `poll_closed_by_user` | A person closes a poll manually |
      | `poll_reopened` | A poll is reopened |
      | `outcome_created` | An outcome is published |
      | `outcome_updated` | An outcome is updated |
      | `outcome_review_due` | An outcome review becomes due |
      | `stance_created` | A vote is cast |
      | `stance_updated` | A vote is changed |
    translation: |-
      | Событие | Когда отправляется |
      | --- | --- |
      | `new_discussion` | Начато обсуждение |
      | `discussion_edited` | Обсуждение изменено |
      | `new_comment` | Создан комментарий |
      | `poll_created` | Начат опрос |
      | `poll_edited` | Опрос изменён |
      | `poll_closing_soon` | Скоро закончится срок голосования |
      | `poll_expired` | Закончился срок голосования |
      | `poll_closed_by_user` | Пользователь закрыл опрос вручную |
      | `poll_reopened` | Опрос открыт повторно |
      | `outcome_created` | Опубликовано заключение |
      | `outcome_updated` | Заключение обновлено |
      | `outcome_review_due` | Наступил срок пересмотра заключения |
      | `stance_created` | Подан голос |
      | `stance_updated` | Голос изменён |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ed1d3fc4a6fb67b9:
    english: The webhook belongs to one group and receives subscribed events from that group. People can also explicitly select the integration when sharing or sending some notifications, even when the corresponding automatic event is not selected.
    translation: Вебхук относится к одной группе и получает выбранные события из неё. Пользователи также могут выбрать интеграцию при публикации или отправке некоторых уведомлений, даже если соответствующее автоматическое событие не выбрано.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  512f0701765b66ec:
    english: "### HTTP delivery"
    translation: "### Доставка по HTTP"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dca082a687dc5505:
    english: 'Loomio sends an asynchronous HTTP `POST` to the configured URL with this header:'
    translation: 'Loomio отправляет асинхронный HTTP-запрос `POST` на настроенный URL со следующим заголовком:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a4f66c4c94afa135:
    english: The request timeout is five seconds. A `2xx` response, including `204 No Content`, is treated as successful. Webhook consumers should respond promptly, process longer work asynchronously, and tolerate duplicate or out-of-order deliveries.
    translation: Время ожидания ответа — пять секунд. Ответ `2xx`, включая `204 No Content`, считается успешным. Получателям вебхуков следует быстро отвечать на запросы, выполнять длительные задачи асинхронно и учитывать возможность повторной доставки или доставки не по порядку.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  84faa7dad6f34739:
    english: Loomio does not currently add a webhook signature, shared-secret header, event ID, or delivery ID. Treat the full destination URL as a credential, do not expose it publicly, and include an unguessable token in the URL when the receiving service supports one. If a stable machine-readable event schema or signed delivery is required, use the webhook as a change notification and retrieve the current records through the authenticated User API.
    translation: Сейчас Loomio не добавляет подпись вебхука, заголовок с общим секретом, ID события или ID доставки. Считайте полный URL назначения секретом и не публикуйте его. Если принимающий сервис поддерживает такую возможность, добавьте в URL токен, который невозможно угадать. Если вам нужна стабильная машиночитаемая схема событий или доставка с подписью, используйте вебхук как уведомление об изменении, а актуальные записи получайте через Пользовательский API с аутентификацией.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f3d956b4694f793c:
    english: "### Payload formats"
    translation: "### Форматы данных"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  deed1ccba8a70ac2:
    english: Webhook payloads are presentation-oriented messages intended for chat services. They are not complete serialized Loomio records. Links in the message identify the affected Loomio content; an integration can follow up through the User API when it needs structured current state.
    translation: Данные вебхуков предназначены для отображения сообщений в чат-сервисах. Они не содержат полные записи Loomio. Ссылки в сообщении указывают на соответствующее содержимое Loomio. Если интеграции нужны структурированные актуальные данные, она может запросить их через Пользовательский API.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c2e9782a81b59ab2:
    english: |-
      | Integration format | Principal JSON fields |
      | --- | --- |
      | Mattermost/Markdown | `text`, `icon_url`, `username` |
      | Slack | `text` |
      | Discord | `content`, limited to approximately 1,900 characters |
      | Microsoft Teams | `@type`, `@context`, `themeColor`, `text`, `sections` |
      | Webex | `markdown` |
    translation: |-
      | Формат интеграции | Основные поля JSON |
      | --- | --- |
      | Mattermost/Markdown | `text`, `icon_url`, `username` |
      | Slack | `text` |
      | Discord | `content`, не более примерно 1 900 символов |
      | Microsoft Teams | `@type`, `@context`, `themeColor`, `text`, `sections` |
      | Webex | `markdown` |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  132dd698f11d1d08:
    english: 'For example, the general Markdown format sends a body shaped like:'
    translation: 'Например, сообщение в общем формате Markdown имеет следующую структуру:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d224ca01f360918e:
    english: The exact message text depends on the event, group locale, notification-only setting, and Loomio version. Consumers should rely on the selected format's documented top-level fields rather than parsing sentence wording.
    translation: Точный текст сообщения зависит от события, языка группы, настройки отправки только заголовка уведомления и версии Loomio. Используйте документированные поля верхнего уровня выбранного формата. Не разбирайте текст сообщения по словам.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  62c53ea4911e0c79:
    english: "## Search"
    translation: "## Поиск"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f7346561ccdfcfce:
    english: Search discussions, comments, polls, votes, and outcomes visible to the API-key user. Results include public content even when the user is not a member of its group; private content remains subject to normal topic visibility.
    translation: Ищите обсуждения, комментарии, опросы, голоса и заключения, доступные владельцу ключа API. В результаты входит общедоступное содержимое, даже если пользователь не состоит в группе. Доступ к закрытому содержимому определяется обычными правилами видимости темы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e9101cf4a72bde36:
    english: "`GET /api/b2/search`"
    translation: "`GET /api/b2/search`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9bc24da4bd85dac2:
    english: "### Params"
    translation: "### Параметры"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ac9bc86d81bfd39f:
    english: |-
      | Name | Description |
      | --- | --- |
      | `query` | Search text. Exact and fuzzy matches are supported |
      | `group_id` | Restrict results to one visible group |
      | `org_id` | Restrict results to a visible parent group and its visible subgroups. Use `0` for direct discussions |
      | `type` | Restrict results to one type: `Discussion`, `Comment`, `Poll`, `Stance`, or `Outcome` |
      | `types` | Comma-separated list of result types |
      | `tag` | Restrict results to topics with this tag |
      | `author_id` | Restrict results to content by one author. Without `query`, returns that author's recent visible activity |
      | `order` | Set to `authored_at_desc` to order matching content by authoring time |
    translation: |-
      | Название | Описание |
      | --- | --- |
      | `query` | Поисковый текст. Поддерживаются точные и приблизительные совпадения |
      | `group_id` | Ограничить результаты одной доступной группой |
      | `org_id` | Ограничить результаты доступной родительской группой и её доступными подгруппами. Для прямых обсуждений используйте `0` |
      | `type` | Ограничить результаты одним типом: `Discussion`, `Comment`, `Poll`, `Stance` или `Outcome` |
      | `types` | Список типов результатов через запятую |
      | `tag` | Ограничить результаты темами с этим тегом |
      | `author_id` | Ограничить результаты содержимым одного автора. Без `query` возвращается его недавняя доступная активность |
      | `order` | Укажите `authored_at_desc`, чтобы упорядочить совпадения по времени публикации |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  00e046b622446633:
    english: The response contains a `search_results` array. Each result identifies the matched record and its visible context with fields including `searchable_type`, `searchable_id`, `highlight`, `group_id`, `group_name`, `discussion_key`, `poll_key`, `author_id`, `author_name`, `authored_at`, and `tags`. Fields that do not apply to a result are `null`.
    translation: Ответ содержит массив `search_results`. Каждая запись указывает найденный объект и его доступный контекст. Среди полей — `searchable_type`, `searchable_id`, `highlight`, `group_id`, `group_name`, `discussion_key`, `poll_key`, `author_id`, `author_name`, `authored_at` и `tags`. Поля, которые не относятся к результату, имеют значение `null`.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f90d2c11582b8bfa:
    english: "## Participation report"
    translation: "## Отчёт об участии"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0fbe24cde7a5e1aa:
    english: Return the same aggregated participation data used by Loomio's Participation report.
    translation: Возвращает те же сводные данные об активности, что и отчёт Loomio об участии.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0f176aa4823b4ece:
    english: "`GET /api/b2/reports`"
    translation: "`GET /api/b2/reports`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fc4488304bf3735e:
    english: |-
      | Name | Description |
      | --- | --- |
      | `section` | Report section: `base`, `users`, or `countries`. Use `users` for per-person activity |
      | `group_scope` | `custom` or `my`. The legacy `all` value is treated as `my` because User API keys never receive instance-wide access |
      | `group_ids` | Comma-separated group IDs when `group_scope=custom`. IDs outside the API user's memberships are ignored |
      | `start_month` | First month to include in `YYYY-MM` format; defaults to 12 months ago |
      | `end_month` | Last month to include in `YYYY-MM` format; defaults to the current month |
      | `interval` | Interval for the `base` section: `day`, `week`, `month`, or `year` |
      | `member_type` | Set to `delegate` with `section=users` to return only current delegates |
    translation: |-
      | Название | Описание |
      | --- | --- |
      | `section` | Раздел отчёта: `base`, `users` или `countries`. Для активности отдельных пользователей укажите `users` |
      | `group_scope` | `custom` или `my`. Устаревшее значение `all` обрабатывается как `my`, поскольку ключи Пользовательского API не дают доступ ко всему экземпляру Loomio |
      | `group_ids` | ID групп через запятую при `group_scope=custom`. ID групп, в которых владелец ключа API не состоит, игнорируются |
      | `start_month` | Первый месяц периода в формате `YYYY-MM`. По умолчанию — месяц 12 месяцев назад |
      | `end_month` | Последний месяц периода в формате `YYYY-MM`. По умолчанию — текущий месяц |
      | `interval` | Интервал для раздела `base`: `day`, `week`, `month` или `year` |
      | `member_type` | Укажите `delegate` вместе с `section=users`, чтобы получить данные только действующих делегатов |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '09b3d2247802eae7':
    english: A person is a delegate when they have an active delegate membership in any selected group. Their counts are aggregated across all selected groups. Delegate rows are returned even when every activity count is zero. Counts cover threads, comments, polls, votes, outcomes, and reactions; they are not voting participation rates. User rows also include identified ballots issued, cast, and missed. Anonymous polls are excluded from all per-person voting counts. `all_votes_cast` is true only when at least one ballot was issued and every issued ballot was cast.
    translation: Пользователь считается делегатом, если он является действующим делегатом хотя бы в одной выбранной группе. Его показатели суммируются по всем выбранным группам. Данные делегата возвращаются, даже если все показатели активности равны нулю. Они охватывают темы, комментарии, опросы, голоса, заключения и реакции; это не показатели участия в голосовании. Данные пользователей также содержат число назначенных, поданных и пропущенных бюллетеней в открытых голосованиях. Анонимные опросы исключаются из всех показателей голосования отдельных пользователей. Значение `all_votes_cast` равно true, только если был назначен хотя бы один бюллетень и все назначенные бюллетени были поданы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  be9b5cd02a9b5930:
    english: The API applies the same group visibility rules as the in-product report. A user API key cannot expose report data from groups that user cannot access.
    translation: API применяет те же правила видимости групп, что и отчёт в Loomio. Ключ Пользовательского API не позволяет получить данные отчёта по группам, к которым у его владельца нет доступа.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
