---
navigation_title: Invita a votare
blocks:
  0635cf23fcaaa95b:
    english: "# Invite to vote"
    translation: "# Invita a votare"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2ae3991d9865a2bb:
    english: "## Invite people to vote in a poll"
    translation: "## Invita le persone a votare in un sondaggio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  56d96764605291b4:
    english: Invite people to your poll by sending them a notification.
    translation: Invita le persone al tuo sondaggio inviando loro una notifica.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3632ef534c8c03f7:
    english: After you start a poll, the **Invite to vote** box appears. Select an audience such as **Everyone in the thread** or your group, or enter individual names and email addresses.
    translation: Dopo aver avviato un sondaggio, compare il riquadro **Invita a votare**. Seleziona un gruppo di destinatari, per esempio **Tutti nel filo** o il tuo gruppo, oppure inserisci nomi e indirizzi email individuali.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  835f178f0b52f3b6:
    english: You can include an optional message with the invitation.
    translation: Puoi aggiungere un messaggio all'invito.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  78da00061d5815a4:
    english: Select a group chip to expand it into the people you are inviting. Select the x beside a name to remove that person from the invitation.
    translation: Seleziona l'etichetta di un gruppo per vedere le persone che stai invitando. Seleziona la x accanto a un nome per rimuovere quella persona dall'invito.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e6969f4c4b62b6ff:
    english: "### Invite guests or experts"
    translation: "### Invita ospiti o esperti"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9bb72d11863e1f46:
    english: You can also invite a guest to the poll by entering their email address. They will be given permission to participate in only this poll.
    translation: Puoi invitare anche un ospite al sondaggio inserendo il suo indirizzo email. Potrà partecipare solo a questo sondaggio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dd20b166a40eb798:
    english: If the poll is within a thread, they will also be able to see that thread and its comments. They will not be able to comment, participate in other polls in the thread, or see other threads in the group.
    translation: Se il sondaggio si trova in un filo, potrà vedere anche il filo e i suoi commenti. Non potrà commentare, partecipare ad altri sondaggi nel filo o vedere altri fili del gruppo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  84cc8773a5337094:
    english: "### Invite a subgroup to vote"
    translation: "### Invita un sottogruppo a votare"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  80ca3c8c753b0ebb:
    english: To limit voting to invited people, select **Selected people only** when you create the poll. You can then invite a subgroup from the parent group. See also [Delegated voters](/en/user_manual/groups/delegated_voters/).
    translation: Per limitare il voto alle persone invitate, seleziona **Solo persone selezionate** quando crei il sondaggio. Potrai quindi invitare un sottogruppo del gruppo principale. Vedi anche [Elettori delegati](/en/user_manual/groups/delegated_voters/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2074aff770fa7610:
    english: |-
      ![Selecting invited people only](invited-people-only.png)
      ![Inviting a subgroup to vote](invite-voters-subgroup.png)
    translation: |-
      ![Selezione di Solo persone selezionate](invited-people-only.png)
      ![Invito a votare per un sottogruppo](invite-voters-subgroup.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  29103b18580994a1:
    english: "## Engage people while a poll is running"
    translation: "## Coinvolgi le persone mentre il sondaggio è aperto"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1ce57a2542eebaab:
    english: At the bottom of the poll are several features to help you engage with people once the poll is running.
    translation: In fondo al sondaggio trovi diverse funzioni per coinvolgere le persone mentre la votazione è aperta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  45090f8260d19a47:
    english: "### Add voters to the poll"
    translation: "### Aggiungi elettori al sondaggio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3116212829910b50:
    english: You can add new people to the poll at any time, including before voting opens on a scheduled poll.
    translation: Puoi aggiungere persone al sondaggio in qualsiasi momento, anche prima dell'apertura delle votazioni per un sondaggio programmato.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5e851e072e9dc1de:
    english: Select **Add voters**, then enter the names or email addresses of the people you want to add.
    translation: Seleziona **Aggiungi elettori**, poi inserisci i nomi o gli indirizzi email delle persone che vuoi aggiungere.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  be5aceb4caf93c11:
    english: If the poll has a scheduled opening time and voting has not yet opened, voters will not receive an immediate notification. Instead, they will be notified when voting opens.
    translation: Se il sondaggio ha un orario di apertura programmato e le votazioni non sono ancora iniziate, gli elettori non riceveranno subito una notifica. La riceveranno all'apertura delle votazioni.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b9a08269e3e252ce:
    english: "### Remove people from the poll"
    translation: "### Rimuovi persone dal sondaggio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ce37b0af98854c79:
    english: Select **Add voters**, find the person's name, open the three-dot menu beside it, and select **Remove from proposal**.
    translation: Seleziona **Aggiungi elettori**, trova il nome della persona, apri il menu con i tre puntini accanto al nome e seleziona **Rimuovi dalla proposta**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '08df94a4269ad100':
    english: People cannot be removed from an anonymous poll.
    translation: Non puoi rimuovere persone da un sondaggio anonimo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3d13453394c79f30:
    english: For example, an administrator who creates a poll on behalf of board members can remove themself if they are not authorised to vote.
    translation: Per esempio, chi amministra un gruppo e crea un sondaggio per i membri del consiglio può rimuovere il proprio nome se non ha diritto di voto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2a354792a1f1f517:
    english: "### Remind people to vote"
    translation: "### Ricorda alle persone di votare"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  501e7846380326fd:
    english: Select **Remind** to send a notification to people who have not voted. **Everyone invited to vote** is selected by default. Select the chip to see or change the recipients.
    translation: Seleziona **Ricorda** per inviare una notifica alle persone che non hanno votato. L'opzione **Tutti invitati a votare** è selezionata per impostazione predefinita. Seleziona l'etichetta per vedere o modificare i destinatari.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  04e4537024da788c:
    english: "### View notification history"
    translation: "### Visualizza la cronologia delle notifiche"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  46145a9dd950c8eb:
    english: Open the three-dot menu (**⋯**) at the bottom of the poll and select **Notification history**.
    translation: Apri il menu con i tre puntini (**⋯**) in fondo al sondaggio e seleziona **Cronologia delle notifiche**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e74eafb1566d5dea:
    english: "![Notification history in a poll's actions menu](../../discussions/notifying_people/poll_notification_history.png)"
    translation: "![Cronologia delle notifiche nel menu delle azioni di un sondaggio](../../discussions/notifying_people/poll_notification_history.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1a96cd0121fe58ec:
    english: The history shows who has been invited to vote, when each invitation was sent, and whether it has been read when that information is available.
    translation: La cronologia mostra chi è stato invitato a votare, quando è stato inviato ogni invito e, se l'informazione è disponibile, se è stato letto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3bd9a11263e1c8f4:
    english: "![Notification history for a poll](../../discussions/notifying_people/poll_notification_example.png)"
    translation: "![Cronologia delle notifiche di un sondaggio](../../discussions/notifying_people/poll_notification_example.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f3bbc883f6429276:
    english: "### Close early"
    translation: "### Chiudi in anticipo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  af6a9acaafaaa96a:
    english: Select **Close early** to close a poll before its scheduled closing time.
    translation: Seleziona **Chiudi in anticipo** per chiudere un sondaggio prima della scadenza prevista.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3cdbb11687fa03c0:
    english: You might do this when everyone has voted or the poll no longer needs to remain open.
    translation: Puoi farlo quando tutti hanno votato o non è più necessario lasciare aperto il sondaggio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  46f3a0ec8da6dba1:
    english: "### Reopen"
    translation: "### Riapri"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '0821c04199937236':
    english: Select **Reopen** on a closed poll, then set a new closing date and time.
    translation: Seleziona **Riapri** in un sondaggio chiuso, poi imposta una nuova data e ora di chiusura.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  53079cadd493f27c:
    english: Anonymous polls cannot be reopened.
    translation: I sondaggi anonimi non possono essere riaperti.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
