    english: Group settings control how your group is presented, who can find and join it, and what members are allowed to do. Only group administrators can edit these settings.
    translation: La configuración del grupo determina cómo se presenta tu grupo, quién puede encontrarlo y unirse a él, y qué pueden hacer sus integrantes. Solo quienes administran el grupo pueden cambiar esta configuración.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  306f2b79029e2196:
    english: On the group page, open the actions menu and select **Edit group settings**.
    translation: En la página del grupo, abre el menú de acciones y selecciona **Editar la configuración del grupo**.
