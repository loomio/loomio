  b08a2d6a44f0d7ac:
    english: The best way to learn about Loomio is to [start a free trial](/try)
    translation: La mejor forma de conocer Loomio es [iniciar una prueba gratuita](/try)
    status: machine
    provider: codex/gpt-6-sol
