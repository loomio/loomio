  e3a50952a2ce6cfc:
    english: "# Merge accounts"
    translation: "# Yhdistä tilit"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e0bdfaac5741d310:
    english: Merge two Loomio accounts when each account uses a different email address and you want to continue with one account.
    translation: Yhdistä kaksi Loomio-tiliä, joilla on eri sähköpostiosoitteet, kun haluat jatkaa yhdellä tilillä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '08d4fcba2e0a2b3b':
    english: 'Before you begin, decide which account you want to keep:'
    translation: 'Päätä ennen aloittamista, kumman tilin haluat säilyttää:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6f7efc1ebdc680c7:
    english: |-
      - The **account to keep** is the account whose email address and profile you will use after the merge
      - The **account to retire** is the account you sign in to first. Its email address will no longer work for signing in after the merge
    translation: |-
      - **Säilytettävä tili** on tili, jonka sähköpostiosoitetta ja profiilia käytät yhdistämisen jälkeen
      - **Poistettava tili** on tili, jolle kirjaudut ensin. Sen sähköpostiosoitteella ei voi enää kirjautua sisään yhdistämisen jälkeen
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  060fb4b1c12c153a:
    english: You need access to both accounts and to the email address of the account you want to keep.
    translation: Tarvitset pääsyn molempiin tileihin sekä säilytettävän tilin sähköpostiosoitteeseen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9c9a7e082a3b67ae:
    english: |-
      > [!WARNING]
      > Merging accounts is irreversible. Check the source and target email addresses carefully before the final confirmation.
    translation: |-
      > [!WARNING]
      > Tilien yhdistämistä ei voi perua. Tarkista molemmat sähköpostiosoitteet huolellisesti ennen lopullista vahvistusta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4d6defccb0f2a2ec:
    english: "## Start the merge"
    translation: "## Aloita yhdistäminen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0c49f5d2284571d3:
    english: |-
      1. Sign in to the **account you want to retire**.
      2. Open the sidebar, select your name, and select **Edit profile**.
      3. Select **Merge accounts**.
    translation: |-
      1. Kirjaudu sisään **tilille, jonka haluat poistaa**.
      2. Avaa sivupalkki, valitse nimesi ja valitse **Muokkaa profiilia**.
      3. Valitse **Yhdistä tilit**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a05689d18f3c3337:
    english: "![The profile actions with Merge accounts highlighted](merge_accounts_profile.png)"
    translation: "![Profiilivalikko, jossa Yhdistä tilit on korostettu](merge_accounts_profile.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  29656e0572127b88:
    english: 4. Enter the destination account's email address—the address belonging to the **account you want to keep**—and select **Send verification email**. Loomio always shows the same confirmation and signs you out. If an account uses that address, Loomio sends it the verification email.
    translation: 4. Anna **säilytettävän tilin** sähköpostiosoite ja valitse **Lähetä vahvistussähköposti**. Loomio näyttää aina saman vahvistusviestin ja kirjaa sinut ulos. Jos osoitteella on tili, Loomio lähettää siihen vahvistussähköpostin.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d045b6c7e8a5b853:
    english: "## Verify the account you want to keep"
    translation: "## Vahvista säilytettävä tili"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  57255cdb29b384d7:
    english: 5. Open the verification email sent to the address of the account you want to keep and select **Verify email and proceed**.
    translation: 5. Avaa säilytettävän tilin osoitteeseen lähetetty vahvistussähköposti ja valitse **Vahvista sähköposti ja jatka**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5e496b2d8f551efa:
    english: "![The merge verification email with the Verify email and proceed button highlighted](merge_accounts_email.png)"
    translation: "![Tilien yhdistämisen vahvistussähköposti, jossa Vahvista sähköposti ja jatka -painike on korostettu](merge_accounts_email.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ad19dc0399f9d446:
    english: |-
      6. Sign in as the account you want to keep if Loomio asks you to sign in.
      7. On the **Confirm merge** page, check both email addresses again. Select **Merge accounts** to complete the merge.
    translation: |-
      6. Kirjaudu sisään säilytettävälle tilille, jos Loomio pyytää sitä.
      7. Tarkista molemmat sähköpostiosoitteet uudelleen **Vahvista yhdistäminen** -sivulla. Viimeistele yhdistäminen valitsemalla **Yhdistä tilit**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a575e2cd16aa66b4:
    english: "![The final confirmation page with the Merge accounts button highlighted](merge_accounts_confirm.png)"
    translation: "![Lopullinen vahvistussivu, jossa Yhdistä tilit -painike on korostettu](merge_accounts_confirm.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cf8eba685cfdbf04:
    english: "## What happens after the merge"
    translation: "## Mitä yhdistämisen jälkeen tapahtuu"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6ae4c6c893430735:
    english: The account you keep remains your Loomio identity and sign-in account. Group memberships and activity from the retired account, including discussions, comments, polls, and votes, are reassigned to the account you keep. Where both accounts already belong to the same group, the existing membership for the account you keep remains.
    translation: Säilytettävä tili pysyy Loomio-käyttäjätilinäsi, jolla kirjaudut sisään. Poistettavan tilin ryhmäjäsenyydet ja toiminta, kuten keskustelut, kommentit, kyselyt ja äänet, siirtyvät säilytettävälle tilille. Jos molemmat tilit kuuluvat jo samaan ryhmään, säilytettävän tilin nykyinen jäsenyys pysyy voimassa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  eb05b57367c0815c:
    english: The retired account is deleted and its email address can no longer be used to sign in. Loomio sends a confirmation email to the address of the account you kept when the merge is complete.
    translation: Poistettava tili poistetaan, eikä sen sähköpostiosoitteella voi enää kirjautua sisään. Kun yhdistäminen on valmis, Loomio lähettää vahvistussähköpostin säilytetyn tilin osoitteeseen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
