  14280ff177b248ab:
    english: "# Send an email to start a thread in your group"
    translation: "# Envoyer un e-mail pour lancer une discussion dans votre groupe"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e3de5524e10b9928:
    english: Your Loomio group has an email address! You can send or forward email to this address to start a thread in the group.
    translation: Votre groupe Loomio possède une adresse e-mail. Vous pouvez envoyer ou transférer un e-mail à cette adresse pour lancer une discussion dans le groupe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  85a7436d4a1b4396:
    english: |-
      You can see your group's email address on the group page:
      ![location of the email address on the group page](email_email_button.png)
    translation: |-
      L’adresse e-mail de votre groupe figure sur la page du groupe :
      ![Emplacement de l’adresse e-mail sur la page du groupe](email_email_button.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e34019bbcf3b319f:
    english: When you send an email to this address, a new thread will be started. The email subject becomes the thread title, the body of the email becomes the description, and any attached files will be attached to the thread.
    translation: Lorsque vous envoyez un e-mail à cette adresse, une nouvelle discussion est créée. L’objet de l’e-mail devient le titre de la discussion, son contenu devient la description et les fichiers joints sont ajoutés à la discussion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  46a53b8267a61c2f:
    english: The email "From" address is used to find the group member who will be the author of the thread.
    translation: L’adresse indiquée dans le champ « De » permet d’identifier le membre du groupe qui sera l’auteur de la discussion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bd7df6f632af8db1:
    english: "## Preventing unauthorized emails"
    translation: "## Empêcher les e-mails non autorisés"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a5118468df167ba0:
    english: To ensure that this feature cannot be used by people who are not members of your group, Loomio will require that the "From" address of an incoming email matches the address of someone in the group.
    translation: Pour empêcher les personnes extérieures à votre groupe d’utiliser cette fonction, Loomio exige que l’adresse indiquée dans le champ « De » corresponde à celle d’un membre du groupe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f11910ae643c5b47:
    english: If you use multiple email addresses, you can add an alias so Loomio knows about your other email addresses.
    translation: Si vous utilisez plusieurs adresses e-mail, vous pouvez ajouter un alias pour que Loomio reconnaisse vos autres adresses.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e3d88a25128322b5:
    english: When the "from" address does not match a member of the group, you will receive a notification asking you to add an alias or reject all further emails from that address.
    translation: Si l’adresse indiquée dans le champ « De » ne correspond à aucun membre du groupe, vous recevrez une notification vous invitant à ajouter un alias ou à refuser tous les futurs e-mails provenant de cette adresse.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  890546269cfa56b6:
    english: This means that the first time you send email from an unrecognised address, you will need to add an alias. After that, emails will be accepted immediately.
    translation: La première fois que vous envoyez un e-mail depuis une adresse non reconnue, vous devez donc ajouter un alias. Les e-mails suivants seront alors acceptés immédiatement.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
