  f3106c22cd3d4059:
    english: 'Loomio can send notifications into your Matrix channels when new discussions, proposals, comments, votes, and outcomes occur. '
    translation: Loomio יכולה לשלוח התראות לערוצי Matrix כשנוצרים דיונים, הצעות, הערות, הצבעות ומסקנות חדשות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a20cf2be00dac0ce:
    english: Matrix is nice because it allows some HTML in the chatroom, and Loomio takes advantage of this.
    translation: Matrix מאפשרת להציג HTML מסוים בחדר הצ'אט, ו-Loomio משתמשת באפשרות הזאת.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ffe12502f0030fec:
    english: Our Matrix integration is a little different to our other chat integrations - it does not use a webhook - we've built a custom bot client for this one.
    translation: השילוב של Matrix שונה משילובי הצ'אט האחרים של Loomio. הוא אינו משתמש ב-webhook; נבנה עבורו לקוח בוט ייעודי.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  44db147f65127a55:
    english: You will need to create a matrix user for the bot to login as.
    translation: יש ליצור משתמש Matrix שהבוט יוכל להתחבר באמצעותו.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  98045e5bf1339543:
    english: Once you've created a user for the bot, sign in at that user to obtain the following information.
    translation: לאחר יצירת המשתמש עבור הבוט, יש להתחבר באמצעותו כדי לקבל את הפרטים הבאים.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '059df9c4b4ebf0d0':
