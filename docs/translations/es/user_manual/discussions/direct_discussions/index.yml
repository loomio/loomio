  5a0b9426a2d88e62:
    english: |-
      ## Contacting someone via a direct discussion
      A direct discussion can be used to contact one or more people privately without creating a subgroup.
    translation: |-
      ## Contactar con alguien mediante una discusión directa
      Puedes usar una discusión directa para contactar en privado con una o más personas sin crear un subgrupo.
