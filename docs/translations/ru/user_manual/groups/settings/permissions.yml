navigation_title: Разрешения
blocks:
  d661e5fc8cc1b460:
    english: "# Group permissions"
    translation: "# Разрешения группы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  712830f14602c6c7:
    english: The permissions tab controls which group operations are available to ordinary members and, for non-secret groups, to non-members. Open **Edit group settings** from the group page, then select **Permissions**.
    translation: На вкладке разрешений можно указать, какие действия в группе доступны обычным участникам, а в группах, которые не являются секретными, — людям вне группы. На странице группы откройте **Редактировать настройки группы**, затем выберите **Разрешения**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b71bf8cce1cb369c:
    english: "![Group permission settings](group_group_settings_permissions.png)"
    translation: "![Настройки разрешений группы](group_group_settings_permissions.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  88e5fcd302a53620:
    english: Administrators retain the ability to manage the group. Enabling a member permission extends that particular action to ordinary members; it does not make them administrators.
    translation: Администраторы сохраняют возможность управлять группой. Если разрешить участникам определённое действие, они смогут его выполнять, но не станут администраторами.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5b2b9af0f68b7a57:
    english: 'Permissions include whether members can:'
    translation: 'Разрешения определяют, могут ли участники:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8377b499d13690c0:
    english: |-
      - add members or invite guests;
      - send announcements;
      - create subgroups;
      - start and manage discussions;
      - create and manage tags;
      - edit or delete comments where the setting permits;
      - start proposals and polls; and
      - create discussion and poll templates.
    translation: |-
      - добавлять участников или приглашать гостей;
      - отправлять объявления;
      - создавать подгруппы;
      - начинать обсуждения и управлять ими;
      - создавать теги и управлять ими;
      - редактировать или удалять комментарии, если это разрешено настройками;
      - начинать предложения и голосования;
      - создавать шаблоны обсуждений и голосований.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  87166abe7eea1ab3:
    english: For groups that are not secret, administrators can separately allow non-members to start discussions. A non-member who starts a discussion becomes a guest of that discussion but does not gain access to other private discussions or become a group member.
    translation: В группах, которые не являются секретными, администраторы могут отдельно разрешить людям вне группы начинать обсуждения. Такой человек становится гостем созданного им обсуждения, но не получает доступ к другим закрытым обсуждениям и не становится участником группы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3d01d10a97636b1e:
    english: The **Admins can edit members' comments** setting gives administrators an exceptional moderation capability. Enable it only when the group has agreed that administrators should be able to alter member-authored content.
    translation: Настройка **Администраторы могут редактировать комментарии участников.** даёт администраторам особое право изменять комментарии участников. Включайте её, только если группа согласилась предоставить администраторам такое право.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b0af0135752a461f:
    english: Review permissions when the group's purpose, membership, or moderation responsibilities change. Give each role only the capabilities it needs.
    translation: Пересматривайте разрешения, когда меняются задачи группы, состав участников или обязанности по модерации. Предоставляйте каждой роли только необходимые ей права.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
