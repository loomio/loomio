    translated_on: '2026-09-29'
  4318dab03fe217ad:
    english: Oatmilk Cooperative is deciding whether to approve the budget for its six-week returnable bottle trial. Five people are eligible to vote.
    translation: Oatmilk Cooperative beslist of het budget voor een proef van zes weken met herbruikbare flessen wordt goedgekeurd. Vijf mensen zijn kiesgerechtigd.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8f5779f2f1bb9ec3:
    english: Jamie uses the **Consent** proposal template, edits the Consent option, and enables its vote share requirement.
    translation: Jamie gebruikt het voorstelsjabloon **Toestemming**, bewerkt de optie Toestemming en schakelt de vereiste voor het stemmenaandeel in.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  842038ffbd273e57:
    english: The cooperative's process requires at least 75 percent of eligible voters to support the proposal. Jamie sets the requirement to **At least 75% of Eligible voters**.
    translation: Het proces van de coöperatie vereist steun van minstens 75 procent van de kiesgerechtigde kiezers. Jamie stelt de vereiste in op **Ten minste 75% van Kiesgerechtigde kiezers**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5b852b2e7a9b3034:
    english: "![The Consent option requiring at least 75 percent of eligible voters](./consent-vote-option.png)"
    translation: "![De optie Toestemming vereist steun van minstens 75 procent van de kiesgerechtigde kiezers](./consent-vote-option.png)"
