---
navigation_title: API utente
blocks:
  0217b93dddc627ac:
    english: "# Loomio User API documentation"
    translation: "# Documentazione dell'API utente di Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bc6fcbf5f783fd29:
    english: "<!-- seo-description: Use the Loomio User API to create and manage discussions, comments, polls, threads, and group memberships from other software. -->"
    translation: "<!-- seo-description: Usa l'API utente di Loomio per creare e gestire discussioni, commenti, sondaggi, thread e partecipazioni ai gruppi da altri software. -->"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cc2da08540808ada:
    english: "`/api/b2` is the user-oriented API for integrations with Loomio. It uses the API key of a user account, and every action is performed as that user."
    translation: "`/api/b2` è l'API utente per le integrazioni con Loomio. Usa la chiave API di un account utente ed esegue ogni azione a nome di quell'utente."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7036a6661aac00f2:
    english: Group operations use the memberships and group permissions of the API-key user. Instance-administrator status does not expand an API key's access to groups or content; use the Server API for instance-level administration.
    translation: Le operazioni sui gruppi rispettano le partecipazioni e i permessi dell'utente a cui appartiene la chiave API. Il ruolo di amministratore dell'istanza non amplia l'accesso della chiave API ai gruppi o ai contenuti; per amministrare l'istanza, usa la Server API.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c4436493b062b9f1:
    english: Use the API key from the Loomio user account that will perform the actions. A dedicated bot account is useful when an integration should not be invited to polls or receive notifications.
    translation: Usa la chiave API dell'account Loomio che eseguirà le azioni. Un account bot dedicato è utile se l'integrazione non deve ricevere inviti ai sondaggi o notifiche.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ade21c593f08100c:
    english: Signed-in users can find their API key and group IDs on the [API access page](/profile/api_access).
    translation: Se hai effettuato l'accesso, trovi la tua chiave API e gli ID dei gruppi nella [pagina di accesso API](/profile/api_access).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  15160edafaf441c1:
    english: 'Send the API key in an `Authorization: Bearer` header. API keys in query strings are rejected because URLs can be recorded by proxies and access logs.'
    translation: 'Invia la chiave API nell''intestazione `Authorization: Bearer`. Le chiavi API nelle stringhe di query vengono rifiutate perché gli URL possono essere registrati dai proxy e nei log di accesso.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2215e57186277325:
    english: "### Authentication change"
    translation: "### Modifica dell'autenticazione"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ff5f4c1055e80fb6:
    english: 'The API key was previously accepted as an `api_key` URL parameter. Requests using `?api_key=YOUR_API_KEY` no longer work. Use the HTTP `Authorization` header instead:'
    translation: 'In precedenza, la chiave API poteva essere passata come parametro URL `api_key`. Le richieste che usano `?api_key=YOUR_API_KEY` non funzionano più. Usa invece l''intestazione HTTP `Authorization`:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  65574ba500243c80:
    english: The examples use `YOUR_API_KEY`, group ID `123`, and `https://www.loomio.com/`. Replace these with your API key, group ID, and Loomio installation URL.
    translation: Gli esempi usano `YOUR_API_KEY`, l'ID di gruppo `123` e `https://www.loomio.com/`. Sostituiscili con la tua chiave API, l'ID del gruppo e l'URL della tua installazione di Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bec1e4f30aeef4ce:
    english: "## Response size and related records"
    translation: "## Dimensioni delle risposte e record correlati"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  da004eb4e005fae1:
    english: 'User API responses use a compound format: the primary records are accompanied by related records such as topics, groups, users, polls, and reactions. This lets a client populate a local record store from one request, but can include more data than a simple integration needs.'
    translation: 'Le risposte dell''API utente hanno un formato composito: i record principali sono accompagnati da record correlati, come topic, gruppi, utenti, sondaggi e reazioni. Questo consente a un client di popolare un archivio locale con una sola richiesta, ma può includere più dati di quanti ne servano a una semplice integrazione.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  64d9a631b54cbaba:
    english: Pass `compact=1` to omit bulky related topics, groups, parent groups, memberships, reactions, tags, and translations. Primary records and the related records needed to interpret their content remain present.
    translation: 'Passa `compact=1` per omettere i record correlati più voluminosi: topic, gruppi, gruppi principali, partecipazioni, reazioni, tag e traduzioni. I record principali e quelli correlati necessari per interpretarne il contenuto restano presenti.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e4e671db39dbe6f1:
    english: For direct control, pass `exclude_types` with space-separated singular record types. For example, `exclude_types=group reaction` omits related groups and reactions. Common values are `topic`, `group`, `parent`, `membership`, `reaction`, `tag`, `translation`, `user`, `discussion`, `poll`, `poll_option`, `stance`, `stance_choice`, `outcome`, and `topic_item`. Exclusions apply to related records, not the primary resource requested by the endpoint.
    translation: Per controllare direttamente le esclusioni, passa `exclude_types` con i tipi di record al singolare separati da spazi. Per esempio, `exclude_types=group reaction` omette i gruppi e le reazioni correlati. I valori comuni sono `topic`, `group`, `parent`, `membership`, `reaction`, `tag`, `translation`, `user`, `discussion`, `poll`, `poll_option`, `stance`, `stance_choice`, `outcome` e `topic_item`. Le esclusioni si applicano ai record correlati, non alla risorsa principale richiesta dall'endpoint.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ded075da3c2aa815:
    english: Collection responses include `meta.total` when an exact collection size is defined. The total is calculated before `limit` and `offset` are applied. Endpoints such as search that intentionally return a bounded result set omit `meta.total` rather than returning `null`.
    translation: Le risposte che contengono raccolte includono `meta.total` quando è definita la dimensione esatta della raccolta. Il totale viene calcolato prima di applicare `limit` e `offset`. Gli endpoint come la ricerca, che restituiscono intenzionalmente un insieme limitato di risultati, omettono `meta.total` invece di restituire `null`.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  17cb8ef90a2acdb3:
    english: "## Endpoint summary"
    translation: "## Riepilogo degli endpoint"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  608edb13080e57c2:
    english: |-
      | Method | Endpoint | Purpose |
      | --- | --- | --- |
      | `GET` | `/api/b2/groups` | List the API-key user's groups |
      | `GET` | `/api/b2/groups/:id_or_key_or_handle` | Get a visible group |
      | `GET` | `/api/b2/reports` | Generate a participation report |
      | `GET` | `/api/b2/search` | Search visible discussions, comments, polls, votes, and outcomes |
      | `POST` | `/api/b2/discussions` | Create a discussion |
      | `GET` | `/api/b2/discussions/:id` | Get a discussion |
      | `GET` | `/api/b2/discussions` | List discussions in a group |
      | `PATCH` | `/api/b2/discussions/:id` | Edit a discussion |
      | `DELETE` | `/api/b2/discussions/:id` | Soft-delete a discussion |
      | `GET` | `/api/b2/threads` | List visible discussion and standalone-poll threads |
      | `GET` | `/api/b2/threads/:topic_id` | Get a thread |
      | `GET` | `/api/b2/threads/:topic_id/items` | Get the ordered items in a thread |
      | `GET` | `/api/b2/threads/:topic_id/markdown` | Get a complete thread as Markdown |
      | `POST` | `/api/b2/comments` | Create a comment or reply |
      | `PATCH` | `/api/b2/comments/:id` | Edit a comment |
      | `DELETE` | `/api/b2/comments/:id` | Soft-delete a comment |
      | `POST` | `/api/b2/polls` | Create a poll |
      | `GET` | `/api/b2/polls/:id` | Get a poll |
      | `GET` | `/api/b2/polls` | List polls in a group |
      | `PATCH` | `/api/b2/polls/:id` | Edit a poll |
      | `DELETE` | `/api/b2/polls/:id` | Soft-delete a poll |
      | `GET` | `/api/b2/memberships` | List a group's memberships |
      | `POST` | `/api/b2/memberships` | Add members and optionally remove absent members |
      | `GET` | `/api/b2/chatbots` | List a group's chat integrations and webhooks |
      | `POST` | `/api/b2/chatbots` | Create a chat integration or webhook |
      | `PATCH` | `/api/b2/chatbots/:id` | Update a chat integration or webhook |
      | `DELETE` | `/api/b2/chatbots/:id` | Delete a chat integration or webhook |
      | `POST` | `/api/b2/chatbots/check` | Send a webhook connection test |
    translation: |-
      | Metodo | Endpoint | Scopo |
      | --- | --- | --- |
      | `GET` | `/api/b2/groups` | Elenca i gruppi dell'utente a cui appartiene la chiave API |
      | `GET` | `/api/b2/groups/:id_or_key_or_handle` | Recupera un gruppo visibile |
      | `GET` | `/api/b2/reports` | Genera un rapporto sulla partecipazione |
      | `GET` | `/api/b2/search` | Cerca discussioni, commenti, sondaggi, voti e conclusioni visibili |
      | `POST` | `/api/b2/discussions` | Crea una discussione |
      | `GET` | `/api/b2/discussions/:id` | Recupera una discussione |
      | `GET` | `/api/b2/discussions` | Elenca le discussioni di un gruppo |
      | `PATCH` | `/api/b2/discussions/:id` | Modifica una discussione |
      | `DELETE` | `/api/b2/discussions/:id` | Elimina una discussione senza rimuoverne il record |
      | `GET` | `/api/b2/threads` | Elenca i thread visibili delle discussioni e dei sondaggi autonomi |
      | `GET` | `/api/b2/threads/:topic_id` | Recupera un thread |
      | `GET` | `/api/b2/threads/:topic_id/items` | Recupera gli elementi ordinati di un thread |
      | `GET` | `/api/b2/threads/:topic_id/markdown` | Recupera un thread completo in formato Markdown |
      | `POST` | `/api/b2/comments` | Crea un commento o una risposta |
      | `PATCH` | `/api/b2/comments/:id` | Modifica un commento |
      | `DELETE` | `/api/b2/comments/:id` | Elimina un commento senza rimuoverne il record |
      | `POST` | `/api/b2/polls` | Crea un sondaggio |
      | `GET` | `/api/b2/polls/:id` | Recupera un sondaggio |
      | `GET` | `/api/b2/polls` | Elenca i sondaggi di un gruppo |
      | `PATCH` | `/api/b2/polls/:id` | Modifica un sondaggio |
      | `DELETE` | `/api/b2/polls/:id` | Elimina un sondaggio senza rimuoverne il record |
      | `GET` | `/api/b2/memberships` | Elenca le partecipazioni a un gruppo |
      | `POST` | `/api/b2/memberships` | Aggiunge membri e, facoltativamente, rimuove quelli assenti dall'elenco |
      | `GET` | `/api/b2/chatbots` | Elenca le integrazioni di chat e i webhook di un gruppo |
      | `POST` | `/api/b2/chatbots` | Crea un'integrazione di chat o un webhook |
      | `PATCH` | `/api/b2/chatbots/:id` | Aggiorna un'integrazione di chat o un webhook |
      | `DELETE` | `/api/b2/chatbots/:id` | Elimina un'integrazione di chat o un webhook |
      | `POST` | `/api/b2/chatbots/check` | Invia un test di connessione a un webhook |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0473f1f7fb78f074:
    english: "## Groups"
    translation: "## Gruppi"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dc819221f371c435:
    english: "### List groups"
    translation: "### Elencare i gruppi"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  964f575e90aa9cde:
    english: Return the groups in which the API-key user has an active membership.
    translation: Restituisce i gruppi di cui l'utente a cui appartiene la chiave API è membro attivo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3835e6e77bc0ad10:
    english: "`GET /api/b2/groups`"
    translation: "`GET /api/b2/groups`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4f588e981afc3069:
    english: The response contains all matching records in a non-paginated `groups` array. It includes parent groups and subgroups, including groups whose subscription is not currently active. Check the `enabled` field when an integration should operate only on enabled groups.
    translation: La risposta contiene tutti i record corrispondenti in un array `groups` senza paginazione. Include gruppi principali e sottogruppi, anche se il loro abbonamento non è attualmente attivo. Controlla il campo `enabled` se l'integrazione deve operare solo sui gruppi abilitati.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  213de8ce539a42c3:
    english: 'Important group fields include:'
    translation: 'I principali campi dei gruppi sono:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d377f7c9b224a6d7:
    english: |-
      | Field | Description |
      | --- | --- |
      | `id` | Numeric group ID used by other User API endpoints |
      | `key` | Stable short key used in Loomio URLs |
      | `handle` | Human-readable group handle |
      | `name` | Group name |
      | `full_name` | Group name including its parent-group context |
      | `parent_id` | Numeric parent-group ID for a subgroup, otherwise `null` |
      | `enabled` | Whether the group and its subscription are active |
      | `memberships_count` | Number of active and pending memberships |
      | `accepted_memberships_count` | Number of accepted memberships |
      | `pending_memberships_count` | Number of pending invitations |
      | `admin_memberships_count` | Number of group administrators |
      | `delegates_count` | Number of delegates |
      | `discussions_count` | Number of discussions directly in the group |
      | `polls_count` | Number of polls directly in the group |
      | `subgroups_count` | Number of subgroups |
    translation: |-
      | Campo | Descrizione |
      | --- | --- |
      | `id` | ID numerico del gruppo usato dagli altri endpoint dell'API utente |
      | `key` | Chiave breve e stabile usata negli URL di Loomio |
      | `handle` | Identificativo leggibile del gruppo |
      | `name` | Nome del gruppo |
      | `full_name` | Nome del gruppo con il contesto del gruppo principale |
      | `parent_id` | ID numerico del gruppo principale per un sottogruppo, altrimenti `null` |
      | `enabled` | Indica se il gruppo e il suo abbonamento sono attivi |
      | `memberships_count` | Numero di partecipazioni attive e in attesa |
      | `accepted_memberships_count` | Numero di partecipazioni accettate |
      | `pending_memberships_count` | Numero di inviti in attesa |
      | `admin_memberships_count` | Numero di amministratori del gruppo |
      | `delegates_count` | Numero di delegati |
      | `discussions_count` | Numero di discussioni presenti direttamente nel gruppo |
      | `polls_count` | Numero di sondaggi presenti direttamente nel gruppo |
      | `subgroups_count` | Numero di sottogruppi |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  34f1693ba28fcb80:
    english: The response may include additional group settings, related parent-group records and the API user's memberships. Clients should ignore fields they do not use.
    translation: La risposta può includere altre impostazioni del gruppo, i record correlati del gruppo principale e le partecipazioni dell'utente API. I client dovrebbero ignorare i campi che non usano.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d7c327b8ed7f7bf2:
    english: "### Get a group"
    translation: "### Recuperare un gruppo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  15ab63bc2d396657:
    english: Return one group visible to the API-key user.
    translation: Restituisce un gruppo visibile all'utente a cui appartiene la chiave API.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8ba2cc9e3c67b1dd:
    english: "`GET /api/b2/groups/:id_or_key_or_handle`"
    translation: "`GET /api/b2/groups/:id_or_key_or_handle`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  71e5812ff9890c9b:
    english: The identifier can be the group's numeric ID, key or handle.
    translation: Puoi identificare il gruppo tramite il suo ID numerico, la chiave o l'identificativo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8ba79a283b7b77d5:
    english: The response contains the group in the `groups` array and uses the same fields as the list endpoint. A request for a group the API-key user cannot access returns a permission error.
    translation: La risposta contiene il gruppo nell'array `groups` e usa gli stessi campi dell'endpoint che elenca i gruppi. Una richiesta per un gruppo a cui l'utente a cui appartiene la chiave API non può accedere restituisce un errore di autorizzazione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  18d823df4d7f8fac:
    english: "## Webhooks"
    translation: "## Webhook"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f33d58fc1f2fd84c:
    english: 'The User API is request-based: an integration calls Loomio when it wants to read or change data. A group webhook provides the push direction. Loomio sends selected group events to your endpoint as they happen, so an integration does not need to poll the REST API for changes.'
    translation: 'L''API utente funziona tramite richieste: un''integrazione chiama Loomio quando vuole leggere o modificare dati. Un webhook di gruppo consente il flusso nella direzione opposta. Loomio invia al tuo endpoint gli eventi del gruppo selezionati quando si verificano, quindi l''integrazione non deve interrogare periodicamente l''API REST per rilevare le modifiche.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3b5b4b0ac52b9010:
    english: 'Webhooks are configured per group and require group-administrator permission. They can be managed through the Loomio interface:'
    translation: 'I webhook si configurano per singolo gruppo e richiedono i permessi di amministratore del gruppo. Puoi gestirli dall''interfaccia di Loomio:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  318710be7b3aae7d:
    english: |-
      1. Open the group.
      2. Open the group menu and select **Chat integrations**.
      3. Add the integration matching the payload format your endpoint accepts. For a general-purpose endpoint, use the Mattermost/Markdown format.
      4. Enter a name and the destination URL.
      5. Select the events that Loomio should send automatically.
      6. Save the integration and use **Test connection** to send a test message.
    translation: |-
      1. Apri il gruppo.
      2. Apri il menu del gruppo e seleziona **Integrazioni di chat**.
      3. Aggiungi l'integrazione con il formato del payload accettato dal tuo endpoint. Per un endpoint generico, usa il formato Mattermost/Markdown.
      4. Inserisci un nome e l'URL di destinazione.
      5. Seleziona gli eventi che Loomio deve inviare automaticamente.
      6. Salva l'integrazione e usa **Test connection** per inviare un messaggio di prova.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  43fb95cf304fced6:
    english: Use an HTTPS destination with an unguessable URL. Loomio requires the destination to resolve to a public address and blocks requests to local or private network addresses.
    translation: Usa una destinazione HTTPS con un URL difficile da indovinare. Loomio richiede che la destinazione corrisponda a un indirizzo pubblico e blocca le richieste verso indirizzi di reti locali o private.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d8d5abffe6425bea:
    english: Agents and other integrations can instead manage webhooks through the Bearer-authenticated chatbot endpoints described below. The resource is named `chatbots` for compatibility with Loomio's chat integrations, but it also represents general outgoing webhooks.
    translation: Gli agenti e le altre integrazioni possono gestire i webhook tramite gli endpoint chatbot descritti sotto, autenticati con Bearer. La risorsa si chiama `chatbots` per compatibilità con le integrazioni di chat di Loomio, ma rappresenta anche webhook in uscita generici.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  28fb6371af33b66f:
    english: "### List webhooks"
    translation: "### Elencare i webhook"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7187e5a26c3ec864:
    english: Return the chat integrations configured for a group. The API-key user must be an administrator of that group. The response includes destination URLs, so it must not be exposed to ordinary group members.
    translation: Restituisce le integrazioni di chat configurate per un gruppo. L'utente a cui appartiene la chiave API deve essere amministratore di quel gruppo. La risposta include gli URL di destinazione, quindi non deve essere resa accessibile ai normali membri del gruppo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  788d370538bdda46:
    english: "`GET /api/b2/chatbots?group_id=123`"
    translation: "`GET /api/b2/chatbots?group_id=123`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d676ca45c3e1074a:
    english: 'The response contains a `chatbots` array with these fields:'
    translation: 'La risposta contiene un array `chatbots` con questi campi:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ca00f7d0a52ce803:
    english: |-
      | Field | Description |
      | --- | --- |
      | `id` | Integration ID used for updates and deletion |
      | `group_id` | Group receiving the events |
      | `name` | Administrative name for the integration |
      | `kind` | `webhook` for an outgoing webhook or `matrix` for a Matrix integration |
      | `webhook_kind` | Payload format: `markdown`, `slack`, `discord`, `microsoft`, or `webex` |
      | `server` | Destination URL |
      | `event_kinds` | Events sent automatically |
      | `notification_only` | Whether messages contain only the notification headline |
    translation: |-
      | Campo | Descrizione |
      | --- | --- |
