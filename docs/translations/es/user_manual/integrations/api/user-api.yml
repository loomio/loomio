  '09b3d2247802eae7':
    english: A person is a delegate when they have an active delegate membership in any selected group. Their counts are aggregated across all selected groups. Delegate rows are returned even when every activity count is zero. Counts cover threads, comments, polls, votes, outcomes, and reactions; they are not voting participation rates. User rows also include identified ballots issued, cast, and missed. Anonymous polls are excluded from all per-person voting counts. `all_votes_cast` is true only when at least one ballot was issued and every issued ballot was cast.
    translation: Una persona es delegada si tiene una membresía activa como delegada en cualquiera de los grupos seleccionados. Sus recuentos se agregan entre todos esos grupos. Se devuelven filas de personas delegadas incluso cuando todos sus recuentos de actividad son cero. Los recuentos incluyen hilos, comentarios, sondeos, votos, conclusiones y reacciones; no representan tasas de participación en las votaciones. Las filas de personas también incluyen las papeletas identificadas emitidas, depositadas y no respondidas. Los sondeos anónimos se excluyen de todos los recuentos de votos por persona. `all_votes_cast` solo es verdadero si se emitió al menos una papeleta y se depositaron todas las emitidas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
