    translated_on: '2026-09-30'
  3242767a5e393028:
    english: Good governance includes establishing, reviewing and challenging governance practices, policies and procedures to continously improve board effectiveness.
    translation: Uma boa governança envolve estabelecer, revisar e questionar práticas, políticas e procedimentos para melhorar continuamente a atuação do conselho.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c4d8cb7f7eb901a6:
    english: However many boards are short on time and often weighed down by board papers, compliance and risk, without sufficient time to discuss and debate critical strategy and performance issues.
    translation: Porém, muitos conselhos têm pouco tempo e precisam lidar com documentos, requisitos de conformidade e riscos. Assim, sobra pouco tempo para discutir questões importantes de estratégia e desempenho.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  eb59655c49bf902d:
    english: "## On Loomio\nLoomio offers the opportunity to work online on a document, policy or procedure.  Discussion and decisions are contained in a thread that members can access when and wherever works for them.  "
    translation: |-
      ## No Loomio
      O Loomio permite trabalhar online em um documento, política ou procedimento. As discussões e decisões ficam em um tópico que os membros podem acessar quando e onde for conveniente.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a0d6426929e39b38:
    english: 'Use a **thread** for each document, policy or procedure. The thread is the container for discussion, and holds document drafts and subsequent versions of the document.  '
    translation: Use um **tópico** para cada documento, política ou procedimento. O tópico reúne a discussão, os rascunhos e as versões posteriores do documento.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  551c5aac67b42167:
    english: With a Loomio thread, you can organize so that the 2-3 people working on the document text are discussing particulars in the thread.  The thread could be private amongst just those 2-3 people, or run openly in the group so that the work is transparent to all members.
    translation: Em um tópico do Loomio, as duas ou três pessoas que trabalham no texto podem discutir os detalhes. O tópico pode ser privado para essas pessoas ou aberto ao grupo, para que todos os membros acompanhem o trabalho.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1400a6d44d7d4e35:
    english: When the document reaches a draft version, use a **Sense check poll** to notify members that the draft document is ready for review, and invite members to read the document and respond with any comments or questions.  As well as letting everyone know that the work is progressing, the poll closing date encourages people to participate.
    translation: Quando houver um rascunho, use uma **Verificação de sentido** para avisar aos membros que ele está pronto para revisão. Convide-os a ler o documento e enviar comentários ou perguntas. A data de encerramento da enquete incentiva a participação e ajuda todos a acompanhar o andamento do trabalho.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  44bcb71608c8f14a:
    english: The document may require several draft iterations.
    translation: O documento pode passar por várias versões de rascunho.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a5371854b689874a:
    english: When a 'final' draft is ready, raise a **Proposal** to approve the document.
    translation: Quando o rascunho final estiver pronto, inicie uma **Proposta** para aprovar o documento.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5998c94bd5b640ab:
    english: Loomio enables a board to progress work on governance improvement between meetings without eating into precious time in meetings.
    translation: O Loomio permite que o conselho avance no trabalho de melhoria da governança entre as reuniões, sem ocupar o tempo das reuniões.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
