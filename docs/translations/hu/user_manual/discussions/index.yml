  '0479bd2337b02443':
    english: "### Boards and Governance"
    translation: "### Vezető testületek és irányítás"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5b0a3e2c653d47f8:
    english: "**Prepare for a meeting** - Build an agenda, post board papers and organize administrative matters so everyone is up to date, in context and prepared. "
    translation: "**Készülj fel egy találkozóra** - Állíts össze napirendet, oszd meg a testületi dokumentumokat, és intézd az adminisztratív ügyeket, hogy mindenki tájékozottan és felkészülten érkezzen."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5c1c6aa79c3556dc:
    english: "**Pass a resolution** - Post context and background information, respond to questions and raise a proposal to pass a resolution. "
    translation: "**Adj határozatot** - Oszd meg a háttérinformációkat, válaszolj a kérdésekre, és tegyél javaslatot a határozat elfogadására."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  07ae9c6a1f0a32d0:
    english: "**Discuss an agenda item on Loomio** - Start discussion about an agenda item prior to your meeting. Or, if you run out of time in the meeting, move the discussion on to Loomio."
    translation: "**Beszélj meg egy napirendi pontot a Loomión** - Indíts beszélgetést egy napirendi pontról a találkozó előtt. Ha a találkozón elfogy az idő, folytassátok a beszélgetést a Loomión."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f0b0de7094b1cfc9:
    english: "**Approve minutes and track actions** - Post minutes and assign actions. Use a poll to approve minutes. "
    translation: "**Fogadd el a jegyzőkönyvet, és kövesd a feladatokat** - Oszd meg a jegyzőkönyvet, és oszd ki a feladatokat. A jegyzőkönyv elfogadásához indíts szavazást."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ba7cf177191baadb:
    english: "### Member participation"
    translation: "### Tagok részvétele"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3cf51f837c0a3e9f:
    english: "**Share news (replace mailing list)** - Post information for members, invite comments."
    translation: "**Ossz meg híreket (levelezőlista helyett)** - Oszd meg az információkat a tagokkal, és kérd ki a véleményüket."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d2cd391b61042129:
    english: "**Organize an event** - Work with your organizing team on details. Keep all discussion and info within the thread. Then announce the event to wider membership."
    translation: "**Szervezz eseményt** - Dolgozzátok ki a részleteket a szervezőcsapattal. Minden egyeztetést és információt tartsatok egy témában. Ezután hirdesd meg az eseményt a többi tagnak."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cf59a44a8643cc96:
    english: "**Develop a policy** - Post a policy draft, seek member feedback and input, finalize and ratify the policy."
    translation: "**Dolgozz ki egy szabályzatot** - Oszd meg a szabályzattervezetet, kérj visszajelzést és javaslatokat a tagoktól, majd véglegesítsétek és fogadjátok el a szabályzatot."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6ddec467576426ca:
    english: "**General Assembly** - Organize, prepare and run a formal meeting including all members, to deliberate and make decisions on strategic matters."
    translation: "**Közgyűlés** - Szervezz és vezess le egy hivatalos találkozót az összes tag részvételével, ahol stratégiai kérdéseket vitathattok meg és döntéseket hozhattok."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8d32bb446c4ca025:
    english: "### Self-organizing working teams"
    translation: "### Önszerveződő munkacsoportok"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  87ab6b2d51a7c1b6:
    english: "**Share information** - Post information and reports of interest to your team, invite comment and discussion."
    translation: "**Ossz meg információkat** - Ossz meg a csapatod számára fontos információkat és beszámolókat, és hívd meg a többieket a beszélgetésbe."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e93205aa183cd1e0:
    english: "**Progress work** - Outline a work task and seek advice, input and feedback from team members through to completion."
    translation: "**Vidd előre a munkát** - Vázolj fel egy feladatot, és kérj tanácsot, javaslatokat és visszajelzést a csapattagoktól a feladat befejezéséig."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1ddaef5d44653691:
    english: "**Meeting notes and actions** - Post meeting notes as a record of discussion, and follow up on tasks. "
    translation: "**Jegyzetek és feladatok a találkozóról** - Oszd meg a találkozó jegyzeteit a megbeszéltek rögzítésére, és kövesd nyomon a feladatokat."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8ce9169d72c90788:
    english: "**Explore ideas** - Share thoughts and invite discussion about a concern you notice, or an improvement that can be made."
    translation: "**Vizsgálj meg ötleteket** - Oszd meg a gondolataidat, és indíts beszélgetést egy észlelt problémáról vagy egy lehetséges fejlesztésről."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a06e734e86f07828:
    english: "**Advice, Consent and Generative decision making** - Prepare, propose, clarify, respond to reactions and objections, agree and implement - all within a Loomio discussion."
    translation: "**Tanácskérésen, beleegyezésen és közös ötletalkotáson alapuló döntéshozatal** - Készítsd elő a döntést, tégy javaslatot, tisztázd a kérdéseket, válaszolj a reakciókra és kifogásokra, állapodjatok meg, majd valósítsátok meg a döntést – mindezt egy Loomio-beszélgetésben."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
