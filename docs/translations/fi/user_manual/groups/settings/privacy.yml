  946f29d3bdb2e2af:
    english: "# Group privacy"
    translation: "# Ryhmän yksityisyys"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6a2fbb3e7cecad6e:
    english: Privacy controls who can find a group and who can read its content. Open **Edit group settings** from the group page, then select **Privacy**.
    translation: Yksityisyysasetukset määrittävät, kuka voi löytää ryhmän ja lukea sen sisältöä. Avaa ryhmän sivulta **Muokkaa ryhmän asetuksia** ja valitse sitten **Yksityisyys**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bf79bc420fc36377:
    english: "![Group privacy settings](group_privacy_settings.png#width-90)"
    translation: "![Ryhmän yksityisyysasetukset](group_privacy_settings.png#width-90)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4d275c75fe1a2c77:
    english: Changing privacy can expose or hide existing group content, not only content created afterward. Choose the most restrictive setting that still supports the group's purpose.
    translation: Yksityisyysasetuksen muuttaminen voi tuoda näkyviin tai piilottaa myös ryhmän aiemman sisällön. Valitse ryhmän tarkoitukseen sopiva mahdollisimman rajoittava asetus.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7510b0e8a0fcf7b3:
    english: "## Open"
    translation: "## Avoin"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f202c6fba754adaa:
    english: Open groups are public spaces. Anyone can find the group and read its discussions, polls, and files. The member list remains visible only to members.
    translation: Avoimet ryhmät ovat julkisia. Kuka tahansa voi löytää ryhmän ja lukea sen keskustelut, kyselyt ja tiedostot. Jäsenluettelo näkyy vain jäsenille.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c8d2b41a601ed65e:
    english: Open groups can allow people to join immediately, require approval, or remain invitation only.
    translation: Avoimeen ryhmään liittyminen voidaan sallia heti, asettaa hyväksyttäväksi tai rajata vain kutsutuille.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f07a1c59f30e5fea:
    english: "### Follow an Open group"
    translation: "### Avoimen ryhmän seuraaminen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d6f9ee2eb742720e:
    english: People can stay up to date with an Open group without joining. Following adds unread group activity to their catch-up email so they can review it in their own time. Followers do not become members, receive member voting rights, or receive immediate notifications just because they follow the group.
    translation: Voit seurata avoimen ryhmän tapahtumia liittymättä sen jäseneksi. Ryhmän lukemattomat tapahtumat lisätään yhteenvetosähköpostiisi, jotta voit tutustua niihin sinulle sopivana aikana. Seuraaminen ei tee sinusta jäsentä, anna jäsenille kuuluvia äänestysoikeuksia eikä yksinään aiheuta välittömiä ilmoituksia.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  17cb84d9141c9728:
    english: Turn on **Follow updates** on the group page to include its unread discussions, comments, polls, and other thread activity in your catch-up. Turn the setting off to stop including the group.
    translation: Ota **Seuraa päivityksiä** käyttöön ryhmän sivulla, jos haluat ryhmän lukemattomat keskustelut, kommentit, kyselyt ja muut ketjujen tapahtumat mukaan yhteenvetoosi. Poista asetus käytöstä, kun et enää halua ryhmän tapahtumia yhteenvetoon.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b0c06651e8c0df2b:
    english: "![Follow updates on an Open group](group_follow_updates.png)"
    translation: "![Seuraa päivityksiä avoimessa ryhmässä](group_follow_updates.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c5becc4d01b10f3:
    english: "## Closed"
    translation: "## Suljettu"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eaf6878c89438b53:
    english: Anyone can find a Closed group and read its name and description. Discussions, polls, files, and the member list are private to members and invited guests.
    translation: Kuka tahansa voi löytää suljetun ryhmän ja lukea sen nimen ja kuvauksen. Keskustelut, kyselyt, tiedostot ja jäsenluettelo näkyvät vain jäsenille ja kutsutuille vieraille.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ab7851d3b88d4e27:
    english: Closed groups can let people request membership or remain invitation only. They cannot let people join immediately without approval.
    translation: Suljettuun ryhmään voi sallia jäsenyyden hakemisen tai liittymisen vain kutsusta. Siihen ei voi liittyä heti ilman hyväksyntää.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e2f094fc6e490216:
    english: A Closed subgroup of a parent group can optionally allow members of the parent group to read its discussions without joining the subgroup.
    translation: Pääryhmän suljetussa alaryhmässä voidaan sallia pääryhmän jäsenten lukea keskusteluja liittymättä alaryhmään.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9c21e144af9492a6:
    english: "## Secret"
    translation: "## Salainen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6a9871bdd7fde747:
    english: Secret groups and their content are visible only to people who have been invited or added. Membership is invitation only. Secret groups do not appear in the public group directory.
    translation: Salainen ryhmä ja sen sisältö näkyvät vain kutsutuille tai ryhmään lisätyille henkilöille. Jäseneksi voi liittyä vain kutsusta. Salaiset ryhmät eivät näy julkisessa ryhmähakemistossa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  405ac2846a65b06c:
    english: "## How people join"
    translation: "## Ryhmään liittyminen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c7aebb687bbffbf:
    english: 'Privacy determines which joining options are available:'
    translation: 'Yksityisyysasetus määrittää käytettävissä olevat liittymistavat:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a6a7608fe4510b67:
    english: |-
      | Group privacy | Available joining options |
      | --- | --- |
      | **Open** | Anyone can join, request approval, or invitation only |
      | **Closed** | Request approval or invitation only |
      | **Secret** | Invitation only |
    translation: |-
      | Ryhmän yksityisyys | Liittymistavat |
      | --- | --- |
      | **Avoin** | Kuka tahansa voi liittyä, pyytää hyväksyntää tai liittyä vain kutsusta |
      | **Suljettu** | Hyväksyntäpyyntö tai liittyminen vain kutsusta |
      | **Salainen** | Liittyminen vain kutsusta |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  473a620db15dff75:
    english: When approval is required, people select **Join group**, answer the group's joining prompt, and send a request to join. See [Inviting people](/en/user_manual/groups/inviting_people#request-to-join-group) for instructions on configuring the prompt, reviewing requests, and inviting people directly.
    translation: Kun liittyminen vaatii hyväksynnän, valitse **Liittyä ryhmään**, vastaa ryhmän liittymiskysymykseen ja lähetä liittymispyyntö. Sivulla [Ihmisten kutsuminen](/en/user_manual/groups/inviting_people#request-to-join-group) kerrotaan, miten määrität liittymiskysymyksen, käsittelet pyynnöt ja kutsut ihmisiä suoraan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4c02de0d4580f7e6:
    english: "## Group directory"
    translation: "## Ryhmähakemisto"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2dc848ec1af0064e:
    english: Open and Closed parent groups can be listed in the public group directory so people can discover them. Directory listing does not change who can read group content or become a member. Subgroups and Secret groups cannot be listed.
    translation: Avoimet ja suljetut pääryhmät voidaan lisätä julkiseen ryhmähakemistoon, jotta ihmiset löytävät ne. Hakemistossa näkyminen ei muuta sitä, kuka voi lukea ryhmän sisältöä tai liittyä jäseneksi. Alaryhmiä ja salaisia ryhmiä ei voi lisätä hakemistoon.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
