  980342866ab7bee6:
    english: An in-depth guide to applying key facilitation concepts in the online space.
    translation: Докладний посібник із застосування основних принципів фасилітації в онлайн-просторі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ac8728f5ce2ea8ce:
    english: Loomio is made by facilitators, and that plays a huge role in how it has been designed. This guide is about revealing more of that context, and translating facilitation concepts from the offline space to the online space.
    translation: Loomio створили фасилітатори, і це значною мірою вплинуло на його дизайн. Цей посібник пояснює такий підхід і допомагає перенести принципи фасилітації з особистих зустрічей в онлайн-простір.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e802660a44da1775:
    english: "## More about this guide"
    translation: "## Докладніше про цей посібник"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5cbd64dba51ca485:
    english: Whether employed by a professional facilitator, people peer-facilitating each other, or a group that has no awareness of facilitation at all, Loomio’s essential function is to mediate and support group communication toward a desired outcome. In other words, facilitation.
    translation: Незалежно від того, чи групі допомагає професійний фасилітатор, чи учасники допомагають одне одному, чи група взагалі не знайома з фасилітацією, основне завдання Loomio — підтримувати спілкування в групі та допомагати їй досягти бажаного результату. Іншими словами, сприяти фасилітації.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  25a956280b647fa6:
    english: 'Loomio is *groupware*:'
    translation: 'Loomio — це *програмне забезпечення для групової роботи*:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  33e304be58a0a55b:
    english: "> Collaborative software, or groupware, is designed to help people involved in a common task achieve their goals. One of the earliest definitions of collaborative software is “intentional group processes plus software to support them.” -- Wikipedia"
    translation: "> Програмне забезпечення для спільної роботи допомагає людям, які працюють над спільним завданням, досягати своїх цілей. Одне з найдавніших його визначень — «цілеспрямовані групові процеси та програмне забезпечення для їх підтримки». -- Вікіпедія"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  170a0b463e1ad8ca:
    english: There is a huge body of knowledge, best practice, and tradition in both in-person facilitation and online moderation, but the art and science of their intersection is only just emerging. This is the specific space where Loomio strives to excel.
    translation: І фасилітація особистих зустрічей, і онлайн-модерація мають багатий досвід, усталені практики та традиції. Але підходи, що поєднують їх, лише формуються. Саме в цій сфері Loomio прагне бути особливо корисним.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
