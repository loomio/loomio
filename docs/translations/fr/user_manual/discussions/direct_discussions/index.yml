  5a0b9426a2d88e62:
    english: |-
      ## Contacting someone via a direct discussion
      A direct discussion can be used to contact one or more people privately without creating a subgroup.
    translation: |-
      ## Contacter quelqu’un par une discussion directe
      Vous pouvez utiliser une discussion directe pour contacter une ou plusieurs personnes en privé sans créer de sous-groupe.
