---
navigation_title: הצגת Loomio לדירקטוריון
blocks:
  2d7d9e9285159d4f:
    english: "# Introducing Loomio to your board"
    translation: "# הצגת Loomio לדירקטוריון"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6a42b6e2aba774c1:
    english: Loomio can become the online place where your board or committee meet, discuss, decide and build an auditable record for your organization.
    translation: Loomio יכולה לשמש מקום מקוון שבו הדירקטוריון או הוועדה נפגשים, דנים ומקבלים החלטות, תוך יצירת תיעוד שניתן לבקרה עבור הארגון.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1e26a40fe8b74f47:
    english: Start with the general sequence in [Introducing Loomio to your group](/en/user_manual/overview/introducing_loomio). This page adds considerations specific to boards and committees.
    translation: כדאי להתחיל בשלבים הכלליים שב[הצגת Loomio לקבוצה](/en/user_manual/overview/introducing_loomio). דף זה מוסיף שיקולים הנוגעים לדירקטוריונים ולוועדות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2999c11b8e274b1b:
    english: However Loomio will be of little value if only some of your board participate.  Information and communication will likely remain scattered over multiple tools, lost in email inboxes and the confusion will waste everyone's time.
    translation: אם רק חלק מחברי הדירקטוריון ישתתפו, התועלת מ־Loomio תהיה מוגבלת. מידע ותקשורת עלולים להישאר מפוזרים בין כלים שונים ולהיאבד בתיבות הדוא״ל. הבלבול יגזול זמן מכל המעורבים.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  28097dbe6dfd2fd7:
    english: 'Consider the problem you are trying to solve by using Loomio, say to improve and track communication or build institutional memory.  Then commit as a board to move your work into Loomio, and encourage everyone to make a genuine effort.  '
    translation: כדאי להגדיר איזו בעיה השימוש ב־Loomio נועד לפתור, למשל שיפור התקשורת והמעקב אחריה או שימור הידע הארגוני. לאחר מכן יש להסכים כדירקטוריון להעביר את העבודה ל־Loomio ולעודד השתתפות רצינית של כולם.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  449e6d5c90588dd2:
    english: As administrator your primary objective is to set up Loomio effectively for your board.
    translation: המטרה העיקרית של הנהלת הקבוצה היא להגדיר את Loomio כך שתשרת את עבודת הדירקטוריון.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '08969c9eca0d9855':
    english: 'Aim to encourage directors to join and participate. They should be able to:'
    translation: 'כדאי לעודד את חברי הדירקטוריון להצטרף ולהשתתף. עליהם להיות מסוגלים:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  70bf0ec81830055e:
    english: |-
      - Sign in to Loomio
      - Read and comment on threads
      - Vote in polls
      - See how your governance practices work in Loomio
    translation: |-
      - להיכנס ל־Loomio
      - לקרוא שרשורים ולהגיב בהם
      - להצביע במשאלים
      - לראות כיצד נהלי הממשל של הארגון פועלים ב־Loomio
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d41ec118bb86c93f:
    english: "## Check technical proficiency "
    translation: "## בדיקת מיומנות טכנית"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  728e1c8d201cacca:
    english: Board members will need a computer or smartphone connected to the internet. They must be capable of sending and receiving email, browsing the web, reading digital documents, viewing and hearing videos.
    translation: חברי הדירקטוריון זקוקים למחשב או לטלפון חכם עם חיבור לאינטרנט. נדרשת יכולת לשלוח ולקבל דוא״ל, לגלוש באינטרנט, לקרוא מסמכים דיגיטליים ולצפות בסרטונים עם קול.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  de1b1186edaff7c6:
    english: 'Check that members have all of the following:'
    translation: 'יש לוודא שלחברי הדירקטוריון יש את כל אלה:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9932640dbf8944e3:
    english: |-
      - an up-to-date device—a computer, tablet or smart phone with email and a modern internet browser
      - internet service via WIFI, ethernet cable or mobile data plan (3G or above)
      - capability to send and receive email, browse the internet, download documents and play videos.
    translation: |-
      - מכשיר עדכני — מחשב, טאבלט או טלפון חכם עם גישה לדוא״ל ודפדפן אינטרנט מודרני
      - חיבור לאינטרנט באמצעות WIFI, כבל רשת או חבילת גלישה סלולרית (3G ומעלה)
      - יכולת לשלוח ולקבל דוא״ל, לגלוש באינטרנט, להוריד מסמכים ולהפעיל סרטונים.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4496ce2ee6172b32:
    english: Loomio works with all standard internet browsers such as Google Chrome, Microsoft Edge, Firefox and Apple Safari. Old out-of-date browsers such as Microsoft Internet Explorer may not work.
    translation: Loomio פועלת בכל הדפדפנים הנפוצים, כגון Google Chrome, Microsoft Edge, Firefox ו־Apple Safari. דפדפנים ישנים שאינם מעודכנים, כגון Microsoft Internet Explorer, עלולים שלא לפעול.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bd5dc5f2d0f56a28:
    english: If you have a problem using Loomio on your device, [Contact Loomio support](/contact).
    translation: אם יש בעיה בשימוש ב־Loomio במכשיר, ניתן [לפנות לתמיכה של Loomio](/contact).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ca7b25bb2d86ba90:
    english: "## Configure your group"
    translation: "## הגדרת הקבוצה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  92712f3a984128af:
    english: |-
      ### Group Description
      The group description is the first place people see when they arrive into your Loomio group. Write it to help new members  understand the purpose of the group and the work you will do together. Provide any other information that orients people and encourages them to participate.
    translation: |-
      ### תיאור הקבוצה
      תיאור הקבוצה הוא הדבר הראשון שרואים כשנכנסים לקבוצה ב־Loomio. כדאי לכתוב אותו כך שחברים חדשים יבינו את מטרת הקבוצה ואת העבודה המשותפת. אפשר להוסיף מידע שיעזור להתמצא בקבוצה ולהשתתף בה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7e018e436df9afa1:
    english: 'For example, welcome people and let them know that this is there online space for communication and governance of your organization:'
    translation: 'לדוגמה, אפשר לברך את המצטרפים ולהסביר שזהו המרחב המקוון לתקשורת ולניהול הארגון:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  826a76aa71e6d689:
    english: |-
      - Remind members of the purpose of the board or committee.
      - Outline how you intend to use Loomio; prepare for meetings, progress discussions, make decisions and stay in context between meetings.
      - Be clear who has access to the group, can read and participate.
      - Attach or link any background or governance documents.
    translation: |-
      - להזכיר לחברים מהי מטרת הדירקטוריון או הוועדה.
      - לתאר כיצד ייעשה שימוש ב־Loomio: הכנה לישיבות, קידום דיונים, קבלת החלטות ושמירה על רצף העבודה בין ישיבות.
      - להבהיר למי יש גישה לקבוצה ומי יכולים לקרוא ולהשתתף.
      - לצרף מסמכי רקע ומסמכי ממשל או לקשר אליהם.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  00c14924ec3f24cb:
    english: |-
      ### Check privacy and permission settings
      Loomio groups are **Secret** by default, which means only the people you specifically invite to the group know of its existence.
    translation: |-
      ### בדיקת הגדרות פרטיות והרשאות
      קבוצות ב־Loomio הן **סודי** כברירת מחדל. פירוש הדבר הוא שרק מי שהוזמנו לקבוצה יודעים על קיומה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9158ac7ea9b0db99:
    english: See [member permissions](/en/user_manual/groups/settings#permissions), and set to suit the proficiency of members in your group.  It may help to remove some permissions to avoid confusion as you are starting out. You can always restore permissions and everyone becomes more familiar with Loomio.
    translation: יש לעיין ב[הרשאות החברים](/en/user_manual/groups/settings#permissions) ולהתאים אותן למיומנות של חברי הקבוצה. בתחילת הדרך, צמצום של חלק מההרשאות עשוי למנוע בלבול. תמיד אפשר להחזיר אותן לאחר שהחברים יכירו טוב יותר את Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6a139f43ad2871f8:
    english: |-
      ### Category tags
      Add [category tags](/en/user_manual/discussions/tags/) to suit your organization.  Setting these in advance will help everyone use tags and find the threads and info they are looking for.
    translation: |-
      ### תגי קטגוריה
      יש להוסיף [תגי קטגוריה](/en/user_manual/discussions/tags/) המתאימים לארגון. הגדרתם מראש תעזור לכולם להשתמש בתגים ולמצוא את השרשורים והמידע הדרושים להם.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7435f3589b1f26e3:
    english: |-
      ### Set up your personal profile
      Your [personal profile](/en/user_manual/users/user_profile) will help members of your group easily identify you, and have confidence that the messages they receive from you actually come from you.
    translation: |-
      ### הגדרת הפרופיל האישי
      [הפרופיל האישי](/en/user_manual/users/user_profile) מסייע לחברי הקבוצה לזהות את הנהלת הקבוצה ולדעת ממי הגיעו ההודעות שנשלחות אליהם.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cf3684fe138b05fe:
    english: |-
      ### Manage group membership
      Make sure all the members of your board or committee have been [invited](/en/user_manual/groups/inviting_people/) to the group, and accepted their invitation.
    translation: |-
      ### ניהול החברות בקבוצה
      יש לוודא שכל חברי הדירקטוריון או הוועדה [הוזמנו](/en/user_manual/groups/inviting_people/) לקבוצה וקיבלו את ההזמנה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '029e18cb13c89e7b':
    english: "### Start with a board process"
    translation: "### התחלה בתהליך של הדירקטוריון"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ba8a6193de9c928f:
    english: The general introduction guide explains how to help everyone comment and vote once. For a board, follow that practice with one recurring governance process, such as preparing an agenda, approving minutes, reviewing a report, or making a small out-of-session decision.
    translation: מדריך ההיכרות הכללי מסביר כיצד לעזור לכולם להגיב ולהצביע פעם אחת. בדירקטוריון, כדאי להמשיך משם לתהליך ממשל אחד שחוזר על עצמו, כגון הכנת סדר יום, אישור פרוטוקול, סקירת דוח או קבלת החלטה קטנה בין ישיבות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f7c156fde7984f49:
    english: Agree whether decisions made in Loomio take effect when their outcome is published or must be ratified at the next meeting. Record the agreed quorum, vote threshold, eligible voters, and ratification process in the group description or governance documents.
    translation: יש להסכים אם החלטות שמתקבלות ב־Loomio נכנסות לתוקף עם פרסום המסקנה שלהן, או שנדרש לאשרר אותן בישיבה הבאה. יש לתעד את המניין החוקי, סף ההצבעה, בעלי זכות ההצבעה ותהליך האשרור שעליהם הוסכם בתיאור הקבוצה או במסמכי הממשל.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
