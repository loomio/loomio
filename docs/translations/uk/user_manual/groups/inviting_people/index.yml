---
navigation_title: Запрошення людей
blocks:
  47820acef0cf3fe9:
    english: "# Inviting people"
    translation: "# Запрошення людей"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6a2bc749ec2883c0:
    english: Go to your group page and click the **Members** tab to access member management.
    translation: Перейдіть на сторінку своєї групи й відкрийте вкладку **Учасники**, щоб керувати її учасниками.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7fc9a792512e50bb:
    english: You can **Invite** particular people to your group with their email address or **Share** a link to your group via email, newsletter, chat or from your website.
    translation: Ви можете **Запросити** окремих людей до групи за електронною адресою або **Поширити** посилання на групу електронною поштою, в розсилці, чаті чи на своєму сайті.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3fc7875402babd63:
    english: "## Send invitations via email"
    translation: "## Надсилання запрошень електронною поштою"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4e91c3f036e94808:
    english: Click **Invite** on the **Members** tab to send an email containing a single-use invitation link. The recipient can create a Loomio user account and join your group.
    translation: На вкладці **Учасники** натисніть **Запросити**, щоб надіслати листа з одноразовим посиланням для запрошення. Одержувач зможе створити обліковий запис Loomio й приєднатися до вашої групи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  37a98960a11df300:
    english: If the recipient already has a Loomio user account they can still accept the invitation to join your group with their existing account.
    translation: Якщо одержувач уже має обліковий запис Loomio, він зможе прийняти запрошення й приєднатися до вашої групи з цього облікового запису.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c40b8865bc90ab0b:
    english: "### Invite many at once"
    translation: "### Запрошення багатьох людей одночасно"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f92bf789ad23e4c3:
    english: You can send invitations by email to up to 100 people at a time by entering (or copy/pasting) multiple email addresses into the "Who would you like to invite" box. Separate email addresses by comma or space.
    translation: Ви можете надіслати запрошення електронною поштою щонайбільше 100 людям одночасно. Для цього введіть або вставте кілька електронних адрес у поле «Кого б ви хотіли запросити?». Розділяйте адреси комами або пробілами.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1e8ea8567d051081:
    english: When inviting people to a group within an organization, the parent group and related subgroups you belong to appear as audience suggestions. Select a group, then select its chip to expand the audience into individual people. You can remove anyone you do not want to invite before sending the invitations. People who already belong to the destination group are excluded.
    translation: Коли ви запрошуєте людей до групи в межах організації, серед запропонованих одержувачів з’являються батьківська група й пов’язані підгрупи, до яких ви належите. Виберіть групу, а потім натисніть на її позначку, щоб побачити окремих людей. Перед надсиланням запрошень ви можете вилучити зі списку тих, кого не хочете запрошувати. Людей, які вже належать до групи призначення, буде виключено.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  23c96c665ed9ad1c:
    english: |-
      >[!Tip]
      >Copy email addresses from a column in a Google or Excel spreadsheet, and paste into the invitation box.
    translation: |-
      >[!Tip]
      >Скопіюйте електронні адреси зі стовпця таблиці Google або Excel і вставте їх у поле запрошення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  697177b4211a5479:
    english: When you click **Invite** an email will be sent to each of the email addresses you supplied, containing a unique invitation link that can only be used once. This email will be sent in your current language.
    translation: Коли ви натиснете **Запросити**, на кожну вказану електронну адресу надійде лист з унікальним одноразовим посиланням для запрошення. Лист буде написано мовою, яку ви зараз використовуєте.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bcce66d3fb6f6b8e:
    english: "### Invite people to Subgroups"
    translation: "### Запрошення людей до підгруп"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e422dfc71ef2fe0:
    english: Following the same process as above, you can invite people to a 'parent' group, and one or more subgroups simultaneously when you invite them with the **Invite people** button. Tick the boxes next to the subgroups you want them to immediately be a part of when they join the group.
    translation: Так само ви можете одночасно запросити людей до батьківської групи й однієї або кількох підгруп за допомогою кнопки **Запросити людей**. Позначте підгрупи, до яких вони мають приєднатися разом із групою.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  87f0b0c3281b6228:
    english: "## Share a link to your group"
    translation: "## Поширення посилання на групу"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2f014bdf9b719ec0:
    english: You can share a link to your group with the **Share** button. This is useful if you want to send a link via email, newsletter, chat or post on your website.
    translation: За допомогою кнопки **Поширити** ви можете отримати посилання на свою групу й надіслати його електронною поштою, в розсилці чи чаті або розмістити на своєму сайті.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  18ff20426c02846e:
    english: Click on the "copy" icon to copy the link to your clipboard, then paste in your email, newsletter or chat channel.
    translation: Натисніть значок «копіювати», щоб скопіювати посилання до буфера обміну, а потім вставте його в лист, розсилку або чат.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c6506b3c529f683c:
    english: If you want to stop people from joining via this link, click "Reset this link". The existing link will no longer work and a new link will be created.
    translation: Якщо ви хочете припинити приєднання за цим посиланням, натисніть «Скинути це посилання». Старе посилання перестане працювати, і буде створено нове.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6d57daddf1df6a2d:
    english: "## Request to join group"
    translation: "## Запит на приєднання до групи"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  70b9af34b3bc2a9e:
    english: People can request to join an Open or Closed group. Share the group URL, such as `https://www.loomio.com/group-name`. When people arrive at the group page, they can see the public group information and select **Join group** to answer the joining prompt and send their request.
    translation: Люди можуть надіслати запит на приєднання до відкритої або закритої групи. Поширте адресу групи, наприклад `https://www.loomio.com/group-name`. На сторінці групи вони зможуть переглянути відкриту інформацію, натиснути **Приєднатися до групи**, відповісти на запитання для вступу й надіслати запит.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a5534ae2aba161ba:
    english: The joining prompt gives people a chance to introduce themselves and explain why they want to join.
    translation: Запитання для вступу дає людям змогу представитися й пояснити, чому вони хочуть приєднатися.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bb13bbdbfd6da80b:
    english: Under [Group privacy](/en/user_manual/groups/settings/privacy#how-people-join), choose **Request approval** to require requests to be reviewed. You can also customize the joining prompt in the group settings.
    translation: У розділі [Конфіденційність групи](/en/user_manual/groups/settings/privacy#how-people-join) виберіть **Вимагати схвалення**, якщо запити потрібно розглядати. Ви також можете змінити запитання для вступу в налаштуваннях групи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5b0e7c47a0518a3e:
    english: "### Review membership requests"
    translation: "### Розгляд запитів на участь"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d4a03352457d41cb:
    english: 'Group administrators and members with permission to add members review requests from the **Membership requests** section of the **Members** tab. A reviewer can:'
    translation: 'Адміністратори групи й учасники з дозволом додавати нових учасників розглядають запити в розділі **Запити на участь** вкладки **Учасники**. Той, хто розглядає запит, може:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  84c6d641f9dba801:
    english: |-
      - **Approve** the request to add the applicant as a member and notify them.
      - **Ignore** the request to close it without notifying the applicant or allowing another request.
      - **Decline** the request with a message explaining the decision. Loomio sends the message to the applicant by email and notification, and they can submit a new request.
    translation: |-
      - **Підтримую** запит, щоб додати заявника до групи й повідомити його.
      - **Ігнорувати** запит, щоб закрити його без повідомлення заявника й без можливості надіслати повторний запит.
      - **Відхилення** запиту з поясненням рішення. Loomio надішле заявнику повідомлення електронною поштою та сповіщенням. Після цього він зможе подати новий запит.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b1de5132fa942ba8:
    english: Select the decline button to write a message or ignore the request.
    translation: Натисніть кнопку відхилення, щоб написати повідомлення, або проігноруйте запит.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a87e3fdd4ce43ee9:
    english: "## Managing invitations"
    translation: "## Керування запрошеннями"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  84dc2f66c60f3237:
    english: To manage invitations, open the filter/ drop down from the Members tab of your Group page and select **Invitations**. You can manage individual invitations by clicking the three dot menu (**⋮**) to the right of the member.
    translation: Щоб керувати запрошеннями, відкрийте спадний список фільтрів на вкладці «Учасники» сторінки групи й виберіть **Запрошення**. Щоб керувати окремим запрошенням, натисніть меню з трьома крапками (**⋮**) праворуч від імені учасника.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c8d12991b8edb22f:
    english: You can also make people administrators or set their title (e.g. "IT Support") within the group before they accept their invitation.
    translation: Ви також можете призначити запрошених людей адміністраторами або вказати їхню роль у групі, наприклад «ІТ-підтримка», ще до того, як вони приймуть запрошення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e8aec784f84451cc:
    english: "### Re-send invitations"
    translation: "### Повторне надсилання запрошень"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c201c2b360b1877:
    english: Follow up on people who don't make it into the group and give them a nudge. If someone has lost or forgotten about their invitation email, you can re-send it from the dropdown menu beside their name on the Members page.
    translation: Якщо людина не приєдналася до групи, ви можете нагадати їй про запрошення. Якщо вона загубила лист із запрошенням або забула про нього, надішліть запрошення повторно через спадне меню біля її імені на сторінці учасників.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8b4674400f9a3f09:
    english: Click on the three dots (**⋮**) next to the person you want to resend the invitation to, and then choose **Resend invitation**.
    translation: Натисніть три крапки (**⋮**) біля імені людини, якій хочете повторно надіслати запрошення, а потім виберіть **Запросити повторно**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  abc5a934440fb8e1:
    english: |-
      ### Cancelling invitations
      If you entered the wrong email address, or have changed your mind about inviting someone, you can cancel an invitation from the Members tab on your Group page. Select **Cancel Invitation** from the drop down menu to the right of the member invitation (**⋮**).
    translation: |-
      ### Скасування запрошень
      Якщо ви вказали неправильну електронну адресу або передумали запрошувати людину, скасуйте запрошення на вкладці «Учасники» сторінки групи. Виберіть **Скасувати запрошення** у спадному меню праворуч від запрошення (**⋮**).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
