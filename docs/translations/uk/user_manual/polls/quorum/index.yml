  '038bd6f53f9e8861':
    english: "# Quorum"
    translation: "# Кворум"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a79abb23e8e1c82f:
    english: A quorum is the minimum percentage of eligible voters who must participate for a poll to be valid. Use it when your governance process requires a particular level of participation.
    translation: Кворум — це мінімальний відсоток виборців із правом голосу, які мають взяти участь, щоб опитування вважалося дійсним. Використовуйте його, якщо для ухвалення рішення потрібен певний рівень участі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d83e75068f697f6f:
    english: When creating a poll, open **More settings** and enter the required percentage in **Participation quorum**. Leave the field blank when no quorum is required.
    translation: Під час створення опитування відкрийте **Більше налаштувань** і введіть потрібний відсоток у полі **Кворум участі**. Якщо кворум не потрібен, залиште поле порожнім.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a04b99724fe62a56:
    english: "![The Quorum setting with a 60 percent participation quorum](./quorum-section.png)"
    translation: "![Налаштування кворуму з вимогою участі 60 відсотків](./quorum-section.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  432f570094ad5b24:
    english: You can also set a quorum in a [poll template](/en/user_manual/polls/poll_templates/) so that polls created from that template use it by default.
    translation: Кворум також можна встановити в [шаблоні опитування](/en/user_manual/polls/poll_templates/). Тоді він за замовчуванням застосовуватиметься до опитувань, створених із цього шаблону.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  52841ec4c6253973:
    english: "## Example scenario"
    translation: "## Приклад"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  96ded9027f394b57:
    english: Oatmilk Cooperative is discussing a six-week returnable bottle trial. The discussion has reached the point where the cooperative needs to approve the trial budget.
    translation: Кооператив «Вівсяне молоко» обговорює шеститижневе випробування поворотних пляшок. Настав час затвердити бюджет випробування.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7acd5f99c209cec0:
    english: Jamie selects **Start a vote**, chooses the **Consent** proposal template, and completes the title, details, options, duration, and voter settings.
    translation: Джеймі вибирає **Розпочати голосування**, обирає шаблон пропозиції **Згода** та заповнює назву, опис, варіанти відповіді, тривалість і налаштування виборців.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c5bd111a40bc588f:
    english: "![The proposal title, details, options, duration, and voter settings](proposal-options.png)"
    translation: "![Назва й опис пропозиції, варіанти відповіді, тривалість і налаштування виборців](proposal-options.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7ba26dd025983d8d:
    english: Jamie limits the vote to the five people responsible for the trial budget.
    translation: Джеймі обмежує участь у голосуванні п’ятьма людьми, відповідальними за бюджет випробування.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ef25fbaed498cfbe:
    english: The cooperative requires 60 percent participation for significant decisions, so Jamie enters **60** in the participation quorum field and starts the proposal.
    translation: Для важливих рішень кооператив вимагає участі 60 відсотків виборців. Тому Джеймі вводить **60** у полі кворуму участі та розпочинає голосування за пропозицію.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b1cd37eb5ed44589:
    english: Before anyone votes, the results panel shows that the quorum has not been reached.
    translation: Поки ніхто не проголосував, панель результатів показує, що кворуму не досягнуто.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1b8a41f8c5939665:
    english: "![No votes cast and the 60 percent quorum not yet reached](pie-chart-0.png)"
    translation: "![Голосів ще немає, кворуму участі 60 відсотків не досягнуто](pie-chart-0.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ff36e799ac095caf:
    english: Jamie agrees and Samira disagrees. The chart updates, but two of five eligible voters is only 40 percent participation, so the quorum is still not reached.
    translation: Джеймі погоджується, а Саміра не погоджується. Діаграма оновлюється, але двоє з п’яти виборців — це лише 40 відсотків участі. Кворуму все ще не досягнуто.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7ad216922d5d4dcb:
    english: "![Two of five votes cast and the quorum not yet reached](pie-chart-40.png)"
    translation: "![Проголосували двоє з п’яти виборців, кворуму не досягнуто](pie-chart-40.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  554dc5536fdb1a60:
    english: Alex then agrees. Three of five eligible voters have participated, reaching the 60 percent quorum. The requirement now shows a green check mark. Jamie can close the poll early or wait for the remaining voters.
    translation: Потім Алекс погоджується. Участь взяли троє з п’яти виборців, тож кворуму 60 відсотків досягнуто. Поруч із вимогою з’являється зелена позначка. Джеймі може закрити опитування достроково або дочекатися решти виборців.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
