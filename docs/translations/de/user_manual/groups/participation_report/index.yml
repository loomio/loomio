  05aecaed54955302:
    english: This shows how frequently various tags have been applied during the specified time frame.  For example, you can see the number of decisions using a particular decision process or template.
    translation: Hier siehst du, wie häufig einzelne Tags im ausgewählten Zeitraum verwendet wurden. Du kannst zum Beispiel sehen, wie viele Entscheidungen einen bestimmten Entscheidungsprozess oder eine bestimmte Vorlage verwenden.
    status: machine
    provider: codex/gpt-6-sol
