---
navigation_title: API de usuario
blocks:
  0217b93dddc627ac:
    english: "# Loomio User API documentation"
    translation: "# Documentación de la API de usuario de Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bc6fcbf5f783fd29:
    english: "<!-- seo-description: Use the Loomio User API to create and manage discussions, comments, polls, threads, and group memberships from other software. -->"
    translation: "<!-- seo-description: Usa la API de usuario de Loomio para crear y gestionar discusiones, comentarios, sondeos, hilos y pertenencias a grupos desde otro software. -->"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cc2da08540808ada:
    english: "`/api/b2` is the user-oriented API for integrations with Loomio. It uses the API key of a user account, and every action is performed as that user."
    translation: "`/api/b2` es la API de usuario para integraciones con Loomio. Usa la clave de API de una cuenta de usuario y realiza cada acción en nombre de esa persona."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7036a6661aac00f2:
    english: Group operations use the memberships and group permissions of the API-key user. Instance-administrator status does not expand an API key's access to groups or content; use the Server API for instance-level administration.
    translation: Las operaciones de grupo se rigen por las pertenencias y los permisos de grupo de la persona titular de la clave de API. Ser administrador de la instancia no amplía el acceso de la clave a grupos ni a contenidos. Para administrar la instancia, usa la API de servidor.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c4436493b062b9f1:
    english: Use the API key from the Loomio user account that will perform the actions. A dedicated bot account is useful when an integration should not be invited to polls or receive notifications.
    translation: Usa la clave de API de la cuenta de Loomio que realizará las acciones. Una cuenta de bot dedicada puede ser útil si la integración no debe recibir invitaciones a sondeos ni notificaciones.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ade21c593f08100c:
    english: Signed-in users can find their API key and group IDs on the [API access page](/profile/api_access).
    translation: Si has iniciado sesión, puedes encontrar tu clave de API y los identificadores de tus grupos en la [página de acceso a la API](/profile/api_access).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  15160edafaf441c1:
    english: 'Send the API key in an `Authorization: Bearer` header. API keys in query strings are rejected because URLs can be recorded by proxies and access logs.'
    translation: 'Envía la clave de API en una cabecera `Authorization: Bearer`. Se rechazan las claves de API en las cadenas de consulta porque los servidores proxy y los registros de acceso pueden guardar las URL.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2215e57186277325:
    english: "### Authentication change"
    translation: "### Cambio en la autenticación"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ff5f4c1055e80fb6:
    english: 'The API key was previously accepted as an `api_key` URL parameter. Requests using `?api_key=YOUR_API_KEY` no longer work. Use the HTTP `Authorization` header instead:'
    translation: 'Antes se aceptaba la clave de API como parámetro de URL `api_key`. Las solicitudes que usan `?api_key=YOUR_API_KEY` ya no funcionan. Usa la cabecera HTTP `Authorization`:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  65574ba500243c80:
    english: The examples use `YOUR_API_KEY`, group ID `123`, and `https://www.loomio.com/`. Replace these with your API key, group ID, and Loomio installation URL.
    translation: Los ejemplos usan `YOUR_API_KEY`, el identificador de grupo `123` y `https://www.loomio.com/`. Sustitúyelos por tu clave de API, el identificador de tu grupo y la URL de tu instalación de Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bec1e4f30aeef4ce:
    english: "## Response size and related records"
    translation: "## Tamaño de las respuestas y registros relacionados"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  da004eb4e005fae1:
    english: 'User API responses use a compound format: the primary records are accompanied by related records such as topics, groups, users, polls, and reactions. This lets a client populate a local record store from one request, but can include more data than a simple integration needs.'
    translation: 'Las respuestas de la API de usuario tienen un formato compuesto: los registros principales van acompañados de registros relacionados, como temas, grupos, usuarios, sondeos y reacciones. Así, un cliente puede llenar su almacén local de registros con una sola solicitud, aunque la respuesta puede incluir más datos de los que necesita una integración sencilla.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  64d9a631b54cbaba:
    english: Pass `compact=1` to omit bulky related topics, groups, parent groups, memberships, reactions, tags, and translations. Primary records and the related records needed to interpret their content remain present.
    translation: Usa `compact=1` para omitir los temas, grupos, grupos principales, pertenencias, reacciones, etiquetas y traducciones relacionados que ocupan más espacio. Se mantienen los registros principales y los registros relacionados necesarios para interpretar su contenido.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e4e671db39dbe6f1:
    english: For direct control, pass `exclude_types` with space-separated singular record types. For example, `exclude_types=group reaction` omits related groups and reactions. Common values are `topic`, `group`, `parent`, `membership`, `reaction`, `tag`, `translation`, `user`, `discussion`, `poll`, `poll_option`, `stance`, `stance_choice`, `outcome`, and `topic_item`. Exclusions apply to related records, not the primary resource requested by the endpoint.
    translation: Para controlar las exclusiones directamente, usa `exclude_types` con tipos de registro en singular separados por espacios. Por ejemplo, `exclude_types=group reaction` omite los grupos y las reacciones relacionados. Los valores habituales son `topic`, `group`, `parent`, `membership`, `reaction`, `tag`, `translation`, `user`, `discussion`, `poll`, `poll_option`, `stance`, `stance_choice`, `outcome` y `topic_item`. Las exclusiones se aplican a los registros relacionados, no al recurso principal solicitado al endpoint.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ded075da3c2aa815:
    english: Collection responses include `meta.total` when an exact collection size is defined. The total is calculated before `limit` and `offset` are applied. Endpoints such as search that intentionally return a bounded result set omit `meta.total` rather than returning `null`.
    translation: Las respuestas de colecciones incluyen `meta.total` cuando se conoce el tamaño exacto de la colección. El total se calcula antes de aplicar `limit` y `offset`. Los endpoints como el de búsqueda, que devuelven deliberadamente un conjunto limitado de resultados, omiten `meta.total` en lugar de devolver `null`.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  17cb8ef90a2acdb3:
    english: "## Endpoint summary"
    translation: "## Resumen de endpoints"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  608edb13080e57c2:
    english: |-
      | Method | Endpoint | Purpose |
      | --- | --- | --- |
      | `GET` | `/api/b2/groups` | List the API-key user's groups |
      | `GET` | `/api/b2/groups/:id_or_key_or_handle` | Get a visible group |
      | `GET` | `/api/b2/reports` | Generate a participation report |
      | `GET` | `/api/b2/search` | Search visible discussions, comments, polls, votes, and outcomes |
      | `POST` | `/api/b2/discussions` | Create a discussion |
      | `GET` | `/api/b2/discussions/:id` | Get a discussion |
      | `GET` | `/api/b2/discussions` | List discussions in a group |
      | `PATCH` | `/api/b2/discussions/:id` | Edit a discussion |
      | `DELETE` | `/api/b2/discussions/:id` | Soft-delete a discussion |
      | `GET` | `/api/b2/threads` | List visible discussion and standalone-poll threads |
      | `GET` | `/api/b2/threads/:topic_id` | Get a thread |
      | `GET` | `/api/b2/threads/:topic_id/items` | Get the ordered items in a thread |
      | `GET` | `/api/b2/threads/:topic_id/markdown` | Get a complete thread as Markdown |
      | `POST` | `/api/b2/comments` | Create a comment or reply |
      | `PATCH` | `/api/b2/comments/:id` | Edit a comment |
      | `DELETE` | `/api/b2/comments/:id` | Soft-delete a comment |
      | `POST` | `/api/b2/polls` | Create a poll |
      | `GET` | `/api/b2/polls/:id` | Get a poll |
      | `GET` | `/api/b2/polls` | List polls in a group |
      | `PATCH` | `/api/b2/polls/:id` | Edit a poll |
      | `DELETE` | `/api/b2/polls/:id` | Soft-delete a poll |
      | `GET` | `/api/b2/memberships` | List a group's memberships |
      | `POST` | `/api/b2/memberships` | Add members and optionally remove absent members |
      | `GET` | `/api/b2/chatbots` | List a group's chat integrations and webhooks |
      | `POST` | `/api/b2/chatbots` | Create a chat integration or webhook |
      | `PATCH` | `/api/b2/chatbots/:id` | Update a chat integration or webhook |
      | `DELETE` | `/api/b2/chatbots/:id` | Delete a chat integration or webhook |
      | `POST` | `/api/b2/chatbots/check` | Send a webhook connection test |
    translation: |-
      | Método | Endpoint | Función |
      | --- | --- | --- |
      | `GET` | `/api/b2/groups` | Listar los grupos de la persona titular de la clave de API |
      | `GET` | `/api/b2/groups/:id_or_key_or_handle` | Obtener un grupo visible |
      | `GET` | `/api/b2/reports` | Generar un informe de participación |
      | `GET` | `/api/b2/search` | Buscar discusiones, comentarios, sondeos, votos y conclusiones visibles |
      | `POST` | `/api/b2/discussions` | Crear una discusión |
      | `GET` | `/api/b2/discussions/:id` | Obtener una discusión |
      | `GET` | `/api/b2/discussions` | Listar las discusiones de un grupo |
      | `PATCH` | `/api/b2/discussions/:id` | Editar una discusión |
      | `DELETE` | `/api/b2/discussions/:id` | Eliminar una discusión sin borrar su registro |
      | `GET` | `/api/b2/threads` | Listar los hilos visibles de discusiones y sondeos independientes |
      | `GET` | `/api/b2/threads/:topic_id` | Obtener un hilo |
      | `GET` | `/api/b2/threads/:topic_id/items` | Obtener los elementos de un hilo en orden |
      | `GET` | `/api/b2/threads/:topic_id/markdown` | Obtener un hilo completo en Markdown |
      | `POST` | `/api/b2/comments` | Crear un comentario o una respuesta |
      | `PATCH` | `/api/b2/comments/:id` | Editar un comentario |
      | `DELETE` | `/api/b2/comments/:id` | Eliminar un comentario sin borrar su registro |
      | `POST` | `/api/b2/polls` | Crear un sondeo |
      | `GET` | `/api/b2/polls/:id` | Obtener un sondeo |
      | `GET` | `/api/b2/polls` | Listar los sondeos de un grupo |
      | `PATCH` | `/api/b2/polls/:id` | Editar un sondeo |
      | `DELETE` | `/api/b2/polls/:id` | Eliminar un sondeo sin borrar su registro |
      | `GET` | `/api/b2/memberships` | Listar las pertenencias a un grupo |
      | `POST` | `/api/b2/memberships` | Añadir integrantes y, opcionalmente, quitar a quienes no figuren en la lista |
      | `GET` | `/api/b2/chatbots` | Listar las integraciones de chat y los webhooks de un grupo |
      | `POST` | `/api/b2/chatbots` | Crear una integración de chat o un webhook |
      | `PATCH` | `/api/b2/chatbots/:id` | Actualizar una integración de chat o un webhook |
      | `DELETE` | `/api/b2/chatbots/:id` | Eliminar una integración de chat o un webhook |
      | `POST` | `/api/b2/chatbots/check` | Enviar una prueba de conexión de un webhook |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0473f1f7fb78f074:
    english: "## Groups"
    translation: "## Grupos"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dc819221f371c435:
    english: "### List groups"
    translation: "### Listar grupos"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  964f575e90aa9cde:
    english: Return the groups in which the API-key user has an active membership.
    translation: Devuelve los grupos en los que la persona titular de la clave de API tiene una pertenencia activa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3835e6e77bc0ad10:
    english: "`GET /api/b2/groups`"
    translation: "`GET /api/b2/groups`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4f588e981afc3069:
    english: The response contains all matching records in a non-paginated `groups` array. It includes parent groups and subgroups, including groups whose subscription is not currently active. Check the `enabled` field when an integration should operate only on enabled groups.
    translation: La respuesta contiene todos los registros coincidentes en un array `groups` sin paginación. Incluye grupos principales y subgrupos, incluso si su suscripción no está activa en ese momento. Comprueba el campo `enabled` si la integración solo debe operar con grupos habilitados.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  213de8ce539a42c3:
    english: 'Important group fields include:'
    translation: 'Estos son algunos campos importantes de los grupos:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d377f7c9b224a6d7:
    english: |-
      | Field | Description |
      | --- | --- |
      | `id` | Numeric group ID used by other User API endpoints |
      | `key` | Stable short key used in Loomio URLs |
      | `handle` | Human-readable group handle |
      | `name` | Group name |
      | `full_name` | Group name including its parent-group context |
      | `parent_id` | Numeric parent-group ID for a subgroup, otherwise `null` |
      | `enabled` | Whether the group and its subscription are active |
      | `memberships_count` | Number of active and pending memberships |
      | `accepted_memberships_count` | Number of accepted memberships |
      | `pending_memberships_count` | Number of pending invitations |
      | `admin_memberships_count` | Number of group administrators |
      | `delegates_count` | Number of delegates |
      | `discussions_count` | Number of discussions directly in the group |
      | `polls_count` | Number of polls directly in the group |
      | `subgroups_count` | Number of subgroups |
    translation: |-
      | Campo | Descripción |
      | --- | --- |
      | `id` | Identificador numérico del grupo que usan otros endpoints de la API de usuario |
      | `key` | Clave corta y estable usada en las URL de Loomio |
      | `handle` | Identificador legible del grupo |
      | `name` | Nombre del grupo |
      | `full_name` | Nombre del grupo con el contexto de su grupo principal |
      | `parent_id` | Identificador numérico del grupo principal de un subgrupo; en caso contrario, `null` |
      | `enabled` | Indica si el grupo y su suscripción están activos |
      | `memberships_count` | Número de pertenencias activas y pendientes |
      | `accepted_memberships_count` | Número de pertenencias aceptadas |
      | `pending_memberships_count` | Número de invitaciones pendientes |
      | `admin_memberships_count` | Número de administradores del grupo |
      | `delegates_count` | Número de delegados |
      | `discussions_count` | Número de discusiones directamente en el grupo |
      | `polls_count` | Número de sondeos directamente en el grupo |
      | `subgroups_count` | Número de subgrupos |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  34f1693ba28fcb80:
    english: The response may include additional group settings, related parent-group records and the API user's memberships. Clients should ignore fields they do not use.
    translation: La respuesta puede incluir otros ajustes del grupo, registros relacionados del grupo principal y las pertenencias de la persona titular de la clave de API. Los clientes deben ignorar los campos que no utilicen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d7c327b8ed7f7bf2:
    english: "### Get a group"
    translation: "### Obtener un grupo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  15ab63bc2d396657:
    english: Return one group visible to the API-key user.
    translation: Devuelve un grupo visible para la persona titular de la clave de API.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8ba2cc9e3c67b1dd:
    english: "`GET /api/b2/groups/:id_or_key_or_handle`"
    translation: "`GET /api/b2/groups/:id_or_key_or_handle`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  71e5812ff9890c9b:
    english: The identifier can be the group's numeric ID, key or handle.
    translation: Puedes identificar el grupo por su identificador numérico, clave o identificador legible.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8ba79a283b7b77d5:
    english: The response contains the group in the `groups` array and uses the same fields as the list endpoint. A request for a group the API-key user cannot access returns a permission error.
    translation: La respuesta contiene el grupo en el array `groups` y usa los mismos campos que el endpoint de listado. Si la persona titular de la clave de API no puede acceder al grupo solicitado, se devuelve un error de permisos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  18d823df4d7f8fac:
    english: "## Webhooks"
    translation: "## Webhooks"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f33d58fc1f2fd84c:
    english: 'The User API is request-based: an integration calls Loomio when it wants to read or change data. A group webhook provides the push direction. Loomio sends selected group events to your endpoint as they happen, so an integration does not need to poll the REST API for changes.'
    translation: 'La API de usuario funciona mediante solicitudes: una integración llama a Loomio cuando quiere leer o cambiar datos. Un webhook de grupo permite recibir cambios automáticamente. Loomio envía a tu endpoint los eventos seleccionados del grupo cuando ocurren, por lo que la integración no necesita consultar periódicamente la API REST.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3b5b4b0ac52b9010:
    english: 'Webhooks are configured per group and require group-administrator permission. They can be managed through the Loomio interface:'
    translation: 'Los webhooks se configuran por grupo y requieren permisos de administrador del grupo. Puedes gestionarlos desde la interfaz de Loomio:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  318710be7b3aae7d:
    english: |-
      1. Open the group.
      2. Open the group menu and select **Chat integrations**.
      3. Add the integration matching the payload format your endpoint accepts. For a general-purpose endpoint, use the Mattermost/Markdown format.
      4. Enter a name and the destination URL.
      5. Select the events that Loomio should send automatically.
      6. Save the integration and use **Test connection** to send a test message.
    translation: |-
      1. Abre el grupo.
      2. Abre el menú del grupo y selecciona **Integraciones de chat**.
      3. Añade la integración cuyo formato de datos acepte tu endpoint. Para un endpoint de uso general, usa el formato Mattermost/Markdown.
      4. Introduce un nombre y la URL de destino.
      5. Selecciona los eventos que Loomio debe enviar automáticamente.
      6. Guarda la integración y usa **Conexión de prueba** para enviar un mensaje de prueba.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  43fb95cf304fced6:
    english: Use an HTTPS destination with an unguessable URL. Loomio requires the destination to resolve to a public address and blocks requests to local or private network addresses.
    translation: Usa un destino HTTPS con una URL difícil de adivinar. Loomio exige que el destino se resuelva a una dirección pública y bloquea las solicitudes a direcciones de redes locales o privadas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d8d5abffe6425bea:
    english: Agents and other integrations can instead manage webhooks through the Bearer-authenticated chatbot endpoints described below. The resource is named `chatbots` for compatibility with Loomio's chat integrations, but it also represents general outgoing webhooks.
    translation: Los agentes y otras integraciones también pueden gestionar los webhooks mediante los endpoints de chatbots con autenticación Bearer descritos más abajo. El recurso se llama `chatbots` por compatibilidad con las integraciones de chat de Loomio, pero también representa webhooks salientes de uso general.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  28fb6371af33b66f:
    english: "### List webhooks"
    translation: "### Listar webhooks"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7187e5a26c3ec864:
    english: Return the chat integrations configured for a group. The API-key user must be an administrator of that group. The response includes destination URLs, so it must not be exposed to ordinary group members.
    translation: Devuelve las integraciones de chat configuradas para un grupo. La persona titular de la clave de API debe ser administradora de ese grupo. La respuesta incluye las URL de destino, por lo que no debe mostrarse a integrantes sin permisos de administración.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  788d370538bdda46:
    english: "`GET /api/b2/chatbots?group_id=123`"
    translation: "`GET /api/b2/chatbots?group_id=123`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d676ca45c3e1074a:
    english: 'The response contains a `chatbots` array with these fields:'
    translation: 'La respuesta contiene un array `chatbots` con estos campos:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ca00f7d0a52ce803:
    english: |-
      | Field | Description |
      | --- | --- |
      | `id` | Integration ID used for updates and deletion |
      | `group_id` | Group receiving the events |
      | `name` | Administrative name for the integration |
      | `kind` | `webhook` for an outgoing webhook or `matrix` for a Matrix integration |
      | `webhook_kind` | Payload format: `markdown`, `slack`, `discord`, `microsoft`, or `webex` |
      | `server` | Destination URL |
      | `event_kinds` | Events sent automatically |
      | `notification_only` | Whether messages contain only the notification headline |
    translation: |-
      | Campo | Descripción |
      | --- | --- |
      | `id` | ID de la integración utilizado para actualizarla y eliminarla |
      | `group_id` | Grupo que recibe los eventos |
