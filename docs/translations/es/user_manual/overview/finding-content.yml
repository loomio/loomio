    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  873929c0f1d06567:
    english: Select **Polls to vote on** in the sidebar to see active polls where you have been invited but have not yet voted. You can also open a group's **Polls** tab to see its active and closed polls.
    translation: Selecciona **Sondeos para votar** en la barra lateral para ver los sondeos activos a los que te han invitado y en los que aún no has votado. También puedes abrir la pestaña **Sondeos** de un grupo para ver sus sondeos activos y cerrados.
