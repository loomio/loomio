  0ce0604bb021d98f:
    english: "## Invitation"
    translation: "## La invitación"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d5fabca3934dafd:
    english: How participants are invited into a facilitated space is incredibly important. People understand huge amounts of information from the invitation, and use it to judge how a space will be held and if they belong there. The moment of invitation is in many ways the defining opportunity to set the tone and establish trust.
    translation: 'La forma de invitar a las personas a un espacio facilitado es muy importante. La invitación les da mucha información: les ayuda a entender cómo se desarrollará el espacio y a decidir si tienen un lugar en él. También es una oportunidad decisiva para marcar el tono y generar confianza.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a8d7e10a50432195:
    english: |-
      > <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../rich_200.png"> Decision making is all about communication: your group can only make good decisions together if there’s a foundation of good communication in place first. This means being clear about what the purpose of a discussion or meeting is, who needs to be involved, what the time-frame is, and what people can expect.
      >
      > — Richard Bartlett
    translation: |-
      > <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../rich_200.png"> Tomar decisiones depende de la comunicación. Tu grupo solo puede tomar buenas decisiones en conjunto si primero cuenta con una buena base de comunicación. Eso implica dejar claro para qué es la discusión o reunión, quiénes deben participar, cuánto tiempo durará y qué pueden esperar las personas.
      >
      > — Richard Bartlett
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ab260e60bf87a11d:
    english: 'Key aspects to an invitation:'
    translation: 'Aspectos clave de una invitación:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ff258493e21d7f3a:
    english: |-
      * **Background.** What is this thing? What am I being asked to do? Who is behind this? Who else will be involved? What is the time commitment, topic focus, and protocol?
      * **Context.** What is the character of this specific engagement? Of all the possible formats and ways it could go, which one will it be? Why now, why this way?
      * **Belonging.** Am I welcome? Is this for me? Am I needed in this process? What is my unique value and contribution? Why should I specifically be compelled?
      * **Safety.** Does this invitation indicate thoughtfulness, trust, and understanding? Is the structure of the engagement up to handling the inherent power dynamics at play? What level of honesty or vulnerability will this require of me? Do I think the person inviting is going to hold me well?
      * **Accessibility.** Will my basic requirements for participation be accommodated? Language, assistive technology, unfamiliar jargon, etc. Will it be possible for me to engage?
    translation: |-
      * **Antecedentes.** ¿De qué se trata? ¿Qué se me pide que haga? ¿Quién está detrás? ¿Quién más participará? ¿Cuánto tiempo tendré que dedicarle, cuál es el tema y qué protocolo se seguirá?
      * **Contexto.** ¿Cómo será esta participación en particular? Entre todos los formatos y caminos posibles, ¿cuál se ha elegido? ¿Por qué ahora y de esta manera?
      * **Pertenencia.** ¿Soy bienvenido? ¿Es para mí? ¿Hace falta mi participación? ¿Qué puedo aportar que sea propio de mí? ¿Por qué debería participar?
      * **Seguridad.** ¿La invitación transmite cuidado, confianza y comprensión? ¿La estructura prevista puede abordar las dinámicas de poder presentes? ¿Cuánta sinceridad o vulnerabilidad se esperará de mí? ¿Confío en que quien invita cuidará de mi participación?
      * **Accesibilidad.** ¿Se atenderán mis necesidades básicas para participar, como el idioma, la tecnología de apoyo o la explicación de términos desconocidos? ¿Podré participar?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aabfa9d842af2688:
    english: On Loomio
    translation: En Loomio
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8a87ed2ddb6c659f:
    english: |-
      * The tool has a built-in function to [invite users](/en/user_manual/groups/inviting_people/) by email or by sending them a special link. Users can also request to join your group if your settings allow.
      * The invitation tools built into the software are very basic, and getting an unexpected login request for new software without context isn't very inviting, so group creators often introduce people to the idea of Loomio through a separate process.
      * Many aspects of Loomio are already designed to create a safe and respectful space users would want to enter — such as thoughtful [privacy options](/en/user_manual/groups/starting_a_group/#privacy).
      * The design of the software itself is meant to be friendly, simple, and professional, hopefully putting out a trustworthy vibe.
      * Loomio has accessibility features, for people who use assistive technology like screen readers, and translation features for people who speak different languages. Emphasising these aspects in an invitation can make some people feel more welcome.
    translation: |-
      * Loomio incluye una función para [invitar a usuarios](/en/user_manual/groups/inviting_people/) por correo electrónico o mediante un enlace especial. Las personas también pueden solicitar unirse a tu grupo si la configuración lo permite.
      * Las herramientas de invitación de Loomio son básicas. Recibir una solicitud inesperada para iniciar sesión en un programa nuevo, sin contexto, puede resultar poco acogedor. Por eso, quienes crean grupos suelen presentar Loomio por otra vía antes de enviar la invitación.
      * Varios aspectos de Loomio están pensados para crear un espacio seguro y respetuoso al que las personas quieran entrar, como las [opciones de privacidad](/en/user_manual/groups/starting_a_group/#privacy).
      * El diseño de Loomio busca ser sencillo, cercano y profesional, y transmitir confianza.
      * Loomio ofrece funciones de accesibilidad para quienes usan tecnología de apoyo, como lectores de pantalla, y funciones de traducción para quienes hablan distintos idiomas. Mencionar estas opciones en la invitación puede ayudar a que más personas se sientan bienvenidas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cb459c1230aaf54c:
    english: "## Arrival"
    translation: "## La llegada"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ef55fa893f9e1034:
    english: The moment of arrival is the “first impression” of an engagement, and sets the trajectory from there on in. The person has accepted an invitation and decided to step in. They are open and expectant, and the impression they get will make a big impact on their experience.
    translation: La llegada es la primera impresión de una experiencia y marca lo que viene después. La persona ha aceptado la invitación y ha decidido entrar. Llega con disposición y expectativas, y esa primera impresión influirá mucho en su experiencia.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  66e7e79597f6a3d0:
    english: |-
      ### Welcoming
      To enable openness to engagement, participation, and receptivity, a person has to feel welcome. They need their existence acknowledged, and to feel a sense of hospitality.
    translation: |-
      ### Dar la bienvenida
      Para participar con apertura y disposición, una persona necesita sentirse bienvenida. Necesita que se reconozca su presencia y recibir una acogida cordial.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b3ce2bd5e2ea9acd:
    english: |-
      ### Settling
      When someone enters a physical room, they want to know where to sit, where the exit is, where to go to the bathroom, and if there is coffee available. They need a basic introduction to the space and their place in it.
    translation: |-
      ### Familiarizarse con el espacio
      Cuando alguien entra en una sala, quiere saber dónde sentarse, dónde está la salida, dónde está el baño y si hay café. Necesita una orientación básica sobre el espacio y su lugar en él.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d6fd9d29415a172:
    english: |-
      * The group description fields and discussion context box are the main space to put a “welcome message” for people arriving into the space.
      * Take a tour of the Loomio space, tweak things to make yourself comfortable (like [notification settings](/en/user_manual/users/email_settings/) and your [profile photo](/en/user_manual/users/user_profile/).
      * See information how you like using different thread views and options like Recent, Unread, Mute, and Star. Make yourself at home.
    translation: |-
      * Los campos de descripción del grupo y el cuadro de contexto de la discusión son los principales lugares donde puedes dejar un mensaje de bienvenida para quienes llegan.
      * Recorre el espacio de Loomio y ajusta lo que necesites para sentirte a gusto, como la [configuración de notificaciones](/en/user_manual/users/email_settings/) y tu [foto de perfil](/en/user_manual/users/user_profile/).
      * Consulta la información a tu manera mediante las distintas vistas de los hilos y opciones como Recientes, No leídos, Silenciar y Destacar. Haz del espacio un lugar familiar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8acf15fe96515738:
    english: "## Who’s in the Room"
    translation: "## Quiénes están presentes"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  48c4449cd1d9b135:
    english: Introducing yourself and being introduced to others is one of the most basic and most important human social functions. From Māori *mihimihi* to British “how do you do” to Japanese business card exchanges, every culture places a lot of importance on this. It goes beyond practicalities and politeness and touches on a deep human need, which is a prerequisite for comfort, openness, and focus.
    translation: 'Presentarte y conocer a las demás personas es una de las funciones sociales más básicas e importantes. Desde el *mihimihi* maorí hasta el saludo británico «how do you do» o el intercambio de tarjetas de presentación en Japón, todas las culturas le dan importancia. Va más allá de lo práctico y la cortesía: responde a una necesidad humana profunda y ayuda a crear comodidad, apertura y atención.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a8eec818aeb74e64:
    english: As a facilitator, if you don’t give people a chance to introduce themselves and find out who is around them, they will generally subvert whatever else you’re trying to point their attention at until you allow this process to occur. Consciously design introductions as a feature, and use them as an opportunity to further the overall goals of the interaction.
    translation: Si facilitas un encuentro y no das a las personas la oportunidad de presentarse y conocer a quienes las rodean, probablemente centrarán su atención en ello aunque intentes dirigirla a otra cosa. Prepara las presentaciones como parte del encuentro y aprovéchalas para avanzar hacia sus objetivos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ad3d2a31a23af036:
    english: "### Check in"
    translation: "### Ronda inicial"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  71d51a259d8b2c35:
    english: Even among groups who already know each other well, this introduction process continues with “checking in” – where everyone has a chance to speak at the beginning of a meeting (often to a question of "what is on top for you", "how are you", or "is there anything preventing you from being present") and other good practices for team cohesion. People have a multitude of identities, which change based on the context. People answer and re-answer “who am I for this moment” all the time, and that is what allows them to orient around one another.
    translation: Incluso en grupos donde las personas ya se conocen bien, las presentaciones continúan mediante una ronda inicial. Al comenzar una reunión, cada persona tiene ocasión de hablar, a menudo en respuesta a preguntas como «¿qué tienes más presente?», «¿cómo estás?» o «¿hay algo que te impida estar plenamente aquí?». Esta práctica también ayuda a la cohesión del equipo. Cada persona tiene muchas facetas, que cambian según el contexto. Al responder una y otra vez a «¿quién soy en este momento?», las personas pueden situarse unas respecto de otras.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0573ae3aef6f1c6c:
    english: People's expression does not occur in a vaccuum, but in the context of who they are. A multi-faceted view of someone’s identity is an essential aspect of interpreting their contributions.
    translation: 'Lo que una persona expresa no ocurre en el vacío: está relacionado con quién es. Comprender las distintas facetas de su identidad es esencial para interpretar sus aportaciones.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  86eb005fd168a424:
    english: "> We start many of our meetings with everyone “checking in” before we get to the agenda. These check-ins are focused not on your work tasks, but on how you’re doing as a human being. If you’re going through a rough patch at home, or you’re sick, or you have exciting positive news, understanding your state of mind will help the entire group have the right context to interpret how you’re communicating. — Richard Bartlett"
    translation: "> Empezamos muchas reuniones con una ronda en la que todas las personas comparten cómo están antes de pasar al orden del día. No hablamos de las tareas de trabajo, sino de cómo estamos como personas. Si estás pasando por un momento difícil en casa, estás enfermo o tienes una buena noticia, conocer tu estado de ánimo ayuda a todo el grupo a interpretar cómo te comunicas. — Richard Bartlett"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d5aea1c0564ccff8:
    english: |-
      * Create a thread called "Introduce yourself" or "Check in". It provides a useful first _call to action_ everyone coming in will understand.
      * For “request to join” groups, we have a function that allows the requestor to introduce themselves to the coordinator, to get access to the group. Some groups have a process of re-posting this content in the intro thread to welcome people in.
      * Upload profile photos! Photos of faces are one of the most powerful ways of feeling like you know who is in the room with you online.
    translation: |-
      * Crea un hilo llamado «Preséntate» o «¿Cómo estás?». Será una primera _invitación a participar_ fácil de entender para quienes lleguen.
      * En los grupos a los que se puede solicitar acceso, una función permite que quien lo solicita se presente ante la persona coordinadora. Algunos grupos vuelven a publicar esa presentación en el hilo de bienvenida para recibir a la persona.
      * Sube una foto de perfil. Ver las caras ayuda mucho a sentir que conoces a las personas con quienes compartes el espacio en línea.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d3b245589018cebf:
    english: "## Who’s NOT in the Room"
    translation: "## Quiénes NO están presentes"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5daf97a7cbbdd355:
    english: Diversity is critical for quality group decision making. The “wisdom of the crowd effect” (collective intelligence) only works by combining a variety of viewpoints. Outcomes of collaboration processes depend heavily on which voices are, and are not, represented. It’s impossible to have perfect representative inclusion, but you need to take into account who might be missing.
    translation: La diversidad es fundamental para que un grupo tome buenas decisiones. La «sabiduría colectiva» solo funciona cuando se combinan distintos puntos de vista. El resultado de un proceso de colaboración depende en gran medida de qué voces están representadas y cuáles faltan. Es imposible incluir a todas las personas de forma perfectamente representativa, pero debes tener en cuenta quién podría faltar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b16b07380f6bc37c:
    english: It’s extremely common for people to have blind spots around privilege. Humans are not great at intuiting bias, and are a lot better at noticing the presence of something, rather than the absence. Our minds trick us. For example, when women and men are deliberately given an equal amount of talking time there is often a perception that women are getting more than their fair share, due to different ideas about how much they “should” talk ([more details](https://www.quora.com/Do-women-tend-to-talk-more-than-men)). It can be necessary to actually measure or count to get an accurate picture, instead of relying on intuition.
    translation: Es muy común tener puntos ciegos respecto a los privilegios. Nos cuesta reconocer nuestros sesgos y solemos percibir mejor la presencia de algo que su ausencia. Nuestra percepción puede engañarnos. Por ejemplo, cuando mujeres y hombres reciben deliberadamente el mismo tiempo para hablar, a menudo se percibe que las mujeres hablan más de lo que les corresponde. Esto se debe a distintas ideas sobre cuánto «deberían» hablar ([más detalles](https://www.quora.com/Do-women-tend-to-talk-more-than-men)). Para tener una imagen precisa, a veces hace falta medir o contar en vez de confiar en la intuición.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2b720395fe4e451f:
    english: Someone who does not have particular accessibility needs may not even notice that a venue isn’t wheelchair accessible, a document isn’t formatted for screen readers, or a situation is excluding someone with hearing loss. But the people with those challenges will notice. Someone without kids might not consider that a 7PM meeting time won't work for parents. These, and a thousand other practical, social, and cultural elements, could block someone from *being in the room*.
    translation: Si no tienes necesidades específicas de accesibilidad, quizá no adviertas que un lugar no es accesible en silla de ruedas, que un documento no está preparado para lectores de pantalla o que una situación excluye a alguien con pérdida auditiva. Las personas afectadas sí lo notarán. Si no tienes hijos, quizá no pienses que una reunión a las 19:00 no les viene bien a madres y padres. Estos y muchos otros factores prácticos, sociales y culturales pueden impedir que alguien *esté presente*.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  25ac4ed8610c591c:
    english: 'It’s especially important to think about who is not in room when trying to solve problems for others: build with, not for; talk with people, not about them. If the people you are trying to serve are not in the room, it’s very unlikely you’ll have all the input you need to be effective. This is just as much about effectiveness for business outcomes as about social justice; it’s almost always better to design collaboration *with* the users or stakeholders.'
    translation: 'Es especialmente importante pensar en quién falta cuando intentas resolver problemas que afectan a otras personas: construye con ellas, no para ellas; habla con ellas, no sobre ellas. Si las personas a las que quieres ayudar no están presentes, es muy poco probable que cuentes con toda la información necesaria para actuar con eficacia. Esto importa tanto para los resultados de una organización como para la justicia social. Casi siempre es mejor diseñar la colaboración *con* las personas usuarias o interesadas.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6b44ef1725c36586:
    english: |-
      * Collaborating online can allow for whole other levels of inclusion. Instead of thinking about a “digital divide”, think about the “digital bridge” — how technology can include people who cannot attend in-person meetings or participate at a specific time, and enable whole new possibilities like multi-lingual discussions.
      * Loomio makes it very clear who is invited to a group and who has participated in a discussion, giving important information for thinking about inclusion. If people are missing, you can see that.
      * If inclusive decision making and diversity of thinking are important to you, periodically ask yourself, “Who’s not in the room? Why?”
    translation: |-
      * Colaborar en línea puede abrir nuevas posibilidades de inclusión. En lugar de pensar solo en la «brecha digital», piensa también en el «puente digital»: la tecnología puede incluir a quienes no pueden asistir a reuniones presenciales o participar a una hora determinada, y hacer posibles las discusiones en varios idiomas.
      * Loomio muestra con claridad quiénes están invitados a un grupo y quiénes han participado en una discusión. Esto aporta información útil para pensar en la inclusión. Si falta alguien, puedes verlo.
      * Si para ti son importantes las decisiones inclusivas y la diversidad de perspectivas, pregúntate de vez en cuando: «¿Quién falta? ¿Por qué?».
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0a5324e7de64cdba:
    english: "## Culture, Protocol, Expectations"
    translation: "## Cultura, protocolos y expectativas"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  851a2601b835fbb1:
    english: Culture can be quite a nebulous concept, and operates at multiple levels. The culture of the wider society has a big influence, but you can think of every group, and every session or discussion, as having a culture of its own.
    translation: La cultura puede ser un concepto difícil de definir y actúa en varios niveles. La cultura de la sociedad influye mucho, pero cada grupo, sesión o discusión también tiene una cultura propia.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  27d3b10b80ade309:
    english: How do we roll? How do we talk to one another? What is and is not ok here? What are the rules of the game, of how we interact?
    translation: "¿Cómo hacemos las cosas? ¿Cómo nos hablamos? ¿Qué se acepta aquí y qué no? ¿Cuáles son las reglas de nuestra interacción?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  54d83e0b3e487190:
    english: The process of confronting cultural questions can be a powerful moment of self-awareness for a group. Not confronting them can harm ability to meet goals, or sometimes tear a group apart completely.
    translation: Abordar estas cuestiones culturales puede ayudar a un grupo a conocerse mejor. Evitarlas puede dificultar el logro de sus objetivos y, a veces, incluso dividirlo por completo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f9918d7d61cef0c9:
    english: Culture, protocol, and expectations can be implicit or explicit, and by nature intersect in complex ways with power dynamics and social capital. It’s a challenging balance to keep things loose enough to allow emergence, evolution, creativity, and freedom, while being explicit enough about bottom lines and boundaries to ensure safety.
    translation: La cultura, los protocolos y las expectativas pueden ser implícitos o explícitos. También se entrecruzan de formas complejas con las dinámicas de poder y el capital social. Es difícil dejar suficiente espacio para que surjan nuevas ideas, evolucionen las prácticas y haya creatividad y libertad, y a la vez definir con claridad los límites necesarios para garantizar la seguridad.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3d484eafb8524354:
    english: Facilitators often guide the group to live up to the culture it has set, follow the protocols it has agreed, and hold expectations to account. If a facilitator is tasked with this role, they need to be backed by a certain level of explicitness about those agreements, and a certain mandate. Otherwise, it can get messy.
    translation: Quienes facilitan suelen ayudar al grupo a mantener la cultura que ha definido, seguir los protocolos acordados y cumplir sus expectativas. Para hacerlo, necesitan que esos acuerdos sean suficientemente explícitos y contar con un mandato claro. De lo contrario, pueden surgir conflictos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ba3ef231a647d607:
    english: People often want to leave things to “common sense” and avoid agreeing a code of conduct or explicit protocols. However, this can disproportionately affect the most vulnerable members of the group, since they will feel the negative impacts of bad behavior or culture first and strongest, and are least empowered to counteract it themselves. It's the responsibility of the more privileged or influential members of the group to think through these questions carefully.
    translation: 'A menudo se prefiere dejar las cosas al «sentido común» y evitar acordar un código de conducta o protocolos explícitos. Sin embargo, esto puede perjudicar más a quienes están en una situación de mayor vulnerabilidad: suelen sentir antes y con más fuerza los efectos de una mala conducta o una cultura dañina, y tienen menos posibilidades de contrarrestarlos. Las personas con más privilegios o influencia en el grupo tienen la responsabilidad de pensar detenidamente en estas cuestiones.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d14bcec24555318c:
    english: Like a legal contract, you hope you never have to enforce a code of conduct, but if you need it you’re very glad it’s there. You want to agree *before* it becomes necessary. In order for a facilitator or any member of the group to effectively stand up and say, “that’s not OK here”, you need to have already invested in culture-building and expectation-setting.
    translation: Como ocurre con un contrato legal, esperas no tener que aplicar nunca un código de conducta, pero agradeces tenerlo si hace falta. Conviene acordarlo *antes* de que sea necesario. Para que quien facilita o cualquier integrante del grupo pueda decir con eficacia «eso aquí no se acepta», el grupo debe haber dedicado tiempo a construir una cultura y definir expectativas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dda14b86acbd8199:
    english: |-
      * Because Loomio is usually used as a space for constructive deliberation among groups with a specific purpose and set of members, for the most part people engage in good faith and behave respectfully.
      * Loomio is designed specifically to give voice to the individual, and let them communicate their needs and concerns. Even if a majority doesn’t see a problem, a single person can raise it and be heard.
      * Communicating online enables a certain level of physical safety, because people are not face to face.
      * Some groups already use the group description field to note a code of conduct or expectations for behavior. Others have collectively agreed a set of expectations that govern participation.
