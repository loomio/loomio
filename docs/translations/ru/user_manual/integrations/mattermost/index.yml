  5b8fbf385e691898:
    english: |-
      Start from your Mattermost team in your browser. Then open the Integrations settings page.
      ![](mm1.png)
    translation: |-
      Откройте свою команду Mattermost в браузере. Затем откройте страницу настроек интеграций.
      ![](mm1.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  71a08631e70f06c9:
    english: |-
      Click "Incoming Webhooks"
      ![](mm2.png)
    translation: |-
      Нажмите «Входящие вебхуки».
      ![](mm2.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4f149aa53006b72f:
