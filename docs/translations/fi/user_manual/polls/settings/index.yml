---
navigation_title: Asetukset
blocks:
  145c23b2412eff98:
    english: "# Proposal and poll settings"
    translation: "# Ehdotuksen ja kyselyn asetukset"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e0347d976f79179:
    english: "## Setting up a proposal or poll"
    translation: "## Ehdotuksen tai kyselyn määrittäminen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e5d6f17041c19d41:
    english: "### Proposal and poll templates"
    translation: "### Ehdotus- ja kyselymallit"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8913cabb2f1f8227:
    english: 'Choose the proposal template you want to use. '
    translation: Valitse ehdotusmalli, jota haluat käyttää.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3620f6321777ca50:
    english: "### Add content"
    translation: "### Lisää sisältö"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bc7ebb222e9ff4d1:
    english: "**Group:** Check that the correct group is selected for your proposal or poll."
    translation: "**Ryhmä:** Tarkista, että ehdotuksellesi tai kyselyllesi on valittu oikea ryhmä."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3a1d375da02f3a49:
    english: "**Title:** Give your proposal or poll a short, relevant title."
    translation: "**Otsikko:** Anna ehdotukselle tai kyselylle lyhyt ja kuvaava otsikko."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a62a7e63f9db295c:
    english: "**Details:** Explain what you are asking of people and include enough details so everyone knows what it means to vote.  "
    translation: "**Tiedot:** Kerro, mitä pyydät ihmisiltä, ja anna riittävästi tietoa, jotta kaikki ymmärtävät, mitä äänestäminen tarkoittaa."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e17c2ab4878716f2:
    english: The predefined templates include some prompts to help you write a good proposal - use these or add your own details.
    translation: Valmiissa malleissa on kysymyksiä, jotka auttavat sinua kirjoittamaan hyvän ehdotuksen. Käytä niitä tai lisää omia tietojasi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  74daa7f0cc476971:
    english: Avoid combining a range of ideas in one proposal, because people might agree to some aspects but not others and be unsure how to respond. You can break complex decisions down into multiple proposals.
    translation: Vältä useiden eri ajatusten yhdistämistä samaan ehdotukseen. Ihmiset voivat kannattaa joitakin niistä mutta vastustaa toisia, jolloin vastaaminen on vaikeaa. Voit jakaa monimutkaisen päätöksen useaksi ehdotukseksi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0da6e449688940bb:
    english: When making a proposal, state your expectations and describe the impact the proposal will have if adopted. If it's a formal or binding proposal it's often worth describing what it means if the proposal is not adopted.
    translation: Kerro ehdotuksessa, mitä odotat ja mitä vaikutuksia sen hyväksymisellä olisi. Jos ehdotus on muodollinen tai sitova, kannattaa usein kuvata myös, mitä sen hylkääminen tarkoittaisi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a6db66b75f495e21:
    english: Use the formatting tools to support your poll.  For example, attach a document file with the paperclip icon, insert an image, link to a website or online document, or even embed a video.
    translation: Voit täydentää kyselyä muotoilutyökaluilla. Liitä esimerkiksi asiakirja paperiliittimen kuvakkeella, lisää kuva, linkitä verkkosivuun tai verkossa olevaan asiakirjaan tai upota video.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f4f85f131878c36d:
    english: "### Voting options"
    translation: "### Äänestysvaihtoehdot"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  616aab74af2072ba:
    english: Each proposal and poll template provides options for voting.
    translation: Jokaisessa ehdotus- ja kyselymallissa on äänestysvaihtoehtoja.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7a85de7eefe74178:
    english: Depending on the template, you can edit, remove, reorder, or add voting options to suit the decision process you are running.
    translation: Mallista riippuen voit muokata, poistaa, järjestää uudelleen tai lisätä äänestysvaihtoehtoja päätöksentekotapaasi sopiviksi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9bc44bf4b28ac5d8:
    english: "- Use the pencil icon to edit voting option \n- Use the trash can icon to remove unwanted voting options\n- Use the handle to move the order of voting options\n- Add voting options with **Add option** when the template allows custom options"
    translation: |-
      - Muokkaa äänestysvaihtoehtoa kynäkuvakkeella
      - Poista tarpeeton äänestysvaihtoehto roskakorikuvakkeella
      - Muuta äänestysvaihtoehtojen järjestystä vetokahvasta
      - Lisää äänestysvaihtoehtoja valitsemalla **Lisää vaihtoehto**, jos malli sallii omat vaihtoehdot
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2062f39334fbd629:
    english: |-
      ### Edit voting options
      There is a lot of flexibility to configure voting options to suit the way your organization makes decisions.
    translation: |-
      ### Muokkaa äänestysvaihtoehtoja
      Voit määrittää äänestysvaihtoehdot monella tavalla organisaatiosi päätöksentekoon sopiviksi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5ac5b47c81fe187b:
    english: 'Use the pencil icon alongside the voting option to open the edit modal:'
    translation: 'Avaa muokkausikkuna äänestysvaihtoehdon vieressä olevalla kynäkuvakkeella:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3c791f8140ad3b39:
    english: "**Option name:** A short name for the option."
    translation: "**Vaihtoehdon nimi:** Anna vaihtoehdolle lyhyt nimi."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  77a0fb7409cf1711:
    english: "**Icon:** Select an icon for the option, such as thumbs up, thumbs down, abstain, or block."
    translation: "**Kuvake:** Valitse vaihtoehdolle kuvake, kuten peukku ylös, peukku alas, pidättäydy tai estä."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9126ee91e5d1cb95:
    english: "**Meaning:** A sentence that explains what choosing this options means."
    translation: "**Merkitys:** Kirjoita lause, joka kertoo, mitä vaihtoehdon valitseminen tarkoittaa."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e88d83b93ba47666:
    english: "**Reason prompt:** A question to prompt voters to provide their reasoning or reconsider their position. "
    translation: "**Syy-kehote:** Esitä kysymys, joka kannustaa äänestäjiä perustelemaan valintansa tai harkitsemaan kantaansa uudelleen."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d05197892ea46087:
    english: "### Opening time"
    translation: "### Avaamisaika"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1b56f0ad52a3aed8:
    english: By default, voting opens immediately when you create the poll. If you want to schedule voting to open at a later time, uncheck **Voting opens immediately** and select an opening date and time.
    translation: Äänestys alkaa oletusarvoisesti heti, kun luot kyselyn. Jos haluat aloittaa äänestyksen myöhemmin, poista valinta kohdasta **Äänestys alkaa heti** ja valitse avaamispäivä ja -aika.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  48ccc43734b062eb:
    english: This is useful to give time for discussion before voting opens, or to ensure a poll or proposal is correctly set up and scheduled to happen at the right time.
    translation: Näin voit jättää aikaa keskustelulle ennen äänestyksen alkua tai valmistella kyselyn tai ehdotuksen etukäteen ja ajoittaa sen oikein.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b68fccc3132988ff:
    english: When a poll has a scheduled opening time, you can add voters before voting opens. Voters will be notified when voting opens, rather than when they are added.
    translation: Jos olet ajastanut kyselyn avaamisen, voit lisätä äänestäjiä ennen äänestyksen alkua. He saavat ilmoituksen äänestyksen alkaessa eivätkä silloin, kun lisäät heidät.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  82d4cacfa780dd98:
    english: "**Notify voters when poll opens:** When checked (default), all voters will receive a notification when voting opens. Uncheck this if you want to open voting without sending notifications."
    translation: "**Ilmoita äänestäjille, kun kysely avautuu:** Kun tämä oletusarvoisesti valittu asetus on käytössä, kaikki äänestäjät saavat ilmoituksen äänestyksen alkaessa. Poista valinta, jos haluat aloittaa äänestyksen ilman ilmoituksia."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d084620657803f93:
    english: "**Closing date and time:** Select the closing date and time for your poll."
    translation: "**Sulkemispäivä ja -aika:** Valitse kyselyn sulkemispäivä ja -aika."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c0472419a2671222:
    english: Give sufficient time for people to vote. You could time the proposal so it closes before a meeting, or avoid closing over a weekend, so that people will receive a timely reminder. If necessary, you can close the poll early or extend the closing time.
    translation: Varaa ihmisille riittävästi aikaa äänestää. Voit ajoittaa ehdotuksen sulkeutumaan ennen kokousta tai välttää sulkemista viikonloppuna, jotta muistutus saapuu sopivaan aikaan. Tarvittaessa voit sulkea kyselyn etuajassa tai siirtää sulkemisaikaa myöhemmäksi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c87f87e6cbc1a4d7:
    english: "**Who can vote?** Invite everyone in the group or only specific people that you invite."
    translation: "**Kuka voi äänestää?** Kutsu kaikki ryhmän jäsenet tai vain valitsemasi ihmiset."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e02a9cefc3082334:
    english: |-
      You can later add people to an 'Invite people only' poll. For identified polls,
      you can also remove people who should no longer be eligible to vote. People
      cannot be removed from an anonymous poll.
    translation: |-
      Voit lisätä ihmisiä myöhemmin kyselyyn, johon osallistutaan vain kutsusta. Jos äänestäjien henkilöllisyys näkyy,
      voit myös poistaa ihmisiä, joilla ei enää ole äänioikeutta. Ihmisiä
      ei voi poistaa anonyymistä kyselystä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2e959157d75ed7bd:
    english: "## More settings"
    translation: "## Lisää asetuksia"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3d4443d3e6d3b13d:
    english: |-
      ### Reminder
      Send a 'Closing soon' notification 24 hours before the poll closes. This can be an opportunity for people to see how others have voted and reconsider their own vote, or just a way to increase participation in the poll.
    translation: |-
      ### Muistutus
      Lähetä ilmoitus kyselyn lähestyvästä sulkeutumisesta 24 tuntia ennen sen sulkeutumista. Näin ihmiset voivat nähdä muiden äänet ja harkita omaa ääntään uudelleen. Muistutus voi myös lisätä osallistumista kyselyyn.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  62067c0573d7a64e:
    english: |-
      Setting options:
      - Nobody
      - Author
      - Undecided voters (default)
      - All voters
    translation: |-
      Asetusvaihtoehdot:
      - Ei kenellekään
      - Tekijälle
      - Päättämättömille äänestäjille (oletus)
      - Kaikille äänestäjille
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6cd67c3f92302551:
    english: |-
      For an anonymous poll lasting at least 24 hours, Loomio automatically reminds
      eligible people who have not voted during the final 24 hours. This reminder
      cannot be changed in the poll settings.
    translation: |-
      Jos anonyymi kysely kestää vähintään 24 tuntia, Loomio muistuttaa automaattisesti
      viimeisten 24 tunnin aikana äänioikeutettuja, jotka eivät ole vielä äänestäneet. Tätä muistutusta
      ei voi muuttaa kyselyn asetuksissa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72f172271e2a636a:
    english: |-
      ### Anonymous voting
      If enabled, votes are stored separately from voter identities. Results appear after voting closes, and voters cannot add reasons, review their submitted vote, or change it.
    translation: |-
      ### Anonyymi äänestys
      Kun asetus on käytössä, äänet tallennetaan erilleen äänestäjien henkilöllisyyksistä. Tulokset näkyvät äänestyksen sulkeuduttua, eivätkä äänestäjät voi lisätä perusteluja, tarkastella antamaansa ääntä tai muuttaa sitä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3393027493510f2f:
    english: See [Anonymous voting](/en/user_manual/polls/anonymous_voting) for details about how voter identities are separated from submitted votes, what information is retained, and the limits of the protection.
    translation: Lue [Anonyymi äänestys](/en/user_manual/polls/anonymous_voting) -sivulta, miten äänestäjien henkilöllisyydet erotetaan annetuista äänistä, mitä tietoja säilytetään ja mitkä ovat suojan rajat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b731b9118e48dee5:
    english: |-
      > [!WARNING]
      > Once a poll has started you cannot edit the poll to make it anonymous or to undo the anonymous setting.
    translation: |-
      > [!WARNING]
      > Kun kysely on alkanut, et voi muuttaa sitä anonyymiksi etkä poistaa anonyymiasetusta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e8660d089a3c07bb:
    english: |-
      > [!WARNING]
      > You cannot re-open an anonymous poll after it has closed. Submitted votes are not linked to the participation records that show who has voted.
    translation: |-
      > [!WARNING]
      > Et voi avata anonyymiä kyselyä uudelleen sen sulkeuduttua. Annettuja ääniä ei ole yhdistetty osallistumistietoihin, joista näkyy, ketkä ovat äänestäneet.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  aaaaa28a4b435835:
    english: |-
      ### Vote reason
      It can be helpful to understand why people voted the way they did. With this setting, you can prompt people to share their thoughts when they vote.
    translation: |-
      ### Äänestyksen syy
      Äänestäjien perustelut voivat auttaa ymmärtämään heidän valintojaan. Tällä asetuksella voit pyytää ihmisiä kertomaan ajatuksistaan äänestäessään.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  309645182b157738:
    english: 'Available settings depend on the template:'
    translation: 'Käytettävissä olevat asetukset riippuvat mallista:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d67e2c2914e91a6f:
    english: |-
      - **Optional** lets voters choose whether to give a reason
      - **Required for disagree or block** requires a reason when the selected option
        uses the Disagree or Block voting icon
      - **Required for block** requires a reason when the selected option uses the
        Block voting icon
      - **Required** requires every voter to give a reason
      - **Disabled** removes the vote-reason field
    translation: |-
      - **Valinnainen** antaa äänestäjän päättää, antaako hän perustelun
      - **Pakollinen eri mieltä olemisen tai estämisen yhteydessä** edellyttää perustelua, kun valittu vaihtoehto
        käyttää Eri mieltä- tai Estä-äänestyskuvaketta
      - **Pakollinen estettäessä** edellyttää perustelua, kun valittu vaihtoehto käyttää
        Estä-äänestyskuvaketta
      - **Pakollinen** edellyttää perustelua kaikilta äänestäjiltä
      - **Liikuntarajoitteinen** poistaa äänestyksen perustelukentän
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  af5e7c0557aec611:
    english: |-
      The conditional settings follow the voting icon rather than the option name.
      They still apply if you rename Disagree to a term such as Objection. The
      Consent template defaults to **Required for disagree or block**, while the
      Consensus template defaults to **Required for block**. Other templates default
      to **Optional**, except Question rounds where the response itself is required.
      The poll author can change the setting for an individual poll.
    translation: |-
      Ehdolliset asetukset perustuvat äänestyskuvakkeeseen eivätkä vaihtoehdon nimeen.
      Ne ovat voimassa, vaikka nimeäisit Eri mieltä -vaihtoehdon esimerkiksi Vastustukseksi.
      Suostumusmallissa oletusasetus on **Pakollinen eri mieltä olemisen tai estämisen yhteydessä** ja
      konsensusmallissa **Pakollinen estettäessä**. Muissa malleissa oletusasetus on
      **Valinnainen**, paitsi kysymyskierroksessa, jossa vastaus on pakollinen.
      Kyselyn laatija voi muuttaa yksittäisen kyselyn asetusta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ecb0d89c623db459:
    english: "**Limit reason to maximum 500 characters:** Keeping vote reasons short makes them easier to understand. A collection of concise reasons is a great resource for making a decision.  This setting is ticked by default. Untick to allow for longer reasons."
    translation: "**Rajoita perustelu enintään 500 merkkiin:** Lyhyitä äänestysperusteluja on helpompi ymmärtää. Ytimekkäät perustelut tukevat päätöksentekoa. Tämä asetus on oletuksena valittuna. Poista valinta, jos haluat sallia pidemmät perustelut."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  35bd4f116b9ff26a:
    english: |-
      ### Hide results
      If you want people to vote without knowing how others have voted, you can hide the results of the poll.  Useful if you do not want people to be affected by how other people have voted.
    translation: |-
      ### Piilota tulokset
      Voit piilottaa kyselyn tulokset, jos haluat ihmisten äänestävän tietämättä, miten muut ovat äänestäneet. Näin muiden äänet eivät vaikuta heidän valintaansa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8cc5b82f4cc5e94e:
    english: |-
      Setting options:
      - Do not hide results
      - Hide results until a vote is cast
      - Hide results until voting closes
    translation: |-
      Asetusvaihtoehdot:
      - Älä piilota tuloksia
      - Piilota tulokset, kunnes ääni on annettu
      - Piilota tulokset äänestyksen päättymiseen asti
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4be103ffd97e7e8f:
    english: While results are hidden, nobody can reply to votes. Replies to votes open when voting closes.
    translation: Kun tulokset ovat piilossa, kukaan ei voi vastata ääniin. Ääniin voi vastata äänestyksen päätyttyä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a488ebe6712a5e1d:
    english: If results are hidden until a vote is cast, vote before you print or export the thread as Markdown.
    translation: Jos tulokset ovat piilossa äänen antamiseen asti, äänestä ennen kuin tulostat viestiketjun tai viet sen Markdown-muodossa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1e5a1eb47ee3d99d:
    english: |-
      Anonymous polls always hide results until voting closes. The STV Election
      template enables anonymous voting by default.
    translation: |-
      Anonyymeissä kyselyissä tulokset ovat aina piilossa äänestyksen päättymiseen asti. STV-vaalimalli
      ottaa anonyymin äänestyksen oletuksena käyttöön.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8e7d8e81db57f4f8:
    english: |-
      ### Start the poll
      Select the **Start proposal** or **Start poll** button.
    translation: |-
      ### Aloita kysely
      Valitse **Aloita ehdotus**- tai **Aloita kysely** -painike.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b1ee90012c240ef5:
    english: "## Managing polls"
    translation: "## Kyselyjen hallinta"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0b5f754660efb4da:
    english: Open the three-dot menu at the bottom right of the poll.
    translation: Avaa kyselyn oikeassa alakulmassa oleva kolmen pisteen valikko.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cc2325791d155b04:
    english: "### Edit poll"
    translation: "### Muokkaa kyselyä"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8d5ecd0352b5caf8:
    english: Use **Edit poll** to edit poll content or settings.   You can not change voting options once voting commences.
    translation: Muokkaa kyselyn sisältöä tai asetuksia valitsemalla **Muokkaa kyselyä**. Et voi muuttaa äänestysvaihtoehtoja äänestyksen alettua.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  84d18e91493020d4:
    english: "### Make a copy"
    translation: "### Tee kopio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  071c2438f8e5315f:
    english: Use **Make a copy** to create a new poll using the current poll and settings as a starting point.
    translation: Luo uusi kysely nykyisen kyselyn ja sen asetusten pohjalta valitsemalla **Tee kopio**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3c42dde555e8a245:
    english: "### Notification history"
