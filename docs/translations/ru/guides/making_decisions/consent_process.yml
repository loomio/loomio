    english: This guide describes the complete Consent process. For help setting up and interpreting one Consent proposal, see [Consent](/en/user_manual/polls/proposals/consent/).
    translation: В этом руководстве описан весь процесс согласия. О том, как создать отдельное предложение с голосованием по согласию и понять его результаты, читайте в разделе [Согласие](/en/user_manual/polls/proposals/consent/).
    status: machine
