  7478a826673bce70:
    english: When your proposal or poll closes, you’ll be prompted to enter an **outcome**.
    translation: Quando la tua proposta o il tuo sondaggio si chiude, ti verrà chiesto di inserire una **conclusione**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ccaf1bc50a4f4734:
    english: State the results of the proposal or poll and say what will happen next.
    translation: Riporta i risultati della proposta o del sondaggio e spiega cosa succederà dopo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fde482f3a84e26e6:
    english: The outcome statement is an important record of the poll or decision - a succinct statement for future reference.
    translation: La conclusione documenta la decisione e i risultati del sondaggio in modo sintetico, per poterli consultare in futuro.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9f4a341103cf4286:
    english: "## Outcome statements for common decision processes"
    translation: "## Conclusioni per i processi decisionali più comuni"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  457a047ee6ae5975:
    english: |-
      | **Decision process** | **When the decision is made** | **Outcome** |
      |---|---|---|
      | Advice process | When advice has been received and taken into account. | State the decision made and thank people for their advice and feedback. |
      | Consent process | When there are no remaining objections. | State that no valid objections remain and there is consent that the proposal is 'safe to try'.  |
      | Consensus process | When most* people agree. | State proposal results and the decision made. |
    translation: |-
      | **Processo decisionale** | **Quando si prende la decisione** | **Conclusione** |
      |---|---|---|
      | Processo consultivo | Quando i pareri sono stati raccolti e presi in considerazione. | Indica la decisione presa e ringrazia le persone per i pareri e i commenti. |
      | Processo per consenso senza obiezioni | Quando non restano obiezioni. | Indica che non restano obiezioni valide e che c'è accordo sul fatto che la proposta si possa provare.  |
      | Processo per consenso | Quando la maggior parte* delle persone è d'accordo. | Riporta i risultati della proposta e la decisione presa. |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f8adf692b7b22c59:
    english: "**The majority or supermajority as governed by constitution or by prior agreement within your organization.*  "
    translation: "**La maggioranza o la maggioranza qualificata, secondo quanto previsto dallo statuto o da un accordo precedente all'interno della tua organizzazione.*"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  278c243b460bef68:
    english: 'Whatever the results, there is always something to learn from the proposal and poll. '
    translation: Qualunque sia il risultato, una proposta o un sondaggio offre sempre qualcosa da imparare.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e694b60515143fcb:
    english: If your proposal fails, consider what new understanding has been gained, and if this can be accommodated to reach a better decision.
    translation: Se la tua proposta non viene approvata, considera cosa avete imparato e se puoi tenerne conto per arrivare a una decisione migliore.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  780a97e6dd058d5d:
    english: 'The outcome statement is an opportunity to state the results and what has been learnt.  '
    translation: La conclusione ti permette di riportare i risultati e ciò che avete imparato.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ca65851b5da70691:
    english: You can notify people - they will receive an email from Loomio containing the poll results and your outcome statement.
    translation: 'Puoi avvisare le persone: riceveranno un''email da Loomio con i risultati del sondaggio e la tua conclusione.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  64d6b82a9343b3a6:
    english: 'You can also set a **Review date**: a future date when you would like to review this poll or decision. For example, you might review a strategy at the same time next year.'
    translation: 'Puoi anche impostare una **Data della recensione**: una data futura in cui vorresti riesaminare il sondaggio o la decisione. Per esempio, potresti riesaminare una strategia nello stesso periodo dell''anno prossimo.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  60605804c2662fc8:
    english: "**Example outcome statements**"
    translation: "**Esempi di conclusioni**"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
