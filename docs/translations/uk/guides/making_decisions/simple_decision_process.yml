---
navigation_title: Простий процес ухвалення рішень
blocks:
  84ddd86a61d09414:
    english: "# Simple decision process"
    translation: "# Простий процес ухвалення рішень"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2e868ae6bc4a493b:
    english: This guide describes an end-to-end process using a discussion, Sense check, final proposal, and outcome. For help with the fields and response options of one proposal, see [Proposals](/en/user_manual/polls/proposals/).
    translation: 'У цьому посібнику описано весь процес: від обговорення й перевірки сенсу до остаточної пропозиції та результату. Про поля й варіанти відповіді в пропозиції читайте на сторінці [Пропозиції](/en/user_manual/polls/proposals/).'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d9877680762afa22:
    english: Some organizations arrive at Loomio having already developed a deep culture and practice of collaborative decision making.  Such organizations have often written handbooks and codified their practices, however, most organizations are still on the journey and looking for some helpful first steps towards making better decisions together.  If the burning question in your organization is **how do we make decisions together?**, then this guide is for you.
    translation: Деякі організації приходять у Loomio з усталеною практикою спільного ухвалення рішень. Вони часто вже описали свої підходи в посібниках. Інші організації ще шукають, із чого почати, щоб ухвалювати кращі рішення разом. Якщо у вашій організації постає питання **як нам ухвалювати рішення разом?**, цей посібник допоможе.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6b321a0ba71f92b8:
    english: "***Here are three steps to help you co-create a better, more cohesive decision with less stress and anxiety.***"
    translation: "***Ось три кроки, які допоможуть вам разом ухвалити краще, узгодженіше рішення з меншим напруженням.***"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c46b32b56b933b0a:
    english: "## Simple decision making - in 3 steps"
    translation: "## Простий процес ухвалення рішень — 3 кроки"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e3208a84f88ba36f:
    english: Good collaborative decisions rarely happen by themselves.  They almost always benefit from someone facilitating the discussion through to decision.  So when you launch a discussion thread, you take on a facilitation role (unless someone else is facilitating).
    translation: Хороші спільні рішення рідко виникають самі собою. Зазвичай хтось має допомагати групі вести обговорення до рішення. Коли ви починаєте тему для обговорення, ви берете на себе цю роль, якщо цього не робить хтось інший.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1a1da8788ddb01c7:
    english: Follow these 3 steps as you facilitate your group to make a good decision.
    translation: Допоможіть своїй групі ухвалити рішення за цими трьома кроками.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5b83a53a3f4caad5:
    english: |-
      ### Step 1 - Introduce and discuss
      Start a Loomio **discussion** to introduce the topic, open conversation and invite people. Include all the context-setting information your group needs to meaningfully participate, along with relevant background so everyone understands the purpose.
    translation: |-
      ### Крок 1 — Представте питання й обговоріть його
      Почніть **обговорення** в Loomio, щоб представити питання, розпочати розмову й запросити людей до участі. Додайте відомості, потрібні групі для змістовної участі, і поясніть передумови, щоб усі розуміли мету.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8aab998cb04b8635:
    english: 'Be clear about your objective - what is the decision to be made or intended outcome of the discussion? '
    translation: 'Чітко визначте мету: яке рішення потрібно ухвалити або до якого результату має привести обговорення?'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d8f53cbae173f5ac:
    english: As the discussion progresses, create space for diverse input - sometimes the best ideas and input come from outside the box.  Work together to explore and test ideas, encouraging a healthy and open discussion.
    translation: У ході обговорення дайте місце різним поглядам. Часом найкращі ідеї бувають несподіваними. Разом досліджуйте й перевіряйте ідеї та підтримуйте відкрите обговорення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7f447ab455f6cea4:
    english: 'Notice when the same voices are dominating and invite some of the quieter people to contribute by @mentioning them and asking them what they think. '
    translation: Звертайте увагу, чи не переважають у розмові ті самі люди. Запросіть тих, хто висловлюється рідше, позначивши їх через @згадку й запитавши їхню думку.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d4bad2b5207ac1d8:
    english: You can make a complex discussion easier to engage with by updating the context section with a summary of the key points.
    translation: Щоб людям було легше долучитися до складного обговорення, оновіть розділ контексту коротким викладом основних думок.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  daeddff561f62553:
    english: |-
      ### Step 2 - Sense check
      As your group begins to converge on path forwards, use a **Sense check** poll to survey opinions and test how the group feels.
    translation: |-
      ### Крок 2 — Перевірка сенсу
      Коли група починає визначати подальший шлях, проведіть опитування **Перевірка сенсу**, щоб дізнатися думки людей і зрозуміти їхнє ставлення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c1d4e97ce180d85b:
    english: |-
      A ‘Sense check’ lets people know a proposal is forming and encourages them to engage.
      It can also be used to clarify an issue, even if the solution might not be apparent yet.
    translation: |-
      «Перевірка сенсу» дає людям знати, що пропозиція формується, і заохочує їх долучитися.
      Вона також допомагає прояснити питання, навіть якщо рішення ще не очевидне.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5ff914227bb8706a:
    english: Sense check is a great way to surface concerns before moving to a formal agreement.  You can find out if people are happy with where this is going, if they have questions or need more time, or if they are concerned.
    translation: Перевірка сенсу допомагає виявити занепокоєння до того, як група перейде до формального погодження. Ви можете дізнатися, чи підтримують люди обраний напрям, чи мають запитання, потребують більше часу або мають застереження.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  01433544fefb70a5:
    english: 'Use feedback to improve and refine the proposal. If there’s still some work to do, you may need to go back to Step 1 and then run another Sense check round. '
    translation: Використайте відгуки, щоб поліпшити й уточнити пропозицію. Якщо потрібне подальше обговорення, поверніться до кроку 1, а потім проведіть ще одну перевірку сенсу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  440474199fd76019:
    english: Good engagement will help you assess when you are ready to proceed to a proposal.
    translation: Участь людей допоможе вам зрозуміти, коли можна переходити до пропозиції.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f3799fd76f9d9446:
    english: "### Step 3 - Proposal\nNow when you raise a formal **Proposal**, you do so with confidence that it will pass. "
    translation: |-
      ### Крок 3 - Пропозиція
      Тепер ви можете висунути офіційну **Пропозиція**, маючи підстави вважати, що її підтримають.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a3e74110f5a3c7a2:
    english: There may have been a lot of discussion and variations suggested, so be specific about the decision being made, so that everyone knows what the voting options mean.
    translation: Під час обговорення могли запропонувати багато варіантів. Чітко сформулюйте рішення, щоб усі розуміли значення варіантів голосування.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b7581cfd1ecffd78:
    english: Set proposal deadlines consciously, so group members have time to consider and engage.  You can always extend the closing date if need be.
    translation: Встановлюйте термін голосування так, щоб учасники групи мали час обміркувати пропозицію й долучитися. За потреби дату завершення можна продовжити.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b5bcc06f15cde560:
    english: This step is important to formalize agreement with people’s vote and to state an outcome - what just happened and what will happen next.
    translation: 'Цей крок дає змогу закріпити згоду голосами учасників і повідомити результат: що вирішили й що відбудеться далі.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c2f2bbcacfd77ab0:
    english: Proposal results are logged, along with a record of the discussion leading to the decision.
    translation: Результати пропозиції зберігаються разом із записом обговорення, яке привело до рішення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2d82209e751f2ffa:
    english: |-
      ### Outcome
      When a Loomio poll closes, you will be prompted to set an **outcome** to let everyone know what happened and what is going to happen next.
    translation: |-
      ### Результат
      Коли опитування в Loomio завершиться, система запропонує вам указати **результат**, щоб усі знали, що вирішили й що відбудеться далі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fb14b31115927d74:
    english: "## Proposals can help in many situations"
    translation: "## Пропозиції корисні в різних ситуаціях"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c1a27b25e2c01ff3:
    english: 'Don''t hesitate to start a proposal just because you''re not sure everyone will agree - proposals are not only for when you have consensus, they''re designed to surface issues that need resolving and are useful for clarifying disagreements. '
    translation: Починайте пропозицію, навіть якщо ви не впевнені, що всі погодяться. Пропозиції корисні не лише тоді, коли вже є консенсус. Вони допомагають виявити питання, які потрібно розв’язати, і прояснити розбіжності.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6dbf0f3af984b8e8:
    english: The next pages show a few more complex processes for reaching decisions, through [advice](/en/guides/making_decisions/advice_process), [consent](/en/guides/making_decisions/consent_process ), or [consensus](/en/guides/making_decisions/consensus_process ).
    translation: 'На наступних сторінках описано складніші процеси ухвалення рішень: через [поради](/en/guides/making_decisions/advice_process), [згоду](/en/guides/making_decisions/consent_process ) або [консенсус](/en/guides/making_decisions/consensus_process ).'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
