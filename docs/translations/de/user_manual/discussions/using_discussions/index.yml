---
navigation_title: Threads verwenden
blocks:
  d6fe7310d19b1141:
    english: "# Using threads"
    translation: "# Threads verwenden"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  031f9244f107aba8:
    english: A discussion keeps its context, comments, decisions, and outcomes together in one thread. This page explains how to participate in a thread and use its navigation and actions.
    translation: Eine Diskussion hält ihren Kontext, Kommentare, Abstimmungen und Fazits in einem Thread zusammen. Auf dieser Seite erfährst du, wie du dich an einem Thread beteiligst und seine Navigation und Aktionen nutzt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  479a1564b496bfed:
    english: "## Thread anatomy"
    translation: "## Aufbau eines Threads"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb745de96e6a612d:
    english: 'A typical thread looks like this:'
    translation: 'Ein typischer Thread sieht so aus:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e69f7f0b13fd9f9:
    english: 'From the top of the page, a thread contains:'
    translation: 'Von oben nach unten enthält ein Thread:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5b47d6434aa50e94:
    english: "**Group name** - At the top left of the discussion page is the name of the group or subgroup that the discussion belongs to.  Click on this name to go back to the group page."
    translation: "**Gruppenname** - Oben links auf der Diskussionsseite steht der Name der Gruppe oder Untergruppe, zu der die Diskussion gehört. Klicke auf den Namen, um zur Gruppenseite zurückzukehren."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0dab4c46c2bee003:
    english: "**Discussion access** - The access icon at the top right opens the discussion's access settings. A group discussion is available to group members and anyone specifically invited to it, subject to the group's privacy settings."
    translation: "**Zugriff auf die Diskussion** - Das Zugriffssymbol oben rechts öffnet die Zugriffseinstellungen der Diskussion. Eine Gruppendiskussion ist für Gruppenmitglieder und eigens eingeladene Personen zugänglich, soweit die Privatsphäre-Einstellungen der Gruppe es erlauben."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e20178954e6d3ce0:
    english: "**Discussion title** - The name of the discussion."
    translation: "**Diskussionstitel** - Der Name der Diskussion."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  47687209ed924849:
    english: "**Category tags** - The discussion may have one or more category tags. Using simple tags helps people more easily find discussions of a similar type."
    translation: "**Schlagwörter für Kategorien** - Eine Diskussion kann ein oder mehrere Schlagwörter für Kategorien haben. Einfache Schlagwörter helfen dabei, ähnliche Diskussionen zu finden."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b817649f985f51de:
    english: "**Discussion author** - The name and avatar of the person who started the discussion, shown beneath the title."
    translation: "**Autor der Diskussion** - Name und Profilbild der Person, die die Diskussion begonnen hat, stehen unter dem Titel."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c44d5a833b4ec9ff:
    english: "**Date** - Hover over the date to see the full date and time of discussion start."
    translation: "**Datum** - Bewege den Mauszeiger über das Datum, um das vollständige Datum und die Uhrzeit des Diskussionsbeginns zu sehen."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b8062113f1078acb:
    english: "**Seen by** - In the right sidebar, shows who has read the discussion and when."
    translation: "**Angesehen von** - Zeigt in der rechten Seitenleiste, wer die Diskussion gelesen hat und wann."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  133d0c2e469e9683:
    english: "**Notified** - In the right sidebar, shows who has been notified about the discussion and whether each notification has been read or its email opened."
    translation: "**benachrichtigt** - Zeigt in der rechten Seitenleiste, wer über die Diskussion benachrichtigt wurde und ob die jeweilige Benachrichtigung gelesen oder ihre E-Mail geöffnet wurde."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9f788adb4eab80cc:
    english: "**Discussion context** - Content to frame the discussion."
    translation: "**Diskussionskontext** - Inhalte, die den Rahmen für die Diskussion bilden."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e8c5ae76dfb5b89b:
    english: "**Discussion interaction and administration tools** - The discussion context has controls to react to and edit it. The right sidebar contains notification, membership and administration actions."
    translation: "**Werkzeuge für Beteiligung und Verwaltung** - Beim Diskussionskontext findest du Steuerelemente, um darauf zu reagieren und ihn zu bearbeiten. Die rechte Seitenleiste enthält Aktionen für Benachrichtigungen, Mitglieder und die Verwaltung."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8f6eac4359c2b9f6:
    english: "**Comments** - Comments are displayed under the discussion context. The author's name, avatar and posting time show who wrote each comment and when. Interaction and administration tools are available on each comment."
    translation: "**Kommentare** - Kommentare stehen unter dem Diskussionskontext. Name, Profilbild und Zeitpunkt der Veröffentlichung zeigen, wer den jeweiligen Kommentar wann geschrieben hat. Für jeden Kommentar stehen Werkzeuge zur Beteiligung und Verwaltung bereit."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f978af6c9af4afe5:
    english: |-
      **Navigation, notifications and actions** - The right sidebar contains
      shortcuts to activity and milestones, notification and membership information,
      and the thread actions available to you.
    translation: |-
      **Navigation, Benachrichtigungen und Aktionen** - Die rechte Seitenleiste enthält
      Verknüpfungen zu Aktivitäten und Meilensteinen, Angaben zu Benachrichtigungen und Mitgliedern
      sowie die Thread-Aktionen, die dir zur Verfügung stehen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f8c4084e9e8a2b27:
    english: "## Discussion context"
    translation: "## Diskussionskontext"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5940bad6cb1cb49f:
    english: The discussion **context** is always found at the top of the discussion. Use the context to frame the discussion or decision.
    translation: Der **Kontext** steht immer am Anfang der Diskussion. Nutze ihn, um den Rahmen für die Diskussion oder Entscheidung zu setzen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  415dd2d0f1eacc9f:
    english: Think of your group as you write content in the discussion context.  Your aim is to get a discussion going, so consider how you can motivate people to participate.  In general, keep the discussion context simple and clear.
    translation: Denke beim Schreiben des Diskussionskontexts an deine Gruppe. Der Kontext soll eine Diskussion anstoßen. Überlege deshalb, was andere zur Teilnahme ermutigt. Halte ihn möglichst einfach und klar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a1fcece28d8fb61d:
    english: Write the discussion context when starting or editing a discussion. **Edit** a discussion with the pencil icon.
    translation: Schreibe den Diskussionskontext, wenn du eine Diskussion beginnst oder bearbeitest. Mit dem Stiftsymbol kannst du eine Diskussion **Bearbeiten**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2f47adddef6b31d9:
    english: As the discussion progresses, update discussion context.  Think of the context like a whiteboard in your meeting room, where you can write the agenda, the outcomes intended and how you plan to get there.
    translation: 'Aktualisiere den Diskussionskontext im Verlauf der Diskussion. Du kannst ihn wie eine Tafel in einem Besprechungsraum nutzen: Halte dort die Tagesordnung, die angestrebten Fazits und die nächsten Schritte fest.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c82ec20629208982:
    english: At the bottom of the context panel is a formatting bar, where you can format text, attach files, images and embed a video.
    translation: Unten im Kontextfeld befindet sich eine Formatierungsleiste. Dort kannst du Text formatieren, Dateien und Bilder anhängen und ein Video einbetten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e606d83ae0fb2178:
    english: "### Notify people about context changes"
    translation: "### Personen über Änderungen am Kontext benachrichtigen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d188326a58b28d96:
    english: When you edit the discussion context, use **What's changed?** to summarize the update and choose who should be notified.
    translation: Wenn du den Diskussionskontext bearbeitest, fasse die Änderung unter **Was hat sich geändert?** zusammen und wähle aus, wer benachrichtigt werden soll.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  842091a987742d6d:
    english: "![Editing a discussion context with a change summary and notification recipients](../notifying_people/thread_editcontext.png)"
    translation: "![Bearbeitung eines Diskussionskontexts mit einer Zusammenfassung der Änderung und Empfängern der Benachrichtigung](../notifying_people/thread_editcontext.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b885359dd7e83428:
    english: The summary appears as an item in the thread so participants can see what changed.
    translation: Die Zusammenfassung erscheint als Eintrag im Thread. So können die Teilnehmenden sehen, was sich geändert hat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c899c47e98f79a23:
    english: "![A timeline item describing a discussion context change](../notifying_people/thread_edit_comment.png)"
    translation: "![Ein Eintrag in der Zeitleiste, der eine Änderung am Diskussionskontext beschreibt](../notifying_people/thread_edit_comment.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  44ffd1d0a732b897:
    english: "## Navigation"
    translation: "## Navigation"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e96aef7a28a85001:
    english: 'The **Jump to** section of the right sidebar helps you move through a thread:'
    translation: 'Der Bereich **Springen zu** in der rechten Seitenleiste hilft dir, dich durch einen Thread zu bewegen:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4790c088af5fc09f:
    english: |-
      - **Start** goes to the discussion context
      - **New to you** appears when the thread contains activity you have not read
      - **Latest** appears when newer activity is available beyond the items currently loaded
      - milestone links go directly to important comments, polls, and outcomes
      - **End** goes to the latest item in the thread
    translation: |-
      - **Start** führt zum Diskussionskontext
      - **Neu für dich** erscheint, wenn der Thread Aktivitäten enthält, die du noch nicht gelesen hast
      - **Letzte** erscheint, wenn es neuere Aktivitäten gibt als die bisher geladenen Einträge
      - Meilenstein-Links führen direkt zu wichtigen Kommentaren, Abstimmungen und Fazits
      - **Ende** führt zum neuesten Eintrag im Thread
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  941ea9900465724a:
    english: Comments that include an H2 or H3 heading, polls, and proposals are automatically included as milestone links. Select any milestone to go directly to it.
    translation: Kommentare mit einer H2- oder H3-Überschrift, Abstimmungen und Vorschläge werden automatisch als Meilenstein-Links angezeigt. Wähle einen Meilenstein aus, um direkt dorthin zu gelangen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e94ea6f4b9dae8d4:
    english: When you add a comment, poll, vote, or outcome, Loomio marks your own new item as read. It will not appear as something new for you to review.
    translation: Wenn du einen Kommentar, eine Abstimmung, eine Stimme oder ein Fazit hinzufügst, markiert Loomio deinen neuen Eintrag als gelesen. Er erscheint für dich nicht als ungelesene Aktivität.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  34251ada1ba3e50b:
    english: "## Notifications and members"
    translation: "## Benachrichtigungen und Mitglieder"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  36a20a0e10208c7c:
    english: The right sidebar controls your email notifications and shows who has been invited, who has seen the thread, and who has been notified.
    translation: In der rechten Seitenleiste stellst du deine E-Mail-Benachrichtigungen ein. Dort siehst du auch, wer eingeladen wurde, wer den Thread angesehen hat und wer benachrichtigt wurde.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f2a437ac1169c882:
    english: "### Email notifications for this thread"
    translation: "### E-Mail-Benachrichtigungen für diesen Thread"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9bd7269489ed048e:
    english: Select the current notification setting to choose whether Loomio emails you about all activity, only activity that specifically notifies you, or no activity. Receiving email for all activity can produce many messages in an active thread.
    translation: Wähle die aktuelle Benachrichtigungseinstellung aus. Dort legst du fest, ob Loomio dir E-Mails zu allen Aktivitäten sendet, nur zu Aktivitäten, über die du ausdrücklich benachrichtigt wirst, oder zu keinen Aktivitäten. Bei einem aktiven Thread können E-Mails zu allen Aktivitäten viele Nachrichten erzeugen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0d64de2345c8eba9:
    english: "![Email when notified selected in the discussion sidebar](../notifying_people/thread_interact.png)"
