  712830f14602c6c7:
    english: The permissions tab controls which group operations are available to ordinary members and, for non-secret groups, to non-members. Open **Edit group settings** from the group page, then select **Permissions**.
    translation: Auf der Registerkarte „Berechtigungen“ legst du fest, welche Aktionen gewöhnliche Mitglieder und bei nicht geheimen Gruppen auch Nichtmitglieder ausführen können. Öffne auf der Gruppenseite **Gruppeneinstellungen bearbeiten** und wähle **Berechtigungen**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b71bf8cce1cb369c:
    english: "![Group permission settings](group_group_settings_permissions.png)"
    translation: "![Einstellungen für Gruppenberechtigungen](group_group_settings_permissions.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  88e5fcd302a53620:
    english: Administrators retain the ability to manage the group. Enabling a member permission extends that particular action to ordinary members; it does not make them administrators.
    translation: Admins können die Gruppe weiterhin verwalten. Wenn du eine Berechtigung für Mitglieder aktivierst, dürfen gewöhnliche Mitglieder die jeweilige Aktion ausführen. Sie werden dadurch nicht zu Admins.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5b2b9af0f68b7a57:
    english: 'Permissions include whether members can:'
    translation: 'Mit den Berechtigungen legst du fest, ob Mitglieder:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8377b499d13690c0:
    english: |-
      - add members or invite guests;
      - send announcements;
      - create subgroups;
      - start and manage discussions;
      - create and manage tags;
      - edit or delete comments where the setting permits;
      - start proposals and polls; and
      - create discussion and poll templates.
    translation: |-
      - Mitglieder hinzufügen oder Gäste einladen dürfen;
      - Ankündigungen senden dürfen;
      - Untergruppen erstellen dürfen;
      - Diskussionen starten und verwalten dürfen;
      - Schlagwörter erstellen und verwalten dürfen;
      - Kommentare bearbeiten oder löschen dürfen, wenn die Einstellung dies erlaubt;
      - Vorschläge und Abstimmungen starten dürfen; und
      - Vorlagen für Diskussionen und Abstimmungen erstellen dürfen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  87166abe7eea1ab3:
    english: For groups that are not secret, administrators can separately allow non-members to start discussions. A non-member who starts a discussion becomes a guest of that discussion but does not gain access to other private discussions or become a group member.
    translation: Bei nicht geheimen Gruppen können Admins Nichtmitgliedern gesondert erlauben, Diskussionen zu starten. Wer als Nichtmitglied eine Diskussion startet, wird Gast dieser Diskussion. Dadurch erhält die Person weder Zugriff auf andere private Diskussionen noch eine Gruppenmitgliedschaft.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3d01d10a97636b1e:
    english: The **Admins can edit members' comments** setting gives administrators an exceptional moderation capability. Enable it only when the group has agreed that administrators should be able to alter member-authored content.
    translation: Die Einstellung **Admins können Kommentare von Mitgliedern bearbeiten** gibt Admins eine besondere Möglichkeit zur Moderation. Aktiviere sie nur, wenn die Gruppe zugestimmt hat, dass Admins Inhalte von Mitgliedern ändern dürfen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b0af0135752a461f:
    english: Review permissions when the group's purpose, membership, or moderation responsibilities change. Give each role only the capabilities it needs.
    translation: Überprüfe die Berechtigungen, wenn sich der Zweck der Gruppe, ihre Mitgliedschaft oder die Zuständigkeiten für die Moderation ändern. Gib jeder Rolle nur die Berechtigungen, die sie benötigt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
