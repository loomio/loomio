  fce0c96bcc92d0aa:
    english: "> *“With the advice process, any person can make any decision but must seek advice from affected parties and people with expertise.” - Frederick Laloux, Reinventing Organizations.*"
    translation: "> *”Neuvontaprosessissa kuka tahansa voi tehdä minkä tahansa päätöksen, mutta hänen on pyydettävä neuvoja niiltä, joihin päätös vaikuttaa, sekä asiaa tuntevilta ihmisiltä.” – Frederick Laloux, Reinventing Organizations.*"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  66f32f2b3cf56e0d:
    english: |-
      ## Key points
      - Freedom to make a decision.
      - Invite people to offer their advice.
      - Take into account other people’s voices.
    translation: |-
      ## Pääkohdat
      - Saat tehdä päätöksen itse.
      - Kutsu muita antamaan neuvoja.
      - Ota muiden näkemykset huomioon.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  54d4f1ac3c2bd91f:
    english: |-
      ## Steps in the Advice process
      You notice a problem or opportunity and take the initiative.
      1. Frame the decision, identify who owns it, and invite the affected people and relevant experts.
      2. Start a Loomio **discussion** and, when a structured response or deadline is useful, run an **Advice proposal**.
      3. Clarify and build on the advice through vote reasons and discussion comments.
      4. Make the decision, then publish an **outcome** explaining what was decided and how the advice informed it.
    translation: |-
      ## Neuvontaprosessin vaiheet
      Huomaat ongelman tai mahdollisuuden ja teet aloitteen.
      1. Määrittele päätettävä asia ja päätöksestä vastaava henkilö. Kutsu mukaan ihmiset, joihin päätös vaikuttaa, sekä asiaankuuluvat asiantuntijat.
      2. Aloita Loomiossa **keskustelu**. Jos tarvitset määräajan tai jäsenneltyjä vastauksia, käynnistä **neuvoa pyytävä ehdotus**.
      3. Selvennä neuvoja ja kehitä ajatusta äänestysperustelujen ja keskustelukommenttien avulla.
      4. Tee päätös ja julkaise **tulos**, jossa kerrot, mitä päätit ja miten neuvot vaikuttivat päätökseen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6088bbd1e12e8920:
    english: "## Benefits\n- Advice helps you make a better decision for your organization. \n- Foster relationships, learning opportunities and diverse input.\n- Stimulate initiative and creativity, and more enjoyable work."
    translation: "## Hyödyt\n- Neuvot auttavat sinua tekemään paremman päätöksen organisaatiosi kannalta. \n- Prosessi vahvistaa suhteita, tarjoaa oppimismahdollisuuksia ja tuo esiin erilaisia näkemyksiä.\n- Se kannustaa aloitteellisuuteen ja luovuuteen sekä voi tehdä työstä mielekkäämpää."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
