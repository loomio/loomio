    translated_on: '2026-09-29'
  85fc948a4e849ba8:
    english: A guest can see and participate in this thread but cannot see other discussions in the group unless separately invited.
    translation: A vendég láthatja ezt a szálat és részt vehet benne, de a csoport többi beszélgetését csak akkor láthatja, ha külön meghívják.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9f1010b58cc5439f:
    english: "![Inviting a guest by email address](../notifying_people/invite_guest.png)"
    translation: "![Vendég meghívása e-mail-címmel](../notifying_people/invite_guest.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e688189fa93b1e49:
