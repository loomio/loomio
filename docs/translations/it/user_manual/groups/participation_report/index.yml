  fe690a715f8a00b5:
    english: The report shows how many threads, comments, polls, votes and reactions have happened per month. This is graphed so you can see ebbs and flows of usage.
    translation: Il rapporto mostra il numero mensile di discussioni, commenti, sondaggi, voti e reazioni. Il grafico ti permette di vedere come cambia l'attività nel tempo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  21bf7cb257f4bb03:
    english: Click specific labels on the graph to remove them from view.
    translation: Clicca sulle etichette del grafico per nascondere i dati corrispondenti.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
