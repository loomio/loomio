    english: |-
      ## Content translation
      When someone in your group writes their message in a language that is different to your preferred language, a "translate" button will appear below the message. You can click this button to automatically translate the message into your preferred language.
    translation: |-
      ## Übersetzung von Inhalten
      Wenn jemand in deiner Gruppe eine Nachricht in einer anderen Sprache schreibt, erscheint darunter die Schaltfläche „Übersetzen“. Klicke darauf, um die Nachricht automatisch in deine bevorzugte Sprache zu übersetzen.
