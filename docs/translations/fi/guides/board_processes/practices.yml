  3242767a5e393028:
    english: Good governance includes establishing, reviewing and challenging governance practices, policies and procedures to continously improve board effectiveness.
    translation: Hyvään hallintoon kuuluu käytäntöjen, linjausten ja menettelytapojen luominen, arviointi ja kyseenalaistaminen, jotta hallituksen työskentely paranee jatkuvasti.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c4d8cb7f7eb901a6:
    english: However many boards are short on time and often weighed down by board papers, compliance and risk, without sufficient time to discuss and debate critical strategy and performance issues.
    translation: Monilla hallituksilla on kuitenkin vähän aikaa. Kokousaineistot, vaatimusten noudattaminen ja riskien käsittely vievät aikaa, jolloin tärkeistä strategiaan ja tuloksiin liittyvistä kysymyksistä ei ehditä keskustella riittävästi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  eb59655c49bf902d:
    english: "## On Loomio\nLoomio offers the opportunity to work online on a document, policy or procedure.  Discussion and decisions are contained in a thread that members can access when and wherever works for them.  "
    translation: |-
      ## Loomiossa
      Loomiossa voit työstää asiakirjaa, linjausta tai menettelytapaa verkossa. Keskustelu ja päätökset pysyvät keskusteluketjussa, johon jäsenet voivat osallistua heille sopivana aikana ja sopivasta paikasta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a0d6426929e39b38:
    english: 'Use a **thread** for each document, policy or procedure. The thread is the container for discussion, and holds document drafts and subsequent versions of the document.  '
    translation: Käytä omaa **keskusteluketjua** kullekin asiakirjalle, linjaukselle tai menettelytavalle. Ketjuun kootaan keskustelu, asiakirjaluonnokset ja asiakirjan myöhemmät versiot.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  551c5aac67b42167:
    english: With a Loomio thread, you can organize so that the 2-3 people working on the document text are discussing particulars in the thread.  The thread could be private amongst just those 2-3 people, or run openly in the group so that the work is transparent to all members.
    translation: Voit järjestää työskentelyn niin, että asiakirjaa kirjoittavat 2–3 henkilöä keskustelevat yksityiskohdista ketjussa. Ketju voi olla vain heidän käytössään tai avoin koko ryhmälle, jolloin kaikki jäsenet voivat seurata työn etenemistä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1400a6d44d7d4e35:
    english: When the document reaches a draft version, use a **Sense check poll** to notify members that the draft document is ready for review, and invite members to read the document and respond with any comments or questions.  As well as letting everyone know that the work is progressing, the poll closing date encourages people to participate.
    translation: Kun asiakirjasta on luonnos, ilmoita jäsenille **Sense check -kyselyllä**, että luonnos on valmis arvioitavaksi. Pyydä heitä lukemaan asiakirja ja esittämään kommentteja tai kysymyksiä. Kysely kertoo kaikille työn etenemisestä, ja sen päättymispäivä kannustaa osallistumaan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  44bcb71608c8f14a:
    english: The document may require several draft iterations.
    translation: Asiakirja voi käydä läpi useita luonnosversioita.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a5371854b689874a:
    english: When a 'final' draft is ready, raise a **Proposal** to approve the document.
    translation: Kun lopullinen luonnos on valmis, tee asiakirjan hyväksymistä varten **Ehdotus**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5998c94bd5b640ab:
    english: Loomio enables a board to progress work on governance improvement between meetings without eating into precious time in meetings.
    translation: Loomiossa hallitus voi edistää hallintokäytäntöjen kehittämistä kokousten välillä, jolloin kokouksissa jää enemmän aikaa muille asioille.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
