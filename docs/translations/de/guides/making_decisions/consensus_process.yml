  feb488e50bdd3834:
    english: This template includes a Block option by default. Block isn't suitable for every group — it can be controversial or misused. If you don't use block in your decision-making process, we recommend editing the template to remove it.
    translation: 'Diese Vorlage enthält standardmäßig die Option Veto. Ein Veto passt nicht zu jeder Gruppe: Es kann umstritten sein oder missbraucht werden. Wenn ihr in eurem Entscheidungsprozess kein Veto verwendet, empfehlen wir, die Option aus der Vorlage zu entfernen.'
    status: machine
