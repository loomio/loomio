  0b8bb762e37fb8c3:
    english: |-
      To create a poll or proposal and only invite the delegates, use the "Selected people only" poll setting.
      ![Selected people only setting when starting a proposal](poll_invited_people_only.png)
      Then when inviting people to vote you will see the "Delegates of group-name" option.
      ![Delegates of Oatmilk Cooperative option in the invite-to-vote form](poll_invite_delegates_group.png)
    translation: |-
      Kun luot kyselyn tai ehdotuksen ja haluat kutsua vain edustajat, valitse kyselyn asetukseksi **Vain valitut henkilöt**.
      ![Vain valitut henkilöt -asetus ehdotusta aloitettaessa](poll_invited_people_only.png)
      Kun kutsut ihmisiä äänestämään, näet vaihtoehdon **ryhmän nimen edustajat**.
      ![Oatmilk Cooperative -ryhmän edustajat -vaihtoehto äänestyskutsun lomakkeessa](poll_invite_delegates_group.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e895a07efeaf4dcf:
    english: |-
      You can see a list of who the delegates are from the members tab of your group page. Use the filter menu and select "Delegates".
      ![Delegates option in the members filter](members_list_delegates.png)
    translation: |-
      Näet edustajien luettelon ryhmäsi sivun jäsenet-välilehdellä. Avaa suodatinvalikko ja valitse **Edustajat**.
      ![Edustajat-vaihtoehto jäsenluettelon suodattimessa](members_list_delegates.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
