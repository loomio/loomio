  b3051bc079ccb2a4:
    english: |-
      # Microsoft Teams integration
      _Connect your Loomio group notifications to Microsoft Teams._
    translation: |-
      # Інтэграцыя з Microsoft Teams
      _Падключыце апавяшчэнні вашай групы ў Loomio да Microsoft Teams._
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1512a87b3144ae1e:
    english: 'Loomio can send notifications into your Microsoft Teams when new discussions, proposals, comments, votes, and outcomes occur. '
    translation: Loomio можа адпраўляць апавяшчэнні ў Microsoft Teams, калі з’яўляюцца новыя абмеркаванні, прапановы, каментарыі, галасы і высновы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
