  4a423dbb4fd59b45:
    english: Redaction keeps the user's comments and other user-generated content within their groups, but removes known personally identifying information such as name, bio, profile photo, email address, login credentials, identities, and active sessions.
    translation: L’effacement des données personnelles conserve les commentaires et les autres contenus créés par l’utilisateur dans ses groupes. Il supprime les informations personnelles connues, notamment le nom, la biographie, la photo de profil, l’adresse e-mail, les identifiants de connexion, les identités et les sessions actives.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
