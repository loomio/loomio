    translation: Se invita a los miembros de la junta directiva a votar para aprobar el concepto de marca. La junta ya había acordado que, para aprobar propuestas como esta, más del 75 % de sus miembros deben votar De acuerdo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  feb488e50bdd3834:
    english: This template includes a Block option by default. Block isn't suitable for every group — it can be controversial or misused. If you don't use block in your decision-making process, we recommend editing the template to remove it.
    translation: 'Esta plantilla incluye la opción Bloquear de forma predeterminada. Bloquear no es adecuado para todos los grupos: puede generar controversia o utilizarse de forma indebida. Si tu proceso de decisión no incluye esta opción, te recomendamos editar la plantilla para eliminarla.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5130a17b3032bee3:
