navigation_title: Escolher
blocks:
  581de5d50d3dc442:
    english: "# Choose"
    translation: "# Escolher"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  733b320e0407fbdc:
    english: Choose is a simple poll for finding the most popular option or making a shortlist. Participants select one or more options, depending on the limits you set. This voting method is commonly known as multiple choice.
    translation: Escolher é uma enquete simples para identificar a opção mais popular ou criar uma lista de opções. As pessoas selecionam uma ou mais opções, conforme os limites que você definir. Esse método de votação é conhecido como múltipla escolha.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '09aefb579b50874b':
    english: "## When to use Choose"
    translation: "## Quando usar Escolher"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  be35cf72fcaf9c4d:
    english: 'Use Choose when the options are distinct and you need to count how many people select each one. It works well for:'
    translation: 'Use Escolher quando as opções forem distintas e você precisar contar quantas pessoas selecionaram cada uma. É útil para:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dcc6f6b9238155b2:
    english: |-
      - choosing one venue from a shortlist;
      - selecting up to three topics for an agenda;
      - deciding which design should proceed to the next round; or
      - checking which services members intend to use.
    translation: |-
      - escolher um local entre algumas opções;
      - selecionar até três assuntos para uma pauta;
      - decidir qual projeto deve avançar para a próxima etapa; ou
      - verificar quais serviços os membros pretendem usar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3770d0653b752de5:
    english: Choose records selections, not the strength or order of a person's preferences. Use [Score](/en/user_manual/polls/score/) to measure how strongly people support every option, [Allocate](/en/user_manual/polls/allocate/) when there is a limited budget, or [Rank](/en/user_manual/polls/rank/) when preference order matters.
    translation: Escolher registra as opções selecionadas, mas não a intensidade nem a ordem das preferências de cada pessoa. Use [Pontuação](/en/user_manual/polls/score/) para medir o apoio a cada opção, [Alocar](/en/user_manual/polls/allocate/) quando houver um orçamento limitado ou [Classificação](/en/user_manual/polls/rank/) quando a ordem de preferência for importante.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f15aca327e894f30:
    english: "## Example: set a planning-meeting agenda"
    translation: "## Exemplo: definir a pauta de uma reunião de planejamento"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f51e09afa0ed1e53:
    english: Oatmilk Cooperative needs to decide which parts of a returnable-bottle trial need the most time at its next planning meeting. The poll asks each person to choose up to two topics. Its details explain how the result will be used, and each option includes enough information to distinguish it from the others.
    translation: A Cooperativa Oatmilk precisa decidir quais partes de um teste com garrafas retornáveis exigem mais tempo na próxima reunião de planejamento. A enquete pede que cada pessoa escolha até dois assuntos. Os detalhes explicam como o resultado será usado, e cada opção traz informações suficientes para distingui-la das demais.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c74ebb16f872b3c6:
    english: "## Set up the poll"
    translation: "## Configure a enquete"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  abc749fec8671661:
    english: Give the poll a specific question as its title. In **Details**, explain what participants should consider and what will happen with the result. Add each available option, then set the **Minimum choices** and **Maximum choices**.
    translation: Use uma pergunta específica como título da enquete. Em **Detalhes**, explique o que as pessoas devem considerar e o que acontecerá com o resultado. Adicione cada opção disponível e defina **Escolhas mínimas** e **Máxima escolha**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e878ddc9f61dd243:
    english: Set both limits to 1 when participants must choose exactly one option. Set a higher maximum when you want a shortlist. Avoid allowing so many choices that participants can select nearly every option, because that makes the result less useful.
    translation: Defina os dois limites como 1 quando cada pessoa precisar escolher exatamente uma opção. Defina um limite máximo maior para formar uma lista de opções. Evite permitir que as pessoas selecionem quase todas as opções, pois isso torna o resultado menos útil.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  152fec5018fc232b:
    english: Use the pencil icon beside an option to add a meaning or further explanation. This is useful when a short option name could be interpreted in different ways.
    translation: Use o ícone de lápis ao lado de uma opção para explicar seu significado ou acrescentar informações. Isso ajuda quando um nome curto pode ter mais de uma interpretação.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  59e405cf9a028c8d:
    english: Under **More settings**, **Show options in random order** can reduce the effect of always presenting one option first.
    translation: Em **Mais configurações**, **Mostrar opções em ordem aleatória** pode reduzir o efeito de apresentar sempre a mesma opção primeiro.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Vote"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7db2d0e58e5fb4e4:
    english: The vote form tells participants how many options they may select. In this example, the voter selects **Cafe collection schedule** and **Washing workflow**, then gives a reason connecting those choices to the trial.
    translation: O formulário de votação informa quantas opções cada pessoa pode selecionar. Neste exemplo, a pessoa seleciona **Cronograma de coleta nos cafés** e **Processo de lavagem**. Depois, apresenta uma justificativa que relaciona essas escolhas ao teste.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e55e4b8950a5fd46:
    english: A reason can reveal why an option matters and what work participants expect it to cover. If reasons are important to the decision, configure the vote-reason setting before starting the poll.
    translation: Uma justificativa pode mostrar por que uma opção é importante e que trabalho as pessoas esperam que ela inclua. Se as justificativas forem importantes para a decisão, configure essa opção antes de iniciar a enquete.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Leia os resultados"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c1ec47f66384e3bb:
    english: The results show the share of all selections received by each option, the number of voters who selected it, and who has not voted. Because each person could choose two options, the percentages describe selections rather than a percentage of people.
    translation: Os resultados mostram a parcela do total de seleções recebida por cada opção, quantas pessoas a selecionaram e quem ainda não votou. Como cada pessoa podia escolher duas opções, os percentuais representam seleções, não uma porcentagem de pessoas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6cbc0f9d6fdf6727:
    english: In this example, **Cafe collection schedule** has three selections. **Washing workflow** and **Return-rate reporting** each have two. The result supports giving cafe collections the most agenda time, but the tied topics still require the organizer to decide how the remaining time is divided.
    translation: Neste exemplo, **Cronograma de coleta nos cafés** recebeu três seleções. **Processo de lavagem** e **Relatório da taxa de devolução** receberam duas cada. O resultado indica que a coleta nos cafés deve receber mais tempo na pauta, mas quem organiza a reunião ainda precisa decidir como dividir o tempo restante entre os assuntos empatados.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  adb7eb28e16616be:
    english: When the poll closes, publish an **Outcome** explaining what the group will do with the result.
    translation: Quando a enquete for encerrada, publique uma **Conclusão** explicando o que o grupo fará com o resultado.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
