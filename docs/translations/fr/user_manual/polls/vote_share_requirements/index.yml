  2051086558658db2:
    english: Set a vote share requirement on an option when a proposal must receive a particular percentage of support, or remain below a particular percentage of opposition, to pass.
    translation: Définissez une exigence de répartition des votes pour une option lorsqu’une proposition doit obtenir un certain pourcentage de soutien, ou rester sous un certain pourcentage d’opposition, pour être adoptée.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f00d3806d6b890ae:
    english: Vote share requirements can be combined with a [quorum](/en/user_manual/polls/quorum/) to require both sufficient participation and a particular distribution of votes.
    translation: Vous pouvez associer une exigence de répartition des votes à un [quorum](/en/user_manual/polls/quorum/) pour imposer à la fois une participation suffisante et une répartition précise des votes.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0fc0acd12134f67e:
    english: When creating a proposal, select the edit icon beside an option.
    translation: Lorsque vous créez une proposition, sélectionnez l’icône de modification à côté d’une option.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
