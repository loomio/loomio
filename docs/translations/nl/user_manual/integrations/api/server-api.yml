  5363d74e43453a93:
    english: "## SSO Profile Sync Settings"
    translation: "## Instellingen voor SSO-profielsynchronisatie"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5d1d8b72689c1c84:
    english: Use these settings when another system manages Loomio profile fields.
    translation: Gebruik deze instellingen als een ander systeem de profielvelden in Loomio beheert.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  83b6503850a3581c:
    english: "`LOOMIO_DISABLE_EDIT_USER_PROFILE=1` prevents users from editing these fields themselves:"
    translation: "`LOOMIO_DISABLE_EDIT_USER_PROFILE=1` voorkomt dat gebruikers deze velden zelf bewerken:"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b40beb01122e6c22:
    english: |-
      | Field | Notes |
      | --- | --- |
      | `name` | Managed by external sync |
      | `username` | Managed by external sync |
      | `email` | Managed by external sync |
      | `avatar_kind` / `uploaded_avatar` | Managed by external sync |
    translation: |-
      | Veld | Opmerkingen |
      | --- | --- |
      | `name` | Beheerd via externe synchronisatie |
      | `username` | Beheerd via externe synchronisatie |
      | `email` | Beheerd via externe synchronisatie |
      | `avatar_kind` / `uploaded_avatar` | Beheerd via externe synchronisatie |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d914243a6d80944b:
    english: Users can still edit Loomio-local fields such as `short_bio` and `location`.
    translation: Gebruikers kunnen velden die alleen in Loomio worden beheerd, zoals `short_bio` en `location`, nog steeds bewerken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d2d40191ec060f7e:
    english: "`LOOMIO_SSO_UPDATE_USER_PROFILE_ON_LOGIN=1` updates `name` and `email` from SSO login data. Leave it commented out or unset when an external sync script should be the only source of those updates."
    translation: "`LOOMIO_SSO_UPDATE_USER_PROFILE_ON_LOGIN=1` werkt `name` en `email` bij met gegevens van de SSO-aanmelding. Laat de instelling als commentaar staan of stel haar niet in als alleen een extern synchronisatiescript deze velden mag bijwerken."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f19f0588ef52b814:
    english: "`LOOMIO_SSO_FORCE_USER_ATTRS` still works for existing installs. It both disables user edits and updates `name` and `email` on SSO login."
    translation: "`LOOMIO_SSO_FORCE_USER_ATTRS` werkt nog steeds voor bestaande installaties. Deze instelling voorkomt dat gebruikers hun profiel bewerken en werkt `name` en `email` bij wanneer ze zich via SSO aanmelden."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
