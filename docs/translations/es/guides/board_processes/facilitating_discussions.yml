navigation_title: Facilitar discusiones
blocks:
  c377321bc013336b:
    english: "# Facilitating discussions"
    translation: "# Facilitar discusiones"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b771c6c746b8dc40:
    english: 'At times topics arise that require the attention of board or committee members mid-cycle, between meetings. '
    translation: A veces surgen temas que requieren la atención de los miembros de la junta o de un comité entre reuniones.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b5fc5f12c8e44c40:
    english: And sometimes there is just not space during a meeting for discussion or to sufficiently deliberate on a decision.
    translation: Otras veces, durante una reunión no hay tiempo suficiente para debatir un tema o deliberar sobre una decisión.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  79f2f83380e195c4:
    english: "## On Loomio"
    translation: "## En Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  14d5e62d33996982:
    english: Use a Loomio **thread** to facilitate a discussion.  Give the thread a descriptive title that members will recognize and provide details in the thread context.  Add a relevant category tag to help members find the thread in future.
    translation: Usa un **hilo** de Loomio para facilitar una discusión. Ponle un título descriptivo que los miembros puedan reconocer y añade los detalles en el contexto del hilo. Añade una etiqueta de categoría pertinente para ayudarles a encontrarlo más adelante.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d35b4315f4e42cb:
    english: Notify members of the thread by inviting them, so they will receive a copy of the thread by email.  Members can participate in the discussion by clicking on the link to go to Loomio, or reply to the notification email and their comment will appear as a comment in the thread.
    translation: Invita a los miembros al hilo para avisarles y que reciban una copia por correo electrónico. Pueden participar en la discusión siguiendo el enlace a Loomio o respondiendo al correo de notificación. Su respuesta aparecerá como comentario en el hilo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f7d839f27c1a6f72:
    english: A Loomio thread enables you to attach files or link to online resources to support the discussion.
    translation: En un hilo de Loomio puedes adjuntar archivos o enlazar recursos en línea para apoyar la discusión.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e45d25d90798cf1e:
    english: "Common examples include:\n- review and develop a policy\n- seek advice from the board about a topic or issue\n- discuss strategy \n- explore an idea or opportunity\n- assess risk"
    translation: |-
      Algunos ejemplos habituales son:
      - revisar y elaborar una política
      - pedir consejo a la junta sobre un tema o problema
      - debatir una estrategia
      - explorar una idea u oportunidad
      - evaluar riesgos
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  86ace2adbcf3df6f:
    english: "## Issues that arise between board meetings"
    translation: "## Temas que surgen entre reuniones de la junta"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  48f6023950ee0729:
    english: 'A lot can happen in an organization between meetings, and most people rely on email to alert board members.  Trying to keep track of a discussion on email is tricky, with replies often lost in in-boxes and people left out.  '
    translation: 'Entre reuniones pueden pasar muchas cosas en una organización, y es habitual avisar a los miembros de la junta por correo electrónico. Seguir una discusión por correo es difícil: las respuestas pueden perderse entre los mensajes y algunas personas pueden quedar fuera.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1cb0e78c848b9621:
    english: "*“You can’t do governance by email!”, Richard Westlake (Westlake Governance).*"
    translation: "*«No se puede gobernar por correo electrónico», Richard Westlake (Westlake Governance).*"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  eddf348746c93b4c:
    english: 'When an issue arises requiring board attention, use a Loomio thread rather than email.  Members can reply via email and their comment will appear in the Loomio thread, keeping the discussion in one place. '
    translation: Cuando surja un tema que requiera la atención de la junta, usa un hilo de Loomio en lugar del correo electrónico. Los miembros pueden responder por correo y sus comentarios aparecerán en el hilo, de modo que la discusión quede reunida en un solo lugar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2f7ad89003f79fb8:
    english: |-
      Here's how:
      - Make the email subject line the title of your thread,
      - write your email content in the thread context,
      - invite your team to the thread with their email address or Loomio user name.
    translation: |-
      Hazlo así:
      - Usa el asunto del correo como título del hilo,
      - escribe el contenido del correo en el contexto del hilo,
      - invita a tu equipo al hilo mediante sus direcciones de correo electrónico o nombres de usuario de Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9825cbb88dcedc3d:
    english: |-
      A Loomio thread means that:
      - All info about a topic is organized in one easily accessible place,
      - people can respond without generating reply/reply-all email chains that risk leaving people out,
      - you can see who has read the message and who needs a nudge,
      - you can progress actual work to an outcome, and cut down on the amount of email.
    translation: |-
      Un hilo de Loomio permite:
      - organizar toda la información sobre un tema en un lugar de fácil acceso,
      - responder sin crear cadenas de correos que puedan dejar a personas fuera,
      - ver quién ha leído el mensaje y a quién conviene recordárselo,
      - avanzar en el trabajo hasta llegar a una conclusión y reducir la cantidad de correos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fb9adc7cb7922016:
    english: "## When there isn't space during meetings"
    translation: "## Cuando no hay tiempo suficiente durante las reuniones"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6b1c61424aa7e74b:
    english: When an agenda item cannot be resolved within the time available in your board meeting, you can move this for further discussion to Loomio. Direct people to the relevant thread, or start a new one and notify your board members.
    translation: Si no hay tiempo para resolver un punto del orden del día durante la reunión de la junta, puedes continuar la discusión en Loomio. Indica a las personas cuál es el hilo correspondiente o crea uno nuevo y avisa a los miembros de la junta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ced9caddb281230f:
    english: This relieves pressure on your board, allows more time for information gathering, discussion and deeper reflection which often results in a better quality decision.
    translation: Así reduces la presión sobre la junta y dispones de más tiempo para reunir información, debatir y reflexionar. Esto suele ayudar a tomar una mejor decisión.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
