  cce1047bc62d8a5e:
    english: "# Intro to Groups"
    translation: "# Вступ до груп"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  91a303d3d1fb3894:
    english: 'A Loomio group is a safe place for people to meet, have discussions and make decisions. '
    translation: Група Loomio — це безпечне місце, де люди можуть зустрічатися, обговорювати питання й ухвалювати рішення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ea5096230dfe16d4:
    english: 'It’s a container where group members can find and share information, participate in important discussions and decisions that affect their work.  '
    translation: У групі учасники можуть знаходити інформацію й ділитися нею, а також брати участь у важливих обговореннях і рішеннях, що впливають на їхню роботу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  47903117cdc64e73:
    english: A Loomio group looks like this.  At the top of the page you will see an image and logo that you can tailor to represent your organization.  This allows people arriving into your group to see they have joined a place they recognize and feel welcome - a safe space where people feel at home, amongst friends and can participate effectively.
    translation: Так виглядає сторінка групи Loomio. Угорі ви побачите зображення й логотип. Їх можна налаштувати так, щоб вони представляли вашу організацію. Це допомагає людям, які приєднуються до групи, упізнати її та почуватися бажаними гостями. У такому просторі їм легше брати участь в обговореннях і рішеннях.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3d39462ab98c79e6:
    english: "![The Oatmilk Cooperative group page, with its description and discussion list](group_page.png)"
    translation: "![Сторінка групи кооперативу Oatmilk з описом і списком обговорень](group_page.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  59f3bebbce1676a6:
    english: |-
      Choose a representative name for your group and use the group description to outline;
      - **what** this group is used for,
      - **why** this is important,
      - **who** is involved, and
      - **how** members can participate.
    translation: |-
      Виберіть назву, яка відображає призначення вашої групи, а в описі зазначте:
      - **для чого** існує ця група,
      - **чому** це важливо,
      - **хто** бере участь і
      - **як** учасники можуть долучитися.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  79ae54bca7eb1797:
    english: You may also include information like a code of conduct, terms of reference or other governing documents for the group.
    translation: Ви також можете додати кодекс поведінки, положення про роботу групи чи інші документи, що визначають її правила.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '018c400616dad5f4':
    english: If you are preparing a new group, see [Introducing Loomio to your group](/en/user_manual/overview/introducing_loomio) for a practical sequence from choosing the first piece of work through to recording an outcome.
    translation: 'Якщо ви створюєте нову групу, перегляньте [Як представити Loomio вашій групі](/en/user_manual/overview/introducing_loomio). Там описано послідовність дій: від вибору першого завдання до запису висновку.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1bda53ca8e31780c:
    english: "## Administration, Facilitation and Moderation - Code of Conduct"
    translation: "## Адміністрування, фасилітація та модерація — кодекс поведінки"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1091f77d5ab879ed:
    english: 'Loomio is built to foster inclusive participation, diversity and trust - helping groups make better decisions together. '
    translation: Loomio допомагає залучати різних людей до участі й підтримувати довіру, щоб групи могли разом ухвалювати кращі рішення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1ac058350eea2c6d:
    english: 'Some topics bring tension in a group.  So it''s important to allow a robust discussion to take place, while ensuring it is also a safe place, particularly for vulnerable people in your group. '
    translation: Деякі теми можуть спричиняти напруження в групі. Важливо дати людям змогу відкрито їх обговорювати й водночас зберігати безпечний простір, особливо для вразливих учасників групи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  999bb2251bf623cd:
    english: 'We recommend establishing a code of conduct for your group, to help everyone be aware of their responsibility for appropriate behaviour and encourage self-regulation. '
    translation: Рекомендуємо ухвалити кодекс поведінки для вашої групи. Він допоможе кожному зрозуміти свою відповідальність за належну поведінку та дотримуватися спільних правил.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9a77fa2d5f4fdb01:
    english: See the [Facilitator's Guide](/en/guides/facilitators_guide/commencing#culture-protocol-expectations) to further explore the value of a code of conduct.
    translation: Докладніше про користь кодексу поведінки читайте в [Посібнику з фасилітації](/en/guides/facilitators_guide/commencing#culture-protocol-expectations).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
