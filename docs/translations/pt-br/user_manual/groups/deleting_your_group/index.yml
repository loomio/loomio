navigation_title: Excluindo seu grupo
blocks:
  6e0bf431fbefa0d3:
    english: "# Deleting your group"
    translation: "# Excluindo seu grupo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f8e8d1ee802cae90:
    english: 'Deleting your Loomio group initiates a process to permanently delete all group data. '
    translation: Ao excluir seu grupo no Loomio, você inicia o processo de exclusão permanente de todos os dados do grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  214aa96eca0b90ca:
    english: If there is any data you wish to retain, make sure you [export group data](/en/user_manual/groups/data_export/) and manually download any important files you have uploaded before you continue.
    translation: Se quiser guardar algum dado, [exporte os dados do grupo](/en/user_manual/groups/data_export/) e baixe manualmente os arquivos importantes que você enviou antes de continuar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  181fecc458dcc49d:
    english: Open the group drop down menu by clicking on the three dots, and select the **Delete group** option to remove access to the group and to initiate deletion of all group data from our records. You must be an admin to delete a group.
    translation: Abra o menu do grupo clicando nos três pontos e selecione **Deletar grupo** para remover o acesso ao grupo e iniciar a exclusão de todos os dados do grupo dos nossos registros. Você precisa ser administrador para excluir um grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f5178957964c2bc0:
    english: When you delete a group, it is removed from view immediately and will be permanently deleted after 90 days. You and group members immediately lose access to the group. If a mistake was made, contact us within 90 days of deleting your group to request restoration.
    translation: Quando você exclui um grupo, ele deixa de aparecer imediatamente e é excluído permanentemente após 90 dias. Você e os membros perdem o acesso ao grupo de imediato. Se a exclusão foi um engano, entre em contato conosco em até 90 dias para solicitar a restauração.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c15f72841d15dc52:
    english: Groups awaiting deletion and their subgroups are unavailable to members and coordinators for viewing, participation, or export, including polls opened from saved links. Members cannot create or edit content, vote, send announcements or reminders, or accept invitations. Export the group and download important files before confirming deletion. Direct discussions and polls are unaffected.
    translation: Enquanto aguardam a exclusão, o grupo e seus subgrupos ficam indisponíveis para visualização, participação e exportação por membros e administradores. Isso inclui enquetes abertas por links salvos. Os membros não podem criar nem editar conteúdo, votar, enviar anúncios ou lembretes, nem aceitar convites. Exporte os dados do grupo e baixe os arquivos importantes antes de confirmar a exclusão. Discussões diretas e enquetes diretas não são afetadas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5122280818cc30c7:
    english: Scheduling the group for deletion stops pending activity notifications and poll reminders for the group and its subgroups. Messages already being sent may still arrive.
    translation: Ao agendar a exclusão do grupo, você interrompe as notificações de atividade e os lembretes de enquetes pendentes do grupo e de seus subgrupos. Mensagens que já estão sendo enviadas ainda podem chegar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  953ebf00860389c1:
    english: The warning email includes counts for the group's subgroups, members, discussions, polls and comments. If you need to keep the group or [export its data](/en/user_manual/groups/data_export/), reply within 90 days so access can be restored before deletion.
    translation: O e-mail de aviso informa a quantidade de subgrupos, membros, discussões, enquetes e comentários do grupo. Se você precisa manter o grupo ou [exportar seus dados](/en/user_manual/groups/data_export/), responda em até 90 dias para que o acesso seja restaurado antes da exclusão.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  17dc58c271e429d5:
    english: Deleting your group will also cancel your Loomio subscription.
    translation: A exclusão do grupo também cancela sua assinatura do Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
