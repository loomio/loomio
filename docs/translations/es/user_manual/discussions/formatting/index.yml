  7bda51ac3285357f:
    english: When starting or editing a discussion or poll, or writing a comment, you will see a formatting bar below the text field. Select the arrow at the end of the bar to show or hide the full set of tools.
    translation: Al iniciar o editar una discusión o un sondeo, o al escribir un comentario, verás una barra de formato debajo del campo de texto. Selecciona la flecha al final de la barra para mostrar u ocultar todas las herramientas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2f2944ad10684b7f:
    english: Hover the mouse or cursor over each item for the name of each tool.
    translation: Coloca el cursor sobre cada elemento para ver el nombre de la herramienta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5f45a085deb9eff1:
    english: Use formatting to add structure and emphasis so information is easier to scan.
    translation: Usa el formato para organizar y destacar la información, y facilitar su lectura.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
