    english: |-
      ## Content translation
      When someone in your group writes their message in a language that is different to your preferred language, a "translate" button will appear below the message. You can click this button to automatically translate the message into your preferred language.
    translation: |-
      ## Traduction du contenu
      Si une personne de votre groupe écrit dans une autre langue que votre langue préférée, un bouton « Traduire » apparaît sous son message. Cliquez dessus pour traduire automatiquement le message dans votre langue préférée.
