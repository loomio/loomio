  67bc6cfdb2afad04:
    english: |-
      Only parent-group admins can rename, recolor, merge, or delete tags. These
      changes apply throughout the organization, including its subgroups.
    translation: |-
      Vain pääryhmän ylläpitäjät voivat nimetä tunnisteita uudelleen, vaihtaa niiden värejä, yhdistää niitä tai poistaa niitä. Muutokset koskevat koko organisaatiota,
      myös sen alaryhmiä.
