  3be363e1618c6924:
    english: Use the Loomio API to connect Loomio with other software and automated workflows.
    translation: ניתן להשתמש ב-API של Loomio כדי לחבר את Loomio לתוכנות אחרות ולתהליכי עבודה אוטומטיים.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3a0a3a45b68cea23:
    english: The [OpenAPI 3.1 contract](openapi.yaml) describes every public User API and Server API operation in a machine-readable format. Import it into an API client or use it to generate typed client code. The guides below explain workflows, permissions, and behavior that are not fully expressed by the contract.
    translation: "[מפרט OpenAPI 3.1](openapi.yaml) מתאר בפורמט קריא למכונה את כל הפעולות הציבוריות של API המשתמשים ושל API השרת. ניתן לייבא אותו ללקוח API או להשתמש בו כדי ליצור קוד לקוח עם טיפוסים מוגדרים. המדריכים שלהלן מסבירים תהליכי עבודה, הרשאות והתנהגות שהמפרט אינו מתאר במלואם."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  19fe420b8b57b3a3:
    english: "## User API"
    translation: "## API המשתמשים"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e08b0799f5a9b271:
    english: The [User API](/en/user_manual/integrations/api/user-api) performs actions as a Loomio user. It can list groups and create or manage threads, comments, polls, and group memberships according to that user's permissions.
    translation: "[API המשתמשים](/en/user_manual/integrations/api/user-api) מאפשר לבצע פעולות בשם משתמשי Loomio. באמצעותו ניתן להציג רשימת קבוצות וליצור או לנהל דיונים, תגובות, סקרים וחברויות בקבוצות, בהתאם להרשאות המשתמשים."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d212aebc3b500643:
    english: For push-based integrations, [group webhooks](/en/user_manual/integrations/api/user-api#webhooks) send selected Loomio events to a web endpoint as JSON. Use the REST endpoints to read or change Loomio data and a webhook when an integration should receive events without polling.
    translation: בשילובים המבוססים על שליחת אירועים, [webhooks של קבוצות](/en/user_manual/integrations/api/user-api#webhooks) שולחים אירועים נבחרים מ-Loomio לנקודת קצה באינטרנט בפורמט JSON. ניתן להשתמש בנקודות הקצה של REST כדי לקרוא או לשנות נתונים ב-Loomio, וב-webhook כדי לקבל אירועים בלי לבצע בדיקות חוזרות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d6536c749fb8a984:
    english: "## Server API"
    translation: "## API השרת"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  76fbf0c8fa91eeb8:
    english: The [Server API](/en/user_manual/integrations/api/server-api) lets operators of self-hosted Loomio installations manage user accounts. It is authenticated with a server-wide secret.
    translation: "[API השרת](/en/user_manual/integrations/api/server-api) מאפשר למפעילי התקנות Loomio באירוח עצמי לנהל חשבונות משתמשים. האימות מתבצע באמצעות סוד התקף לכל השרת."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
