    translated_on: '2026-09-30'
  b11cbc132fe6b4d0:
    english: Seek consent on a decision you need to make, where there are no meaningful objections to your proposal, so you can make a fast decision that is 'safe to try' now.
    translation: Калі трэба прыняць рашэнне, запытайце згоду. Калі супраць прапановы няма істотных пярэчанняў, вы зможаце хутка прыняць рашэнне, якое ўжо цяпер «можна паспрабаваць».
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  75e8b175ecfcd49a:
    english: "> *“Consent turns the question around: instead of asking for what we want, we ask whether there are reasons not to go ahead.” - Ted Rau, Sociocracy For All*"
    translation: "> *«Згода змяняе пастаноўку пытання: замест таго каб пытацца, чаго мы хочам, мы пытаемся, ці ёсць прычыны не рухацца далей». — Тэд Раў, Sociocracy For All*"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  55ccc01c9b274a87:
    english: |-
      ## Key points
      - Aim for a ‘good enough’ decision.
      - Involve many voices to develop a workable proposal.
      - Ask if anyone has a valid objection.
      - Amend the proposal to resolve objections.
    translation: |-
      ## Асноўныя моманты
      - Імкніцеся да рашэння, якое будзе «дастаткова добрым».
      - Улічвайце розныя меркаванні, каб падрыхтаваць прапанову, якую можна рэалізаваць.
      - Спытайце, ці ёсць у каго-небудзь абгрунтаваныя пярэчанні.
      - Змяніце прапанову, каб улічыць пярэчанні.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7c2ef9fc3419f4b7:
    english: |-
      **Typical roles:**
      - Proposer: The person who raises a topic that requires a decision.
      - Facilitator: Someone who can help the proposer do their job efficiently.
    translation: |-
      **Тыповыя ролі:**
      - Аўтары прапановы: людзі, якія ўздымаюць пытанне, што патрабуе рашэння.
      - Фасілітатары: людзі, якія дапамагаюць аўтарам прапановы эфектыўна выканаць сваю задачу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c56d1ea7a5582723:
    english: |-
      ## Consent process steps
      You notice a problem or opportunity and take the initiative.
      1. Present a proposal - start a Loomio **discussion**.
      2. Facilitate a round of questions, reactions and any comments to improve the proposal - run a **Sense check proposal**.
      3. Amend the proposal with suggestions and comments.
      4. Ask if anyone has a meaningful objection to the amended proposal - run a **Consent proposal**.
      5. Integrate valid objections to create an amended version of the proposal that everyone consents is ‘safe to try’ - state the decision **outcome**.
    translation: |-
      ## Крокі працэсу атрымання згоды
      Вы заўважаеце праблему або магчымасць і бераце на сябе ініцыятыву.
      1. Прадстаўце прапанову — пачніце ў Loomio **абмеркаванне**.
      2. Правядзіце раўнд пытанняў, рэакцый і каментарыяў, каб палепшыць прапанову — запусціце **прапанову для праверкі меркаванняў**.
      3. Змяніце прапанову з улікам прапаноў і каментарыяў.
      4. Спытайце, ці ёсць у каго-небудзь істотныя пярэчанні супраць змененай прапановы — запусціце **прапанову для атрымання згоды**.
      5. Улічыце абгрунтаваныя пярэчанні і падрыхтуйце версію прапановы, якую ўсе згодныя «паспрабаваць», — апублікуйце **выснову** пра рашэнне.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  735e10dde58793f0:
    english: |-
      >[!Tip]
      >In more complex decisions you may also include a clarifying **Questions round** at step 2, to help people understand the proposal before inviting them to react and comment on the proposal.
    translation: |-
      >[!Tip]
      >Для складанейшых рашэнняў на кроку 2 можна таксама правесці **Пытанне ў раўндзе**. Гэта дапаможа людзям зразумець прапанову, перш чым вы запросіце іх выказаць рэакцыі і каментарыі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9cf871a054d8e628:
    english: |-
      ## Benefits
      - Faster, efficient, clear and more adaptable decisions.
      - Diverse perspectives and empowered engagement builds trust.
      - A more agile, transparent and inclusive culture.
    translation: |-
      ## Перавагі
      - Хутчэйшыя і больш зразумелыя рашэнні, якія лягчэй адаптаваць.
      - Розныя погляды і актыўны ўдзел умацоўваюць давер.
      - Больш гнуткая, празрыстая і адкрытая да ўдзелу культура.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '09907f3ec328e9d2':
    english: "## Applying the Consent process on Loomio"
    translation: "## Як правесці працэс атрымання згоды ў Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d7c91a6160b45cf:
    english: |-
      | **Consent process** | **On Loomio** |
      |---|---|
      | You notice a problem or opportunity and take the initiative. |  |
      | **Present a proposal** <br /><br />Write a clear and concise proposal and share it with people impacted. Describe it in a way so that others will understand what you are proposing. | Start a Loomio **discussion**. <br /><br />Name the proposal in the discussion title, and describe it in the context. |
      | **Questions** (Optional) <br /><br />Invite clarifying questions to help people understand the proposal. <br /><br />*“A clarifying question round helps make sure everyone understands the proposal before they say what they think about it.”* | Run a **Question round**. If it is hidden, a group administrator can make it available from [Poll templates](/en/user_manual/polls/poll_templates/). <br /><br />Ask “what do you need to know so you understand the proposal?” |
      | **Reactions** <br /><br />Invite people to offer reactions and comments to improve the proposal. <br /><br />This is a sensing and responding round - *to actively sense and interpret information from the group and then respond or adapt accordingly.* | Run a **[Sense check](/en/user_manual/polls/proposals/sense_check/)** proposal. <br /><br />*In the title:* Name the proposal and say this is an opportunity to react and comment. <br /><br />*In the proposal details:* Clearly frame the proposal and say why it is important.  Include any background information necessary and a link to the current proposal version.  <br /><br />Invite everyone to respond, and to do so before the proposal closes.  |
      | **Amendment** <br /><br />Consider comments and suggestions from people and amend the proposal as appropriate for the good of your organization. <br /><br />Consider any amendments you want to make for the new proposal version. | Reply to comments and suggestions raised in the Sense check proposal. <br /><br />State an **outcome** to summarize the results of the proposal.  <br /><br />Note any concerns or new information discovered, and outline how the proposal will be amended. <br /><br />Say what will happen next and notify people about the outcome. |
      | **Objections** <br /><br />Present the amended proposal version and invite people to state valid objections - objections that might cause harm. <br /><br />Respond to and integrate each objection by amending the proposal. | Run a **[Consent proposal](/en/user_manual/polls/proposals/consent/)** with the amended proposal. <br /><br />*In the title:* Name the decision to be made. <br /><br />*In the proposal details:* Present the proposal and invite people to vote consent or to state a valid objection - an objection that might cause harm.  Remember we are seeking consent that the proposal is 'safe to try'. <br /><br />Respond to and integrate each objection, creating an amended version of the proposal. <br /><br />Notify everyone that there has been a further amendment, and invite them to reconsider their Consent and “change your vote”. <br /><br />Or run successive Consent proposals as necessary until objections are resolved. |
      | **Outcome** <br /><br />When there are no remaining objections and everyone has consented, the result of the decision is announced. | State an **outcome**. <br /><br />Close the proposal. State an outcome and notify everyone involved. <br /><br />State the decision made and thank people for participation in the process. <br /><br />Summarize results of the process and say what will happen next. <br /><br />If no valid objections remain, state that there is consent the proposal is 'safe to try'. <br /><br />The outcome statement is an important record of the decision for future reference. |
    translation: |-
      | **Працэс атрымання згоды** | **У Loomio** |
      |---|---|
      | Вы заўважаеце праблему або магчымасць і бераце на сябе ініцыятыву. |  |
      | **Прадстаўце прапанову** <br /><br />Напішыце ясную і кароткую прапанову і падзяліцеся ёю з людзьмі, якіх яна закране. Апішыце яе так, каб іншыя зразумелі, што вы прапануеце. | Пачніце ў Loomio **абмеркаванне**. <br /><br />Укажыце назву прапановы ў загалоўку абмеркавання і апішыце яе ў кантэксце. |
      | **Пытанні** (неабавязкова) <br /><br />Запрасіце людзей задаць удакладняльныя пытанні, каб дапамагчы ім зразумець прапанову. <br /><br />*«Раўнд удакладняльных пытанняў дапамагае ўсім зразумець прапанову, перш чым выказваць сваё меркаванне пра яе».* | Запусціце **Пытанне ў раўндзе**. Калі гэты шаблон схаваны, адміністратары групы могуць зрабіць яго даступным у раздзеле [«Шаблоны апытанняў»](/en/user_manual/polls/poll_templates/). <br /><br />Спытайце: «Што вам трэба ведаць, каб зразумець прапанову?» |
      | **Рэакцыі** <br /><br />Запрасіце людзей падзяліцца рэакцыямі і каментарыямі, каб палепшыць прапанову. <br /><br />У гэтым раўндзе вы збіраеце водгукі і рэагуеце на іх — *уважліва ўспрымаеце і асэнсоўваеце інфармацыю ад групы, а затым адказваеце або змяняеце прапанову.* | Запусціце прапанову **[«Праверка меркаванняў»](/en/user_manual/polls/proposals/sense_check/)**. <br /><br />*У загалоўку:* Назавіце прапанову і пазначце, што тут можна выказаць рэакцыі і каментарыі. <br /><br />*У дэталях прапановы:* Ясна сфармулюйце прапанову і растлумачце, чаму яна важная. Дадайце патрэбную даведачную інфармацыю і спасылку на бягучую версію прапановы. <br /><br />Запрасіце ўсіх адказаць да закрыцця прапановы. |
      | **Змяненне** <br /><br />Разгледзьце каментарыі і прапановы людзей і ўнясіце змены, карысныя для вашай арганізацыі. <br /><br />Вырашыце, якія яшчэ змены вы хочаце ўнесці ў новую версію прапановы. | Адкажыце на каментарыі і прапановы, атрыманыя падчас праверкі меркаванняў. <br /><br />Апублікуйце **выснову**, каб падсумаваць вынікі прапановы. <br /><br />Адзначце выяўленыя праблемы або новую інфармацыю і апішыце, як зменіцца прапанова. <br /><br />Раскажыце, што будзе далей, і паведаміце людзям пра выснову. |
      | **Пярэчанні** <br /><br />Прадстаўце змененую версію прапановы і запрасіце людзей выказаць абгрунтаваныя пярэчанні — тыя, што паказваюць на магчымую шкоду. <br /><br />Адкажыце на кожнае пярэчанне і ўлічыце яго, змяніўшы прапанову. | Запусціце **[прапанову для атрымання згоды](/en/user_manual/polls/proposals/consent/)** са змененай версіяй. <br /><br />*У загалоўку:* Назавіце рашэнне, якое трэба прыняць. <br /><br />*У дэталях прапановы:* Прадстаўце прапанову і запрасіце людзей прагаласаваць за згоду або выказаць абгрунтаванае пярэчанне — тое, што паказвае на магчымую шкоду. Мэта — атрымаць згоду з тым, што прапанову «можна паспрабаваць». <br /><br />Адкажыце на кожнае пярэчанне і ўлічыце яго ў новай версіі прапановы. <br /><br />Паведаміце ўсім пра новыя змены і запрасіце перагледзець сваю згоду ды «змяніць свой голас». <br /><br />Пры неабходнасці запускайце наступныя прапановы для атрымання згоды, пакуль пярэчанні не будуць вырашаны. |
      | **Выснова** <br /><br />Калі пярэчанняў больш няма і ўсе далі згоду, абвясціце прынятае рашэнне. | Апублікуйце **выснову**. <br /><br />Закрыйце прапанову, апублікуйце выснову і паведаміце ўсім удзельнікам. <br /><br />Назавіце прынятае рашэнне і падзякуйце людзям за ўдзел у працэсе. <br /><br />Падсумуйце вынікі працэсу і раскажыце, што будзе далей. <br /><br />Калі абгрунтаваных пярэчанняў не засталося, пазначце, што ўсе згодныя: прапанову «можна паспрабаваць». <br /><br />Тэкст высновы захоўвае звесткі пра рашэнне, да якіх можна звярнуцца пазней. |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  525fe55f979f05e3:
    english: "### Objections"
    translation: "### Пярэчанні"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3cc3304a15bc3d2f:
    english: In the Consent process, an objection is defined as something that **might cause harm to the team or organization**.
    translation: У працэсе атрымання згоды пярэчаннем лічыцца тое, што **можа нашкодзіць камандзе або арганізацыі**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ab509ea088e16a0d:
    english: |-
      Objections should meet this criteria to be valid:
      - Explicit: *I can make a reasoned case*
      - Impersonal: *It's not just a personal preference*
      - Evidenced: *Not predictive, based on experience*
      - Not 'safe to fail': *It's not that I have a 'better idea'*
    translation: |-
      Каб пярэчанне было абгрунтаваным, яно павінна адпавядаць наступным крытэрыям:
      - Сфармулявана ясна: *Я магу прывесці абгрунтаваныя довады*
      - Не зводзіцца да асабістага густу: *Гэта не проста мая асабістая перавага*
      - Абапіраецца на досвед: *Гэта заснавана на досведзе, а не толькі на прагнозе*
      - Паказвае, чаму спроба небяспечная: *Справа не ў тым, што ў мяне ёсць «лепшая ідэя»*
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '08d3059af11ce88f':
    english: "## Example of a Consent process on Loomio"
    translation: "## Прыклад працэсу атрымання згоды ў Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ec691660458e426c:
    english: "### Step 0. You notice a problem or opportunity and take the initiative"
    translation: "### Крок 0. Вы заўважаеце праблему або магчымасць і бераце на сябе ініцыятыву"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7dd26502d162e33e:
    english: "*Is the problem or opportunity is worth pursuing?* Chloe noticed that new Health and Safety legislation is coming into effect soon, and has taken the lead to draft a policy for her organization."
    translation: "*Ці варта займацца гэтай праблемай або магчымасцю?* Хлоя заўважыла, што неўзабаве набудзе моц новае заканадаўства аб ахове здароўя і бяспецы працы, і ўзялася падрыхтаваць палітыку для сваёй арганізацыі."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b6afe6516fd602d4:
    english: "*Is there a decision to be made?* The Health and Safety policy document will need to be approved as a formal policy."
    translation: "*Ці трэба прыняць рашэнне?* Дакумент аб ахове здароўя і бяспецы працы трэба будзе афіцыйна зацвердзіць як палітыку арганізацыі."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5e80186b2ed95b37:
    english: "*Does it impact other people and your organization?* The policy impacts everyone in the organization.  Staff will need to comply with the policy, and it will become a legal obligation of the organization."
    translation: "*Ці закране гэта іншых людзей і вашу арганізацыю?* Палітыка закране ўсіх у арганізацыі. Супрацоўнікам трэба будзе яе выконваць, а для арганізацыі гэта стане юрыдычным абавязкам."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bc0f7f13bdc1f533:
    english: "### Step 1. Present a proposal"
    translation: "### Крок 1. Прадстаўце прапанову"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  72e08141a5c023c5:
    english: Chloe starts a Loomio thread outlining the need to develop a Health and Safety policy, proposing to lead this work with a first draft, inviting contributions to develop the policy and that she is starting a Consent process to adopt the policy.
    translation: Хлоя пачынае тэму ў Loomio і тлумачыць, чаму патрэбна палітыка аховы здароўя і бяспекі працы. Яна прапануе падрыхтаваць першы праект, запрашае іншых дапамагчы ў распрацоўцы палітыкі і паведамляе, што пачынае працэс атрымання згоды на яе прыняцце.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aedd5ec7bae09e0c:
    english: "### Step 2. Facilitate a clarifying question round"
    translation: "### Крок 2. Правядзіце раўнд удакладняльных пытанняў"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  71ad95aa780b52f8:
    english: Chloe runs a Question proposal to open a question round, inviting people to ask clarifying questions about the Health and Safety policy within a set period.  Some further background information along with the draft document is provided for context.
    translation: Хлоя запускае прапанову «Пытанне ў раўндзе» і запрашае людзей на працягу вызначанага часу задаваць удакладняльныя пытанні пра палітыку аховы здароўя і бяспекі працы. Для кантэксту яна дадае даведачную інфармацыю і праект дакумента.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dcc6429fd48d9730:
