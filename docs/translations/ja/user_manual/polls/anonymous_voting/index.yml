---
navigation_title: 匿名投票
blocks:
  b4e842083054a400:
    english: "# Anonymous voting"
    translation: "# 匿名投票"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9b5c46644a952388:
    english: Anonymous voting, also known as blind voting, separates the record of who has voted from the votes themselves. Poll coordinators can see who was eligible and, once at least three people have voted, verify participation. Application users cannot connect a submitted vote with the person who submitted it.
    translation: 匿名投票は、ブラインド投票とも呼ばれ、誰が投票したかという記録と投票内容を分けて保存します。投票のコーディネーターは、誰に投票資格があったかを確認できます。3人以上が投票すると、誰が投票したかも確認できます。アプリ上では、提出された票を投票者と結び付けることはできません。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  105abff68025f002:
    english: This page explains the protections provided by anonymous voting, the information that is retained, and the limits of the guarantee.
    translation: このページでは、匿名投票による保護、保存される情報、匿名性の限界を説明します。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6d97c8b835a3f1f2:
    english: "## How anonymous voting protects voters"
    translation: "## 匿名投票で投票者を保護する仕組み"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e01d5c77096b953e:
    english: 'An anonymous poll keeps two separate sets of records:'
    translation: 匿名投票では、次の2種類の記録を分けて保存します。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  757ab56b1165a71d:
    english: |-
      | Participation records | Submitted votes |
      | --- | --- |
      | Who is eligible to vote | The selected options or scores |
      | Who was invited, and by whom | The poll the vote belongs to |
      | Whether each eligible person has voted | No name or user account |
      | No selected options or scores | No link to a participation record |
    translation: |-
      | 参加記録 | 提出された票 |
      | --- | --- |
      | 投票資格がある人 | 選択した選択肢や点数 |
      | 招待された人と招待した人 | 票が属する投票 |
      | 投票資格がある各人が投票したかどうか | 氏名やユーザーアカウントは含まれない |
      | 選択した選択肢や点数は含まれない | 参加記録へのリンクはない |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b908c49acc827932:
    english: There is no shared identifier that connects these records. Submitted votes also omit the actual submission time, invitation information, written reasons, attachments, and other metadata that could help identify a voter.
    translation: この2種類の記録を結び付ける共通の識別子はありません。提出された票には、実際の提出時刻、招待情報、記述した理由、添付ファイルなど、投票者の特定につながる情報も含まれません。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6430a3d863d135b6:
    english: This separation is enforced when the vote is stored. It does not depend only on hiding names in the interface.
    translation: この分離は票を保存する際に行われます。画面上で氏名を隠すだけの仕組みではありません。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b8e31aef3d559f28:
    english: "## While voting is open"
    translation: "## 投票の受付中"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f905c85734898a41:
    english: Results remain hidden from everyone until the poll closes. This includes poll coordinators, group administrators, and instance administrators using the application.
    translation: 投票が終了するまで、結果は誰にも表示されません。投票のコーディネーター、グループ管理者、インスタンス管理者も、アプリ上では結果を見られません。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  828df5247b61c9e6:
    english: 'When someone votes:'
    translation: 誰かが投票すると、次のように処理されます。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  69b471d43b2148a1:
    english: |-
      - their submitted vote is stored without their name or participation record;
      - their participation record is marked to show that they have voted;
      - no vote event, notification, email, comment, or activity entry is created;
      - no copy of their selections is returned after submission; and
      - the interface confirms only that their vote was recorded.
    translation: |-
      - 提出された票は、投票者の氏名や参加記録との関連付けなしで保存されます。
      - 参加記録には、投票済みであることが記録されます。
      - 投票に関するイベント、通知、メール、コメント、アクティビティ項目は作成されません。
      - 提出後に、選択内容のコピーは返されません。
      - 画面には、票が記録されたことだけが表示されます。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4ffe4b38db135dab:
    english: The participation record does not store a precise time for when the person voted. Submitted votes are not ordered by submission time.
    translation: 参加記録には、その人が投票した正確な時刻は保存されません。提出された票も提出時刻順には並びません。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7acaf6b48fc42105:
    english: "## Votes cannot be changed"
    translation: "## 投票後に票は変更できません"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  996ef90a3eee857b:
    english: Each eligible person can vote once. A submitted anonymous vote cannot be reviewed, changed, withdrawn, or replaced, including by a coordinator or administrator.
    translation: 投票資格がある人は、それぞれ1回だけ投票できます。提出した匿名の票は、コーディネーターや管理者を含め、誰も確認、変更、撤回、差し替えできません。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  58f0aaa6a45c1d37:
    english: Allowing a person to retrieve or replace their vote would require a persistent link between that person and the vote. Anonymous voting deliberately does not create that link.
    translation: 自分の票を取り出したり差し替えたりするには、投票者と票を結ぶ情報を残す必要があります。匿名投票では、そのような情報を作りません。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2fd2c9d6ab0d6f68:
    english: Review your selections carefully before submitting.
    translation: 提出する前に、選択内容をよく確認してください。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  59f83c0e359484c4:
    english: "## Why anonymous votes do not have reasons"
    translation: "## 匿名の票に理由を記載できない理由"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  89f9d9a1d4bcb395:
    english: New anonymous votes cannot include a written reason or an attachment. Reasons can contain names, personal details, writing patterns, mentions, or other information that identifies the voter. They would also make individual votes easier to distinguish from the aggregate result.
    translation: 新しく提出する匿名の票には、記述した理由や添付ファイルを含められません。理由には、氏名、個人情報、文章の特徴、メンションなど、投票者を特定できる情報が含まれる場合があります。また、集計結果から個々の票を区別しやすくなります。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  932f88aa929fb4eb:
    english: Participants can still discuss the poll in its thread where discussion is available. Those comments are ordinary named discussion contributions and are not attached to an anonymous vote.
    translation: スレッドでの議論が可能な場合、参加者はそこで投票について話し合えます。そのコメントは投稿者の名前が付いた通常の議論への投稿であり、匿名の票には添付されません。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1b21c2826270bd52:
    english: "## Results and exports"
    translation: "## 結果とエクスポート"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  afc45e50b74e075b:
    english: After the poll closes, the results are calculated from the detached votes and displayed as totals and other aggregate results supported by the poll type.
    translation: 投票が終了すると、投票者から切り離された票をもとに結果が計算されます。結果は、投票の種類に応じた合計やその他の集計値として表示されます。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b28c82ffcb4ffeb5:
    english: The application does not publish vote identifiers, submission order, or submission times. Poll exports contain aggregate results rather than a row for each anonymous vote, except that a closed STV election can be exported in BLT format. A BLT export contains the candidate rankings needed to recount the election, grouped when multiple ballots have the same ranking, without voter identities or ballot metadata.
    translation: アプリは、票の識別子、提出順、提出時刻を公開しません。投票のエクスポートには、匿名の票ごとの行ではなく集計結果が含まれます。ただし、終了したSTV選挙はBLT形式でエクスポートできます。BLTエクスポートには再集計に必要な候補者の順位が含まれ、同じ順位の票はまとめられます。投票者の身元や票のメタデータは含まれません。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8088fc78d955e9bb:
    english: An anonymous poll cannot be reopened after it closes.
    translation: 匿名投票は、終了後に再開できません。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c368b542923cd542:
    english: "## Participation verification"
    translation: "## 投票状況の確認"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ab086d63c01514bf:
    english: Poll coordinators can view the named participation records. These always show who was eligible. Once at least three people have voted, they also show whether each person voted, but never show how anyone voted. If a poll closes with fewer than three votes, the participation status remains hidden.
    translation: 投票のコーディネーターは、氏名付きの参加記録を閲覧できます。この記録には、投票資格があった人が常に表示されます。3人以上が投票すると、各人が投票したかどうかも表示されますが、投票内容は表示されません。投票数が3票未満のまま終了した場合、各人の投票状況は引き続き非表示になります。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dcad5d728e5e7cfd:
    english: Other participants cannot view this named participation information. Access to poll results does not grant access to the participation records.
    translation: ほかの参加者は、この氏名付きの参加情報を閲覧できません。投票結果を閲覧できても、参加記録を閲覧できるようにはなりません。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  37cf06402ac47fa2:
    english: |-
      Coordinators can add eligible people while voting remains open, including after
      other people have voted. Existing voters cannot be removed from an anonymous
      poll.
    translation: |-
      コーディネーターは投票の受付中、ほかの人がすでに投票した後でも、
      投票資格がある人を追加できます。すでに投票した人を匿名投票から
      削除することはできません。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  705e9b807681f6c1:
    english: "## Reminders"
    translation: "## リマインダー"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8ef8b501a1b27f63:
    english: For an anonymous poll lasting at least 24 hours, eligible people who have not voted receive one automatic reminder during the final 24 hours.
    translation: 投票期間が24時間以上の匿名投票では、投票資格がある未投票の人に、終了前の24時間以内に自動リマインダーが1回届きます。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b23e579a8ef628de:
    english: The reminder is selected from participation records only. It does not inspect submitted votes or create a connection to them. If the deadline changes, the hourly reminder check uses the current deadline without maintaining a separate scheduled reminder for the poll.
    translation: リマインダーの送信対象は参加記録だけをもとに選ばれます。提出された票を調べたり、票と参加記録を結び付けたりすることはありません。締め切りが変更された場合、1時間ごとのリマインダー確認では現在の締め切りが使われます。投票ごとに別のリマインダー予定は保持されません。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  053ce04ce5f98ed8:
    english: Polls with a total voting period of less than 24 hours do not send this automatic reminder.
    translation: 投票期間が合計24時間未満の場合、この自動リマインダーは送信されません。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb1f13e60fe178fe:
    english: "## What coordinators and administrators can see"
    translation: "## コーディネーターと管理者が見られる情報"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e59c22e94231a746:
    english: 'Through the application, a poll coordinator, group administrator, or instance administrator may be able to see:'
    translation: 投票のコーディネーター、グループ管理者、インスタンス管理者は、アプリ上で次の情報を閲覧できる場合があります。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2da6b1feaa8b36f1:
    english: |-
      - the poll and its eligible voters;
      - whether each eligible person has voted, where their role permits access and at least three people have voted; and
      - aggregate results after the poll closes.
    translation: |-
      - 投票と、投票資格がある人。
      - その役割に閲覧権限があり、3人以上が投票した場合は、投票資格がある各人が投票したかどうか。
      - 投票終了後の集計結果。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6a96a87699625dc6:
    english: 'They cannot use application features to see:'
    translation: アプリの機能を使っても、次の情報は閲覧できません。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dd4756253d1ee6dc:
    english: |-
      - which selections belong to a person;
      - individual votes or voting patterns;
      - when a particular vote was submitted; or
      - a reason, attachment, event, or notification associated with a submitted vote.
    translation: |-
      - 誰がどの選択肢を選んだか。
      - 個々の票や投票パターン。
      - 特定の票が提出された時刻。
      - 提出された票に関連する理由、添付ファイル、イベント、通知。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c350875c33492237:
    english: "## Limits of anonymous voting"
    translation: "## 匿名投票の限界"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  48d04d7b4817e710:
    english: These protections prevent application users from linking a submitted vote to its voter. They are not a cryptographic protection against an operator who can inspect the database, backups, server logs, process memory, network traffic, or a modified version of the application.
    translation: これらの保護により、アプリの利用者は提出された票を投票者と結び付けられません。ただし、データベース、バックアップ、サーバーログ、プロセスのメモリ、ネットワーク通信、改変されたアプリを調べられる運用者に対して、暗号技術による保護を提供するものではありません。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f901f505362e46b4:
    english: The result itself may also reveal information. A small electorate, a unanimous result, a distinctive combination of selections, or information shared outside the poll can make a person's choices easier to infer. Voters may also choose to identify themselves in discussion outside their submitted vote.
    translation: 結果自体から情報が分かる場合もあります。投票者が少ない場合、全員が同じ選択をした場合、選択肢の組み合わせが特徴的な場合、投票の外で情報が共有された場合には、個人の選択を推測しやすくなります。投票者が、提出した票とは別の議論で自分の選択を明かすこともあります。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dfe97db86db52d15:
    english: Consider the size of the electorate and the sensitivity of the decision when deciding whether application-level anonymous voting is suitable.
    translation: アプリ上の匿名投票が適しているか判断する際は、有権者の数と決定の機密性を考慮してください。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  60cc6f1a0163ec5d:
    english: "## Questions"
    translation: "## よくある質問"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  57615f2c4c040dce:
    english: "### Can a coordinator see how I voted?"
    translation: "### 投票の管理者は、誰がどのように投票したかを見ることができますか？"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9dc1d151cc90e94e:
    english: No. Once at least three people have voted, a coordinator can verify whether you voted but cannot connect you with a submitted vote through the application. Below that threshold, your participation status remains hidden.
    translation: いいえ。3人以上が投票すると、投票の管理者は各人が投票したかどうかを確認できます。ただし、アプリ上で投票者と投票内容を結びつけることはできません。投票者が3人未満の場合、各人の投票状況も表示されません。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b3b382d2575b715d:
    english: "### Can I see my vote after submitting it?"
    translation: "### 投票後に自分の投票内容を見ることはできますか？"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  52aaaa1c764d5745:
    english: No. The application confirms that your vote was recorded, then discards the selections from the voting interface. It cannot retrieve your vote without creating the link that anonymous voting is designed to avoid.
    translation: いいえ。アプリは投票が記録されたことを確認し、投票画面から選択内容を消去します。投票者と投票内容を結びつける情報は作成されないため、投票内容を呼び出すことはできません。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  071dd89d6eb38ebf:
    english: "### Can I change or withdraw my vote?"
    translation: "### 投票を変更したり取り消したりできますか？"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '059b75c51b4225ab':
    english: No. There is no link that would let the application identify which submitted vote to change or remove.
    translation: いいえ。どの投票を変更または削除すべきか特定できる情報がないため、変更も取り消しもできません。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c94077837455425f:
    english: "### Will I receive an email confirming my vote?"
    translation: "### 投票の確認メールは届きますか？"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f36a8b43a3fdee36:
    english: No. Voting creates only the on-screen acknowledgement and updates your participation record. It does not send a confirmation email or create a notification or activity event.
    translation: いいえ。投票時には画面上に記録の確認が表示され、投票状況の記録が更新されます。確認メールは送信されず、通知やアクティビティの記録も作成されません。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f320754cf7ee77bc:
    english: "### Does a public poll reveal more information?"
    translation: "### 公開投票では、より多くの情報が見えますか？"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f84121f0c18e03ab:
    english: Public access may allow people to see the poll and its aggregate results after it closes. It does not expose the named participation records or individual anonymous votes.
    translation: 公開投票では、投票と終了後の集計結果を閲覧できる場合があります。名前付きの投票状況の記録や、個々の匿名投票の内容は公開されません。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e2dbe0c181f865ca:
    english: "### Is anonymous voting suitable for every election?"
    translation: "### 匿名投票はすべての選挙に適していますか？"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  05fc871619a2170d:
    english: No. It provides application-level separation between identities and votes. Decisions requiring protection from system operators or independently verifiable cryptographic elections need a system designed for those requirements.
    translation: いいえ。匿名投票はアプリ上で投票者の身元と投票内容を分離します。システム運用者からの保護や、第三者が独立して検証できる暗号技術を使った選挙が必要な場合は、その要件に対応したシステムが必要です。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
