  ca5b9583bfe78b65:
    english: A proposal asks people to respond to a statement or course of action. Participants choose a defined response and can explain their vote. Use a proposal to gather feedback, seek advice, identify objections, or test for agreement.
    translation: Una propuesta pide a las personas que respondan a una afirmación o un plan de acción. Quienes participan eligen una respuesta definida y pueden explicar su voto. Usa una propuesta para recoger opiniones, pedir consejo, identificar objeciones o comprobar si hay acuerdo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  143dc77c58a4c881:
    english: This section helps you choose and run Loomio's default proposal templates. For a complete sequence of discussion, proposals, amendments, and outcome, use the [decision-making guides](/en/guides/making_decisions/). To change the templates available to your group, see [Poll templates](../poll_templates/).
    translation: Esta sección te ayuda a elegir y usar las plantillas de propuesta predeterminadas de Loomio. Para seguir un proceso completo que incluya discusión, propuestas, enmiendas y conclusión, consulta las [guías para tomar decisiones](/en/guides/making_decisions/). Para cambiar las plantillas disponibles en tu grupo, consulta [Plantillas de encuesta](../poll_templates/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e0f8614f95c9c5ff:
    english: "## Choose a proposal template"
    translation: "## Elige una plantilla de propuesta"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  525699503edbe342:
    english: |-
      | Template | What it asks | Use it when… |
      |---|---|---|
      | [Sense check](sense_check/) | Is this on the right track? | An idea is still being developed |
      | [Advice](advice/) | What advice should the decision maker consider? | A person or team owns the decision |
      | [Consent](consent/) | Is this safe to try, or is there a meaningful objection? | The group uses consent decision-making |
      | [Consensus](consensus/) | What is your position on this proposal? | The group is seeking collective agreement |
    translation: |-
      | Plantilla | Qué pregunta | Úsala cuando… |
      |---|---|---|
      | [Comprobación de sentido](sense_check/) | ¿Vamos por buen camino? | La idea aún se está desarrollando |
      | [Consejo](advice/) | ¿Qué consejos debe tener en cuenta quien toma la decisión? | Una persona o un equipo es responsable de la decisión |
      | [Consentimiento](consent/) | ¿Es seguro probarlo o hay alguna objeción importante? | El grupo toma decisiones por consentimiento |
      | [Consenso](consensus/) | ¿Cuál es tu postura sobre esta propuesta? | El grupo busca un acuerdo colectivo |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0cb03ac4a22f02b4:
    english: Choose the template whose response options match the question you need answered. Each template page explains its use cases, setup, voting form, and results.
    translation: Elige la plantilla cuyas opciones de respuesta se ajusten a la pregunta que necesitas responder. La página de cada plantilla explica cuándo usarla, cómo configurarla, cómo se vota y cómo se presentan los resultados.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d379b02c308b3b55:
    english: "## Other proposal templates"
    translation: "## Otras plantillas de propuesta"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  44cdb16aebf757ca:
    english: Loomio also provides templates such as Proposal, Gradients of agreement, Question round, and Majority. Some are hidden initially. Group administrators can make them available or create a template for the group's own terminology and rules from [Poll templates](../poll_templates/).
    translation: Loomio también ofrece plantillas como Propuesta, Gradientes de concordancia, Ronda de preguntas y Mayoría. Algunas están ocultas al principio. Quienes administran el grupo pueden hacerlas disponibles o crear una plantilla con la terminología y las reglas del grupo desde [Plantillas de encuesta](../poll_templates/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ca179ba4cb53c5e3:
    english: "## Proposal records"
    translation: "## Registro de la propuesta"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  460a90e796fc4dc0:
    english: Votes and reasons update while the proposal is open, and participants can change their response. After it closes, publish an [outcome](../outcomes/) that states the decision or next step. The discussion, proposal, votes, reasons, and outcome form a record of how the group reached its decision.
    translation: Mientras la propuesta está abierta, los votos y sus motivos se actualizan, y quienes participan pueden cambiar su respuesta. Cuando se cierre, publica una [conclusión](../outcomes/) que indique la decisión o el siguiente paso. La discusión, la propuesta, los votos, los motivos y la conclusión dejan constancia de cómo el grupo llegó a su decisión.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
