navigation_title: Discussioni
blocks:
  f087c06a5f4ab2e6:
    english: "# Intro to Discussions"
    translation: "# Introduzione alle discussioni"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f515c87a8d1d20c7:
    english: Loomio discussions are where you can share information, discuss topics, and make decisions with your group.  People participate by posting comments and replies.
    translation: Nelle discussioni di Loomio puoi condividere informazioni, confrontarti su un tema e prendere decisioni con il tuo gruppo. Le persone partecipano pubblicando commenti e risposte.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eede89b6ce4f357d:
    english: |-
      - All info about a topic is in one easily accessible place.
      - People can reply via email and their comments appear in the discussion.
      - You can see who has read the discussion and who needs a nudge.
      - There is a record of discussion you can easily find again.
    translation: |-
      - Tutte le informazioni su un tema si trovano in un unico posto, facile da consultare.
      - Le persone possono rispondere via email e i loro commenti compaiono nella discussione.
      - Puoi vedere chi ha letto la discussione e a chi inviare un promemoria.
      - Puoi ritrovare facilmente ciò che è stato discusso.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9cb2eb404b59208b:
    english: Discussions have a wide range of uses - from a general discussion forum to running specific work-flow and decision-making processes.
    translation: 'Le discussioni hanno molti usi: possono essere uno spazio di confronto generale o servire a gestire attività e processi decisionali specifici.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  87a95605052570ca:
    english: For example, you may frame a discussion on a particular topic, invite people to contribute their thoughts and share information, and facilitate progress towards an agreed outcome.
    translation: Per esempio, puoi avviare una discussione su un tema, invitare le persone a condividere idee e informazioni e accompagnare il gruppo verso una conclusione condivisa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ce6e6734c595d968:
    english: Or you may invite people to participate in a particular decision, using a consent or advice decision-making process.
    translation: Oppure puoi invitare le persone a partecipare a una decisione seguendo un processo basato sul consenso o sulla consultazione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7fa58cb3ba95be0b:
    english: Discussions can also contain polls and proposals to help progress a discussion to an outcome. As people comment in the discussion and vote in polls, a discussion timeline builds so you can easily find key milestones.
    translation: Le discussioni possono contenere sondaggi e proposte che aiutano il gruppo a raggiungere una conclusione. Man mano che le persone commentano e votano, si crea una cronologia della discussione in cui puoi ritrovare facilmente i passaggi principali.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  388e829e86a99bd8:
    english: "![The Returnable bottles for cafe customers discussion, with a comment and a proposal](discussion-example.png)"
    translation: "![La discussione sulle bottiglie a rendere per i clienti del bar, con un commento e una proposta](discussion-example.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
