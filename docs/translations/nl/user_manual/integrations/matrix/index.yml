  f3106c22cd3d4059:
    english: 'Loomio can send notifications into your Matrix channels when new discussions, proposals, comments, votes, and outcomes occur. '
    translation: Loomio kan meldingen naar je Matrix-kanalen sturen wanneer er nieuwe discussies, voorstellen, reacties, stemmen en conclusies zijn.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a20cf2be00dac0ce:
    english: Matrix is nice because it allows some HTML in the chatroom, and Loomio takes advantage of this.
    translation: Matrix ondersteunt HTML in chatruimtes. Loomio gebruikt dat om meldingen op te maken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ffe12502f0030fec:
    english: Our Matrix integration is a little different to our other chat integrations - it does not use a webhook - we've built a custom bot client for this one.
    translation: De Matrix-integratie werkt anders dan onze andere chatintegraties. Ze gebruikt geen webhook, maar een bot die we voor Matrix hebben gebouwd.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  44db147f65127a55:
    english: You will need to create a matrix user for the bot to login as.
    translation: Maak een Matrix-gebruiker aan waarmee de bot kan inloggen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  98045e5bf1339543:
    english: Once you've created a user for the bot, sign in at that user to obtain the following information.
    translation: Log na het aanmaken in als deze gebruiker om de volgende gegevens op te zoeken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
