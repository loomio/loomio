    translated_on: '2026-09-29'
  06aabe2c1d6cd716:
    english: "### Actions per month"
    translation: "### Действия по месяцам"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6772e16cee705fc1:
    english: 'Understand how much participation happens in your group over a given period of time. '
    translation: Посмотрите, насколько активно участники вашей группы действовали за выбранный период.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fe690a715f8a00b5:
    english: The report shows how many threads, comments, polls, votes and reactions have happened per month. This is graphed so you can see ebbs and flows of usage.
    translation: Отчёт показывает количество обсуждений, комментариев, опросов, поданных голосов и реакций за каждый месяц. График помогает увидеть, как менялась активность.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  21bf7cb257f4bb03:
    english: Click specific labels on the graph to remove them from view.
    translation: Нажмите название показателя на графике, чтобы скрыть его.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  35ced3d9d51038aa:
    english: Click specific headings in the table to sort the table by that column.
    translation: Нажмите заголовок столбца, чтобы отсортировать таблицу по нему.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
