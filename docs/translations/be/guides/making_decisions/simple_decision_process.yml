---
navigation_title: Просты працэс прыняцця рашэнняў
blocks:
  84ddd86a61d09414:
    english: "# Simple decision process"
    translation: "# Просты працэс прыняцця рашэнняў"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2e868ae6bc4a493b:
    english: This guide describes an end-to-end process using a discussion, Sense check, final proposal, and outcome. For help with the fields and response options of one proposal, see [Proposals](/en/user_manual/polls/proposals/).
    translation: 'У гэтым кіраўніцтве апісаны ўвесь працэс: абмеркаванне, Праверка сэнсу, канчатковая прапанова і выснова. Пра палі і варыянты адказу ў прапанове чытайце на старонцы [Прапановы](/en/user_manual/polls/proposals/).'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d9877680762afa22:
    english: Some organizations arrive at Loomio having already developed a deep culture and practice of collaborative decision making.  Such organizations have often written handbooks and codified their practices, however, most organizations are still on the journey and looking for some helpful first steps towards making better decisions together.  If the burning question in your organization is **how do we make decisions together?**, then this guide is for you.
    translation: Некаторыя арганізацыі пачынаюць карыстацца Loomio, ужо маючы багаты досвед сумеснага прыняцця рашэнняў. Яны часта апісваюць свае падыходы ў кіраўніцтвах. Але многія арганізацыі яшчэ шукаюць, з чаго пачаць, каб лепш прымаць рашэнні разам. Калі ваша арганізацыя задаецца пытаннем **як нам прымаць рашэнні разам?**, гэта кіраўніцтва для вас.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6b321a0ba71f92b8:
    english: "***Here are three steps to help you co-create a better, more cohesive decision with less stress and anxiety.***"
    translation: "***Гэтыя тры крокі дапамогуць вам разам прыняць больш узгодненае рашэнне з меншым напружаннем.***"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c46b32b56b933b0a:
    english: "## Simple decision making - in 3 steps"
    translation: "## Простае прыняцце рашэнняў — у 3 крокі"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e3208a84f88ba36f:
    english: Good collaborative decisions rarely happen by themselves.  They almost always benefit from someone facilitating the discussion through to decision.  So when you launch a discussion thread, you take on a facilitation role (unless someone else is facilitating).
    translation: Добрыя сумесныя рашэнні рэдка ўзнікаюць самі сабой. Звычайна хтосьці дапамагае групе прайсці шлях ад абмеркавання да рашэння. Калі вы пачынаеце абмеркаванне, вы бераце на сябе гэтую ролю, калі яе яшчэ ніхто не выконвае.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1a1da8788ddb01c7:
    english: Follow these 3 steps as you facilitate your group to make a good decision.
    translation: Прайдзіце гэтыя 3 крокі, каб дапамагчы групе прыняць добрае рашэнне.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5b83a53a3f4caad5:
    english: |-
      ### Step 1 - Introduce and discuss
      Start a Loomio **discussion** to introduce the topic, open conversation and invite people. Include all the context-setting information your group needs to meaningfully participate, along with relevant background so everyone understands the purpose.
    translation: |-
      ### Крок 1 — Прадстаўце тэму і абмяркуйце яе
      Пачніце **Абмеркаванне** ў Loomio: прадстаўце тэму, запрасіце людзей і пачніце размову. Дадайце звесткі, патрэбныя групе для ўдзелу, і перадгісторыю, каб усім была зразумелая мэта.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8aab998cb04b8635:
    english: 'Be clear about your objective - what is the decision to be made or intended outcome of the discussion? '
    translation: 'Выразна сфармулюйце мэту: якое рашэнне трэба прыняць або да якой высновы прыйсці?'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d8f53cbae173f5ac:
    english: As the discussion progresses, create space for diverse input - sometimes the best ideas and input come from outside the box.  Work together to explore and test ideas, encouraging a healthy and open discussion.
    translation: Падчас абмеркавання дайце месца розным меркаванням. Часам найлепшыя ідэі бываюць нечаканымі. Разам даследуйце і правярайце ідэі, падтрымліваючы адкрытую размову.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7f447ab455f6cea4:
    english: 'Notice when the same voices are dominating and invite some of the quieter people to contribute by @mentioning them and asking them what they think. '
    translation: 'Звяртайце ўвагу, калі ў размове пераважаюць адны і тыя ж галасы. Запрасіце менш актыўных людзей выказацца: згадайце іх праз @ і спытайце, што яны думаюць.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d4bad2b5207ac1d8:
    english: You can make a complex discussion easier to engage with by updating the context section with a summary of the key points.
    translation: Каб людзям было лягчэй далучыцца да складанага абмеркавання, абнаўляйце раздзел кантэксту кароткім выкладам асноўных думак.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  daeddff561f62553:
    english: |-
      ### Step 2 - Sense check
      As your group begins to converge on path forwards, use a **Sense check** poll to survey opinions and test how the group feels.
    translation: |-
      ### Крок 2 — Праверка сэнсу
      Калі ў групе пачынае складацца агульнае ўяўленне пра далейшыя дзеянні, правядзіце апытанне **Праверка сэнсу**, каб даведацца пра меркаванні і настроі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c1d4e97ce180d85b:
    english: |-
      A ‘Sense check’ lets people know a proposal is forming and encourages them to engage.
      It can also be used to clarify an issue, even if the solution might not be apparent yet.
    translation: |-
      «Праверка сэнсу» дае людзям ведаць, што прапанова фармуецца, і заахвочвае далучыцца да абмеркавання.
      Яна таксама дапамагае ўдакладніць пытанне, нават калі рашэнне пакуль не відавочнае.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5ff914227bb8706a:
    english: Sense check is a great way to surface concerns before moving to a formal agreement.  You can find out if people are happy with where this is going, if they have questions or need more time, or if they are concerned.
    translation: Праверка сэнсу дапамагае выявіць занепакоенасць да таго, як група пяройдзе да фармальнага ўзгаднення. Вы даведаецеся, ці задавальняе людзей кірунак працы, ці ёсць у іх пытанні, ці патрэбны ім дадатковы час і што іх непакоіць.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  01433544fefb70a5:
    english: 'Use feedback to improve and refine the proposal. If there’s still some work to do, you may need to go back to Step 1 and then run another Sense check round. '
    translation: Выкарыстоўвайце водгукі, каб палепшыць і ўдакладніць прапанову. Калі патрэбна яшчэ праца, вярніцеся да кроку 1, а потым правядзіце яшчэ адну Праверку сэнсу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  440474199fd76019:
    english: Good engagement will help you assess when you are ready to proceed to a proposal.
    translation: Актыўны ўдзел людзей дапаможа вам зразумець, калі можна пераходзіць да прапановы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f3799fd76f9d9446:
    english: "### Step 3 - Proposal\nNow when you raise a formal **Proposal**, you do so with confidence that it will pass. "
    translation: |-
      ### Крок 3 — Прапанова
      Цяпер вы можаце вынесці фармальную **Прапанова** з упэўненасцю, што яна атрымае падтрымку.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a3e74110f5a3c7a2:
    english: There may have been a lot of discussion and variations suggested, so be specific about the decision being made, so that everyone knows what the voting options mean.
    translation: Падчас абмеркавання магло з’явіцца шмат варыянтаў. Дакладна сфармулюйце рашэнне, каб усім было зразумела, што азначаюць варыянты галасавання.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b7581cfd1ecffd78:
    english: Set proposal deadlines consciously, so group members have time to consider and engage.  You can always extend the closing date if need be.
    translation: Выбірайце тэрмін галасавання так, каб ва ўдзельнікаў групы быў час абдумаць прапанову і прыняць удзел. Пры патрэбе дату закрыцця заўсёды можна перанесці.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b5bcc06f15cde560:
    english: This step is important to formalize agreement with people’s vote and to state an outcome - what just happened and what will happen next.
    translation: 'На гэтым кроку людзі фармальна выказваюць згоду галасаваннем, а вы публікуеце выснову: што адбылося і што будзе далей.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c2f2bbcacfd77ab0:
    english: Proposal results are logged, along with a record of the discussion leading to the decision.
    translation: Вынікі галасавання і абмеркаванне, якое прывяло да рашэння, захоўваюцца.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2d82209e751f2ffa:
    english: |-
      ### Outcome
      When a Loomio poll closes, you will be prompted to set an **outcome** to let everyone know what happened and what is going to happen next.
    translation: |-
      ### Выснова
      Калі апытанне ў Loomio закрыецца, вам прапануюць дадаць **Выснова**, каб паведаміць усім, што адбылося і што будзе далей.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fb14b31115927d74:
    english: "## Proposals can help in many situations"
    translation: "## Прапановы дапамагаюць у розных сітуацыях"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c1a27b25e2c01ff3:
    english: 'Don''t hesitate to start a proposal just because you''re not sure everyone will agree - proposals are not only for when you have consensus, they''re designed to surface issues that need resolving and are useful for clarifying disagreements. '
    translation: Не адкладвайце прапанову толькі таму, што не ўпэўненыя ў згодзе ўсіх. Прапановы дапамагаюць не толькі зафіксаваць кансэнсус, але і выявіць пытанні, якія трэба вырашыць, ды ўдакладніць рознагалоссі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6dbf0f3af984b8e8:
    english: The next pages show a few more complex processes for reaching decisions, through [advice](/en/guides/making_decisions/advice_process), [consent](/en/guides/making_decisions/consent_process ), or [consensus](/en/guides/making_decisions/consensus_process ).
    translation: 'На наступных старонках апісаны больш складаныя працэсы прыняцця рашэнняў: праз [парады](/en/guides/making_decisions/advice_process), [згоду](/en/guides/making_decisions/consent_process ) або [кансэнсус](/en/guides/making_decisions/consensus_process ).'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
