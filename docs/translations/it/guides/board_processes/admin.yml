  b8eb8dcae7d7a78b:
    english: Let's look at how to organize work, administer discussions, keep data safe and store records in Loomio.
    translation: Vediamo come organizzare il lavoro, gestire le discussioni, proteggere i dati e conservare i documenti in Loomio.
