name: Haraka image

on:
  push:
    branches:
      - master
    paths:
      - haraka/**
      - .github/workflows/haraka_image.yml
  pull_request:
    paths:
      - haraka/**
      - .github/workflows/haraka_image.yml
  release:
    types: [published]
  workflow_dispatch:

env:
  IMAGE_NAME: loomio/haraka-rails-docker

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAVESECRET: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: haraka/package-lock.json

      - name: Install dependencies
        working-directory: haraka
        run: npm ci

      - name: Test
        working-directory: haraka
        run: npm test

      - name: Audit dependencies
        working-directory: haraka
        run: npm audit --omit=dev

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: ${{ github.event_name != 'pull_request' && env.HAVESECRET == 'true' }}
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=stable,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
            type=sha

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: haraka
          platforms: linux/amd64,linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          push: ${{ github.event_name != 'pull_request' && env.HAVESECRET == 'true' }}
          cache-from: type=gha,scope=haraka
          cache-to: type=gha,scope=haraka,mode=max
