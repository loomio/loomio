  e19d687b56819302:
    english: Hi! I'm Alanna.
    translation: Bonjour, je m’appelle Alanna.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  10352ad196487ff3:
    english: I'm one of the founders of Loomio, and I've been thinking deeply about how it works from a facilitation perspective since the beginning. I am not a seminal facilitation expert; I consider myself only a beginner in this craft that one could spend a lifetime honing.
    translation: 'Je fais partie des personnes qui ont fondé Loomio. Depuis le début, je réfléchis à son fonctionnement sous l’angle de la facilitation. Je ne suis pas une référence dans ce domaine : je me considère encore comme une débutante dans une pratique que l’on peut approfondir toute sa vie.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c637c96f9723f02d:
    english: What I can offer is help translating between the offline and online spaces, as a practitioner in both. I've facilitated a lot of groups who use Loomio, and learned from their experiences.
    translation: Je peux toutefois aider à faire le lien entre la facilitation en présentiel et en ligne, car je pratique les deux. J’ai accompagné de nombreux groupes qui utilisent Loomio et j’ai appris de leurs expériences.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c376e38821fb6c2f:
    english: You can find out [more about me on my website](http://alanna.space).
    translation: Vous pouvez [en savoir plus sur moi sur mon site](http://alanna.space).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b893957534fa37e2:
    english: I'm only one person, with one perspective and approach to facilitation, when there are myriad approaches. I've tried to bring in a couple other facilitator's voices here, including [Rich](http://richdecibels.com/) from Loomio and Silvia from [EXP](http://exp.agency).
    translation: Je ne représente qu’un point de vue parmi les nombreuses façons de pratiquer la facilitation. J’ai donc invité d’autres personnes à partager le leur dans ce guide, notamment [Rich](http://richdecibels.com/), de Loomio, et Silvia, de [EXP](http://exp.agency).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
