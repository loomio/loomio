  cbc7b5fd5afcc24c:
    english: |-
      This is how to send a notification to your chatroom inviting people to vote in a proposal.
      It's the same process for Share outcome, Invite to thread, Remind to vote, Poll edited etc.
    translation: |-
      Para convidar as pessoas da sua sala de bate-papo a votar em uma proposta, envie uma notificação.
      O processo é o mesmo para Compartilhar conclusão, Convidar para uma discussão, Lembrar de votar, Enquete editada e outros eventos.
    status: machine
