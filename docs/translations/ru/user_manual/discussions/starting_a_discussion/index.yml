---
navigation_title: Начать обсуждение
blocks:
  8fae4100a4f3548b:
    english: "# Start a discussion"
    translation: "# Начать обсуждение"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4ba984e9573c27ff:
    english: Starting a Loomio discussion is like writing an email. The subject line of an email is like the discussion title, and the text you write in an email is like the context of a discussion.
    translation: Начать обсуждение в Loomio похоже на отправку письма. Тема письма соответствует названию обсуждения, а текст письма — описанию обсуждения.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4f81447c072f5dfe:
    english: As you add people in the send list of your email, in Loomio you can invite people individually or as a group to the discussion - they will receive an email notification with the content of your discussion.
    translation: Как и при отправке письма, вы можете пригласить к обсуждению отдельных людей или целую группу. Они получат письмо с содержанием обсуждения.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2408b54e3b78a282:
    english: People can reply to your discussion via email and their comments will appear in the discussion.
    translation: Люди могут ответить на ваше обсуждение по электронной почте. Их ответы появятся в обсуждении как комментарии.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  24ced64c5c4cf853:
    english: As with an email, a discussion may be a simple question, or a more detailed introduction to a topic with links or files attached for background information.
    translation: Как и письмо, обсуждение может содержать простой вопрос или подробное введение в тему со ссылками и прикреплёнными файлами.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ec39413fa07094c8:
    english: "## New discussion"
    translation: "## Новое обсуждение"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  92b37b2e208bfd57:
    english: Find the **New discussion** button on your Loomio group page to start a new discussion.
    translation: Чтобы начать обсуждение, найдите кнопку **Новое обсуждение** на странице вашей группы в Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  515ac46bdfccb401:
    english: You can start a discussion within your Loomio group or any subgroup.
    translation: Вы можете начать обсуждение в своей группе Loomio или любой её подгруппе.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ef9721ba6b69b86b:
    english: "![New discussion button on the Oatmilk Cooperative page](new-discussion-button.png)"
    translation: "![Кнопка «Новое обсуждение» на странице кооператива Oatmilk](new-discussion-button.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1cf9e569475cd2cc:
    english: "![New discussion form for planning the returnable bottle trial](new-discussion-example.png)"
    translation: "![Форма нового обсуждения для планирования испытания возвратных бутылок](new-discussion-example.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f973f5b9f1c4b1dd:
    english: |-
      ### Group
      Check the name of the group or subgroup is correct for your discussion.  Anyone in this group will be able to see the discussion. You can also start the discussion in another group or as a 'direct' discussion (no group).
    translation: |-
      ### Группа
      Проверьте, что для обсуждения выбрана нужная группа или подгруппа. Все участники этой группы смогут видеть обсуждение. Вы также можете начать обсуждение в другой группе или создать прямое обсуждение без группы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f0b0bda9877ce0ed:
    english: |-
      >[!Tip]
      >If you are not ready to make the discussion visible in your group, start the discussion as 'direct'.  You can move the discussion to your Loomio group when ready.
    translation: |-
      >[!Tip]
      >Если вы пока не готовы сделать обсуждение видимым в группе, начните прямое обсуждение. Когда будете готовы, перенесите его в свою группу Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cd1b45c3cb71503b:
    english: "### Invite and notify"
    translation: "### Приглашения и уведомления"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f3f388d23b06b25c:
    english: The **Invite** field controls who receives the new discussion immediately.
    translation: Поле **Приглашать** определяет, кто сразу получит уведомление о новом обсуждении.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c1b5c23770d3692:
    english: Group members can see a discussion in their group even if you do not notify them. Adding a group member to **Invite** sends them an email notification and a notification in Loomio.
    translation: Участники группы могут видеть обсуждение в своей группе, даже если вы не отправили им уведомление. Если добавить участника группы в поле **Приглашать**, он получит уведомление по электронной почте и в Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e2e5906a39131506:
    english: Select a group to notify everyone in it, or expand the group to choose individual members. Select the × beside a name to remove that person from the notification.
    translation: Выберите группу, чтобы уведомить всех её участников, или раскройте список группы и выберите отдельных участников. Чтобы удалить человека из списка получателей уведомления, нажмите × рядом с его именем.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  81b57efbb3c428b7:
    english: "![Invite field expanded to show individual recipients](../notifying_people/thread_notification.png)"
    translation: "![Раскрытое поле «Приглашать» со списком отдельных получателей](../notifying_people/thread_notification.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5cbd2b7b0bcc486f:
    english: Start typing a member's name and select it from the list.
    translation: Начните вводить имя участника и выберите его в списке.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dc128abbc65cb0c8:
    english: "![Searching for Samira Patel in the Invite field](../notifying_people/thread_notify_user.png)"
    translation: "![Поиск Самиры Патель в поле «Приглашать»](../notifying_people/thread_notify_user.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3274fe93fcf29b29:
    english: Enter an email address to invite a guest. A guest can see and participate in this thread but cannot see other discussions in the group unless separately invited.
    translation: Введите адрес электронной почты, чтобы пригласить гостя. Гость сможет видеть эту ветку обсуждения и участвовать в ней, но не сможет видеть другие обсуждения группы без отдельного приглашения.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ab3214ccf77143e3:
    english: "![Adding a guest email address to the Invite field](../notifying_people/thread_notify_email.png)"
    translation: "![Добавление адреса электронной почты гостя в поле «Приглашать»](../notifying_people/thread_notify_email.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cba9346e727b829a:
    english: You can also start the discussion without notifying anyone. Group members can still find it in Loomio and may see it in their catch-up email, depending on their notification settings.
    translation: Вы также можете начать обсуждение, никого не уведомляя. Участники группы по-прежнему смогут найти его в Loomio. В зависимости от настроек уведомлений они также могут увидеть его в письме со сводкой.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6518afe373ff1959:
    english: "### Tags"
    translation: "### Метки"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ff67c09f89479873:
    english: Add tag(s) to help people find your discussion when searching by tag. Admins can create new tags.
    translation: Добавьте метки, чтобы людям было проще найти ваше обсуждение при поиске по меткам. Администраторы могут создавать новые метки.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ba80a903c4ecc7d1:
    english: |-
      ### Title
      Give your discussion a relevant title.  A discussion title is similar to an email subject line.
    translation: |-
      ### Название
      Дайте обсуждению название, отражающее его тему. Оно похоже на тему электронного письма.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a91cf4b0b1b2ad5e:
    english: |-
      ### Context
      Use discussion context to introduce the topic and frame the conversation or decision to make. Use the formatting tools to emphasize key points. Include background information, attach files, link to online documents and embed a video.
    translation: |-
      ### Описание
      Используйте описание обсуждения, чтобы представить тему и обозначить вопрос для разговора или принятия решения. Выделите важные моменты с помощью инструментов форматирования. Добавьте сведения по теме, прикрепите файлы, ссылки на документы в интернете или видео.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1bf690aa841299cd:
    english: The context will always stay at the top of the discussion and you can update it at any time as the discussion progresses.  When the discussion ends, update the context with the outcome.
    translation: Описание всегда остаётся в верхней части обсуждения. Вы можете обновлять его по ходу разговора. Когда обсуждение закончится, добавьте в описание его итог.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
