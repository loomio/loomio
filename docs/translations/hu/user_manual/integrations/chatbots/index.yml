  f1d9c09f9d3c2a82:
    english: "### Invite to poll"
    translation: "### Meghívás szavazásra"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cbc7b5fd5afcc24c:
    english: |-
      This is how to send a notification to your chatroom inviting people to vote in a proposal.
      It's the same process for Share outcome, Invite to thread, Remind to vote, Poll edited etc.
    translation: |-
      Így küldhetsz értesítést a csevegőszobádba, hogy szavazásra hívd az embereket egy javaslatban.
      Ugyanígy oszthatsz meg következtetést, hívhatsz meg embereket egy témába, emlékeztethetsz valakit a szavazásra, vagy jelezheted egy szavazás módosítását.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  290001bb97dee010:
    english: |-
      ### Automatic notifications
      To send a notification whenever a specific event happens, edit the chat integration and select that event.
    translation: |-
      ### Automatikus értesítések
      Ha egy adott esemény bekövetkezésekor mindig értesítést szeretnél küldeni, szerkeszd a csevegési integrációt, és válaszd ki az eseményt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
