  3cc3304a15bc3d2f:
    english: In the Consent process, an objection is defined as something that **might cause harm to the team or organization**.
    translation: In het toestemmingsproces is een bezwaar iets dat **schade kan veroorzaken aan het team of de organisatie**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ab509ea088e16a0d:
    english: |-
      Objections should meet this criteria to be valid:
      - Explicit: *I can make a reasoned case*
      - Impersonal: *It's not just a personal preference*
      - Evidenced: *Not predictive, based on experience*
      - Not 'safe to fail': *It's not that I have a 'better idea'*
    translation: |-
      Een bezwaar is gegrond als het aan deze criteria voldoet:
      - Expliciet: *Ik kan mijn bezwaar onderbouwen*
      - Onpersoonlijk: *Het is niet alleen een persoonlijke voorkeur*
      - Onderbouwd met bewijs: *Het is gebaseerd op ervaring, niet op een voorspelling*
      - Niet ‘veilig om te laten mislukken’: *Het gaat er niet om dat ik een ‘beter idee’ heb*
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
