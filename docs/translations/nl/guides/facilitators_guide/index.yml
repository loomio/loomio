  980342866ab7bee6:
    english: An in-depth guide to applying key facilitation concepts in the online space.
    translation: Een uitgebreide gids voor het toepassen van belangrijke principes van gespreksbegeleiding in een online omgeving.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ac8728f5ce2ea8ce:
    english: Loomio is made by facilitators, and that plays a huge role in how it has been designed. This guide is about revealing more of that context, and translating facilitation concepts from the offline space to the online space.
    translation: Loomio is gemaakt door gespreksbegeleiders. Dat heeft een grote rol gespeeld in het ontwerp. Deze gids geeft meer inzicht in die achtergrond en laat zien hoe je principes van gespreksbegeleiding online toepast.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e802660a44da1775:
    english: "## More about this guide"
    translation: "## Meer over deze gids"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5cbd64dba51ca485:
    english: Whether employed by a professional facilitator, people peer-facilitating each other, or a group that has no awareness of facilitation at all, Loomio’s essential function is to mediate and support group communication toward a desired outcome. In other words, facilitation.
    translation: 'Of een professionele gespreksbegeleider Loomio gebruikt, mensen elkaar begeleiden of een groep niet bekend is met gespreksbegeleiding: Loomio helpt groepen communiceren en samenwerken aan een gewenst doel. Met andere woorden: Loomio ondersteunt gespreksbegeleiding.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  25a956280b647fa6:
    english: 'Loomio is *groupware*:'
    translation: 'Loomio is *groepssoftware*:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  33e304be58a0a55b:
    english: "> Collaborative software, or groupware, is designed to help people involved in a common task achieve their goals. One of the earliest definitions of collaborative software is “intentional group processes plus software to support them.” -- Wikipedia"
    translation: "> Samenwerkingssoftware, of groepssoftware, is ontworpen om mensen die aan een gezamenlijke taak werken te helpen hun doelen te bereiken. Een van de vroegste definities van samenwerkingssoftware is ‘doelbewuste groepsprocessen plus software die deze ondersteunt’. -- Wikipedia"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  170a0b463e1ad8ca:
    english: There is a huge body of knowledge, best practice, and tradition in both in-person facilitation and online moderation, but the art and science of their intersection is only just emerging. This is the specific space where Loomio strives to excel.
    translation: Er bestaat veel kennis, praktijkervaring en traditie rond gespreksbegeleiding in persoon en online moderatie. Hoe die twee samenkomen, wordt nog volop verkend. Op dat gebied wil Loomio uitblinken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
