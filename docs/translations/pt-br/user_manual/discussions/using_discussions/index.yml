    translated_on: '2026-09-29'
  e688189fa93b1e49:
    english: To remove someone, open the three-dot menu (**⋯**) beside their name and select **Remove from discussion**.
    translation: Para remover alguém, abra o menu de três pontos (**⋯**) ao lado do nome da pessoa e selecione **Remover da discussão**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5602fbfa565eaf45:
    english: "### Seen by"
    translation: "### Visto por"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a929b22d02292573:
    english: "**Seen by** shows who has opened the thread and when. It can help you identify people who may not have seen important information yet."
    translation: "**Visto por** mostra quem abriu a conversa e quando. Isso ajuda você a identificar quem talvez ainda não tenha visto informações importantes."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d0335d202c5bbaa3:
    english: "![Seen by and Notified in the Thread members section](../notifying_people/thread_engagement.png)"
    translation: "![Visto por e Notificado na seção de membros da conversa](../notifying_people/thread_engagement.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb77150441a43f5c:
    english: "![Seen by window listing thread members](../notifying_people/thread_seenby.png)"
    translation: "![Janela Visto por com a lista de membros da conversa](../notifying_people/thread_seenby.png)"
    status: machine
    provider: codex/gpt-6-sol
