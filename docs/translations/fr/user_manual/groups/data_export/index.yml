navigation_title: Exportation des données
blocks:
  '053719812e2be1ea':
    english: "# Group data backup or export"
    translation: "# Sauvegarder ou exporter les données d’un groupe"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  42721518a91907da:
    english: 'With the group data export feature you can:'
    translation: 'La fonction d’exportation des données d’un groupe vous permet de :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f978c97e52e0b00a:
    english: |-
      - Download a file containing member data to audit group membership.
      - Download content of your group including text of threads and polls for archive or analysis.
      - Open poll results in a spreadsheet or scripting language.
      - [Print or save PDF's of a thread or poll for archival purposes.](#print-thread-to-pdf)
      - Move your group, including all users, threads, polls, and files to another Loomio server.
    translation: |-
      - Télécharger un fichier contenant les données des membres pour vérifier la composition du groupe.
      - Télécharger le contenu de votre groupe, notamment le texte des discussions et des sondages, pour l’archiver ou l’analyser.
      - Ouvrir les résultats des sondages dans un tableur ou les traiter avec un langage de script.
      - [Imprimer une discussion ou un sondage, ou l’enregistrer au format PDF pour l’archiver.](#print-thread-to-pdf)
      - Transférer votre groupe, avec tous ses utilisateurs, discussions, sondages et fichiers, vers un autre serveur Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  94b3081b62cd0a45:
    english: If you ever want to move from Loomio managed servers [to your own](https://github.com/loomio/loomio), you can use this feature.
    translation: Vous pouvez utiliser cette fonction si vous souhaitez quitter les serveurs gérés par Loomio pour passer [à votre propre serveur](https://github.com/loomio/loomio).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  223d5690921676c4:
    english: If you're running your own Loomio server, and would rather not anymore, Loomio offer managed hosting in USA, EU and Australia. If you'd like to migrate your group to one of these servers, please [contact us](/contact).
    translation: Si vous gérez votre propre serveur Loomio et souhaitez passer à un hébergement géré, Loomio propose des serveurs aux États-Unis, dans l’Union européenne et en Australie. Pour y transférer votre groupe, [contactez-nous](/contact).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cabd4ab01146ea7c:
    english: "[Contact us](/contact) if you would like to transfer your Loomio group from Loomio's global hosted service at loomio.com to one of our regional services; loomio.eu for Europe or loomio.nz for Australia and New Zealand."
    translation: "[Contactez-nous](/contact) si vous souhaitez transférer votre groupe du service mondial hébergé par Loomio sur loomio.com vers l’un de nos services régionaux : loomio.eu pour l’Europe ou loomio.nz pour l’Australie et la Nouvelle-Zélande."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
