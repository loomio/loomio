    translated_on: '2026-09-30'
  f0f5f5abd586fb61:
    english: 'Common board tags include: Administration, AGM, Board meeting, Report, Finance, Legal, Members, Minutes, Planning, Policy, Resolution, Constitution, General meeting, Strategy.'
    translation: 'Les mots-clés courants pour un conseil d’administration comprennent : Administration, Assemblée générale annuelle, Réunion du conseil, Rapport, Finances, Affaires juridiques, Membres, Procès-verbaux, Planification, Politique, Résolution, Statuts, Assemblée générale, Stratégie.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  89d8ec222f5019df:
