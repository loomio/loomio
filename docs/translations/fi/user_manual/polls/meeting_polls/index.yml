  41d1e6a3a6739d95:
    english: People mark each time with the green thumbs-up icon when they are available, the yellow sideways thumb when they can attend if needed, or the red thumbs-down icon when they are unavailable.
    translation: Osallistujat merkitsevät kunkin ajankohdan vihreällä peukku ylös -kuvakkeella, jos se sopii heille, keltaisella sivuttain osoittavalla peukalolla, jos he pääsevät tarvittaessa, tai punaisella peukku alas -kuvakkeella, jos se ei sovi.
    status: machine
