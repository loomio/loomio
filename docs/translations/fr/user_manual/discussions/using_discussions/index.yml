  '08ff4ccd500c2a69':
    english: The right sidebar contains actions for the whole thread. Some actions are also available from the three-dot menu (**⋯**) beside a thread on the group page.
    translation: La barre latérale droite contient les actions qui s’appliquent à l’ensemble du fil de discussion. Certaines sont aussi accessibles depuis le menu à trois points (**⋯**) à côté du fil sur la page du groupe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e73701c7d36f95ef:
    english: The actions shown depend on your permissions. Group admins can manage threads, and group settings may allow members to perform some management actions. See [Group permissions](/en/user_manual/groups/settings/permissions).
    translation: Les actions affichées dépendent de vos autorisations. Les administrateurs du groupe peuvent gérer les fils de discussion. Selon les paramètres du groupe, les membres peuvent aussi effectuer certaines actions de gestion. Consultez [Autorisations du groupe](/en/user_manual/groups/settings/permissions).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4fce317a163b0a40:
    english: "### Print"
    translation: "### Imprimer"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9317d4c7c5ef4764:
    english: Select **Print** to generate a page suitable for printing. Use your browser's print dialog to save it as a PDF.
    translation: Sélectionnez **Imprimer** pour générer une page adaptée à l’impression. Utilisez la boîte de dialogue d’impression de votre navigateur pour l’enregistrer au format PDF.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  443af0749df1db2a:
    english: "### Markdown"
    translation: "### Markdown"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eb0442148f7c042d:
    english: Select **Markdown** to save the complete thread as structured Markdown. Choose **Copy Markdown** to copy it to your clipboard, or **Download Markdown** to save it as a `.md` file. You can use it for meeting minutes, a document, an archive of decisions, an AI assistant, or another tool that supports Markdown.
    translation: Sélectionnez **Markdown** pour enregistrer l’intégralité du fil de discussion dans un document Markdown structuré. Choisissez **Copier le Markdown** pour le copier dans le presse-papiers, ou **Télécharger Markdown** pour l’enregistrer dans un fichier `.md`. Vous pouvez l’utiliser comme compte rendu de réunion, document ou archive des décisions, ou l’importer dans un assistant IA ou un autre outil compatible avec Markdown.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  80e3f57638b53cb4:
    english: The document begins with YAML front matter containing the thread key, group, creation date, last activity date, and tags. It then includes the discussion context and every comment, poll, vote, and outcome in the same order and nesting as the threaded view.
    translation: Le document commence par un en-tête YAML contenant la clé du fil de discussion, le groupe, la date de création, la date de la dernière activité et les tags. Il contient ensuite le contexte de la discussion, puis chaque commentaire, sondage, vote et conclusion, dans le même ordre et avec la même imbrication que dans l’affichage en fils.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f99823b7b44e2cdd:
    english: Each poll is a section. Comments, votes, and outcomes are quoted, and replies are quoted beneath the item they answer. This shows where each person's text begins and ends. Each quote starts with one line showing the person, when they posted, the item's number in the thread, and any reactions. Votes and outcomes also say what they are. The thread key and item number identify each item in Loomio.
    translation: Chaque sondage forme une section. Les commentaires, les votes et les conclusions sont présentés en citations. Les réponses sont citées sous l’élément auquel elles répondent. Vous pouvez ainsi voir où commence et où se termine le texte de chaque personne. Chaque citation commence par une ligne indiquant la personne, la date de publication, le numéro de l’élément dans le fil de discussion et les éventuelles réactions. Les votes et les conclusions sont également identifiés comme tels. La clé du fil de discussion et le numéro de l’élément permettent de retrouver chaque élément dans Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e5bdfbb4a0d7646f:
    english: Loomio applies the same visibility rules as the thread. Results and vote reasons you cannot see are not included, and voters are not identified in anonymous polls. If an open poll hides results until you vote, vote before exporting the thread. **Markdown** and **Print** are unavailable until you do.
    translation: Loomio applique les mêmes règles de visibilité que dans le fil de discussion. Les résultats et les motifs de vote auxquels vous n’avez pas accès sont omis, et les personnes ayant voté ne sont pas identifiées dans les sondages anonymes. Si un sondage ouvert masque les résultats jusqu’à votre vote, votez avant d’exporter le fil de discussion. Les options **Markdown** et **Imprimer** ne sont pas disponibles avant votre vote.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7989d3386a42f180:
    english: 'For example, a discussion containing a comment, reactions, a proposal, two votes, a reply, and an outcome produces this Markdown:'
    translation: 'Par exemple, une discussion contenant un commentaire, des réactions, une proposition, deux votes, une réponse et une conclusion produit ce document Markdown :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  275f4d9025c017c4:
    english: The headings and labels use your selected language. Content written by participants remains in its original language.
    translation: Les titres et les libellés utilisent la langue que vous avez choisie. Le contenu rédigé par les participants reste dans sa langue d’origine.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dab18fdf3c56269d:
    english: "### Thread settings and display"
    translation: "### Paramètres et affichage du fil de discussion"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7bc55279f97c6d1b:
    english: Group admins can select **Thread settings** to change how replies are arranged and configure other discussion options.
    translation: Les administrateurs du groupe peuvent sélectionner **Paramètres du fil de discussion** pour modifier l’agencement des réponses et configurer d’autres options de la discussion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  32b2640ba23524aa:
    english: Choose **Timeline** to list items in the order they were posted, or **Threaded** to group replies beneath the item they respond to. Thread settings also control whether multiple polls may run at once and can set a maximum comment length. These settings apply to everyone in the discussion.
    translation: Choisissez **Chronologie** pour afficher les éléments dans leur ordre de publication, ou **En fils** pour regrouper les réponses sous l’élément auquel elles répondent. Les paramètres du fil de discussion permettent aussi d’autoriser plusieurs sondages simultanés et de fixer une longueur maximale pour les commentaires. Ils s’appliquent à toutes les personnes qui participent à la discussion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a520339278bcc2a:
    english: "### Pin or unpin a thread"
    translation: "### Mettre en avant ou retirer la mise en avant d’un fil de discussion"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0433e7a61db60003:
    english: Pinned threads appear above other threads on the group page. Welcome discussions, news items, and announcements are typical uses for pinned threads.
    translation: Les fils de discussion mis en avant apparaissent au-dessus des autres sur la page du groupe. Cette option peut servir pour les discussions de bienvenue, les actualités et les annonces.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b2712588a5e0aab3:
    english: Open the three-dot menu (**⋯**) beside the thread on the group page and select **Pin thread**. Pinned threads are ordered by the time they were pinned. To change their order, unpin and pin them again.
    translation: Ouvrez le menu à trois points (**⋯**) à côté du fil de discussion sur la page du groupe, puis sélectionnez **Mettre en avant la discussion**. Les fils de discussion mis en avant sont classés selon la date de leur mise en avant. Pour modifier leur ordre, retirez leur mise en avant, puis mettez-les de nouveau en avant.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a0443f076d1b8ae5:
    english: Select **Unpin thread** to return a thread to the activity-based order.
    translation: Sélectionnez **Ne plus mettre en avant la discussion** pour que le fil de discussion retrouve sa place selon son activité.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b90a469963b02ffc:
    english: "### Move a thread"
    translation: "### Déplacer un fil de discussion"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8b2071f4625705e5:
    english: Select **Move thread** to move a thread to another group, subgroup, or to a direct thread. It will be visible to members of the destination group and anyone specifically invited to it.
    translation: Sélectionnez **Déplacer le sujet** pour déplacer un fil de discussion vers un autre groupe, un sous-groupe ou une discussion directe. Il sera visible par les membres du groupe de destination et par toute personne invitée à y participer.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f09d5f2afce03ee8:
    english: |-
      >[!Tip]
      >Start a draft as a direct discussion or in a private subgroup, then move it to the group when it is ready.
    translation: |-
      >[!Tip]
      >Commencez un brouillon dans une discussion directe ou un sous-groupe privé, puis déplacez-le vers le groupe lorsqu’il est prêt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c82562b641053308:
    english: To move selected activity rather than the whole thread, see [Moving items between threads](/en/user_manual/discussions/moving_items/).
    translation: Pour déplacer seulement certains éléments plutôt que l’ensemble du fil de discussion, consultez [Déplacer des éléments entre des fils de discussion](/en/user_manual/discussions/moving_items/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  be22d2980075fdaa:
    english: "### Lock or unlock a thread"
    translation: "### Verrouiller ou déverrouiller un fil de discussion"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e7c24a610fd2bf8b:
    english: Lock a thread to prevent comments or further changes. A thread can only be locked after its active polls have closed.
    translation: Verrouillez un fil de discussion pour empêcher l’ajout de commentaires ou toute autre modification. Vous ne pouvez le verrouiller qu’une fois tous ses sondages actifs terminés.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  edb983bb6366aa6c:
    english: Select **Lock thread** under **Actions**. Locked threads are removed from the list of open discussions and marked with a **Locked** tag.
    translation: Sélectionnez **Verrouiller la discussion** dans **Actions**. Les fils de discussion verrouillés disparaissent de la liste des discussions ouvertes et portent le tag **Verrouillé**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ba2794349524cc33:
    english: To find a locked thread, open the discussion filter on the group page and select **Locked**. Open the thread and select **Unlock thread** to allow comments and changes again.
    translation: Pour retrouver un fil de discussion verrouillé, ouvrez le filtre des discussions sur la page du groupe et sélectionnez **Verrouillé**. Ouvrez le fil, puis sélectionnez **Déverrouiller le fil de discussion** pour autoriser de nouveau les commentaires et les modifications.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3a75fb1ad0ffab87:
    english: "### Delete a thread"
    translation: "### Supprimer un fil de discussion"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0103a5729bd6a095:
    english: Deleting a thread removes it permanently and cannot be undone. Lock the thread instead if you may need it again.
    translation: La suppression d’un fil de discussion est définitive. Si vous pensez en avoir encore besoin, verrouillez-le plutôt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  daf08ca8895b0fe2:
    english: Select **Delete thread** and confirm the deletion.
    translation: Sélectionnez **Supprimer la discussion**, puis confirmez la suppression.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
