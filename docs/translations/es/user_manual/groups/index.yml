  59f3bebbce1676a6:
    english: |-
      Choose a representative name for your group and use the group description to outline;
      - **what** this group is used for,
      - **why** this is important,
      - **who** is involved, and
      - **how** members can participate.
    translation: |-
      Elige un nombre que represente a tu grupo y usa la descripción para explicar:
      - **para qué** se usa el grupo,
      - **por qué** es importante,
      - **quiénes** participan, y
      - **cómo** pueden participar los miembros.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  79ae54bca7eb1797:
    english: You may also include information like a code of conduct, terms of reference or other governing documents for the group.
    translation: También puedes incluir un código de conducta, normas de funcionamiento u otros documentos que rijan el grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '018c400616dad5f4':
    english: If you are preparing a new group, see [Introducing Loomio to your group](/en/user_manual/overview/introducing_loomio) for a practical sequence from choosing the first piece of work through to recording an outcome.
    translation: Si estás preparando un grupo nuevo, consulta [Cómo presentar Loomio a tu grupo](/en/user_manual/overview/introducing_loomio) para seguir una secuencia práctica, desde elegir la primera tarea hasta registrar una conclusión.
    status: machine
