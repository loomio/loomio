---
navigation_title: Запрашэнне людзей
blocks:
  47820acef0cf3fe9:
    english: "# Inviting people"
    translation: "# Запрашэнне людзей"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6a2bc749ec2883c0:
    english: Go to your group page and click the **Members** tab to access member management.
    translation: Адкрыйце старонку сваёй групы і націсніце ўкладку **Удзельнікі**, каб кіраваць складам групы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7fc9a792512e50bb:
    english: You can **Invite** particular people to your group with their email address or **Share** a link to your group via email, newsletter, chat or from your website.
    translation: Вы можаце **Запрасіць** людзей у групу па адрасах электроннай пошты або **Падзяліцца** спасылкай на групу праз электронную пошту, рассылку, чат ці свой сайт.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3fc7875402babd63:
    english: "## Send invitations via email"
    translation: "## Адпраўка запрашэнняў па электроннай пошце"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4e91c3f036e94808:
    english: Click **Invite** on the **Members** tab to send an email containing a single-use invitation link. The recipient can create a Loomio user account and join your group.
    translation: На ўкладцы **Удзельнікі** націсніце **Запрасіць**, каб адправіць ліст з аднаразовай спасылкай для запрашэння. Людзі, якія атрымаюць ліст, змогуць стварыць уліковы запіс Loomio і далучыцца да вашай групы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  37a98960a11df300:
    english: If the recipient already has a Loomio user account they can still accept the invitation to join your group with their existing account.
    translation: Калі ў людзей ужо ёсць уліковыя запісы Loomio, яны могуць прыняць запрашэнне і далучыцца да вашай групы з гэтымі ўліковымі запісамі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c40b8865bc90ab0b:
    english: "### Invite many at once"
    translation: "### Запрашэнне некалькіх людзей адначасова"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f92bf789ad23e4c3:
    english: You can send invitations by email to up to 100 people at a time by entering (or copy/pasting) multiple email addresses into the "Who would you like to invite" box. Separate email addresses by comma or space.
    translation: Вы можаце адправіць запрашэнні па электроннай пошце да 100 людзям адначасова. Увядзіце або ўстаўце некалькі адрасоў у поле «Каго вы хочаце запрасіць». Раздзяляйце адрасы коскамі або прабеламі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1e8ea8567d051081:
    english: When inviting people to a group within an organization, the parent group and related subgroups you belong to appear as audience suggestions. Select a group, then select its chip to expand the audience into individual people. You can remove anyone you do not want to invite before sending the invitations. People who already belong to the destination group are excluded.
    translation: Калі вы запрашаеце людзей у групу ў складзе арганізацыі, сярод прапанаваных атрымальнікаў з’явяцца бацькоўская група і звязаныя падгрупы, да якіх вы належыце. Выберыце групу, а затым націсніце яе пазнаку, каб разгарнуць спіс асобных людзей. Перад адпраўкай запрашэнняў вы можаце выдаліць са спіса тых, каго не хочаце запрашаць. Людзі, якія ўжо належаць да групы, у якую вы запрашаеце, не будуць уключаны.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  23c96c665ed9ad1c:
    english: |-
      >[!Tip]
      >Copy email addresses from a column in a Google or Excel spreadsheet, and paste into the invitation box.
    translation: |-
      >[!Tip]
      >Скапіруйце адрасы электроннай пошты са слупка табліцы Google або Excel і ўстаўце іх у поле запрашэння.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  697177b4211a5479:
    english: When you click **Invite** an email will be sent to each of the email addresses you supplied, containing a unique invitation link that can only be used once. This email will be sent in your current language.
    translation: Калі вы націснеце **Запрасіць**, на кожны ўказаны адрас электроннай пошты прыйдзе ліст з унікальнай спасылкай для запрашэння. Скарыстацца ёю можна толькі адзін раз. Ліст будзе на мове, якую вы зараз выкарыстоўваеце.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bcce66d3fb6f6b8e:
    english: "### Invite people to Subgroups"
    translation: "### Запрашэнне людзей у падгрупы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9e422dfc71ef2fe0:
    english: Following the same process as above, you can invite people to a 'parent' group, and one or more subgroups simultaneously when you invite them with the **Invite people** button. Tick the boxes next to the subgroups you want them to immediately be a part of when they join the group.
    translation: З дапамогай кнопкі **Запрасіць людзей** вы можаце адначасова запрасіць людзей у бацькоўскую групу і адну ці некалькі падгруп. Працэс такі ж, як апісана вышэй. Адзначце падгрупы, у якія людзі павінны ўвайсці адразу пасля далучэння да групы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  87f0b0c3281b6228:
    english: "## Share a link to your group"
    translation: "## Спасылка на вашу групу"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2f014bdf9b719ec0:
    english: You can share a link to your group with the **Share** button. This is useful if you want to send a link via email, newsletter, chat or post on your website.
    translation: Кнопка **Падзяліцца** дазваляе атрымаць спасылку на вашу групу. Вы можаце адправіць яе па электроннай пошце, у рассылцы ці чаце або размясціць на сваім сайце.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  18ff20426c02846e:
    english: Click on the "copy" icon to copy the link to your clipboard, then paste in your email, newsletter or chat channel.
    translation: Націсніце значок «Капіяваць», каб скапіраваць спасылку ў буфер абмену, а затым устаўце яе ў ліст, рассылку ці чат.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c6506b3c529f683c:
    english: If you want to stop people from joining via this link, click "Reset this link". The existing link will no longer work and a new link will be created.
    translation: Калі вы хочаце забараніць далучэнне праз гэтую спасылку, націсніце «Скінуць гэтую спасылку». Старая спасылка перастане працаваць, і будзе створана новая.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6d57daddf1df6a2d:
    english: "## Request to join group"
    translation: "## Запыт на далучэнне да групы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  70b9af34b3bc2a9e:
    english: People can request to join an Open or Closed group. Share the group URL, such as `https://www.loomio.com/group-name`. When people arrive at the group page, they can see the public group information and select **Join group** to answer the joining prompt and send their request.
    translation: Людзі могуць падаць запыт на далучэнне да адкрытай або закрытай групы. Падзяліцеся адрасам групы, напрыклад `https://www.loomio.com/group-name`. На старонцы групы людзі змогуць убачыць агульнадаступную інфармацыю пра яе і націснуць **Далучыцца да групы**, каб адказаць на пытанне пры далучэнні і адправіць запыт.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a5534ae2aba161ba:
    english: The joining prompt gives people a chance to introduce themselves and explain why they want to join.
    translation: Пытанне пры далучэнні дае людзям магчымасць прадставіцца і патлумачыць, чаму яны хочуць далучыцца.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bb13bbdbfd6da80b:
    english: Under [Group privacy](/en/user_manual/groups/settings/privacy#how-people-join), choose **Request approval** to require requests to be reviewed. You can also customize the joining prompt in the group settings.
    translation: У раздзеле [Прыватнасць групы](/en/user_manual/groups/settings/privacy#how-people-join) выберыце **Патрабуецца зацвярджэнне**, каб запыты разглядаліся перад далучэннем. Вы таксама можаце змяніць пытанне пры далучэнні ў наладах групы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5b0e7c47a0518a3e:
    english: "### Review membership requests"
    translation: "### Разгляд запытаў на далучэнне"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d4a03352457d41cb:
    english: 'Group administrators and members with permission to add members review requests from the **Membership requests** section of the **Members** tab. A reviewer can:'
    translation: 'Адміністратары групы і ўдзельнікі з правам дадаваць людзей разглядаюць запыты ў раздзеле **Запыты на далучэнне** на ўкладцы **Удзельнікі**. Яны могуць:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  84c6d641f9dba801:
    english: |-
      - **Approve** the request to add the applicant as a member and notify them.
      - **Ignore** the request to close it without notifying the applicant or allowing another request.
      - **Decline** the request with a message explaining the decision. Loomio sends the message to the applicant by email and notification, and they can submit a new request.
    translation: |-
      - **Зацвердзіць** запыт, каб дадаць людзей у групу і паведаміць ім пра гэта.
      - **Ігнараваць** запыт, каб закрыць яго без апавяшчэння і без магчымасці падаць новы запыт.
      - Выбраць **Адмова** і напісаць паведамленне з тлумачэннем рашэння. Loomio адправіць яго людзям па электроннай пошце і праз апавяшчэнне. Пасля гэтага яны змогуць падаць новы запыт.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b1de5132fa942ba8:
    english: Select the decline button to write a message or ignore the request.
    translation: Націсніце кнопку адмовы, каб напісаць паведамленне, або ігнаруйце запыт.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a87e3fdd4ce43ee9:
    english: "## Managing invitations"
    translation: "## Кіраванне запрашэннямі"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  84dc2f66c60f3237:
    english: To manage invitations, open the filter/ drop down from the Members tab of your Group page and select **Invitations**. You can manage individual invitations by clicking the three dot menu (**⋮**) to the right of the member.
    translation: Каб кіраваць запрашэннямі, адкрыйце выпадальны спіс фільтраў на ўкладцы **Удзельнікі** старонкі групы і выберыце **Запрашэнні**. Для кіравання асобным запрашэннем націсніце меню з трыма кропкамі (**⋮**) справа ад імя чалавека.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c8d12991b8edb22f:
    english: You can also make people administrators or set their title (e.g. "IT Support") within the group before they accept their invitation.
    translation: Перш чым людзі прымуць запрашэнні, вы таксама можаце прызначыць іх адміністратарамі або ўказаць іх пасады ў групе, напрыклад «ІТ-падтрымка».
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e8aec784f84451cc:
    english: "### Re-send invitations"
    translation: "### Паўторная адпраўка запрашэнняў"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1c201c2b360b1877:
    english: Follow up on people who don't make it into the group and give them a nudge. If someone has lost or forgotten about their invitation email, you can re-send it from the dropdown menu beside their name on the Members page.
    translation: Калі людзі яшчэ не далучыліся да групы, вы можаце нагадаць ім пра запрашэнне. Калі ліст з запрашэннем згубіўся або пра яго забыліся, адпраўце яго яшчэ раз праз выпадальнае меню побач з імем чалавека на старонцы **Удзельнікі**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8b4674400f9a3f09:
    english: Click on the three dots (**⋮**) next to the person you want to resend the invitation to, and then choose **Resend invitation**.
    translation: Націсніце тры кропкі (**⋮**) побач з імем чалавека, якому хочаце паўторна адправіць запрашэнне, і выберыце **Адправіць запрашэнне яшчэ раз**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  abc5a934440fb8e1:
    english: |-
      ### Cancelling invitations
      If you entered the wrong email address, or have changed your mind about inviting someone, you can cancel an invitation from the Members tab on your Group page. Select **Cancel Invitation** from the drop down menu to the right of the member invitation (**⋮**).
    translation: |-
      ### Скасаванне запрашэнняў
      Калі вы ўвялі няправільны адрас электроннай пошты або перадумалі запрашаць кагосьці, вы можаце скасаваць запрашэнне на ўкладцы **Удзельнікі** старонкі групы. У выпадальным меню справа ад запрашэння (**⋮**) выберыце **Скасаваць запрашэнне**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
