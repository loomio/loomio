  7fe42bee753b558d:
    english: "`/api/b3` is for server-level operations. Use `/api/b2` for user-oriented actions performed as a Loomio user account."
    translation: "`/api/b3` sirve para operaciones del servidor. Usa `/api/b2` para las acciones que se realizan desde una cuenta de usuario de Loomio."
