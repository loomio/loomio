---
navigation_title: Адрес электронной почты
blocks:
  14280ff177b248ab:
    english: "# Send an email to start a thread in your group"
    translation: "# Отправьте письмо, чтобы начать обсуждение в вашей группе"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e3de5524e10b9928:
    english: Your Loomio group has an email address! You can send or forward email to this address to start a thread in the group.
    translation: У вашей группы в Loomio есть адрес электронной почты. Отправьте или перешлите на него письмо, чтобы начать обсуждение в группе.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  85a7436d4a1b4396:
    english: |-
      You can see your group's email address on the group page:
      ![location of the email address on the group page](email_email_button.png)
    translation: |-
      Адрес электронной почты группы указан на её странице:
      ![Расположение адреса электронной почты на странице группы](email_email_button.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e34019bbcf3b319f:
    english: When you send an email to this address, a new thread will be started. The email subject becomes the thread title, the body of the email becomes the description, and any attached files will be attached to the thread.
    translation: Когда вы отправите письмо на этот адрес, начнётся новое обсуждение. Тема письма станет названием обсуждения, текст письма — его описанием, а прикреплённые файлы будут добавлены к обсуждению.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  46a53b8267a61c2f:
    english: The email "From" address is used to find the group member who will be the author of the thread.
    translation: По адресу отправителя в поле «От» Loomio определит участника группы, который станет автором обсуждения.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bd7df6f632af8db1:
    english: "## Preventing unauthorized emails"
    translation: "## Защита от писем посторонних"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a5118468df167ba0:
    english: To ensure that this feature cannot be used by people who are not members of your group, Loomio will require that the "From" address of an incoming email matches the address of someone in the group.
    translation: Чтобы люди вне вашей группы не могли начать обсуждение по электронной почте, Loomio проверяет, совпадает ли адрес в поле «От» с адресом участника группы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f11910ae643c5b47:
    english: If you use multiple email addresses, you can add an alias so Loomio knows about your other email addresses.
    translation: Если вы пользуетесь несколькими адресами электронной почты, добавьте псевдоним для каждого дополнительного адреса.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e3d88a25128322b5:
    english: When the "from" address does not match a member of the group, you will receive a notification asking you to add an alias or reject all further emails from that address.
    translation: Если адрес отправителя не совпадает с адресом участника группы, вы получите уведомление с предложением добавить псевдоним или отклонять все последующие письма с этого адреса.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  890546269cfa56b6:
    english: This means that the first time you send email from an unrecognised address, you will need to add an alias. After that, emails will be accepted immediately.
    translation: Когда вы впервые отправите письмо с неизвестного Loomio адреса, вам потребуется добавить псевдоним. После этого письма с этого адреса будут приниматься сразу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e778a27d6b286135:
    english: "![Location of the approve and reject buttons for an unrecognised email](email_unreleased_emails.png)"
    translation: "![Расположение кнопок подтверждения и отклонения письма с неизвестного адреса](email_unreleased_emails.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
