    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5b8fbf385e691898:
    english: |-
      Start from your Mattermost team in your browser. Then open the Integrations settings page.
      ![](mm1.png)
    translation: |-
      Відкрийте вашу команду Mattermost у браузері. Потім відкрийте сторінку налаштувань «Інтеграції».
      ![](mm1.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  71a08631e70f06c9:
    english: |-
      Click "Incoming Webhooks"
      ![](mm2.png)
    translation: |-
      Натисніть «Вхідні вебхуки»
      ![](mm2.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4f149aa53006b72f:
    english: |-
      Then click  "Add Incoming Webhook"
      ![](mm3.png)
    translation: |-
      Потім натисніть «Додати вхідний вебхук»
      ![](mm3.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d030c8a27b1d2a15:
    english: |-
      Give it a simple name, select the channel for notifications to appear within, and click Save
      ![](mm4.png)
    translation: |-
      Введіть просту назву, виберіть канал для сповіщень і натисніть «Зберегти»
      ![](mm4.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  adc3f2f055883a4f:
    english: |-
      Copy the Webhook URL to your clipboard, you're going to need it the next step.
      ![](mm5.png)
    translation: |-
      Скопіюйте URL вебхука до буфера обміну. Він знадобиться на наступному кроці.
      ![](mm5.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  42fc079c9a2a6885:
    english: Make sure you have your Webhook URL in your clipboard and follow the link below.
    translation: Переконайтеся, що URL вебхука є в буфері обміну, і перейдіть за посиланням нижче.
