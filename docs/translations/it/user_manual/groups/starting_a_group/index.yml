  e8632dbb628c7c7d:
    english: "# Starting a new group"
    translation: "# Creare un nuovo gruppo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2a4a6907d4e2049d:
    english: If you are new to Loomio, you can start a group on a free trial at any time from the [Loomio website](https://www.loomio.com/). If you already use Loomio and would like to start a new group for another organization or purpose, you can do this from the sidebar menu - click on **New group**.
    translation: Se non hai mai usato Loomio, puoi creare un gruppo con una prova gratuita dal [sito web di Loomio](https://www.loomio.com/). Se usi già Loomio e vuoi creare un gruppo per un'altra organizzazione o un altro scopo, apri il menu laterale e seleziona **Nuovo gruppo**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  10e8756c96038e58:
    english: For many organizations, a single Loomio group is sufficient. You can start as many subgroups as you need within the group. See [Subgroups](/en/user_manual/groups/subgroups/) for more info.
    translation: Per molte organizzazioni basta un solo gruppo Loomio. All'interno del gruppo puoi creare tutti i sottogruppi di cui hai bisogno. Per saperne di più, consulta [Sottogruppi](/en/user_manual/groups/subgroups/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ed00dbe94cd53435:
    english: "## Group details"
    translation: "## Dettagli del gruppo"
    status: machine
    provider: codex/gpt-6-sol
