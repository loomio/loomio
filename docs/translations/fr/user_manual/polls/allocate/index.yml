  343675f0497d460a:
    english: "# Allocate"
    translation: "# Allouer"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  46dd27ee2e2fb992:
    english: Allocate, sometimes known as a dot vote, reveals priorities when there are trade-offs. Each participant receives a fixed budget of points and distributes it across the options. Giving more to one option leaves fewer points for the others.
    translation: Le vote à points, appelé « Allouer » dans Loomio, permet de faire ressortir les priorités lorsque des choix s’imposent. Chaque personne dispose d’un nombre fixe de points à répartir entre les options. Plus elle donne de points à une option, moins il lui en reste pour les autres.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c6d05c5ec2a695d2:
    english: "## When to use Allocate"
    translation: "## Quand utiliser Allouer"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f5b2c4377aea5079:
    english: 'Use Allocate when time, money, attention, or another resource is limited. It works well for:'
    translation: 'Utilisez Allouer lorsque le temps, l’argent, l’attention ou une autre ressource est limité. Ce type de vote convient notamment pour :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8e6525da99616946:
    english: |-
      - prioritizing work for the next planning period;
      - dividing a participatory budget between projects;
      - choosing how much agenda time to give several topics;
      - distributing a fixed number of volunteer hours; or
      - identifying which improvements matter most to members.
    translation: |-
      - définir les priorités de travail pour la prochaine période de planification ;
      - répartir un budget participatif entre plusieurs projets ;
      - décider du temps à consacrer à plusieurs sujets lors d’une réunion ;
      - répartir un nombre fixe d’heures de bénévolat ; ou
      - déterminer quelles améliorations comptent le plus pour les membres.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  66b0f13c4811ef63:
    english: The points express relative priority, not an amount that Loomio will automatically assign. Use [Score](/en/user_manual/polls/score/) when every option can receive a high rating without reducing support for another.
    translation: Les points indiquent une priorité relative, pas une quantité que Loomio attribuera automatiquement. Utilisez [Score](/en/user_manual/polls/score/) si chaque option peut recevoir une note élevée sans réduire le soutien accordé aux autres.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '0409e08bd5e80f61':
    english: "## Example: set priorities for an annual strategy review"
    translation: "## Exemple : définir les priorités d’une revue stratégique annuelle"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e274f6e40509e611:
    english: Oatmilk Cooperative is planning its annual strategy review. It asks members which areas should receive the most time and attention during the review. Each member receives ten points to allocate across five areas. This shows the group's relative priorities while requiring participants to make trade-offs.
    translation: La coopérative Oatmilk prépare sa revue stratégique annuelle. Elle demande à ses membres quels domaines devraient recevoir le plus de temps et d’attention pendant cette revue. Chaque membre dispose de dix points à répartir entre cinq domaines. Le résultat montre les priorités relatives du groupe tout en obligeant les personnes à faire des choix.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c74ebb16f872b3c6:
    english: "## Set up the poll"
    translation: "## Configurer le vote"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  906790609aa7eb30:
    english: Describe the decision and what the points represent. Add options at a similar level of scope, then set **Points per person**. In this example, each voter receives ten points to indicate how much review time each strategic area should receive.
    translation: Décrivez la décision à prendre et ce que représentent les points. Ajoutez des options de portée comparable, puis définissez **Points par personne**. Dans cet exemple, chaque personne dispose de dix points pour indiquer le temps à consacrer à l’examen de chaque domaine stratégique.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  67ae025b83fb4781:
    english: A very large budget can create false precision. A useful budget is usually large enough to show differences but small enough to require choices. Make clear whether concentrating all points on one option is acceptable.
    translation: Un nombre de points très élevé peut donner une fausse impression de précision. Choisissez-en assez pour faire apparaître les différences, mais assez peu pour imposer des choix. Précisez s’il est acceptable d’attribuer tous ses points à une seule option.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Voter"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d9a73b9d4e2f8927:
    english: Participants move the sliders to distribute their budget. Loomio shows how many points remain and prevents submission until the allocation is valid.
    translation: Les personnes qui votent déplacent les curseurs pour répartir leurs points. Loomio affiche le nombre de points restants et empêche l’envoi du vote tant que la répartition n’est pas valide.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7b3d616673a01fbb:
    english: In this example, the voter assigns three points each to **Member participation** and **Financial sustainability**, two each to **Environmental impact** and **Staff development**, and none to **Products and services**. A zero does not necessarily mean an area has no value; it means the voter used their limited points elsewhere.
    translation: Dans cet exemple, une personne attribue trois points à **Participation des membres** et à **Viabilité financière**, deux points à **Impact environnemental** et à **Développement du personnel**, et aucun à **Produits et services**. Un zéro ne signifie pas nécessairement qu’un domaine est sans valeur ; il signifie que la personne a utilisé ses points limités ailleurs.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Lire les résultats"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  97147f83eaf22313:
    english: 'The results order options by the total points received. They also show:'
    translation: 'Les options sont classées selon le nombre total de points reçus. Les résultats indiquent aussi :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1d224c0c34145a7f:
    english: |-
      - **% of points**: the option's share of all allocated points;
      - **Points**: the total points allocated;
      - **Mean**: the average among voters who gave the option points; and
      - **Voters**: how many people gave the option at least one point.
    translation: |-
      - **% de points** : la part de l’option dans l’ensemble des points attribués ;
      - **Points** : le nombre total de points attribués ;
      - **Moyenne** : la moyenne parmi les personnes qui ont attribué des points à l’option ; et
      - **Votants** : le nombre de personnes qui ont attribué au moins un point à l’option.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2901008fa326e4f5:
    english: In this example, **Financial sustainability** receives the most points, followed by **Staff development**. Financial sustainability receives points from every voter, suggesting broad agreement that it needs substantial review time. Read the totals alongside the number of voters to distinguish broad priorities from areas strongly supported by fewer people.
    translation: Dans cet exemple, **Viabilité financière** reçoit le plus de points, suivie de **Développement du personnel**. Toutes les personnes qui ont voté ont attribué des points à la viabilité financière, ce qui suggère un large accord sur la nécessité de lui consacrer beaucoup de temps pendant la revue. Comparez les totaux au nombre de votants pour distinguer les priorités largement partagées des domaines fortement soutenus par moins de personnes.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f2c04fbdc54d23e8:
    english: Read the totals together with the number of voters and their reasons. Publish an outcome explaining how the strategy review will be structured; the poll does not assign time automatically.
    translation: Examinez les totaux, le nombre de votants et les raisons qu’ils ont données. Publiez une conclusion expliquant comment la revue stratégique sera organisée ; le vote n’attribue pas automatiquement le temps disponible.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
