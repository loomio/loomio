  3131d6ab6e787458:
    english: Set `B3_API_KEY` to a secret longer than 16 characters.
    translation: A `B3_API_KEY` értékének adj meg egy 16 karakternél hosszabb titkos kulcsot.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
