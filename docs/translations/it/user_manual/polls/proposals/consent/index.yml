    translated_on: '2026-09-29'
  e16bed826124695f:
    english: A Consent proposal asks whether a course of action is safe to try. Participants either consent or raise an objection. An objection identifies a concrete risk or harm that the proposal should address.
    translation: Una proposta di consenso chiede se un'azione si può provare senza rischi eccessivi. I partecipanti esprimono il consenso oppure sollevano un'obiezione. Un'obiezione indica un rischio o un danno concreto che la proposta deve affrontare.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d675dd47ae42c929:
    english: This page explains how to run one Consent proposal. See the [Consent process](/en/guides/making_decisions/consent_process) for the complete workflow, including questions, Sense check, amendments, objections, and outcome.
    translation: Questa pagina spiega come gestire una proposta di consenso. Consulta il [processo di consenso](/en/guides/making_decisions/consent_process) per il percorso completo, che comprende domande, verifica delle opinioni, modifiche, obiezioni e conclusione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7c4c79526b1d437b:
    english: "## When to use Consent"
    translation: "## Quando usare il consenso"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1b99c0443bd1e4c8:
    english: Use Consent when the group needs a workable decision that can proceed unless there is a valid objection. It suits experiments, operational policies, role agreements, and other decisions the group can review after gaining experience.
    translation: Usa il consenso quando il gruppo ha bisogno di una decisione praticabile e può procedere in assenza di obiezioni valide. È adatto a esperimenti, regole operative, accordi sui ruoli e altre decisioni che il gruppo può rivedere dopo aver acquisito esperienza.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  966f3146dc9f61f1:
    english: Consent does not require everyone to prefer the proposal. Define what counts as an objection before voting, and explain how objections will be tested and resolved.
    translation: Il consenso non richiede che tutti preferiscano la proposta. Prima del voto, definisci cosa costituisce un'obiezione e spiega come verranno valutate e risolte le obiezioni.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e6cf2f0ebd4a7f58:
    english: "## Example: start a bottle trial"
    translation: "## Esempio: avviare una prova con bottiglie a rendere"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ad7be5e188748cb3:
    english: Oatmilk Cooperative proposes starting a six-week returnable-bottle trial next month. The trial is limited in scope and includes a review, so the group asks whether it is safe to try.
    translation: La cooperativa Oatmilk propone di avviare il mese prossimo una prova di sei settimane con bottiglie a rendere. La prova ha una portata limitata e prevede una valutazione finale, quindi il gruppo si chiede se sia abbastanza sicura da avviare.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9703f1f9474243af:
    english: "## Set up the proposal"
    translation: "## Prepara la proposta"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6458750b94201df6:
    english: Describe the proposed action, its limits, safeguards, and review point. Keep **Consent** and **Objection** meanings precise, and require a reason for objections so the concern can be understood and addressed.
    translation: Descrivi l'azione proposta, i suoi limiti, le misure di tutela e il momento in cui verrà riesaminata. Definisci con precisione il significato di **Consenso** e **Obiezione** e chiedi di motivare le obiezioni, così il gruppo potrà comprenderle e affrontarle.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Vota"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d98c0e71880c8828:
    english: Participants select **Consent** when the proposal is safe enough to try, even if it is not their preferred plan. They select **Objection** when they can describe a material risk or harm.
    translation: I partecipanti selezionano **Consenso** quando la proposta è abbastanza sicura da provare, anche se non è la soluzione che preferiscono. Selezionano **Obiezione** quando possono descrivere un rischio o un danno significativo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Leggi i risultati"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b0265040032f48e5:
    english: The chart makes objections visible, but the group must examine the reasons. Resolve a valid objection by amending the proposal, adding a safeguard, changing its scope, or deciding not to proceed.
    translation: Il grafico mostra le obiezioni, ma il gruppo deve esaminarne le motivazioni. Per risolvere un'obiezione valida, modifica la proposta, aggiungi una misura di tutela, cambia la portata dell'azione oppure decidi di non procedere.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a87df65569cb3a09:
    english: Publish an outcome that records the agreed action, any safeguards, who is responsible, and when the group will review it.
    translation: Pubblica una conclusione che riporti l'azione concordata, le eventuali misure di tutela, chi ne è responsabile e quando il gruppo la riesaminerà.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
