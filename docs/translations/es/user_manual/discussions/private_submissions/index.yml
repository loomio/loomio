---
navigation_title: Recopilar aportaciones privadas
blocks:
  c4a53a596a037fc0:
    english: "# Collect private submissions"
    translation: "# Recopilar aportaciones privadas"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b24abc6bf93b1c0f:
    english: Use a Closed group to collect private submissions from people who are not members of the group. Each submission becomes a separate discussion that the submitter and the group's review team can use to exchange information, ask questions, and record a decision. Submitters cannot see other private discussions or submissions in the group.
    translation: Usa un grupo Cerrado para recopilar aportaciones privadas de personas que no pertenecen al grupo. Cada aportación se convierte en una discusión independiente donde quien la envió y el equipo de revisión del grupo pueden intercambiar información, hacer preguntas y registrar una decisión. Quienes envían aportaciones no pueden ver las demás discusiones ni aportaciones privadas del grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  feb5105698bca188:
    english: Nominations are a clear use case when candidate details or the list of nominees must remain private during selection. A person can nominate themselves or someone else for an election, appointment, committee, board, or representative role, while a selection panel reviews each nomination in its own discussion.
    translation: Las nominaciones son un ejemplo claro cuando los datos de las candidaturas o la lista de personas nominadas deben permanecer privados durante la selección. Una persona puede nominarse a sí misma o nominar a otra para una elección, un nombramiento o un puesto en un comité, una junta o de representación. Mientras tanto, un comité de selección revisa cada nominación en su propia discusión.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a64597508a4f7f3d:
    english: 'Other suitable purposes where submissions should not be public include:'
    translation: 'También puedes usar este proceso para recopilar aportaciones que no deban ser públicas, como:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e4bd382899a8e7d9:
    english: |-
      - Complaints, safeguarding reports, safety concerns, and incident reports
      - Appeals and requests to reconsider a decision about an individual case
      - Requests for mediation, conflict resolution, or personal support
      - Applications containing personal, financial, or eligibility information, such as hardship grants or scholarships
      - Sealed bids or tender responses that must remain private during assessment
    translation: |-
      - Quejas, informes de protección, problemas de seguridad e informes de incidentes
      - Apelaciones y solicitudes para reconsiderar una decisión sobre un caso individual
      - Solicitudes de mediación, resolución de conflictos o apoyo personal
      - Solicitudes que contienen información personal, económica o sobre requisitos de admisión, como las de ayudas económicas por necesidad o becas
      - Ofertas en sobre cerrado o respuestas a licitaciones que deben permanecer privadas durante la evaluación
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bab86da011a22a2a:
    english: This workflow is private between submitters, but it is not anonymous. Submitters need a user account, and every member of the Closed group can see the submissions. Consider who belongs to the review group before using it for sensitive information.
    translation: Este proceso mantiene las aportaciones privadas entre quienes las envían, pero no es anónimo. Para enviar una aportación se necesita una cuenta de usuario, y todos los miembros del grupo Cerrado pueden verla. Antes de usarlo con información sensible, ten en cuenta quiénes forman parte del grupo de revisión.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b82ae8f3f04d257f:
    english: "## Enable private submissions"
    translation: "## Habilitar las aportaciones privadas"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0cebe3c5801844ce:
    english: You must be an admin of the group or subgroup where you want to collect submissions.
    translation: Debes ser administrador del grupo o subgrupo donde quieres recopilar aportaciones.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  831d833d53a12ece:
    english: |-
      1. Open the group.
      2. Select **Settings** (or **More** and then **Edit group settings**).
      3. Open **Permissions**.
      4. Enable **Non-members can start discussions**.
      5. Save the group settings.
    translation: |-
      1. Abre el grupo.
      2. Selecciona **Configuración ** (o **Más** y después **Editar la configuración del grupo**).
      3. Abre **Permisos**.
      4. Activa **Los no miembros pueden iniciar debates**.
      5. Guarda la configuración del grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f3962a27b1c4ffa8:
    english: "![The Permissions tab in group settings, with Non-members can start discussions highlighted](non_members_can_start_discussions.png)"
    translation: "![La pestaña Permisos de la configuración del grupo, con Los no miembros pueden iniciar debates resaltado](non_members_can_start_discussions.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  99ace15d10e78f33:
    english: This option is available only for **Open** and **Closed** groups. It is hidden for **Secret** groups. If you cannot see it, open **Privacy** in the group settings and change **Group privacy** to **Closed** (recommended for private submissions) or **Open**, then return to **Permissions**.
    translation: Esta opción solo está disponible para los grupos **Abierto** y **Cerrado**. No aparece en los grupos **Secreto **. Si no la ves, abre **Privacidad** en la configuración del grupo y cambia **Privacidad del grupo** a **Cerrado** (recomendado para las aportaciones privadas) o **Abierto**. Después, vuelve a **Permisos**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  449517e6293a3acc:
    english: Enabling this permission does not make the group's discussions public. A non-member can start a new discussion and access that discussion as a guest, but cannot see the group's other private discussions.
    translation: Al activar este permiso, las discusiones del grupo no se hacen públicas. Una persona que no pertenece al grupo puede iniciar una discusión y acceder a ella como invitada, pero no puede ver las demás discusiones privadas del grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  151f68a3f638fb67:
    english: "## Set up a private submission process"
    translation: "## Configurar un proceso de aportaciones privadas"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ae924433d81f5eac:
    english: |-
      1. Create a dedicated subgroup for the submission process and set its privacy to **Closed**. A subgroup keeps the submissions separate from the parent group's other work.
      2. Add the selection panel or other people responsible for reviewing submissions as members of the subgroup. Every subgroup member can see every submission, so add only people who should have that access.
      3. Create a [discussion template](/en/user_manual/discussions/templates) in the subgroup. Include the questions and information submitters should provide. You can create different discussion templates for different kinds of submissions.
      4. If submitters should not request subgroup membership, set membership to **Invitation only**.
      5. [Enable private submissions](#enable-private-submissions) in the subgroup's permissions.
      6. Test the process with an account that is not a member of the subgroup.
      7. Share the subgroup page with prospective submitters. They must sign in to their user account before making a submission.
    translation: |-
      1. Crea un subgrupo dedicado al proceso de aportaciones y configura su privacidad como **Cerrado**. Así mantendrás las aportaciones separadas del resto del trabajo del grupo principal.
      2. Añade al comité de selección o a las demás personas encargadas de revisar las aportaciones como miembros del subgrupo. Todos los miembros del subgrupo pueden ver todas las aportaciones, así que añade solo a quienes deban tener ese acceso.
      3. Crea una [plantilla de discusión](/en/user_manual/discussions/templates) en el subgrupo. Incluye las preguntas y la información que deben proporcionar quienes envíen aportaciones. Puedes crear distintas plantillas de discusión para distintos tipos de aportaciones.
      4. Si quienes envían aportaciones no deben solicitar unirse al subgrupo, configura la membresía como **Solo por invitación**.
      5. [Habilita las aportaciones privadas](#enable-private-submissions) en los permisos del subgrupo.
      6. Prueba el proceso con una cuenta que no pertenezca al subgrupo.
      7. Comparte la página del subgrupo con las personas que puedan querer enviar una aportación. Deben iniciar sesión en su cuenta antes de hacerlo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3acec1b4a6724a65:
    english: "## Make a submission"
    translation: "## Enviar una aportación"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  58f96f48b6aacf65:
    english: The submitter opens the subgroup and selects **Start discussion**. Loomio shows the subgroup's available discussion templates. The submitter selects the relevant discussion template, completes its questions, and starts the discussion.
    translation: La persona que envía la aportación abre el subgrupo y selecciona **Iniciar discusión**. Loomio muestra las plantillas de discusión disponibles en el subgrupo. La persona elige la plantilla adecuada, responde a sus preguntas e inicia la discusión.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5a65043771edeb44:
    english: The discussion belongs to the subgroup, but the submitter does not become a subgroup member. Loomio adds them as a guest of their discussion thread, enabling them to see and participate in the discussion with the panel or review team. They cannot see other private discussions or submissions in the subgroup.
    translation: La discusión pertenece al subgrupo, pero quien envía la aportación no se convierte en miembro del subgrupo. Loomio añade a esa persona como invitada al hilo de la discusión para que pueda verlo y participar con el comité o el equipo de revisión. No puede ver las demás discusiones ni aportaciones privadas del subgrupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9338fd073b26dafc:
    english: "## Review submissions"
    translation: "## Revisar las aportaciones"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  50e33fa0f0868cf5:
    english: Subgroup members can see every submission discussion in the subgroup. They can ask follow-up questions and use comments, polls, or other discussion tools to complete their review.
    translation: Los miembros del subgrupo pueden ver todas las discusiones creadas para las aportaciones. Pueden hacer preguntas de seguimiento y usar comentarios, sondeos u otras herramientas de discusión para completar la revisión.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  537b76c6f85cc575:
    english: If another person needs to provide information, a subgroup member with permission can invite them to the submission discussion. For example, when a nominator submits a nomination, the subgroup can invite the nominee to the thread if their participation is required. The invited person joins as a guest without gaining access to the subgroup's other private discussions.
    translation: Si otra persona debe proporcionar información, un miembro del subgrupo que tenga permiso puede invitarla a la discusión de la aportación. Por ejemplo, si alguien presenta una nominación, el subgrupo puede invitar al hilo a la persona nominada cuando sea necesaria su participación. La persona invitada se incorpora como invitada, sin obtener acceso a las demás discusiones privadas del subgrupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1fb7da309186b19e:
    english: Each submitter can see their own submission but cannot see the subgroup's other private discussions or submissions. Disable **Non-members can start discussions** when submissions close. Existing discussions and guest access are unchanged.
    translation: Cada persona puede ver la aportación que envió, pero no las demás discusiones ni aportaciones privadas del subgrupo. Desactiva **Los no miembros pueden iniciar debates** cuando cierre el plazo de recepción. Las discusiones existentes y el acceso de las personas invitadas no cambian.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
