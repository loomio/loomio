  0b8bb762e37fb8c3:
    english: |-
      To create a poll or proposal and only invite the delegates, use the "Selected people only" poll setting.
      ![Selected people only setting when starting a proposal](poll_invited_people_only.png)
      Then when inviting people to vote you will see the "Delegates of group-name" option.
      ![Delegates of Oatmilk Cooperative option in the invite-to-vote form](poll_invite_delegates_group.png)
    translation: |-
      Para criar uma enquete ou proposta e convidar apenas os delegados, use a configuração **Apenas para pessoas selecionadas**.
      ![Configuração Apenas para pessoas selecionadas ao iniciar uma proposta](poll_invited_people_only.png)
      Ao convidar pessoas para votar, você verá a opção **Delegados de nome-do-grupo**.
      ![Opção Delegados da Cooperativa de Leite de Aveia no formulário de convite para votar](poll_invite_delegates_group.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e895a07efeaf4dcf:
    english: |-
      You can see a list of who the delegates are from the members tab of your group page. Use the filter menu and select "Delegates".
      ![Delegates option in the members filter](members_list_delegates.png)
    translation: |-
      Para ver a lista de delegados, abra a aba de membros na página do seu grupo. No menu de filtros, selecione **Delegados**.
      ![Opção Delegados no filtro de membros](members_list_delegates.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
