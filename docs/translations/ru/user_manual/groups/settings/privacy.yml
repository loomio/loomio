---
navigation_title: Конфиденциальность
blocks:
  946f29d3bdb2e2af:
    english: "# Group privacy"
    translation: "# Конфиденциальность группы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6a2fbb3e7cecad6e:
    english: Privacy controls who can find a group and who can read its content. Open **Edit group settings** from the group page, then select **Privacy**.
    translation: Настройки конфиденциальности определяют, кто может найти группу и читать её материалы. На странице группы откройте **Редактировать настройки группы**, затем выберите **Конфиденциальность**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bf79bc420fc36377:
    english: "![Group privacy settings](group_privacy_settings.png#width-90)"
    translation: "![Настройки конфиденциальности группы](group_privacy_settings.png#width-90)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4d275c75fe1a2c77:
    english: Changing privacy can expose or hide existing group content, not only content created afterward. Choose the most restrictive setting that still supports the group's purpose.
    translation: При изменении настроек конфиденциальности уже опубликованные материалы группы могут стать доступными или скрытыми. Выберите самый строгий режим, который подходит для целей группы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7510b0e8a0fcf7b3:
    english: "## Open"
    translation: "## Открыто"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f202c6fba754adaa:
    english: Open groups are public spaces. Anyone can find the group and read its discussions, polls, and files. The member list remains visible only to members.
    translation: Открытые группы доступны всем. Любой может найти группу и читать её обсуждения, опросы и файлы. Список участников виден только участникам.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c8d2b41a601ed65e:
    english: Open groups can allow people to join immediately, require approval, or remain invitation only.
    translation: В открытой группе можно разрешить вступление без одобрения, принимать заявки на вступление или вступать только по приглашению.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f07a1c59f30e5fea:
    english: "### Follow an Open group"
    translation: "### Как следить за открытой группой"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d6f9ee2eb742720e:
    english: People can stay up to date with an Open group without joining. Following adds unread group activity to their catch-up email so they can review it in their own time. Followers do not become members, receive member voting rights, or receive immediate notifications just because they follow the group.
    translation: За новостями открытой группы можно следить, не вступая в неё. Непрочитанные события группы будут добавлены в письмо со сводкой, чтобы их можно было просмотреть в удобное время. Те, кто следит за группой, не становятся её участниками, не получают право голоса как участники и не получают немедленных уведомлений только потому, что следят за ней.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  17cb84d9141c9728:
    english: Turn on **Follow updates** on the group page to include its unread discussions, comments, polls, and other thread activity in your catch-up. Turn the setting off to stop including the group.
    translation: На странице группы включите **Следите за обновлениями**, чтобы непрочитанные обсуждения, комментарии, опросы и другие события в темах группы попадали в ваше письмо со сводкой. Чтобы исключить группу из сводки, отключите эту настройку.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b0c06651e8c0df2b:
    english: "![Follow updates on an Open group](group_follow_updates.png)"
    translation: "![Настройка «Следите за обновлениями» в открытой группе](group_follow_updates.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c5becc4d01b10f3:
    english: "## Closed"
    translation: "## Закрыто"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eaf6878c89438b53:
    english: Anyone can find a Closed group and read its name and description. Discussions, polls, files, and the member list are private to members and invited guests.
    translation: Любой может найти закрытую группу и прочитать её название и описание. Обсуждения, опросы, файлы и список участников доступны только участникам и приглашённым гостям.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ab7851d3b88d4e27:
    english: Closed groups can let people request membership or remain invitation only. They cannot let people join immediately without approval.
    translation: В закрытой группе можно разрешить подавать заявки на вступление или вступать только по приглашению. Вступить без одобрения нельзя.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e2f094fc6e490216:
    english: A Closed subgroup of a parent group can optionally allow members of the parent group to read its discussions without joining the subgroup.
    translation: В закрытой подгруппе можно разрешить участникам родительской группы читать обсуждения, не вступая в подгруппу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9c21e144af9492a6:
    english: "## Secret"
    translation: "## Выделить"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6a9871bdd7fde747:
    english: Secret groups and their content are visible only to people who have been invited or added. Membership is invitation only. Secret groups do not appear in the public group directory.
    translation: Скрытые группы и их материалы видны только приглашённым или добавленным людям. Вступить в такую группу можно только по приглашению. Скрытые группы не отображаются в общедоступном каталоге групп.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  405ac2846a65b06c:
    english: "## How people join"
    translation: "## Как вступить в группу"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c7aebb687bbffbf:
    english: 'Privacy determines which joining options are available:'
    translation: 'Доступные способы вступления зависят от настроек конфиденциальности:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a6a7608fe4510b67:
    english: |-
      | Group privacy | Available joining options |
      | --- | --- |
      | **Open** | Anyone can join, request approval, or invitation only |
      | **Closed** | Request approval or invitation only |
      | **Secret** | Invitation only |
    translation: |-
      | Конфиденциальность группы | Доступные способы вступления |
      | --- | --- |
      | **Открыто** | Без одобрения, по заявке или только по приглашению |
      | **Закрыто** | По заявке или только по приглашению |
      | **Выделить** | Только по приглашению |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  473a620db15dff75:
    english: When approval is required, people select **Join group**, answer the group's joining prompt, and send a request to join. See [Inviting people](/en/user_manual/groups/inviting_people#request-to-join-group) for instructions on configuring the prompt, reviewing requests, and inviting people directly.
    translation: Если для вступления требуется одобрение, человек выбирает **Вступить в группу**, отвечает на вопрос группы и отправляет заявку. О том, как настроить вопрос, рассматривать заявки и приглашать людей напрямую, читайте в разделе [Приглашение людей](/en/user_manual/groups/inviting_people#request-to-join-group).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4c02de0d4580f7e6:
    english: "## Group directory"
    translation: "## Каталог групп"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2dc848ec1af0064e:
    english: Open and Closed parent groups can be listed in the public group directory so people can discover them. Directory listing does not change who can read group content or become a member. Subgroups and Secret groups cannot be listed.
    translation: Открытые и закрытые родительские группы можно добавить в общедоступный каталог групп, чтобы люди могли их найти. Размещение в каталоге не меняет того, кто может читать материалы группы или стать её участником. Подгруппы и скрытые группы нельзя добавить в каталог.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
