  d661e5fc8cc1b460:
    english: "# Group permissions"
    translation: "# Groepstoestemmingen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  712830f14602c6c7:
    english: The permissions tab controls which group operations are available to ordinary members and, for non-secret groups, to non-members. Open **Edit group settings** from the group page, then select **Permissions**.
    translation: Op het tabblad met toestemmingen bepaal je welke acties gewone leden kunnen uitvoeren en, bij groepen die niet geheim zijn, welke acties niet-leden kunnen uitvoeren. Open **Bewerk groepsinstellingen** op de groepspagina en kies **Toestemmingen**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b71bf8cce1cb369c:
    english: "![Group permission settings](group_group_settings_permissions.png)"
    translation: "![Instellingen voor groepstoestemmingen](group_group_settings_permissions.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  88e5fcd302a53620:
    english: Administrators retain the ability to manage the group. Enabling a member permission extends that particular action to ordinary members; it does not make them administrators.
    translation: Beheerders kunnen de groep blijven beheren. Als je een toestemming voor leden inschakelt, kunnen gewone leden die specifieke actie ook uitvoeren. Ze worden daardoor geen beheerder.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5b2b9af0f68b7a57:
    english: 'Permissions include whether members can:'
    translation: 'Met de toestemmingen bepaal je of leden:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8377b499d13690c0:
    english: |-
      - add members or invite guests;
      - send announcements;
      - create subgroups;
      - start and manage discussions;
      - create and manage tags;
      - edit or delete comments where the setting permits;
      - start proposals and polls; and
      - create discussion and poll templates.
    translation: |-
      - leden kunnen toevoegen of gasten kunnen uitnodigen;
      - aankondigingen kunnen versturen;
      - subgroepen kunnen maken;
      - discussies kunnen starten en beheren;
      - labels kunnen maken en beheren;
      - opmerkingen kunnen bewerken of verwijderen als de instelling dat toestaat;
      - voorstellen en peilingen kunnen starten; en
      - sjablonen voor discussies en peilingen kunnen maken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  87166abe7eea1ab3:
    english: For groups that are not secret, administrators can separately allow non-members to start discussions. A non-member who starts a discussion becomes a guest of that discussion but does not gain access to other private discussions or become a group member.
    translation: Bij groepen die niet geheim zijn, kunnen beheerders niet-leden afzonderlijk toestemming geven om discussies te starten. Een niet-lid dat een discussie start, wordt gast van die discussie. Die persoon krijgt geen toegang tot andere privédiscussies en wordt geen lid van de groep.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3d01d10a97636b1e:
    english: The **Admins can edit members' comments** setting gives administrators an exceptional moderation capability. Enable it only when the group has agreed that administrators should be able to alter member-authored content.
    translation: Met **Beheerders kunnen de opmerkingen van leden bewerken** geef je beheerders een bijzondere mogelijkheid om inhoud te modereren. Schakel dit alleen in als de groep ermee heeft ingestemd dat beheerders inhoud van leden mogen wijzigen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b0af0135752a461f:
    english: Review permissions when the group's purpose, membership, or moderation responsibilities change. Give each role only the capabilities it needs.
    translation: Controleer de toestemmingen wanneer het doel van de groep, het ledenbestand of de verantwoordelijkheid voor moderatie verandert. Geef elke rol alleen de mogelijkheden die daarvoor nodig zijn.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
