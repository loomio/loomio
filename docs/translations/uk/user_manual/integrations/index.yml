  37a981ffe4539815:
    english: "## Choose where work belongs"
    translation: "## Виберіть інструмент для кожного виду роботи"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  828de256c39d112c:
    english: Loomio complements chat, shared documents, and task-management tools rather than replacing every kind of work.
    translation: Loomio доповнює чати, спільні документи та інструменти для керування завданнями. Кожен із цих інструментів підходить для свого виду роботи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ad42655c9ef79337:
    english: |-
      | Work | Suggested tool |
      |---|---|
      | Quick questions, social conversation, and timely updates | Chat |
      | Collaborative editing of a living document | Shared document |
      | Assigning and tracking tasks | Project or task-management tool |
      | Important topic-based discussion, broad participation, decisions, and outcomes | Loomio |
    translation: |-
      | Робота | Рекомендований інструмент |
      |---|---|
      | Короткі запитання, невимушене спілкування та оперативні повідомлення | Чат |
      | Спільне редагування документа, який постійно оновлюється | Спільний документ |
      | Призначення завдань і відстеження їх виконання | Інструмент для керування проєктами або завданнями |
      | Обговорення важливих тем, участь широкого кола людей, ухвалення рішень і підбиття підсумків | Loomio |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  40e853f5116f28eb:
    english: Put work in Loomio when people need time to consider a topic, when everyone affected should have a meaningful opportunity to participate, or when the group will need to find the discussion and decision later. Link to the relevant document or task from the Loomio discussion so its context remains easy to find.
    translation: Використовуйте Loomio, коли людям потрібен час, щоб обміркувати тему, коли всі, кого вона стосується, повинні мати можливість долучитися, або коли групі потрібно буде згодом знайти обговорення та рішення. Додайте до обговорення в Loomio посилання на відповідний документ або завдання, щоб потрібний контекст було легко знайти.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
