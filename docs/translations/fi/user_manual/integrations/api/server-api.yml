  5d1d8b72689c1c84:
    english: Use these settings when another system manages Loomio profile fields.
    translation: Käytä näitä asetuksia, kun toinen järjestelmä hallinnoi Loomion profiilitietoja.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  83b6503850a3581c:
    english: "`LOOMIO_DISABLE_EDIT_USER_PROFILE=1` prevents users from editing these fields themselves:"
    translation: "`LOOMIO_DISABLE_EDIT_USER_PROFILE=1` estää käyttäjiä muokkaamasta itse seuraavia kenttiä:"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b40beb01122e6c22:
    english: |-
      | Field | Notes |
      | --- | --- |
      | `name` | Managed by external sync |
      | `username` | Managed by external sync |
      | `email` | Managed by external sync |
      | `avatar_kind` / `uploaded_avatar` | Managed by external sync |
    translation: |-
      | Kenttä | Huomautukset |
      | --- | --- |
      | `name` | Hallinnoidaan ulkoisella synkronoinnilla |
      | `username` | Hallinnoidaan ulkoisella synkronoinnilla |
      | `email` | Hallinnoidaan ulkoisella synkronoinnilla |
      | `avatar_kind` / `uploaded_avatar` | Hallinnoidaan ulkoisella synkronoinnilla |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d914243a6d80944b:
    english: Users can still edit Loomio-local fields such as `short_bio` and `location`.
    translation: Käyttäjät voivat edelleen muokata Loomiossa hallinnoitavia kenttiä, kuten `short_bio` ja `location`.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d2d40191ec060f7e:
    english: "`LOOMIO_SSO_UPDATE_USER_PROFILE_ON_LOGIN=1` updates `name` and `email` from SSO login data. Leave it commented out or unset when an external sync script should be the only source of those updates."
    translation: "`LOOMIO_SSO_UPDATE_USER_PROFILE_ON_LOGIN=1` päivittää kentät `name` ja `email` SSO-kirjautumisen tiedoista. Jätä asetus kommentoiduksi tai määrittämättä, jos vain ulkoisen synkronointiskriptin tulee päivittää nämä tiedot."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f19f0588ef52b814:
    english: "`LOOMIO_SSO_FORCE_USER_ATTRS` still works for existing installs. It both disables user edits and updates `name` and `email` on SSO login."
    translation: "`LOOMIO_SSO_FORCE_USER_ATTRS` toimii edelleen nykyisissä asennuksissa. Se estää käyttäjiä muokkaamasta tietojaan ja päivittää kentät `name` ja `email` SSO-kirjautumisen yhteydessä."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
