navigation_title: ブックマーク
blocks:
  4f81ad2ed2c971a4:
    english: "# Bookmarks"
    translation: "# ブックマーク"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5d590d1d8ab9b956:
    english: |-
      Bookmarks are a personal list of Loomio items you want to return to. Your
      bookmarks are visible only to you and saving an item does not notify anyone
      else.
    translation: |-
      ブックマークは、後で見返したい Loomio の項目を保存する個人用の一覧です。
      保存した項目は自分にしか表示されず、ブックマークに追加してもほかの人には
      通知されません。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aac40737df991d52:
    english: 'You can bookmark:'
    translation: 次の項目をブックマークできます。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0f6c7e4161c72c18:
    english: |-
      - discussions
      - comments
      - proposals and polls
      - votes
      - outcomes
    translation: |-
      - 議論
      - コメント
      - 提案とアンケート
      - 投票
      - 結論
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fc91d7d6d32e590b:
    english: "## Save a bookmark"
    translation: "## ブックマークを保存する"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  daec09886eecd058:
    english: |-
      Open the action menu for the item and select **Save bookmark**. The action menu
      is usually shown as three dots. For a discussion, use the action menu near the
      discussion title; for a comment, vote, proposal, poll, or outcome, use the menu
      on that item.
    translation: |-
      項目の操作メニューを開き、**ブックマークを保存**を選択します。操作メニューは
      通常、3つの点で表示されます。議論の場合はタイトルの近くにある操作メニューを
      使います。コメント、投票、提案、アンケート、結論の場合は、それぞれの項目にある
      メニューを使います。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  395a4c119e77f34b:
    english: "## View your bookmarks"
    translation: "## ブックマークを表示する"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a5e09c422c753df7:
    english: |-
      Open the sidebar and select **Bookmarks**. The number beside the link shows how
      many bookmarks you have saved.
    translation: |-
      サイドバーを開き、**ブックマーク**を選択します。リンクの横の数字は、
      保存したブックマークの数を示します。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7c21b03875c08b8e:
    english: |-
      The Bookmarks page lists your most recently saved items first. Each row shows
      the kind of item and its author. Select a row to return to the bookmarked item.
    translation: |-
      ブックマークのページでは、最近保存した項目から順に表示されます。各行には
      項目の種類と投稿者が表示されます。行を選択すると、その項目に移動できます。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  644d774a0d045214:
    english: "## Remove a bookmark"
    translation: "## ブックマークを削除する"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c2480aa6235675ba:
    english: |-
      On the Bookmarks page, select the remove-bookmark button at the end of a row.
      You can also open the bookmarked item's action menu and select **Remove
      bookmark**.
    translation: |-
      ブックマークのページで、行の末尾にあるブックマークの削除ボタンを選択します。
      ブックマークした項目の操作メニューを開き、**ブックマークを削除**を選択することも
      できます。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6c20d47950313409:
    english: |-
      Removing a bookmark affects only your personal list. You can save the item
      again later.
    translation: |-
      ブックマークを削除しても、自分の一覧から取り除かれるだけです。その項目は
      後で再び保存できます。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
