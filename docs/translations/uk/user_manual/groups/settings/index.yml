    english: "[Group privacy](/en/user_manual/groups/settings/privacy) covers who can find the group, who can read its content, how people join, directory listing, and following an Open group."
    translation: У розділі [Конфіденційність групи](/en/user_manual/groups/settings/privacy) можна визначити, хто може знайти групу й читати її вміст, як люди приєднуються до неї, чи відображається вона в каталозі та чи можна стежити за відкритою групою.
