  7fe42bee753b558d:
    english: "`/api/b3` is for server-level operations. Use `/api/b2` for user-oriented actions performed as a Loomio user account."
    translation: "`/api/b3` is bedoeld voor bewerkingen op serverniveau. Gebruik `/api/b2` voor acties die je met een Loomio-gebruikersaccount uitvoert."
