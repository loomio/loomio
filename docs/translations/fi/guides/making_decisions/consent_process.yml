  ab509ea088e16a0d:
    english: |-
      Objections should meet this criteria to be valid:
      - Explicit: *I can make a reasoned case*
      - Impersonal: *It's not just a personal preference*
      - Evidenced: *Not predictive, based on experience*
      - Not 'safe to fail': *It's not that I have a 'better idea'*
    translation: |-
      Jotta vastalause on perusteltu, sen tulee täyttää nämä ehdot:
      - Selkeä: *Pystyn perustelemaan vastalauseeni*
      - Ei henkilökohtainen: *Kyse ei ole vain omasta mieltymyksestäni*
      - Näyttöön perustuva: *Vastalause perustuu kokemukseen eikä ennusteeseen*
      - Kokeileminen ei ole turvallista: *Kyse ei ole siitä, että minulla olisi parempi idea*
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
