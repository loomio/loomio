  1d390c0c4f4cea4a:
    english: Category tags make it easy to find threads and polls about a particular type of work or topic.
    translation: As tags de categoria ajudam você a encontrar discussões e enquetes sobre um tipo de trabalho ou assunto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  572adf8961fc1178:
    english: |-
      Tags belong to the whole organization. A tag used in a parent group is the
      same tag in its subgroups, making it possible to organize related work across
      the organization. Loomio displays tag names alphabetically and shows their
      colors as dots beside the names.
    translation: |-
      As tags pertencem à organização inteira. Uma tag usada no grupo principal é a
      mesma em seus subgrupos. Assim, você pode organizar trabalhos relacionados em
      toda a organização. O Loomio exibe os nomes das tags em ordem alfabética e
      mostra suas cores como pontos ao lado dos nomes.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b5340bcbf37095dc:
    english: |-
      On your group page, click **Tags** above the thread list to see the tags used in
      the current group. Select a tag to show only threads with that tag. Use the
      filter textbox to search a long list, or select **Show more** to include all
      tags in the organization. Select **Show fewer** to return to the current
      group's tags.
    translation: |-
      Na página do seu grupo, clique em **Tags** acima da lista de discussões para ver as tags usadas
      no grupo atual. Selecione uma tag para mostrar apenas as discussões com essa tag. Use o
      campo de filtro para pesquisar em uma lista longa ou selecione **Mostrar mais** para incluir todas as
      tags da organização. Selecione **Mostrar menos** para voltar às tags do
      grupo atual.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9de81b9a795d066d:
    english: "## Apply tags"
    translation: "## Aplicar tags"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bf284f7568360b53:
    english: Members who can edit a thread or poll can apply tags to it.
    translation: Membros que podem editar uma discussão ou enquete também podem aplicar tags a ela.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  58488fe368513138:
    english: When you start a thread or poll, click the **Tags** field and select one or more tags.
    translation: Ao iniciar uma discussão ou enquete, clique no campo **Tags** e selecione uma ou mais tags.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e060934a2853a35a:
    english: Start typing to filter the list. Select a tag again, or click the × on its chip, to remove it.
    translation: Comece a digitar para filtrar a lista. Para remover uma tag, selecione-a novamente ou clique no × ao lado de seu nome.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9f5e48b7e520d1a0:
    english: "## Create tags"
    translation: "## Criar tags"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  efa789e9365b2ab2:
    english: |-
      Parent-group admins can always create tags for the parent group and its
      subgroups. Subgroup admins can create tags while tagging content in their
      subgroup. The **Members can create tags** group permission, enabled by default,
      allows other members who can tag a thread or poll to create new tag names. If
      the permission is disabled, members can still apply existing tags.
    translation: |-
      Administradores do grupo principal sempre podem criar tags para ele e seus
      subgrupos. Administradores de subgrupos podem criar tags ao marcar conteúdo em seus
      subgrupos. A permissão **Os membros podem criar etiquetas.**, ativada por padrão,
      permite que outros membros que podem marcar uma discussão ou enquete criem novas tags. Se
      a permissão estiver desativada, os membros ainda poderão aplicar tags existentes.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7e06376f3431ad2f:
    english: To create a tag while starting a thread or poll, type its name in the **Tags** field and press Enter.
    translation: Para criar uma tag ao iniciar uma discussão ou enquete, digite o nome dela no campo **Tags** e pressione Enter.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
