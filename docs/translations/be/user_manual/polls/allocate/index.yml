---
navigation_title: Размеркаванне балаў
blocks:
  343675f0497d460a:
    english: "# Allocate"
    translation: "# Размеркаванне балаў"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  46dd27ee2e2fb992:
    english: Allocate, sometimes known as a dot vote, reveals priorities when there are trade-offs. Each participant receives a fixed budget of points and distributes it across the options. Giving more to one option leaves fewer points for the others.
    translation: Размеркаванне балаў, якое часам называюць галасаваннем кропкамі, дапамагае вызначыць прыярытэты, калі трэба рабіць выбар. Кожны ўдзельнік атрымлівае фіксаваную колькасць балаў і размяркоўвае іх паміж варыянтамі. Чым больш балаў атрымае адзін варыянт, тым менш застанецца для іншых.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c6d05c5ec2a695d2:
    english: "## When to use Allocate"
    translation: "## Калі выкарыстоўваць размеркаванне балаў"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f5b2c4377aea5079:
    english: 'Use Allocate when time, money, attention, or another resource is limited. It works well for:'
    translation: 'Выкарыстоўвайце размеркаванне балаў, калі час, грошы, увага або іншы рэсурс абмежаваныя. Яно падыходзіць, каб:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8e6525da99616946:
    english: |-
      - prioritizing work for the next planning period;
      - dividing a participatory budget between projects;
      - choosing how much agenda time to give several topics;
      - distributing a fixed number of volunteer hours; or
      - identifying which improvements matter most to members.
    translation: |-
      - вызначыць прыярытэты працы на наступны перыяд планавання;
      - размеркаваць бюджэт з удзелам супольнасці паміж праектамі;
      - вырашыць, колькі часу ў парадку дня адвесці розным тэмам;
      - размеркаваць фіксаваную колькасць гадзін валанцёрскай працы; або
      - высветліць, якія паляпшэнні найбольш важныя для ўдзельнікаў.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  66b0f13c4811ef63:
    english: The points express relative priority, not an amount that Loomio will automatically assign. Use [Score](/en/user_manual/polls/score/) when every option can receive a high rating without reducing support for another.
    translation: Балы паказваюць адносны прыярытэт, а не колькасць рэсурсу, якую Loomio аўтаматычна размяркуе. Выкарыстоўвайце [Ацэнку](/en/user_manual/polls/score/), калі кожны варыянт можа атрымаць высокую ацэнку без зніжэння падтрымкі іншых.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '0409e08bd5e80f61':
    english: "## Example: set priorities for an annual strategy review"
    translation: "## Прыклад: вызначэнне прыярытэтаў для штогадовага перагляду стратэгіі"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e274f6e40509e611:
    english: Oatmilk Cooperative is planning its annual strategy review. It asks members which areas should receive the most time and attention during the review. Each member receives ten points to allocate across five areas. This shows the group's relative priorities while requiring participants to make trade-offs.
    translation: Кааператыў «Аўсянае малако» плануе штогадовы перагляд стратэгіі. Ён пытаецца ва ўдзельнікаў, якім напрамкам варта прысвяціць найбольш часу і ўвагі. Кожны ўдзельнік атрымлівае дзесяць балаў, каб размеркаваць іх паміж пяццю напрамкамі. Так група бачыць свае адносныя прыярытэты, а ўдзельнікам даводзіцца рабіць выбар.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c74ebb16f872b3c6:
    english: "## Set up the poll"
    translation: "## Наладзьце апытанне"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  906790609aa7eb30:
    english: Describe the decision and what the points represent. Add options at a similar level of scope, then set **Points per person**. In this example, each voter receives ten points to indicate how much review time each strategic area should receive.
    translation: Апішыце рашэнне і патлумачце, што азначаюць балы. Дадайце варыянты супастаўнага маштабу, а затым задайце **Балы на чалавека**. У гэтым прыкладзе кожны выбаршчык атрымлівае дзесяць балаў, каб паказаць, колькі часу пры пераглядзе варта прысвяціць кожнаму стратэгічнаму напрамку.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  67ae025b83fb4781:
    english: A very large budget can create false precision. A useful budget is usually large enough to show differences but small enough to require choices. Make clear whether concentrating all points on one option is acceptable.
    translation: Занадта вялікая колькасць балаў можа ствараць ілюзію дакладнасці. Звычайна балаў павінна хапаць, каб паказаць адрозненні паміж варыянтамі, але іх колькасць мусіць вымагаць выбару. Удакладніце, ці можна аддаць усе балы аднаму варыянту.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Прагаласуйце"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d9a73b9d4e2f8927:
    english: Participants move the sliders to distribute their budget. Loomio shows how many points remain and prevents submission until the allocation is valid.
    translation: Удзельнікі перамяшчаюць паўзункі, каб размеркаваць свае балы. Loomio паказвае, колькі балаў засталося, і не дазваляе адправіць голас, пакуль балы не будуць размеркаваныя належным чынам.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7b3d616673a01fbb:
    english: In this example, the voter assigns three points each to **Member participation** and **Financial sustainability**, two each to **Environmental impact** and **Staff development**, and none to **Products and services**. A zero does not necessarily mean an area has no value; it means the voter used their limited points elsewhere.
    translation: 'У гэтым прыкладзе па тры балы аддадзена варыянтам **Удзел удзельнікаў** і **Фінансавая ўстойлівасць**, па два — варыянтам **Уплыў на навакольнае асяроддзе** і **Развіццё супрацоўнікаў**. Варыянт **Прадукты і паслугі** не атрымаў балаў. Нуль не абавязкова азначае, што напрамак не мае значэння: выбаршчыкі маглі выкарыстаць абмежаваную колькасць балаў на іншыя варыянты.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Праглядзіце вынікі"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  97147f83eaf22313:
    english: 'The results order options by the total points received. They also show:'
    translation: 'У выніках варыянты ўпарадкаваныя паводле агульнай колькасці атрыманых балаў. Таксама паказваюцца:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1d224c0c34145a7f:
    english: |-
      - **% of points**: the option's share of all allocated points;
      - **Points**: the total points allocated;
      - **Mean**: the average among voters who gave the option points; and
      - **Voters**: how many people gave the option at least one point.
    translation: |-
      - **% балаў**: доля варыянта сярод усіх размеркаваных балаў;
      - **Ачкі**: агульная колькасць балаў, аддадзеных варыянту;
      - **Сярэдняе**: сярэдняя колькасць балаў сярод выбаршчыкаў, якія аддалі балы гэтаму варыянту; і
      - **Выбаршчыкі**: колькасць людзей, якія аддалі варыянту прынамсі адзін бал.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2901008fa326e4f5:
    english: In this example, **Financial sustainability** receives the most points, followed by **Staff development**. Financial sustainability receives points from every voter, suggesting broad agreement that it needs substantial review time. Read the totals alongside the number of voters to distinguish broad priorities from areas strongly supported by fewer people.
    translation: У гэтым прыкладзе найбольш балаў атрымала **Фінансавая ўстойлівасць**, за ёй ідзе **Развіццё супрацоўнікаў**. Фінансавай устойлівасці аддалі балы ўсе выбаршчыкі. Гэта можа сведчыць пра шырокую згоду, што ёй трэба прысвяціць значны час пры пераглядзе. Параўноўвайце агульную колькасць балаў з колькасцю выбаршчыкаў, каб адрозніваць шырокія прыярытэты ад напрамкаў, якія моцна падтрымлівае меншая колькасць людзей.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f2c04fbdc54d23e8:
    english: Read the totals together with the number of voters and their reasons. Publish an outcome explaining how the strategy review will be structured; the poll does not assign time automatically.
    translation: 'Разглядайце агульную колькасць балаў разам з колькасцю выбаршчыкаў і іх довадамі. Апублікуйце выснову з тлумачэннем таго, як будзе арганізаваны перагляд стратэгіі: апытанне не размяркоўвае час аўтаматычна.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
