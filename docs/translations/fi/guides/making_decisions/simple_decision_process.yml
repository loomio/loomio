---
navigation_title: Yksinkertainen päätöksentekoprosessi
blocks:
  84ddd86a61d09414:
    english: "# Simple decision process"
    translation: "# Yksinkertainen päätöksentekoprosessi"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2e868ae6bc4a493b:
    english: This guide describes an end-to-end process using a discussion, Sense check, final proposal, and outcome. For help with the fields and response options of one proposal, see [Proposals](/en/user_manual/polls/proposals/).
    translation: Tässä oppaassa käydään läpi koko päätöksentekoprosessi keskustelusta aistitarkistukseen, lopulliseen ehdotukseen ja tulokseen. Jos tarvitset apua yksittäisen ehdotuksen kenttien ja vastausvaihtoehtojen kanssa, katso [Ehdotukset](/en/user_manual/polls/proposals/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d9877680762afa22:
    english: Some organizations arrive at Loomio having already developed a deep culture and practice of collaborative decision making.  Such organizations have often written handbooks and codified their practices, however, most organizations are still on the journey and looking for some helpful first steps towards making better decisions together.  If the burning question in your organization is **how do we make decisions together?**, then this guide is for you.
    translation: Joillakin Loomion käyttöön ottavilla organisaatioilla on jo vakiintuneet yhteisen päätöksenteon käytännöt. Ne ovat usein kirjanneet käytäntönsä oppaisiin. Monet organisaatiot kuitenkin vasta etsivät tapoja tehdä parempia päätöksiä yhdessä. Jos organisaatiossasi pohditaan, **miten teemme päätöksiä yhdessä?**, tämä opas auttaa alkuun.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6b321a0ba71f92b8:
    english: "***Here are three steps to help you co-create a better, more cohesive decision with less stress and anxiety.***"
    translation: "***Näiden kolmen vaiheen avulla voitte tehdä yhdessä paremman ja yhtenäisemmän päätöksen vähemmällä kuormituksella.***"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c46b32b56b933b0a:
    english: "## Simple decision making - in 3 steps"
    translation: "## Yksinkertainen päätöksenteko kolmessa vaiheessa"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e3208a84f88ba36f:
    english: Good collaborative decisions rarely happen by themselves.  They almost always benefit from someone facilitating the discussion through to decision.  So when you launch a discussion thread, you take on a facilitation role (unless someone else is facilitating).
    translation: Hyvät yhteiset päätökset syntyvät harvoin itsestään. Yleensä on hyödyksi, että joku ohjaa keskustelua päätökseen asti. Kun aloitat keskusteluketjun, otat tämän tehtävän hoitaaksesi, ellei joku muu ohjaa keskustelua.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1a1da8788ddb01c7:
    english: Follow these 3 steps as you facilitate your group to make a good decision.
    translation: Ohjaa ryhmääsi hyvään päätökseen näiden kolmen vaiheen avulla.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5b83a53a3f4caad5:
    english: |-
      ### Step 1 - Introduce and discuss
      Start a Loomio **discussion** to introduce the topic, open conversation and invite people. Include all the context-setting information your group needs to meaningfully participate, along with relevant background so everyone understands the purpose.
    translation: |-
      ### Vaihe 1 – Esittele aihe ja keskustelkaa
      Aloita Loomiossa **keskustelu**, jossa esittelet aiheen, avaat keskustelun ja kutsut ihmiset mukaan. Kerro tarvittavat taustatiedot, jotta ryhmän jäsenet ymmärtävät tarkoituksen ja voivat osallistua mielekkäästi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8aab998cb04b8635:
    english: 'Be clear about your objective - what is the decision to be made or intended outcome of the discussion? '
    translation: 'Kerro tavoitteesi selvästi: mikä päätös on tehtävä tai mitä keskustelulla halutaan saavuttaa?'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d8f53cbae173f5ac:
    english: As the discussion progresses, create space for diverse input - sometimes the best ideas and input come from outside the box.  Work together to explore and test ideas, encouraging a healthy and open discussion.
    translation: Anna keskustelun edetessä tilaa erilaisille näkemyksille. Parhaat ideat voivat tulla yllättävästä suunnasta. Tutkikaa ja kokeilkaa ideoita yhdessä ja pitäkää keskustelu avoimena.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7f447ab455f6cea4:
    english: 'Notice when the same voices are dominating and invite some of the quieter people to contribute by @mentioning them and asking them what they think. '
    translation: Huomaa, jos samat ihmiset ovat jatkuvasti äänessä. Kutsu myös hiljaisempia osallistumaan mainitsemalla heidät @-merkillä ja kysymällä heidän ajatuksiaan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d4bad2b5207ac1d8:
    english: You can make a complex discussion easier to engage with by updating the context section with a summary of the key points.
    translation: Voit helpottaa monimutkaiseen keskusteluun osallistumista päivittämällä kontekstiosioon yhteenvedon tärkeimmistä asioista.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  daeddff561f62553:
    english: |-
      ### Step 2 - Sense check
      As your group begins to converge on path forwards, use a **Sense check** poll to survey opinions and test how the group feels.
    translation: |-
      ### Vaihe 2 – Aistitarkistus
      Kun ryhmälle alkaa hahmottua etenemistapa, kartoita näkemyksiä **Aistitarkistus**-kyselyllä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c1d4e97ce180d85b:
    english: |-
      A ‘Sense check’ lets people know a proposal is forming and encourages them to engage.
      It can also be used to clarify an issue, even if the solution might not be apparent yet.
    translation: |-
      Aistitarkistus kertoo osallistujille, että ehdotus on muotoutumassa, ja kannustaa heitä osallistumaan.
      Sen avulla voit myös selventää asiaa, vaikka ratkaisu ei vielä olisi selvillä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5ff914227bb8706a:
    english: Sense check is a great way to surface concerns before moving to a formal agreement.  You can find out if people are happy with where this is going, if they have questions or need more time, or if they are concerned.
    translation: Aistitarkistus auttaa tuomaan huolenaiheet esiin ennen varsinaista päätöstä. Saat selville, kannattavatko osallistujat ehdotettua suuntaa, onko heillä kysymyksiä tai tarvitsevatko he lisää aikaa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  01433544fefb70a5:
    english: 'Use feedback to improve and refine the proposal. If there’s still some work to do, you may need to go back to Step 1 and then run another Sense check round. '
    translation: Kehitä ja tarkenna ehdotusta palautteen perusteella. Jos työtä on vielä tehtävä, palaa tarvittaessa vaiheeseen 1 ja tee sen jälkeen uusi aistitarkistus.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  440474199fd76019:
    english: Good engagement will help you assess when you are ready to proceed to a proposal.
    translation: Osallistujien palaute auttaa arvioimaan, milloin olette valmiita tekemään ehdotuksen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f3799fd76f9d9446:
    english: "### Step 3 - Proposal\nNow when you raise a formal **Proposal**, you do so with confidence that it will pass. "
    translation: |-
      ### Vaihe 3 – Ehdotus
      Kun teet varsinaisen **Ehdotus**-kyselyn, tiedät jo, että ehdotuksella on hyvät mahdollisuudet tulla hyväksytyksi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a3e74110f5a3c7a2:
    english: There may have been a lot of discussion and variations suggested, so be specific about the decision being made, so that everyone knows what the voting options mean.
    translation: Keskustelussa on voitu esittää monta vaihtoehtoa. Kerro täsmällisesti, mistä päätetään, jotta kaikki ymmärtävät äänestysvaihtoehtojen merkityksen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b7581cfd1ecffd78:
    english: Set proposal deadlines consciously, so group members have time to consider and engage.  You can always extend the closing date if need be.
    translation: Aseta ehdotukselle määräaika niin, että ryhmän jäsenillä on aikaa harkita ja osallistua. Voit tarvittaessa siirtää päättymisaikaa myöhemmäksi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b5bcc06f15cde560:
    english: This step is important to formalize agreement with people’s vote and to state an outcome - what just happened and what will happen next.
    translation: 'Tässä vaiheessa osallistujat ilmaisevat kantansa äänestämällä. Kirjaa myös tulos: mitä päätettiin ja mitä tapahtuu seuraavaksi.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c2f2bbcacfd77ab0:
    english: Proposal results are logged, along with a record of the discussion leading to the decision.
    translation: Ehdotuksen tulokset tallentuvat yhdessä päätökseen johtaneen keskustelun kanssa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2d82209e751f2ffa:
    english: |-
      ### Outcome
      When a Loomio poll closes, you will be prompted to set an **outcome** to let everyone know what happened and what is going to happen next.
    translation: |-
      ### Tulos
      Kun Loomion kysely päättyy, sinua pyydetään kirjaamaan **tulos**, jotta kaikki tietävät, mitä päätettiin ja mitä tapahtuu seuraavaksi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fb14b31115927d74:
    english: "## Proposals can help in many situations"
    translation: "## Ehdotuksista on hyötyä monissa tilanteissa"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c1a27b25e2c01ff3:
    english: 'Don''t hesitate to start a proposal just because you''re not sure everyone will agree - proposals are not only for when you have consensus, they''re designed to surface issues that need resolving and are useful for clarifying disagreements. '
    translation: Voit tehdä ehdotuksen, vaikka et olisi varma kaikkien olevan samaa mieltä. Ehdotukset auttavat tuomaan ratkaistavat kysymykset esiin ja selventämään erimielisyyksiä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6dbf0f3af984b8e8:
    english: The next pages show a few more complex processes for reaching decisions, through [advice](/en/guides/making_decisions/advice_process), [consent](/en/guides/making_decisions/consent_process ), or [consensus](/en/guides/making_decisions/consensus_process ).
    translation: 'Seuraavilla sivuilla esitellään muita, hieman monimutkaisempia päätöksentekotapoja: [neuvon kysyminen](/en/guides/making_decisions/advice_process), [suostumus](/en/guides/making_decisions/consent_process ) ja [yksimielisyys](/en/guides/making_decisions/consensus_process ).'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
