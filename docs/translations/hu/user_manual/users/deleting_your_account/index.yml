  941f0addde6f7326:
    english: "## What does delete account mean?"
    translation: "## Mit jelent a fiók törlése?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dab05d98ad64604f:
    english: |-
      When you delete your account:
      - Your user account including your name, email address and other personally identifying data will be deleted from our systems. You will not be able to sign in to Loomio with this account.
      - Comments, proposal and discussions you have made will remain but your name will be removed from them. We do this because we have an obligation to groups to keep threads and proposals coherent.
      - You will no longer be listed as a member of any groups.
      - You will no longer receive notification emails.
    translation: |-
      Ha törlöd a fiókodat:
      - A felhasználói fiókodat, a nevedet, az e-mail-címedet és az egyéb személyazonosításra alkalmas adataidat töröljük a rendszereinkből. Ezzel a fiókkal többé nem tudsz bejelentkezni a Loomióba.
      - A hozzászólásaid, javaslataid és beszélgetéseid megmaradnak, de a nevedet eltávolítjuk róluk. Erre azért van szükség, hogy a csoportok témái és javaslatai érthetők maradjanak.
      - Többé nem szerepelsz egyetlen csoport tagjai között sem.
      - Többé nem kapsz értesítő e-maileket.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dbeaf194bb8bd9e8:
    english: It is important to understand that copies of the data you have generated on Loomio have likely been emailed to everyone in the group - Loomio has no ability to delete those.
    translation: A Loomióban létrehozott tartalmaid másolatait valószínűleg e-mailben megkapták a csoport tagjai. Ezeket a Loomio nem tudja törölni.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fa98dfeef486cf05:
    english: Deleting your account will _not_ cancel your subscription; to stop your payments see [Subscriptions](/en/policy/subscriptions/management#cancel-your-plan).
    translation: A fiókod törlése _nem_ mondja le az előfizetésedet. A fizetések leállításáról az [Előfizetések](/en/policy/subscriptions/management#cancel-your-plan) oldalon olvashatsz.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c1ceda8f829133c7:
    english: Loomio has made fundamental decisions about its ownership, business model and software to protect users' rights. Loomio is an independent, worker-owned cooperative, the software is open source, you can [export your data](/en/user_manual/groups/data_export), and Loomio never sells your data or uses it for advertising. These commitments are set out in our [privacy policy](/en/policy/privacy) and grounded in the purpose and values in our [constitution](https://www.loomio.coop/constitution.html) and [cooperative handbook](https://www.loomio.coop/purpose_and_vision.html). If you have any questions, [contact us](/contact).
    translation: A Loomio a tulajdonosi szerkezetével, üzleti modelljével és szoftverével kapcsolatos alapvető döntéseket a felhasználók jogainak védelmében hozta meg. A Loomio független, a dolgozók tulajdonában álló szövetkezet. A szoftver nyílt forráskódú, [exportálhatod az adataidat](/en/user_manual/groups/data_export), a Loomio pedig soha nem adja el az adataidat, és nem használja őket hirdetésekhez. Ezeket a vállalásokat az [adatvédelmi szabályzatunk](/en/policy/privacy) rögzíti, és az [alapszabályunkban](https://www.loomio.coop/constitution.html), valamint a [szövetkezeti kézikönyvünkben](https://www.loomio.coop/purpose_and_vision.html) leírt célok és értékek alapozzák meg. Ha kérdésed van, [lépj kapcsolatba velünk](/contact).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d8cc22d615b8f5d9:
    english: "## To delete your account entirely"
    translation: "## Fiókod végleges törlése"
    status: machine
    provider: codex/gpt-6-sol
