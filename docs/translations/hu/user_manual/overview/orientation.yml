    english: Use this menu to edit your profile, change notification settings, choose a theme, manage account settings, and sign out.
    translation: Ebben a menüben szerkesztheted a profilodat, módosíthatod az értesítési beállításaidat, kiválaszthatsz egy témát, kezelheted a fiókbeállításaidat, és kijelentkezhetsz.
