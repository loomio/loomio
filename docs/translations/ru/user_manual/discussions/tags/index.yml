  7d3b350731e07a2c:
    english: Use short, familiar names that group members will recognize, such as Finance, Governance, Packaging, or Cafe partnerships.
    translation: Используйте короткие и понятные участникам группы названия, например «Финансы», «Управление», «Упаковка» или «Партнёрство с кафе».
