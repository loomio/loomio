  bdd96ea053e98eb3:
    english: |-
      1. Application translation - Change the language of the user interface, IE: the buttons and application text.
      2. Content translation - Translate comments, discussions and proposals into your preferred language.
    translation: |-
      1. Переклад інтерфейсу — змініть мову кнопок та іншого тексту застосунку.
      2. Переклад контенту — перекладайте коментарі, обговорення та пропозиції бажаною мовою.
    status: machine
    provider: codex/gpt-6-sol
