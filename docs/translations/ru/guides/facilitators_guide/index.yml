  980342866ab7bee6:
    english: An in-depth guide to applying key facilitation concepts in the online space.
    translation: Подробное руководство по применению основных принципов фасилитации в интернете.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ac8728f5ce2ea8ce:
    english: Loomio is made by facilitators, and that plays a huge role in how it has been designed. This guide is about revealing more of that context, and translating facilitation concepts from the offline space to the online space.
    translation: Loomio создали фасилитаторы, и их опыт во многом определил устройство сервиса. Это руководство рассказывает о таком подходе и о том, как перенести принципы фасилитации очных встреч в интернет.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e802660a44da1775:
    english: "## More about this guide"
    translation: "## Подробнее об этом руководстве"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5cbd64dba51ca485:
    english: Whether employed by a professional facilitator, people peer-facilitating each other, or a group that has no awareness of facilitation at all, Loomio’s essential function is to mediate and support group communication toward a desired outcome. In other words, facilitation.
    translation: Группе может помогать профессиональный фасилитатор, её участники могут помогать друг другу, а могут и вовсе не знать о фасилитации. В любом случае основная задача Loomio — помогать группе общаться и двигаться к намеченной цели. Иными словами, поддерживать фасилитацию.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  25a956280b647fa6:
    english: 'Loomio is *groupware*:'
    translation: 'Loomio — это *программа для совместной работы*:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  33e304be58a0a55b:
    english: "> Collaborative software, or groupware, is designed to help people involved in a common task achieve their goals. One of the earliest definitions of collaborative software is “intentional group processes plus software to support them.” -- Wikipedia"
    translation: "> Программы для совместной работы помогают людям, занятым общим делом, достигать своих целей. Одно из первых определений таких программ — «целенаправленные групповые процессы и программное обеспечение для их поддержки». -- Википедия"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  170a0b463e1ad8ca:
    english: There is a huge body of knowledge, best practice, and tradition in both in-person facilitation and online moderation, but the art and science of their intersection is only just emerging. This is the specific space where Loomio strives to excel.
    translation: Накоплено много знаний, практик и традиций проведения очных встреч и модерации общения в интернете. Но понимание того, как совместить эти подходы, только формируется. Именно здесь Loomio стремится быть полезным.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
