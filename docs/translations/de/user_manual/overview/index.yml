  b08a2d6a44f0d7ac:
    english: The best way to learn about Loomio is to [start a free trial](/try)
    translation: Loomio lernst du am besten kennen, indem du [eine kostenlose Testphase startest](/try)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ced10eda436a40ca:
    english: "## How people use Loomio"
    translation: "## So nutzen Menschen Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4198817a2724ad0a:
    english: "**Member organizations** to involve members in decisions at scale. Political parties, consumer and worker co-operatives, and membership associations use Loomio to facilitate a safe, inclusive space for members to share information and raise topics, participate in important decisions and vote in General Assembly. Streamline decision processes, improve transparency and accountability, document discussions and record decisions, and include members' voices to organize for action."
    translation: "**Mitgliedsorganisationen** beziehen viele Mitglieder in Entscheidungen ein. Parteien, Verbraucher- und Arbeitergenossenschaften sowie Vereine nutzen Loomio, damit Mitglieder Informationen teilen, Themen einbringen, an wichtigen Entscheidungen teilnehmen und bei Mitgliederversammlungen abstimmen können. Sie strukturieren Entscheidungsprozesse, machen sie nachvollziehbar, dokumentieren Diskussionen und Entscheidungen und beziehen die Stimmen ihrer Mitglieder in gemeinsames Handeln ein."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7b2fd1306e05f4e3:
    english: "**Self-managing organizations** to involve staff in decisions. Self-managing teams, worker co-operatives, and sociocratic organisations use Loomio to run consent, consensus, and advice-based decision processes across distributed teams and time zones. Tap into collective intelligence, distribute decision making, build governance and policy together, and document decisions and discussion."
    translation: "**Selbstverwaltete Organisationen** beziehen Mitarbeitende in Entscheidungen ein. Selbstverwaltete Teams, Arbeitergenossenschaften und soziokratische Organisationen nutzen Loomio für Entscheidungsprozesse auf Basis von Konsent, Konsens oder eingeholtem Rat – auch über Standorte und Zeitzonen hinweg. Sie nutzen das Wissen aller Beteiligten, verteilen Entscheidungen, entwickeln gemeinsam Regeln und dokumentieren Entscheidungen und Diskussionen."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  75d7266c562f65c2:
    english: "**Boards, councils, and distributed networks** to involve stakeholders in decisions. Create a safe space for discussion, keep track of communications, and coordinate across geographies and time zones. Structure decision making processes, improve agility and response times, and preserve organizational memory."
    translation: "**Vorstände, Räte und dezentrale Netzwerke** beziehen Beteiligte in Entscheidungen ein. Sie schaffen Raum für Diskussionen, behalten die Kommunikation im Blick und stimmen sich über Orte und Zeitzonen hinweg ab. Sie strukturieren Entscheidungsprozesse, können schneller reagieren und bewahren das Wissen ihrer Organisation."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cbe5ae77738f2704:
    english: "**Residential communities and co-ops** to make decisions together as neighbours. Cohousing communities, ecovillages, coliving cooperatives, housing co-ops, and land trusts use Loomio to replace or augment traditional strata and property management with democratic governance. Residents shape decisions about shared land, common spaces, and community agreements, and asynchronous discussion means members can fully participate whether they're on-site or away travelling, keeping a clear record of how the community has chosen to live together."
    translation: "**Wohngemeinschaften und Wohnungsgenossenschaften** treffen Entscheidungen gemeinsam mit ihren Nachbarinnen und Nachbarn. Gemeinschaftliche Wohnprojekte, Ökodörfer, Wohnkooperativen, Wohnungsgenossenschaften und gemeinschaftliche Landträger nutzen Loomio, um die herkömmliche Verwaltung von Wohnanlagen und Immobilien durch demokratische Entscheidungen zu ergänzen oder zu ersetzen. Bewohnerinnen und Bewohner entscheiden über gemeinsam genutztes Land, Gemeinschaftsräume und Vereinbarungen. Durch zeitversetzte Diskussionen können sich Mitglieder auch dann beteiligen, wenn sie unterwegs sind. Zugleich bleibt nachvollziehbar, wie die Gemeinschaft ihre Entscheidungen getroffen hat."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb1039083c952286:
    english: Loomio builds a living record of your organization; the decisions made, who was involved and the discussion leading up to the decision.
    translation: 'Loomio schafft eine fortlaufende Dokumentation deiner Organisation: welche Entscheidungen getroffen wurden, wer beteiligt war und welche Diskussionen den Entscheidungen vorausgingen.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
