---
navigation_title: Valmistaudu kokoukseen
blocks:
  165e9dec4d4660aa:
    english: "# Prepare for a meeting"
    translation: "# Valmistaudu kokoukseen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5d14c790e0c05446:
    english: Effective meetings are productive, inclusive, and collaborative - they improve engagement, help build strong relationships, establish alignment, make better and faster decisions, promote inclusion, facilitate creative thinking and innovation, are a great channel for feedback and continuous improvement.
    translation: Toimiva kokous on tuottava, osallistava ja yhteistyöhön perustuva. Se lisää sitoutumista, vahvistaa ihmissuhteita, auttaa löytämään yhteisen suunnan, parantaa ja nopeuttaa päätöksentekoa sekä tukee luovaa ajattelua, palautetta ja jatkuvaa kehittämistä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c69f325003094ac5:
    english: Use Loomio to plan an effective meeting; involve people from the outset, align towards the most important topics, and make better use of your precious time together.
    translation: Suunnittele toimiva kokous Loomiossa. Ota ihmiset mukaan alusta asti, keskity tärkeimpiin aiheisiin ja käytä yhteinen aika hyvin.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a30a32e8b06a9432:
    english: If the group is new to Loomio, begin with [Introducing Loomio to your group](/en/user_manual/overview/introducing_loomio), then use this meeting process as a practical first recurring workflow.
    translation: Jos Loomio on ryhmällesi uusi, aloita sivusta [Esittele Loomio ryhmällesi](/en/user_manual/overview/introducing_loomio). Käytä sitten tätä kokousprosessia ensimmäisenä säännöllisenä toimintatapana.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9a0eb26797e28e0f:
    english: There are several things you can do to make your next board or committee meeting effective...
    translation: Voit tehdä seuraavan hallituksen tai toimikunnan kokouksesta toimivamman usealla tavalla...
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c04e8fcfc9edb01c:
    english: |-
      - [Meeting focus and review actions](#meeting-focus-and-review-actions)
      - [Announce agenda and notify](#agenda-and-notify)
      - [Find a time for meeting](#find-a-time-for-meeting)
      - [Sign off minutes](#sign-off-minutes)
      - [Approve reports](#approve-reports)
    translation: |-
      - [Keskity tärkeimpiin aiheisiin ja käy toimenpiteet läpi](#meeting-focus-and-review-actions)
      - [Jaa esityslista ja ilmoita kokouksesta](#agenda-and-notify)
      - [Etsi kokoukselle sopiva aika](#find-a-time-for-meeting)
      - [Hyväksy pöytäkirja](#sign-off-minutes)
      - [Hyväksy raportit](#approve-reports)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6e6785b547007644:
    english: "## Meeting focus and review actions"
    translation: "## Keskity tärkeimpiin aiheisiin ja käy toimenpiteet läpi"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  26bf98782eb61549:
    english: 'Establish a focus for the meeting, so you spend your precious time together talking about the most important topics.  '
    translation: Määritä kokoukselle painopiste, jotta käytätte yhteisen ajan tärkeimpien aiheiden käsittelyyn.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c23fdd52f0a29b2c:
    english: Inviting members to contribute to the agenda helps everyone align, think about topics and energize for the meeting.
    translation: Kun kutsut jäsenet osallistumaan esityslistan laatimiseen, kaikki voivat valmistautua aiheisiin ja löytää yhteisen suunnan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  52409f3ffabfb7d1:
    english: |-
      Actions:
      - focus the meeting on the most important things,
      - follow up and talk to members about actions from previous meetings.
    translation: |-
      Toimenpiteet:
      - keskity kokouksessa tärkeimpiin asioihin,
      - seuraa aiemmissa kokouksissa sovittuja toimenpiteitä ja keskustele niistä jäsenten kanssa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a52dd7ebb4619e46:
    english: |-
      ### On Loomio
      Use a Loomio **Discussion** to prepare for your meeting:
      * remind members about the meeting coming up,
      * invite comment about the most important things to focus on,
      * summarize actions from the previous meeting and ask for an update.
    translation: |-
      ### Loomiossa
      Valmistele kokous Loomion **Keskustelu**-toiminnolla:
      * muistuta jäseniä tulevasta kokouksesta,
      * pyydä heitä kertomaan, mihin asioihin kokouksessa pitäisi keskittyä,
      * tee yhteenveto edellisen kokouksen toimenpiteistä ja pyydä tilannepäivitys.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5bcd10bb61edcc35:
    english: "## Agenda and notify"
    translation: "## Esityslista ja ilmoitukset"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d9431846021bb8f3:
    english: Announce the meeting with a clear agenda. Attach papers, link to key documents and notify members.
    translation: Ilmoita kokouksesta ja jaa selkeä esityslista. Liitä kokousasiakirjat, lisää linkit keskeisiin dokumentteihin ja lähetä jäsenille ilmoitus.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  41e84b882fa9bab1:
    english: This helps everyone prepare for the meeting, by reading the materials and thinking about topics of discussion and the decisions to be made.  Members are then more likely to arrive in context and ready for the meeting.
    translation: Näin kaikki voivat valmistautua kokoukseen lukemalla aineiston ja pohtimalla keskustelunaiheita sekä tehtäviä päätöksiä. Jäsenet tuntevat silloin kokouksen taustan jo etukäteen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b6b0e7ed67711d5b:
    english: |-
      Actions:
      - prepare agenda, documents, materials and board papers,
      - notify members of meeting and send materials.
    translation: |-
      Toimenpiteet:
      - valmistele esityslista, asiakirjat ja muu kokousaineisto,
      - ilmoita kokouksesta jäsenille ja lähetä aineisto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5b6d4a5158e41747:
    english: |-
      ### On Loomio
      Use a Loomio **Discussion** to prepare for your board meeting:
      * state details of meeting,
      * attach or link agenda, documents and other meeting materials,
      * invite members with a notification,
      * monitor 'Seen by' to see who has read the thread.
    translation: |-
      ### Loomiossa
      Valmistele hallituksen kokous Loomion **Keskustelu**-toiminnolla:
      * kerro kokouksen tiedot,
      * liitä esityslista, asiakirjat ja muu kokousaineisto tai lisää niihin linkit,
      * kutsu jäsenet mukaan ilmoituksella,
      * tarkista **Nähnyt**-tiedosta, ketkä ovat lukeneet keskusteluketjun.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f2c8f10394bf10c8:
    english: |-
      While similar to sending an email, a Loomio thread has advantages:
      - you can see who has read the thread, and remind those who haven't,
      - member replies or comments are visible to everyone who has permission to view the thread,
      - any discussion or questions about the agenda or meeting materials is held in a single place.
    translation: |-
      Loomion keskusteluketju muistuttaa sähköpostia, mutta siinä on hyödyllisiä ominaisuuksia:
      - näet, ketkä ovat lukeneet keskusteluketjun, ja voit muistuttaa muita,
      - jäsenten vastaukset ja kommentit näkyvät kaikille, joilla on oikeus nähdä keskusteluketju,
      - esityslistaa ja kokousaineistoa koskevat keskustelut ja kysymykset pysyvät yhdessä paikassa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dd6d8cabe5f1810d:
    english: Members can find all the information about the meeting readily available in one place, thereby avoiding confusing email chains and losing important info in their email inbox.
    translation: Jäsenet löytävät kaikki kokoustiedot yhdestä paikasta. Tiedot eivät huku pitkiin sähköpostiketjuihin tai postilaatikoihin.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6a57d003a0bd5f07:
    english: |-
      ### Confirm
      Ask members to leave a comment confirming they have read the agenda and meeting papers and are prepared for the meeting. Use **Seen by** to identify anyone who may need a reminder.
    translation: |-
      ### Vahvista valmistautuminen
      Pyydä jäseniä vahvistamaan kommentilla, että he ovat lukeneet esityslistan ja kokousaineiston ja ovat valmiita kokoukseen. Tarkista **Nähnyt**-tiedosta, ketkä saattavat tarvita muistutuksen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d08b0ae5712ef2d:
    english: "## Find a time for meeting\nFinding a time to meet can be a frequent headache for many administrators. "
    translation: |-
      ## Etsi kokoukselle sopiva aika
      Sopivan kokousajan löytäminen voi viedä järjestäjältä paljon aikaa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1da8fdf943571a19:
    english: |-
      ### On Loomio
      If you have not yet set a date and time for the meeting or you need to find a time for a future meeting, you can use **Time poll**.
    translation: |-
      ### Loomiossa
      Jos kokouksen päivää ja aikaa ei ole vielä sovittu tai etsit aikaa tulevalle kokoukselle, käytä **Aikakysely**-toimintoa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f1c92e27dfd63153:
    english: Time poll makes it easy to see everyone's availability and find the best time, reducing time and energy needed for this common admin task.
    translation: Aikakyselystä näet helposti, milloin kukin pääsee osallistumaan. Näin sopivan ajan löytäminen vie vähemmän aikaa ja vaivaa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  45b90fd46cce4976:
    english: Members in different time zones will see dates and times localized in their time zone.
    translation: Eri aikavyöhykkeillä olevat jäsenet näkevät päivämäärät ja kellonajat omalla aikavyöhykkeellään.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dc159c751f73d5d1:
    english: 'When the Time poll closes, choose the best time and send an outcome notification with a calendar invitation, so members can add the meeting to their calendar. '
    translation: Kun aikakysely sulkeutuu, valitse sopivin aika ja lähetä tulosilmoitus sekä kalenterikutsu, jotta jäsenet voivat lisätä kokouksen kalenteriinsa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4bafee41dd5f774c:
    english: "## Sign off minutes\nApproving or ratifying minutes is standard practice for formal meetings and good practice for all meetings.  "
    translation: |-
      ## Hyväksy pöytäkirja
      Pöytäkirjan hyväksyminen tai vahvistaminen on vakiokäytäntö virallisissa kokouksissa ja hyödyllistä myös muissa kokouksissa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d9795ed92dabff7:
    english: 'Minutes provide a record of the meeting, key points raised during discussion, results of decisions and how people voted. They include the actions agreed and the person(s) responsible, and are often the starting point for the next meeting.  '
    translation: Pöytäkirjaan kirjataan kokous, keskustelun keskeiset asiat, päätökset ja äänestystulokset. Siihen merkitään myös sovitut toimenpiteet ja niiden vastuuhenkilöt. Pöytäkirja toimii usein seuraavan kokouksen lähtökohtana.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1fd0d860cba070db:
    english: Minutes are valuable as a reminder for people present, helpful for those absent and a record to consult in case of conflict.
    translation: Pöytäkirja muistuttaa osallistujia sovituista asioista, auttaa poissaolleita pysymään ajan tasalla ja toimii tarvittaessa kirjallisena tietolähteenä ristiriitatilanteissa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  166796d872f35962:
    english: "### On Loomio"
    translation: "### Loomiossa"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ef51b49480cb721a:
    english: Post the minutes in the Loomio meeting thread within a few days of the meeting and invite participants to approve.  This keeps the minutes relevant and fresh in member's minds and is a great way to remind members of their actions.  It also saves some time during your meeting.
    translation: Julkaise pöytäkirja Loomion kokouskeskusteluketjussa muutaman päivän kuluessa kokouksesta ja pyydä osallistujia hyväksymään se. Asiat ovat silloin vielä tuoreessa muistissa. Samalla voit muistuttaa jäseniä heidän toimenpiteistään ja säästää aikaa seuraavassa kokouksessa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ea02d6cf3ede73dc:
    english: The example above uses a **Choose** poll with two options 'Accept' or 'Review'.
    translation: 'Yllä olevassa esimerkissä käytetään **Valita**-kyselyä, jossa on kaksi vaihtoehtoa: ''Hyväksy'' ja ''Tarkista''.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  56c55da82e5ddeb7:
    english: 'When everyone has voted and the poll closes, state an outcome so everyone knows what has happened.  '
    translation: Kun kaikki ovat äänestäneet ja kysely sulkeutuu, julkaise lopputulos, jotta kaikki tietävät, mitä päätettiin.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e8b710a05eb113dc:
    english: 'If your meeting practice requires formal acceptance at the next meeting, schedule an agenda item to acknowledge and confirm polls and decisions made on Loomio, and record this in the meeting minutes.  '
    translation: Jos kokouskäytäntönne edellyttää muodollista hyväksyntää seuraavassa kokouksessa, lisää esityslistalle kohta Loomiossa tehtyjen kyselyiden ja päätösten vahvistamiseksi. Kirjaa vahvistus pöytäkirjaan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '06339a98b65ccc2c':
    english: For example; *"Does anyone wish to change their votes in Loomio?  If no, then let's resolve to formally approve polls made in Loomio during the last period."*
    translation: 'Esimerkiksi: *"Haluaako joku muuttaa Loomiossa antamaansa ääntä? Jos ei, vahvistetaan viime kokouksen jälkeen Loomiossa tehtyjen kyselyiden tulokset."*'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f460b4ae218b375a:
    english: |-
      ## Approve reports
      Most meeting agendas include time for reports to be presented, discussed and approved; for example reports from the CEO, Financial, Operations, Health & Safety, and project reports.
    translation: |-
      ## Hyväksy raportit
      Useimpien kokousten esityslistoilla varataan aikaa raporttien esittelyyn, käsittelyyn ja hyväksymiseen. Näitä voivat olla esimerkiksi toimitusjohtajan raportti, talous-, toiminta- ja työturvallisuusraportit sekä projektiraportit.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  00abfe283956509a:
    english: Reports are very important to help everyone get on the same page, however they can absorb valuable time in a meeting that may be used more effectively.
    translation: Raportit auttavat kaikkia saamaan saman tilannekuvan. Niiden käsittely voi kuitenkin viedä kokouksessa aikaa, jonka voisi käyttää tehokkaammin.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  861200207a1e1dfb:
    english: Attach or link reports to your meeting **thread** and invite questions about the reports in advance of the meeting.
    translation: Liitä raportit kokouksen **keskusteluketjuun** tai lisää niihin linkit. Pyydä jäseniä esittämään raportteja koskevat kysymykset ennen kokousta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  11f124875e8a5945:
    english: Members receive and read the reports at a time and place that works for them.  As members read and think about the reports, they can comment, ask questions and see responses in Loomio.
    translation: Jäsenet voivat lukea raportit itselleen sopivaan aikaan ja paikassa. Lukiessaan ja pohtiessaan raportteja he voivat kommentoida, esittää kysymyksiä ja nähdä vastaukset Loomiossa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2871f1673d36999a:
    english: A question asked by one member is likely of interest to other members, so when someone replies to the question, their response  is visible to everyone in the Loomio group.
    translation: Yhden jäsenen esittämä kysymys kiinnostaa todennäköisesti muitakin. Kun joku vastaa siihen, vastaus näkyy kaikille Loomio-ryhmän jäsenille.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  851a2a86a1047697:
    english: As members become familiar with discussing reports in Loomio, save a little more time by taking it a step further - seek approval of reports ahead of the meeting.
    translation: Kun jäsenet ovat tottuneet käsittelemään raportteja Loomiossa, voit säästää lisää kokousaikaa pyytämällä heitä hyväksymään raportit jo ennen kokousta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
