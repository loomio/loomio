  980342866ab7bee6:
    english: An in-depth guide to applying key facilitation concepts in the online space.
    translation: Um guia aprofundado sobre como aplicar conceitos fundamentais de facilitação no ambiente on-line.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ac8728f5ce2ea8ce:
    english: Loomio is made by facilitators, and that plays a huge role in how it has been designed. This guide is about revealing more of that context, and translating facilitation concepts from the offline space to the online space.
    translation: O Loomio foi criado por pessoas que facilitam grupos, e isso influenciou muito seu desenvolvimento. Este guia apresenta esse contexto e mostra como aplicar conceitos de facilitação do ambiente presencial ao ambiente on-line.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e802660a44da1775:
    english: "## More about this guide"
    translation: "## Sobre este guia"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5cbd64dba51ca485:
    english: Whether employed by a professional facilitator, people peer-facilitating each other, or a group that has no awareness of facilitation at all, Loomio’s essential function is to mediate and support group communication toward a desired outcome. In other words, facilitation.
    translation: Seja com a ajuda de uma pessoa profissional em facilitação, com participantes facilitando uns aos outros ou em um grupo que não conhece o conceito, a função essencial do Loomio é mediar e apoiar a comunicação do grupo para alcançar um objetivo. Em outras palavras, facilitar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  25a956280b647fa6:
    english: 'Loomio is *groupware*:'
    translation: 'O Loomio é um *software de colaboração em grupo*:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  33e304be58a0a55b:
    english: "> Collaborative software, or groupware, is designed to help people involved in a common task achieve their goals. One of the earliest definitions of collaborative software is “intentional group processes plus software to support them.” -- Wikipedia"
    translation: "> Um software de colaboração em grupo ajuda pessoas envolvidas em uma tarefa comum a alcançar seus objetivos. Uma das primeiras definições desse tipo de software é “processos de grupo intencionais mais software para apoiá-los”. -- Wikipédia"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  170a0b463e1ad8ca:
    english: There is a huge body of knowledge, best practice, and tradition in both in-person facilitation and online moderation, but the art and science of their intersection is only just emerging. This is the specific space where Loomio strives to excel.
    translation: Há um vasto conhecimento, práticas consolidadas e tradições tanto na facilitação presencial quanto na moderação on-line. A combinação dessas duas áreas, porém, ainda está em desenvolvimento. É nesse espaço que o Loomio busca se destacar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
