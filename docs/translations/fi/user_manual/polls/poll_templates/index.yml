---
navigation_title: Kyselymallit
blocks:
  6428da81fbbe11c6:
    english: "# Poll templates"
    translation: "# Kyselymallit"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  208bc68b458895f1:
    english: Poll templates are reusable starting points shown when someone selects **Start a vote** or **New poll**. A template combines a voting method with preset guidance, response options, and settings.
    translation: Kyselymallit ovat uudelleenkäytettäviä lähtökohtia, jotka näet valitessasi **Aloita äänestys** tai **Uusi kysely**. Malli yhdistää äänestystavan valmiisiin ohjeisiin, vastausvaihtoehtoihin ja asetuksiin.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f290b92adeb2a791:
    english: Use this page to configure which templates are available to a group or to create one for your own process. To choose a template for a particular vote, see [Proposals](../proposals/) or [Polls](../proposal_types/). To facilitate a complete decision process, see [Making decisions](/en/guides/making_decisions/).
    translation: Tällä sivulla voit määrittää, mitkä mallit ovat ryhmän käytettävissä, tai luoda mallin omaa prosessiasi varten. Jos haluat valita mallin tiettyyn äänestykseen, katso [Ehdotukset](../proposals/) tai [Kyselyt](../proposal_types/). Koko päätöksentekoprosessin ohjaamiseen löydät neuvoja sivulta [Päätöksenteko](/en/guides/making_decisions/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  658d10486cbee7dc:
    english: "## Voting methods and templates"
    translation: "## Äänestystavat ja mallit"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d903d1a58aebf643:
    english: A voting method controls how participants respond and how Loomio calculates the result. Examples include Proposal, Choose, Score, Allocate, Rank, Time poll, and STV.
    translation: Äänestystapa määrittää, miten osallistujat vastaavat ja miten Loomio laskee tuloksen. Esimerkkejä ovat Ehdotus, Valita, Pisteet, Kohdista, Sijoitus, Aikakysely ja STV.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  21efff1a5c91ad29:
    english: A poll template uses one of those methods and adds reusable defaults. For example, Sense check, Advice, Consent, and Consensus are different templates built on the Proposal voting method. Their instructions and response options differ even though Loomio handles their ballots in the same way.
    translation: Kyselymalli käyttää yhtä näistä tavoista ja lisää siihen uudelleenkäytettävät oletusasetukset. Esimerkiksi mielipidekartoitus, neuvojen pyytäminen, suostumus ja konsensus ovat erilaisia Ehdotus-äänestystapaan perustuvia malleja. Niiden ohjeet ja vastausvaihtoehdot eroavat toisistaan, vaikka Loomio käsittelee äänet samalla tavalla.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f622951ffc7e1064:
    english: "## Use a template"
    translation: "## Käytä mallia"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  865e825cc7d00cf2:
    english: When starting a vote, select the **Proposal** or **Poll** tab and choose one of the templates available to the group.
    translation: Kun aloitat äänestyksen, valitse **Ehdotus**- tai **Kysely**-välilehti ja sen jälkeen jokin ryhmän käytettävissä olevista malleista.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1598f1a55a6944e6:
    english: The template supplies an introduction, example content, options, and settings. Review and edit these for the particular decision before starting the vote. Editing the new vote does not change the reusable template.
    translation: Malli sisältää esittelyn, esimerkkisisältöä, vaihtoehdot ja asetukset. Tarkista ja muokkaa niitä päätöstä varten ennen äänestyksen aloittamista. Uuden äänestyksen muokkaaminen ei muuta uudelleenkäytettävää mallia.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8212a94908338b22:
    english: "## Who can manage templates"
    translation: "## Kuka voi hallita malleja"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  378caa9ba83ee0dc:
    english: Group administrators can create and manage every poll template in their group. They can enable **Members can create templates** under **Group settings** → **Permissions**. When enabled, members can create templates and manage templates they authored.
    translation: Ryhmän ylläpitäjät voivat luoda ja hallita kaikkia ryhmän kyselymalleja. He voivat ottaa käyttöön asetuksen **Jäsenet voivat luoda malleja** kohdassa **Ryhmäasetukset** → **Käyttöoikeudet**. Kun asetus on käytössä, jäsenet voivat luoda malleja ja hallita itse luomiaan malleja.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0fafc6275b6c9153:
    english: "## Create a poll template"
    translation: "## Luo kyselymalli"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5fc696a1e924179c:
    english: Open the template list and select **New template**. Start with an example or a blank template, then choose the group that will use it.
    translation: Avaa malliluettelo ja valitse **Uusi malli**. Aloita esimerkistä tai tyhjästä mallista ja valitse sitten ryhmä, joka käyttää mallia.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  37b3658ec66eb8b7:
    english: The template form defines the guidance and defaults people receive when they start a vote.
    translation: Määritä mallilomakkeella ohjeet ja oletusasetukset, jotka näytetään äänestystä aloittaville ihmisille.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fa0dab51a009bf90:
    english: "### Template title, subtitle, and help"
    translation: "### Mallipohjan otsikko, alaotsikko ja ohjeet"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  965cde5e13952ade:
    english: |-
      - **Template title** is the short name shown in the template list.
      - **Template subtitle** explains when to use it in one sentence.
      - **Template help** appears in the information panel when someone uses the template. Explain its purpose, any rules participants should know, and links to relevant policies or guides.
    translation: |-
      - **Mallipohjan otsikko** on malliluettelossa näkyvä lyhyt nimi.
      - **Mallipohjan alaotsikko** kertoo yhdellä virkkeellä, milloin mallia käytetään.
      - **Mallipohjan ohjeet** näkyvät tietopaneelissa, kun joku käyttää mallia. Kerro mallin tarkoitus, osallistujien tarvitsemat säännöt sekä linkit asiaankuuluviin käytäntöihin tai oppaisiin.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f3e51b30163d5b85:
    english: Use plain, specific names that distinguish the template from others in the group.
    translation: Käytä selkeitä ja täsmällisiä nimiä, joista malli erottuu ryhmän muista malleista.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e6b8a09191bb8c3f:
    english: "### Voting method"
    translation: "### Äänestystapa"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ea4fef806c1cf060:
    english: Choose what participants need to express and how the result should be calculated.
    translation: Valitse äänestystapa sen mukaan, mitä osallistujien pitää ilmaista ja miten tulos lasketaan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f8c87a496921c710:
    english: |-
      - **Proposal**: respond to a statement using defined positions;
      - **Choose**: select one or more options;
      - **Score**: evaluate every option on a scale;
      - **Allocate**: distribute a limited budget of points;
      - **Rank**: arrange options in preference order;
      - **Time poll**: indicate availability; and
      - **STV**: rank candidates in a proportional, multi-winner election.
    translation: |-
      - **Ehdotus**: vastaa väitteeseen määritellyillä kannoilla;
      - **Valita**: valitse yksi tai useampi vaihtoehto;
      - **Pisteet**: arvioi jokainen vaihtoehto asteikolla;
      - **Kohdista**: jaa rajallinen pistemäärä vaihtoehtojen kesken;
      - **Sijoitus**: järjestä vaihtoehdot mieluisuusjärjestykseen;
      - **Aikakysely**: ilmoita, milloin olet käytettävissä; ja
      - **STV**: aseta ehdokkaat järjestykseen suhteellisessa vaalissa, jossa valitaan useita ehdokkaita.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9d589e44fa94c5e2:
    english: Changing the voting method changes the fields and result calculation available to the template.
    translation: Äänestystavan vaihtaminen muuttaa mallin käytettävissä olevia kenttiä ja tuloksen laskentatapaa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  230689f781e4cbc7:
    english: "### Example title, details, and tags"
    translation: "### Esimerkkiotsikko, tiedot ja tunnisteet"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6fa4b3625c6ec7ce:
    english: Provide example content that helps an author frame the vote. These values are copied into a new proposal or poll and can be edited before it starts.
    translation: Lisää esimerkkisisältöä, joka auttaa laatijaa muotoilemaan äänestyksen. Arvot kopioidaan uuteen ehdotukseen tai kyselyyn, ja niitä voi muokata ennen äänestyksen alkua.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a093368b30ac3c9b:
    english: Use prompts rather than fixed content when each use needs a different title or details. Add default category tags only when they apply every time the template is used.
    translation: Käytä kehotteita valmiin sisällön sijaan, jos otsikko tai tiedot vaihtuvat käyttökerrasta toiseen. Lisää oletusarvoisia luokkatunnisteita vain, jos ne sopivat mallin jokaiseen käyttökertaan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  24c3fa4b7ef676fd:
    english: "### Response options"
    translation: "### Vastausvaihtoehdot"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e7421caab9c47f5b:
    english: 'Methods such as Proposal and Choose let you configure response options. Select the pencil icon beside an option to edit:'
    translation: 'Äänestystavoissa, kuten Ehdotus ja Valita, voit määrittää vastausvaihtoehdot. Muokkaa vaihtoehtoa valitsemalla sen vieressä oleva kynäkuvake:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  73a065ad5b861579:
    english: |-
      - **Option name**: the short response label;
      - **Icon**: its visual marker;
      - **Meaning**: what selecting the option communicates; and
      - **Reason prompt**: the question shown when someone explains their response.
    translation: |-
      - **Vaihtoehdon nimi**: lyhyt vastausvaihtoehdon nimi;
      - **Kuvake**: vaihtoehdon visuaalinen tunniste;
      - **Merkitys**: mitä vaihtoehdon valinta ilmaisee; ja
      - **Syykehote**: kysymys, joka näytetään, kun osallistuja perustelee vastauksensa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  38bc8cfc36aaea2e:
    english: Define options so participants can tell the difference between them without guessing. The meanings should match the decision rules your group actually uses.
    translation: Määritä vaihtoehdot niin, että osallistujat erottavat ne toisistaan arvaamatta. Merkitysten tulee vastata ryhmäsi käyttämiä päätöksentekosääntöjä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cc4adba73670a75b:
    english: "### Duration and settings"
    translation: "### Kesto ja asetukset"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6c63a57ab4cec442:
    english: Set a default duration that is suitable for most uses of the template. The author can change the closing time for an individual vote.
    translation: Aseta oletuskesto, joka sopii mallin useimpiin käyttökertoihin. Äänestyksen laatija voi muuttaa yksittäisen äänestyksen päättymisaikaa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  df14be8dbf80fa3c:
    english: Other defaults can control result visibility, anonymous voting, vote-reason requirements, reminders, quorum, and method-specific behaviour. See [Proposal and poll settings](../settings/) for their effects.
    translation: Muilla oletusasetuksilla voit määrittää tulosten näkyvyyttä, anonyymiä äänestystä, perustelujen vaatimista, muistutuksia, päätösvaltaisuutta ja äänestystapakohtaista toimintaa. Niiden vaikutukset kuvataan sivulla [Ehdotusten ja kyselyjen asetukset](../settings/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  774ed7b91d33ab10:
    english: "### Save and test the template"
    translation: "### Tallenna ja testaa malli"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1b26a723ab8a9811:
    english: After saving, start a draft vote from the template. Check that its introduction, prompts, options, and defaults make sense to someone who did not create it. Starting a draft is also a useful way to confirm that the chosen voting method produces the result the group expects.
    translation: Kun olet tallentanut mallin, aloita siitä äänestysluonnos. Tarkista, että esittely, kehotteet, vaihtoehdot ja oletusasetukset ovat ymmärrettäviä myös ihmiselle, joka ei luonut mallia. Luonnoksen avulla voit myös varmistaa, että valittu äänestystapa tuottaa ryhmän odottaman tuloksen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1f0dab3f50320e75:
    english: "## Manage the template list"
    translation: "## Hallitse malliluetteloa"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e9748843a900273f:
    english: 'Use the action menu beside a template to:'
    translation: 'Mallin vieressä olevasta toimintovalikosta voit:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  646235094d051c83:
    english: |-
      - **Edit** its reusable content and defaults;
      - **Move** it to a different position in the list;
      - **Hide** it from people starting votes; or
      - **Delete** a custom template that is no longer needed.
    translation: |-
      - **Muokkaa** mallin uudelleenkäytettävää sisältöä ja oletusasetuksia;
      - **Liikkua** mallin toiseen kohtaan luettelossa;
      - **Piilottaa** mallin äänestystä aloittavilta ihmisiltä; tai
      - **Poistaa** mukautetun mallin, jota ei enää tarvita.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3f6dc06b1fd2bce8:
    english: Select **Show hidden templates** to review or restore hidden templates. Default templates can be hidden or adapted for the group, but cannot be deleted.
    translation: Valitse **Näytä piilotetut mallit**, jos haluat tarkastella tai palauttaa piilotettuja malleja. Oletusmalleja voi piilottaa tai mukauttaa ryhmälle, mutta niitä ei voi poistaa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  be3ee2d2721d3e2a:
    english: Changing a template does not alter proposals or polls that have already been started from it.
    translation: Mallin muuttaminen ei vaikuta ehdotuksiin tai kyselyihin, jotka on jo aloitettu sen pohjalta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
