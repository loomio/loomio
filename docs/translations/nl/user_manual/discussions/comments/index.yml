---
navigation_title: Reacties
blocks:
  e6981c530fad6f45:
    english: "# Comments"
    translation: "# Reacties"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cb82daa3594be60c:
    english: Comments are the main way people participate in a discussion. They are visible to anyone who has permission to see the thread.
    translation: Reacties zijn de belangrijkste manier om deel te nemen aan een discussie. Iedereen die de thread mag bekijken, kan de reacties zien.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  96ffa85117001d18:
    english: "## Reading comments"
    translation: "## Reacties lezen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2d82b2da2ee96a1f:
    english: When you open a discussion, Loomio takes you to activity that is new to you.
    translation: Wanneer je een discussie opent, brengt Loomio je naar de activiteit die nieuw voor je is.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c4a1b0be655249a9:
    english: Unread comments have a blue **new** label beside their posting time.
    translation: Ongelezen reacties hebben naast het tijdstip waarop ze zijn geplaatst een blauw label **nieuw**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  82bce54322fa6023:
    english: "## Writing a comment"
    translation: "## Een reactie schrijven"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7b14a17025b52e3d:
    english: Write a comment to contribute to the discussion. Other people can reply, react, or post their own comments.
    translation: Schrijf een reactie om bij te dragen aan de discussie. Anderen kunnen antwoorden, een emoji plaatsen of zelf een reactie schrijven.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6e0c07cfcb8f1166:
    english: Select **Post Comment** to publish it. Your comment will be visible to anyone who has permission to see the discussion.
    translation: Selecteer **Plaats reactie** om je reactie te publiceren. Iedereen die de discussie mag bekijken, kan je reactie zien.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  edfadd8f1dcac9c4:
    english: The tools described in [Formatting](/en/user_manual/discussions/formatting/) are available when writing comments.
    translation: Bij het schrijven van reacties kun je de hulpmiddelen gebruiken die worden beschreven bij [Opmaak](/en/user_manual/discussions/formatting/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b4dce878f57863ff:
    english: "## Mentioning people"
    translation: "## Mensen vermelden"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  70543178fe9e7b4b:
    english: Type **@**, start typing a person's name, then select them from the list. A mention notifies that person immediately and is a useful way to ask for their attention or response.
    translation: Typ **@**, begin de naam van een persoon te typen en selecteer die persoon in de lijst. De persoon krijgt direct een melding. Zo kun je om aandacht of een reactie vragen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b1d5a5e3d5bb86e3:
    english: "![Mentioning Samira Patel in a comment](../notifying_people/comment_mention.png)"
    translation: "![Samira Patel vermelden in een reactie](../notifying_people/comment_mention.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  07aa88bffb5b1700:
    english: To notify everyone in the group, type **@**, start typing the group name, then select it from the list.
    translation: Wil je iedereen in de groep een melding sturen, typ dan **@**, begin de groepsnaam te typen en selecteer de groep in de lijst.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  794c26be4050ac1b:
    english: "![Searching for Oatmilk Cooperative while writing a group mention](../notifying_people/mentioning_group_1.png)"
    translation: "![Zoeken naar Oatmilk Cooperative bij het schrijven van een groepsvermelding](../notifying_people/mentioning_group_1.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  111625a57c02bc5c:
    english: "![Oatmilk Cooperative selected as a group mention](../notifying_people/mentioning_group_2.png)"
    translation: "![Oatmilk Cooperative geselecteerd als groepsvermelding](../notifying_people/mentioning_group_2.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b4fb3c8390c32e31:
    english: Mentioning someone does not give them access to the thread. Use **Invite people** in the thread sidebar if they are not already a thread member.
    translation: Als je iemand vermeldt, krijgt die persoon daarmee geen toegang tot de thread. Gebruik **Mensen uitnodigen** in de zijbalk van de thread als die persoon nog geen lid van de thread is.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6bba3d93a1845f91:
    english: "## Replying to a comment"
    translation: "## Op een reactie antwoorden"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e7776c198f2f2f48:
    english: Select **Reply** below a comment to respond to it. The reply is prefilled with an @mention of the comment author, which notifies them when you post it. Remove the mention if you do not want to notify them.
    translation: Selecteer **Antwoorden** onder een reactie om erop te reageren. Het antwoord bevat alvast een @vermelding van de schrijver, die een melding krijgt wanneer je het plaatst. Verwijder de vermelding als je die persoon geen melding wilt sturen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eb45d23f7f968858:
    english: You can also reply to your own comment to nest a response beneath it.
    translation: Je kunt ook op je eigen reactie antwoorden om er een antwoord onder te plaatsen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ab1caf06d54d3bcb:
    english: If a Loomio email says you can reply by email, your emailed reply will appear in the thread.
    translation: Als in een e-mail van Loomio staat dat je per e-mail kunt antwoorden, verschijnt je antwoord in de thread.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72d9282ce2bc763a:
    english: "## Reactions"
    translation: "## Emoji-reacties"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1875a303c30b5343:
    english: Use the smiley button to respond with an emoji. Reactions notify the comment author within Loomio but do not send an email.
    translation: Gebruik de smileyknop om met een emoji te reageren. De schrijver van de reactie krijgt hiervan een melding in Loomio, maar geen e-mail.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ce997bcd34b2eae0:
    english: "## Translating comments"
    translation: "## Reacties vertalen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b50a435640652d31:
    english: If the author uses a language other than yours, a **Translate** action appears below the comment.
    translation: Als de schrijver een andere taal gebruikt dan jij, verschijnt **Vertalen** onder de reactie.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9077e2c891750fe8:
    english: Select **Translate comment** to see the comment in your language.
    translation: Selecteer **Reactie vertalen** om de reactie in jouw taal te lezen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  60a885598057c1bf:
    english: "## Comment actions"
    translation: "## Acties voor reacties"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9689ea71da9051d8:
    english: Common actions appear directly below a comment. Additional actions are available from the three-dot menu (**⋯**).
    translation: Veelgebruikte acties staan direct onder een reactie. Meer acties vind je in het menu met drie puntjes (**⋯**).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  88263de7d2158dae:
    english: "### Add a comment to Jump to"
    translation: "### Een reactie toevoegen aan Spring naar"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dd60de0295088aa5:
    english: Use **Pin to timeline** to add a comment to the thread's **Jump to** list.
    translation: Gebruik **Pin vast aan de tijdslijn** om een reactie toe te voegen aan de lijst **Spring naar** van de thread.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  90252c4d66b752d4:
    english: You can edit the label shown in **Jump to**. Unpin and then pin the comment again to change the link text.
    translation: Je kunt het label in **Spring naar** bewerken. Maak de reactie los en pin deze opnieuw vast om de linktekst te wijzigen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  28c2ffaa171b6b1b:
    english: |-
      >[!Tip]
      >Highlight the words you want to use as the link text before selecting **Pin to timeline**.
    translation: |-
      >[!Tip]
      >Markeer de woorden die je als linktekst wilt gebruiken voordat je **Pin vast aan de tijdslijn** selecteert.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7545e856758edb22:
    english: Select **Unpin** to remove the item from **Jump to**.
    translation: Selecteer **Ontprikken** om het item uit **Spring naar** te verwijderen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c3b33d31cbce93c3:
    english: "### Edit a comment and view changes"
    translation: "### Een reactie bewerken en wijzigingen bekijken"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  abaeaac4c1f2c966:
    english: Select **Edit** below one of your comments to change it. Group admins can also edit member comments when the relevant group permission is enabled.
    translation: Selecteer **Bewerken** onder een van je reacties om die te wijzigen. Groepsadmins kunnen ook reacties van leden bewerken als de betreffende groepsmachtiging is ingeschakeld.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  69647eee1f3fcfb7:
    english: An **Edited** action appears below an edited comment.
    translation: Onder een bewerkte reactie verschijnt **Bewerkt**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fcaa0d6329f5c5d4:
    english: Select **Edited** to see what changed. Red highlighting shows removed text and green highlighting shows added text. Loomio records who made each edit and when it was made.
    translation: Selecteer **Bewerkt** om de wijzigingen te bekijken. Verwijderde tekst is rood gemarkeerd en toegevoegde tekst groen. Loomio registreert wie elke wijziging heeft aangebracht en wanneer.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  042b22530d14a486:
    english: 'You can edit a comment when:'
    translation: 'Je kunt een reactie bewerken als:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  afe0ed6535a96b15:
    english: |-
      - you wrote it and the group allows members to edit their comments
      - you are a group admin and [Admins can edit members' comments](/en/user_manual/groups/settings/permissions) is enabled
    translation: |-
      - je de reactie hebt geschreven en de groep leden toestaat hun reacties te bewerken
      - je groepsadmin bent en [Admins kunnen reacties van leden bewerken](/en/user_manual/groups/settings/permissions) is ingeschakeld
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6962d0caeeea20e8:
    english: "### Copy a comment link"
    translation: "### Een link naar een reactie kopiëren"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0fb9e2ebde71573e:
    english: Select **Copy link** to copy the comment's unique URL. You can paste the link elsewhere to refer directly to that comment.
    translation: Selecteer **Link kopieren** om de unieke URL van de reactie te kopiëren. Je kunt de link ergens anders plakken om rechtstreeks naar die reactie te verwijzen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  04e4537024da788c:
    english: "### View notification history"
    translation: "### Meldingsgeschiedenis bekijken"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  957677befce0ab3f:
    english: Open the three-dot menu (**⋯**) beside a comment and select **Notification history**.
    translation: Open het menu met drie puntjes (**⋯**) naast een reactie en selecteer **Meldingsgeschiedenis**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fa9d0f2448239944:
    english: "![Notification history in a comment's actions menu](../notifying_people/comment_notification_history.png)"
    translation: "![Meldingsgeschiedenis in het actiemenu van een reactie](../notifying_people/comment_notification_history.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  30a58d4ef7d80c15:
    english: The notification history shows who was notified about the comment, when the notification was sent, and whether it has been read when that information is available.
    translation: De meldingsgeschiedenis laat zien wie een melding over de reactie kreeg, wanneer die werd verzonden en, als die informatie beschikbaar is, of de melding is gelezen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4f6ead46c3f9759e:
    english: "![Notification history for a comment mentioning Samira Patel](../notifying_people/comment_notification_example.png)"
    translation: "![Meldingsgeschiedenis van een reactie waarin Samira Patel wordt genoemd](../notifying_people/comment_notification_example.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fa2204fb0745dec4:
    english: "### Discard, restore, or delete a comment"
    translation: "### Een reactie weggooien, herstellen of verwijderen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  592dfa766814bb8e:
    english: Discarding a comment removes it from the thread but retains it in a trash bin. You can discard your own comments with **Discard** in the three-dot menu. Group admins can also discard comments.
    translation: Als je een reactie weggooit, verdwijnt die uit de thread maar blijft die in de prullenbak bewaard. Je kunt je eigen reacties weggooien via **Weggooien** in het menu met drie puntjes. Groepsbeheerders kunnen ook reacties weggooien.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  670a46d5274f9ab5:
    english: "**Restore a comment**"
    translation: "**Een reactie herstellen**"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9b202a60d5665ac6:
    english: The location of a discarded comment is labelled **Item removed**. Open its three-dot menu and select **Restore**.
    translation: Op de plek van een weggegooide reactie staat **Item verwijderd**. Open het menu met drie puntjes en selecteer **Herstellen**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d6427576dab2b2c5:
    english: "**Delete a comment**"
    translation: "**Een reactie verwijderen**"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d8b9add122e73295:
    english: Deleting a comment removes it permanently. It cannot be restored.
    translation: Als je een reactie verwijdert, verdwijnt die definitief. Je kunt die niet herstellen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  51f7dce6a0188a51:
    english: If **Members can delete their own comments** is enabled in [Group permissions](/en/user_manual/groups/settings/permissions), members can permanently delete their own discarded comments. Group admins can delete any comment.
    translation: Als **Leden kunnen hun eigen opmerkingen verwijderen** is ingeschakeld bij [Groepsrechten](/en/user_manual/groups/settings/permissions), kunnen leden hun eigen weggegooide reacties definitief verwijderen. Groepsbeheerders kunnen elke reactie verwijderen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  63134f860609d669:
    english: Open the three-dot menu on an **Item removed** entry and select **Delete**.
    translation: Open het menu met drie puntjes bij **Item verwijderd** en selecteer **Delete**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  19580f91a59bf5ef:
    english: A confirmation message explains that the comment will be permanently deleted.
    translation: Een bevestigingsbericht legt uit dat de reactie definitief wordt verwijderd.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
