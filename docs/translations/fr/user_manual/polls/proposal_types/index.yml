  d370759001be4e21:
    english: Polls collect selections, scores, allocations, rankings, availability, or election ballots. Choose the voting method based on what participants need to express and how you intend to use the result. Use a [Proposal](/en/user_manual/polls/proposals/) when people need to respond to a statement or course of action.
    translation: Les sondages permettent de recueillir des choix, des scores, des répartitions de points, des classements, des disponibilités ou des votes lors d’une élection. Choisissez la méthode de vote selon ce que les participants doivent exprimer et l’usage prévu des résultats. Utilisez une [proposition](/en/user_manual/polls/proposals/) lorsque les personnes doivent se prononcer sur une affirmation ou une action envisagée.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1132ff680c7b2562:
    english: "## Simple poll"
    translation: "## Sondage simple"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6b957bf5630c1470:
    english: "[Choose](/en/user_manual/polls/choose/) lets participants select one or more options. Use it to find the most popular option or make a shortlist."
    translation: "[Choisir](/en/user_manual/polls/choose/) permet aux participants de sélectionner une ou plusieurs options. Utilisez cette méthode pour trouver l’option la plus populaire ou établir une présélection."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c982974685e1b5d6:
    english: "## Score poll"
    translation: "## Sondage pondéré"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fbbfe14196388606:
    english: "[Score](/en/user_manual/polls/score/) lets participants rate every option on the same scale. Use it to compare the strength of support, readiness, suitability, or importance across options."
    translation: "[Score](/en/user_manual/polls/score/) permet aux participants d’évaluer chaque option sur la même échelle. Utilisez cette méthode pour comparer le degré de soutien, de préparation, de pertinence ou d’importance des options."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0465fcb48a56ca78:
    english: "## Dot vote"
    translation: "## Vote à points"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ffb7d1711a5fca3b:
    english: "[Allocate](/en/user_manual/polls/allocate/) gives each participant a fixed budget of points to distribute. Use it to identify priorities when choosing one thing means giving less attention or resources to another."
    translation: "[Allouer](/en/user_manual/polls/allocate/) donne à chaque participant un nombre fixe de points à répartir. Utilisez cette méthode pour définir des priorités lorsque choisir une option réduit l’attention ou les ressources accordées à une autre."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a1b15c28fbe526f6:
    english: "## Ranked choice"
    translation: "## Classement par préférence"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8811f455b7ab3821:
    english: "[Rank](/en/user_manual/polls/rank/) lets participants arrange options in order of preference. Use it to find the group's overall preferred order or select one leading option."
    translation: "[Classer](/en/user_manual/polls/rank/) permet aux participants de ranger les options par ordre de préférence. Utilisez cette méthode pour établir l’ordre de préférence du groupe ou choisir l’option qui arrive en tête."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2e21bb1b54b6fcf9:
