  9cfb3b7835dc5cb0:
    english: If some members of your group should have voting rights while others should not, you can use the "Make delegate" feature to identify those people with voting rights. There is a corresponding "Revoke delegate" action too.
    translation: Als sommige leden van je groep stemrecht moeten hebben en andere niet, gebruik je "Maak gedelegeerde" om aan te geven wie mag stemmen. Met "Afgevaardigde intrekken" kun je dat stemrecht weer intrekken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e017eafb51368777:
    english: Use delegates when people should share the same discussion space but only a defined set, such as directors or elected representatives, may vote. This is usually simpler than maintaining a second subgroup whose only purpose is to separate voters from non-voters.
    translation: Gebruik afgevaardigden als iedereen dezelfde ruimte voor discussies deelt, maar alleen een bepaalde groep mag stemmen, zoals bestuurders of gekozen vertegenwoordigers. Dat is meestal eenvoudiger dan een tweede subgroep bijhouden om stemmers van andere leden te scheiden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1942a47ae47ca813:
    english: Use a private subgroup instead when its members also need discussions, files, or membership information that other members must not see.
    translation: Gebruik een besloten subgroep als de leden daarvan ook toegang nodig hebben tot discussies, bestanden of ledengegevens die andere leden niet mogen zien.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
