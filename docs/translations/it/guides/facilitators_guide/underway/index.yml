  1ed397ff049f2888:
    english: "> Singling people out for a contribution will just make them feel like the stupid kid in class who doesn’t know the answer. Instead, a general invite to people who haven’t spoken yet to contribute tells the regular contributors to stay quiet, and gives quieter people the opportunity to step forward. — Silvia Zuur"
    translation: "> Chiedere a una persona in particolare di intervenire può farla sentire come l'alunno che non sa rispondere davanti alla classe. Un invito generale a chi non ha ancora parlato segnala invece a chi interviene spesso di lasciare spazio e dà alle persone più silenziose la possibilità di contribuire. — Silvia Zuur"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2d6c0a7189745fe1:
    english: |-
      * Intervention tools in Loomio include comments, @mentions, adding/removing users, and starting/deleting discussions. These can be employed for various forms of supportive and assertive interventions.
      * The most commonly used intervention is the comment — simply talking to the group and inviting or trying to reduce certain behaviour.
      * [Participation permissions](/en/user_manual/groups/settings/#permissions) offer relatively blunt but effective tools to moderate users, such as allowing or disallowing posting discussions or proposals.
      * Loomio offers some trust-based features that other tools lack, such as the default ability for all participants to edit discussion contexts (even if it was posted originally by another user). These are inspired by things like Wikipedia and open source software development.
    translation: |-
      * Su Loomio, gli strumenti per intervenire comprendono commenti, @menzioni, aggiunta o rimozione di utenti e avvio o eliminazione di discussioni. Possono essere usati sia per interventi di sostegno sia per interventi decisi.
      * L'intervento più comune è un commento: puoi rivolgerti al gruppo per incoraggiare o cercare di limitare un comportamento.
      * I [permessi di partecipazione](/en/user_manual/groups/settings/#permissions) offrono strumenti semplici ma efficaci per moderare gli utenti, per esempio consentendo o impedendo l'avvio di discussioni o proposte.
      * Loomio offre funzioni basate sulla fiducia che mancano in altri strumenti. Per impostazione predefinita, tutti i partecipanti possono modificare il contesto di una discussione, anche se è stato scritto da un'altra persona. Questa scelta si ispira a progetti come Wikipedia e allo sviluppo di software open source.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
