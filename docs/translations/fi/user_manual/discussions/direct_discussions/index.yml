  b3ed13f5612f4ff9:
    english: A direct discussion is a private discussion for a specific set of people.
    translation: Suora keskustelu on yksityinen keskustelu tietylle joukolle ihmisiä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  479f7faed056ab51:
    english: A direct discussion does not belong to a group. Invited people do not need to be a member of your Loomio group.
    translation: Suora keskustelu ei kuulu ryhmään. Kutsuttujen ei tarvitse olla Loomio-ryhmäsi jäseniä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2f5362faecc07fa0:
    english: You control who can see and participate by adding people or email addresses to the **Invite** field.
    translation: Määrität, ketkä voivat nähdä keskustelun ja osallistua siihen, lisäämällä ihmisiä tai sähköpostiosoitteita **Kutsu**-kenttään.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f31343ea54b4f899:
    english: Direct discussions support the same comments, polls and other tools as group discussions. They can be useful when creating a subgroup is unnecessary.
    translation: Suorissa keskusteluissa voi käyttää samoja kommentteja, kyselyitä ja muita työkaluja kuin ryhmäkeskusteluissa. Ne sopivat tilanteisiin, joissa alaryhmää ei tarvita.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
