  4e03229937f959ed:
    english: "## Outcomes & Next Steps"
    translation: "## Conclusiones y próximos pasos"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  eaf0fe98db301c7f:
    english: 'Confirming the outcome can be critical to feel like the goals of a collaborative discussion have been achieved. A facilitator can pull together what’s been decided and reflect it back, to help the group walk away with the answers to some key questions:'
    translation: 'Confirmar la conclusión puede ayudar al grupo a reconocer que ha alcanzado los objetivos de una discusión colaborativa. Quien facilita puede reunir lo que se ha decidido y compartir un resumen para que el grupo termine con respuestas a algunas preguntas clave:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  00ed94f662c9643a:
    english: |-
      * What did we do?
      * What does it mean?
      * What will happen now?
      * What is my responsibility?
      * What will be different because we went through this experience?
    translation: |-
      * ¿Qué hicimos?
      * ¿Qué significa?
      * ¿Qué pasará ahora?
      * ¿Cuál es mi responsabilidad?
      * ¿Qué cambiará gracias a esta experiencia?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0f9ecf512b4990b7:
    english: Sometimes the answers to these questions are very concrete, such as action points, while other times they are more abstract, such as deepening shared understanding.
    translation: A veces las respuestas son concretas, como las tareas pendientes. Otras veces son más abstractas, como una comprensión compartida más profunda.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aabfa9d842af2688:
    english: On Loomio
    translation: En Loomio
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a63bbb12b1a1e04c:
    english: |-
      * [Outcomes](/en/user_manual/polls/outcomes/) are a very important tool. A proposal ending is not quite the end: there’s a need to sum up conclusively. That's what the outcome feature is for.
      * Many Loomio discussions come to a natural end without even using proposals or publishing outcomes. These discussions still provide a lot of value, and it can be helpful to update the context box with an outcome summary for later reference.
      * If specific people have action points, you can @mention their names and they will be notified.
    translation: |-
      * Las [conclusiones](/en/user_manual/polls/outcomes/) son una herramienta importante. Que termine una propuesta no significa que el proceso haya concluido: todavía hace falta resumir lo acordado. Para eso sirve la función de conclusiones.
      * Muchas discusiones de Loomio terminan de forma natural sin usar propuestas ni publicar conclusiones. Aun así, aportan valor. Puede ser útil actualizar el cuadro de contexto con un resumen de la conclusión para consultarlo más adelante.
      * Si algunas personas tienen tareas pendientes, puedes @mencionar sus nombres para que reciban una notificación.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  55a9b345194f80d6:
    english: "## Reporting & Harvesting"
    translation: "## Documentar y recoger lo aprendido"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fc6ee28887dd5ab1:
    english: To understand the meaning of an experience, you have to inquire into how it fits into the bigger context. What was this moment, in the bigger rhythm of our progress? What form will our understanding from this experience take — a story, a report, a change, a call to action?
    translation: 'Para entender el significado de una experiencia, piensa cómo encaja en un contexto más amplio. ¿Qué representó este momento en el avance del grupo? ¿Qué forma tomará lo aprendido: una historia, un informe, un cambio o una llamada a la acción?'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  eb2cdc1c6526e053:
    english: The experience happens in the moment, but its impact often comes from putting handles on it, giving it a name, and being able to use it and refer to it. Otherwise you risk forgetting, leaving people out who weren't there, or having to repeat it later. Productive collaboration is often helped by tangible documentation or reporting.
    translation: La experiencia ocurre en un momento concreto, pero su impacto suele depender de que podamos darle un nombre, usarla y hacer referencia a ella. De lo contrario, podemos olvidarla, dejar fuera a quienes no estuvieron presentes o tener que repetirla después. La documentación y los informes concretos suelen favorecer una colaboración productiva.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4104d8b917a87b0e:
    english: |-
      * Loomio is self-documenting — notes write themselves as an integrated part of the process. This creates a gold-mine of archival content for groups, without any extra effort.
      * We have some features to support harvesting and archiving: the search function, the “previous decisions” list, and the print discussion option.
      * Premium plans offer the option to export all your group's Loomio data.
      * Many groups use Loomio to integrate content from various channels. For example, posting a meeting announcement and building the agenda on Loomio, having the meeting in person, posting the notes back on Loomio, and making related decisions in the same thread. This expands the “self-harvesting” ability of Loomio beyond the online space.
    translation: |-
      * Loomio documenta el proceso a medida que ocurre: las notas quedan registradas como parte de él. Así, los grupos crean un archivo de contenido sin trabajo adicional.
      * Hay varias funciones para recoger y archivar lo aprendido: la búsqueda, la lista de «decisiones anteriores» y la opción de imprimir la discusión.
      * Los planes Premium permiten exportar todos los datos de tu grupo en Loomio.
      * Muchos grupos usan Loomio para reunir contenido de distintos canales. Por ejemplo, anuncian una reunión y preparan el orden del día en Loomio, se reúnen en persona, publican las notas en Loomio y toman las decisiones relacionadas en el mismo hilo. Así pueden documentar en Loomio también lo que ocurre fuera de internet.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dae98cfd5f14b034:
    english: "## Turning Discussion into Action"
    translation: "## Llevar la discusión a la acción"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a39a66938d6cadb0:
    english: There comes a moment when you have to re-engage with the reality outside the room. Occasionally, the need is simply to work with ideas and feelings, without worrying about implementation. But usually a group will not reach its goals without applying its conclusions to real-world action. This transition is part of the total facilitated experience.
    translation: Llega un momento en que hay que volver a la realidad fuera del espacio de discusión. A veces basta con explorar ideas y sentimientos sin preocuparse por ponerlos en práctica. Pero, por lo general, un grupo necesita convertir sus conclusiones en acciones para alcanzar sus objetivos. Esta transición forma parte del proceso facilitado.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3e26f1939ffe69fe:
    english: 'It’s at this point that a collaborative process intersects with other organizational systems, and the facilitator has to help figure out how it will work. These other systems might include:'
    translation: 'En ese momento, el proceso colaborativo se encuentra con otros sistemas de la organización. Quien facilita debe ayudar a definir cómo se relacionarán. Esos sistemas pueden incluir:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cb030c5876714643:
    english: |-
      * **Power** — Who actually makes decisions? What has to happen for ideas to turn into reality here?
      * **Management** — How does this fit into other priorities? What dependencies might exist?
      * **Delegation** — Who will take responsibility for next steps? Will they be held accountable?
      * **Communication** — How will this process or discussion be relayed to others? What do they need to know?
      * **Administration** — How will information from one system be input into another, such as a task tracking or communications tool? Where will information be stored?
    translation: |-
      * **Poder** — ¿Quién toma realmente las decisiones? ¿Qué tiene que ocurrir para que las ideas se hagan realidad?
      * **Gestión** — ¿Cómo encaja esto con las demás prioridades? ¿De qué otras tareas depende?
      * **Delegación** — ¿Quién asumirá la responsabilidad de los próximos pasos? ¿Cómo rendirá cuentas?
      * **Comunicación** — ¿Cómo se comunicará este proceso o discusión a otras personas? ¿Qué necesitan saber?
      * **Administración** — ¿Cómo se trasladará la información de un sistema a otro, como una herramienta de seguimiento de tareas o de comunicación? ¿Dónde se guardará?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5fd6382726e6e5c0:
    english: If there are any blocks around these issues, it can be damaging to leave this realisation until the moment of conclusion. For example, if the participants don’t actually have the power to make a change they have decided, they will feel defeated.Think ahead toward confronting reality when setting up the process, and scope the collaboration accordingly.
    translation: Si hay obstáculos relacionados con estas cuestiones, puede ser perjudicial descubrirlos al final. Por ejemplo, si quienes participan no tienen autoridad para llevar a cabo el cambio que han decidido, pueden sentirse desalentados. Ten en cuenta estas condiciones al diseñar el proceso y define el alcance de la colaboración en consecuencia.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c3f96d2ea17ab236:
    english: |-
      * You can @mention the names of people who will take actions out of a decision.
      * Many users accomplish integrating Loomio content into other organizational systems through other channels like reviewing Loomio decisions in regular offline meetings, or transferring outcomes to their task tracking process.
      * Making an explicit decision naturally leads people to ask, “OK, but how are we going to take this forward?”
      * Forming a Loomio group often surfaces important questions like, “Who needs to participate here to turn these decisions into action?” If you're missing key stakeholders, leaders, or administrators, you'll get stuck.
    translation: |-
      * Puedes @mencionar a las personas que llevarán a cabo las acciones derivadas de una decisión.
      * Muchos usuarios integran el contenido de Loomio en otros sistemas de la organización por distintos medios. Por ejemplo, revisan las decisiones de Loomio en reuniones presenciales periódicas o trasladan las conclusiones a su sistema de seguimiento de tareas.
      * Tomar una decisión explícita lleva de forma natural a preguntar: «Bien, ¿cómo vamos a llevarla adelante?».
      * Crear un grupo en Loomio suele plantear preguntas importantes, como «¿Quién tiene que participar para convertir estas decisiones en acciones?». Si faltan personas clave, responsables o administradores, el proceso puede quedar bloqueado.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  60bb517775f11e5d:
    english: "## It Ain’t Over Til It’s Over"
    translation: "## Cerrar el proceso"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '079da8800a401a45':
    english: Ending well is important. There’s a ritual to closing a process, and if it’s missed people will feel unsettled. Sometimes the end is determined by running out of time, and sometimes it’s when certain goals are achieved. Recognize implicit and explicit cues indicating if the individuals, and the group as a whole, can feel completion of a process or phase.
    translation: Es importante cerrar bien un proceso. El cierre suele tener sus propios pasos, y omitirlos puede dejar a las personas con la sensación de que algo quedó pendiente. A veces el proceso termina porque se acaba el tiempo; otras, porque se han alcanzado ciertos objetivos. Presta atención a las señales, explícitas o no, de que cada persona y el grupo en conjunto sienten que una fase o un proceso ha concluido.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  280969e6212842cc:
    english: Participants often look to the leader or facilitator for confirmation of when it’s actually over, and it usually pays to be explicit. Sometimes the signal is a clear statement that the session is wrapping up, a recap of decisions or next steps, and bidding everyone goodbye. Other times groups have established practices like a check-out. Letting a session vaguely trail off will leave a bad taste.
    translation: Quienes participan suelen esperar que la persona que lidera o facilita confirme cuándo termina el proceso. Conviene decirlo con claridad. A veces basta con anunciar que la sesión está terminando, repasar las decisiones o los próximos pasos y despedirse. Otros grupos tienen prácticas establecidas, como una ronda de cierre. Dejar que una sesión se apague sin un cierre claro puede causar una mala impresión.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e15896aadc163225:
    english: |-
      * The clearest indication of conclusion on Loomio is publishing a decision outcome.
      * Some groups use the [lock thread](/en/user_manual/discussions/using_discussions/#lock-or-unlock-a-thread) feature to prevent further changes and reduce clutter.
      * Deactivating a group is the strongest possible “closure” move. No one can say anything else after that.
      * Since Loomio groups can remain while group activity goes up and down, it can be useful to recognize milestones like the conclusion of a particular phase, even if the group will reactivate in the future.
    translation: |-
      * La señal más clara de que algo ha concluido en Loomio es publicar la conclusión de una decisión.
      * Algunos grupos usan la función de [bloquear hilo](/en/user_manual/discussions/using_discussions/#lock-or-unlock-a-thread) para impedir nuevos cambios y reducir el desorden.
      * Desactivar un grupo es la forma más definitiva de cerrarlo. Después, nadie puede añadir nada más.
      * Los grupos de Loomio pueden mantenerse aunque su actividad varíe. Por eso puede ser útil reconocer hitos como el cierre de una fase, incluso si el grupo vuelve a activarse más adelante.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
