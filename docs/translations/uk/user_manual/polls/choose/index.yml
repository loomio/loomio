---
navigation_title: Виберіть
blocks:
  581de5d50d3dc442:
    english: "# Choose"
    translation: "# Виберіть"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  733b320e0407fbdc:
    english: Choose is a simple poll for finding the most popular option or making a shortlist. Participants select one or more options, depending on the limits you set. This voting method is commonly known as multiple choice.
    translation: "«Виберіть» — просте опитування, яке допомагає знайти найпопулярніший варіант або скласти короткий список. Учасники вибирають один чи кілька варіантів залежно від установлених вами обмежень. Цей спосіб голосування зазвичай називають голосуванням із кількома варіантами відповіді."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '09aefb579b50874b':
    english: "## When to use Choose"
    translation: "## Коли використовувати «Виберіть»"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  be35cf72fcaf9c4d:
    english: 'Use Choose when the options are distinct and you need to count how many people select each one. It works well for:'
    translation: 'Використовуйте «Виберіть», коли варіанти чітко відрізняються і потрібно підрахувати, скільки людей вибрали кожен із них. Наприклад, щоб:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dcc6f6b9238155b2:
    english: |-
      - choosing one venue from a shortlist;
      - selecting up to three topics for an agenda;
      - deciding which design should proceed to the next round; or
      - checking which services members intend to use.
    translation: |-
      - вибрати одне місце проведення з короткого списку;
      - вибрати до трьох тем для порядку денного;
      - визначити, який дизайн перейде до наступного етапу; або
      - дізнатися, якими послугами планують користуватися учасники групи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3770d0653b752de5:
    english: Choose records selections, not the strength or order of a person's preferences. Use [Score](/en/user_manual/polls/score/) to measure how strongly people support every option, [Allocate](/en/user_manual/polls/allocate/) when there is a limited budget, or [Rank](/en/user_manual/polls/rank/) when preference order matters.
    translation: "«Виберіть» фіксує вибрані варіанти, але не показує силу вподобань людини чи їхній порядок. Використовуйте [«Оціночне опитування»](/en/user_manual/polls/score/), щоб виміряти рівень підтримки кожного варіанта, [«Виділити»](/en/user_manual/polls/allocate/), коли бюджет обмежений, або [«Ранг»](/en/user_manual/polls/rank/), коли важливий порядок уподобань."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f15aca327e894f30:
    english: "## Example: set a planning-meeting agenda"
    translation: "## Приклад: складання порядку денного планової зустрічі"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f51e09afa0ed1e53:
    english: Oatmilk Cooperative needs to decide which parts of a returnable-bottle trial need the most time at its next planning meeting. The poll asks each person to choose up to two topics. Its details explain how the result will be used, and each option includes enough information to distinguish it from the others.
    translation: Кооператив Oatmilk має вирішити, яким аспектам випробування поворотних пляшок приділити найбільше часу на наступній плановій зустрічі. В опитуванні кожна людина може вибрати до двох тем. У деталях пояснено, як використають результати, а описи варіантів дають змогу відрізнити їх один від одного.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c74ebb16f872b3c6:
    english: "## Set up the poll"
    translation: "## Налаштуйте опитування"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  abc749fec8671661:
    english: Give the poll a specific question as its title. In **Details**, explain what participants should consider and what will happen with the result. Add each available option, then set the **Minimum choices** and **Maximum choices**.
    translation: Сформулюйте конкретне запитання як назву опитування. У полі **Деталі** поясніть, що учасникам слід врахувати і як використають результати. Додайте всі доступні варіанти, а потім установіть **Мінімальний вибір** і **Максимальний вибір**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e878ddc9f61dd243:
    english: Set both limits to 1 when participants must choose exactly one option. Set a higher maximum when you want a shortlist. Avoid allowing so many choices that participants can select nearly every option, because that makes the result less useful.
    translation: 'Установіть обидва обмеження на 1, якщо учасники мають вибрати рівно один варіант. Установіть вищий максимум, якщо хочете скласти короткий список. Не дозволяйте вибирати майже всі варіанти: так результати будуть менш корисними.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  152fec5018fc232b:
    english: Use the pencil icon beside an option to add a meaning or further explanation. This is useful when a short option name could be interpreted in different ways.
    translation: Щоб пояснити значення варіанта або додати подробиці, натисніть значок олівця поруч із ним. Це корисно, якщо коротку назву варіанта можна зрозуміти по-різному.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  59e405cf9a028c8d:
    english: Under **More settings**, **Show options in random order** can reduce the effect of always presenting one option first.
    translation: У розділі **Більше налаштувань** параметр **Показати параметри у випадковому порядку** допомагає зменшити вплив того, що один із варіантів завжди стоїть першим.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Проголосуйте"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7db2d0e58e5fb4e4:
    english: The vote form tells participants how many options they may select. In this example, the voter selects **Cafe collection schedule** and **Washing workflow**, then gives a reason connecting those choices to the trial.
    translation: Форма голосування показує учасникам, скільки варіантів вони можуть вибрати. У цьому прикладі учасник вибирає **Графік збору пляшок у кафе** і **Процес миття**, а потім пояснює, як цей вибір пов’язаний із випробуванням.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e55e4b8950a5fd46:
    english: A reason can reveal why an option matters and what work participants expect it to cover. If reasons are important to the decision, configure the vote-reason setting before starting the poll.
    translation: Пояснення може показати, чому варіант важливий і яку роботу, на думку учасників, він охоплює. Якщо пояснення важливі для рішення, налаштуйте вимоги до них до початку опитування.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Перегляньте результати"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c1ec47f66384e3bb:
    english: The results show the share of all selections received by each option, the number of voters who selected it, and who has not voted. Because each person could choose two options, the percentages describe selections rather than a percentage of people.
    translation: Результати показують частку кожного варіанта серед усіх виборів, кількість людей, які його вибрали, і тих, хто ще не проголосував. Оскільки кожна людина могла вибрати два варіанти, відсотки стосуються виборів, а не людей.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6cbc0f9d6fdf6727:
    english: In this example, **Cafe collection schedule** has three selections. **Washing workflow** and **Return-rate reporting** each have two. The result supports giving cafe collections the most agenda time, but the tied topics still require the organizer to decide how the remaining time is divided.
    translation: У цьому прикладі **Графік збору пляшок у кафе** вибрали тричі. **Процес миття** і **Звітність щодо повернення пляшок** вибрали по два рази. Результати свідчать, що збору пляшок у кафе варто приділити найбільше часу. Організатору ще потрібно вирішити, як розподілити решту часу між темами з однаковою кількістю голосів.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  adb7eb28e16616be:
    english: When the poll closes, publish an **Outcome** explaining what the group will do with the result.
    translation: Після закриття опитування опублікуйте **Висновок** і поясніть, як група використає результати.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
