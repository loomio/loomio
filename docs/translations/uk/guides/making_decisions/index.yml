  b27fab33a1dd5176:
    english: 'These guides explain complete decision processes: how to frame a decision, involve the right people, use discussion and proposals, respond to concerns, and record an outcome.'
    translation: 'Ці посібники пояснюють увесь процес ухвалення рішення: як сформулювати питання, залучити потрібних людей, обговорити його й використати пропозиції, відповісти на зауваження та записати висновок.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bcbe5e3fd75700a6:
    english: They are different from the proposal-template pages. A [proposal template](/en/user_manual/polls/proposals/) explains one proposal and its response options. A decision process can use several proposals over time.
    translation: Ці посібники відрізняються від сторінок про шаблони пропозицій. [Шаблон пропозиції](/en/user_manual/polls/proposals/) пояснює окрему пропозицію та варіанти відповіді на неї. Протягом процесу ухвалення рішення можна використати кілька пропозицій.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  af00d65d38e41f8b:
    english: "## Choose a process"
    translation: "## Виберіть процес"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f41e345421a1a1e8:
    english: |-
      | Process | Who decides? | Main question |
      |---|---|---|
      | [Simple decision process](simple_decision_process) | Defined by the group | How can we discuss, test, and decide? |
      | [Advice process](advice_process) | A person or delegated team | What advice should the decision maker consider? |
      | [Consent process](consent_process) | The group | Is the proposal safe to try without a meaningful objection? |
      | [Consensus process](consensus_process) | The group | Can we reach collective agreement? |
    translation: |-
      | Процес | Хто ухвалює рішення? | Головне питання |
      |---|---|---|
      | [Простий процес ухвалення рішення](simple_decision_process) | Визначає група | Як обговорити питання, перевірити варіанти й ухвалити рішення? |
      | [Процес із порадами](advice_process) | Одна людина або уповноважена команда | Які поради варто врахувати тому, хто ухвалює рішення? |
      | [Процес ухвалення рішення за згодою](consent_process) | Група | Чи можна спробувати реалізувати пропозицію без суттєвих заперечень? |
      | [Процес досягнення консенсусу](consensus_process) | Група | Чи можемо ми дійти спільної згоди? |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d2843889568043c0:
    english: Use the process required by your group's governing rules or decision policy. Different kinds of decisions may use different processes.
    translation: Використовуйте процес, передбачений правилами вашої групи або її порядком ухвалення рішень. Для різних типів рішень можуть підходити різні процеси.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bb120914edd79d13:
    english: If you only need help choosing a response format, compare [Proposals](/en/user_manual/polls/proposals/) and [Polls](/en/user_manual/polls/proposal_types/). If you administer the reusable choices shown when someone selects **Start a vote**, see [Poll templates](/en/user_manual/polls/poll_templates/).
    translation: Якщо вам потрібно лише вибрати формат відповіді, порівняйте [Пропозиції](/en/user_manual/polls/proposals/) та [Опитування](/en/user_manual/polls/proposal_types/). Якщо ви керуєте варіантами, які можна використовувати повторно і які з’являються після вибору **Розпочати голосування**, перегляньте [Шаблони опитувань](/en/user_manual/polls/poll_templates/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
