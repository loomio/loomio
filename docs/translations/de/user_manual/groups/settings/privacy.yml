navigation_title: Datenschutz
blocks:
  946f29d3bdb2e2af:
    english: "# Group privacy"
    translation: "# Datenschutz der Gruppe"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6a2fbb3e7cecad6e:
    english: Privacy controls who can find a group and who can read its content. Open **Edit group settings** from the group page, then select **Privacy**.
    translation: Die Datenschutzeinstellung bestimmt, wer eine Gruppe finden und ihre Inhalte lesen kann. Öffne auf der Gruppenseite **Gruppeneinstellungen bearbeiten** und wähle **Datenschutz**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bf79bc420fc36377:
    english: "![Group privacy settings](group_privacy_settings.png#width-90)"
    translation: "![Datenschutzeinstellungen der Gruppe](group_privacy_settings.png#width-90)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4d275c75fe1a2c77:
    english: Changing privacy can expose or hide existing group content, not only content created afterward. Choose the most restrictive setting that still supports the group's purpose.
    translation: Wenn du die Datenschutzeinstellung änderst, können auch bestehende Gruppeninhalte sichtbar oder verborgen werden. Wähle die strengste Einstellung, die noch zum Zweck der Gruppe passt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7510b0e8a0fcf7b3:
    english: "## Open"
    translation: "## Offen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f202c6fba754adaa:
    english: Open groups are public spaces. Anyone can find the group and read its discussions, polls, and files. The member list remains visible only to members.
    translation: Offene Gruppen sind öffentlich. Alle können die Gruppe finden und ihre Diskussionen, Umfragen und Dateien lesen. Die Mitgliederliste können nur Mitglieder sehen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c8d2b41a601ed65e:
    english: Open groups can allow people to join immediately, require approval, or remain invitation only.
    translation: Offene Gruppen können den sofortigen Beitritt erlauben, eine Genehmigung verlangen oder nur auf Einladung zugänglich sein.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f07a1c59f30e5fea:
    english: "### Follow an Open group"
    translation: "### Einer offenen Gruppe folgen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d6f9ee2eb742720e:
    english: People can stay up to date with an Open group without joining. Following adds unread group activity to their catch-up email so they can review it in their own time. Followers do not become members, receive member voting rights, or receive immediate notifications just because they follow the group.
    translation: Du kannst über eine offene Gruppe auf dem Laufenden bleiben, ohne ihr beizutreten. Wenn du der Gruppe folgst, erscheinen ungelesene Gruppenaktivitäten in deiner Zusammenfassungs-E-Mail. So kannst du sie lesen, wann es dir passt. Dadurch wirst du kein Mitglied, erhältst kein Stimmrecht als Mitglied und bekommst nicht automatisch sofortige Benachrichtigungen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  17cb84d9141c9728:
    english: Turn on **Follow updates** on the group page to include its unread discussions, comments, polls, and other thread activity in your catch-up. Turn the setting off to stop including the group.
    translation: Aktiviere **Folge den Aktualisierungen** auf der Gruppenseite, damit ungelesene Diskussionen, Kommentare, Umfragen und andere Aktivitäten in Threads in deiner Zusammenfassung erscheinen. Deaktiviere die Einstellung, um die Gruppe nicht mehr in die Zusammenfassung aufzunehmen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b0c06651e8c0df2b:
    english: "![Follow updates on an Open group](group_follow_updates.png)"
    translation: "![Aktualisierungen einer offenen Gruppe folgen](group_follow_updates.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c5becc4d01b10f3:
    english: "## Closed"
    translation: "## Geschlossen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eaf6878c89438b53:
    english: Anyone can find a Closed group and read its name and description. Discussions, polls, files, and the member list are private to members and invited guests.
    translation: Alle können eine geschlossene Gruppe finden und ihren Namen und ihre Beschreibung lesen. Diskussionen, Umfragen, Dateien und die Mitgliederliste sind nur für Mitglieder und eingeladene Gäste sichtbar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ab7851d3b88d4e27:
    english: Closed groups can let people request membership or remain invitation only. They cannot let people join immediately without approval.
    translation: Geschlossene Gruppen können Beitrittsanfragen zulassen oder nur auf Einladung zugänglich sein. Ein sofortiger Beitritt ohne Genehmigung ist nicht möglich.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e2f094fc6e490216:
    english: A Closed subgroup of a parent group can optionally allow members of the parent group to read its discussions without joining the subgroup.
    translation: Eine geschlossene Untergruppe kann Mitgliedern der übergeordneten Gruppe erlauben, ihre Diskussionen zu lesen, ohne der Untergruppe beizutreten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9c21e144af9492a6:
    english: "## Secret"
    translation: "## Geheim"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6a9871bdd7fde747:
    english: Secret groups and their content are visible only to people who have been invited or added. Membership is invitation only. Secret groups do not appear in the public group directory.
    translation: Geheime Gruppen und ihre Inhalte sind nur für Personen sichtbar, die eingeladen oder hinzugefügt wurden. Der Beitritt ist nur auf Einladung möglich. Geheime Gruppen erscheinen nicht im öffentlichen Gruppenverzeichnis.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  405ac2846a65b06c:
    english: "## How people join"
    translation: "## So treten Personen bei"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c7aebb687bbffbf:
    english: 'Privacy determines which joining options are available:'
    translation: 'Die Datenschutzeinstellung bestimmt, welche Beitrittsmöglichkeiten verfügbar sind:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a6a7608fe4510b67:
    english: |-
      | Group privacy | Available joining options |
      | --- | --- |
      | **Open** | Anyone can join, request approval, or invitation only |
      | **Closed** | Request approval or invitation only |
      | **Secret** | Invitation only |
    translation: |-
      | Datenschutz der Gruppe | Verfügbare Beitrittsmöglichkeiten |
      | --- | --- |
      | **Offen** | Sofortiger Beitritt, Beitrittsanfrage oder nur auf Einladung |
      | **Geschlossen** | Beitrittsanfrage oder nur auf Einladung |
      | **Geheim** | Nur auf Einladung |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  473a620db15dff75:
    english: When approval is required, people select **Join group**, answer the group's joining prompt, and send a request to join. See [Inviting people](/en/user_manual/groups/inviting_people#request-to-join-group) for instructions on configuring the prompt, reviewing requests, and inviting people directly.
    translation: Wenn eine Genehmigung erforderlich ist, wählen Personen **Der Gruppe beitreten**, beantworten die Beitrittsfrage der Gruppe und senden eine Beitrittsanfrage. Unter [Personen einladen](/en/user_manual/groups/inviting_people#request-to-join-group) erfährst du, wie du die Frage einrichtest, Anfragen prüfst und Personen direkt einlädst.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4c02de0d4580f7e6:
    english: "## Group directory"
    translation: "## Gruppenverzeichnis"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2dc848ec1af0064e:
    english: Open and Closed parent groups can be listed in the public group directory so people can discover them. Directory listing does not change who can read group content or become a member. Subgroups and Secret groups cannot be listed.
    translation: Offene und geschlossene Hauptgruppen können im öffentlichen Gruppenverzeichnis aufgeführt werden, damit andere sie finden. Der Eintrag im Verzeichnis ändert nicht, wer Gruppeninhalte lesen oder Mitglied werden kann. Untergruppen und geheime Gruppen können dort nicht aufgeführt werden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
