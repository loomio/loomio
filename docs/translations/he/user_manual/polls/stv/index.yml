  366f56443108e10f:
    english: "**Single Transferable Vote (STV)** is a proportional representation voting method for electing multiple winners from a field of candidates. It ensures that elected candidates proportionally represent the diversity of views among voters."
    translation: "**הקול היחיד הנייד (STV)** הוא שיטת הצבעה לייצוג יחסי, שבה נבחרים כמה מועמדים. השיטה מאפשרת לנבחרים לייצג באופן יחסי את מגוון העמדות של המצביעים."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  61dee55b45038f56:
    english: "## When to use STV"
    translation: "## מתי להשתמש ב-STV"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8311dca26cec6519:
    english: 'Use an STV Election when you need to:'
    translation: 'בחירות STV מתאימות כאשר יש צורך:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1d4338734ec6e113:
    english: |-
      - Elect a **committee, board, or slate of delegates** from a pool of nominees
      - Ensure **proportional representation**, where minority factions can win seats proportional to their support
      - Run elections where voters rank candidates by preference
    translation: |-
      - לבחור **ועדה, דירקטוריון או קבוצת נציגים** מתוך מאגר מועמדים
      - להבטיח **ייצוג יחסי**, כך שגם קבוצות מיעוט יוכלו לזכות במושבים בהתאם לתמיכה בהן
      - לערוך בחירות שבהן המצביעים מדרגים מועמדים לפי העדפה
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e6e1ae026f65a715:
    english: |-
      >[!NOTE]
      >STV is **not** the same as Loomio's [Rank poll](/en/user_manual/polls/rank/), which is a simpler score-based ranking for choosing a single best option. STV handles multi-winner elections with vote transfers and elimination rounds.
    translation: |-
      >[!NOTE]
      >STV שונה מ[סקר דירוג](/en/user_manual/polls/rank/) של Loomio, שבו מדרגים אפשרויות לפי ניקוד כדי לבחור אפשרות אחת. בבחירות STV נבחרים כמה מועמדים באמצעות העברת קולות וסבבי הדחה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  62af8f95f18dbafe:
    english: "## Creating an STV Election"
    translation: "## יצירת בחירות STV"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  edf2f36e75c81665:
    english: When starting a poll, select **STV Election** as the poll type, then add the candidates as the poll options. You can customize the poll by setting the **number of seats**, the **counting method**, and the **quota type**.
    translation: בעת פתיחת משאל, יש לבחור **בחירות STV** כסוג המשאל ולהוסיף את המועמדים כאפשרויות. ניתן להתאים את הבחירות באמצעות הגדרת **מספר המושבים**, **שיטת הספירה** ו**סוג המכסה**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b40ddcfb8cdc44fd:
    english: In this example, Oatmilk Cooperative is electing three people to oversee its returnable packaging trial. The form explains the role, lists five candidates, and uses Scottish STV with the Droop quota.
    translation: בדוגמה זו, קואופרטיב Oatmilk בוחר שלושה אנשים שיפקחו על ניסוי באריזות הניתנות להחזרה. הטופס מסביר את התפקיד, מציג חמישה מועמדים ומשתמש בשיטת Scottish STV עם מכסת Droop.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a34592929349d06:
    english: "### Number of seats"
    translation: "### מספר המושבים"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c09f5f51333612dc:
    english: How many winners should be elected. Must be less than the number of candidates.
    translation: מספר המועמדים שייבחרו. המספר חייב להיות קטן ממספר המועמדים.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ddceec01d910b152:
    english: "### Counting method"
    translation: "### שיטת הספירה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  39e9e81a89272771:
    english: 'There are two available methods for counting the votes:'
    translation: 'קיימות שתי שיטות לספירת הקולות:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a7031d1180e95273:
    english: |-
      Scottish STV
        : Recommended. The Weighted Inclusive Gregory Method (WIGM) used in Scottish local elections since 2007. Well-defined, straightforward rules. Best for most organizations.
    translation: |-
      Scottish STV
        : השיטה המומלצת. שיטת גרגורי המשוקללת והכוללת (WIGM), המשמשת בבחירות לרשויות מקומיות בסקוטלנד מאז 2007. כלליה ברורים ופשוטים, והיא מתאימה לרוב הארגונים.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1507e4fde88848dd:
    english: |-
      Meek STV
        : A more mathematically precise iterative method. When a candidate is eliminated, votes are recounted as if that candidate was never in the race.
    translation: |-
      Meek STV
        : שיטה איטרטיבית מדויקת יותר מבחינה מתמטית. כאשר מועמד מודח, הקולות נספרים מחדש כאילו לא השתתף בבחירות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b9abcd12eef5f629:
    english: "### Quota type"
    translation: "### סוג המכסה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6dc3aea49266d40d:
    english: 'The quota is the minimum number of votes a candidate needs to win a seat. It can be either:'
    translation: 'המכסה היא מספר הקולות המינימלי הדרוש למועמד כדי לזכות במושב. ניתן לבחור באחד משני סוגים:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  88f62f286d8c550f:
    english: |-
      Droop
        : Recommended. The standard quota type for most STV elections, and used by Ireland, Australia, and Scotland. Droop guarantees a majority coalition wins a majority of seats. It is calculated as:
      \\[ floor(\frac{votes}{(seats + 1)}) + 1 \\]
    translation: |-
      Droop
        : המכסה המומלצת. זהו סוג המכסה המקובל ברוב בחירות STV, והוא משמש באירלנד, באוסטרליה ובסקוטלנד. מכסת Droop מבטיחה שקואליציה הנתמכת בידי רוב המצביעים תזכה ברוב המושבים. כך היא מחושבת:
      \\[ floor(\frac{votes}{(seats + 1)}) + 1 \\]
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  817b3994e92898e8:
    english: |-
      Hare
        : A higher minimum threshold, and more proportional for smaller factions.
          Hare is preferred by DSA chapters to protect minority representation.
         It is calculated as:
          \\[ \frac{votes}{seats}\\]
    translation: |-
      Hare
        : רף מינימלי גבוה יותר, המעניק ייצוג יחסי רב יותר לקבוצות קטנות.
          סניפים של DSA מעדיפים את מכסת Hare כדי להגן על ייצוג מיעוטים.
         כך היא מחושבת:
          \\[ \frac{votes}{seats}\\]
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f12065bdf5d3678e:
    english: |2-
        >[!TIP]
        > Droop will always compute to a smaller number of votes than Hare. For example, in an election with 100 votes and four seats, the Droop quota would be 21 and the Hare quota 25.
    translation: |-
      >[!TIP]
        > מכסת Droop תמיד דורשת פחות קולות ממכסת Hare. למשל, בבחירות שבהן 100 קולות וארבעה מושבים, מכסת Droop היא 21 ומכסת Hare היא 25.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  984516abc3cfd89b:
    english: "## How voting works"
    translation: "## אופן ההצבעה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  40e98247d87cdf27:
    english: 'In this example, Oatmilk Cooperative is electing three people to oversee the reusable packaging trial. Voters drag candidates above the line and rank them in order of preference:'
    translation: 'בדוגמה זו, קואופרטיב Oatmilk בוחר שלושה אנשים שיפקחו על ניסוי באריזות רב־פעמיות. המצביעים גוררים מועמדים אל מעל לקו ומדרגים אותם לפי סדר העדפה:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f8aaa5391f05117f:
    english: |-
      - **Rank 1** = most preferred candidate
      - **Rank 2** = second choice
      - Continue ranking as many candidates as desired
    translation: |-
      - **דירוג 1** = המועמד המועדף ביותר
      - **דירוג 2** = הבחירה השנייה
      - ניתן להמשיך ולדרג מועמדים רבים ככל הרצוי
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  70bd790faf93c916:
    english: Voters are not required to rank every candidate. Unranked candidates will not receive any of that voter's support.
    translation: אין חובה לדרג את כל המועמדים. מועמדים שלא דורגו לא יקבלו תמיכה מאותו קול.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d82e369c7c293a0c:
    english: |-
      ## How counting works
      The count is performed as follows:
    translation: |-
      ## אופן ספירת הקולות
      הספירה מתבצעת כך:
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0ea01b5d531abc06:
    english: |-
      1. A **quota** is calculated (minimum votes needed to win a seat).
      2. **First preferences** are counted for each candidate.
      3. If a candidate meets the quota, they are **elected**. Their surplus votes (above the quota) are **transferred** to voters' next preferences at a fractional value.
      4. If no candidate meets the quota, the candidate with the **fewest votes is eliminated**. Their votes transfer to voters' next preferences at full value.
      5. This process repeats until all seats are filled.
    translation: |-
      1. מחושבת **מכסה** — מספר הקולות המינימלי הדרוש לזכייה במושב.
      2. נספרות **העדפות ראשונות** לכל מועמד.
      3. מועמד שהגיע למכסה **נבחר**. הקולות העודפים שלו, מעבר למכסה, **מועברים** להעדפות הבאות של המצביעים בערך יחסי.
      4. אם אף מועמד לא הגיע למכסה, המועמד עם **מספר הקולות הנמוך ביותר מודח**. הקולות שלו מועברים במלוא ערכם להעדפות הבאות של המצביעים.
      5. התהליך חוזר עד שכל המושבים מאוישים.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c6f397233ad479e5:
    english: |-
      >[!TIP]
      >If a voter has ranked no remaining candidates, their ballot is "exhausted" and that vote is lost. This is why ranking more candidates is generally better.
    translation: |-
      >[!TIP]
      >אם לא נותרו מועמדים שדורגו בפתק הצבעה, הפתק נחשב ל״מוצה״ והקול אינו נספר עוד. לכן בדרך כלל כדאי לדרג יותר מועמדים.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  acba228efb586cca:
    english: "## Understanding results"
    translation: "## הבנת התוצאות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3b584c17ac358371:
    english: 'After the poll closes, results are displayed in several sections. In this election, Samira Patel, Alex Morgan, and Morgan Price fill the three committee seats:'
    translation: 'לאחר סגירת המשאל, התוצאות מוצגות בכמה חלקים. בבחירות האלה, סאמירה פאטל, אלכס מורגן ומורגן פרייס זכו בשלושת מושבי הוועדה:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9c3f3c8a80729fbf:
    english: "### Method and quota"
    translation: "### השיטה והמכסה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  feee79b9f6e92de3:
    english: At the top, you'll see the counting method (Scottish STV or Meek STV) and quota type (Droop or Hare) along with the quota — the number of votes a candidate needed to win a seat.
    translation: בחלק העליון מוצגים שיטת הספירה (Scottish STV או Meek STV), סוג המכסה (Droop או Hare) והמכסה עצמה — מספר הקולות שנדרש למועמד כדי לזכות במושב.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e180eb800c3435cd:
    english: "### Elected candidates"
    translation: "### המועמדים שנבחרו"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8db8b2466db56f2b:
    english: 'A summary table of the winners with five columns:'
    translation: 'טבלת סיכום של הנבחרים כוללת חמש עמודות:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f998ffc721953501:
    english: |-
      | Column | Meaning |
      |--------|---------|
      | **Candidate** | The name of the elected candidate |
      | **Round elected** | Which counting round they reached the quota and won a seat. Round 1 means they won on first preferences alone; higher rounds mean they needed transferred votes from eliminated or surplus candidates. |
      | **First preferences** | How many voters ranked this candidate as their first choice. This shows a candidate's direct support before any vote transfers. |
      | **Final tally** | The candidate's vote tally at the moment they were elected. Due to vote transfers, this is often higher than their first preferences. |
      | **Surplus** | How much the candidate's final tally exceeded the quota (final tally minus quota). A larger surplus means stronger support beyond what was needed to win. In Scottish STV, this surplus is redistributed to voters' next preferences. |
    translation: |-
      | עמודה | משמעות |
      |--------|---------|
      | **מוּעֲמָד** | שם המועמד שנבחר |
      | **נבחר בסיבוב** | הסיבוב שבו המועמד הגיע למכסה וזכה במושב. סיבוב 1 פירושו זכייה על סמך העדפות ראשונות בלבד. בסיבובים מאוחרים יותר נדרשו קולות שהועברו ממועמדים שהודחו או שנבחרו עם עודף קולות. |
      | **העדפות ראשונות** | מספר המצביעים שדירגו את המועמד במקום הראשון. הנתון מציג את התמיכה הישירה במועמד לפני העברת קולות. |
      | **ספירה סופית** | מספר הקולות של המועמד בעת שנבחר. בעקבות העברת קולות, מספר זה לרוב גבוה ממספר ההעדפות הראשונות שקיבל. |
      | **עוֹדֵף** | מספר הקולות שבהם הספירה הסופית של המועמד עלתה על המכסה (הספירה הסופית פחות המכסה). עודף גדול יותר מעיד על תמיכה מעבר לנדרש לזכייה. בשיטת Scottish STV העודף הזה מחולק בין ההעדפות הבאות של המצביעים. |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  efc41c326d955758:
    english: If the count results in a tie — where eliminating any of the remaining candidates would change the outcome — those candidates are shown in a separate table rather than arbitrarily choosing a winner.
    translation: אם הספירה מסתיימת בתיקו שבו הדחת אחד המועמדים שנותרו תשנה את התוצאה, המועמדים האלה מוצגים בטבלה נפרדת. לא נבחר זוכה באופן שרירותי.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8a6ae4ad28f0acf6:
    english: "### Round-by-round details"
    translation: "### פרטים סיבוב אחר סיבוב"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3d907145fd075144:
    english: 'Expand **Round-by-round details** to see vote transfers and eliminations. Each row is a candidate and each column is a counting round:'
    translation: 'יש להרחיב את **פרטים סיבוב אחר סיבוב** כדי לראות העברות קולות והדחות. כל שורה מייצגת מועמד, וכל עמודה מייצגת סבב ספירה:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cc37217cd681fabe:
    english: The green highlight shows when a candidate was elected, red shows when they were eliminated, and orange shows when they tied.
    translation: הדגשה בירוק מציינת מתי מועמד נבחר, באדום מתי הודח, ובכתום מתי הסתיים בתיקו.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ed4aaa0a898906fd:
    english: "## Exporting ballots"
    translation: "## ייצוא פתקי הצבעה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c96d54ebfbedae32:
    english: After the election closes, people who can view the results can export the ballots in BLT format for an independent recount or audit. The export contains candidate rankings and combines identical rankings into a single row with a ballot count. For anonymous elections it does not contain voter identities, ballot identifiers, submission times, or submission order.
    translation: לאחר סגירת הבחירות, מי שיכולים לצפות בתוצאות יכולים לייצא את פתקי ההצבעה בפורמט BLT לצורך ספירה חוזרת או ביקורת עצמאית. הייצוא כולל את דירוגי המועמדים ומאחד דירוגים זהים בשורה אחת, עם מספר הפתקים התואמים. בבחירות אנונימיות הוא אינו כולל את זהויות המצביעים, מזהי פתקי הצבעה, מועדי הגשה או סדר הגשה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
