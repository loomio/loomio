  4a423dbb4fd59b45:
    english: Redaction keeps the user's comments and other user-generated content within their groups, but removes known personally identifying information such as name, bio, profile photo, email address, login credentials, identities, and active sessions.
    translation: La rimozione dei dati personali conserva i commenti e gli altri contenuti creati dall'utente nei suoi gruppi, ma elimina le informazioni personali note che possono identificarlo, come nome, biografia, foto del profilo, indirizzo email, credenziali di accesso, identità e sessioni attive.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9b472af7dbef98ac:
    english: This is the recommended way to remove a user from Loomio.
    translation: È il metodo consigliato per rimuovere un utente da Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
