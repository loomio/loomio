  fe690a715f8a00b5:
    english: The report shows how many threads, comments, polls, votes and reactions have happened per month. This is graphed so you can see ebbs and flows of usage.
    translation: Le rapport indique le nombre de discussions, de commentaires, de sondages, de votes et de réactions par mois. Le graphique montre les variations de l’activité.
    status: machine
