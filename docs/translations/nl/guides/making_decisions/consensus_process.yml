  7069de909d719ef2:
    english: Build consensus for a decision you need to make together, to reach an agreement that satisfies the needs and concerns of all participants.
    translation: Bouw consensus op over een beslissing die je samen moet nemen. Zo kun je tot een afspraak komen die rekening houdt met de behoeften en zorgen van alle deelnemers.
    status: machine
    provider: codex/gpt-6-sol
