---
navigation_title: Felkészülés egy értekezletre
blocks:
  165e9dec4d4660aa:
    english: "# Prepare for a meeting"
    translation: "# Felkészülés egy értekezletre"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5d14c790e0c05446:
    english: Effective meetings are productive, inclusive, and collaborative - they improve engagement, help build strong relationships, establish alignment, make better and faster decisions, promote inclusion, facilitate creative thinking and innovation, are a great channel for feedback and continuous improvement.
    translation: A jól működő értekezletek eredményesek és mindenkit bevonnak. Segítik az együttműködést, erősítik a kapcsolatokat, támogatják a közös álláspont kialakítását és a jobb, gyorsabb döntéseket. Teret adnak az ötleteknek, a visszajelzéseknek és a folyamatos fejlődésnek.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c69f325003094ac5:
    english: Use Loomio to plan an effective meeting; involve people from the outset, align towards the most important topics, and make better use of your precious time together.
    translation: Tervezd meg az értekezletet a Loomióban. Vond be a résztvevőket már az elején, összpontosítsatok a legfontosabb témákra, és használjátok ki jobban az együtt töltött időt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a30a32e8b06a9432:
    english: If the group is new to Loomio, begin with [Introducing Loomio to your group](/en/user_manual/overview/introducing_loomio), then use this meeting process as a practical first recurring workflow.
    translation: Ha a csoport még nem használta a Loomiót, kezdd a [Loomio bemutatásával a csoportodnak](/en/user_manual/overview/introducing_loomio). Ezután próbáljátok ki ezt az értekezleti folyamatot első rendszeres munkamenetként.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9a0eb26797e28e0f:
    english: There are several things you can do to make your next board or committee meeting effective...
    translation: Több lépéssel is eredményesebbé teheted a következő vezetőségi vagy bizottsági értekezletet...
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c04e8fcfc9edb01c:
    english: |-
      - [Meeting focus and review actions](#meeting-focus-and-review-actions)
      - [Announce agenda and notify](#agenda-and-notify)
      - [Find a time for meeting](#find-a-time-for-meeting)
      - [Sign off minutes](#sign-off-minutes)
      - [Approve reports](#approve-reports)
    translation: |-
      - [Az értekezlet fő témái és a korábbi teendők áttekintése](#meeting-focus-and-review-actions)
      - [A napirend közzététele és a tagok értesítése](#agenda-and-notify)
      - [Időpont keresése az értekezlethez](#find-a-time-for-meeting)
      - [A jegyzőkönyv jóváhagyása](#sign-off-minutes)
      - [A beszámolók jóváhagyása](#approve-reports)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6e6785b547007644:
    english: "## Meeting focus and review actions"
    translation: "## Az értekezlet fő témái és a korábbi teendők áttekintése"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  26bf98782eb61549:
    english: 'Establish a focus for the meeting, so you spend your precious time together talking about the most important topics.  '
    translation: Határozd meg az értekezlet fő témáit, hogy az együtt töltött időt a legfontosabb kérdésekre fordíthassátok.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c23fdd52f0a29b2c:
    english: Inviting members to contribute to the agenda helps everyone align, think about topics and energize for the meeting.
    translation: Ha meghívod a tagokat a napirend összeállításába, mindenkinek lesz ideje átgondolni a témákat és felkészülni az értekezletre.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  52409f3ffabfb7d1:
    english: |-
      Actions:
      - focus the meeting on the most important things,
      - follow up and talk to members about actions from previous meetings.
    translation: |-
      Teendők:
      - összpontosítsatok a legfontosabb kérdésekre,
      - kövesd nyomon a korábbi értekezletek teendőit, és beszélj róluk a tagokkal.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a52dd7ebb4619e46:
    english: |-
      ### On Loomio
      Use a Loomio **Discussion** to prepare for your meeting:
      * remind members about the meeting coming up,
      * invite comment about the most important things to focus on,
      * summarize actions from the previous meeting and ask for an update.
    translation: |-
      ### A Loomióban
      Készülj fel az értekezletre egy Loomio-**Vita** segítségével:
      * emlékeztesd a tagokat a közelgő értekezletre,
      * kérdezd meg, mely témákat tartják a legfontosabbnak,
      * foglald össze az előző értekezlet teendőit, és kérj tájékoztatást az állásukról.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5bcd10bb61edcc35:
    english: "## Agenda and notify"
    translation: "## Napirend és értesítés"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d9431846021bb8f3:
    english: Announce the meeting with a clear agenda. Attach papers, link to key documents and notify members.
    translation: Hirdesd meg az értekezletet világos napirenddel. Csatold az előterjesztéseket, hivatkozz a fontos dokumentumokra, és értesítsd a tagokat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  41e84b882fa9bab1:
    english: This helps everyone prepare for the meeting, by reading the materials and thinking about topics of discussion and the decisions to be made.  Members are then more likely to arrive in context and ready for the meeting.
    translation: Így mindenki elolvashatja az anyagokat, és átgondolhatja a megvitatandó témákat és a meghozandó döntéseket.  A tagok felkészülten érkezhetnek az értekezletre.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b6b0e7ed67711d5b:
    english: |-
      Actions:
      - prepare agenda, documents, materials and board papers,
      - notify members of meeting and send materials.
    translation: |-
      Teendők:
      - készítsd elő a napirendet, a dokumentumokat és az előterjesztéseket,
      - értesítsd a tagokat az értekezletről, és küldd el nekik az anyagokat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5b6d4a5158e41747:
    english: |-
      ### On Loomio
      Use a Loomio **Discussion** to prepare for your board meeting:
      * state details of meeting,
      * attach or link agenda, documents and other meeting materials,
      * invite members with a notification,
      * monitor 'Seen by' to see who has read the thread.
    translation: |-
      ### A Loomióban
      Készülj fel a vezetőségi értekezletre egy Loomio-**Vita** segítségével:
      * add meg az értekezlet részleteit,
      * csatold a napirendet, a dokumentumokat és az egyéb anyagokat, vagy helyezz el rájuk mutató hivatkozásokat,
      * küldj értesítést a tagoknak,
      * a „Látta” jelzés alapján kövesd nyomon, ki olvasta el a témát.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f2c8f10394bf10c8:
    english: |-
      While similar to sending an email, a Loomio thread has advantages:
      - you can see who has read the thread, and remind those who haven't,
      - member replies or comments are visible to everyone who has permission to view the thread,
      - any discussion or questions about the agenda or meeting materials is held in a single place.
    translation: |-
      A Loomio-téma az e-mailhez hasonlóan használható, és több előnye is van:
      - láthatod, ki olvasta el a témát, és emlékeztetheted azokat, akik még nem tették meg,
      - a tagok válaszait és hozzászólásait mindenki láthatja, aki hozzáfér a témához,
      - a napirenddel és az anyagokkal kapcsolatos kérdések és hozzászólások egy helyen maradnak.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dd6d8cabe5f1810d:
    english: Members can find all the information about the meeting readily available in one place, thereby avoiding confusing email chains and losing important info in their email inbox.
    translation: A tagok egy helyen megtalálják az értekezlet összes tudnivalóját, így nem kell e-mail-láncokban keresniük a fontos információkat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6a57d003a0bd5f07:
    english: |-
      ### Confirm
      Ask members to leave a comment confirming they have read the agenda and meeting papers and are prepared for the meeting. Use **Seen by** to identify anyone who may need a reminder.
    translation: |-
      ### Megerősítés
      Kérd meg a tagokat, hogy hozzászólásban erősítsék meg: elolvasták a napirendet és az értekezlet anyagait, és felkészültek. A **Látta** jelzés alapján megállapíthatod, kit érdemes emlékeztetni.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d08b0ae5712ef2d:
    english: "## Find a time for meeting\nFinding a time to meet can be a frequent headache for many administrators. "
    translation: |-
      ## Időpont keresése az értekezlethez
      Az értekezlet időpontjának egyeztetése gyakran sok munkát ad az adminisztrátoroknak.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1da8fdf943571a19:
    english: |-
      ### On Loomio
      If you have not yet set a date and time for the meeting or you need to find a time for a future meeting, you can use **Time poll**.
    translation: |-
      ### A Loomióban
      Ha még nincs kitűzve az értekezlet időpontja, vagy egy későbbi értekezlethez keresel időpontot, használhatod az **Időpont választás** szavazást.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f1c92e27dfd63153:
    english: Time poll makes it easy to see everyone's availability and find the best time, reducing time and energy needed for this common admin task.
    translation: Az időpontválasztással könnyen áttekintheted, mikor érnek rá a tagok, és megtalálhatod a legjobb időpontot. Így kevesebb időt kell az egyeztetésre fordítanod.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  45b90fd46cce4976:
    english: Members in different time zones will see dates and times localized in their time zone.
    translation: A különböző időzónákban élő tagok a saját időzónájuk szerint látják a dátumokat és időpontokat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dc159c751f73d5d1:
    english: 'When the Time poll closes, choose the best time and send an outcome notification with a calendar invitation, so members can add the meeting to their calendar. '
    translation: Amikor lezárul az időpontválasztás, válaszd ki a legjobb időpontot, és küldj értesítést a következtetésről naptármeghívóval. Így a tagok felvehetik az értekezletet a naptárukba.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4bafee41dd5f774c:
    english: "## Sign off minutes\nApproving or ratifying minutes is standard practice for formal meetings and good practice for all meetings.  "
    translation: |-
      ## A jegyzőkönyv jóváhagyása
      A jegyzőkönyv jóváhagyása a hivatalos értekezleteken bevett eljárás, és más értekezleteken is hasznos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d9795ed92dabff7:
    english: 'Minutes provide a record of the meeting, key points raised during discussion, results of decisions and how people voted. They include the actions agreed and the person(s) responsible, and are often the starting point for the next meeting.  '
    translation: A jegyzőkönyv rögzíti az értekezletet, a vita főbb pontjait, a döntéseket és a szavazatokat. Tartalmazza az elfogadott teendőket és azok felelőseit. Gyakran ez adja a következő értekezlet kiindulópontját.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1fd0d860cba070db:
    english: Minutes are valuable as a reminder for people present, helpful for those absent and a record to consult in case of conflict.
    translation: A résztvevőket emlékezteti az elhangzottakra, a távol maradóknak tájékoztatást ad, és vita esetén visszakereshető feljegyzésként szolgál.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  166796d872f35962:
    english: "### On Loomio"
    translation: "### A Loomióban"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ef51b49480cb721a:
    english: Post the minutes in the Loomio meeting thread within a few days of the meeting and invite participants to approve.  This keeps the minutes relevant and fresh in member's minds and is a great way to remind members of their actions.  It also saves some time during your meeting.
    translation: Az értekezlet utáni néhány napon belül tedd közzé a jegyzőkönyvet az értekezlet Loomio-témájában, és kérd meg a résztvevőket, hogy hagyják jóvá.  Ekkor még jól emlékeznek a történtekre, és a jegyzőkönyv a vállalt teendőikre is emlékezteti őket.  Ezzel az értekezleten is időt takaríthattok meg.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ea02d6cf3ede73dc:
    english: The example above uses a **Choose** poll with two options 'Accept' or 'Review'.
    translation: 'A fenti példa egy **Választ** szavazást használ két lehetőséggel: „Elfogadás” és „Áttekintés”.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  56c55da82e5ddeb7:
    english: 'When everyone has voted and the poll closes, state an outcome so everyone knows what has happened.  '
    translation: Miután mindenki szavazott, és a szavazás lezárult, tedd közzé a következtetést, hogy mindenki tudja, mi történt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e8b710a05eb113dc:
    english: 'If your meeting practice requires formal acceptance at the next meeting, schedule an agenda item to acknowledge and confirm polls and decisions made on Loomio, and record this in the meeting minutes.  '
    translation: Ha a csoport eljárása szerint a következő értekezleten hivatalos jóváhagyás szükséges, vegyétek napirendre a Loomióban tartott szavazások és meghozott döntések megerősítését, és rögzítsétek ezt a jegyzőkönyvben.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '06339a98b65ccc2c':
    english: For example; *"Does anyone wish to change their votes in Loomio?  If no, then let's resolve to formally approve polls made in Loomio during the last period."*
    translation: 'Például: *„Szeretné valaki módosítani a Loomióban leadott szavazatát?  Ha nem, akkor hagyjuk jóvá hivatalosan az előző időszak Loomio-szavazásait.”*'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f460b4ae218b375a:
    english: |-
      ## Approve reports
      Most meeting agendas include time for reports to be presented, discussed and approved; for example reports from the CEO, Financial, Operations, Health & Safety, and project reports.
    translation: |-
      ## A beszámolók jóváhagyása
      A legtöbb értekezlet napirendjén szerepel beszámolók bemutatása, megvitatása és jóváhagyása. Ilyen lehet a vezérigazgatói, pénzügyi, működési, munkaegészségügyi és munkabiztonsági vagy projektbeszámoló.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  00abfe283956509a:
    english: Reports are very important to help everyone get on the same page, however they can absorb valuable time in a meeting that may be used more effectively.
    translation: A beszámolók segítenek abban, hogy mindenki ugyanazokból az információkból induljon ki. Megvitatásuk azonban sok időt vehet el az értekezletből, amelyet másra is fordíthatnátok.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  861200207a1e1dfb:
    english: Attach or link reports to your meeting **thread** and invite questions about the reports in advance of the meeting.
    translation: Csatold a beszámolókat az értekezlet **témájához**, vagy helyezz el rájuk mutató hivatkozásokat, és kérd meg a tagokat, hogy még az értekezlet előtt tegyék fel a kérdéseiket.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  11f124875e8a5945:
    english: Members receive and read the reports at a time and place that works for them.  As members read and think about the reports, they can comment, ask questions and see responses in Loomio.
    translation: A tagok a nekik megfelelő időben és helyen olvashatják el a beszámolókat.  Olvasás közben hozzászólhatnak, kérdezhetnek, és láthatják a Loomióban érkező válaszokat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2871f1673d36999a:
    english: A question asked by one member is likely of interest to other members, so when someone replies to the question, their response  is visible to everyone in the Loomio group.
    translation: Egy tag kérdése másokat is érdekelhet. Ha valaki válaszol rá, a válasz a Loomio-csoport minden tagja számára látható.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  851a2a86a1047697:
    english: As members become familiar with discussing reports in Loomio, save a little more time by taking it a step further - seek approval of reports ahead of the meeting.
    translation: Ha a tagok már megszokták a beszámolók megvitatását a Loomióban, további időt takaríthattok meg azzal, hogy még az értekezlet előtt jóváhagyást kértek rájuk.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
