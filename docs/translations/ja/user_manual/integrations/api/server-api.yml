  3131d6ab6e787458:
    english: Set `B3_API_KEY` to a secret longer than 16 characters.
    translation: "`B3_API_KEY` に 16 文字を超える秘密の値を設定します。"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  88c920613607a743:
