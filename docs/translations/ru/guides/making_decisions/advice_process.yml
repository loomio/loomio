  aa1feddec315ed04:
    english: Seek advice on a decision you need to make.
    translation: Обратитесь за советом, прежде чем принять решение.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  abd59b5e28c00123:
    english: Make a decision with the advice of people impacted or who have expertise, so you can make a better decision for your organization.
    translation: Учитывайте советы людей, которых затронет решение, и тех, кто разбирается в вопросе. Это поможет вам принять более обоснованное решение для вашей организации.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fce0c96bcc92d0aa:
    english: "> *“With the advice process, any person can make any decision but must seek advice from affected parties and people with expertise.” - Frederick Laloux, Reinventing Organizations.*"
    translation: "> *«В процессе консультирования любой человек может принять любое решение, но прежде должен обратиться за советом к тем, кого оно затронет, и к людям, разбирающимся в вопросе». — Фредерик Лалу, «Открывая организации будущего».*"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  66f32f2b3cf56e0d:
    english: |-
      ## Key points
      - Freedom to make a decision.
      - Invite people to offer their advice.
      - Take into account other people’s voices.
    translation: |-
      ## Основные принципы
      - Вы можете самостоятельно принять решение.
      - Пригласите других людей поделиться советом.
      - Учитывайте мнения других людей.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  54d4f1ac3c2bd91f:
    english: |-
      ## Steps in the Advice process
      You notice a problem or opportunity and take the initiative.
      1. Frame the decision, identify who owns it, and invite the affected people and relevant experts.
      2. Start a Loomio **discussion** and, when a structured response or deadline is useful, run an **Advice proposal**.
      3. Clarify and build on the advice through vote reasons and discussion comments.
      4. Make the decision, then publish an **outcome** explaining what was decided and how the advice informed it.
    translation: |-
      ## Этапы процесса консультирования
      Вы замечаете проблему или возможность и берёте инициативу на себя.
      1. Сформулируйте вопрос, определите, кто примет решение, и пригласите людей, которых оно затронет, а также специалистов по теме.
      2. Начните **обсуждение** в Loomio. Если нужны ответы в определённом формате или срок для ответа, создайте **предложение для консультации**.
      3. Уточняйте советы и развивайте идеи с помощью пояснений к голосам и комментариев в обсуждении.
      4. Примите решение и опубликуйте **результат**: объясните, что вы решили и как советы повлияли на решение.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6088bbd1e12e8920:
    english: "## Benefits\n- Advice helps you make a better decision for your organization. \n- Foster relationships, learning opportunities and diverse input.\n- Stimulate initiative and creativity, and more enjoyable work."
    translation: "## Преимущества\n- Советы помогают принять более обоснованное решение для вашей организации. \n- Обмен мнениями укрепляет отношения, помогает учиться друг у друга и учитывать разные точки зрения.\n- Такой подход поддерживает инициативу и творческий подход и делает работу приятнее."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0b6fc6b802feebda:
    english: "## Applying the Advice process on Loomio"
    translation: "## Как провести процесс консультирования в Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a0a3c706db8ca405:
    english: "| **Advice process** | **On Loomio** |\n|---|---|\n| You notice a problem or opportunity and take the initiative. |  |\n| Seek input to sound out perspectives before proposing action. | Start a Loomio **discussion** to provide context and open conversation. Run an **[Advice proposal](/en/user_manual/polls/proposals/advice/)** when you want a defined response period, vote reasons, and a clear record of who participated. |\n| Taking advice received into account, you make a decision and inform the people who have given advice. | Add an an **outcome** to the discussion thread.   <br /><br />State the decision made and thank people for their advice and feedback.  <br /><br />   Say what will happen next and notify people about the outcome.  <br /><br />The outcome statement is an important record of the decision for future reference. <br /> <br /> Either update the context to include this outcome, or state it in a comment you pin to the timeline to quickly find it in the future.<br /><br/> |        "
    translation: |-
      | **Процесс консультирования** | **В Loomio** |
      |---|---|
      | Вы замечаете проблему или возможность и берёте инициативу на себя. |  |
      | Прежде чем предложить решение, узнайте мнения других людей. | Начните **обсуждение** в Loomio: опишите ситуацию и пригласите людей к разговору. Создайте **[предложение для консультации](/en/user_manual/polls/proposals/advice/)**, если хотите установить срок для ответов, получить пояснения к голосам и сохранить список участников. |
      | Учитывая полученные советы, вы принимаете решение и сообщаете о нём тем, кто поделился своим мнением. | Добавьте **результат** в ветку обсуждения.   <br /><br />Опишите принятое решение и поблагодарите людей за советы и отзывы.  <br /><br />   Расскажите, что будет дальше, и уведомите людей о результате.  <br /><br />Описание результата сохранит решение для дальнейшего использования. <br /> <br /> Вы можете добавить результат в контекст обсуждения или написать о нём в комментарии и закрепить его в ленте, чтобы позже быстро найти.<br /><br/> |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
