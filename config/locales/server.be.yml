      objection_prompt: Што трэба змяніць, перш чым вы зможаце ўзяць на сябе абавязацельствы?
    proposal:
      process_subtitle: Унесці прапанову для прыняцця рашэння
      process_introduction: <p>Класічная прапанова Луміа дапамагае вам прыняць рашэнне, ператвараючы абмеркаванне ў выразную выснову.</p><p> Прапануйце план дзеянняў і папрасіце людзей прагаласаваць за згоду, устрыманне або нязгоду.</p><p> Падчас галасавання людзі могуць растлумачыць, чаму яны прагаласавалі менавіта так. Вы можаце ўбачыць пазіцыю ўсіх астатніх па гэтым пытанні і чаму.</p><p> Такім чынам, вы можаце выкарыстоўваць прапанову, каб падштурхнуць людзей да адказу, выявіць новую інфармацыю і пабудаваць агульнае разуменне — каб дапамагчы вашай групе прыняць лепшае і больш абгрунтаванае рашэнне.</p><p> Прапанова і звязанае з ёй абмеркаванне ствараюць уласную справаздачу аб тым, як было прынята рашэнне.</p><p> <a target="_blank" href="https://help.loomio.com/en/user_manual/polls/decisions/index.html"><u>Даведайцеся больш пра выкарыстанне класічнай прапановы Луміа ў працэсе прыняцця простых рашэнняў</u></a> .</p>
