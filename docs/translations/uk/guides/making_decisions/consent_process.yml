  b11cbc132fe6b4d0:
    english: Seek consent on a decision you need to make, where there are no meaningful objections to your proposal, so you can make a fast decision that is 'safe to try' now.
    translation: Отримайте згоду на потрібне рішення. Якщо проти вашої пропозиції немає суттєвих заперечень, ви можете швидко ухвалити рішення, яке вже зараз можна спробувати втілити.
    status: machine
