      Give it a simple name, select the channel for notifications to appear within, and click Save
      ![](mm4.png)
    translation: |-
      Укажите простое название, выберите канал для уведомлений и нажмите «Сохранить».
      ![](mm4.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
