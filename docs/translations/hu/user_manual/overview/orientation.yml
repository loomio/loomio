  e2c7a0c137330c27:
    english: "**Polls** - A list of polls active in your group."
    translation: "**Szavazások** - A csoport aktív szavazásainak listája."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '085bd9dfce8144dc':
    english: "**Members** - The people who belong to the group."
    translation: "**Tagok** - A csoport tagjai."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cfdb369a7fd6e14f:
    english: "**Files** - Documents and other files attached throughout the group. The tab collects files from discussion contexts, comments, proposals, and polls, so you can find a document without remembering where it was attached."
    translation: "**Fájlok** - A csoportban csatolt dokumentumok és egyéb fájlok. Ez a lap összegyűjti a beszélgetések leírásához, hozzászólásokhoz, javaslatokhoz és szavazásokhoz csatolt fájlokat. Így akkor is megtalálhatod a dokumentumot, ha nem emlékszel, hová csatolták."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
