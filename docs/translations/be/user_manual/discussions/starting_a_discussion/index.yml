---
navigation_title: Пачаць дыскусію
blocks:
  8fae4100a4f3548b:
    english: "# Start a discussion"
    translation: "# Пачаць дыскусію"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4ba984e9573c27ff:
    english: Starting a Loomio discussion is like writing an email. The subject line of an email is like the discussion title, and the text you write in an email is like the context of a discussion.
    translation: Пачаць дыскусію ў Loomio — амаль тое самае, што напісаць электронны ліст. Назва дыскусіі адпавядае тэме ліста, а яе кантэкст — тэксту ліста.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4f81447c072f5dfe:
    english: As you add people in the send list of your email, in Loomio you can invite people individually or as a group to the discussion - they will receive an email notification with the content of your discussion.
    translation: Як вы дадаяце адрасатаў у электронны ліст, так у Loomio можаце запрасіць у дыскусію асобных людзей або цэлую групу. Яны атрымаюць электроннае апавяшчэнне са зместам дыскусіі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2408b54e3b78a282:
    english: People can reply to your discussion via email and their comments will appear in the discussion.
    translation: Людзі могуць адказваць на дыскусію па электроннай пошце. Іх каментарыі з’явяцца ў дыскусіі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  24ced64c5c4cf853:
    english: As with an email, a discussion may be a simple question, or a more detailed introduction to a topic with links or files attached for background information.
    translation: Як і электронны ліст, дыскусія можа змяшчаць простае пытанне або падрабязныя ўводзіны ў тэму са спасылкамі ці далучанымі файламі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ec39413fa07094c8:
    english: "## New discussion"
    translation: "## Новая дыскусія"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  92b37b2e208bfd57:
    english: Find the **New discussion** button on your Loomio group page to start a new discussion.
    translation: Каб пачаць дыскусію, знайдзіце кнопку **Новая дыскусія** на старонцы вашай групы ў Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  515ac46bdfccb401:
    english: You can start a discussion within your Loomio group or any subgroup.
    translation: Вы можаце пачаць дыскусію ў сваёй групе Loomio або любой яе падгрупе.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ef9721ba6b69b86b:
    english: "![New discussion button on the Oatmilk Cooperative page](new-discussion-button.png)"
    translation: "![Кнопка «Новая дыскусія» на старонцы Oatmilk Cooperative](new-discussion-button.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1cf9e569475cd2cc:
    english: "![New discussion form for planning the returnable bottle trial](new-discussion-example.png)"
    translation: "![Форма новай дыскусіі для планавання выпрабавання зваротных бутэлек](new-discussion-example.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f973f5b9f1c4b1dd:
    english: |-
      ### Group
      Check the name of the group or subgroup is correct for your discussion.  Anyone in this group will be able to see the discussion. You can also start the discussion in another group or as a 'direct' discussion (no group).
    translation: |-
      ### Група
      Праверце, ці правільна выбрана група або падгрупа для вашай дыскусіі. Усе ўдзельнікі гэтай групы змогуць бачыць дыскусію. Вы таксама можаце пачаць дыскусію ў іншай групе або стварыць прамую дыскусію без групы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f0b0bda9877ce0ed:
    english: |-
      >[!Tip]
      >If you are not ready to make the discussion visible in your group, start the discussion as 'direct'.  You can move the discussion to your Loomio group when ready.
    translation: |-
      >[!Tip]
      >Калі вы пакуль не хочаце паказваць дыскусію сваёй групе, пачніце яе як прамую. Калі будзеце гатовыя, перамясціце дыскусію ў сваю групу Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cd1b45c3cb71503b:
    english: "### Invite and notify"
    translation: "### Запрашэнні і апавяшчэнні"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f3f388d23b06b25c:
    english: The **Invite** field controls who receives the new discussion immediately.
    translation: Поле **Запрасіць** вызначае, хто адразу атрымае апавяшчэнне пра новую дыскусію.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1c1b5c23770d3692:
    english: Group members can see a discussion in their group even if you do not notify them. Adding a group member to **Invite** sends them an email notification and a notification in Loomio.
    translation: Удзельнікі групы могуць бачыць дыскусію ў сваёй групе, нават калі вы не дашлеце ім апавяшчэнне. Калі вы дадаяце ўдзельнікаў групы ў поле **Запрасіць**, яны атрымліваюць апавяшчэнні па электроннай пошце і ў Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e2e5906a39131506:
    english: Select a group to notify everyone in it, or expand the group to choose individual members. Select the × beside a name to remove that person from the notification.
    translation: Выберыце групу, каб паведаміць усім яе ўдзельнікам, або разгарніце яе і выберыце асобных людзей. Націсніце × побач з імем, каб прыбраць чалавека са спіса атрымальнікаў апавяшчэння.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  81b57efbb3c428b7:
    english: "![Invite field expanded to show individual recipients](../notifying_people/thread_notification.png)"
    translation: "![Разгорнутае поле «Запрасіць» са спісам асобных атрымальнікаў](../notifying_people/thread_notification.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5cbd2b7b0bcc486f:
    english: Start typing a member's name and select it from the list.
    translation: Пачніце ўводзіць імя ўдзельніка групы і выберыце яго са спіса.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dc128abbc65cb0c8:
    english: "![Searching for Samira Patel in the Invite field](../notifying_people/thread_notify_user.png)"
    translation: "![Пошук Саміры Патэл у полі «Запрасіць»](../notifying_people/thread_notify_user.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3274fe93fcf29b29:
    english: Enter an email address to invite a guest. A guest can see and participate in this thread but cannot see other discussions in the group unless separately invited.
    translation: Увядзіце адрас электроннай пошты, каб запрасіць госця. Госці могуць бачыць гэтую нітку і ўдзельнічаць у ёй, але не могуць бачыць іншыя дыскусіі групы без асобнага запрашэння.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ab3214ccf77143e3:
    english: "![Adding a guest email address to the Invite field](../notifying_people/thread_notify_email.png)"
    translation: "![Даданне адраса электроннай пошты госця ў поле «Запрасіць»](../notifying_people/thread_notify_email.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cba9346e727b829a:
    english: You can also start the discussion without notifying anyone. Group members can still find it in Loomio and may see it in their catch-up email, depending on their notification settings.
    translation: Вы таксама можаце пачаць дыскусію, нікому не дасылаючы апавяшчэння. Удзельнікі групы ўсё роўна змогуць знайсці яе ў Loomio і, у залежнасці ад сваіх налад апавяшчэнняў, убачыць у зводным электронным лісце.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6518afe373ff1959:
    english: "### Tags"
    translation: "### Тэгі"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ff67c09f89479873:
    english: Add tag(s) to help people find your discussion when searching by tag. Admins can create new tags.
    translation: Дадайце тэгі, каб людзям было лягчэй знайсці вашу дыскусію праз пошук па тэгах. Адміністратары могуць ствараць новыя тэгі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ba80a903c4ecc7d1:
    english: |-
      ### Title
      Give your discussion a relevant title.  A discussion title is similar to an email subject line.
    translation: |-
      ### Назва
      Дайце дыскусіі назву, якая адпавядае тэме. Назва дыскусіі падобная да тэмы электроннага ліста.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a91cf4b0b1b2ad5e:
    english: |-
      ### Context
      Use discussion context to introduce the topic and frame the conversation or decision to make. Use the formatting tools to emphasize key points. Include background information, attach files, link to online documents and embed a video.
    translation: |-
      ### Кантэкст
      Выкарыстоўвайце кантэкст дыскусіі, каб прадставіць тэму і акрэсліць пытанні для абмеркавання або рашэнне, якое трэба прыняць. Вылучайце галоўнае з дапамогай інструментаў фарматавання. Дадайце даведачную інфармацыю, далучыце файлы, спасылкі на анлайн-дакументы і ўбудаванае відэа.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1bf690aa841299cd:
    english: The context will always stay at the top of the discussion and you can update it at any time as the discussion progresses.  When the discussion ends, update the context with the outcome.
    translation: Кантэкст заўсёды застаецца ўверсе дыскусіі. Вы можаце абнаўляць яго ў любы час па ходзе абмеркавання. Калі дыскусія завершыцца, дадайце ў кантэкст выснову.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
