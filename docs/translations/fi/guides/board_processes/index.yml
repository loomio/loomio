  eecfb12ed1d28d50:
    english: Good governance exists where an organization has systems and processes in place that are appropriate to its circumstances, and which enable the organization to pursue its purpose effectively and meet its obligations under the law.
    translation: Hyvä hallinto perustuu organisaation tilanteeseen sopiviin järjestelmiin ja prosesseihin. Niiden avulla organisaatio voi toteuttaa tarkoitustaan tehokkaasti ja täyttää lakisääteiset velvoitteensa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e54f67d22cf67a93:
    english: "*“It is participatory, consensus-oriented, accountable, transparent, responsive, effective and efficient, equitable and inclusive and follows the rule of law.”* [United Nations Economic and Social Commission for Asia and the Pacific](https://www.unescap.org/sites/default/d8files/knowledge-products/good-governance.pdf)."
    translation: "*”Se on osallistavaa, yhteisymmärrykseen pyrkivää, vastuullista, avointa, tarpeisiin vastaavaa, tuloksellista ja tehokasta, oikeudenmukaista ja kaikkia osallistavaa sekä oikeusvaltioperiaatteen mukaista.”* [Yhdistyneiden kansakuntien Aasian ja Tyynenmeren talous- ja sosiaalikomissio](https://www.unescap.org/sites/default/d8files/knowledge-products/good-governance.pdf)."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1661a79cfda1a9df:
    english: Underpinning all of these principles is the need for good communication.
    translation: Kaikkien näiden periaatteiden perustana on hyvä viestintä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2819f114c9d74160:
    english: 'Here are some or the challenges directors and boards experience:'
    translation: 'Hallitukset ja niiden jäsenet kohtaavat muun muassa seuraavia haasteita:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ed750814c61b85fb:
    english: "* Getting directors together in person\n* Time available to consider important issues \n* Tracking communication\n* Urgency of critical issues\n* Online video meeting fatigue\n* Directors in multiple, remote locations, sometimes with poor internet connectivity\n* Mixed governance practice and experience\n* Dealing with high volumes of transactional business \n* Maintaining institutional memory"
    translation: "* Hallituksen jäsenten kokoaminen samaan paikkaan\n* Ajan löytäminen tärkeiden asioiden harkintaan \n* Viestinnän seuraaminen\n* Kriittisten asioiden kiireellisyys\n* Videokokousten aiheuttama väsymys\n* Hallituksen jäsenet asuvat eri paikoissa, joskus kaukana toisistaan ja heikkojen verkkoyhteyksien alueilla\n* Vaihtelevat hallintokäytännöt ja kokemustasot\n* Suuren rutiiniasioiden määrän käsittely \n* Organisaation muistin säilyttäminen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b910c5253cf77950:
    english: Loomio offers an opportunity to strengthen governance, to extend collaboration beyond board meetings, to include everyone in open, honest and respectful discussion while documenting everything.
    translation: Loomio auttaa vahvistamaan hallintoa ja jatkamaan yhteistyötä hallituksen kokousten ulkopuolella. Kaikki voivat osallistua avoimeen, rehelliseen ja kunnioittavaan keskusteluun, joka jää dokumentoiduksi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
