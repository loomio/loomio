navigation_title: Делегаты с правом голоса
blocks:
  cde9fe3639ac5e9e:
    english: "# Delegated voters"
    translation: "# Делегаты с правом голоса"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9cfb3b7835dc5cb0:
    english: If some members of your group should have voting rights while others should not, you can use the "Make delegate" feature to identify those people with voting rights. There is a corresponding "Revoke delegate" action too.
    translation: Если право голоса должно быть только у некоторых участников вашей группы, отметьте их с помощью действия «Сделать делегатом». При необходимости статус делегата можно отменить действием «Отозвать делегата».
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e017eafb51368777:
    english: Use delegates when people should share the same discussion space but only a defined set, such as directors or elected representatives, may vote. This is usually simpler than maintaining a second subgroup whose only purpose is to separate voters from non-voters.
    translation: Используйте делегатов, когда всем нужно участвовать в одних обсуждениях, но голосовать могут только определённые люди, например руководители или избранные представители. Обычно это проще, чем создавать отдельную подгруппу только для разделения участников по праву голоса.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1942a47ae47ca813:
    english: Use a private subgroup instead when its members also need discussions, files, or membership information that other members must not see.
    translation: Если этим участникам также нужны обсуждения, файлы или сведения об участниках, которые остальные не должны видеть, создайте закрытую подгруппу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3346f757dc7bcd14:
    english: "![Make delegate action in a member's menu](member_make_delegate.png)"
    translation: "![Действие «Сделать делегатом» в меню участника](member_make_delegate.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0b8bb762e37fb8c3:
    english: |-
      To create a poll or proposal and only invite the delegates, use the "Selected people only" poll setting.
      ![Selected people only setting when starting a proposal](poll_invited_people_only.png)
      Then when inviting people to vote you will see the "Delegates of group-name" option.
      ![Delegates of Oatmilk Cooperative option in the invite-to-vote form](poll_invite_delegates_group.png)
    translation: |-
      Чтобы создать голосование или предложение и пригласить только делегатов, выберите настройку «Только для избранных».
      ![Настройка «Только для избранных» при создании предложения](poll_invited_people_only.png)
      При приглашении к голосованию вы увидите вариант «Делегаты Название группы».
      ![Вариант «Делегаты Oatmilk Cooperative» в форме приглашения к голосованию](poll_invite_delegates_group.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e895a07efeaf4dcf:
    english: |-
      You can see a list of who the delegates are from the members tab of your group page. Use the filter menu and select "Delegates".
      ![Delegates option in the members filter](members_list_delegates.png)
    translation: |-
      Список делегатов можно посмотреть на вкладке участников страницы вашей группы. Откройте меню фильтров и выберите «Делегаты».
      ![Вариант «Делегаты» в фильтре списка участников](members_list_delegates.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
