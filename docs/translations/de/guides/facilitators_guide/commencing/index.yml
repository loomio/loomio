  dda14b86acbd8199:
    english: |-
      * Because Loomio is usually used as a space for constructive deliberation among groups with a specific purpose and set of members, for the most part people engage in good faith and behave respectfully.
      * Loomio is designed specifically to give voice to the individual, and let them communicate their needs and concerns. Even if a majority doesn’t see a problem, a single person can raise it and be heard.
      * Communicating online enables a certain level of physical safety, because people are not face to face.
      * Some groups already use the group description field to note a code of conduct or expectations for behavior. Others have collectively agreed a set of expectations that govern participation.
      * Many groups use Loomio itself to decide their group protocols, such as how to engage, what is allowed, what a decision means and what makes it valid, etc.
      * Some core protocol issues are answered simply by using Loomio: Who is allowed here? How do we communicate?
      * One of the most basic decisions Loomio users all encounter is about decision-making protocol — Consensus? Majority? Quorum? Unanimity? Bringing the question of decision-making protocol to the fore can be a very productive step in cultural development.
    translation: |-
      * Loomio wird meist von Gruppen mit einem gemeinsamen Zweck und einem festgelegten Mitgliederkreis für konstruktive Beratungen genutzt. Deshalb beteiligen sich die meisten Menschen in guter Absicht und gehen respektvoll miteinander um.
      * Loomio gibt Einzelnen Raum, ihre Bedürfnisse und Bedenken auszudrücken. Auch wenn die Mehrheit kein Problem sieht, kann eine einzelne Person es ansprechen und Gehör finden.
      * Online-Kommunikation kann ein gewisses Maß an körperlicher Sicherheit bieten, weil sich die Beteiligten nicht persönlich gegenüberstehen.
      * Manche Gruppen halten Verhaltensregeln oder Erwartungen in der Gruppenbeschreibung fest. Andere haben gemeinsam Erwartungen für die Teilnahme vereinbart.
      * Viele Gruppen nutzen Loomio, um ihre Regeln festzulegen: wie sie miteinander umgehen, was erlaubt ist und was eine Entscheidung bedeutet und gültig macht.
      * Einige grundlegende Fragen werden schon durch die Nutzung von Loomio beantwortet: Wer darf teilnehmen? Wie kommunizieren wir?
      * Eine grundlegende Frage, mit der sich alle Loomio-Nutzenden befassen, betrifft die Entscheidungsregeln: Konsens? Mehrheit? Quorum? Einstimmigkeit? Diese Frage ausdrücklich zu besprechen, kann die Entwicklung der Gruppenkultur voranbringen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
