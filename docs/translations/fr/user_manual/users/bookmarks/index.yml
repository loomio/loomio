blocks:
  4f81ad2ed2c971a4:
    english: "# Bookmarks"
    translation: "# Signets"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5d590d1d8ab9b956:
    english: |-
      Bookmarks are a personal list of Loomio items you want to return to. Your
      bookmarks are visible only to you and saving an item does not notify anyone
      else.
    translation: |-
      Les signets sont une liste personnelle d’éléments Loomio que vous souhaitez retrouver. Vos
      signets ne sont visibles que par vous. Enregistrer un élément n’en informe personne
      d’autre.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  aac40737df991d52:
    english: 'You can bookmark:'
    translation: 'Vous pouvez enregistrer des signets pour :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0f6c7e4161c72c18:
    english: |-
      - discussions
      - comments
      - proposals and polls
      - votes
      - outcomes
    translation: |-
      - les discussions
      - les commentaires
      - les propositions et les sondages
      - les votes
      - les conclusions
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fc91d7d6d32e590b:
    english: "## Save a bookmark"
    translation: "## Enregistrer un signet"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  daec09886eecd058:
    english: |-
      Open the action menu for the item and select **Save bookmark**. The action menu
      is usually shown as three dots. For a discussion, use the action menu near the
      discussion title; for a comment, vote, proposal, poll, or outcome, use the menu
      on that item.
    translation: |-
      Ouvrez le menu d’actions de l’élément et choisissez **Enregistrer le signet**. Ce menu
      est généralement représenté par trois points. Pour une discussion, utilisez le menu près du
      titre de la discussion. Pour un commentaire, un vote, une proposition, un sondage ou une conclusion,
      utilisez le menu de l’élément concerné.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  395a4c119e77f34b:
    english: "## View your bookmarks"
    translation: "## Voir vos signets"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a5e09c422c753df7:
    english: |-
      Open the sidebar and select **Bookmarks**. The number beside the link shows how
      many bookmarks you have saved.
    translation: |-
      Ouvrez la barre latérale et choisissez **Signets**. Le nombre à côté du lien indique combien
      de signets vous avez enregistrés.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7c21b03875c08b8e:
    english: |-
      The Bookmarks page lists your most recently saved items first. Each row shows
      the kind of item and its author. Select a row to return to the bookmarked item.
    translation: |-
      La page Signets affiche d’abord les éléments enregistrés le plus récemment. Chaque ligne indique
      le type d’élément et son auteur. Sélectionnez une ligne pour retrouver l’élément enregistré.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  644d774a0d045214:
    english: "## Remove a bookmark"
    translation: "## Supprimer un signet"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c2480aa6235675ba:
    english: |-
      On the Bookmarks page, select the remove-bookmark button at the end of a row.
      You can also open the bookmarked item's action menu and select **Remove
      bookmark**.
    translation: |-
      Sur la page Signets, sélectionnez le bouton de suppression du signet à la fin d’une ligne.
      Vous pouvez aussi ouvrir le menu d’actions de l’élément et choisir **Supprimer
      le signet**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6c20d47950313409:
    english: |-
      Removing a bookmark affects only your personal list. You can save the item
      again later.
    translation: |-
      La suppression d’un signet ne concerne que votre liste personnelle. Vous pouvez enregistrer l’élément
      à nouveau plus tard.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
