  a27011d28c4f11a6:
    english: "## Administering discussions"
    translation: "## Administración de discusiones"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8e67ece08e454475:
    english: There is a range of features in Loomio to help you administer discussions accessible from the drop down menu to the right of the discussion.
    translation: Loomio ofrece varias funciones para administrar las discusiones. Puedes acceder a ellas desde el menú desplegable situado a la derecha de cada discusión.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2d5be8c39f22ec28:
    english: 'Keep the discussion list current by using:'
    translation: 'Mantén actualizada la lista de discusiones con estas opciones:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  75739da1bd5910a6:
    english: |-
      - **Pin discussion** to keep important discussions at the top of the list
      - **Edit discussion** to change discussion title or update discussion context
      - **Move to group** when you want to move a discussion to another group or subgroup, or to an archive group.
      - **Lock thread** to prevent further comments or changes and remove the thread from the list of open threads. Locked threads are available under the discussion filter and from the search bar, and can be unlocked at any time.
      - **Delete discussion** when you do not want to keep a record of the discussion.  Note that deleted discussions can not be un-deleted.
    translation: |-
      - **Discusión sobre pines** para mantener las discusiones importantes al principio de la lista
      - **Editar hilo** para cambiar el título de una discusión o actualizar su contexto
      - **Mover al grupo** para trasladar una discusión a otro grupo, subgrupo o grupo de archivo.
      - **Bloquear hilo** para impedir nuevos comentarios o cambios y quitar el hilo de la lista de hilos abiertos. Puedes encontrar los hilos bloqueados mediante el filtro de discusiones o la barra de búsqueda, y desbloquearlos en cualquier momento.
      - **Eliminar discusión** cuando no quieras conservar un registro de la discusión. Ten en cuenta que no puedes recuperar las discusiones eliminadas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e3d2099d0e6fe6fa:
    english: "## Category tags"
    translation: "## Etiquetas de categoría"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  24b03357f6f6c3b9:
    english: Category tags are a great way to label discussions so they can be easily found. Set tags and apply to each discussion  - try to be consistent.
    translation: Las etiquetas de categoría ayudan a encontrar las discusiones. Define etiquetas y aplícalas a cada discusión de forma coherente.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f0f5f5abd586fb61:
    english: 'Common board tags include: Administration, AGM, Board meeting, Report, Finance, Legal, Members, Minutes, Planning, Policy, Resolution, Constitution, General meeting, Strategy.'
    translation: 'Entre las etiquetas habituales de una junta están: Administración, Asamblea general anual, Reunión de la junta, Informe, Finanzas, Asuntos legales, Miembros, Actas, Planificación, Políticas, Resolución, Estatutos, Asamblea general y Estrategia.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  89d8ec222f5019df:
    english: Group members can search for discussions by tag under the **tags** drop down menu.
    translation: Los miembros del grupo pueden buscar discusiones por etiqueta desde el menú desplegable **Etiquetas**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  54ee008489cceaca:
    english: "## Maintaining the discussion topic"
    translation: "## Mantener el tema de la discusión"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e9007433ca60ae39:
    english: Discussions work best for everyone when you can keep the discussion on a single topic.
    translation: Las discusiones funcionan mejor para todos cuando se mantienen centradas en un solo tema.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f742ae07824b35c6:
    english: If a new topic is introduced in the middle of a discussion, you can select and move specific comments to another discussion, or start a new discussion.
    translation: Si surge otro tema durante una discusión, puedes seleccionar comentarios concretos y moverlos a otra discusión, o iniciar una nueva.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c8b5176f58dceb8b:
