---
navigation_title: Знайомство вашої ради з Loomio
blocks:
  2d7d9e9285159d4f:
    english: "# Introducing Loomio to your board"
    translation: "# Знайомство вашої ради з Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6a42b6e2aba774c1:
    english: Loomio can become the online place where your board or committee meet, discuss, decide and build an auditable record for your organization.
    translation: Loomio може стати онлайн-простором, де ваша рада або комітет зустрічається, обговорює питання, ухвалює рішення та зберігає історію роботи організації, яку можна перевірити.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1e26a40fe8b74f47:
    english: Start with the general sequence in [Introducing Loomio to your group](/en/user_manual/overview/introducing_loomio). This page adds considerations specific to boards and committees.
    translation: Почніть із загальних кроків у посібнику [Знайомство вашої групи з Loomio](/en/user_manual/overview/introducing_loomio). На цій сторінці наведено додаткові поради для рад і комітетів.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2999c11b8e274b1b:
    english: However Loomio will be of little value if only some of your board participate.  Information and communication will likely remain scattered over multiple tools, lost in email inboxes and the confusion will waste everyone's time.
    translation: Якщо в Loomio працюватиме лише частина ради, користі від нього буде мало. Інформація й спілкування залишаться розпорошеними між різними інструментами та загубляться в електронній пошті. Плутанина забере час у всіх.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  28097dbe6dfd2fd7:
    english: 'Consider the problem you are trying to solve by using Loomio, say to improve and track communication or build institutional memory.  Then commit as a board to move your work into Loomio, and encourage everyone to make a genuine effort.  '
    translation: 'Визначте, яке завдання ви хочете розв’язати за допомогою Loomio: наприклад, поліпшити спілкування й відстежувати його або зберігати знання організації. Потім домовтеся всією радою перенести роботу в Loomio та заохочуйте кожного долучитися.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  449e6d5c90588dd2:
    english: As administrator your primary objective is to set up Loomio effectively for your board.
    translation: Як адміністратору, вам насамперед потрібно налаштувати Loomio для роботи вашої ради.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '08969c9eca0d9855':
    english: 'Aim to encourage directors to join and participate. They should be able to:'
    translation: 'Заохочуйте членів ради приєднатися й брати участь у роботі. Вони мають уміти:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  70bf0ec81830055e:
    english: |-
      - Sign in to Loomio
      - Read and comment on threads
      - Vote in polls
      - See how your governance practices work in Loomio
    translation: |-
      - Увійти в Loomio
      - Читати й коментувати теми
      - Голосувати в опитуваннях
      - Розуміти, як у Loomio відбувається робота ради
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d41ec118bb86c93f:
    english: "## Check technical proficiency "
    translation: "## Перевірте технічні навички"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  728e1c8d201cacca:
    english: Board members will need a computer or smartphone connected to the internet. They must be capable of sending and receiving email, browsing the web, reading digital documents, viewing and hearing videos.
    translation: Членам ради потрібен комп’ютер або смартфон із доступом до інтернету. Вони мають уміти надсилати й отримувати електронні листи, переглядати вебсторінки, читати цифрові документи та дивитися відео зі звуком.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  de1b1186edaff7c6:
    english: 'Check that members have all of the following:'
    translation: 'Переконайтеся, що всі учасники мають:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9932640dbf8944e3:
    english: |-
      - an up-to-date device—a computer, tablet or smart phone with email and a modern internet browser
      - internet service via WIFI, ethernet cable or mobile data plan (3G or above)
      - capability to send and receive email, browse the internet, download documents and play videos.
    translation: |-
      - сучасний пристрій — комп’ютер, планшет або смартфон із доступом до електронної пошти та сучасним браузером
      - доступ до інтернету через Wi-Fi, кабель Ethernet або мобільну мережу (3G чи новішу)
      - навички надсилання й отримання електронних листів, перегляду вебсторінок, завантаження документів і відтворення відео.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4496ce2ee6172b32:
    english: Loomio works with all standard internet browsers such as Google Chrome, Microsoft Edge, Firefox and Apple Safari. Old out-of-date browsers such as Microsoft Internet Explorer may not work.
    translation: Loomio працює в поширених браузерах, зокрема Google Chrome, Microsoft Edge, Firefox і Apple Safari. Застарілі браузери, як-от Microsoft Internet Explorer, можуть не працювати.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bd5dc5f2d0f56a28:
    english: If you have a problem using Loomio on your device, [Contact Loomio support](/contact).
    translation: Якщо у вас виникли проблеми з використанням Loomio на вашому пристрої, [зверніться до служби підтримки Loomio](/contact).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ca7b25bb2d86ba90:
    english: "## Configure your group"
    translation: "## Налаштуйте вашу групу"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  92712f3a984128af:
    english: |-
      ### Group Description
      The group description is the first place people see when they arrive into your Loomio group. Write it to help new members  understand the purpose of the group and the work you will do together. Provide any other information that orients people and encourages them to participate.
    translation: |-
      ### Опис групи
      Опис групи — перше, що люди бачать, відкривши вашу групу в Loomio. Допоможіть новим учасникам зрозуміти мету групи та спільну роботу. Додайте інформацію, яка допоможе їм зорієнтуватися й долучитися.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7e018e436df9afa1:
    english: 'For example, welcome people and let them know that this is there online space for communication and governance of your organization:'
    translation: 'Наприклад, привітайте людей і поясніть, що це онлайн-простір для спілкування й управління вашою організацією:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  826a76aa71e6d689:
    english: |-
      - Remind members of the purpose of the board or committee.
      - Outline how you intend to use Loomio; prepare for meetings, progress discussions, make decisions and stay in context between meetings.
      - Be clear who has access to the group, can read and participate.
      - Attach or link any background or governance documents.
    translation: |-
      - Нагадайте учасникам про призначення ради або комітету.
      - Опишіть, як ви плануєте використовувати Loomio: готуватися до засідань, продовжувати обговорення, ухвалювати рішення та підтримувати зв’язок між засіданнями.
      - Чітко вкажіть, хто має доступ до групи, може читати матеріали й брати участь.
      - Додайте документи з довідковою інформацією або правилами управління чи посилання на них.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  00c14924ec3f24cb:
    english: |-
      ### Check privacy and permission settings
      Loomio groups are **Secret** by default, which means only the people you specifically invite to the group know of its existence.
    translation: |-
      ### Перевірте налаштування приватності та дозволів
      За замовчуванням групи Loomio мають статус **Таємна**. Про існування такої групи знають лише люди, яких ви запросили.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9158ac7ea9b0db99:
    english: See [member permissions](/en/user_manual/groups/settings#permissions), and set to suit the proficiency of members in your group.  It may help to remove some permissions to avoid confusion as you are starting out. You can always restore permissions and everyone becomes more familiar with Loomio.
    translation: Перегляньте [дозволи учасників](/en/user_manual/groups/settings#permissions) і налаштуйте їх відповідно до навичок учасників вашої групи. На початку можна обмежити деякі дозволи, щоб уникнути плутанини. Згодом, коли всі краще освояться в Loomio, ви зможете їх відновити.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6a139f43ad2871f8:
    english: |-
      ### Category tags
      Add [category tags](/en/user_manual/discussions/tags/) to suit your organization.  Setting these in advance will help everyone use tags and find the threads and info they are looking for.
    translation: |-
      ### Мітки категорій
      Додайте [мітки категорій](/en/user_manual/discussions/tags/), які відповідають роботі вашої організації. Якщо налаштувати їх заздалегідь, учасникам буде простіше позначати матеріали й знаходити потрібні теми та інформацію.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7435f3589b1f26e3:
    english: |-
      ### Set up your personal profile
      Your [personal profile](/en/user_manual/users/user_profile) will help members of your group easily identify you, and have confidence that the messages they receive from you actually come from you.
    translation: |-
      ### Налаштуйте особистий профіль
      Ваш [особистий профіль](/en/user_manual/users/user_profile) допоможе учасникам групи впізнати вас і переконатися, що повідомлення справді надійшли від вас.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cf3684fe138b05fe:
    english: |-
      ### Manage group membership
      Make sure all the members of your board or committee have been [invited](/en/user_manual/groups/inviting_people/) to the group, and accepted their invitation.
    translation: |-
      ### Керуйте учасниками групи
      Переконайтеся, що всіх членів ради або комітету [запрошено](/en/user_manual/groups/inviting_people/) до групи й що вони прийняли запрошення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '029e18cb13c89e7b':
    english: "### Start with a board process"
    translation: "### Почніть із одного процесу ради"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ba8a6193de9c928f:
    english: The general introduction guide explains how to help everyone comment and vote once. For a board, follow that practice with one recurring governance process, such as preparing an agenda, approving minutes, reviewing a report, or making a small out-of-session decision.
    translation: 'Загальний вступний посібник пояснює, як допомогти кожному хоча б раз залишити коментар і проголосувати. Після цього спробуйте провести в Loomio один регулярний процес ради: підготувати порядок денний, затвердити протокол, розглянути звіт або ухвалити невелике рішення між засіданнями.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f7c156fde7984f49:
    english: Agree whether decisions made in Loomio take effect when their outcome is published or must be ratified at the next meeting. Record the agreed quorum, vote threshold, eligible voters, and ratification process in the group description or governance documents.
    translation: Домовтеся, чи рішення, ухвалені в Loomio, набирають чинності після публікації висновку, чи їх потрібно затвердити на наступному засіданні. Запишіть узгоджений кворум, необхідну кількість голосів, хто має право голосу та порядок затвердження в описі групи або документах про управління.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
