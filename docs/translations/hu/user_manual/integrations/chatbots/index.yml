  3c63f567f90fd1eb:
    english: |-
      After configuring your chosen service (see above), you'll have a webhook URL.
      Open **Chat integrations** from the group menu and add a new chat integration for your group.
    translation: |-
      Miután beállítottad a választott szolgáltatást (lásd fent), lesz egy webhook URL-ed.
      Nyisd meg a csoport menüjében a **Csevegési integrációk** pontot, és adj hozzá egy új csevegési integrációt a csoportodhoz.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
