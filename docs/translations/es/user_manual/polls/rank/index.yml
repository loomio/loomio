  7cf7aa3423ff6b9d:
    english: Rank finds the group's overall order of preference. Participants arrange options from most to least preferred, and Loomio assigns more points to higher-ranked options.
    translation: Rango muestra el orden general de preferencias del grupo. Los participantes ordenan las opciones de la más preferida a la menos preferida, y Loomio asigna más puntos a las opciones mejor situadas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72790fdf21d1f129:
    english: "## When to use Rank"
    translation: "## Cuándo usar Rango"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f9ce50752bf1c1e7:
    english: 'Use Rank when preference order matters and you want one overall ordering. It works well for:'
    translation: 'Usa Rango cuando importe el orden de preferencia y quieras obtener una clasificación general. Resulta útil para:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a5c8ee257df4dc2:
    english: |-
      - selecting one candidate for a position;
      - ordering projects for a work plan;
      - prioritizing conference topics;
      - choosing backup options as well as a first choice; or
      - reducing a long list to an ordered shortlist.
    translation: |-
      - seleccionar a una persona para un puesto;
      - ordenar proyectos para un plan de trabajo;
      - priorizar temas de una conferencia;
      - elegir alternativas además de una primera opción; o
      - reducir una lista larga a una selección ordenada.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2549ddaa8a4a4fa8:
    english: Rank uses a points-based ordering. It is not a proportional election method. To elect several people while representing different groups of voters, use an [STV Election](/en/user_manual/polls/stv/).
    translation: Rango ordena las opciones por puntos. No es un método de elección proporcional. Para elegir a varias personas y representar a distintos grupos de votantes, usa una [elección STV](/en/user_manual/polls/stv/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2a859bf73143ce12:
    english: "## Example: rank bottle designs"
    translation: "## Ejemplo: ordenar diseños de botellas"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  46a7d343d3b48bea:
    english: Oatmilk Cooperative asks members to rank four bottle designs for its returnable-bottle trial. Participants consider handling, durability, customer needs, storage, and compatibility with the washing equipment.
    translation: La Cooperativa Oatmilk pide a sus miembros que ordenen cuatro diseños de botellas para una prueba de botellas retornables. Los participantes tienen en cuenta la facilidad de uso, la durabilidad, las necesidades de los clientes, el almacenamiento y la compatibilidad con el equipo de lavado.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c74ebb16f872b3c6:
    english: "## Set up the poll"
    translation: "## Configurar la encuesta"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5975d0fd35ec0a7c:
    english: State what the ranking will determine and add the options. Set **Number of choices** to control how many options each person may rank. A first choice receives the most points, the next choice receives one fewer, and unranked options receive no points.
    translation: Indica qué decidirá la clasificación y añade las opciones. Configura **Número de opciones** para controlar cuántas puede ordenar cada persona. La primera opción recibe más puntos; la siguiente recibe un punto menos y las opciones que no se ordenen no reciben puntos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  47f32c81e29fa3c6:
    english: Require all options to be ranked when you need a complete ordering. Allow fewer choices when participants may not know enough to rank everything. Showing options in random order can reduce the influence of their initial presentation.
    translation: Exige que se ordenen todas las opciones si necesitas una clasificación completa. Permite elegir menos opciones si los participantes quizá no conozcan lo suficiente todas ellas. Mostrar las opciones en orden aleatorio puede reducir la influencia del orden en que aparecen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Votar"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  53946361c36775f0:
    english: Participants drag the options into their preferred order, with number 1 as the first choice. They can add a reason explaining the criteria behind their ranking.
    translation: Los participantes arrastran las opciones hasta colocarlas en el orden que prefieran, con el número 1 como primera opción. Pueden añadir una razón que explique los criterios de su clasificación.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eae63303cb9dced6:
    english: In this example, the voter puts the **500 ml amber bottle** first and the **500 ml clear bottle** second because both fit the existing cafe storage and washing equipment.
    translation: En este ejemplo, la persona votante coloca la **botella ámbar de 500 ml** en primer lugar y la **botella transparente de 500 ml** en segundo porque ambas caben en el espacio de almacenamiento de la cafetería y son compatibles con el equipo de lavado.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Interpretar los resultados"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6be27268f870dc3e:
    english: 'The results combine all ballots into an overall points-based ranking. For each option they show:'
    translation: 'Los resultados combinan todos los votos en una clasificación general por puntos. Para cada opción muestran:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  88b912ae1b9787bc:
    english: |-
      - **Rank**: its position in the combined result;
      - **% of points**: its share of all ranking points;
      - **Points**: the total points from all ballots;
      - **Mean**: its average points per voter; and
      - **Voters**: how many people ranked it.
    translation: |-
      - **Rango**: su posición en el resultado conjunto;
      - **% de puntos**: su porcentaje del total de puntos asignados;
      - **Puntos**: el total de puntos recibidos en todos los votos;
      - **Principal**: su promedio de puntos por votante; y
      - **Votantes**: cuántas personas la incluyeron en su clasificación.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2e0cda6f79f31a51:
    english: In this example, the **500 ml amber bottle** ranks first, followed by the **500 ml clear bottle** and the **750 ml amber bottle**. The group can investigate the preferred design first while retaining the remaining order as a sequence of alternatives.
    translation: En este ejemplo, la **botella ámbar de 500 ml** ocupa el primer lugar, seguida de la **botella transparente de 500 ml** y la **botella ámbar de 750 ml**. El grupo puede estudiar primero el diseño preferido y conservar el resto del orden como secuencia de alternativas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  22df687a6fa02ddb:
    english: A points-based result can conceal different preference patterns that produce the same total. Review individual ballots and vote reasons when options are close or the decision is consequential.
    translation: Un resultado basado en puntos puede ocultar patrones de preferencia distintos que producen el mismo total. Revisa los votos individuales y sus razones cuando las opciones estén muy igualadas o la decisión tenga consecuencias importantes.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
