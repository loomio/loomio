    english: "## Group page"
    translation: "## Сторінка групи"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d5b0be3db0bc6202:
    english: Your group home page introduces the group and provides access to its work.
    translation: Головна сторінка вашої групи знайомить із нею та дає доступ до її роботи.
    status: machine
