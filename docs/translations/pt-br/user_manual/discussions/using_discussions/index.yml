---
navigation_title: Como usar as discussões
blocks:
  d6fe7310d19b1141:
    english: "# Using threads"
    translation: "# Como usar as discussões"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  031f9244f107aba8:
    english: A discussion keeps its context, comments, decisions, and outcomes together in one thread. This page explains how to participate in a thread and use its navigation and actions.
    translation: Uma discussão reúne contexto, comentários, decisões e conclusões em uma mesma conversa. Esta página explica como participar e usar a navegação e as ações disponíveis.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  479a1564b496bfed:
    english: "## Thread anatomy"
    translation: "## Estrutura de uma discussão"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb745de96e6a612d:
    english: 'A typical thread looks like this:'
    translation: 'Uma discussão típica tem esta aparência:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e69f7f0b13fd9f9:
    english: 'From the top of the page, a thread contains:'
    translation: 'De cima para baixo, uma discussão contém:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5b47d6434aa50e94:
    english: "**Group name** - At the top left of the discussion page is the name of the group or subgroup that the discussion belongs to.  Click on this name to go back to the group page."
    translation: "**Nome do grupo** - No canto superior esquerdo da página da discussão aparece o nome do grupo ou subgrupo ao qual ela pertence. Selecione esse nome para voltar à página do grupo."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0dab4c46c2bee003:
    english: "**Discussion access** - The access icon at the top right opens the discussion's access settings. A group discussion is available to group members and anyone specifically invited to it, subject to the group's privacy settings."
    translation: "**Acesso à discussão** - O ícone de acesso no canto superior direito abre as configurações de acesso à discussão. Os membros do grupo e as pessoas convidadas especificamente podem acessar uma discussão do grupo, conforme as configurações de privacidade do grupo."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e20178954e6d3ce0:
    english: "**Discussion title** - The name of the discussion."
    translation: "**Título da discussão** - O nome da discussão."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  47687209ed924849:
    english: "**Category tags** - The discussion may have one or more category tags. Using simple tags helps people more easily find discussions of a similar type."
    translation: "**Categorização por tags** - A discussão pode ter uma ou mais tags de categoria. Tags simples ajudam as pessoas a encontrar discussões semelhantes."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b817649f985f51de:
    english: "**Discussion author** - The name and avatar of the person who started the discussion, shown beneath the title."
    translation: "**Autor da discussão** - O nome e a imagem de perfil da pessoa que iniciou a discussão, exibidos abaixo do título."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c44d5a833b4ec9ff:
    english: "**Date** - Hover over the date to see the full date and time of discussion start."
    translation: "**Data** - Passe o cursor sobre a data para ver a data e o horário completos em que a discussão começou."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b8062113f1078acb:
    english: "**Seen by** - In the right sidebar, shows who has read the discussion and when."
    translation: "**Visto por** - Na barra lateral direita, mostra quem leu a discussão e quando."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  133d0c2e469e9683:
    english: "**Notified** - In the right sidebar, shows who has been notified about the discussion and whether each notification has been read or its email opened."
    translation: "**Notificado** - Na barra lateral direita, mostra quem recebeu uma notificação sobre a discussão e se cada notificação foi lida ou o e-mail correspondente foi aberto."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9f788adb4eab80cc:
    english: "**Discussion context** - Content to frame the discussion."
    translation: "**Contexto da discussão** - Conteúdo que apresenta o assunto da discussão."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e8c5ae76dfb5b89b:
    english: "**Discussion interaction and administration tools** - The discussion context has controls to react to and edit it. The right sidebar contains notification, membership and administration actions."
    translation: "**Ferramentas de interação e administração da discussão** - O contexto da discussão oferece controles para reagir a ele e editá-lo. A barra lateral direita contém ações relacionadas a notificações, participantes e administração."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8f6eac4359c2b9f6:
    english: "**Comments** - Comments are displayed under the discussion context. The author's name, avatar and posting time show who wrote each comment and when. Interaction and administration tools are available on each comment."
    translation: "**Comentários** - Os comentários aparecem abaixo do contexto da discussão. O nome, a imagem de perfil e o horário de publicação mostram quem escreveu cada comentário e quando. Cada comentário oferece ferramentas de interação e administração."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f978af6c9af4afe5:
    english: |-
      **Navigation, notifications and actions** - The right sidebar contains
      shortcuts to activity and milestones, notification and membership information,
      and the thread actions available to you.
    translation: |-
      **Navegação, notificações e ações** - A barra lateral direita contém
      atalhos para atividades e marcos importantes, informações sobre notificações e participantes,
      e as ações da discussão disponíveis para você.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f8c4084e9e8a2b27:
    english: "## Discussion context"
    translation: "## Contexto da discussão"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5940bad6cb1cb49f:
    english: The discussion **context** is always found at the top of the discussion. Use the context to frame the discussion or decision.
    translation: O **contexto** sempre aparece no início da discussão. Use-o para apresentar o assunto da discussão ou da decisão.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  415dd2d0f1eacc9f:
    english: Think of your group as you write content in the discussion context.  Your aim is to get a discussion going, so consider how you can motivate people to participate.  In general, keep the discussion context simple and clear.
    translation: Pense no seu grupo ao escrever o contexto. Para iniciar a conversa, considere o que pode incentivar as pessoas a participar. Em geral, mantenha o contexto simples e claro.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a1fcece28d8fb61d:
    english: Write the discussion context when starting or editing a discussion. **Edit** a discussion with the pencil icon.
    translation: Escreva o contexto ao iniciar ou editar uma discussão. Use o ícone de lápis para **Editar** a discussão.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2f47adddef6b31d9:
    english: As the discussion progresses, update discussion context.  Think of the context like a whiteboard in your meeting room, where you can write the agenda, the outcomes intended and how you plan to get there.
    translation: Atualize o contexto conforme a discussão avança. Pense nele como um quadro na sala de reuniões, onde você pode registrar a pauta, as conclusões esperadas e como pretende chegar a elas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c82ec20629208982:
    english: At the bottom of the context panel is a formatting bar, where you can format text, attach files, images and embed a video.
    translation: Na parte inferior do painel de contexto há uma barra de formatação. Nela, você pode formatar texto, anexar arquivos e imagens e incorporar um vídeo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e606d83ae0fb2178:
    english: "### Notify people about context changes"
    translation: "### Notificar pessoas sobre mudanças no contexto"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d188326a58b28d96:
    english: When you edit the discussion context, use **What's changed?** to summarize the update and choose who should be notified.
    translation: Ao editar o contexto da discussão, use **O que mudou?** para resumir a atualização e escolher quem deve receber uma notificação.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  842091a987742d6d:
    english: "![Editing a discussion context with a change summary and notification recipients](../notifying_people/thread_editcontext.png)"
    translation: "![Edição do contexto de uma discussão com um resumo das mudanças e destinatários da notificação](../notifying_people/thread_editcontext.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b885359dd7e83428:
    english: The summary appears as an item in the thread so participants can see what changed.
    translation: O resumo aparece como um item na discussão para que os participantes vejam o que mudou.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c899c47e98f79a23:
    english: "![A timeline item describing a discussion context change](../notifying_people/thread_edit_comment.png)"
    translation: "![Item da linha do tempo que descreve uma mudança no contexto da discussão](../notifying_people/thread_edit_comment.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
