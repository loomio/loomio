navigation_title: Dirección de correo electrónico
blocks:
  14280ff177b248ab:
    english: "# Send an email to start a thread in your group"
    translation: "# Envía un correo electrónico para iniciar un hilo en tu grupo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e3de5524e10b9928:
    english: Your Loomio group has an email address! You can send or forward email to this address to start a thread in the group.
    translation: Tu grupo de Loomio tiene una dirección de correo electrónico. Puedes enviar o reenviar un correo a esa dirección para iniciar un hilo en el grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  85a7436d4a1b4396:
    english: |-
      You can see your group's email address on the group page:
      ![location of the email address on the group page](email_email_button.png)
    translation: |-
      Puedes ver la dirección de correo electrónico de tu grupo en la página del grupo:
      ![Ubicación de la dirección de correo electrónico en la página del grupo](email_email_button.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e34019bbcf3b319f:
    english: When you send an email to this address, a new thread will be started. The email subject becomes the thread title, the body of the email becomes the description, and any attached files will be attached to the thread.
    translation: Cuando envías un correo a esa dirección, se inicia un hilo. El asunto del correo pasa a ser el título del hilo, el cuerpo pasa a ser la descripción y los archivos adjuntos se añaden al hilo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  46a53b8267a61c2f:
    english: The email "From" address is used to find the group member who will be the author of the thread.
    translation: La dirección del remitente se usa para identificar al miembro del grupo que aparecerá como autor del hilo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bd7df6f632af8db1:
    english: "## Preventing unauthorized emails"
    translation: "## Impedir correos no autorizados"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a5118468df167ba0:
    english: To ensure that this feature cannot be used by people who are not members of your group, Loomio will require that the "From" address of an incoming email matches the address of someone in the group.
    translation: Para impedir que personas ajenas a tu grupo usen esta función, Loomio exige que la dirección del remitente de un correo entrante coincida con la de un miembro del grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f11910ae643c5b47:
    english: If you use multiple email addresses, you can add an alias so Loomio knows about your other email addresses.
    translation: Si usas varias direcciones de correo electrónico, puedes agregar un alias para que Loomio reconozca tus otras direcciones.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e3d88a25128322b5:
    english: When the "from" address does not match a member of the group, you will receive a notification asking you to add an alias or reject all further emails from that address.
    translation: Si la dirección del remitente no coincide con la de un miembro del grupo, recibirás una notificación para agregar un alias o rechazar todos los correos futuros de esa dirección.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  890546269cfa56b6:
    english: This means that the first time you send email from an unrecognised address, you will need to add an alias. After that, emails will be accepted immediately.
    translation: Por eso, la primera vez que envíes un correo desde una dirección que Loomio no reconoce, tendrás que agregar un alias. Después, los correos se aceptarán de inmediato.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e778a27d6b286135:
    english: "![Location of the approve and reject buttons for an unrecognised email](email_unreleased_emails.png)"
    translation: "![Ubicación de los botones para aprobar y rechazar un correo de una dirección no reconocida](email_unreleased_emails.png)"
    status: machine
    provider: codex/gpt-6-sol
