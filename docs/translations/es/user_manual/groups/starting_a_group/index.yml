    translation: "### Nombre del grupo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '019cdfc169ea858a':
    english: Type your group name. It's best to keep your group name short and concise.
    translation: Escribe el nombre de tu grupo. Es mejor que sea breve y claro.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6ae6b08ae7fbe257:
    english: "### Group handle"
    translation: "### Identificador del grupo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b054d0f760888add:
    english: Your group is automatically assigned a handle. The handle is used in the group's URL and email address, such as **loomio.com/your-group-handle** and **your-group-handle@loomio.com**.
    translation: Tu grupo recibe automáticamente un identificador. Este se usa en la URL y la dirección de correo electrónico del grupo, por ejemplo, **loomio.com/your-group-handle** y **your-group-handle@loomio.com**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1dee654ba628ba95:
    english: You can edit the handle when you create the group and change it later in group settings. When you change it, links and email addresses that use the old handle continue to work. Loomio keeps up to three old handles; after that, the oldest handle expires.
    translation: Puedes editar el identificador al crear el grupo y cambiarlo más adelante en la configuración del grupo. Si lo cambias, los enlaces y las direcciones de correo electrónico que usan el identificador anterior siguen funcionando. Loomio conserva hasta tres identificadores anteriores; después, caduca el más antiguo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
