    translation: "### Következtetés"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3c0061b9af0a6bca:
    english: When the Time poll closes, pick the best time and post an outcome.
    translation: Amikor lezárul az időpontválasztás, válaszd ki a legjobb időpontot, és tedd közzé a következtetést.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  62ef08e40ed2f44b:
    english: "**Notify**: Add the people you are inviting to the meeting or event"
