---
navigation_title: Presenta Loomio a tu grupo
blocks:
  6c777a62b2b77732:
    english: "# Introducing Loomio to your group"
    translation: "# Presenta Loomio a tu grupo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  438cc622ae730bd8:
    english: Introduce Loomio through one useful piece of work. Prepare the group before inviting people, help everyone participate once, and complete the process through to an outcome.
    translation: Presenta Loomio mediante una tarea útil. Prepara el grupo antes de invitar a la gente, ayuda a todas las personas a participar una vez y completa el proceso hasta publicar una conclusión.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9c9fa4e8f6e208e4:
    english: "## Choose one useful starting point"
    translation: "## Elige un punto de partida útil"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3353fb04e83837e5:
    english: Start with a real process that your group already needs. A good first use is small enough to complete soon, but relevant enough that people have a reason to participate.
    translation: Empieza con un proceso real que tu grupo ya necesite. Conviene que la primera tarea pueda completarse pronto y que sea lo bastante relevante para que la gente quiera participar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  652744a2ab28954b:
    english: 'For example:'
    translation: 'Por ejemplo:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  19bc6c09eeea816e:
    english: |-
      - prepare the agenda for an upcoming meeting;
      - review and approve meeting minutes;
      - gather feedback on a draft document;
      - decide a small operational question; or
      - identify priorities for the next month.
    translation: |-
      - preparar el orden del día de una próxima reunión;
      - revisar y aprobar el acta de una reunión;
      - recoger comentarios sobre el borrador de un documento;
      - resolver una cuestión operativa pequeña; o
      - definir las prioridades del próximo mes.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  68a0d6b76f36ebaf:
    english: Avoid moving every discussion and decision into Loomio at once. A repeatable process gives the group a clear reason to return and lets you improve the way you run it each time.
    translation: Evita trasladar todas las discusiones y decisiones a Loomio de una vez. Un proceso que puedas repetir da al grupo un motivo claro para volver y te permite mejorarlo cada vez.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4b65243ef120921b:
    english: "## Prepare the group before inviting people"
    translation: "## Prepara el grupo antes de invitar a la gente"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  305b29c1c832c246:
    english: 'Give people a useful and recognizable place to arrive in:'
    translation: 'Prepara un espacio útil y reconocible para quienes lleguen al grupo:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  76d859d168805706:
    english: |-
      - add the group's name, logo, cover image, purpose, and important links;
      - check the group's privacy and permissions;
      - add any [category tags](/en/user_manual/discussions/tags) the group will use regularly;
      - create the first real discussion, with the background information people need; and
      - create a practice discussion if members would benefit from trying comments, reactions, and voting without consequences.
    translation: |-
      - añade el nombre, el logotipo, la imagen de portada, el propósito y los enlaces importantes del grupo;
      - revisa la privacidad y los permisos del grupo;
      - añade las [etiquetas de categoría](/en/user_manual/discussions/tags) que el grupo usará habitualmente;
      - crea la primera discusión real e incluye la información de contexto que la gente necesita; y
      - crea una discusión de práctica si a los miembros les vendría bien probar los comentarios, las reacciones y la votación sin consecuencias.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f1decb57ec9d48cb:
    english: Use your own photo in your profile and the organization's logo for the group. This helps people recognize who invited them and which organization an email is about.
    translation: Usa una foto tuya en tu perfil y el logotipo de la organización para el grupo. Así, la gente podrá reconocer quién la invitó y a qué organización se refiere cada correo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '01965093f234bb36':
    english: "## Decide where work belongs"
    translation: "## Decide dónde va cada tarea"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7fbd0d770cbed2bd:
    english: 'Loomio can sit alongside tools your group already uses:'
    translation: 'Loomio puede usarse junto con las herramientas que tu grupo ya utiliza:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '0168271b154f6931':
    english: |-
      | Use | Good place for it |
      |---|---|
      | Quick questions, social conversation, and timely updates | Chat, such as Slack, Teams, Matrix, or Discord |
      | Collaborative editing of a living document | A shared document tool |
      | Assigning work and tracking its completion | A task or project-management tool |
      | A focused discussion, broad participation, a decision, and its lasting record | Loomio |
    translation: |-
      | Uso | Herramienta adecuada |
      |---|---|
      | Preguntas rápidas, conversación informal y novedades que conviene compartir enseguida | Un chat, como Slack, Teams, Matrix o Discord |
      | Edición colaborativa de un documento que cambia con el tiempo | Una herramienta de documentos compartidos |
      | Asignación de tareas y seguimiento hasta completarlas | Una herramienta de gestión de tareas o proyectos |
      | Una discusión centrada en un tema, participación amplia, una decisión y un registro duradero | Loomio |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  50fae2027411e538:
    english: Link to documents and other systems from the group description or discussion context. Use [chat integrations](/en/user_manual/integrations/chatbots) to bring important Loomio activity into a channel people already follow.
    translation: Añade enlaces a documentos y otros sistemas en la descripción del grupo o en el contexto de la discusión. Usa las [integraciones de chat](/en/user_manual/integrations/chatbots) para llevar la actividad importante de Loomio a un canal que la gente ya siga.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ed67af54bdf1c775:
    english: Tell members what you expect to happen in Loomio. A simple boundary such as “important discussions and decisions go in Loomio; quick coordination stays in chat” is easier to adopt than an unexplained new tool.
    translation: Explica a los miembros qué esperas que ocurra en Loomio. Una pauta sencilla, como «las discusiones y decisiones importantes van en Loomio; la coordinación rápida se queda en el chat», es más fácil de adoptar que una herramienta nueva sin explicación.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0a799d7911a46f6f:
    english: "## Decide how your group decides"
    translation: "## Decide cómo tomará decisiones tu grupo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e1c64de2dc68593:
    english: Loomio does not require every group, or every decision, to use the same process. Some groups arrive with established rules. Others use Loomio while they develop a clearer decision-making practice together.
    translation: Loomio no exige que todos los grupos ni todas las decisiones sigan el mismo proceso. Algunos grupos ya tienen reglas establecidas. Otros usan Loomio mientras acuerdan cómo tomar decisiones en conjunto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6d0c0f50959ab9d6:
    english: "### If your process is already established"
    translation: "### Si el proceso ya está establecido"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5fbfe86e935d5a8c:
    english: 'Translate the group''s existing requirements into Loomio. Before running a formal decision, make sure participants can tell:'
    translation: 'Adapta los requisitos actuales del grupo a Loomio. Antes de tomar una decisión formal, asegúrate de que los participantes sepan:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9a1b89bd4c5fe02c:
    english: |-
      - which kinds of decisions can be made in Loomio;
      - who provides input and who has authority to decide;
      - who is eligible to vote;
      - whether a [quorum](/en/user_manual/polls/quorum) is required;
      - whether the decision requires a majority, supermajority, unanimous agreement, consent, or another [vote share requirement](/en/user_manual/polls/vote_share_requirements);
      - whether the decision takes effect when its outcome is published or must be ratified elsewhere; and
      - who will record and carry out the outcome.
    translation: |-
      - qué tipos de decisiones pueden tomarse en Loomio;
      - quién aporta opiniones y quién tiene autoridad para decidir;
      - quién tiene derecho a votar;
      - si se requiere un [cuórum](/en/user_manual/polls/quorum);
      - si la decisión requiere mayoría, mayoría cualificada, unanimidad, consentimiento u otro [porcentaje de votos requerido](/en/user_manual/polls/vote_share_requirements);
      - si la decisión entra en vigor cuando se publica la conclusión o debe ratificarse en otro lugar; y
      - quién registrará y llevará a cabo lo acordado.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4b48b6e0aff5cfc0:
    english: If your constitution, bylaws, policy, or local law governs electronic decisions, make sure the Loomio process follows those requirements. Configure [delegated voters](/en/user_manual/groups/delegated_voters), proposal settings, and [poll templates](/en/user_manual/polls/poll_templates) to make the agreed process easy to repeat.
    translation: Si los estatutos, las normas internas, las políticas o la legislación local regulan las decisiones electrónicas, asegúrate de que el proceso en Loomio cumpla esos requisitos. Configura los [votantes delegados](/en/user_manual/groups/delegated_voters), los ajustes de las propuestas y las [plantillas de encuestas](/en/user_manual/polls/poll_templates) para facilitar la repetición del proceso acordado.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b068624ed6c7c6b3:
    english: "### If your group is still deciding"
    translation: "### Si tu grupo aún está decidiendo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  14449de544d28a6b:
    english: 'Start a discussion about how decisions should be made. Instead of beginning with a voting tool, ask the group to consider:'
    translation: 'Inicia una discusión sobre cómo tomar decisiones. Antes de elegir una herramienta de votación, invita al grupo a considerar estas preguntas:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f65b39a74ae25ed7:
    english: |-
      - What kinds of decisions do we make?
      - Who is affected, who should be consulted, and who is responsible for deciding?
      - Which decisions need advice, consent, consensus, a vote, or delegated authority?
      - What level of participation or support makes a decision valid?
      - How will we respond to objections, tied results, or insufficient participation?
      - How will we communicate, record, review, and change a decision?
    translation: |-
      - ¿Qué tipos de decisiones tomamos?
      - ¿A quiénes afectan, a quiénes debemos consultar y quién tiene la responsabilidad de decidir?
      - ¿Qué decisiones requieren asesoramiento, consentimiento, consenso, una votación o autoridad delegada?
      - ¿Qué nivel de participación o apoyo hace válida una decisión?
      - ¿Cómo responderemos a las objeciones, los empates o la participación insuficiente?
      - ¿Cómo comunicaremos, registraremos, revisaremos y cambiaremos una decisión?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ce7c0af2ad170b5c:
    english: The answers may be different for an operational decision, a policy, an election, and a constitutional change. See [Making decisions](/en/guides/making_decisions) to compare several complete processes.
    translation: Las respuestas pueden variar según se trate de una decisión operativa, una política, una elección o un cambio de estatutos. Consulta [Tomar decisiones](/en/guides/making_decisions) para comparar varios procesos completos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  aac26fc96b90744d:
    english: If the group is not ready to settle every rule, agree on a provisional process for one low-risk decision. State what the result will mean before asking people to participate, publish an outcome, then review how the process worked. Record what the group learns in its description, governance documents, or reusable templates.
    translation: Si el grupo aún no está listo para definir todas las reglas, acuerda un proceso provisional para una decisión de bajo riesgo. Explica qué significará el resultado antes de pedir participación. Después, publica una conclusión y revisa cómo funcionó el proceso. Registra lo aprendido en la descripción del grupo, en los documentos de gobernanza o en plantillas reutilizables.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  23ed8fb3e887afbc:
    english: "## Invite people"
    translation: "## Invita a la gente"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a5d369ad9df691fe:
    english: "[Invite people](/en/user_manual/groups/inviting_people) with a short personal message that explains:"
    translation: "[Invita a la gente](/en/user_manual/groups/inviting_people) con un mensaje personal breve que explique:"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3383207ff2fcc99b:
    english: |-
      - why the group is using Loomio;
      - what you are asking them to do first;
      - when you need their response; and
      - where they can get help.
    translation: |-
      - por qué el grupo usa Loomio;
      - qué les pides que hagan primero;
      - cuándo necesitas una respuesta; y
      - dónde pueden obtener ayuda.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  282ef8673815823e:
    english: You can begin with a small group of people who will actively test the process, or invite the whole group when everyone needs to participate from the start. In either case, have a discussion ready for them rather than inviting people into an empty group.
    translation: Puedes empezar con un grupo pequeño de personas que prueben activamente el proceso, o invitar a todo el grupo si todos deben participar desde el principio. En ambos casos, prepara una discusión antes de invitarlos para que no lleguen a un grupo vacío.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cd6511a78ce7c9b7:
    english: "## Help everyone participate once"
    translation: "## Ayuda a todas las personas a participar una vez"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a37273687b4f4b0:
    english: The first objective is for each person to cross the threshold from receiving an invitation to contributing something.
    translation: El primer objetivo es que cada persona pase de recibir una invitación a hacer una aportación.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ce285f27cca389c4:
    english: 'Ask people to:'
    translation: 'Pide a la gente que:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d0b9e80af995edff:
    english: |-
      1. sign in and add a profile photo;
      2. open the welcome or practice discussion;
      3. post a short comment or reaction; and
      4. vote in a low-stakes proposal and, if useful, leave a reason.
    translation: |-
      1. inicie sesión y añada una foto de perfil;
      2. abra la discusión de bienvenida o de práctica;
      3. publique un comentario breve o una reacción; y
      4. vote en una propuesta de poca importancia y, si resulta útil, explique el motivo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  919e32e7adb7c4c8:
    english: Members do not need to create a password. They can [sign in by email](/en/user_manual/users/signing_in), and they can reply to eligible discussion emails without first navigating back to the thread.
    translation: Los miembros no necesitan crear una contraseña. Pueden [iniciar sesión por correo electrónico](/en/user_manual/users/signing_in) y responder a los correos de discusiones que admitan respuestas sin tener que volver primero al hilo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  22ceb7104d416acf:
    english: "## Use notifications deliberately"
    translation: "## Usa las notificaciones de forma deliberada"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dd99e6dd5c93d9ee:
    english: Access to content and notification about it are separate. Group members can find discussions in their group even when they were not notified immediately.
    translation: El acceso al contenido y las notificaciones son cosas distintas. Los miembros pueden encontrar las discusiones de su grupo aunque no hayan recibido una notificación inmediata.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0e20732d957eb282:
    english: When starting a discussion, notify the people whose input is needed at that stage. Use @mentions and replies when asking particular people to respond. When voting opens later, invite the eligible voters.
    translation: Al iniciar una discusión, notifica a las personas cuya opinión se necesite en esa etapa. Usa menciones con @ y respuestas cuando quieras que respondan personas concretas. Cuando se abra la votación, invita a quienes tengan derecho a votar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  43339ff0f3d30a50:
    english: If you create a discussion and poll together only to capture a vote, avoid sending a discussion invitation immediately followed by a poll invitation. Either start the discussion without notifying people and invite them through the poll, or run a [standalone poll](/en/user_manual/polls/intro_to_decisions#without-a-discussion).
    translation: Si creas una discusión y una encuesta juntas solo para recoger votos, evita enviar una invitación a la discusión seguida inmediatamente de otra a la encuesta. Puedes iniciar la discusión sin notificar a nadie e invitar a la gente mediante la encuesta, o realizar una [encuesta independiente](/en/user_manual/polls/intro_to_decisions#without-a-discussion).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  467cf9d1e5bd2973:
    english: Show members the [Catch-up and notification settings](/en/user_manual/users/email_settings), especially if they do not expect to visit Loomio every day.
    translation: Muestra a los miembros la [configuración de los correos de resumen y las notificaciones](/en/user_manual/users/email_settings), especialmente si no tienen previsto entrar en Loomio todos los días.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ebe7764d64b17823:
    english: "## Complete the first process"
    translation: "## Completa el primer proceso"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9a165c59ba0aed5a:
    english: 'A first process should demonstrate the complete pattern:'
    translation: 'El primer proceso debe mostrar todas las etapas:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8bc60d4319adf204:
    english: |-
      1. Introduce the topic and provide context.
      2. Invite discussion or questions when they are needed.
      3. Start the appropriate proposal or poll.
      4. Remind people who have not participated when necessary.
      5. Publish an [outcome](/en/user_manual/polls/outcomes) stating what was decided and what happens next.
    translation: |-
      1. Presenta el tema y proporciona contexto.
      2. Invita a debatir o a hacer preguntas cuando sea necesario.
      3. Inicia la propuesta o el sondeo adecuado.
      4. Recuerda que participen quienes aún no lo hayan hecho, si es necesario.
      5. Publica una [conclusión](/en/user_manual/polls/outcomes) que indique qué se decidió y cuáles son los siguientes pasos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1235244007a8559b:
    english: The outcome closes the loop and creates a record that members can return to later. Afterward, ask what worked, adjust the process, and choose the next recurring piece of work to run in Loomio.
    translation: La conclusión cierra el proceso y deja un registro que los miembros pueden consultar más adelante. Después, pregunta qué funcionó, ajusta el proceso y elige la siguiente tarea periódica que realizaréis en Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c699f8804cdd41b1:
    english: For a facilitated sequence from discussion to decision, see [Making decisions](/en/guides/making_decisions). For board-specific practices, see [Introducing Loomio to your board](/en/guides/board_processes/introduce).
    translation: Para seguir un proceso guiado desde el debate hasta la decisión, consulta [Tomar decisiones](/en/guides/making_decisions). Si buscas prácticas específicas para juntas directivas, consulta [Presenta Loomio a tu junta directiva](/en/guides/board_processes/introduce).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
