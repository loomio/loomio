---
navigation_title: Користування темами
blocks:
  d6fe7310d19b1141:
    english: "# Using threads"
    translation: "# Користування темами"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  031f9244f107aba8:
    english: A discussion keeps its context, comments, decisions, and outcomes together in one thread. This page explains how to participate in a thread and use its navigation and actions.
    translation: Обговорення об’єднує контекст, коментарі, рішення та висновки в одній темі. На цій сторінці описано, як брати участь у темі, користуватися навігацією та виконувати дії.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  479a1564b496bfed:
    english: "## Thread anatomy"
    translation: "## Структура теми"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb745de96e6a612d:
    english: 'A typical thread looks like this:'
    translation: 'Типова тема має такий вигляд:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e69f7f0b13fd9f9:
    english: 'From the top of the page, a thread contains:'
    translation: 'Від початку сторінки тема містить:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5b47d6434aa50e94:
    english: "**Group name** - At the top left of the discussion page is the name of the group or subgroup that the discussion belongs to.  Click on this name to go back to the group page."
    translation: "**Назва групи** - Угорі ліворуч на сторінці обговорення вказано назву групи або підгрупи, до якої належить обговорення. Натисніть назву, щоб повернутися на сторінку групи."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0dab4c46c2bee003:
    english: "**Discussion access** - The access icon at the top right opens the discussion's access settings. A group discussion is available to group members and anyone specifically invited to it, subject to the group's privacy settings."
    translation: "**Доступ до обговорення** - Значок доступу вгорі праворуч відкриває налаштування доступу до обговорення. Обговорення в групі доступне її учасникам і людям, яких запросили особисто, відповідно до налаштувань приватності групи."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e20178954e6d3ce0:
    english: "**Discussion title** - The name of the discussion."
    translation: "**Назва обговорення** - Назва цього обговорення."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  47687209ed924849:
    english: "**Category tags** - The discussion may have one or more category tags. Using simple tags helps people more easily find discussions of a similar type."
    translation: "**Мітки категорій** - Обговорення може мати одну або кілька міток категорій. Прості мітки допомагають знаходити обговорення схожого типу."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b817649f985f51de:
    english: "**Discussion author** - The name and avatar of the person who started the discussion, shown beneath the title."
    translation: "**Автор обговорення** - Ім’я та аватар людини, яка розпочала обговорення, показані під назвою."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c44d5a833b4ec9ff:
    english: "**Date** - Hover over the date to see the full date and time of discussion start."
    translation: "**Дата** - Наведіть вказівник на дату, щоб побачити повну дату й час початку обговорення."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b8062113f1078acb:
    english: "**Seen by** - In the right sidebar, shows who has read the discussion and when."
    translation: "**Переглянуто** - У правій бічній панелі показано, хто й коли прочитав обговорення."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  133d0c2e469e9683:
    english: "**Notified** - In the right sidebar, shows who has been notified about the discussion and whether each notification has been read or its email opened."
    translation: "**Сповіщено** - У правій бічній панелі показано, кого сповістили про обговорення та чи прочитано кожне сповіщення або відкрито відповідний електронний лист."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9f788adb4eab80cc:
    english: "**Discussion context** - Content to frame the discussion."
    translation: "**Контекст обговорення** - Вміст, який окреслює тему обговорення."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e8c5ae76dfb5b89b:
    english: "**Discussion interaction and administration tools** - The discussion context has controls to react to and edit it. The right sidebar contains notification, membership and administration actions."
    translation: "**Інструменти взаємодії та керування обговоренням** - Біля контексту обговорення є елементи керування для реакцій і редагування. У правій бічній панелі є дії для сповіщень, учасників і керування обговоренням."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8f6eac4359c2b9f6:
    english: "**Comments** - Comments are displayed under the discussion context. The author's name, avatar and posting time show who wrote each comment and when. Interaction and administration tools are available on each comment."
    translation: "**Коментарі** - Коментарі відображаються під контекстом обговорення. Ім’я автора, аватар і час публікації показують, хто й коли написав кожен коментар. Для кожного коментаря доступні інструменти взаємодії та керування."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f978af6c9af4afe5:
    english: |-
      **Navigation, notifications and actions** - The right sidebar contains
      shortcuts to activity and milestones, notification and membership information,
      and the thread actions available to you.
    translation: |-
      **Навігація, сповіщення та дії** - Права бічна панель містить
      посилання для переходу до активності та важливих подій, відомості про сповіщення й учасників,
      а також доступні вам дії з темою.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f8c4084e9e8a2b27:
    english: "## Discussion context"
    translation: "## Контекст обговорення"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5940bad6cb1cb49f:
    english: The discussion **context** is always found at the top of the discussion. Use the context to frame the discussion or decision.
    translation: "**Контекст** обговорення завжди розміщений на його початку. Використовуйте його, щоб окреслити тему обговорення або рішення, яке потрібно ухвалити."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  415dd2d0f1eacc9f:
    english: Think of your group as you write content in the discussion context.  Your aim is to get a discussion going, so consider how you can motivate people to participate.  In general, keep the discussion context simple and clear.
    translation: Пишучи контекст обговорення, думайте про свою групу. Щоб розпочати обговорення, поясніть людям, чому варто взяти в ньому участь. Намагайтеся писати просто й зрозуміло.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a1fcece28d8fb61d:
    english: Write the discussion context when starting or editing a discussion. **Edit** a discussion with the pencil icon.
    translation: Додайте контекст, коли створюєте або змінюєте обговорення. Щоб **Редагувати** обговорення, натисніть значок олівця.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2f47adddef6b31d9:
    english: As the discussion progresses, update discussion context.  Think of the context like a whiteboard in your meeting room, where you can write the agenda, the outcomes intended and how you plan to get there.
    translation: 'Оновлюйте контекст у міру розвитку обговорення. Сприймайте його як дошку в кімнаті для зустрічей: тут можна записати порядок денний, очікувані висновки та план їх досягнення.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c82ec20629208982:
    english: At the bottom of the context panel is a formatting bar, where you can format text, attach files, images and embed a video.
    translation: Унизу панелі контексту є панель форматування. За її допомогою можна форматувати текст, прикріплювати файли й зображення та вставляти відео.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e606d83ae0fb2178:
    english: "### Notify people about context changes"
    translation: "### Сповіщення про зміни контексту"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d188326a58b28d96:
    english: When you edit the discussion context, use **What's changed?** to summarize the update and choose who should be notified.
    translation: Коли редагуєте контекст обговорення, скористайтеся полем **Що змінилося?**, щоб коротко описати оновлення та вибрати, кого сповістити.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  842091a987742d6d:
    english: "![Editing a discussion context with a change summary and notification recipients](../notifying_people/thread_editcontext.png)"
    translation: "![Редагування контексту обговорення з описом змін і вибором отримувачів сповіщення](../notifying_people/thread_editcontext.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b885359dd7e83428:
    english: The summary appears as an item in the thread so participants can see what changed.
    translation: Опис змін з’явиться як окремий елемент теми, щоб учасники могли побачити, що змінилося.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c899c47e98f79a23:
    english: "![A timeline item describing a discussion context change](../notifying_people/thread_edit_comment.png)"
    translation: "![Елемент хронології з описом зміни контексту обговорення](../notifying_people/thread_edit_comment.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  44ffd1d0a732b897:
    english: "## Navigation"
    translation: "## Навігація"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e96aef7a28a85001:
    english: 'The **Jump to** section of the right sidebar helps you move through a thread:'
    translation: 'Розділ **Перейти до** в правій бічній панелі допомагає пересуватися темою:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4790c088af5fc09f:
    english: |-
      - **Start** goes to the discussion context
      - **New to you** appears when the thread contains activity you have not read
      - **Latest** appears when newer activity is available beyond the items currently loaded
      - milestone links go directly to important comments, polls, and outcomes
      - **End** goes to the latest item in the thread
    translation: |-
      - **Початок** веде до контексту обговорення
      - **Новий для тебе** з’являється, коли в темі є активність, яку ви ще не прочитали
      - **Найновіші** з’являється, коли після завантажених елементів є новіша активність
      - посилання на важливі події ведуть безпосередньо до важливих коментарів, опитувань і висновків
      - **Кінець** веде до останнього елемента теми
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  941ea9900465724a:
    english: Comments that include an H2 or H3 heading, polls, and proposals are automatically included as milestone links. Select any milestone to go directly to it.
    translation: Коментарі із заголовком H2 або H3, опитування та пропозиції автоматично з’являються серед посилань на важливі події. Виберіть будь-яку з них, щоб перейти безпосередньо до неї.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e94ea6f4b9dae8d4:
    english: When you add a comment, poll, vote, or outcome, Loomio marks your own new item as read. It will not appear as something new for you to review.
    translation: Коли ви додаєте коментар, опитування, голос або висновок, Loomio позначає ваш новий елемент як прочитаний. Він не з’явиться серед нових елементів, які вам потрібно переглянути.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  34251ada1ba3e50b:
    english: "## Notifications and members"
    translation: "## Сповіщення та учасники"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  36a20a0e10208c7c:
    english: The right sidebar controls your email notifications and shows who has been invited, who has seen the thread, and who has been notified.
    translation: У правій бічній панелі можна налаштувати сповіщення електронною поштою та побачити, кого запросили, хто переглянув тему й кого сповістили.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f2a437ac1169c882:
    english: "### Email notifications for this thread"
    translation: "### Сповіщення електронною поштою для цієї теми"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9bd7269489ed048e:
    english: Select the current notification setting to choose whether Loomio emails you about all activity, only activity that specifically notifies you, or no activity. Receiving email for all activity can produce many messages in an active thread.
    translation: Натисніть поточне налаштування сповіщень, щоб вибрати, чи надсилатиме Loomio вам листи про всю активність, лише про активність, про яку вас сповіщають особисто, чи не надсилатиме їх зовсім. В активній темі сповіщення про всю активність можуть створити багато листів.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0d64de2345c8eba9:
    english: "![Email when notified selected in the discussion sidebar](../notifying_people/thread_interact.png)"
    translation: "![У бічній панелі обговорення вибрано сповіщення електронною поштою](../notifying_people/thread_interact.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7bdbdaa98e89d1c3:
    english: "### Invite people"
    translation: "### Запрошення людей"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e81f85e723885264:
    english: Select **Invite people** to add people after the thread has started.
    translation: Виберіть **Запросити людей**, щоб додати людей після початку теми.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e38a572cdffad5cb:
    english: "![Invite people in the thread sidebar](../notifying_people/thread_invite_icon.png)"
    translation: "![Запросити людей на бічній панелі теми](../notifying_people/thread_invite_icon.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7e4e643fb327aa06:
    english: Select a group or subgroup, enter the names of individual members, or enter an email address to invite a guest.
    translation: Виберіть групу або підгрупу, введіть імена окремих учасників або електронну адресу, щоб запросити гостя.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  03c1d74b4a8bc31d:
    english: "![Invite people window with a field for names and email addresses](../notifying_people/thread_invite.png)"
    translation: "![Вікно запрошення людей із полем для імен та електронних адрес](../notifying_people/thread_invite.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  85fc948a4e849ba8:
    english: A guest can see and participate in this thread but cannot see other discussions in the group unless separately invited.
    translation: Гість може переглядати цю тему й брати участь в обговоренні, але не бачить інших обговорень у групі, якщо його не запросили до них окремо.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9f1010b58cc5439f:
    english: "![Inviting a guest by email address](../notifying_people/invite_guest.png)"
    translation: "![Запрошення гостя за електронною адресою](../notifying_people/invite_guest.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e688189fa93b1e49:
    english: To remove someone, open the three-dot menu (**⋯**) beside their name and select **Remove from discussion**.
    translation: Щоб видалити людину з обговорення, відкрийте меню з трьома крапками (**⋯**) біля її імені та виберіть **Видалити з обговорення**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5602fbfa565eaf45:
    english: "### Seen by"
    translation: "### Переглянуто"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a929b22d02292573:
    english: "**Seen by** shows who has opened the thread and when. It can help you identify people who may not have seen important information yet."
    translation: "**Переглянуто** показує, хто й коли відкрив тему. Це допомагає побачити, хто ще міг не ознайомитися з важливою інформацією."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d0335d202c5bbaa3:
    english: "![Seen by and Notified in the Thread members section](../notifying_people/thread_engagement.png)"
    translation: "![Переглянуто та Сповіщено в розділі учасників теми](../notifying_people/thread_engagement.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb77150441a43f5c:
    english: "![Seen by window listing thread members](../notifying_people/thread_seenby.png)"
    translation: "![Вікно Переглянуто зі списком учасників теми](../notifying_people/thread_seenby.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  185f80d66c2091d8:
    english: "### Notified"
    translation: "### Сповіщено"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  885a21cbc1a44f7d:
    english: "**Notified** opens the discussion notification history. It includes invitations, mentions, and replies, showing who was notified and whether each notification has been read when that information is available."
    translation: "**Сповіщено** відкриває історію сповіщень про обговорення. Вона містить запрошення, згадки та відповіді й показує, кого було сповіщено та чи прочитано кожне сповіщення, якщо ця інформація доступна."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e73fae9309f626e2:
    english: "![Discussion notification history](../notifying_people/thread_notified.png)"
    translation: "![Історія сповіщень про обговорення](../notifying_people/thread_notified.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  347def7574cf5f1d:
    english: "## Actions"
    translation: "## Дії"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '08ff4ccd500c2a69':
    english: The right sidebar contains actions for the whole thread. Some actions are also available from the three-dot menu (**⋯**) beside a thread on the group page.
    translation: На правій бічній панелі розміщено дії для всієї теми. Деякі дії також доступні в меню з трьома крапками (**⋯**) біля теми на сторінці групи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e73701c7d36f95ef:
    english: The actions shown depend on your permissions. Group admins can manage threads, and group settings may allow members to perform some management actions. See [Group permissions](/en/user_manual/groups/settings/permissions).
    translation: Доступні дії залежать від ваших прав. Адміністратори групи можуть керувати темами, а налаштування групи можуть дозволяти учасникам виконувати деякі дії з керування. Дивіться [Права доступу в групі](/en/user_manual/groups/settings/permissions).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4fce317a163b0a40:
    english: "### Print"
    translation: "### Друкувати"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9317d4c7c5ef4764:
    english: Select **Print** to generate a page suitable for printing. Use your browser's print dialog to save it as a PDF.
    translation: Виберіть **Друкувати**, щоб створити сторінку для друку. У діалоговому вікні друку браузера її можна зберегти як PDF.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  443af0749df1db2a:
    english: "### Markdown"
    translation: "### Markdown"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eb0442148f7c042d:
    english: Select **Markdown** to save the complete thread as structured Markdown. Choose **Copy Markdown** to copy it to your clipboard, or **Download Markdown** to save it as a `.md` file. You can use it for meeting minutes, a document, an archive of decisions, an AI assistant, or another tool that supports Markdown.
    translation: Виберіть **Markdown**, щоб зберегти всю тему як структурований документ Markdown. Виберіть **Копіювати Markdown**, щоб скопіювати його до буфера обміну, або **Завантажити Markdown**, щоб зберегти як файл `.md`. Документ можна використати для протоколу зустрічі, архіву рішень, роботи з помічником зі штучним інтелектом чи іншим інструментом, що підтримує Markdown.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  80e3f57638b53cb4:
    english: The document begins with YAML front matter containing the thread key, group, creation date, last activity date, and tags. It then includes the discussion context and every comment, poll, vote, and outcome in the same order and nesting as the threaded view.
    translation: На початку документа міститься блок метаданих YAML із ключем теми, групою, датою створення, датою останньої активності та мітками. Далі йдуть контекст обговорення та всі коментарі, опитування, голоси й висновки в тому самому порядку та з тим самим вкладенням, що й у поданні з відповідями під повідомленнями.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f99823b7b44e2cdd:
    english: Each poll is a section. Comments, votes, and outcomes are quoted, and replies are quoted beneath the item they answer. This shows where each person's text begins and ends. Each quote starts with one line showing the person, when they posted, the item's number in the thread, and any reactions. Votes and outcomes also say what they are. The thread key and item number identify each item in Loomio.
    translation: Кожне опитування утворює окремий розділ. Коментарі, голоси та висновки оформлено як цитати, а відповіді розміщено під тим елементом, на який вони відповідають. Так видно, де починається й закінчується текст кожної людини. На початку кожної цитати є рядок з іменем автора, часом публікації, номером елемента в темі та реакціями, якщо вони є. Для голосів і висновків також зазначено їхній тип. Ключ теми й номер елемента дають змогу знайти кожен елемент у Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e5bdfbb4a0d7646f:
    english: Loomio applies the same visibility rules as the thread. Results and vote reasons you cannot see are not included, and voters are not identified in anonymous polls. If an open poll hides results until you vote, vote before exporting the thread. **Markdown** and **Print** are unavailable until you do.
    translation: Loomio застосовує ті самі правила видимості, що й у темі. Результати та пояснення голосів, до яких у вас немає доступу, не додаються. У анонімних опитуваннях імена виборців не вказуються. Якщо результати відкритого опитування приховані до голосування, проголосуйте перед експортом теми. До цього **Markdown** і **Друкувати** недоступні.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7989d3386a42f180:
    english: 'For example, a discussion containing a comment, reactions, a proposal, two votes, a reply, and an outcome produces this Markdown:'
    translation: 'Наприклад, обговорення з коментарем, реакціями, пропозицією, двома голосами, відповіддю та висновком утворює такий документ Markdown:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  275f4d9025c017c4:
    english: The headings and labels use your selected language. Content written by participants remains in its original language.
    translation: Заголовки й мітки відображаються вибраною вами мовою. Текст учасників залишається мовою оригіналу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dab18fdf3c56269d:
    english: "### Thread settings and display"
    translation: "### Налаштування та вигляд теми"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7bc55279f97c6d1b:
    english: Group admins can select **Thread settings** to change how replies are arranged and configure other discussion options.
    translation: Адміністратори групи можуть вибрати **Налаштування теми**, щоб змінити розташування відповідей та інші параметри обговорення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  32b2640ba23524aa:
    english: Choose **Timeline** to list items in the order they were posted, or **Threaded** to group replies beneath the item they respond to. Thread settings also control whether multiple polls may run at once and can set a maximum comment length. These settings apply to everyone in the discussion.
    translation: Виберіть **Хронологія**, щоб бачити елементи в порядку публікації, або **Threaded**, щоб відповіді відображалися під елементами, на які вони відповідають. У налаштуваннях теми також можна дозволити кілька одночасних опитувань і встановити максимальну довжину коментаря. Ці налаштування діють для всіх учасників обговорення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a520339278bcc2a:
    english: "### Pin or unpin a thread"
    translation: "### Закріплення та відкріплення теми"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0433e7a61db60003:
    english: Pinned threads appear above other threads on the group page. Welcome discussions, news items, and announcements are typical uses for pinned threads.
    translation: Закріплені теми відображаються над іншими темами на сторінці групи. Так можна розміщувати вітальні обговорення, новини й оголошення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b2712588a5e0aab3:
    english: Open the three-dot menu (**⋯**) beside the thread on the group page and select **Pin thread**. Pinned threads are ordered by the time they were pinned. To change their order, unpin and pin them again.
    translation: Відкрийте меню з трьома крапками (**⋯**) біля теми на сторінці групи та виберіть **Закріпити тему**. Закріплені теми впорядковано за часом закріплення. Щоб змінити їхній порядок, відкріпіть і знову закріпіть їх.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a0443f076d1b8ae5:
    english: Select **Unpin thread** to return a thread to the activity-based order.
    translation: Виберіть **Відкріпити тему**, щоб повернути тему до порядку за активністю.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b90a469963b02ffc:
    english: "### Move a thread"
    translation: "### Переміщення теми"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8b2071f4625705e5:
    english: Select **Move thread** to move a thread to another group, subgroup, or to a direct thread. It will be visible to members of the destination group and anyone specifically invited to it.
    translation: Виберіть **Перемістити тему**, щоб перенести її до іншої групи, підгрупи або зробити прямою темою. Її бачитимуть учасники групи призначення та всі, кого запросили до теми окремо.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f09d5f2afce03ee8:
    english: |-
      >[!Tip]
      >Start a draft as a direct discussion or in a private subgroup, then move it to the group when it is ready.
    translation: |-
      >[!Tip]
      >Почніть чернетку як пряме обговорення або в приватній підгрупі, а коли вона буде готова, перемістіть її до групи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c82562b641053308:
    english: To move selected activity rather than the whole thread, see [Moving items between threads](/en/user_manual/discussions/moving_items/).
    translation: Щоб перемістити окремі елементи, а не всю тему, дивіться [Переміщення елементів між темами](/en/user_manual/discussions/moving_items/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  be22d2980075fdaa:
    english: "### Lock or unlock a thread"
    translation: "### Блокування та розблокування теми"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e7c24a610fd2bf8b:
    english: Lock a thread to prevent comments or further changes. A thread can only be locked after its active polls have closed.
    translation: Заблокуйте тему, щоб заборонити коментарі та подальші зміни. Тему можна заблокувати лише після завершення всіх активних опитувань у ній.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  edb983bb6366aa6c:
    english: Select **Lock thread** under **Actions**. Locked threads are removed from the list of open discussions and marked with a **Locked** tag.
    translation: Виберіть **Заблокувати тему** в розділі **Дії**. Заблоковані теми зникають зі списку відкритих обговорень і позначаються міткою **Заблоковано**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ba2794349524cc33:
    english: To find a locked thread, open the discussion filter on the group page and select **Locked**. Open the thread and select **Unlock thread** to allow comments and changes again.
    translation: Щоб знайти заблоковану тему, відкрийте фільтр обговорень на сторінці групи та виберіть **Заблоковано**. Відкрийте тему й виберіть **Розблокувати тему**, щоб знову дозволити коментарі та зміни.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3a75fb1ad0ffab87:
    english: "### Delete a thread"
    translation: "### Видалення теми"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0103a5729bd6a095:
    english: Deleting a thread removes it permanently and cannot be undone. Lock the thread instead if you may need it again.
    translation: Видалення теми є остаточним, і його не можна скасувати. Якщо тема може знадобитися вам знову, заблокуйте її.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  daf08ca8895b0fe2:
    english: Select **Delete thread** and confirm the deletion.
    translation: Виберіть **Видалити тему** й підтвердьте видалення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
