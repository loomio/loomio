---
navigation_title: Ein Treffen vorbereiten
blocks:
  165e9dec4d4660aa:
    english: "# Prepare for a meeting"
    translation: "# Ein Treffen vorbereiten"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5d14c790e0c05446:
    english: Effective meetings are productive, inclusive, and collaborative - they improve engagement, help build strong relationships, establish alignment, make better and faster decisions, promote inclusion, facilitate creative thinking and innovation, are a great channel for feedback and continuous improvement.
    translation: Gute Treffen sind produktiv, offen für alle und gemeinschaftlich. Sie fördern die Beteiligung, stärken Beziehungen und schaffen ein gemeinsames Verständnis. Sie helfen dabei, bessere Entscheidungen schneller zu treffen, neue Ideen zu entwickeln und Rückmeldungen für Verbesserungen zu sammeln.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c69f325003094ac5:
    english: Use Loomio to plan an effective meeting; involve people from the outset, align towards the most important topics, and make better use of your precious time together.
    translation: Nutze Loomio, um ein gutes Treffen zu planen. Beziehe die Beteiligten von Anfang an ein, verständige dich mit ihnen über die wichtigsten Themen und nutze eure gemeinsame Zeit gut.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a30a32e8b06a9432:
    english: If the group is new to Loomio, begin with [Introducing Loomio to your group](/en/user_manual/overview/introducing_loomio), then use this meeting process as a practical first recurring workflow.
    translation: Wenn deine Gruppe Loomio noch nicht kennt, beginne mit [Loomio in deiner Gruppe vorstellen](/en/user_manual/overview/introducing_loomio). Nutze diesen Ablauf dann als ersten regelmäßigen Arbeitsprozess.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9a0eb26797e28e0f:
    english: There are several things you can do to make your next board or committee meeting effective...
    translation: 'So kannst du dein nächstes Vorstands- oder Ausschusstreffen vorbereiten:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c04e8fcfc9edb01c:
    english: |-
      - [Meeting focus and review actions](#meeting-focus-and-review-actions)
      - [Announce agenda and notify](#agenda-and-notify)
      - [Find a time for meeting](#find-a-time-for-meeting)
      - [Sign off minutes](#sign-off-minutes)
      - [Approve reports](#approve-reports)
    translation: |-
      - [Schwerpunkte festlegen und Aufgaben prüfen](#meeting-focus-and-review-actions)
      - [Tagesordnung ankündigen und Mitglieder benachrichtigen](#agenda-and-notify)
      - [Einen Termin finden](#find-a-time-for-meeting)
      - [Protokoll bestätigen](#sign-off-minutes)
      - [Berichte genehmigen](#approve-reports)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6e6785b547007644:
    english: "## Meeting focus and review actions"
    translation: "## Schwerpunkte festlegen und Aufgaben prüfen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  26bf98782eb61549:
    english: 'Establish a focus for the meeting, so you spend your precious time together talking about the most important topics.  '
    translation: Lege Schwerpunkte für das Treffen fest, damit ihr eure gemeinsame Zeit für die wichtigsten Themen nutzt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c23fdd52f0a29b2c:
    english: Inviting members to contribute to the agenda helps everyone align, think about topics and energize for the meeting.
    translation: Wenn Mitglieder zur Tagesordnung beitragen, können sich alle auf die Themen einstellen und auf das Treffen vorbereiten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  52409f3ffabfb7d1:
    english: |-
      Actions:
      - focus the meeting on the most important things,
      - follow up and talk to members about actions from previous meetings.
    translation: |-
      Aufgaben:
      - das Treffen auf die wichtigsten Themen ausrichten,
      - Aufgaben aus früheren Treffen nachverfolgen und mit den Mitgliedern besprechen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a52dd7ebb4619e46:
    english: |-
      ### On Loomio
      Use a Loomio **Discussion** to prepare for your meeting:
      * remind members about the meeting coming up,
      * invite comment about the most important things to focus on,
      * summarize actions from the previous meeting and ask for an update.
    translation: |-
      ### Auf Loomio
      Nutze eine Loomio-**Diskussion**, um dein Treffen vorzubereiten:
      * erinnere die Mitglieder an das bevorstehende Treffen,
      * bitte um Vorschläge für die wichtigsten Themen,
      * fasse die Aufgaben aus dem letzten Treffen zusammen und bitte um einen aktuellen Stand.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5bcd10bb61edcc35:
    english: "## Agenda and notify"
    translation: "## Tagesordnung ankündigen und Mitglieder benachrichtigen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d9431846021bb8f3:
    english: Announce the meeting with a clear agenda. Attach papers, link to key documents and notify members.
    translation: Kündige das Treffen mit einer klaren Tagesordnung an. Hänge Unterlagen an, verlinke wichtige Dokumente und benachrichtige die Mitglieder.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  41e84b882fa9bab1:
    english: This helps everyone prepare for the meeting, by reading the materials and thinking about topics of discussion and the decisions to be made.  Members are then more likely to arrive in context and ready for the meeting.
    translation: So können alle die Unterlagen lesen und sich mit den Gesprächsthemen und anstehenden Entscheidungen befassen. Die Mitglieder kommen besser vorbereitet zum Treffen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b6b0e7ed67711d5b:
    english: |-
      Actions:
      - prepare agenda, documents, materials and board papers,
      - notify members of meeting and send materials.
    translation: |-
      Aufgaben:
      - Tagesordnung, Dokumente und weitere Sitzungsunterlagen vorbereiten,
      - Mitglieder über das Treffen benachrichtigen und ihnen die Unterlagen schicken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5b6d4a5158e41747:
    english: |-
      ### On Loomio
      Use a Loomio **Discussion** to prepare for your board meeting:
      * state details of meeting,
      * attach or link agenda, documents and other meeting materials,
      * invite members with a notification,
      * monitor 'Seen by' to see who has read the thread.
    translation: |-
      ### Auf Loomio
      Nutze eine Loomio-**Diskussion**, um dein Vorstandstreffen vorzubereiten:
      * nenne die Einzelheiten des Treffens,
      * hänge die Tagesordnung, Dokumente und weitere Unterlagen an oder verlinke sie,
      * lade Mitglieder mit einer Benachrichtigung ein,
      * prüfe unter „Angesehen von“, wer die Diskussion gelesen hat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f2c8f10394bf10c8:
    english: |-
      While similar to sending an email, a Loomio thread has advantages:
      - you can see who has read the thread, and remind those who haven't,
      - member replies or comments are visible to everyone who has permission to view the thread,
      - any discussion or questions about the agenda or meeting materials is held in a single place.
    translation: |-
      Eine Loomio-Diskussion ähnelt einer E-Mail, bietet aber weitere Möglichkeiten:
      - du siehst, wer die Diskussion gelesen hat, und kannst die anderen daran erinnern,
      - Antworten und Kommentare der Mitglieder sind für alle sichtbar, die Zugriff auf die Diskussion haben,
      - Fragen und Gespräche zur Tagesordnung und zu den Unterlagen bleiben an einem Ort.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dd6d8cabe5f1810d:
    english: Members can find all the information about the meeting readily available in one place, thereby avoiding confusing email chains and losing important info in their email inbox.
    translation: Die Mitglieder finden alle Informationen zum Treffen an einem Ort. So gehen wichtige Angaben nicht in langen E-Mail-Verläufen oder Posteingängen verloren.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6a57d003a0bd5f07:
    english: |-
      ### Confirm
      Ask members to leave a comment confirming they have read the agenda and meeting papers and are prepared for the meeting. Use **Seen by** to identify anyone who may need a reminder.
    translation: |-
      ### Bestätigung einholen
      Bitte die Mitglieder, in einem Kommentar zu bestätigen, dass sie die Tagesordnung und die Unterlagen gelesen haben und auf das Treffen vorbereitet sind. Unter **Angesehen von** siehst du, wen du noch erinnern solltest.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d08b0ae5712ef2d:
    english: "## Find a time for meeting\nFinding a time to meet can be a frequent headache for many administrators. "
    translation: |-
      ## Einen Termin finden
      Einen gemeinsamen Termin zu finden, kostet Verantwortliche oft viel Zeit.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1da8fdf943571a19:
    english: |-
      ### On Loomio
      If you have not yet set a date and time for the meeting or you need to find a time for a future meeting, you can use **Time poll**.
    translation: |-
      ### Auf Loomio
      Wenn Datum und Uhrzeit noch nicht feststehen oder du einen Termin für ein späteres Treffen suchst, nutze eine **Zeitumfrage**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f1c92e27dfd63153:
    english: Time poll makes it easy to see everyone's availability and find the best time, reducing time and energy needed for this common admin task.
    translation: Mit einer Zeitumfrage siehst du, wann alle Zeit haben, und findest einen passenden Termin. Das spart Zeit bei der Organisation.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  45b90fd46cce4976:
    english: Members in different time zones will see dates and times localized in their time zone.
    translation: Mitglieder in unterschiedlichen Zeitzonen sehen Datum und Uhrzeit jeweils in ihrer eigenen Zeitzone.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dc159c751f73d5d1:
    english: 'When the Time poll closes, choose the best time and send an outcome notification with a calendar invitation, so members can add the meeting to their calendar. '
    translation: Wenn die Zeitumfrage endet, wähle den besten Termin und verschicke ein Fazit mit einer Kalendereinladung. So können die Mitglieder das Treffen in ihren Kalender eintragen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4bafee41dd5f774c:
    english: "## Sign off minutes\nApproving or ratifying minutes is standard practice for formal meetings and good practice for all meetings.  "
    translation: |-
      ## Protokoll bestätigen
      Protokolle zu genehmigen oder förmlich zu bestätigen, ist bei formellen Treffen üblich und auch bei anderen Treffen sinnvoll.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d9795ed92dabff7:
    english: 'Minutes provide a record of the meeting, key points raised during discussion, results of decisions and how people voted. They include the actions agreed and the person(s) responsible, and are often the starting point for the next meeting.  '
    translation: Ein Protokoll hält das Treffen, wichtige Gesprächspunkte, Entscheidungen und Abstimmungen fest. Es nennt die vereinbarten Aufgaben und die verantwortlichen Personen. Oft bildet es die Grundlage für das nächste Treffen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1fd0d860cba070db:
    english: Minutes are valuable as a reminder for people present, helpful for those absent and a record to consult in case of conflict.
    translation: Das Protokoll erinnert die Anwesenden an die besprochenen Punkte, informiert abwesende Personen und kann bei Unstimmigkeiten herangezogen werden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  166796d872f35962:
    english: "### On Loomio"
    translation: "### Auf Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ef51b49480cb721a:
    english: Post the minutes in the Loomio meeting thread within a few days of the meeting and invite participants to approve.  This keeps the minutes relevant and fresh in member's minds and is a great way to remind members of their actions.  It also saves some time during your meeting.
    translation: Veröffentliche das Protokoll innerhalb weniger Tage nach dem Treffen in der zugehörigen Loomio-Diskussion und bitte die Teilnehmenden um Zustimmung. So ist das Treffen noch gut in Erinnerung, und die Mitglieder werden an ihre Aufgaben erinnert. Beim nächsten Treffen spart ihr dadurch Zeit.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ea02d6cf3ede73dc:
    english: The example above uses a **Choose** poll with two options 'Accept' or 'Review'.
    translation: Das Beispiel oben zeigt eine **Wählen**-Umfrage mit den beiden Optionen „Annehmen“ und „Überarbeiten“.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  56c55da82e5ddeb7:
    english: 'When everyone has voted and the poll closes, state an outcome so everyone knows what has happened.  '
    translation: Wenn alle abgestimmt haben und die Umfrage endet, veröffentliche ein Fazit, damit alle über den Stand informiert sind.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e8b710a05eb113dc:
    english: 'If your meeting practice requires formal acceptance at the next meeting, schedule an agenda item to acknowledge and confirm polls and decisions made on Loomio, and record this in the meeting minutes.  '
    translation: Wenn eure Sitzungsregeln eine förmliche Bestätigung beim nächsten Treffen verlangen, nimm die auf Loomio durchgeführten Umfragen und getroffenen Entscheidungen auf die Tagesordnung. Bestätigt sie dort und haltet das im Protokoll fest.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '06339a98b65ccc2c':
    english: For example; *"Does anyone wish to change their votes in Loomio?  If no, then let's resolve to formally approve polls made in Loomio during the last period."*
    translation: 'Zum Beispiel: *„Möchte jemand seine Stimme auf Loomio ändern? Wenn nicht, beschließen wir, die seit dem letzten Treffen auf Loomio durchgeführten Umfragen förmlich zu bestätigen.“*'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f460b4ae218b375a:
    english: |-
      ## Approve reports
      Most meeting agendas include time for reports to be presented, discussed and approved; for example reports from the CEO, Financial, Operations, Health & Safety, and project reports.
    translation: |-
      ## Berichte genehmigen
      Auf den Tagesordnungen vieler Treffen stehen Berichte, die vorgestellt, besprochen und genehmigt werden. Dazu gehören etwa Berichte der Geschäftsführung, Finanzberichte, Berichte zu Abläufen und Arbeitsschutz sowie Projektberichte.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  00abfe283956509a:
    english: Reports are very important to help everyone get on the same page, however they can absorb valuable time in a meeting that may be used more effectively.
    translation: Berichte helfen allen, denselben Informationsstand zu erreichen. Sie können jedoch viel Zeit im Treffen beanspruchen, die sich anders nutzen ließe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  861200207a1e1dfb:
    english: Attach or link reports to your meeting **thread** and invite questions about the reports in advance of the meeting.
    translation: Hänge Berichte an die **Diskussion** zu deinem Treffen an oder verlinke sie dort. Bitte die Mitglieder, ihre Fragen schon vor dem Treffen zu stellen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  11f124875e8a5945:
    english: Members receive and read the reports at a time and place that works for them.  As members read and think about the reports, they can comment, ask questions and see responses in Loomio.
    translation: Die Mitglieder können die Berichte lesen, wann und wo es für sie passt. Dabei können sie auf Loomio kommentieren, Fragen stellen und Antworten lesen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2871f1673d36999a:
    english: A question asked by one member is likely of interest to other members, so when someone replies to the question, their response  is visible to everyone in the Loomio group.
    translation: Die Frage eines Mitglieds interessiert oft auch andere. Wenn jemand darauf antwortet, ist die Antwort für alle Mitglieder der Loomio-Gruppe sichtbar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  851a2a86a1047697:
    english: As members become familiar with discussing reports in Loomio, save a little more time by taking it a step further - seek approval of reports ahead of the meeting.
    translation: 'Wenn die Mitglieder Berichte regelmäßig auf Loomio besprechen, kannst du noch mehr Zeit im Treffen sparen: Bitte sie schon vor dem Treffen um die Genehmigung der Berichte.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
