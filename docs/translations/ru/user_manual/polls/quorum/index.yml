  ff36e799ac095caf:
    english: Jamie agrees and Samira disagrees. The chart updates, but two of five eligible voters is only 40 percent participation, so the quorum is still not reached.
    translation: Джейми соглашается, а Самира не соглашается. Диаграмма обновляется, но два человека из пяти — это только 40 процентов. Кворум всё ещё не достигнут.
    status: machine
