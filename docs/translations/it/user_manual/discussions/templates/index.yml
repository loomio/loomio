---
navigation_title: Modelli di discussione
blocks:
  80c5dfc46bb963d2:
    english: "# Discussion templates"
    translation: "# Modelli di discussione"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  488fbd5167707cba:
    english: Discussion templates help your group start discussions the same way each time. A template can supply a title, context, tags, and instructions for the person starting the discussion. It also sets defaults, such as whether to notify the whole group and which polls to suggest.
    translation: I modelli di discussione aiutano il tuo gruppo ad avviare le discussioni seguendo ogni volta lo stesso processo. Un modello può fornire un titolo, un contesto, etichette e istruzioni per chi avvia la discussione. Imposta anche valori predefiniti, per esempio se avvisare tutto il gruppo e quali sondaggi suggerire.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2571bc9cc405d927:
    english: Every new discussion in a group starts from a template. When someone selects **Start discussion**, Loomio shows the group's templates. Even **Blank template** is a template, so your group can change its defaults too.
    translation: Ogni nuova discussione in un gruppo parte da un modello. Quando qualcuno seleziona **Inizia la discussione**, Loomio mostra i modelli del gruppo. Anche **Modello vuoto** è un modello, quindi il tuo gruppo può modificarne le impostazioni predefinite.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  834ac31697ef254b:
    english: Templates work well for processes your group repeats, such as project reviews, advice processes, meeting preparation, funding decisions, or document approvals. The person starting the discussion can still edit everything before they start it.
    translation: I modelli sono utili per i processi che il tuo gruppo ripete, come la valutazione di progetti, la richiesta di pareri, la preparazione di riunioni, le decisioni sui finanziamenti o l'approvazione di documenti. Chi avvia la discussione può comunque modificare tutto prima di avviarla.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  74d1c850f63c0518:
    english: "## How templates are used"
    translation: "## Come si usano i modelli"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6e5927441d982c01:
    english: |-
      1. A member selects **Start discussion** on the group page.
      2. Loomio lists the group's visible templates. Each one shows its title and subtitle.
      3. The member selects a template. Loomio opens the new discussion form, filled in from the template.
      4. The template's help appears at the top of the form as guidance.
      5. The member edits the title, context, tags, and invite list, then selects **Start discussion**.
    translation: |-
      1. Un membro seleziona **Inizia la discussione** nella pagina del gruppo.
      2. Loomio elenca i modelli visibili del gruppo. Ognuno mostra il proprio titolo e sottotitolo.
      3. Il membro seleziona un modello. Loomio apre il modulo della nuova discussione, compilato con i contenuti del modello.
      4. Le istruzioni del modello compaiono in cima al modulo.
      5. Il membro modifica il titolo, il contesto, le etichette e l'elenco degli invitati, poi seleziona **Inizia la discussione**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  464984a60c23366b:
    english: Changing a template affects only discussions started after the change. Discussions already started from it keep their content and settings.
    translation: Le modifiche a un modello si applicano solo alle discussioni avviate dopo la modifica. Le discussioni già avviate con quel modello conservano i propri contenuti e le proprie impostazioni.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  70c22d24ec0d248b:
    english: "## Choose who is notified by default"
    translation: "## Scegli chi riceve una notifica per impostazione predefinita"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  77feebf56c2ee9a7:
    english: 'The **Invite** setting controls who the new discussion form invites by default. It has two options:'
    translation: 'L''impostazione **Invita** determina chi viene invitato per impostazione predefinita nel modulo della nuova discussione. Ha due opzioni:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6c93f4222436028f:
    english: |-
      - **Everyone in the group**: the group appears in the discussion form's **Invite** field, and every member is notified when the discussion starts.
      - **None**: the **Invite** field starts empty. Nobody is notified unless the author adds people.
    translation: |-
      - **Tutti nel gruppo**: il gruppo compare nel campo **Invita** del modulo della discussione e ogni membro riceve una notifica quando la discussione viene avviata.
      - **Nessuno**: il campo **Invita** è inizialmente vuoto. Nessuno riceve una notifica, a meno che l'autore non aggiunga delle persone.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  17cca49613fff23d:
    english: Loomio's built-in templates, including **Blank template**, use **Everyone in the group**. If your group does not want every new discussion to notify all members, edit the templates your group uses and set **Invite** to **None**.
    translation: I modelli inclusi in Loomio, compreso **Modello vuoto**, usano **Tutti nel gruppo**. Se il tuo gruppo non vuole avvisare tutti i membri per ogni nuova discussione, modifica i modelli che usa e imposta **Invita** su **Nessuno**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5fd184e64e0605bc:
    english: The author can always change the invite list before starting the discussion. They can remove the group to notify nobody, or add specific people instead. This setting only affects notifications. Group members can still find and read the discussion in the group, whichever option you choose.
    translation: L'autore può sempre modificare l'elenco degli invitati prima di avviare la discussione. Può rimuovere il gruppo per non avvisare nessuno oppure aggiungere persone specifiche. Questa impostazione riguarda solo le notifiche. I membri del gruppo possono comunque trovare e leggere la discussione nel gruppo, qualunque opzione tu scelga.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  58f24313ca36c890:
    english: The group is added to the invite list only when the author is allowed to notify the whole group. Admins can always do this. Members can do it when **Members can notify everyone in the group** is enabled in the group's permissions.
    translation: Il gruppo viene aggiunto all'elenco degli invitati solo se l'autore ha il permesso di avvisare tutto il gruppo. Gli amministratori possono sempre farlo. I membri possono farlo quando **I membri possono avvisare tutti i membri del gruppo** è abilitato nei permessi del gruppo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  33afd174376e933b:
    english: "## Template settings"
    translation: "## Impostazioni del modello"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b02be20543f228a7:
    english: 'Group admins can edit a template from the action menu beside it in the template list. The form has these settings:'
    translation: 'Gli amministratori del gruppo possono modificare un modello dal menu delle azioni accanto al modello nell''elenco. Il modulo contiene queste impostazioni:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f2fc57fe20100911:
    english: |-
      - **Template title**: the short name shown in the template list.
      - **Template subtitle**: one line explaining when to use the template.
      - **Template help**: instructions shown at the top of the new discussion form. Use it to explain the process and link to resources. It is not part of the discussion.
      - **Group**: whether the template starts a discussion in the group or a direct discussion. A direct discussion is visible only to the people invited to it.
      - **Default title**: a title filled in for each new discussion. The author can edit it.
      - **Example title**: an example shown in an empty title field. Use it when a default title would not fit every discussion.
      - **Tags**: tags applied to each new discussion. The author can remove them.
      - **Context**: the starting text of the discussion. Use headings, questions, or links to guide what people write.
      - **Invite**: whether to invite everyone in the group by default. See [Choose who is notified by default](#choose-who-is-notified-by-default).
      - **Poll templates**: polls suggested for this process. They are listed on the new discussion form. They also appear first when someone starts a poll in the discussion. They do not start automatically.
      - **Allow concurrent polls**: whether more than one poll can be open in the discussion at the same time.
      - **Comment length limit**: an optional maximum length for comments.
    translation: |-
      - **Titolo del modello**: il nome breve mostrato nell'elenco dei modelli.
      - **Sottotitolo del modello**: una riga che spiega quando usare il modello.
      - **Aiuto modello**: le istruzioni mostrate in cima al modulo della nuova discussione. Usale per spiegare il processo e inserire link a risorse utili. Non fanno parte della discussione.
      - **Gruppo**: indica se il modello avvia una discussione nel gruppo o una discussione diretta. Una discussione diretta è visibile solo alle persone invitate.
      - **Titolo predefinito**: un titolo inserito in ogni nuova discussione. L'autore può modificarlo.
      - **Titolo di esempio**: un esempio mostrato quando il campo del titolo è vuoto. Usalo se un titolo predefinito non sarebbe adatto a tutte le discussioni.
      - **Etichette**: le etichette applicate a ogni nuova discussione. L'autore può rimuoverle.
      - **Contesto**: il testo iniziale della discussione. Usa titoli, domande o link per aiutare le persone a scrivere i propri contributi.
      - **Invita**: indica se invitare per impostazione predefinita tutti i membri del gruppo. Vedi [Scegli chi riceve una notifica per impostazione predefinita](#choose-who-is-notified-by-default).
      - **Modelli di sondaggio**: i sondaggi suggeriti per questo processo. Sono elencati nel modulo della nuova discussione. Compaiono anche per primi quando qualcuno avvia un sondaggio nella discussione. Non si avviano automaticamente.
      - **Consenti sondaggi simultanei**: indica se nella discussione può essere aperto più di un sondaggio alla volta.
      - **limite di lunghezza dei commenti**: una lunghezza massima facoltativa per i commenti.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a9e44919507a613:
    english: Use a default title only when it will stay accurate. Otherwise, write an example title that prompts the author to name the specific review, period, document, or decision.
    translation: Usa un titolo predefinito solo se resterà appropriato. Altrimenti, scrivi un titolo di esempio che inviti l'autore a indicare la valutazione, il periodo, il documento o la decisione specifica.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c5db289e27f54169:
    english: "## Example: bottle trial review"
    translation: "## Esempio: valutazione della prova delle bottiglie"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  89e7b8f9b36a8ae7:
    english: Oatmilk Cooperative reviews its returnable-bottle trial after each cycle. Its template is titled "Bottle trial review" and has a default title. It adds the "Bottle trial" tag. Its context asks members to read the weekly report and consider return rates, washing records, cafe feedback, and transport costs. It recommends a Sense check followed by Consent.
    translation: La Cooperativa Oatmilk valuta la prova delle bottiglie a rendere dopo ogni ciclo. Il suo modello si intitola "Valutazione della prova delle bottiglie" e ha un titolo predefinito. Aggiunge l'etichetta "Prova delle bottiglie". Il contesto chiede ai membri di leggere il rapporto settimanale e considerare i tassi di restituzione, i registri di lavaggio, i riscontri dei bar e i costi di trasporto. Suggerisce una verifica del parere del gruppo seguita da una decisione per consenso.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f896031f8dcc2f84:
    english: This works as a template because the purpose and evidence stay the same each cycle. Only the observations and decisions change.
    translation: Questo processo si presta a un modello perché lo scopo e le informazioni da esaminare restano gli stessi a ogni ciclo. Cambiano solo le osservazioni e le decisioni.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7e5955c442f6c8ae:
    english: "## Create a template"
    translation: "## Crea un modello"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c2b2bc41cbe6f6a:
    english: Group admins can select **New template** from the template list. Choose an example from Loomio's gallery or start with a blank template, then adapt it and save it.
    translation: Gli amministratori del gruppo possono selezionare **Nuovo modello** dall'elenco dei modelli. Scegli un esempio dalla galleria di Loomio oppure parti da un modello vuoto, poi adattalo e salvalo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a9cb80d574e2d865:
    english: You can search or filter the gallery. An example is not added to your group until you save it.
    translation: Puoi cercare o filtrare i modelli nella galleria. Un esempio viene aggiunto al tuo gruppo solo quando lo salvi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1f0dab3f50320e75:
    english: "## Manage the template list"
    translation: "## Gestisci l'elenco dei modelli"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7462593f2f6d1614:
    english: When a group is created, Loomio adds a set of templates suited to the kind of group. Only **Blank template** and **Practice discussion** are visible at first. The others are hidden, and admins can unhide them.
    translation: Quando viene creato un gruppo, Loomio aggiunge una serie di modelli adatti al tipo di gruppo. All'inizio sono visibili solo **Modello vuoto** e **Discussione pratica**. Gli altri sono nascosti e gli amministratori possono renderli visibili.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e6f7eaa63e353ef7:
    english: 'Group admins can use the action menu beside a template to:'
    translation: 'Gli amministratori del gruppo possono usare il menu delle azioni accanto a un modello per:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e8767178e42cd4e0:
    english: |-
      - edit its content and settings;
      - hide it from the template list;
      - unhide it from **Hidden templates**;
      - rearrange the order of visible templates;
      - export it as a JSON file; or
      - delete it.
    translation: |-
      - modificarne il contenuto e le impostazioni;
      - nasconderlo dall'elenco dei modelli;
      - renderlo visibile da **Modelli nascosti**;
      - cambiare l'ordine dei modelli visibili;
      - esportarlo come file JSON; oppure
      - eliminarlo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5d4cbc918551c211:
    english: Hiding a template keeps it for later use. Deleting a template does not delete discussions started from it.
    translation: Se nascondi un modello, puoi usarlo di nuovo in seguito. Se elimini un modello, le discussioni avviate con quel modello non vengono eliminate.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c0ae844752e20ef:
    english: "## Share templates between groups"
    translation: "## Condividi i modelli tra gruppi"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  acf646688b9b79f4:
    english: Select **Export json** in a template's action menu to download it as a file. To use it in another group, select **New template**, then **Import json**. The form opens with the imported content so you can review it before saving.
    translation: Seleziona **Esporta in formato JSON** nel menu delle azioni di un modello per scaricarlo come file. Per usarlo in un altro gruppo, seleziona **Nuovo modello**, poi **Importa JSON**. Il modulo si apre con il contenuto importato, così puoi controllarlo prima di salvarlo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a168253bda3147e8:
    english: Links to custom poll templates are not included in the file. Export and import those poll templates separately.
    translation: I collegamenti ai modelli di sondaggio personalizzati non sono inclusi nel file. Esporta e importa quei modelli di sondaggio separatamente.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4833d57d46ccb98e:
    english: "## Let members create templates"
    translation: "## Consenti ai membri di creare modelli"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1ac138e713feea59:
    english: By default, only group admins can create and edit templates. An admin can enable **Members can create templates** under **Group settings** → **Permissions**.
    translation: Per impostazione predefinita, solo gli amministratori del gruppo possono creare e modificare i modelli. Un amministratore può abilitare **I membri possono creare modelli** in **Impostazioni del gruppo** → **Permessi**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  889e8792d7937424:
    english: When this is enabled, members can create discussion and poll templates and edit the templates they created. Admins can edit every template in the group. A member's template appears in the group's template list once it is saved, so agree on naming and review practices before enabling this permission.
    translation: Quando questa opzione è abilitata, i membri possono creare modelli di discussione e di sondaggio e modificare quelli che hanno creato. Gli amministratori possono modificare tutti i modelli del gruppo. Il modello creato da un membro compare nell'elenco dei modelli del gruppo appena viene salvato. Concordate quindi come nominare e rivedere i modelli prima di abilitare questo permesso.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1284dfc3e68170d8:
    english: "## Templates for non-members"
    translation: "## Modelli per chi non è membro"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5c701c3795724027:
    english: If **Non-members can start discussions** is enabled, people outside the group choose from the same template list. Their discussion form never invites the group by default. See [Collect private submissions](/en/user_manual/discussions/private_submissions).
    translation: Se **Anche i non membri possono avviare discussioni** è abilitato, le persone esterne al gruppo scelgono dallo stesso elenco di modelli. Il loro modulo di discussione non invita mai il gruppo per impostazione predefinita. Vedi [Raccogli contributi privati](/en/user_manual/discussions/private_submissions).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  630a5d69a7093105:
    english: "## Related"
    translation: "## Argomenti correlati"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
