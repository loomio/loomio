---
navigation_title: הצבעה אנונימית
blocks:
  b4e842083054a400:
    english: "# Anonymous voting"
    translation: "# הצבעה אנונימית"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9b5c46644a952388:
    english: Anonymous voting, also known as blind voting, separates the record of who has voted from the votes themselves. Poll coordinators can see who was eligible and, once at least three people have voted, verify participation. Application users cannot connect a submitted vote with the person who submitted it.
    translation: בהצבעה אנונימית, המכונה גם הצבעה חשאית, הרישום של מי שהצביעו מופרד מן ההצבעות עצמן. מתאמי הסקר יכולים לראות מי היו זכאים להצביע, ולאחר שלפחות שלושה אנשים הצביעו, לבדוק מי השתתפו. משתמשי היישום אינם יכולים לקשר בין הצבעה שהוגשה לבין מי שהגישו אותה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  105abff68025f002:
    english: This page explains the protections provided by anonymous voting, the information that is retained, and the limits of the guarantee.
    translation: דף זה מסביר כיצד הצבעה אנונימית מגינה על זהות הבוחרים, איזה מידע נשמר ומהן מגבלות ההגנה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6d97c8b835a3f1f2:
    english: "## How anonymous voting protects voters"
    translation: "## כיצד הצבעה אנונימית מגינה על הבוחרים"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e01d5c77096b953e:
    english: 'An anonymous poll keeps two separate sets of records:'
    translation: 'בסקר אנונימי נשמרים שני סוגי רשומות נפרדים:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  757ab56b1165a71d:
    english: |-
      | Participation records | Submitted votes |
      | --- | --- |
      | Who is eligible to vote | The selected options or scores |
      | Who was invited, and by whom | The poll the vote belongs to |
      | Whether each eligible person has voted | No name or user account |
      | No selected options or scores | No link to a participation record |
    translation: |-
      | רשומות השתתפות | הצבעות שהוגשו |
      | --- | --- |
      | מי זכאים להצביע | האפשרויות או הניקוד שנבחרו |
      | מי הוזמנו ומי הזמינו אותם | הסקר שאליו שייכת ההצבעה |
      | האם כל אדם הזכאי להצביע הצביע | ללא שם או חשבון משתמש |
      | ללא אפשרויות או ניקוד שנבחרו | ללא קישור לרשומת השתתפות |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b908c49acc827932:
    english: There is no shared identifier that connects these records. Submitted votes also omit the actual submission time, invitation information, written reasons, attachments, and other metadata that could help identify a voter.
    translation: אין מזהה משותף המקשר בין הרשומות האלה. בהצבעות שהוגשו לא נשמרים גם זמן ההגשה המדויק, פרטי ההזמנה, נימוקים כתובים, קבצים מצורפים או נתונים אחרים שעשויים לסייע בזיהוי מי שהצביעו.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6430a3d863d135b6:
    english: This separation is enforced when the vote is stored. It does not depend only on hiding names in the interface.
    translation: ההפרדה נאכפת בזמן שמירת ההצבעה. היא אינה מסתמכת רק על הסתרת שמות בממשק.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b8e31aef3d559f28:
    english: "## While voting is open"
    translation: "## בזמן שההצבעה פתוחה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f905c85734898a41:
    english: Results remain hidden from everyone until the poll closes. This includes poll coordinators, group administrators, and instance administrators using the application.
    translation: התוצאות מוסתרות מכולם עד לסגירת הסקר. גם מתאמי הסקר, מנהלי הקבוצה ומנהלי המערכת אינם יכולים לראות אותן דרך היישום.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  828df5247b61c9e6:
    english: 'When someone votes:'
    translation: 'בעת הצבעה:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  69b471d43b2148a1:
    english: |-
      - their submitted vote is stored without their name or participation record;
      - their participation record is marked to show that they have voted;
      - no vote event, notification, email, comment, or activity entry is created;
      - no copy of their selections is returned after submission; and
      - the interface confirms only that their vote was recorded.
    translation: |-
      - ההצבעה שהוגשה נשמרת ללא שם או קישור לרשומת ההשתתפות;
      - ברשומת ההשתתפות מסומן שהאדם הצביע;
      - לא נוצרים אירוע הצבעה, התראה, הודעת דוא״ל, תגובה או רישום פעילות;
      - לאחר ההגשה לא מוצג עותק של הבחירות שנעשו; וכן
      - הממשק מאשר רק שההצבעה נרשמה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4ffe4b38db135dab:
    english: The participation record does not store a precise time for when the person voted. Submitted votes are not ordered by submission time.
    translation: ברשומת ההשתתפות לא נשמר הזמן המדויק שבו האדם הצביע. ההצבעות שהוגשו אינן מסודרות לפי זמן ההגשה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7acaf6b48fc42105:
    english: "## Votes cannot be changed"
    translation: "## לא ניתן לשנות הצבעות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  996ef90a3eee857b:
    english: Each eligible person can vote once. A submitted anonymous vote cannot be reviewed, changed, withdrawn, or replaced, including by a coordinator or administrator.
    translation: כל אדם הזכאי להצביע יכול להצביע פעם אחת. לאחר הגשת הצבעה אנונימית, לא ניתן לעיין בה, לשנות אותה, לבטל אותה או להחליף אותה, גם לא בידי מתאמי הסקר או מנהלי המערכת.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  58f0aaa6a45c1d37:
    english: Allowing a person to retrieve or replace their vote would require a persistent link between that person and the vote. Anonymous voting deliberately does not create that link.
    translation: כדי לאפשר לאדם לאחזר את הצבעתו או להחליף אותה, נדרש קישור קבוע בינו לבין ההצבעה. בהצבעה אנונימית קישור כזה אינו נוצר.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2fd2c9d6ab0d6f68:
    english: Review your selections carefully before submitting.
    translation: יש לבדוק היטב את הבחירות לפני הגשת ההצבעה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  59f83c0e359484c4:
    english: "## Why anonymous votes do not have reasons"
    translation: "## מדוע אין נימוקים בהצבעות אנונימיות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  89f9d9a1d4bcb395:
    english: New anonymous votes cannot include a written reason or an attachment. Reasons can contain names, personal details, writing patterns, mentions, or other information that identifies the voter. They would also make individual votes easier to distinguish from the aggregate result.
    translation: לא ניתן לצרף נימוק כתוב או קובץ להצבעה אנונימית חדשה. נימוקים עשויים לכלול שמות, פרטים אישיים, סגנון כתיבה, אזכורים או מידע אחר שמזהה את מי שהצביעו. הם גם עשויים להקל על הבחנה בין הצבעות בודדות בתוך התוצאה הכוללת.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  932f88aa929fb4eb:
    english: Participants can still discuss the poll in its thread where discussion is available. Those comments are ordinary named discussion contributions and are not attached to an anonymous vote.
    translation: כאשר ניתן לקיים דיון בשרשור של הסקר, המשתתפים עדיין יכולים לדון בו שם. התגובות האלה הן תרומות רגילות לדיון, הנושאות את שמות הכותבים, ואינן מצורפות להצבעה אנונימית.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1b21c2826270bd52:
    english: "## Results and exports"
    translation: "## תוצאות וייצוא"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  afc45e50b74e075b:
    english: After the poll closes, the results are calculated from the detached votes and displayed as totals and other aggregate results supported by the poll type.
    translation: לאחר סגירת הסקר, התוצאות מחושבות מן ההצבעות שהופרדו מזהויות הבוחרים. הן מוצגות כסיכומים וכתוצאות כוללות אחרות שסוג הסקר תומך בהן.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b28c82ffcb4ffeb5:
    english: The application does not publish vote identifiers, submission order, or submission times. Poll exports contain aggregate results rather than a row for each anonymous vote, except that a closed STV election can be exported in BLT format. A BLT export contains the candidate rankings needed to recount the election, grouped when multiple ballots have the same ranking, without voter identities or ballot metadata.
    translation: היישום אינו מפרסם מזהי הצבעות, סדר הגשה או זמני הגשה. ייצוא של סקר מכיל תוצאות כוללות ולא שורה לכל הצבעה אנונימית. יוצאת דופן היא בחירת STV שנסגרה, שאפשר לייצא בפורמט BLT. ייצוא BLT מכיל את דירוגי המועמדים הדרושים לספירה חוזרת של הבחירות. פתקי הצבעה בעלי דירוג זהה מקובצים יחד, ללא זהויות בוחרים או נתונים נלווים לפתקי ההצבעה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8088fc78d955e9bb:
    english: An anonymous poll cannot be reopened after it closes.
    translation: לא ניתן לפתוח מחדש סקר אנונימי לאחר סגירתו.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c368b542923cd542:
    english: "## Participation verification"
    translation: "## בדיקת השתתפות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ab086d63c01514bf:
    english: Poll coordinators can view the named participation records. These always show who was eligible. Once at least three people have voted, they also show whether each person voted, but never show how anyone voted. If a poll closes with fewer than three votes, the participation status remains hidden.
    translation: מתאמי הסקר יכולים לראות את רשומות ההשתתפות הכוללות שמות. הרשומות מציגות תמיד מי היו זכאים להצביע. לאחר שלפחות שלושה אנשים הצביעו, הן מציגות גם האם כל אדם הצביע, אך לעולם לא כיצד הצביע. אם הסקר נסגר עם פחות משלוש הצבעות, מצב ההשתתפות נשאר מוסתר.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dcad5d728e5e7cfd:
    english: Other participants cannot view this named participation information. Access to poll results does not grant access to the participation records.
    translation: משתתפים אחרים אינם יכולים לראות את פרטי ההשתתפות הכוללים שמות. גישה לתוצאות הסקר אינה מקנה גישה לרשומות ההשתתפות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  37cf06402ac47fa2:
    english: |-
      Coordinators can add eligible people while voting remains open, including after
      other people have voted. Existing voters cannot be removed from an anonymous
      poll.
    translation: |-
      מתאמי הסקר יכולים להוסיף אנשים הזכאים להצביע כל עוד ההצבעה פתוחה, גם לאחר
      שאנשים אחרים כבר הצביעו. לא ניתן להסיר מסקר אנונימי אנשים שכבר
      הצביעו.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  705e9b807681f6c1:
    english: "## Reminders"
    translation: "## תזכורות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8ef8b501a1b27f63:
    english: For an anonymous poll lasting at least 24 hours, eligible people who have not voted receive one automatic reminder during the final 24 hours.
    translation: בסקר אנונימי שנמשך לפחות 24 שעות, אנשים הזכאים להצביע וטרם הצביעו מקבלים תזכורת אוטומטית אחת במהלך 24 השעות האחרונות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b23e579a8ef628de:
    english: The reminder is selected from participation records only. It does not inspect submitted votes or create a connection to them. If the deadline changes, the hourly reminder check uses the current deadline without maintaining a separate scheduled reminder for the poll.
    translation: הנמענים לתזכורת נבחרים על סמך רשומות ההשתתפות בלבד. בחירה זו אינה בודקת את ההצבעות שהוגשו ואינה יוצרת קישור אליהן. אם מועד הסיום משתנה, הבדיקה השעתית לשליחת תזכורות משתמשת במועד הסיום העדכני, ללא תזכורת נפרדת שנקבעה מראש לסקר.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  053ce04ce5f98ed8:
    english: Polls with a total voting period of less than 24 hours do not send this automatic reminder.
    translation: בסקרים שתקופת ההצבעה הכוללת שלהם קצרה מ־24 שעות, התזכורת האוטומטית הזאת אינה נשלחת.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb1f13e60fe178fe:
    english: "## What coordinators and administrators can see"
    translation: "## מה מתאמי סקר ומנהלי מערכת יכולים לראות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e59c22e94231a746:
    english: 'Through the application, a poll coordinator, group administrator, or instance administrator may be able to see:'
    translation: 'דרך היישום, מתאמי סקר, מנהלי קבוצה או מנהלי מערכת עשויים לראות:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2da6b1feaa8b36f1:
    english: |-
      - the poll and its eligible voters;
      - whether each eligible person has voted, where their role permits access and at least three people have voted; and
      - aggregate results after the poll closes.
    translation: |-
      - את הסקר ואת האנשים הזכאים להצביע בו;
      - האם כל אדם הזכאי להצביע הצביע, אם תפקידם מקנה גישה למידע הזה ולפחות שלושה אנשים הצביעו; וכן
      - תוצאות כוללות לאחר סגירת הסקר.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6a96a87699625dc6:
    english: 'They cannot use application features to see:'
    translation: 'לא ניתן להשתמש בתכונות היישום כדי לראות:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dd4756253d1ee6dc:
    english: |-
      - which selections belong to a person;
      - individual votes or voting patterns;
      - when a particular vote was submitted; or
      - a reason, attachment, event, or notification associated with a submitted vote.
    translation: |-
      - אילו אפשרויות נבחרו בידי אדם מסוים;
      - הצבעות בודדות או דפוסי הצבעה;
      - מתי הוגשה הצבעה מסוימת; או
      - נימוק, קובץ מצורף, אירוע או התראה הקשורים להצבעה שהוגשה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c350875c33492237:
    english: "## Limits of anonymous voting"
    translation: "## מגבלות ההצבעה האנונימית"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  48d04d7b4817e710:
    english: These protections prevent application users from linking a submitted vote to its voter. They are not a cryptographic protection against an operator who can inspect the database, backups, server logs, process memory, network traffic, or a modified version of the application.
    translation: אמצעי ההגנה האלה מונעים ממשתמשי היישום לקשר בין הצבעה שהוגשה לבין מי שהצביעו. הם אינם מספקים הגנה קריפטוגרפית מפני מפעילי מערכת שיכולים לבדוק את מסד הנתונים, גיבויים, יומני שרת, זיכרון התהליך, תעבורת רשת או גרסה ששונתה של היישום.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f901f505362e46b4:
    english: The result itself may also reveal information. A small electorate, a unanimous result, a distinctive combination of selections, or information shared outside the poll can make a person's choices easier to infer. Voters may also choose to identify themselves in discussion outside their submitted vote.
    translation: גם התוצאה עצמה עשויה לחשוף מידע. מספר קטן של זכאים להצביע, תוצאה פה אחד, שילוב ייחודי של בחירות או מידע ששותף מחוץ לסקר עשויים להקל על הסקת הבחירות של אדם מסוים. מי שהצביעו עשויים גם לבחור לחשוף את זהותם בדיון מחוץ להצבעה שהגישו.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dfe97db86db52d15:
    english: Consider the size of the electorate and the sensitivity of the decision when deciding whether application-level anonymous voting is suitable.
    translation: כדי להחליט אם הצבעה אנונימית ברמת היישום מתאימה, יש להביא בחשבון את מספר בעלי זכות ההצבעה ואת רגישות ההחלטה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  60cc6f1a0163ec5d:
    english: "## Questions"
    translation: "## שאלות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  57615f2c4c040dce:
    english: "### Can a coordinator see how I voted?"
    translation: "### האם מי שמתאם את המשאל יכול לראות כיצד הצבעתי?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9dc1d151cc90e94e:
    english: No. Once at least three people have voted, a coordinator can verify whether you voted but cannot connect you with a submitted vote through the application. Below that threshold, your participation status remains hidden.
    translation: לא. לאחר שלפחות שלושה אנשים הצביעו, מי שמתאם את המשאל יכול לבדוק אם הצבעת, אך אין אפשרות לקשר אותך להצבעה שהוגשה דרך היישום. כל עוד הצביעו פחות משלושה אנשים, סטטוס ההשתתפות שלך נשאר מוסתר.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b3b382d2575b715d:
    english: "### Can I see my vote after submitting it?"
    translation: "### האם אפשר לראות את ההצבעה שלי לאחר הגשתה?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  52aaaa1c764d5745:
    english: No. The application confirms that your vote was recorded, then discards the selections from the voting interface. It cannot retrieve your vote without creating the link that anonymous voting is designed to avoid.
    translation: לא. היישום מאשר שההצבעה נקלטה, ואז מסיר את הבחירות מממשק ההצבעה. כדי לאחזר את ההצבעה, יהיה צורך ליצור את הקישור שההצבעה האנונימית נועדה למנוע.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  071dd89d6eb38ebf:
    english: "### Can I change or withdraw my vote?"
    translation: "### האם אפשר לשנות את ההצבעה שלי או לבטל אותה?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '059b75c51b4225ab':
    english: No. There is no link that would let the application identify which submitted vote to change or remove.
    translation: לא. אין קישור שיאפשר ליישום לזהות איזו הצבעה שהוגשה יש לשנות או להסיר.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c94077837455425f:
    english: "### Will I receive an email confirming my vote?"
    translation: "### האם אקבל הודעת דוא״ל שמאשרת את ההצבעה שלי?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f36a8b43a3fdee36:
    english: No. Voting creates only the on-screen acknowledgement and updates your participation record. It does not send a confirmation email or create a notification or activity event.
    translation: לא. ההצבעה מציגה רק אישור על המסך ומעדכנת את רשומת ההשתתפות שלך. היא אינה שולחת הודעת אישור בדוא״ל ואינה יוצרת התראה או אירוע פעילות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f320754cf7ee77bc:
    english: "### Does a public poll reveal more information?"
    translation: "### האם משאל ציבורי חושף מידע נוסף?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f84121f0c18e03ab:
    english: Public access may allow people to see the poll and its aggregate results after it closes. It does not expose the named participation records or individual anonymous votes.
    translation: גישה ציבורית עשויה לאפשר לאנשים לראות את המשאל ואת התוצאות המצטברות לאחר סגירתו. היא אינה חושפת את רשומות ההשתתפות הכוללות שמות או הצבעות אנונימיות של אנשים יחידים.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e2dbe0c181f865ca:
    english: "### Is anonymous voting suitable for every election?"
    translation: "### האם הצבעה אנונימית מתאימה לכל בחירות?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  05fc871619a2170d:
    english: No. It provides application-level separation between identities and votes. Decisions requiring protection from system operators or independently verifiable cryptographic elections need a system designed for those requirements.
    translation: לא. היא מפרידה בין זהויות להצבעות ברמת היישום. להחלטות שמחייבות הגנה מפני מפעילי המערכת או בחירות קריפטוגרפיות שניתן לאמת באופן עצמאי, יש צורך במערכת שתוכננה לדרישות האלה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
