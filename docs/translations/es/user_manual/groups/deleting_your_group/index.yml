navigation_title: Eliminar tu grupo
blocks:
  6e0bf431fbefa0d3:
    english: "# Deleting your group"
    translation: "# Eliminar tu grupo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f8e8d1ee802cae90:
    english: 'Deleting your Loomio group initiates a process to permanently delete all group data. '
    translation: Al eliminar tu grupo de Loomio, se inicia un proceso para borrar permanentemente todos sus datos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  214aa96eca0b90ca:
    english: If there is any data you wish to retain, make sure you [export group data](/en/user_manual/groups/data_export/) and manually download any important files you have uploaded before you continue.
    translation: Si quieres conservar algún dato, [exporta los datos del grupo](/en/user_manual/groups/data_export/) y descarga manualmente los archivos importantes que hayas subido antes de continuar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  181fecc458dcc49d:
    english: Open the group drop down menu by clicking on the three dots, and select the **Delete group** option to remove access to the group and to initiate deletion of all group data from our records. You must be an admin to delete a group.
    translation: Haz clic en los tres puntos para abrir el menú desplegable del grupo y selecciona **Eliminar grupo**. Esto te quitará el acceso al grupo e iniciará la eliminación de todos sus datos de nuestros registros. Debes ser administrador para eliminar un grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f5178957964c2bc0:
    english: When you delete a group, it is removed from view immediately and will be permanently deleted after 90 days. You and group members immediately lose access to the group. If a mistake was made, contact us within 90 days of deleting your group to request restoration.
    translation: Cuando eliminas un grupo, deja de estar visible de inmediato y se borra permanentemente después de 90 días. Tú y los miembros del grupo perdéis el acceso de inmediato. Si lo eliminaste por error, ponte en contacto con nosotros en un plazo de 90 días para solicitar su restauración.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c15f72841d15dc52:
    english: Groups awaiting deletion and their subgroups are unavailable to members and coordinators for viewing, participation, or export, including polls opened from saved links. Members cannot create or edit content, vote, send announcements or reminders, or accept invitations. Export the group and download important files before confirming deletion. Direct discussions and polls are unaffected.
    translation: Los grupos pendientes de eliminación y sus subgrupos no están disponibles para que los miembros y administradores los vean, participen en ellos o exporten sus datos. Esto incluye los sondeos abiertos desde enlaces guardados. Los miembros no pueden crear ni editar contenido, votar, enviar anuncios o recordatorios ni aceptar invitaciones. Exporta los datos del grupo y descarga los archivos importantes antes de confirmar la eliminación. Las discusiones directas y los sondeos no se ven afectados.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5122280818cc30c7:
    english: Scheduling the group for deletion stops pending activity notifications and poll reminders for the group and its subgroups. Messages already being sent may still arrive.
    translation: Al programar la eliminación del grupo, se detienen las notificaciones de actividad y los recordatorios de sondeos pendientes del grupo y sus subgrupos. Es posible que lleguen mensajes que ya se estén enviando.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  953ebf00860389c1:
    english: The warning email includes counts for the group's subgroups, members, discussions, polls and comments. If you need to keep the group or [export its data](/en/user_manual/groups/data_export/), reply within 90 days so access can be restored before deletion.
    translation: El correo de aviso incluye el número de subgrupos, miembros, discusiones, sondeos y comentarios del grupo. Si necesitas conservar el grupo o [exportar sus datos](/en/user_manual/groups/data_export/), responde en un plazo de 90 días para que podamos restaurar el acceso antes de la eliminación.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  17dc58c271e429d5:
    english: Deleting your group will also cancel your Loomio subscription.
    translation: Al eliminar tu grupo, también se cancelará tu suscripción a Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fa7cec0f3ba570ef:
