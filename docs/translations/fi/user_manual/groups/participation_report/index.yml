    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  73c9822c08a37866:
    english: The report is available to everyone in your group, however users can only see results for groups that they belong to, this means that different users may see slightly different reports.
    translation: Raportti on kaikkien ryhmäsi jäsenten saatavilla. Kukin käyttäjä näkee kuitenkin vain niiden ryhmien tulokset, joihin hän kuuluu. Siksi raportti voi näyttää eri käyttäjille hieman erilaiselta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c9402b4720639f86:
    english: 'You can find the report by clicking the group settings menu cog, as shown below. '
