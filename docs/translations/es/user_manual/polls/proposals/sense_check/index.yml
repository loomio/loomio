---
navigation_title: Comprobar la opinión del grupo
blocks:
  5c5bf2d96ddf4ca2:
    english: "# Sense check"
    translation: "# Comprobar la opinión del grupo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4ec1b55b6ebaf563:
    english: Sense check gathers reactions while an idea is still being developed. Its options—**Looks good**, **Could be better**, and **Needs a rethink**—show whether the group is ready to proceed or should revise the idea first.
    translation: Esta consulta recoge opiniones mientras se desarrolla una idea. Sus opciones —**Se ve bien**, **Podría ser mejor** y **Necesita un replanteamiento**— muestran si el grupo está listo para seguir adelante o si conviene revisar la idea primero.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  43573d5547783c67:
    english: This page explains how to run one Sense check. See the [Simple decision process](/en/guides/making_decisions/simple_decision_process), [Consent process](/en/guides/making_decisions/consent_process), or [Consensus process](/en/guides/making_decisions/consensus_process) for examples of using Sense check as one stage of a larger process.
    translation: Esta página explica cómo realizar una consulta de este tipo. Consulta el [Proceso de decisión sencillo](/en/guides/making_decisions/simple_decision_process), el [Proceso de consentimiento](/en/guides/making_decisions/consent_process) o el [Proceso de consenso](/en/guides/making_decisions/consensus_process) para ver cómo usarla como parte de un proceso más amplio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5ad4c12fda490468:
    english: "## When to use Sense check"
    translation: "## Cuándo comprobar la opinión del grupo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dc841c725ef4e519:
    english: 'Use Sense check to:'
    translation: 'Usa esta consulta para:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8472db2ec587add8:
    english: |-
      - test an early draft before investing in a detailed proposal;
      - uncover questions and concerns before a formal decision;
      - check whether another round of discussion is needed; or
      - compare support before and after revising an idea.
    translation: |-
      - poner a prueba un borrador inicial antes de dedicar tiempo a una propuesta detallada;
      - detectar preguntas e inquietudes antes de tomar una decisión formal;
      - comprobar si hace falta otra ronda de discusión; o
      - comparar el apoyo antes y después de revisar una idea.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f411d599f7810e88:
    english: Do not treat **Looks good** as formal approval unless the group has explicitly agreed to do so. Use [Consent](../consent/) or [Consensus](../consensus/) when the response must authorize a decision.
    translation: No consideres **Se ve bien** una aprobación formal a menos que el grupo lo haya acordado expresamente. Usa [Consentimiento](../consent/) o [Consenso](../consensus/) cuando la respuesta deba autorizar una decisión.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e504f1a6f38ec6ad:
    english: "## Example: check a trial plan"
    translation: "## Ejemplo: revisar un plan piloto"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dd13b88fd1a52d50:
    english: Oatmilk Cooperative has drafted a returnable-bottle trial. It runs a Sense check to learn whether the collection schedule, washing checks, and reporting plan are ready for final review.
    translation: La Cooperativa Oatmilk ha preparado un plan piloto de botellas retornables. Consulta la opinión del grupo para saber si el calendario de recogida, las comprobaciones de lavado y el plan de informes están listos para la revisión final.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9703f1f9474243af:
    english: "## Set up the proposal"
    translation: "## Configura la propuesta"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  48d89110b4c23c6f:
    english: State what stage the idea has reached and what will happen with the feedback. Keep the default response meanings or edit them to match the group's language. Set a closing time that leaves enough time to revise the plan.
    translation: Indica en qué etapa está la idea y qué se hará con los comentarios. Mantén el significado predeterminado de las respuestas o adáptalo al lenguaje del grupo. Fija una hora de cierre que deje tiempo suficiente para revisar el plan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Vota"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a0f4779c6103c9c:
    english: Participants choose the response that best represents their current view and explain what is ready or what should change. A useful reason gives the proposal author something specific to act on.
    translation: Cada participante elige la respuesta que mejor refleja su opinión actual y explica qué está listo o qué debería cambiar. Una explicación útil da a quien creó la propuesta algo concreto sobre lo que actuar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Lee los resultados"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ddcd496a30ab97da:
    english: 'The chart shows the number and proportion of votes for each response. Read the reasons as well as the distribution: one well-founded concern may require attention even when most participants select **Looks good**.'
    translation: 'El gráfico muestra el número y la proporción de votos de cada respuesta. Lee también las explicaciones: una inquietud bien fundamentada puede requerir atención aunque la mayoría elija **Se ve bien**.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d9ac55d3e75e5484:
    english: Publish an outcome that summarizes the changes the group will make, or records that the idea is ready for the next decision stage.
    translation: Publica una conclusión que resuma los cambios que hará el grupo o deje constancia de que la idea está lista para la siguiente etapa de decisión.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
