  aadbf3844be4a95f:
    english: An Advice proposal gathers input for a decision that a person or team is responsible for making. Participants can offer advice or indicate that they have no advice to add.
    translation: הצעת עֵצָה אוספת מידע ועצות לקראת החלטה שבאחריות אדם או צוות לקבל. המשתתפים יכולים להציע עצה או לציין שאין להם עצה להוסיף.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  769a2446fc3ec4a9:
    english: This page explains the Advice proposal form, voting, and results. See the [Advice process](/en/guides/making_decisions/advice_process) for the complete workflow from framing the decision to publishing an outcome.
    translation: דף זה מסביר כיצד מגדירים הצעת עֵצָה, מצביעים בה וקוראים את התוצאות. לתהליך המלא, מהגדרת ההחלטה ועד לפרסום המסקנה, ראו [תהליך העצה](/en/guides/making_decisions/advice_process).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f19e32088d70eec4:
    english: "## When to use Advice"
    translation: "## מתי להשתמש בעֵצָה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d4c7e7da6f2d5860:
    english: Use Advice when the decision maker wants input from people with relevant expertise or people affected by the decision. It works well for supplier choices, operational decisions, policy drafts, and decisions within a delegated role.
    translation: כדאי להשתמש בעֵצָה כשמי שאחראים להחלטה מבקשים לשמוע אנשים בעלי ידע מתאים או אנשים שההחלטה תשפיע עליהם. היא מתאימה לבחירת ספקים, להחלטות תפעוליות, לטיוטות מדיניות ולהחלטות בתחום אחריות שהואצל לאחרים.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a81e33e00080fbe4:
    english: Advice is not an approval vote. Say who will make the decision, what constraints apply, and how they will consider the responses.
    translation: עֵצָה אינה הצבעת אישור. יש לציין מי יקבלו את ההחלטה, אילו מגבלות חלות עליה וכיצד יובאו התגובות בחשבון.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4be7ef0783f6e444:
    english: "## Example: choose a washing supplier"
    translation: "## דוגמה: בחירת ספק לשטיפה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d8157e98107798c6:
    english: Oatmilk Cooperative's operations coordinator must select a washing supplier. They invite advice about capacity, food-safety records, water use, service response times, and support.
    translation: רכזות התפעול של קואופרטיב חלב שיבולת השועל צריכה לבחור ספק לשטיפה. היא מזמינה עצות בנושא קיבולת, תיעוד בטיחות מזון, צריכת מים, זמני תגובה לשירות ותמיכה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9703f1f9474243af:
    english: "## Set up the proposal"
    translation: "## הגדרת ההצעה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6b9c305f0f4000d9:
    english: Describe the decision, name the decision maker, and include the information participants need. Invite people who are affected or have relevant knowledge. The default options let someone offer advice or abstain.
    translation: יש לתאר את ההחלטה, לציין מי יקבלו אותה ולכלול את המידע הדרוש למשתתפים. יש להזמין אנשים שההחלטה תשפיע עליהם או שיש להם ידע מתאים. אפשרויות ברירת המחדל מאפשרות להציע עצה או להימנע מהצבעה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## הצבעה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0a259af7a59899b7:
    english: Participants select **Advice** and give a concrete recommendation, risk, question, or relevant experience. They can abstain when they have no useful input.
    translation: המשתתפים בוחרים ב־**עֵצָה** ומוסיפים המלצה מעשית, סיכון, שאלה או ניסיון רלוונטי. כשאין להם מידע מועיל להוסיף, אפשר להימנע מהצבעה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## קריאת התוצאות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1d4bf7b5d0079f87:
    english: The chart confirms who has responded, but the reasons contain the substance of an Advice proposal. Look for constraints, agreements, and conflicting recommendations rather than treating the most common response as the decision.
    translation: התרשים מראה מי כבר הגיבו, אך הנימוקים הם עיקר ההצעה. כדאי לבחון מגבלות, הסכמות והמלצות סותרות, ולא לראות בתגובה הנפוצה ביותר את ההחלטה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e9fc01ce6c059f29:
    english: The decision maker publishes an outcome explaining what they decided and how the advice informed it.
    translation: מי שאחראים להחלטה מפרסמים מסקנה שמסבירה מה הוחלט וכיצד העצות השפיעו על ההחלטה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
