---
navigation_title: Вибори на СТВ
blocks:
  85590745d00e23c1:
    english: "# STV Elections"
    translation: "# Вибори на СТВ"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  366f56443108e10f:
    english: "**Single Transferable Vote (STV)** is a proportional representation voting method for electing multiple winners from a field of candidates. It ensures that elected candidates proportionally represent the diversity of views among voters."
    translation: "**Єдиний передаваний голос (STV)** — метод пропорційного голосування для обрання кількох переможців із числа кандидатів. Він допомагає обрати кандидатів, які пропорційно представляють різні погляди виборців."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  61dee55b45038f56:
    english: "## When to use STV"
    translation: "## Коли використовувати СТВ"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8311dca26cec6519:
    english: 'Use an STV Election when you need to:'
    translation: 'Використовуйте вибори на СТВ, якщо потрібно:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1d4338734ec6e113:
    english: |-
      - Elect a **committee, board, or slate of delegates** from a pool of nominees
      - Ensure **proportional representation**, where minority factions can win seats proportional to their support
      - Run elections where voters rank candidates by preference
    translation: |-
      - Обрати **комітет, правління або групу делегатів** із числа висунутих кандидатів
      - Забезпечити **пропорційне представництво**, щоб групи з меншою підтримкою могли отримати відповідну частку місць
      - Провести вибори, на яких виборці ранжують кандидатів за вподобаннями
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e6e1ae026f65a715:
    english: |-
      >[!NOTE]
      >STV is **not** the same as Loomio's [Rank poll](/en/user_manual/polls/rank/), which is a simpler score-based ranking for choosing a single best option. STV handles multi-winner elections with vote transfers and elimination rounds.
    translation: |-
      >[!NOTE]
      >СТВ **відрізняється** від [рангового опитування](/en/user_manual/polls/rank/) у Loomio. Рангове опитування використовує простіше оцінювання, щоб вибрати один найкращий варіант. СТВ дає змогу обрати кількох переможців шляхом передавання голосів і вибування кандидатів у раундах.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  62af8f95f18dbafe:
    english: "## Creating an STV Election"
    translation: "## Створення виборів на СТВ"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  edf2f36e75c81665:
    english: When starting a poll, select **STV Election** as the poll type, then add the candidates as the poll options. You can customize the poll by setting the **number of seats**, the **counting method**, and the **quota type**.
    translation: Під час створення опитування виберіть тип **Вибори на СТВ**, а потім додайте кандидатів як варіанти відповіді. Ви можете налаштувати **кількість місць**, **метод підрахунку** та **тип квоти**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b40ddcfb8cdc44fd:
    english: In this example, Oatmilk Cooperative is electing three people to oversee its returnable packaging trial. The form explains the role, lists five candidates, and uses Scottish STV with the Droop quota.
    translation: У цьому прикладі кооператив Oatmilk обирає трьох людей для нагляду за випробуванням багаторазової упаковки. У формі описано цю роль, перелічено п’ятьох кандидатів і вибрано шотландський метод СТВ із квотою Друпа.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a34592929349d06:
    english: "### Number of seats"
    translation: "### Кількість місць"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c09f5f51333612dc:
    english: How many winners should be elected. Must be less than the number of candidates.
    translation: Кількість переможців, яких потрібно обрати. Вона має бути меншою за кількість кандидатів.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ddceec01d910b152:
    english: "### Counting method"
    translation: "### Метод підрахунку"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  39e9e81a89272771:
    english: 'There are two available methods for counting the votes:'
    translation: 'Доступні два методи підрахунку голосів:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a7031d1180e95273:
    english: |-
      Scottish STV
        : Recommended. The Weighted Inclusive Gregory Method (WIGM) used in Scottish local elections since 2007. Well-defined, straightforward rules. Best for most organizations.
    translation: |-
      Шотландський СТВ
        : Рекомендовано. Зважений інклюзивний метод Грегорі (WIGM), який використовують на місцевих виборах у Шотландії з 2007 року. Має чіткі й прості правила. Підходить більшості організацій.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1507e4fde88848dd:
    english: |-
      Meek STV
        : A more mathematically precise iterative method. When a candidate is eliminated, votes are recounted as if that candidate was never in the race.
    translation: |-
      Метод Міка
        : Ітеративний метод із вищою математичною точністю. Коли кандидат вибуває, голоси перераховують так, ніби він ніколи не брав участі у виборах.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b9abcd12eef5f629:
    english: "### Quota type"
    translation: "### Тип квоти"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6dc3aea49266d40d:
    english: 'The quota is the minimum number of votes a candidate needs to win a seat. It can be either:'
    translation: 'Квота — це мінімальна кількість голосів, потрібна кандидату для здобуття місця. Є два типи квоти:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  88f62f286d8c550f:
    english: |-
      Droop
        : Recommended. The standard quota type for most STV elections, and used by Ireland, Australia, and Scotland. Droop guarantees a majority coalition wins a majority of seats. It is calculated as:
      \\[ floor(\frac{votes}{(seats + 1)}) + 1 \\]
    translation: |-
      Друпа
        : Рекомендовано. Стандартний тип квоти для більшості виборів на СТВ. Його використовують в Ірландії, Австралії та Шотландії. Квота Друпа гарантує, що коаліція з більшістю голосів отримає більшість місць. Її обчислюють так:
      \\[ floor(\frac{votes}{(seats + 1)}) + 1 \\]
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  817b3994e92898e8:
    english: |-
      Hare
        : A higher minimum threshold, and more proportional for smaller factions.
          Hare is preferred by DSA chapters to protect minority representation.
         It is calculated as:
          \\[ \frac{votes}{seats}\\]
    translation: |-
      Гера
        : Вищий мінімальний поріг, який забезпечує більшу пропорційність для невеликих груп.
          Осередки DSA віддають перевагу квоті Гера, щоб захистити представництво меншості.
         Її обчислюють так:
          \\[ \frac{votes}{seats}\\]
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f12065bdf5d3678e:
    english: |2-
        >[!TIP]
        > Droop will always compute to a smaller number of votes than Hare. For example, in an election with 100 votes and four seats, the Droop quota would be 21 and the Hare quota 25.
    translation: |-
      >[!TIP]
        > Квота Друпа завжди потребує меншої кількості голосів, ніж квота Гера. Наприклад, на виборах зі 100 голосами й чотирма місцями квота Друпа становить 21 голос, а квота Гера — 25.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  984516abc3cfd89b:
    english: "## How voting works"
    translation: "## Як відбувається голосування"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  40e98247d87cdf27:
    english: 'In this example, Oatmilk Cooperative is electing three people to oversee the reusable packaging trial. Voters drag candidates above the line and rank them in order of preference:'
    translation: 'У цьому прикладі кооператив Oatmilk обирає трьох людей для нагляду за випробуванням багаторазової упаковки. Виборці перетягують кандидатів вище лінії та ранжують їх за вподобаннями:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f8aaa5391f05117f:
    english: |-
      - **Rank 1** = most preferred candidate
      - **Rank 2** = second choice
      - Continue ranking as many candidates as desired
    translation: |-
      - **Ранг 1** = найбажаніший кандидат
      - **Ранг 2** = другий вибір
      - Продовжуйте ранжувати стільки кандидатів, скільки бажаєте
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  70bd790faf93c916:
    english: Voters are not required to rank every candidate. Unranked candidates will not receive any of that voter's support.
    translation: Виборцям не обов’язково ранжувати всіх кандидатів. Кандидати без рангу не отримають підтримки цього виборця.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d82e369c7c293a0c:
    english: |-
      ## How counting works
      The count is performed as follows:
    translation: |-
      ## Як відбувається підрахунок
      Голоси підраховують так:
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0ea01b5d531abc06:
    english: |-
      1. A **quota** is calculated (minimum votes needed to win a seat).
      2. **First preferences** are counted for each candidate.
      3. If a candidate meets the quota, they are **elected**. Their surplus votes (above the quota) are **transferred** to voters' next preferences at a fractional value.
      4. If no candidate meets the quota, the candidate with the **fewest votes is eliminated**. Their votes transfer to voters' next preferences at full value.
      5. This process repeats until all seats are filled.
    translation: |-
      1. Обчислюється **квота** — мінімальна кількість голосів, потрібна для отримання місця.
      2. Для кожного кандидата підраховуються **Перші уподобання**.
      3. Якщо кандидат досягає квоти, його **обирають**. Його надлишкові голоси (понад квоту) **передаються** наступним за пріоритетом кандидатам виборців із дробовою вагою.
      4. Якщо жоден кандидат не досягає квоти, кандидат із **найменшою кількістю голосів вибуває**. Його голоси передаються наступним за пріоритетом кандидатам виборців із повною вагою.
      5. Процес повторюється, доки всі місця не будуть заповнені.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c6f397233ad479e5:
    english: |-
      >[!TIP]
      >If a voter has ranked no remaining candidates, their ballot is "exhausted" and that vote is lost. This is why ranking more candidates is generally better.
    translation: |-
      >[!TIP]
      >Якщо виборець не ранжував жодного з кандидатів, які залишилися, його бюлетень вичерпано, а голос більше не враховують. Тому зазвичай варто ранжувати більше кандидатів.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  acba228efb586cca:
    english: "## Understanding results"
    translation: "## Як читати результати"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3b584c17ac358371:
    english: 'After the poll closes, results are displayed in several sections. In this election, Samira Patel, Alex Morgan, and Morgan Price fill the three committee seats:'
    translation: 'Після закриття опитування результати показано в кількох розділах. На цих виборах Саміра Пател, Алекс Морган і Морган Прайс посіли три місця в комітеті:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9c3f3c8a80729fbf:
    english: "### Method and quota"
    translation: "### Метод і квота"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  feee79b9f6e92de3:
    english: At the top, you'll see the counting method (Scottish STV or Meek STV) and quota type (Droop or Hare) along with the quota — the number of votes a candidate needed to win a seat.
    translation: Угорі ви побачите метод підрахунку (шотландський СТВ або метод Міка), тип квоти (Друпа або Гера) і саму квоту — кількість голосів, потрібну кандидату для здобуття місця.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e180eb800c3435cd:
    english: "### Elected candidates"
    translation: "### Обрані кандидати"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8db8b2466db56f2b:
    english: 'A summary table of the winners with five columns:'
    translation: 'Підсумкова таблиця переможців має п’ять стовпців:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f998ffc721953501:
    english: |-
      | Column | Meaning |
      |--------|---------|
      | **Candidate** | The name of the elected candidate |
      | **Round elected** | Which counting round they reached the quota and won a seat. Round 1 means they won on first preferences alone; higher rounds mean they needed transferred votes from eliminated or surplus candidates. |
      | **First preferences** | How many voters ranked this candidate as their first choice. This shows a candidate's direct support before any vote transfers. |
      | **Final tally** | The candidate's vote tally at the moment they were elected. Due to vote transfers, this is often higher than their first preferences. |
      | **Surplus** | How much the candidate's final tally exceeded the quota (final tally minus quota). A larger surplus means stronger support beyond what was needed to win. In Scottish STV, this surplus is redistributed to voters' next preferences. |
    translation: |-
      | Стовпець | Значення |
      |--------|---------|
      | **Кандидат** | Ім’я обраного кандидата |
      | **Обраний у раунді** | Раунд підрахунку, у якому кандидат досяг квоти й здобув місце. Раунд 1 означає перемогу лише завдяки першим уподобанням. У наступних раундах для перемоги знадобилися передані голоси кандидатів, які вибули або отримали голоси понад квоту. |
      | **Перші уподобання** | Кількість виборців, які поставили цього кандидата на перше місце. Показує пряму підтримку кандидата до передавання голосів. |
      | **Остаточний підрахунок** | Кількість голосів кандидата на момент обрання. Через передавання голосів вона часто перевищує кількість перших уподобань. |
      | **Надлишок** | Наскільки остаточна кількість голосів кандидата перевищила квоту (остаточний підрахунок мінус квота). Більший надлишок означає сильнішу підтримку понад необхідну для перемоги. У шотландському СТВ цей надлишок перерозподіляють між наступними за вподобанням кандидатами. |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  efc41c326d955758:
    english: If the count results in a tie — where eliminating any of the remaining candidates would change the outcome — those candidates are shown in a separate table rather than arbitrarily choosing a winner.
    translation: Якщо підрахунок завершується нічиєю і вибування будь-кого з кандидатів, які залишилися, змінило б результат, цих кандидатів показують в окремій таблиці. Переможця не обирають довільно.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8a6ae4ad28f0acf6:
    english: "### Round-by-round details"
    translation: "### Деталі по кожному раунду"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3d907145fd075144:
    english: 'Expand **Round-by-round details** to see vote transfers and eliminations. Each row is a candidate and each column is a counting round:'
    translation: 'Розгорніть **Деталі по кожному раунду**, щоб побачити передавання голосів і вибування кандидатів. Кожен рядок відповідає кандидату, а кожен стовпець — раунду підрахунку:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cc37217cd681fabe:
    english: The green highlight shows when a candidate was elected, red shows when they were eliminated, and orange shows when they tied.
    translation: Зеленим позначено раунд обрання кандидата, червоним — раунд його вибування, а помаранчевим — раунд нічиєї.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ed4aaa0a898906fd:
    english: "## Exporting ballots"
    translation: "## Експорт бюлетенів"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c96d54ebfbedae32:
    english: After the election closes, people who can view the results can export the ballots in BLT format for an independent recount or audit. The export contains candidate rankings and combines identical rankings into a single row with a ballot count. For anonymous elections it does not contain voter identities, ballot identifiers, submission times, or submission order.
    translation: Після закриття виборів люди, які мають доступ до результатів, можуть експортувати бюлетені у форматі BLT для незалежного перерахунку або перевірки. Експорт містить ранжування кандидатів. Однакові ранжування об’єднано в один рядок із кількістю бюлетенів. Для анонімних виборів експорт не містить даних про виборців, ідентифікаторів бюлетенів, часу подання чи порядку подання.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
