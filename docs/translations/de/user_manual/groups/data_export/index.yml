  374e78cd9af57cfd:
    english: In the thread menu click on the 3 dots menu (⋯) and choose **Print**. Loomio will generate an HTML page that you can then print or "save to pdf" using the print tool in your browser.
    translation: Klicke im Diskussionsmenü auf die drei Punkte (⋯) und wähle **Drucken**. Loomio erstellt eine HTML-Seite, die du mit der Druckfunktion deines Browsers drucken oder als PDF speichern kannst.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8bc0f6441f7870fe:
    english: You can copy the page to paste it into a document editor, file, or data repository.
    translation: Du kannst die Seite kopieren und in einen Dokumenteneditor, eine Datei oder ein Datenarchiv einfügen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  acd7219673eb8a9d:
    english: "![Print action for the returnable bottles discussion](discussion_print_discussion.png#width-90)"
    translation: "![Aktion „Drucken“ für die Diskussion über Mehrwegflaschen](discussion_print_discussion.png#width-90)"
    status: machine
    provider: codex/gpt-6-sol
