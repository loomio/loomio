  1650f708482b4789:
    english: "### Voting record per user"
    translation: "### Registro de votación por usuario"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e6670b54039f316a:
    english: Compare the number of votes issued to each person with the number they cast, see missed votes, and identify people who cast every vote issued to them. A person with no issued votes is not shown as having cast all votes. Anonymous polls are excluded because an anonymous ballot must not be associated with the person who cast it.
    translation: Compara el número de votos que cada persona podía emitir con los que emitió. Consulta los votos que no emitió e identifica a quienes emitieron todos los votos disponibles. Si una persona no tenía votos disponibles, no aparece como si hubiera emitido todos los votos. Se excluyen las encuestas anónimas porque no se debe asociar un voto anónimo con quien lo emitió.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  252da2b72775c4f8:
    english: Use **Delegates only** to review the voting record of current delegates. The CSV download uses the same name and delegate filters.
    translation: Usa **Solo delegados** para consultar el registro de votación de quienes actualmente son delegados. La descarga CSV utiliza los mismos filtros de nombre y delegados.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
