  a27011d28c4f11a6:
    english: "## Administering discussions"
    translation: "## Gérer les discussions"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8e67ece08e454475:
    english: There is a range of features in Loomio to help you administer discussions accessible from the drop down menu to the right of the discussion.
    translation: Pour gérer une discussion, ouvrez le menu déroulant à sa droite. Vous y trouverez plusieurs fonctions.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2d5be8c39f22ec28:
    english: 'Keep the discussion list current by using:'
    translation: 'Pour tenir la liste des discussions à jour, utilisez :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  75739da1bd5910a6:
    english: |-
      - **Pin discussion** to keep important discussions at the top of the list
      - **Edit discussion** to change discussion title or update discussion context
      - **Move to group** when you want to move a discussion to another group or subgroup, or to an archive group.
      - **Lock thread** to prevent further comments or changes and remove the thread from the list of open threads. Locked threads are available under the discussion filter and from the search bar, and can be unlocked at any time.
      - **Delete discussion** when you do not want to keep a record of the discussion.  Note that deleted discussions can not be un-deleted.
    translation: |-
      - **Discussion sur les épingles** pour garder les discussions importantes en haut de la liste
      - **Modifier la discussion** pour changer le titre ou mettre à jour le contexte de la discussion
      - **Déplacer dans le groupe ** pour déplacer une discussion vers un autre groupe, un sous-groupe ou un groupe d’archives.
      - **Verrouiller la discussion** pour empêcher l’ajout de commentaires ou toute autre modification et retirer la discussion de la liste des discussions ouvertes. Les discussions verrouillées restent accessibles depuis le filtre des discussions et la barre de recherche. Vous pouvez les déverrouiller à tout moment.
      - **Supprimer la discussion** si vous ne souhaitez pas en conserver de trace. Une discussion supprimée ne peut pas être restaurée.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e3d2099d0e6fe6fa:
    english: "## Category tags"
    translation: "## Mots-clés de catégorie"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  24b03357f6f6c3b9:
    english: Category tags are a great way to label discussions so they can be easily found. Set tags and apply to each discussion  - try to be consistent.
    translation: Les mots-clés de catégorie facilitent la recherche des discussions. Définissez des mots-clés et appliquez-les aux discussions de façon cohérente.
    status: machine
