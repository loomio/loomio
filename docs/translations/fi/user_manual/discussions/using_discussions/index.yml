    translated_on: '2026-09-29'
  e94ea6f4b9dae8d4:
    english: When you add a comment, poll, vote, or outcome, Loomio marks your own new item as read. It will not appear as something new for you to review.
    translation: Kun lisäät kommentin, kyselyn, äänen tai johtopäätöksen, Loomio merkitsee lisäämäsi kohdan luetuksi. Se ei näy sinulle uutena tarkistettavana sisältönä.
