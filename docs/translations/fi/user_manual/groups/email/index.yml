  14280ff177b248ab:
    english: "# Send an email to start a thread in your group"
    translation: "# Aloita viestiketju ryhmässäsi sähköpostitse"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e3de5524e10b9928:
    english: Your Loomio group has an email address! You can send or forward email to this address to start a thread in the group.
    translation: Loomio-ryhmälläsi on sähköpostiosoite. Voit aloittaa viestiketjun ryhmässä lähettämällä tai välittämällä sähköpostin tähän osoitteeseen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  85a7436d4a1b4396:
    english: |-
      You can see your group's email address on the group page:
      ![location of the email address on the group page](email_email_button.png)
    translation: |-
      Näet ryhmäsi sähköpostiosoitteen ryhmän sivulla:
      ![Sähköpostiosoitteen sijainti ryhmän sivulla](email_email_button.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e34019bbcf3b319f:
    english: When you send an email to this address, a new thread will be started. The email subject becomes the thread title, the body of the email becomes the description, and any attached files will be attached to the thread.
    translation: Kun lähetät sähköpostin tähän osoitteeseen, ryhmään syntyy uusi viestiketju. Sähköpostin aiheesta tulee viestiketjun otsikko ja viestin tekstistä sen kuvaus. Liitetiedostot lisätään viestiketjuun.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  46a53b8267a61c2f:
    english: The email "From" address is used to find the group member who will be the author of the thread.
    translation: Sähköpostin Lähettäjä-osoitteen perusteella tunnistetaan ryhmän jäsen, joka merkitään viestiketjun kirjoittajaksi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bd7df6f632af8db1:
    english: "## Preventing unauthorized emails"
    translation: "## Luvattomien sähköpostien estäminen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a5118468df167ba0:
    english: To ensure that this feature cannot be used by people who are not members of your group, Loomio will require that the "From" address of an incoming email matches the address of someone in the group.
    translation: Jotta ryhmään kuulumattomat eivät voi käyttää tätä ominaisuutta, Loomio edellyttää, että saapuvan sähköpostin Lähettäjä-osoite kuuluu ryhmän jäsenelle.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f11910ae643c5b47:
    english: If you use multiple email addresses, you can add an alias so Loomio knows about your other email addresses.
    translation: Jos käytät useita sähköpostiosoitteita, voit lisätä muut osoitteesi aliaksiksi Loomioon.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e3d88a25128322b5:
    english: When the "from" address does not match a member of the group, you will receive a notification asking you to add an alias or reject all further emails from that address.
    translation: Jos lähettäjän osoite ei vastaa ryhmän jäsenen osoitetta, saat ilmoituksen, jossa sinua pyydetään lisäämään alias tai estämään kaikki myöhemmät viestit kyseisestä osoitteesta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  890546269cfa56b6:
    english: This means that the first time you send email from an unrecognised address, you will need to add an alias. After that, emails will be accepted immediately.
    translation: Kun lähetät ensimmäisen kerran sähköpostin osoitteesta, jota Loomio ei tunnista, sinun täytyy lisätä osoite aliakseksi. Sen jälkeen sähköpostit hyväksytään heti.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e778a27d6b286135:
