name: loomio

services:
  nginx-proxy:
    image: ${LOOMIO_NGINX_PROXY_IMAGE:-nginxproxy/nginx-proxy}:${NGINX_PROXY_CONTAINER_TAG}
    labels:
      - "com.github.nginx-proxy.nginx"
    networks:
      - main
    ports:
      - 80:80
      - 443:443
    configs:
      - source: nginx-custom
        target: /etc/nginx/conf.d/custom.conf
    volumes:
      - certs:/etc/nginx/certs:ro
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro
    restart: unless-stopped

  nginx-proxy-acme:
    image: nginxproxy/acme-companion:${ACME_COMPANION_CONTAINER_TAG}
    environment:
      - DEFAULT_EMAIL=${SUPPORT_EMAIL}
    networks:
      - main
    depends_on:
      - nginx-proxy
    volumes:
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - acme:/etc/acme.sh
    restart: unless-stopped

  app:
    container_name: loomio-app
    image: ${LOOMIO_CONTAINER_IMAGE}:${LOOMIO_CONTAINER_TAG}
    restart: unless-stopped
    group_add:
      - "10001"
    healthcheck:
      test: ['CMD-SHELL', 'curl --fail http://localhost:3000/ || exit 1']
    expose:
      - 3000
    env_file: ./.env
    environment:
      - VIRTUAL_HOST=${CANONICAL_HOST},${REPLY_HOSTNAME}
      - ACME_HOST=${CANONICAL_HOST},${REPLY_HOSTNAME}
      - HOTCELL_ROOT=/run/hotcell
      - HOTCELL_GROUP=10001
    volumes:
      - ./uploads:/loomio/public/system
      - ./storage:/loomio/storage
      - ./files:/loomio/public/files
      - ./plugins:/loomio/plugins/docker
      - ./import:/import
      - ./tmp:/loomio/tmp
      - client3:/loomio/public/client3
      - hotcell-sockets:/run/hotcell/active_storage
    networks:
      - main
    depends_on:
      - db
      - redis
      - hotcell

  worker:
    container_name: loomio-worker
    image: ${LOOMIO_CONTAINER_IMAGE}:${LOOMIO_CONTAINER_TAG}
    restart: always
    group_add:
      - "10001"
    networks:
      - main
    env_file: ./.env
    environment:
      - TASK=worker
      - HOTCELL_ROOT=/run/hotcell
      - HOTCELL_GROUP=10001
    depends_on:
      app:
        condition: service_healthy
      hotcell:
        condition: service_started
    volumes:
      - ./uploads:/loomio/public/system
      - ./storage:/loomio/storage
      - ./files:/loomio/public/files
      - ./plugins:/loomio/plugins/docker
      - ./tmp:/loomio/tmp
      - hotcell-sockets:/run/hotcell/active_storage

  hotcell:
    container_name: loomio-hotcell
    image: ${LOOMIO_CONTAINER_IMAGE}:${LOOMIO_CONTAINER_TAG}
    restart: unless-stopped
    network_mode: "none"
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=512m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    environment:
      - TASK=hotcell
    volumes:
      - hotcell-sockets:/run/hotcell/cell

  db:
    container_name: loomio-db
    image: postgres:${POSTGRES_CONTAINER_TAG}
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
    networks:
      - main
    env_file: ./.env
    volumes:
      - ./pgdata:/pgdata
    environment:
     - PGDATA=/pgdata

  redis:
    container_name: loomio-redis
    image: redis:8.4
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - "${REDIS_MAXMEMORY:-256mb}"
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
    networks:
      - main

  haraka:
    container_name: loomio-haraka
    image: ${HARAKA_CONTAINER_IMAGE}:${HARAKA_CONTAINER_TAG}
    restart: unless-stopped
    env_file: ./.env
    environment:
      - HARAKA_TLS_KEY_PATH=/etc/nginx/certs/${REPLY_HOSTNAME}.key
      - HARAKA_TLS_CERT_PATH=/etc/nginx/certs/${REPLY_HOSTNAME}.crt
    networks:
      - main
    ports:
      - "25:25"
    volumes:
      - certs:/etc/nginx/certs:ro
      - haraka-queue:/haraka/queue

networks:
  main:

configs:
  nginx-custom:
    content: |
      client_max_body_size ${FILE_UPLOAD_MAX_MB:-1024}m;

volumes:
  haraka-queue:
  certs:
  vhost:
  html:
  acme:
  client3:
  hotcell-sockets:
