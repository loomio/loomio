  '0479bd2337b02443':
    english: "### Boards and Governance"
    translation: "### Juntas directivas y gobernanza"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5b0a3e2c653d47f8:
    english: "**Prepare for a meeting** - Build an agenda, post board papers and organize administrative matters so everyone is up to date, in context and prepared. "
    translation: "**Prepárate para una reunión** - Prepara el orden del día, publica los documentos de la junta y organiza los asuntos administrativos para que todas las personas tengan la información necesaria y puedan prepararse."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5c1c6aa79c3556dc:
    english: "**Pass a resolution** - Post context and background information, respond to questions and raise a proposal to pass a resolution. "
    translation: "**Pasar una resolución** - Publica el contexto y los antecedentes, responde a las preguntas y presenta una propuesta para aprobar una resolución."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  07ae9c6a1f0a32d0:
    english: "**Discuss an agenda item on Loomio** - Start discussion about an agenda item prior to your meeting. Or, if you run out of time in the meeting, move the discussion on to Loomio."
    translation: "**Debatir un punto del orden del día en Loomio** - Inicia la discusión antes de la reunión. Si se acaba el tiempo durante la reunión, continúa la discusión en Loomio."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f0b0de7094b1cfc9:
    english: "**Approve minutes and track actions** - Post minutes and assign actions. Use a poll to approve minutes. "
    translation: "**Aprobar el acta y hacer seguimiento de las tareas** - Publica el acta y asigna tareas. Usa un sondeo para aprobar el acta."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ba7cf177191baadb:
    english: "### Member participation"
    translation: "### Participación de los miembros"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3cf51f837c0a3e9f:
    english: "**Share news (replace mailing list)** - Post information for members, invite comments."
    translation: "**Compartir novedades (en lugar de una lista de correo)** - Publica información para los miembros e invita a comentar."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d2cd391b61042129:
    english: "**Organize an event** - Work with your organizing team on details. Keep all discussion and info within the thread. Then announce the event to wider membership."
    translation: "**Organizar un evento** - Coordina los detalles con el equipo organizador. Mantén toda la conversación y la información en el hilo. Después, anuncia el evento al resto de los miembros."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cf59a44a8643cc96:
    english: "**Develop a policy** - Post a policy draft, seek member feedback and input, finalize and ratify the policy."
    translation: "**Elaborar una política** - Publica un borrador, pide opiniones y aportaciones a los miembros, y termina y ratifica la política."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6ddec467576426ca:
    english: "**General Assembly** - Organize, prepare and run a formal meeting including all members, to deliberate and make decisions on strategic matters."
    translation: "**Asamblea general** - Organiza, prepara y celebra una reunión formal con todos los miembros para deliberar y tomar decisiones sobre asuntos estratégicos."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8d32bb446c4ca025:
    english: "### Self-organizing working teams"
    translation: "### Equipos de trabajo autogestionados"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  87ab6b2d51a7c1b6:
    english: "**Share information** - Post information and reports of interest to your team, invite comment and discussion."
    translation: "**Compartir información** - Publica información e informes de interés para tu equipo e invita a comentar y debatir."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e93205aa183cd1e0:
    english: "**Progress work** - Outline a work task and seek advice, input and feedback from team members through to completion."
    translation: "**Avanzar en el trabajo** - Describe una tarea y pide consejos, aportaciones y opiniones a los miembros del equipo hasta completarla."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1ddaef5d44653691:
    english: "**Meeting notes and actions** - Post meeting notes as a record of discussion, and follow up on tasks. "
    translation: "**Notas de reunión y tareas** - Publica las notas de la reunión como registro de lo hablado y haz seguimiento de las tareas."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8ce9169d72c90788:
    english: "**Explore ideas** - Share thoughts and invite discussion about a concern you notice, or an improvement that can be made."
    translation: "**Explorar ideas** - Comparte tus ideas e invita a debatir sobre un problema que hayas detectado o una posible mejora."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a06e734e86f07828:
    english: "**Advice, Consent and Generative decision making** - Prepare, propose, clarify, respond to reactions and objections, agree and implement - all within a Loomio discussion."
    translation: "**Tomar decisiones mediante asesoramiento, consentimiento y generación de propuestas** - Prepara, propón, aclara, responde a las reacciones y objeciones, llega a un acuerdo y ponlo en práctica, todo dentro de una discusión de Loomio."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
