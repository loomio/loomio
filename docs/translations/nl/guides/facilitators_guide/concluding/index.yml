navigation_title: Afronden
blocks:
  b2d8fb17fce5a4a3:
    english: "# Concluding"
    translation: "# Afronden"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4e03229937f959ed:
    english: "## Outcomes & Next Steps"
    translation: "## Conclusies en vervolgstappen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  eaf0fe98db301c7f:
    english: 'Confirming the outcome can be critical to feel like the goals of a collaborative discussion have been achieved. A facilitator can pull together what’s been decided and reflect it back, to help the group walk away with the answers to some key questions:'
    translation: 'Een duidelijke conclusie helpt de groep te zien of de doelen van een gezamenlijke discussie zijn bereikt. Een begeleider kan samenvatten wat er is besloten. Zo krijgt de groep antwoord op enkele belangrijke vragen:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  00ed94f662c9643a:
    english: |-
      * What did we do?
      * What does it mean?
      * What will happen now?
      * What is my responsibility?
      * What will be different because we went through this experience?
    translation: |-
      * Wat hebben we gedaan?
      * Wat betekent het?
      * Wat gebeurt er nu?
      * Wat is mijn verantwoordelijkheid?
      * Wat zal er door deze ervaring anders zijn?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0f9ecf512b4990b7:
    english: Sometimes the answers to these questions are very concrete, such as action points, while other times they are more abstract, such as deepening shared understanding.
    translation: Soms zijn de antwoorden heel concreet, zoals actiepunten. Soms zijn ze abstracter, zoals een beter gedeeld begrip.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aabfa9d842af2688:
    english: On Loomio
    translation: Op Loomio
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a63bbb12b1a1e04c:
    english: |-
      * [Outcomes](/en/user_manual/polls/outcomes/) are a very important tool. A proposal ending is not quite the end: there’s a need to sum up conclusively. That's what the outcome feature is for.
      * Many Loomio discussions come to a natural end without even using proposals or publishing outcomes. These discussions still provide a lot of value, and it can be helpful to update the context box with an outcome summary for later reference.
      * If specific people have action points, you can @mention their names and they will be notified.
    translation: |-
      * [Conclusies](/en/user_manual/polls/outcomes/) zijn een belangrijk hulpmiddel. Als een voorstel afloopt, is het proces nog niet helemaal afgerond: er is een afsluitende samenvatting nodig. Daarvoor is de conclusiefunctie bedoeld.
      * Veel discussies op Loomio komen vanzelf tot een einde, zonder voorstel of gepubliceerde conclusie. Ook die discussies zijn waardevol. Je kunt het contextvak bijwerken met een samenvatting van de conclusie, zodat je die later kunt terugvinden.
      * Als bepaalde mensen actiepunten hebben, kun je hun namen @vermelden. Zij krijgen dan een melding.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  55a9b345194f80d6:
    english: "## Reporting & Harvesting"
    translation: "## Verslaglegging en vastleggen van inzichten"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fc6ee28887dd5ab1:
    english: To understand the meaning of an experience, you have to inquire into how it fits into the bigger context. What was this moment, in the bigger rhythm of our progress? What form will our understanding from this experience take — a story, a report, a change, a call to action?
    translation: Om te begrijpen wat een ervaring betekent, moet je kijken hoe die in het grotere geheel past. Welke plaats had dit moment in onze voortgang? Welke vorm geven we aan wat we hebben geleerd — een verhaal, een verslag, een verandering of een oproep tot actie?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  eb2cdc1c6526e053:
    english: The experience happens in the moment, but its impact often comes from putting handles on it, giving it a name, and being able to use it and refer to it. Otherwise you risk forgetting, leaving people out who weren't there, or having to repeat it later. Productive collaboration is often helped by tangible documentation or reporting.
    translation: Een ervaring speelt zich af op één moment. De waarde ervan wordt vaak pas duidelijk als je haar een naam geeft en vastlegt, zodat je er later naar kunt verwijzen en op kunt voortbouwen. Anders kun je vergeten wat er is gebeurd, mensen buitensluiten die er niet bij waren of hetzelfde werk later moeten herhalen. Concrete documentatie of verslaglegging helpt vaak bij een goede samenwerking.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4104d8b917a87b0e:
    english: |-
      * Loomio is self-documenting — notes write themselves as an integrated part of the process. This creates a gold-mine of archival content for groups, without any extra effort.
      * We have some features to support harvesting and archiving: the search function, the “previous decisions” list, and the print discussion option.
      * Premium plans offer the option to export all your group's Loomio data.
      * Many groups use Loomio to integrate content from various channels. For example, posting a meeting announcement and building the agenda on Loomio, having the meeting in person, posting the notes back on Loomio, and making related decisions in the same thread. This expands the “self-harvesting” ability of Loomio beyond the online space.
    translation: |-
      * Loomio legt het proces vanzelf vast: aantekeningen ontstaan als onderdeel van de samenwerking. Zo bouwen groepen zonder extra werk een waardevol archief op.
      * Loomio heeft functies om inzichten terug te vinden en te bewaren: de zoekfunctie, de lijst met eerdere besluiten en de optie om een discussie af te drukken.
      * Met een Premium-abonnement kun je alle Loomio-gegevens van jouw groep exporteren.
      * Veel groepen gebruiken Loomio om informatie uit verschillende kanalen samen te brengen. Je kunt bijvoorbeeld een vergadering aankondigen en de agenda op Loomio opstellen, de vergadering persoonlijk houden, de aantekeningen op Loomio plaatsen en in dezelfde thread besluiten nemen. Zo legt Loomio ook vast wat buiten het platform gebeurt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dae98cfd5f14b034:
    english: "## Turning Discussion into Action"
    translation: "## Van discussie naar actie"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a39a66938d6cadb0:
    english: There comes a moment when you have to re-engage with the reality outside the room. Occasionally, the need is simply to work with ideas and feelings, without worrying about implementation. But usually a group will not reach its goals without applying its conclusions to real-world action. This transition is part of the total facilitated experience.
    translation: Op een gegeven moment moet je weer aan de slag met de werkelijkheid buiten de gespreksruimte. Soms is het genoeg om ideeën en gevoelens te verkennen, zonder al aan de uitvoering te denken. Maar meestal bereikt een groep haar doelen pas als zij haar conclusies omzet in concrete actie. Ook die overgang hoort bij het begeleide proces.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3e26f1939ffe69fe:
    english: 'It’s at this point that a collaborative process intersects with other organizational systems, and the facilitator has to help figure out how it will work. These other systems might include:'
    translation: 'Op dat moment komt het gezamenlijke proces samen met andere systemen binnen de organisatie. De begeleider helpt uitzoeken hoe dat in de praktijk werkt. Denk daarbij aan:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cb030c5876714643:
    english: |-
      * **Power** — Who actually makes decisions? What has to happen for ideas to turn into reality here?
      * **Management** — How does this fit into other priorities? What dependencies might exist?
      * **Delegation** — Who will take responsibility for next steps? Will they be held accountable?
      * **Communication** — How will this process or discussion be relayed to others? What do they need to know?
      * **Administration** — How will information from one system be input into another, such as a task tracking or communications tool? Where will information be stored?
    translation: |-
      * **Beslissingsmacht** — Wie neemt de besluiten? Wat is er nodig om ideeën hier werkelijkheid te laten worden?
      * **Management** — Hoe past dit bij andere prioriteiten? Waar is de uitvoering van afhankelijk?
      * **Taakverdeling** — Wie neemt de verantwoordelijkheid voor de vervolgstappen? Hoe wordt daarop toegezien?
      * **Communicatie** — Hoe breng je anderen op de hoogte van dit proces of deze discussie? Wat moeten zij weten?
      * **Administratie** — Hoe breng je informatie over naar een ander systeem, zoals een hulpmiddel voor taakbeheer of communicatie? Waar wordt de informatie bewaard?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5fd6382726e6e5c0:
    english: If there are any blocks around these issues, it can be damaging to leave this realisation until the moment of conclusion. For example, if the participants don’t actually have the power to make a change they have decided, they will feel defeated.Think ahead toward confronting reality when setting up the process, and scope the collaboration accordingly.
    translation: Als er op deze punten belemmeringen zijn, kan het schadelijk zijn om die pas bij de afronding te ontdekken. Als deelnemers bijvoorbeeld niet bevoegd zijn om een besloten verandering door te voeren, kan dat ontmoedigend zijn. Denk daarom al bij het opzetten van het proces na over de uitvoering en bepaal op basis daarvan de reikwijdte van de samenwerking.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c3f96d2ea17ab236:
    english: |-
      * You can @mention the names of people who will take actions out of a decision.
      * Many users accomplish integrating Loomio content into other organizational systems through other channels like reviewing Loomio decisions in regular offline meetings, or transferring outcomes to their task tracking process.
      * Making an explicit decision naturally leads people to ask, “OK, but how are we going to take this forward?”
      * Forming a Loomio group often surfaces important questions like, “Who needs to participate here to turn these decisions into action?” If you're missing key stakeholders, leaders, or administrators, you'll get stuck.
    translation: |-
      * Je kunt de namen @vermelden van mensen die naar aanleiding van een besluit actie ondernemen.
      * Veel gebruikers nemen Loomio-informatie op in andere systemen van hun organisatie. Ze bespreken bijvoorbeeld Loomio-besluiten tijdens vaste vergaderingen of zetten conclusies over naar hun proces voor taakbeheer.
      * Een duidelijk besluit roept vaak de vraag op: ‘Goed, hoe gaan we hiermee verder?’
      * Bij het vormen van een Loomio-groep komen vaak belangrijke vragen naar voren, zoals: ‘Wie moet hierbij betrokken zijn om deze besluiten uit te voeren?’ Als belangrijke belanghebbenden, leidinggevenden of beheerders ontbreken, kan het proces vastlopen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  60bb517775f11e5d:
    english: "## It Ain’t Over Til It’s Over"
    translation: "## Goed afronden"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '079da8800a401a45':
    english: Ending well is important. There’s a ritual to closing a process, and if it’s missed people will feel unsettled. Sometimes the end is determined by running out of time, and sometimes it’s when certain goals are achieved. Recognize implicit and explicit cues indicating if the individuals, and the group as a whole, can feel completion of a process or phase.
    translation: Een proces goed afsluiten is belangrijk. Een duidelijke afsluiting geeft mensen het gevoel dat het proces is afgerond. Soms eindigt het omdat de tijd om is, soms omdat bepaalde doelen zijn bereikt. Let op uitgesproken en onuitgesproken signalen dat deelnemers en de groep als geheel klaar zijn om een proces of fase af te sluiten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  280969e6212842cc:
    english: Participants often look to the leader or facilitator for confirmation of when it’s actually over, and it usually pays to be explicit. Sometimes the signal is a clear statement that the session is wrapping up, a recap of decisions or next steps, and bidding everyone goodbye. Other times groups have established practices like a check-out. Letting a session vaguely trail off will leave a bad taste.
    translation: Deelnemers kijken vaak naar de leider of begeleider voor bevestiging dat het echt voorbij is. Het helpt meestal om daar duidelijk over te zijn. Je kunt aangeven dat de bijeenkomst bijna klaar is, besluiten en vervolgstappen samenvatten en afscheid nemen. Sommige groepen hebben daarvoor een vaste gewoonte, zoals een afsluitende ronde. Als een bijeenkomst zonder duidelijke afsluiting langzaam uitdooft, kan dat onprettig voelen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e15896aadc163225:
    english: |-
      * The clearest indication of conclusion on Loomio is publishing a decision outcome.
      * Some groups use the [lock thread](/en/user_manual/discussions/using_discussions/#lock-or-unlock-a-thread) feature to prevent further changes and reduce clutter.
      * Deactivating a group is the strongest possible “closure” move. No one can say anything else after that.
      * Since Loomio groups can remain while group activity goes up and down, it can be useful to recognize milestones like the conclusion of a particular phase, even if the group will reactivate in the future.
    translation: |-
      * Op Loomio is het publiceren van een conclusie bij een besluit het duidelijkste teken dat het proces is afgerond.
      * Sommige groepen gebruiken de functie [thread vergrendelen](/en/user_manual/discussions/using_discussions/#lock-or-unlock-a-thread) om verdere wijzigingen te voorkomen en de thread overzichtelijk te houden.
      * Een groep deactiveren is de meest definitieve afsluiting. Daarna kan niemand er nog iets plaatsen.
      * Een Loomio-groep kan blijven bestaan terwijl de activiteit toe- en afneemt. Daarom kan het nuttig zijn om mijlpalen te markeren, zoals het einde van een fase, ook als de groep later weer actief wordt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
