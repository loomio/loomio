  1235244007a8559b:
    english: The outcome closes the loop and creates a record that members can return to later. Afterward, ask what worked, adjust the process, and choose the next recurring piece of work to run in Loomio.
    translation: Висновок завершує процес і зберігає рішення, до якого учасники зможуть повернутися пізніше. Після цього запитайте, що вдалося, скоригуйте процес і виберіть наступне регулярне завдання для роботи в Loomio.
    status: machine
