navigation_title: Formatierung
blocks:
  0cff8e965b2d4bd5:
    english: "# Formatting"
    translation: "# Formatierung"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7bda51ac3285357f:
    english: When starting or editing a discussion or poll, or writing a comment, you will see a formatting bar below the text field. Select the arrow at the end of the bar to show or hide the full set of tools.
    translation: Wenn du eine Diskussion oder Abstimmung beginnst oder bearbeitest oder einen Kommentar schreibst, siehst du unter dem Textfeld eine Formatierungsleiste. Wähle den Pfeil am Ende der Leiste, um alle Werkzeuge ein- oder auszublenden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2f2944ad10684b7f:
    english: Hover the mouse or cursor over each item for the name of each tool.
    translation: Bewege den Mauszeiger über ein Symbol, um den Namen des Werkzeugs zu sehen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5f45a085deb9eff1:
    english: Use formatting to add structure and emphasis so information is easier to scan.
    translation: Mit Formatierungen kannst du Inhalte gliedern und hervorheben, damit sie leichter zu überblicken sind.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9b542fd6dda53639:
    english: "## Attach file"
    translation: "## Datei anhängen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d633f08de5eb744d:
    english: Use the paper clip icon, just below the text form, to add file attachments from your computer.
    translation: Klicke auf das Büroklammer-Symbol direkt unter dem Textfeld, um Dateien von deinem Computer anzuhängen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1860ade9942c32a1:
    english: "### Remove attachments"
    translation: "### Anhänge entfernen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ebc91823518309fd:
    english: While editing the context, click the **X** to the right of the file name to remove it.
    translation: Klicke beim Bearbeiten der Beschreibung rechts neben dem Dateinamen auf **X**, um den Anhang zu entfernen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b51c6da343bd6389:
    english: "## Insert image"
    translation: "## Bild einfügen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b788d43f7bc630ec:
    english: Use this tool to insert and display an image.
    translation: Mit diesem Werkzeug kannst du ein Bild einfügen und anzeigen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e23dd94c965ae06c:
    english: Select an image file from your computer. The image is inserted into the editor after it uploads.
    translation: Wähle eine Bilddatei auf deinem Computer aus. Nach dem Hochladen wird das Bild in den Editor eingefügt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f8a47428252034cf:
    english: The image is displayed within the published discussion, poll or comment.
    translation: Das Bild wird in der veröffentlichten Diskussion, Abstimmung oder im Kommentar angezeigt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0fe125855fce8e52:
    english: |-
      >[!Tip]
      >You can also copy/paste an image directly into Loomio.
    translation: |-
      >[!Tip]
      >Du kannst ein Bild auch direkt kopieren und in Loomio einfügen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b631d0ab368ebfb0:
    english: "## Insert link"
    translation: "## Link einfügen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  909769fda18f0ec6:
    english: 'You can add a link to any shareable document or page on the internet.  '
    translation: Du kannst einen Link zu einem freigegebenen Dokument oder einer Webseite hinzufügen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e034be8c0fbe76db:
    english: 'To add a link:'
    translation: 'So fügst du einen Link hinzu:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dcf90e79aba1a2f9:
    english: |-
      1. Select the text you want to link to - say the name of a document.
      2. Click the link icon.
      3. Paste the address into the **Insert link** field and select **Apply**.
    translation: |-
      1. Wähle den Text aus, den du verlinken möchtest, zum Beispiel den Namen eines Dokuments.
      2. Klicke auf das Link-Symbol.
      3. Füge die Adresse in das Feld **Link einfügen** ein und wähle **Anwenden**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  40ecf7d0c79432b2:
    english: For a document hosted elsewhere, check its sharing permissions so discussion participants can open it.
    translation: Wenn das Dokument auf einer anderen Plattform liegt, prüfe seine Freigabeeinstellungen, damit die Teilnehmenden der Diskussion es öffnen können.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3f1824fc07dded13:
    english: A preview of the doc will appear under the text space. You can remove this if you want.
    translation: Unter dem Textfeld erscheint eine Vorschau des Dokuments. Du kannst sie bei Bedarf entfernen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c6061aa7deff27ac:
    english: Now, anyone with access to your Loomio discussion and permission to view the doc can open and read it.
    translation: Alle, die Zugriff auf deine Loomio-Diskussion und die Berechtigung zum Anzeigen des Dokuments haben, können es nun öffnen und lesen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c7643aa641977dea:
    english: "## Insert Emoji"
    translation: "## Emoji einfügen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b4f97f2939fd2d8c:
    english: Select the smiley button and choose an emoji from the picker.
    translation: Wähle die Smiley-Schaltfläche und dann ein Emoji aus.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f207ce88babd4532:
    english: "## Headings"
    translation: "## Überschriften"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e2e647ef2e3ac736:
    english: Heading 1, Heading 2 and Heading 3 can help structure a discussion or comment.
    translation: Mit Überschrift 1, Überschrift 2 und Überschrift 3 kannst du eine Diskussion oder einen Kommentar gliedern.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6c3f52329a8b49b5:
    english: Select the text to mark as a heading and click on the heading format tool.
    translation: Wähle den Text aus, der eine Überschrift werden soll, und klicke auf das Werkzeug für Überschriften.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  27a816f8cd10cd75:
    english: If a heading is used in a comment, the comment will automatically be pinned to the discussion timeline.
    translation: Wenn du in einem Kommentar eine Überschrift verwendest, wird der Kommentar automatisch in der Zeitleiste der Diskussion angeheftet.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8adf1a168d32f042:
    english: "## Bold, Italicize, Strikethrough"
