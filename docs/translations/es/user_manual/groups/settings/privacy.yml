navigation_title: Privacidad
blocks:
  946f29d3bdb2e2af:
    english: "# Group privacy"
    translation: "# Privacidad del grupo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6a2fbb3e7cecad6e:
    english: Privacy controls who can find a group and who can read its content. Open **Edit group settings** from the group page, then select **Privacy**.
    translation: La privacidad determina quién puede encontrar un grupo y leer su contenido. En la página del grupo, abre **Editar la configuración del grupo** y selecciona **Privacidad**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bf79bc420fc36377:
    english: "![Group privacy settings](group_privacy_settings.png#width-90)"
    translation: "![Configuración de privacidad del grupo](group_privacy_settings.png#width-90)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4d275c75fe1a2c77:
    english: Changing privacy can expose or hide existing group content, not only content created afterward. Choose the most restrictive setting that still supports the group's purpose.
    translation: Cambiar la privacidad puede mostrar u ocultar contenido que ya existe en el grupo, no solo el que se cree después. Elige la configuración más restrictiva que permita cumplir el propósito del grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7510b0e8a0fcf7b3:
    english: "## Open"
    translation: "## Abierto"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f202c6fba754adaa:
    english: Open groups are public spaces. Anyone can find the group and read its discussions, polls, and files. The member list remains visible only to members.
    translation: Los grupos abiertos son espacios públicos. Cualquier persona puede encontrar el grupo y leer sus discusiones, encuestas y archivos. Solo los miembros pueden ver la lista de miembros.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c8d2b41a601ed65e:
    english: Open groups can allow people to join immediately, require approval, or remain invitation only.
    translation: Los grupos abiertos pueden permitir que las personas se unan de inmediato, exigir aprobación o admitir miembros solo por invitación.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f07a1c59f30e5fea:
    english: "### Follow an Open group"
    translation: "### Seguir un grupo abierto"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d6f9ee2eb742720e:
    english: People can stay up to date with an Open group without joining. Following adds unread group activity to their catch-up email so they can review it in their own time. Followers do not become members, receive member voting rights, or receive immediate notifications just because they follow the group.
    translation: Las personas pueden seguir la actividad de un grupo abierto sin unirse. Al seguirlo, la actividad no leída del grupo se incluye en su correo de resumen para que puedan revisarla cuando quieran. Seguir un grupo no las convierte en miembros, no les da derecho a votar como miembros ni hace que reciban notificaciones inmediatas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  17cb84d9141c9728:
    english: Turn on **Follow updates** on the group page to include its unread discussions, comments, polls, and other thread activity in your catch-up. Turn the setting off to stop including the group.
    translation: Activa **Sigue las actualizaciones** en la página del grupo para incluir sus discusiones, comentarios, encuestas y otras actividades no leídas de los hilos en tu correo de resumen. Desactiva la opción para dejar de incluir el grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b0c06651e8c0df2b:
    english: "![Follow updates on an Open group](group_follow_updates.png)"
    translation: "![Sigue las actualizaciones en un grupo abierto](group_follow_updates.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c5becc4d01b10f3:
    english: "## Closed"
    translation: "## Cerrado"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eaf6878c89438b53:
    english: Anyone can find a Closed group and read its name and description. Discussions, polls, files, and the member list are private to members and invited guests.
    translation: Cualquier persona puede encontrar un grupo cerrado y leer su nombre y descripción. Solo los miembros y los invitados pueden acceder a sus discusiones, encuestas, archivos y lista de miembros.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ab7851d3b88d4e27:
    english: Closed groups can let people request membership or remain invitation only. They cannot let people join immediately without approval.
    translation: Los grupos cerrados pueden permitir que las personas soliciten unirse o admitir miembros solo por invitación. No pueden permitir que alguien se una de inmediato sin aprobación.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e2f094fc6e490216:
    english: A Closed subgroup of a parent group can optionally allow members of the parent group to read its discussions without joining the subgroup.
    translation: Un subgrupo cerrado puede permitir que los miembros del grupo principal lean sus discusiones sin unirse al subgrupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9c21e144af9492a6:
    english: "## Secret"
    translation: "## Secreto"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6a9871bdd7fde747:
    english: Secret groups and their content are visible only to people who have been invited or added. Membership is invitation only. Secret groups do not appear in the public group directory.
    translation: Solo las personas invitadas o añadidas pueden ver los grupos secretos y su contenido. Solo se puede acceder a ellos por invitación. Los grupos secretos no aparecen en el directorio público de grupos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  405ac2846a65b06c:
    english: "## How people join"
    translation: "## Cómo se unen las personas"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c7aebb687bbffbf:
    english: 'Privacy determines which joining options are available:'
    translation: 'La privacidad determina qué opciones hay para unirse:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a6a7608fe4510b67:
    english: |-
      | Group privacy | Available joining options |
      | --- | --- |
      | **Open** | Anyone can join, request approval, or invitation only |
      | **Closed** | Request approval or invitation only |
      | **Secret** | Invitation only |
    translation: |-
      | Privacidad del grupo | Opciones disponibles para unirse |
      | --- | --- |
      | **Abierto** | Cualquiera puede unirse, solicitar aprobación o unirse solo por invitación |
      | **Cerrado** | Solicitar aprobación o unirse solo por invitación |
      | **Secreto ** | Solo por invitación |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  473a620db15dff75:
    english: When approval is required, people select **Join group**, answer the group's joining prompt, and send a request to join. See [Inviting people](/en/user_manual/groups/inviting_people#request-to-join-group) for instructions on configuring the prompt, reviewing requests, and inviting people directly.
    translation: Cuando se requiere aprobación, las personas seleccionan **Unirse al grupo**, responden a la pregunta para unirse y envían una solicitud. Consulta [Invitar a personas](/en/user_manual/groups/inviting_people#request-to-join-group) para saber cómo configurar la pregunta, revisar las solicitudes e invitar a personas directamente.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4c02de0d4580f7e6:
    english: "## Group directory"
    translation: "## Directorio de grupos"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2dc848ec1af0064e:
    english: Open and Closed parent groups can be listed in the public group directory so people can discover them. Directory listing does not change who can read group content or become a member. Subgroups and Secret groups cannot be listed.
    translation: Los grupos principales abiertos y cerrados pueden aparecer en el directorio público de grupos para que las personas los encuentren. Aparecer en el directorio no cambia quién puede leer el contenido del grupo ni quién puede unirse. Los subgrupos y los grupos secretos no pueden aparecer allí.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
