navigation_title: Score
blocks:
  c719d051fa2f700e:
    english: "# Score"
    translation: "# Score"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  517adc384b38d256:
    english: Score measures how participants evaluate each option on a shared numeric scale. Unlike Choose, it asks people to respond to every option, so the results show both what people prefer and how strongly they prefer it.
    translation: Met Score beoordelen deelnemers elke optie op dezelfde numerieke schaal. Anders dan bij Choose geven ze elke optie een score. De resultaten laten zien welke opties mensen verkiezen en hoe sterk hun voorkeur is.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a678333f6d814e87:
    english: "## When to use Score"
    translation: "## Wanneer gebruik je Score"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c4ca19abb53e3ddc:
    english: 'Use Score when every option can be evaluated independently against the same question. It works well for:'
    translation: 'Gebruik Score wanneer je elke optie afzonderlijk kunt beoordelen aan de hand van dezelfde vraag. Score is geschikt voor:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c77c1ad6b2a9d697:
    english: |-
      - assessing how ready each part of a project is;
      - rating the importance of several principles;
      - measuring interest in possible meeting topics;
      - evaluating grant applications against a common criterion; or
      - comparing the suitability of several proposals.
    translation: |-
      - beoordelen hoe ver elk onderdeel van een project is;
      - de belangrijkheid van verschillende principes beoordelen;
      - de belangstelling voor mogelijke gespreksonderwerpen meten;
      - subsidieaanvragen aan de hand van hetzelfde criterium beoordelen; of
      - vergelijken hoe geschikt verschillende voorstellen zijn.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d91459d96a31a671:
    english: Define what the bottom and top of the scale mean. A number without a shared definition can mean different things to different voters. Use [Choose](/en/user_manual/polls/choose/) when you only need selections, or [Allocate](/en/user_manual/polls/allocate/) when participants must make trade-offs within a limited budget.
    translation: Leg uit wat de onderkant en bovenkant van de schaal betekenen. Zonder gedeelde betekenis kan hetzelfde cijfer voor verschillende stemmers iets anders betekenen. Gebruik [Choose](/en/user_manual/polls/choose/) als je alleen wilt weten welke opties mensen kiezen, of [Allocate](/en/user_manual/polls/allocate/) als deelnemers keuzes moeten maken binnen een beperkt budget.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6160518dc06b70a7:
    english: "## Example: score possible trial locations"
    translation: "## Voorbeeld: mogelijke proeflocaties beoordelen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a75c387743cad529:
    english: Oatmilk Cooperative is choosing locations for a returnable-bottle trial. It asks members to score four locations from 0 (**unsuitable**) to 10 (**ideal**), considering customer access, staff capacity, storage, and collection transport.
    translation: Oatmilk Cooperative kiest locaties voor een proef met herbruikbare flessen. De coöperatie vraagt leden om vier locaties een score van 0 (**ongeschikt**) tot 10 (**ideaal**) te geven. Daarbij letten ze op de bereikbaarheid voor klanten, de capaciteit van het personeel, opslagruimte en het vervoer van ingezamelde flessen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c74ebb16f872b3c6:
    english: "## Set up the poll"
    translation: "## Stel de peiling in"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b03122ee279f9c91:
    english: State one question that applies equally to every option. Add the items to be assessed, set the **Minimum score** and **Maximum score**, and explain the endpoints in the details. Option meanings can clarify the scope of each item.
    translation: Stel één vraag die voor elke optie geldt. Voeg toe wat je wilt beoordelen, stel de **Minimum score** en **Maximum score** in en leg in de beschrijving uit wat de uiteinden van de schaal betekenen. Met een toelichting bij elke optie kun je verduidelijken wat er precies wordt beoordeeld.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  85e66520acf78264:
    english: Choose a scale participants can apply consistently. A 0–5 scale is quick to use; a 0–10 scale allows finer distinctions. More precision does not necessarily produce better information, so use the shortest scale that fits the question.
    translation: Kies een schaal die deelnemers consequent kunnen toepassen. Een schaal van 0–5 is snel te gebruiken; met een schaal van 0–10 kun je kleinere verschillen aangeven. Meer precisie levert niet altijd betere informatie op. Kies daarom de kortste schaal die bij de vraag past.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bb3998655598796f:
    english: Anonymous voting and showing options in random order can be useful when you want to reduce social or ordering effects.
    translation: Anoniem stemmen en de opties in willekeurige volgorde tonen kan helpen om sociale invloed en de invloed van de volgorde te beperken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Stem"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  33199814c9ad8a64:
    english: Participants move a slider to score every option. In this example, the voter scores Central Station cafe at 8, Riverside market at 6, the University food court at 7, and Harbour offices at 5.
    translation: Deelnemers geven elke optie een score met een schuifregelaar. In dit voorbeeld geeft de stemmer het café bij het Centraal Station een 8, de markt aan de rivier een 6, de foodcourt van de universiteit een 7 en de kantoren aan de haven een 5.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fba3d21a09846414:
    english: The reason explains how the voter applied the scale. This helps the group distinguish a low score caused by missing information from one caused by substantive concern.
    translation: In de toelichting legt de stemmer uit hoe die de schaal heeft toegepast. Zo kan de groep zien of een lage score komt door ontbrekende informatie of door inhoudelijke bezwaren.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Bekijk de resultaten"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  846b7759f9d54232:
    english: 'For each option, the results show:'
    translation: 'Voor elke optie tonen de resultaten:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cac30fa54f0aeaf7:
    english: |-
      - **Points**: the sum of all scores;
      - **Mean**: the average score; and
      - **Voters**: how many people scored the option.
    translation: |-
      - **Punten**: de som van alle scores;
      - **Gemeen**: de gemiddelde score; en
      - **Stemmers**: het aantal mensen dat de optie een score heeft gegeven.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7e063d4b1babcb9e:
    english: In this example, **Central Station cafe** has the highest mean at 7.5. **Harbour offices** has the lowest mean at 5.25, while Riverside market and the University food court are tied at 7. Four of five invited people have voted, so the group can also see that one response is outstanding.
    translation: In dit voorbeeld heeft **het café bij het Centraal Station** met 7,5 de hoogste gemiddelde score. **De kantoren aan de haven** hebben met 5,25 de laagste gemiddelde score. De markt aan de rivier en de foodcourt van de universiteit staan allebei op 7. Vier van de vijf uitgenodigde mensen hebben gestemd. De groep kan dus ook zien dat er nog één stem ontbreekt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  147800d3643d9942:
    english: Compare means only when the options have a similar number of voters. Read the vote reasons before treating a small difference as meaningful, and publish an outcome explaining what action follows from the scores.
    translation: Vergelijk gemiddelde scores alleen als ongeveer evenveel mensen de opties hebben beoordeeld. Lees de toelichtingen bij de stemmen voordat je een klein verschil betekenis geeft. Publiceer daarna een uitkomst waarin je uitlegt welke actie op basis van de scores volgt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
