  d370759001be4e21:
    english: Polls collect selections, scores, allocations, rankings, availability, or election ballots. Choose the voting method based on what participants need to express and how you intend to use the result. Use a [Proposal](/en/user_manual/polls/proposals/) when people need to respond to a statement or course of action.
    translation: Mit Umfragen kannst du Optionen auswählen, bewerten, Punkte verteilen, Rangfolgen festlegen, Verfügbarkeiten angeben oder an Wahlen teilnehmen. Wähle die Abstimmungsmethode danach aus, was die Teilnehmenden ausdrücken sollen und wie du das Ergebnis nutzen möchtest. Verwende einen [Vorschlag](/en/user_manual/polls/proposals/), wenn Personen zu einer Aussage oder einem Vorgehen Stellung nehmen sollen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1132ff680c7b2562:
    english: "## Simple poll"
    translation: "## Einfache Umfrage"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6b957bf5630c1470:
    english: "[Choose](/en/user_manual/polls/choose/) lets participants select one or more options. Use it to find the most popular option or make a shortlist."
    translation: Bei [Wählen](/en/user_manual/polls/choose/) können Teilnehmende eine oder mehrere Optionen auswählen. Damit kannst du die beliebteste Option finden oder eine engere Auswahl erstellen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c982974685e1b5d6:
    english: "## Score poll"
    translation: "## Bewertung"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fbbfe14196388606:
    english: "[Score](/en/user_manual/polls/score/) lets participants rate every option on the same scale. Use it to compare the strength of support, readiness, suitability, or importance across options."
    translation: Bei [Punktzahl](/en/user_manual/polls/score/) bewerten Teilnehmende jede Option auf derselben Skala. Damit kannst du vergleichen, wie stark die Unterstützung ist oder wie bereit, geeignet oder wichtig die einzelnen Optionen sind.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0465fcb48a56ca78:
    english: "## Dot vote"
    translation: "## Punktevergabe"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ffb7d1711a5fca3b:
    english: "[Allocate](/en/user_manual/polls/allocate/) gives each participant a fixed budget of points to distribute. Use it to identify priorities when choosing one thing means giving less attention or resources to another."
    translation: Bei [Zuweisen](/en/user_manual/polls/allocate/) erhalten alle Teilnehmenden eine feste Anzahl von Punkten, die sie verteilen können. Damit kannst du Prioritäten erkennen, wenn mehr Aufmerksamkeit oder Ressourcen für eine Option weniger für eine andere bedeuten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a1b15c28fbe526f6:
    english: "## Ranked choice"
    translation: "## Rangfolge"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8811f455b7ab3821:
    english: "[Rank](/en/user_manual/polls/rank/) lets participants arrange options in order of preference. Use it to find the group's overall preferred order or select one leading option."
    translation: Bei [Rang](/en/user_manual/polls/rank/) ordnen Teilnehmende die Optionen nach ihren Präferenzen. Damit kannst du die bevorzugte Reihenfolge der Gruppe ermitteln oder die Option mit der größten Unterstützung auswählen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2e21bb1b54b6fcf9:
    english: "## Time poll"
    translation: "## Zeitumfrage"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb768f07eb0d1971:
    english: "[Time poll](/en/user_manual/polls/meeting_polls/) lets participants indicate when they are available. Use it to schedule a meeting or event across time zones."
    translation: Bei einer [Zeitumfrage](/en/user_manual/polls/meeting_polls/) geben Teilnehmende an, wann sie verfügbar sind. Damit kannst du ein Treffen oder eine Veranstaltung auch über Zeitzonen hinweg planen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
