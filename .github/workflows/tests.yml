name: tests

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      e2e_args:
        description: 'Arguments for playwright test, such as a spec name or -g "test title" (leave empty for the full suite)'
        required: false
        type: string

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      PGDATABASE: loomio_test
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      RAILS_ENV: test
      E2E_PORT: 3001
      CI: 1
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v5
    - name: install libvips
      run: |
        sudo apt-get update
        sudo apt-get install -y libvips
    - name: git checkout
      uses: actions/checkout@v5
    - name: install ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '.ruby-version'
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically
    - name: install node.js
      uses: actions/setup-node@v6
      with:
        node-version-file: .node-version
    - name: install npm
      run: npm install --global "npm@$(cat .npm-version)" --no-audit --no-fund
    - name: check Node.js toolchain configuration
      run: test/scripts/node_toolchain_test
    - name: create db
      run: |
        createdb
        cp config/database.yml.postgresql config/database.yml
        bundle exec rake db:setup
    - name: generate client contracts
      # A separate database keeps test fixtures out of the E2E database.
      env:
        TEST_DATABASE_URL: postgresql://postgres@localhost/loomio_contracts
      run: |
        bundle exec rake db:create db:schema:load
        bundle exec rails test test/contracts
    - name: start rails server
      env:
        PUMA_WORKERS: 1
        MIN_THREADS: 3
        MAX_THREADS: 3
      run: |
        CANONICAL_PORT="$E2E_PORT" bundle exec rails server -b 0.0.0.0 -p "$E2E_PORT" &
    - name: build client
      run: |
        cd vue
        npm ci
        npm run test:unit
        npm run test:component
        npm run build
    - name: collaboration server provider compatibility
      run: node --test test/lib/collab_server/provider_compat.test.mjs
    - name: install playwright browser
      working-directory: vue
      run: npx playwright install --with-deps chromium
    - name: run e2es
      working-directory: vue
      env:
        PW_ARGS: ${{ inputs.e2e_args }}
      run: |
        eval "set -- $PW_ARGS"
        npx playwright test "$@"
    - name: upload playwright report
      uses: actions/upload-artifact@v4
      if: ${{ failure() }}
      with:
        name: playwright-report
        path: |
          vue/tests/playwright/report
          vue/tests/playwright/results
    - name: upload rails test log
      uses: actions/upload-artifact@v4
      if: ${{ failure() }}
      with:
        name: e2e-rails-test-log
        path: log/test.log
