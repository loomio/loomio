    translated_on: '2026-09-29'
  bea1dad1b0b47107:
    english: Use tasks in threads and comments to name an action, assign it to someone, set a due date, and track whether it is complete.
    translation: משימות בשיחות ובתגובות מאפשרות לתאר פעולה, להקצות אותה לאדם, לקבוע תאריך יעד ולעקוב אחר השלמתה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2398b3493bad759e:
    english: "## Add a task"
    translation: "## הוספת משימה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c240866e019fab51:
    english: While writing a thread or comment, expand the formatting toolbar and click **Task list**. Type the action beside the checkbox.
    translation: בעת כתיבת שיחה או תגובה, יש להרחיב את סרגל כלי העיצוב ולבחור **רשימת מטלות**. יש לכתוב את הפעולה לצד תיבת הסימון.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f7d4f63b321e9af1:
    english: "## Name and assign the task to a person"
    translation: "## מתן שם למשימה והקצאתה לאדם"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5ea902e45aaf1f7a:
    english: Use an @mention in the task to assign it to a group member. An **Add due date** button appears once the task has an assignee.
    translation: כדי להקצות משימה לחבר או לחברת קבוצה, יש להוסיף למשימה אזכור באמצעות @. לאחר ההקצאה יופיע הכפתור **הוסף תאריך יעד**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1134aedee6cafd8c:
    english: Tasks assigned to you appear on your **Tasks** page. Open **Tasks** from the sidebar to see them grouped by thread or poll.
    translation: משימות שהוקצו לך מופיעות בדף **משימות**. ניתן לפתוח את **משימות** מסרגל הצד ולראות אותן מקובצות לפי שיחה או מִשׁאָל.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5eae519b81c94f7a:
    english: "## Set a reminder"
    translation: "## הגדרת תזכורת"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  561597d43d716888:
    english: Click **Add due date** to choose a due date and when Loomio should email the assignee a reminder. You can also remove an existing due date from this dialog.
    translation: יש לבחור **הוסף תאריך יעד** כדי לקבוע תאריך יעד ומועד לשליחת תזכורת בדוא״ל לאדם שהמשימה הוקצתה לו. ניתן גם להסיר תאריך יעד קיים בחלונית זו.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bd36c23f297b0429:
    english: "## Mark it as done"
    translation: "## סימון המשימה כבוצעה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  59b6138f35694902:
    english: Click the checkbox beside a task to mark it as done. You can do this while editing the text, while reading it if you are the assignee, or from the **Tasks** page. Click it again to reopen the task.
    translation: יש לבחור בתיבת הסימון שלצד משימה כדי לסמן אותה כבוצעה. ניתן לעשות זאת בזמן עריכת הטקסט, בזמן הקריאה אם המשימה הוקצתה לך, או בדף **משימות**. בחירה נוספת בתיבת הסימון תפתח מחדש את המשימה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
