  a29c1c76443ad97f:
    english: Good governance is more than a board meeting, it requires good communication before and after meetings.
    translation: A boa governança vai além das reuniões do conselho. Ela exige boa comunicação antes e depois de cada reunião.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9f05171a74ac30d0:
    english: |-
      This guide is intended to help you use Loomio in your board or committee, so you can stay connected between meetings, deal with urgent matters and reduce board admin.
      - Continue governance between meetings
      - Keep track of communications
      - Use board meetings for issues that matter
      - Preserve institutional memory with a detailed record
    translation: |-
      Este guia ajuda você a usar o Loomio no seu conselho ou comitê para manter o contato entre reuniões, tratar assuntos urgentes e reduzir o trabalho administrativo.
      - Dê continuidade à governança entre as reuniões
      - Acompanhe as comunicações
      - Use as reuniões do conselho para tratar de assuntos importantes
      - Preserve a memória institucional com um registro detalhado
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bce24543243c913b:
    english: 'Loomio is a versatile discussion and decision-making tool for collaborative boards and committees. '
    translation: O Loomio é uma ferramenta versátil de discussão e tomada de decisões para conselhos e comitês que trabalham de forma colaborativa.
