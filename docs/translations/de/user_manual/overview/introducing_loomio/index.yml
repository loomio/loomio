---
navigation_title: Loomio in deiner Gruppe einführen
blocks:
  6c777a62b2b77732:
    english: "# Introducing Loomio to your group"
    translation: "# Loomio in deiner Gruppe einführen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  438cc622ae730bd8:
    english: Introduce Loomio through one useful piece of work. Prepare the group before inviting people, help everyone participate once, and complete the process through to an outcome.
    translation: Führe Loomio mit einer konkreten Aufgabe ein. Bereite die Gruppe vor, bevor du Menschen einlädst. Hilf allen, sich einmal zu beteiligen, und führe den Prozess bis zu einem Fazit.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9c9fa4e8f6e208e4:
    english: "## Choose one useful starting point"
    translation: "## Wähle einen sinnvollen Einstieg"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3353fb04e83837e5:
    english: Start with a real process that your group already needs. A good first use is small enough to complete soon, but relevant enough that people have a reason to participate.
    translation: Beginne mit einem echten Vorgang, den deine Gruppe ohnehin bearbeiten muss. Für den Anfang eignet sich eine Aufgabe, die ihr bald abschließen könnt und die für die Beteiligten relevant ist.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  652744a2ab28954b:
    english: 'For example:'
    translation: 'Zum Beispiel:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  19bc6c09eeea816e:
    english: |-
      - prepare the agenda for an upcoming meeting;
      - review and approve meeting minutes;
      - gather feedback on a draft document;
      - decide a small operational question; or
      - identify priorities for the next month.
    translation: |-
      - die Tagesordnung für ein bevorstehendes Treffen vorbereiten;
      - ein Sitzungsprotokoll prüfen und genehmigen;
      - Rückmeldungen zu einem Dokumententwurf sammeln;
      - eine kleine organisatorische Frage entscheiden; oder
      - Prioritäten für den nächsten Monat festlegen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  68a0d6b76f36ebaf:
    english: Avoid moving every discussion and decision into Loomio at once. A repeatable process gives the group a clear reason to return and lets you improve the way you run it each time.
    translation: Verlagere nicht alle Diskussionen und Entscheidungen auf einmal nach Loomio. Ein wiederkehrender Vorgang gibt der Gruppe einen klaren Grund, zurückzukehren. Zugleich könnt ihr den Ablauf jedes Mal verbessern.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4b65243ef120921b:
    english: "## Prepare the group before inviting people"
    translation: "## Bereite die Gruppe vor, bevor du Menschen einlädst"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  305b29c1c832c246:
    english: 'Give people a useful and recognizable place to arrive in:'
    translation: 'Richte einen nützlichen und wiedererkennbaren Ort für die Eingeladenen ein:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  76d859d168805706:
    english: |-
      - add the group's name, logo, cover image, purpose, and important links;
      - check the group's privacy and permissions;
      - add any [category tags](/en/user_manual/discussions/tags) the group will use regularly;
      - create the first real discussion, with the background information people need; and
      - create a practice discussion if members would benefit from trying comments, reactions, and voting without consequences.
    translation: |-
      - füge den Namen, das Logo, das Titelbild, den Zweck und wichtige Links der Gruppe hinzu;
      - prüfe die Privatsphäre und Berechtigungen der Gruppe;
      - füge [Kategorie-Tags](/en/user_manual/discussions/tags) hinzu, die die Gruppe regelmäßig verwenden wird;
      - erstelle die erste echte Diskussion mit den nötigen Hintergrundinformationen; und
      - erstelle eine Übungsdiskussion, wenn Mitglieder Kommentare, Reaktionen und Abstimmungen unverbindlich ausprobieren möchten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f1decb57ec9d48cb:
    english: Use your own photo in your profile and the organization's logo for the group. This helps people recognize who invited them and which organization an email is about.
    translation: Verwende ein Foto von dir in deinem Profil und das Logo der Organisation für die Gruppe. So erkennen die Eingeladenen, wer sie eingeladen hat und zu welcher Organisation eine E-Mail gehört.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '01965093f234bb36':
    english: "## Decide where work belongs"
    translation: "## Entscheide, welche Arbeit wohin gehört"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7fbd0d770cbed2bd:
    english: 'Loomio can sit alongside tools your group already uses:'
    translation: 'Loomio kann die Werkzeuge ergänzen, die deine Gruppe bereits verwendet:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '0168271b154f6931':
    english: |-
      | Use | Good place for it |
      |---|---|
      | Quick questions, social conversation, and timely updates | Chat, such as Slack, Teams, Matrix, or Discord |
      | Collaborative editing of a living document | A shared document tool |
      | Assigning work and tracking its completion | A task or project-management tool |
      | A focused discussion, broad participation, a decision, and its lasting record | Loomio |
    translation: |-
      | Verwendung | Geeigneter Ort |
      |---|---|
      | Kurze Fragen, lockere Gespräche und aktuelle Meldungen | Chat, zum Beispiel Slack, Teams, Matrix oder Discord |
      | Gemeinsames Bearbeiten eines laufend aktualisierten Dokuments | Ein Werkzeug für gemeinsam bearbeitete Dokumente |
      | Aufgaben verteilen und ihre Erledigung verfolgen | Ein Werkzeug für Aufgaben oder Projektmanagement |
      | Eine gezielte Diskussion, breite Beteiligung, eine Entscheidung und deren dauerhafte Dokumentation | Loomio |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  50fae2027411e538:
    english: Link to documents and other systems from the group description or discussion context. Use [chat integrations](/en/user_manual/integrations/chatbots) to bring important Loomio activity into a channel people already follow.
    translation: Verlinke Dokumente und andere Systeme in der Gruppenbeschreibung oder im Kontext einer Diskussion. Mit [Chat-Integrationen](/en/user_manual/integrations/chatbots) kannst du wichtige Aktivitäten aus Loomio in einen Kanal bringen, den die Beteiligten bereits verfolgen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ed67af54bdf1c775:
    english: Tell members what you expect to happen in Loomio. A simple boundary such as “important discussions and decisions go in Loomio; quick coordination stays in chat” is easier to adopt than an unexplained new tool.
    translation: Erkläre den Mitgliedern, wofür ihr Loomio nutzen wollt. Eine einfache Regel wie „Wichtige Diskussionen und Entscheidungen gehören in Loomio; kurze Absprachen bleiben im Chat“ lässt sich leichter umsetzen als die Einführung eines neuen Werkzeugs ohne Erklärung.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0a799d7911a46f6f:
    english: "## Decide how your group decides"
    translation: "## Entscheide, wie deine Gruppe Entscheidungen trifft"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e1c64de2dc68593:
    english: Loomio does not require every group, or every decision, to use the same process. Some groups arrive with established rules. Others use Loomio while they develop a clearer decision-making practice together.
    translation: In Loomio müssen nicht alle Gruppen oder Entscheidungen demselben Ablauf folgen. Manche Gruppen haben bereits feste Regeln. Andere nutzen Loomio, während sie gemeinsam eine klarere Entscheidungspraxis entwickeln.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6d0c0f50959ab9d6:
    english: "### If your process is already established"
    translation: "### Wenn euer Verfahren bereits feststeht"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5fbfe86e935d5a8c:
    english: 'Translate the group''s existing requirements into Loomio. Before running a formal decision, make sure participants can tell:'
    translation: 'Übertrage die bestehenden Anforderungen deiner Gruppe auf Loomio. Bevor ihr eine formelle Entscheidung trefft, sollten die Beteiligten wissen:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9a1b89bd4c5fe02c:
    english: |-
      - which kinds of decisions can be made in Loomio;
      - who provides input and who has authority to decide;
      - who is eligible to vote;
      - whether a [quorum](/en/user_manual/polls/quorum) is required;
      - whether the decision requires a majority, supermajority, unanimous agreement, consent, or another [vote share requirement](/en/user_manual/polls/vote_share_requirements);
      - whether the decision takes effect when its outcome is published or must be ratified elsewhere; and
      - who will record and carry out the outcome.
    translation: |-
      - welche Arten von Entscheidungen in Loomio getroffen werden können;
      - wer Beiträge liefert und wer entscheiden darf;
      - wer stimmberechtigt ist;
      - ob ein [Quorum](/en/user_manual/polls/quorum) erforderlich ist;
      - ob die Entscheidung eine einfache Mehrheit, eine qualifizierte Mehrheit, Einstimmigkeit, Konsent oder einen anderen [erforderlichen Stimmenanteil](/en/user_manual/polls/vote_share_requirements) braucht;
      - ob die Entscheidung mit der Veröffentlichung des Fazits wirksam wird oder andernorts bestätigt werden muss; und
      - wer das Fazit dokumentiert und die Entscheidung umsetzt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4b48b6e0aff5cfc0:
    english: If your constitution, bylaws, policy, or local law governs electronic decisions, make sure the Loomio process follows those requirements. Configure [delegated voters](/en/user_manual/groups/delegated_voters), proposal settings, and [poll templates](/en/user_manual/polls/poll_templates) to make the agreed process easy to repeat.
    translation: Wenn eure Satzung, Geschäftsordnung, Richtlinien oder geltendes Recht elektronische Entscheidungen regeln, stelle sicher, dass euer Verfahren in Loomio diese Vorgaben erfüllt. Konfiguriere [delegierte Stimmberechtigte](/en/user_manual/groups/delegated_voters), Vorschlagseinstellungen und [Abstimmungsvorlagen](/en/user_manual/polls/poll_templates), damit ihr den vereinbarten Ablauf leicht wiederholen könnt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b068624ed6c7c6b3:
    english: "### If your group is still deciding"
    translation: "### Wenn deine Gruppe das Verfahren noch festlegt"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  14449de544d28a6b:
    english: 'Start a discussion about how decisions should be made. Instead of beginning with a voting tool, ask the group to consider:'
    translation: 'Starte eine Diskussion darüber, wie ihr Entscheidungen treffen wollt. Bevor ihr ein Abstimmungswerkzeug auswählt, bitte die Gruppe, folgende Fragen zu besprechen:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f65b39a74ae25ed7:
    english: |-
      - What kinds of decisions do we make?
      - Who is affected, who should be consulted, and who is responsible for deciding?
      - Which decisions need advice, consent, consensus, a vote, or delegated authority?
      - What level of participation or support makes a decision valid?
      - How will we respond to objections, tied results, or insufficient participation?
      - How will we communicate, record, review, and change a decision?
    translation: |-
      - Welche Arten von Entscheidungen treffen wir?
      - Wen betreffen sie, wer sollte angehört werden und wer ist für die Entscheidung verantwortlich?
      - Für welche Entscheidungen brauchen wir Beratung, Konsent, Konsens, eine Abstimmung oder eine übertragene Entscheidungsbefugnis?
      - Wie viel Beteiligung oder Zustimmung ist nötig, damit eine Entscheidung gültig ist?
      - Wie gehen wir mit Einwänden, Stimmengleichheit oder zu geringer Beteiligung um?
      - Wie teilen wir eine Entscheidung mit, dokumentieren und überprüfen sie und ändern sie bei Bedarf?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ce7c0af2ad170b5c:
    english: The answers may be different for an operational decision, a policy, an election, and a constitutional change. See [Making decisions](/en/guides/making_decisions) to compare several complete processes.
    translation: Für eine organisatorische Entscheidung, eine Richtlinie, eine Wahl und eine Satzungsänderung können die Antworten unterschiedlich ausfallen. Unter [Entscheidungen treffen](/en/guides/making_decisions) kannst du mehrere vollständige Verfahren vergleichen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  aac26fc96b90744d:
    english: If the group is not ready to settle every rule, agree on a provisional process for one low-risk decision. State what the result will mean before asking people to participate, publish an outcome, then review how the process worked. Record what the group learns in its description, governance documents, or reusable templates.
    translation: Wenn die Gruppe noch nicht alle Regeln festlegen möchte, einigt euch für eine Entscheidung mit geringem Risiko auf ein vorläufiges Verfahren. Erkläre vor der Beteiligung, was das Ergebnis bedeuten wird. Veröffentliche anschließend ein Fazit und besprecht, wie das Verfahren funktioniert hat. Haltet eure Erkenntnisse in der Gruppenbeschreibung, in Dokumenten zur Arbeitsweise der Gruppe oder in wiederverwendbaren Vorlagen fest.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  23ed8fb3e887afbc:
    english: "## Invite people"
    translation: "## Lade Menschen ein"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a5d369ad9df691fe:
    english: "[Invite people](/en/user_manual/groups/inviting_people) with a short personal message that explains:"
    translation: "[Lade Menschen ein](/en/user_manual/groups/inviting_people) und erkläre ihnen in einer kurzen persönlichen Nachricht:"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3383207ff2fcc99b:
    english: |-
      - why the group is using Loomio;
      - what you are asking them to do first;
      - when you need their response; and
      - where they can get help.
    translation: |-
      - warum die Gruppe Loomio verwendet;
      - was sie zuerst tun sollen;
      - bis wann du ihre Antwort brauchst; und
      - wo sie Hilfe bekommen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  282ef8673815823e:
    english: You can begin with a small group of people who will actively test the process, or invite the whole group when everyone needs to participate from the start. In either case, have a discussion ready for them rather than inviting people into an empty group.
    translation: Du kannst mit einer kleinen Gruppe beginnen, die den Ablauf aktiv testet. Wenn von Anfang an alle mitmachen sollen, lade die ganze Gruppe ein. Halte in beiden Fällen eine Diskussion bereit, damit die Eingeladenen keine leere Gruppe vorfinden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cd6511a78ce7c9b7:
    english: "## Help everyone participate once"
    translation: "## Hilf allen, sich einmal zu beteiligen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a37273687b4f4b0:
    english: The first objective is for each person to cross the threshold from receiving an invitation to contributing something.
    translation: Das erste Ziel ist, dass jede eingeladene Person selbst etwas beiträgt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ce285f27cca389c4:
    english: 'Ask people to:'
    translation: 'Bitte die Eingeladenen:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d0b9e80af995edff:
    english: |-
      1. sign in and add a profile photo;
      2. open the welcome or practice discussion;
      3. post a short comment or reaction; and
      4. vote in a low-stakes proposal and, if useful, leave a reason.
    translation: |-
      1. sich anzumelden und ein Profilfoto hinzuzufügen;
      2. die Begrüßungs- oder Übungsdiskussion zu öffnen;
      3. einen kurzen Kommentar oder eine Reaktion zu hinterlassen; und
      4. über einen Vorschlag mit geringen Auswirkungen abzustimmen und bei Bedarf eine Begründung anzugeben.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  919e32e7adb7c4c8:
    english: Members do not need to create a password. They can [sign in by email](/en/user_manual/users/signing_in), and they can reply to eligible discussion emails without first navigating back to the thread.
    translation: Mitglieder müssen kein Passwort erstellen. Sie können sich [per E-Mail anmelden](/en/user_manual/users/signing_in) und auf geeignete Diskussions-E-Mails antworten, ohne dafür zur Diskussion zurückzukehren.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  22ceb7104d416acf:
    english: "## Use notifications deliberately"
    translation: "## Setze Benachrichtigungen gezielt ein"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dd99e6dd5c93d9ee:
    english: Access to content and notification about it are separate. Group members can find discussions in their group even when they were not notified immediately.
    translation: Der Zugriff auf Inhalte und die Benachrichtigung darüber sind getrennt. Gruppenmitglieder können Diskussionen in ihrer Gruppe finden, auch wenn sie nicht sofort benachrichtigt wurden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0e20732d957eb282:
    english: When starting a discussion, notify the people whose input is needed at that stage. Use @mentions and replies when asking particular people to respond. When voting opens later, invite the eligible voters.
    translation: Benachrichtige beim Start einer Diskussion die Menschen, deren Beiträge in dieser Phase gebraucht werden. Verwende @Erwähnungen und Antworten, wenn du bestimmte Personen um eine Rückmeldung bittest. Wenn die Abstimmung später beginnt, lade die Stimmberechtigten ein.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  43339ff0f3d30a50:
    english: If you create a discussion and poll together only to capture a vote, avoid sending a discussion invitation immediately followed by a poll invitation. Either start the discussion without notifying people and invite them through the poll, or run a [standalone poll](/en/user_manual/polls/intro_to_decisions#without-a-discussion).
    translation: Wenn du eine Diskussion und eine Abstimmung nur erstellst, um Stimmen einzuholen, vermeide eine Einladung zur Diskussion unmittelbar vor der Einladung zur Abstimmung. Starte die Diskussion entweder ohne Benachrichtigung und lade die Beteiligten über die Abstimmung ein, oder führe eine [eigenständige Abstimmung](/en/user_manual/polls/intro_to_decisions#without-a-discussion) durch.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  467cf9d1e5bd2973:
    english: Show members the [Catch-up and notification settings](/en/user_manual/users/email_settings), especially if they do not expect to visit Loomio every day.
    translation: Zeige den Mitgliedern die [Einstellungen für Zusammenfassungen und Benachrichtigungen](/en/user_manual/users/email_settings), besonders wenn sie Loomio nicht jeden Tag besuchen werden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ebe7764d64b17823:
    english: "## Complete the first process"
    translation: "## Schließe den ersten Prozess ab"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9a165c59ba0aed5a:
    english: 'A first process should demonstrate the complete pattern:'
    translation: 'Der erste Prozess sollte den gesamten Ablauf zeigen:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8bc60d4319adf204:
    english: |-
      1. Introduce the topic and provide context.
      2. Invite discussion or questions when they are needed.
      3. Start the appropriate proposal or poll.
      4. Remind people who have not participated when necessary.
      5. Publish an [outcome](/en/user_manual/polls/outcomes) stating what was decided and what happens next.
    translation: |-
      1. Stelle das Thema vor und gib den nötigen Hintergrund.
      2. Lade zur Diskussion ein und beantworte Fragen, wenn es nötig ist.
      3. Starte den passenden Vorschlag oder die passende Abstimmung.
      4. Erinnere bei Bedarf alle, die noch nicht teilgenommen haben.
      5. Veröffentliche ein [Fazit](/en/user_manual/polls/outcomes), das festhält, was entschieden wurde und wie es weitergeht.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1235244007a8559b:
    english: The outcome closes the loop and creates a record that members can return to later. Afterward, ask what worked, adjust the process, and choose the next recurring piece of work to run in Loomio.
    translation: Das Fazit schließt den Prozess ab und hält die Entscheidung fest, damit Mitglieder später darauf zurückgreifen können. Frage anschließend, was gut funktioniert hat, passe den Ablauf an und wähle die nächste regelmäßige Aufgabe für Loomio aus.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c699f8804cdd41b1:
    english: For a facilitated sequence from discussion to decision, see [Making decisions](/en/guides/making_decisions). For board-specific practices, see [Introducing Loomio to your board](/en/guides/board_processes/introduce).
    translation: Eine angeleitete Abfolge von der Diskussion bis zur Entscheidung findest du unter [Entscheidungen treffen](/en/guides/making_decisions). Hinweise für Vorstände findest du unter [Loomio in deinem Vorstand einführen](/en/guides/board_processes/introduce).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
