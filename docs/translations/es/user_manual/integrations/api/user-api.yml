  a4f66c4c94afa135:
    english: The request timeout is five seconds. A `2xx` response, including `204 No Content`, is treated as successful. Webhook consumers should respond promptly, process longer work asynchronously, and tolerate duplicate or out-of-order deliveries.
    translation: La solicitud tiene un tiempo de espera de cinco segundos. Una respuesta `2xx`, incluida `204 No Content`, se considera correcta. Los servicios que reciben webhooks deben responder con rapidez, procesar de forma asíncrona las tareas más largas y admitir entregas duplicadas o fuera de orden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  84faa7dad6f34739:
    english: Loomio does not currently add a webhook signature, shared-secret header, event ID, or delivery ID. Treat the full destination URL as a credential, do not expose it publicly, and include an unguessable token in the URL when the receiving service supports one. If a stable machine-readable event schema or signed delivery is required, use the webhook as a change notification and retrieve the current records through the authenticated User API.
    translation: Actualmente, Loomio no añade una firma al webhook, un encabezado con un secreto compartido, un ID de evento ni un ID de entrega. Trata la URL de destino completa como una credencial, no la publiques e incluye en ella un token difícil de adivinar si el servicio receptor lo admite. Si necesitas un esquema de eventos estable y legible por máquina o entregas firmadas, usa el webhook como aviso de cambios y consulta los registros actuales mediante la API de usuario autenticada.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
