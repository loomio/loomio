  875a42e08000fffe:
    english: "# Moving items between threads"
    translation: "# Mover itens entre conversas"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5c0fcd38f9276e8f:
    english: Move selected items when a conversation belongs in another thread, when one thread has split into separate topics, or when you want to combine related discussions. There is no separate **Merge discussions** command.
    translation: Mova itens selecionados quando uma conversa pertencer a outra discussão, quando uma conversa se dividir em assuntos diferentes ou quando você quiser reunir discussões relacionadas. Não há um comando separado para **Mesclar discussões**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f43c7835d05a135e:
    english: The option is available to group admins and to members when **Members can manage discussions and comments** is enabled in [Group permissions](/en/user_manual/groups/settings/permissions).
    translation: A opção está disponível para administradores do grupo e para membros quando **Os membros podem gerenciar discussões e comentários.** estiver ativada em [Permissões do grupo](/en/user_manual/groups/settings/permissions).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  30a4e31dab983f89:
    english: Open the three-dot menu (**⋯**) on an item and select **Move item**.
    translation: Abra o menu de três pontos (**⋯**) de um item e selecione **Mover item**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  24fd0043effa14fb:
    english: Select the items you want to move.
    translation: Selecione os itens que você deseja mover.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  81551cd5134f24c5:
    english: Select any additional items with the checkboxes, then click **Move** in the banner at the top of the discussion.
    translation: Selecione outros itens pelas caixas de seleção e clique em **Mover** na faixa na parte superior da discussão.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f53055845c214b05:
    english: Choose the group or subgroup, then search for the destination discussion.
    translation: Escolha o grupo ou subgrupo e procure a discussão de destino.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  19bc2092ac28011b:
    english: To move the items into a new discussion, select **New discussion** and add its title and context.
    translation: Para mover os itens para uma nova discussão, selecione **Nova discussão** e adicione um título e um contexto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '092b56e69505636f':
    english: The items are moved from the original thread into the selected or newly created thread.
    translation: Os itens são movidos da conversa original para a conversa selecionada ou recém-criada.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  162c0d0c47ca798f:
    english: If the original thread is no longer needed, you can [lock it](/en/user_manual/discussions/using_discussions/#lock-or-unlock-a-thread). Delete it only if you are certain it will not be needed again.
    translation: Se a conversa original não for mais necessária, você pode [bloqueá-la](/en/user_manual/discussions/using_discussions/#lock-or-unlock-a-thread). Exclua-a somente se tiver certeza de que ela não será necessária novamente.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
