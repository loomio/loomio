---
navigation_title: Présenter Loomio à votre groupe
blocks:
  6c777a62b2b77732:
    english: "# Introducing Loomio to your group"
    translation: "# Présenter Loomio à votre groupe"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  438cc622ae730bd8:
    english: Introduce Loomio through one useful piece of work. Prepare the group before inviting people, help everyone participate once, and complete the process through to an outcome.
    translation: Présentez Loomio à travers une tâche utile. Préparez le groupe avant d’inviter les personnes, aidez chacune à participer une première fois, puis menez le processus jusqu’à une conclusion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9c9fa4e8f6e208e4:
    english: "## Choose one useful starting point"
    translation: "## Choisir un premier usage utile"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3353fb04e83837e5:
    english: Start with a real process that your group already needs. A good first use is small enough to complete soon, but relevant enough that people have a reason to participate.
    translation: Commencez par un processus dont votre groupe a déjà besoin. Pour un premier usage, choisissez une tâche assez limitée pour être menée à bien rapidement, mais assez importante pour donner aux personnes une raison de participer.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  652744a2ab28954b:
    english: 'For example:'
    translation: 'Par exemple :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  19bc6c09eeea816e:
    english: |-
      - prepare the agenda for an upcoming meeting;
      - review and approve meeting minutes;
      - gather feedback on a draft document;
      - decide a small operational question; or
      - identify priorities for the next month.
    translation: |-
      - préparer l’ordre du jour d’une prochaine réunion ;
      - examiner et approuver un compte rendu de réunion ;
      - recueillir des avis sur un projet de document ;
      - trancher une petite question de fonctionnement ; ou
      - définir les priorités du mois suivant.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  68a0d6b76f36ebaf:
    english: Avoid moving every discussion and decision into Loomio at once. A repeatable process gives the group a clear reason to return and lets you improve the way you run it each time.
    translation: Évitez de déplacer toutes les discussions et décisions dans Loomio d’un seul coup. Un processus régulier donne au groupe une raison claire de revenir et vous permet d’améliorer son déroulement à chaque fois.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4b65243ef120921b:
    english: "## Prepare the group before inviting people"
    translation: "## Préparer le groupe avant d’inviter les personnes"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  305b29c1c832c246:
    english: 'Give people a useful and recognizable place to arrive in:'
    translation: 'Préparez un espace utile et reconnaissable pour les personnes invitées :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  76d859d168805706:
    english: |-
      - add the group's name, logo, cover image, purpose, and important links;
      - check the group's privacy and permissions;
      - add any [category tags](/en/user_manual/discussions/tags) the group will use regularly;
      - create the first real discussion, with the background information people need; and
      - create a practice discussion if members would benefit from trying comments, reactions, and voting without consequences.
    translation: |-
      - ajoutez le nom du groupe, son logo, une image de couverture, son objectif et les liens importants ;
      - vérifiez la confidentialité et les autorisations du groupe ;
      - ajoutez les [étiquettes de catégorie](/en/user_manual/discussions/tags) que le groupe utilisera régulièrement ;
      - créez une première discussion sur un sujet réel, avec les informations nécessaires pour y participer ; et
      - créez une discussion d’essai si les membres ont besoin de tester les commentaires, les réactions et le vote sans conséquence.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f1decb57ec9d48cb:
    english: Use your own photo in your profile and the organization's logo for the group. This helps people recognize who invited them and which organization an email is about.
    translation: Utilisez votre photo pour votre profil et le logo de l’organisation pour le groupe. Les personnes invitées pourront ainsi reconnaître qui les a invitées et à quelle organisation se rapporte un e-mail.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '01965093f234bb36':
    english: "## Decide where work belongs"
    translation: "## Choisir où mener chaque activité"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7fbd0d770cbed2bd:
    english: 'Loomio can sit alongside tools your group already uses:'
    translation: 'Loomio peut être utilisé avec les outils dont votre groupe se sert déjà :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '0168271b154f6931':
    english: |-
      | Use | Good place for it |
      |---|---|
      | Quick questions, social conversation, and timely updates | Chat, such as Slack, Teams, Matrix, or Discord |
      | Collaborative editing of a living document | A shared document tool |
      | Assigning work and tracking its completion | A task or project-management tool |
      | A focused discussion, broad participation, a decision, and its lasting record | Loomio |
    translation: |-
      | Usage | Outil adapté |
      |---|---|
      | Questions rapides, conversations informelles et informations à partager sans délai | Une messagerie instantanée, comme Slack, Teams, Matrix ou Discord |
      | Modification collective d’un document évolutif | Un outil de documents partagés |
      | Attribution des tâches et suivi de leur réalisation | Un outil de gestion des tâches ou des projets |
      | Discussion ciblée, large participation, décision et conservation de sa trace | Loomio |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  50fae2027411e538:
    english: Link to documents and other systems from the group description or discussion context. Use [chat integrations](/en/user_manual/integrations/chatbots) to bring important Loomio activity into a channel people already follow.
    translation: Ajoutez des liens vers les documents et les autres outils dans la description du groupe ou le contexte de la discussion. Utilisez les [intégrations de messagerie](/en/user_manual/integrations/chatbots) pour afficher les activités importantes de Loomio dans un canal que les personnes suivent déjà.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ed67af54bdf1c775:
    english: Tell members what you expect to happen in Loomio. A simple boundary such as “important discussions and decisions go in Loomio; quick coordination stays in chat” is easier to adopt than an unexplained new tool.
    translation: Expliquez aux membres ce qui doit se passer dans Loomio. Une règle simple, comme « les discussions et décisions importantes ont lieu dans Loomio ; la coordination rapide reste dans la messagerie », est plus facile à adopter qu’un nouvel outil dont l’usage n’est pas expliqué.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0a799d7911a46f6f:
    english: "## Decide how your group decides"
    translation: "## Définir comment votre groupe prend ses décisions"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e1c64de2dc68593:
    english: Loomio does not require every group, or every decision, to use the same process. Some groups arrive with established rules. Others use Loomio while they develop a clearer decision-making practice together.
    translation: Loomio n’impose pas le même processus à tous les groupes ni à toutes les décisions. Certains groupes ont déjà des règles établies. D’autres utilisent Loomio pour élaborer ensemble une méthode de décision plus claire.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6d0c0f50959ab9d6:
    english: "### If your process is already established"
    translation: "### Si votre processus est déjà établi"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5fbfe86e935d5a8c:
    english: 'Translate the group''s existing requirements into Loomio. Before running a formal decision, make sure participants can tell:'
    translation: 'Adaptez les règles existantes du groupe à Loomio. Avant de lancer une décision formelle, assurez-vous que les personnes participantes savent :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9a1b89bd4c5fe02c:
    english: |-
      - which kinds of decisions can be made in Loomio;
      - who provides input and who has authority to decide;
      - who is eligible to vote;
      - whether a [quorum](/en/user_manual/polls/quorum) is required;
      - whether the decision requires a majority, supermajority, unanimous agreement, consent, or another [vote share requirement](/en/user_manual/polls/vote_share_requirements);
      - whether the decision takes effect when its outcome is published or must be ratified elsewhere; and
      - who will record and carry out the outcome.
    translation: |-
      - quels types de décisions peuvent être prises dans Loomio ;
      - qui donne son avis et qui a le pouvoir de décider ;
      - qui peut voter ;
      - si un [quorum](/en/user_manual/polls/quorum) est requis ;
      - si la décision exige une majorité, une majorité qualifiée, l’unanimité, le consentement ou une autre [proportion de voix requise](/en/user_manual/polls/vote_share_requirements) ;
      - si la décision prend effet à la publication de sa conclusion ou doit être ratifiée ailleurs ; et
      - qui consignera et mettra en œuvre la conclusion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4b48b6e0aff5cfc0:
    english: If your constitution, bylaws, policy, or local law governs electronic decisions, make sure the Loomio process follows those requirements. Configure [delegated voters](/en/user_manual/groups/delegated_voters), proposal settings, and [poll templates](/en/user_manual/polls/poll_templates) to make the agreed process easy to repeat.
    translation: Si les décisions électroniques sont régies par les statuts, le règlement intérieur, une politique ou le droit applicable à votre groupe, assurez-vous que le processus dans Loomio respecte ces règles. Configurez les [électeurs délégués](/en/user_manual/groups/delegated_voters), les paramètres des propositions et les [modèles de sondage](/en/user_manual/polls/poll_templates) pour faciliter la répétition du processus convenu.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b068624ed6c7c6b3:
    english: "### If your group is still deciding"
    translation: "### Si votre groupe définit encore son processus"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  14449de544d28a6b:
    english: 'Start a discussion about how decisions should be made. Instead of beginning with a voting tool, ask the group to consider:'
    translation: 'Lancez une discussion sur la façon de prendre les décisions. Avant de choisir un outil de vote, invitez le groupe à réfléchir aux questions suivantes :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f65b39a74ae25ed7:
    english: |-
      - What kinds of decisions do we make?
      - Who is affected, who should be consulted, and who is responsible for deciding?
      - Which decisions need advice, consent, consensus, a vote, or delegated authority?
      - What level of participation or support makes a decision valid?
      - How will we respond to objections, tied results, or insufficient participation?
      - How will we communicate, record, review, and change a decision?
    translation: |-
      - Quels types de décisions prenons-nous ?
      - Qui est concerné, qui faut-il consulter et qui est responsable de la décision ?
      - Quelles décisions nécessitent des avis, un consentement, un consensus, un vote ou une délégation de pouvoir ?
      - Quel niveau de participation ou de soutien rend une décision valide ?
      - Comment réagirons-nous aux objections, aux égalités de voix ou à une participation insuffisante ?
      - Comment communiquerons-nous, consignerons-nous, réexaminerons-nous et modifierons-nous une décision ?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ce7c0af2ad170b5c:
    english: The answers may be different for an operational decision, a policy, an election, and a constitutional change. See [Making decisions](/en/guides/making_decisions) to compare several complete processes.
    translation: Les réponses peuvent varier selon qu’il s’agit d’une décision de fonctionnement, d’une politique, d’une élection ou d’une modification des statuts. Consultez [Prendre des décisions](/en/guides/making_decisions) pour comparer plusieurs processus complets.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  aac26fc96b90744d:
    english: If the group is not ready to settle every rule, agree on a provisional process for one low-risk decision. State what the result will mean before asking people to participate, publish an outcome, then review how the process worked. Record what the group learns in its description, governance documents, or reusable templates.
    translation: Si le groupe n’est pas prêt à fixer toutes les règles, convenez d’un processus provisoire pour une décision à faible enjeu. Expliquez ce que signifiera le résultat avant d’inviter les personnes à participer, publiez une conclusion, puis examinez le déroulement du processus. Consignez les enseignements du groupe dans sa description, ses documents de gouvernance ou des modèles réutilisables.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  23ed8fb3e887afbc:
    english: "## Invite people"
    translation: "## Inviter les personnes"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a5d369ad9df691fe:
    english: "[Invite people](/en/user_manual/groups/inviting_people) with a short personal message that explains:"
    translation: "[Invitez les personnes](/en/user_manual/groups/inviting_people) avec un court message personnel qui explique :"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3383207ff2fcc99b:
    english: |-
      - why the group is using Loomio;
      - what you are asking them to do first;
      - when you need their response; and
      - where they can get help.
    translation: |-
      - pourquoi le groupe utilise Loomio ;
      - ce que vous leur demandez de faire en premier ;
      - quand vous avez besoin de leur réponse ; et
      - où elles peuvent obtenir de l’aide.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  282ef8673815823e:
    english: You can begin with a small group of people who will actively test the process, or invite the whole group when everyone needs to participate from the start. In either case, have a discussion ready for them rather than inviting people into an empty group.
    translation: Vous pouvez commencer avec un petit groupe de personnes qui testeront activement le processus, ou inviter tout le groupe si chacun doit participer dès le départ. Dans les deux cas, préparez une discussion avant de les inviter dans le groupe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cd6511a78ce7c9b7:
    english: "## Help everyone participate once"
    translation: "## Aider chaque personne à participer une première fois"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a37273687b4f4b0:
    english: The first objective is for each person to cross the threshold from receiving an invitation to contributing something.
    translation: Le premier objectif est que chaque personne passe de la réception d’une invitation à une première contribution.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ce285f27cca389c4:
    english: 'Ask people to:'
    translation: 'Invitez les personnes à :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d0b9e80af995edff:
    english: |-
      1. sign in and add a profile photo;
      2. open the welcome or practice discussion;
      3. post a short comment or reaction; and
      4. vote in a low-stakes proposal and, if useful, leave a reason.
    translation: |-
      1. se connecter et ajouter une photo de profil ;
      2. ouvrir la discussion de bienvenue ou d’essai ;
      3. publier un court commentaire ou une réaction ; et
      4. voter sur une proposition à faible enjeu et, si cela leur est utile, expliquer leur choix.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  919e32e7adb7c4c8:
    english: Members do not need to create a password. They can [sign in by email](/en/user_manual/users/signing_in), and they can reply to eligible discussion emails without first navigating back to the thread.
    translation: Les membres n’ont pas besoin de créer un mot de passe. Ils peuvent [se connecter par e-mail](/en/user_manual/users/signing_in) et répondre aux e-mails des discussions qui le permettent sans avoir à retourner d’abord dans le fil de discussion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  22ceb7104d416acf:
    english: "## Use notifications deliberately"
    translation: "## Utiliser les notifications de manière réfléchie"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dd99e6dd5c93d9ee:
    english: Access to content and notification about it are separate. Group members can find discussions in their group even when they were not notified immediately.
    translation: L’accès à un contenu et la notification de ce contenu sont deux choses distinctes. Les membres peuvent retrouver les discussions de leur groupe même s’ils n’ont pas reçu de notification immédiate.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0e20732d957eb282:
    english: When starting a discussion, notify the people whose input is needed at that stage. Use @mentions and replies when asking particular people to respond. When voting opens later, invite the eligible voters.
    translation: Lorsque vous lancez une discussion, informez les personnes dont l’avis est nécessaire à ce stade. Utilisez les @mentions et les réponses pour solliciter des personnes précises. Lorsque le vote s’ouvre plus tard, invitez les personnes qui peuvent voter.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  43339ff0f3d30a50:
    english: If you create a discussion and poll together only to capture a vote, avoid sending a discussion invitation immediately followed by a poll invitation. Either start the discussion without notifying people and invite them through the poll, or run a [standalone poll](/en/user_manual/polls/intro_to_decisions#without-a-discussion).
    translation: Si vous créez une discussion et un sondage en même temps uniquement pour recueillir un vote, évitez d’envoyer une invitation à la discussion immédiatement suivie d’une invitation au sondage. Vous pouvez lancer la discussion sans envoyer de notification, puis inviter les personnes par le sondage, ou lancer un [sondage indépendant](/en/user_manual/polls/intro_to_decisions#without-a-discussion).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  467cf9d1e5bd2973:
    english: Show members the [Catch-up and notification settings](/en/user_manual/users/email_settings), especially if they do not expect to visit Loomio every day.
    translation: Montrez aux membres les [paramètres de récapitulatif et de notification](/en/user_manual/users/email_settings), surtout s’ils ne prévoient pas de consulter Loomio tous les jours.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ebe7764d64b17823:
    english: "## Complete the first process"
    translation: "## Mener le premier processus à son terme"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9a165c59ba0aed5a:
    english: 'A first process should demonstrate the complete pattern:'
    translation: 'Le premier processus devrait montrer toutes les étapes :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8bc60d4319adf204:
    english: |-
      1. Introduce the topic and provide context.
      2. Invite discussion or questions when they are needed.
      3. Start the appropriate proposal or poll.
      4. Remind people who have not participated when necessary.
      5. Publish an [outcome](/en/user_manual/polls/outcomes) stating what was decided and what happens next.
    translation: |-
      1. Présentez le sujet et donnez le contexte.
      2. Invitez les membres à discuter ou à poser des questions au moment opportun.
      3. Lancez la proposition ou le sondage adapté.
      4. Rappelez aux personnes qui n’ont pas encore participé de le faire si nécessaire.
      5. Publiez une [conclusion](/en/user_manual/polls/outcomes) qui indique ce qui a été décidé et les prochaines étapes.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1235244007a8559b:
    english: The outcome closes the loop and creates a record that members can return to later. Afterward, ask what worked, adjust the process, and choose the next recurring piece of work to run in Loomio.
    translation: La conclusion termine le processus et crée une trace que les membres pourront consulter plus tard. Ensuite, demandez ce qui a bien fonctionné, adaptez le processus et choisissez la prochaine activité régulière à mener dans Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c699f8804cdd41b1:
    english: For a facilitated sequence from discussion to decision, see [Making decisions](/en/guides/making_decisions). For board-specific practices, see [Introducing Loomio to your board](/en/guides/board_processes/introduce).
    translation: Pour suivre une démarche guidée, de la discussion à la décision, consultez [Prendre des décisions](/en/guides/making_decisions). Pour les pratiques propres aux conseils d’administration, consultez [Présenter Loomio à votre conseil d’administration](/en/guides/board_processes/introduce).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
