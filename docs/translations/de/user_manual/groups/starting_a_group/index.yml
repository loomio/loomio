navigation_title: Eine Gruppe gründen
blocks:
  e8632dbb628c7c7d:
    english: "# Starting a new group"
    translation: "# Eine neue Gruppe gründen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2a4a6907d4e2049d:
    english: If you are new to Loomio, you can start a group on a free trial at any time from the [Loomio website](https://www.loomio.com/). If you already use Loomio and would like to start a new group for another organization or purpose, you can do this from the sidebar menu - click on **New group**.
    translation: Wenn du Loomio noch nicht nutzt, kannst du auf der [Loomio-Website](https://www.loomio.com/) jederzeit eine Gruppe mit einer kostenlosen Testphase gründen. Wenn du Loomio bereits nutzt und eine neue Gruppe für eine andere Organisation oder einen anderen Zweck gründen möchtest, klicke im Seitenmenü auf **Neue Gruppe**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  10e8756c96038e58:
    english: For many organizations, a single Loomio group is sufficient. You can start as many subgroups as you need within the group. See [Subgroups](/en/user_manual/groups/subgroups/) for more info.
    translation: Für viele Organisationen reicht eine Loomio-Gruppe aus. Innerhalb der Gruppe kannst du beliebig viele Untergruppen gründen. Weitere Informationen findest du unter [Untergruppen](/en/user_manual/groups/subgroups/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ed00dbe94cd53435:
    english: "## Group details"
    translation: "## Gruppendetails"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0bb201e3a09fe99d:
    english: "### Group name"
    translation: "### Gruppenname"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '019cdfc169ea858a':
    english: Type your group name. It's best to keep your group name short and concise.
    translation: Gib einen Namen für deine Gruppe ein. Am besten ist ein kurzer, prägnanter Name.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6ae6b08ae7fbe257:
    english: "### Group handle"
    translation: "### Gruppenkennung"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b054d0f760888add:
    english: Your group is automatically assigned a handle. The handle is used in the group's URL and email address, such as **loomio.com/your-group-handle** and **your-group-handle@loomio.com**.
    translation: Deiner Gruppe wird automatisch eine Kennung zugewiesen. Sie wird in der URL und der E-Mail-Adresse der Gruppe verwendet, zum Beispiel **loomio.com/your-group-handle** und **your-group-handle@loomio.com**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1dee654ba628ba95:
    english: You can edit the handle when you create the group and change it later in group settings. When you change it, links and email addresses that use the old handle continue to work. Loomio keeps up to three old handles; after that, the oldest handle expires.
    translation: Du kannst die Kennung beim Erstellen der Gruppe bearbeiten und später in den Gruppeneinstellungen ändern. Links und E-Mail-Adressen mit der alten Kennung funktionieren danach weiterhin. Loomio bewahrt bis zu drei alte Kennungen auf. Wenn du die Kennung erneut änderst, verfällt die älteste.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '08496ed70144fc4d':
    english: "### Group description"
    translation: "### Gruppenbeschreibung"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1a464543c51ded45:
    english: This short description will show at the top of the dashboard, to offer any necessary context for new members.
    translation: Diese kurze Beschreibung erscheint oben auf dem Dashboard und gibt neuen Mitgliedern den nötigen Kontext.
    status: machine
    provider: codex/gpt-6-sol
