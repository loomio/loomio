  3e67180e9dbafb27:
    english: |-
      | Name | Description |
      | --- | --- |
      | `group_id` | Integer, optional, default null. ID of group for poll. If `discussion_id` is passed, `group_id` is ignored |
      | `discussion_id` | Integer, optional, default null. ID of discussion thread to add this poll to |
      | `title` | String, required. Title of the poll |
      | `poll_type` | String, required. Values: `proposal`, `poll`, `count`, `score`, `ranked_choice`, `meeting`, `dot_vote` |
      | `details` | String, optional. The body text of the poll |
      | `details_format` | String, optional, default `md`. Values: `md` or `html` |
      | `options` | Array of strings. If `poll_type` is `proposal`, valid values are `agree`, `disagree`, `abstain`, `block`. If `poll_type` is `meeting`, provide ISO 8601 date or datetime strings. For all other poll types, any string is valid |
      | `closing_at` | ISO 8601 string or null, default null. Example: `2026-09-01T12:00:00Z`. If null, voting is disabled and poll is considered work in progress |
      | `specified_voters_only` | Boolean, optional, default false. If true, only specified people can vote. If false, everyone in the group will be invited to vote |
      | `hide_results` | String, optional, default `off`. Values: `off`, `until_vote`, `until_closed` |
      | `shuffle_options` | Boolean, default false. Display options to voters in random order |
      | `anonymous` | Boolean, optional, default false. Hide identities of voters |
      | `recipient_audience` | `group` or null, optional, default null. If `group`, the whole group will be notified |
      | `notify_on_closing_soon` | String, optional, default `nobody`. Values: `nobody`, `author`, `undecided_voters`, `voters` |
      | `recipient_user_ids` | Array of user IDs to notify or invite |
      | `recipient_emails` | Array of email addresses of people to invite to vote |
      | `recipient_message` | Message to include in the email invitation |
      | `notify_recipients` | Boolean, default false. If false, add people without sending notifications. If true, everyone invited in this request will get a notification email |
    translation: |-
      | Nom | Description |
      | --- | --- |
      | `group_id` | Entier, facultatif, valeur par défaut : null. Identifiant du groupe auquel appartient le sondage. Si `discussion_id` est fourni, `group_id` est ignoré |
      | `discussion_id` | Entier, facultatif, valeur par défaut : null. Identifiant du fil de discussion auquel ajouter ce sondage |
      | `title` | Chaîne de caractères obligatoire. Titre du sondage |
      | `poll_type` | Chaîne de caractères obligatoire. Valeurs : `proposal`, `poll`, `count`, `score`, `ranked_choice`, `meeting`, `dot_vote` |
      | `details` | Chaîne de caractères facultative. Texte du sondage |
      | `details_format` | Chaîne de caractères facultative, valeur par défaut : `md`. Valeurs : `md` ou `html` |
      | `options` | Tableau de chaînes de caractères. Si `poll_type` vaut `proposal`, les valeurs possibles sont `agree`, `disagree`, `abstain` et `block`. Si `poll_type` vaut `meeting`, fournissez des dates ou des dates et heures au format ISO 8601. Pour les autres types de sondage, toute chaîne de caractères est acceptée |
      | `closing_at` | Chaîne au format ISO 8601 ou valeur nulle, valeur par défaut : nulle. Exemple : `2026-09-01T12:00:00Z`. Si la valeur est nulle, le vote est désactivé et le sondage est considéré comme un brouillon |
      | `specified_voters_only` | Booléen facultatif, valeur par défaut : faux. Si la valeur est vraie, seules les personnes désignées peuvent voter. Sinon, toutes les personnes du groupe sont invitées à voter |
      | `hide_results` | Chaîne de caractères facultative, valeur par défaut : `off`. Valeurs : `off`, `until_vote`, `until_closed` |
      | `shuffle_options` | Booléen, valeur par défaut : faux. Affiche les options aux votants dans un ordre aléatoire |
      | `anonymous` | Booléen facultatif, valeur par défaut : faux. Masque l’identité des votants |
      | `recipient_audience` | `group` ou valeur nulle, facultatif, valeur par défaut : nulle. Si la valeur est `group`, tout le groupe reçoit une notification |
      | `notify_on_closing_soon` | Chaîne de caractères facultative, valeur par défaut : `nobody`. Valeurs : `nobody`, `author`, `undecided_voters`, `voters` |
      | `recipient_user_ids` | Tableau d’identifiants de personnes à avertir ou à inviter |
      | `recipient_emails` | Tableau d’adresses e-mail de personnes à inviter à voter |
      | `recipient_message` | Message à inclure dans l’invitation envoyée par e-mail |
      | `notify_recipients` | Booléen, valeur par défaut : faux. Si la valeur est fausse, les personnes sont ajoutées sans notification. Si elle est vraie, chaque personne invitée par cette requête reçoit une notification par e-mail |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
