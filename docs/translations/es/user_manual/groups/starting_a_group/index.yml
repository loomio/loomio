  e8632dbb628c7c7d:
    english: "# Starting a new group"
    translation: "# Crear un grupo nuevo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2a4a6907d4e2049d:
    english: If you are new to Loomio, you can start a group on a free trial at any time from the [Loomio website](https://www.loomio.com/). If you already use Loomio and would like to start a new group for another organization or purpose, you can do this from the sidebar menu - click on **New group**.
    translation: Si aún no usas Loomio, puedes crear un grupo con una prueba gratuita en cualquier momento desde el [sitio web de Loomio](https://www.loomio.com/). Si ya usas Loomio y quieres crear otro grupo para una organización o un propósito diferente, haz clic en **Nuevo grupo** en el menú lateral.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  10e8756c96038e58:
    english: For many organizations, a single Loomio group is sufficient. You can start as many subgroups as you need within the group. See [Subgroups](/en/user_manual/groups/subgroups/) for more info.
    translation: Para muchas organizaciones, basta con un grupo de Loomio. Puedes crear tantos subgrupos como necesites dentro de él. Consulta [Subgrupos](/en/user_manual/groups/subgroups/) para obtener más información.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ed00dbe94cd53435:
    english: "## Group details"
    translation: "## Datos del grupo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0bb201e3a09fe99d:
