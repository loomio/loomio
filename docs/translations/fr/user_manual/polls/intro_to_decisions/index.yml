  7eddb057cca077f4:
    english: A **voting method** defines how people respond and how results are calculated. A **poll template** is a reusable configuration built on a voting method, with preset instructions, options, and settings. A **decision process** may use a discussion and several templates before the group reaches an outcome.
    translation: Une **méthode de vote** définit comment les personnes répondent et comment les résultats sont calculés. Un **modèle de sondage** est une configuration réutilisable fondée sur une méthode de vote, avec des consignes, des options et des paramètres prédéfinis. Un **processus de décision** peut comprendre une discussion et plusieurs modèles avant que le groupe ne parvienne à une conclusion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3cd46aa2f1240e88:
    english: "## Proposals"
    translation: "## Propositions"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  85a55fccaf4e4032:
    english: 'A proposal asks people to respond to a statement or course of action. Loomio includes templates for common purposes:'
    translation: 'Une proposition invite les personnes à se prononcer sur une affirmation ou une action envisagée. Loomio propose des modèles adaptés à différents objectifs :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  51bf1ffa7d057d9e:
    english: |-
      - [Sense check](../proposals/sense_check/) gathers early reactions;
      - [Advice](../proposals/advice/) gathers input for a decision maker;
      - [Consent](../proposals/consent/) tests for meaningful objections; and
      - [Consensus](../proposals/consensus/) seeks collective agreement.
    translation: |-
      - [Prise de température](../proposals/sense_check/) recueille les premières réactions ;
      - [Conseil](../proposals/advice/) recueille les avis destinés à la personne qui prendra la décision ;
      - [Consentement](../proposals/consent/) permet de vérifier s’il existe des objections importantes ; et
      - [Consensus](../proposals/consensus/) vise un accord collectif.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d01e9f85fcd2d9c2:
    english: See [Proposals](../proposals/) to compare them.
    translation: Consultez [Propositions](../proposals/) pour comparer ces modèles.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  821dcd89b5460804:
    english: "## Polls"
    translation: "## Sondages"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ec746235c7fe89c4:
    english: 'Use a poll when participants need to select, score, allocate, rank, state their availability, or cast an election ballot:'
    translation: 'Utilisez un sondage lorsque les participants doivent choisir, attribuer une note ou des points, classer des options, indiquer leurs disponibilités ou voter lors d’une élection :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b93f9fe9611d9205:
    english: |-
      - [Choose](../choose/) finds popular options;
      - [Score](../score/) evaluates every option on a scale;
      - [Allocate](../allocate/) distributes a limited budget of points;
      - [Rank](../rank/) finds an overall order of preference;
      - [Time poll](../meeting_polls/) finds when people are available; and
      - [STV Election](../stv/) elects multiple winners proportionally.
    translation: |-
      - [Choix](../choose/) permet de trouver les options les plus populaires ;
      - [Vote pondéré](../score/) permet d’évaluer chaque option sur une échelle ;
      - [Répartition](../allocate/) permet de répartir un nombre limité de points ;
      - [Classement par préférence](../rank/) permet d’établir un ordre de préférence général ;
      - [Sondage de date](../meeting_polls/) permet de trouver les disponibilités des personnes ; et
      - [Élection STV](../stv/) permet d’élire plusieurs personnes selon un scrutin proportionnel.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9972b34ccc3ea79b:
    english: See [Polls](../proposal_types/) to compare them.
    translation: Consultez [Sondages](../proposal_types/) pour comparer ces modèles.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5890626db6dcbb68:
    english: "## Start a proposal or poll"
    translation: "## Lancer une proposition ou un sondage"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4b5338cae269fd32:
    english: "### Choose whether to use a discussion"
    translation: "### Choisir d’utiliser ou non une discussion"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c45fe8ff31f71486:
    english: Start the proposal or poll inside a discussion when people need context, questions, or conversation before responding. A discussion can contain several proposals over time, keeping amendments and the eventual outcome together as one record of the topic.
    translation: Lancez la proposition ou le sondage dans une discussion si les personnes ont besoin de contexte, souhaitent poser des questions ou doivent échanger avant de répondre. Une discussion peut contenir plusieurs propositions au fil du temps. Les modifications et la conclusion finale restent ainsi regroupées dans un même historique du sujet.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0bb2a90f8f9dad0c:
    english: Run a standalone poll when the discussion has already happened elsewhere, such as at a meeting, or when the question is simple and you only need to collect responses. Include enough detail or a link to the relevant record so voters understand what they are responding to.
    translation: Lancez un sondage indépendant si les échanges ont déjà eu lieu ailleurs, par exemple lors d’une réunion, ou si la question est simple et que vous souhaitez seulement recueillir des réponses. Ajoutez suffisamment de détails ou un lien vers le compte rendu concerné pour que les personnes comprennent sur quoi porte leur vote.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7d50445f0c54190d:
    english: "### In a discussion"
    translation: "### Dans une discussion"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  05e03f7ee0e1b4dc:
    english: Open the discussion, scroll to the reply area, select **Start a vote**, and choose a template.
    translation: Ouvrez la discussion, faites défiler jusqu’à la zone de réponse, sélectionnez **Lancer un vote**, puis choisissez un modèle.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  55dc0481a5c4ecb6:
    english: "### Without a discussion"
    translation: "### Sans discussion"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  af5fd115de5f7aec:
    english: Open the **Polls** tab on the group page, select **New poll**, and choose a template.
    translation: Ouvrez l’onglet **Sondages** sur la page du groupe, sélectionnez **Nouveau sondage**, puis choisissez un modèle.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  23479ea263004d4a:
    english: If you create a discussion and poll at the same time only to run a vote, avoid notifying people twice. Start the discussion without notifying them and use the poll invitation, or run the poll without a discussion.
    translation: Si vous créez une discussion et un sondage en même temps uniquement pour organiser un vote, évitez d’envoyer deux notifications aux personnes concernées. Lancez la discussion sans les notifier et utilisez l’invitation au sondage, ou lancez le sondage sans discussion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  31f857d230319a3c:
    english: "## What happens next"
    translation: "## Et ensuite"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb709a76dfeabd4f:
    english: When starting a proposal or poll, you provide a title and details, review its response options and settings, set a closing time, and invite participants. While it is open, participants can vote, explain their response, and change their vote. Results update as votes are submitted, subject to the poll's result-visibility setting.
    translation: Pour lancer une proposition ou un sondage, indiquez un titre et des détails, vérifiez les options de réponse et les paramètres, fixez une heure de clôture et invitez les participants. Tant que le vote est ouvert, les participants peuvent voter, expliquer leur réponse et modifier leur vote. Les résultats sont mis à jour au fur et à mesure des votes, selon le paramètre de visibilité des résultats du sondage.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  acd2e813b56034a0:
    english: When it closes, publish an [outcome](../outcomes/) that records what the result means and what will happen next.
    translation: À la clôture, publiez une [conclusion](../outcomes/) qui explique ce que signifie le résultat et ce qui se passera ensuite.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
