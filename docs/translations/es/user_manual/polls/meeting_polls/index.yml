  86490ad15147169e:
    english: Use a **Time poll** to find a time for a meeting or event. It serves the same purpose as scheduling tools such as Doodle, while keeping the scheduling process with the group's other Loomio work. Participants see the options in their own time zone.
    translation: Usa una **Encuesta de tiempo** para encontrar un horario para una reunión o un evento. Cumple la misma función que herramientas como Doodle y mantiene la organización de la reunión junto al resto del trabajo del grupo en Loomio. Cada participante ve las opciones en su zona horaria.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2e21bb1b54b6fcf9:
    english: "## Time poll"
    translation: "## Encuesta de tiempo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  27ba736f4b564fe3:
    english: _Find when people are available to meet_
    translation: _Encuentra un horario en el que las personas puedan reunirse_
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2f5455ba3b487407:
    english: Save time arranging a date for your meeting or event.
    translation: Ahorra tiempo al fijar la fecha de tu reunión o evento.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  859c3efc07ce0b04:
    english: Time poll makes it easy to see everyone's availability and find the best time.
    translation: La encuesta de tiempo te permite ver cuándo está disponible cada persona y encontrar el mejor horario.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  12ae9e9d3bdb0a4e:
    english: Give your Time poll a title and details. Enter a list of date and time options in your time zone.
    translation: Ponle un título a tu encuesta de tiempo y añade los detalles. Introduce una lista de fechas y horas en tu zona horaria.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  548fb6cd6fcd9376:
    english: When setting timeslots, consider people in different time zones. Participants will see times localized in their time zone.
    translation: Al definir los horarios, ten en cuenta a las personas que están en otras zonas horarias. Cada participante verá las horas en su propia zona horaria.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3105405631b53c31:
    english: Set a meeting duration.
    translation: Establece la duración de la reunión.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8d56a5d9986286e9:
    english: "### Voting"
    translation: "### Votación"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  41d1e6a3a6739d95:
    english: People mark each time with the green thumbs-up icon when they are available, the yellow sideways thumb when they can attend if needed, or the red thumbs-down icon when they are unavailable.
    translation: Las personas marcan cada horario con el pulgar verde hacia arriba si pueden asistir, el pulgar amarillo de lado si podrían asistir en caso necesario o el pulgar rojo hacia abajo si no pueden asistir.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b4784042c82735af:
    english: Participants can leave a reason comment to help the organizer find a suitable time.
    translation: Los participantes pueden dejar un comentario con el motivo de su elección para ayudar a quien organiza la reunión a encontrar un horario adecuado.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0165a90bc22b6f7f:
    english: If the times don't work, participants can suggest alternatives using the message field. You can then update the poll with new times.
    translation: Si ninguno de los horarios les sirve, los participantes pueden proponer alternativas en el campo de mensaje. Después puedes actualizar la encuesta con nuevos horarios.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6c7c09879e7d9bf8:
    english: The results update as voting proceeds in a table showing who is available when, so everyone can see which timeslots are popular.
    translation: Los resultados se actualizan a medida que avanza la votación. Una tabla muestra quién puede asistir en cada horario para que todos vean cuáles tienen más apoyo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
