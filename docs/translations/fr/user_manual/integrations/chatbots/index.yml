  ca092d1c3fdb9f59:
    english: 'You probably don''t want to click any of the checkboxes for now. Just enter the name (such as "Discord #general") and the URL and click the save button at the bottom of the form.'
    translation: 'Pour le moment, laissez les cases décochées. Saisissez un nom (par exemple « Discord #general ») et l''URL, puis cliquez sur le bouton **Enregistrer** en bas du formulaire.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a63a4be4a45bcfdb:
    english: If you decide later that you want the integration to receive automatic notifications, return to its settings and select the relevant events.
    translation: Si vous souhaitez recevoir des notifications automatiques plus tard, retournez dans les paramètres de l'intégration et sélectionnez les événements concernés.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f1d9c09f9d3c2a82:
    english: "### Invite to poll"
    translation: "### Inviter au vote"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cbc7b5fd5afcc24c:
    english: |-
      This is how to send a notification to your chatroom inviting people to vote in a proposal.
      It's the same process for Share outcome, Invite to thread, Remind to vote, Poll edited etc.
    translation: |-
      Voici comment envoyer dans votre salon de discussion une notification invitant les personnes à voter sur une proposition.
      La procédure est la même pour **Partager la conclusion**, **Inviter à la discussion**, **Rappeler de voter**, **Sondage modifié**, etc.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  290001bb97dee010:
    english: |-
      ### Automatic notifications
      To send a notification whenever a specific event happens, edit the chat integration and select that event.
    translation: |-
      ### Notifications automatiques
      Pour envoyer une notification chaque fois qu'un événement donné se produit, modifiez l'intégration de chat et sélectionnez cet événement.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
