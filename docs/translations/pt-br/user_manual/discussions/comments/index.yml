---
navigation_title: Comentários
blocks:
  e6981c530fad6f45:
    english: "# Comments"
    translation: "# Comentários"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cb82daa3594be60c:
    english: Comments are the main way people participate in a discussion. They are visible to anyone who has permission to see the thread.
    translation: Os comentários são a principal forma de participar de uma discussão. Qualquer pessoa com permissão para ver a conversa pode lê-los.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  96ffa85117001d18:
    english: "## Reading comments"
    translation: "## Ler comentários"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2d82b2da2ee96a1f:
    english: When you open a discussion, Loomio takes you to activity that is new to you.
    translation: Quando você abre uma discussão, o Loomio mostra as atividades que você ainda não viu.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c4a1b0be655249a9:
    english: Unread comments have a blue **new** label beside their posting time.
    translation: Comentários não lidos têm uma etiqueta azul **novo** ao lado do horário de publicação.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  82bce54322fa6023:
    english: "## Writing a comment"
    translation: "## Escrever um comentário"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7b14a17025b52e3d:
    english: Write a comment to contribute to the discussion. Other people can reply, react, or post their own comments.
    translation: Escreva um comentário para participar da discussão. Outras pessoas podem responder, reagir ou publicar seus próprios comentários.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6e0c07cfcb8f1166:
    english: Select **Post Comment** to publish it. Your comment will be visible to anyone who has permission to see the discussion.
    translation: Selecione **Postar comentário** para publicá-lo. Qualquer pessoa com permissão para ver a discussão poderá ler seu comentário.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  edfadd8f1dcac9c4:
    english: The tools described in [Formatting](/en/user_manual/discussions/formatting/) are available when writing comments.
    translation: As ferramentas descritas em [Formatação](/en/user_manual/discussions/formatting/) estão disponíveis ao escrever comentários.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b4dce878f57863ff:
    english: "## Mentioning people"
    translation: "## Mencionar pessoas"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  70543178fe9e7b4b:
    english: Type **@**, start typing a person's name, then select them from the list. A mention notifies that person immediately and is a useful way to ask for their attention or response.
    translation: Digite **@**, comece a digitar o nome da pessoa e selecione-a na lista. A menção envia uma notificação imediata e pode ser usada para pedir a atenção ou uma resposta dessa pessoa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b1d5a5e3d5bb86e3:
    english: "![Mentioning Samira Patel in a comment](../notifying_people/comment_mention.png)"
    translation: "![Mencionando Samira Patel em um comentário](../notifying_people/comment_mention.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  07aa88bffb5b1700:
    english: To notify everyone in the group, type **@**, start typing the group name, then select it from the list.
    translation: Para notificar todas as pessoas do grupo, digite **@**, comece a digitar o nome do grupo e selecione-o na lista.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  794c26be4050ac1b:
    english: "![Searching for Oatmilk Cooperative while writing a group mention](../notifying_people/mentioning_group_1.png)"
    translation: "![Buscando Oatmilk Cooperative ao escrever uma menção ao grupo](../notifying_people/mentioning_group_1.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  111625a57c02bc5c:
    english: "![Oatmilk Cooperative selected as a group mention](../notifying_people/mentioning_group_2.png)"
    translation: "![Oatmilk Cooperative selecionado como menção ao grupo](../notifying_people/mentioning_group_2.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b4fb3c8390c32e31:
    english: Mentioning someone does not give them access to the thread. Use **Invite people** in the thread sidebar if they are not already a thread member.
    translation: Mencionar alguém não dá acesso à conversa. Se a pessoa ainda não for membro da conversa, use **Convidar pessoas** na barra lateral.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6bba3d93a1845f91:
    english: "## Replying to a comment"
    translation: "## Responder a um comentário"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e7776c198f2f2f48:
    english: Select **Reply** below a comment to respond to it. The reply is prefilled with an @mention of the comment author, which notifies them when you post it. Remove the mention if you do not want to notify them.
    translation: Selecione **Responder** abaixo de um comentário. A resposta já inclui uma menção com @ ao autor do comentário, que receberá uma notificação quando você publicar a resposta. Remova a menção se não quiser notificá-lo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eb45d23f7f968858:
    english: You can also reply to your own comment to nest a response beneath it.
    translation: Você também pode responder ao seu próprio comentário para adicionar uma resposta abaixo dele.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ab1caf06d54d3bcb:
    english: If a Loomio email says you can reply by email, your emailed reply will appear in the thread.
    translation: Se um e-mail do Loomio informar que você pode responder por e-mail, sua resposta aparecerá na conversa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72d9282ce2bc763a:
    english: "## Reactions"
    translation: "## Reações"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1875a303c30b5343:
    english: Use the smiley button to respond with an emoji. Reactions notify the comment author within Loomio but do not send an email.
    translation: Use o botão de rosto sorridente para reagir com um emoji. As reações notificam o autor do comentário no Loomio, mas não enviam um e-mail.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ce997bcd34b2eae0:
    english: "## Translating comments"
    translation: "## Traduzir comentários"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b50a435640652d31:
    english: If the author uses a language other than yours, a **Translate** action appears below the comment.
    translation: Se o autor escrever em outro idioma, a ação **Traduzir** aparecerá abaixo do comentário.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9077e2c891750fe8:
    english: Select **Translate comment** to see the comment in your language.
    translation: Selecione **Traduzir comentario ** para ver o comentário no seu idioma.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  60a885598057c1bf:
    english: "## Comment actions"
    translation: "## Ações dos comentários"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9689ea71da9051d8:
    english: Common actions appear directly below a comment. Additional actions are available from the three-dot menu (**⋯**).
    translation: As ações mais comuns aparecem logo abaixo do comentário. Outras ações estão disponíveis no menu de três pontos (**⋯**).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  88263de7d2158dae:
    english: "### Add a comment to Jump to"
    translation: "### Adicionar um comentário a Pular para"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dd60de0295088aa5:
    english: Use **Pin to timeline** to add a comment to the thread's **Jump to** list.
    translation: Use **Fixar na timeline** para adicionar um comentário à lista **Pular para** da conversa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  90252c4d66b752d4:
    english: You can edit the label shown in **Jump to**. Unpin and then pin the comment again to change the link text.
    translation: Você pode editar o texto exibido em **Pular para**. Para alterar o texto do link, desafixe o comentário e fixe-o novamente.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  28c2ffaa171b6b1b:
    english: |-
      >[!Tip]
      >Highlight the words you want to use as the link text before selecting **Pin to timeline**.
    translation: |-
      >[!Tip]
      >Destaque as palavras que você quer usar como texto do link antes de selecionar **Fixar na timeline**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7545e856758edb22:
    english: Select **Unpin** to remove the item from **Jump to**.
    translation: Selecione **Desafixar** para remover o item de **Pular para**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c3b33d31cbce93c3:
    english: "### Edit a comment and view changes"
    translation: "### Editar um comentário e ver as alterações"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  abaeaac4c1f2c966:
    english: Select **Edit** below one of your comments to change it. Group admins can also edit member comments when the relevant group permission is enabled.
    translation: Selecione **Editar** abaixo de um dos seus comentários para alterá-lo. Administradores do grupo também podem editar comentários de membros quando a permissão correspondente estiver ativada.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  69647eee1f3fcfb7:
    english: An **Edited** action appears below an edited comment.
    translation: A ação **Editado** aparece abaixo de um comentário editado.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fcaa0d6329f5c5d4:
    english: Select **Edited** to see what changed. Red highlighting shows removed text and green highlighting shows added text. Loomio records who made each edit and when it was made.
    translation: Selecione **Editado** para ver o que mudou. O destaque vermelho mostra o texto removido, e o verde mostra o texto adicionado. O Loomio registra quem fez cada edição e quando ela foi feita.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  042b22530d14a486:
    english: 'You can edit a comment when:'
    translation: 'Você pode editar um comentário quando:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  afe0ed6535a96b15:
    english: |-
      - you wrote it and the group allows members to edit their comments
      - you are a group admin and [Admins can edit members' comments](/en/user_manual/groups/settings/permissions) is enabled
    translation: |-
      - você o escreveu e o grupo permite que membros editem seus comentários
      - você é administrador do grupo e a opção [Administradores podem editar comentários de membros](/en/user_manual/groups/settings/permissions) está ativada
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6962d0caeeea20e8:
    english: "### Copy a comment link"
    translation: "### Copiar o link de um comentário"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0fb9e2ebde71573e:
    english: Select **Copy link** to copy the comment's unique URL. You can paste the link elsewhere to refer directly to that comment.
    translation: Selecione **Copiar link** para copiar o URL exclusivo do comentário. Você pode colar o link em outro lugar para apontar diretamente para esse comentário.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  04e4537024da788c:
    english: "### View notification history"
    translation: "### Ver o histórico de notificações"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  957677befce0ab3f:
    english: Open the three-dot menu (**⋯**) beside a comment and select **Notification history**.
    translation: Abra o menu de três pontos (**⋯**) ao lado de um comentário e selecione **Histórico de notificações**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fa9d0f2448239944:
    english: "![Notification history in a comment's actions menu](../notifying_people/comment_notification_history.png)"
    translation: "![Histórico de notificações no menu de ações de um comentário](../notifying_people/comment_notification_history.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  30a58d4ef7d80c15:
    english: The notification history shows who was notified about the comment, when the notification was sent, and whether it has been read when that information is available.
    translation: O histórico de notificações mostra quem recebeu uma notificação sobre o comentário, quando ela foi enviada e, quando essa informação está disponível, se foi lida.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4f6ead46c3f9759e:
    english: "![Notification history for a comment mentioning Samira Patel](../notifying_people/comment_notification_example.png)"
    translation: "![Histórico de notificações de um comentário que menciona Samira Patel](../notifying_people/comment_notification_example.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fa2204fb0745dec4:
    english: "### Discard, restore, or delete a comment"
    translation: "### Descartar, restaurar ou deletar um comentário"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  592dfa766814bb8e:
    english: Discarding a comment removes it from the thread but retains it in a trash bin. You can discard your own comments with **Discard** in the three-dot menu. Group admins can also discard comments.
    translation: Ao descartar um comentário, você o remove da conversa, mas ele permanece na lixeira. Para descartar seus próprios comentários, selecione **Descartar** no menu de três pontos. Administradores do grupo também podem descartar comentários.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  670a46d5274f9ab5:
    english: "**Restore a comment**"
    translation: "**Restaurar um comentário**"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9b202a60d5665ac6:
    english: The location of a discarded comment is labelled **Item removed**. Open its three-dot menu and select **Restore**.
    translation: O local de um comentário descartado aparece com o rótulo **Item removido**. Abra o menu de três pontos e selecione **Restaurar**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d6427576dab2b2c5:
    english: "**Delete a comment**"
    translation: "**Deletar um comentário**"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d8b9add122e73295:
    english: Deleting a comment removes it permanently. It cannot be restored.
    translation: Ao deletar um comentário, você o remove permanentemente. Não é possível restaurá-lo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  51f7dce6a0188a51:
    english: If **Members can delete their own comments** is enabled in [Group permissions](/en/user_manual/groups/settings/permissions), members can permanently delete their own discarded comments. Group admins can delete any comment.
    translation: Se a opção **Os membros podem excluir seus próprios comentários** estiver ativada em [Permissões do grupo](/en/user_manual/groups/settings/permissions), os membros poderão deletar permanentemente os próprios comentários descartados. Administradores do grupo podem deletar qualquer comentário.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  63134f860609d669:
    english: Open the three-dot menu on an **Item removed** entry and select **Delete**.
    translation: Abra o menu de três pontos de uma entrada **Item removido** e selecione **Deletar**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  19580f91a59bf5ef:
    english: A confirmation message explains that the comment will be permanently deleted.
    translation: Uma mensagem de confirmação informa que o comentário será deletado permanentemente.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
