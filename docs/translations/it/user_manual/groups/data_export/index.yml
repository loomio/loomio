---
navigation_title: Esportazione dei dati
blocks:
  '053719812e2be1ea':
    english: "# Group data backup or export"
    translation: "# Backup o esportazione dei dati del gruppo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  42721518a91907da:
    english: 'With the group data export feature you can:'
    translation: 'Con la funzione di esportazione dei dati del gruppo puoi:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f978c97e52e0b00a:
    english: |-
      - Download a file containing member data to audit group membership.
      - Download content of your group including text of threads and polls for archive or analysis.
      - Open poll results in a spreadsheet or scripting language.
      - [Print or save PDF's of a thread or poll for archival purposes.](#print-thread-to-pdf)
      - Move your group, including all users, threads, polls, and files to another Loomio server.
    translation: |-
      - Scaricare un file con i dati dei membri per verificare le appartenenze al gruppo.
      - Scaricare i contenuti del gruppo, compresi i testi delle discussioni e dei sondaggi, per archiviarli o analizzarli.
      - Aprire i risultati dei sondaggi in un foglio di calcolo o con un linguaggio di scripting.
      - [Stampare o salvare in PDF una discussione o un sondaggio per archiviarli.](#print-thread-to-pdf)
      - Trasferire il gruppo, con tutti gli utenti, le discussioni, i sondaggi e i file, su un altro server Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  94b3081b62cd0a45:
    english: If you ever want to move from Loomio managed servers [to your own](https://github.com/loomio/loomio), you can use this feature.
    translation: Se vuoi passare dai server gestiti da Loomio [a un server gestito da te](https://github.com/loomio/loomio), puoi usare questa funzione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  223d5690921676c4:
    english: If you're running your own Loomio server, and would rather not anymore, Loomio offer managed hosting in USA, EU and Australia. If you'd like to migrate your group to one of these servers, please [contact us](/contact).
    translation: Se gestisci un server Loomio e preferisci passare a un servizio gestito, Loomio offre hosting negli Stati Uniti, nell'Unione europea e in Australia. Per trasferire il tuo gruppo su uno di questi server, [contattaci](/contact).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cabd4ab01146ea7c:
    english: "[Contact us](/contact) if you would like to transfer your Loomio group from Loomio's global hosted service at loomio.com to one of our regional services; loomio.eu for Europe or loomio.nz for Australia and New Zealand."
    translation: "[Contattaci](/contact) se vuoi trasferire il tuo gruppo dal servizio globale di Loomio su loomio.com a uno dei nostri servizi regionali: loomio.eu per l'Europa o loomio.nz per l'Australia e la Nuova Zelanda."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
