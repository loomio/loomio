---
navigation_title: Сповіщення
blocks:
  3a65b66c581936a1:
    english: "# Notifications"
    translation: "# Сповіщення"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c343eb5a1db968d8:
    english: Notifications help groups maintain momentum by drawing your attention to discussions and decisions that need a response.
    translation: 'Сповіщення допомагають групам підтримувати роботу: вони звертають вашу увагу на обговорення та рішення, які потребують відповіді.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3d7b27f3b9880973:
    english: 'Notifications are often the starting point when you return to Loomio. They let you know when:'
    translation: 'Повернувшись до Loomio, ви часто насамперед переглядаєте сповіщення. Вони повідомляють, коли:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c4aec8fcb9fbc0de:
    english: |-
      - someone mentions you or replies to something you wrote
      - a new discussion is shared with you
      - you are invited or reminded to vote
      - a poll is closing soon
      - an outcome is announced
    translation: |-
      - хтось згадує вас або відповідає на ваше повідомлення
      - з вами діляться новим обговоренням
      - вас запрошують проголосувати або нагадують про голосування
      - опитування незабаром закриється
      - опубліковано висновок
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  792dcad0f81e8cc5:
    english: Loomio's notification settings let you choose how closely you want to follow each group or thread. Notifications remain available in Loomio, so you can review what needs your attention when you are ready.
    translation: У налаштуваннях сповіщень Loomio ви можете вибрати, наскільки уважно стежити за кожною групою чи темою. Сповіщення залишаються в Loomio, тож ви можете переглянути їх, коли матимете час.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '082fae961275aaaf':
    english: "## Two ways to begin"
    translation: "## Два способи почати"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cbea008bb7c0ee02:
    english: 'Most people can start with one of two approaches:'
    translation: 'Більшість людей можуть почати з одного з двох варіантів:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3349bdb53fc33195:
    english: |-
      - **When notified** — receive an email when someone asks for your attention, and include everything else in your daily catch-up. Start here if you are still learning how your group uses Loomio.
      - **Once per day** — set Email to **Catch-up only** and keep your catch-up set to **Every day**. Your notifications and other unread activity will be delivered together in one email.
    translation: |-
      - **Коли буде повідомлено** — отримуйте електронний лист, коли хтось потребує вашої уваги, а решту подій переглядайте в щоденному зведенні. Почніть із цього варіанта, якщо ви ще знайомитеся з тим, як ваша група користується Loomio.
      - **Раз на день** — виберіть для електронної пошти **Тільки надолуження згаяне**, а для зведення залиште **Щодня**. Сповіщення та інші непрочитані події надходитимуть разом в одному листі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  74e84c4946aa3713:
    english: New accounts start with **When notified** and a daily catch-up. This brings mentions, replies, discussions shared with you, invitations and reminders to vote, polls closing soon, and outcomes to your attention as they happen without sending an immediate update about every comment or vote.
    translation: Для нових облікових записів установлено **Коли буде повідомлено** та щоденне зведення. Ви дізнаватиметеся про згадки, відповіді, обговорення, якими з вами поділилися, запрошення та нагадування проголосувати, опитування, що незабаром закриються, і висновки в міру їх появи. При цьому ви не отримуватимете окремий лист про кожен коментар чи голос.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  896722cbb87e98be:
    english: If you would rather receive your Loomio notifications all at once, move to the once-per-day approach. You can change this later as your pattern of work changes.
    translation: Якщо ви хочете отримувати всі сповіщення Loomio разом, виберіть варіант раз на день. Згодом ви зможете змінити його відповідно до свого робочого ритму.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e2c60724226ad68a:
    english: For a group or thread that you want to follow more closely, choose **All activity** to receive every update as it happens.
    translation: Щоб уважніше стежити за групою чи темою, виберіть **Вся активність**. Так ви отримуватимете кожне оновлення в міру його появи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  91fd24c60a6a84ee:
    english: These defaults apply when you join a group. Threads initially inherit the settings of their group, but you can follow an important thread more closely or reduce its notifications without changing the rest of the group.
    translation: Ці налаштування за замовчуванням застосовуються, коли ви приєднуєтеся до групи. Спочатку теми успадковують налаштування групи, але ви можете уважніше стежити за важливою темою або зменшити кількість сповіщень про неї, не змінюючи налаштувань решти групи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a75df26cfc4e6614:
    english: "## Notifications in Loomio"
    translation: "## Сповіщення в Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9286edc0ac459625:
    english: The bell icon in the top-right is where notifications are accessed within the app; a number shows how many notifications you have yet to read.
    translation: Щоб переглянути сповіщення в Loomio, натисніть значок дзвоника вгорі праворуч. Число біля нього показує кількість непрочитаних сповіщень.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bfacf52b815e1252:
    english: Select a notification to open the related discussion or poll.
    translation: Виберіть сповіщення, щоб відкрити пов’язане обговорення чи опитування.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b7ed6a5c5c661d60:
    english: "## Catch-up"
    translation: "## Зведення"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fc61461d684c5b47:
    english: The catch-up provides a regular overview of activity without requiring you to follow each group throughout the day.
    translation: Зведення дає змогу регулярно переглядати події, не стежачи за кожною групою протягом дня.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9e519b17a3847cee:
    english: It shows your unseen notifications first, followed by unread discussions and standalone polls grouped by group. Notifications provide linked summaries of activity that needs your attention, while the unread section includes the discussion, poll, comment, vote, and edit details. Direct discussions and threads you have joined as a guest are included when they contain unread activity.
    translation: Спочатку в ньому показано непереглянуті сповіщення, а потім — непрочитані обговорення та окремі опитування, згруповані за групами. Сповіщення містять посилання й короткий опис подій, які потребують вашої уваги. У розділі непрочитаного наведено подробиці обговорень, опитувань, коментарів, голосів і змін. Прямі обговорення та теми, до яких ви приєдналися як гість, також потрапляють до зведення, якщо в них є непрочитані події.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  00703333f277e3c0:
    english: You can turn on **Follow updates** on an open Group that you have not joined. Unread discussions and polls from that Group are then included in your catch-up at your existing schedule. Reading the threads or marking the catch-up as read updates their read status in the same way as threads from Groups you belong to. Turn off **Follow updates** on the Group page to stop including them.
    translation: Для відкритої групи, до якої ви не приєдналися, можна ввімкнути **Слідкуйте за оновленнями**. Тоді непрочитані обговорення й опитування цієї групи потраплятимуть до вашого зведення за чинним розкладом. Коли ви читаєте теми або позначаєте зведення як прочитане, їхній стан прочитання оновлюється так само, як для тем груп, до яких ви належите. Щоб більше не включати їх до зведення, вимкніть **Слідкуйте за оновленнями** на сторінці групи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fcac102a70f7ee7f:
    english: Loomio does not send a catch-up when there are no unseen notifications or unread threads from the relevant period.
    translation: Loomio не надсилає зведення, якщо за відповідний період немає непереглянутих сповіщень або непрочитаних тем.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  888011209ac583be:
    english: "![A catch-up with unseen notifications and unread thread activity from one group](digest_email_example.png)"
    translation: "![Зведення з непереглянутими сповіщеннями та непрочитаними подіями в темах однієї групи](digest_email_example.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7d80cf08a383f6bd:
    english: "### Choose your catch-up schedule"
    translation: "### Виберіть розклад зведень"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  677863d68136156b:
    english: Open **Notification settings** from your user menu to choose how often you receive a catch-up.
    translation: Відкрийте **Налаштування сповіщень** у меню користувача, щоб вибрати, як часто отримувати зведення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7c0dece94210f807:
    english: The **Unsubscribe** link in a catch-up email opens a catch-up schedule form. The email link authorizes that form, so you can change or stop catch-up emails without signing in. The full **Notification settings** page in Loomio remains available when you sign in.
    translation: Посилання **Відписатися** в листі зі зведенням відкриває форму налаштування розкладу. Посилання з листа надає доступ до цієї форми, тому ви можете змінити розклад або припинити отримувати зведення без входу в обліковий запис. Повна сторінка **Налаштування сповіщень** у Loomio доступна після входу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  da5740fd6dbd5737:
    english: "![Notification settings in the user menu](sidebar_notification_settings.png)"
    translation: "![Налаштування сповіщень у меню користувача](sidebar_notification_settings.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  58af77d870a877e2:
    english: 'New accounts start with a daily catch-up. The available schedules are:'
    translation: 'Нові облікові записи отримують зведення щодня. Доступні такі варіанти розкладу:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b0fe04b2b5284253:
    english: |-
      - **Never** to turn off the catch-up
      - **Every day** for activity from approximately the previous 24 hours
      - **Every second day** for activity from approximately the previous two days
      - a weekday to receive a weekly catch-up on that day
    translation: |-
      - **Ніколи** — вимкнути зведення
      - **Щодня** — отримувати події приблизно за попередні 24 години
      - **Через день** — отримувати події приблизно за попередні два дні
      - вибраний день тижня — отримувати щотижневе зведення цього дня
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a23935f518dd15cb:
    english: The catch-up is sent in the morning according to the time zone in your Loomio profile.
    translation: Зведення надсилається вранці за часовим поясом, указаним у вашому профілі Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b214c0634763fb51:
    english: "![Catch-up schedule setting](digest_email_setting.png)"
    translation: "![Налаштування розкладу зведень](digest_email_setting.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  efbcecfe827438a5:
    english: "### Mark a catch-up as read"
    translation: "### Позначте зведення як прочитане"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2b764b73f48d3185:
    english: Select **Mark catch-up as read** to mark its notifications and topic activity as read in Loomio. Opening or previewing the catch-up does not mark anything as read.
    translation: Виберіть **Позначити дочитане як прочитане**, щоб позначити сповіщення та події в темах зі зведення як прочитані в Loomio. Якщо ви відкриєте або попередньо переглянете зведення, нічого не буде позначено як прочитане.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  81ffa4a869f82451:
    english: A catch-up is not specific to one discussion, so do not reply to it. Open a discussion or poll from the catch-up before commenting or replying.
    translation: Зведення не стосується одного обговорення, тому не відповідайте на нього. Щоб залишити коментар або відповідь, спочатку відкрийте обговорення чи опитування зі зведення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f7dfee93901e5eea:
    english: "## Group and thread notification settings"
    translation: "## Налаштування сповіщень для груп і тем"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  31be594005b6bcfc:
    english: You can choose how closely to follow each group and thread. These settings belong to you; group administrators cannot change them.
    translation: Ви можете вибрати, наскільки уважно стежити за кожною групою та темою. Це ваші налаштування; адміністратори груп не можуть їх змінювати.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6c9a762b18c9f92d:
    english: Change your defaults for groups you join from **Notification settings** in your user menu. You can then override the default for a particular group or thread. A thread override changes only that thread and does not affect the rest of its group.
    translation: Змініть налаштування за замовчуванням для груп, до яких ви приєднуєтеся, через **Налаштування сповіщень** у меню користувача. Потім ви можете встановити окремі налаштування для певної групи чи теми. Налаштування окремої теми стосується лише її та не впливає на решту групи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f4b6aa6eab1beb2b:
    english: "### Group notification settings"
    translation: "### Налаштування сповіщень для групи"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  977289761daba9db:
    english: 'To change the notification setting for a group:'
    translation: 'Щоб змінити налаштування сповіщень для групи:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d78d13409c481c71:
    english: |-
      1. Open the group page.
      2. Open the notification settings for the group.
    translation: |-
      1. Відкрийте сторінку групи.
      2. Відкрийте налаштування сповіщень для групи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  02116f695da0a946:
    english: "![Notification settings on a group page](group_notifications.png)"
    translation: "![Налаштування сповіщень на сторінці групи](group_notifications.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8ce50d3418e2d9fa:
    english: The form asks **How do you want to stay updated?** Choose **Catch-up only**, **When notified**, or **All activity**. If your catch-up is set to **Never**, **Catch-up only** is replaced by **No email updates** or **No push updates**.
    translation: У формі є запитання **Як ви хочете бути в курсі подій?** Виберіть **Тільки надолуження згаяне**, **Коли буде повідомлено** або **Вся активність**. Якщо для зведення вибрано **Ніколи**, замість **Тільки надолуження згаяне** з’явиться **Немає оновлень електронною поштою** або **Немає push-оновлень**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  24db74c2c82737eb:
    english: Select **Apply to all groups** to use the same setting for all of your groups.
    translation: Виберіть **Застосувати до всіх груп**, щоб використовувати однакові налаштування для всіх ваших груп.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  54cd6a8eac96e073:
    english: "![Group notification settings](group_notification_settings.png)"
    translation: "![Налаштування сповіщень для групи](group_notification_settings.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d0ab43e865282241:
    english: "### Thread notification settings"
    translation: "### Налаштування сповіщень про теми"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f61284373b7afc42:
    english: To change notification settings for an individual thread, open the notification control in the thread sidebar.
    translation: Щоб змінити налаштування сповіщень для окремої теми, відкрийте керування сповіщеннями на бічній панелі теми.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b329b8421ab5d4f8:
    english: "![The notification control in a thread](thread_subscribe.png)"
    translation: "![Керування сповіщеннями в темі](thread_subscribe.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  226c5e321d735005:
    english: "![Thread notification settings](thread_notifications.png)"
    translation: "![Налаштування сповіщень про теми](thread_notifications.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3178b3b456acd783:
    english: Thread notification settings use the same **Catch-up only**, **When notified**, and **All activity** choices. A thread setting overrides the group setting for that thread.
    translation: 'Для сповіщень про тему доступні ті самі варіанти: **Тільки надолуження згаяне**, **Коли буде повідомлено** і **Вся активність**. Налаштування теми замінює налаштування групи для цієї теми.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f53fa37c98c9b747:
    english: |-
      >[!Note]
      >The changes in **Thread notification settings** apply only to the thread you have open. Select **Change notifications for group** to change the setting inherited by the group's other threads.
    translation: |-
      >[!Note]
      >Зміни в **Налаштування сповіщень про теми** стосуються лише відкритої теми. Виберіть **Змінити сповіщення для групи**, щоб змінити налаштування, які успадковують інші теми цієї групи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  99a0923cdcdc1cdf:
    english: "## Email delivery"
    translation: "## Доставка електронною поштою"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6cf70b2dc7cdbf83:
    english: By default, Loomio sends an email when you are notified. Depending on your group and thread notification settings, this can include mentions, replies, discussions shared with you, invitations and reminders to vote, outcomes, and polls closing soon. Choose **All activity** to also receive emails about every new comment, vote, thread, poll, and outcome.
    translation: За замовчуванням Loomio надсилає електронний лист, коли ви отримуєте сповіщення. Залежно від налаштувань групи й теми це можуть бути згадки про вас, відповіді вам, обговорення, якими з вами поділилися, запрошення та нагадування проголосувати, висновки й опитування, що незабаром закриються. Виберіть **Вся активність**, щоб також отримувати листи про кожен новий коментар, голос, тему, опитування та висновок.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ce2919b895be45b3:
    english: The **Unsubscribe** link in a notification email opens settings for that thread or group, including emails sent because someone mentioned you or replied to you. That form shows your current catch-up schedule for all groups and links to the catch-up email settings. These email links authorize only their own settings forms; they do not sign you in to Loomio.
    translation: Посилання **Відписатися** в листі зі сповіщенням відкриває налаштування відповідної теми або групи. Це стосується й листів про згадки та відповіді вам. У формі показано ваш поточний розклад листів зі зведенням для всіх груп і посилання на його налаштування. Ці посилання з листів надають доступ лише до відповідних форм налаштувань. Вони не виконують вхід у Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d615e84f882a2728:
    english: When a discussion email says that replies are accepted, you can reply directly from your email and your message will be posted into the Loomio discussion.
    translation: Якщо в листі про обговорення зазначено, що відповіді приймаються, ви можете відповісти на нього електронною поштою. Ваше повідомлення з’явиться в обговоренні Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5b4ce168b24bc44a:
    english: Poll invitation emails show the poll and its response options, but selecting an option opens Loomio in your browser to complete the vote. You may need to sign in or confirm your account. The catch-up cannot accept replies; open the linked discussion or poll first.
    translation: У листах із запрошенням до опитування показано опитування та варіанти відповіді. Коли ви виберете варіант, Loomio відкриється в браузері, де можна завершити голосування. Можливо, вам доведеться увійти або підтвердити свій обліковий запис. На лист зі зведенням відповісти не можна. Спочатку відкрийте обговорення або опитування за посиланням.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0c2b2867a1ace598:
    english: "![A proposal invitation email with response options and the related thread](proposal_invitation_email.png)"
    translation: "![Лист із запрошенням проголосувати за пропозицію, варіантами відповіді та пов’язаною темою](proposal_invitation_email.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a73508aa897d96cf:
    english: "## Enable mobile notifications with web push"
    translation: "## Увімкнення мобільних сповіщень через web push"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f4b14a4ba068b670:
    english: Web push is how Loomio delivers mobile notifications today. It can notify you about Loomio activity on your phone when Loomio is not open.
    translation: Loomio доставляє мобільні сповіщення через web push. Так ви можете отримувати сповіщення про активність у Loomio на телефоні, навіть коли Loomio не відкрито.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  811ee794dea12cd3:
    english: On Android, open **Notification settings** in a supported browser and enable push. On an iPhone or iPad, first open Loomio in Safari, use **Share** then **Add to Home Screen**, open Loomio from the new Home Screen icon, and enable push from there. Select **Test connection** to verify delivery to every browser listed under **Enabled browsers**.
    translation: На Android відкрийте **Налаштування сповіщень** у підтримуваному браузері та увімкніть push-сповіщення. На iPhone або iPad спочатку відкрийте Loomio в Safari, виберіть **Поширити**, а потім **Додати на головний екран**. Відкрийте Loomio з нової іконки на головному екрані та увімкніть push-сповіщення. Виберіть **Тестове підключення**, щоб перевірити доставку до кожного браузера в розділі **Увімкнені браузери**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  72f0707b2d67bf0e:
    english: Web push also works in supported desktop browsers. Enable it there if you want Loomio notifications on your computer.
    translation: Web push також працює в підтримуваних браузерах на комп’ютері. Увімкніть його там, якщо хочете отримувати сповіщення Loomio на комп’ютері.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fea7dbef040ae7f5:
    english: Once push is enabled in at least one browser, group and thread notification forms let you choose **Email**, **Push**, or **Email and push**. Email and push can use different notification settings. Push delivery can be delayed by the browser, operating system, or network connection.
    translation: Після ввімкнення push-сповіщень хоча б в одному браузері у формах налаштування сповіщень для груп і тем можна вибрати **Електронна пошта**, **Push** або **Електронна пошта та push-повідомлення**. Для електронної пошти й push-сповіщень можна встановити різні налаштування. Браузер, операційна система або мережеве з’єднання можуть затримувати доставку push-сповіщень.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  210e15dcdff781ce:
    english: "![Push notification settings and enabled browsers](push_notification_settings.png)"
    translation: "![Налаштування push-сповіщень та увімкнені браузери](push_notification_settings.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  37e2be2c73fbb06d:
    english: "## Turn off external notifications"
    translation: "## Вимкнення зовнішніх сповіщень"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5e3d442fa885bcd4:
    english: To stop email and push messages for group and thread activity, open **Notification settings** from your user menu, set the catch-up to **Never**, and choose **No email updates** and **No push updates**. Notifications and activity remain available when you open Loomio.
    translation: Щоб припинити отримувати електронні листи та push-сповіщення про активність у групах і темах, відкрийте **Налаштування сповіщень** у меню користувача, встановіть для листів зі зведенням значення **Ніколи** та виберіть **Немає оновлень електронною поштою** і **Немає push-оновлень**. Сповіщення та активність залишаться доступними, коли ви відкриєте Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  54bd12aaa8a9ed58:
    english: "![Set the catch-up to Never](turn_off_all_emails_1.png)"
    translation: "![Встановіть для листів зі зведенням значення «Ніколи»](turn_off_all_emails_1.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  92738bb4c71f0229:
    english: "![Turn off updates for groups](turn_off_all_emails_2.png)"
    translation: "![Вимкніть оновлення для груп](turn_off_all_emails_2.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
