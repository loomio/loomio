---
navigation_title: Benutzer-API
blocks:
  0217b93dddc627ac:
    english: "# Loomio User API documentation"
    translation: "# Dokumentation der Loomio-Benutzer-API"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bc6fcbf5f783fd29:
    english: "<!-- seo-description: Use the Loomio User API to create and manage discussions, comments, polls, threads, and group memberships from other software. -->"
    translation: "<!-- seo-description: Mit der Loomio-Benutzer-API kannst du Diskussionen, Kommentare, Abstimmungen, Threads und Gruppenmitgliedschaften aus anderer Software heraus erstellen und verwalten. -->"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cc2da08540808ada:
    english: "`/api/b2` is the user-oriented API for integrations with Loomio. It uses the API key of a user account, and every action is performed as that user."
    translation: "`/api/b2` ist die API für Integrationen, die im Namen eines Loomio-Benutzerkontos handeln. Sie verwendet dessen API-Schlüssel. Jede Aktion wird als dieser Benutzer ausgeführt."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7036a6661aac00f2:
    english: Group operations use the memberships and group permissions of the API-key user. Instance-administrator status does not expand an API key's access to groups or content; use the Server API for instance-level administration.
    translation: Für Aktionen in Gruppen gelten die Mitgliedschaften und Gruppenberechtigungen des Benutzers, dessen API-Schlüssel verwendet wird. Administratorrechte für die Instanz erweitern den Zugriff des API-Schlüssels auf Gruppen oder Inhalte nicht. Verwende für die Verwaltung der Instanz die Server-API.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c4436493b062b9f1:
    english: Use the API key from the Loomio user account that will perform the actions. A dedicated bot account is useful when an integration should not be invited to polls or receive notifications.
    translation: Verwende den API-Schlüssel des Loomio-Benutzerkontos, das die Aktionen ausführen soll. Ein eigenes Bot-Konto ist sinnvoll, wenn die Integration keine Einladungen zu Abstimmungen oder Benachrichtigungen erhalten soll.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ade21c593f08100c:
    english: Signed-in users can find their API key and group IDs on the [API access page](/profile/api_access).
    translation: Angemeldete Benutzer finden ihren API-Schlüssel und ihre Gruppen-IDs auf der [Seite für den API-Zugriff](/profile/api_access).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  15160edafaf441c1:
    english: 'Send the API key in an `Authorization: Bearer` header. API keys in query strings are rejected because URLs can be recorded by proxies and access logs.'
    translation: 'Sende den API-Schlüssel im Header `Authorization: Bearer`. API-Schlüssel in URL-Abfrageparametern werden abgewiesen, da URLs von Proxys und in Zugriffsprotokollen gespeichert werden können.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2215e57186277325:
    english: "### Authentication change"
    translation: "### Änderung bei der Authentifizierung"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ff5f4c1055e80fb6:
    english: 'The API key was previously accepted as an `api_key` URL parameter. Requests using `?api_key=YOUR_API_KEY` no longer work. Use the HTTP `Authorization` header instead:'
    translation: 'Früher wurde der API-Schlüssel als URL-Parameter `api_key` akzeptiert. Anfragen mit `?api_key=YOUR_API_KEY` funktionieren nicht mehr. Verwende stattdessen den HTTP-Header `Authorization`:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  65574ba500243c80:
    english: The examples use `YOUR_API_KEY`, group ID `123`, and `https://www.loomio.com/`. Replace these with your API key, group ID, and Loomio installation URL.
    translation: Die Beispiele verwenden `YOUR_API_KEY`, die Gruppen-ID `123` und `https://www.loomio.com/`. Ersetze sie durch deinen API-Schlüssel, deine Gruppen-ID und die URL deiner Loomio-Installation.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bec1e4f30aeef4ce:
    english: "## Response size and related records"
    translation: "## Größe der Antworten und verknüpfte Datensätze"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  da004eb4e005fae1:
    english: 'User API responses use a compound format: the primary records are accompanied by related records such as topics, groups, users, polls, and reactions. This lets a client populate a local record store from one request, but can include more data than a simple integration needs.'
    translation: 'Antworten der Benutzer-API haben ein zusammengesetztes Format: Neben den angeforderten Datensätzen enthalten sie verknüpfte Datensätze wie Topics, Gruppen, Benutzer, Abstimmungen und Reaktionen. So kann ein Client seinen lokalen Datenspeicher mit einer einzigen Anfrage füllen. Die Antwort kann dadurch aber mehr Daten enthalten, als eine einfache Integration benötigt.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  64d9a631b54cbaba:
    english: Pass `compact=1` to omit bulky related topics, groups, parent groups, memberships, reactions, tags, and translations. Primary records and the related records needed to interpret their content remain present.
    translation: Mit `compact=1` lässt du umfangreiche verknüpfte Topics, Gruppen, übergeordnete Gruppen, Mitgliedschaften, Reaktionen, Schlagwörter und Übersetzungen weg. Die angeforderten Datensätze und die zum Verständnis ihrer Inhalte benötigten verknüpften Datensätze bleiben erhalten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e4e671db39dbe6f1:
    english: For direct control, pass `exclude_types` with space-separated singular record types. For example, `exclude_types=group reaction` omits related groups and reactions. Common values are `topic`, `group`, `parent`, `membership`, `reaction`, `tag`, `translation`, `user`, `discussion`, `poll`, `poll_option`, `stance`, `stance_choice`, `outcome`, and `topic_item`. Exclusions apply to related records, not the primary resource requested by the endpoint.
    translation: Mit `exclude_types` kannst du gezielt Datensatztypen ausschließen. Gib dazu die Typen im Singular durch Leerzeichen getrennt an. Beispielsweise lässt `exclude_types=group reaction` verknüpfte Gruppen und Reaktionen weg. Häufige Werte sind `topic`, `group`, `parent`, `membership`, `reaction`, `tag`, `translation`, `user`, `discussion`, `poll`, `poll_option`, `stance`, `stance_choice`, `outcome` und `topic_item`. Der Ausschluss betrifft verknüpfte Datensätze, nicht die vom Endpunkt angeforderte Hauptressource.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ded075da3c2aa815:
    english: Collection responses include `meta.total` when an exact collection size is defined. The total is calculated before `limit` and `offset` are applied. Endpoints such as search that intentionally return a bounded result set omit `meta.total` rather than returning `null`.
    translation: Antworten auf Sammlungsanfragen enthalten `meta.total`, wenn eine genaue Anzahl definiert ist. Die Anzahl wird vor der Anwendung von `limit` und `offset` berechnet. Endpunkte wie die Suche, die ihre Ergebnismenge bewusst begrenzen, lassen `meta.total` weg, statt `null` zurückzugeben.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  17cb8ef90a2acdb3:
    english: "## Endpoint summary"
    translation: "## Übersicht der Endpunkte"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  608edb13080e57c2:
    english: |-
      | Method | Endpoint | Purpose |
      | --- | --- | --- |
      | `GET` | `/api/b2/groups` | List the API-key user's groups |
      | `GET` | `/api/b2/groups/:id_or_key_or_handle` | Get a visible group |
      | `GET` | `/api/b2/reports` | Generate a participation report |
      | `GET` | `/api/b2/search` | Search visible discussions, comments, polls, votes, and outcomes |
      | `POST` | `/api/b2/discussions` | Create a discussion |
      | `GET` | `/api/b2/discussions/:id` | Get a discussion |
      | `GET` | `/api/b2/discussions` | List discussions in a group |
      | `PATCH` | `/api/b2/discussions/:id` | Edit a discussion |
      | `DELETE` | `/api/b2/discussions/:id` | Soft-delete a discussion |
      | `GET` | `/api/b2/threads` | List visible discussion and standalone-poll threads |
      | `GET` | `/api/b2/threads/:topic_id` | Get a thread |
      | `GET` | `/api/b2/threads/:topic_id/items` | Get the ordered items in a thread |
      | `GET` | `/api/b2/threads/:topic_id/markdown` | Get a complete thread as Markdown |
      | `POST` | `/api/b2/comments` | Create a comment or reply |
      | `PATCH` | `/api/b2/comments/:id` | Edit a comment |
      | `DELETE` | `/api/b2/comments/:id` | Soft-delete a comment |
      | `POST` | `/api/b2/polls` | Create a poll |
      | `GET` | `/api/b2/polls/:id` | Get a poll |
      | `GET` | `/api/b2/polls` | List polls in a group |
      | `PATCH` | `/api/b2/polls/:id` | Edit a poll |
      | `DELETE` | `/api/b2/polls/:id` | Soft-delete a poll |
      | `GET` | `/api/b2/memberships` | List a group's memberships |
      | `POST` | `/api/b2/memberships` | Add members and optionally remove absent members |
      | `GET` | `/api/b2/chatbots` | List a group's chat integrations and webhooks |
      | `POST` | `/api/b2/chatbots` | Create a chat integration or webhook |
      | `PATCH` | `/api/b2/chatbots/:id` | Update a chat integration or webhook |
      | `DELETE` | `/api/b2/chatbots/:id` | Delete a chat integration or webhook |
      | `POST` | `/api/b2/chatbots/check` | Send a webhook connection test |
    translation: |-
      | Methode | Endpunkt | Zweck |
      | --- | --- | --- |
      | `GET` | `/api/b2/groups` | Gruppen des API-Schlüssel-Benutzers auflisten |
      | `GET` | `/api/b2/groups/:id_or_key_or_handle` | Eine sichtbare Gruppe abrufen |
      | `GET` | `/api/b2/reports` | Einen Beteiligungsbericht erstellen |
      | `GET` | `/api/b2/search` | Sichtbare Diskussionen, Kommentare, Abstimmungen, Stimmen und Fazits durchsuchen |
      | `POST` | `/api/b2/discussions` | Eine Diskussion erstellen |
      | `GET` | `/api/b2/discussions/:id` | Eine Diskussion abrufen |
      | `GET` | `/api/b2/discussions` | Diskussionen in einer Gruppe auflisten |
      | `PATCH` | `/api/b2/discussions/:id` | Eine Diskussion bearbeiten |
      | `DELETE` | `/api/b2/discussions/:id` | Eine Diskussion vorläufig löschen |
      | `GET` | `/api/b2/threads` | Sichtbare Threads von Diskussionen und eigenständigen Abstimmungen auflisten |
      | `GET` | `/api/b2/threads/:topic_id` | Einen Thread abrufen |
      | `GET` | `/api/b2/threads/:topic_id/items` | Die Einträge eines Threads in ihrer Reihenfolge abrufen |
      | `GET` | `/api/b2/threads/:topic_id/markdown` | Einen vollständigen Thread als Markdown abrufen |
      | `POST` | `/api/b2/comments` | Einen Kommentar oder eine Antwort erstellen |
      | `PATCH` | `/api/b2/comments/:id` | Einen Kommentar bearbeiten |
      | `DELETE` | `/api/b2/comments/:id` | Einen Kommentar vorläufig löschen |
      | `POST` | `/api/b2/polls` | Eine Abstimmung erstellen |
      | `GET` | `/api/b2/polls/:id` | Eine Abstimmung abrufen |
      | `GET` | `/api/b2/polls` | Abstimmungen in einer Gruppe auflisten |
      | `PATCH` | `/api/b2/polls/:id` | Eine Abstimmung bearbeiten |
      | `DELETE` | `/api/b2/polls/:id` | Eine Abstimmung vorläufig löschen |
      | `GET` | `/api/b2/memberships` | Mitgliedschaften einer Gruppe auflisten |
      | `POST` | `/api/b2/memberships` | Mitglieder hinzufügen und optional nicht aufgeführte Mitglieder entfernen |
      | `GET` | `/api/b2/chatbots` | Chat-Integrationen und Webhooks einer Gruppe auflisten |
      | `POST` | `/api/b2/chatbots` | Eine Chat-Integration oder einen Webhook erstellen |
      | `PATCH` | `/api/b2/chatbots/:id` | Eine Chat-Integration oder einen Webhook aktualisieren |
      | `DELETE` | `/api/b2/chatbots/:id` | Eine Chat-Integration oder einen Webhook löschen |
      | `POST` | `/api/b2/chatbots/check` | Eine Testnachricht zur Prüfung der Webhook-Verbindung senden |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
