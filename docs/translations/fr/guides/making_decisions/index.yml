  b27fab33a1dd5176:
    english: 'These guides explain complete decision processes: how to frame a decision, involve the right people, use discussion and proposals, respond to concerns, and record an outcome.'
    translation: 'Ces guides présentent des processus de décision complets : définir la décision à prendre, faire participer les bonnes personnes, utiliser les discussions et les propositions, répondre aux préoccupations et consigner une conclusion.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bcbe5e3fd75700a6:
    english: They are different from the proposal-template pages. A [proposal template](/en/user_manual/polls/proposals/) explains one proposal and its response options. A decision process can use several proposals over time.
    translation: Ils se distinguent des pages consacrées aux modèles de proposition. Un [modèle de proposition](/en/user_manual/polls/proposals/) décrit une proposition et ses options de réponse. Un processus de décision peut utiliser plusieurs propositions au fil du temps.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  af00d65d38e41f8b:
    english: "## Choose a process"
    translation: "## Choisir un processus"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f41e345421a1a1e8:
    english: |-
      | Process | Who decides? | Main question |
      |---|---|---|
      | [Simple decision process](simple_decision_process) | Defined by the group | How can we discuss, test, and decide? |
      | [Advice process](advice_process) | A person or delegated team | What advice should the decision maker consider? |
      | [Consent process](consent_process) | The group | Is the proposal safe to try without a meaningful objection? |
      | [Consensus process](consensus_process) | The group | Can we reach collective agreement? |
    translation: |-
      | Processus | Qui décide ? | Question principale |
      |---|---|---|
      | [Processus de décision simple](simple_decision_process) | Selon les règles du groupe | Comment discuter, mettre une proposition à l’épreuve et décider ? |
      | [Processus consultatif](advice_process) | Une personne ou une équipe désignée | Quels avis la personne qui décide doit-elle prendre en compte ? |
      | [Processus par consentement](consent_process) | Le groupe | Peut-on essayer la proposition sans objection majeure ? |
      | [Processus par consensus](consensus_process) | Le groupe | Pouvons-nous parvenir à un accord collectif ? |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d2843889568043c0:
    english: Use the process required by your group's governing rules or decision policy. Different kinds of decisions may use different processes.
    translation: Utilisez le processus prévu par les règles de gouvernance ou la politique de décision de votre groupe. Différents types de décisions peuvent suivre différents processus.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bb120914edd79d13:
    english: If you only need help choosing a response format, compare [Proposals](/en/user_manual/polls/proposals/) and [Polls](/en/user_manual/polls/proposal_types/). If you administer the reusable choices shown when someone selects **Start a vote**, see [Poll templates](/en/user_manual/polls/poll_templates/).
    translation: Si vous avez seulement besoin d’aide pour choisir un format de réponse, comparez les [Propositions](/en/user_manual/polls/proposals/) et les [Sondages](/en/user_manual/polls/proposal_types/). Si vous gérez les choix réutilisables proposés lorsqu’une personne sélectionne **Lancer un vote**, consultez les [Modèles de sondage](/en/user_manual/polls/poll_templates/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
