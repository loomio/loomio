  2df60ea964109f11:
    english: "## Group data is permanently deleted after 90 days"
    translation: "## Ryhmän tiedot poistetaan pysyvästi 90 päivän kuluttua"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e09923078301b8d:
    english: After 90 days, all the threads, polls, files and other group content will be permanently deleted. ***This is non-reversible!***
    translation: Kaikki keskusteluketjut, kyselyt, tiedostot ja muu ryhmän sisältö poistetaan pysyvästi 90 päivän kuluttua. ***Poistamista ei voi perua.***
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8695a5ebfb09611d:
    english: We recommend that you [export the group data](/en/user_manual/groups/data_export/)and manually download any important files you have uploaded before you continue.
    translation: Suosittelemme, että [viet ryhmän tiedot](/en/user_manual/groups/data_export/)ja lataat käsin kaikki tärkeät tiedostot, jotka olet ladannut ryhmään, ennen kuin jatkat.
    status: machine
