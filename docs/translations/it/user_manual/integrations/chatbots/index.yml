  e21550bf41c185b9:
    english: |-
      ## Generate a Webhook URL
      We've prepared step by step walk-throughs for each service we support. Follow the right one for your service to obtain the webhook URL you'll need to add the chat integration in Loomio.
    translation: |-
      ## Genera un URL webhook
      Abbiamo preparato istruzioni dettagliate per ogni servizio supportato. Segui quelle del servizio che usi per ottenere l'URL webhook necessario ad aggiungere l'integrazione di chat in Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
