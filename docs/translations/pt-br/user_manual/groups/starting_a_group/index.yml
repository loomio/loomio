  e8632dbb628c7c7d:
    english: "# Starting a new group"
    translation: "# Criar um novo grupo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2a4a6907d4e2049d:
    english: If you are new to Loomio, you can start a group on a free trial at any time from the [Loomio website](https://www.loomio.com/). If you already use Loomio and would like to start a new group for another organization or purpose, you can do this from the sidebar menu - click on **New group**.
    translation: Se você ainda não usa o Loomio, pode criar um grupo a qualquer momento durante um período de teste gratuito pelo [site do Loomio](https://www.loomio.com/). Se você já usa o Loomio e quer criar um grupo para outra organização ou finalidade, clique em **Novo grupo** no menu lateral.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  10e8756c96038e58:
    english: For many organizations, a single Loomio group is sufficient. You can start as many subgroups as you need within the group. See [Subgroups](/en/user_manual/groups/subgroups/) for more info.
    translation: Para muitas organizações, um único grupo no Loomio é suficiente. Você pode criar quantos subgrupos precisar dentro dele. Veja [Subgrupos](/en/user_manual/groups/subgroups/) para saber mais.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ed00dbe94cd53435:
    english: "## Group details"
    translation: "## Detalhes do grupo"
    status: machine
    provider: codex/gpt-6-sol
