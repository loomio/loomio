  9cfb3b7835dc5cb0:
    english: If some members of your group should have voting rights while others should not, you can use the "Make delegate" feature to identify those people with voting rights. There is a corresponding "Revoke delegate" action too.
    translation: Se algumas pessoas do seu grupo devem ter direito a voto e outras não, use **Fazer delegado** para identificar quem pode votar. Você também pode usar **Revogar delegado** para retirar esse direito.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e017eafb51368777:
    english: Use delegates when people should share the same discussion space but only a defined set, such as directors or elected representatives, may vote. This is usually simpler than maintaining a second subgroup whose only purpose is to separate voters from non-voters.
    translation: Use delegados quando as pessoas devem compartilhar o mesmo espaço de discussão, mas apenas um grupo definido, como diretores ou representantes eleitos, pode votar. Em geral, isso é mais simples do que manter um segundo subgrupo apenas para separar quem pode votar de quem não pode.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1942a47ae47ca813:
    english: Use a private subgroup instead when its members also need discussions, files, or membership information that other members must not see.
    translation: Use um subgrupo privado se seus membros também precisarem de discussões, arquivos ou informações sobre os membros que outras pessoas do grupo não devem ver.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
