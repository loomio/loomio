  a63a4be4a45bcfdb:
    english: If you decide later that you want the integration to receive automatic notifications, return to its settings and select the relevant events.
    translation: Si más adelante quieres que la integración reciba notificaciones automáticas, vuelve a su configuración y selecciona los eventos correspondientes.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f1d9c09f9d3c2a82:
    english: "### Invite to poll"
    translation: "### Invitar a votar"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cbc7b5fd5afcc24c:
    english: |-
      This is how to send a notification to your chatroom inviting people to vote in a proposal.
      It's the same process for Share outcome, Invite to thread, Remind to vote, Poll edited etc.
    translation: |-
      Así puedes enviar una notificación a tu sala de chat para invitar a las personas a votar en una propuesta.
      El proceso es el mismo para compartir una conclusión, invitar a un hilo, recordar que se puede votar o notificar que se ha editado un sondeo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  290001bb97dee010:
    english: |-
      ### Automatic notifications
      To send a notification whenever a specific event happens, edit the chat integration and select that event.
    translation: |-
      ### Notificaciones automáticas
      Para enviar una notificación cada vez que ocurra un evento concreto, edita la integración de chat y selecciona ese evento.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
