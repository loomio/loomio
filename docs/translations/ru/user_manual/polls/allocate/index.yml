---
navigation_title: Распределение баллов
blocks:
  343675f0497d460a:
    english: "# Allocate"
    translation: "# Распределение баллов"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  46dd27ee2e2fb992:
    english: Allocate, sometimes known as a dot vote, reveals priorities when there are trade-offs. Each participant receives a fixed budget of points and distributes it across the options. Giving more to one option leaves fewer points for the others.
    translation: Распределение баллов, также известное как точечное голосование, помогает определить приоритеты, когда приходится выбирать между вариантами. Каждый участник получает фиксированное количество баллов и распределяет их между вариантами. Чем больше баллов отдано одному варианту, тем меньше остаётся для других.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c6d05c5ec2a695d2:
    english: "## When to use Allocate"
    translation: "## Когда использовать распределение баллов"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f5b2c4377aea5079:
    english: 'Use Allocate when time, money, attention, or another resource is limited. It works well for:'
    translation: 'Используйте распределение баллов, когда время, деньги, внимание или другой ресурс ограничены. Оно подходит, чтобы:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8e6525da99616946:
    english: |-
      - prioritizing work for the next planning period;
      - dividing a participatory budget between projects;
      - choosing how much agenda time to give several topics;
      - distributing a fixed number of volunteer hours; or
      - identifying which improvements matter most to members.
    translation: |-
      - определить приоритеты работы на следующий период планирования;
      - распределить бюджет участия между проектами;
      - решить, сколько времени в повестке выделить разным темам;
      - распределить фиксированное количество часов волонтёрской работы; или
      - выяснить, какие улучшения наиболее важны для участников.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  66b0f13c4811ef63:
    english: The points express relative priority, not an amount that Loomio will automatically assign. Use [Score](/en/user_manual/polls/score/) when every option can receive a high rating without reducing support for another.
    translation: Баллы показывают относительный приоритет, а не объём ресурса, который Loomio распределит автоматически. Используйте [Опрос по очкам](/en/user_manual/polls/score/), если каждый вариант может получить высокую оценку без снижения поддержки других вариантов.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '0409e08bd5e80f61':
    english: "## Example: set priorities for an annual strategy review"
    translation: "## Пример: определение приоритетов для ежегодного пересмотра стратегии"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e274f6e40509e611:
    english: Oatmilk Cooperative is planning its annual strategy review. It asks members which areas should receive the most time and attention during the review. Each member receives ten points to allocate across five areas. This shows the group's relative priorities while requiring participants to make trade-offs.
    translation: Кооператив Oatmilk планирует ежегодный пересмотр стратегии. Он спрашивает участников, каким направлениям следует уделить больше всего времени и внимания. Каждый участник получает десять баллов для распределения между пятью направлениями. Так группа видит свои относительные приоритеты, а участникам приходится выбирать между ними.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c74ebb16f872b3c6:
    english: "## Set up the poll"
    translation: "## Настройка голосования"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  906790609aa7eb30:
    english: Describe the decision and what the points represent. Add options at a similar level of scope, then set **Points per person**. In this example, each voter receives ten points to indicate how much review time each strategic area should receive.
    translation: Опишите решение и объясните, что означают баллы. Добавьте сопоставимые по масштабу варианты, затем задайте значение **Баллы на человека**. В этом примере каждый голосующий получает десять баллов, чтобы показать, сколько времени следует уделить каждому направлению стратегии.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  67ae025b83fb4781:
    english: A very large budget can create false precision. A useful budget is usually large enough to show differences but small enough to require choices. Make clear whether concentrating all points on one option is acceptable.
    translation: Слишком большое количество баллов может создавать ложное впечатление точности. Обычно баллов должно хватать, чтобы показать различия, но их должно быть достаточно мало, чтобы приходилось выбирать. Уточните, допустимо ли отдать все баллы одному варианту.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Голосование"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d9a73b9d4e2f8927:
    english: Participants move the sliders to distribute their budget. Loomio shows how many points remain and prevents submission until the allocation is valid.
    translation: Участники передвигают ползунки, чтобы распределить свои баллы. Loomio показывает, сколько баллов осталось, и не позволяет отправить ответ, пока баллы не распределены правильно.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7b3d616673a01fbb:
    english: In this example, the voter assigns three points each to **Member participation** and **Financial sustainability**, two each to **Environmental impact** and **Staff development**, and none to **Products and services**. A zero does not necessarily mean an area has no value; it means the voter used their limited points elsewhere.
    translation: 'В этом примере голосующий отдаёт по три балла вариантам **Участие членов** и **Финансовая устойчивость**, по два — вариантам **Влияние на окружающую среду** и **Развитие сотрудников**, а варианту **Продукты и услуги** не отдаёт ни одного балла. Ноль не обязательно означает, что направление не имеет ценности: голосующий распределил ограниченное число баллов между другими вариантами.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Просмотр результатов"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  97147f83eaf22313:
    english: 'The results order options by the total points received. They also show:'
    translation: 'В результатах варианты упорядочены по общему числу полученных баллов. Также показаны:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1d224c0c34145a7f:
    english: |-
      - **% of points**: the option's share of all allocated points;
      - **Points**: the total points allocated;
      - **Mean**: the average among voters who gave the option points; and
      - **Voters**: how many people gave the option at least one point.
    translation: |-
      - **% баллов**: доля варианта среди всех распределённых баллов;
      - **Точки**: общее число баллов, отданных варианту;
      - **Иметь в виду**: среднее число баллов среди голосующих, отдавших баллы этому варианту; и
      - **Избиратели**: число людей, отдавших варианту хотя бы один балл.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2901008fa326e4f5:
    english: In this example, **Financial sustainability** receives the most points, followed by **Staff development**. Financial sustainability receives points from every voter, suggesting broad agreement that it needs substantial review time. Read the totals alongside the number of voters to distinguish broad priorities from areas strongly supported by fewer people.
    translation: В этом примере **Финансовая устойчивость** получает больше всего баллов, за ней следует **Развитие сотрудников**. Финансовой устойчивости отдал баллы каждый голосующий. Это указывает на широкое согласие с тем, что этому направлению нужно уделить значительное время при пересмотре стратегии. Сопоставьте общее число баллов с числом голосующих, чтобы отличить приоритеты многих участников от направлений, которые особенно важны меньшему числу людей.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f2c04fbdc54d23e8:
    english: Read the totals together with the number of voters and their reasons. Publish an outcome explaining how the strategy review will be structured; the poll does not assign time automatically.
    translation: 'Оцените общее число баллов вместе с числом голосующих и их доводами. Опубликуйте результат с объяснением того, как будет организован пересмотр стратегии: голосование не распределяет время автоматически.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
