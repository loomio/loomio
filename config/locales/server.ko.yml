      abstain_prompt: 기권은 이 제안의 방향에 이의가 없음을 뜻합니다. 기권에 투표하는 이유가 있나요?
      concerned: 우려됨
    gradients_of_agreement:
      process_subtitle: 제안에 대한 지지 정도를 8단계로 표현
      process_introduction: "<p>단계별 동의 제안은 그룹 멤버가 제안에 대한 지지 정도를 척도로 표현할 수 있게 합니다. 단순히 “동의”나 “반대”를 고르는 것보다 다양한 방식으로 지지를 표현할 수 있습니다.</p> <p>공식 합의에 앞서 제안에 대한 지지를 확인하는 예비 라운드로 단계별 동의를 사용하세요.</p><p>단계별 동의는 제안을 다듬는 중임을 알리고 참여를 유도합니다. 사람들의 의견을 듣고 생각을 파악해 적절히 대응할 기회입니다. 이를 통해 사람들의 의견을 반영해 더 나은 결정을 내릴 수 있습니다.</p>"
      title: 새 가치 선언문이 어떤가요?
      details: <h3 id="what-are-you-proposing"><strong>무엇을 제안하나요?</strong></h3><p></p><h3 id="why-is-this-important"><strong>왜 중요한가요?</strong></h3><p></p><h3 id="what-are-you-asking-people-to-do"><strong>사람들에게 무엇을 요청하나요?</strong></h3><p></p><p>제안이 어떤가요?  아래 척도로 지지 정도를 표현하고 댓글이나 개선 의견을 남겨 주세요.</p><p>이 단계별 동의 제안은 제안에 대한 지지를 확인하고, 공식 합의에 앞서 의견을 낼 기회입니다.</p>
      whole_hearted_endorsement: 전폭적 지지
      whole_hearted_endorsement_meaning: 정말 마음에 듭니다
      whole_hearted_endorsement_prompt: 어떤 점이 마음에 드나요?
      agreement_with_minor_contention: 사소한 이견이 있지만 동의
      agreement_with_minor_contention_meaning: 완벽하지는 않지만 충분히 좋습니다
      agreement_with_minor_contention_prompt: 어떤 점이 우려되나요?
      support_with_reservations: 유보적 지지
      support_with_reservations_meaning: 받아들일 만합니다
      support_with_reservations_prompt: 어떤 점이 걸리나요?
      abstain_meaning: 이 사안은 제게 영향을 주지 않습니다
      abstain_prompt: 덧붙이고 싶은 말이 있나요?
      more_discussion_needed: 추가 토론 필요
      more_discussion_needed_meaning: 아직 쟁점을 충분히 이해하지 못했습니다
      more_discussion_needed_prompt: 어떤 점이 이해되지 않나요?
      don_t_like_but_will_support: 마음에 들지 않지만 지지
      don_t_like_but_will_support_meaning: 썩 좋지는 않지만 그룹의 진행을 막고 싶지는 않습니다
      don_t_like_but_will_support_prompt: 어떤 점이 개선되면 좋겠나요?
      serious_disagreement: 강한 반대
      serious_disagreement_meaning: 동참할 뜻이 없습니다 - 제 참여를 기대하지 마세요
      serious_disagreement_prompt: 어떤 점에 반대하나요?
      veto: 거부
      veto_meaning: 이 제안을 거부합니다
      veto_prompt: 왜 제안을 거부하나요? 지지하려면 무엇이 바뀌어야 하나요?
    simple_poll:
      process_subtitle: 가장 인기 있는 선택지 찾기
      process_subtitle_v2: 단일 또는 복수 선택 투표로 선호도 확인
      process_introduction: <p>단일 선택 또는 복수 선택 투표로 가장 인기 있는 선택지를 찾아보세요.</p><p><a target="_blank"  href="/docs/en/user_manual/polls/proposal_types#simple-poll">단순 투표 자세히 알아보기</a>.</p>
      process_introduction_v2: <p><strong>선택</strong>으로 가장 인기 있는 선택지를 찾을 수 있습니다. 참여자는 목록에서 선택하며, 하나만 고를지 여러 개를 고를지 설정할 수 있습니다.</p><p><a target="_blank" href="/docs/en/user_manual/polls/proposal_types#simple-poll">선택 자세히 알아보기</a>.</p>
      title: 우리의 전략 방향은 어디에 초점을 맞춰야 할까요?
      details: <h3 id="what-is-this-poll-about"><strong>이 투표는 무엇에 관한 것인가요?</strong></h3><p></p><h3 id="why-is-this-important"><strong>왜 중요한가요?</strong></h3><p></p><h3 id="what-are-you-asking-people-to-do"><strong>참여자에게 무엇을 요청하나요?</strong></h3><p></p><p>선호하는 선택지를 고르세요.</p>
    practice_proposal:
      title: 이제 조금씩 익숙해지고 있습니다
      process_name: 연습용 제안
      process_subtitle: 제안을 직접 해 보며 사용법을 익히세요
      process_introduction: "<p>그룹이 Loomio의 제안 기능에 익숙해지도록 도와주세요. 부담 없이 간단하게 투표를 해 보며 전체 과정을 익힐 수 있습니다.</p>"
      details: "<p>모두가 Loomio의 제안 방식에 익숙해지도록 하는 연습입니다.</p><p>투표하고, 원하면 이유도 남겨 주세요.</p><p>부담도, 실제로 영향을 미칠 일도 없습니다. 제안이 어떻게 진행되는지 알아보는 연습일 뿐입니다.</p>"
      outcome_statement: "<p>연습용 제안에 참여해 주셔서 감사합니다. \U0001F389</p><p>Loomio에서 투표하고 댓글을 다는 방법을 알아보는 시간이었습니다. 실제 결정은 내리지 않았지만, 모두가 과정에 익숙해지는 데 도움이 되었기를 바랍니다.</p>"
      title_v2: 피자에는 파인애플이 어울립니다
      process_subtitle_v2: 제안을 직접 해 보며 투표 방법을 익히세요
      process_introduction_v2: "<p>그룹이 Loomio에서 재미있게 투표를 연습하는 방법입니다. 가벼운 질문을 골라 투표하고 이유를 남겨 보세요. 실제 결정 없이 연습만 합니다.</p>"
      details_v2: "<p>연습용 제안으로, 실제 결정은 내리지 않습니다.</p><p>투표하고 이유를 남기며 Loomio에서 제안이 어떻게 진행되는지 알아보세요.</p>"
      outcome_statement_v2: "<p>제안을 체험해 주셔서 감사합니다. 이제 Loomio에서 투표하는 방법을 알게 되셨습니다.</p>"
      agree_meaning: 동의합니다
      agree_prompt: 왜 동의하시나요?
      abstain_meaning: 별다른 의견이 없습니다
      abstain_prompt: 의견이 있나요?
      disagree_meaning: 반대합니다
      disagree_prompt: 왜 반대하시나요?
    try_loomio:
      process_name: Loomio 사용해 보기
      process_subtitle: 그룹이 함께 Loomio를 써 보기로 약속하세요
      process_introduction: "<p>Loomio를 잘 활용하려면 그룹이 함께 참여하기로 약속해야 합니다. 이 제안은 체험 기간 동안 사용하거나 함께 요금제에 가입하는 등, Loomio를 제대로 써 보는 데 시간과 노력을 들일지 그룹이 결정하도록 돕습니다.</p>"
      title: 함께 Loomio를 써 보기로 약속합시다
      details: "<p>Loomio를 잘 쓰려면 그룹이 함께 노력해야 합니다. 사람들이 찾아와 참여해야 효과가 있습니다.</p><p>이 제안은 체험 기간 동안 모두가 Loomio를 적극적으로 사용하기로 약속하자는 내용입니다. 새 소식을 확인하고, 제안에 투표하고, 토론에 참여하는 것을 뜻합니다.</p><p>우려되는 점이 있다면 이의를 제기하고 무엇이 바뀌어야 할지 알려 주세요. 이의 선택지는 이럴 때 사용합니다.</p>"
      outcome_statement: "<p>이 제안의 결론을 그룹에 공유하세요. 무엇을 결정했고 다음에 무엇을 할지 알려 주세요.</p>"
      consent_meaning: 써 볼 의향이 있습니다
      consent_prompt: Loomio를 쓰면서 어떤 점이 기대되나요?
      objection_meaning: 먼저 해결해야 할 우려가 있습니다
      objection_prompt: 참여를 약속하려면 무엇이 바뀌어야 하나요?
    proposal:
      process_subtitle: 결정을 내리기 위한 제안을 올리세요
      process_introduction: <p>Loomio의 기본 제안은 토론을 명확한 결론으로 이어 주어 결정을 돕습니다.</p><p>실행할 방안을 제안하고 사람들이 동의, 기권, 반대 중 하나에 투표하도록 초대하세요.</p><p>투표할 때는 선택한 이유를 남길 수 있습니다. 다른 사람들의 입장과 그 이유를 확인할 수 있습니다.</p><p>이처럼 제안으로 사람들의 응답을 이끌어 내고, 새로운 정보를 발견하고, 서로의 이해를 넓힐 수 있습니다. 그룹이 더 충분한 정보를 바탕으로 더 나은 결정을 내리는 데 도움이 됩니다.</p><p>제안과 관련 토론에는 결정이 이루어진 과정이 기록됩니다.</p><p><a target="_blank" href="/docs/en/guides/making_decisions/simple_decision_process"><u>간단한 결정 과정에서 Loomio의 기본 제안을 사용하는 방법 자세히 알아보기</u></a>.</p>
      title: 새 브랜드 콘셉트 승인
      details: <h3 id="what-is-the-decision-you-need-to-make"><strong>무엇을 결정해야 하나요?</strong></h3><p></p><h3 id="why-is-this-important"><strong>왜 중요한가요?</strong></h3><p></p><h3 id="what-are-you-asking-people-to-do"><strong>사람들에게 무엇을 요청하나요?</strong></h3><p></p> <p>이 제안이 통과되려면 멤버 과반수가 동의에 투표해야 합니다.</p><p>반대한다면 이유와 동의하려면 무엇이 바뀌어야 할지 알려 주세요.</p>
      agree: 동의
      agree_meaning: 제안을 지지합니다
      agree_prompt: 제안의 어떤 점이 좋고 그룹에 어떤 도움이 되나요?
      abstain: 기권
      abstain_meaning: 이 결정에 투표하지 않기로 했거나 투표할 수 없습니다.
      abstain_prompt: 기권하거나 이 결정에 투표하기 어렵다고 느끼는 이유는 무엇인가요?
      disagree: 반대
      disagree_meaning: 이 제안을 지지하려면 일부 내용이 바뀌어야 합니다.
      disagree_prompt: 이 제안을 지지할 수 있도록 어떻게 개선하면 좋을까요?
    consensus:
      abstain_meaning: 이 결정은 제게 영향을 주지 않으며 그룹이 어떤 결정을 내려도 괜찮습니다
      abstain_prompt: 기권하거나 이 결정에 투표하기 어렵다고 느끼는 이유는 무엇인가요?
      disagree: 반대
      disagree_meaning: 이 제안을 지지하려면 바뀌어야 할 부분이 있습니다
      disagree_prompt: 이 제안을 지지할 수 있도록 어떻게 개선하면 좋을까요?
      block: 거부
      block_meaning: 이 제안을 거부하며 진행해서는 안 된다고 생각합니다
      block_prompt: 이 제안에 이의를 제기하는 이유와 진행해서는 안 되는 이유를 설명하세요
      process_subtitle: 모든 관계자가 함께 합의에 도달하세요
      process_introduction_v2: "<p><strong>합의</strong>는 모두의 적극적인 동의가 중요한 결정에 쓰입니다. 참여자들은 서로의 필요를 이해하고 그룹 전체가 지지할 수 있을 때까지 함께 제안을 다듬습니다. 대화가 진행되는 동안 표를 바꿀 수 있으므로, 한 번의 투표로 결정하기보다 진솔한 대화를 나누게 됩니다. 다른 방법보다 인내가 더 필요하지만 가장 강한 실천 의지를 이끌어 냅니다.</p><p>이 템플릿에는 기본으로 <strong>거부</strong> 선택지가 포함됩니다. 거부가 모든 그룹에 적합한 것은 아닙니다. 논란이 되거나 오용될 수 있습니다. 의사결정 과정에서 거부를 사용하지 않는다면 템플릿을 편집해 삭제하는 것이 좋습니다.</p>"
      process_introduction: <p>내려야 할 결정에 대해 합의를 이루어 모든 참여자의 필요와 우려를 반영하는 결정을 내리세요.</p><ul><li><p>함께 토론하고 제안을 다듬으세요</p></li><li><p>관계자 모두를 참여시키고 존중하세요</p></li><li><p>대다수의 동의를 구하세요&nbsp;</p></li></ul><p><a target="_blank" href="/docs/en/guides/making_decisions/consensus_process">합의 절차 자세히 알아보기</a>.</p>
      title: 새 브랜드 콘셉트 승인
      details: <h3 id="what-is-the-decision-you-need-to-make"><strong>어떤 결정을 내려야 하나요?</strong></h3><p></p><h3 id="why-is-this-important"><strong>왜 중요한가요?</strong></h3><p></p><h3 id="what-are-you-asking-people-to-do"><strong>사람들에게 무엇을 요청하나요?</strong></h3><p></p><p>이 제안이 통과되려면 멤버 과반수가 동의에 투표해야 합니다. </p><p>반대한다면 이유와 동의하기 위해 바뀌어야 할 점을 알려 주세요.</p>
      details_v2: "<h3><strong>어떤 결정을 내려야 하나요?</strong></h3><p></p><h3><strong>왜 중요한가요?</strong></h3><p></p><h3><strong>사람들에게 무엇을 요청하나요?</strong></h3><p></p><p>입장과 이유를 알려 주세요. 반대한다면 지지할 수 있도록 무엇이 바뀌어야 하는지 설명해 주세요.</p>"
      outcome_statement: "<p>합의 절차에 참여해 주셔서 감사합니다.</p>"
      agree: 동의
      agree_meaning: 제안을 지지합니다
      agree_prompt: 제안의 어떤 점이 좋으며 조직에 어떤 도움이 될까요?
      abstain: 기권
    majority:
      process_subtitle: 가장 많은 표로 결정하기
      process_introduction: "<p><strong>다수결</strong>은 그룹이 결정하는 가장 간단한 방법입니다. 참여자가 찬성이나 반대에 투표하고, 과반수가 찬성하면 제안이 통과됩니다. 기권이나 거부가 없어 모든 표의 투표 가중치가 같습니다.</p><p>다수결은 명확한 결론이 필요한 간단한 결정에 적합합니다. 서로 이해하고 공통점을 찾기 위해 함께 노력하는 것이 중요한 결정이라면 이의 없는 의사결정이나 합의를 고려하세요.</p>"
      title: 3분기 예산 승인
      details: "<h3><strong>어떤 결정을 내려야 하나요?</strong></h3><p></p><h3><strong>이것이 왜 중요한가요?</strong></h3><p></p><h3><strong>참여자에게 무엇을 요청하나요?</strong></h3><p></p>"
      yes_meaning: 이 제안을 지지합니다
      yes_prompt: 이 제안을 지지하는 이유는 무엇인가요?
      no_meaning: 이 제안을 지지하지 않습니다
      no_prompt: 이 제안을 지지하지 않는 이유는 무엇인가요?
      outcome_statement: "<p>이번 다수결 투표에 참여해 주셔서 감사합니다.</p>"
    question_round:
      process_subtitle: 제안을 이해하는 데 도움이 되는 질문 받기
      process_introduction: <p>질문 라운드는 제안에 대한 의견을 말하기 전에 모두가 제안을 이해할 수 있도록 궁금한 점을 묻는 기회입니다.</p><p>Loomio 질문 라운드는 투표 선택지가 없는 특별한 제안입니다. 참여자는 라운드에 설정된 기간 동안 질문할 수 있습니다.</p><p>질문 라운드는 보통 이의 없는 의사결정 과정의 한 단계로 사용됩니다.</p><p><a target="_blank" href="/docs/en/guides/making_decisions/consent_process">이의 없는 의사결정 과정 자세히 알아보기</a>.</p>
      title: 보건 및 안전 정책에 대해 어떤 질문이 있나요?
      details: <h3 id="what-are-you-proposing"><strong>무엇을 제안하나요?</strong></h3><p></p><h3 id="why-is-this-important"><strong>이것이 왜 중요한가요?</strong></h3><p></p><h3 id="what-are-you-asking-people-to-do"><strong>참여자에게 무엇을 요청하나요?</strong></h3><p></p><p>제안을 이해하는 데 필요한 질문을 하는 질문 라운드입니다.</p> <p>제안을 이해하려면 무엇을 알아야 하나요?</p> <p>질문 라운드가 마감되기 전에 답변하세요.</p>
      reason_prompt: 제안을 이해하려면 무엇을 알아야 하나요?
      outcome_statement: "<p>이번 라운드에서 질문해 주셔서 감사합니다</p>"
    advice:
      process_subtitle: 내려야 할 결정에 대해 조언을 구하세요
      process_introduction: <p>내려야 할 결정에 대해 영향을 받는 사람이나 전문 지식이 있는 사람에게 조언을 구해 조직을 위한 더 나은 결정을 내리세요.</p><ul><li><p>조언은 조직을 위한 더 나은 결정을 내리는 데 도움이 됩니다.</p></li><li><p>관계를 쌓고 배움의 기회와 다양한 의견을 나누세요.&nbsp;&nbsp;</p></li><li><p>주도성과 창의성을 키우고 더 즐겁게 일하세요.</p></li></ul><p><a target="_blank" href="/docs/en/guides/making_decisions/advice_process"><u>조언 절차 자세히 알아보기</u></a>.</p>
      title: 다카시의 새 컴퓨터 구매 돕기
      details: <h3 id="what-is-the-decision-you-need-to-make"><strong>어떤 결정을 내려야 하나요?</strong></h3><p></p><h3 id="why-is-this-important"><strong>왜 중요한가요?</strong></h3><p></p><h3 id="what-advice-are-you-asking-from-people-to-help-you-make-a-go"><strong>좋은 결정을 내리기 위해 어떤 조언을 구하나요?</strong></h3><p></p><p>우리 조직을 위한 좋은 결정을 내리고자 의견을 구합니다.</p>
      agree: 동의
      agree_meaning: 이 결정에 대해 조언했습니다
      agree_prompt: 조언을 요약하거나 도움이 될 댓글을 남겨 주세요
      abstain: 기권
      abstain_meaning: 드릴 조언이 없습니다
      abstain_prompt: 도움이 될 의견이 있나요?
      outcome_statement: "<p>조언 라운드에 참여해 주셔서 감사합니다!</p>"
    consent:
      process_subtitle: 이의 없이 ‘안전하게 시도할 수 있는’ 결정을 내리세요
      process_subtitle_v2: 이의가 없으면 진행하세요
      process_introduction_v2: "<p><strong>이의 없음</strong>은 제안이 완벽한지가 아니라 안전하게 시도할 수 있는지를 묻습니다. 타당한 이의가 없으면 제안이 통과됩니다. 이의가 있으면 그룹이 함께 해결합니다. 참여자는 제안이 바뀌는 동안 표를 바꿀 수 있으므로, 이의는 걸림돌이 아닌 개선 도구가 됩니다.</p>"
      process_introduction: <p>내려야 할 결정에 대해 제안에 타당한 이의가 없는지 확인해, 조직을 위해 '안전하게 시도할 수 있는' 결정을 빠르게 내리세요.</p><ul><li><p>‘충분히 괜찮은’ 결정을 목표로 하세요</p></li><li><p>다양한 의견을 모아 실행 가능한 제안을 만드세요</p></li><li><p>타당한 이의가 있는지 물어보세요</p></li><li><p>제안을 수정해 이의를 해결하세요</p></li></ul> <p><a target="_blank" href="/docs/en/guides/making_decisions/consent_process">이의 없는 의사결정 절차 자세히 알아보기</a>.</p>
      title: 클로이를 디자이너로 채용
      details: <h3 id="what-is-the-decision-you-need-to-make"><strong>어떤 결정을 내려야 하나요?</strong></h3><p></p><h3 id="why-is-this-important"><strong>왜 중요한가요?</strong></h3><p></p><h3 id="what-are-you-asking-of-people-in-this-proposal"><strong>이 제안에서 사람들에게 무엇을 요청하나요?</strong></h3><p></p><p>이의가 있으면 이유를 설명하고 제안을 안전하게 만들 수정안을 제시해 주세요.</p><p>조직을 위한 좋은 결정을 내리고자, '안전하게 시도할 수 있는' ‘충분히 괜찮은’ 결정에 이의가 없는지 확인하는 과정임을 기억해 주세요.</p>
      consent: 이의 없음
      consent_meaning: 안전하게 시도할 수 있는 제안입니다
      consent_prompt: 제안의 어떤 점이 좋으며 조직에 어떤 도움이 될까요?
      objection: 이의
      objection_meaning: 타당한 이의가 있으며 제안이 해를 끼칠 것이라고 생각합니다
      objection_prompt: 이 제안을 지지할 수 있도록 '안전하게 시도할 수 있는' 제안으로 만들려면 무엇을 바꿔야 하나요?
      details_v2: "<h3><strong>어떤 결정을 내려야 하나요?</strong></h3><p></p><h3><strong>왜 중요한가요?</strong></h3><p></p><h3><strong>이 제안에서 사람들에게 무엇을 요청하나요?</strong></h3><p></p><p>완벽함을 목표로 하지는 않습니다. 제안이 충분히 괜찮고 안전하게 시도할 수 있다면 이의 없음을 선택하세요. 이의가 있으면 실행 가능하도록 무엇을 바꿔야 하는지 알려 주세요.</p>"
      outcome_statement: "<p>이의 없는 의사결정 절차에 참여해 주셔서 감사합니다.</p>"
    opt_in:
      accept_meaning: 참여할 의향이 있습니다
      accept_prompt: 참여하려는 이유는 무엇인가요?
      decline_meaning: 참여할 수 없습니다
      decline_prompt: 하고 싶은 말이 있나요?
      process_subtitle: 지원자 찾기 또는 참여자 모집
      process_introduction: '<p>참여 신청으로 팀, 위원회, 실무 그룹이나 행사에 사람들을 초대하세요.&nbsp;&nbsp;</p><p>‘참여 신청’에는 수락과 거절, 두 가지 투표 선택지가 있습니다.&nbsp;</p><p>실무 그룹에 참여할 3명처럼 모집할 인원수를 정할 수 있습니다.</p> <p><a target="_blank" href="/docs/en/user_manual/polls/meeting_polls#opt-in">참여 신청 자세히 알아보기</a>.</p> '
      title: 새 지속가능성 정책 초안을 작성할 실무 그룹
      details: "<p><strong>어떤 팀, 실무 그룹 또는 행사에 초대하나요?</strong></p><p></p><p><strong>왜 중요한가요?</strong></p><p></p><p><strong>참여자에게 무엇을 요청하나요?</strong></p><p></p><p>참여하려면 '수락'을 선택하세요</p>"
    score_poll:
      process_subtitle: 선택지별 지지 정도 측정
      process_subtitle_v2: 선택지별 지지 수준 측정
      process_subtitle_v3: 투표자에게 각 선택지의 지지 정도 평가 요청
      process_introduction: <p>각 선택지에 대한 바람, 선호도, 관심도를 알아보려면 점수 투표를 사용하세요.</p><p><span>참여자는 각 선택지를 평가하고 슬라이더를 움직여 점수를 매깁니다.</span></p><p><a target="_blank"  href="/docs/en/user_manual/polls/proposal_types#score-poll">점수 투표 자세히 알아보기</a>.</p>
      process_introduction_v2: <p><strong>점수</strong>로 각 선택지에 대한 그룹의 지지 수준을 측정할 수 있습니다. 참여자는 슬라이더로 모든 선택지에 점수를 매깁니다. 무엇을 선호하는지뿐 아니라 얼마나 선호하는지도 알 수 있습니다.</p><p><a target="_blank" href="/docs/en/user_manual/polls/proposal_types#score-poll">점수 투표 자세히 알아보기</a>.</p>
      title: 우리 조직의 결정 방식 평가
      details: <h3 id="what-is-this-poll-about"><strong>이 투표는 무엇에 관한 것인가요?</strong></h3><p></p><h3 id="why-is-this-important"><strong>왜 중요한가요?</strong></h3><p></p><h3 id="what-are-you-asking-people-to-do"><strong>참여자에게 무엇을 요청하나요?</strong></h3><p></p><p>선호하는 선택지를 고르세요.</p>
    dot_vote:
      process_subtitle: 주어진 점수를 배분해 우선순위 파악
      process_subtitle_v2: 모두 선택할 수 없을 때 우선순위 파악
      process_subtitle_v3: 모두 선택할 수 없을 때 우선순위를 파악합니다. 점 투표라고도 합니다.
      process_introduction: <p>점 배분 투표로 한정된 자원을 여러 선택지에 배분할 수 있습니다. 단순 투표에서 더 나아가, 참여자가 선택할 때 제약을 고려하도록 돕습니다.</p><p>참여자는 각자 배분할 점수를 받습니다.</p><p>모든 점수를 하나의 선택지에 주거나 여러 선택지에 나눠 줄 수 있습니다.</p><p>주어진 점수를 넘길 수 없으므로 배분 방식을 신중하게 생각해야 합니다.</p><p><a target="_blank"  href="/docs/en/user_manual/polls/proposal_types#dot-vote">점 배분 투표 자세히 알아보기</a>.</p>
      process_introduction_v2: <p><strong>배분</strong>으로 모두 선택할 수 없는 상황에서 그룹의 우선순위를 알 수 있습니다. 참여자는 각자 주어진 점수를 선택지에 배분합니다. 하나에 모두 주거나 여러 개에 나눠 줄 수 있습니다. 점수가 한정되어 있어 배분한 점수마다 우선순위가 드러납니다.</p><p><a target="_blank" href="/docs/en/user_manual/polls/proposal_types#dot-vote">배분 자세히 알아보기</a>.</p>
      title: 우리 콘퍼런스의 주제 선정
      details: <h3 id="what-is-this-poll-about"><strong>이 투표는 무엇에 관한 것인가요?</strong></h3><p></p><h3 id="why-is-this-important"><strong>왜 중요한가요?</strong></h3><p></p><h3 id="what-are-you-asking-people-to-do"><strong>참여자에게 무엇을 요청하나요?</strong></h3><p></p><p>이 투표에서는 주어진 점수를 선호하는 선택지에 배분합니다. 하나에 모두 주거나 여러 개에 나눠 줄 수 있습니다.</p>
    ranked_choice:
      process_subtitle: 선택지의 선호 순위 파악
      process_subtitle_v2: 그룹의 선호 순위 파악
      process_subtitle_v3: 선호하는 순서대로 선택지 정렬
      process_introduction: <p>선호 순위 투표는 선택지가 많거나 선거를 진행할 때 유용합니다.</p><p>투표자는 선택지를 끌어다 놓아 선호하는 순서로 정렬합니다.</p><p>결과는 순위순으로 표시됩니다.</p><p><a target="_blank"  href="/docs/en/user_manual/polls/proposal_types#ranked-choice">선호 순위 투표 자세히 알아보기</a>.</p>
      process_introduction_v2: <p><strong>순위</strong>로 그룹의 선호 순위를 알 수 있습니다. 참여자는 선택지를 끌어다 놓아 가장 선호하는 것부터 차례로 정렬하며, 결과에는 전체 순위가 표시됩니다.</p><p><a target="_blank" href="/docs/en/user_manual/polls/proposal_types#ranked-choice">순위 자세히 알아보기</a>.</p>
      title: 이사회 이사 선출
      details: <h3 id="what-is-this-poll-about"><strong>이 투표는 무엇에 관한 것인가요?</strong></h3><p></p><h3 id="why-is-this-important"><strong>왜 중요한가요?</strong></h3><p></p><h3 id="what-are-you-asking-people-to-do"><strong>참여자에게 무엇을 요청하나요?</strong></h3><p></p><p>선호하는 순서대로 선택지에 순위를 매겨 투표하세요.  결과에서 1위를 차지한 선택지가 선정됩니다.</p>
    stv:
      process_subtitle: 득표 비율에 따라 여러 당선자 선출
      process_introduction: <p>STV(단기이양식 투표)는 여러 당선자를 뽑는 비례대표 선거 방식입니다. 투표자는 선호하는 순서대로 후보에 순위를 매깁니다. 당선 기준표에 도달한 후보가 당선되며, 초과 득표나 탈락한 후보의 표는 다음 순위 후보에게 이전됩니다.</p><p>의석 수, 개표 방식(스코틀랜드식 또는 미크식), 당선 기준표 유형(드룹식 또는 헤어식)을 설정하세요. 결과에는 라운드별 표 이전 내역이 표시됩니다.</p><p><a target="_blank" href="/docs/en/user_manual/polls/stv">단기이양식 선거 자세히 알아보기</a>.</p>
      title: 위원 선출
      details: <h3 id="what-is-this-election-about"><strong>이 선거는 무엇에 관한 것인가요?</strong></h3><p></p><h3 id="how-many-seats"><strong>몇 의석을 채우나요?</strong></h3><p></p><h3 id="who-are-the-candidates"><strong>후보는 누구인가요?</strong></h3><p></p><p>후보를 끌어다 놓아 선호하는 순서대로 투표하세요. 1순위는 가장 선호하는 후보입니다. 원하는 수만큼 후보에 순위를 매길 수 있습니다.</p>
    time_poll:
      process_subtitle: 가장 적합한 회의 시간 찾기
      process_subtitle_v2: 참석 가능한 시간 찾기
      process_introduction: <p>회의나 행사에 가장 적합한 시간을 빠르게 찾아보세요. 제목, 세부 내용, 날짜와 시간 선택지를 본인의 시간대로 추가하세요. 참여자에게는 각자의 시간대로 표시됩니다.</p><p>일정 투표가 마감되면 가장 적합한 시간과 회의 안내를 결론으로 작성하세요. Loomio가 결론 이메일에 캘린더 초대를 함께 보내므로 참여자가 캘린더에 추가할 수 있습니다.</p><p><a target="_blank" href="/docs/en/user_manual/polls/meeting_polls#time-poll">일정 투표 자세히 알아보기</a>.</p>
      process_introduction_v2: <p><strong>일정 투표</strong>로 참석 가능한 시간을 찾을 수 있습니다. 제안할 시간을 추가하면 참여자에게 각자의 시간대로 표시됩니다. 투표가 마감된 뒤 결론을 작성하면 Loomio가 모두에게 캘린더 초대를 보냅니다.</p><p><a target="_blank" href="/docs/en/user_manual/polls/meeting_polls#time-poll">일정 투표 자세히 알아보기</a>.</p>
      title: 다음 회의 날짜를 정해요
      details: "<p><strong>어떤 회의나 행사인가요?</strong></p><p></p><p><strong>왜 중요한가요?</strong></p><p></p><p><strong>참여자에게 무엇을 요청하나요?</strong></p><p></p><p><span>참석 가능한 시간대에는 초록색 '엄지 올림' 아이콘을 표시하고, 불가능한 시간대에는 빨간색 '엄지 내림'을 그대로 두세요. </span></p><p><span>'필요하면' 참석할 수 있는 시간대에는 '엄지 옆으로' 아이콘을 사용하세요.</span></p>"
      reason_prompt: 주최자가 적합한 시간을 찾는 데 도움이 될 말이 있나요?
