---
navigation_title: Шаблони опитувань
blocks:
  6428da81fbbe11c6:
    english: "# Poll templates"
    translation: "# Шаблони опитувань"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  208bc68b458895f1:
    english: Poll templates are reusable starting points shown when someone selects **Start a vote** or **New poll**. A template combines a voting method with preset guidance, response options, and settings.
    translation: Шаблони опитувань — це готові основи для голосування, які з’являються після вибору **Розпочати голосування** або **Нове опитування**. Шаблон поєднує метод голосування із заздалегідь заданими поясненнями, варіантами відповіді та налаштуваннями.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f290b92adeb2a791:
    english: Use this page to configure which templates are available to a group or to create one for your own process. To choose a template for a particular vote, see [Proposals](../proposals/) or [Polls](../proposal_types/). To facilitate a complete decision process, see [Making decisions](/en/guides/making_decisions/).
    translation: На цій сторінці описано, як налаштувати доступні групі шаблони або створити шаблон для вашого процесу. Щоб вибрати шаблон для конкретного голосування, перегляньте сторінки [Пропозиції](../proposals/) або [Опитування](../proposal_types/). Про проведення всього процесу ухвалення рішення читайте в розділі [Ухвалення рішень](/en/guides/making_decisions/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  658d10486cbee7dc:
    english: "## Voting methods and templates"
    translation: "## Методи голосування та шаблони"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d903d1a58aebf643:
    english: A voting method controls how participants respond and how Loomio calculates the result. Examples include Proposal, Choose, Score, Allocate, Rank, Time poll, and STV.
    translation: 'Метод голосування визначає, як учасники відповідають і як Loomio обчислює результат. Приклади методів: Пропозиція, Виберіть, Оцінка, Виділити, Ранжування, Опитування щодо часу та STV.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  21efff1a5c91ad29:
    english: A poll template uses one of those methods and adds reusable defaults. For example, Sense check, Advice, Consent, and Consensus are different templates built on the Proposal voting method. Their instructions and response options differ even though Loomio handles their ballots in the same way.
    translation: Шаблон опитування використовує один із цих методів і додає налаштування, які можна застосовувати повторно. Наприклад, «Перевірка думок», «Порада», «Згода» та «Консенсус» — це різні шаблони на основі методу «Пропозиція». Вони мають різні інструкції та варіанти відповіді, хоча Loomio обробляє голоси в них однаково.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f622951ffc7e1064:
    english: "## Use a template"
    translation: "## Використання шаблону"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  865e825cc7d00cf2:
    english: When starting a vote, select the **Proposal** or **Poll** tab and choose one of the templates available to the group.
    translation: Коли починаєте голосування, виберіть вкладку **Пропозиція** або **Опитування**, а потім один із доступних групі шаблонів.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1598f1a55a6944e6:
    english: The template supplies an introduction, example content, options, and settings. Review and edit these for the particular decision before starting the vote. Editing the new vote does not change the reusable template.
    translation: Шаблон містить вступ, приклад вмісту, варіанти відповіді та налаштування. Перед початком голосування перегляньте їх і змініть відповідно до конкретного рішення. Редагування нового голосування не змінює шаблон.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8212a94908338b22:
    english: "## Who can manage templates"
    translation: "## Хто може керувати шаблонами"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  378caa9ba83ee0dc:
    english: Group administrators can create and manage every poll template in their group. They can enable **Members can create templates** under **Group settings** → **Permissions**. When enabled, members can create templates and manage templates they authored.
    translation: Адміністратори групи можуть створювати всі шаблони опитувань у своїй групі та керувати ними. Вони можуть увімкнути **Учасники можуть створювати шаблони** в розділі **Налаштування групи** → **Дозволи**. Після цього учасники зможуть створювати шаблони та керувати шаблонами, які створили самі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0fafc6275b6c9153:
    english: "## Create a poll template"
    translation: "## Створення шаблону опитування"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5fc696a1e924179c:
    english: Open the template list and select **New template**. Start with an example or a blank template, then choose the group that will use it.
    translation: Відкрийте список шаблонів і виберіть **Новий шаблон**. Почніть із прикладу або порожнього шаблону, а потім виберіть групу, яка його використовуватиме.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  37b3658ec66eb8b7:
    english: The template form defines the guidance and defaults people receive when they start a vote.
    translation: У формі шаблону ви задаєте пояснення та початкові налаштування, які люди побачать на початку голосування.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fa0dab51a009bf90:
    english: "### Template title, subtitle, and help"
    translation: "### Назва, підзаголовок і довідка шаблону"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  965cde5e13952ade:
    english: |-
      - **Template title** is the short name shown in the template list.
      - **Template subtitle** explains when to use it in one sentence.
      - **Template help** appears in the information panel when someone uses the template. Explain its purpose, any rules participants should know, and links to relevant policies or guides.
    translation: |-
      - **Назва шаблону** — коротка назва в списку шаблонів.
      - **Шаблон підзаголовка** одним реченням пояснює, коли використовувати шаблон.
      - **Довідка щодо шаблонів** з’являється на інформаційній панелі під час використання шаблону. Поясніть призначення шаблону, правила, які мають знати учасники, і додайте посилання на відповідні політики чи посібники.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f3e51b30163d5b85:
    english: Use plain, specific names that distinguish the template from others in the group.
    translation: Використовуйте прості й конкретні назви, за якими шаблон можна відрізнити від інших шаблонів групи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e6b8a09191bb8c3f:
    english: "### Voting method"
    translation: "### Метод голосування"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ea4fef806c1cf060:
    english: Choose what participants need to express and how the result should be calculated.
    translation: Виберіть, що мають висловити учасники та як потрібно обчислювати результат.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f8c87a496921c710:
    english: |-
      - **Proposal**: respond to a statement using defined positions;
      - **Choose**: select one or more options;
      - **Score**: evaluate every option on a scale;
      - **Allocate**: distribute a limited budget of points;
      - **Rank**: arrange options in preference order;
      - **Time poll**: indicate availability; and
      - **STV**: rank candidates in a proportional, multi-winner election.
    translation: |-
      - **Пропозиція**: відповісти на твердження, вибравши одну із заданих позицій;
      - **Виберіть**: вибрати один або кілька варіантів;
      - **Оцінка**: оцінити кожен варіант за шкалою;
      - **Виділити**: розподілити обмежену кількість балів;
      - **Ранжування**: розташувати варіанти за порядком переваги;
      - **Опитування щодо часу**: вказати доступний час; і
      - **STV**: ранжувати кандидатів на пропорційних виборах із кількома переможцями.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9d589e44fa94c5e2:
    english: Changing the voting method changes the fields and result calculation available to the template.
    translation: Зміна методу голосування змінює доступні в шаблоні поля та спосіб обчислення результату.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  230689f781e4cbc7:
    english: "### Example title, details, and tags"
    translation: "### Приклад назви, опису та міток"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6fa4b3625c6ec7ce:
    english: Provide example content that helps an author frame the vote. These values are copied into a new proposal or poll and can be edited before it starts.
    translation: Додайте приклад вмісту, який допоможе автору сформулювати питання для голосування. Ці значення копіюються в нову пропозицію або опитування. Їх можна змінити до початку голосування.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a093368b30ac3c9b:
    english: Use prompts rather than fixed content when each use needs a different title or details. Add default category tags only when they apply every time the template is used.
    translation: Якщо для кожного голосування потрібні інші назва чи опис, використовуйте підказки замість готового тексту. Додавайте початкові мітки категорій лише тоді, коли вони доречні щоразу під час використання шаблону.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  24c3fa4b7ef676fd:
    english: "### Response options"
    translation: "### Варіанти відповіді"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e7421caab9c47f5b:
    english: 'Methods such as Proposal and Choose let you configure response options. Select the pencil icon beside an option to edit:'
    translation: 'Такі методи, як «Пропозиція» та «Виберіть», дають змогу налаштувати варіанти відповіді. Щоб змінити варіант, виберіть значок олівця поруч із ним:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  73a065ad5b861579:
    english: |-
      - **Option name**: the short response label;
      - **Icon**: its visual marker;
      - **Meaning**: what selecting the option communicates; and
      - **Reason prompt**: the question shown when someone explains their response.
    translation: |-
      - **Назва опції**: короткий підпис варіанта відповіді;
      - **значок**: візуальне позначення варіанта;
      - **Значення**: що означає вибір цього варіанта; і
      - **Підказка щодо причини**: запитання, яке людина бачить, коли пояснює свою відповідь.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  38bc8cfc36aaea2e:
    english: Define options so participants can tell the difference between them without guessing. The meanings should match the decision rules your group actually uses.
    translation: Сформулюйте варіанти так, щоб учасники могли зрозуміти різницю між ними без здогадок. Їхні значення мають відповідати правилам ухвалення рішень, які діють у вашій групі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cc4adba73670a75b:
    english: "### Duration and settings"
    translation: "### Тривалість і налаштування"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6c63a57ab4cec442:
    english: Set a default duration that is suitable for most uses of the template. The author can change the closing time for an individual vote.
    translation: Встановіть початкову тривалість, яка підходить для більшості випадків використання шаблону. Автор може змінити час завершення окремого голосування.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  df14be8dbf80fa3c:
    english: Other defaults can control result visibility, anonymous voting, vote-reason requirements, reminders, quorum, and method-specific behaviour. See [Proposal and poll settings](../settings/) for their effects.
    translation: Інші початкові налаштування можуть визначати видимість результатів, анонімність голосування, вимоги до пояснення голосу, нагадування, кворум і особливості окремих методів. Їхній вплив описано в розділі [Налаштування пропозицій та опитувань](../settings/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  774ed7b91d33ab10:
    english: "### Save and test the template"
    translation: "### Збереження та перевірка шаблону"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1b26a723ab8a9811:
    english: After saving, start a draft vote from the template. Check that its introduction, prompts, options, and defaults make sense to someone who did not create it. Starting a draft is also a useful way to confirm that the chosen voting method produces the result the group expects.
    translation: Після збереження створіть із шаблону чернетку голосування. Перевірте, чи зрозумілі вступ, підказки, варіанти відповіді та початкові налаштування людині, яка не створювала шаблон. Чернетка також допоможе перевірити, чи вибраний метод голосування дає результат, на який очікує група.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1f0dab3f50320e75:
    english: "## Manage the template list"
    translation: "## Керування списком шаблонів"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e9748843a900273f:
    english: 'Use the action menu beside a template to:'
    translation: 'Використовуйте меню дій поруч із шаблоном, щоб:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  646235094d051c83:
    english: |-
      - **Edit** its reusable content and defaults;
      - **Move** it to a different position in the list;
      - **Hide** it from people starting votes; or
      - **Delete** a custom template that is no longer needed.
    translation: |-
      - **Редагувати** його вміст і початкові налаштування;
      - **Перемістити** його на інше місце в списку;
      - **Сховати** його від людей, які починають голосування; або
      - **Видалити** власний шаблон, який більше не потрібен.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3f6dc06b1fd2bce8:
    english: Select **Show hidden templates** to review or restore hidden templates. Default templates can be hidden or adapted for the group, but cannot be deleted.
    translation: Виберіть **Показати приховані шаблони**, щоб переглянути або відновити приховані шаблони. Стандартні шаблони можна приховати або пристосувати до потреб групи, але не можна видалити.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  be3ee2d2721d3e2a:
    english: Changing a template does not alter proposals or polls that have already been started from it.
    translation: Зміна шаблону не впливає на пропозиції чи опитування, які вже створено на його основі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
