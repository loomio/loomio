blocks:
  2072a463e55dfba1:
    english: "# Advice"
    translation: "# Совет"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  aadbf3844be4a95f:
    english: An Advice proposal gathers input for a decision that a person or team is responsible for making. Participants can offer advice or indicate that they have no advice to add.
    translation: Предложение «Совет» помогает собрать мнения перед решением, за которое отвечает человек или команда. Участники могут дать совет или сообщить, что им нечего добавить.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  769a2446fc3ec4a9:
    english: This page explains the Advice proposal form, voting, and results. See the [Advice process](/en/guides/making_decisions/advice_process) for the complete workflow from framing the decision to publishing an outcome.
    translation: На этой странице описаны форма предложения «Совет», голосование и результаты. Полный процесс — от постановки вопроса до публикации результата — описан в [процессе сбора советов](/en/guides/making_decisions/advice_process).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f19e32088d70eec4:
    english: "## When to use Advice"
    translation: "## Когда использовать «Совет»"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d4c7e7da6f2d5860:
    english: Use Advice when the decision maker wants input from people with relevant expertise or people affected by the decision. It works well for supplier choices, operational decisions, policy drafts, and decisions within a delegated role.
    translation: Используйте «Совет», когда человеку, принимающему решение, нужно мнение людей с подходящим опытом или тех, кого затронет решение. Этот формат подходит для выбора поставщика, рабочих решений, проектов правил и решений в рамках делегированных полномочий.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a81e33e00080fbe4:
    english: Advice is not an approval vote. Say who will make the decision, what constraints apply, and how they will consider the responses.
    translation: "«Совет» не служит голосованием за одобрение. Укажите, кто примет решение, какие есть ограничения и как будут учтены ответы."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4be7ef0783f6e444:
    english: "## Example: choose a washing supplier"
    translation: "## Пример: выбор поставщика услуг по мойке"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d8157e98107798c6:
    english: Oatmilk Cooperative's operations coordinator must select a washing supplier. They invite advice about capacity, food-safety records, water use, service response times, and support.
    translation: Координатор по операционной работе кооператива Oatmilk должен выбрать поставщика услуг по мойке. Он просит участников высказать мнение о производительности, соблюдении требований безопасности пищевых продуктов, расходе воды, скорости обслуживания и поддержке.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9703f1f9474243af:
    english: "## Set up the proposal"
    translation: "## Создайте предложение"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6b9c305f0f4000d9:
    english: Describe the decision, name the decision maker, and include the information participants need. Invite people who are affected or have relevant knowledge. The default options let someone offer advice or abstain.
    translation: Опишите решение, назовите человека, который его примет, и добавьте информацию, необходимую участникам. Пригласите людей, которых затронет решение или у которых есть подходящие знания. Стандартные варианты ответа позволяют дать совет или воздержаться.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Проголосуйте"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0a259af7a59899b7:
    english: Participants select **Advice** and give a concrete recommendation, risk, question, or relevant experience. They can abstain when they have no useful input.
    translation: Участники выбирают **Совет** и делятся конкретной рекомендацией, указывают на риск, задают вопрос или рассказывают о подходящем опыте. Если им нечего добавить, они могут воздержаться.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Прочитайте результаты"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1d4bf7b5d0079f87:
    english: The chart confirms who has responded, but the reasons contain the substance of an Advice proposal. Look for constraints, agreements, and conflicting recommendations rather than treating the most common response as the decision.
    translation: Диаграмма показывает, кто ответил, но главное в предложении «Совет» — пояснения участников. Обратите внимание на ограничения, общие позиции и противоречащие друг другу рекомендации. Самый частый ответ не становится решением автоматически.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e9fc01ce6c059f29:
    english: The decision maker publishes an outcome explaining what they decided and how the advice informed it.
    translation: Человек, ответственный за решение, публикует результат и объясняет, что было решено и как советы повлияли на выбор.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
