    translation: "### Emberek meghívása"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e81f85e723885264:
    english: Select **Invite people** to add people after the thread has started.
    translation: A téma elindítása után a **Hívj meg embereket** lehetőséggel adhatsz hozzá résztvevőket.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e38a572cdffad5cb:
    english: "![Invite people in the thread sidebar](../notifying_people/thread_invite_icon.png)"
    translation: "![Hívj meg embereket a szál oldalsávjában](../notifying_people/thread_invite_icon.png)"
    status: machine
