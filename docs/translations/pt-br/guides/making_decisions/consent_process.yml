  '09907f3ec328e9d2':
    english: "## Applying the Consent process on Loomio"
    translation: "## Como aplicar o processo de consentimento no Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d7c91a6160b45cf:
    english: |-
      | **Consent process** | **On Loomio** |
      |---|---|
      | You notice a problem or opportunity and take the initiative. |  |
      | **Present a proposal** <br /><br />Write a clear and concise proposal and share it with people impacted. Describe it in a way so that others will understand what you are proposing. | Start a Loomio **discussion**. <br /><br />Name the proposal in the discussion title, and describe it in the context. |
      | **Questions** (Optional) <br /><br />Invite clarifying questions to help people understand the proposal. <br /><br />*“A clarifying question round helps make sure everyone understands the proposal before they say what they think about it.”* | Run a **Question round**. If it is hidden, a group administrator can make it available from [Poll templates](/en/user_manual/polls/poll_templates/). <br /><br />Ask “what do you need to know so you understand the proposal?” |
      | **Reactions** <br /><br />Invite people to offer reactions and comments to improve the proposal. <br /><br />This is a sensing and responding round - *to actively sense and interpret information from the group and then respond or adapt accordingly.* | Run a **[Sense check](/en/user_manual/polls/proposals/sense_check/)** proposal. <br /><br />*In the title:* Name the proposal and say this is an opportunity to react and comment. <br /><br />*In the proposal details:* Clearly frame the proposal and say why it is important.  Include any background information necessary and a link to the current proposal version.  <br /><br />Invite everyone to respond, and to do so before the proposal closes.  |
      | **Amendment** <br /><br />Consider comments and suggestions from people and amend the proposal as appropriate for the good of your organization. <br /><br />Consider any amendments you want to make for the new proposal version. | Reply to comments and suggestions raised in the Sense check proposal. <br /><br />State an **outcome** to summarize the results of the proposal.  <br /><br />Note any concerns or new information discovered, and outline how the proposal will be amended. <br /><br />Say what will happen next and notify people about the outcome. |
      | **Objections** <br /><br />Present the amended proposal version and invite people to state valid objections - objections that might cause harm. <br /><br />Respond to and integrate each objection by amending the proposal. | Run a **[Consent proposal](/en/user_manual/polls/proposals/consent/)** with the amended proposal. <br /><br />*In the title:* Name the decision to be made. <br /><br />*In the proposal details:* Present the proposal and invite people to vote consent or to state a valid objection - an objection that might cause harm.  Remember we are seeking consent that the proposal is 'safe to try'. <br /><br />Respond to and integrate each objection, creating an amended version of the proposal. <br /><br />Notify everyone that there has been a further amendment, and invite them to reconsider their Consent and “change your vote”. <br /><br />Or run successive Consent proposals as necessary until objections are resolved. |
      | **Outcome** <br /><br />When there are no remaining objections and everyone has consented, the result of the decision is announced. | State an **outcome**. <br /><br />Close the proposal. State an outcome and notify everyone involved. <br /><br />State the decision made and thank people for participation in the process. <br /><br />Summarize results of the process and say what will happen next. <br /><br />If no valid objections remain, state that there is consent the proposal is 'safe to try'. <br /><br />The outcome statement is an important record of the decision for future reference. |
    translation: |-
      | **Processo de consentimento** | **No Loomio** |
      |---|---|
      | Você identifica um problema ou uma oportunidade e toma a iniciativa. |  |
      | **Apresente uma proposta** <br /><br />Escreva uma proposta clara e concisa e compartilhe-a com as pessoas afetadas. Descreva o que você propõe de modo que as outras pessoas entendam. | Inicie uma **discussão** no Loomio. <br /><br />Indique a proposta no título da discussão e descreva-a no contexto. |
      | **Perguntas** (opcional) <br /><br />Convide as pessoas a fazer perguntas para esclarecer a proposta. <br /><br />*“Uma rodada de perguntas ajuda a garantir que todos entendam a proposta antes de dizer o que pensam sobre ela.”* | Faça uma **Rodada de perguntas**. Se ela estiver oculta, um administrador do grupo poderá disponibilizá-la em [Modelos de enquetes](/en/user_manual/polls/poll_templates/). <br /><br />Pergunte: “O que você precisa saber para entender a proposta?” |
      | **Reações** <br /><br />Convide as pessoas a compartilhar reações e comentários para melhorar a proposta. <br /><br />Esta é uma rodada para perceber e responder — *observar e interpretar ativamente as informações do grupo e então responder ou se adaptar.* | Faça uma proposta de **[Verificação de sentido](/en/user_manual/polls/proposals/sense_check/)**. <br /><br />*No título:* Dê um nome à proposta e diga que esta é uma oportunidade para reagir e comentar. <br /><br />*Nos detalhes da proposta:* Apresente a proposta com clareza e explique por que ela é importante. Inclua as informações de contexto necessárias e um link para a versão atual da proposta. <br /><br />Convide todos a responder antes do encerramento da proposta. |
      | **Alteração** <br /><br />Considere os comentários e as sugestões das pessoas e altere a proposta conforme for adequado para a organização. <br /><br />Considere as alterações que você deseja fazer na nova versão da proposta. | Responda aos comentários e às sugestões feitos na proposta de Verificação de sentido. <br /><br />Compartilhe uma **Conclusão** para resumir os resultados da proposta. <br /><br />Registre as preocupações ou novas informações identificadas e explique como a proposta será alterada. <br /><br />Diga o que acontecerá em seguida e notifique as pessoas sobre a conclusão. |
      | **Objeções** <br /><br />Apresente a versão alterada da proposta e convide as pessoas a expressar objeções válidas — aquelas que apontam possíveis danos. <br /><br />Responda a cada objeção e incorpore-a por meio de alterações na proposta. | Faça uma **[proposta de Consentimento](/en/user_manual/polls/proposals/consent/)** com a versão alterada. <br /><br />*No título:* Indique a decisão a ser tomada. <br /><br />*Nos detalhes da proposta:* Apresente a proposta e convide as pessoas a votar pelo consentimento ou a expressar uma objeção válida — uma objeção que aponte possíveis danos. Lembre-se de que o objetivo é obter consentimento de que a proposta é ‘segura para experimentar’. <br /><br />Responda a cada objeção e incorpore-a, criando uma nova versão da proposta. <br /><br />Notifique todos sobre a nova alteração e convide as pessoas a reconsiderar seu consentimento e a “alterar seu voto”. <br /><br />Se necessário, faça outras propostas de Consentimento até resolver as objeções. |
      | **Conclusão** <br /><br />Quando não restarem objeções e todos tiverem consentido, anuncie o resultado da decisão. | Compartilhe uma **Conclusão**. <br /><br />Encerre a proposta. Compartilhe a conclusão e notifique todas as pessoas envolvidas. <br /><br />Informe a decisão tomada e agradeça às pessoas pela participação no processo. <br /><br />Resuma os resultados do processo e diga o que acontecerá em seguida. <br /><br />Se não restarem objeções válidas, declare que há consentimento de que a proposta é ‘segura para experimentar’. <br /><br />A conclusão é um registro importante da decisão para consultas futuras. |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
