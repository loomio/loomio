    translated_on: '2026-09-29'
  b7e072e37bdc12c0:
    english: Use **Task list** to add checkboxes. After posting the list, tasks can be assigned to someone and given a due date.
    translation: Mit **Aufgabenliste** fügst du Kontrollkästchen hinzu. Nachdem du die Liste veröffentlicht hast, kannst du Aufgaben einer Person zuweisen und ein Fälligkeitsdatum festlegen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  74542f03c2aabd7f:
    english: See the page on [Tasks](/en/user_manual/discussions/tasks/) for more information.
    translation: Weitere Informationen findest du auf der Seite [Aufgaben](/en/user_manual/discussions/tasks/).
    status: machine
