navigation_title: Scegliere
blocks:
  581de5d50d3dc442:
    english: "# Choose"
    translation: "# Scegliere"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  733b320e0407fbdc:
    english: Choose is a simple poll for finding the most popular option or making a shortlist. Participants select one or more options, depending on the limits you set. This voting method is commonly known as multiple choice.
    translation: Scegliere è un sondaggio semplice per trovare l'opzione più popolare o creare una lista ristretta. I partecipanti selezionano una o più opzioni, secondo i limiti che imposti. Questo metodo di voto è comunemente chiamato scelta multipla.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '09aefb579b50874b':
    english: "## When to use Choose"
    translation: "## Quando usare Scegliere"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  be35cf72fcaf9c4d:
    english: 'Use Choose when the options are distinct and you need to count how many people select each one. It works well for:'
    translation: 'Usa Scegliere quando le opzioni sono distinte e vuoi contare quante persone selezionano ciascuna. È utile per:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dcc6f6b9238155b2:
    english: |-
      - choosing one venue from a shortlist;
      - selecting up to three topics for an agenda;
      - deciding which design should proceed to the next round; or
      - checking which services members intend to use.
    translation: |-
      - scegliere un luogo da una lista ristretta;
      - selezionare fino a tre argomenti per un ordine del giorno;
      - decidere quale progetto passerà alla fase successiva; oppure
      - verificare quali servizi i membri intendono usare.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3770d0653b752de5:
    english: Choose records selections, not the strength or order of a person's preferences. Use [Score](/en/user_manual/polls/score/) to measure how strongly people support every option, [Allocate](/en/user_manual/polls/allocate/) when there is a limited budget, or [Rank](/en/user_manual/polls/rank/) when preference order matters.
    translation: Scegliere registra le opzioni selezionate, non quanto siano preferite né il loro ordine di preferenza. Usa [Valutazione](/en/user_manual/polls/score/) per misurare quanto sostegno riceve ogni opzione, [Ripartizione](/en/user_manual/polls/allocate/) quando il budget è limitato, oppure [Classifica](/en/user_manual/polls/rank/) quando conta l'ordine delle preferenze.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f15aca327e894f30:
    english: "## Example: set a planning-meeting agenda"
    translation: "## Esempio: definire l'ordine del giorno di una riunione di pianificazione"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f51e09afa0ed1e53:
    english: Oatmilk Cooperative needs to decide which parts of a returnable-bottle trial need the most time at its next planning meeting. The poll asks each person to choose up to two topics. Its details explain how the result will be used, and each option includes enough information to distinguish it from the others.
    translation: La cooperativa Oatmilk deve decidere a quali aspetti di una sperimentazione con bottiglie a rendere dedicare più tempo nella prossima riunione di pianificazione. Il sondaggio chiede a ogni persona di scegliere fino a due argomenti. I dettagli spiegano come verrà usato il risultato e ogni opzione contiene informazioni sufficienti per distinguerla dalle altre.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c74ebb16f872b3c6:
    english: "## Set up the poll"
    translation: "## Impostare il sondaggio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  abc749fec8671661:
    english: Give the poll a specific question as its title. In **Details**, explain what participants should consider and what will happen with the result. Add each available option, then set the **Minimum choices** and **Maximum choices**.
    translation: Usa una domanda precisa come titolo del sondaggio. In **Dettagli**, spiega cosa devono considerare i partecipanti e come verrà usato il risultato. Aggiungi le opzioni disponibili, poi imposta **Scelte minime** e **Massima scelta**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e878ddc9f61dd243:
    english: Set both limits to 1 when participants must choose exactly one option. Set a higher maximum when you want a shortlist. Avoid allowing so many choices that participants can select nearly every option, because that makes the result less useful.
    translation: 'Imposta entrambi i limiti a 1 se i partecipanti devono scegliere esattamente un''opzione. Imposta un limite massimo più alto se vuoi ottenere una lista ristretta. Evita di consentire così tante scelte da permettere ai partecipanti di selezionare quasi tutte le opzioni: il risultato sarebbe meno utile.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  152fec5018fc232b:
    english: Use the pencil icon beside an option to add a meaning or further explanation. This is useful when a short option name could be interpreted in different ways.
    translation: Usa l'icona della matita accanto a un'opzione per chiarirne il significato o aggiungere una spiegazione. È utile quando un nome breve può essere interpretato in modi diversi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  59e405cf9a028c8d:
    english: Under **More settings**, **Show options in random order** can reduce the effect of always presenting one option first.
    translation: In **Altre impostazioni**, **Mostra le opzioni in ordine casuale** può ridurre l'effetto di presentare sempre la stessa opzione per prima.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Votare"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7db2d0e58e5fb4e4:
    english: The vote form tells participants how many options they may select. In this example, the voter selects **Cafe collection schedule** and **Washing workflow**, then gives a reason connecting those choices to the trial.
    translation: Il modulo di voto indica ai partecipanti quante opzioni possono selezionare. In questo esempio, una persona seleziona **Calendario di raccolta presso i bar** e **Procedura di lavaggio**, poi spiega come queste scelte riguardano la sperimentazione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e55e4b8950a5fd46:
    english: A reason can reveal why an option matters and what work participants expect it to cover. If reasons are important to the decision, configure the vote-reason setting before starting the poll.
    translation: Una motivazione può chiarire perché un'opzione è importante e quali attività i partecipanti si aspettano che comprenda. Se le motivazioni sono importanti per la decisione, configura la relativa impostazione prima di avviare il sondaggio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Leggere i risultati"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c1ec47f66384e3bb:
    english: The results show the share of all selections received by each option, the number of voters who selected it, and who has not voted. Because each person could choose two options, the percentages describe selections rather than a percentage of people.
    translation: I risultati mostrano la quota delle selezioni totali ricevuta da ogni opzione, il numero di persone che l'hanno selezionata e chi non ha votato. Poiché ogni persona poteva scegliere due opzioni, le percentuali si riferiscono alle selezioni, non alle persone.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6cbc0f9d6fdf6727:
    english: In this example, **Cafe collection schedule** has three selections. **Washing workflow** and **Return-rate reporting** each have two. The result supports giving cafe collections the most agenda time, but the tied topics still require the organizer to decide how the remaining time is divided.
    translation: In questo esempio, **Calendario di raccolta presso i bar** ha ricevuto tre selezioni. **Procedura di lavaggio** e **Rendicontazione dei tassi di restituzione** ne hanno ricevute due ciascuna. Il risultato suggerisce di dedicare più tempo alla raccolta presso i bar, ma chi organizza la riunione deve ancora decidere come dividere il tempo rimanente tra gli altri due argomenti, che hanno ricevuto lo stesso numero di selezioni.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  adb7eb28e16616be:
    english: When the poll closes, publish an **Outcome** explaining what the group will do with the result.
    translation: Alla chiusura del sondaggio, pubblica una **Conclusione** che spieghi come il gruppo userà il risultato.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
