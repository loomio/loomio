---
navigation_title: Preparazione
blocks:
  4fdd26e2ff6dd9e5:
    english: "# Preparation"
    translation: "# Preparazione"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4fc02624e97369e9:
    english: |-
      > <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../silvia_200.png"> For every minute of time with the group, consider spending 3 minutes planning. That means spending three hours preparing for a one hour session. Only as you improve should you spend less time planning.
      >
      > — Silvia Zuur
    translation: |-
      > <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../silvia_200.png"> Per ogni minuto trascorso con il gruppo, considera di dedicarne tre alla pianificazione. Per una sessione di un'ora, significa prepararsi per tre ore. Riduci il tempo dedicato alla pianificazione solo quando avrai acquisito esperienza.
      >
      > — Silvia Zuur
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d18832ab8f94fa1b:
    english: "## Understand Purpose"
    translation: "## Comprendere lo scopo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  26d88950f0aac205:
    english: Clarification of purpose is one of the highest value offerings of a skilled facilitator — if they can help the group nail that, everything else is possible. Purpose operates at the level of a group as a whole, and at the level of individual discussions/decisions. Purpose is what enables judgment calls about what tools to deploy, what interventions to enact, and what outcomes to aim for. Lack of shared understanding about purpose can be fatal to a discussion, or to the group itself.
    translation: 'Chiarire lo scopo è uno dei contributi più preziosi di chi facilita un gruppo: quando lo scopo è chiaro, tutto il resto diventa possibile. Lo scopo riguarda sia il gruppo nel suo insieme sia le singole discussioni e decisioni. Aiuta a scegliere gli strumenti, gli interventi e i risultati a cui puntare. Se manca una comprensione condivisa dello scopo, una discussione può fallire, e così anche il gruppo.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4276182ea8afaf36:
    english: "> Always refer back to your purpose-finding questions to check that you’re covering off what the participants want to learn or achieve. — Silvia Zuur"
    translation: "> Torna sempre alle domande che hai posto per individuare lo scopo. Ti aiuteranno a verificare se stai affrontando ciò che i partecipanti vogliono imparare o ottenere. — Silvia Zuur"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aabfa9d842af2688:
    english: On Loomio
    translation: Su Loomio
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ea5f19b8970e4db6:
    english: |-
      * The app offers space for explication of purpose, such as the [group description](/en/user_manual/groups/starting_a_group/#group-description) and [discussion context](/en/user_manual/discussions/using_discussions/#discussion-context) fields.
      * A Loomio discussion *about* purpose is a great place to start with your group, if it's not already clear.
      * Our analytics (stats about how people use the software) show that groups with a clear shared purpose are more successful.
      * [Customer stories and case studies](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help) we've collected emphasise the importance of setting a collective purpose.
    translation: |-
      * L'app offre spazi per chiarire lo scopo, come i campi [descrizione del gruppo](/en/user_manual/groups/starting_a_group/#group-description) e [contesto della discussione](/en/user_manual/discussions/using_discussions/#discussion-context).
      * Se lo scopo non è ancora chiaro, puoi iniziare con il gruppo una discussione *sullo* scopo.
      * Le nostre statistiche sull'uso del software mostrano che i gruppi con uno scopo condiviso e chiaro ottengono risultati migliori.
      * Le [storie dei clienti e i casi di studio](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help) che abbiamo raccolto mostrano l'importanza di definire uno scopo collettivo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e7d962ee3ac4e476:
    english: "## Rearrange the Furniture"
    translation: "## Riorganizzare lo spazio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bee66f99abaa8e2a:
    english: Desiging the space you invite people into greatly influences their experience. Every gathering is unique, and deserves a setup to suit. Familiarity signals safety, while changing the environment cues openness to new ideas.
    translation: Il modo in cui prepari lo spazio in cui inviti le persone influisce molto sulla loro esperienza. Ogni incontro è diverso e richiede una disposizione adatta. Un ambiente familiare può dare sicurezza; cambiarlo può favorire l'apertura a nuove idee.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b98fa9d3e5726891:
    english: In offline spaces, literally rearranging the furniture is a habit that helps facilitators get into the right zone to hold space, and prompts them to think about what’s unique in that session. Imagine the difference between everyone seated in rows versus everyone in a circle.
    translation: Negli incontri in presenza, spostare davvero i mobili aiuta chi facilita a prepararsi ad accogliere il gruppo e a riflettere su ciò che rende unico l'incontro. Pensa alla differenza tra far sedere tutti in file e farli sedere in cerchio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  546ba20d5778bb25:
    english: |-
      * Inviting people into a new digital space specifically for decision making is powerful — there’s a “threshold crossing” experience making it as distinct from other online spaces (which might be for socialising or other functions).
      * [Customising your group photo](/en/user_manual/groups/starting_a_group/#upload-a-group-photo) is a prime opportunity to craft the feeling of the space.
      * The group description is a main piece of “furniture” on the group page, and [you can customise it](/en/user_manual/groups/starting_a_group/#group-description) to suit.
    translation: |-
      * Invitare le persone in un nuovo spazio digitale dedicato alle decisioni può avere un forte effetto: entrare in quello spazio segna un passaggio e lo distingue dagli altri spazi online, magari usati per socializzare o per altre attività.
      * [Personalizzare la foto del gruppo](/en/user_manual/groups/starting_a_group/#upload-a-group-photo) è un modo per dare carattere a questo spazio.
      * La descrizione del gruppo è uno degli elementi principali della pagina del gruppo e [puoi personalizzarla](/en/user_manual/groups/starting_a_group/#group-description) in base alle esigenze.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bb1d23808a93d41b:
    english: "## Supplies, Tools, Materials"
    translation: "## Risorse, strumenti e materiali"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b5e22b09672c3587:
    english: When facilitation is running smoothly, all the supplies a group needs are right at hand. In offline spaces, this stuff includes post-its, pens, paper, name tags, printouts, and background material. Every step a facilitator takes to be well-prepared in this way allows more time and energy for the work.
    translation: Quando la facilitazione funziona bene, il gruppo ha a portata di mano tutto ciò che gli serve. Negli incontri in presenza possono essere foglietti adesivi, penne, carta, cartellini con i nomi, stampe e materiali di riferimento. Preparare questi materiali lascia più tempo ed energie per il lavoro del gruppo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7da21174f12dfb9e:
    english: |-
      * Many groups use the group description to link to a shared drive of collaborative documents, background information, the group's project management or task tracking system, a list of contacts, etc.
      * Each thread deserves consideration of what people might need to engage with it — putting all the information right at hand is essential (for example, if you reference something, linking directly to it is much more effective than expecting people to search for it).
    translation: |-
      * Molti gruppi usano la descrizione del gruppo per inserire link a una cartella condivisa con documenti collaborativi, informazioni di riferimento, strumenti per gestire il progetto o le attività, elenchi di contatti e altro.
      * Per ogni discussione, pensa a ciò che serve alle persone per partecipare e rendilo facilmente accessibile. Per esempio, se citi una risorsa, inserisci un link diretto: è più utile che chiedere alle persone di cercarla.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  35dd82fcf7e543d8:
    english: "## Design the Experience"
    translation: "## Progettare l'esperienza"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fbc88dd9b9738343:
    english: 'Once they have the basic pieces in place (purpose, tools, background info), good facilitators take time to think through the design of the experience they are inviting: the situation, what success could look like, all the possible pathways and choices. They don’t jump in without a considered design.'
    translation: Una volta definiti gli elementi di base (scopo, strumenti e informazioni di riferimento), chi facilita dedica tempo a progettare l'esperienza a cui invita le persone. Considera la situazione, i possibili risultati, i percorsi e le scelte. Non inizia senza averci riflettuto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a4dce16ca48a4324:
    english: Time and time again we have seen people drastically underestimate the need for prep and design. Stop and think about the experience you want to host, before jumping straight in. Investment in design is paid back many times over by success later.
    translation: Abbiamo visto molte volte persone sottovalutare il tempo necessario per preparare e progettare un'attività. Prima di iniziare, fermati a pensare all'esperienza che vuoi proporre. Il tempo investito nella progettazione contribuirà ai risultati successivi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e91f002ee6e53550:
    english: "* Loomio’s most basic functionality follows the structure of good facilitation by design: invite people, discuss a topic, gather divergent input, converge into a specific proposal, test for agreement, confirm outcome."
    translation: "* Le funzioni di base di Loomio seguono un percorso di facilitazione: invita le persone, discuti un tema, raccogli punti di vista diversi, formula una proposta specifica, verifica il consenso e conferma la conclusione."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  211e08fc109e6449:
    english: |-
      * Skilled users are already adapting Loomio for various experience designs — such as a multi-step consultation processes, signing off documents, etc. Each job, when facilitated effectively, takes a certain repeatable shape.
      * Online collaboration design doesn't have to reinvent the wheel. Trust what you know works, and translate it. Many tried and tested offline processes can be adapted to the online space (ex: the [Advice Process](/en/guides/making_decisions/advice_process.html)).
      * [Case studies](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help) of thoughtfully designed processes could be used as “recipes” — if you're not sure what design to use, start by seeing what others have tried.
    translation: |-
      * Chi ha esperienza con Loomio lo adatta già a diversi percorsi, come consultazioni in più fasi o approvazioni di documenti. Quando è facilitata in modo efficace, ogni attività assume una struttura che si può riutilizzare.
      * Per progettare la collaborazione online non serve partire da zero. Parti dai metodi che conosci e adattali. Molti processi collaudati negli incontri in presenza funzionano anche online (per esempio, il [processo dei consigli](/en/guides/making_decisions/advice_process.html)).
      * I [casi di studio](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help) di processi progettati con cura possono servirti da esempio. Se non sai quale percorso scegliere, guarda che cosa hanno provato altri gruppi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7e99e2ddc63d7a98:
    english: "## Contextualise the Moment"
    translation: "## Considerare il momento"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  427b66f23f4b3c09:
    english: Discussions do not occur in a vacuum, but in the larger context of the group’s history and practice. To be effective, facilitated experiences have to occur with the right timing, and fit in with the rest of the group’s process.
    translation: 'Le discussioni non avvengono nel vuoto: fanno parte della storia e delle pratiche del gruppo. Per essere efficaci, le attività facilitate devono avvenire al momento giusto e inserirsi nel percorso del gruppo.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  48a889b09297e38b:
    english: 'Key Context Questions:'
    translation: 'Domande utili per capire il contesto:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7eccc4a4e4a3b175:
    english: |-
      * Is this a moment of transition?
      * Is this an enhancement of existing practice?
      * Is this one of many concurrent processes, or a singular focus?
      * Are we here to solve a problem, or go deeper, wider, narrower?
    translation: |-
      * È un momento di transizione?
      * Si tratta di migliorare una pratica esistente?
      * È uno dei tanti processi in corso o l'unica priorità?
      * Vogliamo risolvere un problema o approfondire, ampliare o restringere il campo?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c7c8ce0838a076cd:
    english: |-
      * Loomio groups nearly always have a “champion”, who understands the group’s context and makes the call about whether introducing Loomio is right for them.
      * It's not wise to try to change everything at once. Any time Loomio fits nicely into existing workflows, groups will adopt it better.
      * Good timing is when the group is ready to incorporate online collaborative practice effectively. They have to feel the pain of not having the online decision-making space, and be motivated to solve that problem.
      * Consider the group’s attention economy to determine when the right time to raise a given topic might be. Collective attention is a limited resource.
      * Many groups are not even cognisant of their existing collaborative practice and habits, much less clear about how Loomio might fit in. Start with a discussion about the current way of doing things, and what's working or not working.
    translation: |-
      * Nei gruppi che usano Loomio c'è quasi sempre una persona che conosce il contesto del gruppo e valuta se sia il momento giusto per introdurlo.
      * Cercare di cambiare tutto insieme è poco utile. I gruppi adottano Loomio più facilmente quando si inserisce nei flussi di lavoro esistenti.
      * Il momento giusto arriva quando il gruppo è pronto a collaborare online in modo efficace. Deve riconoscere la mancanza di uno spazio per prendere decisioni online ed essere motivato a risolvere il problema.
      * Considera quanta attenzione il gruppo può dedicare a un tema per scegliere quando proporlo. L'attenzione collettiva è una risorsa limitata.
      * Molti gruppi non sono pienamente consapevoli delle proprie abitudini di collaborazione, né sanno come Loomio potrebbe inserirsi nel loro lavoro. Inizia con una discussione su come lavorano oggi e su ciò che funziona o non funziona.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7bc2616a0ec0b1dc:
    english: "## The Role of the Facilitator"
    translation: "## Il ruolo di chi facilita"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c6d08854a875262a:
    english: Good facilitation requires self-awareness on an individual and collective level. Lack of understanding of the role can lead to misunderstandings, conflict, or unsafe situations.
    translation: Una buona facilitazione richiede consapevolezza di sé, sia individuale sia collettiva. Se il ruolo di chi facilita non è chiaro, possono nascere malintesi, conflitti o situazioni in cui le persone non si sentono al sicuro.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aa59e3e4d08a95b7:
    english: "> Have the power handed over to you. When you’re invited into a new group or organization, everybody will be thinking: Who’s this joker? Why should we listen to them? Get somebody who the participants know and trust to introduce you. This builds you up in the participants' minds and helps to hand over the power over to you. — Silvia Zuur"
    translation: "> Fai in modo che il ruolo ti venga affidato. Quando vieni invitato in un nuovo gruppo o in una nuova organizzazione, le persone si chiederanno: chi è questa persona? Perché dovremmo ascoltarla? Chiedi a qualcuno che i partecipanti conoscono e di cui si fidano di presentarti. Questo li aiuta a riconoscere il tuo ruolo e ad affidarti l'autorità necessaria. — Silvia Zuur"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  02d38d1def45d150:
    english: |-
      ### Consent
      It’s critical that the group consents to be facilitated. Attempting to facilitate otherwise can be at worst coercive (unfair to the group) and dangerous (unfair to the facilitator) — and will face resistance and confusion. Facilitators put themselves in a vulnerable position; they must have mandate or they should not agree to engage. Consent is critical for both the facilitator and participants.
    translation: |-
      ### Consenso
      È essenziale che il gruppo acconsenta alla facilitazione. Altrimenti, il tentativo può diventare coercitivo per il gruppo e rischioso per chi facilita, oltre a generare resistenza e confusione. Chi facilita si espone: deve avere un mandato, oppure non dovrebbe accettare l'incarico. Il consenso è essenziale per chi facilita e per i partecipanti.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a1a8c6ca89dad49a:
    english: |-
      ### Responsibility
      Once a facilitator takes up a mandate, they carry enhanced responsibilities. Facilitators have more claim to floor time, and directing the group’s attention. This has to be used in service to the whole, not for a personal agenda. The words and demeanor of the facilitator will also have a disproportionate effect, meaning they have to act with heightened consideration.
    translation: |-
      ### Responsabilità
      Quando accetta un mandato, chi facilita assume maggiori responsabilità. Può prendere la parola più spesso e orientare l'attenzione del gruppo. Deve farlo nell'interesse di tutti, non per perseguire obiettivi personali. Anche le sue parole e il suo comportamento hanno un peso maggiore, quindi deve agire con particolare attenzione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b5f6b4ebd477c97c:
    english: |-
      ### Power
      Facilitation by nature introduces power differentials. If the facilitator cannot exercise power in certain ways, they cannot do their job. For example, to keep a discussion on topic the facilitator might interrupt someone, or say that a certain way of interacting is not OK. It’s not appropriate to expect a facilitator to shoulder responsibility for the experience without giving them the powers they need to deliver successfully. There is no one right answer about how much power, but it has to be balanced with the level of responsibility.
    translation: |-
      ### Potere
      La facilitazione crea inevitabilmente differenze di potere. Chi facilita deve poter esercitare una certa autorità per svolgere il proprio compito. Per esempio, può interrompere qualcuno per riportare la discussione sul tema o segnalare che un modo di interagire non è appropriato. Non è giusto attribuirgli la responsabilità dell'esperienza senza dargli l'autorità necessaria. Non esiste un unico livello di autorità adatto a tutti i casi, ma deve essere proporzionato alla responsabilità.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c82df3fe42db014a:
    english: |-
      ### Responsiveness
      Facilitators do their best work when they can adapt effectively to the emergent reality. Human beings are endlessly complex, and groups of them exponentially more so. Rigid adherence to a plan or protocol without flexibility can set the group up to fail. If a facilitator is not allowed or not willing to adapt to changing circumstance, they cannot effectively hold the space for dynamic humans.
    translation: |-
      ### Capacità di adattamento
      Chi facilita lavora meglio quando sa adattarsi a ciò che emerge. Le persone sono complesse e i gruppi lo sono ancora di più. Seguire rigidamente un piano o una procedura può ostacolare il gruppo. Se chi facilita non può o non vuole adattarsi al cambiamento, non riesce a sostenere efficacemente il lavoro di un gruppo dinamico.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aad36b296834ab22:
    english: "> Wear and un-wear the facilitation-hat. A challenge many people face is trying to facilitate meetings and workshops with their own team. As a facilitator, they need to be neutral. But as a team member, they have valuable insights to share. Make it really clear when you’re a facilitator and when you’re being a participant. — Silvia Zuur"
    translation: "> Indossa e togli il cappello di chi facilita. Per molte persone è difficile facilitare riunioni e laboratori del proprio gruppo di lavoro. Nel ruolo di facilitazione devono essere neutrali, ma come membri del gruppo hanno idee utili da condividere. Rendi sempre chiaro quando stai facilitando e quando partecipi alla discussione. — Silvia Zuur"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  85c4fcf7a6e72361:
    english: |-
      * Many groups using Loomio are experienced with facilitation and already have a shared understanding of the role. They already adapt the tool to meet these needs with some success.
      * Often the person who starts a discussion is assumed to be facilitating it, barring another agreed understanding in the group. Clarity about who is facilitating can greatly enhance mutual safety and success.
      * Loomio naturally creates a dynamic and open to distributed acts of facilitation, such as users tagging in others, requests to stay on topic, suggestions of the right timing for a proposal, etc — but this is often left implicit. Explicitly naming what acts of facilitation are and discussing whether this role is centralised or distributed can clarify the role.
      * Implicit distributed facilitation can be the default starting place for an online group (ie, no discussion of facilitation as a named role), but that setup is actually best for advanced groups prgressing past working with explicit facilitation.
    translation: |-
      * Molti gruppi che usano Loomio hanno già esperienza di facilitazione e condividono una comprensione del ruolo. Adattano lo strumento alle proprie esigenze con buoni risultati.
      * Spesso si presume che chi avvia una discussione la faciliti, a meno che il gruppo non abbia concordato diversamente. Chiarire chi facilita può aiutare le persone a sentirsi più sicure e a lavorare meglio insieme.
      * Loomio favorisce una facilitazione distribuita: le persone possono menzionare altri partecipanti, chiedere di restare sul tema o suggerire quando presentare una proposta. Spesso, però, queste azioni restano implicite. Descriverle come atti di facilitazione e discutere se il ruolo sia concentrato in una persona o distribuito può renderlo più chiaro.
      * Un gruppo online può iniziare con una facilitazione distribuita implicita, senza parlare esplicitamente del ruolo. Questa modalità, però, è più adatta a gruppi esperti che hanno già lavorato con una facilitazione esplicita.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
