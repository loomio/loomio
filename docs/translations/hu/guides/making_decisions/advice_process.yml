  fce0c96bcc92d0aa:
    english: "> *“With the advice process, any person can make any decision but must seek advice from affected parties and people with expertise.” - Frederick Laloux, Reinventing Organizations.*"
    translation: "> *„A tanácsadási folyamatban bárki meghozhat bármilyen döntést, de ki kell kérnie az érintettek és a hozzáértők tanácsát.” – Frederick Laloux, Reinventing Organizations.*"
    status: machine
