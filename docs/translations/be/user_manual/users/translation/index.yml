    translation: "## Пераклад інтэрфейсу"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  04fdf482671e91c1:
    english: "Loomio will automatically detect what your preferred language is when you visit the app with your browser. \nIf you want to change the preferred language, you can do so from the \"Edit profile\" page."
    translation: |-
      Калі вы адкрываеце Loomio у браўзеры, праграма аўтаматычна вызначае мову, якой вы аддаеце перавагу.
      Каб змяніць яе, адкрыйце старонку «Рэдагаваць профіль».
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
