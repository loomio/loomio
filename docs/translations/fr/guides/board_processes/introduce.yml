---
navigation_title: Présenter Loomio à votre conseil d’administration
blocks:
  2d7d9e9285159d4f:
    english: "# Introducing Loomio to your board"
    translation: "# Présenter Loomio à votre conseil d’administration"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6a42b6e2aba774c1:
    english: Loomio can become the online place where your board or committee meet, discuss, decide and build an auditable record for your organization.
    translation: Loomio peut devenir l’espace en ligne où votre conseil d’administration ou votre comité se réunit, discute, prend des décisions et conserve une trace vérifiable de son travail.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1e26a40fe8b74f47:
    english: Start with the general sequence in [Introducing Loomio to your group](/en/user_manual/overview/introducing_loomio). This page adds considerations specific to boards and committees.
    translation: Commencez par les étapes générales de [Présenter Loomio à votre groupe](/en/user_manual/overview/introducing_loomio). Cette page aborde les points propres aux conseils d’administration et aux comités.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2999c11b8e274b1b:
    english: However Loomio will be of little value if only some of your board participate.  Information and communication will likely remain scattered over multiple tools, lost in email inboxes and the confusion will waste everyone's time.
    translation: Loomio sera peu utile si une partie seulement de votre conseil participe. Les informations et les échanges risquent de rester dispersés entre plusieurs outils et de se perdre dans les boîtes de réception. Cette confusion fera perdre du temps à tout le monde.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  28097dbe6dfd2fd7:
    english: 'Consider the problem you are trying to solve by using Loomio, say to improve and track communication or build institutional memory.  Then commit as a board to move your work into Loomio, and encourage everyone to make a genuine effort.  '
    translation: Déterminez le problème que vous souhaitez résoudre avec Loomio, par exemple améliorer et suivre les échanges ou conserver la mémoire de votre organisation. Engagez-vous ensuite, en tant que conseil, à transférer votre travail dans Loomio et encouragez chacun à participer.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  449e6d5c90588dd2:
    english: As administrator your primary objective is to set up Loomio effectively for your board.
    translation: En tant qu’administrateur, votre priorité est de configurer Loomio pour que votre conseil puisse l’utiliser efficacement.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '08969c9eca0d9855':
    english: 'Aim to encourage directors to join and participate. They should be able to:'
    translation: 'Encouragez les membres du conseil à rejoindre le groupe et à participer. Ils doivent pouvoir :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  70bf0ec81830055e:
    english: |-
      - Sign in to Loomio
      - Read and comment on threads
      - Vote in polls
      - See how your governance practices work in Loomio
    translation: |-
      - Se connecter à Loomio
      - Lire et commenter les discussions
      - Voter dans les sondages
      - Voir comment leurs pratiques de gouvernance se déroulent dans Loomio
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d41ec118bb86c93f:
    english: "## Check technical proficiency "
    translation: "## Vérifier les compétences numériques"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  728e1c8d201cacca:
    english: Board members will need a computer or smartphone connected to the internet. They must be capable of sending and receiving email, browsing the web, reading digital documents, viewing and hearing videos.
    translation: Les membres du conseil auront besoin d’un ordinateur ou d’un smartphone connecté à Internet. Ils doivent savoir envoyer et recevoir des courriels, naviguer sur le Web, lire des documents numériques et regarder des vidéos avec le son.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  de1b1186edaff7c6:
    english: 'Check that members have all of the following:'
    translation: 'Vérifiez que les membres disposent de tous les éléments suivants :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9932640dbf8944e3:
    english: |-
      - an up-to-date device—a computer, tablet or smart phone with email and a modern internet browser
      - internet service via WIFI, ethernet cable or mobile data plan (3G or above)
      - capability to send and receive email, browse the internet, download documents and play videos.
    translation: |-
      - un appareil à jour — ordinateur, tablette ou smartphone — permettant d’utiliser la messagerie électronique et un navigateur Web récent
      - un accès à Internet par Wi-Fi, câble Ethernet ou forfait de données mobiles (3G ou supérieur)
      - la capacité d’envoyer et de recevoir des courriels, de naviguer sur Internet, de télécharger des documents et de lire des vidéos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4496ce2ee6172b32:
    english: Loomio works with all standard internet browsers such as Google Chrome, Microsoft Edge, Firefox and Apple Safari. Old out-of-date browsers such as Microsoft Internet Explorer may not work.
    translation: Loomio fonctionne avec les navigateurs Web courants, notamment Google Chrome, Microsoft Edge, Firefox et Apple Safari. Les navigateurs anciens, comme Microsoft Internet Explorer, peuvent ne pas fonctionner.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bd5dc5f2d0f56a28:
    english: If you have a problem using Loomio on your device, [Contact Loomio support](/contact).
    translation: Si vous rencontrez un problème pour utiliser Loomio sur votre appareil, [contactez l’assistance Loomio](/contact).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ca7b25bb2d86ba90:
    english: "## Configure your group"
    translation: "## Configurer votre groupe"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  92712f3a984128af:
    english: |-
      ### Group Description
      The group description is the first place people see when they arrive into your Loomio group. Write it to help new members  understand the purpose of the group and the work you will do together. Provide any other information that orients people and encourages them to participate.
    translation: |-
      ### Description du groupe
      La description du groupe est la première chose que les personnes voient en arrivant dans votre groupe Loomio. Rédigez-la pour aider les nouveaux membres à comprendre le rôle du groupe et le travail que vous ferez ensemble. Ajoutez toute information qui les aidera à s’orienter et à participer.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7e018e436df9afa1:
    english: 'For example, welcome people and let them know that this is there online space for communication and governance of your organization:'
    translation: 'Par exemple, souhaitez la bienvenue aux membres et expliquez-leur que ce groupe est leur espace en ligne pour communiquer et organiser la gouvernance de votre organisation :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  826a76aa71e6d689:
    english: |-
      - Remind members of the purpose of the board or committee.
      - Outline how you intend to use Loomio; prepare for meetings, progress discussions, make decisions and stay in context between meetings.
      - Be clear who has access to the group, can read and participate.
      - Attach or link any background or governance documents.
    translation: |-
      - Rappelez aux membres le rôle du conseil d’administration ou du comité.
      - Expliquez comment vous comptez utiliser Loomio : préparer les réunions, faire avancer les discussions, prendre des décisions et suivre le travail entre les réunions.
      - Précisez qui a accès au groupe et peut lire son contenu et participer.
      - Joignez les documents de référence et de gouvernance ou ajoutez des liens vers ceux-ci.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  00c14924ec3f24cb:
    english: |-
      ### Check privacy and permission settings
      Loomio groups are **Secret** by default, which means only the people you specifically invite to the group know of its existence.
    translation: |-
      ### Vérifier les paramètres de confidentialité et les permissions
      Les groupes Loomio sont **Secret** par défaut. Seules les personnes que vous invitez au groupe savent alors qu’il existe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9158ac7ea9b0db99:
    english: See [member permissions](/en/user_manual/groups/settings#permissions), and set to suit the proficiency of members in your group.  It may help to remove some permissions to avoid confusion as you are starting out. You can always restore permissions and everyone becomes more familiar with Loomio.
    translation: Consultez les [permissions des membres](/en/user_manual/groups/settings#permissions) et adaptez-les aux compétences des membres de votre groupe. Au début, retirer certaines permissions peut éviter les confusions. Vous pourrez les rétablir quand tout le monde connaîtra mieux Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6a139f43ad2871f8:
    english: |-
      ### Category tags
      Add [category tags](/en/user_manual/discussions/tags/) to suit your organization.  Setting these in advance will help everyone use tags and find the threads and info they are looking for.
    translation: |-
      ### Étiquettes de catégorie
      Ajoutez des [étiquettes de catégorie](/en/user_manual/discussions/tags/) adaptées à votre organisation. Les définir à l’avance aidera chacun à les utiliser et à retrouver les discussions et les informations recherchées.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7435f3589b1f26e3:
    english: |-
      ### Set up your personal profile
      Your [personal profile](/en/user_manual/users/user_profile) will help members of your group easily identify you, and have confidence that the messages they receive from you actually come from you.
    translation: |-
      ### Configurer votre profil personnel
      Votre [profil personnel](/en/user_manual/users/user_profile) aidera les membres de votre groupe à vous reconnaître et à savoir que les messages reçus en votre nom viennent bien de vous.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cf3684fe138b05fe:
    english: |-
      ### Manage group membership
      Make sure all the members of your board or committee have been [invited](/en/user_manual/groups/inviting_people/) to the group, and accepted their invitation.
    translation: |-
      ### Gérer les membres du groupe
      Vérifiez que tous les membres de votre conseil d’administration ou de votre comité ont été [invités](/en/user_manual/groups/inviting_people/) dans le groupe et ont accepté leur invitation.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '029e18cb13c89e7b':
    english: "### Start with a board process"
    translation: "### Commencer par une procédure du conseil"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ba8a6193de9c928f:
    english: The general introduction guide explains how to help everyone comment and vote once. For a board, follow that practice with one recurring governance process, such as preparing an agenda, approving minutes, reviewing a report, or making a small out-of-session decision.
    translation: Le guide général explique comment aider chacun à commenter et à voter une première fois. Pour un conseil d’administration, poursuivez avec une procédure de gouvernance régulière, comme préparer un ordre du jour, approuver un compte-rendu, examiner un rapport ou prendre une décision simple entre deux réunions.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f7c156fde7984f49:
    english: Agree whether decisions made in Loomio take effect when their outcome is published or must be ratified at the next meeting. Record the agreed quorum, vote threshold, eligible voters, and ratification process in the group description or governance documents.
    translation: Convenez si les décisions prises dans Loomio entrent en vigueur dès la publication de leur conclusion ou si elles doivent être ratifiées lors de la réunion suivante. Consignez le quorum convenu, le seuil de voix requis, les personnes autorisées à voter et la procédure de ratification dans la description du groupe ou les documents de gouvernance.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
