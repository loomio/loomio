  712830f14602c6c7:
    english: The permissions tab controls which group operations are available to ordinary members and, for non-secret groups, to non-members. Open **Edit group settings** from the group page, then select **Permissions**.
    translation: Az Engedélyek lapon állíthatod be, mely csoportműveleteket végezhetik el a tagok, illetve a nem titkos csoportokban a nem tagok. A csoport oldalán nyisd meg **A csoportbeállítások szerkesztése** menüpontot, majd válaszd az **Engedélyek** lehetőséget.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b71bf8cce1cb369c:
    english: "![Group permission settings](group_group_settings_permissions.png)"
    translation: "![Csoportengedélyek beállításai](group_group_settings_permissions.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  88e5fcd302a53620:
    english: Administrators retain the ability to manage the group. Enabling a member permission extends that particular action to ordinary members; it does not make them administrators.
    translation: Az adminisztrátorok továbbra is kezelhetik a csoportot. Ha engedélyezel egy műveletet a tagoknak, azt ők is elvégezhetik, de ettől nem válnak adminisztrátorrá.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5b2b9af0f68b7a57:
    english: 'Permissions include whether members can:'
    translation: 'Az engedélyekkel szabályozhatod, hogy a tagok:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8377b499d13690c0:
    english: |-
      - add members or invite guests;
      - send announcements;
      - create subgroups;
      - start and manage discussions;
      - create and manage tags;
      - edit or delete comments where the setting permits;
      - start proposals and polls; and
      - create discussion and poll templates.
    translation: |-
      - hozzáadhatnak-e tagokat vagy meghívhatnak-e vendégeket;
      - küldhetnek-e értesítéseket;
      - létrehozhatnak-e alcsoportokat;
      - indíthatnak és kezelhetnek-e beszélgetéseket;
      - létrehozhatnak és kezelhetnek-e címkéket;
      - szerkeszthetnek vagy törölhetnek-e hozzászólásokat, ha a beállítás ezt engedi;
      - indíthatnak-e javaslatokat és szavazásokat; valamint
      - létrehozhatnak-e beszélgetési és szavazási sablonokat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  87166abe7eea1ab3:
    english: For groups that are not secret, administrators can separately allow non-members to start discussions. A non-member who starts a discussion becomes a guest of that discussion but does not gain access to other private discussions or become a group member.
    translation: A nem titkos csoportokban az adminisztrátorok külön engedélyezhetik, hogy nem tagok is indítsanak beszélgetéseket. Aki nem tagként indít beszélgetést, annak a beszélgetésnek a vendége lesz. Ettől nem fér hozzá más privát beszélgetésekhez, és nem válik a csoport tagjává.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3d01d10a97636b1e:
    english: The **Admins can edit members' comments** setting gives administrators an exceptional moderation capability. Enable it only when the group has agreed that administrators should be able to alter member-authored content.
    translation: Az **Az adminisztrátorok szerkeszthetik a tagok megjegyzéseit** beállítás kivételes moderálási lehetőséget ad az adminisztrátoroknak. Csak akkor engedélyezd, ha a csoport egyetért azzal, hogy az adminisztrátorok módosíthassák a tagok által írt tartalmat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b0af0135752a461f:
    english: Review permissions when the group's purpose, membership, or moderation responsibilities change. Give each role only the capabilities it needs.
    translation: Tekintsd át az engedélyeket, ha változik a csoport célja, tagsága vagy a moderálási feladatok köre. Minden szerepkör csak a szükséges jogosultságokat kapja meg.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
