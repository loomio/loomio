  be27d7d85647e400:
    english: "# Governance practices and approaches"
    translation: "# Bestuurspraktijken en werkwijzen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3242767a5e393028:
    english: Good governance includes establishing, reviewing and challenging governance practices, policies and procedures to continously improve board effectiveness.
    translation: Goed bestuur vraagt om het vaststellen, beoordelen en kritisch bekijken van werkwijzen, beleid en procedures. Zo kan het bestuur steeds beter functioneren.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c4d8cb7f7eb901a6:
    english: However many boards are short on time and often weighed down by board papers, compliance and risk, without sufficient time to discuss and debate critical strategy and performance issues.
    translation: Veel besturen hebben echter weinig tijd. Bestuursstukken, naleving van regels en risico's vragen veel aandacht, waardoor er te weinig tijd overblijft om belangrijke strategische kwesties en prestaties te bespreken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  eb59655c49bf902d:
    english: "## On Loomio\nLoomio offers the opportunity to work online on a document, policy or procedure.  Discussion and decisions are contained in a thread that members can access when and wherever works for them.  "
    translation: |-
      ## Op Loomio
      Met Loomio kun je online aan een document, beleid of procedure werken. Discussies en besluiten staan in een discussie die leden kunnen bekijken waar en wanneer het hun uitkomt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a0d6426929e39b38:
    english: 'Use a **thread** for each document, policy or procedure. The thread is the container for discussion, and holds document drafts and subsequent versions of the document.  '
    translation: Gebruik voor elk document, beleid of elke procedure een **discussie**. Daarin bespreek je het werk en bewaar je concepten en latere versies van het document.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  551c5aac67b42167:
    english: With a Loomio thread, you can organize so that the 2-3 people working on the document text are discussing particulars in the thread.  The thread could be private amongst just those 2-3 people, or run openly in the group so that the work is transparent to all members.
    translation: In een Loomio-discussie kunnen de 2 à 3 mensen die de tekst schrijven de details bespreken. Je kunt de discussie privé houden voor deze mensen of openstellen voor de groep, zodat alle leden het werk kunnen volgen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1400a6d44d7d4e35:
    english: When the document reaches a draft version, use a **Sense check poll** to notify members that the draft document is ready for review, and invite members to read the document and respond with any comments or questions.  As well as letting everyone know that the work is progressing, the poll closing date encourages people to participate.
    translation: Zodra er een conceptversie is, kun je met een **peiling om een eerste indruk** de leden laten weten dat het document klaar is om te beoordelen. Nodig hen uit het document te lezen en opmerkingen of vragen te delen. Zo weet iedereen dat het werk vordert. De sluitingsdatum van de peiling moedigt leden aan om te reageren.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  44bcb71608c8f14a:
    english: The document may require several draft iterations.
    translation: Het document kan meerdere conceptrondes nodig hebben.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a5371854b689874a:
    english: When a 'final' draft is ready, raise a **Proposal** to approve the document.
    translation: Is de definitieve conceptversie klaar, start dan een **Voorstel** om het document goed te keuren.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5998c94bd5b640ab:
    english: Loomio enables a board to progress work on governance improvement between meetings without eating into precious time in meetings.
    translation: Met Loomio kan een bestuur tussen vergaderingen door werken aan beter bestuur, zonder daarvoor kostbare vergadertijd te gebruiken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
