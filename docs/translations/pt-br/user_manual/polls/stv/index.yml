  e180eb800c3435cd:
    english: "### Elected candidates"
    translation: "### Candidatos eleitos"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8db8b2466db56f2b:
    english: 'A summary table of the winners with five columns:'
    translation: 'Uma tabela resume os eleitos em cinco colunas:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f998ffc721953501:
    english: |-
      | Column | Meaning |
      |--------|---------|
      | **Candidate** | The name of the elected candidate |
      | **Round elected** | Which counting round they reached the quota and won a seat. Round 1 means they won on first preferences alone; higher rounds mean they needed transferred votes from eliminated or surplus candidates. |
      | **First preferences** | How many voters ranked this candidate as their first choice. This shows a candidate's direct support before any vote transfers. |
      | **Final tally** | The candidate's vote tally at the moment they were elected. Due to vote transfers, this is often higher than their first preferences. |
      | **Surplus** | How much the candidate's final tally exceeded the quota (final tally minus quota). A larger surplus means stronger support beyond what was needed to win. In Scottish STV, this surplus is redistributed to voters' next preferences. |
    translation: |-
      | Coluna | Significado |
      |--------|---------|
      | **Candidato** | Nome do candidato eleito |
      | **Eleito para a rodada** | Rodada da contagem em que o candidato atingiu a cota e conquistou uma vaga. A rodada 1 indica que ele venceu apenas com as primeiras preferências; rodadas posteriores indicam que precisou receber votos transferidos de candidatos eliminados ou com votos excedentes. |
      | **Primeiras preferências** | Número de eleitores que classificaram esse candidato como primeira escolha. Mostra seu apoio direto antes de qualquer transferência de votos. |
      | **Contagem final** | Total de votos do candidato no momento em que foi eleito. Devido às transferências, esse total costuma ser maior que o número de primeiras preferências. |
      | **Excedente** | Quanto a contagem final do candidato ultrapassou a cota (contagem final menos cota). Um excedente maior indica mais apoio além do necessário para vencer. No Scottish STV, esse excedente é redistribuído para as próximas preferências dos eleitores. |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  efc41c326d955758:
    english: If the count results in a tie — where eliminating any of the remaining candidates would change the outcome — those candidates are shown in a separate table rather than arbitrarily choosing a winner.
    translation: Se a contagem terminar em empate — quando eliminar qualquer um dos candidatos restantes mudaria o resultado — esses candidatos aparecem em uma tabela separada, sem que um vencedor seja escolhido arbitrariamente.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
