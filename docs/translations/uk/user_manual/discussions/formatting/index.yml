navigation_title: Форматування
blocks:
  0cff8e965b2d4bd5:
    english: "# Formatting"
    translation: "# Форматування"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7bda51ac3285357f:
    english: When starting or editing a discussion or poll, or writing a comment, you will see a formatting bar below the text field. Select the arrow at the end of the bar to show or hide the full set of tools.
    translation: Коли ви створюєте або редагуєте обговорення чи опитування або пишете коментар, під текстовим полем з’являється панель форматування. Натисніть стрілку в кінці панелі, щоб показати або приховати всі інструменти.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2f2944ad10684b7f:
    english: Hover the mouse or cursor over each item for the name of each tool.
    translation: Наведіть вказівник на інструмент, щоб побачити його назву.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5f45a085deb9eff1:
    english: Use formatting to add structure and emphasis so information is easier to scan.
    translation: Використовуйте форматування, щоб структурувати текст і виділити важливе. Так інформацію легше переглядати.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
