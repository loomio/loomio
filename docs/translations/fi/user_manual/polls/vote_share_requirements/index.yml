  8f5779f2f1bb9ec3:
    english: Jamie uses the **Consent** proposal template, edits the Consent option, and enables its vote share requirement.
    translation: Jamie käyttää **Suostumus**-ehdotusmallia, muokkaa Suostumus-vaihtoehtoa ja ottaa sen ääniosuusvaatimuksen käyttöön.
