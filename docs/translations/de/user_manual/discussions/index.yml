navigation_title: Diskussionen
blocks:
  f087c06a5f4ab2e6:
    english: "# Intro to Discussions"
    translation: "# Einführung in Diskussionen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f515c87a8d1d20c7:
    english: Loomio discussions are where you can share information, discuss topics, and make decisions with your group.  People participate by posting comments and replies.
    translation: In Loomio-Diskussionen kannst du Informationen teilen, Themen besprechen und mit deiner Gruppe Entscheidungen treffen. Andere beteiligen sich mit Kommentaren und Antworten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eede89b6ce4f357d:
    english: |-
      - All info about a topic is in one easily accessible place.
      - People can reply via email and their comments appear in the discussion.
      - You can see who has read the discussion and who needs a nudge.
      - There is a record of discussion you can easily find again.
    translation: |-
      - Alle Informationen zu einem Thema sind an einem leicht zugänglichen Ort.
      - Andere können per E-Mail antworten. Ihre Kommentare erscheinen in der Diskussion.
      - Du siehst, wer die Diskussion gelesen hat und wen du noch daran erinnern kannst.
      - Du kannst den Verlauf der Diskussion später leicht wiederfinden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9cb2eb404b59208b:
    english: Discussions have a wide range of uses - from a general discussion forum to running specific work-flow and decision-making processes.
    translation: 'Diskussionen eignen sich für vieles: vom allgemeinen Austausch bis zu bestimmten Arbeitsabläufen und Entscheidungsprozessen.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  87a95605052570ca:
    english: For example, you may frame a discussion on a particular topic, invite people to contribute their thoughts and share information, and facilitate progress towards an agreed outcome.
    translation: Du kannst zum Beispiel ein Thema für eine Diskussion umreißen, andere einladen, ihre Gedanken und Informationen zu teilen, und die Gruppe zu einem gemeinsamen Fazit führen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ce6e6734c595d968:
    english: Or you may invite people to participate in a particular decision, using a consent or advice decision-making process.
    translation: Du kannst auch andere einladen, an einer bestimmten Entscheidung mitzuwirken, etwa mit einem Konsentverfahren oder indem du Rat einholst.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7fa58cb3ba95be0b:
    english: Discussions can also contain polls and proposals to help progress a discussion to an outcome. As people comment in the discussion and vote in polls, a discussion timeline builds so you can easily find key milestones.
    translation: Diskussionen können auch Abstimmungen und Vorschläge enthalten, die helfen, zu einem Fazit zu kommen. Wenn andere kommentieren und abstimmen, entsteht ein zeitlicher Verlauf. Darin findest du wichtige Meilensteine leicht wieder.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  388e829e86a99bd8:
    english: "![The Returnable bottles for cafe customers discussion, with a comment and a proposal](discussion-example.png)"
    translation: "![Die Diskussion über Mehrwegflaschen für Cafégäste mit einem Kommentar und einem Vorschlag](discussion-example.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
