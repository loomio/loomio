  73449e09f559b4bd:
    english: Loomio is a discussion and decision making tool for collaborative organizations.
    translation: Loomio es una herramienta para debatir y tomar decisiones en organizaciones que trabajan de forma colaborativa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c6d663f00c64f35d:
    english: It enables you to bring people together to discuss topics, explore proposals and make decisions.
    translation: Te permite reunir a personas para debatir temas, explorar propuestas y tomar decisiones.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
