  a27011d28c4f11a6:
    english: "## Administering discussions"
    translation: "## Administração de discussões"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8e67ece08e454475:
    english: There is a range of features in Loomio to help you administer discussions accessible from the drop down menu to the right of the discussion.
    translation: O menu suspenso à direita da discussão oferece várias opções para administrá-la.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2d5be8c39f22ec28:
    english: 'Keep the discussion list current by using:'
    translation: 'Para manter a lista de discussões atualizada, use:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  75739da1bd5910a6:
    english: |-
      - **Pin discussion** to keep important discussions at the top of the list
      - **Edit discussion** to change discussion title or update discussion context
      - **Move to group** when you want to move a discussion to another group or subgroup, or to an archive group.
      - **Lock thread** to prevent further comments or changes and remove the thread from the list of open threads. Locked threads are available under the discussion filter and from the search bar, and can be unlocked at any time.
      - **Delete discussion** when you do not want to keep a record of the discussion.  Note that deleted discussions can not be un-deleted.
    translation: |-
      - **Discussão sobre pinos** para manter discussões importantes no topo da lista
      - **Editar conversa** para alterar o título ou atualizar o contexto da discussão
      - **Mudar para grupo** para mover uma discussão para outro grupo, subgrupo ou grupo de arquivamento.
      - **Bloquear tópico** para impedir novos comentários ou alterações e retirar o tópico da lista de tópicos abertos. Os tópicos bloqueados podem ser encontrados pelo filtro de discussões ou pela barra de pesquisa e desbloqueados a qualquer momento.
      - **Excluir discussão** quando você não quiser manter um registro dela. Uma discussão excluída não pode ser recuperada.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e3d2099d0e6fe6fa:
    english: "## Category tags"
    translation: "## Tags de categoria"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  24b03357f6f6c3b9:
    english: Category tags are a great way to label discussions so they can be easily found. Set tags and apply to each discussion  - try to be consistent.
    translation: As tags de categoria ajudam a identificar e encontrar discussões. Defina tags e aplique-as às discussões de forma consistente.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f0f5f5abd586fb61:
    english: 'Common board tags include: Administration, AGM, Board meeting, Report, Finance, Legal, Members, Minutes, Planning, Policy, Resolution, Constitution, General meeting, Strategy.'
    translation: 'Tags comuns para conselhos incluem: Administração, Assembleia geral anual, Reunião do conselho, Relatório, Finanças, Jurídico, Membros, Atas, Planejamento, Políticas, Resolução, Estatuto, Assembleia geral, Estratégia.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  89d8ec222f5019df:
    english: Group members can search for discussions by tag under the **tags** drop down menu.
    translation: Os membros do grupo podem pesquisar discussões por tag no menu suspenso **Tags**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  54ee008489cceaca:
