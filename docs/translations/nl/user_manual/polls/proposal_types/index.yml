  6f93c6ad598d809c:
    english: "[STV Elections](/en/user_manual/polls/stv/) let participants rank candidates in a proportional, multi-winner election. Use STV to elect a committee, board, or group of delegates."
    translation: Bij [STV-verkiezingen](/en/user_manual/polls/stv/) rangschikken deelnemers kandidaten voor een evenredige verkiezing met meerdere winnaars. Gebruik STV om een commissie, bestuur of groep afgevaardigden te kiezen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
