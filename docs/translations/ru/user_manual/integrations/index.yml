  37a981ffe4539815:
    english: "## Choose where work belongs"
    translation: "## Выберите подходящий инструмент для работы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  828de256c39d112c:
    english: Loomio complements chat, shared documents, and task-management tools rather than replacing every kind of work.
    translation: Loomio дополняет чаты, общие документы и инструменты управления задачами. У каждого из них своё назначение.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ad42655c9ef79337:
    english: |-
      | Work | Suggested tool |
      |---|---|
      | Quick questions, social conversation, and timely updates | Chat |
      | Collaborative editing of a living document | Shared document |
      | Assigning and tracking tasks | Project or task-management tool |
      | Important topic-based discussion, broad participation, decisions, and outcomes | Loomio |
    translation: |-
      | Работа | Рекомендуемый инструмент |
      |---|---|
      | Короткие вопросы, неформальное общение и срочные новости | Чат |
      | Совместная работа над документом, который постоянно обновляется | Общий документ |
      | Распределение задач и отслеживание их выполнения | Инструмент управления проектами или задачами |
      | Обсуждение важных тем, участие широкого круга людей, принятие решений и подведение итогов | Loomio |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  40e853f5116f28eb:
    english: Put work in Loomio when people need time to consider a topic, when everyone affected should have a meaningful opportunity to participate, or when the group will need to find the discussion and decision later. Link to the relevant document or task from the Loomio discussion so its context remains easy to find.
    translation: Используйте Loomio, когда людям нужно время на обдумывание темы, когда всем, кого затронет решение, важно дать возможность участвовать или когда группе потребуется позже найти обсуждение и решение. Добавьте в обсуждение Loomio ссылку на соответствующий документ или задачу, чтобы участники могли легко найти материалы по теме.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
