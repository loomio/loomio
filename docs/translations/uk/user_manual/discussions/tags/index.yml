navigation_title: Мітки категорій
blocks:
  29a00cacbd5bd549:
    english: "# Category tags"
    translation: "# Мітки категорій"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1d390c0c4f4cea4a:
    english: Category tags make it easy to find threads and polls about a particular type of work or topic.
    translation: Мітки категорій допомагають знаходити теми й опитування, пов’язані з певним видом роботи або питанням.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  572adf8961fc1178:
    english: |-
      Tags belong to the whole organization. A tag used in a parent group is the
      same tag in its subgroups, making it possible to organize related work across
      the organization. Loomio displays tag names alphabetically and shows their
      colors as dots beside the names.
    translation: |-
      Мітки належать усій організації. Мітка, використана в батьківській групі, є
      тією самою міткою в її підгрупах. Це допомагає впорядковувати пов’язану роботу
      в усій організації. Loomio показує назви міток за алфавітом, а їхні кольори —
      крапками поруч із назвами.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b5340bcbf37095dc:
    english: |-
      On your group page, click **Tags** above the thread list to see the tags used in
      the current group. Select a tag to show only threads with that tag. Use the
      filter textbox to search a long list, or select **Show more** to include all
      tags in the organization. Select **Show fewer** to return to the current
      group's tags.
    translation: |-
      На сторінці вашої групи натисніть **Мітки** над списком тем, щоб побачити мітки,
      використані в цій групі. Виберіть мітку, щоб показати лише теми з нею. Скористайтеся
      полем фільтра, щоб знайти мітку в довгому списку, або виберіть **Показати більше**,
      щоб побачити всі мітки організації. Виберіть **Показати менше**, щоб знову побачити
      лише мітки цієї групи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9de81b9a795d066d:
    english: "## Apply tags"
    translation: "## Застосування міток"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bf284f7568360b53:
    english: Members who can edit a thread or poll can apply tags to it.
    translation: Учасники, які можуть редагувати тему або опитування, можуть додавати до них мітки.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  58488fe368513138:
    english: When you start a thread or poll, click the **Tags** field and select one or more tags.
    translation: Коли ви створюєте тему або опитування, натисніть поле **Мітки** й виберіть одну або кілька міток.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e060934a2853a35a:
    english: Start typing to filter the list. Select a tag again, or click the × on its chip, to remove it.
    translation: Почніть вводити текст, щоб відфільтрувати список. Щоб прибрати мітку, виберіть її ще раз або натисніть × на її позначці.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9f5e48b7e520d1a0:
    english: "## Create tags"
    translation: "## Створення міток"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  efa789e9365b2ab2:
    english: |-
      Parent-group admins can always create tags for the parent group and its
      subgroups. Subgroup admins can create tags while tagging content in their
      subgroup. The **Members can create tags** group permission, enabled by default,
      allows other members who can tag a thread or poll to create new tag names. If
      the permission is disabled, members can still apply existing tags.
    translation: |-
      Адміністратори батьківської групи завжди можуть створювати мітки для неї та її
      підгруп. Адміністратори підгруп можуть створювати мітки, коли позначають вміст
      у своїй підгрупі. Дозвіл групи **Учасники можуть створювати теги**, увімкнений
      за замовчуванням, дає змогу іншим учасникам, які можуть позначати теми або
      опитування, створювати нові мітки. Якщо дозвіл вимкнено, учасники все одно
      можуть застосовувати наявні мітки.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7e06376f3431ad2f:
    english: To create a tag while starting a thread or poll, type its name in the **Tags** field and press Enter.
    translation: Щоб створити мітку під час створення теми або опитування, введіть її назву в полі **Мітки** й натисніть Enter.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  44cd1f0281bb8116:
    english: "![create new tag](tags_create_new.png)"
    translation: "![створення нової мітки](tags_create_new.png)"
    status: machine
