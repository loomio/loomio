    translated_on: '2026-09-29'
  ed4aaa0a898906fd:
    english: "## Exporting ballots"
    translation: "## Exportar papeletas"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c96d54ebfbedae32:
    english: After the election closes, people who can view the results can export the ballots in BLT format for an independent recount or audit. The export contains candidate rankings and combines identical rankings into a single row with a ballot count. For anonymous elections it does not contain voter identities, ballot identifiers, submission times, or submission order.
    translation: Cuando se cierra la elección, las personas que pueden ver los resultados pueden exportar las papeletas en formato BLT para hacer un recuento o una auditoría independientes. La exportación contiene las preferencias de candidatos y agrupa las papeletas con el mismo orden en una sola fila con su cantidad. En las elecciones anónimas, no incluye la identidad de quienes votaron, identificadores de las papeletas, horas de envío ni el orden en que se enviaron.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
