---
navigation_title: Beszélgetés indítása
blocks:
  8fae4100a4f3548b:
    english: "# Start a discussion"
    translation: "# Beszélgetés indítása"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4ba984e9573c27ff:
    english: Starting a Loomio discussion is like writing an email. The subject line of an email is like the discussion title, and the text you write in an email is like the context of a discussion.
    translation: Egy Loomio-beszélgetés indítása hasonló egy e-mail megírásához. Az e-mail tárgya a beszélgetés címének, az e-mail szövege pedig a beszélgetés hátterének felel meg.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4f81447c072f5dfe:
    english: As you add people in the send list of your email, in Loomio you can invite people individually or as a group to the discussion - they will receive an email notification with the content of your discussion.
    translation: Ahogy egy e-mail címzettjeit kiválasztod, a Loomióban is meghívhatsz embereket egyenként vagy csoportként a beszélgetésbe. E-mailben értesítést kapnak a beszélgetés tartalmáról.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2408b54e3b78a282:
    english: People can reply to your discussion via email and their comments will appear in the discussion.
    translation: A résztvevők e-mailben is válaszolhatnak a beszélgetésre. A válaszaik hozzászólásként jelennek meg benne.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  24ced64c5c4cf853:
    english: As with an email, a discussion may be a simple question, or a more detailed introduction to a topic with links or files attached for background information.
    translation: Egy beszélgetés lehet egyszerű kérdés, vagy egy téma részletesebb bemutatása háttéranyagként csatolt hivatkozásokkal és fájlokkal.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ec39413fa07094c8:
    english: "## New discussion"
    translation: "## Új beszélgetés"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  92b37b2e208bfd57:
    english: Find the **New discussion** button on your Loomio group page to start a new discussion.
    translation: Új beszélgetés indításához keresd az **Új beszélgetés** gombot a Loomio-csoportod oldalán.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  515ac46bdfccb401:
    english: You can start a discussion within your Loomio group or any subgroup.
    translation: Beszélgetést a Loomio-csoportodban vagy bármelyik alcsoportjában indíthatsz.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ef9721ba6b69b86b:
    english: "![New discussion button on the Oatmilk Cooperative page](new-discussion-button.png)"
    translation: "![Új beszélgetés gomb az Oatmilk Cooperative oldalán](new-discussion-button.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1cf9e569475cd2cc:
    english: "![New discussion form for planning the returnable bottle trial](new-discussion-example.png)"
    translation: "![Új beszélgetés űrlapja a visszaváltható palackok próbaidőszakának megtervezéséhez](new-discussion-example.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f973f5b9f1c4b1dd:
    english: |-
      ### Group
      Check the name of the group or subgroup is correct for your discussion.  Anyone in this group will be able to see the discussion. You can also start the discussion in another group or as a 'direct' discussion (no group).
    translation: |-
      ### Csoport
      Ellenőrizd, hogy a megfelelő csoportot vagy alcsoportot választottad-e a beszélgetéshez. A csoport minden tagja láthatja majd a beszélgetést. Másik csoportban vagy közvetlen beszélgetésként (csoport nélkül) is elindíthatod.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f0b0bda9877ce0ed:
    english: |-
      >[!Tip]
      >If you are not ready to make the discussion visible in your group, start the discussion as 'direct'.  You can move the discussion to your Loomio group when ready.
    translation: |-
      >[!Tip]
      >Ha még nem szeretnéd, hogy a beszélgetés látható legyen a csoportodban, indítsd el közvetlen beszélgetésként. Később áthelyezheted a Loomio-csoportodba.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cd1b45c3cb71503b:
    english: "### Invite and notify"
    translation: "### Meghívás és értesítés"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f3f388d23b06b25c:
    english: The **Invite** field controls who receives the new discussion immediately.
    translation: A **Meghív** mezőben adhatod meg, ki kapjon azonnal értesítést az új beszélgetésről.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c1b5c23770d3692:
    english: Group members can see a discussion in their group even if you do not notify them. Adding a group member to **Invite** sends them an email notification and a notification in Loomio.
    translation: A csoport tagjai akkor is láthatják a csoportjukban zajló beszélgetést, ha nem értesíted őket. Ha hozzáadsz egy csoporttagot a **Meghív** mezőhöz, e-mailben és a Loomióban is értesítést kap.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e2e5906a39131506:
    english: Select a group to notify everyone in it, or expand the group to choose individual members. Select the × beside a name to remove that person from the notification.
    translation: Válassz ki egy csoportot az összes tag értesítéséhez, vagy nyisd le a csoportot, és válassz ki egyes tagokat. Ha valakit törölni szeretnél az értesítettek közül, kattints a neve melletti × jelre.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  81b57efbb3c428b7:
    english: "![Invite field expanded to show individual recipients](../notifying_people/thread_notification.png)"
    translation: "![Lenyitott Meghív mező az egyes címzettekkel](../notifying_people/thread_notification.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5cbd2b7b0bcc486f:
    english: Start typing a member's name and select it from the list.
    translation: Kezdd el beírni egy tag nevét, majd válaszd ki a listából.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dc128abbc65cb0c8:
    english: "![Searching for Samira Patel in the Invite field](../notifying_people/thread_notify_user.png)"
    translation: "![Samira Patel keresése a Meghív mezőben](../notifying_people/thread_notify_user.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3274fe93fcf29b29:
    english: Enter an email address to invite a guest. A guest can see and participate in this thread but cannot see other discussions in the group unless separately invited.
    translation: Vendég meghívásához adj meg egy e-mail-címet. A vendég láthatja ezt a beszélgetést, és részt vehet benne, de a csoport többi beszélgetését csak akkor láthatja, ha azokba külön meghívják.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ab3214ccf77143e3:
    english: "![Adding a guest email address to the Invite field](../notifying_people/thread_notify_email.png)"
    translation: "![Vendég e-mail-címének hozzáadása a Meghív mezőhöz](../notifying_people/thread_notify_email.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cba9346e727b829a:
    english: You can also start the discussion without notifying anyone. Group members can still find it in Loomio and may see it in their catch-up email, depending on their notification settings.
    translation: A beszélgetést úgy is elindíthatod, hogy senkit sem értesítesz. A csoport tagjai így is megtalálhatják a Loomióban, és az értesítési beállításaiktól függően az összefoglaló e-mailjükben is láthatják.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6518afe373ff1959:
    english: "### Tags"
    translation: "### Címkék"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ff67c09f89479873:
    english: Add tag(s) to help people find your discussion when searching by tag. Admins can create new tags.
    translation: Adj címkéket a beszélgetéshez, hogy mások címke alapján keresve könnyebben megtalálják. Az adminisztrátorok új címkéket hozhatnak létre.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ba80a903c4ecc7d1:
    english: |-
      ### Title
      Give your discussion a relevant title.  A discussion title is similar to an email subject line.
    translation: |-
      ### Cím
      Adj a beszélgetésnek a témához illő címet. Ez az e-mail tárgyához hasonló.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a91cf4b0b1b2ad5e:
    english: |-
      ### Context
      Use discussion context to introduce the topic and frame the conversation or decision to make. Use the formatting tools to emphasize key points. Include background information, attach files, link to online documents and embed a video.
    translation: |-
      ### Háttér
      A beszélgetés hátterében mutasd be a témát, és fogalmazd meg, miről szeretnél beszélgetni vagy dönteni. A formázási eszközökkel emeld ki a fontos pontokat. Adj meg háttérinformációkat, csatolj fájlokat, hivatkozz online dokumentumokra, és ágyazz be videót.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1bf690aa841299cd:
    english: The context will always stay at the top of the discussion and you can update it at any time as the discussion progresses.  When the discussion ends, update the context with the outcome.
    translation: A háttér mindig a beszélgetés tetején marad, és a beszélgetés során bármikor frissítheted. Amikor a beszélgetés véget ér, egészítsd ki a hátteret a következtetéssel.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
