---
navigation_title: Перемещение элементов между темами
blocks:
  875a42e08000fffe:
    english: "# Moving items between threads"
    translation: "# Перемещение элементов между темами"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5c0fcd38f9276e8f:
    english: Move selected items when a conversation belongs in another thread, when one thread has split into separate topics, or when you want to combine related discussions. There is no separate **Merge discussions** command.
    translation: Перемещайте выбранные элементы, если разговор лучше продолжить в другой теме, обсуждение разделилось на несколько тем или вы хотите объединить связанные обсуждения. Отдельной команды **Объединить обсуждения** нет.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f43c7835d05a135e:
    english: The option is available to group admins and to members when **Members can manage discussions and comments** is enabled in [Group permissions](/en/user_manual/groups/settings/permissions).
    translation: Перемещать элементы могут администраторы группы, а также участники, если в [настройках прав группы](/en/user_manual/groups/settings/permissions) включён параметр **Участники могут управлять обсуждениями и комментариями.**
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  30a4e31dab983f89:
    english: Open the three-dot menu (**⋯**) on an item and select **Move item**.
    translation: Откройте меню с тремя точками (**⋯**) у элемента и выберите **Переместить элемент**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  24fd0043effa14fb:
    english: Select the items you want to move.
    translation: Выберите элементы, которые хотите переместить.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  81551cd5134f24c5:
    english: Select any additional items with the checkboxes, then click **Move** in the banner at the top of the discussion.
    translation: Отметьте дополнительные элементы флажками, затем нажмите **Переместить** на панели вверху обсуждения.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f53055845c214b05:
    english: Choose the group or subgroup, then search for the destination discussion.
    translation: Выберите группу или подгруппу, затем найдите обсуждение, в которое хотите переместить элементы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  19bc2092ac28011b:
    english: To move the items into a new discussion, select **New discussion** and add its title and context.
    translation: Чтобы переместить элементы в новое обсуждение, выберите **Новое обсуждение** и добавьте название и описание.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '092b56e69505636f':
    english: The items are moved from the original thread into the selected or newly created thread.
    translation: Элементы переместятся из исходной темы в выбранную или новую тему.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  162c0d0c47ca798f:
    english: If the original thread is no longer needed, you can [lock it](/en/user_manual/discussions/using_discussions/#lock-or-unlock-a-thread). Delete it only if you are certain it will not be needed again.
    translation: Если исходная тема больше не нужна, вы можете [заблокировать её](/en/user_manual/discussions/using_discussions/#lock-or-unlock-a-thread). Удаляйте её только в том случае, если уверены, что она больше не понадобится.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
