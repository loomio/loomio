  0b903e1c3c7e1862:
    english: The profile tab controls how your group is identified and introduced. Open **Edit group settings** from the group page, then select **Profile**.
    translation: A aba de perfil define como seu grupo é identificado e apresentado. Na página do grupo, abra **Editar configurações do grupo** e selecione **Perfil**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
