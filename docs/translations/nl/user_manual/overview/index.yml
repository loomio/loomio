  73449e09f559b4bd:
    english: Loomio is a discussion and decision making tool for collaborative organizations.
    translation: Loomio is een hulpmiddel voor discussie en besluitvorming in organisaties die samenwerken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c6d663f00c64f35d:
    english: It enables you to bring people together to discuss topics, explore proposals and make decisions.
    translation: Je kunt mensen samenbrengen om onderwerpen te bespreken, voorstellen te verkennen en besluiten te nemen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
