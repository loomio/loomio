    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  828de256c39d112c:
    english: Loomio complements chat, shared documents, and task-management tools rather than replacing every kind of work.
    translation: Loomio ergänzt Chats, gemeinsam bearbeitete Dokumente und Werkzeuge zur Aufgabenverwaltung. Nicht jede Art von Arbeit muss in Loomio stattfinden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ad42655c9ef79337:
    english: |-
      | Work | Suggested tool |
      |---|---|
      | Quick questions, social conversation, and timely updates | Chat |
      | Collaborative editing of a living document | Shared document |
      | Assigning and tracking tasks | Project or task-management tool |
      | Important topic-based discussion, broad participation, decisions, and outcomes | Loomio |
    translation: |-
      | Arbeit | Geeignetes Werkzeug |
      |---|---|
      | Kurze Fragen, informelle Gespräche und zeitnahe Neuigkeiten | Chat |
      | Gemeinsames Bearbeiten eines laufend aktualisierten Dokuments | Gemeinsam bearbeitetes Dokument |
      | Aufgaben zuweisen und ihren Fortschritt verfolgen | Projekt- oder Aufgabenverwaltung |
      | Wichtige themenbezogene Diskussionen, breite Beteiligung, Entscheidungen und Fazits | Loomio |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  40e853f5116f28eb:
    english: Put work in Loomio when people need time to consider a topic, when everyone affected should have a meaningful opportunity to participate, or when the group will need to find the discussion and decision later. Link to the relevant document or task from the Loomio discussion so its context remains easy to find.
    translation: Nutze Loomio, wenn Menschen Zeit brauchen, um sich mit einem Thema zu befassen, wenn alle Betroffenen Gelegenheit zur Beteiligung haben sollen oder wenn die Gruppe die Diskussion und Entscheidung später wiederfinden muss. Verlinke das zugehörige Dokument oder die Aufgabe in der Loomio-Diskussion, damit der Zusammenhang leicht zu finden ist.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
