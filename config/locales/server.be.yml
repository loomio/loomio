      block: Блок
      block_meaning: Я блакую гэтую прапанову і лічу, што яе нельга працягваць
      block_prompt: Растлумачце свае пярэчанні супраць гэтай прапановы і чаму яе нельга рэалізоўваць
    majority:
      process_subtitle: Прымайце рашэнне найбольшай колькасцю галасоў
      process_introduction: "<p><strong>Большасць галасоў</strong> — гэта найпрасцейшы спосаб прыняць групавое рашэнне: удзельнікі галасуюць «за» ці «супраць», і прапанова прымаецца, калі больш за палову прагаласуе «за». Устрымацца або блакіраваць голас нельга, таму кожны голас мае аднолькавую вагу.</p><p> Большасць добра падыходзіць для простых рашэнняў, дзе вам патрэбна выразная выснова. Для рашэнняў, дзе важна, каб людзі працавалі разам, каб зразумець адзін аднаго і знайсці агульную мову, разгледзьце згоду або кансенсус.</p>"
      title: Зацвердзіць бюджэт на 3 квартал
      details: "<h3><strong>Якое рашэнне вам трэба прыняць?</strong></h3><p></p><h3> <strong>Чаму гэта важна?</strong></h3><p></p><h3> <strong>Што вы просіце людзей зрабіць?</strong></h3><p></p>"
      yes_meaning: Я падтрымліваю гэтую прапанову
      yes_prompt: Чаму вы падтрымліваеце гэтую прапанову?
      no_meaning: Я не падтрымліваю гэтую прапанову
      no_prompt: Чаму вы не падтрымліваеце гэтую прапанову?
      outcome_statement: "<p>Дзякуй за ўдзел у гэтым галасаванні большасці.</p>"
    question_round:
      process_subtitle: Запрашайце ўдакладняючыя пытанні, каб дапамагчы людзям зразумець прапанову
      process_introduction: <p>Раўнд пытанняў — гэта магчымасць для людзей задаць удакладняючыя пытанні па прапанове, каб усе зразумелі яе, перш чым выказаць сваё меркаванне пра яе.</p><p> Раўнд пытанняў Loomio — гэта спецыяльная прапанова без магчымасці галасавання. Ён дазваляе ўдзельнікам задаваць пытанні на працягу вызначанага вамі часу для раўнда.</p><p> Раўнд пытанняў звычайна выкарыстоўваецца як этап працэсу атрымання згоды.</p><p> <a target="_blank" href="https://help.loomio.com/en/guides/consent_process/index.html">Даведайцеся больш пра працэс атрымання згоды</a> .</p>
      title: Якія ў вас ёсць пытанні адносна палітыкі ў галіне аховы здароўя і бяспекі?
      details: <h3 id="what-are-you-proposing"><strong>Што вы прапануеце?</strong></h3><p></p><h3 id="why-is-this-important"> <strong>Чаму гэта важна?</strong></h3><p></p><h3 id="what-are-you-asking-people-to-do"> <strong>Што вы просіце людзей зрабіць?</strong></h3><p></p><p> Гэта раўнд пытанняў, дзе вам прапануецца задаваць удакладняючыя пытанні.</p><p> Што вам трэба ведаць, каб зразумець прапанову?</p><p> Калі ласка, адкажыце да заканчэння раўнда пытанняў.</p>
      reason_prompt: Што вам трэба ведаць, каб зразумець прапанову?
      outcome_statement: "<p>Дзякуй за пытанні, якія вы даслалі падчас гэтага раўнда</p>"
    sense_check:
      process_subtitle: Звяртайцеся па водгукі, пытанні і праблемы
      process_subtitle_v2: Паглядзіце, ці вы на правільным шляху
      process_introduction_v2: "<p><strong>Праверка пачуццяў</strong> дапамагае атрымаць раннюю зваротную сувязь, перш чым прыняць рашэнне. Удзельнікі кажуць, ці ўсё выглядае добра, або выказваюць праблемы, каб вы маглі скарэктаваць курс, перш чым перайсці да афіцыйнай прапановы. Гэта не рашэнне — гэта праверка тэмпературы.</p>"
      process_introduction: <p>Прапанова Sense check — гэта добры спосаб атрымаць зваротную сувязь, задаць пытанні і выявіць праблемы. Яна дапамагае ўдакладніць і палепшыць прапанову, перш чым пераходзіць да прыняцця рашэння.</p><p> Праверка сэнсу дазваляе людзям зразумець, што фарміруецца прапанова, і заахвочвае іх да ўдзелу. Гэта магчымасць выслухаць людзей, адчуць іх пачуцці і адрэагаваць адпаведна, што адкрывае патэнцыял для ўліку іх укладу для прыняцця лепшага рашэння.</p><p> Выкарыстоўвайце прапанову праверкі сэнсу ў працэсе згоды, каб запрасіць рэакцыі і каментарыі для паляпшэння прапановы, а ў працэсе кансенсусу — каб праверыць кансенсус.</p><p> <a target="_blank" rel="noopener noreferrer nofollow" href="https://help.loomio.com/en/user_manual/polls/decisions/index.html"><u>Больш падрабязна пра выкарыстанне праверкі Sense чытайце ў працэсе прыняцця рашэнняў Simple</u></a> <span>.</span></p>
      title: Як вы ставіцеся да новых канцэпцый брэнда?
      details: <h3 id="what-are-you-proposing"><strong>Што вы прапануеце?</strong></h3><p></p><h3 id="why-is-this-important"> <strong>Чаму гэта важна?</strong></h3><p></p><h3 id="what-are-you-asking-people-to-do"> <strong>Што вы просіце людзей зрабіць?</strong></h3><p></p><p> Як вы ацэньваеце прапанову? Пакіньце каментарый або зрабіце прапанову па паляпшэнні.</p><p> Гэтая праверка Sense — магчымасць падзяліцца сваімі меркаваннямі і ўнесці свой уклад, каб дапамагчы нам прыняць лепшае рашэнне.</p>
      outcome_statement: "<p>Дзякуй за ўдзел у праверцы сэнсу.</p>"
      not_sure: Не ўпэўнены
      not_sure_meaning: У мяне ёсць пытанне або мне патрэбна больш часу
      not_sure_prompt: Якія часткі вам незразумелыя? Як гэта можна вырашыць?
      looks_good: Выглядае добра
      looks_good_meaning: Я задаволены тым, куды гэта ідзе
      looks_good_prompt: Ці ёсць у вас якія-небудзь каментарыі ці прапановы па паляпшэнні прапановы?
      abstain: Устрымацца
      abstain_meaning: Мне няма чаго дадаць, і я не маю ніякіх пярэчанняў да гэтай працы.
      abstain_prompt: Устрыманне азначае згоду з кірункам гэтай прапановы. Ці ёсць прычына, па якой вы галасуеце супраць устрымання?
      concerned: Занепакоены
      concerned_meaning: Магчыма, мне трэба нешта змяніць у гэтым пытанні, каб я пагадзіўся/пагадзілася
      concerned_prompt: Што вас турбуе і як з гэтым можна справіцца?
      details_v2: "<h3><strong>Што вы прапануеце?</strong></h3><p></p><h3> <strong>Чаму гэта важна?</strong></h3><p></p><h3> <strong>Што вы просіце людзей зрабіць?</strong></h3><p></p><p> Скажыце, ці выглядае гэта добра, ці магло б быць лепш, ці патрабуе пераасэнсавання — і падзяліцеся сваімі разважаннямі.</p>"
      looks_good_meaning_v2: Я задаволены кірункам
      looks_good_prompt_v2: Што табе ў гэтым падабаецца?
      could_be_better: Магло б быць і лепш
      could_be_better_meaning: Я бачу патэнцыял, але маю прапановы
      could_be_better_prompt: Што б вы змянілі?
      needs_a_rethink: Патрабуе пераасэнсавання
      needs_a_rethink_meaning: Я лічу, што гэта няправільны падыход
      needs_a_rethink_prompt: Што вас хвалюе?
    gradients_of_agreement:
      process_subtitle: Выкажыце падтрымку прапановы па 8-бальнай шкале
      process_introduction: "<p>Прапанова «Градыенты згоды» дазваляе членам групы выказваць сваю падтрымку прапанове ў ступенях па шкале, прапаноўваючы больш спосабаў выражэння падтрымкі, чым проста «згодны» і «не згодны».</p><p> Выкарыстоўвайце градыенты згоды ў якасці папярэдняга раўнда, каб праверыць падтрымку прапановы, перш чым перайсці да афіцыйнага пагаднення.</p><p> Градыенты згоды даюць людзям зразумець, што фарміруецца прапанова, і заахвочваюць іх да ўдзелу. Гэта магчымасць выслухаць людзей, адчуць іх пачуцці і адрэагаваць адпаведна — адкрываючы патэнцыял для ўліку іх укладу для прыняцця лепшага рашэння.</p>"
      title: Як вам падабаецца новая дэкларацыя каштоўнасцяў?
      details: <h3 id="what-are-you-proposing"><strong>Што вы прапануеце?</strong></h3><p></p><h3 id="why-is-this-important"> <strong>Чаму гэта важна?</strong></h3><p></p><h3 id="what-are-you-asking-people-to-do"> <strong>Што вы просіце людзей зрабіць?</strong></h3><p></p><p> Як вам падабаецца прапанова? Выкажыце сваю падтрымку па шкале ніжэй і пакіньце каментарый або прапанову па паляпшэнні.</p><p> Гэтая прапанова аб градыентах пагаднення прызначана для праверкі падтрымкі прапановы і дае магчымасць выказаць сваё меркаванне, перш чым перайсці да афіцыйнага пагаднення.</p>
      whole_hearted_endorsement: Шчырая падтрымка
      whole_hearted_endorsement_meaning: Мне вельмі падабаецца!
      whole_hearted_endorsement_prompt: Што табе ў гэтым падабаецца?
      agreement_with_minor_contention: Пагадненне з нязначнымі спрэчкамі
      agreement_with_minor_contention_meaning: Не ідэальна, але дастаткова добра
      agreement_with_minor_contention_prompt: Што вас турбуе?
      support_with_reservations: Падтрымка з браніраваннем
      support_with_reservations_meaning: Я магу з гэтым жыць
      support_with_reservations_prompt: Якія ў вас агаворкі?
      abstain_meaning: Гэтае пытанне мяне не тычыцца
      abstain_prompt: Ці ёсць у вас што-небудзь, што вы хацелі б дадаць?
      more_discussion_needed: Патрэбна больш дыскусій
      more_discussion_needed_meaning: Я пакуль недастаткова добра разумею праблемы
      more_discussion_needed_prompt: Чаго ты не разумееш?
      don_t_like_but_will_support: Не падабаецца, але падтрымаю
      don_t_like_but_will_support_meaning: Гэта не вельмі добра, але я не хачу затрымліваць групу
      don_t_like_but_will_support_prompt: Што б вы хацелі палепшыць?
      serious_disagreement: Сур'ёзныя рознагалоссі
      serious_disagreement_meaning: Я з гэтым не згодзен — не разлічвайце на мяне
      serious_disagreement_prompt: З чым вы не згодныя?
      veto: Вета
      veto_meaning: Я блакую гэтую прапанову
      veto_prompt: Чаму вы блакуеце прапанову? Што трэба змяніць, каб вы яе падтрымалі?
    simple_poll:
      process_subtitle: Знайдзіце найбольш папулярны варыянт
      process_introduction: <p>Знайдзіце найбольш папулярны варыянт або варыянты з дапамогай апытання з адным або некалькімі варыянтамі адказу.</p><p> <a target="_blank"  href="https://help.loomio.com/en/user_manual/polls/proposal_types/index.html#simple-poll">Чытайце больш пра Простае апытанне</a> .</p>
      process_introduction_v2: <p><strong>Функцыя «Выбраць»</strong> дапамагае знайсці найбольш папулярны варыянт. Удзельнікі выбіраюць са спісу — вы можаце наладзіць, ці выбіраць яны адзін ці некалькі варыянтаў.</p><p> <a target="_blank" href="https://help.loomio.com/en/user_manual/polls/proposal_types/index.html#simple-poll">Чытайце больш пра Выбар</a> .</p>
      title: На чым павінна быць сканцэнтравана наша стратэгічная дзейнасць?
      details: <h3 id="what-is-this-poll-about"><strong>Пра што гэтае апытанне?</strong></h3><p></p><h3 id="why-is-this-important"> <strong>Чаму гэта важна?</strong></h3><p></p><h3 id="what-are-you-asking-people-to-do"> <strong>Што вы просіце людзей зрабіць?</strong></h3><p></p><p> Выберыце варыянт(ы), які(я) вам падабаецца.</p>
    score_poll:
      process_subtitle: Вымерайце ступень падтрымкі кожнага варыянта
      process_subtitle_v2: Вымерайце ўзровень падтрымкі для кожнага варыянту
      process_introduction: <p>Выкарыстоўвайце апытанне Score, калі хочаце апытаць людзей наконт іх жаданняў, пераваг або цікавасці да кожнага варыянта.</p><p> <span>Удзельнікам прапануецца ацаніць кожны варыянт і прысвоіць бал, перамяшчаючы паўзунок па шкале.</span></p><p> <a target="_blank"  href="https://help.loomio.com/en/user_manual/polls/proposal_types/index.html#score-poll">Чытайце больш пра апытанне Score</a> .</p>
      process_introduction_v2: <p><strong>Ацэнка</strong> дазваляе вымераць узровень падтрымкі групы кожнага варыянта. Удзельнікі ацэньваюць кожны варыянт, прысвойваючы бал па слізгальнай шкале, каб вы маглі бачыць не толькі тое, што людзі аддаюць перавагу, але і наколькі.</p><p> <a target="_blank" href="https://help.loomio.com/en/user_manual/polls/proposal_types/index.html#score-poll">Чытайце больш пра апытанне Score</a> .</p>
      title: Ацэнка таго, як прымаюцца рашэнні ў нашай арганізацыі
      details: <h3 id="what-is-this-poll-about"><strong>Пра што гэтае апытанне?</strong></h3><p></p><h3 id="why-is-this-important"> <strong>Чаму гэта важна?</strong></h3><p></p><h3 id="what-are-you-asking-people-to-do"> <strong>Што вы просіце людзей зрабіць?</strong></h3><p></p><p> Выберыце варыянт(ы), які(я) вам падабаецца.</p>
    dot_vote:
      process_subtitle: Выдзеліце бюджэт з балаў, каб выявіць прыярытэты
      process_subtitle_v2: Выяўляйце прыярытэты, калі ёсць кампрамісы
      process_introduction: <p>Кропкавае галасаванне можна выкарыстоўваць для размеркавання абмежаваных рэсурсаў паміж некалькімі варыянтамі. Гэта выходзіць за рамкі простага апытання, бо дапамагае ўдзельнікам зразумець, што пры выбары варыянтаў ёсць абмежаванні.</p><p> Кожнаму ўдзельніку даецца бюджэт на размеркаванне балаў.</p><p> Удзельнікі могуць размеркаваць усе свае балы паміж адным варыянтам або некалькімі варыянтамі.</p><p> Удзельнікі не могуць перавышаць свой бюджэт, таму яны павінны старанна размяркоўваць свае балы.</p><p> <a target="_blank"  href="https://help.loomio.com/en/user_manual/polls/proposal_types/index.html#dot-vote">Чытайце больш пра галасаванне Dot</a> .</p>
      process_introduction_v2: <p><strong>Размеркаванне балаў</strong> дапамагае зразумець прыярытэты групы, калі ёсць кампрамісы. Кожны ўдзельнік атрымлівае бюджэт балаў, які можна размеркаваць паміж варыянтамі — яны могуць зрабіць усё магчымае на адным з іх або размеркаваць свае балы паміж некалькімі. Паколькі бюджэт абмежаваны, кожны выдаткаваны бал з'яўляецца сапраўдным сігналам прыярытэту.</p><p> <a target="_blank" href="https://help.loomio.com/en/user_manual/polls/proposal_types/index.html#dot-vote">Чытайце больш пра размеркаванне</a> .</p>
      title: Выбар тэм для нашай канферэнцыі
      details: <h3 id="what-is-this-poll-about"><strong>Пра што гэтае апытанне?</strong></h3><p></p><h3 id="why-is-this-important"> <strong>Чаму гэта важна?</strong></h3><p></p><h3 id="what-are-you-asking-people-to-do"> <strong>Што вы просіце людзей зрабіць?</strong></h3><p></p><p> У гэтым апытанні ў вас ёсць бюджэт балаў, які вы можаце размеркаваць паміж варыянтамі, якія вам падабаюцца. Вы можаце размеркаваць усе балы па адным варыянце або размеркаваць іх паміж імі.</p>
    ranked_choice:
      process_subtitle: Зразумець упарадкаваную перавагу варыянтаў
      process_subtitle_v2: Знайдзіце парадак перавагі групы
      process_introduction: <p>Ранжыраваны выбар карысны, калі ў вас вялікая колькасць варыянтаў або калі вы праводзіце выбары.</p><p> Выбаршчыкі перацягваюць варыянты, каб размясціць іх у парадку перавагі.</p><p> Вынікі паказаны ў парадку рэйтынгу.</p><p> <a target="_blank"  href="https://help.loomio.com/en/user_manual/polls/proposal_types/index.html#ranked-choice">Чытайце больш пра рэйтынгавы выбар</a> .</p>
      process_introduction_v2: <p><strong>Ранг</strong> паказвае парадак пераваг групы. Удзельнікі перацягваюць варыянты, каб размясціць іх ад найбольш да найменш пераважных, а вынікі паказваюць агульны рэйтынг.</p><p> <a target="_blank" href="https://help.loomio.com/en/user_manual/polls/proposal_types/index.html#ranked-choice">Чытайце больш пра Ранг</a> .</p>
      title: Абраць дырэктараў у кіруючую раду
      details: <h3 id="what-is-this-poll-about"><strong>Пра што гэтае апытанне?</strong></h3><p></p><h3 id="why-is-this-important"> <strong>Чаму гэта важна?</strong></h3><p></p><h3 id="what-are-you-asking-people-to-do"> <strong>Што вы просіце людзей зрабіць?</strong></h3><p></p><p> Галасуйце, ранжыруючы варыянты ў парадку вашых пераваг. Перамагае варыянт, які зойме першае месца ў выніках.</p>
    stv:
      process_subtitle: Абярыце некалькі пераможцаў прапарцыйна
      process_introduction: <p>Адзіны перадаваемы голас (STV) — гэта прапарцыйны метад прадстаўніцтва для выбараў з некалькімі пераможцамі. Выбаршчыкі ранжыруюць кандыдатаў у парадку перавагі. Кандыдаты, якія дасягаюць пэўнай квоты галасоў, абіраюцца, а лішнія галасы або галасы за выключаных кандыдатаў пераходзяць да наступных пераваг.</p><p>Наладзьце колькасць месцаў, метад падліку (Scottish або Meek) і тып квоты (Droop або Hare). Вынікі паказваюць падрабязную інфармацыю аб тым, як перадаваліся галасы па раўндах.</p><p><a target="_blank" href="https://help.loomio.com/en/user_manual/polls/stv/index.html">Чытайце больш пра выбары STV</a>.</p>
      title: Абраць членаў камітэта
      details: <h3 id="what-is-this-election-about"><strong>Пра што гэтыя выбары?</strong></h3><p></p><h3 id="how-many-seats"><strong>Колькі месцаў трэба запоўніць?</strong></h3><p></p><h3 id="who-are-the-candidates"><strong>Хто з'яўляецца кандыдатамі?</strong></h3><p></p><p>Галасуйце, перацягваючы кандыдатаў у патрэбным вам парадку. Першы ранг — гэта ваш найбольш пераважны кандыдат. Вы можаце ранжыраваць столькі кандыдатаў, колькі хочаце.</p>
    time_poll:
      process_subtitle: Знайдзіце найлепшы час для сустрэчы
      process_subtitle_v2: Даведайцеся, калі людзі даступныя
      process_introduction: <p>Хутка знайдзіце найлепшы час для вашай сустрэчы або мерапрыемства. Дадайце назву, падрабязную інфармацыю і параметры даты/часу ў вашым часавым поясе. Удзельнікі ўбачаць час, лакалізаваны ў іх часавым поясе.</p><p> Пасля завяршэння апытання па часе дадайце выснову з найлепшым часам і любымі інструкцыямі па сустрэчы. Loomio дашле ліст з высновай з запрашэннем у каляндар, каб удзельнікі маглі дадаць яго ў свае календары.</p><p> <a target="_blank" href="https://help.loomio.com/en/user_manual/polls/meeting_polls/index.html#time-poll">Чытайце больш пра апытанне Time</a> .</p>
      process_introduction_v2: <p><strong>Апытанне па часе</strong> дапаможа вам знайсці, калі людзі даступныя. Дадайце прапанаваны час, і ўдзельнікі ўбачаць іх у сваім часавым поясе. Пасля завяршэння апытання дадайце выснову, і Loomio дашле ўсім запрашэнні ў каляндар.</p><p> <a target="_blank" href="https://help.loomio.com/en/user_manual/polls/meeting_polls/index.html#time-poll">Чытайце больш пра апытанне Time</a> .</p>
      title: Давайце знойдзем дату нашай наступнай сустрэчы
      details: "<p><strong>Што гэта за сустрэча ці мерапрыемства?</strong></p><p></p><p> <strong>Чаму гэта важна?</strong></p><p></p><p> <strong>Што вы просіце людзей зрабіць?</strong></p><p></p><p> <span>Адзначайце даступныя вам часовыя інтэрвалы зялёным значком «вялікі палец уверх» або пакіньце чырвоны «вялікі палец уніз», калі вы недаступныя.</span></p><p> <span>Выкарыстоўвайце значок «вялікі палец убок», каб паказаць, што вы даступныя «пры неабходнасці».</span></p>"
      reason_prompt: Ці можаце вы што-небудзь сказаць, каб дапамагчы арганізатару знайсці падыходны час?
    opt_in:
      process_subtitle: Знайдзіце валанцёраў або папрасіце ўдзельнікаў
      process_introduction: '<p>Выкарыстоўвайце функцыю падпіскі, каб запрасіць людзей далучыцца да каманды, камітэта або рабочай групы, або прыняць удзел у мерапрыемстве.</p><p> «Падпісацца» мае два варыянты галасавання: прыняць або адхіліць.</p><p> Вы можаце вызначыць мэтавую колькасць людзей, якіх вы шукаеце, напрыклад, 3 чалавекі, якія далучацца да вашай рабочай групы.</p><p> <a target="_blank" href="https://help.loomio.com/en/user_manual/polls/meeting_polls/index.html#opt-in">Чытайце больш пра падпіску</a> .</p>'
      title: Рабочая група распрацуе новую палітыку ўстойлівага развіцця
      details: "<p><strong>На якую каманду, рабочую групу ці мерапрыемства вы запрашаеце людзей?</strong></p><p></p><p> <strong>Чаму гэта важна?</strong></p><p></p><p> <strong>Што вы просіце людзей зрабіць?</strong></p><p></p><p> Выберыце «Прыняць», каб прыняць удзел!</p>"
      accept_meaning: Я гатовы ўдзельнічаць
      accept_prompt: Чаму вы гэта робіце валанцёрам?
      decline_meaning: Я не магу ўдзельнічаць
      decline_prompt: Ці ёсць што-небудзь, што вы хацелі б сказаць?
  discussion_templates:
    practice_thread:
      process_name: Практычнае абмеркаванне
      process_subtitle: Вітайце людзей у групе і практыкуйцеся ў выкарыстанні Loomio
      process_introduction: "<p>Вітайце новых удзельнікаў і заахвочвайце іх да ранняга ўдзелу. Папрасіце людзей прадставіцца і разам азнаёміцца з магчымасцямі Loomio.</p>"
      title: "\U0001F44B Вітаем! Прывітайцеся і паспрабуйце!"
      description: "<p>Вітаем у нашай групе Loomio — вельмі рады, што вы тут!</p><p> Гэтая тэма — прастора для:</p><ul><li><p> Прадстаўцеся групе</p></li><li><p> Паспрабуйце некаторыя функцыі Loomio — напрыклад: паспрабуйце выкарыстоўваць рэакцыі \U0001F44D</p></li><li><p> Задавайце любыя пытанні, якія ў вас ёсць на гэтым этапе</p></li></ul><p> Калі вы не ведаеце, што сказаць, простага прывітання будзе дастаткова \U0001F642</p>"
      process_subtitle_v2: Вітайце людзей і разам асвойце Loomio
      process_introduction_v2: "<p>Прывітальная тэма для новых груп. Удзельнікі прадстаўляюцца, спрабуюць такія функцыі, як каментаванне і рэагаванне, і запускаюць сваю першую прапанову.</p>"
      title_v2: Вітаем! Прадстаўцеся і паспрабуйце нешта новае
      description_v2: "<p>Вітаем у групе! Гэтая тэма — месца, дзе можна павітацца, задаць пытанні, паспрабаваць розныя рэчы і асвоіцца з Loomio.</p><p> Пакіньце каментар, скарыстайцеся рэакцыяй або пачніце адну з прапаноў ніжэй.</p><p> Калі вы не ведаеце, што сказаць, простага прывітання будзе дастаткова! Або паспрабуйце адзін з інструментаў галасавання ніжэй.</p>"
    blank:
      process_name: Пусты шаблон
      process_subtitle: Пачніце новую дыскусію на любую тэму
      process_introduction: "<p>Пачніце абмеркаванне ў сваёй групе на любую тэму, якая вам падабаецца.</p><p> Па змаўчанні ўсе ўдзельнікі групы атрымаюць апавяшчэнне аб пачатку абмеркавання. Вы можаце змяніць гэта, адрэдагаваўшы поле «запрасіць» ніжэй.</p>"
    discuss_a_topic:
      title_placeholder: Якую тэму вы хочаце абмеркаваць?
      process_name: Абмеркаваць тэму
      process_subtitle: Пачніце абмеркаванне са сваёй групай
      process_introduction: "<p>Ці ёсць пытанне, праблема ці магчымасць, якую вы хацелі б узняць перад сваёй групай?</p><p> Прадстаўце тэму, дадайце спасылку на любую даведачную інфармацыю і папрасіце каментарыяў, ідэй і дапамогі.</p><p> Запрашайце людзей да ўдзелу, далучаючы свае думкі і адпаведную інфармацыю. Выкарыстоўвайце @згадванне, каб прыцягнуць увагу пэўных людзей.</p><p> Абнаўляйце кантэкст тэмы па меры прасоўвання дыскусіі, каб дапамагчы сфармуляваць выснову.</p><p> Не чакайце, пакуль у вас будзе ўся інфармацыя, каб пачаць тэму. Лепш выкарыстоўвайце тэму, каб запрасіць людзей, якія дапамогуць вам вывучыць тэму і знайсці рашэнне.</p>"
      description: <h3 id="introduce-and-describe-the-topic">Прадстаўце і апішыце тэму</h3><p></p><h3 id="why-is-this-important"> Чаму гэта важна?</h3><p></p><h3 id="how-would-you-like-people-to-respond"> Як бы вы хацелі, каб людзі адрэагавалі?</h3><p></p>
    onboarding_to_loomio:
      title: Выкарыстоўваем Loomio для нашай групы
      process_name: Давайце разам паспрабуем Loomio
      process_subtitle: Тэма, якая дапаможа пачаткоўцам у Loomio папрактыкавацца ў напісанні каментарыяў і галасаванні.
      process_introduction: "<p>Пазнаёмце людзей з Луміа.</p><p> Выдатны спосаб пазнаёміцца з Луміа — гэта простая тэма для знаёмстваў і прапанова практыкі</p>"
      description: <h3 id="why-are-you-interested-in-using-loomio">Чаму вас цікавіць выкарыстанне Loomio?</h3><p> Мы зацікаўлены ў выкарыстанні Loomio для ўцягвання людзей у прыняцце рашэнняў адносна нашай арганізацыі.</p><h3 id="what-are-you-asking-people-to-do"> Што вы просіце людзей зрабіць?</h3><p> Хацелася б пачуць вашыя думкі! Пакіньце каментар ніжэй і прагаласуйце за прапанову.</p><p> Вы можаце адказаць на каментар карыстальніка, націснуўшы на значок адказу, размешчаны ў правым ніжнім куце каментара.</p><p> Выкарыстоўвайце @згадванне, каб паведаміць людзям.</p>
      onboarding: Адаптацыя
    consent_process:
      title_placeholder: Распрацоўка нашай палітыкі ў галіне аховы здароўя і бяспекі
      process_name: Працэс атрымання згоды
      process_subtitle: Прыміце рашэнне, якое можна «бяспечна паспрабаваць» без пярэчанняў.
      process_introduction: '<p>Звярніцеся па згоду на рашэнне, якое вам трэба прыняць, пры адсутнасці істотных пярэчанняў супраць вашай прапановы, каб вы маглі хутка прыняць рашэнне, якое можна «бяспечна паспрабаваць» зараз.</p><p> Тыповыя ролі:</p><ul><li><p> Прапаноўшчык: чалавек, які ўздымае тэму, якая патрабуе рашэння.</p></li><li><p> Фасілітатар: Той, хто можа дапамагчы прапановаму эфектыўна выконваць сваю працу.</p></li></ul><p> Агульныя этапы працэсу:</p><p> Крок 1. Прадстаўце прапанову з дапамогай тэмы Loomio.</p><p> Крок 2. Правядзіце раўнд пытанняў, рэакцый і любых каментарыяў, каб палепшыць прапанову з дапамогай праверкі сэнсу.</p><p> Крок 3. Унясіце змены ў прапанову з дапамогай прапаноў і каментарыяў.</p><p> Крок 4. Спытайце, ці ёсць у каго-небудзь важкія пярэчанні супраць змененай прапановы з прапановай аб згодзе.</p><p> Крок 5. Аб''яднайце абгрунтаваныя пярэчанні, каб стварыць змененую версію прапановы, якую ўсе лічаць «бяспечнай для выпрабавання», і пасля завяршэння паведаміце выснову рашэння.</p><p> <a target="_blank" rel="noopener noreferrer nofollow" href="https://help.loomio.com/en/guides/consent_process/index.html">Чытайце далей: Працэдура атрымання згоды.</a></p>'
      description: <h3 id="what-is-the-decision-you-need-to-make">Якое рашэнне вам трэба прыняць?</h3><h3 id=""></h3><h3 id="why-is-this-important-and-what-impact-does-it-have"> Чаму гэта важна і які ўплыў гэта мае?</h3><p></p><h3 id="what-information-do-people-need-for-context"> Якая інфармацыя патрэбна людзям для кантэксту?</h3><p></p><h3 id="who-is-the-facilitator-for-this-process"> Хто з'яўляецца пасярэднікам гэтага працэсу?</h3><p></p>
      consent: Згода
    advice_process:
      title_placeholder: Шукаю кансультацыю па куплі новага кампутара
      process_name: Працэс кансультавання
      process_subtitle: Звярніцеся па параду адносна рашэння, якое вам трэба прыняць.
      process_introduction: '<p>Прымайце рашэнне з кансультацыяй людзей, на якіх гэта паўплывае, або тых, хто мае вопыт, каб вы маглі прыняць лепшае рашэнне для сваёй арганізацыі.</p><p> Тыповыя ролі:</p><ul><li><p> Фасілітатар: чалавек, які прымае рашэнне або просіць кагосьці паспрыяць.</p></li><li><p> Кансультанты: людзі, на якіх гэта паўплывала, або якія валодаюць вопытам, якіх вы запрасілі.</p></li></ul><p> Агульныя этапы працэсу:</p><p> Крок 1. Звярніцеся да іншых, каб высветліць меркаванні, перш чым прапаноўваць дзеянні.</p><p> Крок 2. Зрабіце прапанову і звярніцеся па кансультацыю — аформіце прапанову па кансультацыі.</p><p> Крок 3. Улічваючы атрыманую параду, вы прымаеце рашэнне і паведамляеце людзям, якія далі параду, — агучваеце выснову.</p><p> <a target="_blank" rel="noopener noreferrer nofollow" href="https://help.loomio.com/en/guides/advice_process/index.html">Чытайце далей: Працэс кансультавання.</a></p>'
      description: <h3 id="what-is-the-decision-you-need-to-make">Якое рашэнне вам трэба прыняць?</h3><p></p><h3 id="why-is-this-important-and-what-impact-does-it-have"> Чаму гэта важна і які ўплыў гэта мае?</h3><p></p><h3 id="what-advice-are-you-asking-to-help-you-make-a-good-decision"> Якой парады вы просіце, каб дапамагчы вам прыняць правільнае рашэнне?</h3><p></p><h3 id="who-is-the-facilitator-for-this-process"> Хто з'яўляецца пасярэднікам гэтага працэсу?</h3><p></p>
      advice: Парада
    pass_a_resolution:
      title_placeholder: Пастанова аб зацвярджэнні стратэгіі
      process_name: Прыняць рэзалюцыю
      process_subtitle: Прадстаўце рэзалюцыю з кантэкстам, даведачнай інфармацыяй, адкажыце на пытанні і ўнясіце прапанову па прыняцці рэзалюцыі.
      process_introduction: '<p>«Правілы Роберта» — гэта структура, якая складаецца з набору кодэксаў і правілаў этыкі, якія дапамагаюць групам праводзіць спарадкаваныя сустрэчы, што дазваляюць большасці кіраваць, адначасова дазваляючы галасам меншасці быць пачутымі. <a target="_blank" rel="noopener noreferrer nofollow" href="https://www.boardeffect.com/blog/roberts-rules-of-order-cheat-sheet/">https://www.boardeffect.com/blog/roberts-rules-of-order-cheat-sheet/</a> Удзельнік прапануе дзеянне або прымае рашэнне, кажучы: «Я прапаную…». Іншы ўдзельнік павінен падтрымаць прапанову, сказаўшы: «Я падтрымліваю прапанову». Пасля таго, як хтосьці падтрымлівае прапанову, група галасуе па ёй. Яна прымаецца большасцю галасоў або кворумам у залежнасці ад правілаў статута.</p>'
      description: "<p><strong>Пазначце рэзалюцыю, якая будзе прынята</strong></p><p></p><p> <strong>Агляд кантэксту і даведачнай інфармацыі</strong></p><p></p><p> <strong>Запрашайце ўдзельнікаў задаваць пытанні, каменціраваць і ўносіць любую інфармацыю для стварэння агульнага разумення</strong></p><p></p>"
      resolution: Разрозненне
    decision_by_consensus:
      title_placeholder: Перагляд статута нашай арганізацыі
      process_name: Рашэнне на аснове кансенсусу
      process_subtitle: Дасягнуць калектыўнага пагаднення з усімі зацікаўленымі бакамі.
      process_introduction: '<p>Дасягненне кансенсусу для сумеснага прыняцця рашэння, каб дасягнуць пагаднення, якое задавальняе патрэбы і праблемы ўсіх удзельнікаў.</p><p> Тыповыя ролі:</p><ul><li><p> Прызначце фасілітатара. (На пасяджэннях праўлення гэта звычайна старшыня.)</p></li><li><p> Кворум або пераважная большасць членаў для ўдзелу, як пазначана ў статуце вашай арганізацыі.</p></li></ul><p> Агульныя этапы працэсу:</p><p> Крок 1. Стварыце адкрытую прастору для абмеркавання праблемы або прапанаванага рашэння.</p><p> Крок 2. Праверце наяўнасць кансенсусу і выкажыце пярэчанні з дапамогай прапановы Sense check.</p><p> Крок 3. Удакладніце любыя моманты, прапануйце канструктыўныя змены і ўнясіце змены ў прапанову.</p><p> Крок 4. Праверце наяўнасць згоды і любых астатніх пярэчанняў з дапамогай прапановы кансенсусу.</p><p> Крок 5. Зафіксуйце рашэнне з высновай і ўнясіце яго ў афіцыйны пратакол арганізацыі.</p><p> <a target="_blank" rel="noopener noreferrer nofollow" href="https://help.loomio.com/en/guides/consensus_process/index.html">Чытайце далей: Працэс кансенсусу.</a></p>'
      description: <h3 id="what-is-the-decision-you-need-to-make">Якое рашэнне вам трэба прыняць?</h3><p></p><h3 id="why-is-this-important-and-what-impact-does-it-have"> Чаму гэта важна і які ўплыў гэта мае?</h3><p></p><h3 id="what-information-do-people-need-for-context"> Якая інфармацыя патрэбна людзям для кантэксту?</h3><p></p><h3 id="who-is-the-facilitator"> Хто з'яўляецца фасілітатарам?</h3><p></p><h3 id="what-conditions-need-to-be-met-for-a-decision"> Якія ўмовы павінны быць выкананы для прыняцця рашэння?</h3><h3 id=""></h3>
      consensus: Кансенсус
    share_links_and_info:
      title_placeholder: Падзяліцеся спасылкамі і інфармацыяй
      process_name: Падзяліцеся спасылкамі і інфармацыяй
      process_subtitle: Публікуйце інфармацыю, спасылкі і справаздачы для абмеркавання і каментарыяў.
      process_introduction: "<p>Выкарыстоўвайце тэму ў якасці «сцяны» або «дошкі аб'яваў» для вашай групы, каб публікаваць інфармацыю, навіны і ідэі, якімі вы хацелі б падзяліцца адзін з адным.</p><p> Запрасіце ўдзельнікаў выкарыстоўваць інструменты фарматавання <strong>«Уставіць спасылку»</strong> і <strong>«Убудаваць відэа»</strong> , каб дапамагчы групе атрымліваць доступ да інфармацыі з Loomio. Выкарыстоўвайце <strong>загаловак</strong> у каментарыях, каб замацаваць каментар на часовай шкале ланцужка, каб яго было лёгка знайсці.</p><p> <strong>Замацуйце</strong> тэму, каб яна трымалася, і стымулюйце <strong>рэакцыі</strong> , каб падтрымліваць яе энергію, даючы людзям ведаць, што вы бачылі іх прадмет.</p><p> Па змаўчанні гэтая тэма адлюстроўваецца як <strong>«Найноўшыя»</strong> , таму самыя апошнія каментарыі знаходзяцца ўверсе тэмы.</p>"
      description: <p>Выкарыстоўвайце гэтую тэму, каб публікаваць інфармацыю, аб'явы і рэчы, якімі вы хацелі б падзяліцца — месца, дзе вы можаце бачыць, што адбываецца, і ўдзельнічаць.</p><p data-text-align="start"> Дзяліцеся падзеямі, справаздачамі, падкастамі і іншай цікавай інфармацыяй у інтэрнэце.</p><p data-text-align="start"> Выкарыстоўвайце інструменты фарматавання <strong>«Уставіць спасылку»</strong> і <strong>«Убудаваць відэа»</strong> , каб дапамагчы людзям атрымаць доступ да інфармацыі ў Loomio.</p>
      information: Інфармацыя
    prepare_for_a_meeting:
      title_placeholder: Падрыхтоўка да нашай наступнай сустрэчы
      process_name: Падрыхтуйцеся да сустрэчы
      process_subtitle: Складзіце парадак дня, размясціце дакументы савета дырэктараў і арганізуйце адміністрацыйныя пытанні, каб усе былі ў курсе падзей, былі ў курсе падзей і падрыхтаваныя.
      description: <p><strong>Асноўная тэма сустрэчы</strong></p><p></p><p data-text-align="start"> <strong>План парадку дня</strong></p><p data-text-align="start"></p><p data-text-align="start"> <strong>Дзеянні з мінулай сустрэчы</strong></p><p data-text-align="start"></p><p data-text-align="start"> <strong>Як удзельнікам варта падрыхтавацца да сустрэчы?</strong></p><p data-text-align="start"></p><p data-text-align="start"> <strong>Спіс дакументаў для сустрэчы</strong></p><p data-text-align="start"></p>
      process_introduction: <p>Плануйце эфектыўную сустрэчу, прыцягваючы людзей з самага пачатку, абмяркоўваючы найбольш важныя тэмы і лепш выкарыстоўваючы свой каштоўны час разам.</p><p> Выкарыстоўвайце тэму ў якасці кантэйнера для вашай сустрэчы, каб вызначыць галоўную тэму сустрэчы, скласці парадак дня, знайсці падыходзячую дату, размясціць ключавыя дакументы і справаздачы, пачаць абмеркаванне пунктаў парадку дня, сачыць за дзеяннямі і весці пратакол.</p><p> Гэта дапамагае ўсім падрыхтавацца да сустрэчы, прачытаўшы матэрыялы і абдумаўшы тэмы для абмеркавання і рашэнні, якія трэба прыняць. Тады ўдзельнікі, хутчэй за ўсё, прыйдуць да сустрэчы ў кантэксце і будуць гатовыя да яе.</p><p> Больш падрабязна пра <a target="_blank" rel="noopener noreferrer nofollow" href="https://help.loomio.com/en/guides/board_processes/meeting.html"><u>падрыхтоўку да сустрэчы</u></a> чытайце ў Кіраўніцтве па добрым кіраванні ў Луміа.</p>
      meeting: Сустрэча
    build_a_policy:
      title_placeholder: Перагляд нашай палітыкі найму
      process_name: Распрацаваць палітыку
      process_subtitle: Працуйце са сваёй камандай, каб распрацаваць і ўзгадніць дакумент палітыкі або працэдуры.
      process_introduction: "<p><span>Тэма — гэта кантэйнер для абмеркавання палітыкі, дзе вы можаце ўзгадніць патрабаванні і прынцыпы, а таксама публікаваць чарнавікі дакументаў для каментарыяў.</span></p><p> <span>Выкарыстоўвайце шаблон для распрацоўкі палітыкі з невялікай групай людзей або зрабіце яе празрыстай для ўсёй арганізацыі, запрашаючы каментарыі да прагрэсіўных версій дакумента.</span></p><p> <span>Выкарыстоўвайце прапанову праверкі Sense, каб паведаміць членам групы, што чарнавік дакумента гатовы да разгляду, і запрасіць людзей прачытаць дакумент і адказаць на любыя каментарыі або пытанні.</span></p><p> <span>Калі «канчатковы» праект гатовы, унясіце прапанову аб згодзе або кансенсусе для зацвярджэння дакумента.</span></p>"
      description: "<p><strong><span>Якую палітыку або дакумент вам трэба распрацаваць?</span></strong></p><p></p><p> <strong><span>Чаму гэта важна?</span></strong></p><p></p><p> <strong><span>Што вы просіце людзей зрабіць?</span></strong></p><p></p>"
      policy: Палітыка
    elect_a_governance_position:
      title_placeholder: Вылучэнне кандыдатаў у Савет і выбары
      process_name: Абраць кіруючую пасаду
      process_subtitle: Вылучыць і абраць каго-небудзь на кіруючую пасаду ў савеце, камітэце або праўленні.
      process_introduction: "<p>Увядзіце кіруючую ролю і крытэрыі для пасады, каб дапамагчы членам ацэньваць кандыдатаў.</p><p> Заклікайце вылучаць кандыдатаў з дапамогай апытання, у якім неабходна падпісвацца. Запрасіце намінантаў апублікаваць фота кандыдата разам з яго біяграфіяй і рэкамендацыямі. Убудуйце відэазварот ад кандыдата, каб удзельнікі маглі бачыць і чуць яго непасрэдна.</p><p> Калі вы гатовыя абраць кандыдата, скарыстайцеся прапановай згоды.</p><p> Калі ў вас ёсць некалькі кандыдатаў на пасаду, выкарыстоўвайце прапанову ранжыраванага выбару, дзе выбаршчыкі могуць ранжыраваць кандыдатаў у парадку перавагі.</p>"
      description: '<h3 id="what-position-do-you-need-to-fill">Якую пасаду вам трэба запоўніць?</h3><p></p><h3 id="why-is-this-important"> Чаму гэта важна?</h3><p></p><h3 id="what-qualifications-skills-and-experiences-make-a-good-cand"> Якія кваліфікацыі, навыкі і вопыт робяць кандыдата добрым?</h3><p></p><h3 id="what-is-the-election-process"> Што такое выбарчы працэс?</h3><p> Этап 1: Вылучэнне кандыдатаў — мы запрашаем вылучыць кандыдатуры адпаведных кандыдатаў.</p><p> Этап 2: Прадстаўленне кандыдатаў — дадайце фота, кароткую біяграфію і рэкамендацыю для кожнага кандыдата.</p><p> Этап 3: Выбары — галасаванне за прызначэнне кандыдата на пасаду.</p>'
      election: Выбары
    funding_decision:
      title_placeholder: Заяўка на фінансаванне выставы робататэхнікі
      process_name: Рашэнне аб фінансаванні
      process_subtitle: Апрацуйце заяўку на грант, пазыку або інвестыцыі і прыміце рашэнне аб фінансаванні.
      process_introduction: "<p>Падайце заяўку на фінансаванне, далучыце дакументы і іншыя пацвярджальныя матэрыялы.</p><p> Каротка апішыце прыкладанне ў кантэксце патоку.</p><p> Запрасіце ўпаўнаважаных асоб азнаёміцца з заяўкай і задаць пытанні. Дайце дастаткова часу для абмеркавання.</p><p> Унесці кансенсусную прапанову аб зацвярджэнні фінансавання.</p><p> Калі хтосьці не згодны, спытайце прычыну — напрыклад, можа спатрэбіцца дадатковая інфармацыя. Прапануйце чалавеку, які не згодны, змяніць свой голас, калі ён будзе задаволены.</p><p> Калі ў вас ёсць выразнае рашэнне адносна заяўкі на фінансаванне, зафіксуйце выснову гэтага рашэння.</p>"
      description: <h3 id="introduce-and-summarize-the-funding-application">Прадстаўце і коратка апішыце заяўку на фінансаванне</h3><p></p><h3 id="how-does-this-application-fit-with-funding-criteria"> Як гэтая заяўка адпавядае крытэрыям фінансавання?</h3><p></p><h3 id="who-is-authorized-to-approve-this-funding-decision"> Хто мае права зацвярджаць гэтае рашэнне аб фінансаванні?</h3><p></p><h3 id="invite-questions-from-decision-makers-to-process-the-applica"> Запрасіце асоб, якія прымаюць рашэнні, задаць пытанні для апрацоўкі заяўкі</h3><p></p>
      funding: Фінансаванне
    approve_a_document:
      title_placeholder: Распрацоўка стратэгіі нашага брэнда
      process_name: Зацвердзіць дакумент
      process_subtitle: Прадставіць, абмеркаваць і распрацаваць важны дакумент, палітыку або пагадненне.
      process_introduction: "<p>Прадстаўце дакумент разам з любой даведачнай інфармацыяй. Пазначце мэту дакумента, каб дапамагчы засяродзіцца.</p><p> Запрасіце людзей падзяліцца інфармацыяй і сваім вопытам і выкарыстоўвайце гэта для фарміравання дакумента. Прыміце да ўвагі і ўлічвайце водгукі і ўнёскі людзей.</p><p> Уключыце ўклад у першы чарнавік дакумента і наступныя чарнавікі, пакуль ён не будзе гатовы да зацвярджэння.</p><p> Выкарыстоўвайце апытанне Sense check, каб даведацца меркаванні і высветліць любыя праблемы з чарнавіком.</p><p> Пасля таго, як водгук будзе разгледжаны і ўключаны ў дакумент, пераходзьце да зацвярджэння або ўзгаднення прапановы па згодзе або кансенсусе.</p><p> Нітка становіцца выразным запісам прагрэсу стварэння дакумента і прынятых рашэнняў.</p>"
      description: <h3 id="what-is-the-purpose-of-the-document">Якая мэта дакумента?</h3><p></p><h3 id="why-is-this-important"> Чаму гэта важна?</h3><p></p><h3 id="what-are-you-asking-people-to-do"> Што вы просіце людзей зрабіць?</h3><p></p>
      document: Дакумент
