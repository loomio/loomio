    english: Webhook payloads are presentation-oriented messages intended for chat services. They are not complete serialized Loomio records. Links in the message identify the affected Loomio content; an integration can follow up through the User API when it needs structured current state.
    translation: Webhook-Nutzdaten sind für Chat-Dienste aufbereitete Nachrichten. Sie enthalten keine vollständigen serialisierten Loomio-Datensätze. Links in der Nachricht verweisen auf die betroffenen Loomio-Inhalte. Wenn eine Integration den aktuellen Stand als strukturierte Daten benötigt, kann sie ihn über die Benutzer-API abrufen.
