  f9901909d4cd86e0:
    english: If you are an admin, you can manage members from the **Members** tab on your group page.
    translation: Se você é admin, pode gerenciar os membros pela aba **Membros** na página do seu grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d25e71106f726cac:
    english: Click on the three dots (**⋮**) to the right of the group member to set their title, make them an admin, make them a delegate, or remove them from the group.
    translation: Clique nos três pontos (**⋮**) à direita do nome de um membro para definir seu cargo, torná-lo admin ou delegado, ou eliminá-lo do grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  db5a08225152e80a:
    english: "![Member actions menu on the Oatmilk Cooperative members page](member_management.png)"
    translation: "![Menu de ações de um membro na página de membros da Cooperativa Oatmilk](member_management.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0f29eb85fabc200d:
    english: |-
      ## Administering your group
      There are only two user types in a Loomio group: **member** and **admin**.
    translation: |-
      ## Administração do seu grupo
      Há apenas dois tipos de usuário em um grupo do Loomio: **membro** e **admin**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4317e6fcbbedcdaa:
    english: 'Admins perform administrative tasks for your group, including: adding and removing members, managing member permissions, setting the group privacy levels, and managing the subscription plans.  In addition, admins are able to see the email addresses of members and export the group''s data.'
    translation: Admins cuidam de tarefas administrativas do grupo, como adicionar e eliminar membros, gerenciar suas permissões, definir os níveis de privacidade do grupo e gerenciar os planos de assinatura. Também podem ver os endereços de e-mail dos membros e exportar os dados do grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7de2ea0e85a19d0a:
    english: The person creating a new Loomio group is made admin by default. We recommend to make at least one other trusted person in your group an admin, to insure someone can always administer your group. You can have as many admins in your group as you wish.
    translation: Quem cria um grupo no Loomio se torna admin automaticamente. Recomendamos tornar admin pelo menos mais uma pessoa de confiança, para que sempre haja alguém que possa administrar o grupo. Você pode ter quantos admins quiser.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ac9e3bb2da56869e:
    english: To make a member **admin**, go to the Members tab, find the member and click on the three dots (**⋮**) next to their name. Choose **Make admin**. An `Admin` tag will appear beside their name.
    translation: Para tornar um membro **admin**, acesse a aba Membros, encontre a pessoa e clique nos três pontos (**⋮**) ao lado do nome dela. Selecione **Tornar Admin**. A etiqueta `Admin` aparecerá ao lado do nome.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b93c8eaf5367f572:
    english: "![Make admin action in a member's menu](member_make_admin.png)"
    translation: "![Ação Tornar Admin no menu de um membro](member_make_admin.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f6d7a993e2d32771:
    english: |-
      ## Managing subgroups
      If you are the admin of a parent group, or organization, you have additional permissions with regards to any __closed__ subgroups.
    translation: |-
      ## Gestão de subgrupos
      Se você é admin de um grupo principal ou de uma organização, tem permissões adicionais nos subgrupos __fechados__.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cd781594b26ae052:
    english: You will be able to join any closed subgroup by clicking the "Join Group" button on the left of the Subgroup page in question (just under the tabs).
    translation: Você pode entrar em qualquer subgrupo fechado clicando no botão "Entrar no grupo" à esquerda da página do subgrupo, logo abaixo das abas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ba630e95409473a5:
    english: "![Join group button on a closed Oatmilk Cooperative subgroup](member_join_subgroup.png)"
    translation: "![Botão Entrar no grupo em um subgrupo fechado da Cooperativa Oatmilk](member_join_subgroup.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  87c2d0e0fa784cff:
    english: Once you have joined the subgroup, you will also be able to make yourself the admin of that subgroup, just as you would promote anyone to admin.
    translation: Depois de entrar no subgrupo, você também pode se tornar admin dele, da mesma forma que tornaria qualquer outra pessoa admin.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e439992d86591319:
    english: |-
      >[!Note]
      >These permissions do not extend to [**secret** subgroups](/en/user_manual/groups/subgroups/?highlight=secret#permissions).
    translation: |-
      >[!Note]
      >Essas permissões não se estendem aos [subgrupos **secretos**](/en/user_manual/groups/subgroups/?highlight=secret#permissions).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  31a8fbe10f50c1a0:
    english: |-
      ## Removing members
      When you click **Remove from group** you'll be asked to confirm the removal. Upon removal, this user will no longer have access to the group's pages, threads, polls, or proposals. They will receive no further emails or notifications of group activity. However, any comments and votes written by the user will remain untouched.
    translation: |-
      ## Remoção de membros
      Ao clicar em **Eliminar do grupo**, você precisará confirmar a remoção. Depois disso, a pessoa perderá o acesso às páginas, conversas, consultas e propostas do grupo. Ela não receberá mais e-mails nem notificações sobre as atividades do grupo. Seus comentários e votos permanecerão intactos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8bf29fce0f0d8e9b:
    english: "![Remove from group action in a member's menu](member_remove.png)"
    translation: "![Ação Eliminar do grupo no menu de um membro](member_remove.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  aa3b173ffd048b99:
    english: You can add removed members back to the group later if you wish.
    translation: Você pode adicionar novamente ao grupo os membros removidos, se quiser.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6ef7d0422c66d652:
    english: |-
      ## Leaving group
      To leave a group: go to the group page, open the 3 dot menu, and click **Leave group**.
    translation: |-
      ## Saída de um grupo
      Para sair de um grupo, acesse a página dele, abra o menu de três pontos e clique em **Sair do grupo**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5395b374b5814162:
    english: "![Leave group action in the Oatmilk Cooperative settings menu](member_leave_group.png)"
    translation: "![Ação Sair do grupo no menu de configurações da Cooperativa Oatmilk](member_leave_group.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d926fc8d1e3cbac2:
    english: |-
      ## Set title
      Within the Members tab, you can also name your role within the group, or identify an organization you represent using **title**. You or a group admin can change your title with **Set title** from the 3 dot menu near your name.
    translation: |-
      ## Definir cargo
      Na aba Membros, você pode usar o **cargo** para indicar sua função no grupo ou a organização que representa. Você ou um admin do grupo podem alterar seu cargo selecionando **Configurar o título** no menu de três pontos ao lado do seu nome.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2425e4d5b1e8047d:
    english: "![Set title action in a member's menu](member_set_title.png)"
    translation: "![Ação Configurar o título no menu de um membro](member_set_title.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6af456317883a890:
    english: You can have different titles in different subgroups.
    translation: Você pode ter cargos diferentes em subgrupos diferentes.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2d59cb70493e06b1:
    english: "## Member email addresses"
    translation: "## Endereços de e-mail dos membros"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cee3a1e0e1031377:
    english: Only admins can see group member email addresses.  This is sometimes necessary to audit the members in a group.
    translation: Somente admins podem ver os endereços de e-mail dos membros do grupo. Isso pode ser necessário para conferir quem faz parte do grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4ff1112b058a3205:
    english: 'To see member email addresses: Use [data export](/en/user_manual/groups/data_export/) to download a CSV file, and open the file in Excel or Google sheets.'
    translation: Para ver os endereços de e-mail dos membros, use a [exportação de dados](/en/user_manual/groups/data_export/) para baixar um arquivo CSV e abra-o no Excel ou no Google Planilhas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  105be57911f832fc:
    english: The export group data file shows every person and their email address in every subgroup.
    translation: O arquivo de exportação dos dados do grupo mostra cada pessoa e seu endereço de e-mail em todos os subgrupos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  20f87bcff4ec41e6:
    english: You can also search for members by email address in the members tab. So if you see someone you want to remove, you can search by email to remove them.
    translation: Você também pode buscar membros pelo endereço de e-mail na aba Membros. Se quiser eliminar alguém do grupo, busque a pessoa pelo e-mail.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
