    english: "![Location of the approve and reject buttons for an unrecognised email](email_unreleased_emails.png)"
    translation: "![Position der Schaltflächen zum Genehmigen und Ablehnen einer E-Mail von einer unbekannten Adresse](email_unreleased_emails.png)"
    status: machine
