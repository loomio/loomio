  14280ff177b248ab:
    english: "# Send an email to start a thread in your group"
    translation: "# Envie um e-mail para iniciar uma discussão em seu grupo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e3de5524e10b9928:
    english: Your Loomio group has an email address! You can send or forward email to this address to start a thread in the group.
    translation: Seu grupo no Loomio tem um endereço de e-mail. Você pode enviar ou encaminhar um e-mail para esse endereço para iniciar uma discussão no grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  85a7436d4a1b4396:
    english: |-
      You can see your group's email address on the group page:
      ![location of the email address on the group page](email_email_button.png)
    translation: |-
      Você encontra o endereço de e-mail do grupo na página do grupo:
      ![Localização do endereço de e-mail na página do grupo](email_email_button.png)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e34019bbcf3b319f:
    english: When you send an email to this address, a new thread will be started. The email subject becomes the thread title, the body of the email becomes the description, and any attached files will be attached to the thread.
    translation: Quando você envia um e-mail para esse endereço, uma nova discussão é iniciada. O assunto do e-mail se torna o título da discussão, o corpo se torna a descrição e os arquivos anexados são adicionados à discussão.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  46a53b8267a61c2f:
    english: The email "From" address is used to find the group member who will be the author of the thread.
    translation: O endereço no campo "De" do e-mail identifica o membro do grupo que será o autor da discussão.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bd7df6f632af8db1:
    english: "## Preventing unauthorized emails"
    translation: "## Como impedir e-mails não autorizados"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a5118468df167ba0:
    english: To ensure that this feature cannot be used by people who are not members of your group, Loomio will require that the "From" address of an incoming email matches the address of someone in the group.
    translation: Para impedir que pessoas de fora do grupo usem esse recurso, o Loomio exige que o endereço no campo "De" do e-mail corresponda ao de um membro do grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f11910ae643c5b47:
    english: If you use multiple email addresses, you can add an alias so Loomio knows about your other email addresses.
    translation: Se você usa vários endereços de e-mail, pode adicionar um alias para que o Loomio reconheça seus outros endereços.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e3d88a25128322b5:
    english: When the "from" address does not match a member of the group, you will receive a notification asking you to add an alias or reject all further emails from that address.
    translation: Se o endereço no campo "De" não corresponder ao de um membro do grupo, você receberá uma notificação para adicionar um alias ou rejeitar todos os futuros e-mails desse endereço.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  890546269cfa56b6:
    english: This means that the first time you send email from an unrecognised address, you will need to add an alias. After that, emails will be accepted immediately.
    translation: Na primeira vez que você enviar um e-mail de um endereço não reconhecido, precisará adicionar um alias. Depois disso, os e-mails desse endereço serão aceitos imediatamente.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
