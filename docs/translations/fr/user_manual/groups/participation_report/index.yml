  0431c9fc46658338:
    english: 'The group participation report gives insights into the usage of your Loomio group. '
    translation: Le rapport de participation vous permet de suivre l’activité de votre groupe Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0d23c0831f1ea6ca:
    english: 'You''re able to choose which groups to include in the report, the start and end date for the report, and the interval (year, month, week or day) for grouping results. '
    translation: Vous pouvez choisir les groupes à inclure, les dates de début et de fin, ainsi que l’intervalle de regroupement des résultats (année, mois, semaine ou jour).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  73c9822c08a37866:
    english: The report is available to everyone in your group, however users can only see results for groups that they belong to, this means that different users may see slightly different reports.
    translation: Le rapport est accessible à tous les membres de votre groupe. Chaque personne ne voit toutefois que les résultats des groupes dont elle est membre. Les rapports peuvent donc varier légèrement d’une personne à l’autre.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c9402b4720639f86:
    english: 'You can find the report by clicking the group settings menu cog, as shown below. '
    translation: Pour ouvrir le rapport, cliquez sur l’icône en forme d’engrenage du menu des paramètres du groupe, comme ci-dessous.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
