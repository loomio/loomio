  ced10eda436a40ca:
    english: "## How people use Loomio"
    translation: "## Comment Loomio est utilisé"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4198817a2724ad0a:
    english: "**Member organizations** to involve members in decisions at scale. Political parties, consumer and worker co-operatives, and membership associations use Loomio to facilitate a safe, inclusive space for members to share information and raise topics, participate in important decisions and vote in General Assembly. Streamline decision processes, improve transparency and accountability, document discussions and record decisions, and include members' voices to organize for action."
    translation: "**Organisations de membres** pour associer leurs membres aux décisions à grande échelle. Les partis politiques, les coopératives de consommateurs et de travailleurs et les associations utilisent Loomio pour offrir à leurs membres un espace sûr et ouvert à toutes et tous. Ils peuvent y partager des informations, soulever des sujets, participer aux décisions importantes et voter en assemblée générale. Loomio les aide à simplifier les processus de décision, à renforcer la transparence et la responsabilité, à documenter les discussions et les décisions, et à tenir compte de la voix des membres pour organiser l’action."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7b2fd1306e05f4e3:
    english: "**Self-managing organizations** to involve staff in decisions. Self-managing teams, worker co-operatives, and sociocratic organisations use Loomio to run consent, consensus, and advice-based decision processes across distributed teams and time zones. Tap into collective intelligence, distribute decision making, build governance and policy together, and document decisions and discussion."
    translation: "**Organisations autogérées** pour associer leur personnel aux décisions. Les équipes autogérées, les coopératives de travailleurs et les organisations sociocratiques utilisent Loomio pour mener des processus de décision fondés sur le consentement, le consensus ou la consultation, même lorsque les équipes sont réparties entre plusieurs lieux et fuseaux horaires. Elles peuvent mettre en commun leurs connaissances, répartir la prise de décision, élaborer ensemble leurs règles et leurs politiques, et documenter leurs décisions et leurs discussions."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  75d7266c562f65c2:
    english: "**Boards, councils, and distributed networks** to involve stakeholders in decisions. Create a safe space for discussion, keep track of communications, and coordinate across geographies and time zones. Structure decision making processes, improve agility and response times, and preserve organizational memory."
    translation: "**Conseils, assemblées et réseaux répartis** pour associer les parties prenantes aux décisions. Loomio leur offre un espace sûr pour discuter, suivre les échanges et se coordonner malgré la distance et les fuseaux horaires. Ils peuvent structurer leurs processus de décision, réagir plus rapidement et conserver la mémoire de leur organisation."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cbe5ae77738f2704:
    english: "**Residential communities and co-ops** to make decisions together as neighbours. Cohousing communities, ecovillages, coliving cooperatives, housing co-ops, and land trusts use Loomio to replace or augment traditional strata and property management with democratic governance. Residents shape decisions about shared land, common spaces, and community agreements, and asynchronous discussion means members can fully participate whether they're on-site or away travelling, keeping a clear record of how the community has chosen to live together."
    translation: "**Communautés résidentielles et coopératives** pour prendre des décisions entre voisins. Les habitats participatifs, écovillages, coopératives d’habitat partagé, coopératives de logement et fiducies foncières utilisent Loomio pour remplacer ou compléter la gestion immobilière traditionnelle par une gouvernance démocratique. Les résidents participent aux décisions concernant les terrains partagés, les espaces communs et les accords de vie collective. Grâce aux discussions asynchrones, les membres peuvent participer pleinement, qu’ils soient sur place ou en voyage. La communauté conserve ainsi une trace claire de ses choix de vie commune."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb1039083c952286:
    english: Loomio builds a living record of your organization; the decisions made, who was involved and the discussion leading up to the decision.
    translation: 'Loomio constitue une archive vivante de votre organisation : les décisions prises, les personnes qui y ont participé et les discussions qui ont mené à ces décisions.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
