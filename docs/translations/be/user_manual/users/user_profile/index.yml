  2e3c544b479874d5:
    english: If you have two Loomio user accounts, you can merge them into a single account.
    translation: Калі ў вас ёсць два ўліковыя запісы Loomio, вы можаце аб'яднаць іх у адзін.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  26fec713318a68fc:
    english: See [Merge Accounts](../merge_accounts).
    translation: Глядзіце [Аб'яднанне ўліковых запісаў](../merge_accounts).
    status: machine
