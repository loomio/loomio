    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e6c693b0bbf41324:
    english: Select your name in the sidebar to open your user menu.
    translation: Виберіть своє ім’я на бічній панелі, щоб відкрити меню користувача.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e671b5bc0a63ce1d:
    english: Use this menu to edit your profile, change notification settings, choose a theme, manage account settings, and sign out.
    translation: У цьому меню можна редагувати профіль, змінювати налаштування сповіщень, вибирати тему оформлення, керувати налаштуваннями облікового запису та виходити з нього.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
