  f9918d7d61cef0c9:
    english: Culture, protocol, and expectations can be implicit or explicit, and by nature intersect in complex ways with power dynamics and social capital. It’s a challenging balance to keep things loose enough to allow emergence, evolution, creativity, and freedom, while being explicit enough about bottom lines and boundaries to ensure safety.
    translation: 'A kultúra, a szabályok és az elvárások lehetnek kimondatlanok vagy kifejezettek. Összetett módon kapcsolódnak a hatalmi viszonyokhoz és a társas kapcsolatokból fakadó lehetőségekhez. Nehéz megtalálni az egyensúlyt: maradjon elég tér a változásnak, az alkotásnak és a szabadságnak, ugyanakkor legyenek világosak azok az alapelvek és határok, amelyek biztonságot adnak.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3d484eafb8524354:
    english: Facilitators often guide the group to live up to the culture it has set, follow the protocols it has agreed, and hold expectations to account. If a facilitator is tasked with this role, they need to be backed by a certain level of explicitness about those agreements, and a certain mandate. Otherwise, it can get messy.
    translation: A facilitátorok gyakran segítenek a csoportnak betartani a közösen kialakított szokásokat és szabályokat, valamint számon kérni az elvárásokat. Ehhez a megállapodásoknak elég világosnak kell lenniük, és a facilitátornak felhatalmazást kell kapnia a szerepére. Enélkül könnyen zavaros helyzetek alakulnak ki.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ba3ef231a647d607:
    english: People often want to leave things to “common sense” and avoid agreeing a code of conduct or explicit protocols. However, this can disproportionately affect the most vulnerable members of the group, since they will feel the negative impacts of bad behavior or culture first and strongest, and are least empowered to counteract it themselves. It's the responsibility of the more privileged or influential members of the group to think through these questions carefully.
    translation: Az emberek gyakran inkább a „józan észre” bíznák a dolgokat, és nem szeretnének magatartási kódexben vagy egyértelmű szabályokban megállapodni. Ez azonban különösen a csoport kiszolgáltatottabb tagjait érintheti hátrányosan. Ők érzik meg leghamarabb és legerősebben a rossz viselkedés vagy a káros csoportkultúra hatását, miközben kevesebb lehetőségük van fellépni ellene. A kiváltságosabb vagy nagyobb befolyású tagok felelőssége, hogy alaposan átgondolják ezeket a kérdéseket.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d14bcec24555318c:
    english: Like a legal contract, you hope you never have to enforce a code of conduct, but if you need it you’re very glad it’s there. You want to agree *before* it becomes necessary. In order for a facilitator or any member of the group to effectively stand up and say, “that’s not OK here”, you need to have already invested in culture-building and expectation-setting.
    translation: 'Egy magatartási kódex olyan, mint egy jogi szerződés: reméled, hogy sosem kell alkalmazni, de ha mégis szükség van rá, jó, hogy létezik. Érdemes *előre* megállapodni róla. Ahhoz, hogy egy facilitátor vagy bármelyik csoporttag határozottan kimondhassa: „ez itt nem elfogadható”, korábban már foglalkozni kell a csoport kultúrájával és elvárásaival.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dda14b86acbd8199:
    english: |-
      * Because Loomio is usually used as a space for constructive deliberation among groups with a specific purpose and set of members, for the most part people engage in good faith and behave respectfully.
      * Loomio is designed specifically to give voice to the individual, and let them communicate their needs and concerns. Even if a majority doesn’t see a problem, a single person can raise it and be heard.
      * Communicating online enables a certain level of physical safety, because people are not face to face.
      * Some groups already use the group description field to note a code of conduct or expectations for behavior. Others have collectively agreed a set of expectations that govern participation.
      * Many groups use Loomio itself to decide their group protocols, such as how to engage, what is allowed, what a decision means and what makes it valid, etc.
      * Some core protocol issues are answered simply by using Loomio: Who is allowed here? How do we communicate?
      * One of the most basic decisions Loomio users all encounter is about decision-making protocol — Consensus? Majority? Quorum? Unanimity? Bringing the question of decision-making protocol to the fore can be a very productive step in cultural development.
    translation: |-
      * A Loomiót általában meghatározott célú és tagságú csoportok használják építő jellegű tanácskozásra, ezért az emberek többnyire jóhiszeműen és tisztelettel vesznek részt benne.
      * A Loomio teret ad az egyéni véleményeknek, szükségleteknek és aggályoknak. Akkor is megszólalhat valaki, és meghallgathatják, ha a többség nem lát problémát.
      * Az online kommunikáció bizonyos fokú fizikai biztonságot ad, mert a résztvevők nincsenek szemtől szemben.
      * Egyes csoportok a csoportleírásban rögzítik a magatartási szabályokat vagy az elvárt viselkedést. Mások közösen állapodnak meg a részvétel szabályaiban.
      * Sok csoport magában a Loomióban dönt a működési szabályairól: hogyan vesznek részt a tagok, mi megengedett, mit jelent egy döntés, és mikor érvényes.
      * Néhány alapvető szabálykérdésre már a Loomio használata választ ad: Ki vehet részt? Hogyan kommunikálunk?
      * A Loomio felhasználóinak egyik alapvető döntése a döntéshozatal módja: konszenzus, többség, határozatképességi küszöb vagy egyhangúság? Ha ezt a kérdést nyíltan megvitatjátok, az segíthet a csoport kultúrájának kialakításában.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
