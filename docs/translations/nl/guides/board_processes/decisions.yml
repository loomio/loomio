---
navigation_title: Besluiten nemen
blocks:
  0a72d2c89c87c2a7:
    english: "# Making resolutions and online decisions"
    translation: "# Besluiten nemen en online beslissingen nemen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  50902da4933b32b7:
    english: Board and committee members frequently need to make 'out-of-session' decisions. These are governance decisions and discussion where either;
    translation: 'Bestuurs- en commissieleden moeten vaak buiten een vergadering besluiten nemen. Het gaat om bestuurlijke beslissingen en besprekingen in de volgende situaties:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4355b569fb0f9ee4:
    english: |-
      - There was insufficient time to make a decision in the board meeting,
      - the decision does not require a lot of discussion (including administrative decisions),
      - something has happened (internally or externally) that requires the board to act before the next meeting,
      - a director has a particular interest to explore with the board.
    translation: |-
      - Tijdens de bestuursvergadering was er onvoldoende tijd om een besluit te nemen,
      - het besluit vraagt weinig overleg, bijvoorbeeld bij administratieve zaken,
      - door een interne of externe gebeurtenis moet het bestuur vóór de volgende vergadering handelen,
      - een bestuurder wil een bepaald onderwerp met het bestuur bespreken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c46be74fd433f516:
    english: |-
      ## On Loomio
      Start a **thread** and open a discussion:
      - Introduce the topic or decision that you would like to make,
      - invite directors to comment with their thoughts, opinions and any information they have to help everyone understand their perspective about the 'out-of-session' topic or decision,
      - encourage members to participate by posting or reply to comments.
    translation: |-
      ## In Loomio
      Start een **discussie**:
      - Introduceer het onderwerp of het besluit dat je wilt nemen,
      - nodig bestuurders uit om hun gedachten, meningen en relevante informatie te delen, zodat iedereen hun standpunt begrijpt,
      - moedig leden aan om zelf iets te plaatsen of op reacties te antwoorden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  337cfc1a7b434acd:
    english: "When ready, raise a **poll** and invite members to vote. \nIf the issue is straightforward use a **Proposal** or if the issue is more complex use a **Sense check** poll to clearly ask fellow members how they feel about the proposal.\n- State the decision and invite people to vote,\n- ask people to leave a reason for their vote, particularly if they want to qualify any points,\n- choose the decision options that work for your board's decision-making processes.\n- You can ratify and minute the 'out-of-session' decision at your next board meeting."
    translation: "Open een **peiling** wanneer je zover bent en nodig leden uit om te stemmen. \nGebruik bij een eenvoudig onderwerp een **Voorstel**. Is het onderwerp ingewikkelder, gebruik dan een peiling van het type **Gevoelscontrole** om leden te vragen wat ze van het voorstel vinden.\n- Beschrijf het besluit en nodig mensen uit om te stemmen,\n- vraag mensen hun stem toe te lichten, vooral als ze ergens een voorbehoud bij hebben,\n- kies antwoordopties die passen bij de besluitvorming van jouw bestuur.\n- Je kunt het besluit buiten de vergadering tijdens de volgende bestuursvergadering bekrachtigen en in de notulen opnemen."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  19a80c3ce7d106e0:
    english: It's not a failure if a decision does not get agreement. You can ask members what changes they would make to enable them to agree to a decision. This helps you build to a better decision. A new Proposal with amendments is then more likely to achieve agreement.
    translation: Als er geen overeenstemming over een besluit is, betekent dat niet dat het proces is mislukt. Vraag leden welke wijzigingen nodig zijn om met het besluit in te stemmen. Zo kun je tot een beter besluit komen. Een nieuw Voorstel met die wijzigingen heeft meer kans op instemming.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b06f2d2a0e68f99d:
    english: State an **outcome** when the proposal closes. Let everyone know the result of the decision and what will happen next.
    translation: Deel een **conclusie** wanneer het voorstel sluit. Laat iedereen weten wat het besluit is en wat er daarna gebeurt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6a4d6a8c978bcb11:
    english: "## Examples of out-of-session decisions"
    translation: "## Voorbeelden van besluiten buiten een vergadering"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fff64b1ac620cc4a:
    english: |-
      ### Decision about property purchase
      At the last board meeting, a property purchase was discussed. A director required an independent engineering report before making the decision. At the board meeting, the board agreed to purchase the property subject to a satisfactory engineering report. However as the purchase must be made before the next board meeting, the board agreed to upload the engineering report to Loomio when ready, for discussion and to make the final decision for the property purchase on Loomio.
    translation: |-
      ### Besluit over de aankoop van een pand
      Tijdens de vorige bestuursvergadering werd de aankoop van een pand besproken. Een bestuurder wilde vóór het besluit een onafhankelijk bouwkundig rapport zien. Het bestuur stemde in met de aankoop, op voorwaarde dat het rapport gunstig zou zijn. Omdat de aankoop vóór de volgende bestuursvergadering moet plaatsvinden, sprak het bestuur af het rapport zodra het klaar is naar Loomio te uploaden. Daar kunnen de bestuurders het bespreken en een definitief besluit nemen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b279ed6b1c5aadfa:
    english: |-
      ### Decision to accept Directors and Officers Liability insurance
      During the board meeting it was noted that the annual insurance renewal was coming up. As this was considered to be an administrative matter, the board agreed to use Loomio to discuss the renewal application, seek the required information from each director, submit the application and to accept the insurance renewal quote.
    translation: |-
      ### Besluit om de bestuurdersaansprakelijkheidsverzekering te verlengen
      Tijdens de bestuursvergadering bleek dat de jaarlijkse verlenging van de verzekering eraan kwam. Het bestuur beschouwde dit als een administratieve zaak en sprak af Loomio te gebruiken om de verlengingsaanvraag te bespreken, de benodigde informatie bij elke bestuurder op te vragen, de aanvraag in te dienen en de offerte voor de verlenging te accepteren.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ca3a40286ca25a9a:
    english: |-
      ### A security breach has occurred at one of our facilities
      A break-in and theft of property has occurred that has put the corporation and staff at risk. Directors must be made aware of the event and risks, and evaluate an appropriate response.
    translation: |-
      ### Er is een beveiligingsincident geweest op een van onze locaties
      Er is ingebroken en er zijn eigendommen gestolen. Daardoor lopen de organisatie en medewerkers risico. Bestuurders moeten op de hoogte worden gebracht van het incident en de risico's en een passende reactie beoordelen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c406842807e1091b:
    english: |-
      ### A director has challenged the board about gender and diversity of board membership
      The director has provided good reasons and evidence that the board should diversify membership to be more representative of the corporation. Directors need to digest the information, ask questions, discuss the issue and decide a response.
    translation: |-
      ### Een bestuurder heeft de samenstelling van het bestuur op het gebied van gender en diversiteit ter discussie gesteld
      De bestuurder heeft goede argumenten en bewijzen aangevoerd om de samenstelling van het bestuur diverser te maken, zodat het de organisatie beter vertegenwoordigt. De andere bestuurders moeten de informatie doornemen, vragen stellen, het onderwerp bespreken en een reactie bepalen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bf35cdb4a62a85f4:
    english: "## Keeping a record of decisions made and supporting discussion"
    translation: "## Besluiten en bijbehorende discussies vastleggen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6231d476f6bddb27:
    english: Record keeping is a legal requirement for governance boards and good practice for committees.
    translation: Voor besturen is het bijhouden van documenten een wettelijke verplichting. Voor commissies is het een goede werkwijze.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  511470c795509c7e:
    english: Today, many organizations record and store formal minutes, resolutions, policies and key decisions electronically. Document records are created and approved, distributed and used, retained and stored, and ultimately disposed of.
    translation: Veel organisaties leggen notulen, besluiten, beleid en belangrijke beslissingen tegenwoordig digitaal vast. Ze maken documenten aan, keuren ze goed, verspreiden en gebruiken ze, bewaren ze en verwijderen ze uiteindelijk.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  324fc531e7a78088:
    english: |-
      ### On Loomio
      Minutes, reports, resolutions and other documents can be attached to a meeting **thread**, in the thread context, within a poll or any to thread comment.  This means the documents are always associated with the relevant discussion.
    translation: |-
      ### In Loomio
      Je kunt notulen, rapporten, besluiten en andere documenten toevoegen aan een **discussie** over een vergadering: in de beschrijving, in een peiling of bij een reactie. Zo blijven de documenten gekoppeld aan de relevante discussie.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9be58ccab5189118:
    english: A list of files can also be found under the **Files** tab.
    translation: Je vindt een overzicht van de bestanden ook op het tabblad **Bestanden**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  24bc6a0bf5139b23:
    english: You can also add a link within any thread or poll to a document stored in your preferred document management system.  Find the online shareable link to the document, copy and paste into your thread, poll or comment.
    translation: Je kunt in een discussie of peiling ook een link toevoegen naar een document in het documentbeheersysteem van jouw voorkeur. Zoek de deelbare link naar het document en plak die in de discussie, peiling of reactie.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4fee216f27a3fdff:
    english: Anyone with permission can then click the link to open and read the document.
    translation: Iedereen met toegang kan op de link klikken om het document te openen en te lezen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9f0e1cd18ae1a402:
    english: Because Loomio discussions and decisions are always already documented, it provides a robust way to verify all your board's decision-making. You can easily demonstrate what was decided, and when. If directors have discussed and commented, as well as voted on a resolution—you will also know how and why each decision was reached.
    translation: Loomio legt discussies en besluiten vast. Daardoor kun je nagaan hoe jouw bestuur besluiten heeft genomen. Je kunt eenvoudig laten zien wat er is besloten en wanneer. Als bestuurders ook hebben overlegd, gereageerd en over een besluit hebben gestemd, kun je zien hoe en waarom het besluit tot stand kwam.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  71071cda2f1c034e:
    english: Over time, you are creating a history for your organization where you can easily search and find past decisions and related discussion.
    translation: Zo bouw je een geschiedenis van jouw organisatie op waarin je eerdere besluiten en bijbehorende discussies gemakkelijk kunt zoeken en terugvinden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  629c2034788a9fd5:
    english: In Loomio all data is written and stored on multiple disks and multiple locations, *in the cloud*, backed up daily.  Files uploaded are stored on servers that use modern techniques to remove bottlenecks and points of failure.
    translation: In Loomio worden alle gegevens op meerdere schijven en op meerdere locaties *in de cloud* opgeslagen. Er wordt dagelijks een back-up gemaakt. Geüploade bestanden staan op servers die moderne technieken gebruiken om knelpunten en afzonderlijke storingspunten te voorkomen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
