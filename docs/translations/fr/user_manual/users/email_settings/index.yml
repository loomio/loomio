  5e3d442fa885bcd4:
    english: To stop email and push messages for group and thread activity, open **Notification settings** from your user menu, set the catch-up to **Never**, and choose **No email updates** and **No push updates**. Notifications and activity remain available when you open Loomio.
    translation: Pour ne plus recevoir d’e-mails ni de notifications push concernant l’activité des groupes et des fils de discussion, ouvrez **Paramètres de notification** depuis votre menu utilisateur. Réglez la fréquence des e-mails de rattrapage sur **Jamais**, puis choisissez **Aucune mise à jour par e-mail** et **Aucune mise à jour push**. Les notifications et l’activité restent accessibles lorsque vous ouvrez Loomio.
