  75e8b175ecfcd49a:
    english: "> *“Consent turns the question around: instead of asking for what we want, we ask whether there are reasons not to go ahead.” - Ted Rau, Sociocracy For All*"
    translation: "> *„Zustimmung kehrt die Frage um: Statt zu fragen, was wir wollen, fragen wir, ob es Gründe gibt, nicht fortzufahren.“ – Ted Rau, Sociocracy For All*"
    status: machine
