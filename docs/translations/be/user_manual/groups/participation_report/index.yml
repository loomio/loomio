    translated_on: '2026-09-30'
  b8e14bac0a6b4eda:
    english: Similar to "Actions per user", but the data is grouped by the country the user is detected as being in.
    translation: Як і ў раздзеле «Дзеянні па карыстальніках», але даныя згрупаваны паводле краіны, у якой, як вызначае сістэма, знаходзіцца карыстальнік.
