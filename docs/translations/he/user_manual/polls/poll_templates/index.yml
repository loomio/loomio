---
navigation_title: תבניות סקר
blocks:
  6428da81fbbe11c6:
    english: "# Poll templates"
    translation: "# תבניות סקר"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  208bc68b458895f1:
    english: Poll templates are reusable starting points shown when someone selects **Start a vote** or **New poll**. A template combines a voting method with preset guidance, response options, and settings.
    translation: תבניות סקר הן נקודות פתיחה לשימוש חוזר, המוצגות לאחר בחירה ב־**התחל הצבעה** או ב־**סקר חדש**. תבנית משלבת שיטת הצבעה עם הנחיות, אפשרויות תגובה והגדרות שנקבעו מראש.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f290b92adeb2a791:
    english: Use this page to configure which templates are available to a group or to create one for your own process. To choose a template for a particular vote, see [Proposals](../proposals/) or [Polls](../proposal_types/). To facilitate a complete decision process, see [Making decisions](/en/guides/making_decisions/).
    translation: בדף זה ניתן לקבוע אילו תבניות זמינות לקבוצה או ליצור תבנית לתהליך משלכם. לבחירת תבנית להצבעה מסוימת, ניתן לעיין ב[הצעות](../proposals/) או ב[סקרים](../proposal_types/). להנחיית תהליך קבלת החלטות מלא, ניתן לעיין ב[קבלת החלטות](/en/guides/making_decisions/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  658d10486cbee7dc:
    english: "## Voting methods and templates"
    translation: "## שיטות הצבעה ותבניות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d903d1a58aebf643:
    english: A voting method controls how participants respond and how Loomio calculates the result. Examples include Proposal, Choose, Score, Allocate, Rank, Time poll, and STV.
    translation: שיטת ההצבעה קובעת כיצד המשתתפים משיבים וכיצד Loomio מחשבת את התוצאה. דוגמאות לשיטות הן הצעה, בחירה, ציון, הקצאה, דירוג, סקר זמן ו־STV.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  21efff1a5c91ad29:
    english: A poll template uses one of those methods and adds reusable defaults. For example, Sense check, Advice, Consent, and Consensus are different templates built on the Proposal voting method. Their instructions and response options differ even though Loomio handles their ballots in the same way.
    translation: תבנית סקר משתמשת באחת מהשיטות האלה ומוסיפה הגדרות ברירת מחדל לשימוש חוזר. לדוגמה, בדיקת עמדות, עצה, הסכמה וקונצנזוס הן תבניות שונות המבוססות על שיטת ההצבעה הצעה. ההנחיות ואפשרויות התגובה שלהן שונות, אף ש־Loomio מטפלת בהצבעות שלהן באותה דרך.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f622951ffc7e1064:
    english: "## Use a template"
    translation: "## שימוש בתבנית"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  865e825cc7d00cf2:
    english: When starting a vote, select the **Proposal** or **Poll** tab and choose one of the templates available to the group.
    translation: בעת פתיחת הצבעה, יש לבחור בלשונית **הצעה** או **מִשׁאָל**, ואז לבחור אחת מהתבניות הזמינות לקבוצה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1598f1a55a6944e6:
    english: The template supplies an introduction, example content, options, and settings. Review and edit these for the particular decision before starting the vote. Editing the new vote does not change the reusable template.
    translation: התבנית מספקת מבוא, תוכן לדוגמה, אפשרויות והגדרות. לפני פתיחת ההצבעה, יש לבדוק ולערוך אותם בהתאם להחלטה המסוימת. עריכת ההצבעה החדשה אינה משנה את התבנית לשימוש חוזר.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8212a94908338b22:
    english: "## Who can manage templates"
    translation: "## מי יכולים לנהל תבניות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  378caa9ba83ee0dc:
    english: Group administrators can create and manage every poll template in their group. They can enable **Members can create templates** under **Group settings** → **Permissions**. When enabled, members can create templates and manage templates they authored.
    translation: מנהלי קבוצה יכולים ליצור ולנהל את כל תבניות הסקר בקבוצה שלהם. ניתן להפעיל את האפשרות **חברים יכולים ליצור תבניות** תחת **הגדרות קבוצה** → **הרשאות**. לאחר הפעלתה, חברי הקבוצה יכולים ליצור תבניות ולנהל תבניות שיצרו.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0fafc6275b6c9153:
    english: "## Create a poll template"
    translation: "## יצירת תבנית סקר"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5fc696a1e924179c:
    english: Open the template list and select **New template**. Start with an example or a blank template, then choose the group that will use it.
    translation: יש לפתוח את רשימת התבניות ולבחור **תבנית חדשה**. ניתן להתחיל מדוגמה או מתבנית ריקה, ואז לבחור את הקבוצה שתשתמש בה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  37b3658ec66eb8b7:
    english: The template form defines the guidance and defaults people receive when they start a vote.
    translation: טופס התבנית מגדיר את ההנחיות ואת ברירות המחדל שאנשים מקבלים כשהם פותחים הצבעה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fa0dab51a009bf90:
    english: "### Template title, subtitle, and help"
    translation: "### כותרת התבנית, כותרת המשנה והעזרה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  965cde5e13952ade:
    english: |-
      - **Template title** is the short name shown in the template list.
      - **Template subtitle** explains when to use it in one sentence.
      - **Template help** appears in the information panel when someone uses the template. Explain its purpose, any rules participants should know, and links to relevant policies or guides.
    translation: |-
      - **כותרת התבנית** היא השם הקצר המוצג ברשימת התבניות.
      - **כותרת משנה של התבנית** מסבירה במשפט אחד מתי להשתמש בה.
      - **עזרה בתבנית** מופיעה בחלונית המידע בעת שימוש בתבנית. יש להסביר את מטרתה, כללים שהמשתתפים צריכים להכיר, וקישורים למדיניות או למדריכים רלוונטיים.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f3e51b30163d5b85:
    english: Use plain, specific names that distinguish the template from others in the group.
    translation: כדאי להשתמש בשמות פשוטים ומדויקים, שמבדילים את התבנית מתבניות אחרות בקבוצה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e6b8a09191bb8c3f:
    english: "### Voting method"
    translation: "### שיטת הצבעה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ea4fef806c1cf060:
    english: Choose what participants need to express and how the result should be calculated.
    translation: יש לבחור מה המשתתפים צריכים להביע וכיצד תחושב התוצאה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f8c87a496921c710:
    english: |-
      - **Proposal**: respond to a statement using defined positions;
      - **Choose**: select one or more options;
      - **Score**: evaluate every option on a scale;
      - **Allocate**: distribute a limited budget of points;
      - **Rank**: arrange options in preference order;
      - **Time poll**: indicate availability; and
      - **STV**: rank candidates in a proportional, multi-winner election.
    translation: |-
      - **הצעה**: להגיב להצהרה באמצעות עמדות מוגדרות;
      - **לִבחוֹר**: לבחור אפשרות אחת או יותר;
      - **צִיוּן**: להעריך כל אפשרות לפי סולם;
      - **לְהַקְצוֹת**: לחלק מספר מוגבל של נקודות;
      - **דַרגָה**: לסדר אפשרויות לפי סדר העדפה;
      - **סקר זמן**: לציין זמינות; וכן
      - **STV**: לדרג מועמדים בבחירות יחסיות שבהן נבחרים כמה מועמדים.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9d589e44fa94c5e2:
    english: Changing the voting method changes the fields and result calculation available to the template.
    translation: שינוי שיטת ההצבעה משנה את השדות ואת אופן חישוב התוצאה הזמינים בתבנית.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  230689f781e4cbc7:
    english: "### Example title, details, and tags"
    translation: "### כותרת, פרטים ותגיות לדוגמה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6fa4b3625c6ec7ce:
    english: Provide example content that helps an author frame the vote. These values are copied into a new proposal or poll and can be edited before it starts.
    translation: יש לספק תוכן לדוגמה שיעזור למי שפותחים את ההצבעה לנסח אותה. הערכים האלה מועתקים להצעה או לסקר חדש, וניתן לערוך אותם לפני פתיחת ההצבעה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a093368b30ac3c9b:
    english: Use prompts rather than fixed content when each use needs a different title or details. Add default category tags only when they apply every time the template is used.
    translation: כאשר כל שימוש בתבנית דורש כותרת או פרטים שונים, כדאי להוסיף הנחיות במקום תוכן קבוע. יש להוסיף תגיות קטגוריה כברירת מחדל רק אם הן מתאימות לכל שימוש בתבנית.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  24c3fa4b7ef676fd:
    english: "### Response options"
    translation: "### אפשרויות תגובה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e7421caab9c47f5b:
    english: 'Methods such as Proposal and Choose let you configure response options. Select the pencil icon beside an option to edit:'
    translation: 'שיטות כמו הצעה ובחירה מאפשרות להגדיר אפשרויות תגובה. לעריכת אפשרות, יש לבחור בסמל העיפרון שלצידה:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  73a065ad5b861579:
    english: |-
      - **Option name**: the short response label;
      - **Icon**: its visual marker;
      - **Meaning**: what selecting the option communicates; and
      - **Reason prompt**: the question shown when someone explains their response.
    translation: |-
      - **שם האופציה**: התווית הקצרה של התגובה;
      - **סמל**: הסימון החזותי שלה;
      - **מַשְׁמָעוּת**: מה מבטאת הבחירה באפשרות; וכן
      - **הנחיית סיבה**: השאלה המוצגת כשמישהו מסביר את תגובתו.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  38bc8cfc36aaea2e:
    english: Define options so participants can tell the difference between them without guessing. The meanings should match the decision rules your group actually uses.
    translation: יש להגדיר את האפשרויות כך שההבדלים ביניהן יהיו ברורים למשתתפים. המשמעויות צריכות להתאים לכללי קבלת ההחלטות שהקבוצה משתמשת בהם בפועל.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cc4adba73670a75b:
    english: "### Duration and settings"
    translation: "### משך זמן והגדרות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6c63a57ab4cec442:
    english: Set a default duration that is suitable for most uses of the template. The author can change the closing time for an individual vote.
    translation: יש להגדיר משך זמן כברירת מחדל שמתאים לרוב השימושים בתבנית. מי שפותחים הצבעה יכולים לשנות את מועד הסגירה שלה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  df14be8dbf80fa3c:
    english: Other defaults can control result visibility, anonymous voting, vote-reason requirements, reminders, quorum, and method-specific behaviour. See [Proposal and poll settings](../settings/) for their effects.
    translation: ברירות מחדל נוספות יכולות לקבוע את נראות התוצאות, הצבעה אנונימית, דרישה לנימוק ההצבעה, תזכורות, מניין משתתפים מזערי והתנהגות ייחודית לשיטת ההצבעה. להסבר על השפעתן, ניתן לעיין ב[הגדרות הצעות וסקרים](../settings/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  774ed7b91d33ab10:
    english: "### Save and test the template"
    translation: "### שמירה ובדיקה של התבנית"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1b26a723ab8a9811:
    english: After saving, start a draft vote from the template. Check that its introduction, prompts, options, and defaults make sense to someone who did not create it. Starting a draft is also a useful way to confirm that the chosen voting method produces the result the group expects.
    translation: לאחר השמירה, יש לפתוח טיוטת הצבעה מהתבנית. כדאי לבדוק שהמבוא, ההנחיות, האפשרויות וברירות המחדל ברורים גם למי שלא יצרו אותה. פתיחת טיוטה מאפשרת גם לוודא ששיטת ההצבעה שנבחרה מפיקה את התוצאה שהקבוצה מצפה לה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1f0dab3f50320e75:
    english: "## Manage the template list"
    translation: "## ניהול רשימת התבניות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e9748843a900273f:
    english: 'Use the action menu beside a template to:'
    translation: 'בתפריט הפעולות שלצד תבנית ניתן:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  646235094d051c83:
    english: |-
      - **Edit** its reusable content and defaults;
      - **Move** it to a different position in the list;
      - **Hide** it from people starting votes; or
      - **Delete** a custom template that is no longer needed.
    translation: |-
      - לבחור **עריכה** כדי לשנות את התוכן ואת ברירות המחדל לשימוש חוזר;
      - לבחור **העבר** כדי לשנות את מיקומה ברשימה;
      - לבחור **להתחבא** כדי להסתיר אותה מאנשים שפותחים הצבעות; או
      - לבחור **מחיקה** כדי למחוק תבנית מותאמת אישית שכבר אינה נחוצה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3f6dc06b1fd2bce8:
    english: Select **Show hidden templates** to review or restore hidden templates. Default templates can be hidden or adapted for the group, but cannot be deleted.
    translation: יש לבחור **הצג תבניות מוסתרות** כדי לבדוק תבניות מוסתרות או להציג אותן שוב. אפשר להסתיר תבניות ברירת מחדל או להתאים אותן לקבוצה, אך אי אפשר למחוק אותן.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  be3ee2d2721d3e2a:
    english: Changing a template does not alter proposals or polls that have already been started from it.
    translation: שינוי תבנית אינו משנה הצעות או סקרים שכבר נפתחו באמצעותה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
