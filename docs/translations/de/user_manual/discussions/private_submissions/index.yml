---
navigation_title: Private Einreichungen sammeln
blocks:
  c4a53a596a037fc0:
    english: "# Collect private submissions"
    translation: "# Private Einreichungen sammeln"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b24abc6bf93b1c0f:
    english: Use a Closed group to collect private submissions from people who are not members of the group. Each submission becomes a separate discussion that the submitter and the group's review team can use to exchange information, ask questions, and record a decision. Submitters cannot see other private discussions or submissions in the group.
    translation: Nutze eine geschlossene Gruppe, um private Einreichungen von Personen zu sammeln, die keine Mitglieder der Gruppe sind. Jede Einreichung wird zu einer eigenen Diskussion. Dort können die einreichende Person und das Prüfungsteam der Gruppe Informationen austauschen, Fragen stellen und eine Entscheidung festhalten. Einreichende können andere private Diskussionen oder Einreichungen in der Gruppe nicht sehen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  feb5105698bca188:
    english: Nominations are a clear use case when candidate details or the list of nominees must remain private during selection. A person can nominate themselves or someone else for an election, appointment, committee, board, or representative role, while a selection panel reviews each nomination in its own discussion.
    translation: Nominierungen sind ein Beispiel, wenn Angaben zu Kandidatinnen und Kandidaten oder die Liste der Nominierten während der Auswahl privat bleiben müssen. Eine Person kann sich selbst oder jemand anderen für eine Wahl, Ernennung oder Rolle in einem Ausschuss, Vorstand oder als Vertretung nominieren. Ein Auswahlgremium prüft jede Nominierung in einer eigenen Diskussion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a64597508a4f7f3d:
    english: 'Other suitable purposes where submissions should not be public include:'
    translation: 'Weitere Fälle, in denen Einreichungen privat bleiben sollten, sind:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e4bd382899a8e7d9:
    english: |-
      - Complaints, safeguarding reports, safety concerns, and incident reports
      - Appeals and requests to reconsider a decision about an individual case
      - Requests for mediation, conflict resolution, or personal support
      - Applications containing personal, financial, or eligibility information, such as hardship grants or scholarships
      - Sealed bids or tender responses that must remain private during assessment
    translation: |-
      - Beschwerden, Meldungen zu Schutzmaßnahmen, Sicherheitsbedenken und Vorfallsberichte
      - Einsprüche und Anträge, eine Entscheidung in einem Einzelfall erneut zu prüfen
      - Anfragen zu Mediation, Konfliktlösung oder persönlicher Unterstützung
      - Anträge mit persönlichen, finanziellen oder anspruchsrelevanten Angaben, etwa für finanzielle Hilfen oder Stipendien
      - Vertrauliche Angebote oder Antworten auf Ausschreibungen, die während der Prüfung privat bleiben müssen
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bab86da011a22a2a:
    english: This workflow is private between submitters, but it is not anonymous. Submitters need a user account, and every member of the Closed group can see the submissions. Consider who belongs to the review group before using it for sensitive information.
    translation: Die Einreichungen bleiben untereinander privat, sind aber nicht anonym. Einreichende benötigen ein Benutzerkonto, und jedes Mitglied der geschlossenen Gruppe kann alle Einreichungen sehen. Überlege vor der Nutzung für sensible Informationen, wer Mitglied der Prüfgruppe sein soll.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b82ae8f3f04d257f:
    english: "## Enable private submissions"
    translation: "## Private Einreichungen ermöglichen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0cebe3c5801844ce:
    english: You must be an admin of the group or subgroup where you want to collect submissions.
    translation: Du musst Admin der Gruppe oder Untergruppe sein, in der du Einreichungen sammeln möchtest.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  831d833d53a12ece:
    english: |-
      1. Open the group.
      2. Select **Settings** (or **More** and then **Edit group settings**).
      3. Open **Permissions**.
      4. Enable **Non-members can start discussions**.
      5. Save the group settings.
    translation: |-
      1. Öffne die Gruppe.
      2. Wähle **Einstellungen** (oder **Mehr** und dann **Gruppeneinstellungen bearbeiten**).
      3. Öffne **Berechtigungen**.
      4. Aktiviere **Nichtmitglieder können Diskussionen starten**.
      5. Speichere die Gruppeneinstellungen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f3962a27b1c4ffa8:
    english: "![The Permissions tab in group settings, with Non-members can start discussions highlighted](non_members_can_start_discussions.png)"
    translation: "![Der Tab „Berechtigungen“ in den Gruppeneinstellungen mit hervorgehobener Option „Nichtmitglieder können Diskussionen starten“](non_members_can_start_discussions.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  99ace15d10e78f33:
    english: This option is available only for **Open** and **Closed** groups. It is hidden for **Secret** groups. If you cannot see it, open **Privacy** in the group settings and change **Group privacy** to **Closed** (recommended for private submissions) or **Open**, then return to **Permissions**.
    translation: Diese Option gibt es nur für **Offen**e und **Geschlossen**e Gruppen. Bei **Geheim**en Gruppen wird sie nicht angezeigt. Wenn du sie nicht siehst, öffne **Datenschutz** in den Gruppeneinstellungen und ändere **Gruppensichtbarkeit** auf **Geschlossen** (für private Einreichungen empfohlen) oder **Offen**. Kehre dann zu **Berechtigungen** zurück.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  449517e6293a3acc:
    english: Enabling this permission does not make the group's discussions public. A non-member can start a new discussion and access that discussion as a guest, but cannot see the group's other private discussions.
    translation: Durch diese Berechtigung werden die Diskussionen der Gruppe nicht öffentlich. Ein Nichtmitglied kann eine neue Diskussion starten und als Gast darauf zugreifen. Andere private Diskussionen der Gruppe kann es nicht sehen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  151f68a3f638fb67:
    english: "## Set up a private submission process"
    translation: "## Einen Prozess für private Einreichungen einrichten"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ae924433d81f5eac:
    english: |-
      1. Create a dedicated subgroup for the submission process and set its privacy to **Closed**. A subgroup keeps the submissions separate from the parent group's other work.
      2. Add the selection panel or other people responsible for reviewing submissions as members of the subgroup. Every subgroup member can see every submission, so add only people who should have that access.
      3. Create a [discussion template](/en/user_manual/discussions/templates) in the subgroup. Include the questions and information submitters should provide. You can create different discussion templates for different kinds of submissions.
      4. If submitters should not request subgroup membership, set membership to **Invitation only**.
      5. [Enable private submissions](#enable-private-submissions) in the subgroup's permissions.
      6. Test the process with an account that is not a member of the subgroup.
      7. Share the subgroup page with prospective submitters. They must sign in to their user account before making a submission.
    translation: |-
      1. Erstelle eine eigene Untergruppe für die Einreichungen und stelle ihre Sichtbarkeit auf **Geschlossen**. So bleiben die Einreichungen von der übrigen Arbeit der übergeordneten Gruppe getrennt.
      2. Füge das Auswahlgremium oder andere für die Prüfung zuständige Personen als Mitglieder der Untergruppe hinzu. Jedes Mitglied der Untergruppe kann alle Einreichungen sehen. Füge daher nur Personen hinzu, die diesen Zugriff benötigen.
      3. Erstelle in der Untergruppe eine [Diskussionsvorlage](/en/user_manual/discussions/templates). Nimm die Fragen und Angaben auf, die Einreichende beantworten oder bereitstellen sollen. Für verschiedene Arten von Einreichungen kannst du unterschiedliche Diskussionsvorlagen erstellen.
      4. Wenn Einreichende keine Mitgliedschaft in der Untergruppe beantragen sollen, stelle die Mitgliedschaft auf **Nur auf Einladung**.
      5. [Ermögliche private Einreichungen](#enable-private-submissions) in den Berechtigungen der Untergruppe.
      6. Teste den Ablauf mit einem Konto, das kein Mitglied der Untergruppe ist.
      7. Teile die Seite der Untergruppe mit Personen, die etwas einreichen möchten. Vor der Einreichung müssen sie sich bei ihrem Benutzerkonto anmelden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3acec1b4a6724a65:
    english: "## Make a submission"
    translation: "## Etwas einreichen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  58f96f48b6aacf65:
    english: The submitter opens the subgroup and selects **Start discussion**. Loomio shows the subgroup's available discussion templates. The submitter selects the relevant discussion template, completes its questions, and starts the discussion.
    translation: Die einreichende Person öffnet die Untergruppe und wählt **Diskussion starten**. Loomio zeigt die verfügbaren Diskussionsvorlagen der Untergruppe an. Die Person wählt die passende Vorlage, beantwortet die Fragen und startet die Diskussion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5a65043771edeb44:
    english: The discussion belongs to the subgroup, but the submitter does not become a subgroup member. Loomio adds them as a guest of their discussion thread, enabling them to see and participate in the discussion with the panel or review team. They cannot see other private discussions or submissions in the subgroup.
    translation: Die Diskussion gehört zur Untergruppe, aber die einreichende Person wird kein Mitglied der Untergruppe. Loomio fügt sie als Gast ihres Diskussionsthreads hinzu. So kann sie die Diskussion sehen und sich mit dem Gremium oder Prüfungsteam daran beteiligen. Andere private Diskussionen oder Einreichungen in der Untergruppe kann sie nicht sehen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9338fd073b26dafc:
    english: "## Review submissions"
    translation: "## Einreichungen prüfen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  50e33fa0f0868cf5:
    english: Subgroup members can see every submission discussion in the subgroup. They can ask follow-up questions and use comments, polls, or other discussion tools to complete their review.
    translation: Mitglieder der Untergruppe können jede Diskussion zu einer Einreichung in der Untergruppe sehen. Sie können Rückfragen stellen und Kommentare, Umfragen oder andere Diskussionswerkzeuge für ihre Prüfung nutzen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  537b76c6f85cc575:
    english: If another person needs to provide information, a subgroup member with permission can invite them to the submission discussion. For example, when a nominator submits a nomination, the subgroup can invite the nominee to the thread if their participation is required. The invited person joins as a guest without gaining access to the subgroup's other private discussions.
    translation: Wenn eine weitere Person Informationen beitragen soll, kann ein Mitglied der Untergruppe sie mit der entsprechenden Berechtigung zur Diskussion über die Einreichung einladen. Reicht beispielsweise jemand eine Nominierung ein, kann die Untergruppe die nominierte Person zum Thread einladen, falls ihre Beteiligung erforderlich ist. Die eingeladene Person nimmt als Gast teil und erhält keinen Zugriff auf andere private Diskussionen der Untergruppe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1fb7da309186b19e:
    english: Each submitter can see their own submission but cannot see the subgroup's other private discussions or submissions. Disable **Non-members can start discussions** when submissions close. Existing discussions and guest access are unchanged.
    translation: Einreichende können ihre eigene Einreichung sehen, aber keine anderen privaten Diskussionen oder Einreichungen der Untergruppe. Deaktiviere **Nichtmitglieder können Diskussionen starten**, wenn keine weiteren Einreichungen angenommen werden. Bestehende Diskussionen und Gastzugriffe bleiben unverändert.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
