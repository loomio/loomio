  3cc3304a15bc3d2f:
    english: In the Consent process, an objection is defined as something that **might cause harm to the team or organization**.
    translation: Dans le processus de consentement, une objection désigne un élément qui **pourrait nuire à l’équipe ou à l’organisation**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ab509ea088e16a0d:
    english: |-
      Objections should meet this criteria to be valid:
      - Explicit: *I can make a reasoned case*
      - Impersonal: *It's not just a personal preference*
      - Evidenced: *Not predictive, based on experience*
      - Not 'safe to fail': *It's not that I have a 'better idea'*
    translation: |-
      Pour être valables, les objections doivent répondre aux critères suivants :
      - Explicites : *Je peux présenter des arguments raisonnés*
      - Impersonnelles : *Il ne s’agit pas seulement d’une préférence personnelle*
      - Fondées sur des faits : *Elles reposent sur l’expérience, pas sur des prévisions*
      - Elles signalent un risque réel : *Il ne s’agit pas simplement d’avoir une « meilleure idée »*
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
