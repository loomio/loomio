  '099449b0e1fe4f85':
    english: Loomio also includes a Question round for collecting questions without voting. Group administrators can make it available from [Poll templates](/en/user_manual/polls/poll_templates/).
    translation: Loomio include anche un giro di domande per raccogliere domande senza votare. Gli amministratori del gruppo possono renderlo disponibile dai [Modelli di sondaggio](/en/user_manual/polls/poll_templates/).
