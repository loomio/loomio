  f3106c22cd3d4059:
    english: 'Loomio can send notifications into your Matrix channels when new discussions, proposals, comments, votes, and outcomes occur. '
    translation: Loomio kann Benachrichtigungen an deine Matrix-Räume senden, wenn neue Diskussionen, Vorschläge, Kommentare, Stimmen und Fazits hinzukommen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a20cf2be00dac0ce:
    english: Matrix is nice because it allows some HTML in the chatroom, and Loomio takes advantage of this.
    translation: Matrix unterstützt HTML im Chatraum. Loomio nutzt das für die Benachrichtigungen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ffe12502f0030fec:
    english: Our Matrix integration is a little different to our other chat integrations - it does not use a webhook - we've built a custom bot client for this one.
    translation: 'Die Matrix-Integration funktioniert anders als unsere anderen Chat-Integrationen: Sie verwendet keinen Webhook, sondern einen eigens dafür entwickelten Bot-Client.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  44db147f65127a55:
    english: You will need to create a matrix user for the bot to login as.
    translation: Erstelle einen Matrix-Benutzer, mit dem sich der Bot anmelden kann.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  98045e5bf1339543:
    english: Once you've created a user for the bot, sign in at that user to obtain the following information.
    translation: Melde dich nach dem Erstellen mit diesem Benutzerkonto an, um die folgenden Angaben zu finden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
