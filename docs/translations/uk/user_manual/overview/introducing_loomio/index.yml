---
navigation_title: Знайомство вашої групи з Loomio
blocks:
  6c777a62b2b77732:
    english: "# Introducing Loomio to your group"
    translation: "# Знайомство вашої групи з Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  438cc622ae730bd8:
    english: Introduce Loomio through one useful piece of work. Prepare the group before inviting people, help everyone participate once, and complete the process through to an outcome.
    translation: Почніть знайомство з Loomio з одного корисного завдання. Підготуйте групу, перш ніж запрошувати людей, допоможіть кожному взяти участь і доведіть процес до висновку.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9c9fa4e8f6e208e4:
    english: "## Choose one useful starting point"
    translation: "## Виберіть одне корисне завдання для початку"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3353fb04e83837e5:
    english: Start with a real process that your group already needs. A good first use is small enough to complete soon, but relevant enough that people have a reason to participate.
    translation: Почніть із реального процесу, який уже потрібен вашій групі. Для першого разу виберіть завдання, яке можна завершити незабаром і яке достатньо важливе, щоб люди захотіли взяти участь.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  652744a2ab28954b:
    english: 'For example:'
    translation: 'Наприклад:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  19bc6c09eeea816e:
    english: |-
      - prepare the agenda for an upcoming meeting;
      - review and approve meeting minutes;
      - gather feedback on a draft document;
      - decide a small operational question; or
      - identify priorities for the next month.
    translation: |-
      - підготуйте порядок денний наступної зустрічі;
      - перегляньте й затвердьте протокол зустрічі;
      - зберіть відгуки про чернетку документа;
      - вирішіть невелике організаційне питання; або
      - визначте пріоритети на наступний місяць.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  68a0d6b76f36ebaf:
    english: Avoid moving every discussion and decision into Loomio at once. A repeatable process gives the group a clear reason to return and lets you improve the way you run it each time.
    translation: Не переносіть усі обговорення й рішення до Loomio одночасно. Процес, який можна повторювати, дає групі зрозумілу причину повертатися й змогу щоразу покращувати його.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4b65243ef120921b:
    english: "## Prepare the group before inviting people"
    translation: "## Підготуйте групу, перш ніж запрошувати людей"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  305b29c1c832c246:
    english: 'Give people a useful and recognizable place to arrive in:'
    translation: 'Підготуйте корисний і впізнаваний простір для людей:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  76d859d168805706:
    english: |-
      - add the group's name, logo, cover image, purpose, and important links;
      - check the group's privacy and permissions;
      - add any [category tags](/en/user_manual/discussions/tags) the group will use regularly;
      - create the first real discussion, with the background information people need; and
      - create a practice discussion if members would benefit from trying comments, reactions, and voting without consequences.
    translation: |-
      - додайте назву групи, логотип, зображення обкладинки, мету й важливі посилання;
      - перевірте налаштування приватності та дозволів групи;
      - додайте [мітки категорій](/en/user_manual/discussions/tags), які група регулярно використовуватиме;
      - створіть перше справжнє обговорення й додайте інформацію, потрібну для участі; і
      - створіть пробне обговорення, якщо учасникам буде корисно спробувати коментарі, реакції та голосування без наслідків.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f1decb57ec9d48cb:
    english: Use your own photo in your profile and the organization's logo for the group. This helps people recognize who invited them and which organization an email is about.
    translation: Додайте власне фото до профілю, а логотип організації — до групи. Так людям буде легше впізнати, хто їх запросив і якої організації стосується лист.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '01965093f234bb36':
    english: "## Decide where work belongs"
    translation: "## Визначте, де виконувати різні завдання"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7fbd0d770cbed2bd:
    english: 'Loomio can sit alongside tools your group already uses:'
    translation: 'Loomio можна використовувати разом з інструментами, які вже є у вашої групи:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '0168271b154f6931':
    english: |-
      | Use | Good place for it |
      |---|---|
      | Quick questions, social conversation, and timely updates | Chat, such as Slack, Teams, Matrix, or Discord |
      | Collaborative editing of a living document | A shared document tool |
      | Assigning work and tracking its completion | A task or project-management tool |
      | A focused discussion, broad participation, a decision, and its lasting record | Loomio |
    translation: |-
      | Завдання | Відповідний інструмент |
      |---|---|
      | Короткі запитання, неформальне спілкування й термінові новини | Чат, наприклад Slack, Teams, Matrix або Discord |
      | Спільне редагування документа, який постійно оновлюється | Інструмент для спільної роботи з документами |
      | Розподіл завдань і відстеження їх виконання | Інструмент для керування завданнями або проєктами |
      | Зосереджене обговорення, широка участь, рішення та його постійний запис | Loomio |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  50fae2027411e538:
    english: Link to documents and other systems from the group description or discussion context. Use [chat integrations](/en/user_manual/integrations/chatbots) to bring important Loomio activity into a channel people already follow.
    translation: Додавайте посилання на документи й інші системи в опис групи або до обговорення. Використовуйте [інтеграції з чатами](/en/user_manual/integrations/chatbots), щоб важливі події в Loomio з’являлися в каналі, за яким люди вже стежать.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ed67af54bdf1c775:
    english: Tell members what you expect to happen in Loomio. A simple boundary such as “important discussions and decisions go in Loomio; quick coordination stays in chat” is easier to adopt than an unexplained new tool.
    translation: Поясніть учасникам, для чого ви використовуватимете Loomio. Просте правило на кшталт «важливі обговорення й рішення — у Loomio, швидка координація — у чаті» легше засвоїти, ніж призначення нового інструмента без пояснення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0a799d7911a46f6f:
    english: "## Decide how your group decides"
    translation: "## Визначте, як ваша група ухвалює рішення"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e1c64de2dc68593:
    english: Loomio does not require every group, or every decision, to use the same process. Some groups arrive with established rules. Others use Loomio while they develop a clearer decision-making practice together.
    translation: Loomio не вимагає, щоб усі групи або всі рішення проходили за однаковим процесом. Деякі групи вже мають усталені правила. Інші використовують Loomio, поки разом виробляють чіткіший порядок ухвалення рішень.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6d0c0f50959ab9d6:
    english: "### If your process is already established"
    translation: "### Якщо у вас уже є усталений процес"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5fbfe86e935d5a8c:
    english: 'Translate the group''s existing requirements into Loomio. Before running a formal decision, make sure participants can tell:'
    translation: 'Відтворіть чинні вимоги вашої групи в Loomio. Перед формальним ухваленням рішення переконайтеся, що учасникам зрозуміло:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9a1b89bd4c5fe02c:
    english: |-
      - which kinds of decisions can be made in Loomio;
      - who provides input and who has authority to decide;
      - who is eligible to vote;
      - whether a [quorum](/en/user_manual/polls/quorum) is required;
      - whether the decision requires a majority, supermajority, unanimous agreement, consent, or another [vote share requirement](/en/user_manual/polls/vote_share_requirements);
      - whether the decision takes effect when its outcome is published or must be ratified elsewhere; and
      - who will record and carry out the outcome.
    translation: |-
      - які рішення можна ухвалювати в Loomio;
      - хто висловлює думку, а хто має повноваження ухвалювати рішення;
      - хто має право голосу;
      - чи потрібен [кворум](/en/user_manual/polls/quorum);
      - чи потрібна для рішення проста більшість, кваліфікована більшість, одностайна згода, відсутність заперечень або інша [необхідна частка голосів](/en/user_manual/polls/vote_share_requirements);
      - чи набуває рішення чинності після публікації висновку, чи його ще потрібно затвердити деінде; і
      - хто зафіксує та виконає висновок.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4b48b6e0aff5cfc0:
    english: If your constitution, bylaws, policy, or local law governs electronic decisions, make sure the Loomio process follows those requirements. Configure [delegated voters](/en/user_manual/groups/delegated_voters), proposal settings, and [poll templates](/en/user_manual/polls/poll_templates) to make the agreed process easy to repeat.
    translation: Якщо електронні рішення регулюються вашим статутом, внутрішніми правилами, політикою або місцевим законодавством, переконайтеся, що процес у Loomio відповідає цим вимогам. Налаштуйте [делегованих виборців](/en/user_manual/groups/delegated_voters), параметри пропозицій і [шаблони опитувань](/en/user_manual/polls/poll_templates), щоб узгоджений процес було легко повторювати.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b068624ed6c7c6b3:
    english: "### If your group is still deciding"
    translation: "### Якщо ваша група ще визначає процес"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  14449de544d28a6b:
    english: 'Start a discussion about how decisions should be made. Instead of beginning with a voting tool, ask the group to consider:'
    translation: 'Почніть обговорення того, як ухвалювати рішення. Перш ніж вибирати спосіб голосування, запропонуйте групі обміркувати:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f65b39a74ae25ed7:
    english: |-
      - What kinds of decisions do we make?
      - Who is affected, who should be consulted, and who is responsible for deciding?
      - Which decisions need advice, consent, consensus, a vote, or delegated authority?
      - What level of participation or support makes a decision valid?
      - How will we respond to objections, tied results, or insufficient participation?
      - How will we communicate, record, review, and change a decision?
    translation: |-
      - Які рішення ми ухвалюємо?
      - Кого вони стосуються, з ким слід порадитися і хто відповідає за ухвалення рішення?
      - Для яких рішень потрібні поради, відсутність заперечень, консенсус, голосування або делеговані повноваження?
      - Який рівень участі чи підтримки потрібен, щоб рішення було чинним?
      - Як ми реагуватимемо на заперечення, рівну кількість голосів або недостатню участь?
      - Як ми повідомлятимемо про рішення, фіксуватимемо, переглядатимемо й змінюватимемо їх?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ce7c0af2ad170b5c:
    english: The answers may be different for an operational decision, a policy, an election, and a constitutional change. See [Making decisions](/en/guides/making_decisions) to compare several complete processes.
    translation: Відповіді можуть різнитися для організаційного рішення, політики, виборів і зміни статуту. Порівняйте кілька повних процесів у посібнику [«Ухвалення рішень»](/en/guides/making_decisions).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  aac26fc96b90744d:
    english: If the group is not ready to settle every rule, agree on a provisional process for one low-risk decision. State what the result will mean before asking people to participate, publish an outcome, then review how the process worked. Record what the group learns in its description, governance documents, or reusable templates.
    translation: Якщо група ще не готова узгодити всі правила, домовтеся про тимчасовий процес для одного рішення з невеликим ризиком. Перш ніж запрошувати людей до участі, поясніть, що означатиме результат. Потім опублікуйте висновок і обговоріть, як пройшов процес. Зафіксуйте висновки групи в її описі, документах про управління або шаблонах для повторного використання.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  23ed8fb3e887afbc:
    english: "## Invite people"
    translation: "## Запросіть людей"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a5d369ad9df691fe:
    english: "[Invite people](/en/user_manual/groups/inviting_people) with a short personal message that explains:"
    translation: "[Запросіть людей](/en/user_manual/groups/inviting_people) коротким особистим повідомленням, у якому поясніть:"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3383207ff2fcc99b:
    english: |-
      - why the group is using Loomio;
      - what you are asking them to do first;
      - when you need their response; and
      - where they can get help.
    translation: |-
      - чому група використовує Loomio;
      - що ви просите їх зробити насамперед;
      - коли вам потрібна їхня відповідь; і
      - де вони можуть отримати допомогу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  282ef8673815823e:
    english: You can begin with a small group of people who will actively test the process, or invite the whole group when everyone needs to participate from the start. In either case, have a discussion ready for them rather than inviting people into an empty group.
    translation: Можете почати з невеликої групи людей, які активно випробують процес, або одразу запросити всю групу, якщо участь кожного потрібна від початку. У будь-якому разі підготуйте обговорення до їхнього приходу, щоб люди не потрапили до порожньої групи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cd6511a78ce7c9b7:
    english: "## Help everyone participate once"
    translation: "## Допоможіть кожному взяти участь уперше"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a37273687b4f4b0:
    english: The first objective is for each person to cross the threshold from receiving an invitation to contributing something.
    translation: Перша мета — допомогти кожній людині перейти від отримання запрошення до власного внеску.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ce285f27cca389c4:
    english: 'Ask people to:'
    translation: 'Попросіть людей:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d0b9e80af995edff:
    english: |-
      1. sign in and add a profile photo;
      2. open the welcome or practice discussion;
      3. post a short comment or reaction; and
      4. vote in a low-stakes proposal and, if useful, leave a reason.
    translation: |-
      1. увійти й додати фото профілю;
      2. відкрити вітальне або пробне обговорення;
      3. залишити короткий коментар чи реакцію; і
      4. проголосувати за пропозицію з невеликими наслідками та, за потреби, пояснити свою позицію.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  919e32e7adb7c4c8:
    english: Members do not need to create a password. They can [sign in by email](/en/user_manual/users/signing_in), and they can reply to eligible discussion emails without first navigating back to the thread.
    translation: Учасникам не потрібно створювати пароль. Вони можуть [увійти за допомогою електронної пошти](/en/user_manual/users/signing_in) і відповідати на відповідні листи з обговорень, не відкриваючи спершу тему в Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  22ceb7104d416acf:
    english: "## Use notifications deliberately"
    translation: "## Використовуйте сповіщення обдумано"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dd99e6dd5c93d9ee:
    english: Access to content and notification about it are separate. Group members can find discussions in their group even when they were not notified immediately.
    translation: Доступ до матеріалів і сповіщення про них — різні речі. Учасники групи можуть знайти обговорення у своїй групі, навіть якщо не отримали сповіщення одразу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0e20732d957eb282:
    english: When starting a discussion, notify the people whose input is needed at that stage. Use @mentions and replies when asking particular people to respond. When voting opens later, invite the eligible voters.
    translation: Коли починаєте обговорення, сповістіть людей, чия думка потрібна на цьому етапі. Використовуйте @згадки й відповіді, коли звертаєтеся до конкретних людей. Коли згодом відкриється голосування, запросіть тих, хто має право голосу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  43339ff0f3d30a50:
    english: If you create a discussion and poll together only to capture a vote, avoid sending a discussion invitation immediately followed by a poll invitation. Either start the discussion without notifying people and invite them through the poll, or run a [standalone poll](/en/user_manual/polls/intro_to_decisions#without-a-discussion).
    translation: Якщо ви створюєте обговорення й опитування разом лише для збору голосів, не надсилайте запрошення до обговорення одразу перед запрошенням до опитування. Почніть обговорення без сповіщення й запросіть людей через опитування або проведіть [окреме опитування](/en/user_manual/polls/intro_to_decisions#without-a-discussion).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  467cf9d1e5bd2973:
    english: Show members the [Catch-up and notification settings](/en/user_manual/users/email_settings), especially if they do not expect to visit Loomio every day.
    translation: Покажіть учасникам [налаштування зведень і сповіщень](/en/user_manual/users/email_settings), особливо якщо вони не планують заходити в Loomio щодня.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ebe7764d64b17823:
    english: "## Complete the first process"
    translation: "## Завершіть перший процес"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9a165c59ba0aed5a:
    english: 'A first process should demonstrate the complete pattern:'
    translation: 'Перший процес має охопити всі основні кроки:'
    status: machine
    provider: codex/gpt-6-sol
