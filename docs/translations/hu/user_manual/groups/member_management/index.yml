  f9901909d4cd86e0:
    english: If you are an admin, you can manage members from the **Members** tab on your group page.
    translation: Ha adminisztrátor vagy, a csoportod oldalán, a **Tagok** lapon kezelheted a tagokat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d25e71106f726cac:
    english: Click on the three dots (**⋮**) to the right of the group member to set their title, make them an admin, make them a delegate, or remove them from the group.
    translation: Kattints a csoporttag neve mellett jobbra lévő három pontra (**⋮**). Itt megadhatod a címét, adminisztrátorrá vagy delegálttá teheted, illetve eltávolíthatod a csoportból.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  db5a08225152e80a:
    english: "![Member actions menu on the Oatmilk Cooperative members page](member_management.png)"
    translation: "![Tagok műveleteinek menüje az Oatmilk Cooperative tagjainak oldalán](member_management.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0f29eb85fabc200d:
    english: |-
      ## Administering your group
      There are only two user types in a Loomio group: **member** and **admin**.
    translation: |-
      ## A csoport adminisztrálása
      Egy Loomio-csoportban kétféle felhasználó van: **tag** és **adminisztrátor**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4317e6fcbbedcdaa:
    english: 'Admins perform administrative tasks for your group, including: adding and removing members, managing member permissions, setting the group privacy levels, and managing the subscription plans.  In addition, admins are able to see the email addresses of members and export the group''s data.'
    translation: Az adminisztrátorok tagokat adhatnak hozzá és távolíthatnak el, kezelhetik a tagok jogosultságait, beállíthatják a csoport láthatóságát, és kezelhetik az előfizetéseket. Emellett láthatják a tagok e-mail-címét, és exportálhatják a csoport adatait.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7de2ea0e85a19d0a:
    english: The person creating a new Loomio group is made admin by default. We recommend to make at least one other trusted person in your group an admin, to insure someone can always administer your group. You can have as many admins in your group as you wish.
    translation: Az új Loomio-csoport létrehozója alapértelmezés szerint adminisztrátor lesz. Érdemes legalább egy másik megbízható tagot is adminisztrátorrá tenni, hogy mindig legyen, aki kezelni tudja a csoportot. A csoportnak tetszőleges számú adminisztrátora lehet.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ac9e3bb2da56869e:
    english: To make a member **admin**, go to the Members tab, find the member and click on the three dots (**⋮**) next to their name. Choose **Make admin**. An `Admin` tag will appear beside their name.
    translation: Ha egy tagot **adminisztrátorrá** szeretnél tenni, nyisd meg a Tagok lapot, keresd meg a tagot, és kattints a neve melletti három pontra (**⋮**). Válaszd az **Adminisztrátor jogok megadása** lehetőséget. A neve mellett megjelenik az `Admin` címke.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b93c8eaf5367f572:
    english: "![Make admin action in a member's menu](member_make_admin.png)"
    translation: "![Adminisztrátor jogok megadása a tag menüjében](member_make_admin.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f6d7a993e2d32771:
    english: |-
      ## Managing subgroups
      If you are the admin of a parent group, or organization, you have additional permissions with regards to any __closed__ subgroups.
    translation: |-
      ## Alcsoportok kezelése
      Ha egy szülőcsoport vagy szervezet adminisztrátora vagy, további jogosultságaid vannak a __zárt__ alcsoportokban.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cd781594b26ae052:
    english: You will be able to join any closed subgroup by clicking the "Join Group" button on the left of the Subgroup page in question (just under the tabs).
    translation: Bármelyik zárt alcsoporthoz csatlakozhatsz, ha az alcsoport oldalának bal oldalán, közvetlenül a lapok alatt a „Kapcsolódj a csoporthoz” gombra kattintasz.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ba630e95409473a5:
    english: "![Join group button on a closed Oatmilk Cooperative subgroup](member_join_subgroup.png)"
    translation: "![Csatlakozás gomb az Oatmilk Cooperative egyik zárt alcsoportjában](member_join_subgroup.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  87c2d0e0fa784cff:
    english: Once you have joined the subgroup, you will also be able to make yourself the admin of that subgroup, just as you would promote anyone to admin.
    translation: Miután csatlakoztál az alcsoporthoz, saját magadat is adminisztrátorrá teheted, ugyanúgy, mint bármelyik másik tagot.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e439992d86591319:
    english: |-
      >[!Note]
      >These permissions do not extend to [**secret** subgroups](/en/user_manual/groups/subgroups/?highlight=secret#permissions).
    translation: |-
      >[!Note]
      >Ezek a jogosultságok nem terjednek ki a [**titkos** alcsoportokra](/en/user_manual/groups/subgroups/?highlight=secret#permissions).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  31a8fbe10f50c1a0:
    english: |-
      ## Removing members
      When you click **Remove from group** you'll be asked to confirm the removal. Upon removal, this user will no longer have access to the group's pages, threads, polls, or proposals. They will receive no further emails or notifications of group activity. However, any comments and votes written by the user will remain untouched.
    translation: |-
      ## Tagok eltávolítása
      Ha az **Eltávolítás a csoportból** lehetőségre kattintasz, meg kell erősítened az eltávolítást. Az eltávolított tag többé nem fér hozzá a csoport oldalaihoz, témáihoz, szavazásaihoz és javaslataihoz. Nem kap több e-mailt vagy értesítést a csoport tevékenységéről. A hozzászólásai és szavazatai megmaradnak.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8bf29fce0f0d8e9b:
    english: "![Remove from group action in a member's menu](member_remove.png)"
    translation: "![Eltávolítás a csoportból a tag menüjében](member_remove.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  aa3b173ffd048b99:
    english: You can add removed members back to the group later if you wish.
    translation: Az eltávolított tagokat később újra hozzáadhatod a csoporthoz.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6ef7d0422c66d652:
    english: |-
      ## Leaving group
      To leave a group: go to the group page, open the 3 dot menu, and click **Leave group**.
    translation: |-
      ## Kilépés a csoportból
      Ha ki szeretnél lépni egy csoportból, nyisd meg a csoport oldalát, majd a hárompontos menüben kattints a **Kilépés a csoportból** lehetőségre.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5395b374b5814162:
    english: "![Leave group action in the Oatmilk Cooperative settings menu](member_leave_group.png)"
    translation: "![Kilépés a csoportból az Oatmilk Cooperative beállításainak menüjében](member_leave_group.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d926fc8d1e3cbac2:
    english: |-
      ## Set title
      Within the Members tab, you can also name your role within the group, or identify an organization you represent using **title**. You or a group admin can change your title with **Set title** from the 3 dot menu near your name.
    translation: |-
      ## Cím megadása
      A Tagok lapon a **cím** segítségével megadhatod a csoportban betöltött szerepedet vagy az általad képviselt szervezetet. A neved melletti hárompontos menü **Cím megadása** lehetőségével te vagy a csoport egyik adminisztrátora módosíthatja a címedet.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2425e4d5b1e8047d:
    english: "![Set title action in a member's menu](member_set_title.png)"
    translation: "![Cím megadása a tag menüjében](member_set_title.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6af456317883a890:
    english: You can have different titles in different subgroups.
    translation: A különböző alcsoportokban eltérő címed lehet.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2d59cb70493e06b1:
    english: "## Member email addresses"
    translation: "## Tagok e-mail-címei"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cee3a1e0e1031377:
    english: Only admins can see group member email addresses.  This is sometimes necessary to audit the members in a group.
    translation: A csoporttagok e-mail-címét csak az adminisztrátorok láthatják. Erre időnként szükség van a csoport tagságának ellenőrzéséhez.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4ff1112b058a3205:
    english: 'To see member email addresses: Use [data export](/en/user_manual/groups/data_export/) to download a CSV file, and open the file in Excel or Google sheets.'
    translation: A tagok e-mail-címeinek megtekintéséhez tölts le egy CSV-fájlt az [adatexportálással](/en/user_manual/groups/data_export/), majd nyisd meg Excelben vagy Google Táblázatokban.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  105be57911f832fc:
    english: The export group data file shows every person and their email address in every subgroup.
    translation: Az exportált csoportadatokat tartalmazó fájl minden alcsoport összes tagját és e-mail-címét megmutatja.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  20f87bcff4ec41e6:
    english: You can also search for members by email address in the members tab. So if you see someone you want to remove, you can search by email to remove them.
    translation: A Tagok lapon e-mail-cím alapján is kereshetsz. Ha el szeretnél távolítani valakit, az e-mail-címével megkeresheted.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
