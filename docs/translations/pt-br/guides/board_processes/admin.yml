    translated_on: '2026-09-30'
  e4617bf502879b0d:
    english: 'Increasingly, electronic records are supplanting the requirement for paper.  '
    translation: Cada vez mais, os registros eletrônicos substituem os registros em papel.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e1d587f71cdcc6c1:
    english: 'However digital tools enable your board to do much more than just file meeting minutes.  '
    translation: As ferramentas digitais também permitem que seu conselho faça muito mais do que arquivar atas de reuniões.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
