navigation_title: Bejelentkezés
blocks:
  7d0aa091e06fa112:
    english: "# Signing in"
    translation: "# Bejelentkezés"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3bede807c136909b:
    english: On Loomio.com, you can sign in with a passkey, your email and password, an emailed sign-in code, or Google. You can choose whichever available method is most convenient for you.
    translation: A Loomio.com oldalon passkeyjel, e-mail-címmel és jelszóval, e-mailben kapott bejelentkezési kóddal vagy Google-fiókkal jelentkezhetsz be. Válaszd a számodra legkényelmesebb elérhető módot.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2bc2277a8ee0508d:
    english: "![The Loomio sign-in form with passkey, email, password, and emailed-code options](sign_in_email.png)"
    translation: "![A Loomio bejelentkezési űrlapja passkey, e-mail-cím, jelszó és e-mailben küldött kód lehetőségével](sign_in_email.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e3daf63d410d5513:
    english: "## Sign in with a passkey"
    translation: "## Bejelentkezés passkeyjel"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5c82bc1e8baa9f0b:
    english: Select **Use a passkey**. Your browser or device shows the Loomio passkeys available to you and asks you to unlock the selected passkey with its normal screen lock, fingerprint, face recognition, PIN, or security key. You do not enter an email address first.
    translation: Válaszd a **Használjon jelszót** lehetőséget. A böngésződ vagy az eszközöd megmutatja az elérhető Loomio-passkeyeket. A kiválasztott passkey feloldásához a megszokott képernyőzárat, ujjlenyomatot, arcfelismerést, PIN-kódot vagy biztonsági kulcsot kéri. Előtte nem kell megadnod az e-mail-címedet.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9386303ee98cb592:
    english: You can add, name, and remove passkeys from your profile. For security, Loomio may ask you to sign in again before changing them. Give each passkey a recognizable name such as “Work laptop” or “Phone”. Passkeys are tied to the Loomio site where they were created and may be synchronized by your device or password manager.
    translation: A profilodban hozzáadhatsz, elnevezhetsz és eltávolíthatsz passkeyeket. Biztonsági okból a Loomio kérheti, hogy a módosításuk előtt jelentkezz be újra. Adj mindegyiknek könnyen felismerhető nevet, például „Munkahelyi laptop” vagy „Telefon”. A passkeyek ahhoz a Loomio-oldalhoz tartoznak, amelyen létrehoztad őket. Az eszközöd vagy a jelszókezelőd szinkronizálhatja őket.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5f10999e671f9b56:
    english: "## Sign in with email and password"
    translation: "## Bejelentkezés e-mail-címmel és jelszóval"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5c8a380df0b08c86:
    english: Enter your email address and password, then select **Sign in**. For account privacy, Loomio uses the same error when the email or password cannot be used to sign in.
    translation: Add meg az e-mail-címedet és a jelszavadat, majd válaszd a **Bejelentkezés** lehetőséget. A fiókok védelme érdekében a Loomio ugyanazt a hibaüzenetet jeleníti meg, ha az e-mail-címmel vagy a jelszóval nem lehet bejelentkezni.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  63c19e6f58a1de53:
    english: If you have not added a passkey, Loomio offers to add one after you sign in with a password. You can dismiss the offer, and Loomio will remember your choice.
    translation: Ha még nem adtál hozzá passkeyt, a Loomio a jelszavas bejelentkezés után felajánlja ezt. Elutasíthatod az ajánlatot; a Loomio megjegyzi a döntésedet.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dde79982546607b4:
    english: If you do not have a password or cannot remember it, select **Send me a code** instead.
    translation: Ha nincs jelszavad, vagy nem emlékszel rá, válaszd inkább a **Küldj nekem egy kódot** lehetőséget.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5f3c6f8eca20d49c:
    english: "## Get a sign-in code"
    translation: "## Bejelentkezési kód kérése"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9713c017e247d8e2:
    english: Select **Send me a code**, enter your email address, and submit the form. Loomio displays the same confirmation whether or not the address belongs to an account, so another person cannot use the form to discover who uses Loomio.
    translation: Válaszd a **Küldj nekem egy kódot** lehetőséget, add meg az e-mail-címedet, majd küldd el az űrlapot. A Loomio ugyanazt a megerősítést jeleníti meg akkor is, ha a címhez nem tartozik fiók. Így mások nem tudhatják meg az űrlap segítségével, hogy ki használja a Loomiót.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  546aaa95b133da11:
    english: If the address belongs to your account, Loomio sends a six-digit code. Return to the sign-in form, enter the code, and select **Sign in**. Sign-in codes normally expire after 24 hours and cannot be reused. Check your spam folder if the message does not arrive, and make sure you entered the address associated with your account.
    translation: Ha a cím a fiókodhoz tartozik, a Loomio hatjegyű kódot küld. Térj vissza a bejelentkezési űrlaphoz, írd be a kódot, majd válaszd a **Bejelentkezés** lehetőséget. A bejelentkezési kódok általában 24 óra után lejárnak, és csak egyszer használhatók. Ha nem érkezik meg az üzenet, nézd meg a levélszemét mappát, és ellenőrizd, hogy a fiókodhoz tartozó e-mail-címet adtad-e meg.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  26171d5996050130:
    english: "![The Loomio form for entering a six-digit sign-in code](sign_in_code.png)"
    translation: "![A Loomio űrlapja a hatjegyű bejelentkezési kód megadásához](sign_in_code.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '087809317d00494a':
    english: After each sign-in with a code, Loomio offers to set or replace your password. If your browser supports passkeys, you can also add one, even if you have already added a passkey on another device. A passkey lets you sign in quickly with your device’s fingerprint, face, or screen lock. You can skip the offer and continue using emailed codes.
    translation: Minden kódos bejelentkezés után a Loomio felajánlja, hogy állíts be vagy cserélj le egy jelszót. Ha a böngésződ támogatja a passkeyeket, hozzáadhatsz egyet akkor is, ha egy másik eszközön már hozzáadtál egyet. A passkey segítségével gyorsan bejelentkezhetsz az eszközöd ujjlenyomat-olvasójával, arcfelismerésével vagy képernyőzárával. Kihagyhatod az ajánlatot, és továbbra is használhatsz e-mailben küldött kódokat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fa960675e8369daf:
    english: "## Create an account"
    translation: "## Fiók létrehozása"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  75fc0885f772c8cf:
    english: Select **Create account** and follow the email-verification steps.
    translation: Válaszd a **Fiók létrehozása** lehetőséget, és kövesd az e-mail-cím megerősítésének lépéseit.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aa461253943b989a:
    english: For privacy, use the same email address that received your group invitation. If you have accounts under more than one address, you can [merge your accounts](/en/user_manual/users/merge_accounts).
    translation: A személyes adataid védelme érdekében azt az e-mail-címet használd, amelyre a csoportmeghívót kaptad. Ha több e-mail-címmel is van fiókod, [egyesítheted a fiókjaidat](/en/user_manual/users/merge_accounts).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d9844ac27d806c35:
    english: "## Sign in with Google"
    translation: "## Bejelentkezés Google-fiókkal"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8445cfcb9e9ecef5:
    english: Select **Sign in with Google** and authenticate with your Google account. If an existing Loomio account has the same email address, Loomio links the Google identity to that account.
    translation: Válaszd a **Bejelentkezés Google-fiókkal** lehetőséget, és jelentkezz be a Google-fiókoddal. Ha már létezik Loomio-fiók ugyanazzal az e-mail-címmel, a Loomio összekapcsolja vele a Google-azonosítódat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  46281cafc4a889bf:
    english: "## Other Loomio sites"
    translation: "## Más Loomio-oldalak"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  23c2dffa5d5056e2:
    english: Organizations that host their own Loomio site can configure different sign-in methods. A site may offer passwords, emailed codes, passkeys, Google, SAML, or another OAuth provider alongside each other.
    translation: A saját Loomio-oldalt üzemeltető szervezetek különböző bejelentkezési módokat állíthatnak be. Egy oldalon egyszerre is elérhető lehet a jelszavas, az e-mailben küldött kódos, a passkeyes, a Google-fiókos, a SAML-alapú vagy más OAuth-szolgáltatón keresztüli bejelentkezés.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3de129c7bac50409:
    english: Some sites require an invitation before you can create an account. On these sites, **Create account** appears only when you follow an invitation link.
    translation: Egyes oldalakon csak meghívóval hozhatsz létre fiókot. Ezeken az oldalakon a **Fiók létrehozása** lehetőség csak akkor jelenik meg, ha meghívólinket követsz.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  16004d08bcad640b:
    english: An SSO-only private site shows only its organization sign-in option. It does not offer Loomio-managed passwords, emailed sign-in codes, native account creation, or Loomio-managed passkeys. If the organization uses passkeys, its identity provider asks for them during SSO.
    translation: A kizárólag egyszeri bejelentkezést (SSO) használó privát oldal csak a szervezet bejelentkezési lehetőségét mutatja. Nem kínál Loomio által kezelt jelszavakat vagy passkeyeket, e-mailben küldött bejelentkezési kódokat, illetve közvetlen fióklétrehozást. Ha a szervezet passkeyeket használ, az azonosító szolgáltató az SSO-bejelentkezés során kéri őket.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  148bcb52b49eb179:
    english: "## Sign out"
    translation: "## Kijelentkezés"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dc9ad2d75eb9da48:
    english: Open the sidebar, select your name, then select **Sign out**. On a shared computer, sign out when you finish rather than closing only the browser tab.
    translation: Nyisd meg az oldalsávot, válaszd ki a nevedet, majd a **Kijelentkezés** lehetőséget. Ha közös számítógépet használsz, a munka végén jelentkezz ki; ne csak a böngészőlapot zárd be.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
