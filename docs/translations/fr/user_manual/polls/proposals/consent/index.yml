  e16bed826124695f:
    english: A Consent proposal asks whether a course of action is safe to try. Participants either consent or raise an objection. An objection identifies a concrete risk or harm that the proposal should address.
    translation: Une proposition par consentement demande si une action peut être essayée sans risque majeur. Les participants donnent leur consentement ou soulèvent une objection. Une objection signale un risque ou un préjudice concret auquel la proposition doit répondre.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d675dd47ae42c929:
    english: This page explains how to run one Consent proposal. See the [Consent process](/en/guides/making_decisions/consent_process) for the complete workflow, including questions, Sense check, amendments, objections, and outcome.
    translation: Cette page explique comment mener une proposition par consentement. Consultez le [processus de consentement](/en/guides/making_decisions/consent_process) pour connaître toutes les étapes, notamment les questions, la vérification de la compréhension, les modifications, les objections et la conclusion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7c4c79526b1d437b:
    english: "## When to use Consent"
    translation: "## Quand utiliser le consentement"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1b99c0443bd1e4c8:
    english: Use Consent when the group needs a workable decision that can proceed unless there is a valid objection. It suits experiments, operational policies, role agreements, and other decisions the group can review after gaining experience.
    translation: Utilisez le consentement lorsque le groupe a besoin d’une décision applicable, qui peut être mise en œuvre en l’absence d’objection valable. Cette méthode convient aux expérimentations, aux règles de fonctionnement, aux accords sur les rôles et aux autres décisions que le groupe pourra réexaminer après avoir acquis de l’expérience.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  966f3146dc9f61f1:
    english: Consent does not require everyone to prefer the proposal. Define what counts as an objection before voting, and explain how objections will be tested and resolved.
    translation: Le consentement n’exige pas que tout le monde préfère la proposition. Définissez ce qui constitue une objection avant le vote et expliquez comment les objections seront examinées et résolues.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e6cf2f0ebd4a7f58:
    english: "## Example: start a bottle trial"
    translation: "## Exemple : lancer un essai de bouteilles consignées"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ad7be5e188748cb3:
    english: Oatmilk Cooperative proposes starting a six-week returnable-bottle trial next month. The trial is limited in scope and includes a review, so the group asks whether it is safe to try.
    translation: La coopérative Oatmilk propose de lancer le mois prochain un essai de bouteilles consignées pendant six semaines. L’essai a une portée limitée et prévoit un bilan. Le groupe cherche donc à savoir s’il peut être mené sans risque majeur.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9703f1f9474243af:
    english: "## Set up the proposal"
    translation: "## Préparer la proposition"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6458750b94201df6:
    english: Describe the proposed action, its limits, safeguards, and review point. Keep **Consent** and **Objection** meanings precise, and require a reason for objections so the concern can be understood and addressed.
    translation: Décrivez l’action proposée, ses limites, les mesures de précaution et le moment prévu pour son réexamen. Précisez le sens de **Consentement** et d’**Objection**. Demandez de motiver les objections afin que les préoccupations puissent être comprises et prises en compte.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Voter"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d98c0e71880c8828:
    english: Participants select **Consent** when the proposal is safe enough to try, even if it is not their preferred plan. They select **Objection** when they can describe a material risk or harm.
    translation: Les participants choisissent **Consentement** lorsque la proposition peut être essayée sans risque majeur, même s’ils préféreraient une autre solution. Ils choisissent **Objection** lorsqu’ils peuvent décrire un risque ou un préjudice important.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Examiner les résultats"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b0265040032f48e5:
    english: The chart makes objections visible, but the group must examine the reasons. Resolve a valid objection by amending the proposal, adding a safeguard, changing its scope, or deciding not to proceed.
    translation: Le graphique montre les objections, mais le groupe doit en examiner les motifs. Pour résoudre une objection valable, modifiez la proposition, ajoutez une mesure de précaution, changez sa portée ou décidez de ne pas donner suite.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a87df65569cb3a09:
    english: Publish an outcome that records the agreed action, any safeguards, who is responsible, and when the group will review it.
    translation: Publiez une conclusion qui précise l’action convenue, les éventuelles mesures de précaution, les personnes responsables et la date à laquelle le groupe réexaminera la décision.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
