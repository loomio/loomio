---
navigation_title: Kirjanmerkit
blocks:
  4f81ad2ed2c971a4:
    english: "# Bookmarks"
    translation: "# Kirjanmerkit"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5d590d1d8ab9b956:
    english: |-
      Bookmarks are a personal list of Loomio items you want to return to. Your
      bookmarks are visible only to you and saving an item does not notify anyone
      else.
    translation: |-
      Kirjanmerkit ovat henkilökohtainen luettelo Loomion kohteista, joihin haluat palata.
      Vain sinä näet kirjanmerkkisi. Kirjanmerkin tallentamisesta ei ilmoiteta
      muille.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aac40737df991d52:
    english: 'You can bookmark:'
    translation: 'Voit lisätä kirjanmerkkeihin:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0f6c7e4161c72c18:
    english: |-
      - discussions
      - comments
      - proposals and polls
      - votes
      - outcomes
    translation: |-
      - keskusteluja
      - kommentteja
      - ehdotuksia ja kyselyjä
      - ääniä
      - tuloksia
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fc91d7d6d32e590b:
    english: "## Save a bookmark"
    translation: "## Tallenna kirjanmerkki"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  daec09886eecd058:
    english: |-
      Open the action menu for the item and select **Save bookmark**. The action menu
      is usually shown as three dots. For a discussion, use the action menu near the
      discussion title; for a comment, vote, proposal, poll, or outcome, use the menu
      on that item.
    translation: |-
      Avaa kohteen toimintovalikko ja valitse **Tallenna kirjanmerkki**.
      Toimintovalikko näkyy yleensä kolmena pisteenä. Keskustelun toimintovalikko
      on keskustelun otsikon lähellä. Kommentin, äänen, ehdotuksen, kyselyn tai
      tuloksen valikko on kyseisen kohteen kohdalla.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  395a4c119e77f34b:
    english: "## View your bookmarks"
    translation: "## Näytä kirjanmerkkisi"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a5e09c422c753df7:
    english: |-
      Open the sidebar and select **Bookmarks**. The number beside the link shows how
      many bookmarks you have saved.
    translation: |-
      Avaa sivupalkki ja valitse **Kirjanmerkit**. Linkin vieressä oleva luku
      kertoo, kuinka monta kirjanmerkkiä olet tallentanut.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7c21b03875c08b8e:
    english: |-
      The Bookmarks page lists your most recently saved items first. Each row shows
      the kind of item and its author. Select a row to return to the bookmarked item.
    translation: |-
      Kirjanmerkit-sivulla viimeksi tallennetut kohteet näkyvät ensin. Jokaisella
      rivillä näkyvät kohteen tyyppi ja tekijä. Palaa kohteeseen valitsemalla sen rivi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  644d774a0d045214:
    english: "## Remove a bookmark"
    translation: "## Poista kirjanmerkki"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c2480aa6235675ba:
    english: |-
      On the Bookmarks page, select the remove-bookmark button at the end of a row.
      You can also open the bookmarked item's action menu and select **Remove
      bookmark**.
    translation: |-
      Valitse Kirjanmerkit-sivulla rivin lopussa oleva kirjanmerkin poistopainike.
      Voit myös avata kohteen toimintovalikon ja valita **Poista
      kirjanmerkki**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6c20d47950313409:
    english: |-
      Removing a bookmark affects only your personal list. You can save the item
      again later.
    translation: |-
      Kirjanmerkin poistaminen vaikuttaa vain omaan luetteloosi. Voit tallentaa
      kohteen uudelleen myöhemmin.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
