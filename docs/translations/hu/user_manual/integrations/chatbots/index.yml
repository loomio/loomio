  195fe68dbcc6418f:
    english: Loomio can send notifications to your chatroom.
    translation: A Loomio értesítéseket küldhet a csevegőszobádba.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bf886ec0d398e8d7:
    english: Chat tools and Loomio work well together. Use chat for quick conversation and timely updates. Move important topics to Loomio when people need time to participate, when a decision must be made, or when the group will need a lasting record.
    translation: A csevegőeszközök és a Loomio jól kiegészítik egymást. A csevegést használd gyors beszélgetésekre és időszerű hírek megosztására. A fontos témákat vidd át a Loomióba, ha az embereknek időre van szükségük a részvételhez, döntést kell hozni, vagy a csoportnak később is visszakereshető feljegyzésre lesz szüksége.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  db7d26a18ddc651d:
    english: Loomio supports Slack, Discord, Microsoft Teams, Matrix and Mattermost.
    translation: A Loomio támogatja a Slack, a Discord, a Microsoft Teams, a Matrix és a Mattermost használatát.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  765fc0d609a0db99:
    english: You can send notifications to your chatroom any time you like, just the same way you would invite individual people to vote, or to join a thread.
    translation: Bármikor küldhetsz értesítést a csevegőszobádba, ahogyan egyes embereket is meghívhatsz szavazásra vagy egy témába.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a89717f4f41f3212:
    english: You can also configure notifications to always happen when a specific event happens, like someone starting a thread.
    translation: Azt is beállíthatod, hogy bizonyos eseményekkor, például egy téma indításakor, mindig menjen értesítés.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
