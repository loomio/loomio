---
navigation_title: Notificações
blocks:
  3a65b66c581936a1:
    english: "# Notifications"
    translation: "# Notificações"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c343eb5a1db968d8:
    english: Notifications help groups maintain momentum by drawing your attention to discussions and decisions that need a response.
    translation: As notificações ajudam os grupos a manter o andamento das atividades, chamando sua atenção para discussões e decisões que precisam de uma resposta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3d7b27f3b9880973:
    english: 'Notifications are often the starting point when you return to Loomio. They let you know when:'
    translation: 'Ao voltar ao Loomio, você pode começar pelas notificações. Elas avisam quando:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c4aec8fcb9fbc0de:
    english: |-
      - someone mentions you or replies to something you wrote
      - a new discussion is shared with you
      - you are invited or reminded to vote
      - a poll is closing soon
      - an outcome is announced
    translation: |-
      - alguém menciona você ou responde a algo que você escreveu
      - uma nova discussão é compartilhada com você
      - você recebe um convite ou lembrete para votar
      - uma enquete está perto de encerrar
      - uma conclusão é anunciada
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  792dcad0f81e8cc5:
    english: Loomio's notification settings let you choose how closely you want to follow each group or thread. Notifications remain available in Loomio, so you can review what needs your attention when you are ready.
    translation: As configurações de notificação do Loomio permitem escolher o quanto você quer acompanhar cada grupo ou tópico. As notificações continuam disponíveis no Loomio para você consultar quando puder.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '082fae961275aaaf':
    english: "## Two ways to begin"
    translation: "## Duas formas de começar"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cbea008bb7c0ee02:
    english: 'Most people can start with one of two approaches:'
    translation: 'A maioria das pessoas pode começar com uma destas opções:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3349bdb53fc33195:
    english: |-
      - **When notified** — receive an email when someone asks for your attention, and include everything else in your daily catch-up. Start here if you are still learning how your group uses Loomio.
      - **Once per day** — set Email to **Catch-up only** and keep your catch-up set to **Every day**. Your notifications and other unread activity will be delivered together in one email.
    translation: |-
      - **Quando notificado** — receba um e-mail quando alguém solicitar sua atenção. As demais atividades entram no seu resumo diário. Comece por esta opção se você ainda estiver conhecendo o uso do Loomio pelo seu grupo.
      - **Uma vez por dia** — defina E-mail como **Apenas para assistir posteriormente** e mantenha o resumo em **Diariamente**. Suas notificações e outras atividades não lidas chegarão juntas em um único e-mail.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  74e84c4946aa3713:
    english: New accounts start with **When notified** and a daily catch-up. This brings mentions, replies, discussions shared with you, invitations and reminders to vote, polls closing soon, and outcomes to your attention as they happen without sending an immediate update about every comment or vote.
    translation: As novas contas começam com **Quando notificado** e um resumo diário. Assim, você recebe avisos sobre menções, respostas, discussões compartilhadas com você, convites e lembretes para votar, enquetes perto de encerrar e conclusões à medida que acontecem, sem receber um aviso imediato para cada comentário ou voto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  896722cbb87e98be:
    english: If you would rather receive your Loomio notifications all at once, move to the once-per-day approach. You can change this later as your pattern of work changes.
    translation: Se você preferir receber todas as notificações do Loomio de uma vez, escolha a opção de uma vez por dia. Você pode alterá-la depois, conforme sua rotina mudar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e2c60724226ad68a:
    english: For a group or thread that you want to follow more closely, choose **All activity** to receive every update as it happens.
    translation: Para acompanhar um grupo ou tópico mais de perto, escolha **Todas as atividades** e receba cada atualização assim que ela acontecer.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  91fd24c60a6a84ee:
    english: These defaults apply when you join a group. Threads initially inherit the settings of their group, but you can follow an important thread more closely or reduce its notifications without changing the rest of the group.
    translation: Essas configurações padrão se aplicam quando você entra em um grupo. No início, os tópicos herdam as configurações do grupo. Você pode acompanhar um tópico importante mais de perto ou reduzir suas notificações sem alterar as dos outros tópicos do grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a75df26cfc4e6614:
    english: "## Notifications in Loomio"
    translation: "## Notificações no Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9286edc0ac459625:
    english: The bell icon in the top-right is where notifications are accessed within the app; a number shows how many notifications you have yet to read.
    translation: Acesse as notificações pelo ícone de sino no canto superior direito do aplicativo. O número indica quantas notificações você ainda não leu.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bfacf52b815e1252:
    english: Select a notification to open the related discussion or poll.
    translation: Selecione uma notificação para abrir a discussão ou enquete relacionada.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b7ed6a5c5c661d60:
    english: "## Catch-up"
    translation: "## Resumo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fc61461d684c5b47:
    english: The catch-up provides a regular overview of activity without requiring you to follow each group throughout the day.
    translation: O resumo oferece uma visão periódica das atividades sem que você precise acompanhar cada grupo ao longo do dia.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e519b17a3847cee:
    english: It shows your unseen notifications first, followed by unread discussions and standalone polls grouped by group. Notifications provide linked summaries of activity that needs your attention, while the unread section includes the discussion, poll, comment, vote, and edit details. Direct discussions and threads you have joined as a guest are included when they contain unread activity.
    translation: Ele mostra primeiro as notificações que você ainda não viu. Depois, mostra as discussões não lidas e as enquetes independentes, organizadas por grupo. As notificações trazem resumos com links para atividades que precisam da sua atenção. A seção de itens não lidos inclui detalhes de discussões, enquetes, comentários, votos e edições. Discussões diretas e tópicos dos quais você participa como convidado também aparecem quando têm atividades não lidas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  00703333f277e3c0:
    english: You can turn on **Follow updates** on an open Group that you have not joined. Unread discussions and polls from that Group are then included in your catch-up at your existing schedule. Reading the threads or marking the catch-up as read updates their read status in the same way as threads from Groups you belong to. Turn off **Follow updates** on the Group page to stop including them.
    translation: Você pode ativar **Acompanhe as atualizações** em um grupo aberto do qual não participa. As discussões e enquetes não lidas desse grupo passam a aparecer no seu resumo, conforme a frequência já definida. Ao ler os tópicos ou marcar o resumo como lido, o status de leitura é atualizado da mesma forma que nos tópicos dos grupos dos quais você participa. Desative **Acompanhe as atualizações** na página do grupo para deixar de incluí-los.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fcac102a70f7ee7f:
    english: Loomio does not send a catch-up when there are no unseen notifications or unread threads from the relevant period.
    translation: O Loomio não envia um resumo quando não há notificações ainda não vistas nem tópicos não lidos no período correspondente.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  888011209ac583be:
    english: "![A catch-up with unseen notifications and unread thread activity from one group](digest_email_example.png)"
    translation: "![Um resumo com notificações ainda não vistas e atividades não lidas de tópicos de um grupo](digest_email_example.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7d80cf08a383f6bd:
    english: "### Choose your catch-up schedule"
    translation: "### Escolha a frequência do resumo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  677863d68136156b:
    english: Open **Notification settings** from your user menu to choose how often you receive a catch-up.
    translation: Abra **Configurações de notificação** no menu do usuário para escolher com que frequência você recebe o resumo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7c0dece94210f807:
    english: The **Unsubscribe** link in a catch-up email opens a catch-up schedule form. The email link authorizes that form, so you can change or stop catch-up emails without signing in. The full **Notification settings** page in Loomio remains available when you sign in.
    translation: O link **Cancelar assinatura** em um e-mail de resumo abre um formulário para definir a frequência do resumo. O link do e-mail autoriza o uso desse formulário. Assim, você pode alterar ou interromper os e-mails de resumo sem entrar na sua conta. A página completa de **Configurações de notificação** continua disponível quando você entra no Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  da5740fd6dbd5737:
    english: "![Notification settings in the user menu](sidebar_notification_settings.png)"
    translation: "![Configurações de notificação no menu do usuário](sidebar_notification_settings.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  58af77d870a877e2:
    english: 'New accounts start with a daily catch-up. The available schedules are:'
    translation: 'As novas contas começam com um resumo diário. As frequências disponíveis são:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b0fe04b2b5284253:
    english: |-
      - **Never** to turn off the catch-up
      - **Every day** for activity from approximately the previous 24 hours
      - **Every second day** for activity from approximately the previous two days
      - a weekday to receive a weekly catch-up on that day
    translation: |-
      - **Nunca** para desativar o resumo
      - **Diariamente** para receber as atividades de aproximadamente as últimas 24 horas
      - **A cada dois dias** para receber as atividades de aproximadamente os últimos dois dias
      - um dia da semana para receber um resumo semanal nesse dia
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a23935f518dd15cb:
    english: The catch-up is sent in the morning according to the time zone in your Loomio profile.
    translation: O resumo é enviado pela manhã, de acordo com o fuso horário definido no seu perfil do Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b214c0634763fb51:
    english: "![Catch-up schedule setting](digest_email_setting.png)"
    translation: "![Configuração da frequência do resumo](digest_email_setting.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  efbcecfe827438a5:
    english: "### Mark a catch-up as read"
    translation: "### Marque um resumo como lido"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2b764b73f48d3185:
    english: Select **Mark catch-up as read** to mark its notifications and topic activity as read in Loomio. Opening or previewing the catch-up does not mark anything as read.
    translation: Selecione **Marque a opção de leitura como lida.** para marcar as notificações e atividades dos tópicos do resumo como lidas no Loomio. Abrir ou visualizar o resumo não marca nenhum item como lido.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  81ffa4a869f82451:
    english: A catch-up is not specific to one discussion, so do not reply to it. Open a discussion or poll from the catch-up before commenting or replying.
    translation: O resumo não pertence a uma discussão específica. Por isso, não responda ao e-mail de resumo. Abra uma discussão ou enquete pelo resumo antes de comentar ou responder.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f7dfee93901e5eea:
    english: "## Group and thread notification settings"
    translation: "## Configurações de notificação de grupos e tópicos"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  31be594005b6bcfc:
    english: You can choose how closely to follow each group and thread. These settings belong to you; group administrators cannot change them.
    translation: Você pode escolher o quanto quer acompanhar cada grupo e tópico. Essas configurações são suas; os administradores do grupo não podem alterá-las.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6c9a762b18c9f92d:
    english: Change your defaults for groups you join from **Notification settings** in your user menu. You can then override the default for a particular group or thread. A thread override changes only that thread and does not affect the rest of its group.
    translation: Altere as configurações padrão dos grupos dos quais você participa em **Configurações de notificação**, no menu do usuário. Depois, você pode definir uma configuração diferente para um grupo ou tópico específico. A configuração de um tópico afeta apenas esse tópico, sem alterar os outros tópicos do grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f4b6aa6eab1beb2b:
    english: "### Group notification settings"
    translation: "### Configurações de notificação de grupos"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  977289761daba9db:
    english: 'To change the notification setting for a group:'
    translation: 'Para alterar as configurações de notificação de um grupo:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d78d13409c481c71:
    english: |-
      1. Open the group page.
      2. Open the notification settings for the group.
    translation: |-
      1. Abra a página do grupo.
      2. Abra as configurações de notificação do grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  02116f695da0a946:
    english: "![Notification settings on a group page](group_notifications.png)"
    translation: "![Configurações de notificação na página de um grupo](group_notifications.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8ce50d3418e2d9fa:
    english: The form asks **How do you want to stay updated?** Choose **Catch-up only**, **When notified**, or **All activity**. If your catch-up is set to **Never**, **Catch-up only** is replaced by **No email updates** or **No push updates**.
    translation: O formulário pergunta **Como você deseja se manter atualizado?** Escolha **Apenas para assistir posteriormente**, **Quando notificado** ou **Todas as atividades**. Se o resumo estiver definido como **Nunca**, a opção **Apenas para assistir posteriormente** será substituída por **Sem atualizações por e-mail** ou **Sem atualizações push**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  24db74c2c82737eb:
    english: Select **Apply to all groups** to use the same setting for all of your groups.
    translation: Selecione **Aplicar a todos os grupos** para usar a mesma configuração em todos os seus grupos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  54cd6a8eac96e073:
    english: "![Group notification settings](group_notification_settings.png)"
    translation: "![Configurações de notificação do grupo](group_notification_settings.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d0ab43e865282241:
    english: "### Thread notification settings"
    translation: "### Configurações de notificação de tópicos"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f61284373b7afc42:
    english: To change notification settings for an individual thread, open the notification control in the thread sidebar.
    translation: Para alterar as notificações de um tópico, abra o controle de notificações na barra lateral do tópico.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b329b8421ab5d4f8:
    english: "![The notification control in a thread](thread_subscribe.png)"
    translation: "![O controle de notificações em um tópico](thread_subscribe.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  226c5e321d735005:
    english: "![Thread notification settings](thread_notifications.png)"
    translation: "![Configurações de notificação de tópicos](thread_notifications.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3178b3b456acd783:
    english: Thread notification settings use the same **Catch-up only**, **When notified**, and **All activity** choices. A thread setting overrides the group setting for that thread.
    translation: 'As configurações de notificação de tópicos oferecem as mesmas opções: **Apenas para assistir posteriormente**, **Quando notificado** e **Todas as atividades**. A configuração do tópico prevalece sobre a do grupo apenas nesse tópico.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f53fa37c98c9b747:
    english: |-
      >[!Note]
      >The changes in **Thread notification settings** apply only to the thread you have open. Select **Change notifications for group** to change the setting inherited by the group's other threads.
    translation: |-
      >[!Note]
      >As alterações em **Configurações de notificação de tópicos** se aplicam apenas ao tópico aberto. Selecione **Mudar as notificações para o grupo** para alterar a configuração herdada pelos outros tópicos do grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  99a0923cdcdc1cdf:
    english: "## Email delivery"
    translation: "## Envio de e-mails"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6cf70b2dc7cdbf83:
    english: By default, Loomio sends an email when you are notified. Depending on your group and thread notification settings, this can include mentions, replies, discussions shared with you, invitations and reminders to vote, outcomes, and polls closing soon. Choose **All activity** to also receive emails about every new comment, vote, thread, poll, and outcome.
    translation: Por padrão, o Loomio envia um e-mail quando você recebe uma notificação. Conforme as configurações de notificação do grupo e do tópico, isso pode incluir menções, respostas, discussões compartilhadas com você, convites e lembretes para votar, conclusões e enquetes que serão encerradas em breve. Escolha **Todas as atividades** para também receber e-mails sobre cada novo comentário, voto, tópico, enquete e conclusão.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ce2919b895be45b3:
    english: The **Unsubscribe** link in a notification email opens settings for that thread or group, including emails sent because someone mentioned you or replied to you. That form shows your current catch-up schedule for all groups and links to the catch-up email settings. These email links authorize only their own settings forms; they do not sign you in to Loomio.
    translation: O link **Cancelar assinatura** em um e-mail de notificação abre as configurações daquele tópico ou grupo. Isso também vale para e-mails enviados quando alguém menciona você ou responde a você. O formulário mostra a frequência atual do seu e-mail de resumo para todos os grupos e contém um link para as configurações desse e-mail. Esses links dão acesso apenas aos respectivos formulários de configuração; eles não conectam você ao Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d615e84f882a2728:
    english: When a discussion email says that replies are accepted, you can reply directly from your email and your message will be posted into the Loomio discussion.
    translation: Quando um e-mail de discussão informar que aceita respostas, você poderá responder diretamente ao e-mail. Sua mensagem será publicada na discussão no Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5b4ce168b24bc44a:
    english: Poll invitation emails show the poll and its response options, but selecting an option opens Loomio in your browser to complete the vote. You may need to sign in or confirm your account. The catch-up cannot accept replies; open the linked discussion or poll first.
    translation: Os e-mails de convite para uma enquete mostram a enquete e suas opções de resposta. Ao selecionar uma opção, você abre o Loomio no navegador para concluir o voto. Talvez seja necessário entrar ou confirmar sua conta. O e-mail de resumo não aceita respostas; primeiro, abra a discussão ou enquete pelo link.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0c2b2867a1ace598:
    english: "![A proposal invitation email with response options and the related thread](proposal_invitation_email.png)"
    translation: "![E-mail de convite para uma proposta com opções de resposta e o tópico relacionado](proposal_invitation_email.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a73508aa897d96cf:
    english: "## Enable mobile notifications with web push"
    translation: "## Ativar notificações móveis com web push"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f4b14a4ba068b670:
    english: Web push is how Loomio delivers mobile notifications today. It can notify you about Loomio activity on your phone when Loomio is not open.
    translation: O Loomio usa web push para enviar notificações móveis. Assim, você pode receber notificações sobre atividades no celular mesmo quando o Loomio não está aberto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  811ee794dea12cd3:
    english: On Android, open **Notification settings** in a supported browser and enable push. On an iPhone or iPad, first open Loomio in Safari, use **Share** then **Add to Home Screen**, open Loomio from the new Home Screen icon, and enable push from there. Select **Test connection** to verify delivery to every browser listed under **Enabled browsers**.
    translation: No Android, abra **Configurações de notificação** em um navegador compatível e ative as notificações push. No iPhone ou iPad, primeiro abra o Loomio no Safari, use **Compartilhar** e depois **Adicionar à Tela de Início**. Abra o Loomio pelo novo ícone na Tela de Início e ative as notificações push. Selecione **Conexão de teste** para verificar a entrega em cada navegador listado em **Navegadores habilitados**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72f0707b2d67bf0e:
    english: Web push also works in supported desktop browsers. Enable it there if you want Loomio notifications on your computer.
    translation: As notificações web push também funcionam em navegadores de computador compatíveis. Ative-as se quiser receber notificações do Loomio no computador.
    status: machine
