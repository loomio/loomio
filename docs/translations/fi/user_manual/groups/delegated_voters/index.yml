  9cfb3b7835dc5cb0:
    english: If some members of your group should have voting rights while others should not, you can use the "Make delegate" feature to identify those people with voting rights. There is a corresponding "Revoke delegate" action too.
    translation: Jos vain osalla ryhmäsi jäsenistä tulee olla äänioikeus, voit merkitä heidät **Tee valtuutettu** -toiminnolla. Voit myös perua valtuutuksen **Peruuta edustaja** -toiminnolla.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e017eafb51368777:
    english: Use delegates when people should share the same discussion space but only a defined set, such as directors or elected representatives, may vote. This is usually simpler than maintaining a second subgroup whose only purpose is to separate voters from non-voters.
    translation: Käytä edustajia, kun kaikki osallistuvat samoihin keskusteluihin mutta vain tietty joukko, kuten johtokunta tai valitut edustajat, saa äänestää. Tämä on yleensä yksinkertaisempaa kuin erillisen alaryhmän ylläpitäminen vain äänestäjien erottamiseksi muista jäsenistä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1942a47ae47ca813:
    english: Use a private subgroup instead when its members also need discussions, files, or membership information that other members must not see.
    translation: Käytä sen sijaan yksityistä alaryhmää, jos sen jäsenet tarvitsevat myös keskusteluja, tiedostoja tai jäsentietoja, joita muut jäsenet eivät saa nähdä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
