---
navigation_title: Commentaires
blocks:
  e6981c530fad6f45:
    english: "# Comments"
    translation: "# Commentaires"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cb82daa3594be60c:
    english: Comments are the main way people participate in a discussion. They are visible to anyone who has permission to see the thread.
    translation: Les commentaires sont le principal moyen de participer à une discussion. Ils sont visibles par toute personne autorisée à consulter le fil de discussion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  96ffa85117001d18:
    english: "## Reading comments"
    translation: "## Lire les commentaires"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2d82b2da2ee96a1f:
    english: When you open a discussion, Loomio takes you to activity that is new to you.
    translation: Lorsque vous ouvrez une discussion, Loomio vous mène à l’activité que vous n’avez pas encore vue.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c4a1b0be655249a9:
    english: Unread comments have a blue **new** label beside their posting time.
    translation: Les commentaires non lus portent la mention bleue **nouveau** à côté de leur heure de publication.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  82bce54322fa6023:
    english: "## Writing a comment"
    translation: "## Écrire un commentaire"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7b14a17025b52e3d:
    english: Write a comment to contribute to the discussion. Other people can reply, react, or post their own comments.
    translation: Écrivez un commentaire pour participer à la discussion. Les autres personnes peuvent y répondre, réagir ou publier leurs propres commentaires.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6e0c07cfcb8f1166:
    english: Select **Post Comment** to publish it. Your comment will be visible to anyone who has permission to see the discussion.
    translation: Sélectionnez **Publier le commentaire** pour le publier. Votre commentaire sera visible par toute personne autorisée à consulter la discussion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  edfadd8f1dcac9c4:
    english: The tools described in [Formatting](/en/user_manual/discussions/formatting/) are available when writing comments.
    translation: Les outils décrits dans [Mise en forme](/en/user_manual/discussions/formatting/) sont disponibles lorsque vous écrivez un commentaire.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b4dce878f57863ff:
    english: "## Mentioning people"
    translation: "## Mentionner des personnes"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  70543178fe9e7b4b:
    english: Type **@**, start typing a person's name, then select them from the list. A mention notifies that person immediately and is a useful way to ask for their attention or response.
    translation: Saisissez **@**, commencez à écrire le nom d’une personne, puis sélectionnez-la dans la liste. La personne reçoit immédiatement une notification. C’est un moyen de solliciter son attention ou sa réponse.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b1d5a5e3d5bb86e3:
    english: "![Mentioning Samira Patel in a comment](../notifying_people/comment_mention.png)"
    translation: "![Mention de Samira Patel dans un commentaire](../notifying_people/comment_mention.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  07aa88bffb5b1700:
    english: To notify everyone in the group, type **@**, start typing the group name, then select it from the list.
    translation: Pour avertir tous les membres du groupe, saisissez **@**, commencez à écrire le nom du groupe, puis sélectionnez-le dans la liste.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  794c26be4050ac1b:
    english: "![Searching for Oatmilk Cooperative while writing a group mention](../notifying_people/mentioning_group_1.png)"
    translation: "![Recherche d’Oatmilk Cooperative lors de la rédaction d’une mention de groupe](../notifying_people/mentioning_group_1.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  111625a57c02bc5c:
    english: "![Oatmilk Cooperative selected as a group mention](../notifying_people/mentioning_group_2.png)"
    translation: "![Oatmilk Cooperative sélectionné comme mention de groupe](../notifying_people/mentioning_group_2.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b4fb3c8390c32e31:
    english: Mentioning someone does not give them access to the thread. Use **Invite people** in the thread sidebar if they are not already a thread member.
    translation: Mentionner une personne ne lui donne pas accès au fil de discussion. Si elle n’en est pas déjà membre, utilisez **Inviter des personnes** dans la barre latérale du fil de discussion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6bba3d93a1845f91:
    english: "## Replying to a comment"
    translation: "## Répondre à un commentaire"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e7776c198f2f2f48:
    english: Select **Reply** below a comment to respond to it. The reply is prefilled with an @mention of the comment author, which notifies them when you post it. Remove the mention if you do not want to notify them.
    translation: Sélectionnez **Répondre** sous un commentaire pour y répondre. Une @mention de son auteur figure déjà dans votre réponse. Cette personne recevra une notification lorsque vous publierez la réponse. Supprimez la mention si vous ne souhaitez pas l’avertir.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eb45d23f7f968858:
    english: You can also reply to your own comment to nest a response beneath it.
    translation: Vous pouvez aussi répondre à votre propre commentaire pour ajouter une réponse en dessous.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ab1caf06d54d3bcb:
    english: If a Loomio email says you can reply by email, your emailed reply will appear in the thread.
    translation: Si un courriel de Loomio indique que vous pouvez répondre par courriel, votre réponse apparaîtra dans le fil de discussion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72d9282ce2bc763a:
    english: "## Reactions"
    translation: "## Réactions"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1875a303c30b5343:
    english: Use the smiley button to respond with an emoji. Reactions notify the comment author within Loomio but do not send an email.
    translation: Utilisez le bouton souriant pour répondre avec un emoji. Les réactions avertissent l’auteur du commentaire dans Loomio, mais ne lui envoient pas de courriel.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ce997bcd34b2eae0:
    english: "## Translating comments"
    translation: "## Traduire les commentaires"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b50a435640652d31:
    english: If the author uses a language other than yours, a **Translate** action appears below the comment.
    translation: Si l’auteur utilise une autre langue que la vôtre, l’action **Traduire** apparaît sous le commentaire.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9077e2c891750fe8:
    english: Select **Translate comment** to see the comment in your language.
    translation: Sélectionnez **Afficher une traduction automatique du commentaire** pour voir le commentaire dans votre langue.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  60a885598057c1bf:
    english: "## Comment actions"
    translation: "## Actions sur les commentaires"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9689ea71da9051d8:
    english: Common actions appear directly below a comment. Additional actions are available from the three-dot menu (**⋯**).
    translation: Les actions courantes apparaissent directement sous le commentaire. D’autres actions sont disponibles dans le menu à trois points (**⋯**).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  88263de7d2158dae:
    english: "### Add a comment to Jump to"
    translation: "### Ajouter un commentaire à Aller à"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dd60de0295088aa5:
    english: Use **Pin to timeline** to add a comment to the thread's **Jump to** list.
    translation: Utilisez **Epingler dans la timeline ** pour ajouter un commentaire à la liste **Aller à** du fil de discussion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  90252c4d66b752d4:
    english: You can edit the label shown in **Jump to**. Unpin and then pin the comment again to change the link text.
    translation: Vous pouvez modifier le libellé affiché dans **Aller à**. Pour changer le texte du lien, désépinglez le commentaire, puis épinglez-le à nouveau.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  28c2ffaa171b6b1b:
    english: |-
      >[!Tip]
      >Highlight the words you want to use as the link text before selecting **Pin to timeline**.
    translation: |-
      >[!Tip]
      >Sélectionnez les mots que vous souhaitez utiliser comme texte du lien avant de choisir **Epingler dans la timeline **.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7545e856758edb22:
    english: Select **Unpin** to remove the item from **Jump to**.
    translation: Sélectionnez **Ne plus épingler** pour retirer l’élément de **Aller à**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c3b33d31cbce93c3:
    english: "### Edit a comment and view changes"
    translation: "### Modifier un commentaire et consulter les changements"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  abaeaac4c1f2c966:
    english: Select **Edit** below one of your comments to change it. Group admins can also edit member comments when the relevant group permission is enabled.
    translation: Sélectionnez **Modifier** sous l’un de vos commentaires pour le modifier. Les administrateurs du groupe peuvent aussi modifier les commentaires des membres si l’autorisation correspondante est activée.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  69647eee1f3fcfb7:
    english: An **Edited** action appears below an edited comment.
    translation: L’action **Modifié** apparaît sous un commentaire qui a été modifié.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fcaa0d6329f5c5d4:
    english: Select **Edited** to see what changed. Red highlighting shows removed text and green highlighting shows added text. Loomio records who made each edit and when it was made.
    translation: Sélectionnez **Modifié** pour voir les changements. Le texte supprimé est surligné en rouge et le texte ajouté en vert. Loomio indique qui a effectué chaque modification et à quel moment.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  042b22530d14a486:
    english: 'You can edit a comment when:'
    translation: 'Vous pouvez modifier un commentaire si :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  afe0ed6535a96b15:
    english: |-
      - you wrote it and the group allows members to edit their comments
      - you are a group admin and [Admins can edit members' comments](/en/user_manual/groups/settings/permissions) is enabled
    translation: |-
      - vous l’avez écrit et le groupe autorise les membres à modifier leurs commentaires
      - vous êtes administrateur du groupe et l’option [Les administrateurs peuvent modifier les commentaires des membres](/en/user_manual/groups/settings/permissions) est activée
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6962d0caeeea20e8:
    english: "### Copy a comment link"
    translation: "### Copier le lien vers un commentaire"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0fb9e2ebde71573e:
    english: Select **Copy link** to copy the comment's unique URL. You can paste the link elsewhere to refer directly to that comment.
    translation: Sélectionnez **Copier le lien** pour copier l’URL unique du commentaire. Vous pouvez coller ce lien ailleurs pour renvoyer directement au commentaire.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  04e4537024da788c:
    english: "### View notification history"
    translation: "### Consulter l’historique des notifications"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  957677befce0ab3f:
    english: Open the three-dot menu (**⋯**) beside a comment and select **Notification history**.
    translation: Ouvrez le menu à trois points (**⋯**) à côté d’un commentaire, puis sélectionnez **Historique des notifications**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fa9d0f2448239944:
    english: "![Notification history in a comment's actions menu](../notifying_people/comment_notification_history.png)"
    translation: "![Historique des notifications dans le menu des actions d’un commentaire](../notifying_people/comment_notification_history.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  30a58d4ef7d80c15:
    english: The notification history shows who was notified about the comment, when the notification was sent, and whether it has been read when that information is available.
    translation: L’historique des notifications indique qui a reçu une notification concernant le commentaire et quand elle a été envoyée. Il indique aussi si elle a été lue, lorsque cette information est disponible.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4f6ead46c3f9759e:
    english: "![Notification history for a comment mentioning Samira Patel](../notifying_people/comment_notification_example.png)"
    translation: "![Historique des notifications d’un commentaire mentionnant Samira Patel](../notifying_people/comment_notification_example.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fa2204fb0745dec4:
    english: "### Discard, restore, or delete a comment"
    translation: "### Jeter, restaurer ou supprimer un commentaire"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  592dfa766814bb8e:
    english: Discarding a comment removes it from the thread but retains it in a trash bin. You can discard your own comments with **Discard** in the three-dot menu. Group admins can also discard comments.
    translation: Jeter un commentaire le retire du fil de discussion, mais le conserve dans la corbeille. Vous pouvez jeter vos propres commentaires avec **Jeter** dans le menu à trois points. Les administrateurs du groupe peuvent aussi jeter des commentaires.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  670a46d5274f9ab5:
    english: "**Restore a comment**"
    translation: "**Restaurer un commentaire**"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9b202a60d5665ac6:
    english: The location of a discarded comment is labelled **Item removed**. Open its three-dot menu and select **Restore**.
    translation: À l’emplacement d’un commentaire jeté figure la mention **Elément supprimé**. Ouvrez son menu à trois points, puis sélectionnez **Restaurer**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d6427576dab2b2c5:
    english: "**Delete a comment**"
    translation: "**Supprimer un commentaire**"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d8b9add122e73295:
    english: Deleting a comment removes it permanently. It cannot be restored.
    translation: La suppression d’un commentaire est définitive. Il ne peut pas être restauré.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  51f7dce6a0188a51:
    english: If **Members can delete their own comments** is enabled in [Group permissions](/en/user_manual/groups/settings/permissions), members can permanently delete their own discarded comments. Group admins can delete any comment.
    translation: Si l’option **Les membres peuvent supprimer leurs propres commentaires** est activée dans les [permissions du groupe](/en/user_manual/groups/settings/permissions), les membres peuvent supprimer définitivement leurs propres commentaires jetés. Les administrateurs du groupe peuvent supprimer n’importe quel commentaire.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  63134f860609d669:
    english: Open the three-dot menu on an **Item removed** entry and select **Delete**.
    translation: Ouvrez le menu à trois points d’une entrée **Elément supprimé**, puis sélectionnez **Supprimer**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  19580f91a59bf5ef:
    english: A confirmation message explains that the comment will be permanently deleted.
    translation: Un message de confirmation explique que le commentaire sera supprimé définitivement.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
