      process_subtitle: Заахвочвайце сваю групу разам паспрабаваць Loomio
      process_introduction: "<p>Каб максімальна выкарыстоўваць Loomio, патрэбныя калектыўныя абавязацельствы. Гэтая прапанова дапаможа вашай групе вырашыць, ці варта ўкласці час і намаганні ў тое, каб паспрабаваць Loomio як след — няхай гэта будзе абавязацельства па пробным перыядзе ці сумесная рэгістрацыя па плане.</p>"
      title: Давайце паспрабуем Loomio разам
      details: "<p>Добрае выкарыстанне Loomio патрабуе калектыўных намаганняў — гэта працуе толькі тады, калі людзі прыходзяць і ўдзельнічаюць.</p><p> Гэтая прапанова заклікае ўсіх актыўна карыстацца Loomio на працягу нашага пробнага перыяду. Гэта азначае рэгістрацыю, галасаванне па прапановах і ўдзел у абмеркаваннях.</p><p> Калі ў вас ёсць асцярогі з гэтай нагоды, выкажыце пярэчанне і пазначце, што трэба змяніць — менавіта для гэтага і існуе опцыя пярэчання.</p>"
      outcome_statement: "<p>Падзяліцеся высновай гэтай прапановы з групай — што было вырашана і што будзе далей.</p>"
