    translation: Калі вынікі схаваныя, пакуль вы не аддасце голас, прагаласуйце перад друкам або экспартам тэмы ў фармаце Markdown.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1e5a1eb47ee3d99d:
