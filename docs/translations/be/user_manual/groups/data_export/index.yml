---
navigation_title: Экспарт дадзеных
blocks:
  '053719812e2be1ea':
    english: "# Group data backup or export"
    translation: "# Рэзервовая копія або экспарт дадзеных групы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  42721518a91907da:
    english: 'With the group data export feature you can:'
    translation: 'Экспарт дадзеных групы дазваляе:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f978c97e52e0b00a:
    english: |-
      - Download a file containing member data to audit group membership.
      - Download content of your group including text of threads and polls for archive or analysis.
      - Open poll results in a spreadsheet or scripting language.
      - [Print or save PDF's of a thread or poll for archival purposes.](#print-thread-to-pdf)
      - Move your group, including all users, threads, polls, and files to another Loomio server.
    translation: |-
      - Спампаваць файл з дадзенымі ўдзельнікаў, каб праверыць склад групы.
      - Спампаваць змесціва групы, у тым ліку тэксты абмеркаванняў і апытанняў, для архівавання або аналізу.
      - Адкрыць вынікі апытанняў у электроннай табліцы або апрацаваць іх з дапамогай мовы праграмавання.
      - [Надрукаваць абмеркаванне ці апытанне або захаваць яго ў PDF для архіва.](#print-thread-to-pdf)
      - Перанесці групу разам з усімі карыстальнікамі, абмеркаваннямі, апытаннямі і файламі на іншы сервер Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  94b3081b62cd0a45:
    english: If you ever want to move from Loomio managed servers [to your own](https://github.com/loomio/loomio), you can use this feature.
    translation: Калі вы захочаце перайсці з сервераў пад кіраваннем Loomio [на ўласны сервер](https://github.com/loomio/loomio), скарыстайцеся гэтай функцыяй.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  223d5690921676c4:
    english: If you're running your own Loomio server, and would rather not anymore, Loomio offer managed hosting in USA, EU and Australia. If you'd like to migrate your group to one of these servers, please [contact us](/contact).
    translation: Калі вы карыстаецеся ўласным серверам Loomio і хочаце перайсці на кіраваны хостынг, Loomio прапануе серверы ў ЗША, ЕС і Аўстраліі. Каб перанесці групу на адзін з іх, [звяжыцеся з намі](/contact).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cabd4ab01146ea7c:
    english: "[Contact us](/contact) if you would like to transfer your Loomio group from Loomio's global hosted service at loomio.com to one of our regional services; loomio.eu for Europe or loomio.nz for Australia and New Zealand."
    translation: "[Звяжыцеся з намі](/contact), калі хочаце перанесці групу з глабальнага хостынгу Loomio на loomio.com на адзін з рэгіянальных сервераў: loomio.eu для Еўропы або loomio.nz для Аўстраліі і Новай Зеландыі."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7f2ecd944aa32dbf:
    english: "## Export data"
    translation: "## Экспарт дадзеных"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  84dc26a340a5515c:
    english: Open the group drop down menu by clicking on the three dots, and select **Export group data**.
    translation: Націсніце на тры кропкі, каб адкрыць меню групы, і выберыце **Экспартаваць дадзеныя групы**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aff0fe2a7c8a4387:
    english: "![Export group data action in the Oatmilk Cooperative menu](group_export_group_data.png)"
    translation: "![Пункт «Экспартаваць дадзеныя групы» ў меню Oatmilk Cooperative](group_export_group_data.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  89b404c37ca3eacb:
    english: "### Export group data as CSV"
    translation: "### Экспарт дадзеных групы ў CSV"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fe148be194ea7678:
    english: "*For working with the group data in a spreadsheet, such as with MS Excel or Google Sheets.*"
    translation: "*Для працы з дадзенымі групы ў электроннай табліцы, напрыклад у MS Excel або Google Sheets.*"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8f19e7d0c067abec:
    english: Loomio prepares the CSV file in the background and emails you a download link when it is ready. The link is available for one week.
    translation: Loomio падрыхтуе файл CSV у фонавым рэжыме і дашле вам спасылку для спампоўвання па электроннай пошце. Спасылка будзе дзейнічаць адзін тыдзень.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4272b6e6d986f710:
    english: "### Export group data as HTML"
    translation: "### Экспарт дадзеных групы ў HTML"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e3076a79c179d09d:
    english: "*For when you want to save the data for archival purposes.*"
    translation: "*Для захавання дадзеных у архіве.*"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5936d07e505560ae:
    english: Loomio prepares the HTML file in the background and emails you a download link when it is ready. The link is available for one week.
    translation: Loomio падрыхтуе файл HTML у фонавым рэжыме і дашле вам спасылку для спампоўвання па электроннай пошце. Спасылка будзе дзейнічаць адзін тыдзень.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c81ccbae7a016e39:
    english: "### Export group data as JSON"
    translation: "### Экспарт дадзеных групы ў JSON"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  857b562cb95497c6:
    english: "*For when you want to move your group data to a self-hosted Loomio instance.*"
    translation: "*Для пераносу дадзеных групы на ўласны сервер Loomio.*"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a1b7f7b282933a3c:
    english: 'You must be an admin of the group to export it. The JSON export includes:'
    translation: 'Каб экспартаваць групу, вы павінны мець правы адміністратара гэтай групы. У экспарт JSON уваходзяць:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6a0b307d50fa35cf:
    english: |-
      - The group, its members and membership requests
      - Threads, comments, reactions, tags, templates, notifications and related records from the included groups
      - Polls, options, votes and outcomes; an anonymous poll is included only after it has closed
      - Subgroups you belong to
      - Open and closed subgroups when you export their parent group as a parent group admin, even if you do not belong to those subgroups
      - References to files and images attached to the included content
    translation: |-
      - Група, яе ўдзельнікі і запыты на далучэнне
      - Абмеркаванні, каментарыі, рэакцыі, тэгі, шаблоны, апавяшчэнні і звязаныя запісы ўключаных груп
      - Апытанні, варыянты адказаў, галасы і высновы; ананімнае апытанне ўключаецца толькі пасля закрыцця
      - Падгрупы, да якіх вы належыце
      - Адкрытыя і закрытыя падгрупы пры экспарце бацькоўскай групы з правамі яе адміністратара, нават калі вы не належыце да гэтых падгруп
      - Спасылкі на файлы і выявы, далучаныя да ўключанага змесціва
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4dee92f966ec24c9:
    english: 'The JSON export does not include:'
    translation: 'У экспарт JSON не ўваходзяць:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a40deeed41d9937e:
    english: |-
      - Secret subgroups you do not belong to, including their membership and content
      - Subgroups awaiting deletion
      - Anonymous polls that have not closed
      - Direct threads and polls that do not belong to the group
    translation: |-
      - Сакрэтныя падгрупы, да якіх вы не належыце, разам з дадзенымі пра іх удзельнікаў і змесцівам
      - Падгрупы, якія чакаюць выдалення
      - Ананімныя апытанні, якія яшчэ не закрытыя
      - Прамыя абмеркаванні і апытанні, якія не належаць да групы
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d789fbf93f8cebeb:
    english: You'll shortly receive an email with a link to downloading the JSON file.
    translation: Неўзабаве вы атрымаеце электронны ліст са спасылкай для спампоўвання файла JSON.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  45e84928165064c0:
    english: "## Print thread to pdf"
    translation: "## Друк абмеркавання ў PDF"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aeefd6206678dc53:
    english: You may need to extract a copy of a thread to store in a separate file archive.
    translation: Вы можаце захаваць копію абмеркавання ў асобным файлавым архіве.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e3f452ea171c0fd5:
    english: "**Print** thread retains all comments, polls, votes and outcomes, along with thread formatting."
    translation: Пры выкарыстанні функцыі **Друк** захоўваюцца ўсе каментарыі, апытанні, галасы і высновы, а таксама фарматаванне абмеркавання.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  374e78cd9af57cfd:
    english: In the thread menu click on the 3 dots menu (⋯) and choose **Print**. Loomio will generate an HTML page that you can then print or "save to pdf" using the print tool in your browser.
    translation: У меню абмеркавання націсніце на тры кропкі (⋯) і выберыце **Друк**. Loomio створыць старонку HTML, якую можна надрукаваць або захаваць у PDF праз функцыю друку ў браўзеры.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8bc0f6441f7870fe:
    english: You can copy the page to paste it into a document editor, file, or data repository.
    translation: Вы можаце скапіяваць старонку і ўставіць яе ў рэдактар дакументаў, файл або сховішча дадзеных.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  acd7219673eb8a9d:
    english: "![Print action for the returnable bottles discussion](discussion_print_discussion.png#width-90)"
    translation: "![Пункт «Друк» для абмеркавання зваротных бутэлек](discussion_print_discussion.png#width-90)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8e0c22aed33c3826:
    english: "## Import your group data on another Loomio server"
    translation: "## Імпарт дадзеных групы на іншы сервер Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  552e7e7dac6e8c45:
    english: 'For instructions on setting up your own Loomio server, visit: https://github.com/loomio/loomio'
    translation: 'Інструкцыі па наладжванні ўласнага сервера Loomio: https://github.com/loomio/loomio'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a2ca329b6fa836cf:
    english: 'If you are hosting your own Loomio deployment, and would like to import your exported data:'
    translation: 'Калі вы размясцілі Loomio на ўласным серверы і хочаце імпартаваць экспартаваныя дадзеныя:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6d584f8aa2b00d1a:
    english: 'Copy the .json file to the container instance''s `import` folder:'
    translation: 'Скапіруйце файл .json у папку `import` кантэйнера:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '007668b33284b9fc':
    english: "`scp your-group-data.json username@some-domain.org:loomio-deploy/import`"
    translation: "`scp your-group-data.json username@some-domain.org:loomio-deploy/import`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  98fc0efbb6678c24:
    english: 'Access the running Rails console:'
    translation: 'Адкрыйце кансоль Rails у запушчаным кантэйнеры:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aa137a229b7d9684:
    english: "`docker exec -ti loomio-app rails console`"
    translation: "`docker exec -ti loomio-app rails console`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  67b9086f5b47cff8:
    english: 'Call the service:'
    translation: 'Выклічце сэрвіс:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d9c4f9a50d248ab9:
    english: "`GroupExportService.import('/import/your-group-data.json')`"
    translation: "`GroupExportService.import('/import/your-group-data.json')`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
