navigation_title: Gevoelscontrole
blocks:
  5c5bf2d96ddf4ca2:
    english: "# Sense check"
    translation: "# Gevoelscontrole"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4ec1b55b6ebaf563:
    english: Sense check gathers reactions while an idea is still being developed. Its options—**Looks good**, **Could be better**, and **Needs a rethink**—show whether the group is ready to proceed or should revise the idea first.
    translation: Met een gevoelscontrole verzamel je reacties terwijl een idee nog wordt uitgewerkt. De opties **Ziet er goed uit**, **Het zou beter kunnen.** en **Moet opnieuw worden bekeken** laten zien of de groep verder kan of het idee eerst moet aanpassen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  43573d5547783c67:
    english: This page explains how to run one Sense check. See the [Simple decision process](/en/guides/making_decisions/simple_decision_process), [Consent process](/en/guides/making_decisions/consent_process), or [Consensus process](/en/guides/making_decisions/consensus_process) for examples of using Sense check as one stage of a larger process.
    translation: Op deze pagina lees je hoe je een gevoelscontrole uitvoert. Bekijk het [eenvoudige besluitvormingsproces](/en/guides/making_decisions/simple_decision_process), het [toestemmingsproces](/en/guides/making_decisions/consent_process) of het [consensusproces](/en/guides/making_decisions/consensus_process) voor voorbeelden waarin een gevoelscontrole deel uitmaakt van een groter proces.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5ad4c12fda490468:
    english: "## When to use Sense check"
    translation: "## Wanneer gebruik je een gevoelscontrole?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dc841c725ef4e519:
    english: 'Use Sense check to:'
    translation: 'Gebruik een gevoelscontrole om:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8472db2ec587add8:
    english: |-
      - test an early draft before investing in a detailed proposal;
      - uncover questions and concerns before a formal decision;
      - check whether another round of discussion is needed; or
      - compare support before and after revising an idea.
    translation: |-
      - een eerste concept te toetsen voordat je tijd steekt in een uitgewerkt voorstel;
      - vragen en zorgen boven tafel te krijgen vóór een formeel besluit;
      - te bepalen of er nog een discussieronde nodig is; of
      - de steun voor een idee vóór en na een aanpassing te vergelijken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f411d599f7810e88:
    english: Do not treat **Looks good** as formal approval unless the group has explicitly agreed to do so. Use [Consent](../consent/) or [Consensus](../consensus/) when the response must authorize a decision.
    translation: Beschouw **Ziet er goed uit** alleen als formele goedkeuring als de groep dat uitdrukkelijk heeft afgesproken. Gebruik [Toestemming](../consent/) of [Overeenstemming](../consensus/) als de reacties een besluit moeten bekrachtigen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e504f1a6f38ec6ad:
    english: "## Example: check a trial plan"
    translation: "## Voorbeeld: een proefplan toetsen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dd13b88fd1a52d50:
    english: Oatmilk Cooperative has drafted a returnable-bottle trial. It runs a Sense check to learn whether the collection schedule, washing checks, and reporting plan are ready for final review.
    translation: Oatmilk Cooperative heeft een proef met herbruikbare flessen uitgewerkt. De coöperatie gebruikt een gevoelscontrole om te zien of het inzamelschema, de controles op het reinigen en het plan voor verslaglegging klaar zijn voor de laatste beoordeling.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9703f1f9474243af:
    english: "## Set up the proposal"
    translation: "## Stel het voorstel op"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  48d89110b4c23c6f:
    english: State what stage the idea has reached and what will happen with the feedback. Keep the default response meanings or edit them to match the group's language. Set a closing time that leaves enough time to revise the plan.
    translation: Beschrijf in welke fase het idee zich bevindt en wat er met de feedback gebeurt. Behoud de standaardbetekenis van de reacties of pas die aan het taalgebruik van de groep aan. Kies een sluitingstijd die genoeg ruimte laat om het plan te herzien.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Stem"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a0f4779c6103c9c:
    english: Participants choose the response that best represents their current view and explain what is ready or what should change. A useful reason gives the proposal author something specific to act on.
    translation: Deelnemers kiezen de reactie die het best bij hun huidige mening past. Ze leggen uit wat al goed is of wat moet veranderen. Een concrete reden geeft de indiener van het voorstel iets om mee aan de slag te gaan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Bekijk de resultaten"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ddcd496a30ab97da:
    english: 'The chart shows the number and proportion of votes for each response. Read the reasons as well as the distribution: one well-founded concern may require attention even when most participants select **Looks good**.'
    translation: 'De grafiek toont het aantal stemmen en het aandeel per reactie. Lees ook de redenen achter de stemmen: één goed onderbouwde zorg kan aandacht vragen, zelfs als de meeste deelnemers **Ziet er goed uit** kiezen.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d9ac55d3e75e5484:
    english: Publish an outcome that summarizes the changes the group will make, or records that the idea is ready for the next decision stage.
    translation: Deel een conclusie waarin je samenvat welke veranderingen de groep gaat aanbrengen, of vastlegt dat het idee klaar is voor de volgende stap in de besluitvorming.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
