---
navigation_title: Обговорення
blocks:
  f087c06a5f4ab2e6:
    english: "# Intro to Discussions"
    translation: "# Вступ до обговорень"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f515c87a8d1d20c7:
    english: Loomio discussions are where you can share information, discuss topics, and make decisions with your group.  People participate by posting comments and replies.
    translation: В обговореннях Loomio ви можете ділитися інформацією, обговорювати питання та ухвалювати рішення разом зі своєю групою. Люди беруть участь, публікуючи коментарі та відповіді.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eede89b6ce4f357d:
    english: |-
      - All info about a topic is in one easily accessible place.
      - People can reply via email and their comments appear in the discussion.
      - You can see who has read the discussion and who needs a nudge.
      - There is a record of discussion you can easily find again.
    translation: |-
      - Уся інформація про питання зібрана в одному легкодоступному місці.
      - Люди можуть відповідати електронною поштою, і їхні коментарі з’являться в обговоренні.
      - Ви можете побачити, хто прочитав обговорення, а кому варто нагадати про нього.
      - Запис обговорення легко знайти згодом.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9cb2eb404b59208b:
    english: Discussions have a wide range of uses - from a general discussion forum to running specific work-flow and decision-making processes.
    translation: 'Обговорення можна використовувати для різних цілей: від загального форуму до конкретних робочих процесів і ухвалення рішень.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  87a95605052570ca:
    english: For example, you may frame a discussion on a particular topic, invite people to contribute their thoughts and share information, and facilitate progress towards an agreed outcome.
    translation: Наприклад, ви можете започаткувати обговорення певного питання, запросити людей поділитися думками та інформацією і допомогти групі дійти спільного висновку.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ce6e6734c595d968:
    english: Or you may invite people to participate in a particular decision, using a consent or advice decision-making process.
    translation: Або ви можете запросити людей до ухвалення конкретного рішення за процесом, що ґрунтується на згоді чи пораді.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7fa58cb3ba95be0b:
    english: Discussions can also contain polls and proposals to help progress a discussion to an outcome. As people comment in the discussion and vote in polls, a discussion timeline builds so you can easily find key milestones.
    translation: Обговорення також можуть містити опитування та пропозиції, які допомагають дійти висновку. Коли люди коментують і голосують в опитуваннях, формується хронологія обговорення, у якій легко знайти ключові події.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  388e829e86a99bd8:
    english: "![The Returnable bottles for cafe customers discussion, with a comment and a proposal](discussion-example.png)"
    translation: "![Обговорення повернення пляшок відвідувачами кафе з коментарем і пропозицією](discussion-example.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6b0556376d31b63e:
    english: "## Common uses"
    translation: "## Поширені способи використання"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cf4344b3f2a3b7e9:
    english: 'Here are some common uses of discussions:'
    translation: 'Ось кілька поширених способів використання обговорень:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '0479bd2337b02443':
    english: "### Boards and Governance"
    translation: "### Ради та управління"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5b0a3e2c653d47f8:
    english: "**Prepare for a meeting** - Build an agenda, post board papers and organize administrative matters so everyone is up to date, in context and prepared. "
    translation: "**Підготуватися до зустрічі** - Складіть порядок денний, опублікуйте матеріали ради й узгодьте організаційні питання, щоб усі мали потрібну інформацію та могли підготуватися."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5c1c6aa79c3556dc:
    english: "**Pass a resolution** - Post context and background information, respond to questions and raise a proposal to pass a resolution. "
    translation: "**Прийняти резолюцію** - Опублікуйте опис питання та довідкову інформацію, дайте відповіді на запитання й висуньте пропозицію щодо ухвалення резолюції."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  07ae9c6a1f0a32d0:
    english: "**Discuss an agenda item on Loomio** - Start discussion about an agenda item prior to your meeting. Or, if you run out of time in the meeting, move the discussion on to Loomio."
    translation: "**Обговорити пункт порядку денного в Loomio** - Почніть обговорення пункту порядку денного до зустрічі. Якщо під час зустрічі бракує часу, продовжіть обговорення в Loomio."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f0b0de7094b1cfc9:
    english: "**Approve minutes and track actions** - Post minutes and assign actions. Use a poll to approve minutes. "
    translation: "**Затвердити протокол і відстежувати завдання** - Опублікуйте протокол і призначте завдання. Проведіть опитування, щоб затвердити протокол."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ba7cf177191baadb:
    english: "### Member participation"
    translation: "### Участь членів групи"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3cf51f837c0a3e9f:
    english: "**Share news (replace mailing list)** - Post information for members, invite comments."
    translation: "**Поділитися новинами (замість списку розсилки)** - Опублікуйте інформацію для членів групи та запросіть їх коментувати."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d2cd391b61042129:
    english: "**Organize an event** - Work with your organizing team on details. Keep all discussion and info within the thread. Then announce the event to wider membership."
    translation: "**Організувати подію** - Обговоріть деталі з організаційною командою. Зберігайте все обговорення та інформацію в одній темі. Потім повідомте про подію всіх членів групи."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cf59a44a8643cc96:
    english: "**Develop a policy** - Post a policy draft, seek member feedback and input, finalize and ratify the policy."
    translation: "**Розробити політику** - Опублікуйте проєкт політики, зберіть відгуки та пропозиції членів групи, остаточно узгодьте й затвердьте політику."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6ddec467576426ca:
    english: "**General Assembly** - Organize, prepare and run a formal meeting including all members, to deliberate and make decisions on strategic matters."
    translation: "**Провести загальні збори** - Організуйте та проведіть офіційну зустріч усіх членів групи для обговорення стратегічних питань і ухвалення рішень."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8d32bb446c4ca025:
    english: "### Self-organizing working teams"
    translation: "### Самоорганізовані робочі команди"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  87ab6b2d51a7c1b6:
    english: "**Share information** - Post information and reports of interest to your team, invite comment and discussion."
    translation: "**Поділитися інформацією** - Опублікуйте інформацію та звіти, важливі для вашої команди, і запросіть її до обговорення."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e93205aa183cd1e0:
    english: "**Progress work** - Outline a work task and seek advice, input and feedback from team members through to completion."
    translation: "**Просувати роботу** - Опишіть завдання й отримуйте поради, пропозиції та відгуки членів команди до його завершення."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1ddaef5d44653691:
    english: "**Meeting notes and actions** - Post meeting notes as a record of discussion, and follow up on tasks. "
    translation: "**Нотатки із зустрічі та завдання** - Опублікуйте нотатки із зустрічі, щоб зберегти перебіг обговорення, і відстежуйте виконання завдань."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8ce9169d72c90788:
    english: "**Explore ideas** - Share thoughts and invite discussion about a concern you notice, or an improvement that can be made."
    translation: "**Дослідити ідеї** - Поділіться думками й запросіть до обговорення проблеми, яку ви помітили, або можливого поліпшення."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a06e734e86f07828:
    english: "**Advice, Consent and Generative decision making** - Prepare, propose, clarify, respond to reactions and objections, agree and implement - all within a Loomio discussion."
    translation: "**Ухвалювати рішення через поради, згоду та спільне напрацювання** - Підготуйте пропозицію, уточніть її, дайте відповіді на реакції та заперечення, досягніть згоди й утільте рішення — усе в одному обговоренні Loomio."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
