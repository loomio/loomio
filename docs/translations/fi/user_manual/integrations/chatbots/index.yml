  290b36f9178272e2:
    english: |-
      Our webhook based system can also be used to support other systems that support incoming webhooks with either HTML or Markdown formatting. This could be something like Zapier or Rocketchat.
      Just select the mattermost bot, but use a custom webhook URL.
    translation: |-
      Webhook-järjestelmää voi käyttää myös muiden saapuvia webhookeja tukevien palvelujen kanssa, jos ne tukevat HTML- tai Markdown-muotoilua. Tällaisia palveluja ovat esimerkiksi Zapier ja Rocketchat.
      Valitse Mattermost-botti ja käytä omaa webhook-URL:ää.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f76c44196c94dcef:
    english: "## Set up a chat integration"
    translation: "## Määritä chat-integraatio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3c63f567f90fd1eb:
    english: |-
      After configuring your chosen service (see above), you'll have a webhook URL.
      Open **Chat integrations** from the group menu and add a new chat integration for your group.
    translation: |-
      Kun olet määrittänyt valitsemasi palvelun edellä olevien ohjeiden mukaan, saat webhook-URL:n.
      Avaa ryhmävalikosta **Chat-integraatiot** ja lisää ryhmällesi uusi chat-integraatio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
