  a1b7f7b282933a3c:
    english: 'You must be an admin of the group to export it. The JSON export includes:'
    translation: 'Debes ser administrador del grupo para exportarlo. La exportación JSON incluye:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6a0b307d50fa35cf:
    english: |-
      - The group, its members and membership requests
      - Threads, comments, reactions, tags, templates, notifications and related records from the included groups
      - Polls, options, votes and outcomes; an anonymous poll is included only after it has closed
      - Subgroups you belong to
      - Open and closed subgroups when you export their parent group as a parent group admin, even if you do not belong to those subgroups
      - References to files and images attached to the included content
    translation: |-
      - El grupo, sus miembros y las solicitudes de ingreso
      - Hilos, comentarios, reacciones, etiquetas, plantillas, notificaciones y registros relacionados de los grupos incluidos
      - Sondeos, opciones, votos y conclusiones; los sondeos anónimos solo se incluyen después de cerrarse
      - Los subgrupos a los que perteneces
      - Los subgrupos abiertos y cerrados cuando exportas el grupo principal como administrador de ese grupo, aunque no pertenezcas a esos subgrupos
      - Referencias a los archivos e imágenes adjuntos al contenido incluido
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4dee92f966ec24c9:
    english: 'The JSON export does not include:'
    translation: 'La exportación JSON no incluye:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a40deeed41d9937e:
    english: |-
      - Secret subgroups you do not belong to, including their membership and content
      - Subgroups awaiting deletion
      - Anonymous polls that have not closed
      - Direct threads and polls that do not belong to the group
    translation: |-
      - Los subgrupos secretos a los que no perteneces, incluidos sus miembros y contenido
      - Los subgrupos pendientes de eliminación
      - Los sondeos anónimos que aún no se han cerrado
      - Los hilos y sondeos directos que no pertenecen al grupo
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
