  e19d687b56819302:
    english: Hi! I'm Alanna.
    translation: Olá! Sou Alanna.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  10352ad196487ff3:
    english: I'm one of the founders of Loomio, and I've been thinking deeply about how it works from a facilitation perspective since the beginning. I am not a seminal facilitation expert; I consider myself only a beginner in this craft that one could spend a lifetime honing.
    translation: Sou uma das fundadoras do Loomio e, desde o início, reflito sobre seu funcionamento sob a perspectiva da facilitação. Não sou uma grande referência na área. Considero-me apenas iniciante em uma prática que se pode aperfeiçoar ao longo de toda a vida.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c637c96f9723f02d:
    english: What I can offer is help translating between the offline and online spaces, as a practitioner in both. I've facilitated a lot of groups who use Loomio, and learned from their experiences.
    translation: Como atuo nos dois ambientes, posso ajudar a levar práticas de facilitação do presencial para o on-line e vice-versa. Facilitei muitos grupos que usam o Loomio e aprendi com suas experiências.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c376e38821fb6c2f:
    english: You can find out [more about me on my website](http://alanna.space).
    translation: Você pode saber [mais sobre mim no meu site](http://alanna.space).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b893957534fa37e2:
    english: I'm only one person, with one perspective and approach to facilitation, when there are myriad approaches. I've tried to bring in a couple other facilitator's voices here, including [Rich](http://richdecibels.com/) from Loomio and Silvia from [EXP](http://exp.agency).
    translation: Sou apenas uma pessoa, com uma perspectiva e uma forma de facilitar entre muitas possíveis. Procurei incluir aqui as vozes de outras pessoas que trabalham com facilitação, como [Rich](http://richdecibels.com/), do Loomio, e Silvia, da [EXP](http://exp.agency).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
