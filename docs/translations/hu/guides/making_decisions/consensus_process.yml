      When the Sense check proposal closes, Vivien states an outcome and notifies everyone about the results and what will happen next.
      Vivien facilitates a discussion to address concerns and modify the Brand Concept document.
    translation: |-
      Amikor az Érzékellenőrzés típusú javaslat lezárul, Vivien közzéteszi a következtetést, és értesít mindenkit az eredményről és a következő lépésekről.
      Vivien vezeti a vitát az aggályok kezeléséről és az Arculati koncepció dokumentum módosításáról.
