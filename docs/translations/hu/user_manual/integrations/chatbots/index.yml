  a63a4be4a45bcfdb:
    english: If you decide later that you want the integration to receive automatic notifications, return to its settings and select the relevant events.
    translation: Ha később automatikus értesítéseket szeretnél küldeni az integrációval, térj vissza a beállításaihoz, és válaszd ki a megfelelő eseményeket.
