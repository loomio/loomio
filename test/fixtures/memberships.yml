# Membership side of the reusable access-control and notification matrix.
<%
matrix_memberships = {
  member_quiet_membership:         { user: :member_quiet,         group: :group,       volume: 1 },
  member_normal_membership:        { user: :member_normal,        group: :group,       volume: 2 },
  member_loud_membership:          { user: :member_loud,          group: :group,       volume: 3 },
  alien_quiet_membership:          { user: :alien_quiet,          group: :alien_group, volume: 1 },
  alien_loud_membership:           { user: :alien_loud,           group: :alien_group, volume: 3 },
  former_member_loud_membership:   { user: :former_member_loud,   group: :group,       volume: 3, admin: true, revoked: true },
  inactive_member_loud_membership: { user: :inactive_member_loud, group: :group,       volume: 3, admin: true },
  reader_quiet_membership:         { user: :reader_quiet,         group: :group,       volume: 3 },
  reader_normal_membership:        { user: :reader_normal,        group: :group,       volume: 1 },
  reader_loud_membership:          { user: :reader_loud,          group: :group,       volume: 1 },
  member_guest_loud_membership:    { user: :member_guest_loud,    group: :group,       volume: 1 },
  former_member_guest_membership:  { user: :former_member_guest,  group: :group,       volume: 1, revoked: true }
}
%>
<% matrix_memberships.each do |fixture, attributes| %>
<%= fixture %>:
  user: <%= attributes[:user] %>
  group: <%= attributes[:group] %>
  token: <%= fixture %>_token
  accepted_at: <%= 30.days.ago %>
  admin: <%= attributes.fetch(:admin, false) %>
  volume_email: <%= attributes[:volume] %>
  volume_push: <%= attributes[:volume] %>
<% if attributes[:revoked] %>
  revoked_at: <%= 1.day.ago %>
  revoker_id: <%= ActiveRecord::FixtureSet.identify(:admin) %>
<% end %>

# Membership rows for the lifecycle-cleanup group matrix.
orphan_group_tree_membership:
  user: member_quiet
  group: orphan_group_tree
  token: orphan_group_tree_membership
  accepted_at: <%= 2.years.ago %>

orphan_subgroup_membership:
  user: member_quiet
  group: orphan_subgroup
  token: orphan_subgroup_membership
  accepted_at: <%= 2.years.ago %>

used_revoked_membership:
  user: former_member_loud
  group: used_revoked_membership_subgroup
  token: used_revoked_membership
  accepted_at: <%= 2.years.ago %>
  revoked_at: <%= 1.year.ago %>

used_multiple_members_first:
  user: member_quiet
  group: used_multiple_members_group
  token: used_multiple_members_first
  accepted_at: <%= 2.years.ago %>

used_multiple_members_second:
  user: member_normal
  group: used_multiple_members_group
  token: used_multiple_members_second
  accepted_at: <%= 2.years.ago %>
  created_at: <%= 30.days.ago %>
  updated_at: <%= 1.day.ago %>

<% end %>
