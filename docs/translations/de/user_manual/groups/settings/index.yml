  0b8776f3657a1add:
    english: Group settings control how your group is presented, who can find and join it, and what members are allowed to do. Only group administrators can edit these settings.
    translation: In den Gruppeneinstellungen legst du fest, wie deine Gruppe dargestellt wird, wer sie finden und ihr beitreten kann und was Mitglieder tun dürfen. Nur Gruppenadministratoren können diese Einstellungen bearbeiten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  306f2b79029e2196:
    english: On the group page, open the actions menu and select **Edit group settings**.
    translation: Öffne auf der Gruppenseite das Aktionsmenü und wähle **Gruppeneinstellungen bearbeiten**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
