navigation_title: Processo simples de decisão
blocks:
  84ddd86a61d09414:
    english: "# Simple decision process"
    translation: "# Processo simples de decisão"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2e868ae6bc4a493b:
    english: This guide describes an end-to-end process using a discussion, Sense check, final proposal, and outcome. For help with the fields and response options of one proposal, see [Proposals](/en/user_manual/polls/proposals/).
    translation: Este guia apresenta um processo completo com uma discussão, uma Verificação de sentido, uma proposta final e uma conclusão. Para saber mais sobre os campos e as opções de resposta de uma proposta, consulte [Propostas](/en/user_manual/polls/proposals/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d9877680762afa22:
    english: Some organizations arrive at Loomio having already developed a deep culture and practice of collaborative decision making.  Such organizations have often written handbooks and codified their practices, however, most organizations are still on the journey and looking for some helpful first steps towards making better decisions together.  If the burning question in your organization is **how do we make decisions together?**, then this guide is for you.
    translation: Algumas organizações chegam ao Loomio com uma prática consolidada de tomar decisões em conjunto. Muitas já registraram essa prática em manuais. Outras ainda procuram os primeiros passos para tomar decisões melhores em grupo. Se sua organização se pergunta **como podemos tomar decisões em conjunto?**, este guia pode ajudar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6b321a0ba71f92b8:
    english: "***Here are three steps to help you co-create a better, more cohesive decision with less stress and anxiety.***"
    translation: "***Estas três etapas ajudam seu grupo a construir uma decisão melhor e mais coesa, com menos tensão e ansiedade.***"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c46b32b56b933b0a:
    english: "## Simple decision making - in 3 steps"
    translation: "## Como tomar decisões em 3 etapas"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e3208a84f88ba36f:
    english: Good collaborative decisions rarely happen by themselves.  They almost always benefit from someone facilitating the discussion through to decision.  So when you launch a discussion thread, you take on a facilitation role (unless someone else is facilitating).
    translation: Boas decisões colaborativas raramente acontecem por conta própria. Em geral, alguém precisa facilitar a discussão até chegar a uma decisão. Ao iniciar uma discussão, você assume esse papel, a menos que outra pessoa esteja facilitando.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1a1da8788ddb01c7:
    english: Follow these 3 steps as you facilitate your group to make a good decision.
    translation: Siga estas 3 etapas para ajudar seu grupo a tomar uma boa decisão.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5b83a53a3f4caad5:
    english: |-
      ### Step 1 - Introduce and discuss
      Start a Loomio **discussion** to introduce the topic, open conversation and invite people. Include all the context-setting information your group needs to meaningfully participate, along with relevant background so everyone understands the purpose.
    translation: |-
      ### Etapa 1 - Apresente e discuta
      Inicie uma **discussão** no Loomio para apresentar o assunto, abrir a conversa e convidar as pessoas. Inclua as informações de contexto necessárias para que seu grupo participe e entenda o objetivo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8aab998cb04b8635:
    english: 'Be clear about your objective - what is the decision to be made or intended outcome of the discussion? '
    translation: 'Deixe claro seu objetivo: qual decisão precisa ser tomada ou qual conclusão você espera da discussão?'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d8f53cbae173f5ac:
    english: As the discussion progresses, create space for diverse input - sometimes the best ideas and input come from outside the box.  Work together to explore and test ideas, encouraging a healthy and open discussion.
    translation: À medida que a discussão avança, abra espaço para diferentes contribuições. Algumas das melhores ideias vêm de perspectivas inesperadas. Explore e teste ideias em conjunto, mantendo a discussão aberta e construtiva.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7f447ab455f6cea4:
    english: 'Notice when the same voices are dominating and invite some of the quieter people to contribute by @mentioning them and asking them what they think. '
    translation: Observe se as mesmas pessoas dominam a conversa. Convide quem tem participado menos a contribuir, mencionando essas pessoas com @ e perguntando o que pensam.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d4bad2b5207ac1d8:
    english: You can make a complex discussion easier to engage with by updating the context section with a summary of the key points.
    translation: Para facilitar a participação em uma discussão complexa, atualize a seção de contexto com um resumo dos pontos principais.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  daeddff561f62553:
    english: |-
      ### Step 2 - Sense check
      As your group begins to converge on path forwards, use a **Sense check** poll to survey opinions and test how the group feels.
    translation: |-
      ### Etapa 2 - Verificação de sentido
      Quando seu grupo começar a encontrar um caminho, use uma enquete de **Verificação de sentido** para conhecer as opiniões das pessoas e avaliar como elas veem a proposta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c1d4e97ce180d85b:
    english: |-
      A ‘Sense check’ lets people know a proposal is forming and encourages them to engage.
      It can also be used to clarify an issue, even if the solution might not be apparent yet.
    translation: |-
      Uma ‘Verificação de sentido’ mostra que uma proposta está tomando forma e incentiva a participação.
      Ela também pode ajudar a esclarecer uma questão, mesmo que a solução ainda não esteja clara.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5ff914227bb8706a:
    english: Sense check is a great way to surface concerns before moving to a formal agreement.  You can find out if people are happy with where this is going, if they have questions or need more time, or if they are concerned.
    translation: A Verificação de sentido ajuda a identificar preocupações antes de buscar um acordo formal. Você pode descobrir se as pessoas concordam com o rumo da discussão, se têm dúvidas, se precisam de mais tempo ou se estão preocupadas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  01433544fefb70a5:
    english: 'Use feedback to improve and refine the proposal. If there’s still some work to do, you may need to go back to Step 1 and then run another Sense check round. '
    translation: Use as contribuições para melhorar e refinar a proposta. Se ainda houver questões a resolver, talvez seja preciso voltar à Etapa 1 e fazer outra rodada de Verificação de sentido.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  440474199fd76019:
    english: Good engagement will help you assess when you are ready to proceed to a proposal.
    translation: A participação do grupo ajudará você a avaliar quando é hora de apresentar uma proposta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f3799fd76f9d9446:
    english: "### Step 3 - Proposal\nNow when you raise a formal **Proposal**, you do so with confidence that it will pass. "
    translation: |-
      ### Etapa 3 - Proposta
      Agora você pode apresentar uma **Proposta** formal com confiança de que ela será aprovada.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a3e74110f5a3c7a2:
    english: There may have been a lot of discussion and variations suggested, so be specific about the decision being made, so that everyone knows what the voting options mean.
    translation: Depois de muita discussão, podem existir diferentes versões da ideia. Descreva com precisão a decisão proposta para que todos entendam o significado das opções de voto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b7581cfd1ecffd78:
    english: Set proposal deadlines consciously, so group members have time to consider and engage.  You can always extend the closing date if need be.
    translation: Defina o prazo da proposta com cuidado para que os membros do grupo tenham tempo de avaliar e participar. Se necessário, você pode prorrogar a data de encerramento.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b5bcc06f15cde560:
    english: This step is important to formalize agreement with people’s vote and to state an outcome - what just happened and what will happen next.
    translation: 'Esta etapa formaliza o acordo por meio dos votos e registra uma conclusão: o que aconteceu e quais são os próximos passos.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c2f2bbcacfd77ab0:
    english: Proposal results are logged, along with a record of the discussion leading to the decision.
    translation: Os resultados da proposta ficam registrados junto com a discussão que levou à decisão.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2d82209e751f2ffa:
    english: |-
      ### Outcome
      When a Loomio poll closes, you will be prompted to set an **outcome** to let everyone know what happened and what is going to happen next.
    translation: |-
      ### Conclusão
      Quando uma enquete do Loomio for encerrada, você receberá uma solicitação para registrar uma **conclusão** e informar a todos o que aconteceu e quais são os próximos passos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fb14b31115927d74:
    english: "## Proposals can help in many situations"
    translation: "## Propostas podem ajudar em muitas situações"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c1a27b25e2c01ff3:
    english: 'Don''t hesitate to start a proposal just because you''re not sure everyone will agree - proposals are not only for when you have consensus, they''re designed to surface issues that need resolving and are useful for clarifying disagreements. '
    translation: Você pode iniciar uma proposta mesmo sem ter certeza de que todos vão concordar. As propostas também ajudam a identificar questões que precisam ser resolvidas e a esclarecer divergências.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6dbf0f3af984b8e8:
    english: The next pages show a few more complex processes for reaching decisions, through [advice](/en/guides/making_decisions/advice_process), [consent](/en/guides/making_decisions/consent_process ), or [consensus](/en/guides/making_decisions/consensus_process ).
    translation: As próximas páginas apresentam processos mais complexos para tomar decisões por meio de [aconselhamento](/en/guides/making_decisions/advice_process), [consentimento](/en/guides/making_decisions/consent_process ) ou [consenso](/en/guides/making_decisions/consensus_process ).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
