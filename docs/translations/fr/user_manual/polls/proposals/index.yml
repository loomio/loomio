  ca5b9583bfe78b65:
    english: A proposal asks people to respond to a statement or course of action. Participants choose a defined response and can explain their vote. Use a proposal to gather feedback, seek advice, identify objections, or test for agreement.
    translation: Une proposition invite les personnes à réagir à une affirmation ou à une action envisagée. Les participants choisissent une réponse parmi les options définies et peuvent expliquer leur vote. Utilisez une proposition pour recueillir des avis, demander conseil, repérer des objections ou vérifier si un accord se dégage.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  143dc77c58a4c881:
    english: This section helps you choose and run Loomio's default proposal templates. For a complete sequence of discussion, proposals, amendments, and outcome, use the [decision-making guides](/en/guides/making_decisions/). To change the templates available to your group, see [Poll templates](../poll_templates/).
    translation: Cette section vous aide à choisir et à utiliser les modèles de proposition proposés par défaut dans Loomio. Pour suivre toutes les étapes, de la discussion à la conclusion en passant par les propositions et les amendements, consultez les [guides de prise de décision](/en/guides/making_decisions/). Pour modifier les modèles proposés à votre groupe, consultez les [Modèles de sondage](../poll_templates/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e0f8614f95c9c5ff:
    english: "## Choose a proposal template"
    translation: "## Choisir un modèle de proposition"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  525699503edbe342:
    english: |-
      | Template | What it asks | Use it when… |
      |---|---|---|
      | [Sense check](sense_check/) | Is this on the right track? | An idea is still being developed |
      | [Advice](advice/) | What advice should the decision maker consider? | A person or team owns the decision |
      | [Consent](consent/) | Is this safe to try, or is there a meaningful objection? | The group uses consent decision-making |
      | [Consensus](consensus/) | What is your position on this proposal? | The group is seeking collective agreement |
    translation: |-
      | Modèle | Question posée | À utiliser quand… |
      |---|---|---|
      | [Vérification des sens](sense_check/) | Sommes-nous sur la bonne voie ? | Une idée est encore en cours d’élaboration |
      | [Conseil](advice/) | Quels conseils la personne qui prend la décision devrait-elle prendre en compte ? | Une personne ou une équipe est responsable de la décision |
      | [Consentement](consent/) | Peut-on essayer sans risque, ou existe-t-il une objection importante ? | Le groupe prend ses décisions par consentement |
      | [Consensus](consensus/) | Quelle est votre position sur cette proposition ? | Le groupe cherche à parvenir à un accord collectif |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0cb03ac4a22f02b4:
    english: Choose the template whose response options match the question you need answered. Each template page explains its use cases, setup, voting form, and results.
    translation: Choisissez le modèle dont les options de réponse correspondent à la question que vous souhaitez poser. La page de chaque modèle explique quand l’utiliser, comment le configurer, comment voter et comment consulter les résultats.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d379b02c308b3b55:
    english: "## Other proposal templates"
    translation: "## Autres modèles de proposition"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  44cdb16aebf757ca:
    english: Loomio also provides templates such as Proposal, Gradients of agreement, Question round, and Majority. Some are hidden initially. Group administrators can make them available or create a template for the group's own terminology and rules from [Poll templates](../poll_templates/).
    translation: Loomio propose aussi des modèles comme Proposition, Gradients d’accord, Tour de questions et Majorité. Certains sont masqués au départ. Les administrateurs du groupe peuvent les rendre disponibles ou créer un modèle adapté aux termes et aux règles du groupe depuis les [Modèles de sondage](../poll_templates/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ca179ba4cb53c5e3:
    english: "## Proposal records"
    translation: "## Historique des propositions"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  460a90e796fc4dc0:
    english: Votes and reasons update while the proposal is open, and participants can change their response. After it closes, publish an [outcome](../outcomes/) that states the decision or next step. The discussion, proposal, votes, reasons, and outcome form a record of how the group reached its decision.
    translation: Les votes et leurs motifs sont mis à jour tant que la proposition est ouverte, et les participants peuvent modifier leur réponse. Une fois la proposition close, publiez une [conclusion](../outcomes/) qui indique la décision ou la prochaine étape. La discussion, la proposition, les votes, leurs motifs et la conclusion constituent un historique de la façon dont le groupe a pris sa décision.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
