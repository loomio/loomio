  7fe42bee753b558d:
    english: "`/api/b3` is for server-level operations. Use `/api/b2` for user-oriented actions performed as a Loomio user account."
    translation: "`/api/b3` é usada para operações no nível do servidor. Use `/api/b2` para ações realizadas por meio de uma conta de usuário do Loomio."
