---
navigation_title: Ваш профиль
blocks:
  7ac59f9506d9a9e9:
    english: "# Your Profile\nYour Loomio user profile is how people recognize you.  "
    translation: |-
      # Ваш профиль
      По вашему профилю в Loomio другие люди узнают вас.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f77b75330707f9a4:
    english: Being able to recognize people in Loomio helps build trust and authenticity, encouraging more genuine participation.  So wherever possible we encourage you to be you, and to add a photo or avatar.
    translation: Когда люди узнают друг друга в Loomio, им проще доверять друг другу и открыто участвовать в работе группы. По возможности укажите своё имя и добавьте фотографию или аватар.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e902d9db69f3ccaa:
    english: "## Edit profile"
    translation: "## Редактирование профиля"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f48def44ceb36407:
    english: 'Your profile page lets you customize your Loomio identity. To visit your profile page select the **Edit profile** option in the user menu, which is found by clicking on your name at the top of the sidebar. '
    translation: На странице профиля вы можете указать сведения о себе. Чтобы открыть её, нажмите своё имя в верхней части боковой панели и выберите **Редактировать профиль**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  456daa472d672b1f:
    english: If the sidebar is closed, click on the menu icon (**☰**) to open it.
    translation: Если боковая панель закрыта, нажмите значок меню (**☰**), чтобы открыть её.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7b920b3794ac1be0:
    english: Click on the down arrow to the right of your name.
    translation: Нажмите стрелку вниз справа от своего имени.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9664aeb8784b2137:
    english: Click on **Edit profile**
    translation: Нажмите **Редактировать профиль**
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e98e7384d147ec31:
    english: "## Update your personal info"
    translation: "## Обновление личных данных"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9578a723a8d322cc:
    english: 'You can update your personal info by changing any of the following fields:'
    translation: 'Вы можете изменить следующие данные:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cc28d4b1038e6fe5:
    english: |-
      * **Name**
      * **Email address** - this is the email address associated with your Loomio account, and where you will receive notifications from Loomio.
      * **Username** - your username is a name people can recognize and alert you using @mention. It can contain lower case letters, numbers, underscores, and internal hyphens.
      * **Introduction** - a few lines to tell others in your group something about you.
      * **Location** - useful for distributed or remote groups so people can get an idea of where you are located.
    translation: |-
      * **Имя**
      * **Электронный адрес** — адрес, связанный с вашей учётной записью Loomio. На него будут приходить уведомления.
      * **Имя пользователя** — имя, по которому вас могут узнать и упомянуть с помощью @mention. Оно может содержать строчные буквы, цифры, знаки подчёркивания и дефисы внутри имени.
      * **Введение** — несколько строк, чтобы рассказать участникам группы о себе.
      * **Расположение** — помогает участникам распределённых и удалённых групп узнать, где вы находитесь.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d64106bb76c8936e:
    english: "## Viewing another person's profile"
    translation: "## Просмотр профиля другого человека"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fa6b7c980bad9aeb:
    english: Select a person's name or avatar to open their profile. Their recent discussions, comments, and polls are listed alongside their profile details and groups. The list only includes activity you have permission to access; signed-out visitors see public activity only.
    translation: Нажмите имя или аватар человека, чтобы открыть его профиль. Рядом со сведениями о нём и его группами указаны недавние обсуждения, комментарии и опросы. В списке показаны только действия, к которым у вас есть доступ. Посетители, не вошедшие в систему, видят только общедоступные действия.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ac9abf23a4881216:
    english: "## Uploading a profile photo\nWhen you first create a Loomio account, your initials will be the default image associated with your profile. You can upload a profile photo by clicking on your picture on the profile page. "
    translation: |-
      ## Загрузка фотографии профиля
      После создания учётной записи Loomio вместо фотографии профиля по умолчанию отображаются ваши инициалы. Чтобы загрузить фотографию, нажмите на своё изображение на странице профиля.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b011f45bc197558a:
    english: If you have a [Gravatar](https://en.gravatar.com/) you can set that as your profile picture by selecting **Use Gravatar**. You can also choose for Loomio to use the photo you use for other common platforms/tools.
    translation: Если у вас есть [Gravatar](https://en.gravatar.com/), выберите **Используйте Граватар**, чтобы установить его в качестве фотографии профиля. Вы также можете разрешить Loomio использовать фотографию из других распространённых сервисов.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  41f1c139f9a0822b:
    english: |-
      ## Language settings
      Loomio is developed in English, but [is translated by volunteers into many languages](https://www.loomio.com/g/cpaM3Hsv/loomio-community-translation).
    translation: |-
      ## Настройки языка
      Loomio разрабатывается на английском языке, но [добровольцы переводят его на многие языки](https://www.loomio.com/g/cpaM3Hsv/loomio-community-translation).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9faad78d2b46c546:
    english: Loomio will detect your browser’s language settings, but you can manually set your preferred language from the available options on the profile page.
    translation: Loomio определяет языковые настройки вашего браузера. Вы также можете выбрать язык вручную на странице профиля.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a224dd4aaaf81381:
    english: |-
      ## Resetting your password
      You can change your password by visiting your profile page and clicking **Reset Password**.
    translation: |-
      ## Смена пароля
      Чтобы сменить пароль, откройте страницу профиля и нажмите **Сбросить пароль**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
