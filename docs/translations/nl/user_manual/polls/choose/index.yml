navigation_title: Kiezen
blocks:
  581de5d50d3dc442:
    english: "# Choose"
    translation: "# Kiezen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  733b320e0407fbdc:
    english: Choose is a simple poll for finding the most popular option or making a shortlist. Participants select one or more options, depending on the limits you set. This voting method is commonly known as multiple choice.
    translation: Kiezen is een eenvoudige peiling om de populairste optie te vinden of een selectie te maken. Deelnemers kiezen één of meer opties, afhankelijk van de grenzen die je instelt. Deze stemmethode staat bekend als meerkeuze.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '09aefb579b50874b':
    english: "## When to use Choose"
    translation: "## Wanneer gebruik je Kiezen?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  be35cf72fcaf9c4d:
    english: 'Use Choose when the options are distinct and you need to count how many people select each one. It works well for:'
    translation: 'Gebruik Kiezen als de opties duidelijk van elkaar verschillen en je wilt tellen hoeveel mensen elke optie kiezen. Het werkt goed voor:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dcc6f6b9238155b2:
    english: |-
      - choosing one venue from a shortlist;
      - selecting up to three topics for an agenda;
      - deciding which design should proceed to the next round; or
      - checking which services members intend to use.
    translation: |-
      - één locatie kiezen uit een selectie;
      - maximaal drie onderwerpen kiezen voor een agenda;
      - bepalen welk ontwerp doorgaat naar de volgende ronde; of
      - nagaan welke diensten leden willen gebruiken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3770d0653b752de5:
    english: Choose records selections, not the strength or order of a person's preferences. Use [Score](/en/user_manual/polls/score/) to measure how strongly people support every option, [Allocate](/en/user_manual/polls/allocate/) when there is a limited budget, or [Rank](/en/user_manual/polls/rank/) when preference order matters.
    translation: Kiezen registreert welke opties mensen selecteren, niet hoe sterk hun voorkeur is of in welke volgorde ze de opties verkiezen. Gebruik [Score](/en/user_manual/polls/score/) om te meten hoe sterk mensen elke optie steunen, [Toewijzen](/en/user_manual/polls/allocate/) als er een beperkt budget is, of [Rang](/en/user_manual/polls/rank/) als de volgorde van voorkeur belangrijk is.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f15aca327e894f30:
    english: "## Example: set a planning-meeting agenda"
    translation: "## Voorbeeld: de agenda voor een planningsvergadering opstellen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f51e09afa0ed1e53:
    english: Oatmilk Cooperative needs to decide which parts of a returnable-bottle trial need the most time at its next planning meeting. The poll asks each person to choose up to two topics. Its details explain how the result will be used, and each option includes enough information to distinguish it from the others.
    translation: Oatmilk Cooperative moet bepalen welke onderdelen van een proef met herbruikbare flessen tijdens de volgende planningsvergadering de meeste tijd krijgen. De peiling vraagt iedereen maximaal twee onderwerpen te kiezen. In de details staat hoe het resultaat wordt gebruikt. Elke optie bevat genoeg informatie om haar van de andere te onderscheiden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c74ebb16f872b3c6:
    english: "## Set up the poll"
    translation: "## De peiling instellen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  abc749fec8671661:
    english: Give the poll a specific question as its title. In **Details**, explain what participants should consider and what will happen with the result. Add each available option, then set the **Minimum choices** and **Maximum choices**.
    translation: Geef de peiling een concrete vraag als titel. Leg bij **Details** uit waar deelnemers rekening mee moeten houden en wat er met het resultaat gebeurt. Voeg alle beschikbare opties toe en stel daarna **Minimale keuzes** en **Maximale keuzes** in.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e878ddc9f61dd243:
    english: Set both limits to 1 when participants must choose exactly one option. Set a higher maximum when you want a shortlist. Avoid allowing so many choices that participants can select nearly every option, because that makes the result less useful.
    translation: Stel beide grenzen in op 1 als deelnemers precies één optie moeten kiezen. Stel een hoger maximum in als je een selectie wilt maken. Zorg dat deelnemers niet bijna alle opties kunnen kiezen. Anders zegt het resultaat minder.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  152fec5018fc232b:
    english: Use the pencil icon beside an option to add a meaning or further explanation. This is useful when a short option name could be interpreted in different ways.
    translation: Gebruik het potloodpictogram naast een optie om toe te lichten wat die betekent. Dit is handig als een korte optienaam op verschillende manieren kan worden opgevat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  59e405cf9a028c8d:
    english: Under **More settings**, **Show options in random order** can reduce the effect of always presenting one option first.
    translation: Onder **Meer instellingen** kan **Opties in willekeurige volgorde weergeven** het effect verminderen van steeds dezelfde optie als eerste tonen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Stemmen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7db2d0e58e5fb4e4:
    english: The vote form tells participants how many options they may select. In this example, the voter selects **Cafe collection schedule** and **Washing workflow**, then gives a reason connecting those choices to the trial.
    translation: Het stemformulier laat deelnemers zien hoeveel opties ze mogen kiezen. In dit voorbeeld kiest de stemmer **Schema voor het ophalen van flessen bij cafés** en **Werkwijze voor het wassen**. Daarna licht die toe hoe deze keuzes verband houden met de proef.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e55e4b8950a5fd46:
    english: A reason can reveal why an option matters and what work participants expect it to cover. If reasons are important to the decision, configure the vote-reason setting before starting the poll.
    translation: Een toelichting kan duidelijk maken waarom een optie belangrijk is en welk werk deelnemers erbij verwachten. Als toelichtingen belangrijk zijn voor de beslissing, stel dan vóór de start van de peiling in dat stemmers een reden moeten geven.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## De resultaten bekijken"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c1ec47f66384e3bb:
    english: The results show the share of all selections received by each option, the number of voters who selected it, and who has not voted. Because each person could choose two options, the percentages describe selections rather than a percentage of people.
    translation: De resultaten tonen welk aandeel van alle gemaakte keuzes elke optie kreeg, hoeveel stemmers die optie kozen en wie nog niet heeft gestemd. Omdat iedereen twee opties kon kiezen, gaan de percentages over keuzes en niet over het percentage mensen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6cbc0f9d6fdf6727:
    english: In this example, **Cafe collection schedule** has three selections. **Washing workflow** and **Return-rate reporting** each have two. The result supports giving cafe collections the most agenda time, but the tied topics still require the organizer to decide how the remaining time is divided.
    translation: In dit voorbeeld kreeg **Schema voor het ophalen van flessen bij cafés** drie keuzes. **Werkwijze voor het wassen** en **Rapportage over het retourpercentage** kregen er elk twee. Het resultaat ondersteunt het plan om het ophalen bij cafés de meeste agendatijd te geven. De organisator moet nog bepalen hoe de resterende tijd tussen de twee gelijk geëindigde onderwerpen wordt verdeeld.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  adb7eb28e16616be:
    english: When the poll closes, publish an **Outcome** explaining what the group will do with the result.
    translation: Publiceer na het sluiten van de peiling een **Conclusie** waarin je uitlegt wat de groep met het resultaat gaat doen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
