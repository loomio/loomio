navigation_title: Oma profiili
blocks:
  7ac59f9506d9a9e9:
    english: "# Your Profile\nYour Loomio user profile is how people recognize you.  "
    translation: |-
      # Oma profiili
      Loomio-profiilisi auttaa muita tunnistamaan sinut.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f77b75330707f9a4:
    english: Being able to recognize people in Loomio helps build trust and authenticity, encouraging more genuine participation.  So wherever possible we encourage you to be you, and to add a photo or avatar.
    translation: Kun ihmiset tunnistavat toisensa Loomiossa, heidän on helpompi luottaa toisiinsa ja osallistua keskusteluun omana itsenään. Lisää profiiliisi kuva tai avatar, jos mahdollista.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e902d9db69f3ccaa:
    english: "## Edit profile"
    translation: "## Muokkaa profiilia"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f48def44ceb36407:
    english: 'Your profile page lets you customize your Loomio identity. To visit your profile page select the **Edit profile** option in the user menu, which is found by clicking on your name at the top of the sidebar. '
    translation: Profiilisivulla voit muokata sitä, miten näyt muille Loomiossa. Avaa profiilisivusi valitsemalla **Muokkaa profiilia** käyttäjävalikosta. Avaa valikko napsauttamalla nimeäsi sivupalkin yläosassa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  456daa472d672b1f:
    english: If the sidebar is closed, click on the menu icon (**☰**) to open it.
    translation: Jos sivupalkki on suljettu, avaa se napsauttamalla valikkokuvaketta (**☰**).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7b920b3794ac1be0:
    english: Click on the down arrow to the right of your name.
    translation: Napsauta nimesi oikealla puolella olevaa alanuolta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9664aeb8784b2137:
