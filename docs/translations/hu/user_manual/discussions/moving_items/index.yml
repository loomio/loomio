---
navigation_title: Elemek áthelyezése témák között
blocks:
  875a42e08000fffe:
    english: "# Moving items between threads"
    translation: "# Elemek áthelyezése témák között"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5c0fcd38f9276e8f:
    english: Move selected items when a conversation belongs in another thread, when one thread has split into separate topics, or when you want to combine related discussions. There is no separate **Merge discussions** command.
    translation: Áthelyezheted a kiválasztott elemeket, ha a beszélgetés másik témába tartozik, ha egy témából több külön téma alakult ki, vagy ha össze szeretnél vonni kapcsolódó beszélgetéseket. Nincs külön **Beszélgetések összevonása** parancs.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f43c7835d05a135e:
    english: The option is available to group admins and to members when **Members can manage discussions and comments** is enabled in [Group permissions](/en/user_manual/groups/settings/permissions).
    translation: Ez a lehetőség a csoport adminisztrátorainak érhető el, valamint a tagoknak is, ha az **A tagok kezelhetik a beszélgetéseket és a hozzászólásokat** beállítás engedélyezve van a [csoport jogosultságainál](/en/user_manual/groups/settings/permissions).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  30a4e31dab983f89:
    english: Open the three-dot menu (**⋯**) on an item and select **Move item**.
    translation: Nyisd meg az elem hárompontos menüjét (**⋯**), majd válaszd az **Elem mozgatása** lehetőséget.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  24fd0043effa14fb:
    english: Select the items you want to move.
    translation: Válaszd ki az áthelyezni kívánt elemeket.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  81551cd5134f24c5:
    english: Select any additional items with the checkboxes, then click **Move** in the banner at the top of the discussion.
    translation: A jelölőnégyzetekkel további elemeket is kiválaszthatsz. Ezután kattints a beszélgetés tetején megjelenő sávban a **Mozgat** gombra.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f53055845c214b05:
    english: Choose the group or subgroup, then search for the destination discussion.
    translation: Válaszd ki a csoportot vagy alcsoportot, majd keresd meg a célként szolgáló beszélgetést.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  19bc2092ac28011b:
    english: To move the items into a new discussion, select **New discussion** and add its title and context.
    translation: Ha új beszélgetésbe szeretnéd áthelyezni az elemeket, válaszd az **Új beszélgetés** lehetőséget, majd add meg a címet és a leírást.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '092b56e69505636f':
    english: The items are moved from the original thread into the selected or newly created thread.
    translation: Az elemek az eredeti témából a kiválasztott vagy újonnan létrehozott témába kerülnek.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  162c0d0c47ca798f:
    english: If the original thread is no longer needed, you can [lock it](/en/user_manual/discussions/using_discussions/#lock-or-unlock-a-thread). Delete it only if you are certain it will not be needed again.
    translation: Ha az eredeti témára már nincs szükség, [zárolhatod](/en/user_manual/discussions/using_discussions/#lock-or-unlock-a-thread). Csak akkor töröld, ha biztos vagy benne, hogy később sem lesz rá szükség.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
