  a4f66c4c94afa135:
    english: The request timeout is five seconds. A `2xx` response, including `204 No Content`, is treated as successful. Webhook consumers should respond promptly, process longer work asynchronously, and tolerate duplicate or out-of-order deliveries.
    translation: O tempo limite da requisição é de cinco segundos. Uma resposta `2xx`, incluindo `204 No Content`, é considerada bem-sucedida. O serviço que recebe o webhook deve responder rapidamente, processar tarefas demoradas de forma assíncrona e aceitar envios duplicados ou fora de ordem.
