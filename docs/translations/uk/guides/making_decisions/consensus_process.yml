  223c90e3fe5b24d7:
    english: "> *“Consensus is the process – a participatory process by which a group thinks and feels together, en route to their decision.” - Sam Kaner, Community at Work*"
    translation: "> *«Консенсус — це процес участі, у якому група спільно думає й відчуває, рухаючись до рішення». — Сем Канер, Community at Work*"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9872b82ded022524:
    english: |-
      ## Key points
      - Discuss and develop a proposal together
      - Include and respect everyone involved
      - Seek agreement from most people
    translation: |-
      ## Основне
      - Обговорюйте й розробляйте пропозицію разом
      - Залучайте всіх і поважайте думку кожного
      - Прагніть згоди більшості
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a1cd3fa440013e0c:
    english: "**Consensus is typically used in:**\n- Working teams building shared understanding of an issue or opportunity, collaborating on a proposal and deciding course of action. \n- Governance board decisions where the board shows it is acting jointly, such as decisions on vision, policy, strategic planning and budget.\n- AGMs and General Assemblies where members and stakeholders seek general agreement for major decisions, such as revisions to statutes, major transactions and the elections of directors or council members."
    translation: |-
      **Консенсус зазвичай використовують:**
      - Робочі команди, які формують спільне розуміння проблеми або можливості, разом розробляють пропозицію та визначають подальші дії.
      - Керівні ради, коли ухвалюють спільні рішення щодо бачення, політик, стратегічного планування та бюджету.
      - Щорічні загальні збори та загальні асамблеї, де учасники й зацікавлені сторони прагнуть загальної згоди щодо важливих рішень, як-от зміни статуту, великі угоди та вибори членів правління чи ради.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7c5d3122a1333ba5:
    english: |-
      **Typical roles:**
      - Appoint a facilitator.  In board meetings this is usually the Chairperson.
      - A quorum or supermajority of members to participate, as specified in the organization's statutes.
    translation: |-
      **Типові ролі та умови участі:**
      - Призначте фасилітатора. На засіданнях ради цю роль зазвичай виконує голова.
      - Забезпечте участь кворуму або кваліфікованої більшості учасників, як передбачено статутом організації.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1d8ee54aa5e87423:
    english: |-
      ## Consensus process steps
      1. State the issue to be decided - start a Loomio **discussion**.
      2. Present a proposal to test for consensus - start a **Sense check proposal**.
      3. Clarify any points, invite constructive modifications and amend the proposal.
      4. Test for agreement - start a **Consensus proposal**.
      5. Outcome - state the decision **outcome**.
    translation: |-
      ## Етапи процесу консенсусу
      1. Сформулюйте питання, яке потрібно вирішити, — розпочніть **обговорення** в Loomio.
      2. Представте пропозицію, щоб перевірити можливість консенсусу, — запустіть **пропозицію для попередньої перевірки**.
      3. Уточніть незрозумілі моменти, запросіть конструктивні зміни та доопрацюйте пропозицію.
      4. Перевірте, чи є згода, — запустіть **пропозицію для досягнення консенсусу**.
      5. Опублікуйте **висновок** щодо ухваленого рішення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0b5249cfd4c92c35:
    english: |-
      ## Benefits
      - Grow shared understanding.
      - Decisions for the collective will of the group.
      - Encourage people to value the group over their personal preferences.
    translation: |-
      ## Переваги
      - Формує спільне розуміння.
      - Допомагає ухвалювати рішення, що відображають спільну волю групи.
      - Заохочує людей враховувати інтереси групи поряд з особистими уподобаннями.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  55d7d6c48f056550:
    english: "## Applying the Consensus process on Loomio"
    translation: "## Як провести процес консенсусу в Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e50b473237140170:
    english: |-
      | **Consensus process** | **On Loomio** |
      |---|---|
      | You notice a problem or opportunity and take the initiative. |  |
      | **State the issue to be decided**  <br /><br />Provide background information and open a broad ranging discussion to build shared understanding. Look for emerging proposals. | Start a Loomio discussion <br /><br />Name the topic of discussion in the discussion title, and what you hope to achieve. <br /><br />Attach or link to background information. Invite people to ask questions, contribute information and write comments. |
      | **Present a proposal** <br /><br />Test for consensus. | Run a [Sense check proposal](/en/user_manual/polls/proposals/sense_check/). <br /><br />*In the title:* Name the proposal. <br /><br />*In the proposal details:* Clearly frame the proposal and say why it is important.  Include any background information necessary and a link to the proposal.  <br /><br />Invite everyone to respond, and to do so before the proposal closes.  |
      | **Amendment** <br /><br />Discuss, clarify and amend the proposal. <br /><br />Seek to understand and resolve any objections. <br /><br />Invite people objecting to to propose a constructive and practical modification to the proposed decision or course of action. | Facilitate discussion in the thread to address concerns and modify the proposal. |
      | **Agreement** <br /><br />Do you have an agreement?  Check for: <br /><br />Agreement: I support the proposal. <br /><br />Abstain: This decision does not affect me and I am happy with whatever the group decides. <br /><br />Disagreement: Something in the proposal needs to be changed before I can support it. <br /><br />Block: I have a fundamental disagreement with the proposal that cannot be resolved. | Run a [Consensus proposal](/en/user_manual/polls/proposals/consensus/) with the current proposal version. <br /><br />*In the title:* Name the decision to be made. <br /><br />*In the proposal details:* Present the proposal and invite people to vote. <br /><br />Include a clear statement of what agreement means, say 'for this proposal to pass, we need everyone to vote agree' or 'for this proposal to pass, we need 75% of members to agree'.  <br /><br />Ask participants to leave a vote 'Reason' - and if they do not agree to say why, and what needs to change for them to agree. <br /><br />Some organizations also use the Block (or veto) voting option. <br /><br />As voting progresses, respond to comments, post updates, close early, or let the proposal run to conclusion. <br /><br />Participants can *“change vote”* up to proposal close time, say in response to new information that arrives during voting. |
      | **Outcome** <br /><br />State if agreement was reached and the decision that has been made. <br /><br />Implement the decision and plan actions to be taken. | Consider voting results and state the decision made. <br /><br />Summarize results of the process and say what will happen next. <br /><br />If results are inconclusive, you may choose to re-open the discussion and run a new proposal. <br /><br />The outcome statement is an important record of the decision for future reference. |
    translation: |-
      | **Процес консенсусу** | **У Loomio** |
      |---|---|
      | Ви помічаєте проблему або можливість та берете ініціативу на себе. |  |
      | **Сформулюйте питання, яке потрібно вирішити**  <br /><br />Надайте вихідну інформацію та почніть відкрите обговорення, щоб сформувати спільне розуміння. Звертайте увагу на пропозиції, які виникають. | Розпочніть обговорення в Loomio. <br /><br />У назві обговорення вкажіть його тему й те, чого ви сподіваєтеся досягти. <br /><br />Додайте вихідну інформацію або посилання на неї. Запросіть людей ставити запитання, ділитися інформацією та залишати коментарі. |
      | **Представте пропозицію** <br /><br />Перевірте можливість консенсусу. | Запустіть [пропозицію для попередньої перевірки](/en/user_manual/polls/proposals/sense_check/). <br /><br />*У назві:* Назвіть пропозицію. <br /><br />*В описі пропозиції:* Чітко сформулюйте пропозицію та поясніть, чому вона важлива. Додайте потрібну вихідну інформацію та посилання на пропозицію. <br /><br />Запросіть усіх відповісти до завершення пропозиції. |
      | **Доопрацювання** <br /><br />Обговоріть, уточніть і доопрацюйте пропозицію. <br /><br />Спробуйте зрозуміти та усунути заперечення. <br /><br />Запросіть тих, хто заперечує, запропонувати конструктивну й практичну зміну до рішення або плану дій. | Допомагайте вести обговорення в темі, щоб розглянути побоювання та змінити пропозицію. |
      | **Згода** <br /><br />Чи досягнуто згоди? Зверніть увагу на відповіді: <br /><br />Згоден: я підтримую пропозицію. <br /><br />Утриматись: це рішення мене не стосується, і я прийму будь-яке рішення групи. <br /><br />Проти: перш ніж я зможу підтримати пропозицію, у ній потрібно щось змінити. <br /><br />Блокувати: я принципово не згоден із пропозицією, і цю незгоду неможливо усунути. | Запустіть [пропозицію для досягнення консенсусу](/en/user_manual/polls/proposals/consensus/) з поточною версією пропозиції. <br /><br />*У назві:* Вкажіть, яке рішення потрібно ухвалити. <br /><br />*В описі пропозиції:* Представте пропозицію та запросіть людей проголосувати. <br /><br />Чітко поясніть, що означає досягнення згоди. Наприклад: «Щоб пропозицію ухвалили, усі мають проголосувати «Згоден»» або «Щоб пропозицію ухвалили, 75% учасників мають проголосувати «Згоден»». <br /><br />Попросіть учасників пояснити причину свого голосу. Якщо вони не згодні, попросіть зазначити чому і що потрібно змінити, щоб вони могли погодитися. <br /><br />Деякі організації також використовують варіант голосування «Блокувати» (вето). <br /><br />Поки триває голосування, відповідайте на коментарі, публікуйте оновлення, завершіть пропозицію достроково або дочекайтеся встановленого часу завершення. <br /><br />Учасники можуть *«змінити голос»* до завершення пропозиції, наприклад після появи нової інформації під час голосування. |
      | **Висновок** <br /><br />Повідомте, чи досягнуто згоди та яке рішення ухвалено. <br /><br />Виконайте рішення та сплануйте подальші дії. | Розгляньте результати голосування та повідомте про ухвалене рішення. <br /><br />Підсумуйте процес і поясніть, що відбудеться далі. <br /><br />Якщо результати не дають змоги зробити однозначний висновок, ви можете відновити обговорення та запустити нову пропозицію. <br /><br />Опублікований висновок зберігає рішення для подальшого використання. |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  97378a06a382f8a0:
    english: "## Example of a Consensus process on Loomio"
    translation: "## Приклад процесу консенсусу в Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ec691660458e426c:
    english: "### Step 0. You notice a problem or opportunity and take the initiative"
    translation: "### Крок 0. Ви помічаєте проблему або можливість та берете ініціативу на себе"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  960ad433a566ef52:
    english: "*Is the problem or opportunity is worth pursuing?* Vivien noticed it's time to review the Oatmilk Coop brand."
    translation: "*Чи варто займатися цією проблемою або можливістю?* Вів’єн помітила, що настав час переглянути бренд кооперативу Oatmilk Coop."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fed09a0a56e35eb1:
    english: "*Is there a decision to be made?* The governance board has responsibility to approve a new brand concept."
    translation: "*Чи потрібно ухвалити рішення?* За затвердження нової концепції бренду відповідає керівна рада."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  90d8e915824db4db:
    english: "*Does it impact other people and your organization?* Brand impacts on the perception of the co-op and impacts everyone in the organization. "
    translation: "*Чи впливає це на інших людей і вашу організацію?* Бренд впливає на сприйняття кооперативу й стосується всіх в організації."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fda82a609f8773ed:
    english: "### Step 1. State the problem or issue"
    translation: "### Крок 1. Сформулюйте проблему або питання"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c98dda573e480da3:
    english: Vivien starts a Loomio discussion outlining the need to review the organization's brand, inviting participation to develop a new brand concept, and that the approval decision is to be made by the governance board using the consensus process.
    translation: Вів’єн починає обговорення в Loomio. Вона пояснює потребу переглянути бренд організації, запрошує всіх долучитися до розробки нової концепції та повідомляє, що керівна рада ухвалить рішення про її затвердження через процес консенсусу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  37d6cf6c0162e6bb:
    english: "### Step 2. Present a proposal "
    translation: "### Крок 2. Представте пропозицію"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c090241da7a91eb9:
    english: Vivien runs a Sense check proposal to survey opinions to see how people feel about key elements of the brand concept, and test for consensus.   The Sense check proposal lets people know a proposal is forming and encourages them to engage.  It's a good way to surface concerns.
    translation: Вів’єн запускає пропозицію для попередньої перевірки, щоб дізнатися думки людей про основні складники концепції бренду та перевірити можливість консенсусу. Так люди дізнаються, що пропозиція формується, і можуть долучитися. Це також допомагає виявити побоювання.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cc4caeb72841fee5:
    english: "### Step 3. Amendment"
    translation: "### Крок 3. Доопрацювання"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  db11954b34a1697d:
    english: |-
      When the Sense check proposal closes, Vivien states an outcome and notifies everyone about the results and what will happen next.
      Vivien facilitates a discussion to address concerns and modify the Brand Concept document.
    translation: |-
      Коли пропозиція для попередньої перевірки завершується, Вів’єн публікує висновок і повідомляє всім про результати та подальші дії.
      Вів’єн допомагає вести обговорення, щоб розглянути побоювання та змінити документ із концепцією бренду.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c31d7c71eb3c735c:
    english: "### Step 4. Agreement"
    translation: "### Крок 4. Згода"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  39e0039c195ae5f3:
    english: Having completed the latest version of the Brand Concept document, Vivien is now ready to seek approval from the governance board by running a Consensus proposal.
    translation: Після завершення останньої версії документа з концепцією бренду Вів’єн запускає пропозицію для досягнення консенсусу, щоб отримати схвалення керівної ради.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4bf082d10976bc31:
    english: 'Governance board members are invited to vote and approve the Brand Concept.  The board has previously agreed that proposals like this require >75% of members to vote Agree for it to pass. '
    translation: Членів керівної ради запрошують проголосувати за затвердження концепції бренду. Рада раніше погодила, що для ухвалення таких пропозицій понад 75% її членів мають проголосувати «Згоден».
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  feb488e50bdd3834:
    english: This template includes a Block option by default. Block isn't suitable for every group — it can be controversial or misused. If you don't use block in your decision-making process, we recommend editing the template to remove it.
    translation: 'Цей шаблон за замовчуванням містить варіант «Блокувати». Він підходить не кожній групі: його використання може викликати суперечки або зловживання. Якщо ваша група не використовує блокування під час ухвалення рішень, радимо вилучити цей варіант із шаблону.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5130a17b3032bee3:
    english: "### Step 5. Outcome"
    translation: "### Крок 5. Висновок"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  47143ba16ce4a9ff:
    english: 'When the Consensus proposal closes, Vivien states an outcome and notifies everyone that agreement has been reached, and that work to implement the new brand will commence. '
    translation: Коли пропозиція для досягнення консенсусу завершується, Вів’єн публікує висновок і повідомляє всім, що згоди досягнуто й розпочнеться робота над упровадженням нового бренду.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
