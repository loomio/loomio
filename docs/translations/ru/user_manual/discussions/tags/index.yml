  67bc6cfdb2afad04:
    english: |-
      Only parent-group admins can rename, recolor, merge, or delete tags. These
      changes apply throughout the organization, including its subgroups.
    translation: |-
      Только администраторы родительской группы могут переименовывать, перекрашивать, объединять и удалять теги. Эти
      изменения действуют во всей организации, включая её подгруппы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
