  873929c0f1d06567:
    english: Select **Polls to vote on** in the sidebar to see active polls where you have been invited but have not yet voted. You can also open a group's **Polls** tab to see its active and closed polls.
    translation: Selecione **Enquetes para votar** na barra lateral para ver enquetes ativas para as quais você recebeu um convite, mas ainda não votou. Você também pode abrir a aba **Enquetes** de um grupo para ver as enquetes ativas e encerradas.
