  fba51c92285b31c7:
    english: "## Continuous Improvement"
    translation: "## Miglioramento continuo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  121b4afb86de3c31:
    english: No matter how amazing a group or facilitator is, they can always improve. If they incrementally head in a good direction they will get to a better place. Incremental improvement requires an effective protocol for meta-conversation (talking about how you collaborate). With it, anything is possible. Without it, you stagnate.
    translation: Per quanto un gruppo o una persona che facilita siano capaci, possono sempre migliorare. Procedendo a piccoli passi nella direzione giusta, possono ottenere risultati migliori. Per migliorare gradualmente serve un modo efficace di parlare di come si collabora. Con questo confronto si possono affrontare molti problemi. Senza, si rischia di restare fermi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  331d258dee610e96:
    english: There are many approaches to continuous improvement, but they all create space for reflection and feedback, and a way to make changes in response. For teams that work together on an ongoing basis, they might employ a methodology like <a href="https://en.wikipedia.org/wiki/Scrum_(software_development)" target="_blank">scrum</a>, including retrospectives and regular process improvements. For a one-off session, a facilitator might simply follow up with a request for feedback.
    translation: Esistono molti approcci al miglioramento continuo. Tutti prevedono momenti per riflettere, raccogliere riscontri e apportare cambiamenti. I gruppi di lavoro che collaborano stabilmente possono usare un metodo come <a href="https://en.wikipedia.org/wiki/Scrum_(software_development)" target="_blank">Scrum</a>, con retrospettive e miglioramenti regolari dei processi. Dopo un incontro occasionale, chi facilita può semplicemente chiedere un riscontro.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aabfa9d842af2688:
    english: On Loomio
    translation: Su Loomio
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ac2f489368566562:
    english: |-
      * People use Loomio itself to talk about how they use Loomio. It provides an obvious platform to “talk about the talking”.
      * The process of joining Loomio causes groups to reflect on many aspects of their collaboration and decision-making process, which creates the opportunity to improve.
    translation: |-
      * Le persone usano Loomio anche per parlare di come usano Loomio. È uno spazio naturale in cui confrontarsi sul modo di discutere.
      * Entrare in Loomio porta i gruppi a riflettere su diversi aspetti della collaborazione e del processo decisionale. Questa riflessione offre occasioni per migliorare.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7b11f212a312312e:
    english: "## Distributed Facilitation / Self-facilitation"
    translation: "## Facilitazione distribuita e autofacilitazione"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1e385970a624bf63:
    english: As a group becomes more experienced, more individuals build capacity for facilitation. Facilitation can cease to be a role held by a specific person, and become more of a function that can be distributed. Anyone can take acts of facilitation, and a dance of give and take, leading and following, can emerge among participants. For groups with aspirations toward shared leadership and non-hierarchy, this is a very important thing to encourage.
    translation: Con l'esperienza, sempre più persone in un gruppo sviluppano la capacità di facilitare. La facilitazione può smettere di essere il ruolo di una sola persona e diventare una funzione condivisa. Chiunque può compiere gesti di facilitazione. Tra i partecipanti può nascere un'alternanza di iniziativa e ascolto, di guida e sostegno. È particolarmente utile incoraggiarla nei gruppi che puntano a una leadership condivisa e a rapporti non gerarchici.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fa78b242f7390326:
    english: 'People who are less used to taking acts of facilitation can be supported with education, invitations, and suggestions of first steps. Some examples of acts of facilitation almost anyone can be encouraged to try:'
    translation: 'Chi ha meno esperienza nella facilitazione può ricevere formazione, inviti a partecipare e suggerimenti su come iniziare. Ecco alcuni gesti di facilitazione che quasi chiunque può provare:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1f490f466a1893ed:
    english: |-
      * reflecting back what you’re hearing or summarising
      * inviting others to contribute
      * asking questions to enhance collective understanding
      * noticing who is and is not participating
      * appreciating contributions explicitly
    translation: |-
      * ripetere con parole proprie ciò che hai ascoltato o riassumerlo
      * invitare altre persone a contribuire
      * fare domande per migliorare la comprensione comune
      * osservare chi partecipa e chi no
      * riconoscere esplicitamente i contributi
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e2eed897e0f564d2:
    english: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../silvia_200.png"> You don’t need an agenda to be a facilitator. Facilitating is just about making a group situation easy. Next time you’re at a family gathering, party or morning tea: approach it like a facilitator and make sure everybody in the group feels included and able to participate. — Silvia Zuur'
    translation: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../silvia_200.png"> Non ti serve un ordine del giorno per facilitare. Facilitare significa rendere più semplice la partecipazione in un gruppo. La prossima volta che sei a una riunione di famiglia, a una festa o a una pausa caffè, comportati come una persona che facilita: fai in modo che tutti si sentano inclusi e possano partecipare. — Silvia Zuur'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  180b1232871c44c4:
    english: Distributed facilitation can work beautifully, but it can also cause people to step all over each other. At first, it’s awkward as people learn the dance. It’s important to differentiate between distributed facilitation (peers helping the collective), “facipulation” (manipulating the group toward your own agenda), and backseat facilitation (taking acts of facilitation when you do not have the mandate).
    translation: La facilitazione distribuita può funzionare molto bene, ma può anche portare le persone a ostacolarsi a vicenda. All'inizio, trovare un equilibrio può essere difficile. È importante distinguere la facilitazione distribuita, in cui le persone aiutano il gruppo, dalla «facipolazione», in cui si orienta il gruppo verso i propri obiettivi, e dalla facilitazione non richiesta, in cui si interviene senza averne il mandato.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ea5faa685be1ceae:
    english: Consciously decide when peer facilitation is a good choice, and when a specific facilitator is called for. In certain situations, such as a high-conflict discussion where a specified neutral party is needed, or there is a lack of trust, distributed facilitation might not work.
    translation: 'Decidi consapevolmente quando la facilitazione tra pari è adatta e quando serve una persona incaricata di facilitare. In alcune situazioni la facilitazione distribuita potrebbe non funzionare: per esempio, in una discussione molto conflittuale che richiede una persona neutrale oppure quando manca la fiducia.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d6df5458ecb8e45:
    english: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../rich_200.png"> Acts of facilitation are not just for the manager, or the person who called the meeting — they are for everyone. — Richard Bartlett'
    translation: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../rich_200.png"> I gesti di facilitazione non spettano solo a chi dirige o ha convocato la riunione — spettano a tutti. — Richard Bartlett'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c3215e63fca09b79:
    english: "## Translating this into Loomio"
    translation: "## Applicare queste idee a Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  35ce75e6810e0611:
    english: |-
      * The online space is uniquely suited to distributed facilitation. Different people can come along at different points depending on what they notice and their skill set.
      * An online discussion is by default a distributed collaboration among peers. Any other setup requires explicit design. This is the opposite of offline spaces where the default is that someone called a meeting and distributing the role requires proactivity.
      * Loomio is designed with a group of equals in mind. In many ways, a distributed facilitation approach is the best fit for the tool.
      * Current Loomio users do peer facilitation all the time, whether they realize that’s what they are doing or not. Simple things like suggesting someone raise a proposal, tagging people, summarising the process so far, etc, are all acts of facilitation.
    translation: |-
      * Lo spazio online si presta particolarmente alla facilitazione distribuita. Persone diverse possono intervenire in momenti diversi, secondo ciò che notano e le proprie competenze.
      * Una discussione online è, per sua natura, una collaborazione distribuita tra pari. Per organizzarla diversamente serve una scelta esplicita. Negli incontri di persona, invece, di solito qualcuno convoca la riunione e la condivisione del ruolo di facilitazione richiede un'iniziativa precisa.
      * Loomio è progettato pensando a un gruppo di pari. Per molti aspetti, la facilitazione distribuita è l'approccio più adatto allo strumento.
      * Le persone che usano Loomio facilitano già le discussioni tra pari, anche senza chiamare così ciò che fanno. Suggerire di presentare una proposta, menzionare altre persone o riassumere il percorso fatto finora sono tutti gesti di facilitazione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  efde81539c545bae:
    english: "## The Art of Being Facilitated"
    translation: "## L'arte di lasciarsi facilitare"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  93ed1980d0cc95b4:
    english: Like the skill of being the follow in a ballroom dance pair, being facilitated is an art itself. People with experience facilitating themselves, or who have participated in a lot of well-facilitated processes, will receive facilitation differently than those who haven't.
    translation: Come seguire il partner in un ballo di coppia, anche lasciarsi facilitare richiede pratica. Chi ha esperienza nella facilitazione, o ha partecipato a molti processi ben facilitati, risponde in modo diverso da chi non ha avuto queste esperienze.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d2bcd9f07f5bd25b:
    english: On the positive side, skillful receptivity to facilitation is a capacoty that can be grown, and it can have a big impact on group success. This ranges from things as simple as showing up on time, to following instructions, to being willing to try a new style of thinking or communicating. Sometimes people have a good experience and they don’t quite know why — pointing out that facilitation is the reason for the smoothness or depth can help them understand what it is they valued about the process.
    translation: La capacità di accogliere la facilitazione può crescere e contribuire molto al successo di un gruppo. Può significare arrivare puntuali, seguire le indicazioni o essere disponibili a provare un modo nuovo di pensare o comunicare. A volte le persone vivono un'esperienza positiva senza sapere bene perché. Mostrare loro che la facilitazione ha reso il processo più scorrevole o approfondito può aiutarle a capire che cosa hanno apprezzato.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  87345b383ccba81d:
    english: On the negative side, people who can’t or won’t be facilitated can be detrimental to group collaboration. No matter how skilled a facilitator is, if they encounter a certain level of resistance they won’t be able to do their job. Common problems include dominating the discussion, playing devil’s advocate, disrupting the process, disrespecting the facilitator or participants, or being disengaged. At some level individuals must take responsibility for their willingness to be facilitated.
    translation: Chi non riesce o non vuole lasciarsi facilitare può ostacolare la collaborazione del gruppo. Anche una persona molto esperta non può svolgere il proprio compito se incontra una forte resistenza. Tra i problemi più comuni ci sono monopolizzare la discussione, fare sempre l'avvocato del diavolo, interrompere il processo, mancare di rispetto a chi facilita o partecipa, e non prestare attenzione. Ogni persona ha una parte di responsabilità nella propria disponibilità a lasciarsi facilitare.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c096fd0a7e12ddd4:
    english: |-
      * With a little practice, most users quickly upskill on being responsive to acts of facilitation on Loomio, such as replying when @mentioned.
      * Taking acts of facilitation on Loomio helps people become more responsive to facilitation themselves.
      * Because everything is archived, users can see past acts of facilitation “frozen in time”, gaining the benefits of observing them without having been there.
    translation: |-
      * Con un po' di pratica, la maggior parte delle persone impara presto a rispondere ai gesti di facilitazione su Loomio, per esempio quando viene menzionata con @.
      * Facilitare altre persone su Loomio aiuta anche a diventare più disponibili a lasciarsi facilitare.
      * Poiché tutto resta archiviato, le persone possono osservare gesti di facilitazione passati anche se non erano presenti quando sono avvenuti.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f930b325aaedb19a:
    english: "## Culture Change"
    translation: "## Cambiamento culturale"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  82936abec2b50e3f:
    english: A collaborative, participatory culture is something that emerges over time, with lots of practice and trial and error. Understanding, valuing, and inviting facilitation can play a pivotal role in this cultural emergence. Facilitation can evolve from a role, to a function, to a mindset. A truly collaborative culture is one where everyone is facilitating everyone in myriad different ways.
    translation: Una cultura collaborativa e partecipativa nasce nel tempo, con molta pratica e attraverso tentativi ed errori. Comprendere, apprezzare e incoraggiare la facilitazione può avere un ruolo decisivo in questo processo. La facilitazione può evolversi da ruolo a funzione condivisa, fino a diventare un modo di pensare. In una cultura davvero collaborativa, tutti aiutano gli altri a partecipare in molti modi diversi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  898bf6557380a042:
    english: Is the company party participatory? Does the office potluck just happen like magic? Are ideas able to emerge from anywhere, evolve through many brains and hands, and get implemented in a way better than anyone first imagined?
    translation: La festa aziendale coinvolge tutti? Il pranzo condiviso in ufficio si organizza davvero da solo? Le idee possono nascere ovunque, svilupparsi grazie al contributo di molte persone ed essere realizzate meglio di quanto chiunque avesse immaginato all'inizio?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f4964381b3c6dc7b:
    english: Deep culture change is when the culture of collaboration starts to leak out of specific “collaboration” spaces and shows up in every aspect of the organization. Collaboration is not about post-it notes and check-ins, but the very timbre of organizational life.
    translation: 'Il cambiamento culturale profondo avviene quando la collaborazione esce dagli spazi dedicati e diventa visibile in ogni aspetto dell''organizzazione. Non riguarda soltanto i post-it e i momenti di confronto: si riconosce nel modo in cui l''organizzazione vive e lavora ogni giorno.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6962aa4815c01b0f:
    english: |-
      * The [theory of change of Loomio](http://www.loomio.com/about) is that more groups practicing effective, inclusive decision making can change organizational dynamics at a global scale. This shows up in everything about how the tool is designed and [how we run as a co-op](http://loomio.coop). Ultimately, it’s about culture change through collaborative practice.
      * Loomio groups have experienced evolving culture through the tool. Like groups that already has a collaborative culture scale while holding onto that, or a participatory group continuing to exists instead of imploding due to challanges around inclusive decicion-making.
      * Loomio makes a certain kind of “new normal” of collaborative practice possible, through making collaborative practice more accessible and achievable.
    translation: |-
      * La [teoria del cambiamento di Loomio](http://www.loomio.com/about) parte dall'idea che un maggior numero di gruppi capaci di prendere decisioni efficaci e inclusive possa cambiare le dinamiche delle organizzazioni su scala globale. Questa idea guida la progettazione dello strumento e [il modo in cui operiamo come cooperativa](http://loomio.coop). L'obiettivo è cambiare la cultura attraverso la pratica della collaborazione.
      * I gruppi su Loomio hanno visto evolvere la propria cultura usando lo strumento. Alcuni hanno ampliato la propria attività mantenendo una cultura collaborativa. Altri hanno continuato a esistere come gruppi partecipativi, superando le difficoltà legate alle decisioni inclusive.
      * Loomio contribuisce a rendere abituale un modo di collaborare, perché rende la pratica collaborativa più accessibile e realizzabile.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3f2cee633e8b83c2:
    english: For inspiration about Ongoing Practice, check out [stories of Loomio groups](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help).
    translation: Per trovare spunti sulla pratica continua, leggi le [storie dei gruppi che usano Loomio](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
