navigation_title: העברת פריטים בין שרשורים
blocks:
  875a42e08000fffe:
    english: "# Moving items between threads"
    translation: "# העברת פריטים בין שרשורים"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5c0fcd38f9276e8f:
    english: Move selected items when a conversation belongs in another thread, when one thread has split into separate topics, or when you want to combine related discussions. There is no separate **Merge discussions** command.
    translation: ניתן להעביר פריטים נבחרים כששיחה שייכת לשרשור אחר, כששרשור מתפצל לנושאים נפרדים או כשרוצים לאחד דיונים קשורים. אין פקודה נפרדת בשם **מיזוג דיונים**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f43c7835d05a135e:
    english: The option is available to group admins and to members when **Members can manage discussions and comments** is enabled in [Group permissions](/en/user_manual/groups/settings/permissions).
    translation: האפשרות זמינה למנהלי קבוצה, וגם לחברים כאשר ההגדרה **חברים יכולים לנהל דיונים ותגובות** מופעלת ב[הרשאות הקבוצה](/en/user_manual/groups/settings/permissions).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  30a4e31dab983f89:
    english: Open the three-dot menu (**⋯**) on an item and select **Move item**.
    translation: יש לפתוח את תפריט שלוש הנקודות (**⋯**) בפריט ולבחור **העבר פריט**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  24fd0043effa14fb:
    english: Select the items you want to move.
    translation: יש לבחור את הפריטים להעברה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  81551cd5134f24c5:
    english: Select any additional items with the checkboxes, then click **Move** in the banner at the top of the discussion.
    translation: יש לסמן פריטים נוספים בתיבות הסימון, ואז ללחוץ על **העבר** בפס שבראש הדיון.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f53055845c214b05:
    english: Choose the group or subgroup, then search for the destination discussion.
    translation: יש לבחור קבוצה או תת־קבוצה, ואז לחפש את דיון היעד.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  19bc2092ac28011b:
    english: To move the items into a new discussion, select **New discussion** and add its title and context.
    translation: כדי להעביר את הפריטים לדיון חדש, יש לבחור **דיון חדש** ולהוסיף כותרת והקשר.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '092b56e69505636f':
    english: The items are moved from the original thread into the selected or newly created thread.
    translation: הפריטים מועברים מהשרשור המקורי לשרשור שנבחר או נוצר.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  162c0d0c47ca798f:
    english: If the original thread is no longer needed, you can [lock it](/en/user_manual/discussions/using_discussions/#lock-or-unlock-a-thread). Delete it only if you are certain it will not be needed again.
    translation: אם אין עוד צורך בשרשור המקורי, ניתן [לנעול אותו](/en/user_manual/discussions/using_discussions/#lock-or-unlock-a-thread). יש למחוק אותו רק אם בטוחים שלא יהיה בו צורך שוב.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
