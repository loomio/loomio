  a1c12efad8cb82f5:
    english: "## Name and handle"
    translation: "## Nome e endereço curto"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3643c2e2ffd5db73:
    english: Choose a concise group name, particularly if the group will contain subgroups. Loomio uses the handle in the group's web address and group email address, such as `loomio.com/your-group-handle` and `your-group-handle@loomio.com`.
    translation: Escolha um nome curto para o grupo, especialmente se ele tiver subgrupos. O Loomio usa o endereço curto no endereço web e no endereço de e-mail do grupo, como `loomio.com/your-group-handle` e `your-group-handle@loomio.com`.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5a6e298a019f6a15:
    english: When you change the handle, links using the previous handle redirect to the new address, and email sent to the previous group address continues to reach the group. Loomio retains up to three previous handles; changing the handle again after that causes the oldest one to expire.
    translation: Quando você altera o endereço curto, os links que usam o anterior redirecionam para o novo endereço, e os e-mails enviados ao endereço anterior continuam chegando ao grupo. O Loomio mantém até três endereços curtos anteriores. Se você alterá-lo novamente depois disso, o mais antigo deixa de funcionar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2b45dd41be9c3d1d:
    english: "## Description"
    translation: "## Descrição"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7b707620077d9d19:
    english: Use the description to explain what the group is for, who participates, and how people are expected to use it. You can format the description and include links, documents, and videos.
    translation: Use a descrição para explicar o propósito do grupo, quem participa e como as pessoas devem usá-lo. Você pode formatar o texto e incluir links, documentos e vídeos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  93a11a5e2927833e:
    english: The name and description may be visible to non-members depending on the group's [privacy settings](/en/user_manual/groups/settings/privacy).
    translation: O nome e a descrição podem ficar visíveis para pessoas que não são membros, dependendo das [configurações de privacidade](/en/user_manual/groups/settings/privacy) do grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0dff03268238aa26:
    english: "## Cover image and logo"
    translation: "## Imagem de capa e logo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9d08dda635bd5ce6:
    english: The cover image appears across the top of the group page. A wide image works best; the recommended size is 2048 × 512 pixels.
    translation: A imagem de capa aparece na parte superior da página do grupo. Uma imagem larga funciona melhor. O tamanho recomendado é de 2048 × 512 pixels.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cc04654d8d08da59:
    english: The group logo identifies the group in navigation and other compact contexts. Upload the cover image and logo separately so each can be cropped for its intended shape.
    translation: A logo do grupo identifica o grupo na navegação e em outros espaços pequenos. Envie a imagem de capa e a logo separadamente para que cada uma possa ser recortada no formato adequado.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
