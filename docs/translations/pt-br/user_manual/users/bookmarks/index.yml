  fc91d7d6d32e590b:
    english: "## Save a bookmark"
    translation: "## Salvar um favorito"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  daec09886eecd058:
    english: |-
      Open the action menu for the item and select **Save bookmark**. The action menu
      is usually shown as three dots. For a discussion, use the action menu near the
      discussion title; for a comment, vote, proposal, poll, or outcome, use the menu
      on that item.
    translation: |-
      Abra o menu de ações do item e selecione **Salvar marcador**. Esse menu
      geralmente aparece como três pontos. Para uma discussão, use o menu próximo ao
      título. Para um comentário, voto, proposta, enquete ou conclusão, use o menu
      do próprio item.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  395a4c119e77f34b:
    english: "## View your bookmarks"
    translation: "## Ver seus favoritos"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a5e09c422c753df7:
    english: |-
      Open the sidebar and select **Bookmarks**. The number beside the link shows how
      many bookmarks you have saved.
    translation: |-
      Abra a barra lateral e selecione **Favoritos**. O número ao lado do link mostra
      quantos favoritos você salvou.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7c21b03875c08b8e:
    english: |-
      The Bookmarks page lists your most recently saved items first. Each row shows
      the kind of item and its author. Select a row to return to the bookmarked item.
    translation: |-
      A página Favoritos mostra primeiro os itens salvos mais recentemente. Cada
      linha mostra o tipo de item e quem o publicou. Selecione uma linha para voltar
      ao item salvo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  644d774a0d045214:
    english: "## Remove a bookmark"
    translation: "## Remover um favorito"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c2480aa6235675ba:
    english: |-
      On the Bookmarks page, select the remove-bookmark button at the end of a row.
      You can also open the bookmarked item's action menu and select **Remove
      bookmark**.
    translation: |-
      Na página Favoritos, selecione o botão para remover o marcador no fim da linha.
