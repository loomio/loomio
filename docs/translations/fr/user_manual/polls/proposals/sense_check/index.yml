navigation_title: Vérification de l’idée
blocks:
  5c5bf2d96ddf4ca2:
    english: "# Sense check"
    translation: "# Vérification de l’idée"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4ec1b55b6ebaf563:
    english: Sense check gathers reactions while an idea is still being developed. Its options—**Looks good**, **Could be better**, and **Needs a rethink**—show whether the group is ready to proceed or should revise the idea first.
    translation: La vérification de l’idée recueille les réactions pendant qu’une idée est encore en cours d’élaboration. Ses options — **Ça a l'air bien**, **Pourrait être mieux** et **Il faut le repenser** — indiquent si le groupe est prêt à avancer ou s’il doit d’abord revoir l’idée.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  43573d5547783c67:
    english: This page explains how to run one Sense check. See the [Simple decision process](/en/guides/making_decisions/simple_decision_process), [Consent process](/en/guides/making_decisions/consent_process), or [Consensus process](/en/guides/making_decisions/consensus_process) for examples of using Sense check as one stage of a larger process.
    translation: Cette page explique comment mener une vérification de l’idée. Consultez le [processus de décision simple](/en/guides/making_decisions/simple_decision_process), le [processus par consentement](/en/guides/making_decisions/consent_process) ou le [processus par consensus](/en/guides/making_decisions/consensus_process) pour voir comment l’intégrer à un processus plus large.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5ad4c12fda490468:
    english: "## When to use Sense check"
    translation: "## Quand utiliser la vérification de l’idée"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dc841c725ef4e519:
    english: 'Use Sense check to:'
    translation: 'Utilisez la vérification de l’idée pour :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8472db2ec587add8:
    english: |-
      - test an early draft before investing in a detailed proposal;
      - uncover questions and concerns before a formal decision;
      - check whether another round of discussion is needed; or
      - compare support before and after revising an idea.
    translation: |-
      - tester une première version avant de préparer une proposition détaillée ;
      - faire émerger les questions et les préoccupations avant une décision formelle ;
      - déterminer si une nouvelle discussion est nécessaire ; ou
      - comparer le soutien apporté à une idée avant et après sa révision.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f411d599f7810e88:
    english: Do not treat **Looks good** as formal approval unless the group has explicitly agreed to do so. Use [Consent](../consent/) or [Consensus](../consensus/) when the response must authorize a decision.
    translation: Ne considérez pas **Ça a l'air bien** comme une approbation formelle, sauf si le groupe en a explicitement convenu. Utilisez le [consentement](../consent/) ou le [consensus](../consensus/) si les réponses doivent autoriser une décision.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e504f1a6f38ec6ad:
    english: "## Example: check a trial plan"
    translation: "## Exemple : examiner un projet pilote"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dd13b88fd1a52d50:
    english: Oatmilk Cooperative has drafted a returnable-bottle trial. It runs a Sense check to learn whether the collection schedule, washing checks, and reporting plan are ready for final review.
    translation: La coopérative Oatmilk a préparé un projet pilote de bouteilles consignées. Elle lance une vérification de l’idée pour savoir si le calendrier de collecte, les contrôles de lavage et le plan de suivi sont prêts pour un examen final.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9703f1f9474243af:
    english: "## Set up the proposal"
    translation: "## Configurer la proposition"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  48d89110b4c23c6f:
    english: State what stage the idea has reached and what will happen with the feedback. Keep the default response meanings or edit them to match the group's language. Set a closing time that leaves enough time to revise the plan.
    translation: Indiquez où en est l’idée et ce qui sera fait des retours. Conservez le sens par défaut des réponses ou adaptez-le au vocabulaire du groupe. Fixez une date de clôture qui laisse assez de temps pour revoir le projet.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Voter"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a0f4779c6103c9c:
    english: Participants choose the response that best represents their current view and explain what is ready or what should change. A useful reason gives the proposal author something specific to act on.
    translation: Les participants choisissent la réponse qui correspond le mieux à leur avis actuel et expliquent ce qui est prêt ou ce qui devrait changer. Une explication utile donne à l’auteur de la proposition un point précis sur lequel agir.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Lire les résultats"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ddcd496a30ab97da:
    english: 'The chart shows the number and proportion of votes for each response. Read the reasons as well as the distribution: one well-founded concern may require attention even when most participants select **Looks good**.'
    translation: 'Le graphique indique le nombre et la proportion de votes pour chaque réponse. Lisez aussi les explications : une préoccupation bien fondée peut nécessiter une réponse, même si la plupart des participants choisissent **Ça a l''air bien**.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d9ac55d3e75e5484:
    english: Publish an outcome that summarizes the changes the group will make, or records that the idea is ready for the next decision stage.
    translation: Publiez une conclusion qui résume les changements que le groupe apportera ou indique que l’idée est prête pour la prochaine étape de décision.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
