  66f32f2b3cf56e0d:
    english: |-
      ## Key points
      - Freedom to make a decision.
      - Invite people to offer their advice.
      - Take into account other people’s voices.
    translation: |-
      ## Punti chiave
      - Libertà di prendere una decisione.
      - Invita le persone a dare il loro consiglio.
      - Tieni conto delle opinioni degli altri.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  54d4f1ac3c2bd91f:
    english: |-
      ## Steps in the Advice process
      You notice a problem or opportunity and take the initiative.
      1. Frame the decision, identify who owns it, and invite the affected people and relevant experts.
      2. Start a Loomio **discussion** and, when a structured response or deadline is useful, run an **Advice proposal**.
      3. Clarify and build on the advice through vote reasons and discussion comments.
      4. Make the decision, then publish an **outcome** explaining what was decided and how the advice informed it.
    translation: |-
      ## Fasi del processo di consulenza
      Noti un problema o un'opportunità e prendi l'iniziativa.
      1. Definisci la decisione da prendere, individua chi ne è responsabile e invita le persone coinvolte e quelle esperte dell'argomento.
      2. Avvia una **discussione** su Loomio e, se servono risposte strutturate o una scadenza, avvia una **proposta di consulenza**.
      3. Chiarisci e approfondisci i consigli attraverso le motivazioni dei voti e i commenti nella discussione.
      4. Prendi la decisione, poi pubblica una **conclusione** che spieghi che cosa hai deciso e come hai tenuto conto dei consigli ricevuti.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6088bbd1e12e8920:
    english: "## Benefits\n- Advice helps you make a better decision for your organization. \n- Foster relationships, learning opportunities and diverse input.\n- Stimulate initiative and creativity, and more enjoyable work."
    translation: "## Vantaggi\n- I consigli ti aiutano a prendere una decisione migliore per la tua organizzazione. \n- Favoriscono le relazioni, l'apprendimento e il contributo di persone con prospettive diverse.\n- Stimolano l'iniziativa e la creatività e rendono il lavoro più piacevole."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
