    translation: "### Видалити вкладення"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ebc91823518309fd:
    english: While editing the context, click the **X** to the right of the file name to remove it.
    translation: Під час редагування опису натисніть **X** праворуч від назви файлу, щоб видалити його.
    status: machine
