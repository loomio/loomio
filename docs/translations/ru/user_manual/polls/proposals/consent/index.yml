navigation_title: Согласие
blocks:
  9153f30a2c3db9f2:
    english: "# Consent"
    translation: "# Согласие"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e16bed826124695f:
    english: A Consent proposal asks whether a course of action is safe to try. Participants either consent or raise an objection. An objection identifies a concrete risk or harm that the proposal should address.
    translation: Предложение типа «Согласие» помогает выяснить, безопасно ли попробовать предложенный план действий. Участники выражают согласие или выдвигают возражение. Возражение указывает на конкретный риск или возможный вред, который нужно учесть в предложении.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d675dd47ae42c929:
    english: This page explains how to run one Consent proposal. See the [Consent process](/en/guides/making_decisions/consent_process) for the complete workflow, including questions, Sense check, amendments, objections, and outcome.
    translation: На этой странице описано, как провести голосование по предложению типа «Согласие». Полный порядок работы, включая вопросы, проверку понимания, поправки, возражения и итоговое решение, описан в разделе [Процесс принятия решений по согласию](/en/guides/making_decisions/consent_process).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7c4c79526b1d437b:
    english: "## When to use Consent"
    translation: "## Когда использовать «Согласие»"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1b99c0443bd1e4c8:
    english: Use Consent when the group needs a workable decision that can proceed unless there is a valid objection. It suits experiments, operational policies, role agreements, and other decisions the group can review after gaining experience.
    translation: Используйте «Согласие», когда группе нужно принять решение, которое можно выполнить при отсутствии обоснованных возражений. Этот способ подходит для экспериментов, рабочих правил, договорённостей о ролях и других решений, которые группа сможет пересмотреть после получения опыта.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  966f3146dc9f61f1:
    english: Consent does not require everyone to prefer the proposal. Define what counts as an objection before voting, and explain how objections will be tested and resolved.
    translation: Для согласия не требуется, чтобы предложение нравилось всем. До голосования определите, что считается возражением, и объясните, как группа будет проверять и разрешать возражения.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e6cf2f0ebd4a7f58:
    english: "## Example: start a bottle trial"
    translation: "## Пример: пробный возврат бутылок"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ad7be5e188748cb3:
    english: Oatmilk Cooperative proposes starting a six-week returnable-bottle trial next month. The trial is limited in scope and includes a review, so the group asks whether it is safe to try.
    translation: Кооператив Oatmilk предлагает со следующего месяца на шесть недель запустить пробную систему возвратных бутылок. Масштаб эксперимента ограничен, а после него предусмотрена оценка результатов. Поэтому группа обсуждает, безопасно ли его попробовать.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9703f1f9474243af:
    english: "## Set up the proposal"
    translation: "## Подготовьте предложение"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6458750b94201df6:
    english: Describe the proposed action, its limits, safeguards, and review point. Keep **Consent** and **Objection** meanings precise, and require a reason for objections so the concern can be understood and addressed.
    translation: Опишите предлагаемые действия, их пределы, меры предосторожности и срок пересмотра решения. Чётко определите значение вариантов **Согласие** и **Возражение**. Попросите участников объяснять причины возражений, чтобы группа могла понять и учесть их.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Голосуйте"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d98c0e71880c8828:
    english: Participants select **Consent** when the proposal is safe enough to try, even if it is not their preferred plan. They select **Objection** when they can describe a material risk or harm.
    translation: Участники выбирают **Согласие**, если предложение достаточно безопасно, чтобы его попробовать, даже если они предпочли бы другой план. Они выбирают **Возражение**, если могут указать на существенный риск или возможный вред.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72a9e4073ea27936:
    english: "## Read the results"
    translation: "## Изучите результаты"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b0265040032f48e5:
    english: The chart makes objections visible, but the group must examine the reasons. Resolve a valid objection by amending the proposal, adding a safeguard, changing its scope, or deciding not to proceed.
    translation: Диаграмма показывает возражения, но группе нужно изучить их причины. Чтобы разрешить обоснованное возражение, измените предложение, добавьте меру предосторожности, сузьте его рамки или решите не продолжать.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a87df65569cb3a09:
    english: Publish an outcome that records the agreed action, any safeguards, who is responsible, and when the group will review it.
    translation: Опубликуйте итоговое решение. Укажите в нём согласованные действия, меры предосторожности, ответственных и срок, когда группа пересмотрит решение.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
