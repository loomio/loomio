  '0479bd2337b02443':
    english: "### Boards and Governance"
    translation: "### Conseils d’administration et gouvernance"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5b0a3e2c653d47f8:
    english: "**Prepare for a meeting** - Build an agenda, post board papers and organize administrative matters so everyone is up to date, in context and prepared. "
    translation: "**Prépare-toi à une réunion** - Établissez l’ordre du jour, publiez les documents du conseil et organisez les questions administratives pour que chacun dispose des informations nécessaires et puisse se préparer."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5c1c6aa79c3556dc:
    english: "**Pass a resolution** - Post context and background information, respond to questions and raise a proposal to pass a resolution. "
    translation: "**Adopter une résolution** - Publiez les informations utiles, répondez aux questions et soumettez une proposition pour faire adopter une résolution."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  07ae9c6a1f0a32d0:
    english: "**Discuss an agenda item on Loomio** - Start discussion about an agenda item prior to your meeting. Or, if you run out of time in the meeting, move the discussion on to Loomio."
    translation: "**Discuter d’un point de l’ordre du jour sur Loomio** - Lancez la discussion avant votre réunion. Si vous manquez de temps pendant la réunion, poursuivez-la sur Loomio."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f0b0de7094b1cfc9:
    english: "**Approve minutes and track actions** - Post minutes and assign actions. Use a poll to approve minutes. "
    translation: "**Approuver un procès-verbal et suivre les actions** - Publiez le procès-verbal et attribuez les tâches. Utilisez un sondage pour faire approuver le procès-verbal."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ba7cf177191baadb:
    english: "### Member participation"
    translation: "### Participation des membres"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3cf51f837c0a3e9f:
    english: "**Share news (replace mailing list)** - Post information for members, invite comments."
    translation: "**Partager des nouvelles (remplacer une liste de diffusion)** - Publiez des informations destinées aux membres et invitez-les à commenter."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d2cd391b61042129:
    english: "**Organize an event** - Work with your organizing team on details. Keep all discussion and info within the thread. Then announce the event to wider membership."
    translation: "**Organiser un événement** - Réglez les détails avec l’équipe d’organisation. Gardez les échanges et les informations dans la discussion. Annoncez ensuite l’événement à l’ensemble des membres."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cf59a44a8643cc96:
    english: "**Develop a policy** - Post a policy draft, seek member feedback and input, finalize and ratify the policy."
    translation: "**Élaborer une politique** - Publiez un projet de politique, recueillez les avis des membres, puis finalisez et faites adopter la politique."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6ddec467576426ca:
    english: "**General Assembly** - Organize, prepare and run a formal meeting including all members, to deliberate and make decisions on strategic matters."
    translation: "**Assemblée générale** - Organisez, préparez et tenez une réunion formelle avec tous les membres pour délibérer et prendre des décisions stratégiques."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8d32bb446c4ca025:
    english: "### Self-organizing working teams"
    translation: "### Équipes de travail autonomes"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  87ab6b2d51a7c1b6:
    english: "**Share information** - Post information and reports of interest to your team, invite comment and discussion."
    translation: "**Partager des informations** - Publiez des informations et des rapports utiles à votre équipe, et invitez les membres à commenter et à en discuter."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e93205aa183cd1e0:
    english: "**Progress work** - Outline a work task and seek advice, input and feedback from team members through to completion."
    translation: "**Faire avancer le travail** - Décrivez une tâche et recueillez les conseils, les contributions et les avis des membres de l’équipe jusqu’à son achèvement."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1ddaef5d44653691:
    english: "**Meeting notes and actions** - Post meeting notes as a record of discussion, and follow up on tasks. "
    translation: "**Notes de réunion et suivi des actions** - Publiez les notes de réunion pour garder une trace des échanges, puis assurez le suivi des tâches."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8ce9169d72c90788:
    english: "**Explore ideas** - Share thoughts and invite discussion about a concern you notice, or an improvement that can be made."
    translation: "**Explorer des idées** - Partagez vos réflexions et invitez les autres à discuter d’un problème que vous avez remarqué ou d’une amélioration possible."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a06e734e86f07828:
    english: "**Advice, Consent and Generative decision making** - Prepare, propose, clarify, respond to reactions and objections, agree and implement - all within a Loomio discussion."
    translation: "**Prise de décision par consultation, consentement et démarche générative** - Préparez, proposez, clarifiez, répondez aux réactions et aux objections, trouvez un accord et mettez-le en œuvre, le tout dans une discussion Loomio."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
