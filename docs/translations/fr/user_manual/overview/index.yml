  7c8501ecb12311af:
    english: "## How Loomio works"
    translation: "## Comment fonctionne Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  74caca2261c15283:
    english: 'Loomio has three main parts: groups, discussions, and polls.'
    translation: 'Loomio comporte trois éléments principaux : les groupes, les discussions et les sondages.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5f0a46926a0f7350:
    english: "### Groups"
    translation: "### Groupes"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2060a64d0fabc6d7:
    english: A group is a place for an organization, team, or community to work together. Its home page explains the group's purpose and provides access to its discussions, polls, members, and files.
    translation: Un groupe est un espace où une organisation, une équipe ou une communauté peut travailler ensemble. Sa page d’accueil présente son objectif et donne accès à ses discussions, sondages, membres et fichiers.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  311793a17709182c:
    english: "### Discussions"
    translation: "### Discussions"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  05ecdffe6c18a1df:
    english: Discussions keep the information and conversation about a topic together. People can share context, comment, reply, react, and use polls to move the discussion towards an outcome.
    translation: Les discussions rassemblent les informations et les échanges sur un sujet. Les personnes peuvent apporter du contexte, laisser des commentaires, répondre, réagir et utiliser des sondages pour faire avancer la discussion vers une conclusion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dc9a50d7f1f20c80:
    english: Over time, discussions create a searchable record of the information considered and the decisions made by your group.
    translation: Au fil du temps, les discussions constituent une archive consultable des informations examinées et des décisions prises par votre groupe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3448194e8a2ce09d:
    english: "### Polls and proposals"
    translation: "### Sondages et propositions"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4ef7092f5f56e773:
    english: Polls help a group understand preferences, gather advice, and make decisions. Different poll templates support different processes. A proposal asks people to respond to a suggested course of action and explain the reason for their response.
    translation: Les sondages aident un groupe à connaître les préférences de ses membres, à recueillir des avis et à prendre des décisions. Différents modèles de sondage correspondent à différents processus. Une proposition invite les personnes à se prononcer sur une action suggérée et à expliquer leur réponse.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  51ab039bc7c374bd:
    english: Polls can be part of a discussion or run independently from the **Polls** tab on a group page.
    translation: Les sondages peuvent faire partie d’une discussion ou être lancés séparément depuis l’onglet **Sondages** de la page d’un groupe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  47500e7125fdedbc:
