---
navigation_title: תגובות
blocks:
  e6981c530fad6f45:
    english: "# Comments"
    translation: "# תגובות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cb82daa3594be60c:
    english: Comments are the main way people participate in a discussion. They are visible to anyone who has permission to see the thread.
    translation: תגובות הן הדרך העיקרית להשתתף בדיון. כל מי שיש לו הרשאה לצפות בשרשור יכול לראות אותן.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  96ffa85117001d18:
    english: "## Reading comments"
    translation: "## קריאת תגובות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2d82b2da2ee96a1f:
    english: When you open a discussion, Loomio takes you to activity that is new to you.
    translation: כשפותחים דיון, Loomio מציגה את הפעילות שחדשה עבורכם.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c4a1b0be655249a9:
    english: Unread comments have a blue **new** label beside their posting time.
    translation: לצד שעת הפרסום של תגובות שטרם נקראו מופיעה תווית כחולה **חָדָשׁ**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  82bce54322fa6023:
    english: "## Writing a comment"
    translation: "## כתיבת תגובה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7b14a17025b52e3d:
    english: Write a comment to contribute to the discussion. Other people can reply, react, or post their own comments.
    translation: כדי להשתתף בדיון, ניתן לכתוב תגובה. אנשים אחרים יכולים להשיב, להגיב באימוג׳י או לפרסם תגובות משלהם.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6e0c07cfcb8f1166:
    english: Select **Post Comment** to publish it. Your comment will be visible to anyone who has permission to see the discussion.
    translation: כדי לפרסם את התגובה, יש לבחור **שלחו תגובה**. כל מי שיש לו הרשאה לצפות בדיון יוכל לראות אותה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  edfadd8f1dcac9c4:
    english: The tools described in [Formatting](/en/user_manual/discussions/formatting/) are available when writing comments.
    translation: בעת כתיבת תגובות אפשר להשתמש בכלים המתוארים בדף [עיצוב טקסט](/en/user_manual/discussions/formatting/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b4dce878f57863ff:
    english: "## Mentioning people"
    translation: "## אזכור אנשים"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  70543178fe9e7b4b:
    english: Type **@**, start typing a person's name, then select them from the list. A mention notifies that person immediately and is a useful way to ask for their attention or response.
    translation: יש להקליד **@**, להתחיל להקליד שם של אדם ולבחור אותו מהרשימה. האזכור שולח לאותו אדם התראה מיד, ואפשר להשתמש בו כדי להפנות אליו שאלה או לבקש תגובה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b1d5a5e3d5bb86e3:
    english: "![Mentioning Samira Patel in a comment](../notifying_people/comment_mention.png)"
    translation: "![אזכור של סמירה פאטל בתגובה](../notifying_people/comment_mention.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  07aa88bffb5b1700:
    english: To notify everyone in the group, type **@**, start typing the group name, then select it from the list.
    translation: כדי לשלוח התראה לכל חברי הקבוצה, יש להקליד **@**, להתחיל להקליד את שם הקבוצה ולבחור אותה מהרשימה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  794c26be4050ac1b:
    english: "![Searching for Oatmilk Cooperative while writing a group mention](../notifying_people/mentioning_group_1.png)"
    translation: "![חיפוש אחר Oatmilk Cooperative בעת כתיבת אזכור של קבוצה](../notifying_people/mentioning_group_1.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  111625a57c02bc5c:
    english: "![Oatmilk Cooperative selected as a group mention](../notifying_people/mentioning_group_2.png)"
    translation: "![Oatmilk Cooperative נבחרה כאזכור של קבוצה](../notifying_people/mentioning_group_2.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b4fb3c8390c32e31:
    english: Mentioning someone does not give them access to the thread. Use **Invite people** in the thread sidebar if they are not already a thread member.
    translation: אזכור של אדם אינו מעניק לו גישה לשרשור. אם האדם עדיין אינו חבר בשרשור, יש להשתמש ב**הזמינו אנשים** בסרגל הצד של השרשור.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6bba3d93a1845f91:
    english: "## Replying to a comment"
    translation: "## מענה לתגובה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e7776c198f2f2f48:
    english: Select **Reply** below a comment to respond to it. The reply is prefilled with an @mention of the comment author, which notifies them when you post it. Remove the mention if you do not want to notify them.
    translation: כדי לענות לתגובה, יש לבחור **השב** מתחתיה. בתשובה מופיע מראש אזכור @ של מי שכתב את התגובה, כדי לשלוח לו התראה עם פרסום התשובה. אם אין צורך בהתראה, ניתן להסיר את האזכור.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eb45d23f7f968858:
    english: You can also reply to your own comment to nest a response beneath it.
    translation: אפשר גם להשיב לתגובה שכתבתם כדי להציג את התשובה מתחתיה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ab1caf06d54d3bcb:
    english: If a Loomio email says you can reply by email, your emailed reply will appear in the thread.
    translation: אם בהודעת אימייל מ־Loomio מצוין שאפשר להשיב באימייל, התשובה שתישלח באימייל תופיע בשרשור.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72d9282ce2bc763a:
    english: "## Reactions"
    translation: "## תגובות באימוג׳י"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1875a303c30b5343:
    english: Use the smiley button to respond with an emoji. Reactions notify the comment author within Loomio but do not send an email.
    translation: כדי להגיב באימוג׳י, יש להשתמש בכפתור הסמיילי. תגובות באימוג׳י שולחות התראה ב־Loomio למי שכתב את התגובה, אך אינן שולחות אימייל.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ce997bcd34b2eae0:
    english: "## Translating comments"
    translation: "## תרגום תגובות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b50a435640652d31:
    english: If the author uses a language other than yours, a **Translate** action appears below the comment.
    translation: אם התגובה נכתבה בשפה שונה מהשפה שלכם, הפעולה **תרגום** מופיעה מתחת לתגובה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9077e2c891750fe8:
    english: Select **Translate comment** to see the comment in your language.
    translation: כדי לראות את התגובה בשפה שלכם, יש לבחור **תרגום הערה**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  60a885598057c1bf:
    english: "## Comment actions"
    translation: "## פעולות בתגובה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9689ea71da9051d8:
    english: Common actions appear directly below a comment. Additional actions are available from the three-dot menu (**⋯**).
    translation: פעולות נפוצות מופיעות ישירות מתחת לתגובה. פעולות נוספות זמינות בתפריט שלוש הנקודות (**⋯**).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  88263de7d2158dae:
    english: "### Add a comment to Jump to"
    translation: "### הוספת תגובה לרשימת קפיצה אל"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dd60de0295088aa5:
    english: Use **Pin to timeline** to add a comment to the thread's **Jump to** list.
    translation: כדי להוסיף תגובה לרשימת **קפיצה אל** של השרשור, יש להשתמש ב**הצמד לציר הזמן**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  90252c4d66b752d4:
    english: You can edit the label shown in **Jump to**. Unpin and then pin the comment again to change the link text.
    translation: אפשר לערוך את התווית שמופיעה ב**קפיצה אל**. כדי לשנות את טקסט הקישור, יש להסיר את ההצמדה ולהצמיד את התגובה שוב.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  28c2ffaa171b6b1b:
    english: |-
      >[!Tip]
      >Highlight the words you want to use as the link text before selecting **Pin to timeline**.
    translation: |-
      >[!Tip]
      >לפני בחירה ב**הצמד לציר הזמן**, יש לסמן את המילים הרצויות כטקסט הקישור.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7545e856758edb22:
    english: Select **Unpin** to remove the item from **Jump to**.
    translation: כדי להסיר את הפריט מ**קפיצה אל**, יש לבחור **הסר סיכה**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c3b33d31cbce93c3:
    english: "### Edit a comment and view changes"
    translation: "### עריכת תגובה וצפייה בשינויים"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  abaeaac4c1f2c966:
    english: Select **Edit** below one of your comments to change it. Group admins can also edit member comments when the relevant group permission is enabled.
    translation: כדי לשנות תגובה שכתבתם, יש לבחור **עריכה** מתחתיה. מנהלי קבוצה יכולים גם לערוך תגובות של חברים אם ההרשאה המתאימה מופעלת בקבוצה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  69647eee1f3fcfb7:
    english: An **Edited** action appears below an edited comment.
    translation: הפעולה **ערוך** מופיעה מתחת לתגובה שנערכה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fcaa0d6329f5c5d4:
    english: Select **Edited** to see what changed. Red highlighting shows removed text and green highlighting shows added text. Loomio records who made each edit and when it was made.
    translation: כדי לראות מה השתנה, יש לבחור **ערוך**. סימון אדום מציין טקסט שהוסר, וסימון ירוק מציין טקסט שנוסף. Loomio מתעדת מי ערך את התגובה ומתי.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  042b22530d14a486:
    english: 'You can edit a comment when:'
    translation: 'אפשר לערוך תגובה במקרים הבאים:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  afe0ed6535a96b15:
    english: |-
      - you wrote it and the group allows members to edit their comments
      - you are a group admin and [Admins can edit members' comments](/en/user_manual/groups/settings/permissions) is enabled
    translation: |-
      - התגובה נכתבה על ידיכם, והקבוצה מאפשרת לחברים לערוך את תגובותיהם
      - יש לכם הרשאת ניהול בקבוצה, והאפשרות [מנהלי קבוצה יכולים לערוך תגובות של חברים](/en/user_manual/groups/settings/permissions) מופעלת
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6962d0caeeea20e8:
    english: "### Copy a comment link"
    translation: "### העתקת קישור לתגובה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0fb9e2ebde71573e:
    english: Select **Copy link** to copy the comment's unique URL. You can paste the link elsewhere to refer directly to that comment.
    translation: כדי להעתיק את כתובת ה־URL הייחודית של התגובה, יש לבחור **העתק קישור**. אפשר להדביק את הקישור במקום אחר כדי להפנות ישירות לתגובה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  04e4537024da788c:
    english: "### View notification history"
    translation: "### צפייה בהיסטוריית ההתראות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  957677befce0ab3f:
    english: Open the three-dot menu (**⋯**) beside a comment and select **Notification history**.
    translation: יש לפתוח את תפריט שלוש הנקודות (**⋯**) לצד תגובה ולבחור **היסטוריית התראות**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fa9d0f2448239944:
    english: "![Notification history in a comment's actions menu](../notifying_people/comment_notification_history.png)"
    translation: "![היסטוריית התראות בתפריט הפעולות של תגובה](../notifying_people/comment_notification_history.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  30a58d4ef7d80c15:
    english: The notification history shows who was notified about the comment, when the notification was sent, and whether it has been read when that information is available.
    translation: היסטוריית ההתראות מציגה למי נשלחה התראה על התגובה, מתי היא נשלחה ואם היא נקראה, כשהמידע הזה זמין.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4f6ead46c3f9759e:
    english: "![Notification history for a comment mentioning Samira Patel](../notifying_people/comment_notification_example.png)"
    translation: "![היסטוריית התראות של תגובה שבה מוזכרת סמירה פאטל](../notifying_people/comment_notification_example.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fa2204fb0745dec4:
    english: "### Discard, restore, or delete a comment"
    translation: "### העברה לאשפה, שחזור או מחיקה של תגובה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  592dfa766814bb8e:
    english: Discarding a comment removes it from the thread but retains it in a trash bin. You can discard your own comments with **Discard** in the three-dot menu. Group admins can also discard comments.
    translation: העברת תגובה לאשפה מסירה אותה מהשרשור, אך שומרת אותה בפח האשפה. כדי להעביר תגובה שפרסמת לאשפה, יש לבחור **להשליך** בתפריט שלוש הנקודות. גם מנהלי קבוצה יכולים להעביר תגובות לאשפה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  670a46d5274f9ab5:
    english: "**Restore a comment**"
    translation: "**שחזור תגובה**"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9b202a60d5665ac6:
    english: The location of a discarded comment is labelled **Item removed**. Open its three-dot menu and select **Restore**.
    translation: במקום שבו הופיעה תגובה שהועברה לאשפה מוצגת התווית **הפריט הוסר**. יש לפתוח את תפריט שלוש הנקודות שלה ולבחור **לשחזר**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d6427576dab2b2c5:
    english: "**Delete a comment**"
    translation: "**מחיקת תגובה**"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d8b9add122e73295:
    english: Deleting a comment removes it permanently. It cannot be restored.
    translation: מחיקת תגובה מסירה אותה לצמיתות. לא ניתן לשחזר אותה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  51f7dce6a0188a51:
    english: If **Members can delete their own comments** is enabled in [Group permissions](/en/user_manual/groups/settings/permissions), members can permanently delete their own discarded comments. Group admins can delete any comment.
    translation: אם האפשרות **חברים יכולים למחוק את ההערות שלהם** מופעלת ב[הרשאות הקבוצה](/en/user_manual/groups/settings/permissions), חברי הקבוצה יכולים למחוק לצמיתות תגובות שלהם שהועברו לאשפה. מנהלי קבוצה יכולים למחוק כל תגובה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  63134f860609d669:
    english: Open the three-dot menu on an **Item removed** entry and select **Delete**.
    translation: יש לפתוח את תפריט שלוש הנקודות של פריט המסומן **הפריט הוסר** ולבחור **מחיקה**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  19580f91a59bf5ef:
    english: A confirmation message explains that the comment will be permanently deleted.
    translation: הודעת אישור מסבירה שהתגובה תימחק לצמיתות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
