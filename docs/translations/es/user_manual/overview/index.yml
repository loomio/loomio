  ced10eda436a40ca:
    english: "## How people use Loomio"
    translation: "## Cómo usan Loomio las personas"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4198817a2724ad0a:
    english: "**Member organizations** to involve members in decisions at scale. Political parties, consumer and worker co-operatives, and membership associations use Loomio to facilitate a safe, inclusive space for members to share information and raise topics, participate in important decisions and vote in General Assembly. Streamline decision processes, improve transparency and accountability, document discussions and record decisions, and include members' voices to organize for action."
    translation: "**Organizaciones de miembros** para incluir a sus integrantes en decisiones a gran escala. Los partidos políticos, las cooperativas de consumo y de trabajo, y las asociaciones de miembros usan Loomio para ofrecer un espacio seguro e inclusivo donde compartir información y plantear temas, participar en decisiones importantes y votar en la Asamblea General. Pueden agilizar los procesos de decisión, mejorar la transparencia y la rendición de cuentas, documentar las discusiones y las decisiones, e incluir las voces de sus integrantes para organizar acciones."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7b2fd1306e05f4e3:
    english: "**Self-managing organizations** to involve staff in decisions. Self-managing teams, worker co-operatives, and sociocratic organisations use Loomio to run consent, consensus, and advice-based decision processes across distributed teams and time zones. Tap into collective intelligence, distribute decision making, build governance and policy together, and document decisions and discussion."
    translation: "**Organizaciones autogestionadas** para incluir al personal en las decisiones. Los equipos autogestionados, las cooperativas de trabajo y las organizaciones sociocráticas usan Loomio para tomar decisiones mediante consentimiento, consenso y asesoramiento, incluso cuando sus equipos trabajan en distintos lugares y zonas horarias. Pueden aprovechar el conocimiento colectivo, distribuir la toma de decisiones, elaborar normas y políticas en conjunto, y documentar las decisiones y discusiones."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  75d7266c562f65c2:
    english: "**Boards, councils, and distributed networks** to involve stakeholders in decisions. Create a safe space for discussion, keep track of communications, and coordinate across geographies and time zones. Structure decision making processes, improve agility and response times, and preserve organizational memory."
    translation: "**Juntas, consejos y redes distribuidas** para incluir a las partes interesadas en las decisiones. Pueden crear un espacio seguro para debatir, hacer seguimiento de las comunicaciones y coordinarse entre lugares y zonas horarias. También pueden estructurar los procesos de decisión, responder con mayor rapidez y conservar la memoria de la organización."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cbe5ae77738f2704:
    english: "**Residential communities and co-ops** to make decisions together as neighbours. Cohousing communities, ecovillages, coliving cooperatives, housing co-ops, and land trusts use Loomio to replace or augment traditional strata and property management with democratic governance. Residents shape decisions about shared land, common spaces, and community agreements, and asynchronous discussion means members can fully participate whether they're on-site or away travelling, keeping a clear record of how the community has chosen to live together."
    translation: "**Comunidades residenciales y cooperativas** para tomar decisiones entre vecinos. Las comunidades de covivienda, ecoaldeas, cooperativas de vivienda compartida y de vivienda, y los fideicomisos de tierras usan Loomio para sustituir o complementar la administración tradicional de propiedades con una gestión democrática. Quienes viven allí participan en las decisiones sobre los terrenos compartidos, los espacios comunes y los acuerdos de convivencia. Las discusiones asincrónicas permiten participar tanto a quienes están presentes como a quienes están de viaje, y dejan constancia de cómo la comunidad ha decidido vivir en conjunto."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb1039083c952286:
    english: Loomio builds a living record of your organization; the decisions made, who was involved and the discussion leading up to the decision.
    translation: 'Loomio crea un registro vivo de tu organización: las decisiones tomadas, quiénes participaron y las discusiones que llevaron a cada decisión.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
