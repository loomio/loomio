    translation: Jamie selecciona **Iniciar una votación**, elige la plantilla de propuesta **Consentimiento** y completa el título, los detalles, las opciones, la duración y la configuración de las personas con derecho a voto.
    status: machine
    provider: codex/gpt-6-sol
