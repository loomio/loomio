  b27fab33a1dd5176:
    english: 'These guides explain complete decision processes: how to frame a decision, involve the right people, use discussion and proposals, respond to concerns, and record an outcome.'
    translation: 'Diese Anleitungen beschreiben vollständige Entscheidungsprozesse: wie du eine Entscheidung vorbereitest, die richtigen Menschen einbeziehst, Diskussionen und Vorschläge nutzt, auf Bedenken eingehst und ein Fazit festhältst.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bcbe5e3fd75700a6:
    english: They are different from the proposal-template pages. A [proposal template](/en/user_manual/polls/proposals/) explains one proposal and its response options. A decision process can use several proposals over time.
    translation: Sie unterscheiden sich von den Seiten zu Vorschlagsvorlagen. Eine [Vorschlagsvorlage](/en/user_manual/polls/proposals/) erklärt einen einzelnen Vorschlag und seine Antwortmöglichkeiten. Ein Entscheidungsprozess kann im Laufe der Zeit mehrere Vorschläge umfassen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  af00d65d38e41f8b:
    english: "## Choose a process"
    translation: "## Wähle einen Prozess"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f41e345421a1a1e8:
    english: |-
      | Process | Who decides? | Main question |
      |---|---|---|
      | [Simple decision process](simple_decision_process) | Defined by the group | How can we discuss, test, and decide? |
      | [Advice process](advice_process) | A person or delegated team | What advice should the decision maker consider? |
      | [Consent process](consent_process) | The group | Is the proposal safe to try without a meaningful objection? |
      | [Consensus process](consensus_process) | The group | Can we reach collective agreement? |
    translation: |-
      | Prozess | Wer entscheidet? | Zentrale Frage |
      |---|---|---|
      | [Einfacher Entscheidungsprozess](simple_decision_process) | Von der Gruppe festgelegt | Wie können wir diskutieren, einen Vorschlag prüfen und entscheiden? |
      | [Beratungsprozess](advice_process) | Eine Person oder ein beauftragtes Team | Welche Ratschläge sollte die entscheidende Person berücksichtigen? |
      | [Konsentprozess](consent_process) | Die Gruppe | Können wir den Vorschlag ausprobieren, ohne dass ein schwerwiegender Einwand dagegen spricht? |
      | [Konsensprozess](consensus_process) | Die Gruppe | Können wir gemeinsam eine Einigung erzielen? |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d2843889568043c0:
    english: Use the process required by your group's governing rules or decision policy. Different kinds of decisions may use different processes.
    translation: Verwende den Prozess, den die Regeln oder die Entscheidungsrichtlinie deiner Gruppe vorsehen. Für verschiedene Arten von Entscheidungen können unterschiedliche Prozesse gelten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bb120914edd79d13:
    english: If you only need help choosing a response format, compare [Proposals](/en/user_manual/polls/proposals/) and [Polls](/en/user_manual/polls/proposal_types/). If you administer the reusable choices shown when someone selects **Start a vote**, see [Poll templates](/en/user_manual/polls/poll_templates/).
    translation: Wenn du nur ein Antwortformat auswählen möchtest, vergleiche [Vorschläge](/en/user_manual/polls/proposals/) und [Abstimmungen](/en/user_manual/polls/proposal_types/). Wenn du die wiederverwendbaren Auswahlmöglichkeiten verwaltest, die nach **Jetzt abstimmen** angezeigt werden, lies [Abstimmungsvorlagen](/en/user_manual/polls/poll_templates/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
