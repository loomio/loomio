  e6670b54039f316a:
    english: Compare the number of votes issued to each person with the number they cast, see missed votes, and identify people who cast every vote issued to them. A person with no issued votes is not shown as having cast all votes. Anonymous polls are excluded because an anonymous ballot must not be associated with the person who cast it.
    translation: Confronta il numero di voti assegnati a ciascuna persona con quelli che ha espresso, vedi i voti mancati e individua chi ha espresso tutti i voti assegnati. Una persona a cui non sono stati assegnati voti non risulta aver espresso tutti i voti. I sondaggi anonimi sono esclusi perché un voto anonimo non deve essere associato alla persona che lo ha espresso.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  252da2b72775c4f8:
    english: Use **Delegates only** to review the voting record of current delegates. The CSV download uses the same name and delegate filters.
    translation: Usa **Solo delegati** per consultare lo storico delle votazioni dei delegati attuali. Anche il file CSV scaricato usa gli stessi filtri per nome e delegati.
    status: machine
