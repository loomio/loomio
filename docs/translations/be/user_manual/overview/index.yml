  7c8501ecb12311af:
    english: "## How Loomio works"
    translation: "## Як працуе Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  74caca2261c15283:
    english: 'Loomio has three main parts: groups, discussions, and polls.'
    translation: 'У Loomio ёсць тры асноўныя часткі: групы, абмеркаванні і апытанні.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5f0a46926a0f7350:
    english: "### Groups"
    translation: "### Групы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2060a64d0fabc6d7:
    english: A group is a place for an organization, team, or community to work together. Its home page explains the group's purpose and provides access to its discussions, polls, members, and files.
    translation: Група — месца для сумеснай працы арганізацыі, каманды або супольнасці. На галоўнай старонцы групы апісана яе мэта і ёсць доступ да абмеркаванняў, апытанняў, удзельнікаў і файлаў.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  311793a17709182c:
    english: "### Discussions"
    translation: "### Абмеркаванні"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  05ecdffe6c18a1df:
    english: Discussions keep the information and conversation about a topic together. People can share context, comment, reply, react, and use polls to move the discussion towards an outcome.
    translation: Абмеркаванні захоўваюць інфармацыю і размову па адной тэме ў адным месцы. Людзі могуць дзяліцца звесткамі, пісаць каментарыі і адказы, рэагаваць на паведамленні і выкарыстоўваць апытанні, каб прыйсці да высновы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dc9a50d7f1f20c80:
    english: Over time, discussions create a searchable record of the information considered and the decisions made by your group.
    translation: 'З часам абмеркаванні ствараюць архіў з магчымасцю пошуку: у ім захоўваюцца разгледжаныя звесткі і рашэнні вашай групы.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3448194e8a2ce09d:
    english: "### Polls and proposals"
    translation: "### Апытанні і прапановы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4ef7092f5f56e773:
    english: Polls help a group understand preferences, gather advice, and make decisions. Different poll templates support different processes. A proposal asks people to respond to a suggested course of action and explain the reason for their response.
    translation: Апытанні дапамагаюць групе зразумець перавагі ўдзельнікаў, сабраць парады і прыняць рашэнні. Розныя шаблоны апытанняў падыходзяць для розных працэсаў. Прапанова запрашае людзей выказацца наконт прапанаваных дзеянняў і патлумачыць свой адказ.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  51ab039bc7c374bd:
    english: Polls can be part of a discussion or run independently from the **Polls** tab on a group page.
    translation: Апытанні могуць быць часткай абмеркавання або праводзіцца асобна праз укладку **Апытанні** на старонцы групы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  47500e7125fdedbc:
    english: To learn where these parts appear in the interface, see the [Quick tour](/en/user_manual/overview/orientation). To start contributing, see [How to participate](/en/user_manual/overview/how-to-participate).
    translation: Каб даведацца, дзе знайсці гэтыя часткі ў інтэрфейсе, прачытайце [Кароткі агляд](/en/user_manual/overview/orientation). Каб пачаць удзельнічаць, прачытайце [Як удзельнічаць](/en/user_manual/overview/how-to-participate).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  57ed823687deabb5:
    english: "## Try it out"
    translation: "## Паспрабуйце"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b08a2d6a44f0d7ac:
    english: The best way to learn about Loomio is to [start a free trial](/try)
    translation: Найлепшы спосаб пазнаёміцца з Loomio — [пачаць бясплатны пробны перыяд](/try)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ced10eda436a40ca:
    english: "## How people use Loomio"
    translation: "## Як людзі выкарыстоўваюць Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4198817a2724ad0a:
    english: "**Member organizations** to involve members in decisions at scale. Political parties, consumer and worker co-operatives, and membership associations use Loomio to facilitate a safe, inclusive space for members to share information and raise topics, participate in important decisions and vote in General Assembly. Streamline decision processes, improve transparency and accountability, document discussions and record decisions, and include members' voices to organize for action."
    translation: "**Арганізацыі з удзельнікамі** выкарыстоўваюць Loomio, каб прыцягваць вялікую колькасць удзельнікаў да прыняцця рашэнняў. Палітычныя партыі, спажывецкія і працоўныя кааператывы, а таксама членскія аб’яднанні ствараюць прастору, дзе ўдзельнікі могуць бяспечна дзяліцца інфармацыяй і падымаць тэмы, удзельнічаць у важных рашэннях і галасаваць на агульным сходзе. Loomio дапамагае ўпарадкаваць прыняцце рашэнняў, павысіць празрыстасць і адказнасць, захоўваць абмеркаванні і рашэнні, улічваць меркаванні ўдзельнікаў пры арганізацыі сумесных дзеянняў."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7b2fd1306e05f4e3:
    english: "**Self-managing organizations** to involve staff in decisions. Self-managing teams, worker co-operatives, and sociocratic organisations use Loomio to run consent, consensus, and advice-based decision processes across distributed teams and time zones. Tap into collective intelligence, distribute decision making, build governance and policy together, and document decisions and discussion."
    translation: "**Самакіравальныя арганізацыі** выкарыстоўваюць Loomio, каб прыцягваць супрацоўнікаў да прыняцця рашэнняў. Самакіравальныя каманды, працоўныя кааператывы і сацыякратычныя арганізацыі прымаюць рашэнні на аснове згоды, кансэнсусу і парад, нават калі працуюць у розных часавых паясах. Так яны могуць абапірацца на калектыўныя веды, размяркоўваць адказнасць за рашэнні, разам вызначаць правілы кіравання і захоўваць абмеркаванні і рашэнні."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  75d7266c562f65c2:
    english: "**Boards, councils, and distributed networks** to involve stakeholders in decisions. Create a safe space for discussion, keep track of communications, and coordinate across geographies and time zones. Structure decision making processes, improve agility and response times, and preserve organizational memory."
    translation: "**Праўленні, рады і размеркаваныя сеткі** выкарыстоўваюць Loomio, каб прыцягваць зацікаўленыя бакі да прыняцця рашэнняў. Тут можна стварыць бяспечную прастору для абмеркаванняў, сачыць за паведамленнямі і каардынаваць працу ў розных рэгіёнах і часавых паясах. Гэта дапамагае ўпарадкаваць прыняцце рашэнняў, хутчэй рэагаваць на змены і захоўваць памяць арганізацыі."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cbe5ae77738f2704:
    english: "**Residential communities and co-ops** to make decisions together as neighbours. Cohousing communities, ecovillages, coliving cooperatives, housing co-ops, and land trusts use Loomio to replace or augment traditional strata and property management with democratic governance. Residents shape decisions about shared land, common spaces, and community agreements, and asynchronous discussion means members can fully participate whether they're on-site or away travelling, keeping a clear record of how the community has chosen to live together."
    translation: "**Жылыя супольнасці і кааператывы** выкарыстоўваюць Loomio, каб суседзі маглі разам прымаць рашэнні. Супольнасці сумеснага пражывання, экапаселішчы, жыллёвыя кааператывы і зямельныя трасты дапаўняюць або замяняюць звычайнае кіраванне жыллём і маёмасцю дэмакратычным самакіраваннем. Жыхары разам вырашаюць пытанні агульнай зямлі, супольных памяшканняў і правілаў жыцця. Дзякуючы абмеркаванням без неабходнасці прысутнічаць адначасова ўдзельнікі могуць паўнавартасна ўдзельнічаць, калі яны дома або ў паездцы. Пры гэтым захоўваецца зразумелы запіс таго, як супольнасць вырашыла жыць разам."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fb1039083c952286:
    english: Loomio builds a living record of your organization; the decisions made, who was involved and the discussion leading up to the decision.
    translation: 'Loomio стварае жывую гісторыю вашай арганізацыі: якія рашэнні былі прыняты, хто ў іх удзельнічаў і якія абмеркаванні да іх прывялі.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
