    translated_on: '2026-09-29'
  aeefd6206678dc53:
    english: You may need to extract a copy of a thread to store in a separate file archive.
    translation: Du kannst eine Kopie einer Diskussion erstellen, um sie in einem separaten Dateiarchiv aufzubewahren.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e3f452ea171c0fd5:
    english: "**Print** thread retains all comments, polls, votes and outcomes, along with thread formatting."
    translation: Mit **Drucken** bleiben alle Kommentare, Abstimmungen, Stimmen und Fazits sowie die Formatierung der Diskussion erhalten.
    status: machine
    provider: codex/gpt-6-sol
