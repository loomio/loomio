navigation_title: Preparação
blocks:
  4fdd26e2ff6dd9e5:
    english: "# Preparation"
    translation: "# Preparação"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4fc02624e97369e9:
    english: |-
      > <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../silvia_200.png"> For every minute of time with the group, consider spending 3 minutes planning. That means spending three hours preparing for a one hour session. Only as you improve should you spend less time planning.
      >
      > — Silvia Zuur
    translation: |-
      > <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../silvia_200.png"> Para cada minuto com o grupo, considere dedicar três minutos ao planejamento. Isso significa passar três horas se preparando para uma sessão de uma hora. Reduza esse tempo de planejamento apenas à medida que ganhar experiência.
      >
      > — Silvia Zuur
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d18832ab8f94fa1b:
    english: "## Understand Purpose"
    translation: "## Entenda o propósito"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  26d88950f0aac205:
    english: Clarification of purpose is one of the highest value offerings of a skilled facilitator — if they can help the group nail that, everything else is possible. Purpose operates at the level of a group as a whole, and at the level of individual discussions/decisions. Purpose is what enables judgment calls about what tools to deploy, what interventions to enact, and what outcomes to aim for. Lack of shared understanding about purpose can be fatal to a discussion, or to the group itself.
    translation: Esclarecer o propósito é uma das contribuições mais valiosas de quem facilita um grupo. Quando o grupo entende seu propósito, fica mais fácil avançar. Isso vale tanto para o grupo como um todo quanto para cada discussão ou decisão. O propósito orienta a escolha das ferramentas, das intervenções e dos resultados desejados. Sem um entendimento comum do propósito, uma discussão — ou mesmo o grupo — pode não prosperar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4276182ea8afaf36:
    english: "> Always refer back to your purpose-finding questions to check that you’re covering off what the participants want to learn or achieve. — Silvia Zuur"
    translation: "> Volte sempre às perguntas que ajudaram a definir o propósito. Assim, você pode verificar se está abordando o que as pessoas participantes querem aprender ou alcançar. — Silvia Zuur"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aabfa9d842af2688:
    english: On Loomio
    translation: No Loomio
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ea5f19b8970e4db6:
    english: |-
      * The app offers space for explication of purpose, such as the [group description](/en/user_manual/groups/starting_a_group/#group-description) and [discussion context](/en/user_manual/discussions/using_discussions/#discussion-context) fields.
      * A Loomio discussion *about* purpose is a great place to start with your group, if it's not already clear.
      * Our analytics (stats about how people use the software) show that groups with a clear shared purpose are more successful.
      * [Customer stories and case studies](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help) we've collected emphasise the importance of setting a collective purpose.
    translation: |-
      * O aplicativo oferece espaços para explicar o propósito, como os campos de [descrição do grupo](/en/user_manual/groups/starting_a_group/#group-description) e [contexto da discussão](/en/user_manual/discussions/using_discussions/#discussion-context).
      * Se o propósito ainda não estiver claro, comece uma discussão *sobre* ele com o grupo.
      * Nossos dados de uso mostram que grupos com um propósito comum e claro têm mais sucesso.
      * As [histórias de clientes e estudos de caso](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help) que reunimos destacam a importância de definir um propósito coletivo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e7d962ee3ac4e476:
    english: "## Rearrange the Furniture"
    translation: "## Reorganize o espaço"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bee66f99abaa8e2a:
    english: Desiging the space you invite people into greatly influences their experience. Every gathering is unique, and deserves a setup to suit. Familiarity signals safety, while changing the environment cues openness to new ideas.
    translation: A forma como você organiza o espaço influencia a experiência das pessoas convidadas. Cada encontro é diferente e merece uma organização adequada. Um ambiente familiar pode transmitir segurança; uma mudança no ambiente pode favorecer a abertura a novas ideias.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b98fa9d3e5726891:
    english: In offline spaces, literally rearranging the furniture is a habit that helps facilitators get into the right zone to hold space, and prompts them to think about what’s unique in that session. Imagine the difference between everyone seated in rows versus everyone in a circle.
    translation: Em encontros presenciais, reorganizar os móveis ajuda quem facilita a se preparar e a pensar no que torna aquela sessão específica. Imagine a diferença entre sentar todas as pessoas em fileiras ou em círculo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  546ba20d5778bb25:
    english: |-
      * Inviting people into a new digital space specifically for decision making is powerful — there’s a “threshold crossing” experience making it as distinct from other online spaces (which might be for socialising or other functions).
      * [Customising your group photo](/en/user_manual/groups/starting_a_group/#upload-a-group-photo) is a prime opportunity to craft the feeling of the space.
      * The group description is a main piece of “furniture” on the group page, and [you can customise it](/en/user_manual/groups/starting_a_group/#group-description) to suit.
    translation: |-
      * Convidar pessoas para um novo espaço digital dedicado à tomada de decisões marca uma transição. Isso ajuda a diferenciá-lo de outros espaços online usados para socializar ou para outras atividades.
      * [Personalizar a foto do grupo](/en/user_manual/groups/starting_a_group/#upload-a-group-photo) ajuda a definir a aparência e a atmosfera desse espaço.
      * A descrição do grupo é uma parte importante da página do grupo. [Você pode personalizá-la](/en/user_manual/groups/starting_a_group/#group-description) conforme suas necessidades.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bb1d23808a93d41b:
    english: "## Supplies, Tools, Materials"
    translation: "## Recursos, ferramentas e materiais"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b5e22b09672c3587:
    english: When facilitation is running smoothly, all the supplies a group needs are right at hand. In offline spaces, this stuff includes post-its, pens, paper, name tags, printouts, and background material. Every step a facilitator takes to be well-prepared in this way allows more time and energy for the work.
    translation: Quando a facilitação funciona bem, o grupo tem à mão tudo de que precisa. Em encontros presenciais, isso pode incluir notas adesivas, canetas, papel, crachás, materiais impressos e informações de apoio. Cada etapa de preparação deixa mais tempo e energia para o trabalho do grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7da21174f12dfb9e:
    english: |-
      * Many groups use the group description to link to a shared drive of collaborative documents, background information, the group's project management or task tracking system, a list of contacts, etc.
      * Each thread deserves consideration of what people might need to engage with it — putting all the information right at hand is essential (for example, if you reference something, linking directly to it is much more effective than expecting people to search for it).
    translation: |-
      * Muitos grupos usam a descrição do grupo para incluir links para documentos colaborativos, informações de apoio, sistemas de gestão de projetos ou tarefas, listas de contatos e outros recursos.
      * Em cada discussão, pense no que as pessoas precisam para participar. Deixe as informações necessárias ao alcance delas. Por exemplo, se você mencionar um material, inclua um link direto em vez de esperar que as pessoas o procurem.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  35dd82fcf7e543d8:
    english: "## Design the Experience"
    translation: "## Planeje a experiência"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fbc88dd9b9738343:
    english: 'Once they have the basic pieces in place (purpose, tools, background info), good facilitators take time to think through the design of the experience they are inviting: the situation, what success could look like, all the possible pathways and choices. They don’t jump in without a considered design.'
    translation: Depois de definir o propósito e reunir as ferramentas e informações de apoio, quem facilita deve pensar na experiência que está propondo. Considere a situação, o que seria um bom resultado e os diferentes caminhos e escolhas possíveis. Dedique tempo a esse planejamento antes de começar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a4dce16ca48a4324:
    english: Time and time again we have seen people drastically underestimate the need for prep and design. Stop and think about the experience you want to host, before jumping straight in. Investment in design is paid back many times over by success later.
    translation: Vemos com frequência pessoas subestimarem o tempo necessário para preparar e planejar uma atividade. Antes de começar, pare e pense na experiência que você quer oferecer. Esse investimento pode contribuir muito para os resultados posteriores.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e91f002ee6e53550:
    english: "* Loomio’s most basic functionality follows the structure of good facilitation by design: invite people, discuss a topic, gather divergent input, converge into a specific proposal, test for agreement, confirm outcome."
    translation: "* As funções básicas do Loomio seguem uma sequência de facilitação: convidar pessoas, discutir um tema, reunir diferentes pontos de vista, chegar a uma proposta específica, verificar se há acordo e confirmar a conclusão."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  211e08fc109e6449:
    english: |-
      * Skilled users are already adapting Loomio for various experience designs — such as a multi-step consultation processes, signing off documents, etc. Each job, when facilitated effectively, takes a certain repeatable shape.
      * Online collaboration design doesn't have to reinvent the wheel. Trust what you know works, and translate it. Many tried and tested offline processes can be adapted to the online space (ex: the [Advice Process](/en/guides/making_decisions/advice_process.html)).
      * [Case studies](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help) of thoughtfully designed processes could be used as “recipes” — if you're not sure what design to use, start by seeing what others have tried.
    translation: |-
      * Pessoas com experiência já adaptam o Loomio a diferentes processos, como consultas em várias etapas e aprovação de documentos. Quando bem facilitado, cada tipo de trabalho pode seguir uma estrutura que se repete.
      * Para planejar a colaboração online, aproveite o que já funciona. Muitos processos presenciais podem ser adaptados ao ambiente online, como o [Processo de aconselhamento](/en/guides/making_decisions/advice_process.html).
      * [Estudos de caso](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help) de processos bem planejados podem servir como exemplos. Se você não souber por onde começar, veja o que outros grupos já experimentaram.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7e99e2ddc63d7a98:
    english: "## Contextualise the Moment"
    translation: "## Considere o contexto"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  427b66f23f4b3c09:
    english: Discussions do not occur in a vacuum, but in the larger context of the group’s history and practice. To be effective, facilitated experiences have to occur with the right timing, and fit in with the rest of the group’s process.
    translation: As discussões fazem parte da história e das práticas do grupo. Para que uma atividade facilitada funcione, ela precisa acontecer no momento certo e se integrar aos demais processos do grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  48a889b09297e38b:
    english: 'Key Context Questions:'
    translation: 'Perguntas importantes sobre o contexto:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7eccc4a4e4a3b175:
    english: |-
      * Is this a moment of transition?
      * Is this an enhancement of existing practice?
      * Is this one of many concurrent processes, or a singular focus?
      * Are we here to solve a problem, or go deeper, wider, narrower?
    translation: |-
      * Este é um momento de transição?
      * Estamos aprimorando uma prática existente?
      * Este é um entre vários processos simultâneos ou o foco principal do grupo?
      * Queremos resolver um problema ou explorar o tema com mais profundidade, amplitude ou foco?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c7c8ce0838a076cd:
    english: |-
      * Loomio groups nearly always have a “champion”, who understands the group’s context and makes the call about whether introducing Loomio is right for them.
      * It's not wise to try to change everything at once. Any time Loomio fits nicely into existing workflows, groups will adopt it better.
      * Good timing is when the group is ready to incorporate online collaborative practice effectively. They have to feel the pain of not having the online decision-making space, and be motivated to solve that problem.
      * Consider the group’s attention economy to determine when the right time to raise a given topic might be. Collective attention is a limited resource.
      * Many groups are not even cognisant of their existing collaborative practice and habits, much less clear about how Loomio might fit in. Start with a discussion about the current way of doing things, and what's working or not working.
    translation: |-
      * Quase sempre há alguém no grupo que conhece seu contexto e avalia se faz sentido introduzir o Loomio.
      * Evite mudar tudo de uma vez. Os grupos tendem a adotar melhor o Loomio quando ele se encaixa nos processos que já usam.
      * O momento adequado é quando o grupo está pronto para colaborar online. As pessoas precisam perceber a falta de um espaço para tomar decisões online e querer resolver esse problema.
      * Considere quanto da atenção do grupo está disponível antes de levantar um tema. A atenção coletiva é limitada.
      * Muitos grupos ainda não identificaram seus próprios hábitos de colaboração e não sabem como o Loomio pode se encaixar neles. Comece com uma discussão sobre como o grupo trabalha hoje e o que funciona ou precisa mudar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7bc2616a0ec0b1dc:
    english: "## The Role of the Facilitator"
    translation: "## O papel de quem facilita"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c6d08854a875262a:
    english: Good facilitation requires self-awareness on an individual and collective level. Lack of understanding of the role can lead to misunderstandings, conflict, or unsafe situations.
    translation: Uma boa facilitação exige que cada pessoa e o grupo reconheçam seu próprio papel. Quando o papel de quem facilita não está claro, podem surgir mal-entendidos, conflitos ou situações inseguras.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aa59e3e4d08a95b7:
    english: "> Have the power handed over to you. When you’re invited into a new group or organization, everybody will be thinking: Who’s this joker? Why should we listen to them? Get somebody who the participants know and trust to introduce you. This builds you up in the participants' minds and helps to hand over the power over to you. — Silvia Zuur"
    translation: "> Peça que alguém apresente você ao grupo. Quando você é convidado a entrar em um grupo ou organização, as pessoas podem se perguntar quem você é e por que deveriam ouvi-lo. Peça a alguém que elas conheçam e em quem confiem para fazer a apresentação. Isso ajuda as pessoas a reconhecerem seu papel e a confiarem a você a condução do encontro. — Silvia Zuur"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  02d38d1def45d150:
    english: |-
      ### Consent
      It’s critical that the group consents to be facilitated. Attempting to facilitate otherwise can be at worst coercive (unfair to the group) and dangerous (unfair to the facilitator) — and will face resistance and confusion. Facilitators put themselves in a vulnerable position; they must have mandate or they should not agree to engage. Consent is critical for both the facilitator and participants.
    translation: |-
      ### Consentimento
      É essencial que o grupo concorde em ser facilitado. Tentar facilitar sem esse consentimento pode ser coercitivo para o grupo e arriscado para quem facilita, além de gerar resistência e confusão. Quem facilita se coloca em uma posição vulnerável e precisa receber um mandato claro antes de assumir esse papel. O consentimento é importante para todas as pessoas envolvidas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a1a8c6ca89dad49a:
    english: |-
      ### Responsibility
      Once a facilitator takes up a mandate, they carry enhanced responsibilities. Facilitators have more claim to floor time, and directing the group’s attention. This has to be used in service to the whole, not for a personal agenda. The words and demeanor of the facilitator will also have a disproportionate effect, meaning they have to act with heightened consideration.
    translation: |-
      ### Responsabilidade
      Ao aceitar esse mandato, quem facilita assume responsabilidades adicionais. Essa pessoa pode ocupar mais tempo de fala e direcionar a atenção do grupo. Deve usar essa posição em benefício de todos, sem promover interesses pessoais. Suas palavras e atitudes também têm um efeito maior sobre o grupo, por isso exigem mais cuidado.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b5f6b4ebd477c97c:
    english: |-
      ### Power
      Facilitation by nature introduces power differentials. If the facilitator cannot exercise power in certain ways, they cannot do their job. For example, to keep a discussion on topic the facilitator might interrupt someone, or say that a certain way of interacting is not OK. It’s not appropriate to expect a facilitator to shoulder responsibility for the experience without giving them the powers they need to deliver successfully. There is no one right answer about how much power, but it has to be balanced with the level of responsibility.
    translation: |-
      ### Poder
      A facilitação cria diferenças de poder. Quem facilita precisa exercer certa autoridade para cumprir seu papel. Por exemplo, pode ser necessário interromper alguém para manter a discussão no tema ou dizer que determinada forma de interação não é aceitável. Não é adequado atribuir a uma pessoa a responsabilidade pela experiência sem lhe dar a autoridade necessária para conduzi-la. Não existe uma medida única de poder: ela precisa ser proporcional à responsabilidade.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c82df3fe42db014a:
    english: |-
      ### Responsiveness
      Facilitators do their best work when they can adapt effectively to the emergent reality. Human beings are endlessly complex, and groups of them exponentially more so. Rigid adherence to a plan or protocol without flexibility can set the group up to fail. If a facilitator is not allowed or not willing to adapt to changing circumstance, they cannot effectively hold the space for dynamic humans.
    translation: |-
      ### Capacidade de adaptação
      Quem facilita trabalha melhor quando consegue se adaptar ao que acontece no grupo. As pessoas são complexas, e a dinâmica entre elas acrescenta ainda mais complexidade. Seguir um plano ou protocolo rigidamente pode prejudicar o grupo. Sem disposição ou liberdade para se adaptar às mudanças, fica difícil conduzir um espaço em que as pessoas possam participar de forma efetiva.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aad36b296834ab22:
    english: "> Wear and un-wear the facilitation-hat. A challenge many people face is trying to facilitate meetings and workshops with their own team. As a facilitator, they need to be neutral. But as a team member, they have valuable insights to share. Make it really clear when you’re a facilitator and when you’re being a participant. — Silvia Zuur"
    translation: "> Deixe claro quando você está facilitando e quando está participando. Facilitar reuniões e oficinas da própria equipe pode ser difícil. No papel de facilitador, você precisa manter a neutralidade. Como integrante da equipe, também pode ter contribuições valiosas. Avise ao grupo quando estiver atuando em cada papel. — Silvia Zuur"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  85c4fcf7a6e72361:
    english: |-
      * Many groups using Loomio are experienced with facilitation and already have a shared understanding of the role. They already adapt the tool to meet these needs with some success.
      * Often the person who starts a discussion is assumed to be facilitating it, barring another agreed understanding in the group. Clarity about who is facilitating can greatly enhance mutual safety and success.
      * Loomio naturally creates a dynamic and open to distributed acts of facilitation, such as users tagging in others, requests to stay on topic, suggestions of the right timing for a proposal, etc — but this is often left implicit. Explicitly naming what acts of facilitation are and discussing whether this role is centralised or distributed can clarify the role.
      * Implicit distributed facilitation can be the default starting place for an online group (ie, no discussion of facilitation as a named role), but that setup is actually best for advanced groups prgressing past working with explicit facilitation.
    translation: |-
      * Muitos grupos que usam o Loomio já têm experiência com facilitação e compartilham um entendimento desse papel. Eles adaptam a ferramenta às suas necessidades.
      * Muitas vezes, presume-se que a pessoa que iniciou uma discussão também vai facilitá-la, a menos que o grupo tenha combinado outra coisa. Deixar claro quem facilita pode tornar a participação mais segura e ajudar o grupo a avançar.
      * O Loomio permite que diferentes pessoas realizem ações de facilitação, como chamar outras pessoas para a conversa, pedir que a discussão continue no tema ou sugerir o momento de apresentar uma proposta. Muitas vezes, porém, esse papel fica implícito. Identificar essas ações e discutir se a facilitação ficará com uma pessoa ou será compartilhada ajuda a esclarecer as responsabilidades.
      * Um grupo online pode começar compartilhando a facilitação sem definir esse papel explicitamente. Essa forma de trabalho, porém, costuma funcionar melhor para grupos experientes, que já passaram por processos com facilitação explícita.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
