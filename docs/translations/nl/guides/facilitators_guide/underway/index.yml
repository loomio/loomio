navigation_title: Tijdens het proces
blocks:
  30163152525e029c:
    english: "# Underway"
    translation: "# Tijdens het proces"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  02feef9bf78ef420:
    english: "## Where are we on the Map?"
    translation: "## Waar staan we in het proces?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '083f066ff9a3cfde':
    english: People feel more confident and better held if they can orient themselves on a timeline or agenda. They want to know what they’re doing now, what’s coming up, and to be reminded of what they’ve already done. Understanding the overall shape of the process helps people understand how to contribute effectively.
    translation: Mensen voelen zich zekerder en beter begeleid als ze kunnen zien waar ze zich op een tijdlijn of agenda bevinden. Ze willen weten wat ze nu doen, wat er nog komt en wat ze al hebben gedaan. Als mensen het verloop van het proces begrijpen, weten ze beter hoe ze kunnen bijdragen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ea2ef3e629108828:
    english: For example if they can see there’s a Q&A section later, they'll be more willing to hold their questions during a presentation. If it’s clear that there’s a divergent phase and then a convergent phase, people will hold back from jumping to solutions too soon. People need to know what kind of input they are being asked for, and when.
    translation: Als mensen bijvoorbeeld weten dat er later tijd is voor vragen en antwoorden, bewaren ze hun vragen eerder tot na een presentatie. Als duidelijk is dat er eerst een fase is om ideeën te verkennen en daarna een fase om tot een besluit te komen, zullen ze minder snel met oplossingen komen. Mensen moeten weten welke bijdrage van hen wordt gevraagd en wanneer.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7a5d009dfc4e0f6b:
    english: Mapping the process well enough to communicate it also challenges facilitators to fully think through the journey, and helps them make sure each part of the process has a purpose that builds a cohesive whole. A well-facilitated experience follows a logical progression.
    translation: Een proces zo duidelijk in kaart brengen dat je het kunt uitleggen, helpt begeleiders om het hele verloop te doordenken. Zo kunnen ze nagaan of elk onderdeel een doel heeft en de onderdelen samen een geheel vormen. Een goed begeleid proces verloopt in een logische volgorde.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aabfa9d842af2688:
    english: On Loomio
    translation: Op Loomio
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  af3599a59685a726:
    english: |-
      * A Loomio decision already follows a basic logical progression (which is why it works): Gather (open/invite), Discuss (divergent), Propose (convergent), Decide and Act (conclude).
      * Many Loomio users are employing the tool as part of explicitly mapped experiences, such as a multi-stage consultation process.
      * We offer some tools of facilitators to help “reveal the map” to users, such as the group description field, and proposal deadlines. These can be proactively leveraged to increase context for participants.
    translation: |-
      * Een beslissing op Loomio volgt al een logische volgorde (en daarom werkt het): verzamelen (openen en uitnodigen), bespreken (ideeën verkennen), voorstellen (opties samenbrengen), beslissen en handelen (afronden).
      * Veel mensen gebruiken Loomio binnen een proces waarvan de stappen vooraf in kaart zijn gebracht, zoals een raadpleging in meerdere fasen.
      * We bieden begeleiders hulpmiddelen om het verloop zichtbaar te maken voor deelnemers, zoals de groepsbeschrijving en deadlines voor voorstellen. Door die te gebruiken, geef je deelnemers meer context.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  228ae545a39cd553:
    english: "## The Art of Noticing"
    translation: "## De kunst van het opmerken"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  04155220f602a7e8:
    english: Noticing is probably the most critical facilitation skill of all. The facilitator uses noticing to figure out what interventions or responses are needed, how to invite the right contributions, and to help the group notice itself. The value of facilitation is having someone paying attention and acting on what they notice, while others may be focused on specific content or their own agendas.
    translation: Opmerken is misschien wel de belangrijkste vaardigheid van een begeleider. Door goed op te letten, kan de begeleider bepalen welke ingreep of reactie nodig is, hoe die passende bijdragen kan uitnodigen en hoe de groep zich bewust kan worden van haar eigen gedrag. De waarde van begeleiding is dat iemand oplet en handelt naar wat die opmerkt, terwijl anderen zich op de inhoud of hun eigen doelen richten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  90a03fdb345369b7:
    english: 'Effective noticing is a combination of good informational inputs, and sensitivity and skill to interpret them. Many facilitators talk about “reading” a room: emotional reactions, tensions,  power dynamics. Facilitators need effective information signalling systems.'
    translation: 'Om goed te kunnen opmerken, heb je betrouwbare informatie nodig en de gevoeligheid en vaardigheid om die te duiden. Veel begeleiders spreken over het ‘lezen’ van een ruimte: emoties, spanningen en machtsverhoudingen. Daarvoor hebben ze goede signalen nodig.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  49b0f2cc823e0384:
    english: |-
      * Many current features assist with noticing — the biggest one is probably watching how the pie is shaping up in a proposal.
      * The software notices some things: who has and has not yet participated, what topics are being raised, who has and has not accepted their group invitation, etc.
      * On Loomio, a single facilitator can read across dozens of discussions at the same time, see clearly what’s being shared, and act accordingly.
      * Talking online can make the implicit explicit, and therefore easier to notice.
      * Communicating in writing can be very good for naming what’s being noticed and why a certain action is being taken in response. For example, you can quote someone’s exact words and reflect back what’s revealed by them. Or you can do the same thing at the level of a whole discussion, picking out a range of quotes and noticing themes or emerging conflicts.
      * Noticing is much easier when you slow things down, which is one of Loomio’s great advantages — asynchronous communication you can read at any pace. It also makes it possible to notice across time, referring directly to past discussions.
      * Because you can have simultaneous discussions, it's possible to have a layer of “meta” discussion (aka “blue hat”, aka discussion about the discussion) at the same time as progressing the main discussions. So you can collectively have a space to practice noticing without slowing down the process.
    translation: |-
      * Veel bestaande functies helpen je om ontwikkelingen op te merken. Een belangrijk voorbeeld is het volgen van de verdeling van stemmen bij een voorstel.
      * De software houdt bepaalde zaken bij: wie al heeft deelgenomen en wie nog niet, welke onderwerpen ter sprake komen, wie een groepsuitnodiging heeft aanvaard en wie nog niet, enzovoort.
      * Op Loomio kan één begeleider tientallen discussies tegelijk volgen, duidelijk zien wat mensen delen en daarop reageren.
      * In een online gesprek worden zaken die anders impliciet blijven soms expliciet, waardoor je ze gemakkelijker opmerkt.
      * Schriftelijke communicatie helpt je te benoemen wat je opmerkt en waarom je daarop reageert. Je kunt bijvoorbeeld iemands exacte woorden citeren en teruggeven wat daaruit blijkt. Je kunt ook citaten uit een hele discussie verzamelen om thema’s of opkomende meningsverschillen zichtbaar te maken.
      * Opmerken gaat gemakkelijker als je het tempo verlaagt. Dat is een groot voordeel van Loomio: je kunt asynchrone communicatie in je eigen tempo lezen. Je kunt ook ontwikkelingen door de tijd heen opmerken door rechtstreeks naar eerdere discussies te verwijzen.
      * Omdat discussies tegelijk kunnen plaatsvinden, kun je naast de hoofddiscussies een gesprek over het gesprek voeren (ook wel een ‘blauwe hoed’ genoemd). Zo kan de groep samen oefenen met opmerken zonder het proces te vertragen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cdb52080510ddb69:
    english: "## Hearing Diverse Voices"
    translation: "## Verschillende stemmen horen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  150ff74c2805696b:
    english: In our society, multiple layers of history, power dynamics, culture, and psychology conspire to amplify certain voices and suppress others. This plays out at every level of experience, from our innermost subconscious beliefs to our political system and laws.
    translation: In onze samenleving zorgen geschiedenis, machtsverhoudingen, cultuur en psychologie er samen voor dat sommige stemmen meer ruimte krijgen en andere minder. Dat speelt op elk niveau, van onze diepste onbewuste overtuigingen tot ons politieke stelsel en onze wetten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a3dccb91d161d18a:
    english: But the best ideas do not always come from the loudest voices, and the role of facilitation is to counteract these biases. It’s important to be aware of the dynamics we are collectively grappling with if our goals are social justice, group effectiveness, and high quality decision making.
    translation: De beste ideeën komen niet altijd van de mensen die het hardst spreken. Begeleiding kan helpen om deze vooroordelen tegen te gaan. Als we streven naar sociale rechtvaardigheid, effectieve groepen en goede beslissingen, moeten we ons bewust zijn van de patronen waarmee we samen te maken hebben.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5e8160d5b0da948a:
    english: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../rich_200.png"> If you want to innovate, you have to make space for different points of view — luckily, this is also what you need to do if you want a team where everyone is empowered. All kinds of cultural and technical factors conspire to privilege some voices at the expense of others. There are many practices you can implement to systematically challenge that bias, but just being aware of it is a good starting point. — Richard Bartlett'
    translation: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../rich_200.png"> Als je wilt vernieuwen, moet je ruimte maken voor verschillende perspectieven. Dat is ook nodig voor een team waarin iedereen kan bijdragen. Allerlei culturele en technische factoren geven sommige stemmen voorrang ten koste van andere. Er zijn veel werkwijzen waarmee je dat systematisch kunt tegengaan, maar je ervan bewust worden is al een goed begin. — Richard Bartlett'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  63e0bdf44ad2df5f:
    english: Our lived human experience is to inhabit a singular consciousness, so humans tend to forget that others experience the world differently. Even within a seemingly homogenous group, there is incredible diversity — perspectives, pace, preferences. Internalising this truth — that others are different from myself — is a central personal growth challenge.
    translation: Ieder van ons ervaart de wereld vanuit een eigen bewustzijn. Daardoor vergeten mensen gemakkelijk dat anderen de wereld anders ervaren. Zelfs binnen een groep die op het eerste gezicht homogeen lijkt, bestaan grote verschillen in perspectief, tempo en voorkeuren. Echt beseffen dat anderen anders zijn dan jij, is een belangrijke stap in persoonlijke ontwikkeling.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  62f6a86aa220b787:
    english: There is no such thing as one size fits all. Any mode of interacting enhances some voices and quiets others, or emphasises different tendencies within an individual. So, it’s necessary to employ a range of approaches to invite the best from multiple diverse voices.
    translation: Eén aanpak werkt niet voor iedereen. Elke manier van samenwerken geeft sommige stemmen meer ruimte en andere minder, of benadrukt bepaalde kanten van een persoon. Gebruik daarom verschillende werkwijzen om uiteenlopende mensen de kans te geven hun beste bijdrage te leveren.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8f9c1b2c0e40b1fc:
    english: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../silvia_200.png"> Check you’re catering to different learning styles. One simple way to check is with the Head, Heart, Hands metaphor. People who learn with their Head need facts and detailed information. A Heart learner thrives off stories. They need an emotional connection to the work. Learning with the Hands is all about doing stuff and getting active. — Silvia Zuur'
    translation: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../silvia_200.png"> Controleer of je rekening houdt met verschillende manieren van leren. Een eenvoudige manier is de metafoor van hoofd, hart en handen. Mensen die met hun hoofd leren, hebben feiten en gedetailleerde informatie nodig. Mensen die met hun hart leren, halen veel uit verhalen. Ze hebben een emotionele band met het werk nodig. Leren met de handen draait om doen en actief bezig zijn. — Silvia Zuur'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  04a3a7bc850913ab:
    english: One of the best approaches to bringing out and weaving together diverse voices is to invite diverse modes of interaction, which will serve different needs and preferences, and level the communication playing field.
    translation: Een goede manier om verschillende stemmen naar voren te brengen en samen te laten komen, is om meerdere vormen van interactie aan te bieden. Daarmee sluit je aan bij verschillende behoeften en voorkeuren en geef je mensen een gelijkwaardiger kans om zich uit te spreken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ba31b7da59193745:
    english: 'Some classic design building blocks to address communication diversity in collaborative communication:'
    translation: 'Enkele bekende bouwstenen om ruimte te maken voor verschillende manieren van communiceren tijdens samenwerking:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fbcafe73c1d8720b:
    english: |-
      * **Group size** — individual reflection, pairs, small group, large group, one-to-one, one-to-many, many-to-many.
      * **Medium of expression** — writing, drawing, video, singing, dance, flowcharts, equations, symbols, stories, tears, laughter, debate, etc.
      * **Discussion protocols** — rounds (hear from each person once before moving on), rate limiting (you can only speak again after two others have spoken), talking stick (only speak when you have the stick — no interrupting), time-limited contributions (you can talk for 1 minute only), time-unlimited contributions (you can hold the floor indefinitely and everyone will deeply listen), tracking contributions (how much have women vs men spoken, etc), holding periods of silence between speakers (for processing and reflection).
      * **Embrace silence** *Silence is only awkward if you let it be awkward. Silence is a chance for people to think. — Silvia Zuur*
    translation: |-
      * **Groepsgrootte** — individuele reflectie, tweetallen, kleine groepen, grote groepen, één op één, één tegen velen, velen met velen.
      * **Uitdrukkingsvorm** — schrijven, tekenen, video, zingen, dansen, stroomdiagrammen, vergelijkingen, symbolen, verhalen, tranen, lachen, debat, enzovoort.
      * **Gespreksafspraken** — rondes (iedereen komt één keer aan het woord voordat je verdergaat), spreekbeurten beperken (je spreekt pas weer nadat twee anderen hebben gesproken), een spreekstok (alleen wie de stok heeft spreekt, zonder onderbrekingen), bijdragen met een tijdslimiet (je spreekt maximaal één minuut), bijdragen zonder tijdslimiet (je houdt het woord zolang je wilt en iedereen luistert aandachtig), bijdragen bijhouden (hoeveel hebben vrouwen gesproken in vergelijking met mannen, enzovoort), stiltes tussen sprekers laten vallen (om informatie te verwerken en na te denken).
      * **Geef ruimte aan stilte** *Stilte is alleen ongemakkelijk als je haar ongemakkelijk laat zijn. Stilte geeft mensen de kans om na te denken. — Silvia Zuur*
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ff925b4be393907c:
    english: |-
      * The design of Loomio has always been about “hearing all voices”, including people who aren’t able to be there in person, are quieter, are busy, etc.
      * In text, every voice is more or less the same “volume” and “speed”. Written asynchronous communication offers a kind of leveling of the field.
      * The proposal feature is essentially a “round”, assisting groups to facilitate each individual person having their say (if they want to) on an equal basis.
      * Loomio enables multi-media (links, videos, images, diagrams, supporting evidence), which serve various communication styles.
      * Loomio itself is pretty basic, but with active facilitation and group maturity, it is possible to employ discussion protocols “manually” using cultural norms or agreed rules (eg, a discussion where everyone only posts once until everyone else has participated).
      * Loomio provides flexible tools for small and large group interaction, using parent groups and subgroups. Some large consultation processes have involved multiple smaller groups which are then synthesised into a larger outcome.
      * People who want time for individual reflection can take time out and process their thoughts, and then come back and share a longer comment or link to a document. This is a “self-selecting” example of creating interplay between individual and group communication.
      * Loomio accessibility features and multi-lingual translations make it possible for people with very different needs to participate as equals in one discussion. This is a key example of how technology can enable equitable participation in a way that’s nearly impossible in person.
      * If someone is contributing more than their share (talking too much), it’s technically possible to just scroll on by (whereas in person this behaviour can totally dominate the interaction). However, people posting “walls of text” can still be detrimental to a balanced Loomio discussion.
    translation: |-
      * Loomio is altijd ontworpen om ‘alle stemmen te horen’, ook die van mensen die niet persoonlijk aanwezig kunnen zijn, minder snel iets zeggen of het druk hebben.
      * In tekst heeft elke stem ongeveer hetzelfde ‘volume’ en dezelfde ‘snelheid’. Asynchrone schriftelijke communicatie maakt de verschillen daarin kleiner.
      * Een voorstel werkt in wezen als een ronde: het helpt groepen om ieder lid op gelijke voet aan het woord te laten, als die dat wil.
      * Loomio ondersteunt verschillende media (links, video’s, afbeeldingen, diagrammen en onderbouwing), passend bij uiteenlopende manieren van communiceren.
      * Loomio zelf biedt eenvoudige hulpmiddelen. Met actieve begeleiding en een groep die goed samenwerkt, kun je ook ‘handmatig’ gespreksafspraken gebruiken. Je kunt bijvoorbeeld afspreken dat iedereen pas een tweede bericht plaatst nadat alle anderen hebben deelgenomen.
      * Loomio biedt flexibele hulpmiddelen voor samenwerking in kleine en grote groepen, met hoofdgroepen en subgroepen. Bij sommige grote raadplegingen werken meerdere kleine groepen aan bijdragen die later in een gezamenlijke conclusie worden samengebracht.
      * Wie tijd nodig heeft om zelf na te denken, kan gedachten rustig verwerken en later terugkomen met een langere reactie of een link naar een document. Zo kan iemand zelf afwisselen tussen individuele reflectie en communicatie met de groep.
      * Dankzij toegankelijkheidsfuncties en vertalingen kunnen mensen met sterk uiteenlopende behoeften op gelijke voet aan één discussie deelnemen. Dit laat zien hoe technologie gelijkwaardige deelname mogelijk kan maken op een manier die bij een bijeenkomst lastig te bereiken is.
      * Als iemand veel meer bijdraagt dan anderen, kun je technisch gezien gewoon verder scrollen. Bij een bijeenkomst kan dat gedrag het gesprek volledig overheersen. Toch kunnen lange lappen tekst ook op Loomio een evenwichtige discussie verstoren.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bb74ebca94285a48:
    english: "## Counter Cognitive Bias"
    translation: "## Cognitieve vertekening tegengaan"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c8d4a9a10da47a62:
    english: Human brains have evolved over millions of years to balance quick, efficient “good enough” thinking with slow, expensive, deep analysis. This allows us to use instincts, heuristics, and generalisations as cheap and fast solutions most of the time, and to engage deep analysis when needed.
    translation: Het menselijk brein heeft zich gedurende miljoenen jaren ontwikkeld om snel en efficiënt ‘goed genoeg’ te denken en, wanneer nodig, langzaam en grondig te analyseren. Daardoor kunnen we meestal vertrouwen op instincten, vuistregels en generalisaties als snelle oplossingen, en dieper nadenken wanneer dat nodig is.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3a35775e59cdea17:
    english: But sometimes we get it wrong. In fact, there are well-known “bugs” in the human cognition program, which can keep people from making the best decisions. This is further complicated in group situations. We need to be aware of these dynamics.
    translation: Maar soms zitten we ernaast. Er zijn bekende ‘fouten’ in ons denken die ons ervan kunnen weerhouden de beste beslissingen te nemen. In groepen wordt dit nog ingewikkelder. We moeten ons bewust zijn van deze patronen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e3d808eb17e1aa5a:
    english: There is a huge [range of cognitive biases](https://en.wikipedia.org/wiki/List_of_cognitive_biases) (this list is really worth a read), all of which have potential impacts on decision making and collaboration. Facilitation can be an important tool to deal with them, to raise awareness of their existence, encourage proactive choices about them. For example, asking when is it more important to move quickly and when is it more important to be accurate.
    translation: Er bestaat een grote [verscheidenheid aan cognitieve vertekeningen](https://en.wikipedia.org/wiki/List_of_cognitive_biases) (deze lijst is de moeite van het lezen waard). Ze kunnen allemaal invloed hebben op beslissingen en samenwerking. Begeleiding kan mensen helpen ze te herkennen en er bewust mee om te gaan. Je kunt bijvoorbeeld samen bespreken wanneer snelheid belangrijker is en wanneer nauwkeurigheid voorrang heeft.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c4755a454121a7b6:
    english: One powerful tool to counter cognitive bias and increase quality of decisions is structured processes and communication. The challenge of following a process instead of the “path of least resistance” can help highlight thinking errors and bias. Facilitators sometimes push for things that feel challenging or trigger resistance, precisely because brains are being asked to step out of familiar patterns. Discipline in this area can help groups achieve their deeper goals, which can be worth some temporary discomfort.
    translation: Een krachtig hulpmiddel tegen cognitieve vertekening is een gestructureerd proces met duidelijke communicatie. Een proces volgen in plaats van de weg van de minste weerstand kiezen, kan denkfouten en vooroordelen zichtbaar maken. Begeleiders vragen soms bewust om iets wat moeilijk voelt of weerstand oproept, juist omdat mensen daarmee vertrouwde denkpatronen verlaten. Die discipline kan groepen helpen hun bredere doelen te bereiken, ook als dat tijdelijk ongemakkelijk is.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  99caa45d2ab4ae8b:
    english: 'Some examples of processes that can help mitigate cognitive bias:'
    translation: 'Enkele voorbeelden van werkwijzen die cognitieve vertekening kunnen verminderen:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ebd2c767ea8fae2e:
    english: |-
      * [De Bono’s Hats](http://www.debonoforschools.com/asp/six_hats.asp): different colored hats participants can wear (metaphorically) to step outside their own opinions and try on different modes of thinking.
      * Checklists: thinking “ruts” can cause us to miss even obvious things (especially in areas we're very familiar with), so a checklist can weed out errors.
      * The Five Why’s: only asking why once or twice can mislead you into thinking you’ve reached the conclusion before you get to the root level of the issue. Asking five times tends to get to the bottom of it.
      * Mental models: exercises like [SWOT analysis](https://en.wikipedia.org/wiki/SWOT_analysis), the [business model canvas](https://en.wikipedia.org/wiki/Business_Model_Canvas), or any number of countless other structured information gathering exercises can guide you to cleaner analysis and reveal assumptions.
    translation: |-
      * [De hoeden van De Bono](http://www.debonoforschools.com/asp/six_hats.asp): verschillende gekleurde hoeden die deelnemers figuurlijk kunnen opzetten om afstand te nemen van hun eigen mening en op andere manieren te denken.
      * Checklists: vaste denkpatronen kunnen ervoor zorgen dat we zelfs voor de hand liggende zaken missen, vooral op vertrouwd terrein. Een checklist helpt zulke fouten te voorkomen.
      * De vijf waaromvragen: als je maar één of twee keer vraagt waarom iets gebeurt, kun je denken dat je de oorzaak hebt gevonden terwijl je nog niet bij de kern bent. Vijf keer doorvragen helpt om die te bereiken.
      * Denkmodellen: oefeningen zoals een [SWOT-analyse](https://en.wikipedia.org/wiki/SWOT_analysis), het [businessmodelcanvas](https://en.wikipedia.org/wiki/Business_Model_Canvas) en andere gestructureerde manieren om informatie te verzamelen, helpen je helderder te analyseren en aannames zichtbaar te maken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  073fb22a0e7cd744:
    english: |-
      * Diverse information and inputs can disrupt assumptions or bias. This is built into Loomio’s basic design: by enabling more voices to contribute to a discussion on a more equitable basis, you have a chance to escape “groupthink”.
      * Loomio gives participants the ability to dissent constructively. Safe and valued dissent is essential for a culture of critical thinking.
      * Communicating asynchronously in writing slows conversation down and lets it be more carefully considered, giving people a chance to think more carefully and avoid cognitive errors.
      * Loomio invites people into a semi-structured process that leads to more considered decision making. Loomio can be used for a huge range of different processes, but simply having *some* structure in a discussion enables other possibilities.
    translation: |-
      * Verschillende soorten informatie en bijdragen kunnen aannames en vooroordelen doorbreken. Dat zit in de basis van Loomio: als meer mensen op gelijkwaardige voet aan een discussie kunnen bijdragen, wordt groepsdenken minder waarschijnlijk.
      * Loomio geeft deelnemers de mogelijkheid om op een constructieve manier van mening te verschillen. Ruimte voor afwijkende meningen, zonder nadelige gevolgen voor wie ze uit, is nodig voor een cultuur van kritisch denken.
      * Asynchroon schrijven vertraagt het gesprek. Mensen kunnen hun bijdrage zorgvuldiger overwegen en denkfouten vermijden.
      * Loomio nodigt mensen uit tot een deels gestructureerd proces dat helpt om beslissingen zorgvuldiger te nemen. Je kunt Loomio voor veel verschillende processen gebruiken. Zelfs *enige* structuur in een discussie schept al nieuwe mogelijkheden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4ae16a63e2dd047a:
    english: "## Balancing Divergent & Convergent"
    translation: "## Verkennen en samenbrengen in balans"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2983c2d32846ebd5:
    english: The “diamond” of divergence and convergence is a conversational shape. It expands outward at first — opening up space for ideas, information, and different perspectives — then begins to come to a point. The right timing for this shift is key for effective facilitation of action-oriented, productive, collaborative discussions.
    translation: 'De ‘diamant’ van verkennen en samenbrengen beschrijft het verloop van een gesprek. Eerst wordt het gesprek breder: er komt ruimte voor ideeën, informatie en verschillende perspectieven. Daarna werkt de groep toe naar een punt. Het juiste moment voor die omslag is belangrijk bij de begeleiding van productieve discussies die tot gezamenlijk handelen leiden.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bce4c52d377dbdbd:
    english: If divergence is missed out or cut off too early, there will be a lack of information to work with, people may not feel heard, and great ideas will be left unsaid. If convergence is missed out or left too late, discussion can continue indefinitely without reaching an actionable conclusion, burning participants energy and failing to achieve results.
    translation: Als de verkennende fase ontbreekt of te vroeg stopt, is er te weinig informatie om mee te werken. Mensen voelen zich mogelijk niet gehoord en goede ideeën blijven onuitgesproken. Als de fase van samenbrengen ontbreekt of te laat begint, kan een discussie eindeloos doorgaan zonder bruikbare conclusie. Dat kost deelnemers energie en levert geen resultaat op.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9f787be37e0492cc:
    english: Each sub-phase of the larger process also requires awareness of the right timing and intervention. Divergence consists of introduction, clarification, ideation. Convergence consists of analysis, conclusion, commitment. Some discussions succeed with only a vague nod toward the diamond, while others are served by a meticulous breakdown of each phase and sub-phase.
    translation: Ook binnen elke fase moet je het juiste moment kiezen om in te grijpen. Verkennen bestaat uit introduceren, verduidelijken en ideeën bedenken. Samenbrengen bestaat uit analyseren, concluderen en afspraken maken. Sommige discussies hebben aan een globale indeling genoeg. Andere hebben baat bij een nauwkeurige uitwerking van elke fase en tussenstap.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d8c7970db55ea11:
    english: Within a group, different individuals will usually tend to prefer one mode or the other, and the group as a whole will have collective tendencies. Imbalance looks like too much blue sky thinking, or jumping to solutions. Facilitation can help each person and the group as a whole spend the right amount of energy on the different modes.
    translation: Binnen een groep hebben mensen meestal een voorkeur voor de ene of de andere manier van werken. Ook de groep als geheel ontwikkelt gewoonten. Een gebrek aan evenwicht zie je bijvoorbeeld wanneer de groep eindeloos ideeën blijft bedenken of juist meteen naar oplossingen springt. Begeleiding kan ieder lid en de groep helpen om aan beide manieren van werken voldoende aandacht te besteden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  36405c3bfcb951b6:
    english: |-
      * The core Loomio process does an excellent job of guiding groups to touch on each phase of the process, with the discussion being divergent and proposals being convergent. Awareness of the diamond was a big inspiration for the original design of the Loomio process.
      * Loomio helps groups to use the diamond in dynamic ways, such as when an attempt to converge (a proposal) ends up becoming a deeper level of divergence (disagreement), revealing or clarifying information to support an even better convergence (iterated proposal).
      * Some of Loomio’s basic features go a long way toward supporting each mode, such as notifications to group members when a new discussion is starting (prompting divergent contribution), and deadlines on proposals (prompting participation in convergence).
      * Loomio users are already able to use the existing feature set to facilitate convergence — namely starting a proposal. Good use of proposals is one of the most obvious symptoms of an effective Loomio group, and simply advising users to start more proposals unblocks many groups who are having issues.
    translation: |-
      * Het basisproces van Loomio helpt groepen alle fasen te doorlopen: een discussie biedt ruimte om te verkennen en voorstellen helpen om ideeën samen te brengen. De diamant was een belangrijke inspiratiebron voor het oorspronkelijke ontwerp van Loomio.
      * Loomio helpt groepen de diamant flexibel te gebruiken. Een poging om ideeën samen te brengen (een voorstel) kan bijvoorbeeld leiden tot nieuwe verschillen van mening. Daardoor komt informatie naar voren die een beter, aangepast voorstel mogelijk maakt.
      * Enkele basisfuncties van Loomio ondersteunen beide manieren van werken. Leden krijgen bijvoorbeeld een melding wanneer een nieuwe discussie begint, wat hen uitnodigt om ideeën aan te dragen. Deadlines voor voorstellen moedigen deelname aan de besluitvorming aan.
      * Met de bestaande functies van Loomio kunnen gebruikers ideeën samenbrengen door een voorstel te starten. Groepen die goed met Loomio werken, gebruiken voorstellen vaak effectief. Het advies om vaker een voorstel te starten, helpt veel groepen die zijn vastgelopen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  af83d6e3b408e008:
    english: "## Working with Scope"
    translation: "## De omvang van het gesprek bepalen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  209f071ae0c7ae0f:
    english: Successful collaboration often depends on biting off the right size pieces in the right order.
    translation: Goede samenwerking hangt er vaak van af dat je onderwerpen in behapbare delen en in de juiste volgorde aanpakt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  24658aca54702290:
    english: 'You can apply a “project management” mindset to facilitation, designing for questions like:'
    translation: 'Je kunt begeleiding benaderen als projectmanagement en daarbij vragen stellen zoals:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '09c7ee57551e1980':
    english: |-
      * What are the dependencies (what’s the critical path, which things need to be done first to enable other things)?
      * What are the most important bits to focus on? What can be left out?
      * What is an achievable scope to tackle at a given time to get to a useful place with the time, energy, and information available?
    translation: |-
      * Welke stappen hangen van elkaar af (wat is de kritieke route en wat moet eerst gebeuren om andere stappen mogelijk te maken)?
      * Waarop moet de aandacht vooral gericht zijn? Wat kan achterwege blijven?
      * Wat kun je op dit moment bereiken met de beschikbare tijd, energie en informatie?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bca4d47c3dc6f3cf:
    english: It’s important not to try to “boil the ocean”, and instead break things down into manageable chunks. You can build toward a bigger outcome in a series of smaller pieces. It’s often better to achieve something small but useful, than to fail to reach any conclusions. It’s also possible to get too bogged down in details and fail to hit the bigger issues.
    translation: Probeer niet alles tegelijk aan te pakken, maar verdeel het werk in behapbare delen. Met een reeks kleine stappen kun je naar een grotere conclusie toewerken. Iets kleins maar bruikbaars bereiken is vaak beter dan helemaal geen conclusie trekken. Tegelijk kun je zo in details verzanden dat de grotere kwesties buiten beeld raken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ce5ed5c5115c7b90:
    english: In a collaboration, no one knows exactly what will emerge, so scope must evolve with the discussion. Whether branching out at a given moment is a distraction or an evolution is a judgement call. Too much rigidity and too much flexibility can both be damaging. Often times it’s not about whether something is relevant or not, but a question of sequence and timing in terms of what will be most constructive.
    translation: Bij samenwerking weet niemand precies wat eruit zal komen. Daarom moet de afbakening met de discussie mee veranderen. Of een zijspoor op een bepaald moment afleidt of juist helpt, vraagt om een afweging. Zowel te veel starheid als te veel flexibiliteit kan schadelijk zijn. Vaak gaat het niet om de vraag of iets relevant is, maar om de volgorde en het moment waarop je het bespreekt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3510d751f00b1ae6:
    english: "> If you plan a session with multiple, interlinked parts – each one building on the other, and all leading to a life-changing, mind-exploding conclusion – and you can pull it off, then that’s amazing. But more often than not, a complicated session will go over-time and may not hit the participant’s wants and needs. - Silvia Zuur"
    translation: "> Als je een bijeenkomst plant met meerdere samenhangende onderdelen die op elkaar voortbouwen en naar een ingrijpende conclusie leiden, is het bijzonder als dat lukt. Maar een ingewikkelde bijeenkomst loopt vaker uit en sluit mogelijk niet aan bij wat deelnemers willen en nodig hebben. - Silvia Zuur"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9204dd47d88ac308:
    english: |-
      ## A series of small yes's
      Lumping too many conversations together simply creates confusion. Frustrated groups are often helped by breaking things down. If an issue seems hopeless, complex or conflicted, it can be possible to separate out individual questions and reach consensus on them, starting with the easiest things to agree. Then when it comes to points of disagreement, you can pare it down to only the crux of the issues and work on them in a focused way.
    translation: |-
      ## Een reeks kleine instemmingen
      Te veel gesprekken samenvoegen zorgt voor verwarring. Het helpt groepen vaak om een kwestie op te delen. Als een kwestie uitzichtloos, ingewikkeld of omstreden lijkt, kun je afzonderlijke vragen bespreken en daarover overeenstemming bereiken. Begin met de punten waarover mensen het gemakkelijk eens worden. Daarna kun je de resterende meningsverschillen terugbrengen tot de kern en die gericht bespreken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2d86c0488159e380:
    english: |-
      * Topic-based discussion threads are a powerful tool for effective scope — even more than face-to-face conversation, Loomio discussions can be usefully delineated to encourage focus on a specific question, while other aspects can be addressed simultaneously in other threads.
      * We often see users making facilitation interventions like “That’s out of the scope of this topic, but why don’t you start a new discussion about it?”
      * The act of creating a Loomio group helps define who are we and what are we here to discuss. This helps participants manage scope.
      * The sequential proposals design of Loomio is very good for a “series of small yess's” approach — you can build small agreements while maintaining context in a single discussion thread, and build on the history of previous proposals.
      * Asynchronous online communication can allow some people to go way out of scope without holding up others. They can simply start a new discussion or subgroup and go as deep and long as they want, while the main scope of the group is maintained.
      * The discussion context box and group description are spaces to define the scope of a conversation or group, respectively.
    translation: |-
      * Discussies over afzonderlijke onderwerpen helpen om de afbakening helder te houden. Meer nog dan in een gesprek op locatie kun je op Loomio de aandacht bij één vraag houden, terwijl andere aspecten tegelijk in andere discussies aan bod komen.
      * Gebruikers sturen een discussie soms bij met een opmerking als: “Dat valt buiten dit onderwerp. Kun je er een nieuwe discussie over beginnen?”
      * Door een Loomio-groep aan te maken, bepaal je wie erbij horen en wat de groep wil bespreken. Dat helpt deelnemers de afbakening te bewaken.
      * De opeenvolgende voorstellen in Loomio passen goed bij een reeks kleine instemmingen. Je kunt binnen één discussie stap voor stap overeenstemming bereiken en voortbouwen op eerdere voorstellen.
      * Bij asynchrone online communicatie kunnen mensen een onderwerp uitgebreid verkennen zonder anderen op te houden. Ze kunnen een nieuwe discussie of subgroep beginnen, terwijl de hoofdgroep bij haar onderwerp blijft.
      * In de discussiecontext en de groepsbeschrijving kun je vastleggen waarover respectievelijk de discussie en de groep gaan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0b70d200637c265f:
    english: "## Pacing & Timing"
    translation: "## Tempo en timing"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d2b056c4b3edb54a:
    english: A productive conversation has a rhythm. The right beat comes from a complex combination of factors and often feels intuitive, like a musician improvising. When is the moment to go deeper, or pull back? When is it right to bring in new information, or further delve into what’s already on the table? This is pacing.
    translation: Een productief gesprek heeft een ritme. Het juiste tempo hangt af van veel factoren en voelt vaak intuïtief aan, zoals wanneer een muzikant improviseert. Wanneer ga je dieper op iets in en wanneer neem je afstand? Wanneer voeg je nieuwe informatie toe en wanneer onderzoek je wat al op tafel ligt? Dat is een kwestie van tempo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d421940782402742:
    english: Different participants will have different needs and preferences — some will need reigning in, while others need pulling along. The right pace emerges when a creative tension between digging deeper and moving forward is found. When it’s off, people will feel frustrated — either impatient or left behind.
    translation: Deelnemers hebben verschillende behoeften en voorkeuren. Sommigen moet je afremmen, anderen juist meenemen. Het juiste tempo ontstaat wanneer er ruimte is om dieper te graven én vooruit te komen. Als die balans ontbreekt, worden mensen ongeduldig of kunnen ze niet meer meekomen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7165c12910a2b3bb:
    english: |-
      * Because it’s asynchronous, people can read and respond at their own pace on Loomio, allowing a natural pace to emerge.
      * It’s possible to scroll right past people moving slowly and push for forward momentum, and simultaneously possible to continue digging into something slowly while others press forward. This is not possible in synchronous communication.
      * Proposal deadlines are a pace-setting tool. Topics that need to move quickly use shorter timeframes, and longer ones can have more time. Different decisions can go at different speeds.
      * It’s easy to modulate your own pace of engagement. If a conversation is moving too fast or slowly for you, you can drop your input and step back, and then return later when a proposal is raised.
      * It’s interesting to note how a “fast” decision on Loomio is 1 or 2 days, while a “fast” decision in person is more like 5 minutes. And yet, Loomio does not seem “slow”, the way taking 2 days to reach a decision in person would. Loomio runs decisions in parallel to other ongoing work, and it's much more efficient gathering everyone’s input on Loomio over 2 days versus having to schedule an in-person meeting.
      * Facilitation on Loomio could be likened to “bullet time” (when Neo can stop time and just walk around a bullet in the Matrix) — you can walk through a living conversation frame by frame. It’s like a superpower.
    translation: |-
      * Omdat Loomio asynchroon werkt, kunnen mensen in hun eigen tempo lezen en reageren. Zo kan een natuurlijk tempo ontstaan.
      * Je kunt verdergaan terwijl anderen meer tijd nodig hebben. Tegelijk kun je zelf rustig iets blijven onderzoeken terwijl de rest doorgaat. In een gesprek waarbij iedereen tegelijk aanwezig is, kan dat niet.
      * Deadlines voor voorstellen helpen het tempo bepalen. Voor onderwerpen die snel moeten worden afgehandeld, kun je een kortere termijn kiezen. Andere besluiten kunnen meer tijd krijgen.
      * Je kunt je eigen betrokkenheid gemakkelijk aanpassen. Gaat een gesprek voor jou te snel of te langzaam, dan kun je jouw bijdrage plaatsen, afstand nemen en terugkomen wanneer er een voorstel is.
      * Een “snel” besluit op Loomio duurt één of twee dagen. Bij een bijeenkomst op locatie is dat eerder vijf minuten. Toch voelt Loomio niet zo traag als een bijeenkomst die twee dagen duurt. Besluiten lopen naast het andere werk door. In twee dagen ieders inbreng verzamelen op Loomio is vaak efficiënter dan een bijeenkomst op locatie plannen.
      * Het begeleiden van een gesprek op Loomio lijkt op “bullet time”, waarin Neo in de film Matrix de tijd stilzet en om een kogel heen loopt. Je kunt een lopend gesprek stap voor stap bekijken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  79fbcf8bb8520bf1:
    english: "## Managing the Attention Economy"
    translation: "## Aandacht verdelen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c71302b08c3b6394:
    english: A facilitator is a curator of attention. The information available can be literally infinite. It becomes critical to filter it in order to avoid becoming overwhelmed. Managing the attention economy means balancing importance against time and capacity.
    translation: Een gespreksbegeleider helpt bepalen waar de aandacht naartoe gaat. Er kan vrijwel onbeperkt informatie beschikbaar zijn. Die informatie filteren is nodig om het overzicht te bewaren. Aandacht verdelen betekent het belang van informatie afwegen tegen de beschikbare tijd en ruimte.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  865afb1b25257bbd:
    english: Facilitation can help the group agree what the purpose and scope of a given discussion or process is, so they can have a rubric for prioritising attention. Limiting distractions and steering the conversation back on track are common interventions.
    translation: Gespreksbegeleiding kan een groep helpen overeenstemming te bereiken over het doel en de afbakening van een discussie of proces. Daarmee kan de groep bepalen wat aandacht verdient. Afleiding beperken en het gesprek terugbrengen naar het onderwerp zijn veelgebruikte ingrepen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3dd99b496718a570:
    english: Another important way facilitators work with attention is to insist on the group holding it long enough. When things get challenging, unclear, or uncomfortable, people to want to give up too soon, jump to another topic, or look away. A facilitator can help the group see things through, in service of their collective goals.
    translation: Een gespreksbegeleider helpt de groep ook om ergens lang genoeg aandacht aan te besteden. Als iets lastig, onduidelijk of ongemakkelijk wordt, willen mensen soms te vroeg stoppen of naar een ander onderwerp gaan. De gespreksbegeleider kan de groep helpen door te zetten om haar gezamenlijke doelen te bereiken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  811f79cee2eed8c1:
    english: 'Structured processes and information sorting exercises are important facilitation tools in this area. Some examples:'
    translation: 'Gestructureerde processen en oefeningen om informatie te ordenen zijn hierbij nuttig. Bijvoorbeeld:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1254ab2b182bbd46:
    english: |-
      * **Time-boxing** — specifying a period of brainstorming, or conversation on a given topic.
      * **Agenda prioritisation** — listing everything people want to talk about and then picking to top items to focus on, before jumping into content.
      * **Post-it cloud** — generating a bunch of ideas or questions and grouping them thematically and then condensing them into topics.
      * **Parking lot** — a space to stick ideas or questions that come up that are not immediately relevant, to be addressed later.
      * **What does success look like??** Defining success criteria and keeping the group focused on it until those criteria are achieved.
    translation: |-
      * **Een tijdslimiet stellen** — een vaste periode afspreken voor een brainstorm of een gesprek over een onderwerp.
      * **De agenda prioriteren** — eerst alle gewenste gespreksonderwerpen verzamelen en dan de belangrijkste kiezen.
      * **Ideeën groeperen** — ideeën of vragen verzamelen, op thema groeperen en terugbrengen tot enkele onderwerpen.
      * **Een parkeerplaats voor ideeën** — een plek voor ideeën of vragen die nu niet relevant zijn, maar later aandacht verdienen.
      * **Wanneer is het gelukt?** — criteria voor succes vastleggen en de aandacht daarop houden tot ze zijn bereikt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  11cc1fd7daee10e8:
    english: |-
      * One of the most important attention management features in Loomio is topic-based discussion threading. There’s a reason why this format was one of the first to emerge in online communication decades ago, and continues to be used widely today: it’s a highly effective way to sort attention. Most Loomio users intuitively understand how to stay on topic when it’s listed in big letters at the top of the page.
      * Activity in Loomio is the currency of its attention economy, and everything that generates a notification spends that currency. The software has opinions about what should be considered “salient” activity that generates notifications (for example, comments, votes, and outcomes are, while a “like” on a comment is not), developed based on user feedback.
      * Users can exercise a lot of customised control over their Loomio attention economy through notification settings. Helping users set these preferences is an important tool to wisely using the attention economy of the group.
      * Subgroups can be a powerful tool to help people moderate their attention economy. If only some people need to pay attention, you can split it out.
      * The intentional but somewhat unpopular design decision to disallow concurrent proposals in Loomio is about the flow of attention — holding a group’s “feet to the fire” to fully process a proposal before moving on.
    translation: |-
      * Een van de belangrijkste manieren waarop Loomio helpt de aandacht te verdelen, is het gebruik van afzonderlijke discussies per onderwerp. Deze indeling ontstond al vroeg in online communicatie en wordt nog steeds veel gebruikt omdat ze helpt om de aandacht te richten. Als het onderwerp bovenaan de pagina staat, weten de meeste Loomio-gebruikers vanzelf waar de discussie over gaat.
      * Activiteit vraagt aandacht. Elke melding doet een beroep op de aandacht van groepsleden. Op basis van feedback van gebruikers bepaalt Loomio welke activiteiten een melding verdienen. Reacties, stemmen en conclusies doen dat bijvoorbeeld wel; een vind-ik-leuk bij een reactie niet.
      * Gebruikers kunnen met meldingsinstellingen zelf bepalen hoeveel aandacht Loomio vraagt. Als je mensen helpt die voorkeuren in te stellen, kan de groep haar aandacht beter verdelen.
      * Subgroepen kunnen helpen om de aandacht te richten. Als slechts een deel van de groep bij een onderwerp betrokken hoeft te zijn, kun je het in een subgroep bespreken.
      * De bewuste, maar niet altijd populaire keuze om in Loomio geen gelijktijdige voorstellen toe te staan, helpt de aandacht bij één voorstel te houden totdat de groep het heeft behandeld.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e522b56bbe8b16c9:
    english: "> Many designers of information systems incorrectly represented their design problem as information scarcity rather than attention scarcity, and as a result they built systems that excelled at providing more and more information to people, when what was really needed were systems that excelled at filtering out unimportant or irrelevant information. — **[Wikipedia](https://en.wikipedia.org/wiki/Attention_economy)**"
    translation: "> Veel ontwerpers van informatiesystemen zagen ten onrechte een gebrek aan informatie als hun ontwerpprobleem, terwijl het om een gebrek aan aandacht ging. Daardoor bouwden ze systemen die mensen steeds meer informatie geven, terwijl er systemen nodig waren die onbelangrijke of irrelevante informatie goed wegfilteren. — **[Wikipedia](https://en.wikipedia.org/wiki/Attention_economy)**"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  12f78aa04c29d66d:
    english: "## Facilitation Interventions"
    translation: "## Ingrijpen als gespreksbegeleider"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  51065e352a92bf84:
    english: There are as many facilitation techniques as there are facilitators in the world, and entire libraries of books have been written on the topic. It’s not possible to provide a comprehensive list of interventions.
    translation: Er zijn net zoveel manieren om een gesprek te begeleiden als er gespreksbegeleiders zijn. Over dit onderwerp zijn bibliotheken volgeschreven. Een volledig overzicht van mogelijke ingrepen is niet te geven.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1e23df53c3b816be:
    english: 'However, it might be useful to consider two categories of interventions:'
    translation: 'Het kan wel helpen om twee soorten ingrepen te onderscheiden:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d5738a06518b45da:
    english: |-
      1. **Supportive interventions**: inviting contribution, going deeper, drawing out, coaxing, nurturing, protecting, creating space.
      2. **Assertive interventions**: pulling back, shutting down, drawing lines, interrupting, challenging, steering on course, excluding bad behaviour.
    translation: |-
      1. **Ondersteunende ingrepen**: bijdragen uitnodigen, dieper ingaan op een onderwerp, mensen aan het woord helpen, aanmoedigen, ondersteunen, beschermen en ruimte maken.
      2. **Sturende ingrepen**: afremmen, een gesprek stoppen, grenzen stellen, onderbreken, uitdagen, het gesprek bijsturen en ongewenst gedrag uitsluiten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9f30fd7cd75da986:
    english: Almost all interventions in face-to-face facilitation can be reimagined and employed in the online space.
    translation: Bijna alle manieren om een gesprek op locatie te begeleiden, kun je ook online toepassen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1ed397ff049f2888:
    english: "> Singling people out for a contribution will just make them feel like the stupid kid in class who doesn’t know the answer. Instead, a general invite to people who haven’t spoken yet to contribute tells the regular contributors to stay quiet, and gives quieter people the opportunity to step forward. — Silvia Zuur"
    translation: "> Als je iemand persoonlijk om een bijdrage vraagt, kan diegene zich voelen als een leerling die het antwoord niet weet. Nodig liever in het algemeen mensen uit die nog niets hebben gezegd. Zo geef je vaste bijdragers een reden om even stil te zijn en anderen de ruimte om iets te zeggen. — Silvia Zuur"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2d6c0a7189745fe1:
    english: |-
      * Intervention tools in Loomio include comments, @mentions, adding/removing users, and starting/deleting discussions. These can be employed for various forms of supportive and assertive interventions.
      * The most commonly used intervention is the comment — simply talking to the group and inviting or trying to reduce certain behaviour.
      * [Participation permissions](/en/user_manual/groups/settings/#permissions) offer relatively blunt but effective tools to moderate users, such as allowing or disallowing posting discussions or proposals.
      * Loomio offers some trust-based features that other tools lack, such as the default ability for all participants to edit discussion contexts (even if it was posted originally by another user). These are inspired by things like Wikipedia and open source software development.
    translation: |-
      * In Loomio kun je ingrijpen met reacties, @vermeldingen, het toevoegen of verwijderen van gebruikers en het starten of verwijderen van discussies. Je kunt die middelen gebruiken om te ondersteunen of bij te sturen.
      * De meestgebruikte ingreep is een reactie: je spreekt de groep aan en nodigt bepaald gedrag uit of probeert het te beperken.
      * [Rechten voor deelname](/en/user_manual/groups/settings/#permissions) bieden eenvoudige maar doeltreffende mogelijkheden om bijdragen te beheren. Je kunt bijvoorbeeld bepalen of gebruikers discussies of voorstellen mogen plaatsen.
      * Loomio heeft functies die uitgaan van vertrouwen. Zo kunnen deelnemers standaard de context van een discussie bewerken, ook als iemand anders die heeft geschreven. Dit is geïnspireerd op onder meer Wikipedia en de ontwikkeling van opensourcesoftware.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
