    translation: "### Groepsgegevens exporteren als JSON"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  857b562cb95497c6:
    english: "*For when you want to move your group data to a self-hosted Loomio instance.*"
    translation: "*Als je je groepsgegevens wilt verplaatsen naar een zelfgehoste Loomio-server.*"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a1b7f7b282933a3c:
    english: 'You must be an admin of the group to export it. The JSON export includes:'
    translation: 'Je moet admin van de groep zijn om deze te exporteren. De JSON-export bevat:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6a0b307d50fa35cf:
    english: |-
      - The group, its members and membership requests
      - Threads, comments, reactions, tags, templates, notifications and related records from the included groups
      - Polls, options, votes and outcomes; an anonymous poll is included only after it has closed
      - Subgroups you belong to
      - Open and closed subgroups when you export their parent group as a parent group admin, even if you do not belong to those subgroups
      - References to files and images attached to the included content
    translation: |-
      - De groep, haar leden en verzoeken om lid te worden
      - Discussies, reacties, emoji-reacties, labels, sjablonen, meldingen en bijbehorende gegevens van de opgenomen groepen
      - Peilingen, opties, stemmen en conclusies; een anonieme peiling wordt pas opgenomen nadat deze is gesloten
      - Subgroepen waarvan je lid bent
      - Open en gesloten subgroepen als je hun hoofdgroep exporteert als admin van die hoofdgroep, ook als je geen lid bent van die subgroepen
      - Verwijzingen naar bestanden en afbeeldingen die aan de opgenomen inhoud zijn toegevoegd
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4dee92f966ec24c9:
    english: 'The JSON export does not include:'
    translation: 'De JSON-export bevat niet:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a40deeed41d9937e:
    english: |-
      - Secret subgroups you do not belong to, including their membership and content
      - Subgroups awaiting deletion
      - Anonymous polls that have not closed
      - Direct threads and polls that do not belong to the group
    translation: |-
      - Geheime subgroepen waarvan je geen lid bent, inclusief hun leden en inhoud
      - Subgroepen die wachten op verwijdering
      - Anonieme peilingen die nog niet zijn gesloten
      - Directe discussies en peilingen die niet bij de groep horen
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d789fbf93f8cebeb:
    english: You'll shortly receive an email with a link to downloading the JSON file.
    translation: Je ontvangt binnenkort een e-mail met een link om het JSON-bestand te downloaden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
