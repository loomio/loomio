navigation_title: Preparación
blocks:
  4fdd26e2ff6dd9e5:
    english: "# Preparation"
    translation: "# Preparación"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4fc02624e97369e9:
    english: |-
      > <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../silvia_200.png"> For every minute of time with the group, consider spending 3 minutes planning. That means spending three hours preparing for a one hour session. Only as you improve should you spend less time planning.
      >
      > — Silvia Zuur
    translation: |-
      > <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../silvia_200.png"> Por cada minuto que pases con el grupo, considera dedicar tres minutos a planificar. Eso supone preparar durante tres horas una sesión de una hora. Reduce el tiempo de planificación solo cuando hayas adquirido más experiencia.
      >
      > — Silvia Zuur
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d18832ab8f94fa1b:
    english: "## Understand Purpose"
    translation: "## Comprender el propósito"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  26d88950f0aac205:
    english: Clarification of purpose is one of the highest value offerings of a skilled facilitator — if they can help the group nail that, everything else is possible. Purpose operates at the level of a group as a whole, and at the level of individual discussions/decisions. Purpose is what enables judgment calls about what tools to deploy, what interventions to enact, and what outcomes to aim for. Lack of shared understanding about purpose can be fatal to a discussion, or to the group itself.
    translation: Ayudar a un grupo a definir su propósito es una de las aportaciones más valiosas de quien facilita. Cuando el propósito está claro, las demás decisiones se vuelven posibles. Esto vale tanto para el grupo en su conjunto como para cada discusión o decisión. El propósito ayuda a elegir las herramientas, las intervenciones y las conclusiones que se buscan. Si el grupo no comparte una idea clara de su propósito, la discusión o incluso el propio grupo pueden fracasar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4276182ea8afaf36:
    english: "> Always refer back to your purpose-finding questions to check that you’re covering off what the participants want to learn or achieve. — Silvia Zuur"
    translation: "> Vuelve siempre a las preguntas que planteaste para definir el propósito y comprueba que estás abordando lo que las personas participantes quieren aprender o lograr. — Silvia Zuur"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aabfa9d842af2688:
    english: On Loomio
    translation: En Loomio
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ea5f19b8970e4db6:
    english: |-
      * The app offers space for explication of purpose, such as the [group description](/en/user_manual/groups/starting_a_group/#group-description) and [discussion context](/en/user_manual/discussions/using_discussions/#discussion-context) fields.
      * A Loomio discussion *about* purpose is a great place to start with your group, if it's not already clear.
      * Our analytics (stats about how people use the software) show that groups with a clear shared purpose are more successful.
      * [Customer stories and case studies](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help) we've collected emphasise the importance of setting a collective purpose.
    translation: |-
      * La aplicación ofrece espacios para explicar el propósito, como los campos de [descripción del grupo](/en/user_manual/groups/starting_a_group/#group-description) y [contexto de la discusión](/en/user_manual/discussions/using_discussions/#discussion-context).
      * Si el propósito aún no está claro, puedes empezar con una discusión en Loomio *sobre* ese tema.
      * Nuestras estadísticas de uso muestran que los grupos con un propósito compartido y claro tienen más éxito.
      * Las [historias de clientes y los estudios de caso](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help) que hemos recopilado destacan la importancia de definir un propósito colectivo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e7d962ee3ac4e476:
    english: "## Rearrange the Furniture"
    translation: "## Reorganizar el espacio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bee66f99abaa8e2a:
    english: Desiging the space you invite people into greatly influences their experience. Every gathering is unique, and deserves a setup to suit. Familiarity signals safety, while changing the environment cues openness to new ideas.
    translation: La forma en que preparas el espacio al que invitas a las personas influye mucho en su experiencia. Cada encuentro es distinto y necesita una disposición adecuada. Un entorno familiar transmite seguridad; cambiarlo puede favorecer la apertura a nuevas ideas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b98fa9d3e5726891:
    english: In offline spaces, literally rearranging the furniture is a habit that helps facilitators get into the right zone to hold space, and prompts them to think about what’s unique in that session. Imagine the difference between everyone seated in rows versus everyone in a circle.
    translation: En los encuentros presenciales, mover los muebles ayuda a quien facilita a prepararse para acompañar al grupo y a pensar en lo que hace única cada sesión. Imagina la diferencia entre sentarse en filas y sentarse en círculo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  546ba20d5778bb25:
    english: |-
      * Inviting people into a new digital space specifically for decision making is powerful — there’s a “threshold crossing” experience making it as distinct from other online spaces (which might be for socialising or other functions).
      * [Customising your group photo](/en/user_manual/groups/starting_a_group/#upload-a-group-photo) is a prime opportunity to craft the feeling of the space.
      * The group description is a main piece of “furniture” on the group page, and [you can customise it](/en/user_manual/groups/starting_a_group/#group-description) to suit.
    translation: |-
      * Invitar a las personas a un nuevo espacio digital dedicado a tomar decisiones puede tener un efecto importante. La entrada en ese espacio marca una diferencia respecto de otros espacios en línea, que quizá se usan para socializar o para otros fines.
      * [Personalizar la foto de tu grupo](/en/user_manual/groups/starting_a_group/#upload-a-group-photo) te permite dar forma al ambiente del espacio.
      * La descripción del grupo es uno de los elementos principales de su página y [puedes personalizarla](/en/user_manual/groups/starting_a_group/#group-description) según tus necesidades.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bb1d23808a93d41b:
    english: "## Supplies, Tools, Materials"
    translation: "## Recursos, herramientas y materiales"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b5e22b09672c3587:
    english: When facilitation is running smoothly, all the supplies a group needs are right at hand. In offline spaces, this stuff includes post-its, pens, paper, name tags, printouts, and background material. Every step a facilitator takes to be well-prepared in this way allows more time and energy for the work.
    translation: Cuando la facilitación funciona bien, el grupo tiene a mano todo lo que necesita. En un encuentro presencial, esto puede incluir notas adhesivas, bolígrafos, papel, identificadores con nombres, copias impresas y material de referencia. Cada preparación de este tipo deja más tiempo y energía para el trabajo del grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7da21174f12dfb9e:
    english: |-
      * Many groups use the group description to link to a shared drive of collaborative documents, background information, the group's project management or task tracking system, a list of contacts, etc.
      * Each thread deserves consideration of what people might need to engage with it — putting all the information right at hand is essential (for example, if you reference something, linking directly to it is much more effective than expecting people to search for it).
    translation: |-
      * Muchos grupos usan la descripción del grupo para enlazar una carpeta compartida con documentos de trabajo, información de referencia, el sistema de gestión de proyectos o tareas del grupo, una lista de contactos y otros recursos.
      * Piensa en lo que las personas necesitan para participar en cada hilo y pon esa información a mano. Por ejemplo, si mencionas un recurso, es más útil enlazarlo directamente que esperar que otras personas lo busquen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  35dd82fcf7e543d8:
    english: "## Design the Experience"
    translation: "## Diseñar la experiencia"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fbc88dd9b9738343:
    english: 'Once they have the basic pieces in place (purpose, tools, background info), good facilitators take time to think through the design of the experience they are inviting: the situation, what success could look like, all the possible pathways and choices. They don’t jump in without a considered design.'
    translation: Una vez establecidos los elementos básicos —propósito, herramientas e información de referencia—, quienes facilitan bien dedican tiempo a diseñar la experiencia que proponen. Consideran la situación, cómo sería un buen resultado y los posibles caminos y decisiones. No empiezan sin haberlo pensado.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a4dce16ca48a4324:
    english: Time and time again we have seen people drastically underestimate the need for prep and design. Stop and think about the experience you want to host, before jumping straight in. Investment in design is paid back many times over by success later.
    translation: Hemos visto muchas veces que se subestima el tiempo necesario para preparar y diseñar una experiencia. Antes de empezar, detente a pensar en la experiencia que quieres facilitar. Ese tiempo de preparación puede contribuir mucho al éxito posterior.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e91f002ee6e53550:
    english: "* Loomio’s most basic functionality follows the structure of good facilitation by design: invite people, discuss a topic, gather divergent input, converge into a specific proposal, test for agreement, confirm outcome."
    translation: "* Las funciones básicas de Loomio siguen una secuencia propia de una buena facilitación: invitar a las personas, discutir un tema, recoger distintos puntos de vista, formular una propuesta concreta, comprobar si hay acuerdo y confirmar la conclusión."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  211e08fc109e6449:
    english: |-
      * Skilled users are already adapting Loomio for various experience designs — such as a multi-step consultation processes, signing off documents, etc. Each job, when facilitated effectively, takes a certain repeatable shape.
      * Online collaboration design doesn't have to reinvent the wheel. Trust what you know works, and translate it. Many tried and tested offline processes can be adapted to the online space (ex: the [Advice Process](/en/guides/making_decisions/advice_process.html)).
      * [Case studies](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help) of thoughtfully designed processes could be used as “recipes” — if you're not sure what design to use, start by seeing what others have tried.
    translation: |-
      * Quienes tienen experiencia con Loomio ya lo adaptan a distintos procesos, como consultas de varias etapas o la aprobación de documentos. Cada tarea, cuando se facilita bien, suele seguir una secuencia que puede repetirse.
      * Para diseñar la colaboración en línea, parte de lo que ya sabes que funciona. Muchos procesos presenciales probados pueden adaptarse al espacio en línea, como el [proceso de asesoramiento](/en/guides/making_decisions/advice_process.html).
      * Los [estudios de caso](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help) de procesos diseñados con cuidado pueden servirte de guía. Si no sabes qué enfoque elegir, empieza por ver qué han probado otros grupos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7e99e2ddc63d7a98:
    english: "## Contextualise the Moment"
    translation: "## Tener en cuenta el contexto"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  427b66f23f4b3c09:
    english: Discussions do not occur in a vacuum, but in the larger context of the group’s history and practice. To be effective, facilitated experiences have to occur with the right timing, and fit in with the rest of the group’s process.
    translation: Las discusiones forman parte de la historia y las prácticas del grupo. Para que una experiencia facilitada sea eficaz, debe llegar en el momento adecuado y encajar en el resto del proceso del grupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  48a889b09297e38b:
    english: 'Key Context Questions:'
    translation: 'Preguntas clave sobre el contexto:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7eccc4a4e4a3b175:
    english: |-
      * Is this a moment of transition?
      * Is this an enhancement of existing practice?
      * Is this one of many concurrent processes, or a singular focus?
      * Are we here to solve a problem, or go deeper, wider, narrower?
    translation: |-
      * ¿Está el grupo en un momento de transición?
      * ¿Se trata de mejorar una práctica existente?
      * ¿Es uno de varios procesos simultáneos o el único asunto en el que se centra el grupo?
      * ¿Estamos aquí para resolver un problema o para profundizar, ampliar o acotar el enfoque?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c7c8ce0838a076cd:
    english: |-
      * Loomio groups nearly always have a “champion”, who understands the group’s context and makes the call about whether introducing Loomio is right for them.
      * It's not wise to try to change everything at once. Any time Loomio fits nicely into existing workflows, groups will adopt it better.
      * Good timing is when the group is ready to incorporate online collaborative practice effectively. They have to feel the pain of not having the online decision-making space, and be motivated to solve that problem.
      * Consider the group’s attention economy to determine when the right time to raise a given topic might be. Collective attention is a limited resource.
      * Many groups are not even cognisant of their existing collaborative practice and habits, much less clear about how Loomio might fit in. Start with a discussion about the current way of doing things, and what's working or not working.
    translation: |-
      * En los grupos que usan Loomio casi siempre hay alguien que impulsa su adopción. Esa persona conoce el contexto del grupo y valora si introducir Loomio es adecuado.
      * No conviene intentar cambiarlo todo a la vez. A los grupos les resulta más fácil adoptar Loomio cuando encaja en sus formas de trabajo actuales.
      * El momento adecuado llega cuando el grupo está preparado para colaborar eficazmente en línea. Necesita reconocer la falta de un espacio para tomar decisiones en línea y tener motivos para resolverla.
      * Ten en cuenta la atención disponible en el grupo al elegir cuándo plantear un tema. La atención colectiva es limitada.
      * Muchos grupos no son conscientes de sus prácticas y hábitos de colaboración, y menos aún de cómo podría encajar Loomio. Empieza con una discusión sobre cómo hacen las cosas ahora y qué funciona o no funciona.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7bc2616a0ec0b1dc:
    english: "## The Role of the Facilitator"
    translation: "## El papel de quien facilita"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c6d08854a875262a:
    english: Good facilitation requires self-awareness on an individual and collective level. Lack of understanding of the role can lead to misunderstandings, conflict, or unsafe situations.
    translation: Facilitar bien requiere conocer el propio papel, tanto a nivel individual como colectivo. Si ese papel no se comprende, pueden surgir malentendidos, conflictos o situaciones de inseguridad.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aa59e3e4d08a95b7:
    english: "> Have the power handed over to you. When you’re invited into a new group or organization, everybody will be thinking: Who’s this joker? Why should we listen to them? Get somebody who the participants know and trust to introduce you. This builds you up in the participants' minds and helps to hand over the power over to you. — Silvia Zuur"
    translation: "> Procura que alguien te ceda la autoridad para facilitar. Cuando te invitan a un grupo u organización nuevos, las personas pueden preguntarse quién eres y por qué deberían escucharte. Pide a alguien a quien conozcan y en quien confíen que te presente. Así podrán reconocer tu papel y aceptar que facilites el encuentro. — Silvia Zuur"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  02d38d1def45d150:
    english: |-
      ### Consent
      It’s critical that the group consents to be facilitated. Attempting to facilitate otherwise can be at worst coercive (unfair to the group) and dangerous (unfair to the facilitator) — and will face resistance and confusion. Facilitators put themselves in a vulnerable position; they must have mandate or they should not agree to engage. Consent is critical for both the facilitator and participants.
    translation: |-
      ### Consentimiento
      Es fundamental que el grupo acepte la facilitación. Intentar facilitar sin ese consentimiento puede resultar coercitivo e injusto para el grupo, además de poner en riesgo a quien facilita. También generará resistencia y confusión. Quienes facilitan asumen una posición vulnerable: necesitan un mandato claro y, si no lo tienen, no deberían aceptar el papel. El consentimiento protege tanto a quien facilita como a las personas participantes.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a1a8c6ca89dad49a:
    english: |-
      ### Responsibility
      Once a facilitator takes up a mandate, they carry enhanced responsibilities. Facilitators have more claim to floor time, and directing the group’s attention. This has to be used in service to the whole, not for a personal agenda. The words and demeanor of the facilitator will also have a disproportionate effect, meaning they have to act with heightened consideration.
    translation: |-
      ### Responsabilidad
      Al aceptar ese mandato, quien facilita asume más responsabilidades. Puede ocupar más tiempo de palabra y dirigir la atención del grupo. Debe hacerlo al servicio del conjunto, no de intereses personales. Sus palabras y su actitud también tienen un efecto mayor, por lo que debe actuar con especial cuidado.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b5f6b4ebd477c97c:
    english: |-
      ### Power
      Facilitation by nature introduces power differentials. If the facilitator cannot exercise power in certain ways, they cannot do their job. For example, to keep a discussion on topic the facilitator might interrupt someone, or say that a certain way of interacting is not OK. It’s not appropriate to expect a facilitator to shoulder responsibility for the experience without giving them the powers they need to deliver successfully. There is no one right answer about how much power, but it has to be balanced with the level of responsibility.
    translation: |-
      ### Poder
      La facilitación crea diferencias de poder. Quien facilita necesita poder intervenir de ciertas maneras para cumplir su función. Por ejemplo, para mantener una discusión centrada en el tema, quizá tenga que interrumpir a alguien o señalar que una forma de interactuar no es aceptable. No es razonable pedirle que asuma la responsabilidad de la experiencia sin darle la autoridad necesaria. No hay una única respuesta sobre cuánta autoridad debe tener, pero esta debe corresponder a su nivel de responsabilidad.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c82df3fe42db014a:
    english: |-
      ### Responsiveness
      Facilitators do their best work when they can adapt effectively to the emergent reality. Human beings are endlessly complex, and groups of them exponentially more so. Rigid adherence to a plan or protocol without flexibility can set the group up to fail. If a facilitator is not allowed or not willing to adapt to changing circumstance, they cannot effectively hold the space for dynamic humans.
    translation: |-
      ### Capacidad de adaptación
      Quienes facilitan trabajan mejor cuando pueden adaptarse a lo que sucede. Las personas son complejas, y los grupos aún más. Seguir un plan o protocolo rígido, sin flexibilidad, puede dificultar el trabajo del grupo. Si quien facilita no puede o no quiere adaptarse a los cambios, no podrá acompañar eficazmente a las personas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aad36b296834ab22:
    english: "> Wear and un-wear the facilitation-hat. A challenge many people face is trying to facilitate meetings and workshops with their own team. As a facilitator, they need to be neutral. But as a team member, they have valuable insights to share. Make it really clear when you’re a facilitator and when you’re being a participant. — Silvia Zuur"
    translation: "> Ponte y quítate el sombrero de quien facilita. A muchas personas les resulta difícil facilitar reuniones y talleres de su propio equipo. Al facilitar, necesitan ser neutrales; como integrantes del equipo, tienen ideas valiosas que aportar. Deja muy claro cuándo facilitas y cuándo participas. — Silvia Zuur"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  85c4fcf7a6e72361:
    english: |-
      * Many groups using Loomio are experienced with facilitation and already have a shared understanding of the role. They already adapt the tool to meet these needs with some success.
      * Often the person who starts a discussion is assumed to be facilitating it, barring another agreed understanding in the group. Clarity about who is facilitating can greatly enhance mutual safety and success.
      * Loomio naturally creates a dynamic and open to distributed acts of facilitation, such as users tagging in others, requests to stay on topic, suggestions of the right timing for a proposal, etc — but this is often left implicit. Explicitly naming what acts of facilitation are and discussing whether this role is centralised or distributed can clarify the role.
      * Implicit distributed facilitation can be the default starting place for an online group (ie, no discussion of facilitation as a named role), but that setup is actually best for advanced groups prgressing past working with explicit facilitation.
    translation: |-
      * Muchos grupos que usan Loomio tienen experiencia en facilitación y comparten una idea clara de ese papel. Ya adaptan la herramienta a sus necesidades con buenos resultados.
      * A menudo se da por hecho que quien inicia una discusión también la facilita, salvo que el grupo haya acordado otra cosa. Aclarar quién facilita puede ayudar a que las personas se sientan seguras y a que la discusión avance.
      * Loomio favorece que distintas personas realicen tareas de facilitación, como mencionar a alguien para invitarle a participar, pedir que se mantenga el tema o sugerir cuándo presentar una propuesta. Sin embargo, esto suele quedar implícito. Explicar qué acciones son de facilitación y hablar sobre si el papel se concentra en una persona o se reparte entre varias ayuda a aclararlo.
      * Un grupo en línea puede empezar con una facilitación distribuida e implícita, sin hablar de ella como un papel definido. Sin embargo, esta forma de trabajar suele ser más adecuada para grupos con experiencia que ya han practicado la facilitación explícita.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
