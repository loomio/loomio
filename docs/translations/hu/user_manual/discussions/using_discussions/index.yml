    translated_on: '2026-09-29'
  e96aef7a28a85001:
    english: 'The **Jump to** section of the right sidebar helps you move through a thread:'
    translation: 'A jobb oldalsáv **Ugrás ide:** részével navigálhatsz a témában:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4790c088af5fc09f:
    english: |-
      - **Start** goes to the discussion context
      - **New to you** appears when the thread contains activity you have not read
      - **Latest** appears when newer activity is available beyond the items currently loaded
      - milestone links go directly to important comments, polls, and outcomes
      - **End** goes to the latest item in the thread
    translation: |-
      - Az **Indítás** a beszélgetés leírásához visz
      - Az **Új számodra** akkor jelenik meg, ha a témában van olyan esemény, amelyet még nem olvastál
      - A **Legújabb** akkor jelenik meg, ha a betöltött elemek után újabb események is vannak
      - a fontos pontokra mutató hivatkozások közvetlenül a fontos hozzászólásokhoz, szavazásokhoz és döntések összegzéséhez visznek
      - A **Vége** a téma legutolsó eleméhez visz
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  941ea9900465724a:
    english: Comments that include an H2 or H3 heading, polls, and proposals are automatically included as milestone links. Select any milestone to go directly to it.
    translation: A H2 vagy H3 címsort tartalmazó hozzászólások, a szavazások és a javaslatok automatikusan bekerülnek a fontos pontokra mutató hivatkozások közé. Válassz ki egy fontos pontot, ha közvetlenül oda szeretnél ugrani.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e94ea6f4b9dae8d4:
    english: When you add a comment, poll, vote, or outcome, Loomio marks your own new item as read. It will not appear as something new for you to review.
    translation: Amikor hozzászólást, szavazást, szavazatot vagy döntésösszegzést teszel közzé, a Loomio olvasottnak jelöli a saját új elemedet. Nem jelenik meg számodra átnézendő újdonságként.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  34251ada1ba3e50b:
    english: "## Notifications and members"
    translation: "## Értesítések és résztvevők"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  36a20a0e10208c7c:
    english: The right sidebar controls your email notifications and shows who has been invited, who has seen the thread, and who has been notified.
    translation: A jobb oldalsávban beállíthatod az e-mail-értesítéseidet, és láthatod, kit hívtak meg, ki látta a témát, valamint ki kapott értesítést.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f2a437ac1169c882:
    english: "### Email notifications for this thread"
    translation: "### E-mail-értesítések erről a témáról"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9bd7269489ed048e:
    english: Select the current notification setting to choose whether Loomio emails you about all activity, only activity that specifically notifies you, or no activity. Receiving email for all activity can produce many messages in an active thread.
    translation: Válaszd ki a jelenlegi értesítési beállítást, majd állítsd be, hogy a Loomio minden eseményről, csak a kifejezetten neked szóló értesítésekről, vagy egyáltalán ne küldjön e-mailt. Egy aktív témában a minden eseményről szóló értesítés sok e-mailt eredményezhet.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0d64de2345c8eba9:
    english: "![Email when notified selected in the discussion sidebar](../notifying_people/thread_interact.png)"
    translation: "![E-mail küldése értesítéskor beállítás kiválasztva a beszélgetés oldalsávjában](../notifying_people/thread_interact.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
