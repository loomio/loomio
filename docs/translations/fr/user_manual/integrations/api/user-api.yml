    translation: Listez les adhésions visibles pour le compte utilisateur associé à la clé API. Les membres d’un groupe peuvent consulter les noms, les identifiants, les titres et les rôles des membres. Les adresses e-mail sont incluses uniquement pour le propre compte associé à la clé API ou lorsque ce compte est administrateur du groupe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
