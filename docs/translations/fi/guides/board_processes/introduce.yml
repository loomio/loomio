---
navigation_title: Loomion esittely hallituksellesi
blocks:
  2d7d9e9285159d4f:
    english: "# Introducing Loomio to your board"
    translation: "# Loomion esittely hallituksellesi"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6a42b6e2aba774c1:
    english: Loomio can become the online place where your board or committee meet, discuss, decide and build an auditable record for your organization.
    translation: Loomio voi olla verkkotila, jossa hallitus tai toimikunta kokoontuu, keskustelee, tekee päätöksiä ja tallentaa organisaatiolleen jäljitettävän päätöshistorian.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1e26a40fe8b74f47:
    english: Start with the general sequence in [Introducing Loomio to your group](/en/user_manual/overview/introducing_loomio). This page adds considerations specific to boards and committees.
    translation: Aloita oppaan [Loomion esittely ryhmällesi](/en/user_manual/overview/introducing_loomio) yleisistä vaiheista. Tällä sivulla käsitellään hallitusten ja toimikuntien erityistarpeita.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2999c11b8e274b1b:
    english: However Loomio will be of little value if only some of your board participate.  Information and communication will likely remain scattered over multiple tools, lost in email inboxes and the confusion will waste everyone's time.
    translation: Loomiosta on vain vähän hyötyä, jos vain osa hallituksen jäsenistä osallistuu. Tiedot ja viestintä jäävät helposti hajalleen eri työkaluihin ja sähköpostilaatikoihin. Tästä syntyvä epäselvyys vie kaikkien aikaa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  28097dbe6dfd2fd7:
    english: 'Consider the problem you are trying to solve by using Loomio, say to improve and track communication or build institutional memory.  Then commit as a board to move your work into Loomio, and encourage everyone to make a genuine effort.  '
    translation: Mieti, mitä ongelmaa haluat ratkaista Loomiolla. Voit esimerkiksi parantaa viestintää ja pitää siitä kirjaa tai tallentaa organisaation tietoa myöhempää käyttöä varten. Sopikaa sitten hallituksessa, että siirrätte työnne Loomioon, ja kannustakaa kaikkia osallistumaan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  449e6d5c90588dd2:
    english: As administrator your primary objective is to set up Loomio effectively for your board.
    translation: Ylläpitäjänä tärkein tehtäväsi on ottaa Loomio käyttöön hallituksellesi sopivalla tavalla.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '08969c9eca0d9855':
    english: 'Aim to encourage directors to join and participate. They should be able to:'
    translation: 'Kannusta hallituksen jäseniä liittymään ja osallistumaan. Heidän pitäisi osata:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  70bf0ec81830055e:
    english: |-
      - Sign in to Loomio
      - Read and comment on threads
      - Vote in polls
      - See how your governance practices work in Loomio
    translation: |-
      - Kirjautua Loomioon
      - Lukea keskusteluketjuja ja kommentoida niitä
      - Äänestää kyselyissä
      - Nähdä, miten hallituksen toimintatavat toteutuvat Loomiossa
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d41ec118bb86c93f:
    english: "## Check technical proficiency "
    translation: "## Tarkista tekniset taidot"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  728e1c8d201cacca:
    english: Board members will need a computer or smartphone connected to the internet. They must be capable of sending and receiving email, browsing the web, reading digital documents, viewing and hearing videos.
    translation: Hallituksen jäsenet tarvitsevat internetiin yhdistetyn tietokoneen tai älypuhelimen. Heidän on osattava lähettää ja vastaanottaa sähköpostia, käyttää verkkoselainta, lukea digitaalisia asiakirjoja sekä katsoa ja kuunnella videoita.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  de1b1186edaff7c6:
    english: 'Check that members have all of the following:'
    translation: 'Varmista, että kaikilla jäsenillä on seuraavat välineet ja taidot:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9932640dbf8944e3:
    english: |-
      - an up-to-date device—a computer, tablet or smart phone with email and a modern internet browser
      - internet service via WIFI, ethernet cable or mobile data plan (3G or above)
      - capability to send and receive email, browse the internet, download documents and play videos.
    translation: |-
      - Ajantasainen tietokone, tabletti tai älypuhelin, jolla voi käyttää sähköpostia ja nykyaikaista verkkoselainta
      - Internet-yhteys Wi-Fi-verkon, Ethernet-kaapelin tai mobiilidatan kautta (vähintään 3G)
      - Taito lähettää ja vastaanottaa sähköpostia, selata verkkoa, ladata asiakirjoja ja toistaa videoita.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4496ce2ee6172b32:
    english: Loomio works with all standard internet browsers such as Google Chrome, Microsoft Edge, Firefox and Apple Safari. Old out-of-date browsers such as Microsoft Internet Explorer may not work.
    translation: Loomio toimii yleisillä verkkoselaimilla, kuten Google Chromella, Microsoft Edgellä, Firefoxilla ja Apple Safarilla. Vanhentuneet selaimet, kuten Microsoft Internet Explorer, eivät välttämättä toimi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bd5dc5f2d0f56a28:
    english: If you have a problem using Loomio on your device, [Contact Loomio support](/contact).
    translation: Jos Loomion käyttö laitteellasi ei onnistu, [ota yhteyttä Loomion tukeen](/contact).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ca7b25bb2d86ba90:
    english: "## Configure your group"
    translation: "## Määritä ryhmän asetukset"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  92712f3a984128af:
    english: |-
      ### Group Description
      The group description is the first place people see when they arrive into your Loomio group. Write it to help new members  understand the purpose of the group and the work you will do together. Provide any other information that orients people and encourages them to participate.
    translation: |-
      ### Ryhmän kuvaus
      Ryhmän kuvaus on ensimmäinen asia, jonka ihmiset näkevät saapuessaan Loomio-ryhmääsi. Kirjoita kuvaus, joka auttaa uusia jäseniä ymmärtämään ryhmän tarkoituksen ja yhteisen työnne. Lisää myös muuta tietoa, joka auttaa heitä pääsemään mukaan ja osallistumaan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7e018e436df9afa1:
    english: 'For example, welcome people and let them know that this is there online space for communication and governance of your organization:'
    translation: 'Voit esimerkiksi toivottaa jäsenet tervetulleiksi ja kertoa, että tämä on organisaationne viestinnän ja päätöksenteon verkkotila:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  826a76aa71e6d689:
    english: |-
      - Remind members of the purpose of the board or committee.
      - Outline how you intend to use Loomio; prepare for meetings, progress discussions, make decisions and stay in context between meetings.
      - Be clear who has access to the group, can read and participate.
      - Attach or link any background or governance documents.
    translation: |-
      - Muistuta jäseniä hallituksen tai toimikunnan tarkoituksesta.
      - Kerro, miten aiotte käyttää Loomiota kokouksiin valmistautumiseen, keskustelujen jatkamiseen, päätösten tekemiseen ja asioiden seuraamiseen kokousten välillä.
      - Kerro selvästi, kenellä on pääsy ryhmään ja kuka voi lukea sisältöä ja osallistua.
      - Liitä tai linkitä tausta-aineistot ja hallintoa koskevat asiakirjat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  00c14924ec3f24cb:
    english: |-
      ### Check privacy and permission settings
      Loomio groups are **Secret** by default, which means only the people you specifically invite to the group know of its existence.
    translation: |-
      ### Tarkista yksityisyys- ja käyttöoikeusasetukset
      Loomio-ryhmät ovat oletusarvoisesti **Salainen**, joten vain erikseen kutsumasi ihmiset tietävät ryhmän olemassaolosta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9158ac7ea9b0db99:
    english: See [member permissions](/en/user_manual/groups/settings#permissions), and set to suit the proficiency of members in your group.  It may help to remove some permissions to avoid confusion as you are starting out. You can always restore permissions and everyone becomes more familiar with Loomio.
    translation: Tutustu [jäsenten käyttöoikeuksiin](/en/user_manual/groups/settings#permissions) ja määritä ne ryhmäsi jäsenten taitojen mukaan. Aluksi voi olla hyödyllistä poistaa joitakin oikeuksia, jotta käyttö pysyy selkeänä. Voit palauttaa oikeudet myöhemmin, kun Loomio on kaikille tutumpi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6a139f43ad2871f8:
    english: |-
      ### Category tags
      Add [category tags](/en/user_manual/discussions/tags/) to suit your organization.  Setting these in advance will help everyone use tags and find the threads and info they are looking for.
    translation: |-
      ### Luokkatunnisteet
      Lisää organisaatiollesi sopivat [luokkatunnisteet](/en/user_manual/discussions/tags/). Kun määrität ne etukäteen, kaikkien on helpompi käyttää tunnisteita sekä löytää etsimänsä keskusteluketjut ja tiedot.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7435f3589b1f26e3:
    english: |-
      ### Set up your personal profile
      Your [personal profile](/en/user_manual/users/user_profile) will help members of your group easily identify you, and have confidence that the messages they receive from you actually come from you.
    translation: |-
      ### Määritä oma profiilisi
      [Oma profiilisi](/en/user_manual/users/user_profile) auttaa ryhmäsi jäseniä tunnistamaan sinut ja varmistumaan siitä, että lähettämäsi viestit ovat sinulta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cf3684fe138b05fe:
    english: |-
      ### Manage group membership
      Make sure all the members of your board or committee have been [invited](/en/user_manual/groups/inviting_people/) to the group, and accepted their invitation.
    translation: |-
      ### Hallinnoi ryhmän jäsenyyksiä
      Varmista, että kaikki hallituksen tai toimikunnan jäsenet on [kutsuttu](/en/user_manual/groups/inviting_people/) ryhmään ja että he ovat hyväksyneet kutsunsa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '029e18cb13c89e7b':
    english: "### Start with a board process"
    translation: "### Aloita hallituksen toistuvasta toimintatavasta"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ba8a6193de9c928f:
    english: The general introduction guide explains how to help everyone comment and vote once. For a board, follow that practice with one recurring governance process, such as preparing an agenda, approving minutes, reviewing a report, or making a small out-of-session decision.
    translation: Yleisessä aloitusoppaassa kerrotaan, miten autat kaikkia kommentoimaan ja äänestämään kerran. Jatkakaa hallituksessa harjoittelemalla yhtä toistuvaa toimintatapaa, kuten esityslistan valmistelua, pöytäkirjan hyväksymistä, raportin käsittelyä tai pienen päätöksen tekemistä kokousten välillä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f7c156fde7984f49:
    english: Agree whether decisions made in Loomio take effect when their outcome is published or must be ratified at the next meeting. Record the agreed quorum, vote threshold, eligible voters, and ratification process in the group description or governance documents.
    translation: Sopikaa, tulevatko Loomiossa tehdyt päätökset voimaan, kun niiden johtopäätös julkaistaan, vai pitääkö ne vahvistaa seuraavassa kokouksessa. Kirjatkaa sovittu päätösvaltaisuus, hyväksymiseen vaadittava äänimäärä, äänioikeutetut ja vahvistamismenettely ryhmän kuvaukseen tai hallintoa koskeviin asiakirjoihin.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
