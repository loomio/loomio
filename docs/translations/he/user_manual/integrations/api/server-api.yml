    english: "<!-- seo-description: Use the Loomio Server API to manage user accounts on a self-hosted Loomio installation. -->"
    translation: "<!-- seo-description: ניתן להשתמש ב-API השרת של Loomio לניהול חשבונות משתמשים בהתקנת Loomio באירוח עצמי. -->"
