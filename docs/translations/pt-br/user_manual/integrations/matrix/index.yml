  f3106c22cd3d4059:
    english: 'Loomio can send notifications into your Matrix channels when new discussions, proposals, comments, votes, and outcomes occur. '
    translation: O Loomio pode enviar notificações aos seus canais do Matrix quando há novas discussões, propostas, comentários, votos e conclusões.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a20cf2be00dac0ce:
    english: Matrix is nice because it allows some HTML in the chatroom, and Loomio takes advantage of this.
    translation: O Matrix permite usar alguns elementos HTML nas salas de conversa, e o Loomio aproveita esse recurso.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ffe12502f0030fec:
    english: Our Matrix integration is a little different to our other chat integrations - it does not use a webhook - we've built a custom bot client for this one.
    translation: 'A integração com o Matrix funciona de forma diferente das outras integrações de chat: ela usa um bot criado para essa finalidade em vez de um webhook.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  44db147f65127a55:
    english: You will need to create a matrix user for the bot to login as.
    translation: Você precisa criar uma conta no Matrix para o bot usar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  98045e5bf1339543:
    english: Once you've created a user for the bot, sign in at that user to obtain the following information.
    translation: Depois de criar a conta do bot, entre nela para obter as informações a seguir.
    status: machine
    provider: codex/gpt-6-sol
