    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  909769fda18f0ec6:
    english: 'You can add a link to any shareable document or page on the internet.  '
    translation: Puedes añadir un enlace a cualquier documento o página de internet que se pueda compartir.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e034be8c0fbe76db:
    english: 'To add a link:'
    translation: 'Para añadir un enlace:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dcf90e79aba1a2f9:
    english: |-
      1. Select the text you want to link to - say the name of a document.
      2. Click the link icon.
      3. Paste the address into the **Insert link** field and select **Apply**.
    translation: |-
      1. Selecciona el texto que quieres enlazar, por ejemplo, el nombre de un documento.
      2. Haz clic en el icono de enlace.
      3. Pega la dirección en el campo **Inserte un enlace** y selecciona **Enviar una solicitud**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  40ecf7d0c79432b2:
    english: For a document hosted elsewhere, check its sharing permissions so discussion participants can open it.
    translation: Si el documento está alojado en otro sitio, comprueba sus permisos de uso compartido para que los participantes de la discusión puedan abrirlo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3f1824fc07dded13:
    english: A preview of the doc will appear under the text space. You can remove this if you want.
    translation: Aparecerá una vista previa del documento debajo del campo de texto. Puedes eliminarla si quieres.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c6061aa7deff27ac:
    english: Now, anyone with access to your Loomio discussion and permission to view the doc can open and read it.
    translation: Ahora, cualquier persona con acceso a tu discusión de Loomio y permiso para ver el documento podrá abrirlo y leerlo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
