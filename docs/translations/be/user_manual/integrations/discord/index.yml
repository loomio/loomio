  9f4683cb4db90895:
    english: Loomio can send notifications into your Discord channels when new discussions, proposals, comments, votes, and outcomes occur. You can also manually notify the chatroom when you need to remind people about a decision.
    translation: Loomio можа адпраўляць апавяшчэнні ў вашы каналы Discord, калі з'яўляюцца новыя абмеркаванні, прапановы, каментарыі, галасы і высновы. Вы таксама можаце ўручную адправіць апавяшчэнне ў чат, каб нагадаць людзям пра рашэнне.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
