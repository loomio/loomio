  b4f45bba98832973:
    english: "## List Memberships"
    translation: "## Lidmaatschappen weergeven"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  db5578da00c8e245:
    english: List the memberships visible to the API-key user. Group members can read member names, IDs, titles, and roles. Email addresses are included only for the API-key user's own account or when the API-key user is a group administrator.
    translation: Geef de lidmaatschappen weer die de gebruiker van de API-sleutel kan zien. Groepsleden kunnen namen, ID's, titels en rollen van leden lezen. E-mailadressen zijn alleen opgenomen voor het eigen account van de gebruiker van de API-sleutel of wanneer die gebruiker groepsbeheerder is.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  918224859e770180:
    english: "`GET /api/b2/memberships`"
    translation: "`GET /api/b2/memberships`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9ca7c77c708956dd:
    english: |-
      | Name | Description |
      | --- | --- |
      | `group_id` | Integer, required. ID of the group whose memberships will be listed |
    translation: |-
      | Naam | Beschrijving |
      | --- | --- |
      | `group_id` | Geheel getal, verplicht. ID van de groep waarvan de lidmaatschappen worden weergegeven |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  df7f1aa3f445fca5:
    english: "## Manage Memberships"
    translation: "## Lidmaatschappen beheren"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  12167a132cbc9ba9:
    english: Send a list of emails. It will invite all the new email addresses to the group. Unlike listing memberships, this operation requires group-administrator permission.
    translation: Verstuur een lijst met e-mailadressen. Nieuwe adressen op de lijst krijgen een uitnodiging voor de groep. Hiervoor zijn beheerdersrechten voor de groep vereist.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  472725f6bacb0edc:
    english: "`POST /api/b2/memberships`"
    translation: "`POST /api/b2/memberships`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  528fc95bb1a3c505:
    english: |-
      | Name | Description |
      | --- | --- |
      | `group_id` | Integer, required. ID of the group whose memberships will be managed |
      | `emails` | Array of strings, required. Email addresses of people to invite into the group |
      | `remove_absent` | Boolean. If true, remove anyone from the group whose email is not present in the list |
    translation: |-
      | Naam | Beschrijving |
      | --- | --- |
      | `group_id` | Geheel getal, verplicht. ID van de groep waarvan de lidmaatschappen worden beheerd |
      | `emails` | Lijst met teksten, verplicht. E-mailadressen van personen die voor de groep worden uitgenodigd |
      | `remove_absent` | Booleaanse waarde. Bij true wordt iedereen van de groep verwijderd van wie het e-mailadres niet op de lijst staat |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  444860e8996924f4:
    english: If you pass `remove_absent=1`, any members of the group who were not included in the list will be removed from the group. Be careful, you could remove everyone in your group.
    translation: 'Als je `remove_absent=1` opgeeft, worden alle groepsleden die niet op de lijst staan uit de groep verwijderd. Controleer de lijst zorgvuldig: je kunt hiermee iedereen uit jouw groep verwijderen.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6cdfb31270df0fc9:
    english: 'This returns an object with `{added_emails: ["person@added.com"], removed_emails: ["person@removed.com"]}`.'
    translation: 'Dit geeft een object terug met `{added_emails: ["person@added.com"], removed_emails: ["person@removed.com"]}`.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
