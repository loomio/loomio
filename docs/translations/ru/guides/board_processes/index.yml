  a29c1c76443ad97f:
    english: Good governance is more than a board meeting, it requires good communication before and after meetings.
    translation: Эффективное управление требует хорошего общения до и после заседаний совета, а не только во время них.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9f05171a74ac30d0:
    english: |-
      This guide is intended to help you use Loomio in your board or committee, so you can stay connected between meetings, deal with urgent matters and reduce board admin.
      - Continue governance between meetings
      - Keep track of communications
      - Use board meetings for issues that matter
      - Preserve institutional memory with a detailed record
    translation: |-
      Это руководство поможет вам использовать Loomio в совете или комитете: поддерживать связь между заседаниями, решать срочные вопросы и сокращать административную работу.
      - Продолжайте работу совета между заседаниями
      - Сохраняйте переписку и обсуждения
      - Посвящайте заседания важным вопросам
      - Сохраняйте историю работы организации в подробных записях
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
