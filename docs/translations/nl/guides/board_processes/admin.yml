      - Austen Cordasco, Co-operative Assistance Network Limited (CAN), zakelijke dienstverlening, Verenigd Koninkrijk
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b8eb8dcae7d7a78b:
    english: Let's look at how to organize work, administer discussions, keep data safe and store records in Loomio.
    translation: Hier lees je hoe je in Loomio het werk organiseert, discussies beheert, gegevens veilig bewaart en documenten archiveert.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a27011d28c4f11a6:
    english: "## Administering discussions"
    translation: "## Discussies beheren"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8e67ece08e454475:
    english: There is a range of features in Loomio to help you administer discussions accessible from the drop down menu to the right of the discussion.
    translation: Loomio heeft verschillende functies om discussies te beheren. Je vindt ze in het uitklapmenu rechts van de discussie.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2d5be8c39f22ec28:
    english: 'Keep the discussion list current by using:'
    translation: 'Houd de discussielijst actueel met deze functies:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  75739da1bd5910a6:
    english: |-
      - **Pin discussion** to keep important discussions at the top of the list
      - **Edit discussion** to change discussion title or update discussion context
      - **Move to group** when you want to move a discussion to another group or subgroup, or to an archive group.
      - **Lock thread** to prevent further comments or changes and remove the thread from the list of open threads. Locked threads are available under the discussion filter and from the search bar, and can be unlocked at any time.
      - **Delete discussion** when you do not want to keep a record of the discussion.  Note that deleted discussions can not be un-deleted.
    translation: |-
      - **Pin discussie** om belangrijke discussies bovenaan de lijst te houden
      - **Bord bewerken** om de titel of context van een discussie te wijzigen
      - **Verplaats naar groep** om een discussie naar een andere groep, subgroep of archiefgroep te verplaatsen
      - **Discussie vergrendelen** om verdere reacties en wijzigingen te voorkomen en de discussie uit de lijst met open discussies te halen. Je vindt vergrendelde discussies via het discussiefilter of de zoekbalk. Je kunt ze op elk moment ontgrendelen.
      - **Discussie verwijderen** als je de discussie niet wilt bewaren. Je kunt een verwijderde discussie niet herstellen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e3d2099d0e6fe6fa:
    english: "## Category tags"
    translation: "## Categorielabels"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  24b03357f6f6c3b9:
    english: Category tags are a great way to label discussions so they can be easily found. Set tags and apply to each discussion  - try to be consistent.
    translation: Met categorielabels kun je discussies makkelijker terugvinden. Maak labels aan en ken ze consequent toe aan discussies.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f0f5f5abd586fb61:
    english: 'Common board tags include: Administration, AGM, Board meeting, Report, Finance, Legal, Members, Minutes, Planning, Policy, Resolution, Constitution, General meeting, Strategy.'
    translation: 'Veelgebruikte labels voor bestuurswerk zijn: Beheer, algemene ledenvergadering, bestuursvergadering, verslag, financiën, juridische zaken, leden, notulen, planning, beleid, besluit, statuten, algemene vergadering en strategie.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  89d8ec222f5019df:
    english: Group members can search for discussions by tag under the **tags** drop down menu.
    translation: Groepsleden kunnen via het uitklapmenu **Labels** op label naar discussies zoeken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  54ee008489cceaca:
    english: "## Maintaining the discussion topic"
    translation: "## Bij het onderwerp blijven"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e9007433ca60ae39:
    english: Discussions work best for everyone when you can keep the discussion on a single topic.
    translation: Een discussie is voor iedereen overzichtelijker als die bij één onderwerp blijft.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f742ae07824b35c6:
    english: If a new topic is introduced in the middle of a discussion, you can select and move specific comments to another discussion, or start a new discussion.
    translation: Komt er tijdens een discussie een nieuw onderwerp op, dan kun je bepaalde reacties selecteren en naar een andere discussie verplaatsen. Je kunt ook een nieuwe discussie starten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c8b5176f58dceb8b:
    english: "## Subgroups"
    translation: "## Subgroepen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  79ad157a95adc8ef:
    english: Subgroups help you organize your communications and members so that the right people are engaged in their work together.  For example, you can use a subgroup for a subcommittee or working group.
    translation: Met subgroepen kun je de communicatie en leden indelen, zodat de juiste mensen samenwerken. Je kunt bijvoorbeeld een subgroep gebruiken voor een commissie of werkgroep.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0f4ebdab4c62be34:
    english: "[Setting up subgroups.](/en/user_manual/groups/subgroups)"
    translation: "[Subgroepen instellen.](/en/user_manual/groups/subgroups)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d3c65fde78b2b08f:
    english: "## Archiving records"
    translation: "## Gegevens archiveren"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  435f52763f0d9a5b:
    english: To keep a record of a thread discussion and decisions in polls, use **[Print thread](/en/user_manual/groups/data_export#print-thread-to-pdf)** and print the file to pdf.  You can then store a published copy of the thread in your chosen document storage archive.
    translation: Gebruik **[Discussie afdrukken](/en/user_manual/groups/data_export#print-thread-to-pdf)** om een discussie en besluiten uit peilingen te bewaren. Druk het bestand af als pdf. Daarna kun je een gepubliceerde kopie van de discussie opslaan in het documentarchief van je keuze.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a6b96750c9e1e590:
    english: To keep a complete record of the data in your Loomio group, use **[Export group data](/en/user_manual/groups/data_export#group-data-backup-or-export)**.
    translation: Gebruik **[Groepsgegevens exporteren](/en/user_manual/groups/data_export#group-data-backup-or-export)** om alle gegevens van je Loomio-groep te bewaren.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '082f19717e933762':
    english: "## Data storage"
    translation: "## Gegevensopslag"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e6c76e3a9b68b65f:
    english: Loomio's cloud services protect your data by writing to multiple disks instantly, backed up daily, and stored in multiple locations.
    translation: De clouddiensten van Loomio beschermen je gegevens door ze direct op meerdere schijven op te slaan, er dagelijks een back-up van te maken en ze op meerdere locaties te bewaren.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  84ee638382ead0fe:
    english: All data in threads, comments, polls and file attachments are stored in this way.
    translation: Dit geldt voor alle gegevens in discussies, reacties en peilingen, en voor bijgevoegde bestanden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6e92f35d693c625c:
    english: Files attached to threads can also be seen under the Files tab.
    translation: Bestanden die aan discussies zijn toegevoegd, vind je ook op het tabblad Bestanden.
    status: machine
    provider: codex/gpt-6-sol
