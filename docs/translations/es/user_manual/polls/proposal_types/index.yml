  d370759001be4e21:
    english: Polls collect selections, scores, allocations, rankings, availability, or election ballots. Choose the voting method based on what participants need to express and how you intend to use the result. Use a [Proposal](/en/user_manual/polls/proposals/) when people need to respond to a statement or course of action.
    translation: Los sondeos permiten recopilar selecciones, puntuaciones, distribuciones de puntos, preferencias ordenadas, disponibilidad o votos en elecciones. Elige el método de votación según lo que necesiten expresar las personas participantes y cómo vayas a usar el resultado. Usa una [propuesta](/en/user_manual/polls/proposals/) cuando las personas deban responder a una afirmación o un plan de acción.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1132ff680c7b2562:
    english: "## Simple poll"
    translation: "## Sondeo simple"
    status: machine
