  3fa760281a1aed06:
    english: "# Proposals"
    translation: "# Предложения"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ca5b9583bfe78b65:
    english: A proposal asks people to respond to a statement or course of action. Participants choose a defined response and can explain their vote. Use a proposal to gather feedback, seek advice, identify objections, or test for agreement.
    translation: Предложение помогает узнать мнение участников о сформулированной идее или плане действий. Участники выбирают один из вариантов ответа и могут объяснить свой голос. Используйте предложение, чтобы собрать отзывы, получить советы, выявить возражения или проверить, есть ли согласие.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  143dc77c58a4c881:
    english: This section helps you choose and run Loomio's default proposal templates. For a complete sequence of discussion, proposals, amendments, and outcome, use the [decision-making guides](/en/guides/making_decisions/). To change the templates available to your group, see [Poll templates](../poll_templates/).
    translation: В этом разделе описано, как выбрать и провести предложение с помощью стандартных шаблонов Loomio. Полный процесс — от обсуждения и предложений до поправок и итогового решения — описан в [руководствах по принятию решений](/en/guides/making_decisions/). Чтобы изменить шаблоны, доступные вашей группе, см. раздел [Шаблоны голосований](../poll_templates/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e0f8614f95c9c5ff:
    english: "## Choose a proposal template"
    translation: "## Выберите шаблон предложения"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  525699503edbe342:
    english: |-
      | Template | What it asks | Use it when… |
      |---|---|---|
      | [Sense check](sense_check/) | Is this on the right track? | An idea is still being developed |
      | [Advice](advice/) | What advice should the decision maker consider? | A person or team owns the decision |
      | [Consent](consent/) | Is this safe to try, or is there a meaningful objection? | The group uses consent decision-making |
      | [Consensus](consensus/) | What is your position on this proposal? | The group is seeking collective agreement |
    translation: |-
      | Шаблон | Вопрос | Когда использовать |
      |---|---|---|
      | [Проверка мнений](sense_check/) | Движемся ли мы в верном направлении? | Идея ещё разрабатывается |
      | [Совет](advice/) | Какие советы следует учесть тому, кто принимает решение? | Решение принимает отдельный человек или команда |
      | [Согласие](consent/) | Можно ли это попробовать без существенного риска или есть весомые возражения? | Группа принимает решения по принципу согласия |
      | [Консенсус](consensus/) | Какова ваша позиция по этому предложению? | Группа стремится к общему согласию |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0cb03ac4a22f02b4:
    english: Choose the template whose response options match the question you need answered. Each template page explains its use cases, setup, voting form, and results.
    translation: Выберите шаблон, варианты ответа в котором соответствуют вашему вопросу. На странице каждого шаблона описано, когда его использовать, как его настроить, как устроено голосование и как выглядят результаты.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d379b02c308b3b55:
    english: "## Other proposal templates"
    translation: "## Другие шаблоны предложений"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  44cdb16aebf757ca:
    english: Loomio also provides templates such as Proposal, Gradients of agreement, Question round, and Majority. Some are hidden initially. Group administrators can make them available or create a template for the group's own terminology and rules from [Poll templates](../poll_templates/).
    translation: В Loomio также есть шаблоны «Предложение», «Градиенты согласия», «Раунд вопросов» и «Большинство». Некоторые из них изначально скрыты. Администраторы группы могут сделать их доступными или создать шаблон с терминами и правилами своей группы в разделе [Шаблоны голосований](../poll_templates/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ca179ba4cb53c5e3:
    english: "## Proposal records"
    translation: "## История принятия решения"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  460a90e796fc4dc0:
    english: Votes and reasons update while the proposal is open, and participants can change their response. After it closes, publish an [outcome](../outcomes/) that states the decision or next step. The discussion, proposal, votes, reasons, and outcome form a record of how the group reached its decision.
    translation: Пока предложение открыто, участники могут менять свои ответы и пояснения к ним. После закрытия опубликуйте [итоговое решение](../outcomes/) с принятым решением или следующим шагом. Обсуждение, предложение, голоса, пояснения и итоговое решение сохраняют историю того, как группа пришла к решению.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
