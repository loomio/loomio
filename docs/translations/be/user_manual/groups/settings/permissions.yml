blocks:
  d661e5fc8cc1b460:
    english: "# Group permissions"
    translation: "# Дазволы групы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  712830f14602c6c7:
    english: The permissions tab controls which group operations are available to ordinary members and, for non-secret groups, to non-members. Open **Edit group settings** from the group page, then select **Permissions**.
    translation: Укладка дазволаў вызначае, якія дзеянні ў групе даступныя звычайным удзельнікам, а ў несакрэтных групах — таксама людзям па-за групай. На старонцы групы адкрыйце **Рэдагаваць налады групы**, затым выберыце **Дазволы**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b71bf8cce1cb369c:
    english: "![Group permission settings](group_group_settings_permissions.png)"
    translation: "![Налады дазволаў групы](group_group_settings_permissions.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  88e5fcd302a53620:
    english: Administrators retain the ability to manage the group. Enabling a member permission extends that particular action to ordinary members; it does not make them administrators.
    translation: Адміністратары захоўваюць магчымасць кіраваць групай. Калі даць звычайным удзельнікам дазвол на пэўнае дзеянне, яны змогуць яго выконваць, але не стануць адміністратарамі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5b2b9af0f68b7a57:
    english: 'Permissions include whether members can:'
    translation: 'Дазволы вызначаюць, ці могуць удзельнікі:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8377b499d13690c0:
    english: |-
      - add members or invite guests;
      - send announcements;
      - create subgroups;
      - start and manage discussions;
      - create and manage tags;
      - edit or delete comments where the setting permits;
      - start proposals and polls; and
      - create discussion and poll templates.
    translation: |-
      - дадаваць удзельнікаў або запрашаць гасцей;
      - рассылаць абвяшчэнні;
      - ствараць падгрупы;
      - пачынаць абмеркаванні і кіраваць імі;
      - ствараць тэгі і кіраваць імі;
      - рэдагаваць або выдаляць каментарыі, калі гэта дазволена наладай;
      - пачынаць прапановы і апытанні; і
      - ствараць шаблоны абмеркаванняў і апытанняў.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  87166abe7eea1ab3:
    english: For groups that are not secret, administrators can separately allow non-members to start discussions. A non-member who starts a discussion becomes a guest of that discussion but does not gain access to other private discussions or become a group member.
    translation: У несакрэтных групах адміністратары могуць асобна дазволіць людзям па-за групай пачынаць абмеркаванні. Такія людзі становяцца гасцямі пачатых імі абмеркаванняў, але не атрымліваюць доступу да іншых прыватных абмеркаванняў і не становяцца ўдзельнікамі групы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3d01d10a97636b1e:
    english: The **Admins can edit members' comments** setting gives administrators an exceptional moderation capability. Enable it only when the group has agreed that administrators should be able to alter member-authored content.
    translation: Налада **Адміністратары могуць рэдагаваць каментарыі ўдзельнікаў** дае адміністратарам асаблівае права змяняць чужыя каментарыі. Уключайце яе толькі тады, калі група пагадзілася, што адміністратары могуць змяняць змест, напісаны ўдзельнікамі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b0af0135752a461f:
    english: Review permissions when the group's purpose, membership, or moderation responsibilities change. Give each role only the capabilities it needs.
    translation: Пераглядайце дазволы, калі змяняюцца мэты групы, яе склад або абавязкі па мадэрацыі. Давайце кожнай ролі толькі тыя магчымасці, якія ёй патрэбныя.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
