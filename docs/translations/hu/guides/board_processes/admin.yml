  a27011d28c4f11a6:
    english: "## Administering discussions"
    translation: "## Beszélgetések kezelése"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8e67ece08e454475:
    english: There is a range of features in Loomio to help you administer discussions accessible from the drop down menu to the right of the discussion.
    translation: A Loomióban többféle funkció segít a beszélgetések kezelésében. Ezeket a beszélgetés jobb oldalán lévő legördülő menüben találod.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2d5be8c39f22ec28:
    english: 'Keep the discussion list current by using:'
    translation: 'Az alábbi lehetőségekkel tarthatod naprakészen a beszélgetések listáját:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  75739da1bd5910a6:
    english: |-
      - **Pin discussion** to keep important discussions at the top of the list
      - **Edit discussion** to change discussion title or update discussion context
      - **Move to group** when you want to move a discussion to another group or subgroup, or to an archive group.
      - **Lock thread** to prevent further comments or changes and remove the thread from the list of open threads. Locked threads are available under the discussion filter and from the search bar, and can be unlocked at any time.
      - **Delete discussion** when you do not want to keep a record of the discussion.  Note that deleted discussions can not be un-deleted.
    translation: |-
      - **Beszélgetés rögzítése**: a fontos beszélgetések a lista tetején maradnak
      - **Téma szerkesztése**: módosíthatod a beszélgetés címét vagy leírását
      - **Mozgasd a csoportba**: áthelyezheted a beszélgetést másik csoportba, alcsoportba vagy archív csoportba
      - **Téma zárolása**: megakadályozhatod az új hozzászólásokat és módosításokat, és eltávolíthatod a témát a nyitott témák listájából. A zárolt témákat a beszélgetésszűrővel és a keresősávban találod meg. Bármikor feloldhatod a zárolásukat.
      - **Beszélgetés törlése**: akkor használd, ha nem szeretnéd megőrizni a beszélgetést. A törölt beszélgetéseket nem lehet visszaállítani.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e3d2099d0e6fe6fa:
    english: "## Category tags"
    translation: "## Kategóriacímkék"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  24b03357f6f6c3b9:
    english: Category tags are a great way to label discussions so they can be easily found. Set tags and apply to each discussion  - try to be consistent.
    translation: A kategóriacímkékkel könnyebben megtalálhatók a beszélgetések. Hozz létre címkéket, és alkalmazd őket a beszélgetésekre. Használd őket következetesen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f0f5f5abd586fb61:
    english: 'Common board tags include: Administration, AGM, Board meeting, Report, Finance, Legal, Members, Minutes, Planning, Policy, Resolution, Constitution, General meeting, Strategy.'
    translation: 'Gyakori testületi címkék: Adminisztráció, Éves közgyűlés, Testületi ülés, Beszámoló, Pénzügyek, Jogi ügyek, Tagok, Jegyzőkönyvek, Tervezés, Szabályzatok, Határozatok, Alapszabály, Közgyűlés, Stratégia.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  89d8ec222f5019df:
    english: Group members can search for discussions by tag under the **tags** drop down menu.
    translation: A csoport tagjai a **Címkék** legördülő menüben címke alapján kereshetnek beszélgetéseket.
    status: machine
