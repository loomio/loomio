  0431c9fc46658338:
    english: 'The group participation report gives insights into the usage of your Loomio group. '
    translation: Отчёт об участии в группе показывает, как используется ваша группа в Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0d23c0831f1ea6ca:
    english: 'You''re able to choose which groups to include in the report, the start and end date for the report, and the interval (year, month, week or day) for grouping results. '
    translation: 'Вы можете выбрать группы для отчёта, начальную и конечную даты, а также интервал для группировки результатов: год, месяц, неделю или день.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  73c9822c08a37866:
    english: The report is available to everyone in your group, however users can only see results for groups that they belong to, this means that different users may see slightly different reports.
    translation: Отчёт доступен всем участникам вашей группы. Каждый видит результаты только тех групп, в которых состоит, поэтому отчёты разных людей могут немного отличаться.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c9402b4720639f86:
    english: 'You can find the report by clicking the group settings menu cog, as shown below. '
    translation: Чтобы открыть отчёт, нажмите значок шестерёнки в меню настроек группы, как показано ниже.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
