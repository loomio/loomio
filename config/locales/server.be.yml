      process_subtitle_v2: Працягвайце, пакуль хтосьці не пярэчыць
      process_introduction_v2: "<p><strong>Згода</strong> пытаецца, ці бяспечна паспрабаваць паспрабаваць паспрабаваць прапанову, а не ці ідэальная яна. Прапанова прымаецца, пакуль ніхто не выказвае значных пярэчанняў. Калі хтосьці пярэчыць, група працуе над вырашэннем праблемы — і паколькі ўдзельнікі могуць змяняць свой голас па меры развіцця прапановы, пярэчанні становяцца інструментам для паляпшэння, а не перашкодай.</p>"
      process_introduction: <p>Звярніцеся па згоду на рашэнне, якое вам трэба прыняць, пры адсутнасці істотных пярэчанняў супраць вашай прапановы, каб вы маглі хутка прыняць рашэнне для вашай арганізацыі, якое будзе «бяспечным для спробы».</p><ul><li><p> Імкніцеся да «дастаткова добрага» рашэння</p></li><li><p> Уключыце шмат галасоў для распрацоўкі дзейснай прапановы</p></li><li><p> Спытайце, ці ёсць у каго-небудзь слушныя пярэчанні</p></li><li><p> Унесці змены ў прапанову, каб вырашыць пярэчанні</p></li></ul><p> <a target="_blank" href="https://help.loomio.com/en/guides/consent_process/index.html">Даведайцеся больш пра працэс атрымання згоды</a> .</p>
