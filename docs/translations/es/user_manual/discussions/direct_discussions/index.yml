  b3ed13f5612f4ff9:
    english: A direct discussion is a private discussion for a specific set of people.
    translation: Una discusión directa es una discusión privada entre un grupo específico de personas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  479f7faed056ab51:
    english: A direct discussion does not belong to a group. Invited people do not need to be a member of your Loomio group.
    translation: Una discusión directa no pertenece a ningún grupo. Las personas invitadas no necesitan ser miembros de tu grupo de Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2f5362faecc07fa0:
    english: You control who can see and participate by adding people or email addresses to the **Invite** field.
    translation: Para decidir quién puede verla y participar, añade personas o direcciones de correo electrónico al campo **Invitar**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f31343ea54b4f899:
    english: Direct discussions support the same comments, polls and other tools as group discussions. They can be useful when creating a subgroup is unnecessary.
    translation: Las discusiones directas tienen los mismos comentarios, sondeos y otras herramientas que las discusiones de grupo. Pueden ser útiles cuando no hace falta crear un subgrupo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
