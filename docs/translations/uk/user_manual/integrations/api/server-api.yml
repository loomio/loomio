  ef744e4acfdb7653:
    english: "## Redact User"
    translation: "## Видалення персональних даних користувача"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4a423dbb4fd59b45:
    english: Redaction keeps the user's comments and other user-generated content within their groups, but removes known personally identifying information such as name, bio, profile photo, email address, login credentials, identities, and active sessions.
    translation: 'Під час видалення персональних даних коментарі користувача та інший створений ним вміст залишаються в його групах. Водночас видаляються відомі дані, за якими можна встановити особу: ім’я, біографія, фото профілю, адреса електронної пошти, облікові дані для входу, ідентифікатори та активні сеанси.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9b472af7dbef98ac:
    english: This is the recommended way to remove a user from Loomio.
    translation: Це рекомендований спосіб вилучити користувача з Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
