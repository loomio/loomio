navigation_title: פתיחת קבוצה
blocks:
  e8632dbb628c7c7d:
    english: "# Starting a new group"
    translation: "# פתיחת קבוצה חדשה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2a4a6907d4e2049d:
    english: If you are new to Loomio, you can start a group on a free trial at any time from the [Loomio website](https://www.loomio.com/). If you already use Loomio and would like to start a new group for another organization or purpose, you can do this from the sidebar menu - click on **New group**.
    translation: אם השימוש ב-Loomio חדש, ניתן לפתוח קבוצה לתקופת ניסיון בחינם בכל עת דרך [אתר Loomio](https://www.loomio.com/). אם כבר משתמשים ב-Loomio ורוצים לפתוח קבוצה חדשה לארגון אחר או למטרה אחרת, יש לבחור **קבוצה חדשה** בתפריט הצד.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  10e8756c96038e58:
    english: For many organizations, a single Loomio group is sufficient. You can start as many subgroups as you need within the group. See [Subgroups](/en/user_manual/groups/subgroups/) for more info.
    translation: לארגונים רבים מספיקה קבוצה אחת ב-Loomio. ניתן לפתוח בתוכה כמה תת-קבוצות שצריך. למידע נוסף, ראו [תת-קבוצות](/en/user_manual/groups/subgroups/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ed00dbe94cd53435:
    english: "## Group details"
    translation: "## פרטי הקבוצה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0bb201e3a09fe99d:
    english: "### Group name"
    translation: "### שם הקבוצה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '019cdfc169ea858a':
    english: Type your group name. It's best to keep your group name short and concise.
    translation: יש להזין שם לקבוצה. מומלץ לבחור שם קצר וברור.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6ae6b08ae7fbe257:
    english: "### Group handle"
    translation: "### מזהה הקבוצה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b054d0f760888add:
    english: Your group is automatically assigned a handle. The handle is used in the group's URL and email address, such as **loomio.com/your-group-handle** and **your-group-handle@loomio.com**.
    translation: לקבוצה מוקצה מזהה באופן אוטומטי. המזהה מופיע בכתובת האתר ובכתובת הדוא״ל של הקבוצה, למשל **loomio.com/your-group-handle** ו-**your-group-handle@loomio.com**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1dee654ba628ba95:
    english: You can edit the handle when you create the group and change it later in group settings. When you change it, links and email addresses that use the old handle continue to work. Loomio keeps up to three old handles; after that, the oldest handle expires.
    translation: ניתן לערוך את המזהה בעת יצירת הקבוצה ולשנות אותו בהמשך בהגדרות הקבוצה. לאחר שינוי המזהה, קישורים וכתובות דוא״ל שמשתמשים במזהה הישן ממשיכים לפעול. Loomio שומרת עד שלושה מזהים ישנים; לאחר מכן, המזהה הישן ביותר מפסיק לפעול.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
