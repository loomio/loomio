navigation_title: Keskustelumallit
blocks:
  80c5dfc46bb963d2:
    english: "# Discussion templates"
    translation: "# Keskustelumallit"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  488fbd5167707cba:
    english: Discussion templates help your group start discussions the same way each time. A template can supply a title, context, tags, and instructions for the person starting the discussion. It also sets defaults, such as whether to notify the whole group and which polls to suggest.
    translation: Keskustelumallit auttavat ryhmääsi aloittamaan toistuvat keskustelut samalla tavalla. Malliin voi lisätä otsikon, kontekstin, tunnisteet ja ohjeet keskustelun aloittajalle. Malli määrittää myös oletuksia, kuten ilmoitetaanko koko ryhmälle ja mitä kyselyitä ehdotetaan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2571bc9cc405d927:
    english: Every new discussion in a group starts from a template. When someone selects **Start discussion**, Loomio shows the group's templates. Even **Blank template** is a template, so your group can change its defaults too.
    translation: Jokainen uusi ryhmäkeskustelu alkaa mallista. Kun joku valitsee **Aloita keskustelu**, Loomio näyttää ryhmän mallit. Myös **Tyhjä malli** on malli, joten ryhmäsi voi muuttaa senkin oletusasetuksia.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  834ac31697ef254b:
    english: Templates work well for processes your group repeats, such as project reviews, advice processes, meeting preparation, funding decisions, or document approvals. The person starting the discussion can still edit everything before they start it.
    translation: Mallit sopivat ryhmäsi toistuviin prosesseihin, kuten projektien arviointiin, neuvojen pyytämiseen, kokousten valmisteluun, rahoituspäätöksiin ja asiakirjojen hyväksymiseen. Keskustelun aloittaja voi muokata kaikkea ennen keskustelun aloittamista.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  74d1c850f63c0518:
    english: "## How templates are used"
    translation: "## Mallien käyttäminen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6e5927441d982c01:
    english: |-
      1. A member selects **Start discussion** on the group page.
      2. Loomio lists the group's visible templates. Each one shows its title and subtitle.
      3. The member selects a template. Loomio opens the new discussion form, filled in from the template.
      4. The template's help appears at the top of the form as guidance.
      5. The member edits the title, context, tags, and invite list, then selects **Start discussion**.
    translation: |-
      1. Jäsen valitsee ryhmän sivulla **Aloita keskustelu**.
      2. Loomio näyttää ryhmän näkyvät mallit. Kustakin näkyy otsikko ja alaotsikko.
      3. Jäsen valitsee mallin. Loomio avaa uuden keskustelun lomakkeen, johon mallin tiedot on täytetty.
      4. Mallin ohjeet näkyvät lomakkeen alussa.
      5. Jäsen muokkaa otsikkoa, kontekstia, tunnisteita ja kutsuttavien luetteloa ja valitsee sitten **Aloita keskustelu**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  464984a60c23366b:
    english: Changing a template affects only discussions started after the change. Discussions already started from it keep their content and settings.
    translation: Mallin muutokset koskevat vain muutoksen jälkeen aloitettuja keskusteluja. Aiemmin aloitetut keskustelut säilyttävät sisältönsä ja asetuksensa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  70c22d24ec0d248b:
    english: "## Choose who is notified by default"
    translation: "## Valitse, kenelle ilmoitetaan oletusarvoisesti"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  77feebf56c2ee9a7:
    english: 'The **Invite** setting controls who the new discussion form invites by default. It has two options:'
    translation: "**Kutsu**-asetus määrittää, kenet uuden keskustelun lomake kutsuu oletusarvoisesti. Vaihtoehtoja on kaksi:"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6c93f4222436028f:
    english: |-
      - **Everyone in the group**: the group appears in the discussion form's **Invite** field, and every member is notified when the discussion starts.
      - **None**: the **Invite** field starts empty. Nobody is notified unless the author adds people.
    translation: |-
      - **Kaikki ryhmässä**: ryhmä näkyy keskustelulomakkeen **Kutsu**-kentässä, ja jokainen jäsen saa ilmoituksen, kun keskustelu alkaa.
      - **Ei mitään**: **Kutsu**-kenttä on aluksi tyhjä. Kukaan ei saa ilmoitusta, ellei aloittaja lisää kutsuttavia.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  17cca49613fff23d:
    english: Loomio's built-in templates, including **Blank template**, use **Everyone in the group**. If your group does not want every new discussion to notify all members, edit the templates your group uses and set **Invite** to **None**.
    translation: Loomion valmiit mallit, myös **Tyhjä malli**, käyttävät asetusta **Kaikki ryhmässä**. Jos ryhmäsi ei halua ilmoittaa jokaisesta uudesta keskustelusta kaikille jäsenille, muokkaa ryhmän käyttämiä malleja ja valitse **Kutsu**-asetukseksi **Ei mitään**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5fd184e64e0605bc:
    english: The author can always change the invite list before starting the discussion. They can remove the group to notify nobody, or add specific people instead. This setting only affects notifications. Group members can still find and read the discussion in the group, whichever option you choose.
    translation: Aloittaja voi aina muuttaa kutsuttavien luetteloa ennen keskustelun aloittamista. Hän voi poistaa ryhmän, jolloin kukaan ei saa ilmoitusta, tai lisätä yksittäisiä henkilöitä. Tämä asetus vaikuttaa vain ilmoituksiin. Ryhmän jäsenet voivat löytää keskustelun ryhmästä ja lukea sitä kummallakin asetuksella.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  58f24313ca36c890:
    english: The group is added to the invite list only when the author is allowed to notify the whole group. Admins can always do this. Members can do it when **Members can notify everyone in the group** is enabled in the group's permissions.
    translation: Ryhmä lisätään kutsuttavien luetteloon vain, jos aloittajalla on oikeus ilmoittaa koko ryhmälle. Ylläpitäjillä on aina tämä oikeus. Jäsenillä on se, kun ryhmän käyttöoikeuksissa on käytössä **Jäsenet voivat ilmoittaa kaikille ryhmän jäsenille**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  33afd174376e933b:
    english: "## Template settings"
    translation: "## Mallin asetukset"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b02be20543f228a7:
    english: 'Group admins can edit a template from the action menu beside it in the template list. The form has these settings:'
    translation: 'Ryhmän ylläpitäjä voi muokata mallia malliluettelossa sen vieressä olevasta toimintovalikosta. Lomakkeessa on seuraavat asetukset:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f2fc57fe20100911:
    english: |-
      - **Template title**: the short name shown in the template list.
      - **Template subtitle**: one line explaining when to use the template.
      - **Template help**: instructions shown at the top of the new discussion form. Use it to explain the process and link to resources. It is not part of the discussion.
      - **Group**: whether the template starts a discussion in the group or a direct discussion. A direct discussion is visible only to the people invited to it.
      - **Default title**: a title filled in for each new discussion. The author can edit it.
      - **Example title**: an example shown in an empty title field. Use it when a default title would not fit every discussion.
      - **Tags**: tags applied to each new discussion. The author can remove them.
      - **Context**: the starting text of the discussion. Use headings, questions, or links to guide what people write.
      - **Invite**: whether to invite everyone in the group by default. See [Choose who is notified by default](#choose-who-is-notified-by-default).
      - **Poll templates**: polls suggested for this process. They are listed on the new discussion form. They also appear first when someone starts a poll in the discussion. They do not start automatically.
      - **Allow concurrent polls**: whether more than one poll can be open in the discussion at the same time.
      - **Comment length limit**: an optional maximum length for comments.
    translation: |-
      - **Mallipohjan otsikko**: malliluettelossa näkyvä lyhyt nimi.
      - **Mallipohjan alaotsikko**: yksi rivi, joka kertoo, milloin mallia käytetään.
      - **Mallipohjan ohjeet**: uuden keskustelun lomakkeen alussa näkyvät ohjeet. Kerro niissä prosessista ja lisää linkkejä aineistoihin. Ohjeet eivät ole osa keskustelua.
      - **Ryhmä**: aloitetaanko mallilla ryhmäkeskustelu vai suora keskustelu. Suora keskustelu näkyy vain siihen kutsutuille.
      - **Oletusotsikko**: jokaiseen uuteen keskusteluun valmiiksi täytetty otsikko. Aloittaja voi muokata sitä.
      - **Esimerkki otsikosta**: tyhjässä otsikkokentässä näkyvä esimerkki. Käytä sitä, jos sama oletusotsikko ei sovi kaikkiin keskusteluihin.
      - **Tunnisteet**: jokaiseen uuteen keskusteluun lisättävät tunnisteet. Aloittaja voi poistaa ne.
      - **Konteksti**: keskustelun aloitusteksti. Ohjaa kirjoittamista otsikoilla, kysymyksillä tai linkeillä.
      - **Kutsu**: kutsutaanko koko ryhmä oletusarvoisesti. Katso [Valitse, kenelle ilmoitetaan oletusarvoisesti](#choose-who-is-notified-by-default).
      - **Kyselypohjat**: tähän prosessiin ehdotettavat kyselyt. Ne näkyvät uuden keskustelun lomakkeessa ja ensimmäisinä vaihtoehtoina, kun joku aloittaa kyselyn keskustelussa. Ne eivät käynnisty automaattisesti.
      - **Salli samanaikaiset kyselyt**: voiko keskustelussa olla avoinna useampi kuin yksi kysely kerrallaan.
      - **Kommentin pituusrajoitus**: kommenttien valinnainen enimmäispituus.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a9e44919507a613:
    english: Use a default title only when it will stay accurate. Otherwise, write an example title that prompts the author to name the specific review, period, document, or decision.
    translation: Käytä oletusotsikkoa vain, jos se pysyy paikkansapitävänä. Muussa tapauksessa kirjoita esimerkki otsikosta, joka ohjaa aloittajaa nimeämään kyseisen arvioinnin, ajanjakson, asiakirjan tai päätöksen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c5db289e27f54169:
    english: "## Example: bottle trial review"
    translation: "## Esimerkki: palautuspullokokeilun arviointi"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  89e7b8f9b36a8ae7:
    english: Oatmilk Cooperative reviews its returnable-bottle trial after each cycle. Its template is titled "Bottle trial review" and has a default title. It adds the "Bottle trial" tag. Its context asks members to read the weekly report and consider return rates, washing records, cafe feedback, and transport costs. It recommends a Sense check followed by Consent.
    translation: Kauramaito-osuuskunta arvioi palautuspullokokeiluaan jokaisen jakson jälkeen. Sen mallin nimi on ”Palautuspullokokeilun arviointi”, ja mallissa on oletusotsikko. Malli lisää tunnisteen ”Palautuspullokokeilu”. Kontekstissa jäseniä pyydetään lukemaan viikkoraportti ja tarkastelemaan pullojen palautusasteita, pesutietoja, kahviloiden palautetta ja kuljetuskustannuksia. Malli suosittelee ensin tilannearviota ja sen jälkeen suostumuspäätöstä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f896031f8dcc2f84:
    english: This works as a template because the purpose and evidence stay the same each cycle. Only the observations and decisions change.
    translation: Malli toimii, koska tarkoitus ja tarkasteltavat tiedot pysyvät samoina joka jaksolla. Vain havainnot ja päätökset muuttuvat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7e5955c442f6c8ae:
    english: "## Create a template"
    translation: "## Luo malli"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c2b2bc41cbe6f6a:
    english: Group admins can select **New template** from the template list. Choose an example from Loomio's gallery or start with a blank template, then adapt it and save it.
    translation: Ryhmän ylläpitäjä voi valita malliluettelosta **Uusi malli**. Valitse esimerkki Loomion galleriasta tai aloita tyhjästä mallista. Muokkaa mallia ja tallenna se.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a9cb80d574e2d865:
    english: You can search or filter the gallery. An example is not added to your group until you save it.
    translation: Voit hakea ja suodattaa gallerian malleja. Esimerkkiä ei lisätä ryhmääsi ennen kuin tallennat sen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1f0dab3f50320e75:
    english: "## Manage the template list"
    translation: "## Hallitse malliluetteloa"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7462593f2f6d1614:
    english: When a group is created, Loomio adds a set of templates suited to the kind of group. Only **Blank template** and **Practice discussion** are visible at first. The others are hidden, and admins can unhide them.
    translation: Kun ryhmä luodaan, Loomio lisää siihen ryhmän tyypille sopivia malleja. Aluksi näkyvissä ovat vain **Tyhjä malli** ja **Harjoituskeskustelu**. Muut mallit ovat piilotettuja, ja ylläpitäjät voivat näyttää ne.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e6f7eaa63e353ef7:
    english: 'Group admins can use the action menu beside a template to:'
    translation: 'Ryhmän ylläpitäjät voivat käyttää mallin vieressä olevaa toimintovalikkoa seuraaviin tehtäviin:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e8767178e42cd4e0:
    english: |-
      - edit its content and settings;
      - hide it from the template list;
      - unhide it from **Hidden templates**;
      - rearrange the order of visible templates;
      - export it as a JSON file; or
      - delete it.
    translation: |-
      - muokata mallin sisältöä ja asetuksia;
      - piilottaa mallin malliluettelosta;
      - näyttää sen uudelleen kohdasta **Piilotetut mallit**;
      - muuttaa näkyvien mallien järjestystä;
      - viedä mallin JSON-tiedostona; tai
      - poistaa mallin.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5d4cbc918551c211:
    english: Hiding a template keeps it for later use. Deleting a template does not delete discussions started from it.
    translation: Piilotettu malli säilyy myöhempää käyttöä varten. Mallin poistaminen ei poista sillä aloitettuja keskusteluja.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c0ae844752e20ef:
    english: "## Share templates between groups"
    translation: "## Jaa malleja ryhmien välillä"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  acf646688b9b79f4:
    english: Select **Export json** in a template's action menu to download it as a file. To use it in another group, select **New template**, then **Import json**. The form opens with the imported content so you can review it before saving.
    translation: Lataa malli tiedostona valitsemalla sen toimintovalikosta **Vie JSON-tiedosto**. Jos haluat käyttää sitä toisessa ryhmässä, valitse **Uusi malli** ja sitten **Tuo JSON-tiedosto**. Lomake avautuu tuodulla sisällöllä, jotta voit tarkistaa sen ennen tallentamista.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a168253bda3147e8:
    english: Links to custom poll templates are not included in the file. Export and import those poll templates separately.
    translation: Linkit mukautettuihin kyselypohjiin eivät sisälly tiedostoon. Vie ja tuo nämä kyselypohjat erikseen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4833d57d46ccb98e:
    english: "## Let members create templates"
    translation: "## Salli jäsenten luoda malleja"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1ac138e713feea59:
    english: By default, only group admins can create and edit templates. An admin can enable **Members can create templates** under **Group settings** → **Permissions**.
    translation: Oletusarvoisesti vain ryhmän ylläpitäjät voivat luoda ja muokata malleja. Ylläpitäjä voi ottaa asetuksen **Jäsenet voivat luoda malleja** käyttöön kohdassa **Ryhmäasetukset** → **Käyttöoikeudet**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  889e8792d7937424:
    english: When this is enabled, members can create discussion and poll templates and edit the templates they created. Admins can edit every template in the group. A member's template appears in the group's template list once it is saved, so agree on naming and review practices before enabling this permission.
    translation: Kun asetus on käytössä, jäsenet voivat luoda keskustelu- ja kyselypohjia sekä muokata itse luomiaan malleja. Ylläpitäjät voivat muokata kaikkia ryhmän malleja. Jäsenen tallentama malli näkyy ryhmän malliluettelossa, joten sopikaa nimeämis- ja tarkistuskäytännöistä ennen tämän oikeuden käyttöönottoa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1284dfc3e68170d8:
    english: "## Templates for non-members"
    translation: "## Mallit ryhmään kuulumattomille"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5c701c3795724027:
    english: If **Non-members can start discussions** is enabled, people outside the group choose from the same template list. Their discussion form never invites the group by default. See [Collect private submissions](/en/user_manual/discussions/private_submissions).
    translation: Jos **Muutkin kuin jäsenet voivat aloittaa keskusteluja** on käytössä, ryhmän ulkopuoliset voivat valita mallin samasta luettelosta. Heidän keskustelulomakkeensa ei koskaan kutsu ryhmää oletusarvoisesti. Katso [Kerää yksityisiä ehdotuksia](/en/user_manual/discussions/private_submissions).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
