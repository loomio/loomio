---
navigation_title: Loomio in deinem Vorstand einführen
blocks:
  2d7d9e9285159d4f:
    english: "# Introducing Loomio to your board"
    translation: "# Loomio in deinem Vorstand einführen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6a42b6e2aba774c1:
    english: Loomio can become the online place where your board or committee meet, discuss, decide and build an auditable record for your organization.
    translation: Loomio kann der Online-Ort sein, an dem sich dein Vorstand oder Ausschuss trifft, Themen bespricht und Entscheidungen trifft. So entsteht eine nachvollziehbare Dokumentation für deine Organisation.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1e26a40fe8b74f47:
    english: Start with the general sequence in [Introducing Loomio to your group](/en/user_manual/overview/introducing_loomio). This page adds considerations specific to boards and committees.
    translation: Beginne mit der allgemeinen Anleitung unter [Loomio in deiner Gruppe einführen](/en/user_manual/overview/introducing_loomio). Diese Seite ergänzt Hinweise für Vorstände und Ausschüsse.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2999c11b8e274b1b:
    english: However Loomio will be of little value if only some of your board participate.  Information and communication will likely remain scattered over multiple tools, lost in email inboxes and the confusion will waste everyone's time.
    translation: Wenn nur ein Teil des Vorstands mitmacht, bringt Loomio wenig. Informationen und Gespräche bleiben dann wahrscheinlich auf mehrere Werkzeuge und E-Mail-Postfächer verteilt. Die Unübersichtlichkeit kostet alle Zeit.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  28097dbe6dfd2fd7:
    english: 'Consider the problem you are trying to solve by using Loomio, say to improve and track communication or build institutional memory.  Then commit as a board to move your work into Loomio, and encourage everyone to make a genuine effort.  '
    translation: 'Überlege, welches Problem ihr mit Loomio lösen wollt: etwa die Kommunikation verbessern und nachvollziehbar machen oder Wissen für die Organisation bewahren. Vereinbart dann im Vorstand, eure Arbeit nach Loomio zu verlagern, und ermutige alle, sich ernsthaft darauf einzulassen.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  449e6d5c90588dd2:
    english: As administrator your primary objective is to set up Loomio effectively for your board.
    translation: Als Administrator ist es deine wichtigste Aufgabe, Loomio so einzurichten, dass dein Vorstand gut damit arbeiten kann.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '08969c9eca0d9855':
    english: 'Aim to encourage directors to join and participate. They should be able to:'
    translation: 'Ermutige die Vorstandsmitglieder, sich anzumelden und mitzumachen. Sie sollten Folgendes können:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  70bf0ec81830055e:
    english: |-
      - Sign in to Loomio
      - Read and comment on threads
      - Vote in polls
      - See how your governance practices work in Loomio
    translation: |-
      - Sich bei Loomio anmelden
      - Diskussionen lesen und kommentieren
      - An Abstimmungen teilnehmen
      - Verstehen, wie eure Entscheidungsprozesse in Loomio ablaufen
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d41ec118bb86c93f:
    english: "## Check technical proficiency "
    translation: "## Technische Kenntnisse prüfen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  728e1c8d201cacca:
    english: Board members will need a computer or smartphone connected to the internet. They must be capable of sending and receiving email, browsing the web, reading digital documents, viewing and hearing videos.
    translation: Vorstandsmitglieder brauchen einen Computer oder ein Smartphone mit Internetzugang. Sie müssen E-Mails senden und empfangen, im Web surfen, digitale Dokumente lesen sowie Videos ansehen und anhören können.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  de1b1186edaff7c6:
    english: 'Check that members have all of the following:'
    translation: 'Prüfe, ob die Mitglieder über Folgendes verfügen:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9932640dbf8944e3:
    english: |-
      - an up-to-date device—a computer, tablet or smart phone with email and a modern internet browser
      - internet service via WIFI, ethernet cable or mobile data plan (3G or above)
      - capability to send and receive email, browse the internet, download documents and play videos.
    translation: |-
      - ein aktuelles Gerät – einen Computer, ein Tablet oder ein Smartphone mit E-Mail-Zugang und einem modernen Webbrowser
      - eine Internetverbindung über WLAN, Ethernetkabel oder mobile Daten (3G oder schneller)
      - die Fähigkeit, E-Mails zu senden und zu empfangen, im Internet zu surfen, Dokumente herunterzuladen und Videos abzuspielen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4496ce2ee6172b32:
    english: Loomio works with all standard internet browsers such as Google Chrome, Microsoft Edge, Firefox and Apple Safari. Old out-of-date browsers such as Microsoft Internet Explorer may not work.
    translation: Loomio funktioniert mit gängigen Webbrowsern wie Google Chrome, Microsoft Edge, Firefox und Apple Safari. Veraltete Browser wie Microsoft Internet Explorer funktionieren möglicherweise nicht.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bd5dc5f2d0f56a28:
    english: If you have a problem using Loomio on your device, [Contact Loomio support](/contact).
    translation: Wenn du Loomio auf deinem Gerät nicht verwenden kannst, [kontaktiere den Loomio-Support](/contact).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ca7b25bb2d86ba90:
    english: "## Configure your group"
    translation: "## Deine Gruppe einrichten"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  92712f3a984128af:
    english: |-
      ### Group Description
      The group description is the first place people see when they arrive into your Loomio group. Write it to help new members  understand the purpose of the group and the work you will do together. Provide any other information that orients people and encourages them to participate.
    translation: |-
      ### Gruppenbeschreibung
      Die Gruppenbeschreibung ist das Erste, was Menschen sehen, wenn sie deine Loomio-Gruppe öffnen. Erkläre darin neuen Mitgliedern den Zweck der Gruppe und woran ihr gemeinsam arbeiten werdet. Ergänze weitere Informationen, die ihnen die Orientierung und Teilnahme erleichtern.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7e018e436df9afa1:
    english: 'For example, welcome people and let them know that this is there online space for communication and governance of your organization:'
    translation: 'Begrüße die Mitglieder zum Beispiel und erkläre ihnen, dass dies der Online-Raum für die Kommunikation und die Entscheidungsprozesse deiner Organisation ist:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  826a76aa71e6d689:
    english: |-
      - Remind members of the purpose of the board or committee.
      - Outline how you intend to use Loomio; prepare for meetings, progress discussions, make decisions and stay in context between meetings.
      - Be clear who has access to the group, can read and participate.
      - Attach or link any background or governance documents.
    translation: |-
      - Erinnere die Mitglieder an den Zweck des Vorstands oder Ausschusses.
      - Beschreibe, wie ihr Loomio nutzen wollt: um Sitzungen vorzubereiten, Diskussionen voranzubringen, Entscheidungen zu treffen und zwischen Sitzungen den Zusammenhang zu bewahren.
      - Erkläre, wer Zugang zur Gruppe hat, mitlesen und mitmachen kann.
      - Hänge Hintergrundinformationen und Dokumente zu euren Entscheidungsprozessen an oder verlinke sie.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  00c14924ec3f24cb:
    english: |-
      ### Check privacy and permission settings
      Loomio groups are **Secret** by default, which means only the people you specifically invite to the group know of its existence.
    translation: |-
      ### Datenschutz- und Berechtigungseinstellungen prüfen
      Loomio-Gruppen sind standardmäßig **Geheim**. Nur Personen, die du ausdrücklich in die Gruppe einlädst, wissen dann von ihrer Existenz.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9158ac7ea9b0db99:
    english: See [member permissions](/en/user_manual/groups/settings#permissions), and set to suit the proficiency of members in your group.  It may help to remove some permissions to avoid confusion as you are starting out. You can always restore permissions and everyone becomes more familiar with Loomio.
    translation: Sieh dir die [Berechtigungen für Mitglieder](/en/user_manual/groups/settings#permissions) an und passe sie an die Erfahrung der Mitglieder deiner Gruppe an. Am Anfang kann es helfen, einige Berechtigungen zu entfernen, damit die Bedienung übersichtlich bleibt. Du kannst sie wiederherstellen, sobald alle mit Loomio vertrauter sind.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6a139f43ad2871f8:
    english: |-
      ### Category tags
      Add [category tags](/en/user_manual/discussions/tags/) to suit your organization.  Setting these in advance will help everyone use tags and find the threads and info they are looking for.
    translation: |-
      ### Kategorie-Schlagwörter
      Füge [Kategorie-Schlagwörter](/en/user_manual/discussions/tags/) hinzu, die zu deiner Organisation passen. Wenn du sie vorab einrichtest, können alle Schlagwörter nutzen und gesuchte Diskussionen und Informationen leichter finden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7435f3589b1f26e3:
    english: |-
      ### Set up your personal profile
      Your [personal profile](/en/user_manual/users/user_profile) will help members of your group easily identify you, and have confidence that the messages they receive from you actually come from you.
    translation: |-
      ### Dein persönliches Profil einrichten
      Dein [persönliches Profil](/en/user_manual/users/user_profile) hilft den Mitgliedern deiner Gruppe, dich zu erkennen und Nachrichten von dir zuzuordnen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cf3684fe138b05fe:
    english: |-
      ### Manage group membership
      Make sure all the members of your board or committee have been [invited](/en/user_manual/groups/inviting_people/) to the group, and accepted their invitation.
    translation: |-
      ### Gruppenmitgliedschaft verwalten
      Stelle sicher, dass alle Mitglieder deines Vorstands oder Ausschusses in die Gruppe [eingeladen wurden](/en/user_manual/groups/inviting_people/) und ihre Einladung angenommen haben.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '029e18cb13c89e7b':
    english: "### Start with a board process"
    translation: "### Mit einem Vorstandsprozess beginnen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ba8a6193de9c928f:
    english: The general introduction guide explains how to help everyone comment and vote once. For a board, follow that practice with one recurring governance process, such as preparing an agenda, approving minutes, reviewing a report, or making a small out-of-session decision.
    translation: 'Die allgemeine Einführungsanleitung erklärt, wie du allen hilfst, einmal zu kommentieren und abzustimmen. Wende das danach auf einen wiederkehrenden Vorstandsprozess an: etwa eine Tagesordnung vorbereiten, ein Protokoll genehmigen, einen Bericht prüfen oder zwischen Sitzungen eine kleine Entscheidung treffen.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f7c156fde7984f49:
    english: Agree whether decisions made in Loomio take effect when their outcome is published or must be ratified at the next meeting. Record the agreed quorum, vote threshold, eligible voters, and ratification process in the group description or governance documents.
    translation: Vereinbart, ob Entscheidungen in Loomio mit der Veröffentlichung ihres Fazits wirksam werden oder bei der nächsten Sitzung bestätigt werden müssen. Haltet das vereinbarte Quorum, die erforderliche Stimmenzahl, die Stimmberechtigten und das Verfahren zur Bestätigung in der Gruppenbeschreibung oder euren Dokumenten zu Entscheidungsprozessen fest.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
