  828de256c39d112c:
    english: Loomio complements chat, shared documents, and task-management tools rather than replacing every kind of work.
    translation: Loomio complète les outils de messagerie instantanée, les documents partagés et les outils de gestion des tâches. Chaque outil répond à un besoin différent.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ad42655c9ef79337:
    english: |-
      | Work | Suggested tool |
      |---|---|
      | Quick questions, social conversation, and timely updates | Chat |
      | Collaborative editing of a living document | Shared document |
      | Assigning and tracking tasks | Project or task-management tool |
      | Important topic-based discussion, broad participation, decisions, and outcomes | Loomio |
    translation: |-
      | Activité | Outil suggéré |
      |---|---|
      | Questions rapides, conversations informelles et nouvelles à partager rapidement | Messagerie instantanée |
      | Rédaction collective d’un document régulièrement mis à jour | Document partagé |
      | Attribution et suivi des tâches | Outil de gestion de projet ou des tâches |
      | Discussions sur des sujets importants, participation de tous, décisions et conclusions | Loomio |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  40e853f5116f28eb:
    english: Put work in Loomio when people need time to consider a topic, when everyone affected should have a meaningful opportunity to participate, or when the group will need to find the discussion and decision later. Link to the relevant document or task from the Loomio discussion so its context remains easy to find.
    translation: Utilisez Loomio lorsque les personnes ont besoin de temps pour réfléchir à un sujet, lorsque toutes les personnes concernées doivent pouvoir participer, ou lorsque le groupe devra retrouver la discussion et la décision plus tard. Ajoutez un lien vers le document ou la tâche concernés dans la discussion Loomio pour que le contexte reste facile à retrouver.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
