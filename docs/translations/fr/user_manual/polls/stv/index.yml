---
navigation_title: Élections STV
blocks:
  85590745d00e23c1:
    english: "# STV Elections"
    translation: "# Élections STV"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  366f56443108e10f:
    english: "**Single Transferable Vote (STV)** is a proportional representation voting method for electing multiple winners from a field of candidates. It ensures that elected candidates proportionally represent the diversity of views among voters."
    translation: Le **vote unique transférable (STV)** est un mode de scrutin proportionnel qui permet d'élire plusieurs personnes parmi les candidats. Les personnes élues représentent ainsi la diversité des opinions des votants dans des proportions proches de leur soutien.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  61dee55b45038f56:
    english: "## When to use STV"
    translation: "## Quand utiliser le STV"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8311dca26cec6519:
    english: 'Use an STV Election when you need to:'
    translation: 'Utilisez une élection STV lorsque vous souhaitez :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1d4338734ec6e113:
    english: |-
      - Elect a **committee, board, or slate of delegates** from a pool of nominees
      - Ensure **proportional representation**, where minority factions can win seats proportional to their support
      - Run elections where voters rank candidates by preference
    translation: |-
      - Élire un **comité, un conseil d'administration ou une liste de délégués** parmi plusieurs personnes candidates
      - Assurer une **représentation proportionnelle**, afin que les groupes minoritaires obtiennent des sièges à la mesure de leur soutien
      - Organiser une élection où les votants classent les candidats par ordre de préférence
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e6e1ae026f65a715:
    english: |-
      >[!NOTE]
      >STV is **not** the same as Loomio's [Rank poll](/en/user_manual/polls/rank/), which is a simpler score-based ranking for choosing a single best option. STV handles multi-winner elections with vote transfers and elimination rounds.
    translation: |-
      >[!NOTE]
      >Le STV est différent du [sondage par classement](/en/user_manual/polls/rank/) de Loomio. Ce dernier utilise un classement par points pour choisir une seule option. Le STV permet d'élire plusieurs personnes grâce aux transferts de voix et aux tours d'élimination.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  62af8f95f18dbafe:
    english: "## Creating an STV Election"
    translation: "## Créer une élection STV"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  edf2f36e75c81665:
    english: When starting a poll, select **STV Election** as the poll type, then add the candidates as the poll options. You can customize the poll by setting the **number of seats**, the **counting method**, and the **quota type**.
    translation: Lorsque vous créez un sondage, choisissez **Élection STV** comme type de sondage, puis ajoutez les candidats comme options. Vous pouvez définir le **nombre de sièges**, la **méthode de décompte** et le **type de quota**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b40ddcfb8cdc44fd:
    english: In this example, Oatmilk Cooperative is electing three people to oversee its returnable packaging trial. The form explains the role, lists five candidates, and uses Scottish STV with the Droop quota.
    translation: Dans cet exemple, la coopérative Oatmilk élit trois personnes pour superviser son essai d'emballages consignés. Le formulaire décrit leur rôle, présente cinq candidats et utilise la méthode STV écossaise avec le quota de Droop.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a34592929349d06:
    english: "### Number of seats"
    translation: "### Nombre de sièges"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c09f5f51333612dc:
    english: How many winners should be elected. Must be less than the number of candidates.
    translation: Le nombre de personnes à élire. Il doit être inférieur au nombre de candidats.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ddceec01d910b152:
    english: "### Counting method"
    translation: "### Méthode de décompte"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  39e9e81a89272771:
    english: 'There are two available methods for counting the votes:'
    translation: 'Deux méthodes de décompte sont disponibles :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a7031d1180e95273:
    english: |-
      Scottish STV
        : Recommended. The Weighted Inclusive Gregory Method (WIGM) used in Scottish local elections since 2007. Well-defined, straightforward rules. Best for most organizations.
    translation: |-
      STV écossais
        : Recommandé. Cette méthode de Gregory inclusive pondérée (WIGM) est utilisée dans les élections locales écossaises depuis 2007. Ses règles sont claires et simples. Elle convient à la plupart des organisations.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1507e4fde88848dd:
    english: |-
      Meek STV
        : A more mathematically precise iterative method. When a candidate is eliminated, votes are recounted as if that candidate was never in the race.
    translation: |-
      STV de Meek
        : Une méthode itérative plus précise sur le plan mathématique. Lorsqu'un candidat est éliminé, les voix sont recomptées comme s'il n'avait jamais participé à l'élection.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b9abcd12eef5f629:
    english: "### Quota type"
    translation: "### Type de quota"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6dc3aea49266d40d:
    english: 'The quota is the minimum number of votes a candidate needs to win a seat. It can be either:'
    translation: 'Le quota est le nombre minimal de voix dont un candidat a besoin pour obtenir un siège. Vous pouvez choisir :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  88f62f286d8c550f:
    english: |-
      Droop
        : Recommended. The standard quota type for most STV elections, and used by Ireland, Australia, and Scotland. Droop guarantees a majority coalition wins a majority of seats. It is calculated as:
      \\[ floor(\frac{votes}{(seats + 1)}) + 1 \\]
    translation: |-
      Droop
        : Recommandé. C'est le quota habituel pour la plupart des élections STV. Il est utilisé en Irlande, en Australie et en Écosse. Il garantit qu'une coalition majoritaire obtient la majorité des sièges. Il se calcule ainsi :
      \\[ floor(\frac{votes}{(seats + 1)}) + 1 \\]
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  817b3994e92898e8:
    english: |-
      Hare
        : A higher minimum threshold, and more proportional for smaller factions.
          Hare is preferred by DSA chapters to protect minority representation.
         It is calculated as:
          \\[ \frac{votes}{seats}\\]
    translation: |-
      Hare
        : Un seuil minimal plus élevé, qui offre une représentation plus proportionnelle aux petits groupes.
          Les sections de DSA privilégient le quota de Hare pour protéger la représentation des minorités.
         Il se calcule ainsi :
          \\[ \frac{votes}{seats}\\]
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f12065bdf5d3678e:
    english: |2-
        >[!TIP]
        > Droop will always compute to a smaller number of votes than Hare. For example, in an election with 100 votes and four seats, the Droop quota would be 21 and the Hare quota 25.
    translation: |-
      >[!TIP]
        > Le quota de Droop correspond toujours à moins de voix que celui de Hare. Par exemple, pour une élection avec 100 voix et quatre sièges, le quota de Droop est de 21 voix et celui de Hare de 25 voix.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  984516abc3cfd89b:
    english: "## How voting works"
    translation: "## Comment voter"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  40e98247d87cdf27:
    english: 'In this example, Oatmilk Cooperative is electing three people to oversee the reusable packaging trial. Voters drag candidates above the line and rank them in order of preference:'
    translation: 'Dans cet exemple, la coopérative Oatmilk élit trois personnes pour superviser son essai d''emballages réutilisables. Les votants font glisser les candidats au-dessus de la ligne et les classent par ordre de préférence :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f8aaa5391f05117f:
    english: |-
      - **Rank 1** = most preferred candidate
      - **Rank 2** = second choice
      - Continue ranking as many candidates as desired
    translation: |-
      - **Rang 1** = candidat préféré
      - **Rang 2** = deuxième choix
      - Continuez à classer autant de candidats que vous le souhaitez
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  70bd790faf93c916:
    english: Voters are not required to rank every candidate. Unranked candidates will not receive any of that voter's support.
    translation: Les votants ne sont pas tenus de classer tous les candidats. Ceux qui ne sont pas classés ne recevront aucune de leurs voix.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d82e369c7c293a0c:
    english: |-
      ## How counting works
      The count is performed as follows:
    translation: |-
      ## Comment fonctionne le décompte
      Le décompte se déroule ainsi :
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0ea01b5d531abc06:
    english: |-
      1. A **quota** is calculated (minimum votes needed to win a seat).
      2. **First preferences** are counted for each candidate.
      3. If a candidate meets the quota, they are **elected**. Their surplus votes (above the quota) are **transferred** to voters' next preferences at a fractional value.
      4. If no candidate meets the quota, the candidate with the **fewest votes is eliminated**. Their votes transfer to voters' next preferences at full value.
      5. This process repeats until all seats are filled.
    translation: |-
      1. Un **quota** est calculé (le nombre minimal de voix nécessaires pour obtenir un siège).
      2. Les **Premières préférences** sont comptées pour chaque candidat.
      3. Si un candidat atteint le quota, il est **élu**. Ses voix excédentaires (au-delà du quota) sont **transférées** aux candidats suivants dans l’ordre de préférence des électeurs, à une valeur fractionnaire.
      4. Si aucun candidat n’atteint le quota, celui qui a **le moins de voix est éliminé**. Ses voix sont transférées aux candidats suivants dans l’ordre de préférence des électeurs, à leur pleine valeur.
      5. Le processus se répète jusqu’à ce que tous les sièges soient pourvus.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c6f397233ad479e5:
    english: |-
      >[!TIP]
      >If a voter has ranked no remaining candidates, their ballot is "exhausted" and that vote is lost. This is why ranking more candidates is generally better.
    translation: |-
      >[!TIP]
      >Si un votant n'a classé aucun des candidats encore en lice, son bulletin est « épuisé » et sa voix ne peut plus être comptée. Il est donc généralement préférable de classer davantage de candidats.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  acba228efb586cca:
    english: "## Understanding results"
    translation: "## Comprendre les résultats"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3b584c17ac358371:
    english: 'After the poll closes, results are displayed in several sections. In this election, Samira Patel, Alex Morgan, and Morgan Price fill the three committee seats:'
    translation: 'Après la clôture du sondage, les résultats apparaissent dans plusieurs sections. Dans cet exemple, Samira Patel, Alex Morgan et Morgan Price obtiennent les trois sièges du comité :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9c3f3c8a80729fbf:
    english: "### Method and quota"
    translation: "### Méthode et quota"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  feee79b9f6e92de3:
    english: At the top, you'll see the counting method (Scottish STV or Meek STV) and quota type (Droop or Hare) along with the quota — the number of votes a candidate needed to win a seat.
    translation: En haut de la page figurent la méthode de décompte (STV écossais ou STV de Meek), le type de quota (Droop ou Hare) et le quota lui-même, c'est-à-dire le nombre de voix nécessaire pour obtenir un siège.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e180eb800c3435cd:
    english: "### Elected candidates"
    translation: "### Candidats élus"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8db8b2466db56f2b:
    english: 'A summary table of the winners with five columns:'
    translation: 'Un tableau récapitule les personnes élues en cinq colonnes :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f998ffc721953501:
    english: |-
      | Column | Meaning |
      |--------|---------|
      | **Candidate** | The name of the elected candidate |
      | **Round elected** | Which counting round they reached the quota and won a seat. Round 1 means they won on first preferences alone; higher rounds mean they needed transferred votes from eliminated or surplus candidates. |
      | **First preferences** | How many voters ranked this candidate as their first choice. This shows a candidate's direct support before any vote transfers. |
      | **Final tally** | The candidate's vote tally at the moment they were elected. Due to vote transfers, this is often higher than their first preferences. |
      | **Surplus** | How much the candidate's final tally exceeded the quota (final tally minus quota). A larger surplus means stronger support beyond what was needed to win. In Scottish STV, this surplus is redistributed to voters' next preferences. |
    translation: |-
      | Colonne | Signification |
      |--------|---------|
      | **Candidat** | Le nom du candidat élu |
      | **Tour élu** | Le tour de décompte auquel le candidat a atteint le quota et obtenu un siège. Au premier tour, il a gagné grâce aux seules premières préférences. Aux tours suivants, il lui a fallu des voix transférées depuis des candidats éliminés ou élus avec un surplus. |
      | **Premières préférences** | Le nombre de votants qui ont placé ce candidat en premier. Ce chiffre indique son soutien direct avant tout transfert de voix. |
      | **Bilan final** | Le total des voix du candidat au moment de son élection. Les transferts de voix font souvent monter ce total au-dessus de ses premières préférences. |
      | **Surplus** | Le nombre de voix par lequel le bilan final du candidat dépasse le quota (bilan final moins quota). Plus le surplus est élevé, plus le soutien dépasse ce qui était nécessaire pour gagner. Avec la méthode STV écossaise, ce surplus est redistribué aux préférences suivantes des votants. |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  efc41c326d955758:
    english: If the count results in a tie — where eliminating any of the remaining candidates would change the outcome — those candidates are shown in a separate table rather than arbitrarily choosing a winner.
    translation: Si le décompte aboutit à une égalité dans laquelle l'élimination de l'un ou l'autre des candidats encore en lice changerait le résultat, ces candidats apparaissent dans un tableau distinct. Aucun gagnant n'est alors choisi arbitrairement.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8a6ae4ad28f0acf6:
    english: "### Round-by-round details"
    translation: "### Détails tour par tour"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3d907145fd075144:
    english: 'Expand **Round-by-round details** to see vote transfers and eliminations. Each row is a candidate and each column is a counting round:'
    translation: 'Développez **Détails tour par tour** pour voir les transferts de voix et les éliminations. Chaque ligne représente un candidat et chaque colonne un tour de décompte :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cc37217cd681fabe:
    english: The green highlight shows when a candidate was elected, red shows when they were eliminated, and orange shows when they tied.
    translation: Le vert indique le tour où un candidat a été élu, le rouge celui où il a été éliminé et l'orange celui où il est arrivé à égalité.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ed4aaa0a898906fd:
    english: "## Exporting ballots"
    translation: "## Exporter les bulletins"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c96d54ebfbedae32:
    english: After the election closes, people who can view the results can export the ballots in BLT format for an independent recount or audit. The export contains candidate rankings and combines identical rankings into a single row with a ballot count. For anonymous elections it does not contain voter identities, ballot identifiers, submission times, or submission order.
    translation: Après la clôture de l'élection, les personnes autorisées à voir les résultats peuvent exporter les bulletins au format BLT pour effectuer un recomptage ou un audit indépendant. L'export contient les classements des candidats et regroupe les classements identiques sur une seule ligne, avec le nombre de bulletins correspondant. Pour les élections anonymes, il ne contient ni l'identité des votants, ni les identifiants des bulletins, ni les heures ou l'ordre de soumission.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
