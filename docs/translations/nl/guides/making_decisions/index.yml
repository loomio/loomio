  b27fab33a1dd5176:
    english: 'These guides explain complete decision processes: how to frame a decision, involve the right people, use discussion and proposals, respond to concerns, and record an outcome.'
    translation: 'Deze handleidingen beschrijven volledige besluitvormingsprocessen: hoe je een beslissing afbakent, de juiste mensen betrekt, discussies en voorstellen gebruikt, op zorgen reageert en een conclusie vastlegt.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bcbe5e3fd75700a6:
    english: They are different from the proposal-template pages. A [proposal template](/en/user_manual/polls/proposals/) explains one proposal and its response options. A decision process can use several proposals over time.
    translation: Ze verschillen van de pagina's over voorstelsjablonen. Een [voorstelsjabloon](/en/user_manual/polls/proposals/) beschrijft één voorstel en de mogelijke reacties daarop. In een besluitvormingsproces kun je na verloop van tijd meerdere voorstellen gebruiken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  af00d65d38e41f8b:
    english: "## Choose a process"
    translation: "## Kies een proces"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f41e345421a1a1e8:
    english: |-
      | Process | Who decides? | Main question |
      |---|---|---|
      | [Simple decision process](simple_decision_process) | Defined by the group | How can we discuss, test, and decide? |
      | [Advice process](advice_process) | A person or delegated team | What advice should the decision maker consider? |
      | [Consent process](consent_process) | The group | Is the proposal safe to try without a meaningful objection? |
      | [Consensus process](consensus_process) | The group | Can we reach collective agreement? |
    translation: |-
      | Proces | Wie beslist? | Belangrijkste vraag |
      |---|---|---|
      | [Eenvoudig besluitvormingsproces](simple_decision_process) | Bepaald door de groep | Hoe kunnen we overleggen, een voorstel toetsen en beslissen? |
      | [Adviesproces](advice_process) | Eén persoon of een team met een mandaat | Welk advies moet degene die beslist meewegen? |
      | [Consentproces](consent_process) | De groep | Kunnen we het voorstel proberen zonder dat er een zwaarwegend bezwaar is? |
      | [Consensusproces](consensus_process) | De groep | Kunnen we samen tot overeenstemming komen? |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d2843889568043c0:
    english: Use the process required by your group's governing rules or decision policy. Different kinds of decisions may use different processes.
    translation: Gebruik het proces dat de regels of het besluitvormingsbeleid van jouw groep voorschrijven. Voor verschillende soorten beslissingen kun je verschillende processen gebruiken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bb120914edd79d13:
    english: If you only need help choosing a response format, compare [Proposals](/en/user_manual/polls/proposals/) and [Polls](/en/user_manual/polls/proposal_types/). If you administer the reusable choices shown when someone selects **Start a vote**, see [Poll templates](/en/user_manual/polls/poll_templates/).
    translation: Wil je alleen hulp bij het kiezen van een manier om te reageren? Vergelijk dan [Voorstellen](/en/user_manual/polls/proposals/) en [Peilingen](/en/user_manual/polls/proposal_types/). Beheer je de herbruikbare opties die verschijnen wanneer iemand **Start een stemming** selecteert? Bekijk dan [Peilingsjablonen](/en/user_manual/polls/poll_templates/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
