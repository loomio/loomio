  aa1feddec315ed04:
    english: Seek advice on a decision you need to make.
    translation: כדאי לבקש עצה לפני קבלת החלטה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  abd59b5e28c00123:
    english: Make a decision with the advice of people impacted or who have expertise, so you can make a better decision for your organization.
    translation: כדי לקבל החלטה טובה יותר עבור הארגון, יש להיעזר בעצות של אנשים שההחלטה תשפיע עליהם ושל בעלי מומחיות בנושא.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fce0c96bcc92d0aa:
    english: "> *“With the advice process, any person can make any decision but must seek advice from affected parties and people with expertise.” - Frederick Laloux, Reinventing Organizations.*"
    translation: "> *״בתהליך הייעוץ, כל אדם יכול לקבל כל החלטה, אך עליו לבקש עצה ממי שההחלטה תשפיע עליהם ומבעלי מומחיות.״ - פרדריק לאלו, Reinventing Organizations.*"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  66f32f2b3cf56e0d:
    english: |-
      ## Key points
      - Freedom to make a decision.
      - Invite people to offer their advice.
      - Take into account other people’s voices.
    translation: |-
      ## עיקרי הדברים
      - חופש לקבל החלטה.
      - הזמנת אנשים לתת עצות.
      - התחשבות בדעות של אחרים.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  54d4f1ac3c2bd91f:
    english: |-
      ## Steps in the Advice process
      You notice a problem or opportunity and take the initiative.
      1. Frame the decision, identify who owns it, and invite the affected people and relevant experts.
      2. Start a Loomio **discussion** and, when a structured response or deadline is useful, run an **Advice proposal**.
      3. Clarify and build on the advice through vote reasons and discussion comments.
      4. Make the decision, then publish an **outcome** explaining what was decided and how the advice informed it.
    translation: |-
      ## שלבי תהליך הייעוץ
      כשמזהים בעיה או הזדמנות, ניתן ליזום פעולה.
      1. יש להגדיר את ההחלטה, לזהות מי אחראי לה ולהזמין את מי שהיא תשפיע עליהם ובעלי מומחיות רלוונטית.
      2. יש לפתוח **דיון** בלומיו, וכאשר מועילים מענה מובנה או מועד סיום, לפתוח **הצעת ייעוץ**.
      3. יש להבהיר את העצות ולפתח אותן באמצעות נימוקי ההצבעה והתגובות בדיון.
      4. יש לקבל החלטה, ואז לפרסם **מסקנה** שמסבירה מה הוחלט וכיצד העצות השפיעו על ההחלטה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6088bbd1e12e8920:
    english: "## Benefits\n- Advice helps you make a better decision for your organization. \n- Foster relationships, learning opportunities and diverse input.\n- Stimulate initiative and creativity, and more enjoyable work."
    translation: "## יתרונות\n- ייעוץ מסייע לקבל החלטה טובה יותר עבור הארגון. \n- התהליך מחזק קשרים, יוצר הזדמנויות ללמידה ומביא מגוון נקודות מבט.\n- התהליך מעודד יוזמה ויצירתיות ויכול להפוך את העבודה למהנה יותר."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0b6fc6b802feebda:
    english: "## Applying the Advice process on Loomio"
    translation: "## יישום תהליך הייעוץ בלומיו"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a0a3c706db8ca405:
    english: "| **Advice process** | **On Loomio** |\n|---|---|\n| You notice a problem or opportunity and take the initiative. |  |\n| Seek input to sound out perspectives before proposing action. | Start a Loomio **discussion** to provide context and open conversation. Run an **[Advice proposal](/en/user_manual/polls/proposals/advice/)** when you want a defined response period, vote reasons, and a clear record of who participated. |\n| Taking advice received into account, you make a decision and inform the people who have given advice. | Add an an **outcome** to the discussion thread.   <br /><br />State the decision made and thank people for their advice and feedback.  <br /><br />   Say what will happen next and notify people about the outcome.  <br /><br />The outcome statement is an important record of the decision for future reference. <br /> <br /> Either update the context to include this outcome, or state it in a comment you pin to the timeline to quickly find it in the future.<br /><br/> |        "
    translation: |-
      | **תהליך ייעוץ** | **בלומיו** |
      |---|---|
      | מזהים בעיה או הזדמנות ויוזמים פעולה. |  |
      | מבקשים דעות כדי להבין נקודות מבט לפני שמציעים פעולה. | יש לפתוח **דיון** בלומיו כדי לספק רקע ולפתוח בשיחה. אפשר לפתוח **[הצעת ייעוץ](/en/user_manual/polls/proposals/advice/)** כשרוצים להגדיר תקופת מענה, לקבל נימוקים להצבעות ולתעד בבירור מי השתתף. |
      | מתחשבים בעצות שהתקבלו, מקבלים החלטה ומעדכנים את מי שנתנו עצות. | יש להוסיף **מסקנה** לשרשור הדיון.   <br /><br />יש לציין מה הוחלט ולהודות למי שנתנו עצות ומשוב.  <br /><br />   יש להסביר מה יקרה בהמשך ולהודיע לאנשים על המסקנה.  <br /><br />המסקנה מתעדת את ההחלטה לעיון בעתיד. <br /> <br /> אפשר לעדכן את הרקע כך שיכלול את המסקנה, או לציין אותה בתגובה שמצמידים לציר הזמן כדי שיהיה קל למצוא אותה בעתיד.<br /><br/> |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f303a5de08c09a87:
    english: "## Example of an Advice process on Loomio"
    translation: "## דוגמה לתהליך ייעוץ בלומיו"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  12055e74d3733a99:
    english: "### Step 0 - You notice a problem or opportunity and take the initiative."
    translation: "### שלב 0 - מזהים בעיה או הזדמנות ויוזמים פעולה."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  77f49576383e36ca:
    english: Is the problem or opportunity is worth pursuing?  Takashi is experiencing problems with his old computer, and it crashed during a recent presentation.
    translation: האם כדאי לטפל בבעיה או לנצל את ההזדמנות?  למחשב הישן של טקאשי יש תקלות, והוא קרס במהלך מצגת שהעביר לאחרונה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  997d519afbb87519:
    english: Is there a decision to be made?  It's time to replace the computer.
    translation: האם יש החלטה שצריך לקבל?  הגיע הזמן להחליף את המחשב.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fea51a2c49fc3f27:
    english: Does it impact other people and your organization?  Takashi's colleagues want him to perform his role effectively, not waste time in meetings, and so appreciate he needs a working computer.  Purchase of a piece of equipment also impacts on the organization budget, purchasing policies and may need to be aligned with other team members.
    translation: האם ההחלטה תשפיע על אנשים אחרים ועל הארגון?  עמיתיו של טקאשי רוצים שיוכל למלא את תפקידו ביעילות ולא לבזבז זמן בפגישות. לכן הם מבינים שהוא זקוק למחשב תקין.  רכישת ציוד משפיעה גם על תקציב הארגון ועל מדיניות הרכש, וייתכן שצריך לתאם אותה עם חברי צוות אחרים.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  93da70b78b1d57ff:
    english: "### Step 1. Seek input to sound out perspectives before proposing action"
    translation: "### שלב 1. מבקשים דעות כדי להבין נקודות מבט לפני שמציעים פעולה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  105886bcb6f7807b:
    english: Takashi starts a Loomio discussion with a clear statement of the decision he needs to make.  He provides some context to open a discussion, that he is starting an advice process.
    translation: טקאשי פותח דיון בלומיו ומציג בבירור את ההחלטה שעליו לקבל.  הוא מספק רקע לפתיחת השיחה ומציין שהוא מתחיל תהליך ייעוץ.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5dbbbc9ad1569679:
    english: He can also run an [Advice proposal](/en/user_manual/polls/proposals/advice/) in the discussion to request structured responses by a closing date.
    translation: הוא יכול גם לפתוח [הצעת ייעוץ](/en/user_manual/polls/proposals/advice/) בדיון כדי לבקש תשובות מובנות עד למועד הסיום.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1c0ef4c1e9221705:
    english: "### Step 2.  Clarify and strengthen the advice through discussion"
    translation: "### שלב 2.  מבהירים ומחזקים את העצות באמצעות דיון"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ed50411e67d1df0a:
    english: Takashi replies to advice given in comments in the discussion thread, clarifying his situation and asking questions to expand on the advice given.
    translation: טקאשי משיב לעצות שניתנו בתגובות בשרשור הדיון, מבהיר את מצבו ושואל שאלות כדי להרחיב את העצות שקיבל.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b27279b9ea3b1f0a:
    english: As people offer advice and comments, Takashi grows resolved in his decision.
    translation: ככל שמתקבלות עצות ותגובות, טקאשי נעשה בטוח יותר בהחלטתו.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f3a820171554b2c9:
    english: "### Step 3. Make a decision with advice and inform people"
    translation: "### שלב 3. מקבלים החלטה בעזרת העצות ומעדכנים את האנשים"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8a0d4bfcbc87c5bb:
    english: When everyone has offered advice, or the proposal closes, Takashi makes a decision and states the **[outcome](/en/user_manual/polls/outcomes/)**.
    translation: לאחר שכולם נתנו עצה, או כשההצעה נסגרת, טקאשי מקבל החלטה ומפרסם את **[המסקנה](/en/user_manual/polls/outcomes/)**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e638fad69da59644:
    english: The outcome is a clear statement of the decision made and what will happen next. It  becomes an important record for the organization.
    translation: המסקנה מציגה בבירור את ההחלטה שהתקבלה ואת הצעדים הבאים. היא משמשת תיעוד חשוב עבור הארגון.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  05eae3956cc1a84d:
    english: Takashi edits the discussion context to include this outcome.
    translation: טקאשי עורך את הרקע לדיון כדי לכלול בו את המסקנה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5289a72f0eed9bd9:
    english: Alternatively, he could state it in a comment that he pins to the thread, so the outcome appears prominently in the discussion timeline.
    translation: אפשר גם לפרסם את המסקנה בתגובה ולהצמיד אותה לשרשור, כך שתופיע במקום בולט בציר הזמן של הדיון.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
