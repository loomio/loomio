  a37f91309a44b472:
    english: Delete removes the user and records the user created. Comments are removed from threads, votes are removed from polls, and groups, discussions, polls, and other records created by the user may also be deleted through database associations.
    translation: מחיקה מסירה את המשתמש ואת הרשומות שיצר. תגובות מוסרות משרשורים והצבעות מוסרות מסקרים. קשרים בין רשומות במסד הנתונים עשויים לגרום למחיקה גם של קבוצות, דיונים, סקרים ורשומות אחרות שיצר המשתמש.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  537bd891e445eb93:
    english: This is very destructive. Redaction is highly recommended instead.
    translation: פעולה זו מוחקת מידע רב. מומלץ מאוד להסיר פרטים מזהים במקום זאת.
    status: machine
