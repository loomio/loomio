---
navigation_title: A Loomio bevezetése az igazgatóságodban
blocks:
  2d7d9e9285159d4f:
    english: "# Introducing Loomio to your board"
    translation: "# A Loomio bevezetése az igazgatóságodban"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6a42b6e2aba774c1:
    english: Loomio can become the online place where your board or committee meet, discuss, decide and build an auditable record for your organization.
    translation: A Loomio online teret adhat az igazgatóságodnak vagy bizottságodnak a találkozókhoz, a megbeszélésekhez és a döntésekhez. A szervezet munkájáról visszakövethető dokumentáció is készülhet benne.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1e26a40fe8b74f47:
    english: Start with the general sequence in [Introducing Loomio to your group](/en/user_manual/overview/introducing_loomio). This page adds considerations specific to boards and committees.
    translation: Kezdd az [Így vezesd be a Loomiót a csoportodban](/en/user_manual/overview/introducing_loomio) című útmutató általános lépéseivel. Ez az oldal az igazgatóságokra és bizottságokra vonatkozó szempontokat egészíti ki.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2999c11b8e274b1b:
    english: However Loomio will be of little value if only some of your board participate.  Information and communication will likely remain scattered over multiple tools, lost in email inboxes and the confusion will waste everyone's time.
    translation: Ha az igazgatóságnak csak néhány tagja vesz részt, a Loomio kevés hasznot hoz. Az információk és a beszélgetések valószínűleg továbbra is több eszköz között szóródnak szét, elvesznek az e-mail-fiókokban, a zavar pedig mindenki idejét veszi el.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  28097dbe6dfd2fd7:
    english: 'Consider the problem you are trying to solve by using Loomio, say to improve and track communication or build institutional memory.  Then commit as a board to move your work into Loomio, and encourage everyone to make a genuine effort.  '
    translation: 'Gondold át, milyen problémát szeretnétek megoldani a Loomióval: például javítani és követni a kommunikációt, vagy megőrizni a szervezeti tudást.  Ezután az igazgatóság közösen kötelezze el magát amellett, hogy a munkáját áthelyezi a Loomióba, és ösztönözz mindenkit az érdemi részvételre.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  449e6d5c90588dd2:
    english: As administrator your primary objective is to set up Loomio effectively for your board.
    translation: Adminisztrátorként az a fő feladatod, hogy az igazgatóság igényeihez igazítva állítsd be a Loomiót.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '08969c9eca0d9855':
    english: 'Aim to encourage directors to join and participate. They should be able to:'
    translation: 'Ösztönözd az igazgatóság tagjait, hogy csatlakozzanak és részt vegyenek a munkában. Legyenek képesek:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  70bf0ec81830055e:
    english: |-
      - Sign in to Loomio
      - Read and comment on threads
      - Vote in polls
      - See how your governance practices work in Loomio
    translation: |-
      - Bejelentkezni a Loomióba
      - Elolvasni a szálakat és hozzászólni
      - Szavazni a szavazásokon
      - Átlátni, hogyan működnek az igazgatóság döntéshozatali eljárásai a Loomióban
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d41ec118bb86c93f:
    english: "## Check technical proficiency "
    translation: "## Ellenőrizd a technikai felkészültséget"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  728e1c8d201cacca:
    english: Board members will need a computer or smartphone connected to the internet. They must be capable of sending and receiving email, browsing the web, reading digital documents, viewing and hearing videos.
    translation: Az igazgatóság tagjainak internetkapcsolattal rendelkező számítógépre vagy okostelefonra lesz szükségük. Tudniuk kell e-mailt küldeni és fogadni, böngészni az interneten, digitális dokumentumokat olvasni, valamint videókat nézni és hallgatni.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  de1b1186edaff7c6:
    english: 'Check that members have all of the following:'
    translation: 'Ellenőrizd, hogy minden tagnak rendelkezésére állnak-e a következők:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9932640dbf8944e3:
    english: |-
      - an up-to-date device—a computer, tablet or smart phone with email and a modern internet browser
      - internet service via WIFI, ethernet cable or mobile data plan (3G or above)
      - capability to send and receive email, browse the internet, download documents and play videos.
    translation: |-
      - korszerű eszköz: számítógép, táblagép vagy okostelefon e-mail-hozzáféréssel és modern böngészővel
      - internetkapcsolat Wi-Fi-n, Ethernet-kábelen vagy mobiladat-kapcsolaton keresztül (3G vagy gyorsabb)
      - az e-mail-küldés és -fogadás, az internetes böngészés, a dokumentumok letöltése és a videók lejátszása.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4496ce2ee6172b32:
    english: Loomio works with all standard internet browsers such as Google Chrome, Microsoft Edge, Firefox and Apple Safari. Old out-of-date browsers such as Microsoft Internet Explorer may not work.
    translation: A Loomio minden elterjedt böngészővel működik, például a Google Chrome-mal, a Microsoft Edge-dzsel, a Firefoxszal és az Apple Safarival. A régi, elavult böngészők, például a Microsoft Internet Explorer, nem feltétlenül működnek.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bd5dc5f2d0f56a28:
    english: If you have a problem using Loomio on your device, [Contact Loomio support](/contact).
    translation: Ha gondod van a Loomio használatával az eszközödön, [fordulj a Loomio ügyfélszolgálatához](/contact).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ca7b25bb2d86ba90:
    english: "## Configure your group"
    translation: "## Állítsd be a csoportodat"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  92712f3a984128af:
    english: |-
      ### Group Description
      The group description is the first place people see when they arrive into your Loomio group. Write it to help new members  understand the purpose of the group and the work you will do together. Provide any other information that orients people and encourages them to participate.
    translation: |-
      ### A csoport leírása
      A csoport leírása az első, amit az emberek látnak, amikor megérkeznek a Loomio-csoportodba. Írd le benne a csoport célját és a közös munkát, hogy az új tagok könnyen eligazodjanak. Adj meg minden további információt, amely segíti a tájékozódást és a részvételt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7e018e436df9afa1:
    english: 'For example, welcome people and let them know that this is there online space for communication and governance of your organization:'
    translation: 'Például köszöntsd a tagokat, és írd le, hogy ez a szervezet kommunikációjának és irányításának online tere:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  826a76aa71e6d689:
    english: |-
      - Remind members of the purpose of the board or committee.
      - Outline how you intend to use Loomio; prepare for meetings, progress discussions, make decisions and stay in context between meetings.
      - Be clear who has access to the group, can read and participate.
      - Attach or link any background or governance documents.
    translation: |-
      - Emlékeztesd a tagokat az igazgatóság vagy bizottság céljára.
      - Vázold fel, hogyan használjátok majd a Loomiót: az ülések előkészítésére, a megbeszélések folytatására, a döntéshozatalra és az ülések közötti munka követésére.
      - Tedd egyértelművé, ki fér hozzá a csoporthoz, ki olvashatja a tartalmát, és ki vehet részt benne.
      - Csatold vagy linkeld a háttéranyagokat és a szervezet irányításával kapcsolatos dokumentumokat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  00c14924ec3f24cb:
    english: |-
      ### Check privacy and permission settings
      Loomio groups are **Secret** by default, which means only the people you specifically invite to the group know of its existence.
    translation: |-
      ### Ellenőrizd az adatvédelmi és jogosultsági beállításokat
      A Loomio-csoportok alapértelmezés szerint **Titkos** beállításúak. Ez azt jelenti, hogy csak azok tudnak a csoport létezéséről, akiket kifejezetten meghívsz.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9158ac7ea9b0db99:
    english: See [member permissions](/en/user_manual/groups/settings#permissions), and set to suit the proficiency of members in your group.  It may help to remove some permissions to avoid confusion as you are starting out. You can always restore permissions and everyone becomes more familiar with Loomio.
    translation: Nézd át a [tagok jogosultságait](/en/user_manual/groups/settings#permissions), és igazítsd őket a csoport tagjainak tapasztalatához.  Kezdetben segíthet, ha néhány jogosultságot kikapcsolsz, hogy egyszerűbb legyen az indulás. Később bármikor visszaállíthatod őket, amikor mindenki jobban megismerte a Loomiót.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6a139f43ad2871f8:
    english: |-
      ### Category tags
      Add [category tags](/en/user_manual/discussions/tags/) to suit your organization.  Setting these in advance will help everyone use tags and find the threads and info they are looking for.
    translation: |-
      ### Kategóriacímkék
      Adj hozzá a szervezetedhez illő [kategóriacímkéket](/en/user_manual/discussions/tags/).  Ha előre beállítod őket, mindenki könnyebben használhatja a címkéket, és megtalálhatja a keresett szálakat és információkat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7435f3589b1f26e3:
    english: |-
      ### Set up your personal profile
      Your [personal profile](/en/user_manual/users/user_profile) will help members of your group easily identify you, and have confidence that the messages they receive from you actually come from you.
    translation: |-
      ### Állítsd be a személyes profilodat
      A [személyes profilod](/en/user_manual/users/user_profile) segít a csoport tagjainak felismerni téged, és megbizonyosodni arról, hogy a tőled kapott üzenetek valóban tőled származnak.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cf3684fe138b05fe:
    english: |-
      ### Manage group membership
      Make sure all the members of your board or committee have been [invited](/en/user_manual/groups/inviting_people/) to the group, and accepted their invitation.
    translation: |-
      ### Kezeld a csoport tagságát
      Ellenőrizd, hogy az igazgatóság vagy bizottság minden tagját [meghívtad](/en/user_manual/groups/inviting_people/) a csoportba, és mindenki elfogadta a meghívását.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '029e18cb13c89e7b':
    english: "### Start with a board process"
    translation: "### Kezdj egy igazgatósági folyamattal"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ba8a6193de9c928f:
    english: The general introduction guide explains how to help everyone comment and vote once. For a board, follow that practice with one recurring governance process, such as preparing an agenda, approving minutes, reviewing a report, or making a small out-of-session decision.
    translation: Az általános bevezető útmutató bemutatja, hogyan segíthetsz mindenkinek legalább egyszer hozzászólni és szavazni. Az igazgatóságban ezután próbáljatok ki egy rendszeresen visszatérő eljárást, például a napirend előkészítését, a jegyzőkönyv jóváhagyását, egy jelentés áttekintését vagy egy kisebb döntés meghozatalát két ülés között.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f7c156fde7984f49:
    english: Agree whether decisions made in Loomio take effect when their outcome is published or must be ratified at the next meeting. Record the agreed quorum, vote threshold, eligible voters, and ratification process in the group description or governance documents.
    translation: Állapodjatok meg arról, hogy a Loomióban hozott döntések a következtetés közzétételekor lépnek-e hatályba, vagy a következő ülésen kell jóváhagyni őket. Rögzítsétek a megállapított határozatképességi feltételt, a szükséges szavazati arányt, a szavazásra jogosultak körét és az utólagos jóváhagyás menetét a csoport leírásában vagy az irányítási dokumentumokban.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
