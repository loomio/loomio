  b27fab33a1dd5176:
    english: 'These guides explain complete decision processes: how to frame a decision, involve the right people, use discussion and proposals, respond to concerns, and record an outcome.'
    translation: 'В этих руководствах описаны процессы принятия решений целиком: как сформулировать вопрос, привлечь нужных людей, обсудить предложения, ответить на замечания и зафиксировать итог.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bcbe5e3fd75700a6:
    english: They are different from the proposal-template pages. A [proposal template](/en/user_manual/polls/proposals/) explains one proposal and its response options. A decision process can use several proposals over time.
    translation: Эти руководства отличаются от страниц о шаблонах предложений. [Шаблон предложения](/en/user_manual/polls/proposals/) описывает одно предложение и варианты ответа на него. В ходе принятия решения можно последовательно рассмотреть несколько предложений.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  af00d65d38e41f8b:
    english: "## Choose a process"
    translation: "## Выберите процесс"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f41e345421a1a1e8:
    english: |-
      | Process | Who decides? | Main question |
      |---|---|---|
      | [Simple decision process](simple_decision_process) | Defined by the group | How can we discuss, test, and decide? |
      | [Advice process](advice_process) | A person or delegated team | What advice should the decision maker consider? |
      | [Consent process](consent_process) | The group | Is the proposal safe to try without a meaningful objection? |
      | [Consensus process](consensus_process) | The group | Can we reach collective agreement? |
    translation: |-
      | Процесс | Кто принимает решение? | Главный вопрос |
      |---|---|---|
      | [Простой процесс принятия решения](simple_decision_process) | Определяет группа | Как обсудить вопрос, проверить варианты и принять решение? |
      | [Процесс с учётом советов](advice_process) | Один человек или уполномоченная команда | Какие советы следует учесть при принятии решения? |
      | [Процесс согласия](consent_process) | Группа | Можно ли попробовать предложение без существенных возражений? |
      | [Процесс консенсуса](consensus_process) | Группа | Можем ли мы прийти к общему согласию? |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d2843889568043c0:
    english: Use the process required by your group's governing rules or decision policy. Different kinds of decisions may use different processes.
    translation: Используйте процесс, предусмотренный правилами вашей группы или её порядком принятия решений. Для разных видов решений могут подходить разные процессы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bb120914edd79d13:
    english: If you only need help choosing a response format, compare [Proposals](/en/user_manual/polls/proposals/) and [Polls](/en/user_manual/polls/proposal_types/). If you administer the reusable choices shown when someone selects **Start a vote**, see [Poll templates](/en/user_manual/polls/poll_templates/).
    translation: Если вам нужно только выбрать формат ответов, сравните [Предложения](/en/user_manual/polls/proposals/) и [Опросы](/en/user_manual/polls/proposal_types/). Если вы управляете шаблонами, доступными при выборе **Начать голосование**, см. [Шаблоны опросов](/en/user_manual/polls/poll_templates/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
