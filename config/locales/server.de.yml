  poll_templates:
    practice_proposal:
      title: Ich fange an, den Dreh rauszukriegen
      process_name: Praxisvorschlag
      process_subtitle: Erfahre, wie Vorschläge auf Loomio funktionieren, indem du einen ausprobierst.
      process_introduction: "<p>Nutze diese Vorlage, um deiner Gruppe den Umgang mit Vorschlägen auf Loomio zu erleichtern. So können alle Teilnehmer sicher und einfach das Abstimmen ausprobieren und sehen, wie alles zusammenpasst.</p>"
      details: "<p>Dies ist ein Probelauf, damit sich jeder mit der Funktionsweise von Vorschlägen auf Loomio vertraut machen kann.</p><p> Bitte stimme ab und hinterlasse, wenn du möchtest, eine Begründung.</p><p> Kein Druck, keine realen Konsequenzen. Es ist nur eine Möglichkeit, herauszufinden, wie Vorschläge funktionieren!</p>"
      outcome_statement: "<p>Danke für die Teilnahme an diesem Übungsvorschlag! \U0001F389</p><p> Dies war nur eine Gelegenheit, zu sehen, wie das Abstimmen und Kommentieren auf Loomio funktioniert. Es wird hier keine wirkliche Entscheidung getroffen – aber hoffentlich hat dies allen geholfen, sich mit dem Prozess vertraut zu machen.</p>"
      title_v2: Ananas gehört auf Pizza
      process_subtitle_v2: Probiere einen Vorschlag aus, damit du weißt, wie Abstimmungen funktionieren.
      process_introduction_v2: "<p>Eine spielerische Möglichkeit für eure Gruppe, das Abstimmen auf Loomio auszuprobieren. Wählt eine lockere Frage, lasst die Leute abstimmen und eine Begründung hinterlassen – keine wirkliche Entscheidung, nur Übung.</p>"
      details_v2: "<p>Dies ist ein Übungsvorschlag – hier wird keine wirkliche Entscheidung getroffen.</p><p> Probiere es aus, abzustimmen und einen Grund anzugeben, um zu sehen, wie Vorschläge auf Loomio funktionieren.</p>"
      outcome_statement_v2: "<p>Danke, dass du einen Vorschlag ausprobiert hast! Jetzt weißt du, wie das Abstimmen auf Loomio funktioniert.</p>"
      agree_meaning: Ich stimme dem zu.
      agree_prompt: Warum stimmst du zu?
      abstain_meaning: Ich habe dazu keine Meinung.
      abstain_prompt: Irgendwelche Gedanken dazu?
      disagree_meaning: Ich stimme dem nicht zu.
      disagree_prompt: Warum bist du anderer Meinung?
    proposal:
      process_subtitle: Einen Vorschlag zur Entscheidungsfindung machen
      process_introduction: <p>Der klassische Loomio-Vorschlag hilft dir, eine Entscheidung zu treffen und eine Diskussion zu einem klaren Fazit zu führen.</p><p>Schlage eine Vorgehensweise vor und lade Menschen ein, mit „Zustimmung“, „Enthaltung“ oder „Widerspruch“ abzustimmen.</p><p>Beim Abstimmen können sie eine Begründung für ihre Stimme angeben. Du kannst sehen, welche Position die anderen zu diesem Thema einnehmen und warum.</p><p>Auf diese Weise kannst du mithilfe eines Vorschlags die Leute zu einer Antwort auffordern, neue Informationen ans Licht bringen und ein gemeinsames Verständnis aufbauen – um deiner Gruppe zu helfen, eine bessere und fundiertere Entscheidung zu treffen.</p><p>Ein Vorschlag und die damit verbundene Diskussion stellen eine eigene Aufzeichnung darüber dar, wie die Entscheidung zustande kam.</p><p><a target="_blank" href="/docs/en/guides/making_decisions/simple_decision_process"><u>Lies mehr über die Verwendung des klassischen Loomio-Vorschlags im einfachen Entscheidungsprozess</u></a>.</p>
      title: Genehmige das neue Markenkonzept
      details: <h3 id="what-is-the-decision-you-need-to-make"><strong>Welche Entscheidung musst du treffen?</strong></h3><p></p><h3 id="why-is-this-important"> <strong>Warum ist das wichtig?</strong></h3><p></p><h3 id="what-are-you-asking-people-to-do"> <strong>Was verlangst du von den Leuten?</strong></h3><p></p><p> Damit dieser Vorschlag angenommen wird, muss die Mehrheit der Mitglieder zustimmen.</p><p> Wenn du nicht einverstanden bist, sag, warum und was sich ändern muss, damit du zustimmst.</p>
      agree: Zustimmen
      agree_meaning: Ich unterstütze den Vorschlag
      agree_prompt: Was gefällt dir an dem Vorschlag und welchen Nutzen hat die Gruppe davon?
      abstain: Enthaltung
      disagree: Widerspruch
      disagree_meaning: An diesem Vorschlag muss etwas geändert werden, bevor ich ihn unterstützen kann.
      disagree_prompt: Wie könnte dieser Vorschlag verbessert werden, damit du ihn unterstützen kannst?
      abstain_meaning: Du möchtest oder kannst zu dieser Entscheidung keine Stimme abgeben.
      abstain_prompt: Warum enthältst du dich der Stimme oder warum fühlst du dich nicht in der Lage, über diese Entscheidung abzustimmen?
    advice:
      process_subtitle: Lass dich bei einer Entscheidung beraten, die du treffen musst
      process_introduction: <p>Hol dir bei einer Entscheidung, die du treffen musst, Rat von Betroffenen oder Fachleuten ein, damit du eine bessere Entscheidung für dein Unternehmen treffen kannst.</p><ul><li><p> Beratung hilft dir, eine bessere Entscheidung für deine Organisation zu treffen.</p></li><li><p> Fördere Beziehungen, Lernmöglichkeiten und vielfältige Anregungen.</p></li><li><p> Fördere Eigeninitiative und Kreativität und sorge für mehr Freude an der Arbeit.</p></li></ul><p> <a target="_blank" href="/docs/en/guides/making_decisions/advice_process"><u>Lies mehr über den Beratungsprozess</u></a> .</p>
      title: Hilf Takashi, einen neuen Computer zu kaufen
      details: <h3 id="what-is-the-decision-you-need-to-make"><strong>Welche Entscheidung musst du treffen?</strong></h3><p></p><h3 id="why-is-this-important"> <strong>Warum ist das wichtig?</strong></h3><p></p><h3 id="what-advice-are-you-asking-from-people-to-help-you-make-a-go"> <strong>Welchen Rat erbittest du von anderen, um eine gute Entscheidung treffen zu können?</strong></h3><p></p><p> Ich bitte um deinen Input, der mir hilft, eine gute Entscheidung für unsere Organisation zu treffen.</p>
      agree: Zustimmen
      agree_meaning: Ich habe meinen Rat zu dieser Entscheidung angeboten
      agree_prompt: Fasse deinen Rat zusammen oder mache einen hilfreichen Kommentar
      abstain: Enthaltung
      abstain_meaning: Ich habe keinen Rat anzubieten
      abstain_prompt: Hast du hilfreiche Kommentare?
      outcome_statement: "<p>Danke für die Teilnahme an meiner Beratungsrunde!</p>"
    consent:
      process_subtitle: Triff eine Entscheidung, die du ohne Einwände „sicher ausprobieren“ kannst
      process_introduction: <p>Suche Konsent für eine anstehende Entscheidung, bei der keine wesentlichen Einwände gegen deinen Vorschlag bestehen. So kannst du für deine Organisation schnell eine Entscheidung treffen, die sich ohne großes Risiko ausprobieren lässt.</p><ul><li><p>Strebe eine ausreichend gute Entscheidung an</p></li><li><p>Beziehe viele Stimmen ein, um einen praktikablen Vorschlag zu entwickeln</p></li><li><p>Frage, ob jemand einen berechtigten Einwand hat</p></li><li><p>Ändere den Vorschlag, um Einwände auszuräumen</p></li></ul> <p><a target="_blank" href="/docs/en/guides/making_decisions/consent_process">Lies mehr über das Konsentverfahren</a>.</p>
      title: Stelle Chloe für eine Designrolle ein
      details: <h3 id="what-is-the-decision-you-need-to-make"><strong>Welche Entscheidung musst du treffen?</strong></h3><p></p><h3 id="why-is-this-important"><strong>Warum ist das wichtig?</strong></h3><p></p><h3 id="what-are-you-asking-of-people-in-this-proposal"><strong>Worum bittest du die Menschen mit diesem Vorschlag?</strong></h3><p></p><p>Wenn du einen Einwand hast, begründe ihn bitte und schlage eine Änderung vor, die den Vorschlag sicher macht.</p><p>Denk daran, dass wir Konsent für eine ausreichend gute Entscheidung suchen, die sich ohne großes Risiko ausprobieren lässt, damit wir eine gute Entscheidung für unsere Organisation treffen können.</p>
      consent: Konsent
      consent_meaning: Der Vorschlag kann bedenkenlos ausprobiert werden
      consent_prompt: Was gefällt dir an dem Vorschlag und welchen Nutzen hat die Organisation davon?
      objection: Einspruch
      objection_meaning: Ich habe einen berechtigten Einwand und bin der Meinung, dass der Vorschlag Schaden anrichten wird
      objection_prompt: Welche Änderung ist an diesem Vorschlag erforderlich, damit er „gefahrlos ausprobiert werden kann“, sodass du ihn unterstützen kannst?
      outcome_statement: "<p>Vielen Dank für deine Teilnahme am Zustimmungsprozess.</p>"
      process_subtitle_v2: Fahr fort, sofern niemand Einspruch erhebt.
      process_introduction_v2: "<p><strong>Konsent</strong> fragt, ob ein Vorschlag sicher ausprobiert werden kann, nicht ob er perfekt ist. Der Vorschlag gilt als angenommen, solange niemand einen stichhaltigen Einwand erhebt. Wenn jemand einen Einwand hat, arbeitet die Gruppe an einer Lösung — und da Teilnehmende ihre Stimme ändern können, wenn sich der Vorschlag weiterentwickelt, werden Einwände zu einem Mittel zur Verbesserung statt zu einem Hindernis.</p>"
      details_v2: "<h3><strong>Welche Entscheidung musst du treffen?</strong></h3><p></p><h3><strong>Warum ist das wichtig?</strong></h3><p></p><h3><strong>Was verlangst du mit diesem Vorschlag von den Menschen?</strong></h3><p></p><p>Wir streben keine Perfektion an — gib deinen Konsent, wenn der Vorschlag gut genug ist und sicher ausprobiert werden kann. Wenn du einen Einwand hast, sag, was sich ändern muss, damit er umsetzbar ist.</p>"
    consensus:
      process_subtitle: Erreiche einen Tarifvertrag mit allen Beteiligten
      process_introduction: <p>Schaffe einen Konsens für eine Entscheidung, die du treffen musst, um eine Vereinbarung zu erzielen, die den Bedürfnissen und Anliegen aller Teilnehmer gerecht wird.</p><ul><li><p> Gemeinsam einen Vorschlag diskutieren und entwickeln</p></li><li><p> Alle Beteiligten einbeziehen und respektieren</p></li><li><p> Suche die Zustimmung der meisten Menschen</p></li></ul><p> <a target="_blank" href="/docs/en/guides/making_decisions/consensus_process">Lies mehr über den Konsensprozess</a> .</p>
      title: Genehmige das neue Markenkonzept
      details: <h3 id="what-is-the-decision-you-need-to-make"><strong>Welche Entscheidung musst du treffen?</strong></h3><p></p><h3 id="why-is-this-important"> <strong>Warum ist das wichtig?</strong></h3><p></p><h3 id="what-are-you-asking-people-to-do"> <strong>Was verlangst du von den Leuten?</strong></h3><p></p><p> Damit dieser Vorschlag angenommen wird, muss die Mehrheit der Mitglieder zustimmen.</p><p> Wenn du nicht einverstanden bist, sag, warum und was sich ändern muss, damit du zustimmst.</p>
      outcome_statement: "<p>Vielen Dank für deine Teilnahme am Konsensprozess.</p>"
      agree: Zustimmen
      agree_meaning: Ich unterstütze den Vorschlag
      agree_prompt: Was gefällt dir an dem Vorschlag und welchen Nutzen hat die Organisation davon?
      abstain: Enthaltung
      abstain_meaning: Diese Entscheidung betrifft mich nicht und ich bin mit der Entscheidung der Gruppe zufrieden.
      disagree: Widerspruch
      disagree_meaning: Etwas an diesem Vorschlag muss geändert werden, bevor ich ihn unterstützen kann
      disagree_prompt: Wie könnte dieser Vorschlag verbessert werden, damit du ihn unterstützen kannst?
      block: Veto
      block_meaning: Ich lege ein Veto gegen diesen Vorschlag ein und finde, dass er nicht umgesetzt werden sollte
      block_prompt: Erläutere deine Einwände gegen diesen Vorschlag und warum er nicht umgesetzt werden sollte.
      details_v2: "<h3><strong>Welche Entscheidung musst du treffen?</strong></h3><p></p><h3> <strong>Warum ist das wichtig?</strong></h3><p></p><h3> <strong>Was verlangst du von den Leuten?</strong></h3><p></p><p> Teile uns deine Position und deine Gründe mit. Falls du nicht einverstanden bist, erkläre, was sich ändern müsste, damit du dies unterstützt.</p>"
      process_introduction_v2: "<p><strong>Konsens</strong> eignet sich für Entscheidungen, bei denen die aktive Zustimmung aller wichtig ist. Die Teilnehmenden arbeiten zusammen, um die Bedürfnisse der anderen zu verstehen und den Vorschlag so lange zu gestalten, bis ihn die ganze Gruppe unterstützen kann. Da alle ihre Stimme im Laufe der Diskussion ändern können, fördert der Prozess einen echten Dialog statt einer einmaligen Entscheidung. Er braucht mehr Geduld als andere Methoden, schafft aber die stärkste Verbindlichkeit.</p><p>Diese Vorlage enthält standardmäßig eine <strong>Veto</strong>-Option. Ein Veto ist nicht für jede Gruppe geeignet — es kann umstritten sein oder missbraucht werden. Wenn du in deinem Entscheidungsprozess kein Veto verwendest, empfehlen wir dir, die Vorlage zu bearbeiten und die Option zu entfernen.</p>"
      abstain_prompt: Warum enthältst du dich der Stimme oder warum fühlst du dich nicht in der Lage, über diese Entscheidung abzustimmen?
    question_round:
      process_subtitle: Bitte um klärende Fragen, um den Leuten zu helfen, einen Vorschlag zu verstehen
      process_introduction: <p>Eine Fragerunde bietet den Teilnehmern die Möglichkeit, klärende Fragen zum Vorschlag zu stellen, damit jeder den Vorschlag versteht, bevor er seine Meinung dazu äußert.</p><p> Die Loomio-Fragerunde ist ein spezieller Vorschlag ohne Abstimmungsmöglichkeit. Sie ermöglicht es den Teilnehmern, innerhalb einer von dir festgelegten Dauer Fragen zu stellen.</p><p> Eine Fragerunde wird häufig als Schritt im Zustimmungsprozess verwendet.</p><p> <a target="_blank" href="/docs/en/guides/making_decisions/consent_process">Lies mehr über den Zustimmungsprozess</a> .</p>
      title: Welche Fragen hast du zur Gesundheits- und Sicherheitsrichtlinie?
      details: <h3 id="what-are-you-proposing"><strong>Was schlägst du vor?</strong></h3><p></p><h3 id="why-is-this-important"> <strong>Warum ist das wichtig?</strong></h3><p></p><h3 id="what-are-you-asking-people-to-do"> <strong>Was verlangst du von den Leuten?</strong></h3><p></p><p> Dies ist eine Fragerunde, in der du eingeladen bist, klärende Fragen zu stellen.</p><p> Was musst du wissen, um den Vorschlag zu verstehen?</p><p> Bitte antworte, bevor die Fragerunde endet.</p>
      reason_prompt: Was musst du wissen, um den Vorschlag zu verstehen?
      outcome_statement: "<p>Vielen Dank für das Einreichen deiner Fragen während dieser Runde</p>"
    sense_check:
      process_subtitle: Bitte um Feedback, Fragen und Bedenken
      process_introduction: <p>Der Sense-Check-Vorschlag ist eine gute Möglichkeit, Feedback zu erhalten, Fragen zu stellen und Bedenken aufzudecken. Er hilft, einen Vorschlag zu klären und zu verbessern, bevor eine Entscheidung getroffen wird.</p><p> Der Sense-Check informiert die Teilnehmer über die Entstehung eines Vorschlags und ermutigt sie, sich zu engagieren. Er bietet die Möglichkeit, den Teilnehmern zuzuhören, ihre Gefühle zu erfassen und angemessen zu reagieren. Dadurch eröffnet sich die Möglichkeit, ihre Beiträge zu berücksichtigen und so eine bessere Entscheidung zu treffen.</p><p> Verwende den Vorschlag zur Sinnprüfung im Zustimmungsprozess, um Reaktionen und Kommentare zur Verbesserung des Vorschlags einzuholen, und in einem Konsensprozess, um auf Konsens zu testen.</p><p> <a target="_blank" rel="noopener noreferrer nofollow" href="/docs/en/guides/making_decisions/simple_decision_process"><u>Lies mehr über die Verwendung der Sinnprüfung im einfachen Entscheidungsprozess</u></a> <span>.</span></p>
      title: Wie stehst du zu den neuen Markenkonzepten?
      details: <h3 id="what-are-you-proposing"><strong>Was schlägst du vor?</strong></h3><p></p><h3 id="why-is-this-important"> <strong>Warum ist das wichtig?</strong></h3><p></p><h3 id="what-are-you-asking-people-to-do"> <strong>Was verlangst du von den Leuten?</strong></h3><p></p><p> Wie findest du den Vorschlag? Hinterlasse einen Kommentar oder mache einen Verbesserungsvorschlag.</p><p> Dieser Sense-Check ist eine Gelegenheit für deine Eingaben und Beiträge, um uns zu helfen, eine bessere Entscheidung zu treffen.</p>
      outcome_statement: "<p>Danke für deine Teilnahme am Stimmungsbild.</p>"
      not_sure: Nicht sicher
      not_sure_meaning: Ich habe eine Frage oder brauche mehr Zeit
      not_sure_prompt: Welche Teile sind dir unklar? Wie könnte dies gelöst werden?
      looks_good: Sieht gut aus
      looks_good_meaning: Ich bin zufrieden mit der Entwicklung
      looks_good_prompt: Hast du Anmerkungen oder Vorschläge zur Verbesserung des Vorschlags?
      abstain: Enthaltung
      abstain_meaning: Ich habe dieser Arbeit nichts hinzuzufügen und auch keine Einwände.
      abstain_prompt: Enthaltung bedeutet Konsent zur Richtung dieses Vorschlags. Gibt es eine Begründung für deine Enthaltung?
      concerned: Betroffen
      concerned_meaning: Möglicherweise muss sich etwas daran ändern, damit ich zustimme oder zustimme
      concerned_prompt: Was ist dein Anliegen und wie kann es gelöst werden?
      process_subtitle_v2: Prüfe, ob du auf dem richtigen Weg bist.
      process_introduction_v2: "<p><strong>Ein Stimmungscheck</strong> hilft dir, frühzeitig Feedback zu erhalten, bevor du eine Entscheidung triffst. Die Teilnehmenden geben an, ob die Dinge gut aussehen oder ob es Bedenken gibt, sodass du gegebenenfalls Kurskorrekturen vornehmen kannst, bevor du einen formellen Vorschlag einreichst. Es handelt sich nicht um eine Entscheidung, sondern um eine erste Einschätzung der Lage.</p>"
      details_v2: "<h3><strong>Was schlägst du vor?</strong></h3><p></p><h3> <strong>Warum ist das wichtig?</strong></h3><p></p><h3> <strong>Was verlangst du von den Leuten?</strong></h3><p></p><p> Sag, ob das gut aussieht, ob es besser sein könnte oder ob es überdacht werden muss – und begründe deine Antwort.</p>"
      looks_good_meaning_v2: Ich bin mit der Richtung zufrieden.
      looks_good_prompt_v2: Was gefällt dir daran?
      could_be_better: Könnte besser sein
      could_be_better_meaning: Ich sehe Potenzial, habe aber Vorschläge.
      could_be_better_prompt: Was würdest du ändern?
      needs_a_rethink: Ein Umdenken ist erforderlich
      needs_a_rethink_prompt: Was ist dein Anliegen?
      needs_a_rethink_meaning: Ich glaube, das ist der falsche Ansatz.
    gradients_of_agreement:
      process_subtitle: Drücke deine Unterstützung für einen Vorschlag auf einer 8-stufigen Skala aus
      process_introduction: "<p>Mithilfe der Gradienten der Zustimmung zu einem Vorschlag können die Mitglieder einer Gruppe ihre Unterstützung für einen Vorschlag in Graden auf einer Skala ausdrücken. Dies bietet mehr Möglichkeiten, die Unterstützung auszudrücken als nur in Form von „Zustimmen“ und „Nichtzustimmen“.</p><p> Verwende Zustimmungsgradienten als Vorrunde, um die Unterstützung für einen Vorschlag zu testen, bevor du zu einer formellen Vereinbarung übergehst.</p><p> Graduelle Zustimmung signalisiert den Teilnehmern, dass ein Vorschlag entsteht, und ermutigt sie, sich zu engagieren. Es bietet die Möglichkeit, den Teilnehmern zuzuhören, ihre Gefühle zu erfassen und angemessen zu reagieren. Dies eröffnet die Möglichkeit, ihre Beiträge zu berücksichtigen und so eine bessere Entscheidung zu treffen.</p>"
      title: Wie gefällt dir das neue Werteverständnis?
      details: <h3 id="what-are-you-proposing"><strong>Was schlägst du vor?</strong></h3><p></p><h3 id="why-is-this-important"> <strong>Warum ist das wichtig?</strong></h3><p></p><h3 id="what-are-you-asking-people-to-do"> <strong>Was verlangst du von den Leuten?</strong></h3><p></p><p> Wie gefällt dir der Vorschlag? Gib deine Zustimmung auf der Skala unten ab und hinterlasse einen Kommentar oder Verbesserungsvorschlag.</p><p> Dieser Vorschlag für Einigungsgradienten dient dazu, die Unterstützung für den Vorschlag zu testen und dir Gelegenheit für deine Eingabe zu geben, bevor eine formelle Vereinbarung getroffen wird.</p>
      whole_hearted_endorsement: Volle Zustimmung
      whole_hearted_endorsement_meaning: Gefällt mir sehr gut!
      whole_hearted_endorsement_prompt: Was gefällt dir daran?
      agreement_with_minor_contention: Einigung mit geringfügigen Streitigkeiten
      agreement_with_minor_contention_meaning: Nicht perfekt, aber gut genug
      agreement_with_minor_contention_prompt: Was ist dein Anliegen?
      support_with_reservations: Unterstützung bei Reservierungen
      support_with_reservations_meaning: Ich kann damit leben
      support_with_reservations_prompt: Was sind deine Vorbehalte?
      abstain_meaning: Dieses Problem betrifft mich nicht
      abstain_prompt: Möchtest du noch etwas hinzufügen?
      more_discussion_needed: Weitere Diskussion nötig
      more_discussion_needed_meaning: Ich verstehe die Probleme noch nicht gut genug
      more_discussion_needed_prompt: Was verstehst du nicht?
      don_t_like_but_will_support: Gefällt mir nicht, werde es aber unterstützen
      don_t_like_but_will_support_meaning: Es ist nicht toll, aber ich möchte die Gruppe nicht aufhalten
      don_t_like_but_will_support_prompt: Was würdest du gerne verbessert sehen?
      serious_disagreement: Ernsthafte Meinungsverschiedenheiten
      serious_disagreement_meaning: Ich bin damit nicht einverstanden - verlass dich nicht auf mich
      serious_disagreement_prompt: Womit bist du nicht einverstanden?
      veto: Veto
      veto_meaning: Ich blockiere diesen Vorschlag
      veto_prompt: Warum lehnst du den Vorschlag ab? Was muss sich ändern, damit du ihn unterstützt?
    simple_poll:
      process_subtitle: Finde die beliebteste Option
      process_introduction: <p>Finde mit einer Abstimmung mit Einzel- oder Mehrfachauswahl die beliebtesten Optionen.</p><p><a target="_blank"  href="/docs/en/user_manual/polls/proposal_types#simple-poll">Lies mehr über einfache Abstimmungen</a>.</p>
      title: Worauf sollte der Schwerpunkt unserer strategischen Ausrichtung liegen?
      details: <h3 id="what-is-this-poll-about"><strong>Worum geht es in dieser Abstimmung?</strong></h3><p></p><h3 id="why-is-this-important"><strong>Warum ist das wichtig?</strong></h3><p></p><h3 id="what-are-you-asking-people-to-do"><strong>Was verlangst du von den Leuten?</strong></h3><p></p><p>Wähle die Option(en), die du bevorzugst.</p>
      process_introduction_v2: <p><strong>Die Auswahlmöglichkeit</strong> hilft dir, die beliebteste Option zu finden. Die Teilnehmer wählen aus einer Liste aus – du kannst festlegen, ob sie eine oder mehrere Optionen auswählen.</p><p> <a target="_blank" href="/docs/en/user_manual/polls/proposal_types#simple-poll">Lies mehr über Choose</a> .</p>
      process_subtitle_v2: Miss die Beliebtheit mit einer Abstimmung mit Einzel- oder Mehrfachauswahl
    score_poll:
      process_subtitle: Miss den Grad der Unterstützung für jede Option
      process_introduction: <p>Verwende eine Bewertung, wenn du Menschen nach ihren Wünschen, Vorlieben oder ihrem Interesse an jeder Option fragen möchtest.</p><p><span>Die Teilnehmenden bewerten jede Option und vergeben eine Punktzahl, indem sie einen Schieberegler auf einer Skala bewegen.</span></p><p><a target="_blank"  href="/docs/en/user_manual/polls/proposal_types#score-poll">Lies mehr über Bewertungen</a>.</p>
      title: Bewerten, wie Entscheidungen in unserer Organisation getroffen werden
      details: <h3 id="what-is-this-poll-about"><strong>Worum geht es in dieser Abstimmung?</strong></h3><p></p><h3 id="why-is-this-important"><strong>Warum ist das wichtig?</strong></h3><p></p><h3 id="what-are-you-asking-people-to-do"><strong>Was verlangst du von den Leuten?</strong></h3><p></p><p>Wähle die Option(en), die du bevorzugst.</p>
      process_subtitle_v2: Miss den Grad der Zustimmung für jede Option.
      process_introduction_v2: <p>Mit einer <strong>Bewertung</strong> misst du, wie stark die Gruppe jede Option unterstützt. Die Teilnehmenden bewerten jede Option mit einer Punktzahl auf einer gleitenden Skala. So siehst du nicht nur, was die Leute bevorzugen, sondern auch, wie stark.</p><p><a target="_blank" href="/docs/en/user_manual/polls/proposal_types#score-poll">Lies mehr über Bewertungen</a>.</p>
      process_subtitle_v3: Bitte die Abstimmenden, anzugeben, wie sehr sie jede Option unterstützen
    dot_vote:
      process_subtitle: Verteile ein Punktebudget, um Prioritäten aufzuzeigen
      process_introduction: <p>Dot Vote ist nützlich für Gruppen, die eine begrenzte Ressource auf mehrere Optionen verteilen möchten. Es geht über eine einfache Umfrage hinaus, indem es den Teilnehmern bewusst macht, dass es bei der Auswahl von Optionen Einschränkungen gibt.</p><p> Jeder Teilnehmer erhält eine festgelegte Anzahl an Punkten. Die Anzahl bestimmst du.</p><p> Du platzierst Punkte neben den angezeigten Optionen, die ihnen gefallen. Die Teilnehmer können alle ihre Punkte auf eine einzelne Option setzen oder sie auf mehrere Optionen verteilen.</p><p> Beim Zuteilen von Punkten kann es passieren, dass die Teilnehmer das Punktbudgetlimit überschreiten. Daher werden sie dazu angehalten, sorgfältig zu überlegen, wie sie ihre Punkte ausgeben.</p><p> Die Optionen mit den meisten Punkten gewinnen. Die Ergebnistabelle enthält zusätzliche Daten zur Analyse der Ergebnisse.</p><ul><li><p> % der Punkte</p></li><li><p> Punkte</p></li><li><p> Bedeuten</p></li><li><p> Wähler</p></li></ul><p> <a target="_blank"  href="/docs/en/user_manual/polls/proposal_types#dot-vote">Lies mehr über Dot Vote</a> .</p>
      title: Themenauswahl für unsere Konferenz
      details: <h3 id="what-is-this-poll-about"><strong>Worum geht es in dieser Abstimmung?</strong></h3><p></p><h3 id="why-is-this-important"><strong>Warum ist das wichtig?</strong></h3><p></p><h3 id="what-are-you-asking-people-to-do"><strong>Was verlangst du von den Leuten?</strong></h3><p></p><p>In dieser Abstimmung hast du eine feste Anzahl an Punkten, die du auf deine bevorzugten Optionen verteilen kannst. Du kannst alle Punkte auf eine Option setzen oder sie verteilen.</p>
      process_subtitle_v2: Prioritäten offenlegen, wenn es Kompromisse gibt
      process_introduction_v2: <p><strong>Mit Allocate</strong> kannst du die Prioritäten einer Gruppe bei Abwägungen besser verstehen. Jeder Teilnehmer erhält ein Punktebudget, das er auf die verschiedenen Optionen verteilen kann – er kann sich voll auf eine Option konzentrieren oder seine Punkte auf mehrere verteilen. Da das Budget begrenzt ist, ist jeder ausgegebene Punkt ein klares Signal für die jeweilige Priorität.</p><p> <a target="_blank" href="/docs/en/user_manual/polls/proposal_types#dot-vote">Lies mehr über Allocate</a> .</p>
      process_subtitle_v3: Prioritäten bei Kompromissen offenlegen. Auch bekannt als Punktabstimmung.
    ranked_choice:
      process_subtitle: Verstehe die geordnete Präferenz von Optionen
      process_introduction: <p>Eine Rangfolge ist nützlich, wenn du viele Optionen hast oder eine Wahl durchführst.</p><p>Die Abstimmenden ziehen die Optionen in die Reihenfolge ihrer Vorlieben.</p><p>Das Ergebnis wird als Rangfolge angezeigt.</p><p><a target="_blank"  href="/docs/en/user_manual/polls/proposal_types#ranked-choice">Lies mehr über Rangfolgen</a>.</p>
      title: Wähle Direktoren für den Verwaltungsrat
      details: <h3 id="what-is-this-poll-about"><strong>Worum geht es in dieser Umfrage?</strong></h3><p></p><h3 id="why-is-this-important"> <strong>Warum ist das wichtig?</strong></h3><p></p><h3 id="what-are-you-asking-people-to-do"> <strong>Was verlangst du von den Leuten?</strong></h3><p></p><p> Stimme ab, indem du die Optionen nach deinen Präferenzen ordnest. Die Option, die in den Ergebnissen an erster Stelle steht, gewinnt.</p>
      process_subtitle_v2: Ermittle die Präferenzreihenfolge der Gruppe.
      process_introduction_v2: <p><strong>Die Rangfolge</strong> gibt die Präferenzreihenfolge der Gruppe wieder. Die Teilnehmer ordnen die Optionen per Drag & Drop von der beliebtesten zur unbeliebtesten an, und das Ergebnis zeigt die Gesamtrangliste.</p><p> <a target="_blank" href="/docs/en/user_manual/polls/proposal_types#ranked-choice">Lies mehr über Rank</a> .</p>
      process_subtitle_v3: Optionen nach Präferenz sortieren (von am meisten bis am wenigsten bevorzugt)
    time_poll:
      process_subtitle: Finde heraus, wann Personen für ein Treffen verfügbar sind
      process_introduction: <p>Finde schnell den besten Termin für dein Treffen oder deine Veranstaltung. Füge einen Titel, Details und Terminoptionen in deiner Zeitzone hinzu. Die Teilnehmenden sehen die Zeiten in ihrer eigenen Zeitzone.</p><p>Wenn deine Terminfindung endet, halte den besten Termin und Hinweise zum Treffen im Fazit fest. Loomio versendet das Fazit per E-Mail mit einer Kalendereinladung, damit die Teilnehmenden den Termin in ihren Kalender aufnehmen können.</p><p><a target="_blank" href="/docs/en/user_manual/polls/meeting_polls#time-poll">Lies mehr über Terminfindung</a>.</p>
      title: Lass uns einen Termin für unser nächstes Treffen finden
      details: "<p><strong>Um welches Meeting oder Event handelt es sich?</strong></p><p></p><p> <strong>Warum ist das wichtig?</strong></p><p></p><p> <strong>Was verlangst du von den Leuten?</strong></p><p></p><p> <span>Markiere die für dich verfügbaren Zeitfenster mit dem grünen „Daumen hoch“-Symbol oder lass das rote „Daumen runter“-Symbol stehen, wenn keine Zeit verfügbar ist.</span></p><p> <span>Verwende das Symbol „Daumen zur Seite“, um anzuzeigen, dass du „bei Bedarf“ verfügbar bist.</span></p>"
      reason_prompt: Kannst du dem Veranstalter etwas sagen, um ihm bei der Suche nach einem passenden Termin zu helfen?
      process_subtitle_v2: Finde heraus, wann Personen verfügbar sind.
      process_introduction_v2: <p>Mit einer <strong>Terminfindung</strong> findest du heraus, wann die Leute Zeit haben. Füge deine Terminvorschläge hinzu. Die Teilnehmenden sehen sie in ihrer eigenen Zeitzone. Wenn die Abstimmung endet, lege das Fazit fest. Loomio sendet dann allen eine Kalendereinladung.</p><p><a target="_blank" href="/docs/en/user_manual/polls/meeting_polls#time-poll">Lies mehr über Terminfindung</a>.</p>
    opt_in:
      process_subtitle: Freiwillige finden oder nach Teilnehmern fragen
      process_introduction: '<p>Verwende Opt-in, um Personen einzuladen, einem Team, Ausschuss oder einer Arbeitsgruppe beizutreten oder an einer Veranstaltung teilzunehmen.</p><p> Bei „Opt-in“ gibt es zwei Abstimmungsoptionen: Akzeptieren oder Ablehnen.</p><p> Du kannst eine Zielanzahl an Personen festlegen, die du suchst, beispielsweise 3 Personen, die deiner Arbeitsgruppe beitreten sollen.</p><p> <a target="_blank" href="/docs/en/user_manual/polls/meeting_polls#opt-in">Lies mehr über Opt-in</a> .</p>'
      title: Arbeitsgruppe zur Ausarbeitung unserer neuen Nachhaltigkeitspolitik
      details: "<p><strong>Zu welchem Team, welcher Arbeitsgruppe oder Veranstaltung lädst du Leute ein?</strong></p><p></p><p> <strong>Warum ist das wichtig?</strong></p><p></p><p> <strong>Was verlangst du von den Leuten?</strong></p><p></p><p> Wähle „Akzeptieren“, um teilzunehmen!</p>"
      accept_meaning: Ich bin bereit mitzumachen
      accept_prompt: Warum engagierst du dich ehrenamtlich dafür?
      decline_meaning: Ich kann nicht teilnehmen
      decline_prompt: Möchtest du etwas sagen?
    try_loomio:
      process_name: Probieren wir Loomio aus.
      process_subtitle: Bringt eure Gruppe dazu, Loomio gemeinsam auszuprobieren
      process_introduction: "<p>Um Loomio optimal zu nutzen, ist gemeinsames Engagement erforderlich. Dieser Vorschlag hilft deiner Gruppe zu entscheiden, ob sie Zeit und Mühe investieren möchte, um Loomio richtig auszuprobieren – sei es durch eine Testphase oder die gemeinsame Anmeldung für ein Abo.</p>"
      title: Lasst uns gemeinsam Loomio ausprobieren.
      details: "<p>Die erfolgreiche Nutzung von Loomio erfordert Teamarbeit – es funktioniert nur, wenn Leute erscheinen und mitmachen.</p><p> Dieser Vorschlag bittet alle, sich während unserer Testphase aktiv an der Nutzung von Loomio zu beteiligen. Das bedeutet, regelmäßig vorbeizuschauen, über Vorschläge abzustimmen und sich an Diskussionen zu beteiligen.</p><p> Wenn du Bedenken hast, erhebe Einspruch und sag, was geändert werden müsste – genau dafür ist die Einspruchsoption da.</p>"
      outcome_statement: "<p>Teile der Gruppe das Fazit dieses Vorschlags mit — was beschlossen wurde und wie es weitergeht.</p>"
      consent_meaning: Ich bin bereit, es zu versuchen.
      consent_prompt: Worauf freust du dich bei der Nutzung von Loomio?
      objection_meaning: Ich habe ein Anliegen, das wir zuerst angehen müssen.
      objection_prompt: Was muss sich ändern, bevor du dich festlegen kannst?
    majority:
      process_subtitle: Triff eine Entscheidung anhand der meisten Stimmen.
      process_introduction: "<p>Die <strong>Mehrheitsentscheidung</strong> ist die einfachste Methode, eine Gruppenentscheidung zu treffen — die Teilnehmenden stimmen mit Ja oder Nein ab, und der Vorschlag wird angenommen, wenn mehr als die Hälfte mit Ja stimmt. Es gibt keine Enthaltung und kein Veto, daher hat jede Stimme das gleiche Gewicht.</p><p>Die Mehrheitsentscheidung eignet sich gut für einfache Entscheidungen, bei denen du ein klares Fazit brauchst. Bei Entscheidungen, bei denen die Beteiligten gemeinsam einander verstehen und eine gemeinsame Grundlage finden sollen, ziehe Konsent oder Konsens in Betracht.</p>"
      title: Genehmige das Budget für das dritte Quartal.
      details: "<h3><strong>Welche Entscheidung musst du treffen?</strong></h3><p></p><h3> <strong>Warum ist das wichtig?</strong></h3><p></p><h3> <strong>Was verlangst du von den Leuten?</strong></h3><p></p>"
      yes_meaning: Ich unterstütze diesen Vorschlag.
      yes_prompt: Warum unterstützt du diesen Vorschlag?
      no_meaning: Ich unterstütze diesen Vorschlag nicht.
      no_prompt: Warum unterstützt du diesen Vorschlag nicht?
      outcome_statement: "<p>Vielen Dank für deine Teilnahme an dieser Mehrheitsabstimmung.</p>"
    stv:
      process_subtitle: Mehrere Gewinner proportional wählen
      process_introduction: <p>STV (Single Transferable Vote) ist ein Verhältniswahlverfahren für Wahlen mit mehreren Sitzen. Die Abstimmenden ordnen die Kandidierenden nach ihren Vorlieben. Kandidierende, die eine Stimmenquote erreichen, sind gewählt. Überschüssige Stimmen und Stimmen für ausgeschiedene Kandidierende werden auf die nächsten Präferenzen übertragen.</p><p>Lege die Anzahl der Sitze, die Zählmethode (Scottish oder Meek) und die Quotenart (Droop oder Hare) fest. Das Ergebnis zeigt für jede Runde, wie Stimmen übertragen wurden.</p><p><a target="_blank" href="/docs/en/user_manual/polls/stv">Lies mehr über STV-Wahlen</a>.</p>
      title: Ausschussmitglieder wählen
      details: <h3 id="what-is-this-election-about"><strong>Worum geht es bei dieser Wahl?</strong></h3><p></p><h3 id="how-many-seats"><strong>Wie viele Sitze werden besetzt?</strong></h3><p></p><h3 id="who-are-the-candidates"><strong>Wer sind die Kandidierenden?</strong></h3><p></p><p>Stimme ab, indem du die Kandidierenden in deine bevorzugte Reihenfolge ziehst. Auf Rang 1 steht die Person, die du am meisten bevorzugst. Du kannst beliebig viele oder wenige Kandidierende in eine Rangfolge bringen.</p>
