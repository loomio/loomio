    translated_on: '2026-09-30'
  e98e7384d147ec31:
    english: "## Update your personal info"
    translation: "## Päivitä henkilötietojasi"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9578a723a8d322cc:
    english: 'You can update your personal info by changing any of the following fields:'
    translation: 'Voit päivittää henkilötietojasi muuttamalla seuraavia kenttiä:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cc28d4b1038e6fe5:
    english: |-
      * **Name**
      * **Email address** - this is the email address associated with your Loomio account, and where you will receive notifications from Loomio.
      * **Username** - your username is a name people can recognize and alert you using @mention. It can contain lower case letters, numbers, underscores, and internal hyphens.
      * **Introduction** - a few lines to tell others in your group something about you.
      * **Location** - useful for distributed or remote groups so people can get an idea of where you are located.
    translation: |-
      * **Nimi**
      * **Sähköpostiosoite** - Loomio-tiliisi liitetty osoite, johon saat Loomion ilmoitukset.
      * **Käyttäjätunnus** - nimi, josta muut tunnistavat sinut ja jolla he voivat kutsua sinut mukaan @maininnalla. Käyttäjätunnuksessa voi olla pieniä kirjaimia, numeroita, alaviivoja ja sanojen välisiä yhdysmerkkejä.
      * **Johdanto** - kerro muutamalla rivillä itsestäsi muille ryhmäsi jäsenille.
      * **Sijainti** - auttaa eri paikoissa toimivan ryhmän jäseniä hahmottamaan, missä olet.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d64106bb76c8936e:
    english: "## Viewing another person's profile"
    translation: "## Toisen henkilön profiilin katselu"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fa6b7c980bad9aeb:
    english: Select a person's name or avatar to open their profile. Their recent discussions, comments, and polls are listed alongside their profile details and groups. The list only includes activity you have permission to access; signed-out visitors see public activity only.
    translation: Avaa henkilön profiili valitsemalla hänen nimensä tai avatarinsa. Profiilitietojen ja ryhmien vieressä näkyvät hänen viimeaikaiset keskustelunsa, kommenttinsa ja kyselynsä. Luettelossa näkyy vain toiminta, johon sinulla on pääsy. Kirjautumattomat vierailijat näkevät vain julkisen toiminnan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ac9abf23a4881216:
    english: "## Uploading a profile photo\nWhen you first create a Loomio account, your initials will be the default image associated with your profile. You can upload a profile photo by clicking on your picture on the profile page. "
    translation: |-
      ## Profiilikuvan lataaminen
      Kun luot Loomio-tilin, profiilisi oletuskuvana näkyvät nimikirjaimesi. Voit ladata profiilikuvan napsauttamalla kuvaasi profiilisivulla.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b011f45bc197558a:
    english: If you have a [Gravatar](https://en.gravatar.com/) you can set that as your profile picture by selecting **Use Gravatar**. You can also choose for Loomio to use the photo you use for other common platforms/tools.
    translation: Jos sinulla on [Gravatar](https://en.gravatar.com/), voit käyttää sitä profiilikuvanasi valitsemalla **Käytä Gravataria**. Voit myös valita kuvan, jota käytät muissa palveluissa tai työkaluissa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  41f1c139f9a0822b:
    english: |-
      ## Language settings
      Loomio is developed in English, but [is translated by volunteers into many languages](https://www.loomio.com/g/cpaM3Hsv/loomio-community-translation).
    translation: |-
      ## Kieliasetukset
      Loomio kehitetään englanniksi, mutta [vapaaehtoiset kääntävät sitä monille kielille](https://www.loomio.com/g/cpaM3Hsv/loomio-community-translation).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9faad78d2b46c546:
    english: Loomio will detect your browser’s language settings, but you can manually set your preferred language from the available options on the profile page.
    translation: Loomio tunnistaa selaimesi kieliasetuksen. Voit myös valita haluamasi kielen profiilisivun vaihtoehdoista.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a224dd4aaaf81381:
    english: |-
      ## Resetting your password
      You can change your password by visiting your profile page and clicking **Reset Password**.
    translation: |-
      ## Salasanan vaihtaminen
      Voit vaihtaa salasanasi avaamalla profiilisivusi ja napsauttamalla **Nollaa salasana**.
    status: machine
