  b2f3737cd46d903a:
    english: Select **Unread discussions** in the sidebar to see discussions with activity you have not read. Within a discussion, the timeline helps you move to unread items and important events.
    translation: Selecciona **Discusiones no leídas** en la barra lateral para ver las discusiones con actividad que aún no has leído. Dentro de una discusión, la cronología te ayuda a ir a los elementos no leídos y a los eventos importantes.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e016a4cafcaee460:
