  223c90e3fe5b24d7:
    english: "> *“Consensus is the process – a participatory process by which a group thinks and feels together, en route to their decision.” - Sam Kaner, Community at Work*"
    translation: "> *„Konsens ist der Prozess – ein gemeinschaftlicher Prozess, in dem eine Gruppe auf dem Weg zu ihrer Entscheidung zusammen denkt und fühlt.“ – Sam Kaner, Community at Work*"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9872b82ded022524:
    english: |-
      ## Key points
      - Discuss and develop a proposal together
      - Include and respect everyone involved
      - Seek agreement from most people
    translation: |-
      ## Das Wichtigste
      - Einen Vorschlag gemeinsam besprechen und entwickeln
      - Alle Beteiligten einbeziehen und respektieren
      - Die Zustimmung der meisten Beteiligten anstreben
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a1cd3fa440013e0c:
    english: "**Consensus is typically used in:**\n- Working teams building shared understanding of an issue or opportunity, collaborating on a proposal and deciding course of action. \n- Governance board decisions where the board shows it is acting jointly, such as decisions on vision, policy, strategic planning and budget.\n- AGMs and General Assemblies where members and stakeholders seek general agreement for major decisions, such as revisions to statutes, major transactions and the elections of directors or council members."
    translation: |-
      **Ein Konsensprozess wird häufig genutzt für:**
      - Arbeitsteams, die ein gemeinsames Verständnis für ein Problem oder eine Möglichkeit entwickeln, an einem Vorschlag zusammenarbeiten und das weitere Vorgehen entscheiden.
      - Entscheidungen von Leitungsgremien, die gemeinsam handeln, etwa zu Leitbild, Richtlinien, strategischer Planung und Budget.
      - Mitgliederversammlungen und Vollversammlungen, bei denen Mitglieder und andere Beteiligte eine breite Einigung über wichtige Entscheidungen suchen, etwa Satzungsänderungen, größere Geschäfte oder die Wahl von Vorstands- oder Ratsmitgliedern.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7c5d3122a1333ba5:
    english: |-
      **Typical roles:**
      - Appoint a facilitator.  In board meetings this is usually the Chairperson.
      - A quorum or supermajority of members to participate, as specified in the organization's statutes.
    translation: |-
      **Typische Rollen:**
      - Bestimme eine Person für die Moderation.  Bei Sitzungen eines Leitungsgremiums übernimmt das meist der Vorsitz.
      - Ein in der Satzung festgelegtes Quorum oder eine qualifizierte Mehrheit der Mitglieder nimmt teil.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1d8ee54aa5e87423:
    english: |-
      ## Consensus process steps
      1. State the issue to be decided - start a Loomio **discussion**.
      2. Present a proposal to test for consensus - start a **Sense check proposal**.
      3. Clarify any points, invite constructive modifications and amend the proposal.
      4. Test for agreement - start a **Consensus proposal**.
      5. Outcome - state the decision **outcome**.
    translation: |-
      ## Schritte im Konsensprozess
      1. Benenne die Frage, über die entschieden werden soll – starte eine Loomio-**Diskussion**.
      2. Stelle einen Vorschlag vor, um ein erstes Meinungsbild einzuholen – starte einen **Vorschlag zur Sinnesprüfung**.
      3. Kläre offene Punkte, lade zu konstruktiven Änderungen ein und überarbeite den Vorschlag.
      4. Prüfe, ob Einigkeit besteht – starte einen **Konsensvorschlag**.
      5. Halte die Entscheidung im **Fazit** fest.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0b5249cfd4c92c35:
    english: |-
      ## Benefits
      - Grow shared understanding.
      - Decisions for the collective will of the group.
      - Encourage people to value the group over their personal preferences.
    translation: |-
      ## Vorteile
      - Ein gemeinsames Verständnis entwickeln.
      - Entscheidungen treffen, die den gemeinsamen Willen der Gruppe ausdrücken.
      - Die Beteiligten ermutigen, die Interessen der Gruppe über persönliche Vorlieben zu stellen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  55d7d6c48f056550:
    english: "## Applying the Consensus process on Loomio"
    translation: "## Den Konsensprozess auf Loomio anwenden"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e50b473237140170:
    english: |-
      | **Consensus process** | **On Loomio** |
      |---|---|
      | You notice a problem or opportunity and take the initiative. |  |
      | **State the issue to be decided**  <br /><br />Provide background information and open a broad ranging discussion to build shared understanding. Look for emerging proposals. | Start a Loomio discussion <br /><br />Name the topic of discussion in the discussion title, and what you hope to achieve. <br /><br />Attach or link to background information. Invite people to ask questions, contribute information and write comments. |
      | **Present a proposal** <br /><br />Test for consensus. | Run a [Sense check proposal](/en/user_manual/polls/proposals/sense_check/). <br /><br />*In the title:* Name the proposal. <br /><br />*In the proposal details:* Clearly frame the proposal and say why it is important.  Include any background information necessary and a link to the proposal.  <br /><br />Invite everyone to respond, and to do so before the proposal closes.  |
      | **Amendment** <br /><br />Discuss, clarify and amend the proposal. <br /><br />Seek to understand and resolve any objections. <br /><br />Invite people objecting to to propose a constructive and practical modification to the proposed decision or course of action. | Facilitate discussion in the thread to address concerns and modify the proposal. |
      | **Agreement** <br /><br />Do you have an agreement?  Check for: <br /><br />Agreement: I support the proposal. <br /><br />Abstain: This decision does not affect me and I am happy with whatever the group decides. <br /><br />Disagreement: Something in the proposal needs to be changed before I can support it. <br /><br />Block: I have a fundamental disagreement with the proposal that cannot be resolved. | Run a [Consensus proposal](/en/user_manual/polls/proposals/consensus/) with the current proposal version. <br /><br />*In the title:* Name the decision to be made. <br /><br />*In the proposal details:* Present the proposal and invite people to vote. <br /><br />Include a clear statement of what agreement means, say 'for this proposal to pass, we need everyone to vote agree' or 'for this proposal to pass, we need 75% of members to agree'.  <br /><br />Ask participants to leave a vote 'Reason' - and if they do not agree to say why, and what needs to change for them to agree. <br /><br />Some organizations also use the Block (or veto) voting option. <br /><br />As voting progresses, respond to comments, post updates, close early, or let the proposal run to conclusion. <br /><br />Participants can *“change vote”* up to proposal close time, say in response to new information that arrives during voting. |
      | **Outcome** <br /><br />State if agreement was reached and the decision that has been made. <br /><br />Implement the decision and plan actions to be taken. | Consider voting results and state the decision made. <br /><br />Summarize results of the process and say what will happen next. <br /><br />If results are inconclusive, you may choose to re-open the discussion and run a new proposal. <br /><br />The outcome statement is an important record of the decision for future reference. |
    translation: |-
      | **Konsensprozess** | **Auf Loomio** |
      |---|---|
      | Du erkennst ein Problem oder eine Möglichkeit und ergreifst die Initiative. |  |
      | **Die Entscheidungsfrage benennen**  <br /><br />Gib Hintergrundinformationen und eröffne eine breite Diskussion, um ein gemeinsames Verständnis zu entwickeln. Achte auf erste Vorschläge. | Starte eine Loomio-Diskussion. <br /><br />Benenne im Titel das Diskussionsthema und das Ziel. <br /><br />Füge Hintergrundinformationen als Anhang oder Link hinzu. Lade andere ein, Fragen zu stellen, Informationen beizutragen und Kommentare zu schreiben. |
      | **Einen Vorschlag vorstellen** <br /><br />Prüfe, ob sich ein Konsens abzeichnet. | Starte einen [Vorschlag zur Sinnesprüfung](/en/user_manual/polls/proposals/sense_check/). <br /><br />*Im Titel:* Benenne den Vorschlag. <br /><br />*In den Vorschlagsdetails:* Beschreibe den Vorschlag klar und erkläre, warum er wichtig ist. Füge nötige Hintergrundinformationen und einen Link zum Vorschlag hinzu. <br /><br />Lade alle ein, vor Ablauf des Vorschlags zu antworten. |
      | **Überarbeitung** <br /><br />Besprecht, klärt und überarbeitet den Vorschlag. <br /><br />Versucht, Einwände zu verstehen und auszuräumen. <br /><br />Bitte Personen mit Einwänden, eine konstruktive und umsetzbare Änderung der vorgeschlagenen Entscheidung oder Vorgehensweise vorzuschlagen. | Modere die Diskussion im Thread, um Bedenken aufzugreifen und den Vorschlag zu überarbeiten. |
      | **Einigung** <br /><br />Besteht Einigkeit? Prüfe die Antworten: <br /><br />Dafür: Ich unterstütze den Vorschlag. <br /><br />Enthaltung: Diese Entscheidung betrifft mich nicht, und ich bin mit der Entscheidung der Gruppe einverstanden. <br /><br />Dagegen: Am Vorschlag muss sich etwas ändern, bevor ich ihn unterstützen kann. <br /><br />Veto: Ich habe einen grundlegenden Einwand gegen den Vorschlag, der sich nicht ausräumen lässt. | Starte einen [Konsensvorschlag](/en/user_manual/polls/proposals/consensus/) mit der aktuellen Fassung. <br /><br />*Im Titel:* Benenne die anstehende Entscheidung. <br /><br />*In den Vorschlagsdetails:* Stelle den Vorschlag vor und lade zur Abstimmung ein. <br /><br />Erkläre klar, welche Zustimmung nötig ist, etwa: „Damit dieser Vorschlag angenommen wird, müssen alle mit Dafür stimmen“ oder „Damit dieser Vorschlag angenommen wird, müssen 75 % der Mitglieder mit Dafür stimmen“. <br /><br />Bitte die Beteiligten, eine „Begründung“ für ihre Stimme anzugeben. Wer nicht zustimmt, sollte erklären, warum und was sich ändern müsste. <br /><br />Manche Organisationen verwenden auch die Abstimmungsoption Veto. <br /><br />Während der Abstimmung kannst du auf Kommentare antworten, Neuigkeiten mitteilen, den Vorschlag vorzeitig schließen oder ihn bis zum geplanten Ende laufen lassen. <br /><br />Die Beteiligten können ihre *„Stimme ändern“*, bis der Vorschlag schließt, etwa wenn während der Abstimmung neue Informationen auftauchen. |
      | **Fazit** <br /><br />Halte fest, ob eine Einigung erzielt wurde und welche Entscheidung getroffen wurde. <br /><br />Setze die Entscheidung um und plane die nächsten Schritte. | Sieh dir die Abstimmungsergebnisse an und halte die Entscheidung fest. <br /><br />Fasse die Ergebnisse des Prozesses zusammen und erkläre, was als Nächstes geschieht. <br /><br />Wenn die Ergebnisse nicht eindeutig sind, kannst du die Diskussion erneut öffnen und einen neuen Vorschlag starten. <br /><br />Das Fazit hält die Entscheidung fest und kann später als Referenz dienen. |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
