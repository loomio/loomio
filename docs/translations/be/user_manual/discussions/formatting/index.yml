  7bda51ac3285357f:
    english: When starting or editing a discussion or poll, or writing a comment, you will see a formatting bar below the text field. Select the arrow at the end of the bar to show or hide the full set of tools.
    translation: Калі вы пачынаеце або рэдагуеце абмеркаванне ці апытанне або пішаце каментарый, пад тэкставым полем з'яўляецца панэль фарматавання. Націсніце стрэлку ў канцы панэлі, каб паказаць або схаваць усе інструменты.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2f2944ad10684b7f:
    english: Hover the mouse or cursor over each item for the name of each tool.
    translation: Навядзіце паказальнік на інструмент, каб убачыць яго назву.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5f45a085deb9eff1:
    english: Use formatting to add structure and emphasis so information is easier to scan.
    translation: Выкарыстоўвайце фарматаванне, каб упарадкаваць і вылучыць інфармацыю. Так яе лягчэй праглядаць.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
