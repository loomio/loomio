    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0bd69f7ef1a85ec1:
    english: Use the sidebar to open your dashboard, polls awaiting your vote, unread and direct discussions, tasks, and groups. It also links to the user manual and support.
    translation: На бічній панелі можна відкрити панель огляду, опитування, що очікують вашого голосу, непрочитані та прямі обговорення, завдання й групи. Там також є посилання на посібник користувача та підтримку.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  45a5b7ceb512d86c:
