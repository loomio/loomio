    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '085bd9dfce8144dc':
    english: "**Members** - The people who belong to the group."
    translation: "**Jäsenet** - Ryhmään kuuluvat ihmiset."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cfdb369a7fd6e14f:
    english: "**Files** - Documents and other files attached throughout the group. The tab collects files from discussion contexts, comments, proposals, and polls, so you can find a document without remembering where it was attached."
    translation: "**Tiedostot** - Ryhmän eri puolille liitetyt asiakirjat ja muut tiedostot. Välilehti kokoaa yhteen keskustelujen aloituksiin, kommentteihin, ehdotuksiin ja kyselyihin liitetyt tiedostot. Löydät asiakirjan, vaikka et muistaisi, mihin se liitettiin."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
