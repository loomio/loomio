      helptext: "<p>Гэта прывядзе да выдалення «Кантрольнага спісу пачатку працы» з загалоўка акна.</p><p> Калі вы захочаце вярнуць яго пазней, вы можаце <b>паказаць парады па адаптацыі</b> ў наладах бакавой панэлі.</p>"
    group:
      invite_people:
        title: Запрасіць людзей у групу
      start_a_discussion:
        title: Пачаць абмеркаванне
        helptext: "<p>Стварыце абмеркаванне, якое людзі ўбачаць пасля таго, як прымуць запрашэнне.</p><p> Мэта складаецца ў тым, каб заахвоціць людзей напісаць свой першы каментар у Loomio.</p><p> Каб спрасціць гэта, мы падрыхтавалі шаблон <b>для практычнага абмеркавання,</b> які вы можаце выкарыстоўваць.</p>"
        submit: Глядзіце шаблоны абмеркаванняў
      start_a_proposal:
        title: Пачаць прапанову
        helptext: "<p>Выкарыстоўвайце прапанову, каб апісаць план дзеянняў, і папрасіце зваротную сувязь праз галасаванне.</p><p> Па меры паступлення галасоў вы ўбачыце падтрымку, праблемы і магчымасці для яго ўдасканалення.</p><p> Паспрабуйце стварыць прапанову зараз, выкарыстоўваючы шаблон практычнай прапановы.</p>"
        submit: Глядзіце шаблоны прапаноў
      share_an_outcome:
        title: Падзяліцеся высновай прапановы
        helptext: "<p>Калі надыходзіць тэрмін падачы прапановы, галасаванне завяршаецца, і вам будзе прапанавана падзяліцца высновай.</p><p>Выснова — гэта тлумачэнне вашага рашэння (ці таго, што будзе далей) пасля прагляду галасоў і каментарыяў.</p><p>Калі тэрмін яшчэ не мінуў, але вы гатовыя рухацца далей, вы можаце <b>закрыць датэрмінова</b>.</p>"
        submit: Праглядзець прапанову
        cancel: Зрабіць гэта пазней
