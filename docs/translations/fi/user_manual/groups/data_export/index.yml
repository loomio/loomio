    translation: Napsauta keskusteluvalikon kolmea pistettä (⋯) ja valitse **Tulosta**. Loomio luo HTML-sivun, jonka voit tulostaa tai tallentaa PDF-tiedostona selaimesi tulostustoiminnolla.
    status: machine
