      | `org_id` | Restrict results to a visible parent group and its visible subgroups. Use `0` for direct discussions |
      | `type` | Restrict results to one type: `Discussion`, `Comment`, `Poll`, `Stance`, or `Outcome` |
      | `types` | Comma-separated list of result types |
      | `tag` | Restrict results to topics with this tag |
      | `author_id` | Restrict results to content by one author. Without `query`, returns that author's recent visible activity |
      | `order` | Set to `authored_at_desc` to order matching content by authoring time |
    translation: |-
      | Naam | Beschrijving |
      | --- | --- |
      | `query` | Zoektekst. Exacte en benaderende overeenkomsten worden ondersteund |
      | `group_id` | Beperk de resultaten tot één zichtbare groep |
      | `org_id` | Beperk de resultaten tot een zichtbare hoofdgroep en de zichtbare subgroepen daarvan. Gebruik `0` voor directe discussies |
      | `type` | Beperk de resultaten tot één type: `Discussion`, `Comment`, `Poll`, `Stance` of `Outcome` |
      | `types` | Lijst met resultaattypen, gescheiden door komma's |
      | `tag` | Beperk de resultaten tot topics met dit label |
      | `author_id` | Beperk de resultaten tot inhoud van één auteur. Zonder `query` wordt de recente zichtbare activiteit van die auteur geretourneerd |
      | `order` | Stel in op `authored_at_desc` om overeenkomende inhoud te sorteren op aanmaaktijd |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  00e046b622446633:
    english: The response contains a `search_results` array. Each result identifies the matched record and its visible context with fields including `searchable_type`, `searchable_id`, `highlight`, `group_id`, `group_name`, `discussion_key`, `poll_key`, `author_id`, `author_name`, `authored_at`, and `tags`. Fields that do not apply to a result are `null`.
    translation: Het antwoord bevat een array met `search_results`. Elk resultaat vermeldt het gevonden record en de zichtbare context ervan, met onder meer de velden `searchable_type`, `searchable_id`, `highlight`, `group_id`, `group_name`, `discussion_key`, `poll_key`, `author_id`, `author_name`, `authored_at` en `tags`. Velden die niet van toepassing zijn op een resultaat, hebben de waarde `null`.
