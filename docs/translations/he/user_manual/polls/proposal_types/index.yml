  d370759001be4e21:
    english: Polls collect selections, scores, allocations, rankings, availability, or election ballots. Choose the voting method based on what participants need to express and how you intend to use the result. Use a [Proposal](/en/user_manual/polls/proposals/) when people need to respond to a statement or course of action.
    translation: סקרים מאפשרים לאסוף בחירות, ציונים, חלוקת נקודות, דירוגים, זמינות או פתקי הצבעה לבחירות. יש לבחור את שיטת ההצבעה לפי מה שהמשתתפים צריכים להביע ולפי אופן השימוש בתוצאה. כשצריך להגיב להצהרה או לדרך פעולה, יש להשתמש ב[הצעה](/en/user_manual/polls/proposals/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1132ff680c7b2562:
    english: "## Simple poll"
    translation: "## סקר פשוט"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6b957bf5630c1470:
    english: "[Choose](/en/user_manual/polls/choose/) lets participants select one or more options. Use it to find the most popular option or make a shortlist."
    translation: "[בחירה](/en/user_manual/polls/choose/) מאפשרת לבחור אפשרות אחת או יותר. ניתן להשתמש בה כדי למצוא את האפשרות הפופולרית ביותר או להכין רשימה מצומצמת."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c982974685e1b5d6:
    english: "## Score poll"
    translation: "## סקר ציון"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fbbfe14196388606:
    english: "[Score](/en/user_manual/polls/score/) lets participants rate every option on the same scale. Use it to compare the strength of support, readiness, suitability, or importance across options."
    translation: "[ציון](/en/user_manual/polls/score/) מאפשר לתת לכל אפשרות ציון באותו סולם. ניתן להשתמש בו כדי להשוות בין אפשרויות לפי מידת התמיכה, המוכנות, ההתאמה או החשיבות שלהן."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0465fcb48a56ca78:
    english: "## Dot vote"
    translation: "## הצבעת נקודות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ffb7d1711a5fca3b:
    english: "[Allocate](/en/user_manual/polls/allocate/) gives each participant a fixed budget of points to distribute. Use it to identify priorities when choosing one thing means giving less attention or resources to another."
    translation: "[הקצאה](/en/user_manual/polls/allocate/) מעניקה לכל משתתף מספר קבוע של נקודות לחלוקה. ניתן להשתמש בה כדי לזהות סדרי עדיפויות כאשר בחירה בדבר אחד משאירה פחות תשומת לב או משאבים לדבר אחר."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a1b15c28fbe526f6:
    english: "## Ranked choice"
    translation: "## דירוג אפשרויות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8811f455b7ab3821:
    english: "[Rank](/en/user_manual/polls/rank/) lets participants arrange options in order of preference. Use it to find the group's overall preferred order or select one leading option."
    translation: "[דירוג](/en/user_manual/polls/rank/) מאפשר לסדר אפשרויות לפי סדר העדפה. ניתן להשתמש בו כדי למצוא את סדר ההעדפות הכולל של הקבוצה או לבחור אפשרות מובילה אחת."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2e21bb1b54b6fcf9:
    english: "## Time poll"
    translation: "## סקר זמן"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb768f07eb0d1971:
    english: "[Time poll](/en/user_manual/polls/meeting_polls/) lets participants indicate when they are available. Use it to schedule a meeting or event across time zones."
    translation: "[סקר זמן](/en/user_manual/polls/meeting_polls/) מאפשר למשתתפים לציין מתי הם זמינים. ניתן להשתמש בו לתיאום פגישה או אירוע בין אזורי זמן."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6333ad0ee6d54609:
    english: "## STV Election"
    translation: "## בחירות STV"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6f93c6ad598d809c:
    english: "[STV Elections](/en/user_manual/polls/stv/) let participants rank candidates in a proportional, multi-winner election. Use STV to elect a committee, board, or group of delegates."
    translation: "[בחירות STV](/en/user_manual/polls/stv/) מאפשרות למשתתפים לדרג מועמדים בבחירות יחסיות שבהן נבחרים כמה מועמדים. ניתן להשתמש ב-STV לבחירת ועדה, דירקטוריון או קבוצת נציגים."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6752a750a7703b58:
    english: "## Other specialized method"
    translation: "## שיטה ייעודית נוספת"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '099449b0e1fe4f85':
    english: Loomio also includes a Question round for collecting questions without voting. Group administrators can make it available from [Poll templates](/en/user_manual/polls/poll_templates/).
    translation: Loomio כוללת גם סבב שאלות לאיסוף שאלות ללא הצבעה. מנהלי קבוצות יכולים להפעיל אותו דרך [תבניות סקר](/en/user_manual/polls/poll_templates/).
    status: machine
