  b27fab33a1dd5176:
    english: 'These guides explain complete decision processes: how to frame a decision, involve the right people, use discussion and proposals, respond to concerns, and record an outcome.'
    translation: 'Ezek az útmutatók a teljes döntéshozatali folyamatot mutatják be: hogyan fogalmazd meg a döntést, vond be az érintetteket, használj beszélgetéseket és javaslatokat, válaszolj az aggályokra, és rögzítsd a következtetést.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bcbe5e3fd75700a6:
    english: They are different from the proposal-template pages. A [proposal template](/en/user_manual/polls/proposals/) explains one proposal and its response options. A decision process can use several proposals over time.
    translation: Ezek különböznek a javaslatsablonokról szóló oldalaktól. Egy [javaslatsablon](/en/user_manual/polls/proposals/) egy adott javaslatot és a válaszlehetőségeit mutatja be. Egy döntéshozatali folyamatban idővel több javaslatot is használhatsz.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  af00d65d38e41f8b:
    english: "## Choose a process"
    translation: "## Válassz folyamatot"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f41e345421a1a1e8:
    english: |-
      | Process | Who decides? | Main question |
      |---|---|---|
      | [Simple decision process](simple_decision_process) | Defined by the group | How can we discuss, test, and decide? |
      | [Advice process](advice_process) | A person or delegated team | What advice should the decision maker consider? |
      | [Consent process](consent_process) | The group | Is the proposal safe to try without a meaningful objection? |
      | [Consensus process](consensus_process) | The group | Can we reach collective agreement? |
    translation: |-
      | Folyamat | Ki dönt? | Fő kérdés |
      |---|---|---|
      | [Egyszerű döntéshozatali folyamat](simple_decision_process) | A csoport által meghatározott személyek | Hogyan beszéljük meg, próbáljuk ki és hozzuk meg a döntést? |
      | [Tanácskérési folyamat](advice_process) | Egy személy vagy megbízott csapat | Milyen tanácsokat vegyen figyelembe a döntéshozó? |
      | [Beleegyezésen alapuló folyamat](consent_process) | A csoport | Kipróbálható a javaslat érdemi kifogás nélkül? |
      | [Konszenzusos folyamat](consensus_process) | A csoport | El tudunk jutni közös egyetértésre? |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d2843889568043c0:
    english: Use the process required by your group's governing rules or decision policy. Different kinds of decisions may use different processes.
    translation: A csoportod működési szabályzata vagy döntéshozatali rendje által előírt folyamatot használd. Különböző döntésekhez különböző folyamatok illenek.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bb120914edd79d13:
    english: If you only need help choosing a response format, compare [Proposals](/en/user_manual/polls/proposals/) and [Polls](/en/user_manual/polls/proposal_types/). If you administer the reusable choices shown when someone selects **Start a vote**, see [Poll templates](/en/user_manual/polls/poll_templates/).
    translation: Ha csak a válaszadás formájának kiválasztásához kell segítség, hasonlítsd össze a [Javaslatokat](/en/user_manual/polls/proposals/) és a [Szavazásokat](/en/user_manual/polls/proposal_types/). Ha te kezeled a **Szavazás indítása** kiválasztásakor megjelenő, újra felhasználható lehetőségeket, olvasd el a [Szavazási sablonok](/en/user_manual/polls/poll_templates/) oldalt.
