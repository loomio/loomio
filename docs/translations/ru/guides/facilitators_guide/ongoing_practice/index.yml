---
navigation_title: Постоянное совершенствование
blocks:
  508e19e18ba4a97e:
    english: "# Ongoing Practice"
    translation: "# Постоянное совершенствование"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fba51c92285b31c7:
    english: "## Continuous Improvement"
    translation: "## Постоянное совершенствование"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  121b4afb86de3c31:
    english: No matter how amazing a group or facilitator is, they can always improve. If they incrementally head in a good direction they will get to a better place. Incremental improvement requires an effective protocol for meta-conversation (talking about how you collaborate). With it, anything is possible. Without it, you stagnate.
    translation: 'Какими бы опытными ни были группа и ведущий, они всегда могут работать лучше. Небольшие шаги в верном направлении со временем приводят к заметным изменениям. Для этого нужен способ обсуждать само сотрудничество: как вы работаете вместе. Такой разговор помогает менять подход. Без него развитие останавливается.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  331d258dee610e96:
    english: There are many approaches to continuous improvement, but they all create space for reflection and feedback, and a way to make changes in response. For teams that work together on an ongoing basis, they might employ a methodology like <a href="https://en.wikipedia.org/wiki/Scrum_(software_development)" target="_blank">scrum</a>, including retrospectives and regular process improvements. For a one-off session, a facilitator might simply follow up with a request for feedback.
    translation: Есть много способов постоянно совершенствовать совместную работу. Все они дают возможность осмыслить опыт, получить обратную связь и внести изменения. Команды, которые работают вместе долгое время, могут использовать методику вроде <a href="https://en.wikipedia.org/wiki/Scrum_(software_development)" target="_blank">скрама</a> с ретроспективами и регулярным улучшением процессов. После одной встречи ведущий может просто попросить участников поделиться отзывами.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aabfa9d842af2688:
    english: On Loomio
    translation: В Loomio
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ac2f489368566562:
    english: |-
      * People use Loomio itself to talk about how they use Loomio. It provides an obvious platform to “talk about the talking”.
      * The process of joining Loomio causes groups to reflect on many aspects of their collaboration and decision-making process, which creates the opportunity to improve.
    translation: |-
      * Участники используют Loomio, чтобы обсуждать, как они используют Loomio. Здесь удобно говорить о самом ходе обсуждений.
      * Присоединяясь к Loomio, группы задумываются о том, как они сотрудничают и принимают решения. Это даёт возможность улучшить совместную работу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7b11f212a312312e:
    english: "## Distributed Facilitation / Self-facilitation"
    translation: "## Распределённое ведение встреч и самостоятельная фасилитация"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1e385970a624bf63:
    english: As a group becomes more experienced, more individuals build capacity for facilitation. Facilitation can cease to be a role held by a specific person, and become more of a function that can be distributed. Anyone can take acts of facilitation, and a dance of give and take, leading and following, can emerge among participants. For groups with aspirations toward shared leadership and non-hierarchy, this is a very important thing to encourage.
    translation: По мере накопления опыта в группе всё больше участников учатся вести совместную работу. Ведение перестаёт быть ролью одного человека и становится общей задачей. Каждый может помочь группе двигаться вперёд. Участники по очереди предлагают направление и поддерживают инициативы друг друга. Это особенно важно для групп, которые стремятся к совместному лидерству и работе без иерархии.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fa78b242f7390326:
    english: 'People who are less used to taking acts of facilitation can be supported with education, invitations, and suggestions of first steps. Some examples of acts of facilitation almost anyone can be encouraged to try:'
    translation: 'Тем, кто пока редко берёт на себя такую роль, помогут обучение, приглашение к участию и простые первые шаги. Вот действия, которые может попробовать почти каждый:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1f490f466a1893ed:
    english: |-
      * reflecting back what you’re hearing or summarising
      * inviting others to contribute
      * asking questions to enhance collective understanding
      * noticing who is and is not participating
      * appreciating contributions explicitly
    translation: |-
      * повторить своими словами услышанное или подвести итог
      * пригласить других высказаться
      * задать вопросы, которые помогут всем лучше понять тему
      * обратить внимание на то, кто участвует в разговоре, а кто нет
      * прямо поблагодарить людей за их вклад
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e2eed897e0f564d2:
    english: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../silvia_200.png"> You don’t need an agenda to be a facilitator. Facilitating is just about making a group situation easy. Next time you’re at a family gathering, party or morning tea: approach it like a facilitator and make sure everybody in the group feels included and able to participate. — Silvia Zuur'
    translation: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../silvia_200.png"> Чтобы помогать группе, вам не нужна повестка встречи. Достаточно сделать участие в общем деле проще. На следующем семейном собрании, вечеринке или встрече за чаем попробуйте помочь каждому почувствовать себя частью компании и включиться в разговор. — Сильвия Зуур'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  180b1232871c44c4:
    english: Distributed facilitation can work beautifully, but it can also cause people to step all over each other. At first, it’s awkward as people learn the dance. It’s important to differentiate between distributed facilitation (peers helping the collective), “facipulation” (manipulating the group toward your own agenda), and backseat facilitation (taking acts of facilitation when you do not have the mandate).
    translation: Распределённое ведение может хорошо работать, но участники могут и мешать друг другу. Сначала им бывает трудно согласовать свои действия. Важно различать помощь группе со стороны равных участников, «фасипуляцию» — попытку направить группу к собственной цели — и вмешательство в ведение процесса без соответствующих полномочий.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ea5faa685be1ceae:
    english: Consciously decide when peer facilitation is a good choice, and when a specific facilitator is called for. In certain situations, such as a high-conflict discussion where a specified neutral party is needed, or there is a lack of trust, distributed facilitation might not work.
    translation: Обдумайте, когда участники могут вести процесс совместно, а когда нужен отдельный ведущий. Например, при остром конфликте может понадобиться нейтральный человек. При недостатке доверия распределённое ведение тоже может не сработать.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d6df5458ecb8e45:
    english: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../rich_200.png"> Acts of facilitation are not just for the manager, or the person who called the meeting — they are for everyone. — Richard Bartlett'
    translation: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../rich_200.png"> Помогать группе вести разговор могут не только руководитель или организатор встречи. Это может делать каждый. — Ричард Бартлетт'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c3215e63fca09b79:
    english: "## Translating this into Loomio"
    translation: "## Как применять это в Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  35ce75e6810e0611:
    english: |-
      * The online space is uniquely suited to distributed facilitation. Different people can come along at different points depending on what they notice and their skill set.
      * An online discussion is by default a distributed collaboration among peers. Any other setup requires explicit design. This is the opposite of offline spaces where the default is that someone called a meeting and distributing the role requires proactivity.
      * Loomio is designed with a group of equals in mind. In many ways, a distributed facilitation approach is the best fit for the tool.
      * Current Loomio users do peer facilitation all the time, whether they realize that’s what they are doing or not. Simple things like suggesting someone raise a proposal, tagging people, summarising the process so far, etc, are all acts of facilitation.
    translation: |-
      * Онлайн-пространство хорошо подходит для распределённого ведения. Разные люди могут подключаться на разных этапах в зависимости от того, что они заметили и что умеют.
      * Онлайн-обсуждение по умолчанию строится на совместной работе равных участников. Другой порядок нужно установить специально. На очной встрече обычно есть организатор, и для распределения роли ведущего требуются дополнительные усилия.
      * Loomio создан для групп, в которых участники равны. Поэтому распределённое ведение хорошо сочетается с возможностями сервиса.
      * Пользователи Loomio постоянно помогают друг другу вести процесс, даже если не называют это фасилитацией. Предложить кому-то создать предложение, упомянуть участников или подвести промежуточный итог — всё это способы помочь группе.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  efde81539c545bae:
    english: "## The Art of Being Facilitated"
    translation: "## Умение принимать помощь ведущего"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  93ed1980d0cc95b4:
    english: Like the skill of being the follow in a ballroom dance pair, being facilitated is an art itself. People with experience facilitating themselves, or who have participated in a lot of well-facilitated processes, will receive facilitation differently than those who haven't.
    translation: Как и умение следовать за партнёром в танце, умение принимать помощь ведущего требует практики. Люди, которые сами вели группы или участвовали в хорошо организованных процессах, воспринимают такую помощь иначе, чем те, у кого нет подобного опыта.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d2bcd9f07f5bd25b:
    english: On the positive side, skillful receptivity to facilitation is a capacoty that can be grown, and it can have a big impact on group success. This ranges from things as simple as showing up on time, to following instructions, to being willing to try a new style of thinking or communicating. Sometimes people have a good experience and they don’t quite know why — pointing out that facilitation is the reason for the smoothness or depth can help them understand what it is they valued about the process.
    translation: 'Умение откликаться на действия ведущего можно развивать. Оно заметно влияет на успех группы. Начать можно с простого: приходить вовремя, следовать инструкциям, пробовать новые способы думать и общаться. Иногда людям нравится совместная работа, но они не понимают почему. Если показать, как ведение помогло сделать процесс последовательным или разговор глубоким, им будет проще понять, что именно они ценят.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  87345b383ccba81d:
    english: On the negative side, people who can’t or won’t be facilitated can be detrimental to group collaboration. No matter how skilled a facilitator is, if they encounter a certain level of resistance they won’t be able to do their job. Common problems include dominating the discussion, playing devil’s advocate, disrupting the process, disrespecting the facilitator or participants, or being disengaged. At some level individuals must take responsibility for their willingness to be facilitated.
    translation: Если участники не могут или не хотят следовать общему процессу, совместной работе становится труднее. Даже опытный ведущий не справится с сильным сопротивлением. Например, кто-то может перехватывать разговор, постоянно возражать ради спора, нарушать порядок работы, проявлять неуважение к ведущему или участникам либо отстраняться от обсуждения. Каждый в какой-то мере отвечает за свою готовность участвовать в общем процессе.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c096fd0a7e12ddd4:
    english: |-
      * With a little practice, most users quickly upskill on being responsive to acts of facilitation on Loomio, such as replying when @mentioned.
      * Taking acts of facilitation on Loomio helps people become more responsive to facilitation themselves.
      * Because everything is archived, users can see past acts of facilitation “frozen in time”, gaining the benefits of observing them without having been there.
    translation: |-
      * После небольшой практики большинство пользователей быстро учатся откликаться на действия ведущего в Loomio, например отвечать на упоминания через @.
      * Помогая вести процесс в Loomio, люди сами лучше учатся принимать такую помощь.
      * Поскольку всё сохраняется в архиве, пользователи могут увидеть, как другие помогали вести процесс раньше, и извлечь из этого пользу, даже если тогда не участвовали.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f930b325aaedb19a:
    english: "## Culture Change"
    translation: "## Изменение культуры"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  82936abec2b50e3f:
    english: A collaborative, participatory culture is something that emerges over time, with lots of practice and trial and error. Understanding, valuing, and inviting facilitation can play a pivotal role in this cultural emergence. Facilitation can evolve from a role, to a function, to a mindset. A truly collaborative culture is one where everyone is facilitating everyone in myriad different ways.
    translation: Культура сотрудничества и участия складывается со временем, через практику, пробы и ошибки. Если люди понимают ценность ведения совместной работы и приглашают других к этой роли, такая культура развивается быстрее. Ведение может превратиться из роли в общую задачу, а затем — в привычный подход. В культуре сотрудничества каждый по-разному помогает другим участвовать.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  898bf6557380a042:
    english: Is the company party participatory? Does the office potluck just happen like magic? Are ideas able to emerge from anywhere, evolve through many brains and hands, and get implemented in a way better than anyone first imagined?
    translation: Могут ли все участвовать в корпоративном празднике? Как организуется общий обед в офисе? Могут ли идеи возникать у любого человека, развиваться благодаря усилиям многих и воплощаться лучше, чем кто-либо представлял вначале?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f4964381b3c6dc7b:
    english: Deep culture change is when the culture of collaboration starts to leak out of specific “collaboration” spaces and shows up in every aspect of the organization. Collaboration is not about post-it notes and check-ins, but the very timbre of organizational life.
    translation: Глубокие изменения происходят, когда сотрудничество выходит за пределы специально отведённых для него встреч и становится частью всей работы организации. Оно проявляется не только в заметках на стикерах и регулярных встречах, но и в повседневной жизни организации.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6962aa4815c01b0f:
    english: |-
      * The [theory of change of Loomio](http://www.loomio.com/about) is that more groups practicing effective, inclusive decision making can change organizational dynamics at a global scale. This shows up in everything about how the tool is designed and [how we run as a co-op](http://loomio.coop). Ultimately, it’s about culture change through collaborative practice.
      * Loomio groups have experienced evolving culture through the tool. Like groups that already has a collaborative culture scale while holding onto that, or a participatory group continuing to exists instead of imploding due to challanges around inclusive decicion-making.
      * Loomio makes a certain kind of “new normal” of collaborative practice possible, through making collaborative practice more accessible and achievable.
    translation: |-
      * Согласно [теории изменений Loomio](http://www.loomio.com/about), если больше групп будут принимать решения эффективно и с участием всех заинтересованных людей, это сможет изменить работу организаций во всём мире. Эта идея отражена и в устройстве сервиса, и в том, [как устроен наш кооператив](http://loomio.coop). Цель — менять культуру через практику сотрудничества.
      * Группы в Loomio наблюдали, как меняется их культура. Одни смогли вырасти и сохранить совместный подход к работе. Другим участие всех в принятии решений помогло продолжить работу, несмотря на возникающие трудности.
      * Loomio помогает сделать совместную работу привычной практикой, поскольку пользоваться такими подходами становится проще.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3f2cee633e8b83c2:
    english: For inspiration about Ongoing Practice, check out [stories of Loomio groups](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help).
    translation: Больше примеров постоянного совершенствования вы найдёте в [историях групп Loomio](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
