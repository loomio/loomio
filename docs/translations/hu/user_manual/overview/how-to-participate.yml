navigation_title: Hogyan vehetsz részt
blocks:
  b07064bf98055393:
    english: "# How to participate"
    translation: "# Hogyan vehetsz részt"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c121de54fbe72331:
    english: 'Once signed in to a Loomio group you have been invited to, you can participate in a Loomio discussion or decision.  '
    translation: Ha bejelentkeztél egy Loomio-csoportba, amelybe meghívtak, részt vehetsz a beszélgetésekben és a döntésekben.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9bb48e2f2f1858af:
    english: Read on to see  how to write a comment in a thread and how to vote in a poll.
    translation: Itt megtudhatod, hogyan írhatsz hozzászólást egy témában, és hogyan szavazhatsz.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '095ec081a6f1d74e':
    english: "## Comment"
    translation: "## Hozzászólás"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d5dadbc416d8603a:
    english: You can write a comment in a thread, and people can reply, react or post their own comment to continue the discussion.
    translation: Hozzászólhatsz egy témához. Mások válaszolhatnak, reagálhatnak vagy saját hozzászólást írhatnak, így folytatódhat a beszélgetés.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  250f7bc0e6e6c93c:
    english: 'When you have written your text, use **Post Comment** to instantly publish the comment. Your comment will be visible to anyone who has permission to see the thread. '
    translation: Ha megírtad a szöveget, a **Hozzászólás** gombbal azonnal közzéteheted. A hozzászólásodat mindenki láthatja, aki hozzáfér a témához.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  76a3378441f45ebf:
    english: "### Reply to a comment"
    translation: "### Válasz egy hozzászólásra"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c3495aed9ac78348:
    english: You can reply to someone's comment by clicking on the reply icon beneath the comment.
    translation: Ha válaszolni szeretnél valakinek, kattints a hozzászólása alatti válasz ikonra.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b2698ab73e65442c:
    english: Your reply is published in the thread and an email notification is sent to the author of the comment.
    translation: A válaszod megjelenik a témában, a hozzászólás szerzője pedig e-mailes értesítést kap.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  04743dedbee0de5c:
    english: "### Get someone's attention"
    translation: "### Hívd fel valaki figyelmét"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  455fea8aa593dad4:
    english: You can notify people when you write a comment.
    translation: Hozzászólás írásakor értesíthetsz másokat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  316ef3257eaebd54:
    english: "### Reactions"
    translation: "### Reakciók"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4b68204cf35c85f1:
    english: Reacting to a comment is a great way to encourage and acknowledge a comment by letting the comment author know how you feel.  It is a quick and light-weight way to participate that does not require any text, nor send an email. Click the smile emoji icon beneath a comment to leave an emoji reaction.
    translation: 'Egy reakcióval visszajelzést adhatsz a hozzászólás szerzőjének. Ez gyors módja a részvételnek: nem kell szöveget írnod, és nem küld e-mailt. Ha emojival szeretnél reagálni, kattints a hozzászólás alatti mosolygós ikonra.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Szavazás"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4432b9c5b263014a:
    english: You may receive an invitation to vote in a poll via email or by notification in Loomio. Click on the link in the email to vote.
    translation: Szavazásra e-mailben vagy Loomio-értesítésben kaphatsz meghívást. Ha e-mailt kaptál, kattints a benne lévő hivatkozásra a szavazáshoz.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2a8641a22cf13597:
    english: Voting is easy, just click or tap on the icon of your choice.
    translation: A szavazáshoz kattints vagy koppints a választott lehetőség ikonjára.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  00d6e2698ade53cc:
    english: There are many types of polls. The example below shows a typical proposal with voting options of **Agree**, **Abstain** or **Disagree**. Other options may be available.
    translation: Többféle szavazás létezik. Az alábbi példa egy javaslatot mutat, amelynél az **Egyetért**, **Tartózkodik** vagy **Nem ért egyet** lehetőségre szavazhatsz. Más lehetőségek is elérhetők lehetnek.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4f327c4a766af0ab:
    english: Read the poll, and any attached files, then cast your vote by selecting one of the options.
    translation: Olvasd el a szavazás szövegét és a csatolt fájlokat, majd válassz egy lehetőséget.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2cf633f37997e8b8:
    english: "### State a reason"
    translation: "### Indoklás"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c976385dcb75f67b:
    english: When voting, you can also leave a **Reason** to say why you have voted this way. This is optional.
    translation: Szavazáskor az **Ok** mezőben azt is leírhatod, miért így szavaztál. Ez nem kötelező.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6d0d884b0832dda9:
    english: "### Change your vote"
    translation: "### A szavazatod módosítása"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  84629138984e43d0:
    english: You can **change your vote**, up until the proposal closes.
    translation: A javaslat lezárásáig **megváltoztathatod a szavazatodat**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8fcddbe7856e926b:
    english: There are many reasons why you might want to change your vote. For example if new information emerges it may cause you to rethink your decision, and change your vote.
    translation: Több okból is megváltoztathatod a szavazatodat. Például új információk hatására újragondolhatod a döntésedet.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f7078b517c8bfed8:
    english: Once again, you can leave a reason to say why you have changed your vote.
    translation: Azt is leírhatod, miért változtattad meg a szavazatodat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8e1b2953471f22ba:
    english: "### Results"
    translation: "### Eredmények"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2153df12cd2b4fe2:
    english: Results of the proposal are updated as people vote, so you can see how a proposal is trending.
    translation: A javaslat eredményei minden szavazattal frissülnek, így láthatod, hogyan alakul a támogatottsága.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  229571fe36c571b0:
    english: 'In a controversial proposal it is common to see mixed results, however this does not mean the proposal has failed.  '
    translation: Egy megosztó javaslatnál gyakori a vegyes eredmény, de ez nem jelenti azt, hogy a javaslat megbukott.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c3d5e53684bf3e88:
    english: Often the new information revealed during the proposal helps form a better proposal that is more likely to pass.
    translation: A javaslatról szóló vita során felmerülő új információk gyakran segítenek egy jobb, nagyobb eséllyel elfogadható javaslat kidolgozásában.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b4783489f09ccf19:
    english: "### Outcome"
    translation: "### Következtetés"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  592f419764241ef6:
    english: When the proposal closes, the author is prompted to state the **Outcome**.
    translation: A javaslat lezárásakor a rendszer felkéri a szerzőt, hogy írja meg a **Következtetés** szövegét.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0fae106181bbc6ac:
    english: This is an important final step to record the result of the decision and let everyone know what will happen next.
    translation: Ez a záró lépés rögzíti a döntés eredményét, és mindenki számára világossá teszi, mi történik ezután.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
