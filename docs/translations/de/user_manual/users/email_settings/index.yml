---
navigation_title: Benachrichtigungen
blocks:
  3a65b66c581936a1:
    english: "# Notifications"
    translation: "# Benachrichtigungen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c343eb5a1db968d8:
    english: Notifications help groups maintain momentum by drawing your attention to discussions and decisions that need a response.
    translation: Benachrichtigungen machen dich auf Diskussionen und Entscheidungen aufmerksam, bei denen eine Antwort gebraucht wird. So können Gruppen ihre Arbeit fortsetzen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3d7b27f3b9880973:
    english: 'Notifications are often the starting point when you return to Loomio. They let you know when:'
    translation: 'Wenn du zu Loomio zurückkehrst, sind Benachrichtigungen oft dein Ausgangspunkt. Sie zeigen dir, wenn:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c4aec8fcb9fbc0de:
    english: |-
      - someone mentions you or replies to something you wrote
      - a new discussion is shared with you
      - you are invited or reminded to vote
      - a poll is closing soon
      - an outcome is announced
    translation: |-
      - dich jemand erwähnt oder auf etwas antwortet, das du geschrieben hast
      - eine neue Diskussion mit dir geteilt wird
      - du zur Abstimmung eingeladen oder daran erinnert wirst
      - eine Abstimmung bald endet
      - ein Fazit bekannt gegeben wird
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  792dcad0f81e8cc5:
    english: Loomio's notification settings let you choose how closely you want to follow each group or thread. Notifications remain available in Loomio, so you can review what needs your attention when you are ready.
    translation: In den Benachrichtigungseinstellungen von Loomio legst du fest, wie genau du einer Gruppe oder einem Thread folgen möchtest. Die Benachrichtigungen bleiben in Loomio verfügbar. Du kannst sie durchsehen, wenn du Zeit dafür hast.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '082fae961275aaaf':
    english: "## Two ways to begin"
    translation: "## Zwei Möglichkeiten für den Einstieg"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cbea008bb7c0ee02:
    english: 'Most people can start with one of two approaches:'
    translation: 'Für den Einstieg eignen sich meist zwei Einstellungen:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3349bdb53fc33195:
    english: |-
      - **When notified** — receive an email when someone asks for your attention, and include everything else in your daily catch-up. Start here if you are still learning how your group uses Loomio.
      - **Once per day** — set Email to **Catch-up only** and keep your catch-up set to **Every day**. Your notifications and other unread activity will be delivered together in one email.
    translation: |-
      - **Bei Benachrichtigung** — du erhältst eine E-Mail, wenn jemand deine Aufmerksamkeit braucht. Alles andere erscheint in deiner täglichen Zusammenfassung. Beginne damit, wenn du noch lernst, wie deine Gruppe Loomio nutzt.
      - **Einmal täglich** — stelle E-Mail auf **Nur zum Aufholen** und die Zusammenfassung auf **Täglich**. Deine Benachrichtigungen und andere ungelesene Aktivitäten kommen gemeinsam in einer E-Mail an.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  74e84c4946aa3713:
    english: New accounts start with **When notified** and a daily catch-up. This brings mentions, replies, discussions shared with you, invitations and reminders to vote, polls closing soon, and outcomes to your attention as they happen without sending an immediate update about every comment or vote.
    translation: Neue Konten beginnen mit **Bei Benachrichtigung** und einer täglichen Zusammenfassung. So erfährst du sofort von Erwähnungen, Antworten, mit dir geteilten Diskussionen, Einladungen und Erinnerungen zur Abstimmung, bald endenden Abstimmungen und Fazits. Du erhältst aber nicht für jeden Kommentar und jede Stimme sofort eine Nachricht.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  896722cbb87e98be:
    english: If you would rather receive your Loomio notifications all at once, move to the once-per-day approach. You can change this later as your pattern of work changes.
    translation: Wenn du deine Loomio-Benachrichtigungen lieber gesammelt erhalten möchtest, wähle die tägliche Zusammenfassung. Du kannst diese Einstellung später ändern, wenn sich deine Arbeitsweise ändert.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e2c60724226ad68a:
    english: For a group or thread that you want to follow more closely, choose **All activity** to receive every update as it happens.
    translation: Wenn du einer Gruppe oder einem Thread genauer folgen möchtest, wähle **Alle Aktivitäten**. Dann erhältst du jede Aktualisierung, sobald sie stattfindet.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  91fd24c60a6a84ee:
    english: These defaults apply when you join a group. Threads initially inherit the settings of their group, but you can follow an important thread more closely or reduce its notifications without changing the rest of the group.
    translation: Diese Standardeinstellungen gelten, wenn du einer Gruppe beitrittst. Threads übernehmen zunächst die Einstellungen ihrer Gruppe. Du kannst einem wichtigen Thread aber genauer folgen oder seine Benachrichtigungen reduzieren, ohne die Einstellungen für den Rest der Gruppe zu ändern.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a75df26cfc4e6614:
    english: "## Notifications in Loomio"
    translation: "## Benachrichtigungen in Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9286edc0ac459625:
    english: The bell icon in the top-right is where notifications are accessed within the app; a number shows how many notifications you have yet to read.
    translation: Über das Glockensymbol oben rechts erreichst du deine Benachrichtigungen in Loomio. Die Zahl zeigt an, wie viele du noch nicht gelesen hast.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bfacf52b815e1252:
    english: Select a notification to open the related discussion or poll.
    translation: Wähle eine Benachrichtigung aus, um die zugehörige Diskussion oder Abstimmung zu öffnen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b7ed6a5c5c661d60:
    english: "## Catch-up"
    translation: "## Zusammenfassung"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fc61461d684c5b47:
    english: The catch-up provides a regular overview of activity without requiring you to follow each group throughout the day.
    translation: Die Zusammenfassung gibt dir regelmäßig einen Überblick über Aktivitäten. Du musst dafür nicht den ganzen Tag jede Gruppe verfolgen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e519b17a3847cee:
    english: It shows your unseen notifications first, followed by unread discussions and standalone polls grouped by group. Notifications provide linked summaries of activity that needs your attention, while the unread section includes the discussion, poll, comment, vote, and edit details. Direct discussions and threads you have joined as a guest are included when they contain unread activity.
    translation: Zuerst zeigt sie deine ungesehenen Benachrichtigungen. Danach folgen ungelesene Diskussionen und eigenständige Abstimmungen, nach Gruppen geordnet. Die Benachrichtigungen enthalten verlinkte Zusammenfassungen von Aktivitäten, die deine Aufmerksamkeit brauchen. Im Bereich für ungelesene Inhalte findest du Einzelheiten zu Diskussionen, Abstimmungen, Kommentaren, Stimmen und Änderungen. Direkte Diskussionen und Threads, denen du als Gast beigetreten bist, erscheinen ebenfalls, wenn sie ungelesene Aktivitäten enthalten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  00703333f277e3c0:
    english: You can turn on **Follow updates** on an open Group that you have not joined. Unread discussions and polls from that Group are then included in your catch-up at your existing schedule. Reading the threads or marking the catch-up as read updates their read status in the same way as threads from Groups you belong to. Turn off **Follow updates** on the Group page to stop including them.
    translation: Bei einer offenen Gruppe, der du nicht beigetreten bist, kannst du **Folge den Aktualisierungen** aktivieren. Ungelesene Diskussionen und Abstimmungen dieser Gruppe erscheinen dann nach deinem bestehenden Zeitplan in deiner Zusammenfassung. Wenn du die Threads liest oder die Zusammenfassung als gelesen markierst, wird ihr Lesestatus wie bei Threads aus deinen eigenen Gruppen aktualisiert. Deaktiviere **Folge den Aktualisierungen** auf der Gruppenseite, um sie nicht mehr aufzunehmen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fcac102a70f7ee7f:
    english: Loomio does not send a catch-up when there are no unseen notifications or unread threads from the relevant period.
    translation: Loomio sendet keine Zusammenfassung, wenn es für den betreffenden Zeitraum keine ungesehenen Benachrichtigungen oder ungelesenen Threads gibt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  888011209ac583be:
    english: "![A catch-up with unseen notifications and unread thread activity from one group](digest_email_example.png)"
    translation: "![Eine Zusammenfassung mit ungesehenen Benachrichtigungen und ungelesenen Aktivitäten aus Threads einer Gruppe](digest_email_example.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7d80cf08a383f6bd:
    english: "### Choose your catch-up schedule"
    translation: "### Lege fest, wie oft du eine Zusammenfassung erhältst"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  677863d68136156b:
    english: Open **Notification settings** from your user menu to choose how often you receive a catch-up.
    translation: Öffne **Benachrichtigungseinstellungen** in deinem Benutzermenü, um festzulegen, wie oft du eine Zusammenfassung erhältst.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7c0dece94210f807:
    english: The **Unsubscribe** link in a catch-up email opens a catch-up schedule form. The email link authorizes that form, so you can change or stop catch-up emails without signing in. The full **Notification settings** page in Loomio remains available when you sign in.
    translation: Der Link **Benachrichtigungen deaktivieren** in einer Zusammenfassungs-E-Mail öffnet ein Formular für den Zeitplan der Zusammenfassung. Der Link in der E-Mail berechtigt dich, Zusammenfassungs-E-Mails zu ändern oder abzubestellen, ohne dich anzumelden. Wenn du angemeldet bist, kannst du weiterhin die vollständige Seite **Benachrichtigungseinstellungen** in Loomio öffnen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  da5740fd6dbd5737:
    english: "![Notification settings in the user menu](sidebar_notification_settings.png)"
    translation: "![Benachrichtigungseinstellungen im Benutzermenü](sidebar_notification_settings.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  58af77d870a877e2:
    english: 'New accounts start with a daily catch-up. The available schedules are:'
    translation: 'Neue Konten erhalten zunächst eine tägliche Zusammenfassung. Du kannst zwischen diesen Zeitplänen wählen:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b0fe04b2b5284253:
    english: |-
      - **Never** to turn off the catch-up
      - **Every day** for activity from approximately the previous 24 hours
      - **Every second day** for activity from approximately the previous two days
      - a weekday to receive a weekly catch-up on that day
    translation: |-
      - **Niemals**, um die Zusammenfassung abzuschalten
      - **Täglich** für Aktivitäten aus ungefähr den letzten 24 Stunden
      - **Jeden zweiten Tag** für Aktivitäten aus ungefähr den letzten zwei Tagen
      - einen Wochentag, um an diesem Tag eine wöchentliche Zusammenfassung zu erhalten
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a23935f518dd15cb:
    english: The catch-up is sent in the morning according to the time zone in your Loomio profile.
    translation: Die Zusammenfassung wird morgens gemäß der Zeitzone in deinem Loomio-Profil gesendet.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b214c0634763fb51:
    english: "![Catch-up schedule setting](digest_email_setting.png)"
    translation: "![Einstellung für den Zeitplan der Zusammenfassung](digest_email_setting.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  efbcecfe827438a5:
    english: "### Mark a catch-up as read"
    translation: "### Markiere eine Zusammenfassung als gelesen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2b764b73f48d3185:
    english: Select **Mark catch-up as read** to mark its notifications and topic activity as read in Loomio. Opening or previewing the catch-up does not mark anything as read.
    translation: Wähle **Markiere die gelesenen Texte**, um die Benachrichtigungen und Aktivitäten zu Themen aus der Zusammenfassung in Loomio als gelesen zu markieren. Wenn du die Zusammenfassung öffnest oder in der Vorschau ansiehst, wird nichts als gelesen markiert.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  81ffa4a869f82451:
    english: A catch-up is not specific to one discussion, so do not reply to it. Open a discussion or poll from the catch-up before commenting or replying.
    translation: Eine Zusammenfassung gehört nicht zu einer bestimmten Diskussion. Antworte daher nicht darauf. Öffne zuerst eine Diskussion oder Abstimmung aus der Zusammenfassung, bevor du kommentierst oder antwortest.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f7dfee93901e5eea:
    english: "## Group and thread notification settings"
    translation: "## Benachrichtigungseinstellungen für Gruppen und Threads"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  31be594005b6bcfc:
    english: You can choose how closely to follow each group and thread. These settings belong to you; group administrators cannot change them.
    translation: Du entscheidest, wie genau du jeder Gruppe und jedem Thread folgst. Diese Einstellungen gehören dir; Gruppenadministratoren können sie nicht ändern.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6c9a762b18c9f92d:
    english: Change your defaults for groups you join from **Notification settings** in your user menu. You can then override the default for a particular group or thread. A thread override changes only that thread and does not affect the rest of its group.
    translation: Ändere die Standardeinstellungen für Gruppen, denen du beitrittst, unter **Benachrichtigungseinstellungen** in deinem Benutzermenü. Anschließend kannst du für eine bestimmte Gruppe oder einen bestimmten Thread eine andere Einstellung wählen. Eine abweichende Thread-Einstellung gilt nur für diesen Thread und wirkt sich nicht auf den Rest seiner Gruppe aus.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f4b6aa6eab1beb2b:
    english: "### Group notification settings"
    translation: "### Benachrichtigungseinstellungen für Gruppen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  977289761daba9db:
    english: 'To change the notification setting for a group:'
    translation: 'So änderst du die Benachrichtigungseinstellung für eine Gruppe:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d78d13409c481c71:
    english: |-
      1. Open the group page.
      2. Open the notification settings for the group.
    translation: |-
      1. Öffne die Gruppenseite.
      2. Öffne die Benachrichtigungseinstellungen der Gruppe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  02116f695da0a946:
    english: "![Notification settings on a group page](group_notifications.png)"
    translation: "![Benachrichtigungseinstellungen auf einer Gruppenseite](group_notifications.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8ce50d3418e2d9fa:
    english: The form asks **How do you want to stay updated?** Choose **Catch-up only**, **When notified**, or **All activity**. If your catch-up is set to **Never**, **Catch-up only** is replaced by **No email updates** or **No push updates**.
    translation: Das Formular fragt **Wie möchtest du auf dem Laufenden bleiben?** Wähle **Nur zum Aufholen**, **Bei Benachrichtigung** oder **Alle Aktivitäten**. Wenn deine Zusammenfassung auf **Niemals** eingestellt ist, wird **Nur zum Aufholen** durch **Keine E-Mail-Updates** oder **Keine Push-Updates** ersetzt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  24db74c2c82737eb:
    english: Select **Apply to all groups** to use the same setting for all of your groups.
    translation: Wähle **Auf alle Gruppen anwenden**, um dieselbe Einstellung für alle deine Gruppen zu verwenden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  54cd6a8eac96e073:
    english: "![Group notification settings](group_notification_settings.png)"
    translation: "![Gruppenbenachrichtigungseinstellungen](group_notification_settings.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d0ab43e865282241:
    english: "### Thread notification settings"
    translation: "### Thread-Benachrichtigungseinstellungen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f61284373b7afc42:
    english: To change notification settings for an individual thread, open the notification control in the thread sidebar.
    translation: Um die Benachrichtigungen für einen einzelnen Thread zu ändern, öffne die Benachrichtigungseinstellungen in der Seitenleiste des Threads.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b329b8421ab5d4f8:
    english: "![The notification control in a thread](thread_subscribe.png)"
    translation: "![Benachrichtigungseinstellungen in einem Thread](thread_subscribe.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  226c5e321d735005:
    english: "![Thread notification settings](thread_notifications.png)"
    translation: "![Thread-Benachrichtigungseinstellungen](thread_notifications.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3178b3b456acd783:
    english: Thread notification settings use the same **Catch-up only**, **When notified**, and **All activity** choices. A thread setting overrides the group setting for that thread.
    translation: 'Für Threads gibt es dieselben Optionen: **Nur zum Aufholen**, **Bei Benachrichtigung** und **Alle Aktivitäten**. Die Einstellung für einen Thread hat Vorrang vor der Gruppeneinstellung.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f53fa37c98c9b747:
    english: |-
      >[!Note]
      >The changes in **Thread notification settings** apply only to the thread you have open. Select **Change notifications for group** to change the setting inherited by the group's other threads.
    translation: |-
      >[!Note]
      >Änderungen unter **Thread-Benachrichtigungseinstellungen** gelten nur für den geöffneten Thread. Wähle **Ändere Benachrichtigungen für die Gruppe**, um die Einstellung zu ändern, die andere Threads der Gruppe übernehmen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  99a0923cdcdc1cdf:
    english: "## Email delivery"
    translation: "## E-Mail-Zustellung"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6cf70b2dc7cdbf83:
    english: By default, Loomio sends an email when you are notified. Depending on your group and thread notification settings, this can include mentions, replies, discussions shared with you, invitations and reminders to vote, outcomes, and polls closing soon. Choose **All activity** to also receive emails about every new comment, vote, thread, poll, and outcome.
    translation: Standardmäßig sendet Loomio dir eine E-Mail, wenn du benachrichtigt wirst. Je nach deinen Benachrichtigungseinstellungen für Gruppen und Threads kann das Erwähnungen, Antworten, mit dir geteilte Diskussionen, Einladungen und Erinnerungen zur Abstimmung, Fazits und bald endende Abstimmungen umfassen. Wähle **Alle Aktivitäten**, um auch zu jedem neuen Kommentar, jeder Stimmabgabe, jedem Thread, jeder Abstimmung und jedem Fazit eine E-Mail zu erhalten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ce2919b895be45b3:
    english: The **Unsubscribe** link in a notification email opens settings for that thread or group, including emails sent because someone mentioned you or replied to you. That form shows your current catch-up schedule for all groups and links to the catch-up email settings. These email links authorize only their own settings forms; they do not sign you in to Loomio.
    translation: Der Link **Benachrichtigungen deaktivieren** in einer Benachrichtigungs-E-Mail öffnet die Einstellungen für den betreffenden Thread oder die Gruppe. Das gilt auch für E-Mails, die du wegen einer Erwähnung oder Antwort erhältst. Das Formular zeigt deinen aktuellen Zeitplan für Zusammenfassungen aller Gruppen und verlinkt zu den Einstellungen für Zusammenfassungs-E-Mails. Diese E-Mail-Links gewähren nur Zugriff auf das jeweilige Einstellungsformular. Sie melden dich nicht bei Loomio an.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d615e84f882a2728:
    english: When a discussion email says that replies are accepted, you can reply directly from your email and your message will be posted into the Loomio discussion.
    translation: Wenn in einer E-Mail zu einer Diskussion steht, dass Antworten möglich sind, kannst du direkt auf die E-Mail antworten. Deine Nachricht wird dann in der Loomio-Diskussion veröffentlicht.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5b4ce168b24bc44a:
    english: Poll invitation emails show the poll and its response options, but selecting an option opens Loomio in your browser to complete the vote. You may need to sign in or confirm your account. The catch-up cannot accept replies; open the linked discussion or poll first.
    translation: Einladungs-E-Mails zu Abstimmungen zeigen die Abstimmung und ihre Antwortmöglichkeiten. Wenn du eine Option auswählst, öffnet sich Loomio im Browser, damit du deine Stimme abgeben kannst. Möglicherweise musst du dich anmelden oder dein Konto bestätigen. Auf eine Zusammenfassungs-E-Mail kannst du nicht antworten. Öffne zuerst die verlinkte Diskussion oder Abstimmung.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0c2b2867a1ace598:
    english: "![A proposal invitation email with response options and the related thread](proposal_invitation_email.png)"
    translation: "![Einladungs-E-Mail zu einem Vorschlag mit Antwortmöglichkeiten und dem zugehörigen Thread](proposal_invitation_email.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a73508aa897d96cf:
    english: "## Enable mobile notifications with web push"
    translation: "## Mobile Benachrichtigungen mit Web-Push aktivieren"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f4b14a4ba068b670:
    english: Web push is how Loomio delivers mobile notifications today. It can notify you about Loomio activity on your phone when Loomio is not open.
    translation: Loomio stellt mobile Benachrichtigungen derzeit über Web-Push zu. So kannst du auf deinem Telefon über Aktivitäten in Loomio benachrichtigt werden, auch wenn Loomio nicht geöffnet ist.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  811ee794dea12cd3:
    english: On Android, open **Notification settings** in a supported browser and enable push. On an iPhone or iPad, first open Loomio in Safari, use **Share** then **Add to Home Screen**, open Loomio from the new Home Screen icon, and enable push from there. Select **Test connection** to verify delivery to every browser listed under **Enabled browsers**.
    translation: Öffne auf Android die **Benachrichtigungseinstellungen** in einem unterstützten Browser und aktiviere Push. Öffne auf einem iPhone oder iPad zuerst Loomio in Safari. Wähle **Teilen** und dann **Zum Home-Bildschirm hinzufügen**. Öffne Loomio über das neue Symbol auf dem Home-Bildschirm und aktiviere dort Push. Wähle **Testverbindung**, um die Zustellung an jeden Browser unter **Aktivierte Browser** zu prüfen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72f0707b2d67bf0e:
    english: Web push also works in supported desktop browsers. Enable it there if you want Loomio notifications on your computer.
    translation: Web-Push funktioniert auch in unterstützten Desktop-Browsern. Aktiviere es dort, wenn du Loomio-Benachrichtigungen auf deinem Computer erhalten möchtest.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fea7dbef040ae7f5:
    english: Once push is enabled in at least one browser, group and thread notification forms let you choose **Email**, **Push**, or **Email and push**. Email and push can use different notification settings. Push delivery can be delayed by the browser, operating system, or network connection.
    translation: Sobald Push in mindestens einem Browser aktiviert ist, kannst du in den Benachrichtigungseinstellungen für Gruppen und Threads zwischen **E-Mail**, **Push** und **E-Mail und Push** wählen. Für E-Mail und Push kannst du unterschiedliche Benachrichtigungseinstellungen verwenden. Der Browser, das Betriebssystem oder die Netzwerkverbindung können die Zustellung von Push-Benachrichtigungen verzögern.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
