  fba51c92285b31c7:
    english: "## Continuous Improvement"
    translation: "## Melhoria contínua"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  121b4afb86de3c31:
    english: No matter how amazing a group or facilitator is, they can always improve. If they incrementally head in a good direction they will get to a better place. Incremental improvement requires an effective protocol for meta-conversation (talking about how you collaborate). With it, anything is possible. Without it, you stagnate.
    translation: Por melhor que seja um grupo ou uma pessoa facilitadora, sempre é possível melhorar. Pequenos avanços na direção certa levam a resultados melhores. A melhoria gradual exige uma forma eficaz de conversar sobre como o grupo colabora. Com isso, o grupo pode continuar evoluindo. Sem isso, tende a ficar estagnado.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  331d258dee610e96:
    english: There are many approaches to continuous improvement, but they all create space for reflection and feedback, and a way to make changes in response. For teams that work together on an ongoing basis, they might employ a methodology like <a href="https://en.wikipedia.org/wiki/Scrum_(software_development)" target="_blank">scrum</a>, including retrospectives and regular process improvements. For a one-off session, a facilitator might simply follow up with a request for feedback.
    translation: Há muitas formas de buscar a melhoria contínua. Todas criam espaço para reflexão e feedback e permitem fazer mudanças a partir deles. Equipes que trabalham juntas continuamente podem adotar uma metodologia como o <a href="https://en.wikipedia.org/wiki/Scrum_(software_development)" target="_blank">scrum</a>, com retrospectivas e melhorias regulares dos processos. Depois de um encontro pontual, quem facilitou pode simplesmente pedir feedback.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aabfa9d842af2688:
    english: On Loomio
    translation: No Loomio
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ac2f489368566562:
    english: |-
      * People use Loomio itself to talk about how they use Loomio. It provides an obvious platform to “talk about the talking”.
      * The process of joining Loomio causes groups to reflect on many aspects of their collaboration and decision-making process, which creates the opportunity to improve.
    translation: |-
      * As pessoas usam o próprio Loomio para conversar sobre como usam a ferramenta. É um espaço para falar sobre a forma como conversam.
      * Ao começar a usar o Loomio, os grupos refletem sobre vários aspectos da colaboração e da tomada de decisões. Isso cria oportunidades de melhoria.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7b11f212a312312e:
    english: "## Distributed Facilitation / Self-facilitation"
    translation: "## Facilitação distribuída / Autofacilitação"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1e385970a624bf63:
    english: As a group becomes more experienced, more individuals build capacity for facilitation. Facilitation can cease to be a role held by a specific person, and become more of a function that can be distributed. Anyone can take acts of facilitation, and a dance of give and take, leading and following, can emerge among participants. For groups with aspirations toward shared leadership and non-hierarchy, this is a very important thing to encourage.
    translation: À medida que um grupo ganha experiência, mais pessoas desenvolvem a capacidade de facilitar. A facilitação pode deixar de ser uma função de uma pessoa específica e passar a ser compartilhada. Qualquer pessoa pode contribuir para facilitar o trabalho. Entre os participantes, pode surgir uma dinâmica de troca, em que ora se conduz, ora se acompanha. Para grupos que buscam liderança compartilhada e relações não hierárquicas, é importante incentivar essa prática.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fa78b242f7390326:
    english: 'People who are less used to taking acts of facilitation can be supported with education, invitations, and suggestions of first steps. Some examples of acts of facilitation almost anyone can be encouraged to try:'
    translation: 'Quem tem menos experiência com facilitação pode receber orientação, convites para participar e sugestões de primeiros passos. Quase todas as pessoas podem experimentar ações como:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1f490f466a1893ed:
    english: |-
      * reflecting back what you’re hearing or summarising
      * inviting others to contribute
      * asking questions to enhance collective understanding
      * noticing who is and is not participating
      * appreciating contributions explicitly
    translation: |-
      * retomar o que ouviu ou fazer um resumo
      * convidar outras pessoas a contribuir
      * fazer perguntas para ampliar a compreensão coletiva
      * observar quem está participando e quem não está
      * reconhecer explicitamente as contribuições
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e2eed897e0f564d2:
    english: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../silvia_200.png"> You don’t need an agenda to be a facilitator. Facilitating is just about making a group situation easy. Next time you’re at a family gathering, party or morning tea: approach it like a facilitator and make sure everybody in the group feels included and able to participate. — Silvia Zuur'
    translation: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../silvia_200.png"> Você não precisa de uma pauta para facilitar. Facilitar é tornar mais fácil a participação das pessoas em uma situação de grupo. Na próxima reunião de família, festa ou encontro para um café, aja como alguém que facilita: ajude todas as pessoas a se sentirem incluídas e capazes de participar. — Silvia Zuur'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  180b1232871c44c4:
    english: Distributed facilitation can work beautifully, but it can also cause people to step all over each other. At first, it’s awkward as people learn the dance. It’s important to differentiate between distributed facilitation (peers helping the collective), “facipulation” (manipulating the group toward your own agenda), and backseat facilitation (taking acts of facilitation when you do not have the mandate).
    translation: A facilitação distribuída pode funcionar muito bem, mas também pode fazer com que as pessoas interfiram umas nas outras. No começo, essa dinâmica pode ser desconfortável enquanto todos aprendem a participar dela. É importante distinguir a facilitação distribuída (pessoas ajudando o coletivo), a “facipulação” (manipular o grupo para atender aos próprios interesses) e a facilitação sem mandato (assumir ações de facilitação sem ter essa atribuição).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ea5faa685be1ceae:
    english: Consciously decide when peer facilitation is a good choice, and when a specific facilitator is called for. In certain situations, such as a high-conflict discussion where a specified neutral party is needed, or there is a lack of trust, distributed facilitation might not work.
    translation: Decida conscientemente quando a facilitação entre pares é adequada e quando é preciso designar uma pessoa facilitadora. Ela pode não funcionar em situações de conflito intenso, quando é necessária uma pessoa neutra, ou quando falta confiança entre os participantes.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d6df5458ecb8e45:
    english: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../rich_200.png"> Acts of facilitation are not just for the manager, or the person who called the meeting — they are for everyone. — Richard Bartlett'
    translation: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../rich_200.png"> As ações de facilitação não cabem apenas à pessoa responsável pela equipe ou a quem convocou a reunião — elas cabem a todas as pessoas. — Richard Bartlett'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c3215e63fca09b79:
    english: "## Translating this into Loomio"
    translation: "## Como aplicar isso no Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  35ce75e6810e0611:
    english: |-
      * The online space is uniquely suited to distributed facilitation. Different people can come along at different points depending on what they notice and their skill set.
      * An online discussion is by default a distributed collaboration among peers. Any other setup requires explicit design. This is the opposite of offline spaces where the default is that someone called a meeting and distributing the role requires proactivity.
      * Loomio is designed with a group of equals in mind. In many ways, a distributed facilitation approach is the best fit for the tool.
      * Current Loomio users do peer facilitation all the time, whether they realize that’s what they are doing or not. Simple things like suggesting someone raise a proposal, tagging people, summarising the process so far, etc, are all acts of facilitation.
    translation: |-
      * O espaço online favorece a facilitação distribuída. Pessoas diferentes podem contribuir em momentos diferentes, conforme o que percebem e as habilidades que têm.
      * Uma discussão online é, por padrão, uma colaboração distribuída entre pares. Outras formas de organização precisam ser definidas explicitamente. Em encontros presenciais, costuma haver alguém que convocou a reunião, e compartilhar a facilitação exige uma iniciativa deliberada.
      * O Loomio foi pensado para grupos em que as pessoas participam em condições de igualdade. Por isso, a facilitação distribuída combina bem com a ferramenta.
      * Quem usa o Loomio já pratica a facilitação entre pares, mesmo sem perceber. Sugerir que alguém apresente uma proposta, mencionar pessoas e resumir o andamento do processo são exemplos de ações de facilitação.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  efde81539c545bae:
    english: "## The Art of Being Facilitated"
    translation: "## A arte de receber facilitação"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  93ed1980d0cc95b4:
    english: Like the skill of being the follow in a ballroom dance pair, being facilitated is an art itself. People with experience facilitating themselves, or who have participated in a lot of well-facilitated processes, will receive facilitation differently than those who haven't.
    translation: Assim como acompanhar outra pessoa em uma dança de salão exige habilidade, receber facilitação também é uma prática que se aprende. Quem já facilitou processos ou participou de muitos processos bem facilitados tende a responder à facilitação de modo diferente de quem não teve essas experiências.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d2bcd9f07f5bd25b:
    english: On the positive side, skillful receptivity to facilitation is a capacoty that can be grown, and it can have a big impact on group success. This ranges from things as simple as showing up on time, to following instructions, to being willing to try a new style of thinking or communicating. Sometimes people have a good experience and they don’t quite know why — pointing out that facilitation is the reason for the smoothness or depth can help them understand what it is they valued about the process.
    translation: A capacidade de receber bem a facilitação pode ser desenvolvida e contribuir muito para o sucesso do grupo. Isso inclui chegar no horário, seguir orientações e estar disposto a experimentar novas formas de pensar ou se comunicar. Às vezes, as pessoas têm uma boa experiência sem saber exatamente por quê. Mostrar como a facilitação contribuiu para a fluidez ou a profundidade da conversa pode ajudá-las a entender o que valorizaram no processo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  87345b383ccba81d:
    english: On the negative side, people who can’t or won’t be facilitated can be detrimental to group collaboration. No matter how skilled a facilitator is, if they encounter a certain level of resistance they won’t be able to do their job. Common problems include dominating the discussion, playing devil’s advocate, disrupting the process, disrespecting the facilitator or participants, or being disengaged. At some level individuals must take responsibility for their willingness to be facilitated.
    translation: Por outro lado, pessoas que não conseguem ou não querem receber facilitação podem prejudicar a colaboração do grupo. Mesmo uma pessoa facilitadora experiente não consegue cumprir seu papel diante de muita resistência. Entre os problemas comuns estão dominar a discussão, questionar tudo apenas para provocar, interromper o processo, desrespeitar quem facilita ou participa e se manter alheio ao trabalho. Cada pessoa precisa assumir alguma responsabilidade pela própria disposição de receber facilitação.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c096fd0a7e12ddd4:
    english: |-
      * With a little practice, most users quickly upskill on being responsive to acts of facilitation on Loomio, such as replying when @mentioned.
      * Taking acts of facilitation on Loomio helps people become more responsive to facilitation themselves.
      * Because everything is archived, users can see past acts of facilitation “frozen in time”, gaining the benefits of observing them without having been there.
    translation: |-
      * Com um pouco de prática, a maioria das pessoas aprende rapidamente a responder às ações de facilitação no Loomio, como dar uma resposta quando recebe uma @menção.
      * Praticar a facilitação no Loomio também ajuda as pessoas a receber melhor a facilitação de outras pessoas.
      * Como tudo fica arquivado, as pessoas podem observar ações de facilitação anteriores, como um registro daquele momento, mesmo sem ter participado.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f930b325aaedb19a:
    english: "## Culture Change"
    translation: "## Mudança de cultura"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  82936abec2b50e3f:
    english: A collaborative, participatory culture is something that emerges over time, with lots of practice and trial and error. Understanding, valuing, and inviting facilitation can play a pivotal role in this cultural emergence. Facilitation can evolve from a role, to a function, to a mindset. A truly collaborative culture is one where everyone is facilitating everyone in myriad different ways.
    translation: Uma cultura colaborativa e participativa surge ao longo do tempo, com muita prática, tentativas e ajustes. Compreender, valorizar e incentivar a facilitação pode ter um papel central nesse processo. A facilitação pode evoluir de um papel para uma função compartilhada e, depois, para uma forma de pensar. Em uma cultura realmente colaborativa, todas as pessoas ajudam umas às outras a participar de muitas maneiras.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  898bf6557380a042:
    english: Is the company party participatory? Does the office potluck just happen like magic? Are ideas able to emerge from anywhere, evolve through many brains and hands, and get implemented in a way better than anyone first imagined?
    translation: A festa da empresa conta com a participação de todos? O almoço compartilhado no escritório parece acontecer por mágica? As ideias podem surgir de qualquer lugar, evoluir com a contribuição de muitas pessoas e ser colocadas em prática de uma forma melhor do que se imaginava no início?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f4964381b3c6dc7b:
    english: Deep culture change is when the culture of collaboration starts to leak out of specific “collaboration” spaces and shows up in every aspect of the organization. Collaboration is not about post-it notes and check-ins, but the very timbre of organizational life.
    translation: 'Uma mudança cultural profunda acontece quando a colaboração deixa de ficar restrita a espaços específicos e passa a fazer parte de todos os aspectos da organização. Ela vai além de notas adesivas e rodadas de abertura: torna-se parte do cotidiano da organização.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6962aa4815c01b0f:
    english: |-
      * The [theory of change of Loomio](http://www.loomio.com/about) is that more groups practicing effective, inclusive decision making can change organizational dynamics at a global scale. This shows up in everything about how the tool is designed and [how we run as a co-op](http://loomio.coop). Ultimately, it’s about culture change through collaborative practice.
      * Loomio groups have experienced evolving culture through the tool. Like groups that already has a collaborative culture scale while holding onto that, or a participatory group continuing to exists instead of imploding due to challanges around inclusive decicion-making.
      * Loomio makes a certain kind of “new normal” of collaborative practice possible, through making collaborative practice more accessible and achievable.
    translation: |-
      * A [teoria de mudança do Loomio](http://www.loomio.com/about) é que mais grupos praticando uma tomada de decisões eficaz e inclusiva podem transformar a dinâmica das organizações em escala global. Essa ideia orienta o projeto da ferramenta e [a forma como trabalhamos como cooperativa](http://loomio.coop). O objetivo é promover uma mudança de cultura por meio da prática colaborativa.
      * Grupos que usam o Loomio já viram sua cultura evoluir com a ferramenta. Alguns conseguiram crescer sem perder a cultura colaborativa. Outros continuaram participativos apesar dos desafios da tomada de decisões inclusiva.
      * O Loomio ajuda a tornar a prática colaborativa parte do cotidiano, ao torná-la mais acessível e viável.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3f2cee633e8b83c2:
    english: For inspiration about Ongoing Practice, check out [stories of Loomio groups](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help).
    translation: Para encontrar inspiração sobre a prática contínua, leia as [histórias de grupos que usam o Loomio](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
