  cc37217cd681fabe:
    english: The green highlight shows when a candidate was elected, red shows when they were eliminated, and orange shows when they tied.
    translation: Vihreä korostus näyttää, milloin ehdokas valittiin, punainen näyttää putoamisen ja oranssi tasatilanteen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ed4aaa0a898906fd:
    english: "## Exporting ballots"
    translation: "## Äänestyslippujen vienti"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c96d54ebfbedae32:
    english: After the election closes, people who can view the results can export the ballots in BLT format for an independent recount or audit. The export contains candidate rankings and combines identical rankings into a single row with a ballot count. For anonymous elections it does not contain voter identities, ballot identifiers, submission times, or submission order.
    translation: Vaalin sulkeuduttua tuloksia tarkastelemaan oikeutetut voivat viedä äänestysliput BLT-muodossa riippumatonta uudelleenlaskentaa tai tarkastusta varten. Vienti sisältää ehdokkaiden järjestykset ja yhdistää samanlaiset järjestykset yhdelle riville sekä ilmoittaa äänestyslippujen määrän. Nimettömissä vaaleissa vienti ei sisällä äänestäjien henkilöllisyyksiä, äänestyslippujen tunnisteita, lähetysaikoja eikä lähetysjärjestystä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
