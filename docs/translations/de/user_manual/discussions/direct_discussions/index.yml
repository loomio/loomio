  5a0b9426a2d88e62:
    english: |-
      ## Contacting someone via a direct discussion
      A direct discussion can be used to contact one or more people privately without creating a subgroup.
    translation: |-
      ## Jemanden über eine direkte Diskussion kontaktieren
      Mit einer direkten Diskussion kannst du eine oder mehrere Personen privat kontaktieren, ohne eine Untergruppe zu erstellen.
    status: machine
