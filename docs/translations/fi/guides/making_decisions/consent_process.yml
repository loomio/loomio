  '09907f3ec328e9d2':
    english: "## Applying the Consent process on Loomio"
    translation: "## Suostumusprosessin toteuttaminen Loomiossa"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d7c91a6160b45cf:
    english: |-
      | **Consent process** | **On Loomio** |
      |---|---|
      | You notice a problem or opportunity and take the initiative. |  |
      | **Present a proposal** <br /><br />Write a clear and concise proposal and share it with people impacted. Describe it in a way so that others will understand what you are proposing. | Start a Loomio **discussion**. <br /><br />Name the proposal in the discussion title, and describe it in the context. |
      | **Questions** (Optional) <br /><br />Invite clarifying questions to help people understand the proposal. <br /><br />*“A clarifying question round helps make sure everyone understands the proposal before they say what they think about it.”* | Run a **Question round**. If it is hidden, a group administrator can make it available from [Poll templates](/en/user_manual/polls/poll_templates/). <br /><br />Ask “what do you need to know so you understand the proposal?” |
      | **Reactions** <br /><br />Invite people to offer reactions and comments to improve the proposal. <br /><br />This is a sensing and responding round - *to actively sense and interpret information from the group and then respond or adapt accordingly.* | Run a **[Sense check](/en/user_manual/polls/proposals/sense_check/)** proposal. <br /><br />*In the title:* Name the proposal and say this is an opportunity to react and comment. <br /><br />*In the proposal details:* Clearly frame the proposal and say why it is important.  Include any background information necessary and a link to the current proposal version.  <br /><br />Invite everyone to respond, and to do so before the proposal closes.  |
      | **Amendment** <br /><br />Consider comments and suggestions from people and amend the proposal as appropriate for the good of your organization. <br /><br />Consider any amendments you want to make for the new proposal version. | Reply to comments and suggestions raised in the Sense check proposal. <br /><br />State an **outcome** to summarize the results of the proposal.  <br /><br />Note any concerns or new information discovered, and outline how the proposal will be amended. <br /><br />Say what will happen next and notify people about the outcome. |
      | **Objections** <br /><br />Present the amended proposal version and invite people to state valid objections - objections that might cause harm. <br /><br />Respond to and integrate each objection by amending the proposal. | Run a **[Consent proposal](/en/user_manual/polls/proposals/consent/)** with the amended proposal. <br /><br />*In the title:* Name the decision to be made. <br /><br />*In the proposal details:* Present the proposal and invite people to vote consent or to state a valid objection - an objection that might cause harm.  Remember we are seeking consent that the proposal is 'safe to try'. <br /><br />Respond to and integrate each objection, creating an amended version of the proposal. <br /><br />Notify everyone that there has been a further amendment, and invite them to reconsider their Consent and “change your vote”. <br /><br />Or run successive Consent proposals as necessary until objections are resolved. |
      | **Outcome** <br /><br />When there are no remaining objections and everyone has consented, the result of the decision is announced. | State an **outcome**. <br /><br />Close the proposal. State an outcome and notify everyone involved. <br /><br />State the decision made and thank people for participation in the process. <br /><br />Summarize results of the process and say what will happen next. <br /><br />If no valid objections remain, state that there is consent the proposal is 'safe to try'. <br /><br />The outcome statement is an important record of the decision for future reference. |
    translation: |-
      | **Suostumusprosessi** | **Loomiossa** |
      |---|---|
      | Huomaat ongelman tai mahdollisuuden ja teet aloitteen. |  |
      | **Esittele ehdotus** <br /><br />Kirjoita selkeä ja ytimekäs ehdotus ja jaa se ihmisille, joita asia koskee. Kuvaa ehdotus niin, että muut ymmärtävät, mitä ehdotat. | Aloita Loomiossa **keskustelu**. <br /><br />Nimeä ehdotus keskustelun otsikossa ja kuvaa sitä keskustelun taustatiedoissa. |
      | **Kysymykset** (valinnainen) <br /><br />Pyydä selventäviä kysymyksiä, jotta ihmiset ymmärtävät ehdotuksen. <br /><br />*”Selventävä kysymyskierros auttaa varmistamaan, että kaikki ymmärtävät ehdotuksen ennen kuin kertovat mielipiteensä siitä.”* | Aloita **Kysymyskierros**. Jos se on piilotettu, ryhmän ylläpitäjä voi ottaa sen käyttöön [Kyselymalleista](/en/user_manual/polls/poll_templates/). <br /><br />Kysy: ”Mitä sinun pitää tietää, jotta ymmärrät ehdotuksen?” |
      | **Reaktiot** <br /><br />Pyydä ihmisiä kertomaan reaktionsa ja kommenttinsa ehdotuksen parantamiseksi. <br /><br />Tällä kierroksella kuuntelette ja vastaatte: *keräätte aktiivisesti tietoa ryhmältä, tulkitsette sitä ja mukautatte ehdotusta sen mukaan.* | Aloita **[Aistitarkistus](/en/user_manual/polls/proposals/sense_check/)**-ehdotus. <br /><br />*Otsikossa:* Nimeä ehdotus ja kerro, että nyt on tilaisuus reagoida ja kommentoida. <br /><br />*Ehdotuksen tiedoissa:* Kuvaa ehdotus selkeästi ja kerro, miksi se on tärkeä. Lisää tarvittavat taustatiedot ja linkki ehdotuksen nykyiseen versioon. <br /><br />Pyydä kaikkia vastaamaan ennen ehdotuksen sulkeutumista. |
      | **Muokkaaminen** <br /><br />Harkitse ihmisten kommentteja ja ehdotuksia. Muokkaa ehdotusta organisaatiosi tarpeiden mukaan. <br /><br />Päätä, mitä muutoksia haluat tehdä ehdotuksen seuraavaan versioon. | Vastaa Aistitarkistus-ehdotuksessa esitettyihin kommentteihin ja ehdotuksiin. <br /><br />Kirjaa **johtopäätös**, jossa teet yhteenvedon ehdotuksen käsittelystä. <br /><br />Merkitse muistiin esiin tulleet huolenaiheet ja uudet tiedot sekä kerro, miten muokkaat ehdotusta. <br /><br />Kerro, mitä seuraavaksi tapahtuu, ja ilmoita johtopäätöksestä osallistujille. |
      | **Vastalauseet** <br /><br />Esittele muokattu ehdotus ja pyydä ihmisiä kertomaan perustellut vastalauseensa eli mahdolliset haitat. <br /><br />Vastaa jokaiseen vastalauseeseen ja ota se huomioon ehdotusta muokatessasi. | Aloita muokatusta ehdotuksesta **[Suostumus](/en/user_manual/polls/proposals/consent/)**-ehdotus. <br /><br />*Otsikossa:* Nimeä tehtävä päätös. <br /><br />*Ehdotuksen tiedoissa:* Esittele ehdotus ja pyydä ihmisiä joko antamaan suostumuksensa tai esittämään perusteltu vastalause eli mahdollinen haitta. Tavoitteena on päästä yhteisymmärrykseen siitä, että ehdotusta on turvallista kokeilla. <br /><br />Vastaa jokaiseen vastalauseeseen ja ota se huomioon ehdotuksen uudessa versiossa. <br /><br />Ilmoita kaikille uudesta muutoksesta ja pyydä heitä harkitsemaan suostumustaan uudelleen sekä muuttamaan ääntään. <br /><br />Voit myös tehdä uusia Suostumus-ehdotuksia, kunnes vastalauseet on ratkaistu. |
      | **Johtopäätös** <br /><br />Kun vastalauseita ei enää ole ja kaikki ovat antaneet suostumuksensa, päätöksen tulos ilmoitetaan. | Kirjaa **johtopäätös**. <br /><br />Sulje ehdotus. Kirjaa johtopäätös ja ilmoita siitä kaikille osallistujille. <br /><br />Kerro tehty päätös ja kiitä ihmisiä osallistumisesta. <br /><br />Tee yhteenveto prosessista ja kerro, mitä seuraavaksi tapahtuu. <br /><br />Jos perusteltuja vastalauseita ei ole jäljellä, kerro, että ehdotuksen kokeilemiseen on saatu suostumus. <br /><br />Johtopäätös tallentaa päätöksen myöhempää käyttöä varten. |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
