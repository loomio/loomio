  a79abb23e8e1c82f:
    english: A quorum is the minimum percentage of eligible voters who must participate for a poll to be valid. Use it when your governance process requires a particular level of participation.
    translation: Päätösvaltaisuuden saavuttamiseksi äänestykseen on osallistuttava vähintään tietyn prosenttiosuuden äänioikeutetuista. Voit käyttää osallistumisrajaa, kun päätöksentekotapanne edellyttää tiettyä osallistumistasoa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d83e75068f697f6f:
    english: When creating a poll, open **More settings** and enter the required percentage in **Participation quorum**. Leave the field blank when no quorum is required.
    translation: Kun luot kyselyn, avaa **Lisää asetuksia** ja syötä vaadittu prosenttiosuus kohtaan **Osallistumispäätösvaltaisuus**. Jätä kenttä tyhjäksi, jos osallistumisrajaa ei tarvita.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a04b99724fe62a56:
    english: "![The Quorum setting with a 60 percent participation quorum](./quorum-section.png)"
    translation: "![Päätösvaltaisuuden asetus, jossa osallistumisraja on 60 prosenttia](./quorum-section.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  432f570094ad5b24:
    english: You can also set a quorum in a [poll template](/en/user_manual/polls/poll_templates/) so that polls created from that template use it by default.
    translation: Voit asettaa osallistumisrajan myös [kyselymalliin](/en/user_manual/polls/poll_templates/). Silloin mallista luodut kyselyt käyttävät sitä oletusarvoisesti.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
