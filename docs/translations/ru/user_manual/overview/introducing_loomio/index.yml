---
navigation_title: Знакомство вашей группы с Loomio
blocks:
  6c777a62b2b77732:
    english: "# Introducing Loomio to your group"
    translation: "# Знакомство вашей группы с Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  438cc622ae730bd8:
    english: Introduce Loomio through one useful piece of work. Prepare the group before inviting people, help everyone participate once, and complete the process through to an outcome.
    translation: Начните знакомство с Loomio с одной полезной задачи. Подготовьте группу, прежде чем приглашать людей, помогите каждому принять участие и доведите процесс до решения.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9c9fa4e8f6e208e4:
    english: "## Choose one useful starting point"
    translation: "## Выберите одну полезную задачу для начала"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3353fb04e83837e5:
    english: Start with a real process that your group already needs. A good first use is small enough to complete soon, but relevant enough that people have a reason to participate.
    translation: Начните с реального процесса, который уже нужен вашей группе. Для первого раза выберите задачу, которую можно вскоре завершить и в которой людям есть смысл участвовать.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  652744a2ab28954b:
    english: 'For example:'
    translation: 'Например:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  19bc6c09eeea816e:
    english: |-
      - prepare the agenda for an upcoming meeting;
      - review and approve meeting minutes;
      - gather feedback on a draft document;
      - decide a small operational question; or
      - identify priorities for the next month.
    translation: |-
      - подготовить повестку предстоящей встречи;
      - рассмотреть и утвердить протокол встречи;
      - собрать отзывы о проекте документа;
      - решить небольшой организационный вопрос; или
      - определить приоритеты на следующий месяц.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  68a0d6b76f36ebaf:
    english: Avoid moving every discussion and decision into Loomio at once. A repeatable process gives the group a clear reason to return and lets you improve the way you run it each time.
    translation: Не переносите в Loomio сразу все обсуждения и решения. Повторяющийся процесс даст группе понятную причину возвращаться и позволит каждый раз улучшать порядок работы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4b65243ef120921b:
    english: "## Prepare the group before inviting people"
    translation: "## Подготовьте группу, прежде чем приглашать людей"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  305b29c1c832c246:
    english: 'Give people a useful and recognizable place to arrive in:'
    translation: 'Создайте для людей понятное и полезное пространство:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  76d859d168805706:
    english: |-
      - add the group's name, logo, cover image, purpose, and important links;
      - check the group's privacy and permissions;
      - add any [category tags](/en/user_manual/discussions/tags) the group will use regularly;
      - create the first real discussion, with the background information people need; and
      - create a practice discussion if members would benefit from trying comments, reactions, and voting without consequences.
    translation: |-
      - добавьте название группы, логотип, обложку, описание её цели и важные ссылки;
      - проверьте настройки конфиденциальности и разрешений группы;
      - добавьте [теги категорий](/en/user_manual/discussions/tags), которые группа будет регулярно использовать;
      - создайте первое рабочее обсуждение и добавьте сведения, необходимые участникам; и
      - создайте пробное обсуждение, если участникам полезно без последствий попробовать комментарии, реакции и голосование.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f1decb57ec9d48cb:
    english: Use your own photo in your profile and the organization's logo for the group. This helps people recognize who invited them and which organization an email is about.
    translation: Добавьте свою фотографию в профиль, а логотип организации — в группу. Так людям будет проще понять, кто их пригласил и от какой организации пришло письмо.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '01965093f234bb36':
    english: "## Decide where work belongs"
    translation: "## Определите, где вести работу"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7fbd0d770cbed2bd:
    english: 'Loomio can sit alongside tools your group already uses:'
    translation: 'Loomio можно использовать вместе с инструментами, к которым ваша группа уже привыкла:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '0168271b154f6931':
    english: |-
      | Use | Good place for it |
      |---|---|
      | Quick questions, social conversation, and timely updates | Chat, such as Slack, Teams, Matrix, or Discord |
      | Collaborative editing of a living document | A shared document tool |
      | Assigning work and tracking its completion | A task or project-management tool |
      | A focused discussion, broad participation, a decision, and its lasting record | Loomio |
    translation: |-
      | Задача | Подходящий инструмент |
      |---|---|
      | Короткие вопросы, неформальное общение и своевременные новости | Чат, например Slack, Teams, Matrix или Discord |
      | Совместное редактирование документа, который постоянно обновляется | Инструмент для совместной работы с документами |
      | Распределение задач и отслеживание их выполнения | Инструмент для управления задачами или проектами |
      | Предметное обсуждение, широкое участие, принятие решения и сохранение его истории | Loomio |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  50fae2027411e538:
    english: Link to documents and other systems from the group description or discussion context. Use [chat integrations](/en/user_manual/integrations/chatbots) to bring important Loomio activity into a channel people already follow.
    translation: Добавьте ссылки на документы и другие системы в описание группы или в контекст обсуждения. Используйте [интеграции с чатами](/en/user_manual/integrations/chatbots), чтобы важные события в Loomio появлялись в канале, за которым люди уже следят.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ed67af54bdf1c775:
    english: Tell members what you expect to happen in Loomio. A simple boundary such as “important discussions and decisions go in Loomio; quick coordination stays in chat” is easier to adopt than an unexplained new tool.
    translation: Расскажите участникам, какую работу вы планируете вести в Loomio. Простое правило, например «важные обсуждения и решения — в Loomio, быстрая координация — в чате», легче принять, чем новый инструмент без объяснения его роли.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0a799d7911a46f6f:
    english: "## Decide how your group decides"
    translation: "## Определите, как ваша группа принимает решения"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e1c64de2dc68593:
    english: Loomio does not require every group, or every decision, to use the same process. Some groups arrive with established rules. Others use Loomio while they develop a clearer decision-making practice together.
    translation: Loomio не требует, чтобы все группы и все решения подчинялись одному порядку. У некоторых групп уже есть установленные правила. Другие используют Loomio, пока вместе вырабатывают более ясный порядок принятия решений.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6d0c0f50959ab9d6:
    english: "### If your process is already established"
    translation: "### Если порядок уже установлен"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5fbfe86e935d5a8c:
    english: 'Translate the group''s existing requirements into Loomio. Before running a formal decision, make sure participants can tell:'
    translation: 'Настройте работу в Loomio с учётом действующих требований группы. Прежде чем проводить формальное голосование, убедитесь, что участникам понятно:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9a1b89bd4c5fe02c:
    english: |-
      - which kinds of decisions can be made in Loomio;
      - who provides input and who has authority to decide;
      - who is eligible to vote;
      - whether a [quorum](/en/user_manual/polls/quorum) is required;
      - whether the decision requires a majority, supermajority, unanimous agreement, consent, or another [vote share requirement](/en/user_manual/polls/vote_share_requirements);
      - whether the decision takes effect when its outcome is published or must be ratified elsewhere; and
      - who will record and carry out the outcome.
    translation: |-
      - какие решения можно принимать в Loomio;
      - кто высказывает мнение и кто уполномочен принимать решение;
      - кто имеет право голосовать;
      - требуется ли [кворум](/en/user_manual/polls/quorum);
      - требуется ли для решения простое или квалифицированное большинство, единогласие, согласие либо другая [необходимая доля голосов](/en/user_manual/polls/vote_share_requirements);
      - вступает ли решение в силу после публикации его итога или его нужно утвердить в другом порядке; и
      - кто зафиксирует и выполнит решение.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4b48b6e0aff5cfc0:
    english: If your constitution, bylaws, policy, or local law governs electronic decisions, make sure the Loomio process follows those requirements. Configure [delegated voters](/en/user_manual/groups/delegated_voters), proposal settings, and [poll templates](/en/user_manual/polls/poll_templates) to make the agreed process easy to repeat.
    translation: Если электронное принятие решений регулируется уставом, внутренними правилами, политикой или местным законодательством, убедитесь, что процесс в Loomio соответствует этим требованиям. Настройте [делегированных голосующих](/en/user_manual/groups/delegated_voters), параметры предложений и [шаблоны голосований](/en/user_manual/polls/poll_templates), чтобы группе было легко повторять согласованный процесс.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b068624ed6c7c6b3:
    english: "### If your group is still deciding"
    translation: "### Если группа ещё выбирает порядок"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  14449de544d28a6b:
    english: 'Start a discussion about how decisions should be made. Instead of beginning with a voting tool, ask the group to consider:'
    translation: 'Начните обсуждение того, как принимать решения. Прежде чем выбирать инструмент для голосования, предложите группе подумать над вопросами:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f65b39a74ae25ed7:
    english: |-
      - What kinds of decisions do we make?
      - Who is affected, who should be consulted, and who is responsible for deciding?
      - Which decisions need advice, consent, consensus, a vote, or delegated authority?
      - What level of participation or support makes a decision valid?
      - How will we respond to objections, tied results, or insufficient participation?
      - How will we communicate, record, review, and change a decision?
    translation: |-
      - Какие решения мы принимаем?
      - Кого они затрагивают, с кем нужно посоветоваться и кто отвечает за принятие решения?
      - Для каких решений нужны рекомендации, согласие, консенсус, голосование или делегирование полномочий?
      - Какой уровень участия или поддержки делает решение действительным?
      - Что мы будем делать при возражениях, равенстве голосов или недостаточном участии?
      - Как мы будем сообщать о решении, фиксировать, пересматривать и изменять его?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ce7c0af2ad170b5c:
    english: The answers may be different for an operational decision, a policy, an election, and a constitutional change. See [Making decisions](/en/guides/making_decisions) to compare several complete processes.
    translation: Ответы могут различаться для организационного решения, внутренней политики, выборов и изменения устава. В руководстве [Принятие решений](/en/guides/making_decisions) можно сравнить несколько полных процессов.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  aac26fc96b90744d:
    english: If the group is not ready to settle every rule, agree on a provisional process for one low-risk decision. State what the result will mean before asking people to participate, publish an outcome, then review how the process worked. Record what the group learns in its description, governance documents, or reusable templates.
    translation: Если группа пока не готова установить все правила, согласуйте временный порядок для одного решения с низким риском. Прежде чем приглашать людей к участию, объясните, что будет означать результат. Затем опубликуйте итог и обсудите, как прошёл процесс. Зафиксируйте выводы группы в её описании, документах об управлении или шаблонах для повторного использования.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  23ed8fb3e887afbc:
    english: "## Invite people"
    translation: "## Пригласите людей"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a5d369ad9df691fe:
    english: "[Invite people](/en/user_manual/groups/inviting_people) with a short personal message that explains:"
    translation: "[Пригласите людей](/en/user_manual/groups/inviting_people), добавив короткое личное сообщение с пояснением:"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3383207ff2fcc99b:
    english: |-
      - why the group is using Loomio;
      - what you are asking them to do first;
      - when you need their response; and
      - where they can get help.
    translation: |-
      - зачем группа использует Loomio;
      - что вы просите сделать в первую очередь;
      - когда вам нужен ответ; и
      - где можно получить помощь.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  282ef8673815823e:
    english: You can begin with a small group of people who will actively test the process, or invite the whole group when everyone needs to participate from the start. In either case, have a discussion ready for them rather than inviting people into an empty group.
    translation: Можно начать с небольшой группы людей, которые будут активно проверять процесс, или сразу пригласить всю группу, если участие каждого необходимо с самого начала. В любом случае подготовьте обсуждение до отправки приглашений, чтобы люди не попадали в пустую группу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cd6511a78ce7c9b7:
    english: "## Help everyone participate once"
    translation: "## Помогите каждому принять участие хотя бы раз"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a37273687b4f4b0:
    english: The first objective is for each person to cross the threshold from receiving an invitation to contributing something.
    translation: Первая цель — помочь каждому перейти от получения приглашения к участию в работе группы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ce285f27cca389c4:
    english: 'Ask people to:'
    translation: 'Попросите людей:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d0b9e80af995edff:
    english: |-
      1. sign in and add a profile photo;
      2. open the welcome or practice discussion;
      3. post a short comment or reaction; and
      4. vote in a low-stakes proposal and, if useful, leave a reason.
    translation: |-
      1. войти в систему и добавить фотографию профиля;
      2. открыть приветственное или пробное обсуждение;
      3. оставить короткий комментарий или реакцию; и
      4. проголосовать по предложению, которое не связано с серьёзными последствиями, и при желании объяснить свой выбор.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  919e32e7adb7c4c8:
    english: Members do not need to create a password. They can [sign in by email](/en/user_manual/users/signing_in), and they can reply to eligible discussion emails without first navigating back to the thread.
    translation: Участникам не нужно создавать пароль. Они могут [войти по электронной почте](/en/user_manual/users/signing_in), а на подходящие для этого письма об обсуждении — ответить прямо из почты, не открывая тему в Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  22ceb7104d416acf:
    english: "## Use notifications deliberately"
    translation: "## Используйте уведомления осознанно"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dd99e6dd5c93d9ee:
    english: Access to content and notification about it are separate. Group members can find discussions in their group even when they were not notified immediately.
    translation: Доступ к материалу и уведомление о нём — разные вещи. Участники группы могут найти обсуждения своей группы, даже если не получили уведомление сразу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0e20732d957eb282:
    english: When starting a discussion, notify the people whose input is needed at that stage. Use @mentions and replies when asking particular people to respond. When voting opens later, invite the eligible voters.
    translation: Начиная обсуждение, уведомите людей, чьё мнение нужно на этом этапе. Используйте @упоминания и ответы, когда обращаетесь к конкретным людям. Когда позже начнётся голосование, пригласите тех, кто имеет право голосовать.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  43339ff0f3d30a50:
    english: If you create a discussion and poll together only to capture a vote, avoid sending a discussion invitation immediately followed by a poll invitation. Either start the discussion without notifying people and invite them through the poll, or run a [standalone poll](/en/user_manual/polls/intro_to_decisions#without-a-discussion).
    translation: Если вы создаёте обсуждение и голосование одновременно только для сбора голосов, не отправляйте приглашение к обсуждению сразу перед приглашением к голосованию. Начните обсуждение без уведомлений и пригласите людей через голосование либо проведите [голосование без обсуждения](/en/user_manual/polls/intro_to_decisions#without-a-discussion).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  467cf9d1e5bd2973:
    english: Show members the [Catch-up and notification settings](/en/user_manual/users/email_settings), especially if they do not expect to visit Loomio every day.
    translation: Покажите участникам [настройки писем со сводкой и уведомлений](/en/user_manual/users/email_settings), особенно если они не планируют заходить в Loomio каждый день.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ebe7764d64b17823:
    english: "## Complete the first process"
    translation: "## Завершите первый процесс"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9a165c59ba0aed5a:
    english: 'A first process should demonstrate the complete pattern:'
    translation: 'Первый процесс должен пройти все этапы:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8bc60d4319adf204:
    english: |-
      1. Introduce the topic and provide context.
      2. Invite discussion or questions when they are needed.
      3. Start the appropriate proposal or poll.
      4. Remind people who have not participated when necessary.
      5. Publish an [outcome](/en/user_manual/polls/outcomes) stating what was decided and what happens next.
    translation: |-
      1. Представьте тему и дайте необходимую информацию.
      2. Пригласите участников к обсуждению и вопросам, когда это потребуется.
      3. Начните подходящее предложение или голосование.
      4. При необходимости напомните тем, кто ещё не участвовал.
      5. Опубликуйте [итоговое решение](/en/user_manual/polls/outcomes): укажите, что решили и что будет дальше.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1235244007a8559b:
