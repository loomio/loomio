      | Ota saamasi neuvot huomioon, tee päätös ja kerro siitä neuvoja antaneille. | Lisää keskusteluketjuun **tulos**.   <br /><br />Kerro, mitä päätit, ja kiitä ihmisiä neuvoista ja palautteesta.  <br /><br />   Kerro, mitä tapahtuu seuraavaksi, ja ilmoita tuloksesta muille.  <br /><br />Tulos tallentaa päätöksen myöhempää käyttöä varten. <br /> <br /> Lisää tulos keskustelun taustatietoihin tai kirjoita se kommenttiin, jonka kiinnität aikajanalle, jotta löydät sen myöhemmin nopeasti.<br /><br/> |
