  a29c1c76443ad97f:
    english: Good governance is more than a board meeting, it requires good communication before and after meetings.
    translation: El buen gobierno va más allá de las reuniones de la junta directiva. Requiere una buena comunicación antes y después de cada reunión.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9f05171a74ac30d0:
    english: |-
      This guide is intended to help you use Loomio in your board or committee, so you can stay connected between meetings, deal with urgent matters and reduce board admin.
      - Continue governance between meetings
      - Keep track of communications
      - Use board meetings for issues that matter
      - Preserve institutional memory with a detailed record
    translation: |-
      Esta guía te ayuda a usar Loomio en tu junta directiva o comité para mantener el contacto entre reuniones, atender asuntos urgentes y reducir el trabajo administrativo.
      - Continuar la labor de gobierno entre reuniones
      - Llevar un registro de las comunicaciones
      - Dedicar las reuniones de la junta a los asuntos importantes
      - Preservar la memoria institucional con un registro detallado
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bce24543243c913b:
    english: 'Loomio is a versatile discussion and decision-making tool for collaborative boards and committees. '
