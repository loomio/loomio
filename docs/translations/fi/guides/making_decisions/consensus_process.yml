  9872b82ded022524:
    english: |-
      ## Key points
      - Discuss and develop a proposal together
      - Include and respect everyone involved
      - Seek agreement from most people
    translation: |-
      ## Keskeiset asiat
      - Keskustelkaa ehdotuksesta ja kehittäkää sitä yhdessä
      - Ottakaa kaikki asianosaiset mukaan ja kunnioittakaa heitä
      - Pyrkikää saamaan useimpien hyväksyntä
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a1cd3fa440013e0c:
    english: "**Consensus is typically used in:**\n- Working teams building shared understanding of an issue or opportunity, collaborating on a proposal and deciding course of action. \n- Governance board decisions where the board shows it is acting jointly, such as decisions on vision, policy, strategic planning and budget.\n- AGMs and General Assemblies where members and stakeholders seek general agreement for major decisions, such as revisions to statutes, major transactions and the elections of directors or council members."
    translation: |-
      **Konsensusprosessia käytetään tavallisesti:**
      - Työryhmissä, jotka rakentavat yhteistä ymmärrystä asiasta tai mahdollisuudesta, laativat ehdotuksen yhdessä ja päättävät toimintatavasta.
      - Hallitusten päätöksenteossa, kun hallitus toimii yhdessä esimerkiksi visiota, toimintaperiaatteita, strategista suunnittelua tai talousarviota koskevissa päätöksissä.
      - Vuosikokouksissa ja yleiskokouksissa, joissa jäsenet ja sidosryhmät etsivät laajaa yhteisymmärrystä merkittävistä päätöksistä, kuten sääntömuutoksista, suurista liiketoimista sekä hallituksen tai neuvoston jäsenten valinnasta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7c5d3122a1333ba5:
    english: |-
      **Typical roles:**
      - Appoint a facilitator.  In board meetings this is usually the Chairperson.
      - A quorum or supermajority of members to participate, as specified in the organization's statutes.
    translation: |-
      **Tyypilliset roolit:**
      - Nimetkää keskustelun ohjaaja.  Hallituksen kokouksissa tämä on yleensä puheenjohtaja.
      - Osallistumiseen tarvitaan järjestön säännöissä määritelty päätösvaltainen määrä tai määräenemmistö jäseniä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1d8ee54aa5e87423:
    english: |-
      ## Consensus process steps
      1. State the issue to be decided - start a Loomio **discussion**.
      2. Present a proposal to test for consensus - start a **Sense check proposal**.
      3. Clarify any points, invite constructive modifications and amend the proposal.
      4. Test for agreement - start a **Consensus proposal**.
      5. Outcome - state the decision **outcome**.
    translation: |-
      ## Konsensusprosessin vaiheet
      1. Kerro, mistä asiasta on päätettävä – aloita Loomiossa **keskustelu**.
      2. Esitä ehdotus yhteisymmärryksen kartoittamiseksi – aloita **tunnusteluehdotus**.
      3. Selvennä epäselvät kohdat, pyydä rakentavia muutosehdotuksia ja muokkaa ehdotusta.
      4. Selvitä, onko ehdotuksella hyväksyntä – aloita **konsensusehdotus**.
      5. Kerro päätöksen **johtopäätös**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0b5249cfd4c92c35:
    english: |-
      ## Benefits
      - Grow shared understanding.
      - Decisions for the collective will of the group.
      - Encourage people to value the group over their personal preferences.
    translation: |-
      ## Hyödyt
      - Yhteinen ymmärrys kasvaa.
      - Päätökset heijastavat ryhmän yhteistä tahtoa.
      - Osallistujat oppivat asettamaan ryhmän tarpeet omien mieltymystensä edelle.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  55d7d6c48f056550:
    english: "## Applying the Consensus process on Loomio"
    translation: "## Konsensusprosessin käyttö Loomiossa"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e50b473237140170:
    english: |-
      | **Consensus process** | **On Loomio** |
      |---|---|
      | You notice a problem or opportunity and take the initiative. |  |
      | **State the issue to be decided**  <br /><br />Provide background information and open a broad ranging discussion to build shared understanding. Look for emerging proposals. | Start a Loomio discussion <br /><br />Name the topic of discussion in the discussion title, and what you hope to achieve. <br /><br />Attach or link to background information. Invite people to ask questions, contribute information and write comments. |
      | **Present a proposal** <br /><br />Test for consensus. | Run a [Sense check proposal](/en/user_manual/polls/proposals/sense_check/). <br /><br />*In the title:* Name the proposal. <br /><br />*In the proposal details:* Clearly frame the proposal and say why it is important.  Include any background information necessary and a link to the proposal.  <br /><br />Invite everyone to respond, and to do so before the proposal closes.  |
      | **Amendment** <br /><br />Discuss, clarify and amend the proposal. <br /><br />Seek to understand and resolve any objections. <br /><br />Invite people objecting to to propose a constructive and practical modification to the proposed decision or course of action. | Facilitate discussion in the thread to address concerns and modify the proposal. |
      | **Agreement** <br /><br />Do you have an agreement?  Check for: <br /><br />Agreement: I support the proposal. <br /><br />Abstain: This decision does not affect me and I am happy with whatever the group decides. <br /><br />Disagreement: Something in the proposal needs to be changed before I can support it. <br /><br />Block: I have a fundamental disagreement with the proposal that cannot be resolved. | Run a [Consensus proposal](/en/user_manual/polls/proposals/consensus/) with the current proposal version. <br /><br />*In the title:* Name the decision to be made. <br /><br />*In the proposal details:* Present the proposal and invite people to vote. <br /><br />Include a clear statement of what agreement means, say 'for this proposal to pass, we need everyone to vote agree' or 'for this proposal to pass, we need 75% of members to agree'.  <br /><br />Ask participants to leave a vote 'Reason' - and if they do not agree to say why, and what needs to change for them to agree. <br /><br />Some organizations also use the Block (or veto) voting option. <br /><br />As voting progresses, respond to comments, post updates, close early, or let the proposal run to conclusion. <br /><br />Participants can *“change vote”* up to proposal close time, say in response to new information that arrives during voting. |
      | **Outcome** <br /><br />State if agreement was reached and the decision that has been made. <br /><br />Implement the decision and plan actions to be taken. | Consider voting results and state the decision made. <br /><br />Summarize results of the process and say what will happen next. <br /><br />If results are inconclusive, you may choose to re-open the discussion and run a new proposal. <br /><br />The outcome statement is an important record of the decision for future reference. |
    translation: |-
      | **Konsensusprosessi** | **Loomiossa** |
      |---|---|
      | Huomaat ongelman tai mahdollisuuden ja teet aloitteen. |  |
      | **Kerro, mistä asiasta on päätettävä**  <br /><br />Anna taustatiedot ja aloita laaja keskustelu yhteisen ymmärryksen rakentamiseksi. Tarkkaile keskustelussa syntyviä ehdotuksia. | Aloita Loomiossa keskustelu <br /><br />Kerro keskustelun otsikossa, mistä aiheesta keskustellaan ja mitä haluatte saavuttaa. <br /><br />Liitä tai linkitä taustatiedot. Kutsu ihmisiä esittämään kysymyksiä, jakamaan tietoa ja kirjoittamaan kommentteja. |
      | **Esitä ehdotus** <br /><br />Kartoita yhteisymmärrystä. | Aloita [tunnusteluehdotus](/en/user_manual/polls/proposals/sense_check/). <br /><br />*Otsikossa:* Nimeä ehdotus. <br /><br />*Ehdotuksen tiedoissa:* Kuvaa ehdotus selkeästi ja kerro, miksi se on tärkeä. Lisää tarvittavat taustatiedot ja linkki ehdotukseen. <br /><br />Kutsu kaikki vastaamaan ennen ehdotuksen sulkeutumista. |
      | **Muokkaaminen** <br /><br />Keskustelkaa ehdotuksesta, selventäkää sitä ja muokatkaa sitä. <br /><br />Pyrkikää ymmärtämään ja ratkaisemaan vastalauseet. <br /><br />Pyydä ehdotusta vastustavia ihmisiä esittämään rakentava ja toteuttamiskelpoinen muutos päätökseen tai toimintatapaan. | Ohjaa keskustelua ketjussa, jotta huoliin voidaan vastata ja ehdotusta muokata. |
      | **Hyväksyntä** <br /><br />Onko ehdotuksella hyväksyntä? Tarkista vastaukset: <br /><br />Samaa mieltä: Kannatan ehdotusta. <br /><br />Pidättäydyn: Päätös ei vaikuta minuun, ja ryhmän ratkaisu sopii minulle. <br /><br />Eri mieltä: Ehdotuksessa on jotain, mitä on muutettava ennen kuin voin kannattaa sitä. <br /><br />Estän: Olen ehdotuksesta perustavanlaatuisesti eri mieltä, eikä erimielisyyttä voida ratkaista. | Aloita [konsensusehdotus](/en/user_manual/polls/proposals/consensus/) ehdotuksen nykyisestä versiosta. <br /><br />*Otsikossa:* Nimeä tehtävä päätös. <br /><br />*Ehdotuksen tiedoissa:* Esitä ehdotus ja kutsu ihmiset äänestämään. <br /><br />Kerro selkeästi, mitä hyväksyntä edellyttää. Voit esimerkiksi kirjoittaa: ”Ehdotus hyväksytään, jos kaikki äänestävät samaa mieltä” tai ”Ehdotus hyväksytään, jos 75 % jäsenistä äänestää samaa mieltä”. <br /><br />Pyydä osallistujia kirjoittamaan äänelleen ”Syy”. Jos he eivät ole samaa mieltä, pyydä heitä kertomaan miksi ja mitä pitäisi muuttaa, jotta he voisivat kannattaa ehdotusta. <br /><br />Jotkin järjestöt käyttävät myös Estän-äänestysvaihtoehtoa eli veto-oikeutta. <br /><br />Äänestyksen aikana voit vastata kommentteihin, julkaista päivityksiä, sulkea ehdotuksen etuajassa tai antaa sen olla avoinna sulkeutumisaikaan asti. <br /><br />Osallistujat voivat *”muuttaa ääntään”* ehdotuksen sulkeutumiseen asti esimerkiksi äänestyksen aikana saatujen uusien tietojen perusteella. |
      | **Johtopäätös** <br /><br />Kerro, saavutettiinko yhteisymmärrys ja mikä päätös tehtiin. <br /><br />Toteuttakaa päätös ja suunnitelkaa tarvittavat toimet. | Tarkastele äänestystuloksia ja kerro tehty päätös. <br /><br />Tee yhteenveto prosessin tuloksista ja kerro, mitä seuraavaksi tapahtuu. <br /><br />Jos tulokset eivät anna selvää vastausta, voit avata keskustelun uudelleen ja aloittaa uuden ehdotuksen. <br /><br />Johtopäätös on tärkeä päätöksen kirjaus myöhempää käyttöä varten. |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
