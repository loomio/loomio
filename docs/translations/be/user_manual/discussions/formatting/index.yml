    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dcf90e79aba1a2f9:
    english: |-
      1. Select the text you want to link to - say the name of a document.
      2. Click the link icon.
      3. Paste the address into the **Insert link** field and select **Apply**.
    translation: |-
      1. Вылучыце тэкст, які будзе спасылкай, напрыклад назву дакумента.
      2. Націсніце значок спасылкі.
      3. Устаўце адрас у поле **Уставіць спасылку** і націсніце **Ужыць**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  40ecf7d0c79432b2:
    english: For a document hosted elsewhere, check its sharing permissions so discussion participants can open it.
    translation: Калі дакумент захоўваецца на іншым сэрвісе, праверце налады доступу, каб удзельнікі абмеркавання маглі яго адкрыць.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3f1824fc07dded13:
    english: A preview of the doc will appear under the text space. You can remove this if you want.
    translation: Пад тэкставым полем з’явіцца папярэдні прагляд дакумента. Пры жаданні яго можна выдаліць.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c6061aa7deff27ac:
