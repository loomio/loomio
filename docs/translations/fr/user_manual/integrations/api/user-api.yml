---
navigation_title: API utilisateur
blocks:
  0217b93dddc627ac:
    english: "# Loomio User API documentation"
    translation: "# Documentation de l’API utilisateur de Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bc6fcbf5f783fd29:
    english: "<!-- seo-description: Use the Loomio User API to create and manage discussions, comments, polls, threads, and group memberships from other software. -->"
    translation: "<!-- seo-description: Utilisez l’API utilisateur de Loomio pour créer et gérer des discussions, des commentaires, des sondages, des fils de discussion et des adhésions aux groupes depuis d’autres logiciels. -->"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cc2da08540808ada:
    english: "`/api/b2` is the user-oriented API for integrations with Loomio. It uses the API key of a user account, and every action is performed as that user."
    translation: "`/api/b2` est l’API destinée aux intégrations utilisateur avec Loomio. Elle utilise la clé API d’un compte utilisateur, et chaque action est effectuée au nom de ce compte."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7036a6661aac00f2:
    english: Group operations use the memberships and group permissions of the API-key user. Instance-administrator status does not expand an API key's access to groups or content; use the Server API for instance-level administration.
    translation: Les opérations sur les groupes dépendent des adhésions et des autorisations de groupe de l’utilisateur auquel appartient la clé API. Le statut d’administrateur de l’instance n’étend pas l’accès de cette clé aux groupes ou aux contenus. Pour administrer l’instance, utilisez l’API serveur.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c4436493b062b9f1:
    english: Use the API key from the Loomio user account that will perform the actions. A dedicated bot account is useful when an integration should not be invited to polls or receive notifications.
    translation: Utilisez la clé API du compte Loomio qui effectuera les actions. Un compte robot dédié est utile si l’intégration ne doit pas être invitée aux sondages ni recevoir de notifications.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ade21c593f08100c:
    english: Signed-in users can find their API key and group IDs on the [API access page](/profile/api_access).
    translation: Les utilisateurs connectés trouveront leur clé API et les identifiants de leurs groupes sur la [page d’accès à l’API](/profile/api_access).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  15160edafaf441c1:
    english: 'Send the API key in an `Authorization: Bearer` header. API keys in query strings are rejected because URLs can be recorded by proxies and access logs.'
    translation: 'Envoyez la clé API dans l’en-tête `Authorization: Bearer`. Les clés API placées dans les paramètres d’URL sont rejetées, car les URL peuvent être enregistrées par les serveurs mandataires et les journaux d’accès.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2215e57186277325:
    english: "### Authentication change"
    translation: "### Changement du mode d’authentification"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ff5f4c1055e80fb6:
    english: 'The API key was previously accepted as an `api_key` URL parameter. Requests using `?api_key=YOUR_API_KEY` no longer work. Use the HTTP `Authorization` header instead:'
    translation: 'La clé API était auparavant acceptée dans le paramètre d’URL `api_key`. Les requêtes utilisant `?api_key=YOUR_API_KEY` ne fonctionnent plus. Utilisez désormais l’en-tête HTTP `Authorization` :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  65574ba500243c80:
    english: The examples use `YOUR_API_KEY`, group ID `123`, and `https://www.loomio.com/`. Replace these with your API key, group ID, and Loomio installation URL.
    translation: Les exemples utilisent `YOUR_API_KEY`, l’identifiant de groupe `123` et `https://www.loomio.com/`. Remplacez-les par votre clé API, l’identifiant de votre groupe et l’URL de votre installation Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bec1e4f30aeef4ce:
    english: "## Response size and related records"
    translation: "## Taille des réponses et enregistrements associés"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  da004eb4e005fae1:
    english: 'User API responses use a compound format: the primary records are accompanied by related records such as topics, groups, users, polls, and reactions. This lets a client populate a local record store from one request, but can include more data than a simple integration needs.'
    translation: 'Les réponses de l’API utilisateur ont un format composé : les enregistrements principaux sont accompagnés d’enregistrements associés, comme les sujets, les groupes, les utilisateurs, les sondages et les réactions. Un client peut ainsi remplir son stockage local avec une seule requête. La réponse peut toutefois contenir plus de données que nécessaire pour une intégration simple.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  64d9a631b54cbaba:
    english: Pass `compact=1` to omit bulky related topics, groups, parent groups, memberships, reactions, tags, and translations. Primary records and the related records needed to interpret their content remain present.
    translation: Ajoutez `compact=1` pour omettre les sujets, groupes, groupes parents, adhésions, réactions, étiquettes et traductions associés les plus volumineux. Les enregistrements principaux et les enregistrements associés nécessaires pour comprendre leur contenu restent présents.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e4e671db39dbe6f1:
    english: For direct control, pass `exclude_types` with space-separated singular record types. For example, `exclude_types=group reaction` omits related groups and reactions. Common values are `topic`, `group`, `parent`, `membership`, `reaction`, `tag`, `translation`, `user`, `discussion`, `poll`, `poll_option`, `stance`, `stance_choice`, `outcome`, and `topic_item`. Exclusions apply to related records, not the primary resource requested by the endpoint.
    translation: Pour choisir les exclusions, utilisez `exclude_types` avec des types d’enregistrements au singulier, séparés par des espaces. Par exemple, `exclude_types=group reaction` omet les groupes et les réactions associés. Les valeurs courantes sont `topic`, `group`, `parent`, `membership`, `reaction`, `tag`, `translation`, `user`, `discussion`, `poll`, `poll_option`, `stance`, `stance_choice`, `outcome` et `topic_item`. Les exclusions concernent les enregistrements associés, pas la ressource principale demandée à l’endpoint.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ded075da3c2aa815:
    english: Collection responses include `meta.total` when an exact collection size is defined. The total is calculated before `limit` and `offset` are applied. Endpoints such as search that intentionally return a bounded result set omit `meta.total` rather than returning `null`.
    translation: Les réponses contenant une collection incluent `meta.total` lorsque sa taille exacte est définie. Ce total est calculé avant l’application de `limit` et `offset`. Les endpoints comme la recherche, qui renvoient volontairement un ensemble limité de résultats, omettent `meta.total` au lieu de renvoyer `null`.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  17cb8ef90a2acdb3:
    english: "## Endpoint summary"
    translation: "## Résumé des endpoints"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  608edb13080e57c2:
    english: |-
      | Method | Endpoint | Purpose |
      | --- | --- | --- |
      | `GET` | `/api/b2/groups` | List the API-key user's groups |
      | `GET` | `/api/b2/groups/:id_or_key_or_handle` | Get a visible group |
      | `GET` | `/api/b2/reports` | Generate a participation report |
      | `GET` | `/api/b2/search` | Search visible discussions, comments, polls, votes, and outcomes |
      | `POST` | `/api/b2/discussions` | Create a discussion |
      | `GET` | `/api/b2/discussions/:id` | Get a discussion |
      | `GET` | `/api/b2/discussions` | List discussions in a group |
      | `PATCH` | `/api/b2/discussions/:id` | Edit a discussion |
      | `DELETE` | `/api/b2/discussions/:id` | Soft-delete a discussion |
      | `GET` | `/api/b2/threads` | List visible discussion and standalone-poll threads |
      | `GET` | `/api/b2/threads/:topic_id` | Get a thread |
      | `GET` | `/api/b2/threads/:topic_id/items` | Get the ordered items in a thread |
      | `GET` | `/api/b2/threads/:topic_id/markdown` | Get a complete thread as Markdown |
      | `POST` | `/api/b2/comments` | Create a comment or reply |
      | `PATCH` | `/api/b2/comments/:id` | Edit a comment |
      | `DELETE` | `/api/b2/comments/:id` | Soft-delete a comment |
      | `POST` | `/api/b2/polls` | Create a poll |
      | `GET` | `/api/b2/polls/:id` | Get a poll |
      | `GET` | `/api/b2/polls` | List polls in a group |
      | `PATCH` | `/api/b2/polls/:id` | Edit a poll |
      | `DELETE` | `/api/b2/polls/:id` | Soft-delete a poll |
      | `GET` | `/api/b2/memberships` | List a group's memberships |
      | `POST` | `/api/b2/memberships` | Add members and optionally remove absent members |
      | `GET` | `/api/b2/chatbots` | List a group's chat integrations and webhooks |
      | `POST` | `/api/b2/chatbots` | Create a chat integration or webhook |
      | `PATCH` | `/api/b2/chatbots/:id` | Update a chat integration or webhook |
      | `DELETE` | `/api/b2/chatbots/:id` | Delete a chat integration or webhook |
      | `POST` | `/api/b2/chatbots/check` | Send a webhook connection test |
    translation: |-
      | Méthode | Endpoint | Fonction |
      | --- | --- | --- |
      | `GET` | `/api/b2/groups` | Lister les groupes de l’utilisateur auquel appartient la clé API |
      | `GET` | `/api/b2/groups/:id_or_key_or_handle` | Obtenir un groupe visible |
      | `GET` | `/api/b2/reports` | Générer un rapport de participation |
      | `GET` | `/api/b2/search` | Rechercher les discussions, commentaires, sondages, votes et conclusions visibles |
      | `POST` | `/api/b2/discussions` | Créer une discussion |
      | `GET` | `/api/b2/discussions/:id` | Obtenir une discussion |
      | `GET` | `/api/b2/discussions` | Lister les discussions d’un groupe |
      | `PATCH` | `/api/b2/discussions/:id` | Modifier une discussion |
      | `DELETE` | `/api/b2/discussions/:id` | Supprimer une discussion de manière réversible |
      | `GET` | `/api/b2/threads` | Lister les fils de discussion et les fils de sondages autonomes visibles |
      | `GET` | `/api/b2/threads/:topic_id` | Obtenir un fil de discussion |
      | `GET` | `/api/b2/threads/:topic_id/items` | Obtenir les éléments d’un fil dans l’ordre |
      | `GET` | `/api/b2/threads/:topic_id/markdown` | Obtenir un fil complet au format Markdown |
      | `POST` | `/api/b2/comments` | Créer un commentaire ou une réponse |
      | `PATCH` | `/api/b2/comments/:id` | Modifier un commentaire |
      | `DELETE` | `/api/b2/comments/:id` | Supprimer un commentaire de manière réversible |
      | `POST` | `/api/b2/polls` | Créer un sondage |
      | `GET` | `/api/b2/polls/:id` | Obtenir un sondage |
      | `GET` | `/api/b2/polls` | Lister les sondages d’un groupe |
      | `PATCH` | `/api/b2/polls/:id` | Modifier un sondage |
      | `DELETE` | `/api/b2/polls/:id` | Supprimer un sondage de manière réversible |
      | `GET` | `/api/b2/memberships` | Lister les adhésions à un groupe |
      | `POST` | `/api/b2/memberships` | Ajouter des membres et, éventuellement, retirer les membres absents de la liste |
      | `GET` | `/api/b2/chatbots` | Lister les intégrations de chat et les webhooks d’un groupe |
      | `POST` | `/api/b2/chatbots` | Créer une intégration de chat ou un webhook |
      | `PATCH` | `/api/b2/chatbots/:id` | Mettre à jour une intégration de chat ou un webhook |
      | `DELETE` | `/api/b2/chatbots/:id` | Supprimer une intégration de chat ou un webhook |
      | `POST` | `/api/b2/chatbots/check` | Envoyer un test de connexion à un webhook |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0473f1f7fb78f074:
    english: "## Groups"
    translation: "## Groupes"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dc819221f371c435:
    english: "### List groups"
    translation: "### Lister les groupes"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  964f575e90aa9cde:
    english: Return the groups in which the API-key user has an active membership.
    translation: Renvoie les groupes dont l’utilisateur auquel appartient la clé API est un membre actif.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3835e6e77bc0ad10:
    english: "`GET /api/b2/groups`"
    translation: "`GET /api/b2/groups`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4f588e981afc3069:
    english: The response contains all matching records in a non-paginated `groups` array. It includes parent groups and subgroups, including groups whose subscription is not currently active. Check the `enabled` field when an integration should operate only on enabled groups.
    translation: La réponse contient tous les enregistrements correspondants dans un tableau `groups` non paginé. Elle inclut les groupes parents et les sous-groupes, même lorsque leur abonnement n’est pas actif. Vérifiez le champ `enabled` si l’intégration ne doit agir que sur les groupes activés.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  213de8ce539a42c3:
    english: 'Important group fields include:'
    translation: 'Les principaux champs d’un groupe sont :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d377f7c9b224a6d7:
    english: |-
      | Field | Description |
      | --- | --- |
      | `id` | Numeric group ID used by other User API endpoints |
      | `key` | Stable short key used in Loomio URLs |
      | `handle` | Human-readable group handle |
      | `name` | Group name |
      | `full_name` | Group name including its parent-group context |
      | `parent_id` | Numeric parent-group ID for a subgroup, otherwise `null` |
      | `enabled` | Whether the group and its subscription are active |
      | `memberships_count` | Number of active and pending memberships |
      | `accepted_memberships_count` | Number of accepted memberships |
      | `pending_memberships_count` | Number of pending invitations |
      | `admin_memberships_count` | Number of group administrators |
      | `delegates_count` | Number of delegates |
      | `discussions_count` | Number of discussions directly in the group |
      | `polls_count` | Number of polls directly in the group |
      | `subgroups_count` | Number of subgroups |
    translation: |-
      | Champ | Description |
      | --- | --- |
      | `id` | Identifiant numérique du groupe utilisé par les autres endpoints de l’API utilisateur |
      | `key` | Clé courte et stable utilisée dans les URL Loomio |
      | `handle` | Identifiant lisible du groupe |
      | `name` | Nom du groupe |
      | `full_name` | Nom du groupe avec le contexte de son groupe parent |
      | `parent_id` | Identifiant numérique du groupe parent pour un sous-groupe, sinon `null` |
      | `enabled` | Indique si le groupe et son abonnement sont actifs |
      | `memberships_count` | Nombre d’adhésions actives et en attente |
      | `accepted_memberships_count` | Nombre d’adhésions acceptées |
      | `pending_memberships_count` | Nombre d’invitations en attente |
      | `admin_memberships_count` | Nombre d’administrateurs du groupe |
      | `delegates_count` | Nombre de délégués |
      | `discussions_count` | Nombre de discussions directement dans le groupe |
      | `polls_count` | Nombre de sondages directement dans le groupe |
      | `subgroups_count` | Nombre de sous-groupes |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  34f1693ba28fcb80:
    english: The response may include additional group settings, related parent-group records and the API user's memberships. Clients should ignore fields they do not use.
    translation: La réponse peut aussi inclure d’autres paramètres du groupe, des enregistrements associés au groupe parent et les adhésions de l’utilisateur de l’API. Les clients doivent ignorer les champs qu’ils n’utilisent pas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d7c327b8ed7f7bf2:
    english: "### Get a group"
    translation: "### Obtenir un groupe"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  15ab63bc2d396657:
    english: Return one group visible to the API-key user.
    translation: Renvoie un groupe visible par l’utilisateur auquel appartient la clé API.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8ba2cc9e3c67b1dd:
    english: "`GET /api/b2/groups/:id_or_key_or_handle`"
    translation: "`GET /api/b2/groups/:id_or_key_or_handle`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  71e5812ff9890c9b:
    english: The identifier can be the group's numeric ID, key or handle.
    translation: Vous pouvez identifier le groupe par son identifiant numérique, sa clé ou son identifiant lisible.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8ba79a283b7b77d5:
    english: The response contains the group in the `groups` array and uses the same fields as the list endpoint. A request for a group the API-key user cannot access returns a permission error.
    translation: La réponse contient le groupe dans le tableau `groups`, avec les mêmes champs que l’endpoint de liste. Une requête portant sur un groupe inaccessible à l’utilisateur auquel appartient la clé API renvoie une erreur d’autorisation.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  18d823df4d7f8fac:
    english: "## Webhooks"
    translation: "## Webhooks"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f33d58fc1f2fd84c:
    english: 'The User API is request-based: an integration calls Loomio when it wants to read or change data. A group webhook provides the push direction. Loomio sends selected group events to your endpoint as they happen, so an integration does not need to poll the REST API for changes.'
    translation: 'L’API utilisateur fonctionne par requêtes : une intégration appelle Loomio lorsqu’elle veut lire ou modifier des données. Un webhook de groupe permet de recevoir les changements. Loomio envoie à votre endpoint les événements sélectionnés dès qu’ils se produisent. L’intégration n’a donc pas besoin d’interroger régulièrement l’API REST.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3b5b4b0ac52b9010:
    english: 'Webhooks are configured per group and require group-administrator permission. They can be managed through the Loomio interface:'
    translation: 'Les webhooks sont configurés par groupe et nécessitent les droits d’administrateur du groupe. Vous pouvez les gérer dans l’interface Loomio :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  318710be7b3aae7d:
    english: |-
      1. Open the group.
      2. Open the group menu and select **Chat integrations**.
      3. Add the integration matching the payload format your endpoint accepts. For a general-purpose endpoint, use the Mattermost/Markdown format.
      4. Enter a name and the destination URL.
      5. Select the events that Loomio should send automatically.
      6. Save the integration and use **Test connection** to send a test message.
    translation: |-
      1. Ouvrez le groupe.
      2. Ouvrez le menu du groupe et sélectionnez **Intégrations de chat**.
      3. Ajoutez l’intégration correspondant au format de données accepté par votre endpoint. Pour un endpoint généraliste, utilisez le format Mattermost/Markdown.
      4. Saisissez un nom et l’URL de destination.
      5. Sélectionnez les événements que Loomio doit envoyer automatiquement.
      6. Enregistrez l’intégration, puis utilisez **Tester la connexion** pour envoyer un message de test.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  43fb95cf304fced6:
    english: Use an HTTPS destination with an unguessable URL. Loomio requires the destination to resolve to a public address and blocks requests to local or private network addresses.
    translation: Utilisez une destination HTTPS dont l’URL est impossible à deviner. Loomio exige que cette URL mène à une adresse publique et bloque les requêtes vers les adresses de réseaux locaux ou privés.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d8d5abffe6425bea:
    english: Agents and other integrations can instead manage webhooks through the Bearer-authenticated chatbot endpoints described below. The resource is named `chatbots` for compatibility with Loomio's chat integrations, but it also represents general outgoing webhooks.
    translation: Les agents et autres intégrations peuvent aussi gérer les webhooks au moyen des endpoints chatbot décrits ci-dessous, avec une authentification Bearer. La ressource s’appelle `chatbots` pour rester compatible avec les intégrations de chat de Loomio, mais elle représente également les webhooks sortants généraux.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  28fb6371af33b66f:
    english: "### List webhooks"
    translation: "### Lister les webhooks"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7187e5a26c3ec864:
    english: Return the chat integrations configured for a group. The API-key user must be an administrator of that group. The response includes destination URLs, so it must not be exposed to ordinary group members.
    translation: 'Renvoie les intégrations de chat configurées pour un groupe. L’utilisateur auquel appartient la clé API doit être administrateur de ce groupe. La réponse contient les URL de destination : elle ne doit donc pas être accessible aux membres ordinaires du groupe.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  788d370538bdda46:
    english: "`GET /api/b2/chatbots?group_id=123`"
    translation: "`GET /api/b2/chatbots?group_id=123`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d676ca45c3e1074a:
    english: 'The response contains a `chatbots` array with these fields:'
    translation: 'La réponse contient un tableau `chatbots` avec les champs suivants :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ca00f7d0a52ce803:
    english: |-
      | Field | Description |
      | --- | --- |
      | `id` | Integration ID used for updates and deletion |
      | `group_id` | Group receiving the events |
      | `name` | Administrative name for the integration |
      | `kind` | `webhook` for an outgoing webhook or `matrix` for a Matrix integration |
      | `webhook_kind` | Payload format: `markdown`, `slack`, `discord`, `microsoft`, or `webex` |
      | `server` | Destination URL |
      | `event_kinds` | Events sent automatically |
      | `notification_only` | Whether messages contain only the notification headline |
    translation: |-
      | Champ | Description |
