    english: |-
      - Read [How to participate](/en/user_manual/overview/how-to-participate) to learn how to comment, reply, react, and vote.
      - Read [Finding content](/en/user_manual/overview/finding-content) to learn how to locate discussions and decisions.
      - Visit [Discussions](/en/user_manual/discussions) or [Proposals and polls](/en/user_manual/polls/intro_to_decisions) for detailed guidance.
    translation: |-
      - Прочитайте раздел [Как участвовать](/en/user_manual/overview/how-to-participate), чтобы узнать, как оставлять комментарии, отвечать, ставить реакции и голосовать.
      - Прочитайте раздел [Как найти материалы](/en/user_manual/overview/finding-content), чтобы узнать, как находить обсуждения и решения.
      - Подробные инструкции есть в разделах [Обсуждения](/en/user_manual/discussions) и [Предложения и опросы](/en/user_manual/polls/intro_to_decisions).
