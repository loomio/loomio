---
navigation_title: Raccogli contributi privati
blocks:
  c4a53a596a037fc0:
    english: "# Collect private submissions"
    translation: "# Raccogli contributi privati"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b24abc6bf93b1c0f:
    english: Use a Closed group to collect private submissions from people who are not members of the group. Each submission becomes a separate discussion that the submitter and the group's review team can use to exchange information, ask questions, and record a decision. Submitters cannot see other private discussions or submissions in the group.
    translation: Usa un gruppo Chiuso per raccogliere contributi privati da persone che non ne sono membri. Ogni contributo diventa una discussione separata, in cui chi l'ha inviato e il gruppo incaricato della valutazione possono scambiarsi informazioni, fare domande e registrare una decisione. Chi invia un contributo non può vedere le altre discussioni o gli altri contributi privati nel gruppo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  feb5105698bca188:
    english: Nominations are a clear use case when candidate details or the list of nominees must remain private during selection. A person can nominate themselves or someone else for an election, appointment, committee, board, or representative role, while a selection panel reviews each nomination in its own discussion.
    translation: 'Le candidature sono un esempio: durante la selezione, i dati delle persone candidate o il loro elenco potrebbero dover restare privati. Una persona può candidare sé stessa o qualcun altro per un''elezione, una nomina, un comitato, un consiglio o un ruolo di rappresentanza. La commissione di selezione esamina ogni candidatura in una discussione separata.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a64597508a4f7f3d:
    english: 'Other suitable purposes where submissions should not be public include:'
    translation: 'Altri casi in cui i contributi devono restare privati includono:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e4bd382899a8e7d9:
    english: |-
      - Complaints, safeguarding reports, safety concerns, and incident reports
      - Appeals and requests to reconsider a decision about an individual case
      - Requests for mediation, conflict resolution, or personal support
      - Applications containing personal, financial, or eligibility information, such as hardship grants or scholarships
      - Sealed bids or tender responses that must remain private during assessment
    translation: |-
      - Reclami, segnalazioni relative alla tutela delle persone, problemi di sicurezza e segnalazioni di incidenti
      - Ricorsi e richieste di riesame di una decisione su un caso individuale
      - Richieste di mediazione, risoluzione dei conflitti o sostegno personale
      - Domande contenenti informazioni personali, finanziarie o sui requisiti di ammissibilità, come quelle per contributi economici o borse di studio
      - Offerte in busta chiusa o risposte a bandi che devono restare private durante la valutazione
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bab86da011a22a2a:
    english: This workflow is private between submitters, but it is not anonymous. Submitters need a user account, and every member of the Closed group can see the submissions. Consider who belongs to the review group before using it for sensitive information.
    translation: I contributi restano privati tra chi li invia, ma non sono anonimi. Per inviarli serve un account utente e ogni membro del gruppo Chiuso può vederli. Prima di usare questo processo per informazioni sensibili, valuta chi fa parte del gruppo incaricato della valutazione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b82ae8f3f04d257f:
    english: "## Enable private submissions"
    translation: "## Abilita i contributi privati"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0cebe3c5801844ce:
    english: You must be an admin of the group or subgroup where you want to collect submissions.
    translation: Devi essere amministratore del gruppo o sottogruppo in cui vuoi raccogliere i contributi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  831d833d53a12ece:
    english: |-
      1. Open the group.
      2. Select **Settings** (or **More** and then **Edit group settings**).
      3. Open **Permissions**.
      4. Enable **Non-members can start discussions**.
      5. Save the group settings.
    translation: |-
      1. Apri il gruppo.
      2. Seleziona **Configurazione** (oppure **Di più** e poi **Modifica le impostazioni del gruppo**).
      3. Apri **Permessi**.
      4. Abilita **Anche i non membri possono avviare discussioni**.
      5. Salva le impostazioni del gruppo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f3962a27b1c4ffa8:
    english: "![The Permissions tab in group settings, with Non-members can start discussions highlighted](non_members_can_start_discussions.png)"
    translation: "![La scheda Permessi nelle impostazioni del gruppo, con Anche i non membri possono avviare discussioni evidenziato](non_members_can_start_discussions.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  99ace15d10e78f33:
    english: This option is available only for **Open** and **Closed** groups. It is hidden for **Secret** groups. If you cannot see it, open **Privacy** in the group settings and change **Group privacy** to **Closed** (recommended for private submissions) or **Open**, then return to **Permissions**.
    translation: Questa opzione è disponibile solo per i gruppi **Aperto** e **Chiuso**. Non compare per i gruppi **Segreto**. Se non la vedi, apri **Privacy** nelle impostazioni del gruppo e imposta **Privacy del gruppo** su **Chiuso** (consigliato per i contributi privati) o **Aperto**. Poi torna a **Permessi**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  449517e6293a3acc:
    english: Enabling this permission does not make the group's discussions public. A non-member can start a new discussion and access that discussion as a guest, but cannot see the group's other private discussions.
    translation: Abilitare questo permesso non rende pubbliche le discussioni del gruppo. Una persona che non è membro può avviare una nuova discussione e accedervi come ospite, ma non può vedere le altre discussioni private del gruppo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  151f68a3f638fb67:
    english: "## Set up a private submission process"
    translation: "## Organizza la raccolta di contributi privati"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ae924433d81f5eac:
    english: |-
      1. Create a dedicated subgroup for the submission process and set its privacy to **Closed**. A subgroup keeps the submissions separate from the parent group's other work.
      2. Add the selection panel or other people responsible for reviewing submissions as members of the subgroup. Every subgroup member can see every submission, so add only people who should have that access.
      3. Create a [discussion template](/en/user_manual/discussions/templates) in the subgroup. Include the questions and information submitters should provide. You can create different discussion templates for different kinds of submissions.
      4. If submitters should not request subgroup membership, set membership to **Invitation only**.
      5. [Enable private submissions](#enable-private-submissions) in the subgroup's permissions.
      6. Test the process with an account that is not a member of the subgroup.
      7. Share the subgroup page with prospective submitters. They must sign in to their user account before making a submission.
    translation: |-
      1. Crea un sottogruppo dedicato alla raccolta dei contributi e imposta la sua privacy su **Chiuso**. Il sottogruppo tiene i contributi separati dalle altre attività del gruppo principale.
      2. Aggiungi come membri del sottogruppo la commissione di selezione o le altre persone incaricate di valutare i contributi. Ogni membro del sottogruppo può vedere tutti i contributi, quindi aggiungi solo chi deve avervi accesso.
      3. Crea un [modello di discussione](/en/user_manual/discussions/templates) nel sottogruppo. Includi le domande e le informazioni che le persone devono fornire. Puoi creare modelli diversi per tipi di contributi diversi.
      4. Se non vuoi che chi invia un contributo possa chiedere di entrare nel sottogruppo, imposta l'adesione su **Solo su invito**.
      5. [Abilita i contributi privati](#enable-private-submissions) nei permessi del sottogruppo.
      6. Prova il processo con un account che non è membro del sottogruppo.
      7. Condividi la pagina del sottogruppo con le persone che potrebbero inviare un contributo. Prima di inviarlo, devono accedere al proprio account utente.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3acec1b4a6724a65:
    english: "## Make a submission"
    translation: "## Invia un contributo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  58f96f48b6aacf65:
    english: The submitter opens the subgroup and selects **Start discussion**. Loomio shows the subgroup's available discussion templates. The submitter selects the relevant discussion template, completes its questions, and starts the discussion.
    translation: Chi vuole inviare un contributo apre il sottogruppo e seleziona **Inizia la discussione**. Loomio mostra i modelli di discussione disponibili nel sottogruppo. La persona sceglie il modello pertinente, risponde alle domande e avvia la discussione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5a65043771edeb44:
    english: The discussion belongs to the subgroup, but the submitter does not become a subgroup member. Loomio adds them as a guest of their discussion thread, enabling them to see and participate in the discussion with the panel or review team. They cannot see other private discussions or submissions in the subgroup.
    translation: La discussione appartiene al sottogruppo, ma chi ha inviato il contributo non ne diventa membro. Loomio aggiunge la persona come ospite della discussione, così può vederla e parteciparvi insieme alla commissione o al gruppo incaricato della valutazione. Non può vedere le altre discussioni o gli altri contributi privati nel sottogruppo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9338fd073b26dafc:
    english: "## Review submissions"
    translation: "## Valuta i contributi"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  50e33fa0f0868cf5:
    english: Subgroup members can see every submission discussion in the subgroup. They can ask follow-up questions and use comments, polls, or other discussion tools to complete their review.
    translation: I membri del sottogruppo possono vedere tutte le discussioni relative ai contributi. Possono fare domande di approfondimento e usare commenti, sondaggi o altri strumenti della discussione per completare la valutazione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  537b76c6f85cc575:
    english: If another person needs to provide information, a subgroup member with permission can invite them to the submission discussion. For example, when a nominator submits a nomination, the subgroup can invite the nominee to the thread if their participation is required. The invited person joins as a guest without gaining access to the subgroup's other private discussions.
    translation: Se serve il contributo di un'altra persona, un membro del sottogruppo che dispone del permesso necessario può invitarla alla discussione. Per esempio, quando qualcuno propone una candidatura, il sottogruppo può invitare la persona candidata alla discussione se la sua partecipazione è necessaria. La persona invitata entra come ospite, senza ottenere accesso alle altre discussioni private del sottogruppo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1fb7da309186b19e:
    english: Each submitter can see their own submission but cannot see the subgroup's other private discussions or submissions. Disable **Non-members can start discussions** when submissions close. Existing discussions and guest access are unchanged.
    translation: Ogni persona può vedere il proprio contributo, ma non le altre discussioni o gli altri contributi privati del sottogruppo. Quando la raccolta si chiude, disabilita **Anche i non membri possono avviare discussioni**. Le discussioni esistenti e l'accesso degli ospiti restano invariati.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
