    translated_on: '2026-09-29'
  b08a2d6a44f0d7ac:
    english: The best way to learn about Loomio is to [start a free trial](/try)
    translation: Opit käyttämään Loomiota parhaiten [aloittamalla ilmaisen kokeilun](/try)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ced10eda436a40ca:
    english: "## How people use Loomio"
    translation: "## Mihin Loomiota käytetään"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4198817a2724ad0a:
    english: "**Member organizations** to involve members in decisions at scale. Political parties, consumer and worker co-operatives, and membership associations use Loomio to facilitate a safe, inclusive space for members to share information and raise topics, participate in important decisions and vote in General Assembly. Streamline decision processes, improve transparency and accountability, document discussions and record decisions, and include members' voices to organize for action."
    translation: "**Jäsenjärjestöt** voivat ottaa jäsenet mukaan päätöksentekoon myös suurissa organisaatioissa. Poliittiset puolueet, kuluttaja- ja työntekijäosuuskunnat sekä yhdistykset käyttävät Loomiota, jotta jäsenet voivat jakaa tietoa, nostaa aiheita esiin, osallistua tärkeisiin päätöksiin ja äänestää yleiskokouksessa. Loomio auttaa selkeyttämään päätöksentekoa, lisäämään avoimuutta ja vastuullisuutta sekä tallentamaan keskustelut ja päätökset. Jäsenten näkemykset voidaan ottaa mukaan yhteisen toiminnan suunnitteluun."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7b2fd1306e05f4e3:
    english: "**Self-managing organizations** to involve staff in decisions. Self-managing teams, worker co-operatives, and sociocratic organisations use Loomio to run consent, consensus, and advice-based decision processes across distributed teams and time zones. Tap into collective intelligence, distribute decision making, build governance and policy together, and document decisions and discussion."
    translation: "**Itseohjautuvat organisaatiot** voivat ottaa henkilöstön mukaan päätöksentekoon. Itseohjautuvat tiimit, työntekijäosuuskunnat ja sosiokraattiset organisaatiot käyttävät Loomiota suostumukseen, yksimielisyyteen ja neuvoihin perustuvassa päätöksenteossa, vaikka tiimit työskentelisivät eri paikoissa ja aikavyöhykkeillä. Loomion avulla ne voivat hyödyntää yhteistä tietoa, jakaa päätösvaltaa, laatia yhdessä toimintatapoja ja sääntöjä sekä tallentaa päätökset ja keskustelut."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  75d7266c562f65c2:
    english: "**Boards, councils, and distributed networks** to involve stakeholders in decisions. Create a safe space for discussion, keep track of communications, and coordinate across geographies and time zones. Structure decision making processes, improve agility and response times, and preserve organizational memory."
    translation: "**Hallitukset, neuvostot ja hajautetut verkostot** voivat ottaa sidosryhmät mukaan päätöksiin. Loomio tarjoaa tilan keskustelulle, auttaa seuraamaan viestintää ja tukee yhteistyötä eri paikoissa ja aikavyöhykkeillä. Sen avulla voit jäsentää päätöksentekoa, nopeuttaa toimintaa ja säilyttää tiedon aiemmista keskusteluista ja päätöksistä."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cbe5ae77738f2704:
    english: "**Residential communities and co-ops** to make decisions together as neighbours. Cohousing communities, ecovillages, coliving cooperatives, housing co-ops, and land trusts use Loomio to replace or augment traditional strata and property management with democratic governance. Residents shape decisions about shared land, common spaces, and community agreements, and asynchronous discussion means members can fully participate whether they're on-site or away travelling, keeping a clear record of how the community has chosen to live together."
    translation: "**Asuinyhteisöt ja asunto-osuuskunnat** voivat tehdä päätöksiä yhdessä naapureiden kanssa. Yhteisöasumisen yhteisöt, ekokylät, asumisosuuskunnat, asunto-osuuskunnat ja yhteisölliset maanomistusjärjestelyt käyttävät Loomiota täydentämään tai korvaamaan perinteistä kiinteistönhallintaa demokraattisella päätöksenteolla. Asukkaat voivat päättää yhdessä maa-alueista, yhteisistä tiloista ja yhteisön sopimuksista. Kun keskusteluun voi osallistua eri aikaan, jäsenet voivat osallistua täysipainoisesti myös matkoilla ollessaan. Päätöksistä jää selkeä tieto."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb1039083c952286:
    english: Loomio builds a living record of your organization; the decisions made, who was involved and the discussion leading up to the decision.
    translation: Loomioon kertyy jatkuvasti täydentyvä tieto organisaatiosi päätöksistä, päätöksiin osallistuneista ihmisistä ja niitä edeltäneistä keskusteluista.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
