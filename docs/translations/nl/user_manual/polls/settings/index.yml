---
navigation_title: Instellingen
blocks:
  145c23b2412eff98:
    english: "# Proposal and poll settings"
    translation: "# Instellingen voor voorstellen en peilingen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e0347d976f79179:
    english: "## Setting up a proposal or poll"
    translation: "## Een voorstel of peiling instellen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e5d6f17041c19d41:
    english: "### Proposal and poll templates"
    translation: "### Sjablonen voor voorstellen en peilingen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8913cabb2f1f8227:
    english: 'Choose the proposal template you want to use. '
    translation: Kies het voorstelsjabloon dat je wilt gebruiken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3620f6321777ca50:
    english: "### Add content"
    translation: "### Inhoud toevoegen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bc7ebb222e9ff4d1:
    english: "**Group:** Check that the correct group is selected for your proposal or poll."
    translation: "**Groep:** Controleer of de juiste groep is geselecteerd voor je voorstel of peiling."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3a1d375da02f3a49:
    english: "**Title:** Give your proposal or poll a short, relevant title."
    translation: "**Titel:** Geef je voorstel of peiling een korte, passende titel."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a62a7e63f9db295c:
    english: "**Details:** Explain what you are asking of people and include enough details so everyone knows what it means to vote.  "
    translation: "**Details:** Leg uit wat je mensen vraagt en geef genoeg informatie zodat iedereen begrijpt wat stemmen inhoudt."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e17c2ab4878716f2:
    english: The predefined templates include some prompts to help you write a good proposal - use these or add your own details.
    translation: De vooraf ingestelde sjablonen bevatten aanwijzingen om je te helpen een goed voorstel te schrijven. Gebruik ze of voeg je eigen details toe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  74daa7f0cc476971:
    english: Avoid combining a range of ideas in one proposal, because people might agree to some aspects but not others and be unsure how to respond. You can break complex decisions down into multiple proposals.
    translation: Combineer liever niet meerdere ideeën in één voorstel. Mensen kunnen het met sommige onderdelen eens zijn en met andere niet, waardoor ze niet weten hoe ze moeten stemmen. Je kunt complexe beslissingen opsplitsen in meerdere voorstellen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0da6e449688940bb:
    english: When making a proposal, state your expectations and describe the impact the proposal will have if adopted. If it's a formal or binding proposal it's often worth describing what it means if the proposal is not adopted.
    translation: Geef bij een voorstel aan wat je verwacht en welke gevolgen het heeft als het wordt aangenomen. Bij een formeel of bindend voorstel is het vaak nuttig om ook te beschrijven wat het betekent als het niet wordt aangenomen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a6db66b75f495e21:
    english: Use the formatting tools to support your poll.  For example, attach a document file with the paperclip icon, insert an image, link to a website or online document, or even embed a video.
    translation: Gebruik de opmaakfuncties om je peiling te ondersteunen. Voeg bijvoorbeeld een document toe met het paperclippictogram, plaats een afbeelding, voeg een link naar een website of online document toe of sluit een video in.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f4f85f131878c36d:
    english: "### Voting options"
    translation: "### Stemopties"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  616aab74af2072ba:
    english: Each proposal and poll template provides options for voting.
    translation: Elk sjabloon voor een voorstel of peiling bevat stemopties.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7a85de7eefe74178:
    english: Depending on the template, you can edit, remove, reorder, or add voting options to suit the decision process you are running.
    translation: Afhankelijk van het sjabloon kun je stemopties bewerken, verwijderen, in een andere volgorde zetten of toevoegen. Zo passen ze bij de manier waarop je de beslissing neemt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9bc44bf4b28ac5d8:
    english: "- Use the pencil icon to edit voting option \n- Use the trash can icon to remove unwanted voting options\n- Use the handle to move the order of voting options\n- Add voting options with **Add option** when the template allows custom options"
    translation: |-
      - Gebruik het potloodpictogram om een stemoptie te bewerken
      - Gebruik het prullenbakpictogram om ongewenste stemopties te verwijderen
      - Gebruik de handgreep om de volgorde van stemopties te wijzigen
      - Voeg stemopties toe met **Voeg optie toe** als het sjabloon eigen opties toestaat
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2062f39334fbd629:
    english: |-
      ### Edit voting options
      There is a lot of flexibility to configure voting options to suit the way your organization makes decisions.
    translation: |-
      ### Stemopties bewerken
      Je kunt stemopties op veel manieren aanpassen aan de manier waarop je organisatie beslissingen neemt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5ac5b47c81fe187b:
    english: 'Use the pencil icon alongside the voting option to open the edit modal:'
    translation: 'Gebruik het potloodpictogram naast de stemoptie om het bewerkingsvenster te openen:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3c791f8140ad3b39:
    english: "**Option name:** A short name for the option."
    translation: "**Naam van optie:** Een korte naam voor de optie."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  77a0fb7409cf1711:
    english: "**Icon:** Select an icon for the option, such as thumbs up, thumbs down, abstain, or block."
    translation: "**Pictogram:** Selecteer een pictogram voor de optie, zoals een duim omhoog, duim omlaag, onthouden of blokkeren."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9126ee91e5d1cb95:
    english: "**Meaning:** A sentence that explains what choosing this options means."
    translation: "**Betekenis:** Een zin die uitlegt wat het betekent om deze optie te kiezen."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e88d83b93ba47666:
    english: "**Reason prompt:** A question to prompt voters to provide their reasoning or reconsider their position. "
    translation: "**Vraag om toelichting:** Een vraag die stemmers helpt hun keuze toe te lichten of te heroverwegen."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d05197892ea46087:
    english: "### Opening time"
    translation: "### Openingstijd"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1b56f0ad52a3aed8:
    english: By default, voting opens immediately when you create the poll. If you want to schedule voting to open at a later time, uncheck **Voting opens immediately** and select an opening date and time.
    translation: Standaard opent de stemming zodra je de peiling maakt. Wil je de stemming later openen, schakel dan **De stemming is direct geopend.** uit en selecteer een openingsdatum en -tijd.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  48ccc43734b062eb:
    english: This is useful to give time for discussion before voting opens, or to ensure a poll or proposal is correctly set up and scheduled to happen at the right time.
    translation: Zo geef je mensen tijd om te discussiëren voordat de stemming opent. Je kunt ook zorgen dat een peiling of voorstel goed is ingesteld en op het juiste moment begint.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b68fccc3132988ff:
    english: When a poll has a scheduled opening time, you can add voters before voting opens. Voters will be notified when voting opens, rather than when they are added.
    translation: Als een peiling een geplande openingstijd heeft, kun je stemmers toevoegen voordat de stemming opent. Ze krijgen een melding wanneer de stemming opent, in plaats van wanneer je ze toevoegt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  82d4cacfa780dd98:
    english: "**Notify voters when poll opens:** When checked (default), all voters will receive a notification when voting opens. Uncheck this if you want to open voting without sending notifications."
    translation: "**Stemmers melden wanneer de peiling opent:** Als dit is ingeschakeld (standaard), krijgen alle stemmers een melding wanneer de stemming opent. Schakel dit uit als je de stemming zonder meldingen wilt openen."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d084620657803f93:
    english: "**Closing date and time:** Select the closing date and time for your poll."
    translation: "**Sluitingsdatum en -tijd:** Selecteer de sluitingsdatum en -tijd voor je peiling."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c0472419a2671222:
    english: Give sufficient time for people to vote. You could time the proposal so it closes before a meeting, or avoid closing over a weekend, so that people will receive a timely reminder. If necessary, you can close the poll early or extend the closing time.
    translation: Geef mensen genoeg tijd om te stemmen. Je kunt het voorstel vóór een vergadering laten sluiten of voorkomen dat het in een weekend sluit. Zo krijgen mensen op tijd een herinnering. Zo nodig kun je de peiling eerder sluiten of de sluitingstijd uitstellen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c87f87e6cbc1a4d7:
    english: "**Who can vote?** Invite everyone in the group or only specific people that you invite."
    translation: "**Wie mag stemmen?** Nodig iedereen in de groep uit of alleen de mensen die je zelf kiest."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e02a9cefc3082334:
    english: |-
      You can later add people to an 'Invite people only' poll. For identified polls,
      you can also remove people who should no longer be eligible to vote. People
      cannot be removed from an anonymous poll.
    translation: |-
      Je kunt later mensen toevoegen aan een peiling waarvoor alleen uitgenodigde mensen mogen stemmen. Bij peilingen waarbij stemmen aan personen zijn gekoppeld,
      kun je ook mensen verwijderen die niet langer mogen stemmen. Uit een anonieme peiling
      kun je geen mensen verwijderen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2e959157d75ed7bd:
    english: "## More settings"
    translation: "## Meer instellingen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3d4443d3e6d3b13d:
    english: |-
      ### Reminder
      Send a 'Closing soon' notification 24 hours before the poll closes. This can be an opportunity for people to see how others have voted and reconsider their own vote, or just a way to increase participation in the poll.
    translation: |-
      ### Herinnering
      Verstuur 24 uur voordat de peiling sluit een melding dat deze binnenkort sluit. Mensen kunnen dan zien hoe anderen hebben gestemd en hun eigen stem heroverwegen. De melding kan ook de deelname aan de peiling vergroten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  62067c0573d7a64e:
    english: |-
      Setting options:
      - Nobody
      - Author
      - Undecided voters (default)
      - All voters
    translation: |-
      Opties:
      - Niemand
      - Auteur
      - Stemmers die nog geen keuze hebben gemaakt (standaard)
      - Alle stemmers
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6cd67c3f92302551:
    english: |-
      For an anonymous poll lasting at least 24 hours, Loomio automatically reminds
      eligible people who have not voted during the final 24 hours. This reminder
      cannot be changed in the poll settings.
    translation: |-
      Bij een anonieme peiling die minstens 24 uur duurt, herinnert Loomio
      mensen die mogen stemmen en nog niet hebben gestemd automatisch in de laatste 24 uur. Je kunt deze herinnering
      niet wijzigen in de peilinginstellingen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72f172271e2a636a:
    english: |-
      ### Anonymous voting
      If enabled, votes are stored separately from voter identities. Results appear after voting closes, and voters cannot add reasons, review their submitted vote, or change it.
    translation: |-
      ### Anoniem stemmen
      Als dit is ingeschakeld, worden stemmen apart van de identiteit van stemmers opgeslagen. De resultaten verschijnen nadat de stemming sluit. Stemmers kunnen geen toelichting toevoegen, hun ingediende stem bekijken of hun stem wijzigen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3393027493510f2f:
    english: See [Anonymous voting](/en/user_manual/polls/anonymous_voting) for details about how voter identities are separated from submitted votes, what information is retained, and the limits of the protection.
    translation: Lees [Anoniem stemmen](/en/user_manual/polls/anonymous_voting) voor meer informatie over hoe de identiteit van stemmers gescheiden blijft van hun ingediende stemmen, welke gegevens bewaard blijven en waar de bescherming haar grenzen heeft.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b731b9118e48dee5:
    english: |-
      > [!WARNING]
      > Once a poll has started you cannot edit the poll to make it anonymous or to undo the anonymous setting.
    translation: |-
      > [!WARNING]
      > Zodra een peiling is begonnen, kun je de peiling niet meer anoniem maken of de instelling voor anoniem stemmen ongedaan maken.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e8660d089a3c07bb:
    english: |-
      > [!WARNING]
      > You cannot re-open an anonymous poll after it has closed. Submitted votes are not linked to the participation records that show who has voted.
    translation: |-
      > [!WARNING]
      > Je kunt een anonieme peiling niet opnieuw openen nadat deze is gesloten. Ingediende stemmen zijn niet gekoppeld aan de deelnamegegevens waaruit blijkt wie heeft gestemd.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  aaaaa28a4b435835:
    english: |-
      ### Vote reason
      It can be helpful to understand why people voted the way they did. With this setting, you can prompt people to share their thoughts when they vote.
    translation: |-
      ### Toelichting bij je stem
      Het kan nuttig zijn om te begrijpen waarom mensen op een bepaalde manier stemmen. Met deze instelling kun je mensen vragen hun gedachten te delen wanneer ze stemmen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  309645182b157738:
    english: 'Available settings depend on the template:'
    translation: 'De beschikbare instellingen hangen af van het sjabloon:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d67e2c2914e91a6f:
    english: |-
      - **Optional** lets voters choose whether to give a reason
      - **Required for disagree or block** requires a reason when the selected option
        uses the Disagree or Block voting icon
      - **Required for block** requires a reason when the selected option uses the
        Block voting icon
      - **Required** requires every voter to give a reason
      - **Disabled** removes the vote-reason field
    translation: |-
      - **Optioneel** laat stemmers kiezen of ze een reden geven
      - **Vereist om niet akkoord te gaan of te blokkeren** vereist een reden als de gekozen optie
        het stempictogram Niet akkoord of Blokkeren gebruikt
      - **Vereist bij blokkeren** vereist een reden als de gekozen optie het
        stempictogram Blokkeren gebruikt
      - **Verplicht** vereist dat iedere stemmer een reden geeft
      - **Uitgeschakeld** verwijdert het veld voor de stemreden
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  af5e7c0557aec611:
    english: |-
      The conditional settings follow the voting icon rather than the option name.
      They still apply if you rename Disagree to a term such as Objection. The
      Consent template defaults to **Required for disagree or block**, while the
      Consensus template defaults to **Required for block**. Other templates default
      to **Optional**, except Question rounds where the response itself is required.
      The poll author can change the setting for an individual poll.
    translation: |-
      De voorwaardelijke instellingen volgen het stempictogram en niet de naam van de optie.
      Ze blijven gelden als je Niet akkoord hernoemt naar bijvoorbeeld Bezwaar. Het
      sjabloon Consent gebruikt standaard **Vereist om niet akkoord te gaan of te blokkeren** en het
      sjabloon Consensus gebruikt standaard **Vereist bij blokkeren**. Andere sjablonen gebruiken standaard
      **Optioneel**, behalve vragenrondes, waarbij het antwoord zelf verplicht is.
      De auteur van de peiling kan de instelling voor een afzonderlijke peiling wijzigen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ecb0d89c623db459:
    english: "**Limit reason to maximum 500 characters:** Keeping vote reasons short makes them easier to understand. A collection of concise reasons is a great resource for making a decision.  This setting is ticked by default. Untick to allow for longer reasons."
    translation: "**Beperk de reden tot maximaal 500 tekens:** Korte stemredenen zijn makkelijker te begrijpen. Een verzameling beknopte redenen helpt bij het nemen van een besluit.  Deze instelling is standaard aangevinkt. Haal het vinkje weg om langere redenen toe te staan."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  35bd4f116b9ff26a:
    english: |-
      ### Hide results
      If you want people to vote without knowing how others have voted, you can hide the results of the poll.  Useful if you do not want people to be affected by how other people have voted.
    translation: |-
      ### Resultaten verbergen
      Je kunt de resultaten van de peiling verbergen, zodat mensen stemmen zonder te weten hoe anderen hebben gestemd.  Zo worden ze niet beïnvloed door de stemmen van anderen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8cc5b82f4cc5e94e:
    english: |-
      Setting options:
      - Do not hide results
      - Hide results until a vote is cast
      - Hide results until voting closes
    translation: |-
      Instellingen:
      - Resultaten niet verbergen
      - Resultaten verbergen totdat een stem is uitgebracht
      - Resultaten verbergen totdat de stemming sluit
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4be103ffd97e7e8f:
    english: While results are hidden, nobody can reply to votes. Replies to votes open when voting closes.
    translation: Zolang de resultaten verborgen zijn, kan niemand op stemmen reageren. Reacties op stemmen worden mogelijk zodra de stemming sluit.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a488ebe6712a5e1d:
    english: If results are hidden until a vote is cast, vote before you print or export the thread as Markdown.
    translation: Als de resultaten verborgen blijven totdat je hebt gestemd, breng dan je stem uit voordat je de discussie afdrukt of als Markdown exporteert.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1e5a1eb47ee3d99d:
    english: |-
      Anonymous polls always hide results until voting closes. The STV Election
      template enables anonymous voting by default.
    translation: |-
      Bij anonieme peilingen blijven de resultaten altijd verborgen totdat de stemming sluit. Het sjabloon STV Election
      schakelt anoniem stemmen standaard in.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8e7d8e81db57f4f8:
    english: |-
      ### Start the poll
      Select the **Start proposal** or **Start poll** button.
    translation: |-
      ### De peiling starten
      Selecteer **'Voorstel' starten** of **Start peiling**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b1ee90012c240ef5:
    english: "## Managing polls"
    translation: "## Peilingen beheren"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0b5f754660efb4da:
    english: Open the three-dot menu at the bottom right of the poll.
    translation: Open het menu met de drie puntjes rechtsonder in de peiling.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cc2325791d155b04:
    english: "### Edit poll"
    translation: "### Peiling bewerken"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8d5ecd0352b5caf8:
    english: Use **Edit poll** to edit poll content or settings.   You can not change voting options once voting commences.
    translation: Gebruik **Peiling bewerken** om de inhoud of instellingen van de peiling te wijzigen.   Zodra de stemming is begonnen, kun je de stemopties niet meer wijzigen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  84d18e91493020d4:
    english: "### Make a copy"
    translation: "### Een kopie maken"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  071c2438f8e5315f:
    english: Use **Make a copy** to create a new poll using the current poll and settings as a starting point.
    translation: Gebruik **Een kopie maken** om een nieuwe peiling te maken met de huidige peiling en instellingen als uitgangspunt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3c42dde555e8a245:
    english: "### Notification history"
    translation: "### Meldingsgeschiedenis"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3e750b3f37e8ddf1:
    english: "**Notification history** shows who was notified and whether each notification has been read."
    translation: "**Meldingsgeschiedenis** laat zien wie een melding heeft ontvangen en of die is gelezen."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d78b253bae2aecc7:
    english: "### Export poll"
    translation: "### Peiling exporteren"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  17e6fd426afa3b4d:
    english: "**Export** poll status and results to a spreadsheet (.csv) file, to download unformatted poll data for analysis or archive."
    translation: Gebruik **Export** om de status en resultaten van de peiling als spreadsheetbestand (.csv) te downloaden. Je kunt de onbewerkte gegevens analyseren of archiveren.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4fce317a163b0a40:
    english: "### Print"
