  b27fab33a1dd5176:
    english: 'These guides explain complete decision processes: how to frame a decision, involve the right people, use discussion and proposals, respond to concerns, and record an outcome.'
    translation: 'Näissä oppaissa kuvataan päätöksentekoprosesseja alusta loppuun: miten määrittelet päätettävän asian, otat oikeat ihmiset mukaan, hyödynnät keskustelua ja ehdotuksia, vastaat huolenaiheisiin ja kirjaat päätöksen.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bcbe5e3fd75700a6:
    english: They are different from the proposal-template pages. A [proposal template](/en/user_manual/polls/proposals/) explains one proposal and its response options. A decision process can use several proposals over time.
    translation: Nämä oppaat eroavat ehdotusmalleja käsittelevistä sivuista. [Ehdotusmalli](/en/user_manual/polls/proposals/) kuvaa yhden ehdotuksen ja sen vastausvaihtoehdot. Päätöksentekoprosessissa voidaan käyttää useita ehdotuksia ajan mittaan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
