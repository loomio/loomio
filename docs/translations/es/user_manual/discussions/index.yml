  f087c06a5f4ab2e6:
    english: "# Intro to Discussions"
    translation: "# Introducción a las discusiones"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f515c87a8d1d20c7:
    english: Loomio discussions are where you can share information, discuss topics, and make decisions with your group.  People participate by posting comments and replies.
    translation: En las discusiones de Loomio puedes compartir información, hablar de distintos temas y tomar decisiones con tu grupo. Las personas participan publicando comentarios y respuestas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eede89b6ce4f357d:
    english: |-
      - All info about a topic is in one easily accessible place.
      - People can reply via email and their comments appear in the discussion.
      - You can see who has read the discussion and who needs a nudge.
      - There is a record of discussion you can easily find again.
    translation: |-
      - Toda la información sobre un tema está en un lugar fácil de encontrar.
      - Las personas pueden responder por correo electrónico y sus comentarios aparecen en la discusión.
      - Puedes ver quién ha leído la discusión y a quién conviene enviarle un recordatorio.
      - Queda un registro de la discusión que puedes volver a consultar fácilmente.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9cb2eb404b59208b:
    english: Discussions have a wide range of uses - from a general discussion forum to running specific work-flow and decision-making processes.
    translation: Las discusiones sirven para muchos fines, desde mantener un foro general hasta coordinar procesos de trabajo y toma de decisiones.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  87a95605052570ca:
    english: For example, you may frame a discussion on a particular topic, invite people to contribute their thoughts and share information, and facilitate progress towards an agreed outcome.
    translation: Por ejemplo, puedes iniciar una discusión sobre un tema, invitar a otras personas a compartir sus ideas e información, y ayudar al grupo a alcanzar una conclusión acordada.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ce6e6734c595d968:
    english: Or you may invite people to participate in a particular decision, using a consent or advice decision-making process.
    translation: También puedes invitar a otras personas a participar en una decisión mediante un proceso basado en el consentimiento o el asesoramiento.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7fa58cb3ba95be0b:
    english: Discussions can also contain polls and proposals to help progress a discussion to an outcome. As people comment in the discussion and vote in polls, a discussion timeline builds so you can easily find key milestones.
    translation: Las discusiones también pueden incluir sondeos y propuestas para avanzar hacia una conclusión. A medida que las personas comentan y votan, se crea una cronología de la discusión en la que puedes encontrar fácilmente los momentos clave.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
