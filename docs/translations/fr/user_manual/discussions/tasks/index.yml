    translated_on: '2026-09-29'
  bea1dad1b0b47107:
    english: Use tasks in threads and comments to name an action, assign it to someone, set a due date, and track whether it is complete.
    translation: Dans les discussions et les commentaires, les tâches permettent de décrire une action, de l’attribuer à une personne, de fixer une échéance et de suivre son avancement.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2398b3493bad759e:
    english: "## Add a task"
    translation: "## Ajouter une tâche"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c240866e019fab51:
    english: While writing a thread or comment, expand the formatting toolbar and click **Task list**. Type the action beside the checkbox.
    translation: Lorsque vous rédigez une discussion ou un commentaire, développez la barre d’outils de mise en forme et cliquez sur **Liste des tâches**. Saisissez l’action à côté de la case à cocher.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f7d4f63b321e9af1:
    english: "## Name and assign the task to a person"
    translation: "## Nommer et attribuer une tâche"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5ea902e45aaf1f7a:
    english: Use an @mention in the task to assign it to a group member. An **Add due date** button appears once the task has an assignee.
    translation: Utilisez une @mention dans la tâche pour l’attribuer à un membre du groupe. Le bouton **Ajouter échéance** apparaît dès qu’une personne est désignée.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1134aedee6cafd8c:
    english: Tasks assigned to you appear on your **Tasks** page. Open **Tasks** from the sidebar to see them grouped by thread or poll.
    translation: Les tâches qui vous sont attribuées figurent sur votre page **Tâches**. Ouvrez **Tâches** dans la barre latérale pour les voir regroupées par discussion ou par sondage.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5eae519b81c94f7a:
    english: "## Set a reminder"
    translation: "## Définir un rappel"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  561597d43d716888:
    english: Click **Add due date** to choose a due date and when Loomio should email the assignee a reminder. You can also remove an existing due date from this dialog.
    translation: Cliquez sur **Ajouter échéance** pour choisir une date limite et le moment où Loomio enverra un rappel par courriel à la personne responsable. Vous pouvez aussi supprimer une échéance existante dans cette fenêtre.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bd36c23f297b0429:
    english: "## Mark it as done"
    translation: "## Marquer une tâche comme terminée"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  59b6138f35694902:
    english: Click the checkbox beside a task to mark it as done. You can do this while editing the text, while reading it if you are the assignee, or from the **Tasks** page. Click it again to reopen the task.
    translation: Cliquez sur la case à cocher à côté d’une tâche pour la marquer comme terminée. Vous pouvez le faire pendant que vous modifiez le texte, pendant que vous le lisez si la tâche vous est attribuée, ou depuis la page **Tâches**. Cliquez de nouveau sur la case pour rouvrir la tâche.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
