  0b903e1c3c7e1862:
    english: The profile tab controls how your group is identified and introduced. Open **Edit group settings** from the group page, then select **Profile**.
    translation: La scheda del profilo determina come viene presentato il tuo gruppo. Dalla pagina del gruppo, apri **Modifica le impostazioni del gruppo**, poi seleziona **Profilo**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
