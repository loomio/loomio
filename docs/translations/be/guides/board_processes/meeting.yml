---
navigation_title: Падрыхтоўка да сустрэчы
blocks:
  165e9dec4d4660aa:
    english: "# Prepare for a meeting"
    translation: "# Падрыхтоўка да сустрэчы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5d14c790e0c05446:
    english: Effective meetings are productive, inclusive, and collaborative - they improve engagement, help build strong relationships, establish alignment, make better and faster decisions, promote inclusion, facilitate creative thinking and innovation, are a great channel for feedback and continuous improvement.
    translation: Эфектыўныя сустрэчы дапамагаюць працаваць разам і ўлічваць меркаванні ўсіх. Яны павышаюць удзел, умацоўваюць адносіны, дапамагаюць узгадняць пазіцыі і хутчэй прымаць лепшыя рашэнні. Сустрэчы таксама даюць магчымасць абменьвацца водгукамі, знаходзіць новыя ідэі і пастаянна паляпшаць працу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c69f325003094ac5:
    english: Use Loomio to plan an effective meeting; involve people from the outset, align towards the most important topics, and make better use of your precious time together.
    translation: 'Выкарыстоўвайце Loomio для падрыхтоўкі сустрэчы: далучайце людзей з самага пачатку, вызначайце найважнейшыя тэмы і лепш выкарыстоўвайце час, праведзены разам.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a30a32e8b06a9432:
    english: If the group is new to Loomio, begin with [Introducing Loomio to your group](/en/user_manual/overview/introducing_loomio), then use this meeting process as a practical first recurring workflow.
    translation: Калі група толькі пачынае карыстацца Loomio, спачатку прачытайце [Як пазнаёміць групу з Loomio](/en/user_manual/overview/introducing_loomio). Потым выкарыстоўвайце гэты парадак падрыхтоўкі сустрэч як першы рэгулярны працэс.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9a0eb26797e28e0f:
    english: There are several things you can do to make your next board or committee meeting effective...
    translation: Вось што можна зрабіць, каб наступная сустрэча рады або камітэта была эфектыўнай...
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c04e8fcfc9edb01c:
    english: |-
      - [Meeting focus and review actions](#meeting-focus-and-review-actions)
      - [Announce agenda and notify](#agenda-and-notify)
      - [Find a time for meeting](#find-a-time-for-meeting)
      - [Sign off minutes](#sign-off-minutes)
      - [Approve reports](#approve-reports)
    translation: |-
      - [Вызначыць галоўныя тэмы сустрэчы і праверыць выкананне задач](#meeting-focus-and-review-actions)
      - [Абвясціць парадак дня і паведаміць удзельнікам](#agenda-and-notify)
      - [Знайсці час для сустрэчы](#find-a-time-for-meeting)
      - [Зацвердзіць пратакол](#sign-off-minutes)
      - [Зацвердзіць справаздачы](#approve-reports)
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6e6785b547007644:
    english: "## Meeting focus and review actions"
    translation: "## Галоўныя тэмы сустрэчы і праверка выканання задач"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  26bf98782eb61549:
    english: 'Establish a focus for the meeting, so you spend your precious time together talking about the most important topics.  '
    translation: Вызначыце галоўныя тэмы сустрэчы, каб прысвяціць час разам найважнейшым пытанням.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c23fdd52f0a29b2c:
    english: Inviting members to contribute to the agenda helps everyone align, think about topics and energize for the meeting.
    translation: Запрасіце ўдзельнікаў дапоўніць парадак дня. Гэта дапаможа ўсім узгадніць прыярытэты, абдумаць тэмы і падрыхтавацца да сустрэчы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  52409f3ffabfb7d1:
    english: |-
      Actions:
      - focus the meeting on the most important things,
      - follow up and talk to members about actions from previous meetings.
    translation: |-
      Што зрабіць:
      - засяродзіць сустрэчу на найважнейшых пытаннях,
      - праверыць выкананне задач з папярэдніх сустрэч і абмеркаваць іх з удзельнікамі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a52dd7ebb4619e46:
    english: |-
      ### On Loomio
      Use a Loomio **Discussion** to prepare for your meeting:
      * remind members about the meeting coming up,
      * invite comment about the most important things to focus on,
      * summarize actions from the previous meeting and ask for an update.
    translation: |-
      ### У Loomio
      Выкарыстоўвайце **Абмеркаванне** для падрыхтоўкі сустрэчы:
      * нагадайце ўдзельнікам пра будучую сустрэчу,
      * запрасіце іх выказацца пра найважнейшыя тэмы,
      * падсумуйце задачы з папярэдняй сустрэчы і папрасіце паведаміць пра іх выкананне.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5bcd10bb61edcc35:
    english: "## Agenda and notify"
    translation: "## Парадак дня і апавяшчэнне"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d9431846021bb8f3:
    english: Announce the meeting with a clear agenda. Attach papers, link to key documents and notify members.
    translation: Абвясціце сустрэчу і падайце зразумелы парадак дня. Далучыце матэрыялы, дадайце спасылкі на важныя дакументы і паведаміце ўдзельнікам.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  41e84b882fa9bab1:
    english: This helps everyone prepare for the meeting, by reading the materials and thinking about topics of discussion and the decisions to be made.  Members are then more likely to arrive in context and ready for the meeting.
    translation: Так усе змогуць прачытаць матэрыялы, абдумаць тэмы абмеркавання і рашэнні, якія трэба прыняць. Удзельнікі будуць лепш разумець кантэкст і падрыхтуюцца да сустрэчы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b6b0e7ed67711d5b:
    english: |-
      Actions:
      - prepare agenda, documents, materials and board papers,
      - notify members of meeting and send materials.
    translation: |-
      Што зрабіць:
      - падрыхтаваць парадак дня, дакументы і іншыя матэрыялы для рады,
      - паведаміць удзельнікам пра сустрэчу і даслаць матэрыялы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5b6d4a5158e41747:
    english: |-
      ### On Loomio
      Use a Loomio **Discussion** to prepare for your board meeting:
      * state details of meeting,
      * attach or link agenda, documents and other meeting materials,
      * invite members with a notification,
      * monitor 'Seen by' to see who has read the thread.
    translation: |-
      ### У Loomio
      Выкарыстоўвайце **Абмеркаванне** для падрыхтоўкі сустрэчы рады:
      * паведаміце падрабязнасці сустрэчы,
      * далучыце парадак дня, дакументы і іншыя матэрыялы або дадайце спасылкі на іх,
      * запрасіце ўдзельнікаў праз апавяшчэнне,
      * правярайце спіс «Бачыў», каб ведаць, хто прачытаў тэму.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f2c8f10394bf10c8:
    english: |-
      While similar to sending an email, a Loomio thread has advantages:
      - you can see who has read the thread, and remind those who haven't,
      - member replies or comments are visible to everyone who has permission to view the thread,
      - any discussion or questions about the agenda or meeting materials is held in a single place.
    translation: |-
      Тэма ў Loomio падобная да электроннага ліста, але мае перавагі:
      - можна бачыць, хто прачытаў тэму, і нагадаць тым, хто яшчэ не прачытаў,
      - адказы і каментарыі ўдзельнікаў бачныя ўсім, хто мае доступ да тэмы,
      - абмеркаванне парадку дня і матэрыялаў сустрэчы адбываецца ў адным месцы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dd6d8cabe5f1810d:
    english: Members can find all the information about the meeting readily available in one place, thereby avoiding confusing email chains and losing important info in their email inbox.
    translation: Удзельнікі могуць знайсці ўсю інфармацыю пра сустрэчу ў адным месцы. Не трэба шукаць важныя звесткі ў доўгіх ланцужках электронных лістоў.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6a57d003a0bd5f07:
    english: |-
      ### Confirm
      Ask members to leave a comment confirming they have read the agenda and meeting papers and are prepared for the meeting. Use **Seen by** to identify anyone who may need a reminder.
    translation: |-
      ### Пацверджанне
      Папрасіце ўдзельнікаў пакінуць каментарый, каб пацвердзіць, што яны прачыталі парадак дня і матэрыялы ды падрыхтаваліся да сустрэчы. Выкарыстоўвайце **Бачыў**, каб вызначыць, каму трэба нагадаць.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d08b0ae5712ef2d:
    english: "## Find a time for meeting\nFinding a time to meet can be a frequent headache for many administrators. "
    translation: |-
      ## Як знайсці час для сустрэчы
      Пошук зручнага часу для сустрэчы часта займае шмат часу ў адміністратараў.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1da8fdf943571a19:
    english: |-
      ### On Loomio
      If you have not yet set a date and time for the meeting or you need to find a time for a future meeting, you can use **Time poll**.
    translation: |-
      ### У Loomio
      Калі дата і час сустрэчы яшчэ не вызначаны або трэба знайсці час для наступнай сустрэчы, выкарыстоўвайце **Апытанне часу**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f1c92e27dfd63153:
    english: Time poll makes it easy to see everyone's availability and find the best time, reducing time and energy needed for this common admin task.
    translation: Апытанне часу дапамагае даведацца, калі ўсе могуць сустрэцца, і выбраць найлепшы час. Гэта скарачае час і намаганні на арганізацыю сустрэчы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  45b90fd46cce4976:
    english: Members in different time zones will see dates and times localized in their time zone.
    translation: Удзельнікі ў розных часавых паясах бачаць даты і час у сваім мясцовым часе.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dc159c751f73d5d1:
    english: 'When the Time poll closes, choose the best time and send an outcome notification with a calendar invitation, so members can add the meeting to their calendar. '
    translation: Калі апытанне часу закрыецца, выберыце найлепшы час і разашліце апавяшчэнне пра выснову разам з запрашэннем у каляндар. Тады ўдзельнікі змогуць дадаць сустрэчу ў свой каляндар.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4bafee41dd5f774c:
    english: "## Sign off minutes\nApproving or ratifying minutes is standard practice for formal meetings and good practice for all meetings.  "
    translation: |-
      ## Зацвярджэнне пратакола
      Зацвярджэнне пратакола — звычайная практыка для афіцыйных сустрэч і карысная практыка для ўсіх астатніх.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d9795ed92dabff7:
    english: 'Minutes provide a record of the meeting, key points raised during discussion, results of decisions and how people voted. They include the actions agreed and the person(s) responsible, and are often the starting point for the next meeting.  '
    translation: Пратакол фіксуе ход сустрэчы, асноўныя пытанні абмеркавання, прынятыя рашэнні і тое, як прагаласавалі ўдзельнікі. У ім таксама запісваюць узгодненыя задачы і адказных за іх людзей. Часта з пратакола пачынаюць падрыхтоўку наступнай сустрэчы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1fd0d860cba070db:
    english: Minutes are valuable as a reminder for people present, helpful for those absent and a record to consult in case of conflict.
    translation: Пратакол нагадвае пра сустрэчу тым, хто прысутнічаў, дапамагае тым, хто адсутнічаў, і служыць запісам, да якога можна звярнуцца ў выпадку спрэчкі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  166796d872f35962:
    english: "### On Loomio"
    translation: "### У Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ef51b49480cb721a:
    english: Post the minutes in the Loomio meeting thread within a few days of the meeting and invite participants to approve.  This keeps the minutes relevant and fresh in member's minds and is a great way to remind members of their actions.  It also saves some time during your meeting.
    translation: На працягу некалькіх дзён пасля сустрэчы апублікуйце пратакол у тэме сустрэчы ў Loomio і прапануйце ўдзельнікам яго зацвердзіць. Пакуль змест сустрэчы яшчэ свежы ў памяці, прасцей праверыць пратакол і нагадаць пра ўзгодненыя задачы. Гэта таксама зэканоміць час на наступнай сустрэчы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ea02d6cf3ede73dc:
    english: The example above uses a **Choose** poll with two options 'Accept' or 'Review'.
    translation: 'У прыкладзе вышэй выкарыстоўваецца апытанне **Выберыце** з двума варыянтамі: «Прыняць» і «Перагледзець».'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  56c55da82e5ddeb7:
    english: 'When everyone has voted and the poll closes, state an outcome so everyone knows what has happened.  '
    translation: Калі ўсе прагаласуюць і апытанне закрыецца, апублікуйце выснову, каб усе ведалі, якое рашэнне прынята.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e8b710a05eb113dc:
    english: 'If your meeting practice requires formal acceptance at the next meeting, schedule an agenda item to acknowledge and confirm polls and decisions made on Loomio, and record this in the meeting minutes.  '
    translation: Калі паводле парадку працы рашэнні трэба фармальна зацвярджаць на наступнай сустрэчы, дадайце ў парадак дня пункт для пацверджання апытанняў і рашэнняў, прынятых у Loomio. Запішыце гэта ў пратакол сустрэчы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '06339a98b65ccc2c':
    english: For example; *"Does anyone wish to change their votes in Loomio?  If no, then let's resolve to formally approve polls made in Loomio during the last period."*
    translation: 'Напрыклад: *«Ці хоча хто-небудзь змяніць свой голас у Loomio? Калі не, прапаную фармальна зацвердзіць вынікі апытанняў, праведзеных у Loomio за мінулы перыяд».*'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f460b4ae218b375a:
    english: |-
      ## Approve reports
      Most meeting agendas include time for reports to be presented, discussed and approved; for example reports from the CEO, Financial, Operations, Health & Safety, and project reports.
    translation: |-
      ## Зацвярджэнне справаздач
      У парадку дня большасці сустрэч ёсць час на прадстаўленне, абмеркаванне і зацвярджэнне справаздач. Гэта могуць быць справаздачы кіраўніцтва, па фінансах, аперацыйнай дзейнасці, ахове здароўя і бяспецы або праектах.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  00abfe283956509a:
    english: Reports are very important to help everyone get on the same page, however they can absorb valuable time in a meeting that may be used more effectively.
    translation: Справаздачы дапамагаюць усім атрымаць аднолькавую інфармацыю, але могуць заняць шмат часу на сустрэчы. Гэты час можна выкарыстаць больш эфектыўна.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  861200207a1e1dfb:
    english: Attach or link reports to your meeting **thread** and invite questions about the reports in advance of the meeting.
    translation: Далучыце справаздачы да **тэмы** сустрэчы або дадайце спасылкі на іх. Запрасіце ўдзельнікаў задаваць пытанні пра справаздачы да сустрэчы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  11f124875e8a5945:
    english: Members receive and read the reports at a time and place that works for them.  As members read and think about the reports, they can comment, ask questions and see responses in Loomio.
    translation: Удзельнікі атрымліваюць і чытаюць справаздачы ў зручны для сябе час. Падчас чытання яны могуць пакідаць каментарыі, задаваць пытанні і бачыць адказы ў Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2871f1673d36999a:
    english: A question asked by one member is likely of interest to other members, so when someone replies to the question, their response  is visible to everyone in the Loomio group.
    translation: Пытанне аднаго з удзельнікаў можа цікавіць і іншых. Таму адказ на яго бачаць усе ў групе Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  851a2a86a1047697:
    english: As members become familiar with discussing reports in Loomio, save a little more time by taking it a step further - seek approval of reports ahead of the meeting.
    translation: 'Калі ўдзельнікі прызвычаяцца абмяркоўваць справаздачы ў Loomio, можна зэканоміць яшчэ трохі часу: прапануйце зацвердзіць справаздачы да сустрэчы.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
