  223c90e3fe5b24d7:
    english: "> *“Consensus is the process – a participatory process by which a group thinks and feels together, en route to their decision.” - Sam Kaner, Community at Work*"
    translation: "> *«Кансенсус — гэта працэс, у якім група разам думае і адчувае, рухаючыся да рашэння». — Сэм Кейнер, Community at Work*"
    status: machine
