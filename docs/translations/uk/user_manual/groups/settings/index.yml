  0b8776f3657a1add:
    english: Group settings control how your group is presented, who can find and join it, and what members are allowed to do. Only group administrators can edit these settings.
    translation: Налаштування групи визначають, як виглядає ваша група, хто може її знайти й приєднатися до неї та що дозволено робити учасникам. Змінювати ці налаштування можуть лише адміністратори групи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  306f2b79029e2196:
    english: On the group page, open the actions menu and select **Edit group settings**.
    translation: На сторінці групи відкрийте меню дій і виберіть **Редагувати налаштування групи**.
