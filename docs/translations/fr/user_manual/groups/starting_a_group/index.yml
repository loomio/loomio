  '019cdfc169ea858a':
    english: Type your group name. It's best to keep your group name short and concise.
    translation: Saisissez le nom de votre groupe. Choisissez un nom court et clair.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6ae6b08ae7fbe257:
    english: "### Group handle"
    translation: "### Identifiant du groupe"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b054d0f760888add:
    english: Your group is automatically assigned a handle. The handle is used in the group's URL and email address, such as **loomio.com/your-group-handle** and **your-group-handle@loomio.com**.
    translation: Un identifiant est automatiquement attribué à votre groupe. Il figure dans son URL et son adresse e-mail, par exemple **loomio.com/your-group-handle** et **your-group-handle@loomio.com**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1dee654ba628ba95:
    english: You can edit the handle when you create the group and change it later in group settings. When you change it, links and email addresses that use the old handle continue to work. Loomio keeps up to three old handles; after that, the oldest handle expires.
    translation: Vous pouvez modifier cet identifiant lors de la création du groupe, puis dans les paramètres du groupe. Après une modification, les liens et les adresses e-mail qui utilisent l’ancien identifiant continuent de fonctionner. Loomio conserve jusqu’à trois anciens identifiants. Au-delà, le plus ancien expire.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
