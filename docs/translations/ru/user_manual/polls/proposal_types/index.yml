  d370759001be4e21:
    english: Polls collect selections, scores, allocations, rankings, availability, or election ballots. Choose the voting method based on what participants need to express and how you intend to use the result. Use a [Proposal](/en/user_manual/polls/proposals/) when people need to respond to a statement or course of action.
    translation: С помощью голосований участники выбирают варианты, оценивают их, распределяют баллы, расставляют варианты по предпочтению, указывают доступное время или голосуют на выборах. Выберите способ голосования в зависимости от того, что участникам нужно выразить и как вы планируете использовать результат. Если людям нужно высказаться по поводу утверждения или плана действий, используйте [предложение](/en/user_manual/polls/proposals/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1132ff680c7b2562:
    english: "## Simple poll"
    translation: "## Простой опрос"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6b957bf5630c1470:
    english: "[Choose](/en/user_manual/polls/choose/) lets participants select one or more options. Use it to find the most popular option or make a shortlist."
    translation: "[Простой опрос](/en/user_manual/polls/choose/) позволяет участникам выбрать один или несколько вариантов. Используйте его, чтобы найти самый популярный вариант или составить короткий список."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c982974685e1b5d6:
    english: "## Score poll"
    translation: "## Опрос по очкам"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fbbfe14196388606:
    english: "[Score](/en/user_manual/polls/score/) lets participants rate every option on the same scale. Use it to compare the strength of support, readiness, suitability, or importance across options."
    translation: "[Опрос по очкам](/en/user_manual/polls/score/) позволяет участникам оценить каждый вариант по одной шкале. Используйте его, чтобы сравнить степень поддержки, готовность, пригодность или важность вариантов."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0465fcb48a56ca78:
    english: "## Dot vote"
    translation: "## Точечное голосование"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ffb7d1711a5fca3b:
    english: "[Allocate](/en/user_manual/polls/allocate/) gives each participant a fixed budget of points to distribute. Use it to identify priorities when choosing one thing means giving less attention or resources to another."
    translation: "[Точечное голосование](/en/user_manual/polls/allocate/) даёт каждому участнику фиксированное число баллов для распределения. Используйте его для определения приоритетов, когда выбор одного варианта оставляет меньше внимания или ресурсов для других."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a1b15c28fbe526f6:
    english: "## Ranked choice"
    translation: "## Ранжированный выбор"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8811f455b7ab3821:
    english: "[Rank](/en/user_manual/polls/rank/) lets participants arrange options in order of preference. Use it to find the group's overall preferred order or select one leading option."
    translation: "[Ранжированный выбор](/en/user_manual/polls/rank/) позволяет участникам расположить варианты в порядке предпочтения. Используйте его, чтобы определить общий порядок предпочтений группы или выбрать один наиболее предпочтительный вариант."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2e21bb1b54b6fcf9:
    english: "## Time poll"
    translation: "## Опрос времени"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb768f07eb0d1971:
    english: "[Time poll](/en/user_manual/polls/meeting_polls/) lets participants indicate when they are available. Use it to schedule a meeting or event across time zones."
    translation: "[Опрос времени](/en/user_manual/polls/meeting_polls/) позволяет участникам указать, когда они свободны. Используйте его, чтобы назначить встречу или мероприятие с учётом разных часовых поясов."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6333ad0ee6d54609:
    english: "## STV Election"
    translation: "## Выборы STV"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6f93c6ad598d809c:
    english: "[STV Elections](/en/user_manual/polls/stv/) let participants rank candidates in a proportional, multi-winner election. Use STV to elect a committee, board, or group of delegates."
    translation: "[Выборы STV](/en/user_manual/polls/stv/) позволяют участникам ранжировать кандидатов на пропорциональных выборах нескольких представителей. Используйте STV, чтобы избрать комитет, правление или группу делегатов."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6752a750a7703b58:
    english: "## Other specialized method"
    translation: "## Другой специальный формат"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '099449b0e1fe4f85':
    english: Loomio also includes a Question round for collecting questions without voting. Group administrators can make it available from [Poll templates](/en/user_manual/polls/poll_templates/).
    translation: 'В Loomio также есть раунд вопросов: участники могут задавать вопросы без голосования. Администраторы группы могут включить его в разделе [Шаблоны опросов](/en/user_manual/polls/poll_templates/).'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
