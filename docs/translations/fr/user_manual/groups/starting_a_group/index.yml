  e8632dbb628c7c7d:
    english: "# Starting a new group"
    translation: "# Créer un groupe"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2a4a6907d4e2049d:
    english: If you are new to Loomio, you can start a group on a free trial at any time from the [Loomio website](https://www.loomio.com/). If you already use Loomio and would like to start a new group for another organization or purpose, you can do this from the sidebar menu - click on **New group**.
    translation: Si vous découvrez Loomio, vous pouvez créer un groupe avec un essai gratuit à tout moment depuis le [site de Loomio](https://www.loomio.com/). Si vous utilisez déjà Loomio, vous pouvez créer un groupe pour une autre organisation ou un autre projet depuis le menu latéral. Cliquez sur **Nouveau groupe**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  10e8756c96038e58:
    english: For many organizations, a single Loomio group is sufficient. You can start as many subgroups as you need within the group. See [Subgroups](/en/user_manual/groups/subgroups/) for more info.
    translation: Pour de nombreuses organisations, un seul groupe Loomio suffit. Vous pouvez y créer autant de sous-groupes que nécessaire. Consultez la page [Sous-groupes](/en/user_manual/groups/subgroups/) pour en savoir plus.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ed00dbe94cd53435:
    english: "## Group details"
    translation: "## Informations sur le groupe"
