  83b6503850a3581c:
    english: "`LOOMIO_DISABLE_EDIT_USER_PROFILE=1` prevents users from editing these fields themselves:"
    translation: "`LOOMIO_DISABLE_EDIT_USER_PROFILE=1` empêche les utilisateurs de modifier eux-mêmes ces champs :"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b40beb01122e6c22:
    english: |-
      | Field | Notes |
      | --- | --- |
      | `name` | Managed by external sync |
      | `username` | Managed by external sync |
      | `email` | Managed by external sync |
      | `avatar_kind` / `uploaded_avatar` | Managed by external sync |
    translation: |-
      | Champ | Remarques |
      | --- | --- |
      | `name` | Géré par la synchronisation externe |
      | `username` | Géré par la synchronisation externe |
      | `email` | Géré par la synchronisation externe |
      | `avatar_kind` / `uploaded_avatar` | Géré par la synchronisation externe |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d914243a6d80944b:
    english: Users can still edit Loomio-local fields such as `short_bio` and `location`.
    translation: Les utilisateurs peuvent toujours modifier les champs propres à Loomio, comme `short_bio` et `location`.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d2d40191ec060f7e:
    english: "`LOOMIO_SSO_UPDATE_USER_PROFILE_ON_LOGIN=1` updates `name` and `email` from SSO login data. Leave it commented out or unset when an external sync script should be the only source of those updates."
    translation: "`LOOMIO_SSO_UPDATE_USER_PROFILE_ON_LOGIN=1` met à jour `name` et `email` à partir des données de connexion SSO. Laissez ce paramètre en commentaire ou ne le définissez pas si seul un script de synchronisation externe doit effectuer ces mises à jour."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f19f0588ef52b814:
    english: "`LOOMIO_SSO_FORCE_USER_ATTRS` still works for existing installs. It both disables user edits and updates `name` and `email` on SSO login."
    translation: "`LOOMIO_SSO_FORCE_USER_ATTRS` fonctionne toujours sur les installations existantes. Ce paramètre empêche les utilisateurs de modifier leur profil et met à jour `name` et `email` lors de la connexion SSO."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
