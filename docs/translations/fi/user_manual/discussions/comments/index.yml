---
navigation_title: Kommentit
blocks:
  e6981c530fad6f45:
    english: "# Comments"
    translation: "# Kommentit"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cb82daa3594be60c:
    english: Comments are the main way people participate in a discussion. They are visible to anyone who has permission to see the thread.
    translation: Kommentit ovat tärkein tapa osallistua keskusteluun. Ne näkyvät kaikille, joilla on oikeus nähdä keskusteluketju.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  96ffa85117001d18:
    english: "## Reading comments"
    translation: "## Kommenttien lukeminen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2d82b2da2ee96a1f:
    english: When you open a discussion, Loomio takes you to activity that is new to you.
    translation: Kun avaat keskustelun, Loomio vie sinut sinulle uuteen toimintaan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c4a1b0be655249a9:
    english: Unread comments have a blue **new** label beside their posting time.
    translation: Lukemattomien kommenttien lähetysajan vieressä näkyy sininen **uusi**-merkintä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  82bce54322fa6023:
    english: "## Writing a comment"
    translation: "## Kommentin kirjoittaminen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7b14a17025b52e3d:
    english: Write a comment to contribute to the discussion. Other people can reply, react, or post their own comments.
    translation: Kirjoita kommentti osallistuaksesi keskusteluun. Muut voivat vastata siihen, reagoida siihen tai kirjoittaa omia kommenttejaan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6e0c07cfcb8f1166:
    english: Select **Post Comment** to publish it. Your comment will be visible to anyone who has permission to see the discussion.
    translation: Julkaise kommentti valitsemalla **Lähetä Kommentti**. Kommenttisi näkyy kaikille, joilla on oikeus nähdä keskustelu.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  edfadd8f1dcac9c4:
    english: The tools described in [Formatting](/en/user_manual/discussions/formatting/) are available when writing comments.
    translation: Voit käyttää [Muotoilu](/en/user_manual/discussions/formatting/)-sivulla kuvattuja työkaluja kirjoittaessasi kommentteja.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b4dce878f57863ff:
    english: "## Mentioning people"
    translation: "## Ihmisten mainitseminen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  70543178fe9e7b4b:
    english: Type **@**, start typing a person's name, then select them from the list. A mention notifies that person immediately and is a useful way to ask for their attention or response.
    translation: Kirjoita **@**, aloita henkilön nimen kirjoittaminen ja valitse hänet luettelosta. Maininta ilmoittaa asiasta henkilölle heti. Sen avulla voit pyytää hänen huomiotaan tai vastaustaan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b1d5a5e3d5bb86e3:
    english: "![Mentioning Samira Patel in a comment](../notifying_people/comment_mention.png)"
    translation: "![Samira Patelin mainitseminen kommentissa](../notifying_people/comment_mention.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  07aa88bffb5b1700:
    english: To notify everyone in the group, type **@**, start typing the group name, then select it from the list.
    translation: Ilmoita kaikille ryhmän jäsenille kirjoittamalla **@**, aloittamalla ryhmän nimen kirjoittaminen ja valitsemalla ryhmä luettelosta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  794c26be4050ac1b:
    english: "![Searching for Oatmilk Cooperative while writing a group mention](../notifying_people/mentioning_group_1.png)"
    translation: "![Oatmilk Cooperative -ryhmän etsiminen ryhmämainintaa kirjoitettaessa](../notifying_people/mentioning_group_1.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  111625a57c02bc5c:
    english: "![Oatmilk Cooperative selected as a group mention](../notifying_people/mentioning_group_2.png)"
    translation: "![Oatmilk Cooperative valittuna ryhmämainintaan](../notifying_people/mentioning_group_2.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b4fb3c8390c32e31:
    english: Mentioning someone does not give them access to the thread. Use **Invite people** in the thread sidebar if they are not already a thread member.
    translation: Henkilön mainitseminen ei anna hänelle pääsyä keskusteluketjuun. Jos hän ei vielä ole keskusteluketjun jäsen, valitse sivupalkista **Kutsu ihmisiä**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6bba3d93a1845f91:
    english: "## Replying to a comment"
    translation: "## Kommenttiin vastaaminen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e7776c198f2f2f48:
    english: Select **Reply** below a comment to respond to it. The reply is prefilled with an @mention of the comment author, which notifies them when you post it. Remove the mention if you do not want to notify them.
    translation: Vastaa kommenttiin valitsemalla sen alta **Vastaa**. Vastaukseen lisätään valmiiksi kommentin kirjoittajan @maininta, joka ilmoittaa hänelle vastauksestasi, kun julkaiset sen. Poista maininta, jos et halua ilmoittaa hänelle.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eb45d23f7f968858:
    english: You can also reply to your own comment to nest a response beneath it.
    translation: Voit myös vastata omaan kommenttiisi, jolloin vastaus näkyy sen alla.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ab1caf06d54d3bcb:
    english: If a Loomio email says you can reply by email, your emailed reply will appear in the thread.
    translation: Jos Loomion sähköpostiviestissä kerrotaan, että voit vastata sähköpostitse, sähköpostivastauksesi näkyy keskusteluketjussa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  72d9282ce2bc763a:
    english: "## Reactions"
    translation: "## Reaktiot"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1875a303c30b5343:
    english: Use the smiley button to respond with an emoji. Reactions notify the comment author within Loomio but do not send an email.
    translation: Vastaa emojilla hymiöpainikkeen avulla. Reaktioista ilmoitetaan kommentin kirjoittajalle Loomiossa, mutta niistä ei lähetetä sähköpostia.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ce997bcd34b2eae0:
    english: "## Translating comments"
    translation: "## Kommenttien kääntäminen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b50a435640652d31:
    english: If the author uses a language other than yours, a **Translate** action appears below the comment.
    translation: Jos kirjoittaja käyttää eri kieltä kuin sinä, kommentin alla näkyy **Käännä**-toiminto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9077e2c891750fe8:
    english: Select **Translate comment** to see the comment in your language.
    translation: Näet kommentin omalla kielelläsi valitsemalla **Käännä kommentti**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  60a885598057c1bf:
    english: "## Comment actions"
    translation: "## Kommentin toiminnot"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9689ea71da9051d8:
    english: Common actions appear directly below a comment. Additional actions are available from the three-dot menu (**⋯**).
    translation: Tavallisimmat toiminnot näkyvät suoraan kommentin alla. Lisää toimintoja löydät kolmen pisteen valikosta (**⋯**).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  88263de7d2158dae:
    english: "### Add a comment to Jump to"
    translation: "### Kommentin lisääminen Siirry kohtaan -luetteloon"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dd60de0295088aa5:
    english: Use **Pin to timeline** to add a comment to the thread's **Jump to** list.
    translation: Lisää kommentti keskusteluketjun **Siirry kohtaan** -luetteloon valitsemalla **Kiinnitä aikajanalle**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  90252c4d66b752d4:
    english: You can edit the label shown in **Jump to**. Unpin and then pin the comment again to change the link text.
    translation: Voit muokata **Siirry kohtaan** -luettelossa näkyvää nimeä. Muuta linkin tekstiä irrottamalla kommentin kiinnitys ja kiinnittämällä se uudelleen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  28c2ffaa171b6b1b:
    english: |-
      >[!Tip]
      >Highlight the words you want to use as the link text before selecting **Pin to timeline**.
    translation: |-
      >[!Tip]
      >Maalaa sanat, joita haluat käyttää linkin tekstinä, ennen kuin valitset **Kiinnitä aikajanalle**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7545e856758edb22:
    english: Select **Unpin** to remove the item from **Jump to**.
    translation: Poista kommentti **Siirry kohtaan** -luettelosta valitsemalla **Irrota kiinnitys**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c3b33d31cbce93c3:
    english: "### Edit a comment and view changes"
    translation: "### Kommentin muokkaaminen ja muutosten tarkastelu"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  abaeaac4c1f2c966:
    english: Select **Edit** below one of your comments to change it. Group admins can also edit member comments when the relevant group permission is enabled.
    translation: Muuta omaa kommenttiasi valitsemalla sen alta **Muokkaa**. Ryhmän ylläpitäjät voivat muokata myös jäsenten kommentteja, jos vastaava ryhmän käyttöoikeus on käytössä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  69647eee1f3fcfb7:
    english: An **Edited** action appears below an edited comment.
    translation: Muokatun kommentin alla näkyy **Muokattu**-toiminto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fcaa0d6329f5c5d4:
    english: Select **Edited** to see what changed. Red highlighting shows removed text and green highlighting shows added text. Loomio records who made each edit and when it was made.
    translation: Näet muutokset valitsemalla **Muokattu**. Punainen korostus näyttää poistetun tekstin ja vihreä lisätyn tekstin. Loomio tallentaa, kuka teki kunkin muokkauksen ja milloin.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  042b22530d14a486:
    english: 'You can edit a comment when:'
    translation: 'Voit muokata kommenttia, kun:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  afe0ed6535a96b15:
    english: |-
      - you wrote it and the group allows members to edit their comments
      - you are a group admin and [Admins can edit members' comments](/en/user_manual/groups/settings/permissions) is enabled
    translation: |-
      - olet kirjoittanut sen ja ryhmä sallii jäsenten muokata omia kommenttejaan
      - olet ryhmän ylläpitäjä ja [Järjestelmänvalvojat voivat muokata jäsenten kommentteja](/en/user_manual/groups/settings/permissions) on käytössä
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6962d0caeeea20e8:
    english: "### Copy a comment link"
    translation: "### Kommentin linkin kopioiminen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0fb9e2ebde71573e:
    english: Select **Copy link** to copy the comment's unique URL. You can paste the link elsewhere to refer directly to that comment.
    translation: Kopioi kommentin yksilöllinen URL-osoite valitsemalla **Kopioi linkki**. Voit liittää linkin muualle, kun haluat viitata suoraan kyseiseen kommenttiin.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  04e4537024da788c:
    english: "### View notification history"
    translation: "### Näytä ilmoitushistoria"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  957677befce0ab3f:
    english: Open the three-dot menu (**⋯**) beside a comment and select **Notification history**.
    translation: Avaa kommentin vieressä oleva kolmen pisteen valikko (**⋯**) ja valitse **Ilmoitushistoria**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fa9d0f2448239944:
    english: "![Notification history in a comment's actions menu](../notifying_people/comment_notification_history.png)"
    translation: "![Ilmoitushistoria kommentin toimintovalikossa](../notifying_people/comment_notification_history.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  30a58d4ef7d80c15:
    english: The notification history shows who was notified about the comment, when the notification was sent, and whether it has been read when that information is available.
    translation: Ilmoitushistoriasta näet, keille kommentista lähetettiin ilmoitus ja milloin se lähetettiin. Jos tieto on saatavilla, näet myös, onko ilmoitus luettu.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4f6ead46c3f9759e:
    english: "![Notification history for a comment mentioning Samira Patel](../notifying_people/comment_notification_example.png)"
    translation: "![Samira Patelin mainitsevan kommentin ilmoitushistoria](../notifying_people/comment_notification_example.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fa2204fb0745dec4:
    english: "### Discard, restore, or delete a comment"
    translation: "### Hävitä, palauta tai poista kommentti"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  592dfa766814bb8e:
    english: Discarding a comment removes it from the thread but retains it in a trash bin. You can discard your own comments with **Discard** in the three-dot menu. Group admins can also discard comments.
    translation: Kommentin hävittäminen poistaa sen keskusteluketjusta mutta säilyttää sen roskakorissa. Voit hävittää omat kommenttisi valitsemalla kolmen pisteen valikosta **Hävitä**. Myös ryhmän ylläpitäjät voivat hävittää kommentteja.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  670a46d5274f9ab5:
    english: "**Restore a comment**"
    translation: "**Palauta kommentti**"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9b202a60d5665ac6:
    english: The location of a discarded comment is labelled **Item removed**. Open its three-dot menu and select **Restore**.
    translation: Hävitetyn kommentin kohdalla lukee **Kohde poistettu**. Avaa sen kolmen pisteen valikko ja valitse **Palauttaa**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d6427576dab2b2c5:
    english: "**Delete a comment**"
    translation: "**Poista kommentti**"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d8b9add122e73295:
    english: Deleting a comment removes it permanently. It cannot be restored.
    translation: Kommentin poistaminen on pysyvää. Poistettua kommenttia ei voi palauttaa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  51f7dce6a0188a51:
    english: If **Members can delete their own comments** is enabled in [Group permissions](/en/user_manual/groups/settings/permissions), members can permanently delete their own discarded comments. Group admins can delete any comment.
    translation: Jos [ryhmän käyttöoikeuksissa](/en/user_manual/groups/settings/permissions) on käytössä asetus **Jäsenet voivat poistaa omia kommenttejaan**, jäsenet voivat poistaa omat hävitetyt kommenttinsa pysyvästi. Ryhmän ylläpitäjät voivat poistaa minkä tahansa kommentin.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  63134f860609d669:
    english: Open the three-dot menu on an **Item removed** entry and select **Delete**.
    translation: Avaa **Kohde poistettu** -merkinnän kolmen pisteen valikko ja valitse **Poistaa**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  19580f91a59bf5ef:
    english: A confirmation message explains that the comment will be permanently deleted.
    translation: Vahvistusviesti kertoo, että kommentti poistetaan pysyvästi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
