navigation_title: Завдання
blocks:
  970146a02b39726b:
    english: "# Tasks"
    translation: "# Завдання"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bea1dad1b0b47107:
    english: Use tasks in threads and comments to name an action, assign it to someone, set a due date, and track whether it is complete.
    translation: 'У темах і коментарях можна створювати завдання: описувати дію, призначати відповідальну особу, встановлювати термін виконання й відстежувати виконання.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2398b3493bad759e:
    english: "## Add a task"
    translation: "## Додайте завдання"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c240866e019fab51:
    english: While writing a thread or comment, expand the formatting toolbar and click **Task list**. Type the action beside the checkbox.
    translation: Під час написання теми або коментаря розгорніть панель форматування й натисніть **Список завдань**. Впишіть дію поруч із прапорцем.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f7d4f63b321e9af1:
    english: "## Name and assign the task to a person"
    translation: "## Назвіть завдання та призначте відповідальну особу"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5ea902e45aaf1f7a:
    english: Use an @mention in the task to assign it to a group member. An **Add due date** button appears once the task has an assignee.
    translation: Згадайте учасника групи в завданні через @, щоб призначити йому це завдання. Після призначення з’явиться кнопка **Додати термін виконання**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1134aedee6cafd8c:
    english: Tasks assigned to you appear on your **Tasks** page. Open **Tasks** from the sidebar to see them grouped by thread or poll.
    translation: Призначені вам завдання з’являються на сторінці **Завдання**. Відкрийте її з бічної панелі, щоб переглянути завдання, згруповані за темами або опитуваннями.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5eae519b81c94f7a:
    english: "## Set a reminder"
    translation: "## Налаштуйте нагадування"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  561597d43d716888:
    english: Click **Add due date** to choose a due date and when Loomio should email the assignee a reminder. You can also remove an existing due date from this dialog.
    translation: Натисніть **Додати термін виконання**, щоб вибрати термін і час, коли Loomio має надіслати відповідальній особі нагадування електронною поштою. У цьому ж вікні можна прибрати встановлений термін.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bd36c23f297b0429:
    english: "## Mark it as done"
    translation: "## Позначте завдання як виконане"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  59b6138f35694902:
    english: Click the checkbox beside a task to mark it as done. You can do this while editing the text, while reading it if you are the assignee, or from the **Tasks** page. Click it again to reopen the task.
    translation: Натисніть прапорець поруч із завданням, щоб позначити його як виконане. Це можна зробити під час редагування тексту, під час читання, якщо завдання призначене вам, або на сторінці **Завдання**. Натисніть прапорець ще раз, щоб знову відкрити завдання.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
