    english: |-
      # Microsoft Teams integration
      _Connect your Loomio group notifications to Microsoft Teams._
    translation: |-
      # Інтеграція з Microsoft Teams
      _Налаштуйте сповіщення з вашої групи Loomio у Microsoft Teams._
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1512a87b3144ae1e:
    english: 'Loomio can send notifications into your Microsoft Teams when new discussions, proposals, comments, votes, and outcomes occur. '
    translation: Loomio може надсилати сповіщення у Microsoft Teams про нові обговорення, пропозиції, коментарі, голоси та висновки.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
