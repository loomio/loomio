  275f4d9025c017c4:
    english: The headings and labels use your selected language. Content written by participants remains in its original language.
    translation: Los encabezados y las etiquetas aparecen en el idioma que hayas seleccionado. El contenido escrito por los participantes permanece en su idioma original.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dab18fdf3c56269d:
    english: "### Thread settings and display"
    translation: "### Configuración y visualización del hilo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7bc55279f97c6d1b:
    english: Group admins can select **Thread settings** to change how replies are arranged and configure other discussion options.
    translation: Los administradores del grupo pueden seleccionar **Configuración del hilo** para cambiar cómo se organizan las respuestas y configurar otras opciones de la discusión.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  32b2640ba23524aa:
    english: Choose **Timeline** to list items in the order they were posted, or **Threaded** to group replies beneath the item they respond to. Thread settings also control whether multiple polls may run at once and can set a maximum comment length. These settings apply to everyone in the discussion.
    translation: Elige **Cronología** para mostrar los elementos en el orden en que se publicaron, o **En hilos** para agrupar las respuestas debajo del elemento al que responden. La configuración del hilo también controla si puede haber varios sondeos a la vez y permite establecer una longitud máxima para los comentarios. Se aplica a todas las personas que participan en la discusión.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a520339278bcc2a:
    english: "### Pin or unpin a thread"
    translation: "### Anclar o desanclar un hilo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0433e7a61db60003:
    english: Pinned threads appear above other threads on the group page. Welcome discussions, news items, and announcements are typical uses for pinned threads.
    translation: Los hilos anclados aparecen por encima de los demás hilos en la página del grupo. Suelen usarse para discusiones de bienvenida, noticias y anuncios.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b2712588a5e0aab3:
    english: Open the three-dot menu (**⋯**) beside the thread on the group page and select **Pin thread**. Pinned threads are ordered by the time they were pinned. To change their order, unpin and pin them again.
    translation: Abre el menú de tres puntos (**⋯**) junto al hilo en la página del grupo y selecciona **Anclar hilo**. Los hilos anclados se ordenan según el momento en que se anclaron. Para cambiar el orden, desánclalos y vuelve a anclarlos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a0443f076d1b8ae5:
    english: Select **Unpin thread** to return a thread to the activity-based order.
    translation: Selecciona **Desanclar hilo** para devolverlo al orden basado en la actividad.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b90a469963b02ffc:
    english: "### Move a thread"
    translation: "### Mover un hilo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8b2071f4625705e5:
    english: Select **Move thread** to move a thread to another group, subgroup, or to a direct thread. It will be visible to members of the destination group and anyone specifically invited to it.
    translation: Selecciona **Mover hilo** para trasladarlo a otro grupo, a un subgrupo o a un hilo directo. Los miembros del grupo de destino y las personas invitadas específicamente podrán verlo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f09d5f2afce03ee8:
    english: |-
      >[!Tip]
      >Start a draft as a direct discussion or in a private subgroup, then move it to the group when it is ready.
    translation: |-
      >[!Tip]
      >Empieza un borrador como discusión directa o en un subgrupo privado y muévelo al grupo cuando esté listo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c82562b641053308:
    english: To move selected activity rather than the whole thread, see [Moving items between threads](/en/user_manual/discussions/moving_items/).
    translation: Para mover elementos seleccionados en lugar del hilo completo, consulta [Mover elementos entre hilos](/en/user_manual/discussions/moving_items/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  be22d2980075fdaa:
    english: "### Lock or unlock a thread"
    translation: "### Bloquear o desbloquear un hilo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e7c24a610fd2bf8b:
    english: Lock a thread to prevent comments or further changes. A thread can only be locked after its active polls have closed.
    translation: Bloquea un hilo para impedir nuevos comentarios o cambios. Solo puedes bloquearlo cuando hayan cerrado todos los sondeos activos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  edb983bb6366aa6c:
    english: Select **Lock thread** under **Actions**. Locked threads are removed from the list of open discussions and marked with a **Locked** tag.
    translation: Selecciona **Bloquear hilo** en **Acciones**. Los hilos bloqueados desaparecen de la lista de discusiones abiertas y se marcan con la etiqueta **Bloqueado**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ba2794349524cc33:
    english: To find a locked thread, open the discussion filter on the group page and select **Locked**. Open the thread and select **Unlock thread** to allow comments and changes again.
    translation: Para encontrar un hilo bloqueado, abre el filtro de discusiones en la página del grupo y selecciona **Bloqueado**. Abre el hilo y selecciona **Desbloquear hilo** para volver a permitir comentarios y cambios.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3a75fb1ad0ffab87:
    english: "### Delete a thread"
    translation: "### Eliminar un hilo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0103a5729bd6a095:
    english: Deleting a thread removes it permanently and cannot be undone. Lock the thread instead if you may need it again.
    translation: Al eliminar un hilo, se borra de forma permanente y no se puede recuperar. Si crees que podrías necesitarlo más adelante, bloquéalo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  daf08ca8895b0fe2:
    english: Select **Delete thread** and confirm the deletion.
    translation: Selecciona **Eliminar hilo ** y confirma la eliminación.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
