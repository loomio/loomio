  fce0c96bcc92d0aa:
    english: "> *“With the advice process, any person can make any decision but must seek advice from affected parties and people with expertise.” - Frederick Laloux, Reinventing Organizations.*"
    translation: "> *« Dans le processus de conseil, chacun peut prendre n’importe quelle décision, mais doit demander l’avis des personnes concernées et de celles qui possèdent une expertise. » - Frederick Laloux, Reinventing Organizations.*"
    status: machine
    provider: codex/gpt-6-sol
