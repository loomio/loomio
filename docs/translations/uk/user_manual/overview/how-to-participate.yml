---
navigation_title: Як брати участь
blocks:
  b07064bf98055393:
    english: "# How to participate"
    translation: "# Як брати участь"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c121de54fbe72331:
    english: 'Once signed in to a Loomio group you have been invited to, you can participate in a Loomio discussion or decision.  '
    translation: Увійшовши до групи Loomio, до якої вас запросили, ви можете брати участь в обговореннях і ухваленні рішень.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9bb48e2f2f1858af:
    english: Read on to see  how to write a comment in a thread and how to vote in a poll.
    translation: Далі ви дізнаєтеся, як написати коментар у темі та проголосувати в опитуванні.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '095ec081a6f1d74e':
    english: "## Comment"
    translation: "## Коментарі"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d5dadbc416d8603a:
    english: You can write a comment in a thread, and people can reply, react or post their own comment to continue the discussion.
    translation: Ви можете написати коментар у темі. Інші учасники можуть відповісти, залишити реакцію або додати власний коментар, щоб продовжити обговорення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  250f7bc0e6e6c93c:
    english: 'When you have written your text, use **Post Comment** to instantly publish the comment. Your comment will be visible to anyone who has permission to see the thread. '
    translation: Написавши текст, натисніть **Опублікувати коментар**, щоб одразу його опублікувати. Коментар побачать усі, хто має доступ до теми.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  76a3378441f45ebf:
    english: "### Reply to a comment"
    translation: "### Як відповісти на коментар"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c3495aed9ac78348:
    english: You can reply to someone's comment by clicking on the reply icon beneath the comment.
    translation: Щоб відповісти на коментар, натисніть значок відповіді під ним.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b2698ab73e65442c:
    english: Your reply is published in the thread and an email notification is sent to the author of the comment.
    translation: Вашу відповідь буде опубліковано в темі, а автор коментаря отримає сповіщення електронною поштою.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  04743dedbee0de5c:
    english: "### Get someone's attention"
    translation: "### Як привернути увагу"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  455fea8aa593dad4:
    english: You can notify people when you write a comment.
    translation: Коли ви пишете коментар, можете надіслати сповіщення іншим людям.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  316ef3257eaebd54:
    english: "### Reactions"
    translation: "### Реакції"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4b68204cf35c85f1:
    english: Reacting to a comment is a great way to encourage and acknowledge a comment by letting the comment author know how you feel.  It is a quick and light-weight way to participate that does not require any text, nor send an email. Click the smile emoji icon beneath a comment to leave an emoji reaction.
    translation: Реакція дає змогу підтримати коментар і показати його автору ваше ставлення. Це швидкий спосіб долучитися без тексту й сповіщення електронною поштою. Щоб залишити реакцію, натисніть значок усміхненого емодзі під коментарем.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d391457c69df967f:
    english: "## Vote"
    translation: "## Голосування"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4432b9c5b263014a:
    english: You may receive an invitation to vote in a poll via email or by notification in Loomio. Click on the link in the email to vote.
    translation: Ви можете отримати запрошення проголосувати в опитуванні електронною поштою або через сповіщення в Loomio. Щоб проголосувати, перейдіть за посиланням у листі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2a8641a22cf13597:
    english: Voting is easy, just click or tap on the icon of your choice.
    translation: Щоб проголосувати, натисніть значок вибраного варіанта.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  00d6e2698ade53cc:
    english: There are many types of polls. The example below shows a typical proposal with voting options of **Agree**, **Abstain** or **Disagree**. Other options may be available.
    translation: Є різні типи опитувань. Нижче показано приклад пропозиції з варіантами голосування **Згоден**, **Утриматися** та **Проти**. В інших опитуваннях варіанти можуть відрізнятися.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4f327c4a766af0ab:
    english: Read the poll, and any attached files, then cast your vote by selecting one of the options.
    translation: Прочитайте текст опитування та перегляньте вкладені файли, а потім виберіть один із варіантів голосування.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2cf633f37997e8b8:
    english: "### State a reason"
    translation: "### Як пояснити свій голос"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c976385dcb75f67b:
    english: When voting, you can also leave a **Reason** to say why you have voted this way. This is optional.
    translation: Під час голосування ви також можете залишити **Аргумент**, щоб пояснити свій вибір. Це необов’язково.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6d0d884b0832dda9:
    english: "### Change your vote"
    translation: "### Як змінити свій голос"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  84629138984e43d0:
    english: You can **change your vote**, up until the proposal closes.
    translation: Ви можете **змінити свій голос**, доки пропозиція не закриється.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8fcddbe7856e926b:
    english: There are many reasons why you might want to change your vote. For example if new information emerges it may cause you to rethink your decision, and change your vote.
    translation: Причини змінити голос можуть бути різними. Наприклад, нова інформація може спонукати вас переглянути своє рішення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f7078b517c8bfed8:
    english: Once again, you can leave a reason to say why you have changed your vote.
    translation: Ви також можете залишити аргумент, щоб пояснити, чому змінили свій голос.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8e1b2953471f22ba:
    english: "### Results"
    translation: "### Результати"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2153df12cd2b4fe2:
    english: Results of the proposal are updated as people vote, so you can see how a proposal is trending.
    translation: Результати пропозиції оновлюються в міру голосування. Так ви можете бачити, як змінюється підтримка пропозиції.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  229571fe36c571b0:
    english: 'In a controversial proposal it is common to see mixed results, however this does not mean the proposal has failed.  '
    translation: Результати суперечливої пропозиції часто бувають неоднозначними, але це не означає, що пропозицію відхилено.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c3d5e53684bf3e88:
    english: Often the new information revealed during the proposal helps form a better proposal that is more likely to pass.
    translation: Нова інформація, що з’являється під час обговорення пропозиції, часто допомагає підготувати кращу пропозицію, яка має більше шансів на підтримку.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b4783489f09ccf19:
    english: "### Outcome"
    translation: "### Висновок"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  592f419764241ef6:
    english: When the proposal closes, the author is prompted to state the **Outcome**.
    translation: Коли пропозиція закривається, система пропонує автору опублікувати **Висновок**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0fae106181bbc6ac:
    english: This is an important final step to record the result of the decision and let everyone know what will happen next.
    translation: Це завершальний крок, який дає змогу зафіксувати ухвалене рішення та повідомити всім, що буде далі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
