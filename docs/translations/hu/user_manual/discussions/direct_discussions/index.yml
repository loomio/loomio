    english: A direct discussion is a private discussion for a specific set of people.
    translation: A közvetlen beszélgetés privát beszélgetés meghatározott személyek között.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  479f7faed056ab51:
    english: A direct discussion does not belong to a group. Invited people do not need to be a member of your Loomio group.
    translation: A közvetlen beszélgetés nem tartozik csoporthoz. A meghívottaknak nem kell a Loomio-csoportod tagjainak lenniük.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2f5362faecc07fa0:
    english: You control who can see and participate by adding people or email addresses to the **Invite** field.
    translation: 'Te döntöd el, ki láthatja a beszélgetést és ki vehet részt benne: add hozzá az embereket vagy az e-mail-címüket a **Meghív** mezőben.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f31343ea54b4f899:
    english: Direct discussions support the same comments, polls and other tools as group discussions. They can be useful when creating a subgroup is unnecessary.
    translation: A közvetlen beszélgetésekben ugyanúgy használhatsz hozzászólásokat, szavazásokat és más eszközöket, mint a csoportos beszélgetésekben. Akkor hasznosak, ha nincs szükség alcsoport létrehozására.
    status: machine
    provider: codex/gpt-6-sol
