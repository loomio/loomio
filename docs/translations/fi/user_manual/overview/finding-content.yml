    translation: Valitse sivupalkista **Äänestykset, joista äänestää**, niin näet käynnissä olevat kyselyt, joihin sinut on kutsuttu mutta joissa et ole vielä äänestänyt. Ryhmän **Kyselyt**-välilehdellä näet myös sen käynnissä olevat ja päättyneet kyselyt.
