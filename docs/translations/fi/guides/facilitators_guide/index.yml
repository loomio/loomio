  e19d687b56819302:
    english: Hi! I'm Alanna.
    translation: Hei, olen Alanna.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  10352ad196487ff3:
    english: I'm one of the founders of Loomio, and I've been thinking deeply about how it works from a facilitation perspective since the beginning. I am not a seminal facilitation expert; I consider myself only a beginner in this craft that one could spend a lifetime honing.
    translation: Olen yksi Loomion perustajista, ja olen alusta asti pohtinut sen toimintaa fasilitoinnin näkökulmasta. En ole alan johtava asiantuntija. Pidän itseäni vasta aloittelijana taidossa, jota voisi harjoitella koko elämänsä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c637c96f9723f02d:
    english: What I can offer is help translating between the offline and online spaces, as a practitioner in both. I've facilitated a lot of groups who use Loomio, and learned from their experiences.
    translation: Minulla on kokemusta fasilitoinnista sekä kasvokkain että verkossa, joten voin auttaa soveltamaan käytäntöjä ympäristöstä toiseen. Olen fasilitoinut monia Loomiota käyttäviä ryhmiä ja oppinut niiden kokemuksista.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c376e38821fb6c2f:
    english: You can find out [more about me on my website](http://alanna.space).
    translation: Voit lukea [minusta lisää verkkosivuiltani](http://alanna.space).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b893957534fa37e2:
    english: I'm only one person, with one perspective and approach to facilitation, when there are myriad approaches. I've tried to bring in a couple other facilitator's voices here, including [Rich](http://richdecibels.com/) from Loomio and Silvia from [EXP](http://exp.agency).
    translation: Olen vain yksi ihminen, ja fasilitointiin on monia näkökulmia ja tapoja. Olen siksi pyrkinyt tuomaan oppaaseen myös muiden fasilitaattorien ääniä, kuten Loomiossa työskentelevän [Richin](http://richdecibels.com/) ja [EXP:n](http://exp.agency) Silvian.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
