  9c3f3c8a80729fbf:
    english: "### Method and quota"
    translation: "### Método y cuota"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  feee79b9f6e92de3:
    english: At the top, you'll see the counting method (Scottish STV or Meek STV) and quota type (Droop or Hare) along with the quota — the number of votes a candidate needed to win a seat.
    translation: 'En la parte superior verás el método de recuento (STV escocés o STV de Meek), el tipo de cuota (Droop o Hare) y la cuota: el número de votos que necesitaba un candidato para obtener un escaño.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e180eb800c3435cd:
    english: "### Elected candidates"
    translation: "### Candidatos elegidos"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8db8b2466db56f2b:
    english: 'A summary table of the winners with five columns:'
    translation: 'Una tabla resume los resultados de las personas elegidas en cinco columnas:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f998ffc721953501:
    english: |-
      | Column | Meaning |
      |--------|---------|
      | **Candidate** | The name of the elected candidate |
      | **Round elected** | Which counting round they reached the quota and won a seat. Round 1 means they won on first preferences alone; higher rounds mean they needed transferred votes from eliminated or surplus candidates. |
      | **First preferences** | How many voters ranked this candidate as their first choice. This shows a candidate's direct support before any vote transfers. |
      | **Final tally** | The candidate's vote tally at the moment they were elected. Due to vote transfers, this is often higher than their first preferences. |
      | **Surplus** | How much the candidate's final tally exceeded the quota (final tally minus quota). A larger surplus means stronger support beyond what was needed to win. In Scottish STV, this surplus is redistributed to voters' next preferences. |
    translation: |-
      | Columna | Significado |
      |--------|---------|
      | **Candidato** | El nombre del candidato elegido |
      | **Ronda elegida** | La ronda de recuento en la que alcanzó la cuota y obtuvo un escaño. La ronda 1 indica que ganó solo con las primeras preferencias; las rondas posteriores indican que necesitó votos transferidos de candidatos eliminados o de sus excedentes. |
      | **Primeras preferencias** | El número de personas que eligieron a este candidato como primera opción. Muestra su apoyo directo antes de cualquier transferencia de votos. |
      | **Recuento final** | Los votos que tenía el candidato cuando resultó elegido. Debido a las transferencias, esta cifra suele ser mayor que sus primeras preferencias. |
      | **Superávit** | La cantidad en que el recuento final superó la cuota (recuento final menos cuota). Un superávit mayor indica más apoyo del necesario para ganar. En el STV escocés, se redistribuye entre las siguientes preferencias de quienes votaron por el candidato. |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  efc41c326d955758:
    english: If the count results in a tie — where eliminating any of the remaining candidates would change the outcome — those candidates are shown in a separate table rather than arbitrarily choosing a winner.
    translation: Si el recuento termina en empate y eliminar a cualquiera de los candidatos restantes cambiaría el resultado, esos candidatos aparecen en una tabla aparte en lugar de elegir arbitrariamente a uno de ellos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8a6ae4ad28f0acf6:
    english: "### Round-by-round details"
    translation: "### Detalles ronda por ronda"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3d907145fd075144:
