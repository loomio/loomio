---
navigation_title: API למשתמש
blocks:
  0217b93dddc627ac:
    english: "# Loomio User API documentation"
    translation: "# תיעוד ה־API למשתמש של Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bc6fcbf5f783fd29:
    english: "<!-- seo-description: Use the Loomio User API to create and manage discussions, comments, polls, threads, and group memberships from other software. -->"
    translation: "<!-- seo-description: באמצעות ה־API למשתמש של Loomio ניתן ליצור ולנהל דיונים, תגובות, משאלים, שרשורים וחברויות בקבוצות מתוך תוכנות אחרות. -->"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cc2da08540808ada:
    english: "`/api/b2` is the user-oriented API for integrations with Loomio. It uses the API key of a user account, and every action is performed as that user."
    translation: "`/api/b2` הוא ה־API למשתמש עבור אינטגרציות עם Loomio. הוא משתמש במפתח ה־API של חשבון משתמש, וכל פעולה מתבצעת בשם החשבון הזה."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7036a6661aac00f2:
    english: Group operations use the memberships and group permissions of the API-key user. Instance-administrator status does not expand an API key's access to groups or content; use the Server API for instance-level administration.
    translation: פעולות בקבוצות כפופות לחברויות ולהרשאות הקבוצה של החשבון שמפתח ה־API שייך לו. הרשאת ניהול של המערכת אינה מרחיבה את הגישה של מפתח ה־API לקבוצות או לתוכן. לניהול ברמת המערכת יש להשתמש ב־Server API.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c4436493b062b9f1:
    english: Use the API key from the Loomio user account that will perform the actions. A dedicated bot account is useful when an integration should not be invited to polls or receive notifications.
    translation: יש להשתמש במפתח ה־API של חשבון Loomio שיבצע את הפעולות. חשבון בוט ייעודי מועיל כאשר אין צורך להזמין את האינטגרציה להשתתף במשאלים או לשלוח לה התראות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ade21c593f08100c:
    english: Signed-in users can find their API key and group IDs on the [API access page](/profile/api_access).
    translation: לאחר כניסה לחשבון, ניתן למצוא את מפתח ה־API ואת מזהי הקבוצות ב[דף הגישה ל־API](/profile/api_access).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  15160edafaf441c1:
    english: 'Send the API key in an `Authorization: Bearer` header. API keys in query strings are rejected because URLs can be recorded by proxies and access logs.'
    translation: 'יש לשלוח את מפתח ה־API בכותרת `Authorization: Bearer`. מפתחות API שנשלחים בפרמטרים של כתובת URL נדחים, משום ששרתי תיווך ויומני גישה עשויים לתעד כתובות URL.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2215e57186277325:
    english: "### Authentication change"
    translation: "### שינוי באופן האימות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ff5f4c1055e80fb6:
    english: 'The API key was previously accepted as an `api_key` URL parameter. Requests using `?api_key=YOUR_API_KEY` no longer work. Use the HTTP `Authorization` header instead:'
    translation: 'בעבר ניתן היה לשלוח את מפתח ה־API בפרמטר הכתובת `api_key`. בקשות שמשתמשות ב־`?api_key=YOUR_API_KEY` אינן פועלות עוד. יש להשתמש בכותרת HTTP ‏`Authorization` במקום זאת:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  65574ba500243c80:
    english: The examples use `YOUR_API_KEY`, group ID `123`, and `https://www.loomio.com/`. Replace these with your API key, group ID, and Loomio installation URL.
    translation: בדוגמאות נעשה שימוש ב־`YOUR_API_KEY`, במזהה הקבוצה `123` ובכתובת `https://www.loomio.com/`. יש להחליף אותם במפתח ה־API, במזהה הקבוצה ובכתובת ההתקנה של Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bec1e4f30aeef4ce:
    english: "## Response size and related records"
    translation: "## גודל התגובה ורשומות קשורות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  da004eb4e005fae1:
    english: 'User API responses use a compound format: the primary records are accompanied by related records such as topics, groups, users, polls, and reactions. This lets a client populate a local record store from one request, but can include more data than a simple integration needs.'
    translation: 'תגובות ה־API למשתמש משתמשות במבנה משולב: לצד הרשומות הראשיות נשלחות רשומות קשורות, כגון נושאים, קבוצות, משתמשים, משאלים ותגובות רגשיות. כך אפשר למלא מאגר רשומות מקומי בבקשה אחת, אך התגובה עשויה להכיל יותר נתונים מהנדרש לאינטגרציה פשוטה.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  64d9a631b54cbaba:
    english: Pass `compact=1` to omit bulky related topics, groups, parent groups, memberships, reactions, tags, and translations. Primary records and the related records needed to interpret their content remain present.
    translation: ניתן להעביר `compact=1` כדי להשמיט רשומות קשורות גדולות של נושאים, קבוצות, קבוצות הורה, חברויות, תגובות רגשיות, תגיות ותרגומים. הרשומות הראשיות והרשומות הקשורות הנחוצות להבנת התוכן שלהן עדיין ייכללו.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e4e671db39dbe6f1:
    english: For direct control, pass `exclude_types` with space-separated singular record types. For example, `exclude_types=group reaction` omits related groups and reactions. Common values are `topic`, `group`, `parent`, `membership`, `reaction`, `tag`, `translation`, `user`, `discussion`, `poll`, `poll_option`, `stance`, `stance_choice`, `outcome`, and `topic_item`. Exclusions apply to related records, not the primary resource requested by the endpoint.
    translation: לשליטה ישירה, יש להעביר את `exclude_types` עם שמות סוגי רשומות ביחיד, מופרדים ברווחים. לדוגמה, `exclude_types=group reaction` משמיט קבוצות ותגובות רגשיות קשורות. ערכים נפוצים הם `topic`, `group`, `parent`, `membership`, `reaction`, `tag`, `translation`, `user`, `discussion`, `poll`, `poll_option`, `stance`, `stance_choice`, `outcome` ו־`topic_item`. ההשמטות חלות על רשומות קשורות, ולא על המשאב הראשי שהתבקש בנקודת הקצה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ded075da3c2aa815:
    english: Collection responses include `meta.total` when an exact collection size is defined. The total is calculated before `limit` and `offset` are applied. Endpoints such as search that intentionally return a bounded result set omit `meta.total` rather than returning `null`.
    translation: תגובות של אוספים כוללות את `meta.total` כאשר מוגדר גודל מדויק לאוסף. הסכום הכולל מחושב לפני החלת `limit` ו־`offset`. נקודות קצה כגון חיפוש, שמחזירות בכוונה מספר מוגבל של תוצאות, משמיטות את `meta.total` במקום להחזיר `null`.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  17cb8ef90a2acdb3:
    english: "## Endpoint summary"
    translation: "## סיכום נקודות הקצה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  608edb13080e57c2:
    english: |-
      | Method | Endpoint | Purpose |
      | --- | --- | --- |
      | `GET` | `/api/b2/groups` | List the API-key user's groups |
      | `GET` | `/api/b2/groups/:id_or_key_or_handle` | Get a visible group |
      | `GET` | `/api/b2/reports` | Generate a participation report |
      | `GET` | `/api/b2/search` | Search visible discussions, comments, polls, votes, and outcomes |
      | `POST` | `/api/b2/discussions` | Create a discussion |
      | `GET` | `/api/b2/discussions/:id` | Get a discussion |
      | `GET` | `/api/b2/discussions` | List discussions in a group |
      | `PATCH` | `/api/b2/discussions/:id` | Edit a discussion |
      | `DELETE` | `/api/b2/discussions/:id` | Soft-delete a discussion |
      | `GET` | `/api/b2/threads` | List visible discussion and standalone-poll threads |
      | `GET` | `/api/b2/threads/:topic_id` | Get a thread |
      | `GET` | `/api/b2/threads/:topic_id/items` | Get the ordered items in a thread |
      | `GET` | `/api/b2/threads/:topic_id/markdown` | Get a complete thread as Markdown |
      | `POST` | `/api/b2/comments` | Create a comment or reply |
      | `PATCH` | `/api/b2/comments/:id` | Edit a comment |
      | `DELETE` | `/api/b2/comments/:id` | Soft-delete a comment |
      | `POST` | `/api/b2/polls` | Create a poll |
      | `GET` | `/api/b2/polls/:id` | Get a poll |
      | `GET` | `/api/b2/polls` | List polls in a group |
      | `PATCH` | `/api/b2/polls/:id` | Edit a poll |
      | `DELETE` | `/api/b2/polls/:id` | Soft-delete a poll |
      | `GET` | `/api/b2/memberships` | List a group's memberships |
      | `POST` | `/api/b2/memberships` | Add members and optionally remove absent members |
      | `GET` | `/api/b2/chatbots` | List a group's chat integrations and webhooks |
      | `POST` | `/api/b2/chatbots` | Create a chat integration or webhook |
      | `PATCH` | `/api/b2/chatbots/:id` | Update a chat integration or webhook |
      | `DELETE` | `/api/b2/chatbots/:id` | Delete a chat integration or webhook |
      | `POST` | `/api/b2/chatbots/check` | Send a webhook connection test |
    translation: |-
      | שיטה | נקודת קצה | מטרה |
      | --- | --- | --- |
      | `GET` | `/api/b2/groups` | הצגת הקבוצות של החשבון שמפתח ה־API שייך לו |
      | `GET` | `/api/b2/groups/:id_or_key_or_handle` | קבלת קבוצה שניתן לצפות בה |
      | `GET` | `/api/b2/reports` | הפקת דוח השתתפות |
      | `GET` | `/api/b2/search` | חיפוש בדיונים, בתגובות, במשאלים, בהצבעות ובמסקנות שניתן לצפות בהם |
      | `POST` | `/api/b2/discussions` | יצירת דיון |
      | `GET` | `/api/b2/discussions/:id` | קבלת דיון |
      | `GET` | `/api/b2/discussions` | הצגת דיונים בקבוצה |
      | `PATCH` | `/api/b2/discussions/:id` | עריכת דיון |
      | `DELETE` | `/api/b2/discussions/:id` | מחיקה רכה של דיון |
      | `GET` | `/api/b2/threads` | הצגת שרשורים של דיונים ושל משאלים עצמאיים שניתן לצפות בהם |
      | `GET` | `/api/b2/threads/:topic_id` | קבלת שרשור |
      | `GET` | `/api/b2/threads/:topic_id/items` | קבלת הפריטים בשרשור לפי סדרם |
      | `GET` | `/api/b2/threads/:topic_id/markdown` | קבלת שרשור מלא בפורמט Markdown |
      | `POST` | `/api/b2/comments` | יצירת תגובה או מענה |
      | `PATCH` | `/api/b2/comments/:id` | עריכת תגובה |
      | `DELETE` | `/api/b2/comments/:id` | מחיקה רכה של תגובה |
      | `POST` | `/api/b2/polls` | יצירת משאל |
      | `GET` | `/api/b2/polls/:id` | קבלת משאל |
      | `GET` | `/api/b2/polls` | הצגת משאלים בקבוצה |
      | `PATCH` | `/api/b2/polls/:id` | עריכת משאל |
      | `DELETE` | `/api/b2/polls/:id` | מחיקה רכה של משאל |
      | `GET` | `/api/b2/memberships` | הצגת החברויות בקבוצה |
      | `POST` | `/api/b2/memberships` | הוספת חברים, ואפשרות להסיר חברים שאינם ברשימה |
      | `GET` | `/api/b2/chatbots` | הצגת אינטגרציות הצ'אט וה־webhooks של קבוצה |
      | `POST` | `/api/b2/chatbots` | יצירת אינטגרציית צ'אט או webhook |
      | `PATCH` | `/api/b2/chatbots/:id` | עדכון אינטגרציית צ'אט או webhook |
      | `DELETE` | `/api/b2/chatbots/:id` | מחיקת אינטגרציית צ'אט או webhook |
      | `POST` | `/api/b2/chatbots/check` | שליחת בדיקת חיבור ל־webhook |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0473f1f7fb78f074:
    english: "## Groups"
    translation: "## קבוצות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dc819221f371c435:
    english: "### List groups"
    translation: "### הצגת קבוצות"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  964f575e90aa9cde:
    english: Return the groups in which the API-key user has an active membership.
    translation: מחזיר את הקבוצות שבהן לחשבון שמפתח ה־API שייך לו יש חברות פעילה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3835e6e77bc0ad10:
    english: "`GET /api/b2/groups`"
    translation: "`GET /api/b2/groups`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4f588e981afc3069:
    english: The response contains all matching records in a non-paginated `groups` array. It includes parent groups and subgroups, including groups whose subscription is not currently active. Check the `enabled` field when an integration should operate only on enabled groups.
    translation: התגובה מכילה את כל הרשומות המתאימות במערך `groups`, ללא חלוקה לעמודים. היא כוללת קבוצות הורה ותת־קבוצות, גם כאשר המינוי שלהן אינו פעיל כרגע. כאשר האינטגרציה אמורה לפעול רק בקבוצות פעילות, יש לבדוק את השדה `enabled`.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  213de8ce539a42c3:
    english: 'Important group fields include:'
    translation: 'שדות חשובים של קבוצה:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d377f7c9b224a6d7:
    english: |-
      | Field | Description |
      | --- | --- |
      | `id` | Numeric group ID used by other User API endpoints |
      | `key` | Stable short key used in Loomio URLs |
      | `handle` | Human-readable group handle |
      | `name` | Group name |
      | `full_name` | Group name including its parent-group context |
      | `parent_id` | Numeric parent-group ID for a subgroup, otherwise `null` |
      | `enabled` | Whether the group and its subscription are active |
      | `memberships_count` | Number of active and pending memberships |
      | `accepted_memberships_count` | Number of accepted memberships |
      | `pending_memberships_count` | Number of pending invitations |
      | `admin_memberships_count` | Number of group administrators |
      | `delegates_count` | Number of delegates |
      | `discussions_count` | Number of discussions directly in the group |
      | `polls_count` | Number of polls directly in the group |
      | `subgroups_count` | Number of subgroups |
    translation: |-
      | שדה | תיאור |
      | --- | --- |
      | `id` | מזהה מספרי של הקבוצה, המשמש בנקודות קצה אחרות של ה־API למשתמש |
      | `key` | מפתח קצר וקבוע המשמש בכתובות URL של Loomio |
      | `handle` | מזהה קריא של הקבוצה |
      | `name` | שם הקבוצה |
      | `full_name` | שם הקבוצה, כולל ההקשר של קבוצת ההורה שלה |
      | `parent_id` | המזהה המספרי של קבוצת ההורה של תת־קבוצה, או `null` אם אין קבוצת הורה |
      | `enabled` | האם הקבוצה והמינוי שלה פעילים |
      | `memberships_count` | מספר החברויות הפעילות והממתינות |
      | `accepted_memberships_count` | מספר החברויות שאושרו |
      | `pending_memberships_count` | מספר ההזמנות הממתינות |
      | `admin_memberships_count` | מספר מנהלי הקבוצה |
      | `delegates_count` | מספר הנציגים |
      | `discussions_count` | מספר הדיונים ישירות בקבוצה |
      | `polls_count` | מספר המשאלים ישירות בקבוצה |
      | `subgroups_count` | מספר תת־הקבוצות |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  34f1693ba28fcb80:
    english: The response may include additional group settings, related parent-group records and the API user's memberships. Clients should ignore fields they do not use.
    translation: התגובה עשויה לכלול הגדרות קבוצה נוספות, רשומות קשורות של קבוצת ההורה וחברויות של חשבון ה־API. על תוכנות המשתמשות ב־API להתעלם משדות שאינן משתמשות בהם.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d7c327b8ed7f7bf2:
    english: "### Get a group"
    translation: "### קבלת קבוצה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  15ab63bc2d396657:
    english: Return one group visible to the API-key user.
    translation: מחזיר קבוצה אחת שהחשבון שמפתח ה־API שייך לו יכול לצפות בה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8ba2cc9e3c67b1dd:
    english: "`GET /api/b2/groups/:id_or_key_or_handle`"
    translation: "`GET /api/b2/groups/:id_or_key_or_handle`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  71e5812ff9890c9b:
    english: The identifier can be the group's numeric ID, key or handle.
    translation: המזהה יכול להיות המזהה המספרי של הקבוצה, המפתח שלה או המזהה הקריא שלה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8ba79a283b7b77d5:
    english: The response contains the group in the `groups` array and uses the same fields as the list endpoint. A request for a group the API-key user cannot access returns a permission error.
    translation: התגובה מכילה את הקבוצה במערך `groups`, עם אותם שדות כמו בנקודת הקצה להצגת קבוצות. בקשה לקבוצה שאין לחשבון שמפתח ה־API שייך לו גישה אליה מחזירה שגיאת הרשאה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  18d823df4d7f8fac:
    english: "## Webhooks"
    translation: "## Webhooks"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f33d58fc1f2fd84c:
    english: 'The User API is request-based: an integration calls Loomio when it wants to read or change data. A group webhook provides the push direction. Loomio sends selected group events to your endpoint as they happen, so an integration does not need to poll the REST API for changes.'
    translation: 'ה־API למשתמש מבוסס על בקשות: אינטגרציה פונה ל־Loomio כאשר היא צריכה לקרוא או לשנות נתונים. Webhook של קבוצה מאפשר לשלוח עדכונים בכיוון ההפוך. Loomio שולח אירועים נבחרים מהקבוצה לנקודת הקצה של האינטגרציה כשהם מתרחשים, כך שאין צורך לבדוק שוב ושוב אם חלו שינויים ב־REST API.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3b5b4b0ac52b9010:
    english: 'Webhooks are configured per group and require group-administrator permission. They can be managed through the Loomio interface:'
    translation: 'Webhooks מוגדרים לכל קבוצה בנפרד ודורשים הרשאת ניהול בקבוצה. ניתן לנהל אותם דרך הממשק של Loomio:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  318710be7b3aae7d:
    english: |-
      1. Open the group.
      2. Open the group menu and select **Chat integrations**.
      3. Add the integration matching the payload format your endpoint accepts. For a general-purpose endpoint, use the Mattermost/Markdown format.
      4. Enter a name and the destination URL.
      5. Select the events that Loomio should send automatically.
      6. Save the integration and use **Test connection** to send a test message.
    translation: |-
      1. יש לפתוח את הקבוצה.
      2. יש לפתוח את תפריט הקבוצה ולבחור **אינטגרציות צ'אט**.
      3. יש להוסיף אינטגרציה שמתאימה לפורמט הנתונים שנקודת הקצה מקבלת. לנקודת קצה כללית, יש להשתמש בפורמט Mattermost/Markdown.
      4. יש להזין שם ואת כתובת ה־URL של היעד.
      5. יש לבחור את האירועים ש־Loomio ישלח אוטומטית.
      6. יש לשמור את האינטגרציה ולהשתמש ב־**בדיקת חיבור** כדי לשלוח הודעת בדיקה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  43fb95cf304fced6:
    english: Use an HTTPS destination with an unguessable URL. Loomio requires the destination to resolve to a public address and blocks requests to local or private network addresses.
    translation: יש להשתמש ביעד HTTPS עם כתובת URL שקשה לנחש. Loomio דורש שכתובת היעד תפנה לכתובת ציבורית וחוסם בקשות לכתובות ברשת מקומית או פרטית.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d8d5abffe6425bea:
    english: Agents and other integrations can instead manage webhooks through the Bearer-authenticated chatbot endpoints described below. The resource is named `chatbots` for compatibility with Loomio's chat integrations, but it also represents general outgoing webhooks.
    translation: אפשר לנהל webhooks גם באמצעות סוכנים ואינטגרציות אחרות, דרך נקודות הקצה של צ'אטבוטים המאומתות באמצעות Bearer ומתוארות בהמשך. המשאב נקרא `chatbots` כדי לשמור על תאימות לאינטגרציות הצ'אט של Loomio, והוא משמש גם ל-webhooks יוצאים כלליים.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  28fb6371af33b66f:
    english: "### List webhooks"
    translation: "### הצגת webhooks"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7187e5a26c3ec864:
    english: Return the chat integrations configured for a group. The API-key user must be an administrator of that group. The response includes destination URLs, so it must not be exposed to ordinary group members.
    translation: מחזיר את אינטגרציות הצ'אט שהוגדרו לקבוצה. נדרשת הרשאת ניהול בקבוצה עבור החשבון שמפתח ה־API שייך לו. התגובה כוללת כתובות URL של יעדים, ולכן אין לחשוף אותה לחברי קבוצה שאינם מנהלים.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  788d370538bdda46:
    english: "`GET /api/b2/chatbots?group_id=123`"
    translation: "`GET /api/b2/chatbots?group_id=123`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d676ca45c3e1074a:
    english: 'The response contains a `chatbots` array with these fields:'
    translation: 'התגובה מכילה מערך `chatbots` עם השדות הבאים:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ca00f7d0a52ce803:
    english: |-
      | Field | Description |
      | --- | --- |
      | `id` | Integration ID used for updates and deletion |
      | `group_id` | Group receiving the events |
      | `name` | Administrative name for the integration |
      | `kind` | `webhook` for an outgoing webhook or `matrix` for a Matrix integration |
      | `webhook_kind` | Payload format: `markdown`, `slack`, `discord`, `microsoft`, or `webex` |
      | `server` | Destination URL |
      | `event_kinds` | Events sent automatically |
      | `notification_only` | Whether messages contain only the notification headline |
    translation: |-
      | שדה | תיאור |
      | --- | --- |
      | `id` | מזהה האינטגרציה המשמש לעדכון ולמחיקה |
      | `group_id` | הקבוצה שממנה מתקבלים האירועים |
      | `name` | השם של האינטגרציה לצורכי ניהול |
      | `kind` | `webhook` עבור webhook יוצא או `matrix` עבור אינטגרציית Matrix |
      | `webhook_kind` | פורמט הנתונים: `markdown`, `slack`, `discord`, `microsoft` או `webex` |
      | `server` | כתובת ה-URL של היעד |
      | `event_kinds` | אירועים שנשלחים אוטומטית |
      | `notification_only` | האם ההודעות כוללות רק את כותרת ההתראה |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d72d8237eded6fdd:
    english: "### Create a webhook"
    translation: "### יצירת webhook"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e33c05cb2770fe21:
    english: "`POST /api/b2/chatbots`"
    translation: "`POST /api/b2/chatbots`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  acee55f2470a1eef:
    english: The API-key user must be an administrator of `group_id`. The destination is validated as a public URL before it is saved.
    translation: חשבון המשתמש של מפתח ה-API חייב להיות בעל הרשאות ניהול בקבוצה `group_id`. לפני השמירה נבדק שכתובת ה-URL של היעד ציבורית.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  05d9e1cdc6185f85:
    english: "### Update a webhook"
    translation: "### עדכון webhook"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  eb7a96b45abe57c2:
    english: "`PATCH /api/b2/chatbots/:id`"
    translation: "`PATCH /api/b2/chatbots/:id`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2696d4fd91cd5f6f:
    english: Send any fields that should change. The webhook cannot be transferred to another group by changing `group_id`.
    translation: יש לשלוח את השדות שיש לשנות. שינוי `group_id` אינו מאפשר להעביר את ה-webhook לקבוצה אחרת.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e56bb884ce5ef3c5:
    english: "### Test a webhook destination"
    translation: "### בדיקת יעד של webhook"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  10c1e636b20121c2:
    english: Send a Markdown-compatible test message to a destination before or after saving its configuration.
    translation: ניתן לשלוח ליעד הודעת בדיקה התואמת ל-Markdown לפני שמירת ההגדרות או אחריה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cf0e0fae3c68178d:
    english: "`POST /api/b2/chatbots/check`"
    translation: "`POST /api/b2/chatbots/check`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fcb55f73325b9f2a:
    english: "### Delete a webhook"
    translation: "### מחיקת webhook"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f7e12256467f6c49:
    english: "`DELETE /api/b2/chatbots/:id`"
    translation: "`DELETE /api/b2/chatbots/:id`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f158f3939e36074c:
    english: Deleting the configuration stops future deliveries. It does not delete any Loomio group content.
    translation: מחיקת ההגדרות מפסיקה משלוחים עתידיים. היא אינה מוחקת תוכן מהקבוצה ב-Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f0fe37689a7c3646:
    english: "### Event types"
    translation: "### סוגי אירועים"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  066ca1423e999efa:
    english: 'A webhook can subscribe to these event types:'
    translation: 'ניתן להירשם באמצעות webhook לסוגי האירועים הבאים:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  82962625b0583140:
    english: |-
      | Event | When it is sent |
      | --- | --- |
      | `new_discussion` | A discussion is started |
      | `discussion_edited` | A discussion is edited |
      | `new_comment` | A comment is created |
      | `poll_created` | A poll is started |
      | `poll_edited` | A poll is edited |
      | `poll_closing_soon` | A poll is approaching its closing time |
      | `poll_expired` | A poll reaches its closing time |
      | `poll_closed_by_user` | A person closes a poll manually |
      | `poll_reopened` | A poll is reopened |
      | `outcome_created` | An outcome is published |
      | `outcome_updated` | An outcome is updated |
      | `outcome_review_due` | An outcome review becomes due |
      | `stance_created` | A vote is cast |
      | `stance_updated` | A vote is changed |
    translation: |-
      | אירוע | מתי הוא נשלח |
      | --- | --- |
      | `new_discussion` | נפתח דיון |
      | `discussion_edited` | דיון נערך |
      | `new_comment` | נוצרה תגובה |
      | `poll_created` | נפתח משאל |
      | `poll_edited` | משאל נערך |
      | `poll_closing_soon` | מועד סגירת המשאל מתקרב |
      | `poll_expired` | הגיע מועד סגירת המשאל |
      | `poll_closed_by_user` | המשאל נסגר ידנית |
      | `poll_reopened` | המשאל נפתח מחדש |
      | `outcome_created` | פורסמה מסקנה |
      | `outcome_updated` | מסקנה עודכנה |
      | `outcome_review_due` | הגיע המועד לבדיקת מסקנה |
      | `stance_created` | הוצבעה הצבעה |
      | `stance_updated` | הצבעה שונתה |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ed1d3fc4a6fb67b9:
    english: The webhook belongs to one group and receives subscribed events from that group. People can also explicitly select the integration when sharing or sending some notifications, even when the corresponding automatic event is not selected.
    translation: ה-webhook שייך לקבוצה אחת ומקבל ממנה את האירועים שנבחרו. ניתן גם לבחור במפורש באינטגרציה בעת שיתוף או שליחה של התראות מסוימות, גם אם האירוע האוטומטי המתאים לא נבחר.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  512f0701765b66ec:
    english: "### HTTP delivery"
    translation: "### משלוח באמצעות HTTP"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  dca082a687dc5505:
    english: 'Loomio sends an asynchronous HTTP `POST` to the configured URL with this header:'
    translation: 'Loomio שולחת בקשת HTTP מסוג `POST` באופן אסינכרוני לכתובת ה-URL שהוגדרה, עם הכותרת הבאה:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a4f66c4c94afa135:
    english: The request timeout is five seconds. A `2xx` response, including `204 No Content`, is treated as successful. Webhook consumers should respond promptly, process longer work asynchronously, and tolerate duplicate or out-of-order deliveries.
    translation: זמן ההמתנה המרבי לבקשה הוא חמש שניות. תגובת `2xx`, כולל `204 No Content`, נחשבת להצלחה. שירותים שמקבלים הודעות webhook צריכים להשיב במהירות, לעבד פעולות ממושכות באופן אסינכרוני ולהתמודד עם משלוחים כפולים או משלוחים שמגיעים בסדר שונה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  84faa7dad6f34739:
    english: Loomio does not currently add a webhook signature, shared-secret header, event ID, or delivery ID. Treat the full destination URL as a credential, do not expose it publicly, and include an unguessable token in the URL when the receiving service supports one. If a stable machine-readable event schema or signed delivery is required, use the webhook as a change notification and retrieve the current records through the authenticated User API.
    translation: Loomio אינה מוסיפה כיום חתימת webhook, כותרת עם סוד משותף, מזהה אירוע או מזהה משלוח. יש להתייחס לכתובת ה-URL המלאה של היעד כאל פרט גישה, להימנע מחשיפתה לציבור ולכלול בה אסימון שקשה לנחש אם השירות המקבל תומך בכך. אם נדרשים מבנה אירועים יציב לקריאה ממוחשבת או משלוחים חתומים, ניתן להשתמש ב-webhook כהודעה על שינוי ולאחזר את הרשומות העדכניות דרך ממשק ה-API למשתמשים עם אימות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f3d956b4694f793c:
    english: "### Payload formats"
    translation: "### פורמטים של הנתונים הנשלחים"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  deed1ccba8a70ac2:
    english: Webhook payloads are presentation-oriented messages intended for chat services. They are not complete serialized Loomio records. Links in the message identify the affected Loomio content; an integration can follow up through the User API when it needs structured current state.
    translation: הנתונים שנשלחים ב-webhook הם הודעות המיועדות להצגה בשירותי צ'אט. הם אינם רשומות Loomio מלאות בפורמט סדור. הקישורים בהודעה מזהים את התוכן שהושפע ב-Loomio; כשנדרש המצב העדכני במבנה נתונים, ניתן לאחזר אותו דרך ממשק ה-API למשתמשים.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c2e9782a81b59ab2:
    english: |-
      | Integration format | Principal JSON fields |
      | --- | --- |
      | Mattermost/Markdown | `text`, `icon_url`, `username` |
      | Slack | `text` |
      | Discord | `content`, limited to approximately 1,900 characters |
      | Microsoft Teams | `@type`, `@context`, `themeColor`, `text`, `sections` |
      | Webex | `markdown` |
    translation: |-
      | פורמט האינטגרציה | שדות JSON עיקריים |
      | --- | --- |
      | Mattermost/Markdown | `text`, `icon_url`, `username` |
      | Slack | `text` |
      | Discord | `content`, מוגבל לכ-1,900 תווים |
      | Microsoft Teams | `@type`, `@context`, `themeColor`, `text`, `sections` |
      | Webex | `markdown` |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  132dd698f11d1d08:
    english: 'For example, the general Markdown format sends a body shaped like:'
    translation: 'לדוגמה, הפורמט הכללי של Markdown שולח גוף הודעה במבנה הבא:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d224ca01f360918e:
    english: The exact message text depends on the event, group locale, notification-only setting, and Loomio version. Consumers should rely on the selected format's documented top-level fields rather than parsing sentence wording.
    translation: נוסח ההודעה המדויק תלוי באירוע, בשפת הקבוצה, בהגדרה לשליחת כותרת ההתראה בלבד ובגרסת Loomio. יש להסתמך על השדות הראשיים המתועדים של הפורמט שנבחר, ולא על ניתוח נוסח המשפטים.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  62c53ea4911e0c79:
    english: "## Search"
    translation: "## חיפוש"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f7346561ccdfcfce:
    english: Search discussions, comments, polls, votes, and outcomes visible to the API-key user. Results include public content even when the user is not a member of its group; private content remains subject to normal topic visibility.
    translation: ניתן לחפש דיונים, תגובות, משאלים, הצבעות ומסקנות שגלויים לחשבון המשתמש של מפתח ה-API. התוצאות כוללות תוכן ציבורי גם ללא חברות בקבוצה שלו. הגישה לתוכן פרטי כפופה לכללי הנראות הרגילים של הנושא.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e9101cf4a72bde36:
    english: "`GET /api/b2/search`"
    translation: "`GET /api/b2/search`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9bc24da4bd85dac2:
    english: "### Params"
    translation: "### פרמטרים"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ac9bc86d81bfd39f:
    english: |-
      | Name | Description |
      | --- | --- |
      | `query` | Search text. Exact and fuzzy matches are supported |
      | `group_id` | Restrict results to one visible group |
      | `org_id` | Restrict results to a visible parent group and its visible subgroups. Use `0` for direct discussions |
      | `type` | Restrict results to one type: `Discussion`, `Comment`, `Poll`, `Stance`, or `Outcome` |
      | `types` | Comma-separated list of result types |
      | `tag` | Restrict results to topics with this tag |
      | `author_id` | Restrict results to content by one author. Without `query`, returns that author's recent visible activity |
      | `order` | Set to `authored_at_desc` to order matching content by authoring time |
    translation: |-
      | שם | תיאור |
      | --- | --- |
      | `query` | טקסט לחיפוש. נתמכות התאמות מדויקות ומקורבות |
      | `group_id` | הגבלת התוצאות לקבוצה גלויה אחת |
      | `org_id` | הגבלת התוצאות לקבוצת אם גלויה ולתתי-הקבוצות הגלויות שלה. עבור דיונים ישירים יש להשתמש ב-`0` |
      | `type` | הגבלת התוצאות לסוג אחד: `Discussion`, `Comment`, `Poll`, `Stance` או `Outcome` |
      | `types` | רשימת סוגי תוצאות מופרדת בפסיקים |
      | `tag` | הגבלת התוצאות לנושאים עם התג הזה |
