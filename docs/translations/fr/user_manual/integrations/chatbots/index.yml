  290b36f9178272e2:
    english: |-
      Our webhook based system can also be used to support other systems that support incoming webhooks with either HTML or Markdown formatting. This could be something like Zapier or Rocketchat.
      Just select the mattermost bot, but use a custom webhook URL.
    translation: |-
      Notre système de webhooks peut aussi fonctionner avec d'autres services qui acceptent les webhooks entrants au format HTML ou Markdown, comme Zapier ou Rocketchat.
      Sélectionnez le bot Mattermost et indiquez une URL de webhook personnalisée.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f76c44196c94dcef:
    english: "## Set up a chat integration"
    translation: "## Configurer une intégration de chat"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3c63f567f90fd1eb:
    english: |-
      After configuring your chosen service (see above), you'll have a webhook URL.
      Open **Chat integrations** from the group menu and add a new chat integration for your group.
    translation: |-
      Une fois le service de votre choix configuré (voir ci-dessus), vous disposerez d'une URL de webhook.
      Dans le menu du groupe, ouvrez **Intégrations de chat** et ajoutez une intégration de chat pour votre groupe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
