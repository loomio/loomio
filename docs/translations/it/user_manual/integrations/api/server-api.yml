  ce9efb629e50628c:
    english: "## Delete User"
    translation: "## Eliminare un utente"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a37f91309a44b472:
    english: Delete removes the user and records the user created. Comments are removed from threads, votes are removed from polls, and groups, discussions, polls, and other records created by the user may also be deleted through database associations.
    translation: L'eliminazione rimuove l'utente e i contenuti che ha creato. I commenti vengono rimossi dalle discussioni e i voti dai sondaggi. Anche i gruppi, le discussioni, i sondaggi e altri contenuti creati dall'utente possono essere eliminati tramite le associazioni del database.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  537bd891e445eb93:
    english: This is very destructive. Redaction is highly recommended instead.
    translation: Questa operazione può eliminare molti contenuti. Ti consigliamo di oscurare i dati personali dell'utente.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
