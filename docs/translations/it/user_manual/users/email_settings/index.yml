    english: To stop email and push messages for group and thread activity, open **Notification settings** from your user menu, set the catch-up to **Never**, and choose **No email updates** and **No push updates**. Notifications and activity remain available when you open Loomio.
    translation: Per interrompere le email e le notifiche push sulle attività dei gruppi e dei thread, apri **Impostazioni notifiche** dal menu utente, imposta il riepilogo su **Mai** e scegli **Nessun aggiornamento via email** e **Nessun aggiornamento push**. Le notifiche e le attività restano disponibili quando apri Loomio.
