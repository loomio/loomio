  '053719812e2be1ea':
    english: "# Group data backup or export"
    translation: "# Backup ou exportação dos dados do grupo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  42721518a91907da:
    english: 'With the group data export feature you can:'
    translation: 'Com o recurso de exportação dos dados do grupo, você pode:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f978c97e52e0b00a:
    english: |-
      - Download a file containing member data to audit group membership.
      - Download content of your group including text of threads and polls for archive or analysis.
      - Open poll results in a spreadsheet or scripting language.
      - [Print or save PDF's of a thread or poll for archival purposes.](#print-thread-to-pdf)
      - Move your group, including all users, threads, polls, and files to another Loomio server.
    translation: |-
      - Baixar um arquivo com os dados dos membros para conferir quem faz parte do grupo.
      - Baixar o conteúdo do seu grupo, incluindo o texto das discussões e enquetes, para arquivar ou analisar.
      - Abrir os resultados das enquetes em uma planilha ou linguagem de programação.
      - [Imprimir ou salvar PDFs de uma discussão ou enquete para arquivamento.](#print-thread-to-pdf)
      - Transferir seu grupo, incluindo todos os usuários, discussões, enquetes e arquivos, para outro servidor Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  94b3081b62cd0a45:
    english: If you ever want to move from Loomio managed servers [to your own](https://github.com/loomio/loomio), you can use this feature.
    translation: Se você quiser sair dos servidores gerenciados pelo Loomio e passar [para um servidor próprio](https://github.com/loomio/loomio), poderá usar esse recurso.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  223d5690921676c4:
    english: If you're running your own Loomio server, and would rather not anymore, Loomio offer managed hosting in USA, EU and Australia. If you'd like to migrate your group to one of these servers, please [contact us](/contact).
    translation: Se você mantém seu próprio servidor Loomio e prefere deixar de fazê-lo, o Loomio oferece hospedagem gerenciada nos EUA, na UE e na Austrália. Para migrar seu grupo para um desses servidores, [entre em contato conosco](/contact).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cabd4ab01146ea7c:
    english: "[Contact us](/contact) if you would like to transfer your Loomio group from Loomio's global hosted service at loomio.com to one of our regional services; loomio.eu for Europe or loomio.nz for Australia and New Zealand."
    translation: "[Entre em contato conosco](/contact) se quiser transferir seu grupo do serviço global hospedado pelo Loomio em loomio.com para um de nossos serviços regionais: loomio.eu, para a Europa, ou loomio.nz, para a Austrália e a Nova Zelândia."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
