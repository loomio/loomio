    translation: "![Formulario de confirmación que solicita el identificador de Oatmilk Cooperative](group_delete_group_confirm.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2df60ea964109f11:
    english: "## Group data is permanently deleted after 90 days"
    translation: "## Los datos del grupo se eliminan permanentemente después de 90 días"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e09923078301b8d:
    english: After 90 days, all the threads, polls, files and other group content will be permanently deleted. ***This is non-reversible!***
    translation: Después de 90 días, todos los hilos, sondeos, archivos y demás contenido del grupo se eliminarán permanentemente. ***No podrás recuperarlos.***
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8695a5ebfb09611d:
    english: We recommend that you [export the group data](/en/user_manual/groups/data_export/)and manually download any important files you have uploaded before you continue.
    translation: Te recomendamos [exportar los datos del grupo](/en/user_manual/groups/data_export/) y descargar manualmente los archivos importantes que hayas subido antes de continuar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
