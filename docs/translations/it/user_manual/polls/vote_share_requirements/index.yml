  2cb3890f4ef20320:
    english: Alex and Morgan then agree, while Taylor disagrees. All five people have voted, reaching the quorum, and four of five eligible voters agree. The 80 percent agreement exceeds the 75 percent vote share requirement, so both requirements show green check marks.
    translation: Poi Alex e Morgan votano a favore, mentre Taylor vota contro. Tutte e cinque le persone hanno votato, raggiungendo il quorum, e quattro elettori aventi diritto su cinque sono favorevoli. Il sostegno dell'80% supera il requisito di quota di voto del 75%, quindi entrambi i requisiti mostrano un segno di spunta verde.
