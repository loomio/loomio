    translated_on: '2026-09-30'
  223c90e3fe5b24d7:
    english: "> *“Consensus is the process – a participatory process by which a group thinks and feels together, en route to their decision.” - Sam Kaner, Community at Work*"
    translation: "> *«El consenso es el proceso: un proceso participativo en el que un grupo piensa y siente en conjunto mientras avanza hacia una decisión». - Sam Kaner, Community at Work*"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9872b82ded022524:
    english: |-
      ## Key points
      - Discuss and develop a proposal together
      - Include and respect everyone involved
      - Seek agreement from most people
    translation: |-
      ## Puntos clave
      - Debatir y elaborar una propuesta en conjunto
      - Incluir y respetar a todas las personas implicadas
      - Buscar el acuerdo de la mayoría
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a1cd3fa440013e0c:
    english: "**Consensus is typically used in:**\n- Working teams building shared understanding of an issue or opportunity, collaborating on a proposal and deciding course of action. \n- Governance board decisions where the board shows it is acting jointly, such as decisions on vision, policy, strategic planning and budget.\n- AGMs and General Assemblies where members and stakeholders seek general agreement for major decisions, such as revisions to statutes, major transactions and the elections of directors or council members."
    translation: |-
      **El consenso suele utilizarse en:**
      - Equipos de trabajo que buscan comprender en conjunto un problema o una oportunidad, colaborar en una propuesta y decidir qué hacer.
      - Decisiones de juntas directivas que actúan de forma conjunta, como las relacionadas con la visión, las políticas, la planificación estratégica y el presupuesto.
      - Asambleas generales ordinarias y otras asambleas generales en las que los miembros y otras partes interesadas buscan un acuerdo amplio sobre decisiones importantes, como cambios en los estatutos, transacciones de gran alcance y elecciones de integrantes de la junta o del consejo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7c5d3122a1333ba5:
    english: |-
      **Typical roles:**
      - Appoint a facilitator.  In board meetings this is usually the Chairperson.
      - A quorum or supermajority of members to participate, as specified in the organization's statutes.
    translation: |-
      **Funciones habituales:**
      - Designar a una persona facilitadora. En las reuniones de la junta, suele ser quien la preside.
      - Contar con la participación del quórum o de la mayoría cualificada de miembros que establezcan los estatutos de la organización.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1d8ee54aa5e87423:
    english: |-
      ## Consensus process steps
      1. State the issue to be decided - start a Loomio **discussion**.
      2. Present a proposal to test for consensus - start a **Sense check proposal**.
      3. Clarify any points, invite constructive modifications and amend the proposal.
      4. Test for agreement - start a **Consensus proposal**.
      5. Outcome - state the decision **outcome**.
    translation: |-
      ## Pasos del proceso de consenso
      1. Plantea el asunto que hay que decidir: inicia una **discusión** en Loomio.
      2. Presenta una propuesta para comprobar si hay consenso: inicia una **propuesta de comprobación de sentido**.
      3. Aclara las dudas, invita a hacer modificaciones constructivas y modifica la propuesta.
      4. Comprueba si hay acuerdo: inicia una **propuesta de consenso**.
      5. Conclusión: comunica la **conclusión** de la decisión.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0b5249cfd4c92c35:
    english: |-
      ## Benefits
      - Grow shared understanding.
      - Decisions for the collective will of the group.
      - Encourage people to value the group over their personal preferences.
    translation: |-
      ## Ventajas
      - Desarrollar una comprensión compartida.
      - Tomar decisiones que expresen la voluntad colectiva del grupo.
      - Animar a las personas a valorar al grupo por encima de sus preferencias individuales.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  55d7d6c48f056550:
    english: "## Applying the Consensus process on Loomio"
    translation: "## Aplicar el proceso de consenso en Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e50b473237140170:
    english: |-
      | **Consensus process** | **On Loomio** |
      |---|---|
      | You notice a problem or opportunity and take the initiative. |  |
      | **State the issue to be decided**  <br /><br />Provide background information and open a broad ranging discussion to build shared understanding. Look for emerging proposals. | Start a Loomio discussion <br /><br />Name the topic of discussion in the discussion title, and what you hope to achieve. <br /><br />Attach or link to background information. Invite people to ask questions, contribute information and write comments. |
      | **Present a proposal** <br /><br />Test for consensus. | Run a [Sense check proposal](/en/user_manual/polls/proposals/sense_check/). <br /><br />*In the title:* Name the proposal. <br /><br />*In the proposal details:* Clearly frame the proposal and say why it is important.  Include any background information necessary and a link to the proposal.  <br /><br />Invite everyone to respond, and to do so before the proposal closes.  |
      | **Amendment** <br /><br />Discuss, clarify and amend the proposal. <br /><br />Seek to understand and resolve any objections. <br /><br />Invite people objecting to to propose a constructive and practical modification to the proposed decision or course of action. | Facilitate discussion in the thread to address concerns and modify the proposal. |
      | **Agreement** <br /><br />Do you have an agreement?  Check for: <br /><br />Agreement: I support the proposal. <br /><br />Abstain: This decision does not affect me and I am happy with whatever the group decides. <br /><br />Disagreement: Something in the proposal needs to be changed before I can support it. <br /><br />Block: I have a fundamental disagreement with the proposal that cannot be resolved. | Run a [Consensus proposal](/en/user_manual/polls/proposals/consensus/) with the current proposal version. <br /><br />*In the title:* Name the decision to be made. <br /><br />*In the proposal details:* Present the proposal and invite people to vote. <br /><br />Include a clear statement of what agreement means, say 'for this proposal to pass, we need everyone to vote agree' or 'for this proposal to pass, we need 75% of members to agree'.  <br /><br />Ask participants to leave a vote 'Reason' - and if they do not agree to say why, and what needs to change for them to agree. <br /><br />Some organizations also use the Block (or veto) voting option. <br /><br />As voting progresses, respond to comments, post updates, close early, or let the proposal run to conclusion. <br /><br />Participants can *“change vote”* up to proposal close time, say in response to new information that arrives during voting. |
      | **Outcome** <br /><br />State if agreement was reached and the decision that has been made. <br /><br />Implement the decision and plan actions to be taken. | Consider voting results and state the decision made. <br /><br />Summarize results of the process and say what will happen next. <br /><br />If results are inconclusive, you may choose to re-open the discussion and run a new proposal. <br /><br />The outcome statement is an important record of the decision for future reference. |
    translation: |-
      | **Proceso de consenso** | **En Loomio** |
      |---|---|
      | Detectas un problema o una oportunidad y tomas la iniciativa. |  |
      | **Plantear el asunto que hay que decidir**  <br /><br />Aporta información de contexto y abre una discusión amplia para desarrollar una comprensión compartida. Presta atención a las propuestas que vayan surgiendo. | Inicia una discusión en Loomio. <br /><br />Indica el tema en el título de la discusión y explica qué esperas conseguir. <br /><br />Adjunta información de contexto o incluye enlaces a ella. Invita a las personas a hacer preguntas, aportar información y escribir comentarios. |
      | **Presentar una propuesta** <br /><br />Comprueba si hay consenso. | Inicia una [propuesta de comprobación de sentido](/en/user_manual/polls/proposals/sense_check/). <br /><br />*En el título:* Nombra la propuesta. <br /><br />*En los detalles de la propuesta:* Expón claramente la propuesta y explica por qué es importante. Incluye la información de contexto necesaria y un enlace a la propuesta. <br /><br />Invita a todas las personas a responder antes de que se cierre la propuesta. |
      | **Modificación** <br /><br />Debate, aclara y modifica la propuesta. <br /><br />Intenta comprender y resolver las objeciones. <br /><br />Invita a quienes tengan objeciones a proponer cambios constructivos y viables a la decisión o al curso de acción planteado. | Facilita la discusión en el hilo para atender las inquietudes y modificar la propuesta. |
      | **Acuerdo** <br /><br />¿Hay acuerdo? Comprueba estas respuestas: <br /><br />De acuerdo: Apoyo la propuesta. <br /><br />Abstenerse: Esta decisión no me afecta y estoy conforme con lo que decida el grupo. <br /><br />Desacuerdo: Hay algo en la propuesta que debe cambiar antes de que pueda apoyarla. <br /><br />Bloquear: Tengo un desacuerdo fundamental con la propuesta que no se puede resolver. | Inicia una [propuesta de consenso](/en/user_manual/polls/proposals/consensus/) con la versión actual de la propuesta. <br /><br />*En el título:* Nombra la decisión que hay que tomar. <br /><br />*En los detalles de la propuesta:* Presenta la propuesta e invita a las personas a votar. <br /><br />Explica claramente qué significa llegar a un acuerdo. Por ejemplo: «Para aprobar esta propuesta, todas las personas deben votar De acuerdo» o «Para aprobar esta propuesta, el 75 % de los miembros deben votar De acuerdo». <br /><br />Pide a las personas participantes que indiquen una «Razón» al votar. Si no están de acuerdo, pídeles que expliquen por qué y qué tendría que cambiar para que pudieran estarlo. <br /><br />Algunas organizaciones también utilizan la opción de voto Bloquear (o veto). <br /><br />Mientras avanza la votación, responde a los comentarios, publica actualizaciones, cierra la propuesta antes de tiempo o deja que llegue a su fecha de cierre. <br /><br />Las personas participantes pueden *«cambiar su voto»* hasta que se cierre la propuesta, por ejemplo, si aparece nueva información durante la votación. |
      | **Conclusión** <br /><br />Indica si se llegó a un acuerdo y cuál fue la decisión. <br /><br />Pon en práctica la decisión y planifica las acciones necesarias. | Examina los resultados de la votación y comunica la decisión. <br /><br />Resume los resultados del proceso y explica qué sucederá después. <br /><br />Si los resultados no son concluyentes, puedes reabrir la discusión e iniciar una nueva propuesta. <br /><br />La conclusión deja constancia de la decisión para futuras consultas. |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
