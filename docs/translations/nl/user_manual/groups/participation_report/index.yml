  0431c9fc46658338:
    english: 'The group participation report gives insights into the usage of your Loomio group. '
    translation: Het participatierapport laat zien hoe jouw Loomio-groep wordt gebruikt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0d23c0831f1ea6ca:
    english: 'You''re able to choose which groups to include in the report, the start and end date for the report, and the interval (year, month, week or day) for grouping results. '
    translation: Je kunt kiezen welke groepen je opneemt, wat de begin- en einddatum zijn en of je de resultaten per jaar, maand, week of dag groepeert.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  73c9822c08a37866:
    english: The report is available to everyone in your group, however users can only see results for groups that they belong to, this means that different users may see slightly different reports.
    translation: Iedereen in je groep kan het rapport bekijken. Je ziet alleen resultaten van groepen waarvan je lid bent. Daardoor kan het rapport er voor verschillende mensen iets anders uitzien.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c9402b4720639f86:
    english: 'You can find the report by clicking the group settings menu cog, as shown below. '
    translation: Je vindt het rapport via het tandwiel van het menu met groepsinstellingen, zoals hieronder te zien is.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a8f7425ca00b558b:
    english: "![Participation report action in the Oatmilk Cooperative menu](group_participation_report.png)"
    translation: "![Optie voor het participatierapport in het menu van Oatmilk Cooperative](group_participation_report.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  90b9c89c6933eeee:
    english: "## What's in the report?"
    translation: "## Wat staat er in het rapport?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  06aabe2c1d6cd716:
    english: "### Actions per month"
    translation: "### Acties per maand"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6772e16cee705fc1:
    english: 'Understand how much participation happens in your group over a given period of time. '
    translation: Bekijk hoeveel mensen in een bepaalde periode aan je groep hebben bijgedragen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fe690a715f8a00b5:
    english: The report shows how many threads, comments, polls, votes and reactions have happened per month. This is graphed so you can see ebbs and flows of usage.
    translation: Het rapport toont per maand het aantal threads, opmerkingen, polls, stemmen en reacties. De grafiek laat zien hoe de activiteit in de loop van de tijd verandert.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  21bf7cb257f4bb03:
    english: Click specific labels on the graph to remove them from view.
    translation: Klik op een label in de grafiek om de bijbehorende gegevens te verbergen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  35ced3d9d51038aa:
    english: Click specific headings in the table to sort the table by that column.
    translation: Klik op een kolomkop om de tabel op die kolom te sorteren.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9d511b052ae56765:
