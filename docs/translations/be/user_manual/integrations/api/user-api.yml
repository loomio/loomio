  fc4488304bf3735e:
    english: |-
      | Name | Description |
      | --- | --- |
      | `section` | Report section: `base`, `users`, or `countries`. Use `users` for per-person activity |
      | `group_scope` | `custom` or `my`. The legacy `all` value is treated as `my` because User API keys never receive instance-wide access |
      | `group_ids` | Comma-separated group IDs when `group_scope=custom`. IDs outside the API user's memberships are ignored |
      | `start_month` | First month to include in `YYYY-MM` format; defaults to 12 months ago |
      | `end_month` | Last month to include in `YYYY-MM` format; defaults to the current month |
      | `interval` | Interval for the `base` section: `day`, `week`, `month`, or `year` |
      | `member_type` | Set to `delegate` with `section=users` to return only current delegates |
    translation: |-
      | Назва | Апісанне |
      | --- | --- |
      | `section` | Раздзел справаздачы: `base`, `users` або `countries`. Выкарыстоўвайце `users` для даных аб дзеяннях асобных людзей |
      | `group_scope` | `custom` або `my`. Устарэлае значэнне `all` разглядаецца як `my`, бо ключы API карыстальніка не даюць доступу да даных усяго асобніка Loomio |
      | `group_ids` | ID груп, падзеленыя коскамі, калі зададзена `group_scope=custom`. ID груп, у якіх карыстальнік з ключом API не мае членства, ігнаруюцца |
      | `start_month` | Першы месяц перыяду ў фармаце `YYYY-MM`; па змаўчанні — месяц 12 месяцаў таму |
      | `end_month` | Апошні месяц перыяду ў фармаце `YYYY-MM`; па змаўчанні — бягучы месяц |
      | `interval` | Інтэрвал для раздзела `base`: `day`, `week`, `month` або `year` |
      | `member_type` | Задайце `delegate` разам з `section=users`, каб атрымаць даныя толькі пра дзейных дэлегатаў |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '09b3d2247802eae7':
    english: A person is a delegate when they have an active delegate membership in any selected group. Their counts are aggregated across all selected groups. Delegate rows are returned even when every activity count is zero. Counts cover threads, comments, polls, votes, outcomes, and reactions; they are not voting participation rates. User rows also include identified ballots issued, cast, and missed. Anonymous polls are excluded from all per-person voting counts. `all_votes_cast` is true only when at least one ballot was issued and every issued ballot was cast.
    translation: Статус дэлегата маюць людзі з актыўным членствам у якасці дэлегата ў любой з выбраных груп. Іх паказчыкі сумуюцца па ўсіх выбраных групах. Радкі дэлегатаў вяртаюцца, нават калі ўсе паказчыкі актыўнасці роўныя нулю. Падлічваюцца тэмы, каментарыі, апытанні, галасы, высновы і рэакцыі; гэтыя паказчыкі не з'яўляюцца доляй удзелу ў галасаваннях. Радкі карыстальнікаў таксама ўключаюць колькасць выдадзеных бюлетэняў для паіменнага галасавання, пададзеных галасоў і бюлетэняў без пададзенага голасу. Ананімныя апытанні не ўключаюцца ў паказчыкі галасавання асобных людзей. `all_votes_cast` мае значэнне true, толькі калі быў выдадзены хаця б адзін бюлетэнь і па кожным выдадзеным бюлетэні быў пададзены голас.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  be9b5cd02a9b5930:
    english: The API applies the same group visibility rules as the in-product report. A user API key cannot expose report data from groups that user cannot access.
    translation: API прымяняе тыя ж правілы бачнасці груп, што і справаздача ў Loomio. Ключ API карыстальніка не дае доступу да даных справаздачы па групах, да якіх гэты карыстальнік не мае доступу.
