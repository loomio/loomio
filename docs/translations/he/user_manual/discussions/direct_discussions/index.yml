  5a0b9426a2d88e62:
    english: |-
      ## Contacting someone via a direct discussion
      A direct discussion can be used to contact one or more people privately without creating a subgroup.
    translation: |-
      ## יצירת קשר באמצעות דיון ישיר
      ניתן להשתמש בדיון ישיר כדי ליצור קשר באופן פרטי עם אדם אחד או יותר, בלי ליצור תת־קבוצה.
