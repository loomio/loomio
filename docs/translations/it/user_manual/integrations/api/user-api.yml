  12167a132cbc9ba9:
    english: Send a list of emails. It will invite all the new email addresses to the group. Unlike listing memberships, this operation requires group-administrator permission.
    translation: Invia un elenco di indirizzi email. I nuovi indirizzi riceveranno un invito a unirsi al gruppo. A differenza dell'elenco delle iscrizioni, questa operazione richiede i permessi di amministratore del gruppo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  472725f6bacb0edc:
    english: "`POST /api/b2/memberships`"
    translation: "`POST /api/b2/memberships`"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  528fc95bb1a3c505:
    english: |-
      | Name | Description |
      | --- | --- |
      | `group_id` | Integer, required. ID of the group whose memberships will be managed |
      | `emails` | Array of strings, required. Email addresses of people to invite into the group |
      | `remove_absent` | Boolean. If true, remove anyone from the group whose email is not present in the list |
    translation: |-
      | Nome | Descrizione |
      | --- | --- |
      | `group_id` | Numero intero obbligatorio. ID del gruppo di cui gestire le iscrizioni |
      | `emails` | Array di stringhe obbligatorio. Indirizzi email delle persone da invitare nel gruppo |
      | `remove_absent` | Valore booleano. Se true, rimuove dal gruppo tutte le persone il cui indirizzo email non è presente nell'elenco |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  444860e8996924f4:
    english: If you pass `remove_absent=1`, any members of the group who were not included in the list will be removed from the group. Be careful, you could remove everyone in your group.
    translation: 'Se passi `remove_absent=1`, tutti i membri del gruppo non inclusi nell''elenco saranno rimossi. Fai attenzione: potresti rimuovere tutti i membri del tuo gruppo.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6cdfb31270df0fc9:
    english: 'This returns an object with `{added_emails: ["person@added.com"], removed_emails: ["person@removed.com"]}`.'
    translation: 'La risposta è un oggetto con `{added_emails: ["person@added.com"], removed_emails: ["person@removed.com"]}`.'
