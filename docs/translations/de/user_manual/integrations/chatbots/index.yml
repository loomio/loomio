  195fe68dbcc6418f:
    english: Loomio can send notifications to your chatroom.
    translation: Loomio kann Benachrichtigungen an deinen Chatraum senden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bf886ec0d398e8d7:
    english: Chat tools and Loomio work well together. Use chat for quick conversation and timely updates. Move important topics to Loomio when people need time to participate, when a decision must be made, or when the group will need a lasting record.
    translation: Chat-Dienste und Loomio ergänzen sich gut. Nutze den Chat für kurze Gespräche und zeitnahe Updates. Verlege wichtige Themen nach Loomio, wenn Menschen Zeit zum Mitmachen brauchen, eine Entscheidung ansteht oder die Gruppe eine dauerhafte Dokumentation benötigt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  db7d26a18ddc651d:
    english: Loomio supports Slack, Discord, Microsoft Teams, Matrix and Mattermost.
    translation: Loomio unterstützt Slack, Discord, Microsoft Teams, Matrix und Mattermost.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  765fc0d609a0db99:
    english: You can send notifications to your chatroom any time you like, just the same way you would invite individual people to vote, or to join a thread.
    translation: Du kannst jederzeit Benachrichtigungen an deinen Chatraum senden, genauso wie du einzelne Personen zur Abstimmung oder zu einer Diskussion einladen kannst.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a89717f4f41f3212:
    english: You can also configure notifications to always happen when a specific event happens, like someone starting a thread.
    translation: Du kannst Benachrichtigungen auch so einrichten, dass sie bei bestimmten Ereignissen automatisch gesendet werden, etwa wenn jemand eine Diskussion beginnt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
