  '09907f3ec328e9d2':
    english: "## Applying the Consent process on Loomio"
    translation: "## Cómo aplicar el proceso de consentimiento en Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d7c91a6160b45cf:
    english: |-
      | **Consent process** | **On Loomio** |
      |---|---|
      | You notice a problem or opportunity and take the initiative. |  |
      | **Present a proposal** <br /><br />Write a clear and concise proposal and share it with people impacted. Describe it in a way so that others will understand what you are proposing. | Start a Loomio **discussion**. <br /><br />Name the proposal in the discussion title, and describe it in the context. |
      | **Questions** (Optional) <br /><br />Invite clarifying questions to help people understand the proposal. <br /><br />*“A clarifying question round helps make sure everyone understands the proposal before they say what they think about it.”* | Run a **Question round**. If it is hidden, a group administrator can make it available from [Poll templates](/en/user_manual/polls/poll_templates/). <br /><br />Ask “what do you need to know so you understand the proposal?” |
      | **Reactions** <br /><br />Invite people to offer reactions and comments to improve the proposal. <br /><br />This is a sensing and responding round - *to actively sense and interpret information from the group and then respond or adapt accordingly.* | Run a **[Sense check](/en/user_manual/polls/proposals/sense_check/)** proposal. <br /><br />*In the title:* Name the proposal and say this is an opportunity to react and comment. <br /><br />*In the proposal details:* Clearly frame the proposal and say why it is important.  Include any background information necessary and a link to the current proposal version.  <br /><br />Invite everyone to respond, and to do so before the proposal closes.  |
      | **Amendment** <br /><br />Consider comments and suggestions from people and amend the proposal as appropriate for the good of your organization. <br /><br />Consider any amendments you want to make for the new proposal version. | Reply to comments and suggestions raised in the Sense check proposal. <br /><br />State an **outcome** to summarize the results of the proposal.  <br /><br />Note any concerns or new information discovered, and outline how the proposal will be amended. <br /><br />Say what will happen next and notify people about the outcome. |
      | **Objections** <br /><br />Present the amended proposal version and invite people to state valid objections - objections that might cause harm. <br /><br />Respond to and integrate each objection by amending the proposal. | Run a **[Consent proposal](/en/user_manual/polls/proposals/consent/)** with the amended proposal. <br /><br />*In the title:* Name the decision to be made. <br /><br />*In the proposal details:* Present the proposal and invite people to vote consent or to state a valid objection - an objection that might cause harm.  Remember we are seeking consent that the proposal is 'safe to try'. <br /><br />Respond to and integrate each objection, creating an amended version of the proposal. <br /><br />Notify everyone that there has been a further amendment, and invite them to reconsider their Consent and “change your vote”. <br /><br />Or run successive Consent proposals as necessary until objections are resolved. |
      | **Outcome** <br /><br />When there are no remaining objections and everyone has consented, the result of the decision is announced. | State an **outcome**. <br /><br />Close the proposal. State an outcome and notify everyone involved. <br /><br />State the decision made and thank people for participation in the process. <br /><br />Summarize results of the process and say what will happen next. <br /><br />If no valid objections remain, state that there is consent the proposal is 'safe to try'. <br /><br />The outcome statement is an important record of the decision for future reference. |
    translation: |-
      | **Proceso de consentimiento** | **En Loomio** |
      |---|---|
      | Detectas un problema o una oportunidad y tomas la iniciativa. |  |
      | **Presenta una propuesta** <br /><br />Escribe una propuesta clara y concisa y compártela con las personas afectadas. Explica lo que propones de forma que puedan entenderlo. | Inicia una **discusión** en Loomio. <br /><br />Ponle a la discusión un título que identifique la propuesta y descríbela en el contexto. |
      | **Preguntas** (opcional) <br /><br />Invita a hacer preguntas aclaratorias para ayudar a las personas a entender la propuesta. <br /><br />*«Una ronda de preguntas aclaratorias ayuda a que todas las personas entiendan la propuesta antes de expresar su opinión».* | Inicia una **ronda de preguntas**. Si está oculta, un administrador del grupo puede habilitarla en [Plantillas de sondeos](/en/user_manual/polls/poll_templates/). <br /><br />Pregunta: «¿Qué necesitas saber para entender la propuesta?». |
      | **Reacciones** <br /><br />Invita a las personas a compartir reacciones y comentarios para mejorar la propuesta. <br /><br />Esta ronda sirve para escuchar y responder: *recoger e interpretar activamente la información del grupo y adaptar la propuesta según corresponda.* | Inicia una propuesta de **[consulta](/en/user_manual/polls/proposals/sense_check/)**. <br /><br />*En el título:* Identifica la propuesta e indica que esta es una oportunidad para reaccionar y comentar. <br /><br />*En los detalles de la propuesta:* Explica claramente la propuesta y por qué es importante. Incluye los antecedentes necesarios y un enlace a la versión actual de la propuesta. <br /><br />Invita a todas las personas a responder antes de que se cierre la propuesta. |
      | **Modificación** <br /><br />Considera los comentarios y sugerencias de las personas y modifica la propuesta según convenga a tu organización. <br /><br />Decide qué cambios quieres incluir en la nueva versión de la propuesta. | Responde a los comentarios y sugerencias de la propuesta de consulta. <br /><br />Comunica una **conclusión** que resuma lo ocurrido con la propuesta. <br /><br />Anota las preocupaciones o la información nueva y explica cómo modificarás la propuesta. <br /><br />Indica qué sucederá después y notifica la conclusión a las personas. |
      | **Objeciones** <br /><br />Presenta la versión modificada e invita a plantear objeciones válidas: aquellas que señalan un posible daño. <br /><br />Responde a cada objeción e intégrala mediante cambios en la propuesta. | Inicia una **[propuesta de consentimiento](/en/user_manual/polls/proposals/consent/)** con la versión modificada. <br /><br />*En el título:* Identifica la decisión que hay que tomar. <br /><br />*En los detalles de la propuesta:* Presenta la propuesta e invita a votar a favor del consentimiento o a plantear una objeción válida que señale un posible daño. Recuerda que se busca el consentimiento para considerar la propuesta «segura para probar». <br /><br />Responde a cada objeción e intégrala en una nueva versión de la propuesta. <br /><br />Notifica a todas las personas que la propuesta se ha modificado de nuevo e invítalas a reconsiderar su consentimiento y «cambiar tu voto». <br /><br />También puedes iniciar sucesivas propuestas de consentimiento hasta resolver las objeciones. |
      | **Conclusión** <br /><br />Cuando ya no quedan objeciones y todas las personas han dado su consentimiento, se anuncia la decisión. | Comunica una **conclusión**. <br /><br />Cierra la propuesta, comunica la conclusión y notifica a todas las personas participantes. <br /><br />Indica qué se ha decidido y agradece la participación. <br /><br />Resume lo ocurrido durante el proceso y explica qué sucederá después. <br /><br />Si no quedan objeciones válidas, indica que existe consentimiento para considerar la propuesta «segura para probar». <br /><br />La conclusión deja constancia de la decisión para futuras consultas. |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
