  b3a4dee73762bea4:
    english: "## Eligible voters and votes cast"
    translation: "## Électeurs éligibles et votes exprimés"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1d04d75fa16a2a18:
    english: The percentage can be based on either **Votes cast** or **Eligible voters**.
    translation: Le pourcentage peut être calculé à partir des **Votes exprimés** ou des **Électeurs éligibles**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  590e1a316f9ad174:
    english: "![Choosing whether a vote share requirement uses votes cast or eligible voters](./eligible-vs-cast.png)"
    translation: "![Choix entre les votes exprimés et les électeurs éligibles pour calculer l’exigence de répartition des votes](./eligible-vs-cast.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d4c72d50982e071d:
    english: "**Eligible voters** means everyone who is able to vote in the proposal. **Votes cast** means only the votes that have been submitted."
    translation: Les **Électeurs éligibles** sont toutes les personnes qui peuvent voter sur la proposition. Les **Votes exprimés** sont uniquement les votes soumis.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  24945a1a4f0d08e3:
    english: A requirement of 75 percent agreement from eligible voters can pass only when at least 75 percent of all eligible voters vote for that option.
    translation: Une exigence de soutien de 75 % des électeurs éligibles ne peut être satisfaite que si au moins 75 % de ces personnes votent pour l’option.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  14e4ff7cd000c7af:
    english: A requirement of 60 percent agreement from votes cast can pass when 60 percent of submitted votes support the option, regardless of overall turnout. Add a quorum when your process also requires a minimum level of participation.
    translation: Une exigence de soutien de 60 % des votes exprimés peut être satisfaite si 60 % des votes soumis soutiennent l’option, quel que soit le taux de participation. Ajoutez un quorum si votre processus exige aussi une participation minimale.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a8f235434b40ecd9:
    english: "## Different vote share requirements"
    translation: "## Différentes exigences de répartition des votes"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6682c9656815bdbc:
    english: 'A proposal can have requirements on more than one option. For example:'
    translation: 'Une proposition peut comporter des exigences pour plusieurs options. Par exemple :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dac1980305bef52d:
    english: |-
      - Agreement must be at least 75 percent of eligible voters
      - Abstention must be no more than 30 percent of votes cast
      - Block must be no more than 0 percent of votes cast
    translation: |-
      - L’accord doit atteindre au moins 75 % des électeurs éligibles
      - L’abstention ne doit pas dépasser 30 % des votes exprimés
      - L’opposition ne doit pas dépasser 0 % des votes exprimés
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  11325e607f603eb7:
    english: You can also add requirements to a [poll template](/en/user_manual/polls/poll_templates/) so that new proposals created from the template use them by default.
    translation: Vous pouvez aussi ajouter des exigences à un [modèle de sondage](/en/user_manual/polls/poll_templates/). Elles s’appliqueront par défaut aux nouvelles propositions créées à partir de ce modèle.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
