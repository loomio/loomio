---
navigation_title: Inviter des personnes
blocks:
  47820acef0cf3fe9:
    english: "# Inviting people"
    translation: "# Inviter des personnes"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6a2bc749ec2883c0:
    english: Go to your group page and click the **Members** tab to access member management.
    translation: Accédez à la page de votre groupe et cliquez sur l’onglet **Membres** pour gérer les membres.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7fc9a792512e50bb:
    english: You can **Invite** particular people to your group with their email address or **Share** a link to your group via email, newsletter, chat or from your website.
    translation: Vous pouvez **Inviter** des personnes dans votre groupe à l’aide de leur adresse e-mail ou **Partager** un lien vers votre groupe par e-mail, dans une lettre d’information, dans une messagerie ou sur votre site web.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3fc7875402babd63:
    english: "## Send invitations via email"
    translation: "## Envoyer des invitations par e-mail"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4e91c3f036e94808:
    english: Click **Invite** on the **Members** tab to send an email containing a single-use invitation link. The recipient can create a Loomio user account and join your group.
    translation: Dans l’onglet **Membres**, cliquez sur **Inviter** pour envoyer un e-mail contenant un lien d’invitation à usage unique. La personne invitée peut créer un compte Loomio et rejoindre votre groupe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  37a98960a11df300:
    english: If the recipient already has a Loomio user account they can still accept the invitation to join your group with their existing account.
    translation: Si la personne invitée possède déjà un compte Loomio, elle peut accepter l’invitation avec ce compte.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c40b8865bc90ab0b:
    english: "### Invite many at once"
    translation: "### Inviter plusieurs personnes à la fois"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f92bf789ad23e4c3:
    english: You can send invitations by email to up to 100 people at a time by entering (or copy/pasting) multiple email addresses into the "Who would you like to invite" box. Separate email addresses by comma or space.
    translation: Vous pouvez inviter jusqu’à 100 personnes à la fois par e-mail. Saisissez ou collez plusieurs adresses e-mail dans le champ « Qui souhaitez-vous inviter ? ». Séparez les adresses par une virgule ou un espace.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1e8ea8567d051081:
    english: When inviting people to a group within an organization, the parent group and related subgroups you belong to appear as audience suggestions. Select a group, then select its chip to expand the audience into individual people. You can remove anyone you do not want to invite before sending the invitations. People who already belong to the destination group are excluded.
    translation: Lorsque vous invitez des personnes dans un groupe au sein d’une organisation, le groupe parent et les sous-groupes associés dont vous êtes membre apparaissent comme suggestions de destinataires. Sélectionnez un groupe, puis cliquez sur son étiquette pour afficher les personnes qu’il contient. Vous pouvez retirer des personnes avant d’envoyer les invitations. Les personnes déjà membres du groupe de destination sont exclues.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  23c96c665ed9ad1c:
    english: |-
      >[!Tip]
      >Copy email addresses from a column in a Google or Excel spreadsheet, and paste into the invitation box.
    translation: |-
      >[!Tip]
      >Copiez les adresses e-mail d’une colonne d’une feuille de calcul Google ou Excel, puis collez-les dans le champ d’invitation.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  697177b4211a5479:
    english: When you click **Invite** an email will be sent to each of the email addresses you supplied, containing a unique invitation link that can only be used once. This email will be sent in your current language.
    translation: Lorsque vous cliquez sur **Inviter**, chaque adresse e-mail indiquée reçoit un message contenant un lien d’invitation unique, utilisable une seule fois. Ce message est envoyé dans votre langue actuelle.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bcce66d3fb6f6b8e:
    english: "### Invite people to Subgroups"
    translation: "### Inviter des personnes dans des sous-groupes"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e422dfc71ef2fe0:
    english: Following the same process as above, you can invite people to a 'parent' group, and one or more subgroups simultaneously when you invite them with the **Invite people** button. Tick the boxes next to the subgroups you want them to immediately be a part of when they join the group.
    translation: Avec le bouton **Inviter des personnes**, vous pouvez suivre la même procédure pour inviter simultanément des personnes dans un groupe parent et dans un ou plusieurs sous-groupes. Cochez les cases des sous-groupes qu’elles doivent rejoindre dès leur arrivée dans le groupe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  87f0b0c3281b6228:
    english: "## Share a link to your group"
    translation: "## Partager un lien vers votre groupe"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2f014bdf9b719ec0:
    english: You can share a link to your group with the **Share** button. This is useful if you want to send a link via email, newsletter, chat or post on your website.
    translation: Le bouton **Partager** vous permet de partager un lien vers votre groupe par e-mail, dans une lettre d’information, dans une messagerie ou sur votre site web.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  18ff20426c02846e:
    english: Click on the "copy" icon to copy the link to your clipboard, then paste in your email, newsletter or chat channel.
    translation: Cliquez sur l’icône « copier » pour copier le lien dans votre presse-papiers, puis collez-le dans un e-mail, une lettre d’information ou une messagerie.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c6506b3c529f683c:
    english: If you want to stop people from joining via this link, click "Reset this link". The existing link will no longer work and a new link will be created.
    translation: Pour empêcher les personnes de rejoindre le groupe au moyen de ce lien, cliquez sur « Réinitialiser ce lien ». Le lien actuel cessera de fonctionner et un nouveau lien sera créé.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6d57daddf1df6a2d:
    english: "## Request to join group"
    translation: "## Demander à rejoindre un groupe"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  70b9af34b3bc2a9e:
    english: People can request to join an Open or Closed group. Share the group URL, such as `https://www.loomio.com/group-name`. When people arrive at the group page, they can see the public group information and select **Join group** to answer the joining prompt and send their request.
    translation: Les personnes peuvent demander à rejoindre un groupe ouvert ou fermé. Partagez l’URL du groupe, par exemple `https://www.loomio.com/group-name`. Sur la page du groupe, elles peuvent consulter les informations publiques, puis sélectionner **Rejoindre le groupe** pour répondre à la question d’accueil et envoyer leur demande.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a5534ae2aba161ba:
    english: The joining prompt gives people a chance to introduce themselves and explain why they want to join.
    translation: La question d’accueil permet aux personnes de se présenter et d’expliquer pourquoi elles souhaitent rejoindre le groupe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bb13bbdbfd6da80b:
    english: Under [Group privacy](/en/user_manual/groups/settings/privacy#how-people-join), choose **Request approval** to require requests to be reviewed. You can also customize the joining prompt in the group settings.
    translation: Dans les paramètres de [confidentialité du groupe](/en/user_manual/groups/settings/privacy#how-people-join), choisissez **Demander une approbation** pour que les demandes soient examinées. Vous pouvez également personnaliser la question d’accueil dans les paramètres du groupe.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5b0e7c47a0518a3e:
    english: "### Review membership requests"
    translation: "### Examiner les demandes d’adhésion"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d4a03352457d41cb:
    english: 'Group administrators and members with permission to add members review requests from the **Membership requests** section of the **Members** tab. A reviewer can:'
    translation: 'Les administrateurs du groupe et les membres autorisés à ajouter des membres examinent les demandes dans la section **Demandes d’ajout** de l’onglet **Membres**. Ils peuvent :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  84c6d641f9dba801:
    english: |-
      - **Approve** the request to add the applicant as a member and notify them.
      - **Ignore** the request to close it without notifying the applicant or allowing another request.
      - **Decline** the request with a message explaining the decision. Loomio sends the message to the applicant by email and notification, and they can submit a new request.
    translation: |-
      - **Approuver** la demande pour ajouter la personne au groupe et l’en informer.
      - **Ignorer** la demande pour la clore sans en informer la personne ni lui permettre d’en soumettre une autre.
      - **Refuser** la demande en expliquant la décision dans un message. Loomio envoie ce message à la personne par e-mail et par notification. Elle peut ensuite soumettre une nouvelle demande.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b1de5132fa942ba8:
    english: Select the decline button to write a message or ignore the request.
    translation: Sélectionnez le bouton de refus pour rédiger un message, ou ignorez la demande.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a87e3fdd4ce43ee9:
    english: "## Managing invitations"
    translation: "## Gérer les invitations"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  84dc2f66c60f3237:
    english: To manage invitations, open the filter/ drop down from the Members tab of your Group page and select **Invitations**. You can manage individual invitations by clicking the three dot menu (**⋮**) to the right of the member.
    translation: Pour gérer les invitations, ouvrez le menu de filtrage dans l’onglet Membres de la page de votre groupe, puis sélectionnez **Invitations**. Pour gérer une invitation, cliquez sur le menu à trois points (**⋮**) à droite de la personne invitée.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c8d12991b8edb22f:
    english: You can also make people administrators or set their title (e.g. "IT Support") within the group before they accept their invitation.
    translation: Vous pouvez également attribuer aux personnes invitées le rôle d’administrateur ou un titre dans le groupe, par exemple « Assistance informatique », avant qu’elles acceptent leur invitation.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e8aec784f84451cc:
    english: "### Re-send invitations"
    translation: "### Renvoyer des invitations"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1c201c2b360b1877:
    english: Follow up on people who don't make it into the group and give them a nudge. If someone has lost or forgotten about their invitation email, you can re-send it from the dropdown menu beside their name on the Members page.
    translation: Si une personne n’a pas rejoint le groupe parce qu’elle a perdu ou oublié son e-mail d’invitation, vous pouvez lui renvoyer l’invitation depuis le menu situé à côté de son nom sur la page des membres.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8b4674400f9a3f09:
    english: Click on the three dots (**⋮**) next to the person you want to resend the invitation to, and then choose **Resend invitation**.
    translation: Cliquez sur les trois points (**⋮**) à côté de la personne concernée, puis choisissez **Renvoyer l'invitation**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  abc5a934440fb8e1:
    english: |-
      ### Cancelling invitations
      If you entered the wrong email address, or have changed your mind about inviting someone, you can cancel an invitation from the Members tab on your Group page. Select **Cancel Invitation** from the drop down menu to the right of the member invitation (**⋮**).
    translation: |-
      ### Annuler des invitations
      Si vous avez saisi une mauvaise adresse e-mail ou ne souhaitez plus inviter quelqu’un, vous pouvez annuler l’invitation depuis l’onglet Membres de la page de votre groupe. Sélectionnez **Annuler l’invitation** dans le menu déroulant à droite de l’invitation (**⋮**).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
