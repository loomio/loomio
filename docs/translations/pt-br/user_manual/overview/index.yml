  ced10eda436a40ca:
    english: "## How people use Loomio"
    translation: "## Como as pessoas usam o Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4198817a2724ad0a:
    english: "**Member organizations** to involve members in decisions at scale. Political parties, consumer and worker co-operatives, and membership associations use Loomio to facilitate a safe, inclusive space for members to share information and raise topics, participate in important decisions and vote in General Assembly. Streamline decision processes, improve transparency and accountability, document discussions and record decisions, and include members' voices to organize for action."
    translation: "**Organizações de membros** usam o Loomio para envolver seus membros em decisões de grande escala. Partidos políticos, cooperativas de consumo e de trabalho e associações usam o Loomio para oferecer um espaço seguro e inclusivo. Nele, os membros compartilham informações, levantam assuntos, participam de decisões importantes e votam em assembleias gerais. As organizações podem organizar seus processos de decisão, aumentar a transparência e a prestação de contas, documentar discussões e decisões e incluir as vozes dos membros na organização de ações."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7b2fd1306e05f4e3:
    english: "**Self-managing organizations** to involve staff in decisions. Self-managing teams, worker co-operatives, and sociocratic organisations use Loomio to run consent, consensus, and advice-based decision processes across distributed teams and time zones. Tap into collective intelligence, distribute decision making, build governance and policy together, and document decisions and discussion."
    translation: "**Organizações autogeridas** usam o Loomio para envolver suas equipes nas decisões. Equipes autogeridas, cooperativas de trabalho e organizações sociocráticas usam o Loomio para conduzir processos de decisão por consentimento, consenso e aconselhamento, mesmo quando trabalham em lugares e fusos horários diferentes. Elas podem reunir o conhecimento coletivo, distribuir a tomada de decisões, construir juntas suas formas de governança e suas políticas e documentar decisões e discussões."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  75d7266c562f65c2:
    english: "**Boards, councils, and distributed networks** to involve stakeholders in decisions. Create a safe space for discussion, keep track of communications, and coordinate across geographies and time zones. Structure decision making processes, improve agility and response times, and preserve organizational memory."
    translation: "**Conselhos e redes distribuídas** usam o Loomio para envolver as partes interessadas nas decisões. Eles podem criar um espaço seguro para discussão, acompanhar as comunicações e coordenar o trabalho entre lugares e fusos horários diferentes. Também podem estruturar os processos de decisão, responder mais rapidamente e preservar a memória da organização."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cbe5ae77738f2704:
    english: "**Residential communities and co-ops** to make decisions together as neighbours. Cohousing communities, ecovillages, coliving cooperatives, housing co-ops, and land trusts use Loomio to replace or augment traditional strata and property management with democratic governance. Residents shape decisions about shared land, common spaces, and community agreements, and asynchronous discussion means members can fully participate whether they're on-site or away travelling, keeping a clear record of how the community has chosen to live together."
    translation: "**Comunidades residenciais e cooperativas** usam o Loomio para tomar decisões entre vizinhos. Comunidades de moradia compartilhada, ecovilas, cooperativas de habitação e organizações comunitárias de gestão de terras usam o Loomio para substituir ou complementar a administração tradicional de condomínios e imóveis com uma governança democrática. Os moradores participam das decisões sobre terrenos compartilhados, espaços comuns e acordos da comunidade. Como as discussões podem ocorrer em momentos diferentes, os membros conseguem participar tanto quando estão no local quanto quando estão viajando. Assim, fica registrado como a comunidade decidiu viver em conjunto."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb1039083c952286:
    english: Loomio builds a living record of your organization; the decisions made, who was involved and the discussion leading up to the decision.
    translation: 'O Loomio cria um registro contínuo da sua organização: as decisões tomadas, quem participou delas e as discussões que levaram a cada decisão.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
