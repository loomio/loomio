  7d416ad780b3ca85:
    english: Turn on **Delegates only** to show people who are currently delegates in any of the selected groups. Their activity and voting record are aggregated across all selected groups, and delegates with no activity during the selected period remain in the table. The CSV download uses the same filter.
    translation: Ative **Apenas para delegados** para mostrar as pessoas que são delegadas em qualquer um dos grupos selecionados. A atividade e o registro de votação de cada delegado são somados entre os grupos selecionados. Delegados sem atividade no período também aparecem na tabela. O arquivo CSV usa o mesmo filtro.
    status: machine
    provider: codex/gpt-6-sol
