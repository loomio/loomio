navigation_title: Een groep starten
blocks:
  e8632dbb628c7c7d:
    english: "# Starting a new group"
    translation: "# Een nieuwe groep starten"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2a4a6907d4e2049d:
    english: If you are new to Loomio, you can start a group on a free trial at any time from the [Loomio website](https://www.loomio.com/). If you already use Loomio and would like to start a new group for another organization or purpose, you can do this from the sidebar menu - click on **New group**.
    translation: Als je nieuw bent bij Loomio, kun je via de [Loomio-website](https://www.loomio.com/) op elk moment een groep starten met een gratis proefperiode. Gebruik je Loomio al en wil je een nieuwe groep starten voor een andere organisatie of een ander doel? Klik dan in het zijmenu op **Nieuwe groep**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  10e8756c96038e58:
    english: For many organizations, a single Loomio group is sufficient. You can start as many subgroups as you need within the group. See [Subgroups](/en/user_manual/groups/subgroups/) for more info.
    translation: Voor veel organisaties is één Loomio-groep voldoende. Binnen die groep kun je zoveel subgroepen starten als je nodig hebt. Lees meer bij [Subgroepen](/en/user_manual/groups/subgroups/).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ed00dbe94cd53435:
    english: "## Group details"
    translation: "## Groepsgegevens"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0bb201e3a09fe99d:
    english: "### Group name"
    translation: "### Groepsnaam"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '019cdfc169ea858a':
    english: Type your group name. It's best to keep your group name short and concise.
    translation: Vul de naam van je groep in. Houd de naam kort en duidelijk.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6ae6b08ae7fbe257:
    english: "### Group handle"
    translation: "### Gebruikersnaam van de groep"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b054d0f760888add:
    english: Your group is automatically assigned a handle. The handle is used in the group's URL and email address, such as **loomio.com/your-group-handle** and **your-group-handle@loomio.com**.
    translation: Je groep krijgt automatisch een gebruikersnaam. Die wordt gebruikt in de URL en het e-mailadres van de groep, zoals **loomio.com/your-group-handle** en **your-group-handle@loomio.com**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1dee654ba628ba95:
    english: You can edit the handle when you create the group and change it later in group settings. When you change it, links and email addresses that use the old handle continue to work. Loomio keeps up to three old handles; after that, the oldest handle expires.
    translation: Je kunt de gebruikersnaam aanpassen wanneer je de groep aanmaakt en later wijzigen in de groepsinstellingen. Als je de naam wijzigt, blijven links en e-mailadressen met de oude naam werken. Loomio bewaart maximaal drie oude gebruikersnamen. Daarna vervalt de oudste.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '08496ed70144fc4d':
    english: "### Group description"
    translation: "### Groepsbeschrijving"
    status: machine
