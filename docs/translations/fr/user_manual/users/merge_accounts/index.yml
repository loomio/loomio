---
navigation_title: Fusionner les comptes
blocks:
  e3a50952a2ce6cfc:
    english: "# Merge accounts"
    translation: "# Fusionner les comptes"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e0bdfaac5741d310:
    english: Merge two Loomio accounts when each account uses a different email address and you want to continue with one account.
    translation: Fusionnez deux comptes Loomio associés à des adresses e-mail différentes pour continuer à utiliser un seul compte.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '08d4fcba2e0a2b3b':
    english: 'Before you begin, decide which account you want to keep:'
    translation: 'Avant de commencer, choisissez le compte que vous souhaitez conserver :'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6f7efc1ebdc680c7:
    english: |-
      - The **account to keep** is the account whose email address and profile you will use after the merge
      - The **account to retire** is the account you sign in to first. Its email address will no longer work for signing in after the merge
    translation: |-
      - Le **compte à conserver** est celui dont vous utiliserez l’adresse e-mail et le profil après la fusion
      - Le **compte à supprimer** est celui auquel vous vous connectez en premier. Après la fusion, son adresse e-mail ne permettra plus de vous connecter
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  060fb4b1c12c153a:
    english: You need access to both accounts and to the email address of the account you want to keep.
    translation: Vous devez avoir accès aux deux comptes et à l’adresse e-mail du compte que vous souhaitez conserver.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9c9a7e082a3b67ae:
    english: |-
      > [!WARNING]
      > Merging accounts is irreversible. Check the source and target email addresses carefully before the final confirmation.
    translation: |-
      > [!WARNING]
      > La fusion des comptes est irréversible. Vérifiez attentivement les adresses e-mail des deux comptes avant la confirmation finale.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4d6defccb0f2a2ec:
    english: "## Start the merge"
    translation: "## Commencer la fusion"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0c49f5d2284571d3:
    english: |-
      1. Sign in to the **account you want to retire**.
      2. Open the sidebar, select your name, and select **Edit profile**.
      3. Select **Merge accounts**.
    translation: |-
      1. Connectez-vous au **compte que vous souhaitez supprimer**.
      2. Ouvrez la barre latérale, sélectionnez votre nom, puis **Modifier mon profil**.
      3. Sélectionnez **Fusionner les comptes**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a05689d18f3c3337:
    english: "![The profile actions with Merge accounts highlighted](merge_accounts_profile.png)"
    translation: "![Les actions du profil, avec Fusionner les comptes mis en évidence](merge_accounts_profile.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  29656e0572127b88:
    english: 4. Enter the destination account's email address—the address belonging to the **account you want to keep**—and select **Send verification email**. Loomio always shows the same confirmation and signs you out. If an account uses that address, Loomio sends it the verification email.
    translation: 4. Saisissez l’adresse e-mail du compte de destination, celle du **compte que vous souhaitez conserver**, puis sélectionnez **Envoyer un e-mail de vérification**. Loomio affiche toujours le même message de confirmation et vous déconnecte. Si un compte utilise cette adresse, Loomio lui envoie l’e-mail de vérification.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d045b6c7e8a5b853:
    english: "## Verify the account you want to keep"
    translation: "## Vérifier le compte que vous souhaitez conserver"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  57255cdb29b384d7:
    english: 5. Open the verification email sent to the address of the account you want to keep and select **Verify email and proceed**.
    translation: 5. Ouvrez l’e-mail de vérification envoyé à l’adresse du compte que vous souhaitez conserver, puis sélectionnez **Vérifier ton courriel et continue**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5e496b2d8f551efa:
    english: "![The merge verification email with the Verify email and proceed button highlighted](merge_accounts_email.png)"
    translation: "![L’e-mail de vérification de la fusion, avec le bouton Vérifier ton courriel et continue mis en évidence](merge_accounts_email.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ad19dc0399f9d446:
    english: |-
      6. Sign in as the account you want to keep if Loomio asks you to sign in.
      7. On the **Confirm merge** page, check both email addresses again. Select **Merge accounts** to complete the merge.
    translation: |-
      6. Si Loomio vous le demande, connectez-vous au compte que vous souhaitez conserver.
      7. Sur la page **Confirmer la fusion**, vérifiez à nouveau les deux adresses e-mail. Sélectionnez **Fusionner les comptes** pour terminer la fusion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a575e2cd16aa66b4:
    english: "![The final confirmation page with the Merge accounts button highlighted](merge_accounts_confirm.png)"
    translation: "![La page de confirmation finale, avec le bouton Fusionner les comptes mis en évidence](merge_accounts_confirm.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cf8eba685cfdbf04:
    english: "## What happens after the merge"
    translation: "## Après la fusion"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6ae4c6c893430735:
    english: The account you keep remains your Loomio identity and sign-in account. Group memberships and activity from the retired account, including discussions, comments, polls, and votes, are reassigned to the account you keep. Where both accounts already belong to the same group, the existing membership for the account you keep remains.
    translation: Le compte que vous conservez reste votre identité Loomio et votre compte de connexion. Les adhésions aux groupes et les activités du compte supprimé, notamment les discussions, les commentaires, les sondages et les votes, sont transférées vers ce compte. Si les deux comptes appartiennent déjà au même groupe, l’adhésion du compte que vous conservez est maintenue.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  eb05b57367c0815c:
    english: The retired account is deleted and its email address can no longer be used to sign in. Loomio sends a confirmation email to the address of the account you kept when the merge is complete.
    translation: Le compte supprimé est effacé et son adresse e-mail ne permet plus de se connecter. Une fois la fusion terminée, Loomio envoie un e-mail de confirmation à l’adresse du compte conservé.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
