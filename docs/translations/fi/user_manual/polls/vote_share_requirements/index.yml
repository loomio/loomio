  2051086558658db2:
    english: Set a vote share requirement on an option when a proposal must receive a particular percentage of support, or remain below a particular percentage of opposition, to pass.
    translation: Aseta vaihtoehdolle ääniosuusvaatimus, kun ehdotuksen hyväksyminen edellyttää tiettyä kannatusprosenttia tai sitä, että vastustus jää tietyn prosenttiosuuden alle.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f00d3806d6b890ae:
    english: Vote share requirements can be combined with a [quorum](/en/user_manual/polls/quorum/) to require both sufficient participation and a particular distribution of votes.
    translation: Voit yhdistää ääniosuusvaatimuksen [päätösvaltaisuusvaatimukseen](/en/user_manual/polls/quorum/), jolloin ehdotuksen hyväksyminen edellyttää sekä riittävää osallistumista että tiettyä äänten jakautumista.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0fc0acd12134f67e:
