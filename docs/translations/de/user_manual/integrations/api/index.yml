  3be363e1618c6924:
    english: Use the Loomio API to connect Loomio with other software and automated workflows.
    translation: Verbinde Loomio über die API mit anderer Software und automatisierten Abläufen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3a0a3a45b68cea23:
    english: The [OpenAPI 3.1 contract](openapi.yaml) describes every public User API and Server API operation in a machine-readable format. Import it into an API client or use it to generate typed client code. The guides below explain workflows, permissions, and behavior that are not fully expressed by the contract.
    translation: Die [OpenAPI-3.1-Spezifikation](openapi.yaml) beschreibt alle öffentlichen Funktionen der Benutzer-API und der Server-API in einem maschinenlesbaren Format. Importiere sie in einen API-Client oder nutze sie, um typisierten Client-Code zu erzeugen. Die folgenden Anleitungen erklären Abläufe, Berechtigungen und Verhalten, die in der Spezifikation nicht vollständig beschrieben sind.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  19fe420b8b57b3a3:
    english: "## User API"
    translation: "## Benutzer-API"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e08b0799f5a9b271:
    english: The [User API](/en/user_manual/integrations/api/user-api) performs actions as a Loomio user. It can list groups and create or manage threads, comments, polls, and group memberships according to that user's permissions.
    translation: Mit der [Benutzer-API](/en/user_manual/integrations/api/user-api) kannst du Aktionen als Loomio-Nutzer ausführen. Abhängig von den Berechtigungen dieses Nutzers kannst du Gruppen auflisten sowie Diskussionen, Kommentare, Abstimmungen und Gruppenmitgliedschaften erstellen oder verwalten.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d212aebc3b500643:
    english: For push-based integrations, [group webhooks](/en/user_manual/integrations/api/user-api#webhooks) send selected Loomio events to a web endpoint as JSON. Use the REST endpoints to read or change Loomio data and a webhook when an integration should receive events without polling.
    translation: Für Integrationen mit automatischer Ereignisübermittlung senden [Gruppen-Webhooks](/en/user_manual/integrations/api/user-api#webhooks) ausgewählte Loomio-Ereignisse als JSON an einen Web-Endpunkt. Nutze die REST-Endpunkte, um Loomio-Daten zu lesen oder zu ändern. Mit einem Webhook kann deine Integration Ereignisse empfangen, ohne regelmäßig nach ihnen zu fragen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d6536c749fb8a984:
    english: "## Server API"
    translation: "## Server-API"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  76fbf0c8fa91eeb8:
    english: The [Server API](/en/user_manual/integrations/api/server-api) lets operators of self-hosted Loomio installations manage user accounts. It is authenticated with a server-wide secret.
    translation: Mit der [Server-API](/en/user_manual/integrations/api/server-api) können Betreiber selbst gehosteter Loomio-Installationen Benutzerkonten verwalten. Die Authentifizierung erfolgt über ein serverweites Geheimnis.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
