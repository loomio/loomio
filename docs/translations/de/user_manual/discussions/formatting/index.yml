    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2babc8a3fb1ee4b6:
    english: "## Embed videos and webpages"
    translation: "## Videos und Webseiten einbetten"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5bbdda88f99ea68d:
    english: You can embed supported videos and webpages anywhere there is a formatting toolbar.
    translation: Du kannst unterstützte Videos und Webseiten überall dort einbetten, wo es eine Formatierungsleiste gibt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2e7e0de5ed62913d:
    english: "To use the embed video feature: \n1. Copy the address of the video or webpage.\n2. Select **Embed video**, paste the address and select **Apply**."
    translation: "So bettest du ein Video oder eine Webseite ein: \n1. Kopiere die Adresse des Videos oder der Webseite.\n2. Wähle **Video einfügen**, füge die Adresse ein und wähle **Anwenden**."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  41dcefa30819a0ae:
    english: <iframe width="100%" height="380px" src="https://www.youtube-nocookie.com/embed/AJnjTd9u4zg" frameborder="0" allowfullscreen></iframe>
    translation: <iframe width="100%" height="380px" src="https://www.youtube-nocookie.com/embed/AJnjTd9u4zg" frameborder="0" allowfullscreen></iframe>
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  13808447963b2a92:
    english: |-
      >[!Tip]
      >Make sure the video can be accessed by everyone who can participate in the discussion. For example, an unlisted video may be suitable when it should not appear in public search results.
    translation: |-
      >[!Tip]
      >Stelle sicher, dass alle Personen, die an der Diskussion teilnehmen können, Zugriff auf das Video haben. Ein nicht gelistetes Video kann geeignet sein, wenn es nicht in öffentlichen Suchergebnissen erscheinen soll.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a54e9b54ec9d054a:
    english: "## Quote"
    translation: "## Zitat"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cde3af7721527f7f:
    english: Quote adds emphasis to your text, and can be useful to draw attention to an instruction.
    translation: Mit einem Zitat kannst du Text hervorheben und zum Beispiel auf eine Anweisung aufmerksam machen.
    status: machine
    provider: codex/gpt-6-sol
