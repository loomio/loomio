  67bc6cfdb2afad04:
    english: |-
      Only parent-group admins can rename, recolor, merge, or delete tags. These
      changes apply throughout the organization, including its subgroups.
    translation: |-
      Csak a szülőcsoport adminisztrátorai nevezhetik át, színezhetik át, egyesíthetik
      vagy törölhetik a címkéket. A változások az egész szervezetben, az alcsoportokban is érvényesek.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
