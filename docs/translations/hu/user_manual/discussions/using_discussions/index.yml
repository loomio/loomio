  '08ff4ccd500c2a69':
    english: The right sidebar contains actions for the whole thread. Some actions are also available from the three-dot menu (**⋯**) beside a thread on the group page.
    translation: A jobb oldalsávban az egész szálra vonatkozó műveleteket találod. Egyes műveletek a csoport oldalán, a szál melletti hárompontos menüben (**⋯**) is elérhetők.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e73701c7d36f95ef:
    english: The actions shown depend on your permissions. Group admins can manage threads, and group settings may allow members to perform some management actions. See [Group permissions](/en/user_manual/groups/settings/permissions).
    translation: 'Az elérhető műveletek a jogosultságaidtól függenek. A csoportadminisztrátorok kezelhetik a szálakat, és a csoport beállításai egyes kezelési műveleteket a tagoknak is engedélyezhetnek. Lásd: [Csoportjogosultságok](/en/user_manual/groups/settings/permissions).'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4fce317a163b0a40:
    english: "### Print"
    translation: "### Nyomtatás"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9317d4c7c5ef4764:
    english: Select **Print** to generate a page suitable for printing. Use your browser's print dialog to save it as a PDF.
    translation: Válaszd a **Nyomtatás** lehetőséget egy nyomtatásra alkalmas oldal létrehozásához. A böngésződ nyomtatási ablakában PDF-ként is mentheted.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
