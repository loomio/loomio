  a29c1c76443ad97f:
    english: Good governance is more than a board meeting, it requires good communication before and after meetings.
    translation: Hyvä hallinto ei rajoitu hallituksen kokouksiin. Se edellyttää hyvää viestintää ennen kokouksia ja niiden jälkeen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9f05171a74ac30d0:
    english: |-
      This guide is intended to help you use Loomio in your board or committee, so you can stay connected between meetings, deal with urgent matters and reduce board admin.
      - Continue governance between meetings
      - Keep track of communications
      - Use board meetings for issues that matter
      - Preserve institutional memory with a detailed record
    translation: |-
      Tämä opas auttaa sinua käyttämään Loomiota hallituksessa tai toimikunnassa. Voitte pitää yhteyttä kokousten välillä, käsitellä kiireellisiä asioita ja vähentää hallinnollista työtä.
      - Jatkakaa hallintotyötä kokousten välillä
      - Pitäkää viestintä tallessa
      - Käyttäkää kokoukset tärkeiden asioiden käsittelyyn
      - Säilyttäkää organisaation muisti yksityiskohtaisen dokumentoinnin avulla
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bce24543243c913b:
    english: 'Loomio is a versatile discussion and decision-making tool for collaborative boards and committees. '
    translation: Loomio on monipuolinen työkalu hallitusten ja toimikuntien yhteisiin keskusteluihin ja päätöksentekoon.
