  4790c088af5fc09f:
    english: |-
      - **Start** goes to the discussion context
      - **New to you** appears when the thread contains activity you have not read
      - **Latest** appears when newer activity is available beyond the items currently loaded
      - milestone links go directly to important comments, polls, and outcomes
      - **End** goes to the latest item in the thread
    translation: |-
      - **Aloita** vie keskustelun kontekstiin
      - **Uusi sinulle** näkyy, kun keskusteluketjussa on tapahtumia, joita et ole lukenut
      - **Uusin** näkyy, kun ladattujen kohtien jälkeen on uudempia tapahtumia
      - merkkipaalulinkit vievät suoraan tärkeisiin kommentteihin, kyselyihin ja johtopäätöksiin
      - **Loppu** vie keskusteluketjun uusimpaan kohtaan
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  941ea9900465724a:
    english: Comments that include an H2 or H3 heading, polls, and proposals are automatically included as milestone links. Select any milestone to go directly to it.
    translation: H2- tai H3-otsikon sisältävät kommentit sekä kyselyt ja ehdotukset lisätään automaattisesti merkkipaalulinkeiksi. Siirry merkkipaaluun valitsemalla se.
