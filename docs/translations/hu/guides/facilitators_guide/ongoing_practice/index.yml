  fba51c92285b31c7:
    english: "## Continuous Improvement"
    translation: "## Folyamatos fejlődés"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  121b4afb86de3c31:
    english: No matter how amazing a group or facilitator is, they can always improve. If they incrementally head in a good direction they will get to a better place. Incremental improvement requires an effective protocol for meta-conversation (talking about how you collaborate). With it, anything is possible. Without it, you stagnate.
    translation: Bármilyen jól működik egy csoport, és bármilyen ügyes a facilitátor, mindig van lehetőség a fejlődésre. Ha apró lépésekben jó irányba haladnak, idővel előrébb jutnak. Ehhez szükség van egy működő módra, amellyel arról beszélhetnek, hogyan működnek együtt. Így változtatni is tudnak. Enélkül könnyen megrekednek.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  331d258dee610e96:
    english: There are many approaches to continuous improvement, but they all create space for reflection and feedback, and a way to make changes in response. For teams that work together on an ongoing basis, they might employ a methodology like <a href="https://en.wikipedia.org/wiki/Scrum_(software_development)" target="_blank">scrum</a>, including retrospectives and regular process improvements. For a one-off session, a facilitator might simply follow up with a request for feedback.
    translation: A folyamatos fejlődésnek sokféle módja van, de mindegyik teret ad a közös átgondolásnak és a visszajelzésnek, majd lehetőséget a változtatásra. A tartósan együtt dolgozó csapatok használhatnak olyan módszertant, mint a <a href="https://en.wikipedia.org/wiki/Scrum_(software_development)" target="_blank">scrum</a>, rendszeres visszatekintésekkel és a munkafolyamat fejlesztésével. Egy egyszeri alkalom után a facilitátor egyszerűen visszajelzést kérhet.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aabfa9d842af2688:
    english: On Loomio
    translation: A Loomióban
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ac2f489368566562:
    english: |-
      * People use Loomio itself to talk about how they use Loomio. It provides an obvious platform to “talk about the talking”.
      * The process of joining Loomio causes groups to reflect on many aspects of their collaboration and decision-making process, which creates the opportunity to improve.
    translation: |-
      * Az emberek magában a Loomióban is beszélhetnek arról, hogyan használják a Loomiót. Kézenfekvő helyet ad annak, hogy magáról a beszélgetésről beszéljenek.
      * A Loomióhoz való csatlakozás során a csoportok átgondolják együttműködésük és döntéshozataluk több részét. Ez alkalmat teremt a fejlődésre.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7b11f212a312312e:
    english: "## Distributed Facilitation / Self-facilitation"
    translation: "## Megosztott facilitálás / önfacilitálás"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1e385970a624bf63:
    english: As a group becomes more experienced, more individuals build capacity for facilitation. Facilitation can cease to be a role held by a specific person, and become more of a function that can be distributed. Anyone can take acts of facilitation, and a dance of give and take, leading and following, can emerge among participants. For groups with aspirations toward shared leadership and non-hierarchy, this is a very important thing to encourage.
    translation: 'Ahogy egy csoport tapasztalatot szerez, egyre több tagja válik képessé a facilitálásra. Ez többé nem feltétlenül egyetlen ember szerepe: a feladatok megoszthatók. Bárki segítheti a közös munkát. A résztvevők felváltva kezdeményezhetnek és követhetnek másokat. Ezt különösen fontos támogatni azokban a csoportokban, amelyek megosztott vezetésre és hierarchia nélküli működésre törekednek.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fa78b242f7390326:
    english: 'People who are less used to taking acts of facilitation can be supported with education, invitations, and suggestions of first steps. Some examples of acts of facilitation almost anyone can be encouraged to try:'
    translation: 'Akik kevésbé szoktak facilitálni, azoknak segíthet a tanulási lehetőség, a személyes felkérés és néhány javasolt első lépés. A következőket szinte bárki kipróbálhatja:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1f490f466a1893ed:
    english: |-
      * reflecting back what you’re hearing or summarising
      * inviting others to contribute
      * asking questions to enhance collective understanding
      * noticing who is and is not participating
      * appreciating contributions explicitly
    translation: |-
      * visszajelezni, mit hallottál, vagy összefoglalni az elhangzottakat
      * másokat is hozzászólásra hívni
      * kérdésekkel segíteni a közös megértést
      * észrevenni, ki vesz részt, és ki nem
      * kifejezetten megköszönni mások hozzájárulását
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e2eed897e0f564d2:
    english: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../silvia_200.png"> You don’t need an agenda to be a facilitator. Facilitating is just about making a group situation easy. Next time you’re at a family gathering, party or morning tea: approach it like a facilitator and make sure everybody in the group feels included and able to participate. — Silvia Zuur'
    translation: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../silvia_200.png"> Nem kell napirend ahhoz, hogy facilitálj. A facilitálás lényege, hogy megkönnyítsd a csoport közös munkáját. Amikor legközelebb családi összejövetelen, buliban vagy közös teázáson vagy, figyelj facilitátorként arra, hogy mindenki bevonva érezze magát, és részt tudjon venni. — Silvia Zuur'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  180b1232871c44c4:
    english: Distributed facilitation can work beautifully, but it can also cause people to step all over each other. At first, it’s awkward as people learn the dance. It’s important to differentiate between distributed facilitation (peers helping the collective), “facipulation” (manipulating the group toward your own agenda), and backseat facilitation (taking acts of facilitation when you do not have the mandate).
    translation: A megosztott facilitálás jól működhet, de az is előfordulhat, hogy az emberek egymás útjába kerülnek. Eleinte nehézkes lehet, amíg megtanulják, hogyan működjenek együtt. Fontos különbséget tenni a megosztott facilitálás (amikor a résztvevők a közösséget segítik), a „facipuláció” (amikor valaki a saját céljai felé tereli a csoportot) és a kéretlen facilitálás (amikor valaki felhatalmazás nélkül veszi át az irányítást) között.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ea5faa685be1ceae:
    english: Consciously decide when peer facilitation is a good choice, and when a specific facilitator is called for. In certain situations, such as a high-conflict discussion where a specified neutral party is needed, or there is a lack of trust, distributed facilitation might not work.
    translation: Tudatosan döntsétek el, mikor hasznos, ha a résztvevők közösen facilitálnak, és mikor van szükség kijelölt facilitátorra. Erős konfliktussal járó vitában például szükség lehet egy semleges személyre. Bizalomhiány esetén sem biztos, hogy működik a megosztott facilitálás.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d6df5458ecb8e45:
    english: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../rich_200.png"> Acts of facilitation are not just for the manager, or the person who called the meeting — they are for everyone. — Richard Bartlett'
    translation: '> <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../rich_200.png"> Nem csak a vezető vagy az értekezlet összehívója facilitálhat. Ebben mindenki részt vehet. — Richard Bartlett'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c3215e63fca09b79:
    english: "## Translating this into Loomio"
    translation: "## Hogyan működik mindez a Loomióban"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  35ce75e6810e0611:
    english: |-
      * The online space is uniquely suited to distributed facilitation. Different people can come along at different points depending on what they notice and their skill set.
      * An online discussion is by default a distributed collaboration among peers. Any other setup requires explicit design. This is the opposite of offline spaces where the default is that someone called a meeting and distributing the role requires proactivity.
      * Loomio is designed with a group of equals in mind. In many ways, a distributed facilitation approach is the best fit for the tool.
      * Current Loomio users do peer facilitation all the time, whether they realize that’s what they are doing or not. Simple things like suggesting someone raise a proposal, tagging people, summarising the process so far, etc, are all acts of facilitation.
    translation: |-
      * Az online tér különösen alkalmas a megosztott facilitálásra. Különböző emberek különböző pontokon kapcsolódhatnak be aszerint, hogy mit vesznek észre, és miben jártasak.
      * Az online beszélgetés alaphelyzetben egyenrangú résztvevők megosztott együttműködése. Más működéshez tudatos kialakításra van szükség. A személyes találkozóknál gyakran az a kiindulópont, hogy valaki összehívja az alkalmat, és külön lépéseket kell tenni a facilitálás megosztásáért.
      * A Loomio egyenrangú tagokból álló csoportokra épül. A megosztott facilitálás sok szempontból jól illik hozzá.
      * A Loomio használói rendszeresen segítik egymás közös munkáját, akár facilitálásnak nevezik ezt, akár nem. Ilyen lépés lehet javasolni valakinek, hogy tegyen javaslatot, megjelölni másokat vagy összefoglalni az eddigi folyamatot.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  efde81539c545bae:
    english: "## The Art of Being Facilitated"
    translation: "## A facilitálás elfogadásának művészete"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  93ed1980d0cc95b4:
    english: Like the skill of being the follow in a ballroom dance pair, being facilitated is an art itself. People with experience facilitating themselves, or who have participated in a lot of well-facilitated processes, will receive facilitation differently than those who haven't.
    translation: Ahogy a páros táncban a követésnek is megvan a maga tudása, úgy a facilitálás elfogadása is készség. Aki maga is facilitált már, vagy sok jól facilitált folyamatban vett részt, másként fogadja a facilitálást, mint akinek nincs ilyen tapasztalata.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d2bcd9f07f5bd25b:
    english: On the positive side, skillful receptivity to facilitation is a capacoty that can be grown, and it can have a big impact on group success. This ranges from things as simple as showing up on time, to following instructions, to being willing to try a new style of thinking or communicating. Sometimes people have a good experience and they don’t quite know why — pointing out that facilitation is the reason for the smoothness or depth can help them understand what it is they valued about the process.
    translation: A facilitálásra való nyitottság fejleszthető, és sokat számíthat egy csoport sikerében. Ide tartoznak az olyan egyszerű dolgok, mint a pontos érkezés és az útmutatások követése, de az is, hogy valaki hajlandó kipróbálni egy új gondolkodási vagy kommunikációs módot. Néha az emberek jó élménnyel távoznak, de nem tudják pontosan, miért. Ha rámutatsz, hogy a facilitálás segítette a folyamat gördülékenységét vagy mélységét, könnyebben megérthetik, mit értékeltek benne.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  87345b383ccba81d:
    english: On the negative side, people who can’t or won’t be facilitated can be detrimental to group collaboration. No matter how skilled a facilitator is, if they encounter a certain level of resistance they won’t be able to do their job. Common problems include dominating the discussion, playing devil’s advocate, disrupting the process, disrespecting the facilitator or participants, or being disengaged. At some level individuals must take responsibility for their willingness to be facilitated.
    translation: Aki nem tudja vagy nem akarja elfogadni a facilitálást, megnehezítheti a csoport együttműködését. Bármilyen gyakorlott a facilitátor, bizonyos mértékű ellenállás mellett nem tudja ellátni a feladatát. Gyakori gond, ha valaki uralja a vitát, folyton az ellenkező álláspontot képviseli, megzavarja a folyamatot, tiszteletlen a facilitátorral vagy a résztvevőkkel, vagy nem kapcsolódik be. Mindenkinek felelősséget kell vállalnia azért, hogy kész legyen részt venni egy facilitált folyamatban.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c096fd0a7e12ddd4:
    english: |-
      * With a little practice, most users quickly upskill on being responsive to acts of facilitation on Loomio, such as replying when @mentioned.
      * Taking acts of facilitation on Loomio helps people become more responsive to facilitation themselves.
      * Because everything is archived, users can see past acts of facilitation “frozen in time”, gaining the benefits of observing them without having been there.
    translation: |-
      * Egy kis gyakorlással a legtöbb felhasználó hamar megtanul reagálni a Loomióban tett facilitáló lépésekre, például válaszolni, amikor @megemlítik.
      * Ha valaki maga is facilitál a Loomióban, könnyebben fogadja mások facilitálását is.
      * Mivel minden archiválva van, a felhasználók később is láthatják a korábbi facilitáló lépéseket. Így akkor is tanulhatnak belőlük, ha nem voltak jelen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f930b325aaedb19a:
    english: "## Culture Change"
    translation: "## Kulturális változás"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  82936abec2b50e3f:
    english: A collaborative, participatory culture is something that emerges over time, with lots of practice and trial and error. Understanding, valuing, and inviting facilitation can play a pivotal role in this cultural emergence. Facilitation can evolve from a role, to a function, to a mindset. A truly collaborative culture is one where everyone is facilitating everyone in myriad different ways.
    translation: Az együttműködő, részvételre épülő kultúra idővel, sok gyakorlás és próbálkozás során alakul ki. Ebben fontos szerepe lehet annak, hogy a csoport megérti, értékeli és támogatja a facilitálást. A facilitálás előbb szerep, majd megosztott feladat, végül szemléletmód lehet. Egy valóban együttműködő közegben mindenki sokféleképpen segíti mások részvételét.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  898bf6557380a042:
    english: Is the company party participatory? Does the office potluck just happen like magic? Are ideas able to emerge from anywhere, evolve through many brains and hands, and get implemented in a way better than anyone first imagined?
    translation: Mindenki részt vehet a céges összejövetelen? A közös irodai ebéd magától szerveződik? Bárkitől származhat ötlet, amelyet sokan továbbformálnak, majd az eredeti elképzelésnél is jobb módon valósítanak meg?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f4964381b3c6dc7b:
    english: Deep culture change is when the culture of collaboration starts to leak out of specific “collaboration” spaces and shows up in every aspect of the organization. Collaboration is not about post-it notes and check-ins, but the very timbre of organizational life.
    translation: Mély kulturális változás akkor történik, amikor az együttműködés túllép a kifejezetten erre kijelölt alkalmakon, és a szervezet működésének minden részében megjelenik. Nem a cetlik és a rendszeres bejelentkezések jelentik az együttműködést, hanem az, ahogyan a szervezet a mindennapokban működik.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6962aa4815c01b0f:
    english: |-
      * The [theory of change of Loomio](http://www.loomio.com/about) is that more groups practicing effective, inclusive decision making can change organizational dynamics at a global scale. This shows up in everything about how the tool is designed and [how we run as a co-op](http://loomio.coop). Ultimately, it’s about culture change through collaborative practice.
      * Loomio groups have experienced evolving culture through the tool. Like groups that already has a collaborative culture scale while holding onto that, or a participatory group continuing to exists instead of imploding due to challanges around inclusive decicion-making.
      * Loomio makes a certain kind of “new normal” of collaborative practice possible, through making collaborative practice more accessible and achievable.
    translation: |-
      * A [Loomio változáselmélete](http://www.loomio.com/about) szerint ha több csoport hoz hatékony és befogadó módon döntéseket, az világszinten is megváltoztathatja a szervezetek működését. Ez a szemlélet megjelenik az eszköz kialakításában és abban is, [ahogyan szövetkezetként működünk](http://loomio.coop). A cél az együttműködés gyakorlásán keresztüli kulturális változás.
      * A Loomiót használó csoportok megtapasztalták, hogyan alakulhat a kultúrájuk az eszköz segítségével. Egy már együttműködő csoport úgy növekedhet, hogy megőrzi ezt a működését. Egy részvételre épülő csoport pedig a befogadó döntéshozatal nehézségei ellenére is fennmaradhat.
      * A Loomio elérhetőbbé és megvalósíthatóbbá teszi az együttműködés gyakorlatát, így az a mindennapok természetes részévé válhat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  3f2cee633e8b83c2:
    english: For inspiration about Ongoing Practice, check out [stories of Loomio groups](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help).
    translation: Ha további példákat keresel a folyamatos gyakorláshoz, olvasd el a [Loomio-csoportok történeteit](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
