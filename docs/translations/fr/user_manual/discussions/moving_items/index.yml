---
navigation_title: Déplacer des éléments entre les discussions
blocks:
  875a42e08000fffe:
    english: "# Moving items between threads"
    translation: "# Déplacer des éléments entre les discussions"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5c0fcd38f9276e8f:
    english: Move selected items when a conversation belongs in another thread, when one thread has split into separate topics, or when you want to combine related discussions. There is no separate **Merge discussions** command.
    translation: Déplacez les éléments sélectionnés lorsqu’une conversation a sa place dans une autre discussion, lorsqu’une discussion s’est divisée en plusieurs sujets ou lorsque vous souhaitez regrouper des discussions liées. Il n’existe pas de commande **Fusionner les discussions** distincte.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f43c7835d05a135e:
    english: The option is available to group admins and to members when **Members can manage discussions and comments** is enabled in [Group permissions](/en/user_manual/groups/settings/permissions).
    translation: Cette option est accessible aux administrateurs du groupe, ainsi qu’aux membres si **Les membres peuvent gérer les discussions et les commentaires.** est activé dans les [permissions du groupe](/en/user_manual/groups/settings/permissions).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  30a4e31dab983f89:
    english: Open the three-dot menu (**⋯**) on an item and select **Move item**.
    translation: Ouvrez le menu à trois points (**⋯**) d’un élément et sélectionnez **Déplacer l'élément**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  24fd0043effa14fb:
    english: Select the items you want to move.
    translation: Sélectionnez les éléments à déplacer.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  81551cd5134f24c5:
    english: Select any additional items with the checkboxes, then click **Move** in the banner at the top of the discussion.
    translation: Cochez les autres éléments à déplacer, puis cliquez sur **Déplacer** dans la bannière en haut de la discussion.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f53055845c214b05:
    english: Choose the group or subgroup, then search for the destination discussion.
    translation: Choisissez le groupe ou le sous-groupe, puis recherchez la discussion de destination.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  19bc2092ac28011b:
    english: To move the items into a new discussion, select **New discussion** and add its title and context.
    translation: Pour déplacer les éléments vers une nouvelle discussion, sélectionnez **Nouvelle discussion**, puis ajoutez un titre et un contexte.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '092b56e69505636f':
    english: The items are moved from the original thread into the selected or newly created thread.
    translation: Les éléments sont déplacés de la discussion d’origine vers la discussion sélectionnée ou nouvellement créée.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  162c0d0c47ca798f:
    english: If the original thread is no longer needed, you can [lock it](/en/user_manual/discussions/using_discussions/#lock-or-unlock-a-thread). Delete it only if you are certain it will not be needed again.
    translation: Si la discussion d’origine n’est plus nécessaire, vous pouvez la [verrouiller](/en/user_manual/discussions/using_discussions/#lock-or-unlock-a-thread). Ne la supprimez que si vous êtes certain qu’elle ne sera plus utile.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
