---
navigation_title: Переміщення елементів між темами
blocks:
  875a42e08000fffe:
    english: "# Moving items between threads"
    translation: "# Переміщення елементів між темами"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5c0fcd38f9276e8f:
    english: Move selected items when a conversation belongs in another thread, when one thread has split into separate topics, or when you want to combine related discussions. There is no separate **Merge discussions** command.
    translation: Перемістіть вибрані елементи, якщо розмову доречніше вести в іншій темі, одна тема розділилася на кілька питань або ви хочете об’єднати пов’язані обговорення. Окремої команди **Об’єднати обговорення** немає.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f43c7835d05a135e:
    english: The option is available to group admins and to members when **Members can manage discussions and comments** is enabled in [Group permissions](/en/user_manual/groups/settings/permissions).
    translation: Ця можливість доступна адміністраторам групи, а також учасникам, якщо в [налаштуваннях прав групи](/en/user_manual/groups/settings/permissions) увімкнено **Учасники можуть керувати обговореннями та коментарями**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  30a4e31dab983f89:
    english: Open the three-dot menu (**⋯**) on an item and select **Move item**.
    translation: Відкрийте меню з трьома крапками (**⋯**) біля елемента й виберіть **Перемістити елемент**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  24fd0043effa14fb:
    english: Select the items you want to move.
    translation: Виберіть елементи, які хочете перемістити.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  81551cd5134f24c5:
    english: Select any additional items with the checkboxes, then click **Move** in the banner at the top of the discussion.
    translation: Позначте додаткові елементи прапорцями, а потім натисніть **Перемістити** на панелі вгорі обговорення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f53055845c214b05:
    english: Choose the group or subgroup, then search for the destination discussion.
    translation: Виберіть групу або підгрупу, а потім знайдіть обговорення, до якого хочете перемістити елементи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  19bc2092ac28011b:
    english: To move the items into a new discussion, select **New discussion** and add its title and context.
    translation: Щоб перемістити елементи в нове обговорення, виберіть **Нове обговорення** і додайте його назву та опис.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '092b56e69505636f':
    english: The items are moved from the original thread into the selected or newly created thread.
    translation: Елементи перемістяться з початкової теми до вибраної або щойно створеної теми.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  162c0d0c47ca798f:
    english: If the original thread is no longer needed, you can [lock it](/en/user_manual/discussions/using_discussions/#lock-or-unlock-a-thread). Delete it only if you are certain it will not be needed again.
    translation: Якщо початкова тема більше не потрібна, ви можете [заблокувати її](/en/user_manual/discussions/using_discussions/#lock-or-unlock-a-thread). Видаляйте її, лише якщо впевнені, що вона більше не знадобиться.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
