  68e2a02de493acf3:
    english: "# Proposals and polls"
    translation: "# 提案と投票"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ff07fce3bab705aa:
    english: Proposals and polls collect structured responses from a group. They can help test an idea, make a decision, identify priorities, schedule a meeting, or elect representatives.
    translation: 提案と投票では、グループから決まった形式の回答を集めます。アイデアの検討、意思決定、優先事項の整理、会議の日程調整、代表者の選出に役立ちます。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f031d2644fee2a91:
    english: "## Find the right help"
    translation: "## 目的に合った説明を探す"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  34039c79ea769793:
    english: 'These parts of the manual answer different questions:'
    translation: 目的に応じて、次のページを参照してください。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  34ea9d58ccbf80fb:
    english: |-
      | If you want to… | Read… |
      |---|---|
      | Choose what participants should express | [Proposals](../proposals/) or [Polls](../proposal_types/) |
      | Run a specific proposal template | [Sense check](../proposals/sense_check/), [Advice](../proposals/advice/), [Consent](../proposals/consent/), or [Consensus](../proposals/consensus/) |
      | Configure the templates available to a group | [Poll templates](../poll_templates/) |
      | Facilitate a decision from discussion to outcome | [Making decisions](/en/guides/making_decisions/) |
    translation: |-
      | したいこと | 参照先 |
      |---|---|
      | 参加者に何を表明してもらうか選ぶ | [提案](../proposals/)または[投票](../proposal_types/) |
      | 特定の提案テンプレートを使う | [センスチェック](../proposals/sense_check/)、[アドバイス](../proposals/advice/)、[同意](../proposals/consent/)、または[コンセンサス](../proposals/consensus/) |
      | グループで利用できるテンプレートを設定する | [投票テンプレート](../poll_templates/) |
      | ディスカッションから結論まで意思決定を進める | [意思決定の進め方](/en/guides/making_decisions/) |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7eddb057cca077f4:
    english: A **voting method** defines how people respond and how results are calculated. A **poll template** is a reusable configuration built on a voting method, with preset instructions, options, and settings. A **decision process** may use a discussion and several templates before the group reaches an outcome.
    translation: "**投票方法**は、参加者の回答方法と結果の計算方法を定めます。**投票テンプレート**は、投票方法をもとに、説明、選択肢、設定をあらかじめ用意した再利用可能な設定です。**意思決定のプロセス**では、グループが結論に至るまでに、ディスカッションと複数のテンプレートを使うことがあります。"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3cd46aa2f1240e88:
    english: "## Proposals"
    translation: "## 提案"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  85a55fccaf4e4032:
    english: 'A proposal asks people to respond to a statement or course of action. Loomio includes templates for common purposes:'
    translation: 提案では、ある考えや行動方針について参加者に回答してもらいます。Loomio には、一般的な目的に合わせたテンプレートがあります。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  51bf1ffa7d057d9e:
    english: |-
      - [Sense check](../proposals/sense_check/) gathers early reactions;
      - [Advice](../proposals/advice/) gathers input for a decision maker;
      - [Consent](../proposals/consent/) tests for meaningful objections; and
      - [Consensus](../proposals/consensus/) seeks collective agreement.
    translation: |-
      - [センスチェック](../proposals/sense_check/)は初期の反応を集めます。
      - [アドバイス](../proposals/advice/)は意思決定者のために意見を集めます。
      - [同意](../proposals/consent/)は重要な異議がないか確かめます。
      - [コンセンサス](../proposals/consensus/)は全員での合意を目指します。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d01e9f85fcd2d9c2:
    english: See [Proposals](../proposals/) to compare them.
    translation: 各テンプレートの比較は[提案](../proposals/)を参照してください。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  821dcd89b5460804:
    english: "## Polls"
    translation: "## 投票"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ec746235c7fe89c4:
    english: 'Use a poll when participants need to select, score, allocate, rank, state their availability, or cast an election ballot:'
    translation: 参加者に選択、採点、ポイントの配分、順位付け、参加可能な日時の表明、選挙での投票をしてもらう場合は、投票を使います。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b93f9fe9611d9205:
    english: |-
      - [Choose](../choose/) finds popular options;
      - [Score](../score/) evaluates every option on a scale;
      - [Allocate](../allocate/) distributes a limited budget of points;
      - [Rank](../rank/) finds an overall order of preference;
      - [Time poll](../meeting_polls/) finds when people are available; and
      - [STV Election](../stv/) elects multiple winners proportionally.
    translation: |-
      - [選ぶ](../choose/)は人気のある選択肢を見つけます。
      - [スコア](../score/)は各選択肢を尺度に沿って評価します。
      - [割り当てる](../allocate/)は限られたポイントを選択肢に配分します。
      - [ランク](../rank/)は全体の優先順位を調べます。
      - [時間投票](../meeting_polls/)は参加できる日時を調べます。
      - [STV選挙](../stv/)は得票に応じて複数の当選者を選びます。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9972b34ccc3ea79b:
    english: See [Polls](../proposal_types/) to compare them.
    translation: 各投票方法の比較は[投票](../proposal_types/)を参照してください。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5890626db6dcbb68:
    english: "## Start a proposal or poll"
    translation: "## 提案または投票を開始する"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4b5338cae269fd32:
    english: "### Choose whether to use a discussion"
    translation: "### ディスカッションを使うか選ぶ"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c45fe8ff31f71486:
    english: Start the proposal or poll inside a discussion when people need context, questions, or conversation before responding. A discussion can contain several proposals over time, keeping amendments and the eventual outcome together as one record of the topic.
    translation: 回答する前に背景情報の共有、質問、意見交換が必要な場合は、ディスカッション内で提案または投票を開始します。一つのディスカッションで時間をかけて複数の提案を扱えます。修正の経緯と最終的な結論を、同じ議題の記録として残せます。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0bb2a90f8f9dad0c:
    english: Run a standalone poll when the discussion has already happened elsewhere, such as at a meeting, or when the question is simple and you only need to collect responses. Include enough detail or a link to the relevant record so voters understand what they are responding to.
    translation: 会議など別の場所ですでに話し合った場合や、質問が単純で回答だけを集めたい場合は、ディスカッションを作らずに投票を実施します。投票者が何に回答するのか分かるよう、十分な説明か関連する記録へのリンクを添えてください。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7d50445f0c54190d:
    english: "### In a discussion"
    translation: "### ディスカッション内で開始する"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  05e03f7ee0e1b4dc:
    english: Open the discussion, scroll to the reply area, select **Start a vote**, and choose a template.
    translation: ディスカッションを開き、返信欄までスクロールして**投票を開始する**を選び、テンプレートを選択します。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  55dc0481a5c4ecb6:
    english: "### Without a discussion"
    translation: "### ディスカッションを使わずに開始する"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  af5fd115de5f7aec:
    english: Open the **Polls** tab on the group page, select **New poll**, and choose a template.
    translation: グループのページで**投票**タブを開き、**新しい投票**を選んで、テンプレートを選択します。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  23479ea263004d4a:
    english: If you create a discussion and poll at the same time only to run a vote, avoid notifying people twice. Start the discussion without notifying them and use the poll invitation, or run the poll without a discussion.
    translation: 投票だけを行うためにディスカッションと投票を同時に作成する場合は、通知が二重に届かないようにします。通知せずにディスカッションを開始して投票への招待を使うか、ディスカッションを作らずに投票を実施します。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  31f857d230319a3c:
    english: "## What happens next"
    translation: "## 開始後の流れ"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb709a76dfeabd4f:
    english: When starting a proposal or poll, you provide a title and details, review its response options and settings, set a closing time, and invite participants. While it is open, participants can vote, explain their response, and change their vote. Results update as votes are submitted, subject to the poll's result-visibility setting.
    translation: 提案または投票を開始するときは、タイトルと詳細を入力し、回答の選択肢と設定を確認して、締め切りを設定し、参加者を招待します。受付中は、参加者が投票し、回答の理由を説明し、投票を変更できます。結果は投票が送信されるたびに更新されますが、表示される内容は結果の公開設定によって異なります。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  acd2e813b56034a0:
    english: When it closes, publish an [outcome](../outcomes/) that records what the result means and what will happen next.
    translation: 締め切り後は、結果が何を意味し、次に何をするかを記録した[結論](../outcomes/)を公開します。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
