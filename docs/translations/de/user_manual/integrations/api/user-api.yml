  a4f66c4c94afa135:
    english: The request timeout is five seconds. A `2xx` response, including `204 No Content`, is treated as successful. Webhook consumers should respond promptly, process longer work asynchronously, and tolerate duplicate or out-of-order deliveries.
    translation: Die Zeitüberschreitung für die Anfrage beträgt fünf Sekunden. Eine `2xx`-Antwort, einschließlich `204 No Content`, gilt als erfolgreich. Webhook-Empfänger sollten zügig antworten, längere Aufgaben asynchron verarbeiten und doppelte oder in anderer Reihenfolge eintreffende Zustellungen berücksichtigen.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  84faa7dad6f34739:
    english: Loomio does not currently add a webhook signature, shared-secret header, event ID, or delivery ID. Treat the full destination URL as a credential, do not expose it publicly, and include an unguessable token in the URL when the receiving service supports one. If a stable machine-readable event schema or signed delivery is required, use the webhook as a change notification and retrieve the current records through the authenticated User API.
    translation: Loomio fügt derzeit weder eine Webhook-Signatur noch einen Header mit einem gemeinsamen Geheimnis, eine Ereignis-ID oder eine Zustellungs-ID hinzu. Behandle die vollständige Ziel-URL wie einen Zugangsschlüssel und veröffentliche sie nicht. Wenn der empfangende Dienst es unterstützt, füge der URL ein nicht erratbares Token hinzu. Wenn du ein stabiles maschinenlesbares Ereignisschema oder signierte Zustellungen benötigst, nutze den Webhook als Änderungsbenachrichtigung und rufe die aktuellen Datensätze über die authentifizierte Benutzer-API ab.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f3d956b4694f793c:
