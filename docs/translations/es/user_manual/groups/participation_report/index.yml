  6772e16cee705fc1:
    english: 'Understand how much participation happens in your group over a given period of time. '
    translation: Consulta cuánto se ha participado en tu grupo durante un período determinado.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fe690a715f8a00b5:
    english: The report shows how many threads, comments, polls, votes and reactions have happened per month. This is graphed so you can see ebbs and flows of usage.
    translation: El informe muestra cuántos hilos, comentarios, encuestas, votos y reacciones hubo cada mes. El gráfico permite ver cómo varía la actividad.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  21bf7cb257f4bb03:
    english: Click specific labels on the graph to remove them from view.
    translation: Haz clic en las etiquetas del gráfico para ocultar las categorías correspondientes.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  35ced3d9d51038aa:
    english: Click specific headings in the table to sort the table by that column.
    translation: Haz clic en los encabezados de la tabla para ordenar los datos por columna.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
