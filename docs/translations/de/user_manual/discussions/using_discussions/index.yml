    english: "### Notified"
    translation: "### benachrichtigt"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  885a21cbc1a44f7d:
    english: "**Notified** opens the discussion notification history. It includes invitations, mentions, and replies, showing who was notified and whether each notification has been read when that information is available."
    translation: "**benachrichtigt** öffnet den Benachrichtigungsverlauf der Diskussion. Er umfasst Einladungen, Erwähnungen und Antworten. Du siehst, wer benachrichtigt wurde und, sofern diese Information verfügbar ist, ob die Benachrichtigung gelesen wurde."
