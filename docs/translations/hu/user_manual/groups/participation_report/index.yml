  519237662235d020:
    english: |-
      ### Actions per user
      Understand who are the most and least active contributors in your group.
    translation: |-
      ### Tevékenységek felhasználónként
      Nézd meg, kik a csoportod legaktívabb és legkevésbé aktív résztvevői.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b538bd1f65e69d28:
    english: This table shows how many threads, comments, polls, votes and reactions each user in the specified groups was responsible for during the time frame. Click specific headings in the table to sort the table by that column.
    translation: A táblázat megmutatja, hogy a kiválasztott csoportokban az egyes felhasználók hány szálat, hozzászólást, szavazást, leadott szavazatot és reakciót hoztak létre a megadott időszakban. Kattints egy oszlopfejlécre az adott oszlop szerinti rendezéshez.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7d416ad780b3ca85:
    english: Turn on **Delegates only** to show people who are currently delegates in any of the selected groups. Their activity and voting record are aggregated across all selected groups, and delegates with no activity during the selected period remain in the table. The CSV download uses the same filter.
    translation: Kapcsold be a **Csak küldöttek** szűrőt, ha csak azokat szeretnéd látni, akik jelenleg a kiválasztott csoportok valamelyikében küldöttek. A tevékenységüket és szavazási adataikat a rendszer az összes kiválasztott csoportból összesíti. A kiválasztott időszakban inaktív küldöttek is szerepelnek a táblázatban. A CSV-letöltésre ugyanaz a szűrő vonatkozik.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
