  2c6bd4d0a9b3e572:
    english: List polls visible to the API-key user in a group. For a publicly visible group, a nonmember can list its public polls; private polls remain restricted to users who can read them in Loomio. The response includes each visible poll's current outcome, so you can use `status=closed` to list decided proposals.
    translation: Отримайте список опитувань групи, видимих користувачеві, якому належить ключ API. Якщо група загальнодоступна, людина, яка не є її учасником, може переглянути її публічні опитування. Приватні опитування доступні лише тим, хто може переглядати їх у Loomio. Відповідь містить поточний висновок кожного видимого опитування, тому за допомогою `status=closed` можна отримати список пропозицій, за якими ухвалено рішення.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
