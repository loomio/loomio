  a29c1c76443ad97f:
    english: Good governance is more than a board meeting, it requires good communication before and after meetings.
    translation: Goed bestuur vraagt om meer dan vergaderingen van het bestuur. Ook goede communicatie voor en na die vergaderingen is nodig.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9f05171a74ac30d0:
    english: |-
      This guide is intended to help you use Loomio in your board or committee, so you can stay connected between meetings, deal with urgent matters and reduce board admin.
      - Continue governance between meetings
      - Keep track of communications
      - Use board meetings for issues that matter
      - Preserve institutional memory with a detailed record
    translation: |-
      Deze gids helpt je om Loomio te gebruiken in je bestuur of commissie. Zo blijf je tussen vergaderingen in contact, kun je dringende zaken behandelen en heb je minder bestuursadministratie.
      - Zet het bestuurswerk voort tussen vergaderingen
      - Houd communicatie bij
      - Gebruik bestuursvergaderingen voor zaken die ertoe doen
      - Bewaar de kennis van je organisatie in een gedetailleerd verslag
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bce24543243c913b:
    english: 'Loomio is a versatile discussion and decision-making tool for collaborative boards and committees. '
    translation: Loomio is een veelzijdig hulpmiddel voor discussies en besluitvorming in besturen en commissies die samenwerken.
    status: machine
    provider: codex/gpt-6-sol
