navigation_title: Accounts samenvoegen
blocks:
  e3a50952a2ce6cfc:
    english: "# Merge accounts"
    translation: "# Accounts samenvoegen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e0bdfaac5741d310:
    english: Merge two Loomio accounts when each account uses a different email address and you want to continue with one account.
    translation: Voeg twee Loomio-accounts met verschillende e-mailadressen samen als je met één account verder wilt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '08d4fcba2e0a2b3b':
    english: 'Before you begin, decide which account you want to keep:'
    translation: 'Bepaal voordat je begint welk account je wilt behouden:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6f7efc1ebdc680c7:
    english: |-
      - The **account to keep** is the account whose email address and profile you will use after the merge
      - The **account to retire** is the account you sign in to first. Its email address will no longer work for signing in after the merge
    translation: |-
      - Het **account dat je wilt behouden** is het account waarvan je na de samenvoeging het e-mailadres en profiel gebruikt
      - Het **account dat je wilt opheffen** is het account waarop je eerst inlogt. Na de samenvoeging kun je niet meer inloggen met het e-mailadres van dit account
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  060fb4b1c12c153a:
    english: You need access to both accounts and to the email address of the account you want to keep.
    translation: Je hebt toegang nodig tot beide accounts en tot het e-mailadres van het account dat je wilt behouden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9c9a7e082a3b67ae:
    english: |-
      > [!WARNING]
      > Merging accounts is irreversible. Check the source and target email addresses carefully before the final confirmation.
    translation: |-
      > [!WARNING]
      > Je kunt een samenvoeging niet ongedaan maken. Controleer beide e-mailadressen zorgvuldig voordat je de samenvoeging definitief bevestigt.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4d6defccb0f2a2ec:
    english: "## Start the merge"
    translation: "## De samenvoeging starten"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  0c49f5d2284571d3:
    english: |-
      1. Sign in to the **account you want to retire**.
      2. Open the sidebar, select your name, and select **Edit profile**.
      3. Select **Merge accounts**.
    translation: |-
      1. Log in op het **account dat je wilt opheffen**.
      2. Open de zijbalk, selecteer je naam en selecteer **Profiel bewerken**.
      3. Selecteer **Accounts samenvoegen**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a05689d18f3c3337:
    english: "![The profile actions with Merge accounts highlighted](merge_accounts_profile.png)"
    translation: "![De profielacties met Accounts samenvoegen gemarkeerd](merge_accounts_profile.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  29656e0572127b88:
    english: 4. Enter the destination account's email address—the address belonging to the **account you want to keep**—and select **Send verification email**. Loomio always shows the same confirmation and signs you out. If an account uses that address, Loomio sends it the verification email.
    translation: 4. Voer het e-mailadres van het bestemmingsaccount in, het adres van het **account dat je wilt behouden**, en selecteer **Verificatie-e-mail verzenden**. Loomio toont altijd dezelfde bevestiging en logt je uit. Als een account dat adres gebruikt, stuurt Loomio een verificatie-e-mail naar dat adres.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d045b6c7e8a5b853:
    english: "## Verify the account you want to keep"
    translation: "## Het account dat je wilt behouden verifiëren"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  57255cdb29b384d7:
    english: 5. Open the verification email sent to the address of the account you want to keep and select **Verify email and proceed**.
    translation: 5. Open de verificatie-e-mail die naar het adres van het account dat je wilt behouden is gestuurd en selecteer **Controleer e-mail en ga door**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5e496b2d8f551efa:
    english: "![The merge verification email with the Verify email and proceed button highlighted](merge_accounts_email.png)"
    translation: "![De verificatie-e-mail voor de samenvoeging met de knop Controleer e-mail en ga door gemarkeerd](merge_accounts_email.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ad19dc0399f9d446:
    english: |-
      6. Sign in as the account you want to keep if Loomio asks you to sign in.
      7. On the **Confirm merge** page, check both email addresses again. Select **Merge accounts** to complete the merge.
    translation: |-
      6. Log in op het account dat je wilt behouden als Loomio je daarom vraagt.
      7. Controleer op de pagina **Bevestig samenvoegen** beide e-mailadressen opnieuw. Selecteer **Accounts samenvoegen** om de samenvoeging te voltooien.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a575e2cd16aa66b4:
    english: "![The final confirmation page with the Merge accounts button highlighted](merge_accounts_confirm.png)"
    translation: "![De laatste bevestigingspagina met de knop Accounts samenvoegen gemarkeerd](merge_accounts_confirm.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cf8eba685cfdbf04:
    english: "## What happens after the merge"
    translation: "## Wat er na de samenvoeging gebeurt"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6ae4c6c893430735:
    english: The account you keep remains your Loomio identity and sign-in account. Group memberships and activity from the retired account, including discussions, comments, polls, and votes, are reassigned to the account you keep. Where both accounts already belong to the same group, the existing membership for the account you keep remains.
    translation: Het account dat je behoudt, blijft jouw Loomio-identiteit en het account waarmee je inlogt. Groepslidmaatschappen en activiteiten van het opgeheven account, waaronder discussies, reacties, peilingen en stemmen, worden overgezet naar het account dat je behoudt. Als beide accounts al lid zijn van dezelfde groep, blijft het bestaande lidmaatschap van het account dat je behoudt bestaan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  eb05b57367c0815c:
    english: The retired account is deleted and its email address can no longer be used to sign in. Loomio sends a confirmation email to the address of the account you kept when the merge is complete.
    translation: Het opgeheven account wordt verwijderd. Je kunt niet meer inloggen met het e-mailadres van dat account. Zodra de samenvoeging is voltooid, stuurt Loomio een bevestigingsmail naar het adres van het account dat je hebt behouden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
