---
navigation_title: Votação anônima
blocks:
  b4e842083054a400:
    english: "# Anonymous voting"
    translation: "# Votação anônima"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9b5c46644a952388:
    english: Anonymous voting, also known as blind voting, separates the record of who has voted from the votes themselves. Poll coordinators can see who was eligible and, once at least three people have voted, verify participation. Application users cannot connect a submitted vote with the person who submitted it.
    translation: A votação anônima, também chamada de votação secreta, mantém separados o registro de quem votou e os votos enviados. Os coordenadores da enquete podem ver quem tinha direito a votar e, depois que pelo menos três pessoas votarem, verificar a participação. Quem usa o aplicativo não pode associar um voto enviado à pessoa que o enviou.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  105abff68025f002:
    english: This page explains the protections provided by anonymous voting, the information that is retained, and the limits of the guarantee.
    translation: Esta página explica as proteções da votação anônima, as informações mantidas e os limites dessa garantia.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6d97c8b835a3f1f2:
    english: "## How anonymous voting protects voters"
    translation: "## Como a votação anônima protege quem vota"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e01d5c77096b953e:
    english: 'An anonymous poll keeps two separate sets of records:'
    translation: 'Uma enquete anônima mantém dois conjuntos separados de registros:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  757ab56b1165a71d:
    english: |-
      | Participation records | Submitted votes |
      | --- | --- |
      | Who is eligible to vote | The selected options or scores |
      | Who was invited, and by whom | The poll the vote belongs to |
      | Whether each eligible person has voted | No name or user account |
      | No selected options or scores | No link to a participation record |
    translation: |-
      | Registros de participação | Votos enviados |
      | --- | --- |
      | Quem tem direito a votar | As opções selecionadas ou pontuações atribuídas |
      | Quem foi convidado e por quem | A enquete à qual o voto pertence |
      | Se cada pessoa com direito a voto votou | Nenhum nome ou conta de usuário |
      | Nenhuma opção selecionada ou pontuação atribuída | Nenhuma ligação com um registro de participação |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b908c49acc827932:
    english: There is no shared identifier that connects these records. Submitted votes also omit the actual submission time, invitation information, written reasons, attachments, and other metadata that could help identify a voter.
    translation: Não há um identificador compartilhado que conecte esses registros. Os votos enviados também não incluem o horário exato de envio, informações sobre convites, justificativas escritas, anexos ou outros dados que possam ajudar a identificar quem votou.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6430a3d863d135b6:
    english: This separation is enforced when the vote is stored. It does not depend only on hiding names in the interface.
    translation: Essa separação é aplicada quando o voto é armazenado. Ela não depende apenas de ocultar nomes na interface.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b8e31aef3d559f28:
    english: "## While voting is open"
    translation: "## Enquanto a votação está aberta"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f905c85734898a41:
    english: Results remain hidden from everyone until the poll closes. This includes poll coordinators, group administrators, and instance administrators using the application.
    translation: Os resultados ficam ocultos para todas as pessoas até o encerramento da enquete. Isso inclui coordenadores da enquete, administradores do grupo e administradores da instância que usam o aplicativo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  828df5247b61c9e6:
    english: 'When someone votes:'
    translation: 'Quando uma pessoa vota:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  69b471d43b2148a1:
    english: |-
      - their submitted vote is stored without their name or participation record;
      - their participation record is marked to show that they have voted;
      - no vote event, notification, email, comment, or activity entry is created;
      - no copy of their selections is returned after submission; and
      - the interface confirms only that their vote was recorded.
    translation: |-
      - o voto enviado é armazenado sem o nome ou uma ligação com o registro de participação da pessoa;
      - o registro de participação é marcado para indicar que ela votou;
      - nenhum evento de voto, notificação, e-mail, comentário ou registro de atividade é criado;
      - nenhuma cópia das opções selecionadas é devolvida após o envio; e
      - a interface confirma apenas que o voto foi registrado.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4ffe4b38db135dab:
    english: The participation record does not store a precise time for when the person voted. Submitted votes are not ordered by submission time.
    translation: O registro de participação não guarda o horário exato em que a pessoa votou. Os votos enviados não são ordenados pelo horário de envio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7acaf6b48fc42105:
    english: "## Votes cannot be changed"
    translation: "## Os votos não podem ser alterados"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  996ef90a3eee857b:
    english: Each eligible person can vote once. A submitted anonymous vote cannot be reviewed, changed, withdrawn, or replaced, including by a coordinator or administrator.
    translation: Cada pessoa com direito a voto pode votar uma vez. Depois de enviado, um voto anônimo não pode ser consultado, alterado, retirado ou substituído, nem mesmo por um coordenador ou administrador.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  58f0aaa6a45c1d37:
    english: Allowing a person to retrieve or replace their vote would require a persistent link between that person and the vote. Anonymous voting deliberately does not create that link.
    translation: Para permitir que uma pessoa consultasse ou substituísse seu voto, seria necessária uma ligação permanente entre ela e o voto. A votação anônima não cria essa ligação.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2fd2c9d6ab0d6f68:
    english: Review your selections carefully before submitting.
    translation: Revise suas escolhas com atenção antes de enviar o voto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  59f83c0e359484c4:
    english: "## Why anonymous votes do not have reasons"
    translation: "## Por que os votos anônimos não têm justificativas"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  89f9d9a1d4bcb395:
    english: New anonymous votes cannot include a written reason or an attachment. Reasons can contain names, personal details, writing patterns, mentions, or other information that identifies the voter. They would also make individual votes easier to distinguish from the aggregate result.
    translation: Novos votos anônimos não podem incluir uma justificativa escrita nem um anexo. Justificativas podem conter nomes, dados pessoais, padrões de escrita, menções ou outras informações que identifiquem quem votou. Elas também facilitariam distinguir votos individuais do resultado agregado.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  932f88aa929fb4eb:
    english: Participants can still discuss the poll in its thread where discussion is available. Those comments are ordinary named discussion contributions and are not attached to an anonymous vote.
    translation: As pessoas participantes ainda podem conversar sobre a enquete no tópico, quando a discussão estiver disponível. Esses comentários são contribuições comuns, identificadas pelo nome de quem os escreveu, e não ficam associados a um voto anônimo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1b21c2826270bd52:
    english: "## Results and exports"
    translation: "## Resultados e exportações"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  afc45e50b74e075b:
    english: After the poll closes, the results are calculated from the detached votes and displayed as totals and other aggregate results supported by the poll type.
    translation: Após o encerramento da enquete, os resultados são calculados a partir dos votos separados dos registros de participação e exibidos como totais e outros resultados agregados disponíveis para esse tipo de enquete.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b28c82ffcb4ffeb5:
    english: The application does not publish vote identifiers, submission order, or submission times. Poll exports contain aggregate results rather than a row for each anonymous vote, except that a closed STV election can be exported in BLT format. A BLT export contains the candidate rankings needed to recount the election, grouped when multiple ballots have the same ranking, without voter identities or ballot metadata.
    translation: O aplicativo não publica identificadores de votos, a ordem de envio nem os horários de envio. As exportações de enquetes contêm resultados agregados, e não uma linha para cada voto anônimo. A exceção é uma eleição STV encerrada, que pode ser exportada no formato BLT. Uma exportação BLT contém a ordem de preferência dos candidatos necessária para recontar a eleição. Votos com a mesma ordem de preferência são agrupados, sem a identidade de quem votou nem outros dados sobre os votos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8088fc78d955e9bb:
    english: An anonymous poll cannot be reopened after it closes.
    translation: Uma enquete anônima não pode ser reaberta após o encerramento.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c368b542923cd542:
    english: "## Participation verification"
    translation: "## Verificação da participação"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ab086d63c01514bf:
    english: Poll coordinators can view the named participation records. These always show who was eligible. Once at least three people have voted, they also show whether each person voted, but never show how anyone voted. If a poll closes with fewer than three votes, the participation status remains hidden.
    translation: Os coordenadores da enquete podem ver os registros de participação com nomes. Esses registros sempre mostram quem tinha direito a votar. Depois que pelo menos três pessoas votarem, também mostram se cada pessoa votou, mas nunca como votou. Se a enquete terminar com menos de três votos, a informação sobre quem votou continuará oculta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dcad5d728e5e7cfd:
    english: Other participants cannot view this named participation information. Access to poll results does not grant access to the participation records.
    translation: As demais pessoas participantes não podem ver essas informações de participação com nomes. O acesso aos resultados da enquete não dá acesso aos registros de participação.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  37cf06402ac47fa2:
    english: |-
      Coordinators can add eligible people while voting remains open, including after
      other people have voted. Existing voters cannot be removed from an anonymous
      poll.
    translation: |-
      Os coordenadores podem adicionar pessoas com direito a voto enquanto a votação estiver aberta, mesmo depois que
      outras pessoas tiverem votado. Quem já votou não pode ser removido de uma enquete
      anônima.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  705e9b807681f6c1:
    english: "## Reminders"
    translation: "## Lembretes"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8ef8b501a1b27f63:
    english: For an anonymous poll lasting at least 24 hours, eligible people who have not voted receive one automatic reminder during the final 24 hours.
    translation: Em uma enquete anônima com duração de pelo menos 24 horas, as pessoas com direito a voto que ainda não votaram recebem um lembrete automático nas últimas 24 horas.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b23e579a8ef628de:
    english: The reminder is selected from participation records only. It does not inspect submitted votes or create a connection to them. If the deadline changes, the hourly reminder check uses the current deadline without maintaining a separate scheduled reminder for the poll.
    translation: O lembrete é definido apenas com base nos registros de participação. Ele não consulta os votos enviados nem cria uma ligação com eles. Se o prazo mudar, a verificação feita a cada hora usa o prazo atual, sem manter um lembrete agendado separadamente para a enquete.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  053ce04ce5f98ed8:
    english: Polls with a total voting period of less than 24 hours do not send this automatic reminder.
    translation: Enquetes cujo período total de votação é inferior a 24 horas não enviam esse lembrete automático.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb1f13e60fe178fe:
    english: "## What coordinators and administrators can see"
    translation: "## O que coordenadores e administradores podem ver"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e59c22e94231a746:
    english: 'Through the application, a poll coordinator, group administrator, or instance administrator may be able to see:'
    translation: 'Pelo aplicativo, um coordenador da enquete, administrador do grupo ou administrador da instância pode ter acesso a:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  2da6b1feaa8b36f1:
    english: |-
      - the poll and its eligible voters;
      - whether each eligible person has voted, where their role permits access and at least three people have voted; and
      - aggregate results after the poll closes.
    translation: |-
      - a enquete e as pessoas com direito a voto;
      - a informação sobre se cada pessoa com direito a voto votou, caso sua função permita esse acesso e pelo menos três pessoas tenham votado; e
      - os resultados agregados após o encerramento da enquete.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6a96a87699625dc6:
    english: 'They cannot use application features to see:'
    translation: 'Eles não podem usar os recursos do aplicativo para ver:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dd4756253d1ee6dc:
    english: |-
      - which selections belong to a person;
      - individual votes or voting patterns;
      - when a particular vote was submitted; or
      - a reason, attachment, event, or notification associated with a submitted vote.
    translation: |-
      - quais opções uma pessoa selecionou;
      - votos individuais ou padrões de votação;
      - quando um voto específico foi enviado; ou
      - uma justificativa, anexo, evento ou notificação associados a um voto enviado.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c350875c33492237:
    english: "## Limits of anonymous voting"
    translation: "## Limites da votação anônima"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  48d04d7b4817e710:
    english: These protections prevent application users from linking a submitted vote to its voter. They are not a cryptographic protection against an operator who can inspect the database, backups, server logs, process memory, network traffic, or a modified version of the application.
    translation: Essas proteções impedem que usuários do aplicativo associem um voto enviado à pessoa que votou. Elas não oferecem proteção criptográfica contra um operador que possa examinar o banco de dados, cópias de segurança, registros do servidor, memória dos processos, tráfego de rede ou uma versão modificada do aplicativo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f901f505362e46b4:
    english: The result itself may also reveal information. A small electorate, a unanimous result, a distinctive combination of selections, or information shared outside the poll can make a person's choices easier to infer. Voters may also choose to identify themselves in discussion outside their submitted vote.
    translation: O próprio resultado também pode revelar informações. Quando poucas pessoas têm direito a voto, o resultado é unânime, há uma combinação incomum de escolhas ou informações são compartilhadas fora da enquete, pode ser mais fácil deduzir as escolhas de uma pessoa. Quem votou também pode optar por se identificar em uma discussão fora do voto enviado.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dfe97db86db52d15:
    english: Consider the size of the electorate and the sensitivity of the decision when deciding whether application-level anonymous voting is suitable.
    translation: Considere o número de pessoas aptas a votar e a sensibilidade da decisão ao avaliar se a votação anônima oferecida pelo aplicativo é adequada.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  60cc6f1a0163ec5d:
    english: "## Questions"
    translation: "## Perguntas"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  57615f2c4c040dce:
    english: "### Can a coordinator see how I voted?"
    translation: "### Um coordenador pode ver como votei?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9dc1d151cc90e94e:
    english: No. Once at least three people have voted, a coordinator can verify whether you voted but cannot connect you with a submitted vote through the application. Below that threshold, your participation status remains hidden.
    translation: Não. Depois que pelo menos três pessoas votam, um coordenador pode verificar se você votou, mas não pode associar você a um voto enviado pelo aplicativo. Antes disso, seu status de participação permanece oculto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b3b382d2575b715d:
    english: "### Can I see my vote after submitting it?"
    translation: "### Posso ver meu voto depois de enviá-lo?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  52aaaa1c764d5745:
    english: No. The application confirms that your vote was recorded, then discards the selections from the voting interface. It cannot retrieve your vote without creating the link that anonymous voting is designed to avoid.
    translation: Não. O aplicativo confirma que seu voto foi registrado e, em seguida, remove suas escolhas da interface de votação. Ele não pode recuperar seu voto sem criar a ligação que a votação anônima procura evitar.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  071dd89d6eb38ebf:
    english: "### Can I change or withdraw my vote?"
    translation: "### Posso alterar ou retirar meu voto?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '059b75c51b4225ab':
    english: No. There is no link that would let the application identify which submitted vote to change or remove.
    translation: Não. Não existe uma ligação que permita ao aplicativo identificar qual voto enviado deve ser alterado ou removido.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c94077837455425f:
    english: "### Will I receive an email confirming my vote?"
    translation: "### Vou receber um e-mail confirmando meu voto?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f36a8b43a3fdee36:
    english: No. Voting creates only the on-screen acknowledgement and updates your participation record. It does not send a confirmation email or create a notification or activity event.
    translation: Não. A votação apenas exibe uma confirmação na tela e atualiza seu registro de participação. Ela não envia um e-mail de confirmação nem cria uma notificação ou um registro de atividade.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f320754cf7ee77bc:
    english: "### Does a public poll reveal more information?"
    translation: "### Uma enquete pública revela mais informações?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f84121f0c18e03ab:
    english: Public access may allow people to see the poll and its aggregate results after it closes. It does not expose the named participation records or individual anonymous votes.
    translation: O acesso público pode permitir que as pessoas vejam a enquete e seus resultados agregados após o encerramento. Ele não expõe os registros de participação com nomes nem os votos anônimos individuais.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e2dbe0c181f865ca:
    english: "### Is anonymous voting suitable for every election?"
    translation: "### A votação anônima é adequada para todas as eleições?"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  05fc871619a2170d:
    english: No. It provides application-level separation between identities and votes. Decisions requiring protection from system operators or independently verifiable cryptographic elections need a system designed for those requirements.
    translation: Não. Ela separa as identidades dos votos dentro do aplicativo. Decisões que exigem proteção contra operadores do sistema ou eleições criptográficas verificáveis de forma independente precisam de um sistema projetado para esses requisitos.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
