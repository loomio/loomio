navigation_title: Обсуждения
blocks:
  f087c06a5f4ab2e6:
    english: "# Intro to Discussions"
    translation: "# Введение в обсуждения"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f515c87a8d1d20c7:
    english: Loomio discussions are where you can share information, discuss topics, and make decisions with your group.  People participate by posting comments and replies.
    translation: В обсуждениях Loomio вы можете делиться информацией, обсуждать темы и принимать решения вместе с группой. Участники оставляют комментарии и отвечают друг другу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  eede89b6ce4f357d:
    english: |-
      - All info about a topic is in one easily accessible place.
      - People can reply via email and their comments appear in the discussion.
      - You can see who has read the discussion and who needs a nudge.
      - There is a record of discussion you can easily find again.
    translation: |-
      - Вся информация по теме находится в одном месте, где её легко найти.
      - Участники могут отвечать по электронной почте, и их сообщения появятся в обсуждении.
      - Вы можете видеть, кто прочитал обсуждение, а кому стоит напомнить о нём.
      - Запись обсуждения легко найти позже.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9cb2eb404b59208b:
    english: Discussions have a wide range of uses - from a general discussion forum to running specific work-flow and decision-making processes.
    translation: 'Обсуждения подходят для разных задач: от общего обмена мнениями до организации работы и принятия решений.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  87a95605052570ca:
    english: For example, you may frame a discussion on a particular topic, invite people to contribute their thoughts and share information, and facilitate progress towards an agreed outcome.
    translation: Например, вы можете начать обсуждение определённой темы, пригласить участников поделиться мыслями и информацией и помочь группе прийти к согласованному решению.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ce6e6734c595d968:
    english: Or you may invite people to participate in a particular decision, using a consent or advice decision-making process.
    translation: Также вы можете пригласить участников принять конкретное решение методом согласия или с учётом их советов.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7fa58cb3ba95be0b:
    english: Discussions can also contain polls and proposals to help progress a discussion to an outcome. As people comment in the discussion and vote in polls, a discussion timeline builds so you can easily find key milestones.
    translation: В обсуждение можно добавить голосования и предложения, чтобы помочь группе прийти к решению. Из комментариев и голосов складывается хронология обсуждения, в которой легко найти ключевые события.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  388e829e86a99bd8:
    english: "![The Returnable bottles for cafe customers discussion, with a comment and a proposal](discussion-example.png)"
    translation: "![Обсуждение возвратных бутылок для посетителей кафе с комментарием и предложением](discussion-example.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6b0556376d31b63e:
    english: "## Common uses"
    translation: "## Как используют обсуждения"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cf4344b3f2a3b7e9:
    english: 'Here are some common uses of discussions:'
    translation: 'Вот несколько распространённых способов использовать обсуждения:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '0479bd2337b02443':
    english: "### Boards and Governance"
    translation: "### Совет и управление организацией"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5b0a3e2c653d47f8:
    english: "**Prepare for a meeting** - Build an agenda, post board papers and organize administrative matters so everyone is up to date, in context and prepared. "
    translation: "**Подготовьтесь к встрече** - Составьте повестку, опубликуйте материалы совета и решите организационные вопросы. Так все будут знать контекст и смогут подготовиться."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5c1c6aa79c3556dc:
    english: "**Pass a resolution** - Post context and background information, respond to questions and raise a proposal to pass a resolution. "
    translation: "**Принять резолюцию** - Опубликуйте контекст и справочную информацию, ответьте на вопросы и создайте предложение о принятии резолюции."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  07ae9c6a1f0a32d0:
    english: "**Discuss an agenda item on Loomio** - Start discussion about an agenda item prior to your meeting. Or, if you run out of time in the meeting, move the discussion on to Loomio."
    translation: "**Обсудить пункт повестки в Loomio** - Начните обсуждение пункта повестки до встречи. Если на встрече не хватит времени, продолжите обсуждение в Loomio."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f0b0de7094b1cfc9:
    english: "**Approve minutes and track actions** - Post minutes and assign actions. Use a poll to approve minutes. "
    translation: "**Утвердить протокол и отслеживать задачи** - Опубликуйте протокол и назначьте ответственных за задачи. Используйте голосование, чтобы утвердить протокол."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ba7cf177191baadb:
    english: "### Member participation"
    translation: "### Участие членов группы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3cf51f837c0a3e9f:
    english: "**Share news (replace mailing list)** - Post information for members, invite comments."
    translation: "**Делиться новостями вместо рассылки** - Публикуйте информацию для членов группы и приглашайте их оставлять комментарии."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d2cd391b61042129:
    english: "**Organize an event** - Work with your organizing team on details. Keep all discussion and info within the thread. Then announce the event to wider membership."
    translation: "**Организовать мероприятие** - Обсудите детали с командой организаторов. Сохраняйте всю информацию и переписку в одной теме. Затем сообщите о мероприятии остальным членам группы."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cf59a44a8643cc96:
    english: "**Develop a policy** - Post a policy draft, seek member feedback and input, finalize and ratify the policy."
    translation: "**Разработать правила** - Опубликуйте проект правил, соберите отзывы и предложения членов группы, доработайте и утвердите текст."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6ddec467576426ca:
    english: "**General Assembly** - Organize, prepare and run a formal meeting including all members, to deliberate and make decisions on strategic matters."
    translation: "**Общее собрание** - Организуйте и проведите официальное собрание всех членов группы для обсуждения стратегических вопросов и принятия решений."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8d32bb446c4ca025:
    english: "### Self-organizing working teams"
    translation: "### Самоорганизующиеся рабочие группы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  87ab6b2d51a7c1b6:
    english: "**Share information** - Post information and reports of interest to your team, invite comment and discussion."
    translation: "**Делиться информацией** - Публикуйте информацию и отчёты, полезные вашей команде, и приглашайте участников к обсуждению."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e93205aa183cd1e0:
    english: "**Progress work** - Outline a work task and seek advice, input and feedback from team members through to completion."
    translation: "**Продвигать работу** - Опишите задачу и собирайте советы, предложения и отзывы команды до её завершения."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1ddaef5d44653691:
    english: "**Meeting notes and actions** - Post meeting notes as a record of discussion, and follow up on tasks. "
    translation: "**Вести заметки со встреч и отслеживать задачи** - Публикуйте заметки, чтобы сохранить ход обсуждения, и следите за выполнением задач."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8ce9169d72c90788:
    english: "**Explore ideas** - Share thoughts and invite discussion about a concern you notice, or an improvement that can be made."
    translation: "**Исследовать идеи** - Делитесь мыслями и приглашайте команду обсудить замеченную проблему или возможное улучшение."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a06e734e86f07828:
    english: "**Advice, Consent and Generative decision making** - Prepare, propose, clarify, respond to reactions and objections, agree and implement - all within a Loomio discussion."
    translation: "**Принимать решения с учётом советов, согласия и новых идей** - Подготовьте и внесите предложение, проясните детали, ответьте на замечания и возражения, согласуйте решение и воплотите его в жизнь — всё в одном обсуждении Loomio."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
