---
navigation_title: Ваш профіль
blocks:
  7ac59f9506d9a9e9:
    english: "# Your Profile\nYour Loomio user profile is how people recognize you.  "
    translation: |-
      # Ваш профіль
      Па вашым профілі ў Loomio іншыя людзі пазнаюць вас.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f77b75330707f9a4:
    english: Being able to recognize people in Loomio helps build trust and authenticity, encouraging more genuine participation.  So wherever possible we encourage you to be you, and to add a photo or avatar.
    translation: Калі людзі могуць пазнаваць адно аднаго ў Loomio, ім лягчэй давяраць адно аднаму і ўдзельнічаць у абмеркаваннях. Таму, калі магчыма, укажыце сваё сапраўднае імя і дадайце фота або аватар.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e902d9db69f3ccaa:
    english: "## Edit profile"
    translation: "## Рэдагаваць профіль"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f48def44ceb36407:
    english: 'Your profile page lets you customize your Loomio identity. To visit your profile page select the **Edit profile** option in the user menu, which is found by clicking on your name at the top of the sidebar. '
    translation: На старонцы профілю вы можаце наладзіць, як вас бачаць у Loomio. Каб адкрыць яе, націсніце на сваё імя ўверсе бакавой панэлі і выберыце **Рэдагаваць профіль** у меню карыстальніка.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  456daa472d672b1f:
    english: If the sidebar is closed, click on the menu icon (**☰**) to open it.
    translation: Калі бакавая панэль закрыта, націсніце на значок меню (**☰**), каб адкрыць яе.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7b920b3794ac1be0:
    english: Click on the down arrow to the right of your name.
    translation: Націсніце на стрэлку ўніз справа ад вашага імя.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9664aeb8784b2137:
    english: Click on **Edit profile**
    translation: Націсніце **Рэдагаваць профіль**
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e98e7384d147ec31:
    english: "## Update your personal info"
    translation: "## Абнавіце асабістыя звесткі"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9578a723a8d322cc:
    english: 'You can update your personal info by changing any of the following fields:'
    translation: 'Вы можаце абнавіць асабістыя звесткі, змяніўшы любое з наступных палёў:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cc28d4b1038e6fe5:
    english: |-
      * **Name**
      * **Email address** - this is the email address associated with your Loomio account, and where you will receive notifications from Loomio.
      * **Username** - your username is a name people can recognize and alert you using @mention. It can contain lower case letters, numbers, underscores, and internal hyphens.
      * **Introduction** - a few lines to tell others in your group something about you.
      * **Location** - useful for distributed or remote groups so people can get an idea of where you are located.
    translation: |-
      * **Імя**
      * **Адрас электроннай пошты** — адрас, звязаны з вашым уліковым запісам Loomio. На яго прыходзяць апавяшчэнні ад Loomio.
      * **Імя карыстальніка** — імя, па якім людзі могуць пазнаць вас і звярнуцца да вас праз @згадку. Яно можа змяшчаць малыя літары, лічбы, знакі падкрэслівання і злучкі ўнутры імя.
      * **Уводзіны** — некалькі радкоў, каб расказаць людзям у вашай групе пра сябе.
      * **Месцазнаходжанне** — дапамагае людзям у групах, якія працуюць з розных месцаў, зразумець, дзе вы знаходзіцеся.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d64106bb76c8936e:
    english: "## Viewing another person's profile"
    translation: "## Прагляд профілю іншага чалавека"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fa6b7c980bad9aeb:
    english: Select a person's name or avatar to open their profile. Their recent discussions, comments, and polls are listed alongside their profile details and groups. The list only includes activity you have permission to access; signed-out visitors see public activity only.
    translation: Націсніце на імя або аватар чалавека, каб адкрыць яго профіль. Побач са звесткамі профілю і групамі паказаны нядаўнія абмеркаванні, каментары і апытанні гэтага чалавека. У спісе ёсць толькі тое, да чаго ў вас ёсць доступ. Людзі, якія не ўвайшлі ў сістэму, бачаць толькі публічную актыўнасць.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ac9abf23a4881216:
    english: "## Uploading a profile photo\nWhen you first create a Loomio account, your initials will be the default image associated with your profile. You can upload a profile photo by clicking on your picture on the profile page. "
    translation: |-
      ## Загрузіце фота профілю
      Пасля стварэння ўліковага запісу Loomio выява ў вашым профілі па змаўчанні будзе змяшчаць вашы ініцыялы. Каб загрузіць фота профілю, націсніце на сваю выяву на старонцы профілю.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b011f45bc197558a:
    english: If you have a [Gravatar](https://en.gravatar.com/) you can set that as your profile picture by selecting **Use Gravatar**. You can also choose for Loomio to use the photo you use for other common platforms/tools.
    translation: Калі ў вас ёсць [Gravatar](https://en.gravatar.com/), вы можаце ўсталяваць яго як выяву профілю, выбраўшы **Выкарыстоўвайце Gravatar**. Вы таксама можаце выбраць фота, якое выкарыстоўваеце на іншых распаўсюджаных платформах і ў сэрвісах.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  41f1c139f9a0822b:
    english: |-
      ## Language settings
      Loomio is developed in English, but [is translated by volunteers into many languages](https://www.loomio.com/g/cpaM3Hsv/loomio-community-translation).
    translation: |-
      ## Налады мовы
      Loomio распрацоўваецца на англійскай мове, але [валанцёры перакладаюць яго на шмат моў](https://www.loomio.com/g/cpaM3Hsv/loomio-community-translation).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9faad78d2b46c546:
    english: Loomio will detect your browser’s language settings, but you can manually set your preferred language from the available options on the profile page.
    translation: Loomio вызначае мову вашага браўзера. Вы таксама можаце самастойна выбраць патрэбную мову з даступных варыянтаў на старонцы профілю.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a224dd4aaaf81381:
    english: |-
      ## Resetting your password
      You can change your password by visiting your profile page and clicking **Reset Password**.
    translation: |-
      ## Скіньце пароль
      Каб змяніць пароль, адкрыйце старонку профілю і націсніце **Скінуць пароль**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5bfa3cd39abcafba:
    english: "## Merge accounts"
    translation: "## Аб'яднанне ўліковых запісаў"
    status: machine
