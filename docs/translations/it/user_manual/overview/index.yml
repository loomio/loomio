  ced10eda436a40ca:
    english: "## How people use Loomio"
    translation: "## Come viene usato Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4198817a2724ad0a:
    english: "**Member organizations** to involve members in decisions at scale. Political parties, consumer and worker co-operatives, and membership associations use Loomio to facilitate a safe, inclusive space for members to share information and raise topics, participate in important decisions and vote in General Assembly. Streamline decision processes, improve transparency and accountability, document discussions and record decisions, and include members' voices to organize for action."
    translation: "**Organizzazioni con membri** per coinvolgere molte persone nelle decisioni. Partiti politici, cooperative di consumo e di lavoro e associazioni usano Loomio per offrire ai membri uno spazio sicuro e inclusivo in cui condividere informazioni, proporre argomenti, partecipare alle decisioni importanti e votare in assemblea generale. Possono semplificare i processi decisionali, migliorare la trasparenza e la responsabilità, documentare discussioni e decisioni e includere le voci dei membri nell'organizzazione delle iniziative."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7b2fd1306e05f4e3:
    english: "**Self-managing organizations** to involve staff in decisions. Self-managing teams, worker co-operatives, and sociocratic organisations use Loomio to run consent, consensus, and advice-based decision processes across distributed teams and time zones. Tap into collective intelligence, distribute decision making, build governance and policy together, and document decisions and discussion."
    translation: "**Organizzazioni autogestite** per coinvolgere il personale nelle decisioni. Team autogestiti, cooperative di lavoro e organizzazioni sociocratiche usano Loomio per gestire processi decisionali basati sul consenso, sull'accordo generale e sui pareri, anche quando i team lavorano in luoghi e fusi orari diversi. Possono mettere a frutto le conoscenze collettive, distribuire le decisioni, definire insieme regole e modalità di gestione e documentare decisioni e discussioni."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  75d7266c562f65c2:
    english: "**Boards, councils, and distributed networks** to involve stakeholders in decisions. Create a safe space for discussion, keep track of communications, and coordinate across geographies and time zones. Structure decision making processes, improve agility and response times, and preserve organizational memory."
    translation: "**Consigli direttivi, consigli e reti distribuite** per coinvolgere le parti interessate nelle decisioni. Possono creare uno spazio sicuro per discutere, tenere traccia delle comunicazioni e coordinarsi tra luoghi e fusi orari diversi. Loomio aiuta a strutturare i processi decisionali, rispondere più rapidamente e conservare la memoria dell'organizzazione."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cbe5ae77738f2704:
    english: "**Residential communities and co-ops** to make decisions together as neighbours. Cohousing communities, ecovillages, coliving cooperatives, housing co-ops, and land trusts use Loomio to replace or augment traditional strata and property management with democratic governance. Residents shape decisions about shared land, common spaces, and community agreements, and asynchronous discussion means members can fully participate whether they're on-site or away travelling, keeping a clear record of how the community has chosen to live together."
    translation: "**Comunità residenziali e cooperative** per prendere decisioni insieme tra vicini. Comunità di cohousing, ecovillaggi, cooperative di coliving e di abitazione e organizzazioni che gestiscono terreni collettivi usano Loomio per sostituire o integrare la gestione tradizionale degli immobili con una gestione democratica. I residenti contribuiscono alle decisioni sui terreni condivisi, sugli spazi comuni e sugli accordi della comunità. Grazie alle discussioni asincrone, i membri possono partecipare anche quando sono in viaggio, mantenendo un resoconto chiaro di come la comunità ha scelto di vivere insieme."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fb1039083c952286:
    english: Loomio builds a living record of your organization; the decisions made, who was involved and the discussion leading up to the decision.
    translation: 'Loomio crea un archivio in continua evoluzione della tua organizzazione: le decisioni prese, le persone coinvolte e le discussioni che hanno portato a quelle decisioni.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
