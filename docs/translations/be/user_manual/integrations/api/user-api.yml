  f849f2ff41c98641:
    english: The `items` endpoint returns the ordered event stream, including visible comments, polls, votes, and outcomes. The `markdown` endpoint returns the complete visible thread as one Markdown document. Vote reasons are included only when they are visible to the API-key user.
