---
navigation_title: Підготовка
blocks:
  4fdd26e2ff6dd9e5:
    english: "# Preparation"
    translation: "# Підготовка"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4fc02624e97369e9:
    english: |-
      > <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../silvia_200.png"> For every minute of time with the group, consider spending 3 minutes planning. That means spending three hours preparing for a one hour session. Only as you improve should you spend less time planning.
      >
      > — Silvia Zuur
    translation: |-
      > <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../silvia_200.png"> На кожну хвилину роботи з групою спробуйте відвести три хвилини на планування. Це означає три години підготовки до одногодинної зустрічі. Скорочуйте час планування лише тоді, коли набудете досвіду.
      >
      > — Сільвія Зуур
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d18832ab8f94fa1b:
    english: "## Understand Purpose"
    translation: "## З’ясуйте мету"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  26d88950f0aac205:
    english: Clarification of purpose is one of the highest value offerings of a skilled facilitator — if they can help the group nail that, everything else is possible. Purpose operates at the level of a group as a whole, and at the level of individual discussions/decisions. Purpose is what enables judgment calls about what tools to deploy, what interventions to enact, and what outcomes to aim for. Lack of shared understanding about purpose can be fatal to a discussion, or to the group itself.
    translation: Допомогти групі чітко визначити мету — одне з найцінніших завдань досвідченого фасилітатора. Мету потрібно розуміти і на рівні всієї групи, і на рівні окремих обговорень та рішень. Вона допомагає вибрати інструменти, вирішити, коли втрутитися, і визначити бажаний результат. Якщо учасники по-різному розуміють мету, це може зашкодити обговоренню або навіть роботі групи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4276182ea8afaf36:
    english: "> Always refer back to your purpose-finding questions to check that you’re covering off what the participants want to learn or achieve. — Silvia Zuur"
    translation: "> Повертайтеся до запитань, які допомогли визначити мету. Так ви зможете перевірити, чи враховуєте те, чого учасники хочуть навчитися або досягти. — Сільвія Зуур"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aabfa9d842af2688:
    english: On Loomio
    translation: У Loomio
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ea5f19b8970e4db6:
    english: |-
      * The app offers space for explication of purpose, such as the [group description](/en/user_manual/groups/starting_a_group/#group-description) and [discussion context](/en/user_manual/discussions/using_discussions/#discussion-context) fields.
      * A Loomio discussion *about* purpose is a great place to start with your group, if it's not already clear.
      * Our analytics (stats about how people use the software) show that groups with a clear shared purpose are more successful.
      * [Customer stories and case studies](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help) we've collected emphasise the importance of setting a collective purpose.
    translation: |-
      * У застосунку є поля, де можна пояснити мету, зокрема [опис групи](/en/user_manual/groups/starting_a_group/#group-description) і [контекст обговорення](/en/user_manual/discussions/using_discussions/#discussion-context).
      * Якщо мета групи ще не зрозуміла, почніть з обговорення *самої мети* в Loomio.
      * За нашими даними про використання застосунку, групи зі спільною чіткою метою працюють успішніше.
      * Зібрані нами [історії користувачів і приклади з практики](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help) підкреслюють важливість спільної мети.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e7d962ee3ac4e476:
    english: "## Rearrange the Furniture"
    translation: "## Переставте меблі"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bee66f99abaa8e2a:
    english: Desiging the space you invite people into greatly influences their experience. Every gathering is unique, and deserves a setup to suit. Familiarity signals safety, while changing the environment cues openness to new ideas.
    translation: Те, як ви облаштуєте простір для учасників, значною мірою впливає на їхній досвід. Кожна зустріч особлива й потребує відповідних умов. Знайома обстановка дає відчуття безпеки, а її зміна спонукає до нових ідей.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b98fa9d3e5726891:
    english: In offline spaces, literally rearranging the furniture is a habit that helps facilitators get into the right zone to hold space, and prompts them to think about what’s unique in that session. Imagine the difference between everyone seated in rows versus everyone in a circle.
    translation: Під час очних зустрічей перестановка меблів допомагає фасилітаторам налаштуватися на роботу й подумати про особливості зустрічі. Уявіть різницю між учасниками, які сидять рядами, і тими, які сидять у колі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  546ba20d5778bb25:
    english: |-
      * Inviting people into a new digital space specifically for decision making is powerful — there’s a “threshold crossing” experience making it as distinct from other online spaces (which might be for socialising or other functions).
      * [Customising your group photo](/en/user_manual/groups/starting_a_group/#upload-a-group-photo) is a prime opportunity to craft the feeling of the space.
      * The group description is a main piece of “furniture” on the group page, and [you can customise it](/en/user_manual/groups/starting_a_group/#group-description) to suit.
    translation: |-
      * Запрошення до окремого цифрового простору для ухвалення рішень допомагає учасникам відчути перехід до спільної роботи. Такий простір відрізняється від інших онлайн-майданчиків, призначених, наприклад, для спілкування.
      * [Налаштування фото групи](/en/user_manual/groups/starting_a_group/#upload-a-group-photo) допомагає створити потрібну атмосферу.
      * Опис групи — важлива частина її сторінки. [Налаштуйте його](/en/user_manual/groups/starting_a_group/#group-description) відповідно до потреб групи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bb1d23808a93d41b:
    english: "## Supplies, Tools, Materials"
    translation: "## Приладдя, інструменти й матеріали"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b5e22b09672c3587:
    english: When facilitation is running smoothly, all the supplies a group needs are right at hand. In offline spaces, this stuff includes post-its, pens, paper, name tags, printouts, and background material. Every step a facilitator takes to be well-prepared in this way allows more time and energy for the work.
    translation: Коли фасилітація проходить добре, усе потрібне групі є під рукою. Під час очних зустрічей це можуть бути стікери, ручки, папір, бейджі, роздруківки та довідкові матеріали. Завчасна підготовка залишає більше часу й сил для самої роботи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7da21174f12dfb9e:
    english: |-
      * Many groups use the group description to link to a shared drive of collaborative documents, background information, the group's project management or task tracking system, a list of contacts, etc.
      * Each thread deserves consideration of what people might need to engage with it — putting all the information right at hand is essential (for example, if you reference something, linking directly to it is much more effective than expecting people to search for it).
    translation: |-
      * Багато груп додають до опису групи посилання на спільне сховище документів, довідкові матеріали, систему керування проєктами чи завданнями, список контактів тощо.
      * Для кожної теми подумайте, що знадобиться людям для участі. Розмістіть потрібну інформацію поруч: якщо згадуєте матеріал, дайте на нього пряме посилання, щоб людям не довелося його шукати.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  35dd82fcf7e543d8:
    english: "## Design the Experience"
    translation: "## Продумайте перебіг роботи"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fbc88dd9b9738343:
    english: 'Once they have the basic pieces in place (purpose, tools, background info), good facilitators take time to think through the design of the experience they are inviting: the situation, what success could look like, all the possible pathways and choices. They don’t jump in without a considered design.'
    translation: Визначивши мету, інструменти й довідкові матеріали, досвідчені фасилітатори продумують перебіг роботи, до якої запрошують людей. Вони враховують обставини, можливі ознаки успіху, шляхи розвитку подій і рішення, які доведеться ухвалювати. Вони не починають роботу без такого плану.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a4dce16ca48a4324:
    english: Time and time again we have seen people drastically underestimate the need for prep and design. Stop and think about the experience you want to host, before jumping straight in. Investment in design is paid back many times over by success later.
    translation: Ми знову й знову бачимо, як люди недооцінюють потребу в підготовці. Перш ніж почати, зупиніться й подумайте, який досвід хочете створити для учасників. Час, витрачений на планування, багаторазово окупиться згодом.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e91f002ee6e53550:
    english: "* Loomio’s most basic functionality follows the structure of good facilitation by design: invite people, discuss a topic, gather divergent input, converge into a specific proposal, test for agreement, confirm outcome."
    translation: "* Основні можливості Loomio побудовані за принципами належної фасилітації: запросити людей, обговорити тему, зібрати різні думки, сформулювати конкретну пропозицію, перевірити згоду й підтвердити висновок."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  211e08fc109e6449:
    english: |-
      * Skilled users are already adapting Loomio for various experience designs — such as a multi-step consultation processes, signing off documents, etc. Each job, when facilitated effectively, takes a certain repeatable shape.
      * Online collaboration design doesn't have to reinvent the wheel. Trust what you know works, and translate it. Many tried and tested offline processes can be adapted to the online space (ex: the [Advice Process](/en/guides/making_decisions/advice_process.html)).
      * [Case studies](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help) of thoughtfully designed processes could be used as “recipes” — if you're not sure what design to use, start by seeing what others have tried.
    translation: |-
      * Досвідчені користувачі вже пристосовують Loomio до різних форматів роботи, зокрема багатокрокових консультацій і погодження документів. За належної фасилітації кожен такий процес набуває форми, яку можна повторити.
      * Для онлайн-співпраці не обов’язково вигадувати процес із нуля. Використовуйте перевірені підходи. Багато процесів, випробуваних під час очної роботи, можна пристосувати до онлайн-простору, наприклад [процес порад](/en/guides/making_decisions/advice_process.html).
      * [Приклади з практики](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help) можуть стати зразками продуманих процесів. Якщо ви не знаєте, який формат вибрати, подивіться, що вже спробували інші.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7e99e2ddc63d7a98:
    english: "## Contextualise the Moment"
    translation: "## Врахуйте обставини"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  427b66f23f4b3c09:
    english: Discussions do not occur in a vacuum, but in the larger context of the group’s history and practice. To be effective, facilitated experiences have to occur with the right timing, and fit in with the rest of the group’s process.
    translation: Обговорення відбуваються в контексті історії та звичних способів роботи групи. Щоб фасилітація була дієвою, потрібно вибрати відповідний момент і узгодити її з рештою роботи групи.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  48a889b09297e38b:
    english: 'Key Context Questions:'
    translation: 'Основні запитання про контекст:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7eccc4a4e4a3b175:
    english: |-
      * Is this a moment of transition?
      * Is this an enhancement of existing practice?
      * Is this one of many concurrent processes, or a singular focus?
      * Are we here to solve a problem, or go deeper, wider, narrower?
    translation: |-
      * Це перехідний момент?
      * Це вдосконалення наявної практики?
      * Це один із багатьох одночасних процесів чи головне завдання групи?
      * Ми хочемо розв’язати проблему чи дослідити питання глибше, ширше або вужче?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c7c8ce0838a076cd:
    english: |-
      * Loomio groups nearly always have a “champion”, who understands the group’s context and makes the call about whether introducing Loomio is right for them.
      * It's not wise to try to change everything at once. Any time Loomio fits nicely into existing workflows, groups will adopt it better.
      * Good timing is when the group is ready to incorporate online collaborative practice effectively. They have to feel the pain of not having the online decision-making space, and be motivated to solve that problem.
      * Consider the group’s attention economy to determine when the right time to raise a given topic might be. Collective attention is a limited resource.
      * Many groups are not even cognisant of their existing collaborative practice and habits, much less clear about how Loomio might fit in. Start with a discussion about the current way of doing things, and what's working or not working.
    translation: |-
      * Майже в кожній групі Loomio є людина, яка добре розуміє її обставини й вирішує, чи варто запропонувати групі Loomio.
      * Не намагайтеся змінити все одразу. Групам легше почати користуватися Loomio, коли він вписується в їхні звичні робочі процеси.
      * Відповідний момент настає, коли група готова до дієвої онлайн-співпраці. Учасники мають відчувати потребу в просторі для ухвалення рішень онлайн і хотіти її задовольнити.
      * Враховуйте, скільки уваги група може приділити темі, коли вибираєте момент для її порушення. Спільна увага — обмежений ресурс.
      * Багато груп не усвідомлюють власних звичок спільної роботи й тим паче не знають, як до них може вписатися Loomio. Почніть з обговорення того, як група працює зараз і що вдається або не вдається.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7bc2616a0ec0b1dc:
    english: "## The Role of the Facilitator"
    translation: "## Роль фасилітатора"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c6d08854a875262a:
    english: Good facilitation requires self-awareness on an individual and collective level. Lack of understanding of the role can lead to misunderstandings, conflict, or unsafe situations.
    translation: Для належної фасилітації потрібно усвідомлювати свою роль і розуміти, як її сприймає група. Нерозуміння цієї ролі може призвести до непорозумінь, конфліктів або небезпечних ситуацій.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aa59e3e4d08a95b7:
    english: "> Have the power handed over to you. When you’re invited into a new group or organization, everybody will be thinking: Who’s this joker? Why should we listen to them? Get somebody who the participants know and trust to introduce you. This builds you up in the participants' minds and helps to hand over the power over to you. — Silvia Zuur"
    translation: "> Подбайте, щоб вам передали повноваження. Коли вас запрошують до нової групи чи організації, люди можуть думати: «Хто це? Чому ми маємо слухати цю людину?» Попросіть когось, кого учасники знають і кому довіряють, представити вас. Це допоможе їм прийняти вас у ролі фасилітатора й передати вам потрібні повноваження. — Сільвія Зуур"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  02d38d1def45d150:
    english: |-
      ### Consent
      It’s critical that the group consents to be facilitated. Attempting to facilitate otherwise can be at worst coercive (unfair to the group) and dangerous (unfair to the facilitator) — and will face resistance and confusion. Facilitators put themselves in a vulnerable position; they must have mandate or they should not agree to engage. Consent is critical for both the facilitator and participants.
    translation: |-
      ### Згода
      Важливо, щоб група погодилася на фасилітацію. Без такої згоди спроба фасилітації може сприйматися як примус щодо групи й становити небезпеку для фасилітатора. Вона також викличе опір і нерозуміння. Фасилітатори опиняються у вразливому становищі, тому їм потрібні повноваження від групи. Без них не варто братися за цю роботу. Згода важлива і для фасилітатора, і для учасників.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a1a8c6ca89dad49a:
    english: |-
      ### Responsibility
      Once a facilitator takes up a mandate, they carry enhanced responsibilities. Facilitators have more claim to floor time, and directing the group’s attention. This has to be used in service to the whole, not for a personal agenda. The words and demeanor of the facilitator will also have a disproportionate effect, meaning they have to act with heightened consideration.
    translation: |-
      ### Відповідальність
      Прийнявши повноваження, фасилітатор бере на себе додаткову відповідальність. Він може частіше брати слово й спрямовувати увагу групи. Ці можливості слід використовувати в інтересах усієї групи, а не для просування власних цілей. Слова й поведінка фасилітатора мають особливий вплив, тому діяти потрібно уважно.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b5f6b4ebd477c97c:
    english: |-
      ### Power
      Facilitation by nature introduces power differentials. If the facilitator cannot exercise power in certain ways, they cannot do their job. For example, to keep a discussion on topic the facilitator might interrupt someone, or say that a certain way of interacting is not OK. It’s not appropriate to expect a facilitator to shoulder responsibility for the experience without giving them the powers they need to deliver successfully. There is no one right answer about how much power, but it has to be balanced with the level of responsibility.
    translation: |-
      ### Повноваження
      Фасилітація за своєю природою створює відмінності в повноваженнях. Без можливості скористатися певними повноваженнями фасилітатор не зможе виконати свою роботу. Наприклад, щоб повернути обговорення до теми, йому може знадобитися перервати когось або сказати, що певний спосіб взаємодії неприйнятний. Не можна покладати на фасилітатора відповідальність за перебіг роботи, не надавши потрібних повноважень. Єдиного правильного обсягу повноважень немає, але він має відповідати рівню відповідальності.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c82df3fe42db014a:
    english: |-
      ### Responsiveness
      Facilitators do their best work when they can adapt effectively to the emergent reality. Human beings are endlessly complex, and groups of them exponentially more so. Rigid adherence to a plan or protocol without flexibility can set the group up to fail. If a facilitator is not allowed or not willing to adapt to changing circumstance, they cannot effectively hold the space for dynamic humans.
    translation: |-
      ### Гнучкість
      Фасилітатори працюють найкраще, коли можуть пристосовуватися до обставин, що виникають. Люди складні, а взаємодія в групі ще складніша. Суворе дотримання плану чи правил без гнучкості може завадити групі досягти мети. Якщо фасилітатор не може або не хоче реагувати на зміни, йому буде важко підтримувати простір для живої взаємодії.
