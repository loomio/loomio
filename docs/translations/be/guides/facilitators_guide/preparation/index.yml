---
navigation_title: Падрыхтоўка
blocks:
  4fdd26e2ff6dd9e5:
    english: "# Preparation"
    translation: "# Падрыхтоўка"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4fc02624e97369e9:
    english: |-
      > <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../silvia_200.png"> For every minute of time with the group, consider spending 3 minutes planning. That means spending three hours preparing for a one hour session. Only as you improve should you spend less time planning.
      >
      > — Silvia Zuur
    translation: |-
      > <img style="border-radius: 100%; float: right; margin-left: 0.5em; max-width: 96px; " src="../silvia_200.png"> На кожную хвіліну працы з групай варта адвесці тры хвіліны на планаванне. Гэта азначае тры гадзіны падрыхтоўкі да гадзіннай сустрэчы. Скарачаць час на планаванне варта толькі з ростам досведу.
      >
      > — Сільвія Зуур
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  d18832ab8f94fa1b:
    english: "## Understand Purpose"
    translation: "## Зразумейце мэту"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  26d88950f0aac205:
    english: Clarification of purpose is one of the highest value offerings of a skilled facilitator — if they can help the group nail that, everything else is possible. Purpose operates at the level of a group as a whole, and at the level of individual discussions/decisions. Purpose is what enables judgment calls about what tools to deploy, what interventions to enact, and what outcomes to aim for. Lack of shared understanding about purpose can be fatal to a discussion, or to the group itself.
    translation: Дапамога групе ў вызначэнні мэты — адна з найважнейшых задач фасілітацыі. Калі мэта ясная, лягчэй вырашаць астатнія пытанні. Мэта ёсць і ў групы ў цэлым, і ў асобных абмеркаванняў ды рашэнняў. Яна дапамагае выбіраць інструменты, вызначаць патрэбныя дзеянні і разумець, да якіх высноў імкнуцца. Без агульнага разумення мэты абмеркаванне ці нават праца групы могуць зайсці ў тупік.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  4276182ea8afaf36:
    english: "> Always refer back to your purpose-finding questions to check that you’re covering off what the participants want to learn or achieve. — Silvia Zuur"
    translation: "> Вяртайцеся да пытанняў, якія дапамаглі вызначыць мэту. Так вы зможаце праверыць, ці ўлічваеце тое, што ўдзельнікі хочуць даведацца або чаго дасягнуць. — Сільвія Зуур"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aabfa9d842af2688:
    english: On Loomio
    translation: У Loomio
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ea5f19b8970e4db6:
    english: |-
      * The app offers space for explication of purpose, such as the [group description](/en/user_manual/groups/starting_a_group/#group-description) and [discussion context](/en/user_manual/discussions/using_discussions/#discussion-context) fields.
      * A Loomio discussion *about* purpose is a great place to start with your group, if it's not already clear.
      * Our analytics (stats about how people use the software) show that groups with a clear shared purpose are more successful.
      * [Customer stories and case studies](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help) we've collected emphasise the importance of setting a collective purpose.
    translation: |-
      * У праграме ёсць месцы, дзе можна растлумачыць мэту: палі [апісання групы](/en/user_manual/groups/starting_a_group/#group-description) і [кантэксту абмеркавання](/en/user_manual/discussions/using_discussions/#discussion-context).
      * Калі мэта групы пакуль не ясная, пачніце з абмеркавання *самой мэты* ў Loomio.
      * Паводле нашай аналітыкі выкарыстання праграмы, групы з яснай агульнай мэтай часцей дасягаюць поспеху.
      * Сабраныя намі [гісторыі карыстальнікаў і прыклады з практыкі](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help) таксама падкрэсліваюць важнасць агульнай мэты.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e7d962ee3ac4e476:
    english: "## Rearrange the Furniture"
    translation: "## Перастаўце мэблю"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bee66f99abaa8e2a:
    english: Desiging the space you invite people into greatly influences their experience. Every gathering is unique, and deserves a setup to suit. Familiarity signals safety, while changing the environment cues openness to new ideas.
    translation: Арганізацыя прасторы, у якую вы запрашаеце людзей, моцна ўплывае на іх досвед. Кожная сустрэча мае свае асаблівасці, таму прастору варта падрыхтаваць адпаведна. Знаёмае асяроддзе дае адчуванне бяспекі, а змены ў ім дапамагаюць адкрыцца новым ідэям.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b98fa9d3e5726891:
    english: In offline spaces, literally rearranging the furniture is a habit that helps facilitators get into the right zone to hold space, and prompts them to think about what’s unique in that session. Imagine the difference between everyone seated in rows versus everyone in a circle.
    translation: Падчас асабістых сустрэч фасілітатары могуць літаральна перастаўляць мэблю. Гэта дапамагае падрыхтавацца да працы з групай і падумаць, чым адметная сустрэча. Уявіце розніцу паміж размяшчэннем людзей радамі і па крузе.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  546ba20d5778bb25:
    english: |-
      * Inviting people into a new digital space specifically for decision making is powerful — there’s a “threshold crossing” experience making it as distinct from other online spaces (which might be for socialising or other functions).
      * [Customising your group photo](/en/user_manual/groups/starting_a_group/#upload-a-group-photo) is a prime opportunity to craft the feeling of the space.
      * The group description is a main piece of “furniture” on the group page, and [you can customise it](/en/user_manual/groups/starting_a_group/#group-description) to suit.
    translation: |-
      * Запрашэнне людзей у асобную лічбавую прастору для прыняцця рашэнняў дапамагае аддзяліць гэтую працу ад іншых заняткаў у інтэрнэце, напрыклад нефармальных зносін.
      * [Наладзьце фота групы](/en/user_manual/groups/starting_a_group/#upload-a-group-photo), каб стварыць патрэбную атмасферу.
      * Апісанне групы — важная частка яе старонкі. [Адаптуйце яго](/en/user_manual/groups/starting_a_group/#group-description) да патрэб групы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  bb1d23808a93d41b:
    english: "## Supplies, Tools, Materials"
    translation: "## Прылады і матэрыялы"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b5e22b09672c3587:
    english: When facilitation is running smoothly, all the supplies a group needs are right at hand. In offline spaces, this stuff includes post-its, pens, paper, name tags, printouts, and background material. Every step a facilitator takes to be well-prepared in this way allows more time and energy for the work.
    translation: Калі праца з групай ідзе зладжана, усё патрэбнае знаходзіцца пад рукой. Падчас асабістых сустрэч гэта могуць быць стыкеры, ручкі, папера, бэйджы, раздрукоўкі і даведачныя матэрыялы. Добрая падрыхтоўка пакідае больш часу і сіл для самой працы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7da21174f12dfb9e:
    english: |-
      * Many groups use the group description to link to a shared drive of collaborative documents, background information, the group's project management or task tracking system, a list of contacts, etc.
      * Each thread deserves consideration of what people might need to engage with it — putting all the information right at hand is essential (for example, if you reference something, linking directly to it is much more effective than expecting people to search for it).
    translation: |-
      * Многія групы размяшчаюць у апісанні спасылкі на супольнае сховішча дакументаў, даведачную інфармацыю, сістэму кіравання праектамі ці задачамі, спіс кантактаў і іншыя рэсурсы.
      * Для кожнай ніткі варта падумаць, што спатрэбіцца людзям для ўдзелу. Размясціце патрэбную інфармацыю побач. Напрыклад, калі вы згадваеце матэрыял, дайце прамую спасылку, каб людзям не давялося яго шукаць.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  35dd82fcf7e543d8:
    english: "## Design the Experience"
    translation: "## Сплануйце ўдзел людзей"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fbc88dd9b9738343:
    english: 'Once they have the basic pieces in place (purpose, tools, background info), good facilitators take time to think through the design of the experience they are inviting: the situation, what success could look like, all the possible pathways and choices. They don’t jump in without a considered design.'
    translation: Калі мэта, інструменты і даведачная інфармацыя вызначаныя, варта прадумаць, як будзе праходзіць праца. Улічыце сітуацыю, магчымыя вынікі, шляхі і выбары. Не пачынайце працу без такога плана.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a4dce16ca48a4324:
    english: Time and time again we have seen people drastically underestimate the need for prep and design. Stop and think about the experience you want to host, before jumping straight in. Investment in design is paid back many times over by success later.
    translation: Мы не раз бачылі, як людзі недаацэньвалі патрэбу ў падрыхтоўцы і планаванні. Перш чым пачаць, падумайце, які досвед хочаце стварыць для ўдзельнікаў. Час, укладзены ў планаванне, пазней акупіцца.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e91f002ee6e53550:
    english: "* Loomio’s most basic functionality follows the structure of good facilitation by design: invite people, discuss a topic, gather divergent input, converge into a specific proposal, test for agreement, confirm outcome."
    translation: "* Асноўныя магчымасці Loomio падтрымліваюць паслядоўнасць добрай фасілітацыі: запрасіць людзей, абмеркаваць тэму, сабраць розныя меркаванні, сфармуляваць канкрэтную прапанову, праверыць згоду і пацвердзіць выснову."
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  211e08fc109e6449:
    english: |-
      * Skilled users are already adapting Loomio for various experience designs — such as a multi-step consultation processes, signing off documents, etc. Each job, when facilitated effectively, takes a certain repeatable shape.
      * Online collaboration design doesn't have to reinvent the wheel. Trust what you know works, and translate it. Many tried and tested offline processes can be adapted to the online space (ex: the [Advice Process](/en/guides/making_decisions/advice_process.html)).
      * [Case studies](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help) of thoughtfully designed processes could be used as “recipes” — if you're not sure what design to use, start by seeing what others have tried.
    translation: |-
      * Дасведчаныя карыстальнікі ўжо адаптуюць Loomio для розных працэсаў: шматэтапных кансультацый, узгаднення дакументаў і іншых задач. Пры добрай фасілітацыі кожны такі працэс набывае форму, якую можна паўтарыць.
      * Пры планаванні супольнай працы ў інтэрнэце можна абапірацца на вядомыя падыходы. Многія правераныя працэсы асабістай працы можна адаптаваць для інтэрнэту, напрыклад [працэс парад](/en/guides/making_decisions/advice_process.html).
      * [Прыклады з практыкі](https://blog.loomio.com/?utm_campaign=facilitators_guide_help&utm_term=help) могуць служыць узорамі прадуманых працэсаў. Калі вы не ведаеце, які падыход выбраць, паглядзіце, што ўжо спрабавалі іншыя.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7e99e2ddc63d7a98:
    english: "## Contextualise the Moment"
    translation: "## Улічыце кантэкст"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  427b66f23f4b3c09:
    english: Discussions do not occur in a vacuum, but in the larger context of the group’s history and practice. To be effective, facilitated experiences have to occur with the right timing, and fit in with the rest of the group’s process.
    translation: Абмеркаванні адбываюцца ў кантэксце гісторыі і звыклай працы групы. Каб фасілітацыя была карыснай, трэба выбраць слушны момант і ўпісаць яе ў астатнія працэсы групы.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  48a889b09297e38b:
    english: 'Key Context Questions:'
    translation: 'Асноўныя пытанні пра кантэкст:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7eccc4a4e4a3b175:
    english: |-
      * Is this a moment of transition?
      * Is this an enhancement of existing practice?
      * Is this one of many concurrent processes, or a singular focus?
      * Are we here to solve a problem, or go deeper, wider, narrower?
    translation: |-
      * Ці перажывае група пераходны перыяд?
      * Ці ўдасканальвае гэта існуючую практыку?
      * Гэта адзін з некалькіх адначасовых працэсаў ці галоўная ўвага групы цяпер накіравана на яго?
      * Мы хочам вырашыць праблему ці разгледзець пытанне глыбей, шырэй або вузей?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c7c8ce0838a076cd:
    english: |-
      * Loomio groups nearly always have a “champion”, who understands the group’s context and makes the call about whether introducing Loomio is right for them.
      * It's not wise to try to change everything at once. Any time Loomio fits nicely into existing workflows, groups will adopt it better.
      * Good timing is when the group is ready to incorporate online collaborative practice effectively. They have to feel the pain of not having the online decision-making space, and be motivated to solve that problem.
      * Consider the group’s attention economy to determine when the right time to raise a given topic might be. Collective attention is a limited resource.
      * Many groups are not even cognisant of their existing collaborative practice and habits, much less clear about how Loomio might fit in. Start with a discussion about the current way of doing things, and what's working or not working.
    translation: |-
      * Амаль у кожнай групе Loomio ёсць людзі, якія добра разумеюць яе кантэкст і могуць вырашыць, ці падыходзіць ёй Loomio.
      * Не варта спрабаваць змяніць усё адразу. Групам лягчэй пачаць карыстацца Loomio, калі ён упісваецца ў існуючы парадак працы.
      * Слушны момант надыходзіць, калі група гатовая да супольнай працы ў інтэрнэце. Людзі павінны бачыць патрэбу ў прасторы для прыняцця рашэнняў і жадаць вырашыць гэтую задачу.
      * Выбіраючы час для новай тэмы, улічвайце, колькі ўвагі група можа ёй аддаць. Агульная ўвага абмежаваная.
      * Многія групы не заўважаюць уласных звычак супольнай працы і таму не ведаюць, як у іх можа ўпісацца Loomio. Пачніце з абмеркавання таго, як група працуе цяпер і што атрымліваецца добра, а што не.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  7bc2616a0ec0b1dc:
    english: "## The Role of the Facilitator"
    translation: "## Роля фасілітатараў"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  c6d08854a875262a:
    english: Good facilitation requires self-awareness on an individual and collective level. Lack of understanding of the role can lead to misunderstandings, conflict, or unsafe situations.
    translation: Добрая фасілітацыя патрабуе ўсведамлення ўласных дзеянняў і працэсаў у групе. Калі роля фасілітатараў не ясная, могуць узнікнуць непаразуменні, канфлікты ці небяспечныя сітуацыі.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  aa59e3e4d08a95b7:
    english: "> Have the power handed over to you. When you’re invited into a new group or organization, everybody will be thinking: Who’s this joker? Why should we listen to them? Get somebody who the participants know and trust to introduce you. This builds you up in the participants' minds and helps to hand over the power over to you. — Silvia Zuur"
    translation: "> Папрасіце групу перадаць вам паўнамоцтвы. Калі вас запрашаюць у новую групу ці арганізацыю, людзі могуць думаць: «Хто гэта? Чаму мы павінны слухаць?» Папрасіце знаёмых удзельнікам людзей, якім яны давяраюць, прадставіць вас. Гэта дапаможа ўдзельнікам прыняць вашу ролю і перадаць вам патрэбныя паўнамоцтвы. — Сільвія Зуур"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  02d38d1def45d150:
    english: |-
      ### Consent
      It’s critical that the group consents to be facilitated. Attempting to facilitate otherwise can be at worst coercive (unfair to the group) and dangerous (unfair to the facilitator) — and will face resistance and confusion. Facilitators put themselves in a vulnerable position; they must have mandate or they should not agree to engage. Consent is critical for both the facilitator and participants.
    translation: |-
      ### Згода
      Важна, каб група пагадзілася на фасілітацыю. Без згоды такая праца можа стаць прымусовай і несправядлівай да групы, а таксама небяспечнай для тых, хто яе фасілітуе. Яна выкліча супраціў і неразуменне. Фасілітатары апынаюцца ва ўразлівым становішчы, таму ім патрэбныя паўнамоцтвы ад групы. Без іх не варта брацца за працу. Згода важная і для фасілітатараў, і для ўдзельнікаў.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a1a8c6ca89dad49a:
    english: |-
      ### Responsibility
      Once a facilitator takes up a mandate, they carry enhanced responsibilities. Facilitators have more claim to floor time, and directing the group’s attention. This has to be used in service to the whole, not for a personal agenda. The words and demeanor of the facilitator will also have a disproportionate effect, meaning they have to act with heightened consideration.
    translation: |-
      ### Адказнасць
      Атрымаўшы паўнамоцтвы, фасілітатары бяруць на сябе дадатковую адказнасць. Яны могуць часцей браць слова і скіроўваць увагу групы. Гэтыя магчымасці трэба выкарыстоўваць у інтарэсах усёй групы, а не дзеля ўласных мэт. Іх словы і паводзіны маюць асабліва моцны ўплыў, таму дзейнічаць трэба абачліва.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b5f6b4ebd477c97c:
    english: |-
      ### Power
      Facilitation by nature introduces power differentials. If the facilitator cannot exercise power in certain ways, they cannot do their job. For example, to keep a discussion on topic the facilitator might interrupt someone, or say that a certain way of interacting is not OK. It’s not appropriate to expect a facilitator to shoulder responsibility for the experience without giving them the powers they need to deliver successfully. There is no one right answer about how much power, but it has to be balanced with the level of responsibility.
    translation: |-
      ### Паўнамоцтвы
      Фасілітацыя непазбежна стварае розніцу ў паўнамоцтвах. Без магчымасці карыстацца імі фасілітатары не змогуць выконваць сваю працу. Напрыклад, каб утрымаць абмеркаванне ў межах тэмы, можа спатрэбіцца перапыніць выступ або сказаць, што пэўны спосаб зносін непрымальны. Нельга ўскладаць на фасілітатараў адказнасць за працэс, не даючы ім неабходных паўнамоцтваў. Адзінага правільнага аб'ёму паўнамоцтваў няма, але ён павінен адпавядаць адказнасці.
    status: machine
    provider: codex/gpt-6-sol
