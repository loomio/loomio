---
navigation_title: Kerää yksityisiä hakemuksia
blocks:
  c4a53a596a037fc0:
    english: "# Collect private submissions"
    translation: "# Kerää yksityisiä hakemuksia"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b24abc6bf93b1c0f:
    english: Use a Closed group to collect private submissions from people who are not members of the group. Each submission becomes a separate discussion that the submitter and the group's review team can use to exchange information, ask questions, and record a decision. Submitters cannot see other private discussions or submissions in the group.
    translation: Käytä suljettua ryhmää, kun haluat kerätä yksityisiä hakemuksia ihmisiltä, jotka eivät ole ryhmän jäseniä. Jokaisesta hakemuksesta syntyy oma keskustelu. Hakemuksen lähettäjä ja ryhmän arvioijat voivat vaihtaa siinä tietoja, esittää kysymyksiä ja kirjata päätöksen. Lähettäjät eivät näe ryhmän muita yksityisiä keskusteluja tai hakemuksia.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  feb5105698bca188:
    english: Nominations are a clear use case when candidate details or the list of nominees must remain private during selection. A person can nominate themselves or someone else for an election, appointment, committee, board, or representative role, while a selection panel reviews each nomination in its own discussion.
    translation: Ehdokasasettelu sopii tähän, kun ehdokkaiden tietojen tai nimettyjen ehdokkaiden luettelon täytyy pysyä yksityisenä valinnan aikana. Henkilö voi ehdottaa itseään tai jotakuta muuta vaaleihin, nimitykseen, toimikuntaan, hallitukseen tai edustajaksi. Valintaryhmä käsittelee jokaisen ehdotuksen omassa keskustelussaan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a64597508a4f7f3d:
    english: 'Other suitable purposes where submissions should not be public include:'
    translation: 'Muita tilanteita, joissa lähetettyjen tietojen ei pidä olla julkisia:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e4bd382899a8e7d9:
    english: |-
      - Complaints, safeguarding reports, safety concerns, and incident reports
      - Appeals and requests to reconsider a decision about an individual case
      - Requests for mediation, conflict resolution, or personal support
      - Applications containing personal, financial, or eligibility information, such as hardship grants or scholarships
      - Sealed bids or tender responses that must remain private during assessment
    translation: |-
      - Valitukset, ilmoitukset suojeluun liittyvistä huolista, turvallisuushuolet ja vaaratilanneilmoitukset
      - Muutoksenhaut ja pyynnöt harkita yksittäistä tapausta koskevaa päätöstä uudelleen
      - Pyynnöt sovittelusta, ristiriitojen ratkaisemisesta tai henkilökohtaisesta tuesta
      - Hakemukset, jotka sisältävät henkilökohtaisia tietoja, taloustietoja tai tietoja hakukelpoisuudesta, kuten avustusten tai apurahojen hakemukset
      - Suljetut tarjoukset ja tarjouskilpailujen vastaukset, joiden täytyy pysyä yksityisinä arvioinnin aikana
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  bab86da011a22a2a:
    english: This workflow is private between submitters, but it is not anonymous. Submitters need a user account, and every member of the Closed group can see the submissions. Consider who belongs to the review group before using it for sensitive information.
    translation: Lähettäjät eivät näe toistensa hakemuksia, mutta hakemuksia ei lähetetä nimettömästi. Lähettäjillä täytyy olla käyttäjätili, ja kaikki suljetun ryhmän jäsenet näkevät hakemukset. Mieti, ketkä kuuluvat arviointiryhmään, ennen kuin käytät tätä arkaluonteisten tietojen käsittelyyn.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b82ae8f3f04d257f:
    english: "## Enable private submissions"
    translation: "## Ota yksityiset hakemukset käyttöön"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0cebe3c5801844ce:
    english: You must be an admin of the group or subgroup where you want to collect submissions.
    translation: Sinun täytyy olla sen ryhmän tai alaryhmän ylläpitäjä, johon haluat kerätä hakemuksia.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  831d833d53a12ece:
    english: |-
      1. Open the group.
      2. Select **Settings** (or **More** and then **Edit group settings**).
      3. Open **Permissions**.
      4. Enable **Non-members can start discussions**.
      5. Save the group settings.
    translation: |-
      1. Avaa ryhmä.
      2. Valitse **asetukset** (tai **Lisää** ja sitten **Muokkaa ryhmän asetuksia**).
      3. Avaa **Käyttöoikeudet**.
      4. Ota käyttöön **Muutkin kuin jäsenet voivat aloittaa keskusteluja**.
      5. Tallenna ryhmän asetukset.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f3962a27b1c4ffa8:
    english: "![The Permissions tab in group settings, with Non-members can start discussions highlighted](non_members_can_start_discussions.png)"
    translation: "![Ryhmäasetusten Käyttöoikeudet-välilehti, jossa Muutkin kuin jäsenet voivat aloittaa keskusteluja on korostettu](non_members_can_start_discussions.png)"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  99ace15d10e78f33:
    english: This option is available only for **Open** and **Closed** groups. It is hidden for **Secret** groups. If you cannot see it, open **Privacy** in the group settings and change **Group privacy** to **Closed** (recommended for private submissions) or **Open**, then return to **Permissions**.
    translation: Tämä asetus on käytettävissä vain **Avoin**- ja **Suljettu**-ryhmissä. Se ei näy **Salainen**-ryhmissä. Jos et näe asetusta, avaa ryhmän asetuksista **Yksityisyys** ja vaihda **Ryhmän yksityisyys** -asetukseksi **Suljettu** (suositus yksityisille hakemuksille) tai **Avoin**. Palaa sitten kohtaan **Käyttöoikeudet**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  449517e6293a3acc:
    english: Enabling this permission does not make the group's discussions public. A non-member can start a new discussion and access that discussion as a guest, but cannot see the group's other private discussions.
    translation: Tämän käyttöoikeuden ottaminen käyttöön ei tee ryhmän keskusteluista julkisia. Ryhmään kuulumaton henkilö voi aloittaa uuden keskustelun ja osallistua siihen vieraana, mutta hän ei näe ryhmän muita yksityisiä keskusteluja.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  151f68a3f638fb67:
    english: "## Set up a private submission process"
    translation: "## Määritä yksityisten hakemusten käsittely"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ae924433d81f5eac:
    english: |-
      1. Create a dedicated subgroup for the submission process and set its privacy to **Closed**. A subgroup keeps the submissions separate from the parent group's other work.
      2. Add the selection panel or other people responsible for reviewing submissions as members of the subgroup. Every subgroup member can see every submission, so add only people who should have that access.
      3. Create a [discussion template](/en/user_manual/discussions/templates) in the subgroup. Include the questions and information submitters should provide. You can create different discussion templates for different kinds of submissions.
      4. If submitters should not request subgroup membership, set membership to **Invitation only**.
      5. [Enable private submissions](#enable-private-submissions) in the subgroup's permissions.
      6. Test the process with an account that is not a member of the subgroup.
      7. Share the subgroup page with prospective submitters. They must sign in to their user account before making a submission.
    translation: |-
      1. Luo hakemusten käsittelyä varten oma alaryhmä ja aseta sen yksityisyydeksi **Suljettu**. Näin hakemukset pysyvät erillään pääryhmän muusta toiminnasta.
      2. Lisää valintaryhmä tai muut hakemusten arvioinnista vastaavat henkilöt alaryhmän jäseniksi. Jokainen alaryhmän jäsen näkee kaikki hakemukset, joten lisää vain henkilöt, joille tämä pääsy kuuluu.
      3. Luo alaryhmään [keskustelumalli](/en/user_manual/discussions/templates). Lisää siihen kysymykset ja tiedot, jotka lähettäjien tulee antaa. Voit luoda eri tyyppisille hakemuksille omat keskustelumallit.
      4. Jos lähettäjien ei pidä voida pyytää alaryhmän jäsenyyttä, aseta jäsenyysasetukseksi **Vain kutsusta**.
      5. [Ota yksityiset hakemukset käyttöön](#enable-private-submissions) alaryhmän käyttöoikeuksissa.
      6. Testaa toimintaa tilillä, joka ei kuulu alaryhmään.
      7. Jaa alaryhmän sivu mahdollisille hakijoille. Heidän täytyy kirjautua käyttäjätililleen ennen hakemuksen lähettämistä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3acec1b4a6724a65:
    english: "## Make a submission"
    translation: "## Lähetä hakemus"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  58f96f48b6aacf65:
    english: The submitter opens the subgroup and selects **Start discussion**. Loomio shows the subgroup's available discussion templates. The submitter selects the relevant discussion template, completes its questions, and starts the discussion.
    translation: Hakemuksen lähettäjä avaa alaryhmän ja valitsee **Aloita keskustelu**. Loomio näyttää alaryhmässä käytettävissä olevat keskustelumallit. Lähettäjä valitsee sopivan mallin, vastaa sen kysymyksiin ja aloittaa keskustelun.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5a65043771edeb44:
    english: The discussion belongs to the subgroup, but the submitter does not become a subgroup member. Loomio adds them as a guest of their discussion thread, enabling them to see and participate in the discussion with the panel or review team. They cannot see other private discussions or submissions in the subgroup.
    translation: Keskustelu kuuluu alaryhmään, mutta lähettäjästä ei tule alaryhmän jäsentä. Loomio lisää hänet keskustelun vieraaksi, jolloin hän voi nähdä keskustelun ja osallistua siihen arvioijien kanssa. Hän ei näe alaryhmän muita yksityisiä keskusteluja tai hakemuksia.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9338fd073b26dafc:
    english: "## Review submissions"
    translation: "## Arvioi hakemukset"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  50e33fa0f0868cf5:
    english: Subgroup members can see every submission discussion in the subgroup. They can ask follow-up questions and use comments, polls, or other discussion tools to complete their review.
    translation: Alaryhmän jäsenet näkevät kaikki alaryhmään lähetetyt hakemukset ja niiden keskustelut. He voivat esittää lisäkysymyksiä ja käyttää kommentteja, kyselyjä tai muita keskustelun työkaluja arvioinnissa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  537b76c6f85cc575:
    english: If another person needs to provide information, a subgroup member with permission can invite them to the submission discussion. For example, when a nominator submits a nomination, the subgroup can invite the nominee to the thread if their participation is required. The invited person joins as a guest without gaining access to the subgroup's other private discussions.
    translation: Jos tarvitaan tietoja toiselta henkilöltä, alaryhmän jäsen, jolla on siihen oikeus, voi kutsua hänet hakemuksen keskusteluun. Jos esimerkiksi joku ehdottaa toista henkilöä tehtävään, alaryhmä voi kutsua ehdokkaan keskusteluun, jos hänen osallistumistaan tarvitaan. Kutsuttu henkilö osallistuu vieraana eikä saa pääsyä alaryhmän muihin yksityisiin keskusteluihin.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1fb7da309186b19e:
    english: Each submitter can see their own submission but cannot see the subgroup's other private discussions or submissions. Disable **Non-members can start discussions** when submissions close. Existing discussions and guest access are unchanged.
    translation: Jokainen lähettäjä näkee oman hakemuksensa mutta ei alaryhmän muita yksityisiä keskusteluja tai hakemuksia. Poista **Muutkin kuin jäsenet voivat aloittaa keskusteluja** käytöstä, kun hakemusten vastaanotto päättyy. Olemassa olevat keskustelut ja vieraiden pääsy niihin säilyvät ennallaan.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
