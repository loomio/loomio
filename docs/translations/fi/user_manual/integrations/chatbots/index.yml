  ca092d1c3fdb9f59:
    english: 'You probably don''t want to click any of the checkboxes for now. Just enter the name (such as "Discord #general") and the URL and click the save button at the bottom of the form.'
    translation: 'Jätä valintaruudut toistaiseksi tyhjiksi. Anna nimi, esimerkiksi ”Discord #general”, ja URL-osoite. Napsauta sitten lomakkeen alaosassa olevaa tallennuspainiketta.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  a63a4be4a45bcfdb:
    english: If you decide later that you want the integration to receive automatic notifications, return to its settings and select the relevant events.
    translation: Jos haluat myöhemmin ottaa automaattiset ilmoitukset käyttöön, palaa integraation asetuksiin ja valitse haluamasi tapahtumat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f1d9c09f9d3c2a82:
    english: "### Invite to poll"
    translation: "### Kutsu äänestämään"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  cbc7b5fd5afcc24c:
    english: |-
      This is how to send a notification to your chatroom inviting people to vote in a proposal.
      It's the same process for Share outcome, Invite to thread, Remind to vote, Poll edited etc.
    translation: |-
      Näin lähetät chat-huoneeseesi ilmoituksen, jossa kutsut ihmisiä äänestämään ehdotuksesta.
      Jaa päätelmä, Kutsu keskusteluun, Muistuta äänestämään, Kyselyä muokattu ja muut ilmoitukset lähetetään samalla tavalla.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  290001bb97dee010:
    english: |-
      ### Automatic notifications
      To send a notification whenever a specific event happens, edit the chat integration and select that event.
    translation: |-
      ### Automaattiset ilmoitukset
      Jos haluat lähettää ilmoituksen aina tietyn tapahtuman yhteydessä, muokkaa chat-integraatiota ja valitse kyseinen tapahtuma.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
