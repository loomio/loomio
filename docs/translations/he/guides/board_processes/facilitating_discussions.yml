navigation_title: הנחיית דיונים
blocks:
  c377321bc013336b:
    english: "# Facilitating discussions"
    translation: "# הנחיית דיונים"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b771c6c746b8dc40:
    english: 'At times topics arise that require the attention of board or committee members mid-cycle, between meetings. '
    translation: לעיתים עולים נושאים שדורשים את תשומת הלב של חברי הדירקטוריון או הוועדה בין ישיבות.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b5fc5f12c8e44c40:
    english: And sometimes there is just not space during a meeting for discussion or to sufficiently deliberate on a decision.
    translation: לפעמים גם אין בישיבה די זמן לדיון או לבחינה מעמיקה של החלטה.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  79f2f83380e195c4:
    english: "## On Loomio"
    translation: "## ב־Loomio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  14d5e62d33996982:
    english: Use a Loomio **thread** to facilitate a discussion.  Give the thread a descriptive title that members will recognize and provide details in the thread context.  Add a relevant category tag to help members find the thread in future.
    translation: אפשר להשתמש ב**שרשור** ב־Loomio כדי לנהל דיון. יש לתת לשרשור כותרת תיאורית שחברי הקבוצה יזהו, ולפרט את הנושא בהקשר של השרשור. כדאי להוסיף תג קטגוריה מתאים כדי שיהיה קל למצוא את השרשור בעתיד.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d35b4315f4e42cb:
    english: Notify members of the thread by inviting them, so they will receive a copy of the thread by email.  Members can participate in the discussion by clicking on the link to go to Loomio, or reply to the notification email and their comment will appear as a comment in the thread.
    translation: כדי ליידע את חברי הקבוצה על השרשור, יש להזמין אותם אליו. כך יישלח אליהם עותק של השרשור בדוא״ל. אפשר להשתתף בדיון דרך הקישור ל־Loomio, או להשיב להודעת הדוא״ל. התשובה תופיע כתגובה בשרשור.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f7d839f27c1a6f72:
    english: A Loomio thread enables you to attach files or link to online resources to support the discussion.
    translation: בשרשור ב־Loomio אפשר לצרף קבצים או קישורים למקורות מקוונים שתומכים בדיון.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e45d25d90798cf1e:
    english: "Common examples include:\n- review and develop a policy\n- seek advice from the board about a topic or issue\n- discuss strategy \n- explore an idea or opportunity\n- assess risk"
    translation: |-
      דוגמאות נפוצות:
      - לבחון ולגבש מדיניות
      - לבקש עצה מהדירקטוריון בנושא או בסוגיה
      - לדון באסטרטגיה
      - לבחון רעיון או הזדמנות
      - להעריך סיכונים
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  86ace2adbcf3df6f:
    english: "## Issues that arise between board meetings"
    translation: "## סוגיות שעולות בין ישיבות הדירקטוריון"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  48f6023950ee0729:
    english: 'A lot can happen in an organization between meetings, and most people rely on email to alert board members.  Trying to keep track of a discussion on email is tricky, with replies often lost in in-boxes and people left out.  '
    translation: 'דברים רבים יכולים לקרות בארגון בין ישיבות, ורבים מסתמכים על דוא״ל כדי לעדכן את חברי הדירקטוריון. קשה לעקוב אחר דיון בדוא״ל: תשובות עלולות ללכת לאיבוד בתיבות הדואר, ואנשים עלולים להישאר מחוץ לשיחה.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1cb0e78c848b9621:
    english: "*“You can’t do governance by email!”, Richard Westlake (Westlake Governance).*"
    translation: "*״אי אפשר לנהל ממשל תאגידי בדוא״ל!״, ריצ׳רד וסטלייק (Westlake Governance).*"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  eddf348746c93b4c:
    english: 'When an issue arises requiring board attention, use a Loomio thread rather than email.  Members can reply via email and their comment will appear in the Loomio thread, keeping the discussion in one place. '
    translation: כשעולה סוגיה שדורשת את תשומת לב הדירקטוריון, אפשר להשתמש בשרשור ב־Loomio במקום בדוא״ל. חברי הקבוצה יכולים להשיב בדוא״ל, והתגובות שלהם יופיעו בשרשור ב־Loomio. כך הדיון נשאר במקום אחד.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2f7ad89003f79fb8:
    english: |-
      Here's how:
      - Make the email subject line the title of your thread,
      - write your email content in the thread context,
      - invite your team to the thread with their email address or Loomio user name.
    translation: |-
      כך עושים זאת:
      - משתמשים בשורת הנושא של הודעת הדוא״ל ככותרת השרשור,
      - כותבים את תוכן ההודעה בהקשר של השרשור,
      - מזמינים את חברי הצוות לשרשור באמצעות כתובת הדוא״ל או שם המשתמש שלהם ב־Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9825cbb88dcedc3d:
    english: |-
      A Loomio thread means that:
      - All info about a topic is organized in one easily accessible place,
      - people can respond without generating reply/reply-all email chains that risk leaving people out,
      - you can see who has read the message and who needs a nudge,
      - you can progress actual work to an outcome, and cut down on the amount of email.
    translation: |-
      שרשור ב־Loomio מאפשר:
      - לרכז את כל המידע בנושא במקום אחד שקל לגשת אליו,
      - להשיב בלי ליצור שרשראות דוא״ל של ״השב״ ו״השב לכולם״ שעלולות להשאיר אנשים מחוץ לדיון,
      - לראות מי קרא את ההודעה ולמי כדאי לשלוח תזכורת,
      - לקדם את העבודה למסקנה ולהפחית את כמות הדוא״ל.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fb9adc7cb7922016:
    english: "## When there isn't space during meetings"
    translation: "## כשאין די זמן בישיבה"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6b1c61424aa7e74b:
    english: When an agenda item cannot be resolved within the time available in your board meeting, you can move this for further discussion to Loomio. Direct people to the relevant thread, or start a new one and notify your board members.
    translation: אם אי אפשר להכריע בסעיף מסדר היום בזמן שהוקצה לו בישיבת הדירקטוריון, אפשר להמשיך את הדיון ב־Loomio. ניתן להפנות את המשתתפים לשרשור המתאים, או לפתוח שרשור חדש וליידע את חברי הדירקטוריון.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ced9caddb281230f:
    english: This relieves pressure on your board, allows more time for information gathering, discussion and deeper reflection which often results in a better quality decision.
    translation: כך פוחת הלחץ על הדירקטוריון, ויש יותר זמן לאיסוף מידע, לדיון ולמחשבה מעמיקה. לעיתים קרובות התוצאה היא החלטה טובה יותר.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
