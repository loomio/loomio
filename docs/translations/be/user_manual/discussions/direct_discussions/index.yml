  5a0b9426a2d88e62:
    english: |-
      ## Contacting someone via a direct discussion
      A direct discussion can be used to contact one or more people privately without creating a subgroup.
    translation: |-
      ## Як звязацца з людзьмі праз прамую дыскусію
      Прамая дыскусія дазваляе звязацца з адным або некалькімі людзьмі прыватна, не ствараючы падгрупу.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
