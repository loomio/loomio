---
navigation_title: Presentare Loomio al tuo gruppo
blocks:
  6c777a62b2b77732:
    english: "# Introducing Loomio to your group"
    translation: "# Presentare Loomio al tuo gruppo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  438cc622ae730bd8:
    english: Introduce Loomio through one useful piece of work. Prepare the group before inviting people, help everyone participate once, and complete the process through to an outcome.
    translation: Presenta Loomio attraverso un'attività utile. Prepara il gruppo prima di invitare le persone, aiuta tutti a partecipare almeno una volta e porta il processo fino a una conclusione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9c9fa4e8f6e208e4:
    english: "## Choose one useful starting point"
    translation: "## Scegli un punto di partenza utile"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3353fb04e83837e5:
    english: Start with a real process that your group already needs. A good first use is small enough to complete soon, but relevant enough that people have a reason to participate.
    translation: Parti da un'attività di cui il tuo gruppo ha già bisogno. Per iniziare, scegline una che si possa completare presto e che sia abbastanza rilevante da dare alle persone un motivo per partecipare.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  652744a2ab28954b:
    english: 'For example:'
    translation: 'Per esempio:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  19bc6c09eeea816e:
    english: |-
      - prepare the agenda for an upcoming meeting;
      - review and approve meeting minutes;
      - gather feedback on a draft document;
      - decide a small operational question; or
      - identify priorities for the next month.
    translation: |-
      - preparare l'ordine del giorno di una prossima riunione;
      - rivedere e approvare il verbale di una riunione;
      - raccogliere commenti sulla bozza di un documento;
      - decidere una piccola questione operativa; oppure
      - individuare le priorità per il mese successivo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  68a0d6b76f36ebaf:
    english: Avoid moving every discussion and decision into Loomio at once. A repeatable process gives the group a clear reason to return and lets you improve the way you run it each time.
    translation: Evita di spostare subito in Loomio tutte le discussioni e le decisioni. Un processo ripetibile dà al gruppo un motivo chiaro per tornare e ti permette di migliorarlo ogni volta.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4b65243ef120921b:
    english: "## Prepare the group before inviting people"
    translation: "## Prepara il gruppo prima di invitare le persone"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  305b29c1c832c246:
    english: 'Give people a useful and recognizable place to arrive in:'
    translation: 'Prepara uno spazio utile e riconoscibile in cui le persone possano arrivare:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  76d859d168805706:
    english: |-
      - add the group's name, logo, cover image, purpose, and important links;
      - check the group's privacy and permissions;
      - add any [category tags](/en/user_manual/discussions/tags) the group will use regularly;
      - create the first real discussion, with the background information people need; and
      - create a practice discussion if members would benefit from trying comments, reactions, and voting without consequences.
    translation: |-
      - aggiungi il nome del gruppo, il logo, l'immagine di copertina, lo scopo e i link importanti;
      - controlla la privacy e i permessi del gruppo;
      - aggiungi le [etichette di categoria](/en/user_manual/discussions/tags) che il gruppo userà regolarmente;
      - crea la prima vera discussione, con le informazioni di contesto necessarie; e
      - crea una discussione di prova se ai membri può essere utile sperimentare commenti, reazioni e votazioni senza conseguenze.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f1decb57ec9d48cb:
    english: Use your own photo in your profile and the organization's logo for the group. This helps people recognize who invited them and which organization an email is about.
    translation: Usa una tua foto nel profilo e il logo dell'organizzazione per il gruppo. Così le persone possono riconoscere chi le ha invitate e a quale organizzazione si riferisce un'email.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '01965093f234bb36':
    english: "## Decide where work belongs"
    translation: "## Decidi dove svolgere le attività"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  7fbd0d770cbed2bd:
    english: 'Loomio can sit alongside tools your group already uses:'
    translation: 'Loomio può affiancare gli strumenti che il tuo gruppo usa già:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  '0168271b154f6931':
    english: |-
      | Use | Good place for it |
      |---|---|
      | Quick questions, social conversation, and timely updates | Chat, such as Slack, Teams, Matrix, or Discord |
      | Collaborative editing of a living document | A shared document tool |
      | Assigning work and tracking its completion | A task or project-management tool |
      | A focused discussion, broad participation, a decision, and its lasting record | Loomio |
    translation: |-
      | Attività | Strumento adatto |
      |---|---|
      | Domande rapide, conversazioni informali e aggiornamenti tempestivi | Una chat, come Slack, Teams, Matrix o Discord |
      | Modifica collaborativa di un documento in continua evoluzione | Uno strumento per documenti condivisi |
      | Assegnazione delle attività e monitoraggio del loro completamento | Uno strumento per gestire attività o progetti |
      | Una discussione mirata, un'ampia partecipazione, una decisione e una documentazione duratura | Loomio |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  50fae2027411e538:
    english: Link to documents and other systems from the group description or discussion context. Use [chat integrations](/en/user_manual/integrations/chatbots) to bring important Loomio activity into a channel people already follow.
    translation: Inserisci i link ai documenti e agli altri sistemi nella descrizione del gruppo o nel contesto della discussione. Usa le [integrazioni con le chat](/en/user_manual/integrations/chatbots) per portare le attività importanti di Loomio in un canale che le persone seguono già.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ed67af54bdf1c775:
    english: Tell members what you expect to happen in Loomio. A simple boundary such as “important discussions and decisions go in Loomio; quick coordination stays in chat” is easier to adopt than an unexplained new tool.
    translation: Spiega ai membri quali attività prevedi di svolgere in Loomio. Una regola semplice come «le discussioni e le decisioni importanti si svolgono in Loomio; il coordinamento rapido resta nella chat» è più facile da adottare di un nuovo strumento introdotto senza spiegazioni.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0a799d7911a46f6f:
    english: "## Decide how your group decides"
    translation: "## Decidi come il tuo gruppo prende le decisioni"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9e1c64de2dc68593:
    english: Loomio does not require every group, or every decision, to use the same process. Some groups arrive with established rules. Others use Loomio while they develop a clearer decision-making practice together.
    translation: Loomio non richiede che ogni gruppo, o ogni decisione, segua lo stesso processo. Alcuni gruppi hanno già regole definite. Altri usano Loomio mentre sviluppano insieme un modo più chiaro di prendere le decisioni.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6d0c0f50959ab9d6:
    english: "### If your process is already established"
    translation: "### Se il tuo gruppo ha già un processo definito"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  5fbfe86e935d5a8c:
    english: 'Translate the group''s existing requirements into Loomio. Before running a formal decision, make sure participants can tell:'
    translation: 'Adatta a Loomio le regole già in uso nel gruppo. Prima di avviare una decisione formale, assicurati che i partecipanti sappiano:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9a1b89bd4c5fe02c:
    english: |-
      - which kinds of decisions can be made in Loomio;
      - who provides input and who has authority to decide;
      - who is eligible to vote;
      - whether a [quorum](/en/user_manual/polls/quorum) is required;
      - whether the decision requires a majority, supermajority, unanimous agreement, consent, or another [vote share requirement](/en/user_manual/polls/vote_share_requirements);
      - whether the decision takes effect when its outcome is published or must be ratified elsewhere; and
      - who will record and carry out the outcome.
    translation: |-
      - quali tipi di decisioni si possono prendere in Loomio;
      - chi contribuisce alla discussione e chi ha l'autorità di decidere;
      - chi ha diritto di voto;
      - se è richiesto un [quorum](/en/user_manual/polls/quorum);
      - se la decisione richiede una maggioranza, una maggioranza qualificata, l'unanimità, il consenso o un'altra [quota di voti richiesta](/en/user_manual/polls/vote_share_requirements);
      - se la decisione entra in vigore quando viene pubblicata la conclusione o deve essere ratificata altrove; e
      - chi registrerà e attuerà la conclusione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4b48b6e0aff5cfc0:
    english: If your constitution, bylaws, policy, or local law governs electronic decisions, make sure the Loomio process follows those requirements. Configure [delegated voters](/en/user_manual/groups/delegated_voters), proposal settings, and [poll templates](/en/user_manual/polls/poll_templates) to make the agreed process easy to repeat.
    translation: Se lo statuto, il regolamento, le politiche del gruppo o la legge locale disciplinano le decisioni elettroniche, assicurati che il processo in Loomio rispetti tali requisiti. Configura gli [elettori delegati](/en/user_manual/groups/delegated_voters), le impostazioni delle proposte e i [modelli di sondaggio](/en/user_manual/polls/poll_templates) per rendere facile ripetere il processo concordato.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b068624ed6c7c6b3:
    english: "### If your group is still deciding"
    translation: "### Se il tuo gruppo sta ancora decidendo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  14449de544d28a6b:
    english: 'Start a discussion about how decisions should be made. Instead of beginning with a voting tool, ask the group to consider:'
    translation: 'Avvia una discussione su come prendere le decisioni. Prima di scegliere uno strumento di voto, invita il gruppo a riflettere su queste domande:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f65b39a74ae25ed7:
    english: |-
      - What kinds of decisions do we make?
      - Who is affected, who should be consulted, and who is responsible for deciding?
      - Which decisions need advice, consent, consensus, a vote, or delegated authority?
      - What level of participation or support makes a decision valid?
      - How will we respond to objections, tied results, or insufficient participation?
      - How will we communicate, record, review, and change a decision?
    translation: |-
      - Quali tipi di decisioni prendiamo?
      - Chi è coinvolto, chi dovrebbe essere consultato e chi ha la responsabilità di decidere?
      - Quali decisioni richiedono un parere, il consenso, un accordo condiviso, un voto o un'autorità delegata?
      - Quale livello di partecipazione o sostegno rende valida una decisione?
      - Come risponderemo alle obiezioni, ai risultati di parità o a una partecipazione insufficiente?
      - Come comunicheremo, registreremo, riesamineremo e modificheremo una decisione?
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ce7c0af2ad170b5c:
    english: The answers may be different for an operational decision, a policy, an election, and a constitutional change. See [Making decisions](/en/guides/making_decisions) to compare several complete processes.
    translation: Le risposte possono cambiare a seconda che si tratti di una decisione operativa, una politica, un'elezione o una modifica dello statuto. Consulta [Prendere decisioni](/en/guides/making_decisions) per confrontare diversi processi completi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  aac26fc96b90744d:
    english: If the group is not ready to settle every rule, agree on a provisional process for one low-risk decision. State what the result will mean before asking people to participate, publish an outcome, then review how the process worked. Record what the group learns in its description, governance documents, or reusable templates.
    translation: Se il gruppo non è pronto a definire tutte le regole, concorda un processo provvisorio per una decisione a basso rischio. Spiega che cosa significherà il risultato prima di chiedere alle persone di partecipare. Poi pubblica una conclusione e valuta come ha funzionato il processo. Registra ciò che il gruppo ha imparato nella sua descrizione, nei documenti di governance o nei modelli riutilizzabili.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  23ed8fb3e887afbc:
    english: "## Invite people"
    translation: "## Invita le persone"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a5d369ad9df691fe:
    english: "[Invite people](/en/user_manual/groups/inviting_people) with a short personal message that explains:"
    translation: "[Invita le persone](/en/user_manual/groups/inviting_people) con un breve messaggio personale che spieghi:"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  3383207ff2fcc99b:
    english: |-
      - why the group is using Loomio;
      - what you are asking them to do first;
      - when you need their response; and
      - where they can get help.
    translation: |-
      - perché il gruppo usa Loomio;
      - che cosa chiedi loro di fare per prima cosa;
      - entro quando hai bisogno di una risposta; e
      - dove possono trovare aiuto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  282ef8673815823e:
    english: You can begin with a small group of people who will actively test the process, or invite the whole group when everyone needs to participate from the start. In either case, have a discussion ready for them rather than inviting people into an empty group.
    translation: Puoi iniziare con un piccolo gruppo di persone che proveranno attivamente il processo, oppure invitare tutto il gruppo se è necessario che tutti partecipino fin dall'inizio. In entrambi i casi, prepara una discussione per loro prima di invitarli nel gruppo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  cd6511a78ce7c9b7:
    english: "## Help everyone participate once"
    translation: "## Aiuta tutti a partecipare almeno una volta"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a37273687b4f4b0:
    english: The first objective is for each person to cross the threshold from receiving an invitation to contributing something.
    translation: Il primo obiettivo è aiutare ogni persona a passare dall'aver ricevuto un invito al dare un contributo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ce285f27cca389c4:
    english: 'Ask people to:'
    translation: 'Chiedi alle persone di:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d0b9e80af995edff:
    english: |-
      1. sign in and add a profile photo;
      2. open the welcome or practice discussion;
      3. post a short comment or reaction; and
      4. vote in a low-stakes proposal and, if useful, leave a reason.
    translation: |-
      1. accedere e aggiungere una foto al profilo;
      2. aprire la discussione di benvenuto o di prova;
      3. pubblicare un breve commento o una reazione; e
      4. votare in una proposta di poca importanza e, se utile, spiegare il motivo.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  919e32e7adb7c4c8:
    english: Members do not need to create a password. They can [sign in by email](/en/user_manual/users/signing_in), and they can reply to eligible discussion emails without first navigating back to the thread.
    translation: I membri non devono creare una password. Possono [accedere via email](/en/user_manual/users/signing_in) e rispondere alle email delle discussioni che lo consentono senza dover prima tornare alla discussione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  22ceb7104d416acf:
    english: "## Use notifications deliberately"
    translation: "## Usa le notifiche con criterio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  dd99e6dd5c93d9ee:
    english: Access to content and notification about it are separate. Group members can find discussions in their group even when they were not notified immediately.
    translation: L'accesso ai contenuti e le notifiche sono due cose distinte. I membri possono trovare le discussioni del proprio gruppo anche se non hanno ricevuto subito una notifica.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0e20732d957eb282:
    english: When starting a discussion, notify the people whose input is needed at that stage. Use @mentions and replies when asking particular people to respond. When voting opens later, invite the eligible voters.
    translation: Quando avvii una discussione, invia una notifica alle persone il cui contributo serve in quella fase. Usa le @menzioni e le risposte quando chiedi a persone specifiche di intervenire. Quando si apre la votazione, invita chi ha diritto di voto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  43339ff0f3d30a50:
    english: If you create a discussion and poll together only to capture a vote, avoid sending a discussion invitation immediately followed by a poll invitation. Either start the discussion without notifying people and invite them through the poll, or run a [standalone poll](/en/user_manual/polls/intro_to_decisions#without-a-discussion).
    translation: Se crei insieme una discussione e un sondaggio solo per raccogliere voti, evita di inviare un invito alla discussione seguito subito da un invito al sondaggio. Puoi avviare la discussione senza inviare notifiche e invitare le persone tramite il sondaggio, oppure avviare un [sondaggio autonomo](/en/user_manual/polls/intro_to_decisions#without-a-discussion).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  467cf9d1e5bd2973:
    english: Show members the [Catch-up and notification settings](/en/user_manual/users/email_settings), especially if they do not expect to visit Loomio every day.
    translation: Mostra ai membri le [impostazioni del riepilogo e delle notifiche](/en/user_manual/users/email_settings), soprattutto se non prevedono di visitare Loomio ogni giorno.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ebe7764d64b17823:
    english: "## Complete the first process"
    translation: "## Completa il primo processo"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  9a165c59ba0aed5a:
    english: 'A first process should demonstrate the complete pattern:'
    translation: 'Il primo processo dovrebbe comprendere tutte queste fasi:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8bc60d4319adf204:
    english: |-
      1. Introduce the topic and provide context.
      2. Invite discussion or questions when they are needed.
      3. Start the appropriate proposal or poll.
      4. Remind people who have not participated when necessary.
      5. Publish an [outcome](/en/user_manual/polls/outcomes) stating what was decided and what happens next.
    translation: |-
      1. Presenta l'argomento e fornisci il contesto.
      2. Invita i membri a discutere o a fare domande quando serve.
      3. Avvia la proposta o il sondaggio appropriato.
      4. Se necessario, ricorda di partecipare a chi non l'ha ancora fatto.
      5. Pubblica una [conclusione](/en/user_manual/polls/outcomes) che indichi cosa è stato deciso e quali sono i prossimi passi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1235244007a8559b:
    english: The outcome closes the loop and creates a record that members can return to later. Afterward, ask what worked, adjust the process, and choose the next recurring piece of work to run in Loomio.
    translation: La conclusione completa il processo e crea un resoconto che i membri potranno consultare in seguito. Poi chiedi cosa ha funzionato, modifica il processo e scegli la prossima attività ricorrente da svolgere in Loomio.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c699f8804cdd41b1:
    english: For a facilitated sequence from discussion to decision, see [Making decisions](/en/guides/making_decisions). For board-specific practices, see [Introducing Loomio to your board](/en/guides/board_processes/introduce).
    translation: Per una sequenza guidata dalla discussione alla decisione, consulta [Prendere decisioni](/en/guides/making_decisions). Per le pratiche specifiche di un consiglio direttivo, consulta [Presentare Loomio al tuo consiglio direttivo](/en/guides/board_processes/introduce).
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
