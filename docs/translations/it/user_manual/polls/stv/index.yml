  85590745d00e23c1:
    english: "# STV Elections"
    translation: "# Elezioni STV"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  366f56443108e10f:
    english: "**Single Transferable Vote (STV)** is a proportional representation voting method for electing multiple winners from a field of candidates. It ensures that elected candidates proportionally represent the diversity of views among voters."
    translation: Il **voto singolo trasferibile (STV)** è un metodo di voto proporzionale per eleggere più persone tra un gruppo di candidati. Permette di rappresentare tra gli eletti la diversità delle opinioni di chi vota.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  61dee55b45038f56:
    english: "## When to use STV"
    translation: "## Quando usare STV"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  8311dca26cec6519:
    english: 'Use an STV Election when you need to:'
    translation: 'Usa un''elezione STV quando vuoi:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1d4338734ec6e113:
    english: |-
      - Elect a **committee, board, or slate of delegates** from a pool of nominees
      - Ensure **proportional representation**, where minority factions can win seats proportional to their support
      - Run elections where voters rank candidates by preference
    translation: |-
      - Eleggere un **comitato, un consiglio o un gruppo di delegati** tra più candidati
      - Garantire una **rappresentanza proporzionale**, in cui anche i gruppi minoritari possono ottenere seggi in proporzione al sostegno ricevuto
      - Organizzare elezioni in cui chi vota ordina i candidati secondo le proprie preferenze
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  e6e1ae026f65a715:
    english: |-
      >[!NOTE]
      >STV is **not** the same as Loomio's [Rank poll](/en/user_manual/polls/rank/), which is a simpler score-based ranking for choosing a single best option. STV handles multi-winner elections with vote transfers and elimination rounds.
    translation: |-
      >[!NOTE]
      >STV è diverso dal [sondaggio con classifica](/en/user_manual/polls/rank/) di Loomio, che usa un sistema di punteggi più semplice per scegliere un'unica opzione. STV permette di eleggere più persone attraverso trasferimenti di voti e turni di eliminazione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  62af8f95f18dbafe:
    english: "## Creating an STV Election"
    translation: "## Creare un'elezione STV"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  edf2f36e75c81665:
    english: When starting a poll, select **STV Election** as the poll type, then add the candidates as the poll options. You can customize the poll by setting the **number of seats**, the **counting method**, and the **quota type**.
    translation: Quando avvii un sondaggio, seleziona **Elezioni STV** come tipo di sondaggio, poi aggiungi i candidati come opzioni. Puoi configurare il **numero di seggi**, il **metodo di conteggio** e il **tipo di quota**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b40ddcfb8cdc44fd:
    english: In this example, Oatmilk Cooperative is electing three people to oversee its returnable packaging trial. The form explains the role, lists five candidates, and uses Scottish STV with the Droop quota.
    translation: In questo esempio, la cooperativa Oatmilk elegge tre persone che seguiranno la sperimentazione degli imballaggi a rendere. Il modulo descrive il ruolo, elenca cinque candidati e usa il metodo Scottish STV con la quota Droop.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  4a34592929349d06:
    english: "### Number of seats"
    translation: "### Numero di seggi"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c09f5f51333612dc:
    english: How many winners should be elected. Must be less than the number of candidates.
    translation: Il numero di persone da eleggere. Deve essere inferiore al numero di candidati.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  ddceec01d910b152:
    english: "### Counting method"
    translation: "### Metodo di conteggio"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  39e9e81a89272771:
    english: 'There are two available methods for counting the votes:'
    translation: 'Sono disponibili due metodi per contare i voti:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  a7031d1180e95273:
    english: |-
      Scottish STV
        : Recommended. The Weighted Inclusive Gregory Method (WIGM) used in Scottish local elections since 2007. Well-defined, straightforward rules. Best for most organizations.
    translation: |-
      Scottish STV
        : Consigliato. Usa il metodo Weighted Inclusive Gregory (WIGM), adottato nelle elezioni locali scozzesi dal 2007. Ha regole chiare e semplici. È adatto alla maggior parte delle organizzazioni.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  1507e4fde88848dd:
    english: |-
      Meek STV
        : A more mathematically precise iterative method. When a candidate is eliminated, votes are recounted as if that candidate was never in the race.
    translation: |-
      Meek STV
        : Un metodo iterativo matematicamente più preciso. Quando un candidato viene eliminato, i voti vengono ricalcolati come se non avesse mai partecipato all'elezione.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  b9abcd12eef5f629:
    english: "### Quota type"
    translation: "### Tipo di quota"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6dc3aea49266d40d:
    english: 'The quota is the minimum number of votes a candidate needs to win a seat. It can be either:'
    translation: 'La quota è il numero minimo di voti necessario a un candidato per ottenere un seggio. Può essere:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  88f62f286d8c550f:
    english: |-
      Droop
        : Recommended. The standard quota type for most STV elections, and used by Ireland, Australia, and Scotland. Droop guarantees a majority coalition wins a majority of seats. It is calculated as:
      \\[ floor(\frac{votes}{(seats + 1)}) + 1 \\]
    translation: |-
      Droop
        : Consigliata. È la quota standard per la maggior parte delle elezioni STV ed è usata in Irlanda, Australia e Scozia. Garantisce che una coalizione con la maggioranza dei voti ottenga la maggioranza dei seggi. Si calcola così:
      \\[ floor(\frac{votes}{(seats + 1)}) + 1 \\]
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  817b3994e92898e8:
    english: |-
      Hare
        : A higher minimum threshold, and more proportional for smaller factions.
          Hare is preferred by DSA chapters to protect minority representation.
         It is calculated as:
          \\[ \frac{votes}{seats}\\]
    translation: |-
      Hare
        : Una soglia minima più alta, che offre una rappresentanza più proporzionale ai gruppi più piccoli.
          Le sezioni DSA la preferiscono per tutelare la rappresentanza delle minoranze.
         Si calcola così:
          \\[ \frac{votes}{seats}\\]
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f12065bdf5d3678e:
    english: |2-
        >[!TIP]
        > Droop will always compute to a smaller number of votes than Hare. For example, in an election with 100 votes and four seats, the Droop quota would be 21 and the Hare quota 25.
    translation: |-
      >[!TIP]
        > La quota Droop richiede sempre meno voti della quota Hare. Per esempio, in un'elezione con 100 voti e quattro seggi, la quota Droop è 21 e la quota Hare è 25.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  984516abc3cfd89b:
    english: "## How voting works"
    translation: "## Come si vota"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  40e98247d87cdf27:
    english: 'In this example, Oatmilk Cooperative is electing three people to oversee the reusable packaging trial. Voters drag candidates above the line and rank them in order of preference:'
    translation: 'In questo esempio, la cooperativa Oatmilk elegge tre persone che seguiranno la sperimentazione degli imballaggi riutilizzabili. Chi vota trascina i candidati sopra la linea e li ordina secondo le proprie preferenze:'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  f8aaa5391f05117f:
    english: |-
      - **Rank 1** = most preferred candidate
      - **Rank 2** = second choice
      - Continue ranking as many candidates as desired
    translation: |-
      - **Posizione 1** = candidato preferito
      - **Posizione 2** = seconda scelta
      - Continua a ordinare tutti i candidati che desideri
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  70bd790faf93c916:
    english: Voters are not required to rank every candidate. Unranked candidates will not receive any of that voter's support.
    translation: Non è necessario ordinare tutti i candidati. I candidati non classificati non ricevono alcuna parte del sostegno di chi ha espresso quel voto.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  d82e369c7c293a0c:
    english: |-
      ## How counting works
      The count is performed as follows:
    translation: |-
      ## Come funziona il conteggio
      Il conteggio si svolge così:
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  0ea01b5d531abc06:
    english: |-
      1. A **quota** is calculated (minimum votes needed to win a seat).
      2. **First preferences** are counted for each candidate.
      3. If a candidate meets the quota, they are **elected**. Their surplus votes (above the quota) are **transferred** to voters' next preferences at a fractional value.
      4. If no candidate meets the quota, the candidate with the **fewest votes is eliminated**. Their votes transfer to voters' next preferences at full value.
      5. This process repeats until all seats are filled.
    translation: |-
      1. Si calcola una **quota** (il numero minimo di voti necessario per ottenere un seggio).
      2. Si contano le **Prime preferenze** di ogni candidato.
      3. Se un candidato raggiunge la quota, viene **eletto**. I suoi voti in eccedenza rispetto alla quota vengono **trasferiti** alle preferenze successive di chi lo ha votato, con un valore frazionario.
      4. Se nessun candidato raggiunge la quota, viene **eliminato il candidato con meno voti**. I suoi voti vengono trasferiti alle preferenze successive di chi lo ha votato, mantenendo il loro intero valore.
      5. Il processo si ripete finché tutti i seggi sono assegnati.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  c6f397233ad479e5:
    english: |-
      >[!TIP]
      >If a voter has ranked no remaining candidates, their ballot is "exhausted" and that vote is lost. This is why ranking more candidates is generally better.
    translation: |-
      >[!TIP]
      >Se una scheda non indica preferenze per nessuno dei candidati rimasti, è «esaurita» e quel voto non viene più conteggiato. Per questo, in genere conviene ordinare più candidati.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  acba228efb586cca:
    english: "## Understanding results"
    translation: "## Capire i risultati"
