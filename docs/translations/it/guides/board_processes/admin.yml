    translated_on: '2026-09-30'
  e4617bf502879b0d:
    english: 'Increasingly, electronic records are supplanting the requirement for paper.  '
    translation: I documenti digitali sostituiscono sempre più spesso quelli cartacei.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e1d587f71cdcc6c1:
    english: 'However digital tools enable your board to do much more than just file meeting minutes.  '
    translation: Gli strumenti digitali permettono però al tuo consiglio di fare molto più che archiviare i verbali delle riunioni.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f249e5f83d487c4b:
