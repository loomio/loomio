  2c6bd4d0a9b3e572:
    english: List polls visible to the API-key user in a group. For a publicly visible group, a nonmember can list its public polls; private polls remain restricted to users who can read them in Loomio. The response includes each visible poll's current outcome, so you can use `status=closed` to list decided proposals.
    translation: グループ内で API キーのユーザーに表示できる投票を一覧表示します。公開グループでは、メンバー以外も公開投票を一覧表示できます。非公開の投票は、Loomio で閲覧権限があるユーザーに限られます。レスポンスには表示可能な各投票の現在の結論も含まれます。`status=closed` を使うと、決定済みの提案を一覧表示できます。
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
