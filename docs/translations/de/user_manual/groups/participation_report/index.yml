    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  6772e16cee705fc1:
    english: 'Understand how much participation happens in your group over a given period of time. '
    translation: Sieh dir an, wie viel Beteiligung es in deiner Gruppe innerhalb eines bestimmten Zeitraums gab.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  fe690a715f8a00b5:
    english: The report shows how many threads, comments, polls, votes and reactions have happened per month. This is graphed so you can see ebbs and flows of usage.
    translation: Der Bericht zeigt, wie viele Diskussionen, Kommentare, Umfragen, Stimmen und Reaktionen es pro Monat gab. Im Diagramm erkennst du, wie sich die Nutzung im Laufe der Zeit verändert hat.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  21bf7cb257f4bb03:
    english: Click specific labels on the graph to remove them from view.
    translation: Klicke auf eine Beschriftung im Diagramm, um die zugehörigen Daten auszublenden.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
  35ced3d9d51038aa:
    english: Click specific headings in the table to sort the table by that column.
    translation: Klicke auf eine Spaltenüberschrift, um die Tabelle nach dieser Spalte zu sortieren.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-29'
