  77f49576383e36ca:
    english: Is the problem or opportunity is worth pursuing?  Takashi is experiencing problems with his old computer, and it crashed during a recent presentation.
    translation: Стоит ли заняться этой проблемой или возможностью?  У Такаси возникли проблемы со старым компьютером. Во время недавней презентации компьютер перестал работать.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  997d519afbb87519:
    english: Is there a decision to be made?  It's time to replace the computer.
    translation: Нужно ли принять решение?  Пора заменить компьютер.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fea51a2c49fc3f27:
    english: Does it impact other people and your organization?  Takashi's colleagues want him to perform his role effectively, not waste time in meetings, and so appreciate he needs a working computer.  Purchase of a piece of equipment also impacts on the organization budget, purchasing policies and may need to be aligned with other team members.
    translation: Затронет ли решение других людей и вашу организацию?  Коллегам Такаси важно, чтобы он мог выполнять свою работу и не терял время на совещаниях из-за неисправного компьютера. Покупка оборудования также повлияет на бюджет организации. Нужно учесть правила закупок и, возможно, согласовать покупку с другими участниками команды.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  93da70b78b1d57ff:
    english: "### Step 1. Seek input to sound out perspectives before proposing action"
    translation: "### Шаг 1. Узнайте мнения других людей, прежде чем предложить решение"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  105886bcb6f7807b:
    english: Takashi starts a Loomio discussion with a clear statement of the decision he needs to make.  He provides some context to open a discussion, that he is starting an advice process.
    translation: Такаси начинает обсуждение в Loomio и ясно формулирует, какое решение ему нужно принять. Он описывает ситуацию и сообщает, что начинает процесс консультирования.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5dbbbc9ad1569679:
    english: He can also run an [Advice proposal](/en/user_manual/polls/proposals/advice/) in the discussion to request structured responses by a closing date.
    translation: Он также может создать в обсуждении [предложение для консультации](/en/user_manual/polls/proposals/advice/), чтобы получить ответы в определённом формате до установленной даты.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1c0ef4c1e9221705:
    english: "### Step 2.  Clarify and strengthen the advice through discussion"
    translation: "### Шаг 2. Уточните и дополните советы в обсуждении"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ed50411e67d1df0a:
    english: Takashi replies to advice given in comments in the discussion thread, clarifying his situation and asking questions to expand on the advice given.
    translation: Такаси отвечает на советы в комментариях к обсуждению. Он уточняет свою ситуацию и задаёт вопросы, чтобы лучше понять предложения других людей.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b27279b9ea3b1f0a:
    english: As people offer advice and comments, Takashi grows resolved in his decision.
    translation: По мере поступления советов и комментариев Такаси становится увереннее в своём решении.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f3a820171554b2c9:
    english: "### Step 3. Make a decision with advice and inform people"
    translation: "### Шаг 3. Примите решение с учётом советов и сообщите о нём людям"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8a0d4bfcbc87c5bb:
    english: When everyone has offered advice, or the proposal closes, Takashi makes a decision and states the **[outcome](/en/user_manual/polls/outcomes/)**.
    translation: Когда все желающие поделились советами или срок предложения истёк, Такаси принимает решение и публикует **[результат](/en/user_manual/polls/outcomes/)**.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e638fad69da59644:
    english: The outcome is a clear statement of the decision made and what will happen next. It  becomes an important record for the organization.
    translation: В результате ясно сказано, какое решение принято и что будет дальше. Он сохраняет эту информацию для организации.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  05eae3956cc1a84d:
    english: Takashi edits the discussion context to include this outcome.
    translation: Такаси добавляет результат в контекст обсуждения.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  5289a72f0eed9bd9:
    english: Alternatively, he could state it in a comment that he pins to the thread, so the outcome appears prominently in the discussion timeline.
    translation: Он также мог бы описать результат в комментарии и закрепить его в ветке, чтобы тот был хорошо виден в ленте обсуждения.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
