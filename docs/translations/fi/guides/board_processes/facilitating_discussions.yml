navigation_title: Keskustelujen ohjaaminen
blocks:
  c377321bc013336b:
    english: "# Facilitating discussions"
    translation: "# Keskustelujen ohjaaminen"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b771c6c746b8dc40:
    english: 'At times topics arise that require the attention of board or committee members mid-cycle, between meetings. '
    translation: Joskus hallituksen tai toimikunnan jäsenten huomiota vaativa aihe tulee esiin kokousten välillä.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  b5fc5f12c8e44c40:
    english: And sometimes there is just not space during a meeting for discussion or to sufficiently deliberate on a decision.
    translation: Joskus kokouksessa ei myöskään ole riittävästi aikaa keskustella asiasta tai harkita päätöstä perusteellisesti.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  79f2f83380e195c4:
    english: "## On Loomio"
    translation: "## Loomiossa"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  14d5e62d33996982:
    english: Use a Loomio **thread** to facilitate a discussion.  Give the thread a descriptive title that members will recognize and provide details in the thread context.  Add a relevant category tag to help members find the thread in future.
    translation: Ohjaa keskustelua Loomion **keskusteluketjussa**. Anna ketjulle kuvaava otsikko, jonka jäsenet tunnistavat, ja kerro tarvittavat tiedot ketjun kuvauksessa. Lisää aiheeseen sopiva luokittelutunniste, jotta jäsenet löytävät ketjun myöhemmin.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  8d35b4315f4e42cb:
    english: Notify members of the thread by inviting them, so they will receive a copy of the thread by email.  Members can participate in the discussion by clicking on the link to go to Loomio, or reply to the notification email and their comment will appear as a comment in the thread.
    translation: Kutsu jäsenet ketjuun, jotta he saavat siitä kopion sähköpostitse. Jäsenet voivat osallistua keskusteluun avaamalla Loomion sähköpostissa olevasta linkistä. He voivat myös vastata ilmoitusviestiin, jolloin heidän vastauksensa näkyy kommenttina ketjussa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  f7d839f27c1a6f72:
    english: A Loomio thread enables you to attach files or link to online resources to support the discussion.
    translation: Voit liittää Loomion keskusteluketjuun tiedostoja tai linkkejä verkkoaineistoihin keskustelun tueksi.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  e45d25d90798cf1e:
    english: "Common examples include:\n- review and develop a policy\n- seek advice from the board about a topic or issue\n- discuss strategy \n- explore an idea or opportunity\n- assess risk"
    translation: |-
      Keskusteluketjussa voi esimerkiksi:
      - tarkastella ja kehittää toimintaperiaatetta
      - pyytää hallitukselta neuvoa aiheeseen tai ongelmaan
      - keskustella strategiasta
      - tutkia ideaa tai mahdollisuutta
      - arvioida riskejä
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  86ace2adbcf3df6f:
    english: "## Issues that arise between board meetings"
    translation: "## Kokousten välillä esiin tulevat asiat"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  48f6023950ee0729:
    english: 'A lot can happen in an organization between meetings, and most people rely on email to alert board members.  Trying to keep track of a discussion on email is tricky, with replies often lost in in-boxes and people left out.  '
    translation: 'Organisaatiossa voi tapahtua paljon kokousten välillä, ja hallituksen jäsenille ilmoitetaan asioista usein sähköpostitse. Sähköpostikeskustelua on vaikea seurata: vastauksia voi hukkua postilaatikoihin ja osa ihmisistä voi jäädä keskustelun ulkopuolelle.'
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  1cb0e78c848b9621:
    english: "*“You can’t do governance by email!”, Richard Westlake (Westlake Governance).*"
    translation: "*”Hallintoa ei voi hoitaa sähköpostitse”, Richard Westlake (Westlake Governance).*"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  eddf348746c93b4c:
    english: 'When an issue arises requiring board attention, use a Loomio thread rather than email.  Members can reply via email and their comment will appear in the Loomio thread, keeping the discussion in one place. '
    translation: Kun hallituksen huomiota vaativa asia tulee esiin, aloita Loomiossa keskusteluketju sähköpostikeskustelun sijaan. Jäsenet voivat vastata sähköpostitse, ja heidän kommenttinsa näkyvät Loomion ketjussa. Näin keskustelu pysyy yhdessä paikassa.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  2f7ad89003f79fb8:
    english: |-
      Here's how:
      - Make the email subject line the title of your thread,
      - write your email content in the thread context,
      - invite your team to the thread with their email address or Loomio user name.
    translation: |-
      Toimi näin:
      - Käytä sähköpostin aihetta ketjun otsikkona,
      - kirjoita sähköpostiviestin sisältö ketjun kuvaukseen,
      - kutsu muut ketjuun heidän sähköpostiosoitteellaan tai Loomion käyttäjänimellään.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  9825cbb88dcedc3d:
    english: |-
      A Loomio thread means that:
      - All info about a topic is organized in one easily accessible place,
      - people can respond without generating reply/reply-all email chains that risk leaving people out,
      - you can see who has read the message and who needs a nudge,
      - you can progress actual work to an outcome, and cut down on the amount of email.
    translation: |-
      Loomion keskusteluketjussa:
      - kaikki aiheeseen liittyvät tiedot ovat yhdessä paikassa ja helposti saatavilla,
      - ihmiset voivat vastata ilman vastaus- ja vastaa kaikille -sähköpostiketjuja, joissa joku voi jäädä keskustelun ulkopuolelle,
      - näet, ketkä ovat lukeneet viestin ja ketä kannattaa muistuttaa,
      - voitte viedä asian johtopäätökseen ja vähentää sähköpostin määrää.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  fb9adc7cb7922016:
    english: "## When there isn't space during meetings"
    translation: "## Kun kokouksessa ei ole riittävästi aikaa"
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  6b1c61424aa7e74b:
    english: When an agenda item cannot be resolved within the time available in your board meeting, you can move this for further discussion to Loomio. Direct people to the relevant thread, or start a new one and notify your board members.
    translation: Jos esityslistan kohtaa ei ehditä käsitellä loppuun hallituksen kokouksessa, jatka keskustelua Loomiossa. Ohjaa osallistujat sopivaan keskusteluketjuun tai aloita uusi ketju ja ilmoita siitä hallituksen jäsenille.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  ced9caddb281230f:
    english: This relieves pressure on your board, allows more time for information gathering, discussion and deeper reflection which often results in a better quality decision.
    translation: Tämä vähentää hallituksen aikapainetta ja antaa enemmän aikaa tiedonkeruulle, keskustelulle ja perusteelliselle harkinnalle. Näin päätöksen laatu voi parantua.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
