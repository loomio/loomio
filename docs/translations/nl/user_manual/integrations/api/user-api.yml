      | `section` | Report section: `base`, `users`, or `countries`. Use `users` for per-person activity |
      | `group_scope` | `custom` or `my`. The legacy `all` value is treated as `my` because User API keys never receive instance-wide access |
      | `group_ids` | Comma-separated group IDs when `group_scope=custom`. IDs outside the API user's memberships are ignored |
      | `start_month` | First month to include in `YYYY-MM` format; defaults to 12 months ago |
      | `end_month` | Last month to include in `YYYY-MM` format; defaults to the current month |
      | `interval` | Interval for the `base` section: `day`, `week`, `month`, or `year` |
      | `member_type` | Set to `delegate` with `section=users` to return only current delegates |
    translation: |-
      | Naam | Beschrijving |
      | --- | --- |
      | `section` | Onderdeel van het verslag: `base`, `users` of `countries`. Gebruik `users` voor activiteit per persoon |
      | `group_scope` | `custom` of `my`. De verouderde waarde `all` wordt behandeld als `my`, omdat sleutels voor de gebruikers-API nooit toegang tot de hele instantie geven |
      | `group_ids` | Groeps-ID's, gescheiden door komma's, wanneer `group_scope=custom`. ID's van groepen waarvan de API-gebruiker geen lid is, worden genegeerd |
      | `start_month` | Eerste maand in de notatie `YYYY-MM`; standaard 12 maanden geleden |
      | `end_month` | Laatste maand in de notatie `YYYY-MM`; standaard de huidige maand |
      | `interval` | Interval voor het onderdeel `base`: `day`, `week`, `month` of `year` |
      | `member_type` | Stel in op `delegate` met `section=users` om alleen huidige afgevaardigden terug te krijgen |
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  '09b3d2247802eae7':
    english: A person is a delegate when they have an active delegate membership in any selected group. Their counts are aggregated across all selected groups. Delegate rows are returned even when every activity count is zero. Counts cover threads, comments, polls, votes, outcomes, and reactions; they are not voting participation rates. User rows also include identified ballots issued, cast, and missed. Anonymous polls are excluded from all per-person voting counts. `all_votes_cast` is true only when at least one ballot was issued and every issued ballot was cast.
    translation: Iemand is een afgevaardigde als die persoon in een van de geselecteerde groepen een actief lidmaatschap als afgevaardigde heeft. De aantallen worden over alle geselecteerde groepen samengevoegd. Afgevaardigden worden ook getoond als alle activiteitsaantallen nul zijn. De aantallen omvatten discussies, reacties, peilingen, stemmen, conclusies en emoji-reacties. Het zijn geen percentages voor deelname aan stemmingen. De rijen per gebruiker bevatten ook aantallen toegewezen, uitgebrachte en gemiste stemmen bij niet-anonieme stemmingen. Anonieme peilingen tellen niet mee in de stemtotalen per persoon. `all_votes_cast` is alleen waar als minstens één stem is toegewezen en alle toegewezen stemmen zijn uitgebracht.
    status: machine
    provider: codex/gpt-6-sol
    translated_on: '2026-09-30'
  be9b5cd02a9b5930:
    english: The API applies the same group visibility rules as the in-product report. A user API key cannot expose report data from groups that user cannot access.
    translation: De API past dezelfde regels voor groepszichtbaarheid toe als het verslag in Loomio. Een sleutel voor de gebruikers-API kan geen verslaggegevens tonen van groepen waartoe de gebruiker geen toegang heeft.
