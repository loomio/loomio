  1ed397ff049f2888:
    english: "> Singling people out for a contribution will just make them feel like the stupid kid in class who doesn’t know the answer. Instead, a general invite to people who haven’t spoken yet to contribute tells the regular contributors to stay quiet, and gives quieter people the opportunity to step forward. — Silvia Zuur"
    translation: "> Pedir directamente a una persona que contribuya puede hacer que se sienta como quien no sabe la respuesta en clase. En cambio, una invitación general a participar dirigida a quienes aún no han hablado indica a quienes suelen intervenir que dejen espacio y da a las personas más calladas la oportunidad de hacerlo. — Silvia Zuur"
